<svg xmlns="http://www.w3.org/2000/svg" width="502" height="335.52" viewBox="0 0 502 335.52" role="img" aria-label="How to write ೬: one unbroken stroke · 3 movements"><title>Writing ೬</title><desc>3 frames; frame N shows movements 1 to N of ೬ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೬, trace image file-7nlw0r9i.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೬ as one path that starts at the top left, comes down into the inner bowl, circles it anticlockwise, then sweeps down the outer left side and right along the base to finish at the lower right (start upper left, end lower right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="502" height="335.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="217.02" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.02" viewBox="-8 -772 735 1063.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M495 367Q495 330 479 298.5Q463 267 427.5 248Q392 229 335 229Q291 229 260.5 242.5Q230 256 211.5 277.5Q193 299 185 324Q177 349 177 373Q177 390 179 404.5Q181 419 183 431Q188 466 199.5 501.5Q211 537 211 572Q211 596 199.5 608.5Q188 621 167 621Q154 621 138.5 618.5Q123 616 107 611L89 685Q112 693 136 697.5Q160 702 186 702Q226 702 250 688Q274 674 285 650.5Q296 627 296 599Q296 569 287.5 534.5Q279 500 269 467Q262 445 258 427.5Q254 410 254 390Q254 355 271 330Q288 305 337 305Q376 305 392.5 323Q409 341 409 364Q409 388 389.5 407Q370 426 318 426Q293 426 269 419.5Q245 413 228 403L200 390Q174 368 160 333.5Q146 299 146 255Q146 215 158 183.5Q170 152 193 129Q211 113 235 102.5Q259 92 297 87Q335 82 395 82L657 82L657 0L399 0Q324 0 273.5 7.5Q223 15 189.5 31.5Q156 48 129 73Q96 105 79 150Q62 195 62 250Q62 333 105 392Q148 451 215 479Q241 490 271 496.5Q301 503 326 503Q391 503 427.5 482.5Q464 462 479.5 431Q495 400 495 367Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M100 672 L100 672" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M100 672 L135 663 L171 656 L207 646 L233 624 L245 591 L246 552 L242 513 L234 474 L220 439 L201 406" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="201" cy="406" r="34" fill="#3b5bdb"/></g><text class="ductus__cap