<svg xmlns="http://www.w3.org/2000/svg" width="662" height="346.38" viewBox="0 0 662 346.38" role="img" aria-label="How to write ઇ: one unbroken stroke · 4 movements"><title>Writing ઇ</title><desc>4 frames; frame N shows movements 1 to N of ઇ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ઇ animation, first SVG path &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ઇ as one continuous pen-down run in its first SVG path; its remaining path slots are empty. The run begins at the upper-left, sweeps left and down through the small upper loop, returns through the narrow middle crossing, circles the broad lower body, then rises along the right side into the long upper-right hook without lifting. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the small upper-left loop, narrow middle crossing, broad lower loop, and rising upper-right hook, but its printed lower body is wider and its hook more upright than the animated school-hand form. This learner path preserves the source&apos;s upper-loop-to-lower-loop-to-hook order and zero-lift evidence while fitting the motion to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loops and hook differently.</desc><rect x="0" y="0" width="662" height="346.38" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="252.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="252.88" viewBox="-26 -798 686 1156.5" preserveAsp