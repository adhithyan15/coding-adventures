<svg xmlns="http://www.w3.org/2000/svg" width="342" height="457.78" viewBox="0 0 342 457.78" role="img" aria-label="How to write ل: one unbroken stroke · 2 movements"><title>Writing ل</title><desc>2 frames; frame N shows movements 1 to N of ل (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ل demonstration at 02:29–02:32 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The source shows isolated ل as one continuous Naskh stroke: the upright descends into the base curve with no pen lift. This path fits the vendored Noto Naskh outline.</desc><rect x="0" y="0" width="342" height="457.78" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="314.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="314.28" viewBox="-2 -741 605 1267.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q299 -179 350 -162.5Q401 -146 440 -117Q460 -103 474 -87Q488 -71 496 -54L470 107Q462 158 452.5 216.5Q443 275 434 333Q425 391 417.5 443Q410 495 405.5 534Q401 573 401 593Q401 627 416.5 645.5Q432 664 466 671Q473 649 483 615Q493 581 502 552L479 532L513 220Q519 170 523.5 127Q528 84 530.5 48.5Q533 13 533 -17Q533 -78 494.5 -134.5Q456 -191 388 -226Q354 -244 319.5 -253Q285 -262 249 -262Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M458 640 L458 640" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M458 640 L445 500 L440 420 L450 240 L475 80 L510 -20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="510" cy="-20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="300.5" y="450.5" text-anchor="middle" font-size="48.5" fill="#6b7280"><tspan x="300.5" y="450.5">1. draw the upright</tspan><tspan x="300.5" y="509.7">downward</tspan></text></svg><rect x="176" y="42" width="150" height="314.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="314.28" viewBox="-2 -741 605 1267.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q299 -179 350 -162.5Q401 -146 440 -117Q460 -103 474 -87Q488 -71 496 -54L470 107Q462 158 452.5 216.5Q443 275 434 333Q425 391 417.5 443Q410 495 405.5 534Q401 573 401 593Q401 627 416.5 645.5Q432 664 466 671Q473 649 483 615Q493 581 502 552L479 532L513 220Q519 170 523.5 127Q528 84 530.5 48.5Q533 13 533 -17Q533 -78 494.5 -134.5Q456 -191 388 -226Q354 -244 319.5 -253Q285 -262 249 -262Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M458 640 L445 500 L440 420 L450 240 L475 80 L510 -20 L510 -20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M510 -20 L465 -120 L350 -205 L205 -215 L105 -135 L90 -75 L100 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="300.5" y="450.5" text-anchor="middle" font-size="48.5" fill="#6b7280"><tspan x="300.5" y="450.5">2. turn into the base</tspan><tspan x="300.5" y="509.7">curve without lifting</tspan></text></svg><text x="16" y="369.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="381.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, ل demonstration at 02:29–02:32 (Liberal Arts</text><text x="16" y="394.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Instructional Technology Services, Univ. of Texas at</text><text x="16" y="406.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="419.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="431.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
