 stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M176 413 L735 405 L740 250 L795 30 L840 -25 L890 -38 L925 4 L935 84" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="935" cy="84" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495.5" y="305.1" text-anchor="middle" font-size="86.1" fill="#6b7280"><tspan x="495.5" y="305.1">4. lift, then draw the</tspan><tspan x="495.5" y="410.1">last stroke across,</tspan><tspan x="495.5" y="515.2">down, out to the right</tspan><tspan x="495.5" y="620.2">and hook up</tspan></text></svg><text x="16" y="273.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 气.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="285.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="298.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
