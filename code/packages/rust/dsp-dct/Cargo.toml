[package]
name = "dsp-dct"
version = "0.1.0"
edition = "2021"
description = "DSP02 Phase 1+2: scalar reference DCT-II / DCT-III for the DSP layer. DCT-II uses the Makhoul reduction (pre-shuffle + length-N FFT + twiddle + real-part) via dsp-fft; DCT-III is the naive O(N²) inverse for Phase 2 and will be FFT-lowered in Phase 3. Both `None` and `Ortho` normalization conventions, matching scipy.fft.dct. f32, 1-D, any N ≥ 1."
license = "MIT"

[dependencies]
dsp-fft     = { path = "../dsp-fft" }
dsp-complex = { path = "../dsp-complex" }

[dev-dependencies]
