 714Q176 726 197 726Q217 726 231 714Q245 702 245 674Q245 648 231 635Q217 622 197 622ZM379 622Q360 622 346 635Q332 648 332 674Q332 702 346 714Q360 726 379 726Q399 726 413.5 714Q428 702 428 674Q428 648 413.5 635Q399 622 379 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M430 380 L390 455 L320 505 L245 505 L175 470 L115 410 L85 340 L85 285 L150 285 L240 285 L330 285 L440 285 L330 285 L240 285 L150 285 L85 260 L80 185 L105 115 L160 55 L230 25 L305 25 L375 40 L440 70" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M197 674 L203 674" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M379 674 L379 674" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M379 674 L385 674" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="385" cy="674" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="277" y="197.9" text-anchor="middle" font-size="47.9" fill="#6b7280"><tspan x="277" y="197.9">4. lift again and place</tspan><tspan x="277" y="256.3">the right dot</tspan></text></svg><text x="16" y="337.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ё demonstration,</text><text x="16" y="350.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">02:51–02:56, YouTube, 5 February 2013</text><text x="16" y="362.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
