<svg xmlns="http://www.w3.org/2000/svg" width="502" height="335.88" viewBox="0 0 502 335.88" role="img" aria-label="How to write ृ: one unbroken stroke · 3 movements"><title>Writing ृ</title><desc>3 frames; frame N shows movements 1 to N of ृ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 52 (ृ, vocalic r sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 81 of the 83 stored prototypes of the vocalic r sign (98%) are one pen-down stroke. In 77 of the 83 the pen starts in the top third, in 78 it first moves to the left, 80 turn anticlockwise, and 69 end lower and to the right of where they began: the pen curls left from the top, rounds the bottom and runs out to the right. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant or the headline; the book draws the sign alone and composes no Devanagari word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Devanagari outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="335.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="217.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.38" viewBox="-336 -88 433 627.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M27 -231Q2 -248 -32.5 -258Q-67 -268 -105 -268Q-178 -268 -222 -230Q-266 -192 -266 -125Q-266 -63 -221.5 -25Q-177 13 -89 18L-82 -48Q-139 -55 -165.5 -74.5Q-192 -94 -192 -129Q-192 -166 -168.5 -181.5Q-145 -197 -108 -197Q-79 -197 -54 -189Q-29 -181 0 -165L27 -231Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-105 -35 L-105 -35" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-105 -35 L-160 -45 L-215 -70 L-250 -120" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-250" cy="-120" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-119.5" y="442.7" text-anchor="middle" font-size="34.7" fill="#6b7280"><tspan x="-119.5" y="442.7">1. start at the upper</tspan><tspan x="-119.5" y="485">tip and curve to the</tspan><tspan x="-119.5" y="527.4">left</tspan></text></svg><rect x="176" y="42" width="150" height="217.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="217.38" viewBox="-336 -88 433 627.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M27 -231Q2 -248 -32.5 -258Q-67 -268 -105 -268Q-178 -268 -222 -230Q-266 -192 -266 -125Q-266 -63 -221.5 -25Q-177 13 -89 18L-82 -48Q-139 -55 -165.5 -74.5Q-192 -94 -192 -129Q-192 -166 -168.5 -181.5Q-145 -197 -108 -197Q-79 -197 -54 -189Q-29 -181 0 -165L27 -231Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-105 -35 L-160 -45 L-215 -70 L-250 -120 L-250 -120" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-250 -120 L-245 -180 L-205 -228 L-140 -240" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-140" cy="-240" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-119.5" y="442.7" text-anchor="middle" font-size="34.7" fill="#6b7280"><tspan x="-119.5" y="442.7">2. round down and along</tspan><tspan x="-119.5" y="485">the bottom</tspan></text></svg><rect x="336" y="42" width="150" height="217.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="217.38" viewBox="-336 -88 433 627.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M27 -231Q2 -248 -32.5 -258Q-67 -268 -105 -268Q-178 -268 -222 -230Q-266 -192 -266 -125Q-266 -63 -221.5 -25Q-177 13 -89 18L-82 -48Q-139 -55 -165.5 -74.5Q-192 -94 -192 -129Q-192 -166 -168.5 -181.5Q-145 -197 -108 -197Q-79 -197 -54 -189Q-29 -181 0 -165L27 -231Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-105 -35 L-160 -45 L-215 -70 L-250 -120 L-245 -180 L-205 -228 L-140 -240 L-140 -240" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-140 -240 L-80 -230 L-30 -210 L10 -188" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="10" cy="-188" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-119.5" y="442.7" text-anchor="middle" font-size="34.7" fill="#6b7280"><tspan x="-119.5" y="442.7">3. run out to the</tspan><tspan x="-119.5" y="485">lower-right tip</tspan></text></svg><text x="16" y="272.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="284.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Devanagari recognizer, class 52 (ृ, vocalic r sign): stored online-handwriting prototypes</text><text x="16" y="297.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">from native writers (MIT licence, 2012)</text><text x="16" y="309.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
