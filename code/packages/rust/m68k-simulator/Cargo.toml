[package]
name = "m68k-simulator"
version = "0.1.0"
edition = "2021"
description = "Complete Motorola 68000 functional simulator with all Spec 07n addressing and instruction families, exact 16 MiB checked state, typed atomic lifecycle, traces, and Python full-state differentials."

[dependencies]
cpu-simulator = { path = "../cpu-simulator" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
