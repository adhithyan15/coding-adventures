<svg xmlns="http://www.w3.org/2000/svg" width="342" height="397.23" viewBox="0 0 342 397.23" role="img" aria-label="How to write గ: 2 strokes · 1 pen lift · 2 movements"><title>Writing గ</title><desc>2 frames; frame N shows movements 1 to N of గ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant గ packaged tracing guide res/drawable/dot_stroke_c_1_3_ga.png, movements 1–2 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide separates the broad lower arch (movement 1) from the upper flourish (movement 2). Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="342" height="397.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="234.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="234.98" viewBox="-30 -795 693 1085.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M294 500Q372 500 428 470.5Q484 441 513.5 386.5Q543 332 543 255Q543 192 531 144Q519 96 501.5 59Q484 22 465 -8L382 29Q401 57 419 87Q437 117 448.5 155.5Q460 194 460 245Q460 294 444 335Q428 376 390.5 400.5Q353 425 289 425Q238 425 201 404Q164 383 143.5 343Q123 303 123 246Q123 178 145 126.5Q167 75 201 29L118 -8Q84 44 62 108Q40 172 40 245Q40 314 68.5 372Q97 430 153.5 465Q210 500 294 500ZM264 425Q235 425 208.5 436Q182 447 160 477.5Q138 508 122 564L205 591Q220 536 234 518Q248 500 270 500Q290 500 307.5 512.5Q325 525 357 565L388 605Q422 649 450.5 675Q479 701 511 713Q543 725 587 725L593 648Q558 646 534.5 637Q511 628 491.5 608.5Q472 589 446 556L423 526Q395 490 370 468Q345 446 319.5 435.5Q294 425 264 425Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 12 L120 12" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 12 L88 70 L68 145 L80 230 L105 320 L155 405 L220 455 L295 465 L370 445 L430 398 L472 330 L500 250 L493 170 L470 95 L430 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="316.5" y="203.5" text-anchor="middle" font-size="55.5" fill="#6b7280"><tspan x="316.5" y="203.5">1. sweep up and over the</tspan><tspan x="316.5" y="271.2">broad lower arch</tspan></text></svg><rect x="176" y="60.75" width="150" height="234.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="234.98" viewBox="-30 -795 693 1085.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M294 500Q372 500 428 470.5Q484 441 513.5 386.5Q543 332 543 255Q543 192 531 144Q519 96 501.5 59Q484 22 465 -8L382 29Q401 57 419 87Q437 117 448.5 155.5Q460 194 460 245Q460 294 444 335Q428 376 390.5 400.5Q353 425 289 425Q238 425 201 404Q164 383 143.5 343Q123 303 123 246Q123 178 145 126.5Q167 75 201 29L118 -8Q84 44 62 108Q40 172 40 245Q40 314 68.5 372Q97 430 153.5 465Q210 500 294 500ZM264 425Q235 425 208.5 436Q182 447 160 477.5Q138 508 122 564L205 591Q220 536 234 518Q248 500 270 500Q290 500 307.5 512.5Q325 525 357 565L388 605Q422 649 450.5 675Q479 701 511 713Q543 725 587 725L593 648Q558 646 534.5 637Q511 628 491.5 608.5Q472 589 446 556L423 526Q395 490 370 468Q345 446 319.5 435.5Q294 425 264 425Z" fill="#e0ddd6