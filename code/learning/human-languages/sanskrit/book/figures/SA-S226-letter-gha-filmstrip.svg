<svg xmlns="http://www.w3.org/2000/svg" width="662" height="291.9" viewBox="0 0 662 291.9" role="img" aria-label="How to write घ: 2 strokes · 1 pen lift · 4 movements"><title>Writing घ</title><desc>4 frames; frame N shows movements 1 to N of घ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-घ-order.gif’, strokes 1–3, Wikimedia Commons, 9 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%98-order.gif&gt;. Source note on variation: The 22-frame animation shows three ordered pen-down runs over its gray guide: frames 3–14 start below the headline at the upper-left, curve clockwise around the upper curl, turn back left through the middle hook, continue clockwise around the lower bowl, and rise along the right side to the headline without lifting; frames 15–16 restart at the lower right-side junction and descend the short stem below the bowl; frames 17–21 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 210 ms hold at frame 14 and 260 ms hold at frame 16 mark the first two run endings before the one-second completed frame 21; frame 6&apos;s 200 ms pause occurs within the continuous body and does not add a lift. These runs stage the letter one part at a time; they are not a count of native pen lifts. The lift count follows HP Labs India&apos;s isolated handwritten Devanagari character data (hpl-dvng-iso-char, https://lipitk.sourceforge.net/datasets/dvngchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Devanagari recognizer. Those counts say how many strokes writers use, not where they break, so this learner path keeps every run&apos;s order, start and direction as a segment and joins the first two in one run, coming back down the right side into the short stem, so the pen lifts only before the headline. Its curves are fitted to Noto Sans Devanagari.</desc><rect x="0" y="0" width="662" height="291.9" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="198.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.4" viewBox="-70 -692 745 985.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M605 551L502 551L502 0L421 0L421 183L441 167Q412 142 368 127Q324 112 270 112Q211 112 166 131.5Q121 151 95.5 187Q70 223 70 270Q70 303 85.5 336Q101 369 141 389L158 403Q178 411 207.5 415.5Q237 420 262 420Q276 420 289 419.5Q302 419 313 417L307 346Q295 348 285.5 348Q276 348 265 348Q208 348 179.5 326.5Q151 305 151 266Q151 224 183.5 203.5Q216 183 270 183Q319 183 363 205Q407 227 432 261L421 221L421 551L0 551L0 622L605 622L605 551ZM183 352Q144 362 114 380.5Q84 399 67 425.5Q50 452 50 485Q50 520 65.5 544Q81 568 110 590L173 560Q152 547 141.5 528Q131 509 131 485Q131 451 155 430Q179 409 213 404L183 352Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M115 525 L115 525" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M115 525 L90 515 L82 485 L90 450 L115 420 L155 395 L205 375 L260 365 L285 360 L255 350 L215 345 L170 342 L135 325 L115 295 L110 260 L120 225 L145 195 L185 170 L235 155 L290 150 L345 155 L395 165 L430 185 L450 225 L468 290 L470 360 L470 430 L470 500 L470 551" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="470" cy="551" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="302.5" y="199.7" text-anchor="middle" font-size="59.7" fill="#6b7280"><tspan x="302.5" y="199.7">1. sweep the curls and</tspan><tspan x="302.5" y="272.5">bowl, up the right side</tspan></text></svg>