[package]
name = "dsp-wavelets"
version = "0.5.0"
edition = "2021"
description = "DSP06 Phases 1-5: scalar reference Haar + Daubechies (Db2/4/6/8) + Symlets (Sym4) + Coiflets (Coif1) discrete wavelet transforms (DWT), both 1-D and 2-D, continuous wavelet transform (CWT with Morlet and MexicanHat), with Zero/Replicate/Reflect/Symmetric/Periodic boundaries. Hardened against CWE-400, CWE-190, CWE-674, CWE-20."
license = "MIT"

