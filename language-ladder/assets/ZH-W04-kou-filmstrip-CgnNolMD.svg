<svg xmlns="http://www.w3.org/2000/svg" width="662" height="320.08" viewBox="0 0 662 320.08" role="img" aria-label="How to write 口: 3 strokes · 2 pen lifts · 4 movements"><title>Writing 口</title><desc>4 frames; frame N shows movements 1 to N of 口 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 口.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%A3.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 口. Median 1 starts at the upper left and descends the left side; median 2 restarts near the upper left, crosses the top from left to right, turns without lifting, then descends the right side; median 3 restarts at the lower left and closes the bottom from left to right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their directions, the joined corner, and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="320.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="214.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.08" viewBox="57 -805 890 1270.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 700 L166 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 700 L166 620 L166 530 L166 440 L166 350 L166 260 L166 170 L166 80 L166 -35" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="166" cy="-35" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">1. draw the left</tspan><tspan x="502" y="353.3">vertical shù stroke from</tspan><tspan x="502" y="440.3">top to bottom</tspan></text></svg><rect x="176" y="42" width="150" height="214.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="214.08" viewBox="57 -805 890 1270.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 700 L166 620 L166 530 L166 440 L166 350 L166 260 L166 170 L166 80 L166 -35" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M166 700 L166 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 700 L260 700 L360 700 L470 700 L580 700 L690 700 L785 700 L835 700" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="835" cy="700" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">2. lift, then draw the</tspan><tspan x="502" y="353.3">top bar from left to</tspan><tspan x="502" y="440.3">right</tspan></text></svg><rect x="336" y="42" width="150" height="214.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="214.08" viewBox="57 -805 890 1270.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 700 L166 620 L166 530 L166 440 L166 350 L166 260 L166 170 L166 80 L166 -35" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M166 700 L260 700 L360 700 L470 700 L580 700 L690 700 L785 700 L835 700 L835 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M835 700 L835 610 L835 520 L835 430 L835 340 L835 250 L835 160 L835 70 L835 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="835" cy="-30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">3. turn the corner</tspan><tspan x="502" y="353.3">without lifting and</tspan><tspan x="502" y="440.3">descend the right side</tspan></text></svg><rect x="496" y="42" width="150" height="214.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="214.08" viewBox="57 -805 890 1270.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 700 L166 620 L166 530 L166 440 L166 350 L166 260 L166 170 L166 80 L166 -35" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M166 700 L260 700 L360 700 L470 700 L580 700 L690 700 L785 700 L835 700 L835 610 L835 520 L835 430 L835 340 L835 250 L835 160 L835 70 L835 -30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M166 70 L166 70" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 70 L260 70 L360 70 L470 70 L580 70 L690 70 L785 70 L835 70" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="835" cy="70" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">4. lift, then close the</tspan><tspan x="502" y="353.3">bottom from left to</tspan><tspan x="502" y="440.3">right</tspan></text></svg><text x="16" y="269.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 口.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="281.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="294.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
