<svg xmlns="http://www.w3.org/2000/svg" width="982" height="301.66" viewBox="0 0 982 301.66" role="img" aria-label="How to write 年: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 年</title><desc>6 frames; frame N shows movements 1 to N of 年 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 年.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B9%B4.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 年. Median 1 draws a short left-falling stroke; medians 2–3 draw the upper and middle horizontals; median 4 draws the short vertical on the left down from the middle horizontal; median 5 draws the long horizontal; median 6 draws the long vertical last, from above the top horizontal through all three. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="301.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="208.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.16" viewBox="-22 -914 1046 1451.6" preserveAspectRatio="xMidYMid meet" overf