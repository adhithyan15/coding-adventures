[package]
name = "vos-link"
version = "0.1.0"
edition = "2021"
description = "Host tool of the verified-OS program (VOS-033, VOS-039a, VOS02): gen-doc assembles and check-doc verifies code/specs/<impl>.warrant; check-component judges a component crate (VOS04 5.6)"
# An evidence-only host tool, not a published package (VOS-D104, checked by `vos-link check-publish`).
publish = false

[lib]
name = "vos_link"
path = "src/lib.rs"

[[bin]]
name = "vos-link"
path = "src/main.rs"

# A standalone cargo root (like the other programs under code/programs/rust): the
# packages it uses are path dependencies.
[workspace]

[dependencies]
# The pure parsers and document assembly.
vos-manifest = { path = "../../../packages/rust/vos-manifest" }
# `vos.toml` has one reader, the shape checker's (its authority list of keys grew by
# `contract` and `obligations` for this tool).  Backlog VOS-D059 moves it into
# vos-manifest when check-profile lands.
vos-shape-check = { path = "../../../packages/rust/vos-shape-check" }
# `check-component` (VOS-039a) reads the evidence manifest with the repository's bounded JSON reader.
# The evidence generator's own bindings reader: `gen-build` and `check-component` read `evidence.bindings` with it.
coding_adventures_warrant_grammar = { path = "../../../packages/rust/warrant-grammar" }
# `check-component` binds the evidence manifest to the document and to `src/` with the harness's own digests.
coding_adventures_sha256 = { path = "../../../packages/rust/sha256" }
coding_adventures_test_bootstrap = { path = "../../../packages/rust/test-bootstrap" }
coding_adventures_bounded_json = { path = "../../../packages/rust/bounded-json" }

# A test-only edge (VOS-D058): the tests read the real contract package's files
# (`include_bytes!` / copies), and the build tool selects a package's tests by its Cargo
# dependency edges, so an edit to a `.part` or `contract.vos` must select them.
[dev-dependencies]
vos-sched-contract = { path = "../../../packages/rust/vos-sched-contract" }

[[test]]
name = "gen_and_check"
path = "tests/gen_and_check.rs"

[[test]]
name = "negative_controls"
path = "tests/negative_controls.rs"

[[test]]
name = "paths_and_io"
path = "tests/paths_and_io.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "representation"
path = "tests/representation.rs"

[[test]]
name = "component"
path = "tests/component.rs"

[[test]]
name = "contract"
path = "tests/contract.rs"

[[test]]
name = "bounds"
path = "tests/bounds.rs"

[[test]]
name = "publish"
path = "tests/publish.rs"

[[test]]
name = "sat_lane"
path = "tests/sat_lane.rs"
