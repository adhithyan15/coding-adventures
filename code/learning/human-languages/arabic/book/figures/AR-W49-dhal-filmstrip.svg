<svg xmlns="http://www.w3.org/2000/svg" width="502" height="446.62" viewBox="0 0 502 446.62" role="img" aria-label="How to write ذ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ذ</title><desc>3 frames; frame N shows movements 1 to N of ذ (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: د ذ ر, independent Dhaal body followed by its upper dot (University of Oregon Libraries Open Textbook, 2023; accessed 2026-08-21) &lt;https://opentext.uoregon.edu/introarabic/chapter/chapter-1/&gt;. Source note on variation: The page&apos;s directly linked dhaal.mp4 demonstrates independent ذ body-first. It begins at the upper tip, descends diagonally down and right through the curved shoulder, and turns left along the baseline without lifting; after that body is complete, the pen lifts once and places the single dot above. The adjacent lesson identifies dhaal as a one-way connector, contrasts its voiced th sound in this with the unvoiced sound in throw, gives the transliteration dh, and separately prints its independent and final forms. This two-stroke, one-lift learner path fits the course&apos;s vendored Noto Naskh outline. Although ذ shares its body with د, its order is recorded from its own video rather than inferred from Daal.</desc><rect x="0" y="0" width="502" height="446.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="328.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="328.12" viewBox="-36 -667 478 1045.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0ZM218 459Q174 492 146 524Q172 550 189 568Q206 586 216 597Q232 580 248.5 563.5Q265 547 282 532Q271 516 254.5 497.5Q238 479 218 459Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L270 350" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="342" cy="100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">1. begin at the upper</tspan><tspan x="203" y="225">tip and descend</tspan><tspan x="203" y="271.8">diagonally down and</tspan><tspan x="203" y="318.5">right through the curved</tspan><tspan x="203" y="365.2">shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="328.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="328.12" viewBox="-36 -667 478 1045.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0ZM218 459Q174 492 146 524Q172 550 189 568Q206 586 216 597Q232 580 248.5 563.5Q265 547 282 532Q271 516 254.5 497.5Q238 479 218 459Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100 L342 100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M342 100 L320 90 L290 75 L250 60 L210 50 L170 40 L130 40 L90 50 L60 65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="60" cy="65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">2. turn left along the</tspan><tspan x="203" y="225">baseline without lifting</tspan></text></svg><rect x="336" y="42" width="150" height="328.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="328.12" viewBox="-36 -667 478 1045.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0ZM218 459Q174 492 146 524Q172 550 189 568Q206 586 216 597Q232 580 248.5 563.5Q265 547 282 532Q271 516 254.5 497.5Q238 479 218 459Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100 L320 90 L290 75 L250 60 L210 50 L170 40 L130 40 L90 50 L60 65" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M218 490 L218 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M218 490 L180 525 L216 575 L265 532 L218 490" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="218" cy="490" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">3. lift once, then place</tspan><tspan x="203" y="225">the dot above</tspan></text></svg><text x="16" y="383.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students,</text><text x="16" y="395.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Alphabet: د ذ ر, independent Dhaal body followed by its upper dot (University of Oregon</text><text x="16" y="408.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Libraries Open Textbook, 2023; accessed 2026-08-21)</text><text x="16" y="420.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
