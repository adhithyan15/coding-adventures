<svg xmlns="http://www.w3.org/2000/svg" width="662" height="366.86" viewBox="0 0 662 366.86" role="img" aria-label="How to write گ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing گ</title><desc>4 frames; frame N shows movements 1 to N of گ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Pe, gāf, alif, and lām, independent گ calligraphic and handwriting animations and Gāf instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/pe-gaf-alif-lam/&gt;. Source note on variation: The independent-form animations write the kāf-family main-line body first, add the long downward slash after one lift, then add the shorter floating slash above after another lift: three runs separated by two pen lifts. The adjacent prose defines gāf as kāf with a second floating slash, often shorter than the first. This learner path covers the independent form and fits the body-first, three-run order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="662" height="366.86" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="260.86" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="260.86" viewBox="-2 -822 776 1349.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M308 0Q221 0 167.5 17Q114 34 89 68Q68 98 68 141Q68 152 69.5 162.5Q71 173 74 184Q77 195 81 205L117 205Q115 196 114 185.5Q113 175 113 164Q113 141 124.5 124Q136 107 159 97Q182 87 221.5 81.5Q261 76 