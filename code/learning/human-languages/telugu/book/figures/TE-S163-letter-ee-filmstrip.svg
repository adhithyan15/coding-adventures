<svg xmlns="http://www.w3.org/2000/svg" width="662" height="362.61" viewBox="0 0 662 362.61" role="img" aria-label="How to write ఏ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ఏ</title><desc>4 frames; frame N shows movements 1 to N of ఏ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఏ packaged tracing guide res/drawable/dot_stroke_v_10_ae.png, movements 1–4 (version 2.6); the outer arch drawn upward in the body&apos;s stroke after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 9 (ఏ): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers four directional movements in three runs: movements 1–2 join around the compact lower loop, movement 3 restarts at the tail and forms the broad outer arch, and movement 4 separately forms the tall upper-left hook. This ductus used to draw movement 3 from the arch&apos;s upper end down to the junction, after a lift. In HP Labs India&apos;s online Telugu handwriting data (the LipiTk 4.0 Telugu isolated-character recognizer, trained on hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), 91 of the 102 stored prototypes of ఏ (89%) are two pen-down strokes, and in all 91 the first is the body and the second the hook. 90 of the 91 (99%) start the body low, at the loop, 89 (98%) turn the loop counterclockwise, and 90 (99%) end the body high, at the arch&apos;s upper end. So this ductus overrides movement 3&apos;s start, its direction and the lift before it: the arch is drawn up from the junction without a lift, as in ఎ, whose body Noto Sans Telugu prints with the same outline. The hook keeps the guide&apos;s place and direction, last and from its lower end up (65 of the 91, 71%). The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Telugu letter direction is not uniform across the script.</desc><rect x="0" y="0" width="662" height="362.61" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="231.61" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="231.61" viewBox="-41 -901 787 1215.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q593 256 574.5 309Q556 362 523 409.5Q490 457 446 498.5Q402 540 350 574Q298 608 242 632L280 712Q335 689 391.5 653.5Q448 618 499 570.5Q550 523 590 465.5Q630 408 653 341Q676 274 676 198Q676 132 653.5 85Q631 38 588.5 13Q546 -12 485 -12ZM114 687Q114 731 131.5 763.5Q149 796 179.5 813.5Q210 831 249 831Q271 831 288.5 827.5Q306 824 318 819L289 748Q282 750 273 752Q264 754 254 754Q226 754 211 735.5Q196 717 196 688Q196 648 211 614.5Q226 581 251 546L174 512Q151 550 132.5 593.5Q114 637 114 687Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M273 140 L273 140" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M273 140 L274 183 L247 217 L209 238 L166 244 L124 233 L91 205 L72 166 L69 122 L81 80" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="81" cy="80" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="352.5" y="215.1" text-anchor="middle" font-size="63.1" fill="#6b7280"><tspan x="352.5" y="215.1">1. turn down and left</tspan><tspan x="352.5" y="292.1">round the lower loop</tspan></text></svg><rect x="176" y="42" width="150" height="231.61" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="231.61" viewBox="-41 -901 787 1215.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q593 256 574.5 309Q556 362 523 409.5Q490 457 446 498.5Q402 540 350 574Q298 608 242 632L280 712Q335 689 391.5 653.5Q448 618 499 570.5Q550 523 590 465.5Q630 408 653 341Q676 274 676 198Q676 132 653.5 85Q631 38 588.5 13Q546 -12 485 -12ZM114 687Q114 731 131.5 763.5Q149 796 179.5 813.5Q210 831 249 831Q271 831 288.5 827.5Q306 824 318 819L289 748Q282 750 273 752Q264 754 254 754Q226 754 211 735.5Q196 717 196 688Q196 648 211 614.5Q226 581 251 546L174 512Q151 550 132.5 593.5Q114 637 114 687Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M273 140 L274 183 L247 217 L209 238 L166 244 L124 233 L91 205 L72 166 L69 122 L81 80 L81 80" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linec