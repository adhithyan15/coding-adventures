ze="10" fill="#64748b">Stroke order after Donald R. Davis Jr., The Malayalam</text><text x="16" y="272.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Script, Initial Vowels, ഒ handwriting clip, 00:00–00:04</text><text x="16" y="284.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin)</text><text x="16" y="297.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="309.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
