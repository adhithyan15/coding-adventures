[package]
name = "photo-picker-app"
version = "0.1.0"
description = "Reference Mosaic app for UI59's files.open effect -- pick a photo, see its name/type/size"
license = "MIT"

[components]
exports = ["PhotoPickerApp"]

# No `[host_effects]` or `[host_assets]`: Mosaic's platform library answers
# `files.open` on every backend -- Compose, SwiftUI, Qt, XAML and Flutter
# (UI87 §7) -- and this app claims no effect kinds, so the router sends it
# there. The per-backend handlers this app used to carry, and the Flutter
# handler's `file_selector` coordinate (every generated Flutter project now
# pins it for the library), were retired for it (UI87 §7.4).

[kernel]
version = "1"
