[package]
name = "iir-to-beam"
version = "0.6.0"
edition = "2021"
description = "IIR → BEAM bytecode backend — lowers IIRModule to BEAM, including an ASCII character-list string subset"

[lib]
name = "iir_to_beam"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
ir-to-beam     = { path = "../ir-to-beam" }
codegen-core   = { path = "../codegen-core" }
