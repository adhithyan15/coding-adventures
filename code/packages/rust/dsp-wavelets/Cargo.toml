[package]
name = "dsp-wavelets"
version = "0.4.0"
edition = "2021"
description = "DSP06 Phases 1-4a: scalar reference Haar + Daubechies (Db2/4/6/8) + Symlets (Sym4) + Coiflets (Coif1) discrete wavelet transforms (DWT), both 1-D and 2-D, via a generic Mallat pyramid filter bank that works for any orthogonal wavelet. The wavelet sibling of dsp-fft / dsp-stft. Phase 4a ships 2-D DWT (separable row-then-column on the Phase-3 filter bank) for orthogonal wavelets under Periodic boundary — the JPEG 2000 / image wavelet decomposition pattern. Sym6/Sym8/Coif2/Coif3 and Biorthogonal (JPEG 2000 5/3 and 9/7) wavelets still pending. CWT pending Phase 5, matrix-IR lowering pending Phase 6."
license = "MIT"

