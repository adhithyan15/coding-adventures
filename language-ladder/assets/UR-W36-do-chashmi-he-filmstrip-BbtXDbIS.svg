<svg xmlns="http://www.w3.org/2000/svg" width="662" height="305.07" viewBox="0 0 662 305.07" role="img" aria-label="How to write ھ: one unbroken stroke · 4 movements"><title>Writing ھ</title><desc>4 frames; frame N shows movements 1 to N of ھ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Chhoṭī he, do-chashmī he, chhoṭī ye, baṛī ye, and punctuation, independent ھ calligraphic and handwriting animations and Aspiration with do-chashmī he instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/chhoti-he-do-chashmi-he-chhoti-ye-bari-ye/&gt;. Source note on variation: Both independent-form animations draw the two-eyed body in one uninterrupted stroke: begin near the upper center, circle the right eye clockwise, continue down and left along the baseline, reverse at the left edge, rise around the left eye, close it at the center, and finish with a low leftward sweep without lifting. The lesson names the letter for its two eyes, uses it after a consonant to mark aspiration, and explicitly warns that the pen stops and reverses direction in the medial and final forms. This learner path covers the independent form and fits the continuous zero-lift order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="662" height="305.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="186.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.57" viewBox="-53 -503 703 874.4" preserveAspectRatio="xMidYMid meet" o