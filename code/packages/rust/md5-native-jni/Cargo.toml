[package]
name = "md5-native-jni"
version = "0.1.0"
edition = "2021"
description = "JNI native library bridging Java/Kotlin to the Rust coding_adventures_md5 crate"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "md5_native_jni"

[dependencies]
jni-bridge = { path = "../jni-bridge" }
coding_adventures_md5 = { path = "../md5" }
