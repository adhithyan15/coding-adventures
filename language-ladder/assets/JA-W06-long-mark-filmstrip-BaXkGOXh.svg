<svg xmlns="http://www.w3.org/2000/svg" width="182" height="298.79" viewBox="0 0 182 298.79" role="img" aria-label="How to write ー: one unbroken stroke · 1 movement"><title>Writing ー</title><desc>1 frames; frame N shows movements 1 to N of ー (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/030fc.svg, the long-vowel mark ー (U+30FC), one stroke path kvg:030fc-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/030fc.svg&gt;. Source note on variation: KanjiVG stores the mark as one directed path, a bar drawn from left to right, the form it takes in horizontal writing. In vertical writing the mark turns with the line and is drawn from top to bottom; this course writes horizontally. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="182" height="298.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written —</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">one unbroken</text><text x="16" y="68.5" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 1 movement</text><rect x="16" y="79.5" width="150" height="80.29" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="79.5" width="150" height="80.29" viewBox="32 -503 935 500.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M102 433Q117 432 139 430.5Q161 429 187.5 428.5Q214 428 241 428Q257 428 290.5 428Q324 428 369 428Q414 428 464.5 428Q515 428 565.5 428Q616 428 661.5 428Q707 428 740 428Q773 428 789 428Q827 428 854 430Q881 432 897 433L897 335Q882 336 852.5 338Q823 340 790 340Q774 340 740 340Q706 340 661.5 340Q617 340 566 340Q515 340 464.5 340Q414 340 369.5 340Q325 340 291 340Q257 340 241 340Q200 340 163 338.5Q126 337 102 335L102 433Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M146 383 L146 383" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M146 383 L216 383 L287 383 L357 383 L428 383 L498 383 L568 383 L639 383 L709 383 L780 383 L850 383" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="850" cy="383" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="499.5" y="-120.1" text-anchor="middle" font-size="74.9" fill="#6b7280"><tspan x="499.5" y="-120.1">1. draw the bar from</tspan><tspan x="499.5" y="-28.7">left to right</tspan></text></svg><text x="16" y="172.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG,</text><text x="16" y="185.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">kanji/030fc.svg, the</text><text x="16" y="197.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">long-vowel mark ー (U+30FC),</text><text x="16" y="210.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">one stroke path kvg:030fc-s1</text><text x="16" y="222.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Ulrich Apel and</text><text x="16" y="235.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">contributors, CC BY-SA 3.0)</text><text x="16" y="247.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not</text><text x="16" y="260.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">standardised; the source</text><text x="16" y="272.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
