__pen" d="M293 20 L330 35 L370 60 L410 85 L445 110 L475 140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="475" cy="140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="268" y="243.6" text-anchor="middle" font-size="47.6" fill="#6b7280"><tspan x="268" y="243.6">4. turn without lifting</tspan><tspan x="268" y="301.7">and rise to the upper</tspan><tspan x="268" y="359.7">right</tspan></text></svg><text x="16" y="374.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 讠.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="386.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="399.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
