[package]
name = "visicalc-mosaic-app"
version = "0.1.0"
edition = "2021"
description = "Portable Mosaic application adapter for the VisiCalc spreadsheet."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mosaic-app-capi = { path = "../mosaic-app-capi" }
mosaic-app-runtime = { path = "../mosaic-app-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spreadsheet-core = { path = "../spreadsheet-core" }
