 406 183L406 551L-7 551L-7 622L583 622L583 551L487 551L487 172Q487 84 442.5 42Q398 0 309 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L131 586 L170 586 L209 586 L248 586 L286 586 L325 586 L364 586 L403 586 L442 586 L480 586 L519 586 L558 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M452 586 L449 547 L447 507 L447 467 L447 426 L447 385 L447 344 L447 303 L447 262 L446 221 L444 181 L439 143 L429 107 L410 77 L382 55 L347 44 L310 41 L272 44 L236 54 L202 70 L171 90 L142 116 L118 145 L100 177 L88 213 L81 250 L81 250" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M81 250 L88 285 L102 317 L126 342 L157 357 L193 365 L231 370" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="231" cy="370" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288" y="198.5" text-anchor="middle" font-size="58.5" fill="#6b7280"><tspan x="288" y="198.5">4. curve over to the</tspan><tspan x="288" y="269.9">right</tspan></text></svg><text x="16" y="256.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਹ (haahaa) checkpoints, strokes 1–2</text><text x="16" y="269.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 157, commit de1e560; Apache-2.0)</text><text x="16" y="281.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
