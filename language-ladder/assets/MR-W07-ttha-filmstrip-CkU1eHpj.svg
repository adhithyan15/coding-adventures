<svg xmlns="http://www.w3.org/2000/svg" width="502" height="320.42" viewBox="0 0 502 320.42" role="img" aria-label="How to write ठ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ठ</title><desc>3 frames; frame N shows movements 1 to N of ठ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ठ-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A0-order.gif&gt;. Source note on variation: The 18-frame animation shows three ordered pen-down runs over its gray guide: frames 2–3 descend the short central stem top-to-bottom; frames 4–13 restart at the stem&apos;s lower junction, sweep left, and continue counterclockwise around the closed round body back to the junction without lifting; frames 14–16 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 230 ms hold at frame 3 and 250 ms hold at frame 13 mark the first two run endings before the one-second completed frame 17. This learner path follows that sourced three-run order and fits its closed body to Noto Sans Devanagari; everyday handwriting may narrow or simplify the curve differently.</desc><rect x="0" y="0" width="502" height="320.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="214.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.42" viewBox="-70 -692 739 1056.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M599 551L381 551L381 414Q453 384 496 327.5Q539 271 539 198Q539 128 506 84.5Q473 41 418 20.5Q363 0 297 0Q222 0 165.5 25Q109 50 77.5 98.5Q46 147 46 216Q46 283 80.5 328.5Q115 374 