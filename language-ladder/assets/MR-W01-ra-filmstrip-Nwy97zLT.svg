<svg xmlns="http://www.w3.org/2000/svg" width="502" height="376.03" viewBox="0 0 502 376.03" role="img" aria-label="How to write र: 3 strokes · 2 pen lifts · 3 movements"><title>Writing र</title><desc>3 frames; frame N shows movements 1 to N of र (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-र-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%B0-order.gif&gt;. Source note on variation: The 17-frame animation shows three ordered pen-down runs over its gray guide: frames 2–9 start at the right stem&apos;s headline junction, descend top-to-bottom, and curl left and clockwise around the lower loop to the tail junction; frames 10–12 restart at that junction and draw the diagonal tail down-right; frames 13–16 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 240 ms hold at frame 9 and 250 ms hold at frame 12 mark the first two run endings before the one-second completed frame 16. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VIII, p. 42, independently shows the same looped stem, diagonal tail, and headline buildup and directions. JackPotte&apos;s seven-frame ‘Devanagari r र.gif’ animation of 29 March 2009 instead joins the descending stem, clockwise lower loop, and diagonal tail in one continuous body before the separate left-to-right headline. This learner path follows the mutually corroborated three-run form and fits its loop and tail to Noto Sans Devanagari; everyday handwriting may use the documented two-run join or simplify the lower loop differently.</desc><rect x="0" y="0" width="502" height="376.03" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 m