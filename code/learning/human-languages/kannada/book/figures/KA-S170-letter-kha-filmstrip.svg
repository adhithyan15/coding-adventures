<svg xmlns="http://www.w3.org/2000/svg" width="662" height="274.46" viewBox="0 0 662 274.46" role="img" aria-label="How to write ಖ: one unbroken stroke · 4 movements"><title>Writing ಖ</title><desc>4 frames; frame N shows movements 1 to N of ಖ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-kha.gif, animation of Kannada consonant ಖ, 37 frames, 3.7 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-kha.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಖ in one pen-down run (frames 0–23): from the inner tip of the curl the pen winds out of it, up and over to the right, comes down through the waist to the base, rounds the lower loop up its left side and back across its top through the waist, then runs along the base and climbs the right side, curving over to its tip. ಖ has no top bar, so nothing follows a lift. The frames were read from a mirror copy that matches the Commons file&apos;s listed pixel size (209×192); the listing gives no byte size or frame count to compare. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the two strokes cross at the waist, so the path passes through the crossing twice, but the one-run order remains the same.</desc><rect x="0" y="0" width="662" height="274.46" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="168.46" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="168.46" viewBox="-46 -699 928 1042.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M594 -12Q548 -12 508 4Q