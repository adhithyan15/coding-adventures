[package]
name = "prolog-parser"
version = "0.2.0"
edition = "2021"
description = "ISO/Core Prolog parser — grammar-driven via parser::GrammarParser + iso.grammar; lowers AST to logic-core terms. v0.2 adds the `naf_goal` production so source-level `\\+ G` lowers to the canonical `\\+(G)` compound."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
prolog-lexer = { path = "../prolog-lexer" }
logic-core = { path = "../logic-core" }
