5 L-20 795 L45 765 L95 705 L122 630" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M122 630 L122 630 L131 540 L131 440 L131 330 L131 220 L131 110 L131 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-63.5" y="189.3" text-anchor="middle" font-size="49.3" fill="#6b7280"><tspan x="-63.5" y="189.3">3. down the stem to the</tspan><tspan x="-63.5" y="249.4">line</tspan></text></svg><text x="16" y="856.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Part 1: stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ச</text><text x="16" y="869.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 191</text><text x="16" y="881.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Part 2: stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர</text><text x="16" y="894.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 191</text><text x="16" y="906.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Part 3: stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 37</text><text x="16" y="919.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(ி, i sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012)</text><text x="16" y="931.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
