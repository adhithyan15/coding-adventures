# Build every Human Languages LaTeX book in one job. Relevant pull requests
# retain one complete publication bundle as a build artifact; main-branch
# builds publish that same bundle as a stable download catalog on GitHub Pages
# AND cut a dated GitHub Release with every book's PDF attached, so a reader
# can grab a stable, versioned snapshot instead of only the always-current
# Pages catalog. Every pull request receives one stable gate result, while
# unrelated changes skip the expensive all-books build after a small
# change-detection job.
#
# Each language track under code/learning/human-languages/<lang>/book/
# contains a self-contained XeLaTeX book (see HL00 spec). This workflow
# discovers every such book/ directory dynamically, installs TeX once, and
# compiles the books sequentially so adding a new track needs zero changes here.

name: Human Languages Books

on:
  push:
    branches: [main]
    paths:
      - "code/learning/human-languages/**"
      - "code/packages/typescript/human-language-data/**"
      - "code/scripts/build_human_language_book_catalog.py"
      - "code/scripts/scan_latex_log_warnings.py"
      # The compile gate and its hardening. These were absent from this list,
      # which meant a pull request editing the script that compiles every book
      # never ran it — the books gate went green on the strength of nothing.
      - "code/scripts/check-book-compile.sh"
      - "code/scripts/check_book_tree_hygiene.py"
      - "code/scripts/latexmk-safe.rc"
      - "code/scripts/tests/test_build_human_language_book_catalog.py"
      - "code/scripts/tests/test_check_book_tree_hygiene.py"
      - "code/scripts/tests/test-check-book-compile-guards.sh"
      - "code/scripts/tests/test_scan_latex_log_warnings.py"
      - ".github/workflows/human-languages-books.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-languages-books-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect human-language book changes
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.changes.outputs.books }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The Markdown shard directories are append-only history. The old
          # generated monolith caught a dropped shard only because it went
          # stale; after removing that merge hot spot, preserve the same
          # fail-closed deletion signal directly from Git's PR diff.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Pull-request base or head SHA is invalid."
              exit 1
            fi
            # Disable rename detection so moving a history shard is treated as
            # one deletion plus one addition and cannot hide removed history.
            doc_shard_globs=(
              'code/learning/human-languages/BACKLOG.d/*.md'
              'code/packages/typescript/human-language-data/CHANGELOG.d/*.md'
              'code/programs/typescript/language-ladder/CHANGELOG.d/*.md'
            )
            # The migration PR must replace the one provisional Script Ductus
            # fragment while establishing its strict plan. The migration base is
            # uniquely identified by still tracking the old monolith; every later
            # base does not, so it gets the deletion gate. The decision comes from
            # the immutable base tree and cannot be disabled by refactoring code in
            # the PR head.
            ductus_monolith='code/packages/typescript/script-ductus/CHANGELOG.md'
            if ! git ls-tree -r --name-only "$PR_BASE_SHA" -- "$ductus_monolith" \
              | grep -Fxq "$ductus_monolith"; then
              doc_shard_globs+=('code/packages/typescript/script-ductus/CHANGELOG.d/*.md')
            fi
            deleted_doc_shards=$(git diff --no-renames --diff-filter=D --name-only \
              "$PR_BASE_SHA...$PR_HEAD_SHA" -- \
              "${doc_shard_globs[@]}")
            if [ -n "$deleted_doc_shards" ]; then
              echo "::error::Markdown history shards are append-only; restore these deleted files:"
              printf '%s\n' "$deleted_doc_shards"
              exit 1
            fi
          fi

          # These paths are render targets, not repository content. Refuse a
          # future merge that accidentally recreates any shared hot spot.
          tracked_doc_monoliths=$(git ls-files -- \
            code/learning/human-languages/BACKLOG.md \
            code/packages/typescript/human-language-data/CHANGELOG.md \
            code/packages/typescript/script-ductus/CHANGELOG.md \
            code/programs/typescript/language-ladder/CHANGELOG.md)
          if [ -n "$tracked_doc_monoliths" ]; then
            echo "::error::Generated Markdown aggregates must remain untracked:"
            printf '%s\n' "$tracked_doc_monoliths"
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "books=true" >> "$GITHUB_OUTPUT"
            echo "A non-pull-request run always builds the publication bundle."
            exit 0
          fi

          set +e
          git diff --quiet "$PR_BASE_SHA...$PR_HEAD_SHA" -- \
            code/learning/human-languages \
            code/packages/typescript/human-language-data \
            code/programs/typescript/language-ladder/CHANGELOG.d \
            code/scripts/build_human_language_book_catalog.py \
            code/scripts/scan_latex_log_warnings.py \
            code/scripts/check-book-compile.sh \
            code/scripts/check_book_tree_hygiene.py \
            code/scripts/latexmk-safe.rc \
            code/scripts/tests/test_build_human_language_book_catalog.py \
            code/scripts/tests/test_check_book_tree_hygiene.py \
            code/scripts/tests/test-check-book-compile-guards.sh \
            code/scripts/tests/test_scan_latex_log_warnings.py \
            .github/workflows/human-languages-books.yml
          diff_status=$?
          set -e

          case "$diff_status" in
            0)
              echo "books=false" >> "$GITHUB_OUTPUT"
              echo "No human-language book inputs changed; the all-books build will be skipped."
              ;;
            1)
              echo "books=true" >> "$GITHUB_OUTPUT"
              echo "Human-language book inputs changed; the all-books build is required."
              ;;
            *)
              echo "::error::git diff failed with status $diff_status."
              exit "$diff_status"
              ;;
          esac

  # Building and publishing are two jobs, not one, because they need opposite
  # things from the token.
  #
  # This job executes pull-request-controlled code by design and at length: an
  # `npm ci`, a TypeScript build, seven `node dist/*.js` checks, and XeLaTeX
  # over twenty-three books of repository content. It used to do all of that
  # holding `contents: write`, on a `pull_request` trigger — so on any
  # same-repository branch (which is how nearly every change reaches this repo)
  # a contributor's code ran next to a write-scoped token, and
  # `actions/checkout`'s default `persist-credentials: true` had left that token
  # on disk in `.git/config`, inside the workspace latexmk `cd`s into.
  #
  # Hardening the latexmk call while leaving that arrangement in place would fix
  # one door in a room with no walls. So: this job gets `contents: read` and no
  # persisted credentials, and hands its output to `publish` as an artifact.
  build:
    name: Build all human-language books
    needs: detect
    if: ${{ needs.detect.outputs.books == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Do not leave a usable credential in `.git/config` for the steps
          # below to find. Nothing in this job talks to the API or pushes.
          persist-credentials: false

      # FIRST, before Node, before TeX, before anything reads repository content
      # as code. `latexmk` reads `latexmkrc` / `.latexmkrc` from its working
      # directory and `eval`s it as Perl, and its working directory during the
      # build below is `<track>/book` — repository content. Every invocation in
      # this repository passes `-norc` so that directory is never consulted, but
      # a flag only protects the call sites somebody remembered to type it at.
      # This is the second control: the payload must not be in the tree at all.
      #
      # Its own tests run first, for the same reason the warning scanner's do —
      # a silently broken gate is worse than no gate.
      - name: Test the book-tree hygiene lint
        env:
          # The symlink cases skip themselves on a filesystem that cannot create
          # links. That is right on Windows and a silent hole here: nothing else
          # asserts the probe SUCCEEDED, so a runner image that broke it would
          # stop exercising the security tests while the step stayed green —
          # "compiled 0, skipped 1, failed 0" wearing a different hat, in the
          # very pull request that removes the original. With this set, a skip
          # is a failure.
          REQUIRE_SYMLINK_TESTS: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s code/scripts/tests \
            -p 'test_check_book_tree_hygiene.py' -v

      - name: Reject any latexmkrc or symlink under a book directory
        run: |
          set -euo pipefail
          python3 code/scripts/check_book_tree_hygiene.py \
            --book-root code/learning/human-languages

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The log scanner is what enforces the books' zero-warning claim, so it is
      # tested before anything expensive runs: a silently broken gate is worse
      # than no gate, and finding that out after a 20-book XeLaTeX build wastes
      # twenty minutes. No dependencies beyond the runner's stock python3.
      - name: Test the LaTeX warning scanner
        run: |
          set -euo pipefail
          python3 -m unittest discover -s code/scripts/tests \
            -p 'test_scan_latex_log_warnings.py' -v

      # The catalog builder writes the index.html and catalog.json that main
      # pushes publish to GitHub Pages, so it is the other piece of this
      # workflow whose breakage reaches readers. Same reasoning as above: test
      # it before the 20-book build, not after.
      #
      # This is a second step rather than a widened `-p` on the step above
      # because `unittest discover` takes exactly ONE pattern, and no glob
      # matches these two files without also sweeping in the unrelated
      # test_build_tool_conformance_* and test_build_adj_* suites. Separate
      # named steps also keep the failure legible — the red step name says
      # which suite broke without anyone opening the log.
      - name: Test the book catalog builder
        run: |
          set -euo pipefail
          python3 -m unittest discover -s code/scripts/tests \
            -p 'test_build_human_language_book_catalog.py' -v

      # The Unicode grid generator merges committed handwriting evidence and
      # later script extensions back into Telugu, Kannada, and Malayalam. Run
      # its idempotence suite before book generation so an unsafe rewrite cannot
      # silently reopen already closed provenance work.
      - name: Test the Dravidian syllabary generator
        run: |
          set -euo pipefail
          python3 code/learning/human-languages/data/scripts/test_generate_syllabary.py -v

      # Legacy authoring/report scripts now write canonical shards directly.
      # Keep their no-follow, root-confinement, and identity checks executable
      # in CI so a later helper cleanup cannot reopen an out-of-tree write.
      - name: Test the Python shard boundary
        run: |
          set -euo pipefail
          python3 code/learning/human-languages/data/scripts/test_sharded_ledger.py -v

      - name: Build curriculum gap report
        working-directory: code/packages/typescript/human-language-data
        run: |
          (cd ../pixel-container && npm ci --omit=dev --ignore-scripts)
          (cd ../paint-instructions && npm ci --omit=dev --ignore-scripts)
          (cd ../paint-vm && npm ci --omit=dev --ignore-scripts)
          (cd ../paint-vm-svg && npm ci --omit=dev --ignore-scripts)
          # `--ignore-scripts` to match the four sibling installs above. This one
          # was the odd one out, so a dependency's `postinstall` ran arbitrary
          # code on a pull-request runner. This package declares only `build`
          # (`tsc`) — no `prepare`, `preinstall` or `postinstall` — so nothing of
          # its own is skipped by the flag.
          npm ci --ignore-scripts
          npm run build
          # Class-A/B SVGs are generated views of canonical curriculum data.
          # A stale vector must fail before it reaches rsvg or XeLaTeX.
          npm run check:figures
          npm run check:books
          # One progress card per language is generated from the registry,
          # curriculum maps, lessons, and book manifest. Independent curriculum
          # PRs never rewrite a shared README table.
          # Regenerate with `npm run generate:progress`.
          npm run check:progress
          # Corpus debt stays exact, but each language owns a separate generated
          # snapshot so independent curriculum PRs do not collide on one test line.
          # Regenerate with `npm run generate:gentle-snapshots`.
          npm run check:gentle-snapshots
          # The per-language modality shards (core/lesson-modality/*.json) are
          # derived from the lessons and let the complete book, the app, and the future
          # dictation-friendly driving edition be filtered out of one source. A stale
          # manifest is not cosmetic: a lesson that gained a paradigm table would still
          # read `drivable: true`, and the driving edition would tell somebody at 70mph
          # to look at a chart. Regenerate with `npm run generate:modality`.
          npm run check:modality
          # The narration export is committed like the generated .tex, and drifts the
          # same way: someone edits a lesson and forgets to re-run the exporter. The
          # consequence is worse here, though — a stale .tex looks wrong to whoever
          # opens the book, while a stale script has a voice assistant confidently
          # teaching a lesson that no longer exists, to someone driving who cannot
          # check. Byte-for-byte, before anything expensive runs.
          npm run check:narration
          # HL21: every sharded ledger is checked here, in one of two directions.
          #
          # The spine, all chapter/curriculum ledgers, and book-generation are
          # shard-only. Language Ladder folds its browser values at build time;
          # Node and Python consumers use the same canonical directories. This
          # check parses and rebuilds every shard set and fails if a bad merge
          # resurrects a tracked aggregate that readers would silently ignore.
          # Japanese, Perso-Arabic, and Urdu-Nastaliq are also shard-only;
          # Script Ductus folds its bounded browser module at build time.
          npm run check:shards
          # HL35: static mutation evidence is one file per script owner, so a
          # new glyph never refreshes one shared whole-inventory digest.
          npm run check:script-owner-evidence
          # HL22/HL24: BACKLOG.d/ and CHANGELOG.d/ are the source of truth for
          # the Markdown histories human-languages authors touch.
          # Their generated monoliths are deliberately untracked; this validates
          # shard shape/order and any optional local rendered view. The detect
          # job separately forbids shard deletion and tracked render targets.
          npm run check:doc-shards
          # HL20 §6b: every artifact `<track>/assessment.json` promises must be a
          # file that is there. Thirteen tracks named 351 mocks, rubrics, answer
          # keys and task-shape inventories that do not exist, and every gate was
          # green, because the loader checked that `answerKey` was a non-empty
          # string and nothing checked that the string led anywhere.
          #
          # This step runs HERE, in the job triggered by
          # code/learning/human-languages/**, and not only as a vitest case,
          # because the build tool's diff detection maps changed files to
          # PACKAGES: an edit to a track's assessment.json touches no package
          # directory, so the package's own suite would never be rebuilt and the
          # gate would go dark on exactly the change it exists to catch. The
          # vitest case in tests/assessment-artifacts.test.ts remains, and covers
          # the other direction — a change to the checker itself.
          #
          # `--check` prints its measurement on success as well as failure, so a
          # green run says a number and cannot be confused with a step that was
          # skipped.
          npm run check:assessment-artifacts
          mkdir -p "$GITHUB_WORKSPACE/dist/human-languages/books"
          npm run --silent report -- --format json \
            > "$GITHUB_WORKSPACE/dist/human-languages/books/curriculum-gaps.json"
          npm run --silent report -- --format text \
            > "$GITHUB_WORKSPACE/dist/human-languages/books/curriculum-gaps.txt"
          cat "$GITHUB_WORKSPACE/dist/human-languages/books/curriculum-gaps.txt"

      # Keep one shared XeLaTeX toolchain for the one all-books job, but avoid
      # installing TeX Live's unrelated documentation, music, science, CJK,
      # and publishing collections. texlive-xetex pulls the LaTeX base,
      # recommended, and extra layers used by every preamble. The Arabic
      # collection supplies bidi.sty for Arabic, Persian, and Urdu; every
      # non-Latin book font is vendored under human-languages/_fonts. The
      # recommended font collection supplies Hyperref's Zapf Dingbats metric.
      - name: Install focused TeX toolchain
        run: |
          setup_started_at=$(date +%s)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig latexmk lmodern texlive-fonts-recommended \
            librsvg2-bin texlive-lang-arabic texlive-xetex

          setup_seconds=$(($(date +%s) - setup_started_at))
          echo "TeX toolchain setup completed in ${setup_seconds}s"
          echo "TeX toolchain setup: ${setup_seconds}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify focused TeX toolchain
        run: |
          set -euo pipefail

          for executable in xelatex latexmk kpsewhich fc-match rsvg-convert; do
            command -v "$executable"
          done

          for tex_asset in \
            book.cls fontspec.sty graphicx.sty newunicodechar.sty xcolor.sty \
            tcolorbox.sty booktabs.sty longtable.sty tabularx.sty array.sty \
            hyperref.sty titlesec.sty polyglossia.sty bidi.sty pzdr.tfm; do
            asset_path=$(kpsewhich "$tex_asset")
            test -n "$asset_path"
            echo "$tex_asset -> $asset_path"
          done

          latin_modern_path=$(fc-match -f '%{file}\n' 'Latin Modern Roman' | head -n 1)
          test -f "$latin_modern_path"
          echo "Latin Modern Roman -> $latin_modern_path"

      # The SVG-to-PDF conversion that used to live here is gone. It is not
      # skipped — `check-book-compile.sh` does it, per track, immediately before
      # compiling that track. Keeping a second copy here was not merely
      # duplicated work: this one derived its output path as `${svg%.svg}.pdf`
      # and wrote to it unchecked, so a committed `figures/diagram.pdf` symlink
      # made `rsvg-convert` open an arbitrary runner-writable path for writing.
      # The script guards exactly that case with an `[ -L ]` test and always
      # did. Deleting the unguarded copy is the fix.

      # Exercise the compile script's hostile-input guards against real hostile
      # input, on the one machine in the loop that can create a symlink.
      #
      # These guards refuse a symlinked `book.pdf` and keep a `book/` directory
      # with no `book.tex` out of the manifest. Both were argued correct by
      # reading them; neither had been watched refusing anything. The authoring
      # box cannot create a native symlink without elevation, so the test skips
      # there and runs here — which is the right way round, since here is where
      # the guards actually matter.
      - name: Exercise the compile script's guards
        env:
          # Same reasoning as the lint step above: on the one machine in the loop
          # that can create a symlink, failing to do so must be loud.
          REQUIRE_SYMLINK_TESTS: "1"
        run: |
          set -euo pipefail
          bash code/scripts/tests/test-check-book-compile-guards.sh

      # Re-run the book-tree hygiene lint immediately before the compile, as well
      # as at the top of the job.
      #
      # The first run is early so a hit fails fast and cheap. But between it and
      # this point the job runs `npm ci`, a TypeScript build and seven `node`
      # checks — all pull-request-controlled, all able to write a `latexmkrc`
      # into a book directory after the early check has passed. A control that
      # can be invalidated by the code running between it and the thing it
      # protects is a time-of-check/time-of-use gap. Checking again here, one
      # step before latexmk runs, closes it for a few milliseconds of `os.walk`.
      - name: Re-check book-tree hygiene immediately before compiling
        run: |
          set -euo pipefail
          python3 code/scripts/check_book_tree_hygiene.py \
            --book-root code/learning/human-languages

      # Compile every book through `check-book-compile.sh`, the same script a
      # human runs locally — not through a second, parallel `latexmk` command
      # line maintained here.
      #
      # That distinction is the entire point of this step. This job used to
      # inline its own invocation:
      #
      #     latexmk -xelatex -interaction=nonstopmode -halt-on-error book.tex
      #
      # with no `-norc`, so `<track>/book/latexmkrc` — repository content, added
      # by any pull request — was read and `eval`ed as Perl before a line of TeX
      # was parsed, and with TeX Live's *restricted* shell escape rather than
      # none. Both risks were closed in `check-book-compile.sh`,
      # `build-books-locally.sh`, `verify-human-languages.sh` and every track's
      # `book/build.sh` at the time, and in this file at no time. The hardening
      # was present everywhere except the one place that compiles the books at
      # scale, because it was added call site by call site and nobody swept.
      #
      # Copying the flags here would fix today and re-open the same gap the next
      # time the local script learns something. Calling the script means there is
      # one invocation in the repository and CI cannot drift from it.
      #
      # `--strict` is what makes this a gate rather than a report: without it the
      # script SKIPS any track whose figures it cannot convert and exits 0, so a
      # runner missing `rsvg-convert` would produce "compiled 0, skipped 1,
      # failed 0" and a green check having verified nothing. With it, "I could
      # not verify this" is a failure that names the missing dependency.
      # `librsvg2-bin` is installed above, so the converter is present here and
      # `--strict` should never have cause to fire — which is exactly the state
      # in which you want it armed.
      #
      # `--manifest` records the book directories this run actually compiled, so
      # the collection step below publishes those and only those. See its own
      # comment for why re-deriving the list with `find` is not the same
      # question.
      - name: Build every book
        run: |
          set -euo pipefail
          bash code/scripts/check-book-compile.sh --strict \
            --manifest="$RUNNER_TEMP/compiled-books.txt"

      # Prove the hardening was in effect, rather than trusting that the flags
      # were typed. XeTeX announces its shell-escape state in every book.log:
      #
      #   " restricted \write18 enabled."   TeX Live's default -- what this job
      #                                     ran with before the fix
      #   "\write18 enabled."               fully unrestricted
      #   (no line at all)                  disabled, which is what we require
      #
      # So the logs the build just wrote are direct evidence. If a future change
      # drops `-r latexmk-safe.rc`, moves the rc, or hits the older-latexmk quirk
      # where `-xelatex` overwrites `$pdflatex` and the rc's `$xelatex` is never
      # consulted, this step goes red with the offending file named — none of
      # which any amount of reading the YAML would catch.
      #
      # Driven by the manifest, for the same reason the collection step is. An
      # earlier version re-found the logs with `find -path '*/book/book.log'`
      # and compared a COUNT against the manifest, which is weaker in two ways:
      # `-path` matches at any depth, so a committed decoy log pads the count and
      # can mask a real one that dropped out; and a count is not an identity
      # check, so "same number of logs" was standing in for "the logs of the
      # books we actually built". Iterating the manifest makes the count
      # comparison unnecessary — every compiled book is visited by name, and a
      # missing log is a hard failure rather than a smaller number.
      - name: Verify shell escape was disabled for every book
        run: |
          set -euo pipefail
          offenders=0
          checked=0
          while IFS= read -r book_dir; do
            [ -n "$book_dir" ] || continue
            log="$book_dir/book.log"
            # `-L` before `-f`, because `-f` follows the link and would happily
            # read an attacker-chosen file that says nothing about this build.
            # Same reasoning the collect step already gives for `book.pdf`: the
            # steps should not have to trust each other. The compile refuses a
            # book directory containing any symlink, so reaching this is a bug
            # rather than an expected input — which is exactly when a redundant
            # check earns its place.
            if [ -L "$log" ]; then
              echo "::error::$log is a symlink; refusing to read shell-escape state through it."
              exit 1
            fi
            if [ ! -f "$log" ]; then
              echo "::error::$log is missing, so shell-escape state cannot be verified for a book that compiled."
              exit 1
            fi
            checked=$((checked + 1))
            if grep -q 'write18 enabled' "$log"; then
              echo "::error::$log reports shell escape ENABLED; latexmk-safe.rc was not in effect."
              grep -n 'write18' "$log" | head -3
              offenders=$((offenders + 1))
            fi
          done < "$RUNNER_TEMP/compiled-books.txt"

          # A manifest with no entries means the compile verified nothing, which
          # --strict should already have caught. Belt and braces, because this is
          # the step that certifies the security property.
          test "$checked" -gt 0
          test "$offenders" -eq 0
          echo "Shell escape disabled in all $checked book.log file(s)"

      # Collect the PDFs the compile produced. Separate from the compile so a
      # packaging mistake here can never be mistaken for a LaTeX failure there,
      # and vice versa.
      #
      # The list comes from the compile's own manifest, NOT from a fresh
      # `find -type d -name book`. Those are different questions with different
      # answers: `check-book-compile.sh` skips a directory with no `book.tex`,
      # so a `find` would hand this loop a `<track>/book/book.pdf` that no
      # compile ever touched. A pull request adding nothing but
      # `code/learning/human-languages/anything/book/book.pdf` would then have an
      # attacker-authored file uploaded as a build artifact and, on `main`,
      # published to Pages and attached to the Release as though it were a book.
      # Reading the manifest means only what was compiled can be published.
      - name: Collect book PDFs
        run: |
          set -euo pipefail
          output_dir="dist/human-languages/books"
          mkdir -p "$output_dir"
          book_count=0

          while IFS= read -r book_dir; do
            [ -n "$book_dir" ] || continue
            language=$(basename "$(dirname "$book_dir")")
            # `cp` follows symlinks, so without this a committed
            # `book.pdf -> ../../../../.git/config` would copy the link's target
            # into a downloadable artifact. The compile refuses such a book
            # already; this is the same check on the consuming side, because the
            # two steps should not have to trust each other.
            if [ -L "$book_dir/book.pdf" ]; then
              echo "::error::$book_dir/book.pdf is a symlink; refusing to publish it."
              exit 1
            fi
            if [ ! -s "$book_dir/book.pdf" ]; then
              echo "::error::$book_dir/book.pdf is missing or empty although the compile reported success."
              exit 1
            fi
            cp "$book_dir/book.pdf" "$output_dir/$language.pdf"
            book_count=$((book_count + 1))
          done < "$RUNNER_TEMP/compiled-books.txt"

          test "$book_count" -gt 0
          echo "Collected $book_count human-language books"

      # `latexmk -halt-on-error` stops on hard TeX errors but is perfectly happy
      # with a log full of warnings, so every track's "zero overfull boxes, zero
      # missing glyphs" claim was prose and nothing else. These two steps turn it
      # into a contract by reading each book.log the loop above left behind.
      #
      # The gate is baselined, not absolute. A track fails only when it EXCEEDS
      # the counts recorded in core/latex-warning-baseline.json; a track with no
      # recorded baseline is measured and reported but never failed. Baselines
      # ship unseeded on purpose — real numbers need a real XeLaTeX run, so the
      # scanner prints the counts it actually measured into the job summary for
      # a human to paste back into the baseline file. See HL06's "warning gate".
      - name: Scan book logs for LaTeX warnings
        run: |
          set -euo pipefail
          python3 code/scripts/scan_latex_log_warnings.py \
            --book-root code/learning/human-languages \
            --baseline code/learning/human-languages/core/latex-warning-baseline.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-annotations \
            --json dist/human-languages/books/latex-warnings.json

      - name: Build download catalog
        run: |
          python code/scripts/build_human_language_book_catalog.py \
            --pdf-dir dist/human-languages/books \
            --registry code/learning/human-languages/core/languages.json \
            --output-dir dist/human-languages/books

      - name: Verify publication bundle
        run: |
          test -s dist/human-languages/books/index.html
          test -s dist/human-languages/books/catalog.json
          test -s dist/human-languages/books/curriculum-gaps.json
          test -s dist/human-languages/books/curriculum-gaps.txt
          test -s dist/human-languages/books/latex-warnings.json
          python -m json.tool dist/human-languages/books/curriculum-gaps.json >/dev/null
          python -m json.tool dist/human-languages/books/latex-warnings.json >/dev/null
          test -n "$(find dist/human-languages/books -maxdepth 1 -name '*.pdf' -print -quit)"

      - name: Upload complete publication bundle
        uses: actions/upload-artifact@v7
        with:
          name: human-language-books
          path: dist/human-languages/books
          if-no-files-found: error
          retention-days: 30

  # The only job that holds a write-scoped token, and it runs no repository code
  # at all: it downloads the bundle the build job produced and hands it to two
  # publishing actions. Gated at the JOB level on a push to `main`, so on a pull
  # request it does not run — which means a pull request cannot reach a
  # `contents: write` token through this workflow even if every check above it
  # were somehow subverted.
  #
  # Note there is no `actions/checkout` here. `release-notes.md` is written from
  # the artifact's own contents and `github.sha`, so the working copy of the
  # repository — the thing a build turns into code — never enters this job.
  publish:
    name: Publish books to Pages and Releases
    needs: [detect, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.books == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the publication bundle
        uses: actions/download-artifact@v8
        with:
          name: human-language-books
          path: dist/human-languages/books

      - name: Verify the downloaded bundle
        run: |
          set -euo pipefail
          test -s dist/human-languages/books/index.html
          test -s dist/human-languages/books/catalog.json
          test -n "$(find dist/human-languages/books -maxdepth 1 -name '*.pdf' -print -quit)"

      - name: Publish books to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/human-languages/books
          destination_dir: human-languages/books
          keep_files: true

      # Every main-branch build that reaches this point already built and
      # verified every book PDF, so cut a dated GitHub Release from it. The
      # tag combines a UTC date with the run number so same-day pushes still
      # get distinct, monotonically increasing releases without any manual
      # version bump.
      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          version="v$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "tag=human-languages-$version" >> "$GITHUB_OUTPUT"
          echo "name=Human Languages Books $version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          # Via `env:` rather than inlined into the script. These particular
          # fields are not attacker-controlled, but interpolating `${{ }}`
          # straight into a `run:` block is how script injection happens in
          # Actions, and the habit is worth keeping even where this instance is
          # safe.
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "Snapshot of every Human Languages curriculum book, built from"
            echo "commit ${COMMIT_SHA:0:7} on main."
            echo
            echo "## Books in this release"
            for pdf in dist/human-languages/books/*.pdf; do
              echo "- $(basename "$pdf" .pdf)"
            done
            echo
            echo "Always-current catalog: https://${OWNER}.github.io/$(basename "$REPOSITORY")/human-languages/books/"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          make_latest: true
          files: dist/human-languages/books/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  books-gate:
    # Keep the required pull-request context distinct from the push context.
    # Otherwise a faster main/branch push can satisfy protection while the
    # pull-request all-books build is still running.
    name: ${{ github.event_name == 'pull_request' && 'Human Languages Books gate' || 'Human Languages Books push gate' }}
    # `publish` is deliberately NOT a dependency. It only ever runs on a push to
    # main, so requiring it would make this gate un-satisfiable on the pull
    # requests it exists to gate. `build` is the job that proves the books are
    # sound; `publish` merely moves the result it produced.
    needs: [detect, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the required book work succeeded
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BOOKS_RELEVANT: ${{ needs.detect.outputs.books }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect=$DETECT_RESULT relevant=$BOOKS_RELEVANT build=$BUILD_RESULT"

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::Human-language book change detection did not succeed."
            exit 1
          fi

          case "$BOOKS_RELEVANT:$BUILD_RESULT" in
            true:success)
              echo "The required all-books build passed."
              ;;
            false:skipped)
              echo "No book inputs changed; the all-books build was legitimately skipped."
              ;;
            *)
              echo "::error::Unexpected books gate state: relevant=$BOOKS_RELEVANT build=$BUILD_RESULT"
              exit 1
              ;;
          esac
