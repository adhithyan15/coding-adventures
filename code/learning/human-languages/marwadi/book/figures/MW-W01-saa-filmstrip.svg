<svg xmlns="http://www.w3.org/2000/svg" width="982" height="290.94" viewBox="0 0 982 290.94" role="img" aria-label="How to write सा: 4 strokes · 3 pen lifts · 6 movements"><title>Writing सा</title><desc>6 frames; frame N shows movements 1 to N of सा (devanagari): each letter&apos;s body in reading order, then one headline over the whole word; the movement being added is drawn in ink over the finished word, whose outline (each letter&apos;s at the font&apos;s advance) is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after letter 1: JackPotte, ‘Devanagari s स.gif’, strokes 1–4, Wikimedia Commons, 29 March 2009; sign 2: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 47 (ा, aa sign): stored online-handwriting prototypes from native writers (MIT licence, 2012); the place of sign 2, after its consonant&apos;s body: Saurmandal, ‘Devanagari आ stroke order.svg’, frames 1–5, Wikimedia Commons, 5 August 2023; the shared headline, drawn last: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer: native writers&apos; stored prototypes of the 33 consonants draw the headline as the last stroke in 82% of 2,706 and as the first in about 5% (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The letters are drawn in reading order, each as its own cited strip draws it but without its own headline, placed where the bundled font prints it in the word: letter 1 after JackPotte, ‘Devanagari s स.gif’, strokes 1–4, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_s_%E0%A4%B8.gif&gt;; sign 2 after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 47 (ा, aa sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Each letter&apos;s own note on variation is printed with that letter&apos;s own strip. The place of sign 2, after its consonant&apos;s body and before the headline, after Saurmandal, ‘Devanagari आ stroke order.svg’, frames 1–5, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%86_stroke_order.svg&gt;; the sign&apos;s own piece of headline becomes part of the word&apos;s one headline. The cited आ is अ with the ā bar after it: its buildup frames draw the body, then (frame 4) the trailing stem top-to-bottom, then (frame 5) the shirorekhā left-to-right. The book draws the ā sign the same way on a consonant: the consonant&apos;s body, then the stem, then the headline across both. Native writers agree for आ: of the 83 prototypes of आ stored in HP Labs India&apos;s LipiTk 4.0 Devanagari recognizer, 52 (63%) are body strokes, then the bar, then the headline; the bar comes after the body in 69% and before the headline in 65% (the data is licensed for research use only, so only shares are cited). KanoAI&apos;s hand-made Gujarati barakhadi templates draw ા after its consonant in all 32 rows that keep the consonant&apos;s bare outline, in a script with no headline. No reachable source records native writers&apos; consonant + ā syllables (HP Labs India&apos;s hpl-dvng-iso-word set, which would, is on a host the authoring environment cannot reach), so carrying आ&apos;s order to the sign on a consonant is this book&apos;s reading of that evidence, at medium confidence. Handwriting varies by writer. The headline is then drawn once, left to right, over the whole word. That is the order most native writers use for a single letter: in HP Labs India&apos;s LipiTk 4.0 Devanagari recognizer the stored prototypes of the 33 consonants draw the headline last in 82% of 2,706 and first in about 5%. It is a majority, not a rule: some writers draw the headline first. The traces are single letters, so carrying their order across a word is this book&apos;s reading of them; no reachable source records native writers&apos; headline timing in whole words.</desc><rect x="0" y="0" width="982" height="290.94" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="147.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="147.44" viewBox="-70 -692 1089 1070.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M287 -14Q212 60 154.5 131Q97 202 70 251Q56 277 49 299Q42 321 42 340Q42 366 56.5 380Q71 394 96 394Q122 394 146.5 375.5Q171 357 195 326L148 331Q193 345 209.5 382Q226 419 226 460Q226 495 218.5 522Q211 549 202 564L243 551L0 551L0 622L417 622L417 551L251 551L285 566Q296 542 301.5 513.5Q307 485 307 450Q307 410 295.5 376.5Q284 343 261 317L257 310Q239 289 213 273Q187 257 147 243L145 254Q170 220 201 185.5Q232 151 269 115Q306 79 348 40L287 -14ZM400 244Q359 244 312 253.5Q265 263 221 287L248 347Q289 330 323.5 323Q358 316 399 316Q440 316 477.5 323.5Q515 331 553 348L553 272Q518 257 479.5 250.5Q441 244 400 244ZM506 0L506 551L396 551L396 622L690 622L690 551L587 551L587 0L506 0ZM846 551L846 0L765 0L765 551L676 551L676 622L949 622L949 551L846 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 540 L250 540" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 540 L255 505 L265 465 L265 425 L255 385 L235 350 L205 320 L170 305 L135 315 L100 340 L70 340 L60 315 L75 285 L110 260 L135 240 L140 210 L155 180 L180 145 L210 110 L240 75 L265 35 L285 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="285" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="474.5" y="241.3" text-anchor="middle" font-size="87.3" fill="#6b7280"><tspan x="474.5" y="241.3">1. descend