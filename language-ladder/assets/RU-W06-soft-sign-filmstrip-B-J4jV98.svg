<svg xmlns="http://www.w3.org/2000/svg" width="662" height="353.22" viewBox="0 0 662 353.22" role="img" aria-label="How to write ь: one unbroken stroke · 4 movements"><title>Writing ь</title><desc>4 frames; frame N shows movements 1 to N of ь (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ь demonstration, 11:16–11:20, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 11:16–11:20 lowercase ь demonstration, the pen begins near the upper left, descends a narrow entry stroke to the baseline, turns right, circles the joined lower bowl counterclockwise, and closes it against the stem without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: stem down, then the joined lower bowl. The bundled Noto Sans Cyrillic glyph is a printed ь-like form with a straight full-height upright joined to a wide closed lower bowl, without the source&apos;s slightly slanted entry or rounded handwritten join. This learner path preserves the source&apos;s stem-to-bowl order, counterclockwise direction, and zero-lift evidence while fitting the printed outline: descend the stem, circle the lower bowl counterclockwise, and close it against the stem without lifting. Connected cursive may restore a looped entry or rising exit, and individual handwriting may round, narrow, widen, or slant the stem and bowl differently.</desc><rect x="0" y="0" width="662" height="353.22" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="247.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="247.22" viewBox="15 -606 555 914.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L173 536L173 338L279 338Q500 338 500 172Q500 90 443.5 45Q387 0 279 0L85 0ZM173 73L279 73Q409 73 409 170Q409 219 378 242Q347 265 279 265L173 265L173 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 536 L129 360 L129 180 L129 36" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="36" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292.5" y="184.5" text-anchor="middle" font-size="44.5" fill="#6b7280"><tspan x="292.5" y="184.5">1. descend the stem to</tspan><tspan x="292.5" y="238.8">the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="247.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="247.22" viewBox="15 -606 555 914.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L173 536L173 338L279 338Q500 338 500 172Q500 90 443.5 45Q387 0 279 0L85 0ZM173 73L279 73Q409 73 409 170Q409 219 378 242Q347 265 279 265L173 265L173 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 36 L129 36" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 36 L200 36 L279 36 L355 44 L430 87" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="87" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292.5" y="184.5" text-anchor="middle" font-size="44.5" fill="#6b7280"><tspan x="292.5" y="184.5">2. sweep right along</tspan><tspan x="292.5" y="238.8">the lower bowl</tspan></text></svg><rect x="336" y="42" width="150" height="247.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="247.22" viewBox="15 -606 555 914.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L173 536L173 338L279 338Q500 338 500 172Q500 90 443.5 45Q387 0 279 0L85 0ZM173 73L279 73Q409 73 409 170Q409 219 378 242Q347 265 279 265L173 265L173 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 36 L200 36 L279 36 L355 44 L430 87 L430 87" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M430 87 L456 128 L456 173 L440 217 L400 258 L340 291 L279 301" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="279" cy="301" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292.5" y="184.5" text-anchor="middle" font-size="44.5" fill="#6b7280"><tspan x="292.5" y="184.5">3. curve upward around</tspan><tspan x="292.5" y="238.8">the bowl&apos;s right side</tspan></text></svg><rect x="496" y="42" width="150" height="247.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="247.22" viewBox="15 -606 555 914.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L173 536L173 338L279 338Q500 338 500 172Q500 90 443.5 45Q387 0 279 0L85 0ZM173 73L279 73Q409 73 409 170Q409 219 378 242Q347 265 279 265L173 265L173 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 36 L200 36 L279 36 L355 44 L430 87 L456 128 L456 173 L440 217 L400 258 L340 291 L279 301 L279 301" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M279 301 L225 301 L173 301 L129 301" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="301" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292.5" y="184.5" text-anchor="middle" font-size="44.5" fill="#6b7280"><tspan x="292.5" y="184.5">4. return left through</tspan><tspan x="292.5" y="238.8">the upper bowl to close</tspan><tspan x="292.5" y="293.1">against the stem</tspan></text></svg><text x="16" y="302.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ь demonstration,</text><text x="16" y="314.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">11:16–11:20, YouTube, 5 February 2013</text><text x="16" y="327.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
