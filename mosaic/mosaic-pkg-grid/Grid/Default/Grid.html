<!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
<div data-mosaic-component="Grid">
  <!-- emit "onViewportRows" dropped: HTML is static -->
  <table style="border-width: 1px; border-style: solid; border-color: #c8c8c8; background: #ffffff; color: #1f1f1f">
    <colgroup>
      <!-- mosaic-for each="columnWidths" as="w" index="cw" -->
        <col>
      <!-- /mosaic-for -->
    </colgroup>
    <thead>
      <tr>
        <!-- mosaic-for each="columnHeaders" as="h" index="ch" -->
          <th>
            <div style="padding: 4px; background: #f3f3f3; color: #555555">
              <span>{{h}}</span>
            </div>
          </th>
        <!-- /mosaic-for -->
      </tr>
    </thead>
    <tbody>
      <!-- mosaic-for each="viewportRows" as="row" index="r" -->
        <tr style="background: #ffffff">
          <!-- mosaic-for each="row" as="v" index="c" -->
            <td>
              <!-- emit "onNavigate" dropped: HTML is static -->
              <div style="padding: 4px; background: #1e1e1e; color: #cccccc">
                <!-- mosaic-if when="( r == editRow &amp;&amp; c == editCol )" -->
                  <!-- emit "onFormulaChange" dropped: HTML is static -->
                  <!-- emit "onEditCommit" dropped: HTML is static -->
                  <!-- emit "onEditCancel" dropped: HTML is static -->
                  <input type="text" aria-label="{{editorLabel}}" value="{{editContent}}" autofocus data-on-change="onFormulaChange" data-on-commit="onEditCommit" data-on-cancel="onEditCancel" style="padding: 0px; border: 0px; background: transparent; font: inherit; width: 100%; box-sizing: border-box">
                <!-- mosaic-else -->
                  <span>{{v}}</span>
                <!-- /mosaic-if -->
              </div>
            </td>
          <!-- /mosaic-for -->
        </tr>
      <!-- /mosaic-for -->
    </tbody>
  </table>
</div>
