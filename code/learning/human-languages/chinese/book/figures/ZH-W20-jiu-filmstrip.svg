<svg xmlns="http://www.w3.org/2000/svg" width="342" height="331.55" viewBox="0 0 342 331.55" role="img" aria-label="How to write 九: 2 strokes · 1 pen lift · 2 movements"><title>Writing 九</title><desc>2 frames; frame N shows movements 1 to N of 九 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 九.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B9%9D.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 九. Median 1 falls from the upper right to the lower left across the whole square; median 2 crosses it, bends downward on the right and hooks back at the foot in a single unbroken run. Two strokes for nine, the largest single-digit numeral in the run and among the cheapest to write.</desc><rect x="0" y="0" width="342" height="331.55" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="200.55" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.55" viewBox="-36 -899 1083 1448" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M353 829L434 829Q433 714 429.5 604.5Q426 495 410 393.5Q394 292 358 204Q322 116 257 44Q192 -28 90 -80Q84 -71 74.5 -59.5Q65 -48 54.5 -37.5Q44 -27 34 -20Q132 27 193 93.5Q254 160 287 242Q320 324 334 418.5Q348 513 350.5 617Q353 721 353 829ZM80 584L699 584L699 508L80 508L80 584ZM653 584L731 584L731 50Q731 24 737 16Q743 8 767 8Q771 8 785.5 8Q800 8 816.5 8Q833 8 847.5 8Q862 8 869 8Q884 8 891 19.5Q898 31 901 62Q904 93 906 154Q915 147 927.5 140Q94