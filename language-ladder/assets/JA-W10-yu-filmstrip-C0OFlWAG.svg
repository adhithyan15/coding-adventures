<svg xmlns="http://www.w3.org/2000/svg" width="822" height="313.96" viewBox="0 0 822 313.96" role="img" aria-label="How to write ゆ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ゆ</title><desc>5 frames; frame N shows movements 1 to N of ゆ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana ゆ stroke order animation.gif, hiragana ゆ, 30 frames, 3.0 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%86_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws ゆ in two pen-down runs with one lift: descend through the left stem, turn up and right across the high shoulder, continue clockwise around the broad loop to its inner finish, then restart above the loop and descend through its center into the down-left curve. The learner path is fitted to the bundled Noto Sans JP subset; handwritten loop width and final curve depth vary, but the two-run order remains the same.</desc><rect x="0" y="0" width="822" height="313.96" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="220.46" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="220.46" viewBox="62 -863 915 1344.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M245 711Q241 701 238 689Q235 677 232 664Q227 640 221 602Q215 564 211 521.5Q207 479 204.5 439Q202 399 204 369Q229 434 270.5 486.5Q312 539 366 577.5Q420 616 482 636.5Q544 657 610 657Q704 657 770 621.5Q836 586 871.5 525.5Q907 465 907 391Q907 309 873 243.5Q839 178 771 139.5Q703 101 600 101Q542 101 489 121.5Q436 142 393.5 181Q351 220 323 276L371 332Q395 284 427 248.5Q459 213 502 194.5Q545 176 600 176Q670 17