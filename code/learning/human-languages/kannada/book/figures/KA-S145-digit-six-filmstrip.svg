8 230 L114 194 L125 160 L143 128 L168 101 L197 80 L229 64 L264 54 L301 47 L339 43 L377 41 L416 40 L455 40 L494 40 L533 40 L573 40 L612 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="612" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="359.5" y="198.9" text-anchor="middle" font-size="58.9" fill="#6b7280"><tspan x="359.5" y="198.9">3. sweep down the left</tspan><tspan x="359.5" y="270.8">side and along the base</tspan></text></svg><text x="16" y="272.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons</text><text x="16" y="284.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026):</text><text x="16" y="297.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the hidden, ordered tracing path for ೬, trace image file-7nlw0r9i.svg</text><text x="16" y="309.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
