<svg xmlns="http://www.w3.org/2000/svg" width="502" height="333.74" viewBox="0 0 502 333.74" role="img" aria-label="How to write घ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing घ</title><desc>3 frames; frame N shows movements 1 to N of घ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-घ-order.gif’, strokes 1–3, Wikimedia Commons, 9 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%98-order.gif&gt;. Source note on variation: The 22-frame animation shows three ordered pen-down runs over its gray guide: frames 3–14 start below the headline at the upper-left, curve clockwise around the upper curl, turn back left through the middle hook, continue clockwise around the lower bowl, and rise along the right side to the headline without lifting; frames 15–16 restart at the lower right-side junction and descend the short stem below the bowl; frames 17–21 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 210 ms hold at frame 14 and 260 ms hold at frame 16 mark the first two run endings before the one-second completed frame 21; frame 6&apos;s 200 ms pause occurs within the continuous body and does not add a lift. This learner path follows that sourced three-run order and fits its curls and bowl to Noto Sans Devanagari; everyday handwriting may divide or simplify the body differently.</desc><rect x="0" y="0" width="502" height="333.74" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="227.74" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="227.74" viewBox="-70 -692 745 1131.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><p