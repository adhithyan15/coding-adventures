<svg xmlns="http://www.w3.org/2000/svg" width="342" height="330.23" viewBox="0 0 342 330.23" role="img" aria-label="How to write ب: 2 strokes · 1 pen lift · 2 movements"><title>Writing ب</title><desc>2 frames; frame N shows movements 1 to N of ب (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, opening ب demonstration at 00:11–00:15 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ب as a shallow right-to-left Naskh bowl, followed by one pen lift and the separate dot below. Contextual joins reshape the bowl in connected text; this isolated learner path fits the vendored Noto Naskh outline.</desc><rect x="0" y="0" width="342" height="330.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="186.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.73" viewBox="0 -478 793 987.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM380 -206Q336 -173 308 -141Q334 -115 351 -97Q368 -79 378 -68Q394 -85 410.5 -101.5Q427 -118 444 -133Q433 -149 416.5 -167.5Q400 -186 380 -206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L678 382" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="255" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="409.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="409.5">1. sweep the shallow</tspan><tspan x="396.5" y="487">bowl from right to left</tspan></text></svg><rect x="176" y="42" width="150" height="186.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="186.73" viewBox="0 -478 793 987.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM380 -206Q336 -173 308 -141Q334 -115 351 -97Q368 -79 378 -68Q394 -85 410.5 -101.5Q427 -118 444 -133Q433 -149 416.5 -167.5Q400 -186 380 -206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M412 -137 L412 -137" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M412 -137 L379 -101 L344 -137" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="344" cy="-137" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="409.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="409.5">2. lift, then place the</tspan><tspan x="396.5" y="487">dot below</tspan></text></svg><text x="16" y="241.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="254.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, opening ب demonstration at 00:11–00:15 (Liberal</text><text x="16" y="266.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Arts Instructional Technology Services, Univ. of Texas at</text><text x="16" y="279.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="291.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="304.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
