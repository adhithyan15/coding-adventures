<svg xmlns="http://www.w3.org/2000/svg" width="662" height="297.73" viewBox="0 0 662 297.73" role="img" aria-label="How to write ਕ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਕ</title><desc>4 frames; frame N shows movements 1 to N of ਕ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਕ (kakkaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 190, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L190&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਕ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the loop, and down to the foot at the bottom right. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਕ, each by a different non-native copyist; only counts and shares are cited. 95% (19 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 75% (15 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="297.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="191.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="191.73" viewBox="-77 -692 776 991.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M488 0Q484 58 474 108Q464 158 447 201Q410 153 355.5 123.5Q301 94 229 94Q140 94 87.5 140Q35 186 35 268Q35 324 61.5 362.5Q88 401 132 421Q176 441 230 441Q300 441 351 416.5Q402 392 442 346Q449 375 452 404Q455 433 455 458Q455 478 452 505Q449 532 445 551L-7 551L-7 622L629 622L629 551L526 551Q529 536 532 507.5Q535 479 535 458Q535 412 525.5 364.5Q516 317 494 274Q529 213 545.5 140Q562 67 569 0L488 0ZM117 267Q117 217 149 191.5Q181 166 230 166Q298 166 342.5 197Q387 228 414 271Q380 318 336 344Q292 370 237 370Q185 370 151 344.5Q117 319 117 267Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L94 586 L133 586 L172 586 L211 586 L251 586 L290 586 L329 586 L368 586 L408 586 L447 586 L486 586 L525 586 L565 586 L604 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="604" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="311" y="202.2" text-anchor="middle" font-size="62.2" fill="#6b7280"><tspan x="311" y="202.2">1. draw the headline</tspan><tspan x="311" y="278.1">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="191.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="191.73" viewBox="-77 -692 776 991.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M488 0Q484 58 474 108Q464 158 447 201Q410 153 355.5 123.5Q301 94 229 94Q140 94 87.5 140Q35 186 35 268Q35 324 61.5 362.5Q88 401 132 421Q176 441 230 441Q300 441 351 416.5Q402 392 442 346Q449 375 452 404Q455 433 455 458Q455 478 452 505Q449 532 445 551L-7 551L-7 622L629 622L629 551L526 551Q529 536 532 507.5Q535 479 535 458Q535 412 525.5 364.5Q516 317 494 274Q529 213 545.5 140Q562 67 569 0L488 0ZM117 267Q117 217 149 191.5Q181 166 230 166Q298 166 342.5 197Q387 228 414 271Q380 318 336 344Q292 370 237 370Q185 370 151 344.5Q117 319 117 267Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L94 586 L133 586 L172 586 L211 586 L251 586 L290 586 L329 586 L368 586 L408 586 L447 586 L486 586 L525 586 L565 586 L604 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M485 586 L485 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M485 586 L488 550 L490 512 L491 475 L490 437 L488 400 L481 365 L469 332 L453 301" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="453" cy="301" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="311" y="202.2" text-anchor="middle" font-size="62.2" fill="#6b7280"><tspan x="311" y="202.2">2. lift, then come down</tspan><tspan x="311" y="278.1">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="191.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="191.73" viewBox="-77 -692 776 991.9" preserveAspectRatio="xMidYMid meet" overfl