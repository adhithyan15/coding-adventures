<svg xmlns="http://www.w3.org/2000/svg" width="662" height="561.79" viewBox="0 0 662 561.79" role="img" aria-label="How to write न, म: 2 letters, न, म, one after another"><title>Writing न, म</title><desc>2 letters written one after another: न, म (devanagari). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: न: Opiaterein, ‘Deva-न-order.gif’, strokes 1–3, Wikimedia Commons, 11 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A8-order.gif&gt;; म: JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_m_%E0%A4%AE.gif&gt;. Source notes on variation: न: The 20-frame animation shows three ordered pen-down runs: frames 2–9 start at the loop&apos;s inner-right curve, sweep down and clockwise around the small opening, then continue right along the shoulder without lifting; frames 10–14 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 15–18 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 9 and 14 mark the first two run endings before the one-second completed frame. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VI, p. 34, independently shows the same clockwise loop-and-shoulder, right stem, and headline buildup and directions. This learner path follows that sourced three-run form and fits its loop to Noto Sans Devanagari; everyday handwriting may join or simplify the loop differently. म: The 12-frame animation shows three ordered pen-down runs: frames 0–5 descend the left stem, curl left and clockwise around the lower loop, and continue right through the crossbar without lifting; frames 6–8 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 9–11 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The spatial restarts at frames 6 and 9 delimit the three runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 39, independently confirms the left stem, lower loop and crossbar, right stem, and headline order, while staging the left stem and loop-crossbar separately rather than proving their join. These runs stage the letter one part at a time; they are not a count of native pen lifts. The lift count follows HP Labs India&apos;s isolated handwritten Devanagari character data (hpl-dvng-iso-char, https://lipitk.sourceforge.net/datasets/dvngchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Devanagari recognizer. Those counts say how many strokes writers use, not where they break, so this learner path keeps every run&apos;s order, start and direction as a segment and joins the first two in one run, climbing the right stem from the crossbar before descending it, so the pen lifts only before the headline. Its curves are fitted to Noto Sans Devanagari.</desc><rect x="0" y="0" width="662" height="561.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="61" width="150" height="206.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width