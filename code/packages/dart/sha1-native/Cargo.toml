# Standalone workspace so this cdylib stays out of the main Rust workspace
# (mirrors dart/sha256-native, dart/md5-native).
[workspace]

[package]
name = "sha1-native"
version = "0.1.0"
edition = "2021"
description = "C-ABI cdylib wrapping the Rust coding_adventures_sha1 crate, called from Dart via dart:ffi (zero third-party deps)"

[lib]
name = "sha1_native"
crate-type = ["cdylib"]

[dependencies]
coding_adventures_sha1 = { path = "../../rust/sha1" }

[profile.release]
opt-level = 3
