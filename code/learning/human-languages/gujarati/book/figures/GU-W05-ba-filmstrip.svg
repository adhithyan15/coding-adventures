<svg xmlns="http://www.w3.org/2000/svg" width="342" height="354.28" viewBox="0 0 342 354.28" role="img" aria-label="How to write બ: 2 strokes · 1 pen lift · 2 movements"><title>Writing બ</title><desc>2 frames; frame N shows movements 1 to N of બ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, બ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates બ as two ordered pen-down runs. Its first SVG path begins near the upper left, circles clockwise around the rounded left body, winds inward through the compact middle turn, then exits right across the shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the rounded left body, compact inner turn, right shoulder, tall right spine, and lower foot, but its printed body is wider, its turn more angular, and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s rounded-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the body, turn, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="354.28" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="223.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="223.28" viewBox="-26 -673 822 1223.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M233 151Q178 151 135.5 175.5Q93 200 68.5 246Q44 292 44 354Q44 447 100 509.5Q156 572 259 603L282 531Q194 503 160 457Q126 411 126 353Q126 305 142 276.5Q158 248 183 235.5Q208 223 234 223Q288 223 314 258Q327 275 332 299Q337 323 337 369L337 447L417 437L417 335Q417 331 417 329Q427 313 442 306.5Q457 300 475 300Q501 300 521.5 310Q542 320 560 339L560 603L640 592L640 152Q640 125 643 112.5Q646 100 652 92Q663 78 684 75.5Q705 73 726 73L718 0L708 0Q673 0 642.5 7.5Q612 15 591 37Q572 57 566 81.5Q560 106 560 148L560 252Q543 240 522.5 234Q502 228 475 228Q455 228 436.5 233Q418 238 402 250Q383 205 341.5 178Q300 151 233 151Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 565 L270 565" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M270 565 L220 550 L175 525 L135 490 L105 445 L88 395 L85 345 L92 295 L115 250 L150 215 L195 190 L235 185 L275 188 L310 205 L335 235 L355 275 L372 320 L377 365 L377 410 L377 440 L377 395 L377 350 L390 305 L420 275 L460 265 L500 275 L535 295 L560 315" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="560" cy="315" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="385" y="205.9" text-anchor="middle" font-size="65.9" fill="#6b7280"><tspan x="385" y="205.9">1. circle the rounded</tspan><tspan x="385" y="286.3">body, wind through the</tspan><tspan x="385" y="366.7">inner turn, and exit</tspan><tspan x="385" y="447.1">across the right</tspan><tspan x="385" y="527.5">shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="223.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="223.28" viewBox="-26 -673 822 1223.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M233 151Q178 151 135.5 175.5Q93 200 68.5 246Q44 292 44 354Q44 447 100 509.5Q156 572 259 603L282 531Q194 503 160 457Q126 411 126 353Q126 305 142 276.5Q158 248 183 235.5Q208 223 234 223Q288 223 314 258Q327 275 332 299Q337 323 337 369L337 447L417 437L417 335Q417 331 417 329Q427 313 442 306.5Q457 300 475 300Q501 300 521.5 310Q542 320 560 339L560 603L640 592L640 152Q640 125 643 112.5Q646 100 652 92Q663 78 684 75.5Q705 73 726 73L718 0L708 0Q673 0 642.5 7.5Q612 15 591 37Q572 57 566 81.5Q560 106 560 148L560 252Q543 240 522.5 234Q502 228 475 228Q455 228 436.5 233Q418 238 402 250Q383 205 341.5 178Q300 151 233 151Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 565 L220 550 L175 525 L135 490 L105 445 L88 395 L85 345 L92 295 L115 250 L150 215 L195 190 L235 185 L275 188 L310 205 L335 235 L355 275 L372 320 L377 365 L377 410 L377 440 L377 395 L377 350 L390 305 L420 275 L460 265 L500 275 L535 295 L560 315" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M600 585 L600 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M600 585 L600 520 L600 450 L600 380 L600 310 L600 240 L600 175 L600 125 L605 90 L620 62 L650 45 L690 38 L720 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="720" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="385" y="205.9" text-anchor="middle" font-size="65.9" fill="#6b7280"><tspan x="385" y="205.9">2. lift, descend the</tspan><tspan x="385" y="286.3">tall right spine, and</tspan><tspan x="385" y="366.7">turn through its lower</tspan><tspan x="385" y="447.1">foot</tspan></text></svg><text x="16" y="278.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="290.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, બ animation, first and second SVG</text><text x="16" y="303.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="315.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="328.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
