<svg xmlns="http://www.w3.org/2000/svg" width="342" height="417.89" viewBox="0 0 342 417.89" role="img" aria-label="How to write ر: one unbroken stroke · 2 movements"><title>Writing ر</title><desc>2 frames; frame N shows movements 1 to N of ر (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ر demonstration at 01:10–01:12 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ر as one continuous Naskh motion: it begins at the upper tip, descends through the short stroke, and sweeps left through the lower curve without lifting. This non-connector does not join to a following letter; the learner path fits the vendored Noto Naskh outline and records Persian-scoped provenance rather than borrowing the separate Arabic or Urdu ر sources for the same Unicode glyph.</desc><rect x="0" y="0" width="342" height="417.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="274.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="274.39" viewBox="-90 -411 495 905.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L250 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="304" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">1. begin at the upper</tspan><tspan x="157.5" y="432.1">tip and descend through</tspan><tspan x="157.5" y="480.6">the short stroke</tspan></text></svg><rect x="176" y="42" width="150" height="274.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="274.39" viewBox="-90 -411 495 905.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48 L304 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M304 48 L298 8 L284 -30 L260 -68 L226 -103 L185 -130 L140 -146 L95 -151 L52 -147 L10 -136" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="10" cy="-136" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">2. without lifting,</tspan><tspan x="157.5" y="432.1">sweep left through the</tspan><tspan x="157.5" y="480.6">lower curve</tspan></text></svg><text x="16" y="329.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="341.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, ر demonstration at 01:10–01:12 (Liberal Arts</text><text x="16" y="354.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Instructional Technology Services, Univ. of Texas at</text><text x="16" y="366.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="379.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="391.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
