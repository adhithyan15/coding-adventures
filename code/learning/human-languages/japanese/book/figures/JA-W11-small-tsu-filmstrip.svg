<svg xmlns="http://www.w3.org/2000/svg" width="342" height="337.13" viewBox="0 0 342 337.13" role="img" aria-label="How to write っ: one unbroken stroke · 2 movements"><title>Writing っ</title><desc>2 frames; frame N shows movements 1 to N of っ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana つ stroke order animation.gif, hiragana つ, 24 frames, 2.4 seconds (Wikimedia Commons, 1 October 2009); Unicode Standard 17.0 names U+3063 HIRAGANA LETTER SMALL TU, alias small tsu &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%A4_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws full-size つ in one uninterrupted run from the upper left, right across the high shoulder, around the descending right side, and back left along the lower curve. Unicode 17 separately identifies U+3063 as small tsu. This learner path therefore preserves the source&apos;s zero-lift movement while scaling and fitting it to the bundled Noto Sans JP small っ outline; the cited animation demonstrates つ rather than a separately animated っ, so the size adaptation is explicit rather than presented as independent handwriting evidence.</desc><rect x="0" y="0" width="342" height="337.13" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="193.63" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="193.63" viewBox="90 -576 831 1072.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M160 399Q183 404 206.5 410.5Q230 417 254 424Q280 432 322 446Q364 460 413 473Q462 486 512.5 496Q563 506 607 506Q678 506 733 479Q788 452 819.5 402.5Q851 353 851 284Q851 212 818 157.5Q785 103 724.5 65Q664 27 580.5 5Q497 -17 396 -23L364 54Q445 57 518 70.5Q591 84 648 111Q705 138 737.5 181.5Q770 225 770 286Q770 329 749 362Q728 395 690.5 414.5Q653 434 601 434Q564 434 518 424.5Q472 415 423 400Q374 385 329 368.5Q284 352 249 338.5Q214 325 194 317L160 399Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M180 360 L180 360" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M180 360 L280 390 L380 425 L480 450 L600 470 L700 430 L780 350" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="780" cy="350" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="229.6" text-anchor="middle" font-size="66.6" fill="#6b7280"><tspan x="505.5" y="229.6">1. begin at the upper</tspan><tspan x="505.5" y="310.9">left and sweep right</tspan><tspan x="505.5" y="392.1">across the high</tspan><tspan x="505.5" y="473.4">shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="193.63" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="193.63" viewBox="90 -576 831 1072.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M160 399Q183 404 206.5 410.5Q230 417 254 424Q280 432 322 446Q364 460 413 473Q462 486 512.5 496Q563 506 607 506Q678 506 733 479Q788 452 819.5 402.5Q851 353 851 284Q851 212 818 157.5Q785 103 724.5 65Q664 27 580.5 5Q497 -17 396 -23L364 54Q445 57 518 70.5Q591 84 648 111Q705 138 737.5 181.5Q770 225 770 286Q770 329 749 362Q728 395 690.5 414.5Q653 434 601 434Q564 434 518 424.5Q472 415 423 400Q374 385 329 368.5Q284 352 249 338.5Q214 325 194 317L160 399Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M180 360 L280 390 L380 425 L480 450 L600 470 L700 430 L780 350 L780 350" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M780 350 L810 280 L780 200 L700 110 L600 60 L500 30 L390 15" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="390" cy="15" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="229.6" text-anchor="middle" font-size="66.6" fill="#6b7280"><tspan x="505.5" y="229.6">2. round down the right</tspan><tspan x="505.5" y="310.9">side and finish by</tspan><tspan x="505.5" y="392.1">sweeping left along the</tspan><tspan x="505.5" y="473.4">lower curve</tspan></text></svg><text x="16" y="248.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana つ stroke order</text><text x="16" y="261.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">animation.gif, hiragana つ, 24 frames, 2.4 seconds</text><text x="16" y="273.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Wikimedia Commons, 1 October 2009); Unicode Standard 17.0</text><text x="16" y="286.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">names U+3063 HIRAGANA LETTER SMALL TU, alias small tsu</text><text x="16" y="298.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="311.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
