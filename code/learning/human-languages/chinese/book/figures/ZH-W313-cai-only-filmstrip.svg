<svg xmlns="http://www.w3.org/2000/svg" width="502" height="312.5" viewBox="0 0 502 312.5" role="img" aria-label="How to write 才: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 才</title><desc>3 frames; frame N shows movements 1 to N of 才 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 才.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%89%8D.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 才. Median 1 draws a horizontal; median 2 a vertical down through it that hooks to the left at its foot without lifting; median 3 a long left-falling stroke from the crossing down to the lower left. The first two strokes are those of 打&apos;s hand piece. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the hook and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="312.5" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="206.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="206.5" viewBox="-34 -911 1042 1434.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"