ns and Sīn instructions (Northwestern</text><text x="16" y="255.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">University Libraries Open Textbook, 2026)</text><text x="16" y="268.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="280.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
