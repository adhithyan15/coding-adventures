<svg xmlns="http://www.w3.org/2000/svg" width="822" height="306.29" viewBox="0 0 822 306.29" role="img" aria-label="How to write ল: 2 strokes · 1 pen lift · 5 movements"><title>Writing ল</title><desc>5 frames; frame N shows movements 1 to N of ল (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 38 (ল, la; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 324 of the 358 stored prototypes draw the body in one pen-down stroke. 287 of those 324 start at the lower left, in the curl, and 263 end at the top right, at the top of the stem; 203 reach the stem&apos;s foot first and climb back up it. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 178 of the 358 draw none at all, 33 open with it, 140 end with it and 7 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 143 of the 164 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="306.29" fill="#ffffff"/><text x="16" y="31" font-family="