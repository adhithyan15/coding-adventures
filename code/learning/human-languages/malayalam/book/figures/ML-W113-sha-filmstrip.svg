<svg xmlns="http://www.w3.org/2000/svg" width="662" height="244.14" viewBox="0 0 662 244.14" role="img" aria-label="How to write ശ: one unbroken stroke · 4 movements"><title>Writing ശ</title><desc>4 frames; frame N shows movements 1 to N of ശ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ശ in data/SHA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/SHA.png&gt;. Source note on variation: Thooval&apos;s SHA.png starts at the top of the left bowl (green), curves counterclockwise down round it, climbs the middle stem, sweeps over the top and down the right side, rounds the base and curls up inside the right loop to finish (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ശ as one stroke from the upper left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the upper left (23 of 31) and end at the upper right (27 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; in that outline the inner loop&apos;s top runs into the right side, so the path ends where they meet.</desc><rect x="0" y="0" width="662" height="244.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="138.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="138.14" viewBox="-31 -636 1102 1014.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M684 566Q759 566 817.5 543Q876 520 917 477.5Q958 435 979.5 375.5Q1001 316 1001 242Q1001 153 973 96.5Q945 40 897 14Q849 -12 789 -12Q724 -12 681 17Q638 46 616.5 93.5Q595 141 595 196Q595 291 646 347.5Q697 404 783 404Q839 404 880.5 375Q922 346 946 301Q970 256 973 206L947 209Q940 240 920.5 268.5Q901 297 870.5 315.5Q840 334 800 334Q737 334 708 296.5Q679 259 679 198Q679 156 690.5 124.5Q702 93 726 75.5Q750 58 789 58Q830 58 858.5 77Q887 96 902.5 138Q918 180 918 248Q918 250 916.5 270Q915 290 911 310Q910 315 911.5 323Q913 331 911 334Q900 381 868.5 417Q837 453 791 473.5Q745 494 689 494Q646 494 613.5 485Q581 476 559 459Q522 431 507 381.5Q492 332 492 263L492 246Q492 173 480 128Q468 83 439 51Q413 21 374 4.5Q335 -12 278 -12Q205 -12 151 20.5Q97 53 68 115Q39 177 39 263Q39 331 56.5 384.5Q74 438 109 482.5Q144 527 194 566L248 504Q213 480 185.5 446Q158 412 142.5 367Q127 322 127 265Q127 203 145 157Q163 111 196.5 85.5Q230 60 274 60Q316 60 339.5 72.5Q363 85 377 106Q394 132 399 176.5Q404 221 404 265L404 280Q404 367 425.5 419.5Q447 472 488 506Q527 538 575 552Q623 566 684 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M183 504 L183 504" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M183 504 L140 453 L107 394 L90 329 L86 262 L88 195 L109 131 L149 78 L203 38 L269 28 L336 32 L395 64" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="395" cy="64" r="34" fill="#3b5bdb"/></