<svg xmlns="http://www.w3.org/2000/svg" width="822" height="292.53" viewBox="0 0 822 292.53" role="img" aria-label="How to write ы: 2 strokes · 1 pen lift · 5 movements"><title>Writing ы</title><desc>5 frames; frame N shows movements 1 to N of ы (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ы demonstration, 10:45–10:56, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 10:45–10:56 lowercase ы demonstration, the pen begins near the upper left, curls through a narrow entry loop, descends the tall left stem to the baseline, turns right, circles the joined lower bowl counterclockwise, and closes it against the stem. The pen then lifts once, restarts at the upper right, descends the separate tall right stem, and curls into a small rising exit. The demonstrated school hand therefore uses two pen-down runs with one intervening lift: the left stem and lower bowl first, then the separate right stem. The bundled Noto Sans Cyrillic glyph is a printed ы-like form with a straight full-height left upright joined to a wide closed lower bowl and a separate straight full-height right stem, without the narrow entry loop or curled exit. This learner path preserves the source&apos;s body-before-right-stem order, within-body counterclockwise direction, and one-lift evidence while fitting the printed outline: descend the left stem, circle and close the lower bowl, lift once, then descend the separate right stem. Connected cursive restores the source&apos;s narrow entry loop and rising exit, and individual handwriting may round, narrow, widen, or slant the stems and bowl differently.</desc><rect x="0" y="0" width="822" height="292.53" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="199.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.03" viewBox="15 -607 729 967.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 1L85 537L173 537L173 341L276 341Q497 341 497 176Q497 92 440.5 46.5Q384 1 276 1L85 1ZM586 1L586 537L674 537L674 1L586 1ZM173 74L276 74Q406 74 406 175Q406 223 375 245.5Q344 268 276 268L173 268L173 74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 537 L129 537" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 537 L129 360 L129 180 L129 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="197.4" text-anchor="middle" font-size="58.4" fill="#6b7280"><tspan x="379.5" y="197.4">1. descend the left stem</tspan><tspan x="379.5" y="268.6">to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="199.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="199.03" viewBox="15 -607 729 967.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 1L85 537L173 537L173 341L276 341Q497 341 497 176Q497 92 440.5 46.5Q384 1 276 1L85 1ZM586 1L586 537L674 537L674 1L586 1ZM173 74L276 74Q406 74 406 175Q406 223 375 245.5Q344 268 276 268L173 268L173 74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 537 L129 360 L129 180 L129 37 L129 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 37 L200 37 L276 37 L350 45 L425 88 L425 88" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="425" cy="88" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="197.4" text-anchor="middle" font-size="58.4" fill="#6b7280"><tspan x="379.5" y="197.4">2. sweep right along the</tspan><tspan x="379.5" y="268.6">lower bowl</tspan></text></svg><rect x="336" y="42" width="150" height="199.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="199.03" viewBox="15 -607 729 967.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 1L85 537L173 537L173 341L276 341Q497 341 497 176Q497 92 440.5 46.5Q384 1 276 1L85 1ZM586 1L586 537L674 537L674 1L586 1ZM173 74L276 74Q406 74 406 175Q406 223 375 245.5Q344 268 276 268L173 268L173 74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 537 L129 360 L129 180 L129 37 L200 37 L276 37 L350 45 L425 88 L425 88" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M425 88 L451 130 L451 176 L435 220 L395 263 L335 297 L276 304" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="276" cy="304" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="197.4" text-anchor="middle" font-size="58.4" fill="#6b7280"><tspan x="379.5" y="197.4">3. curve upward around</tspan><tspan x="379.5" y="268.6">the bowl&apos;s right side</tspan></text></svg><rect x="496" y="42" width="150" height="199.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="199.03" viewBox="15 -607 729 967.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 1L85 537L173 537L173 341L276 341Q497 341 497 176Q497 92 440.5 46.5Q384 1 276 1L85 1ZM586 1L586 537L674 537L674 1L586 1ZM173 74L276 74Q406 74 406 175Q406 223 375 245.5Q344 268 276 268L173 268L173 74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 537 L129 360 L129 180 L129 37 L200 37 L276 37 L350 45 L425 88 L451 130 L451 176 L435 220 L395 263 L335 297 L276 304 L276 304" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M276 304 L225 304 L173 304 L129 304" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="304" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="197.4" text-anchor="middle" font-size="58.4" fill="#6b7280"><tspan x="379.5" y="197.4">4. return left through</tspan><tspan x="379.5" y="268.6">the upper bowl to close</tspan><tspan x="379.5" y="339.9">against the stem</tspan></text></svg><rect x="656" y="42" width="150" height="199.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="199.03" viewBox="15 -607 729 967.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 1L85 537L173 537L173 341L276 341Q497 341 497 176Q497 92 440.5 46.5Q384 1 276 1L85 1ZM586 1L586 537L674 537L674 1L586 1ZM173 74L276 74Q406 74 406 175Q406 223 375 245.5Q344 268 276 268L173 268L173 74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 537 L129 360 L129 180 L129 37 L200 37 L276 37 L350 45 L425 88 L451 130 L451 176 L435 220 L395 263 L335 297 L276 304 L225 304 L173 304 L129 304" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M630 537 L630 537" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M630 537 L630 360 L630 180 L630 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="630" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="197.4" text-anchor="middle" font-size="58.4" fill="#6b7280"><tspan x="379.5" y="197.4">5. lift, then descend</tspan><tspan x="379.5" y="268.6">the separate right stem</tspan></text></svg><text x="16" y="254.03" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ы demonstration, 10:45–10:56, YouTube, 5 February 2013</text><text x="16" y="266.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
