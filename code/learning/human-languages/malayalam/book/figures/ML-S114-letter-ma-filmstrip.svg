<svg xmlns="http://www.w3.org/2000/svg" width="662" height="293.53" viewBox="0 0 662 293.53" role="img" aria-label="How to write മ: one unbroken stroke · 4 movements"><title>Writing മ</title><desc>4 frames; frame N shows movements 1 to N of മ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for മ in data/MA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/MA.png&gt;. Source note on variation: Thooval&apos;s MA.png starts at the bottom left (green), climbs the left side and arches clockwise over the top, curves down the inner stroke to the bottom-left corner, runs right along the base and climbs the right side to finish at the top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record മ as one stroke from the middle left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 37 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (30 of 37) and end at the upper right (30 of 37). Omniglot&apos;s 20 non-native copyists most often used two strokes (8 of 20; one stroke 4, three 7). Copyists over-count, and both recordings run on, so one run is kept. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the last climb ends on the arch&apos;s ink where the right side meets it.</desc><rect x="0" y="0" width="662" height="293.53" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="187.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="187.53" viewBox="-10 -636 743 928.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 566Q433 566 489.5 547.5Q546 529 583 494Q611 469 628.5 437Q646 405 654.5 363Q663 321 663 266L663 0L60 0L60 268Q60 320 68.5 361.5Q77 403 94.5 435.5Q112 468 138 493Q175 528 227.5 547Q280 566 354 566ZM307 495Q265 495 233 474Q201 453 181 418Q165 390 155.5 349.5Q146 309 146 249L146 68L151 68Q219 119 272 175Q325 231 355.5 289Q386 347 386 402Q386 430 377.5 450.5Q369 471 352 483Q335 495 307 495ZM472 393Q472 334 445 277Q418 220 368 162.5Q318 105 249 45L247 65Q276 67 304 68.5Q332 70 360 70L577 70L577 249Q577 323 562.5 372Q548 421 515 450.5Q482 480 428 494L430 501Q449 479 460.5 454.5Q472 430 472 393Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M108 48 L108 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M108 48 L104 116 L104 185 L104 253 L105 322 L121 388 L153 448 L203 496 L265 523 L334 528 L400 512" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="400" cy="512" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361.5" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="361.5" y="199.5">1. climb the left side</tspan><tspan x="361.5" y="272.1">and arch over</tspan></text></svg><rect x="176" y="42" width="150" height="187.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="187.53" viewBox="-10 -636 743 928.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 566Q433 566 489.5 547.5Q546 529 583 494Q611 469 628.5 437Q646 405 654.5 363Q663 321 663 266L663 0L60 0L60 268Q60 320 68.5 361.5Q77 403 94.5 435.5Q112 468 138 493Q175 528 227.5 547Q280 566 354 566ZM307 495Q265 495 233 474Q201 453 181 418Q165 390 155.5 349.5Q146 309 146 249L146 68L151 68Q219 119 272 175Q325 231 355.5 289Q386 347 386 402Q386 430 377.5 450.5Q369 471 352 483Q335 495 307 495ZM472 393Q472 334 445 277Q418 220 368 162.5Q318 105 249 45L247 65Q276 67 304 68.5Q332 70 360 70L577 70L577 249Q577 323 562.5 372Q548 421 515 450.5Q482 480 428 494L430 501Q449 479 460.5 454.5Q472 430 472 393Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M108 48 L104 116 L104 185 L104 253 L105 322 L121 388 L153 448 L203 496 L265 523 L334 528 L400 512 L400 512" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M400 512 L428 447 L435 378 L412 309 L379 244 L336 186 L285 133 L236 80 L179 41 L108 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="108" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361.5" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="361.5" y="199.5">2. curve down the inner</tspan><tspan x="361.5" y="272.1">stroke</tspan></text></svg><rect x="336" y="42" width="150" height="187.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="187.53" viewBox="-10 -636 743 928.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 566Q433 566 489.5 547.5Q546 529 583 494Q611 469 628.5 437Q646 405 654.5 363Q663 321 663 266L663 0L60 0L60 268Q60 320 68.5 361.5Q77 403 