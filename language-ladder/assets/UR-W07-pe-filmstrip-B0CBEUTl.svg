<svg xmlns="http://www.w3.org/2000/svg" width="662" height="314.2" viewBox="0 0 662 314.2" role="img" aria-label="How to write پ: 4 strokes · 3 pen lifts · 4 movements"><title>Writing پ</title><desc>4 frames; frame N shows movements 1 to N of پ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Pe, gaf, alif, and lam, independent پ handwriting animation and Pe instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/pe-gaf-alif-lam/&gt;. Source note on variation: The independent-form handwriting animation draws the full be-series bowl first in one uninterrupted right-to-left run, then places the lower-left dot, the lower-right dot, and finally the lower-center dot: four strokes separated by three pen lifts. The adjacent prose identifies pe as the be-series shape with three dots below and requires a triangular arrangement whose two-dot side is closer to the main line. This learner path covers the independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Persian پ source.</desc><rect x="0" y="0" width="662" height="314.2" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="208.2" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.2" viewBox="0 -478 793 1100.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 2