[package]
name = "bignum-core"
version = "0.1.0"
edition = "2021"
description = "A zero-dependency, arbitrary-precision signed integer (BigInteger) built from a sign and a base-2^32 limb vector, with full add/sub/mul/div-rem, gcd, pow, comparison, and radix parse/format."
license = "MIT"

[dependencies]
# No dependencies — this is a standalone foundation package (the integer core of
# the ADJ arbitrary-precision numeric substrate).
