font-size="83.9" fill="#6b7280"><tspan x="497.5" y="297.9">4. lift, then draw the</tspan><tspan x="497.5" y="400.3">right-falling leg</tspan></text></svg><text x="16" y="260.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 六.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="273.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="285.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
