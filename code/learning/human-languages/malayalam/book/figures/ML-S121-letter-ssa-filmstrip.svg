<svg xmlns="http://www.w3.org/2000/svg" width="982" height="235.92" viewBox="0 0 982 235.92" role="img" aria-label="How to write ഷ: one unbroken stroke · 6 movements"><title>Writing ഷ</title><desc>6 frames; frame N shows movements 1 to N of ഷ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ഷ in data/SSA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/SSA.png&gt;. Source note on variation: Thooval&apos;s SSA.png starts at the foot of the small arch (green), climbs over it to the line, runs right along the base, climbs the right upright, slants down to the left into the loop, circles it and runs straight down the stem to finish on the line (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ഷ as one stroke from the lower left to the lower centre. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (21 of 31) and end at the lower right (16 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the slant meets the loop at the stem, and the stem&apos;s descent finishes the letter.</desc><rect x="0" y="0" width="982" height="235.92" fil