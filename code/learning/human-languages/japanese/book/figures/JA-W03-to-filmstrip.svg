<svg xmlns="http://www.w3.org/2000/svg" width="502" height="332.27" viewBox="0 0 502 332.27" role="img" aria-label="How to write と: 2 strokes · 1 pen lift · 3 movements"><title>Writing と</title><desc>3 frames; frame N shows movements 1 to N of と (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03068.svg, hiragana と (U+3068 HIRAGANA LETTER TO), two stroke paths kvg:03068-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03068.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 starts at the top of the short stroke and runs down and to the right, ending on the line s2 will take; s2 starts at the upper right, sweeps down to the left, curves round and runs out to the right along the base. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In KanjiVG and in the print glyph alike, the short stroke ends on the long one, so the two strokes touch.</desc><rect x="0" y="0" width="502" height="332.27" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="226.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.27" viewBox="131 -848 780 1176.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M814 597Q797 586 778 576Q759 566 737 555Q712 541 675 523Q638 505 596 483Q554 461 512 437Q470 413 433 389Q363 344 323.5 294Q284 244 284 187Q284 125 343.5 88.5Q403 52 521 52Q576 52 635 5