 359 78Q378 83 390 96Q399 107 404 124.5Q409 142 409 183L409 337L282 337Q220 337 189 331.5Q158 326 141 311Q128 300 123 285Q118 270 118 252Q118 220 135 188Q152 156 180.5 130Q209 104 244.5 88.5Q280 73 317 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M452 586 L451 546 L450 506 L450 465 L450 424 L450 384 L450 343 L450 302 L450 261 L449 221 L447 181 L442 142 L432 106 L413 76 L384 55 L349 44 L311 40 L273 44 L237 54 L202 69 L171 90 L142 116 L118 145 L99 178 L88 213 L84 250 L89 287 L105 318 L131 342 L164 358 L201 367 L201 367" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M201 367 L242 369 L284 370 L326 370 L367 370 L409 371 L450 373" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="450" cy="373" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="289.5" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="289.5" y="198.7">4. run right along the</tspan><tspan x="289.5" y="270.3">bar to the stem</tspan></text></svg><text x="16" y="256.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਰ (raaraa) checkpoints, strokes 1–2</text><text x="16" y="268.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 1014, commit de1e560; Apache-2.0)</text><text x="16" y="281.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
