<svg xmlns="http://www.w3.org/2000/svg" width="982" height="478" viewBox="0 0 982 478" role="img" aria-label="How to write 言: 7 strokes · 6 pen lifts · 8 movements"><title>Writing 言</title><desc>8 frames; frame N shows movements 1 to N of 言 (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/08a00.svg, kanji 言 (U+8A00 CJK UNIFIED IDEOGRAPH-8A00), seven stroke paths kvg:08a00-s1 to s7 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/08a00.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the top mark, a dot drawn down to the right (kvg:type ㇔); s2 to s4 are the long bar and the two short bars, each drawn left to right (㇐); s5 is the box&apos;s left side drawn top to bottom (㇑); s6 is its top drawn left to right, turning down its right side without lifting (㇕b); s7 is its base, drawn left to right (㇐b). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. The Japanese print glyph draws the top mark as a short bar, so the path runs along the bar from left to right.</desc><rect x="0" y="0" width="982" height="478" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="186.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.25" viewBox="-16 -855 1037 1287.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M238 27L767 27L767 -37L238 -37L238 27ZM209 374L792 374L792 311L209 3