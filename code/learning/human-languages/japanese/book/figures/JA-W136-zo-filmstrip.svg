<svg xmlns="http://www.w3.org/2000/svg" width="982" height="482.24" viewBox="0 0 982 482.24" role="img" aria-label="How to write ぞ: 3 strokes · 2 pen lifts · 7 movements"><title>Writing ぞ</title><desc>7 frames; frame N shows movements 1 to N of ぞ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0305e.svg, hiragana ぞ (U+305E HIRAGANA LETTER ZO), three stroke paths kvg:0305e-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0305e.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is そ&apos;s stroke, the same paths as in its file for そ, kanji/0305d.svg; s2 and s3 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. Where the print glyph has no separate ink for the turn back from the bar into the curve, the path doubles back along the bar.</desc><rect x="0" y="0" width="982" height="482.24" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="188.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="188.37" viewBox="2 -839 980 1230.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 747Q250 746 269 745Q288 744 311 744Q325 744 354.5 745Q384 746 421.5 747.5Q459 749 498 751Q537 753 569.5 755Q602 757 619 759Q636 761 650 763.5Q664 766 673 769L724 712Q714 705 697.5 694Q681 683 670 