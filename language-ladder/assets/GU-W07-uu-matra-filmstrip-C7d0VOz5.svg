<svg xmlns="http://www.w3.org/2000/svg" width="502" height="265.58" viewBox="0 0 502 265.58" role="img" aria-label="How to write ૂ: one unbroken stroke · 3 movements"><title>Writing ૂ</title><desc>3 frames; frame N shows movements 1 to N of ૂ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/5_koo.svg, group g1 (stroke g1s0): the uu sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કૂ, and in all 32 consonant rows whose consonant keeps its bare outline, ૂ is one pen-down run that starts low in the middle, curls left and up to the top, then sweeps right and down, ending at the lower right. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: all 83 of its stored prototypes of the uu sign are one stroke; 96% end on the right and 93% move downward overall. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="265.58" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="147.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="147.08" viewBox="-408 -70 617 605" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-178 -268Q-255 -268 -296.5 -230Q-338 -192 -338 -132Q-338 -76 -293 -38Q-248 0 -167 0Q-92 0 -36 -26Q20 -52 62.5 -95Q105 -138 139 -189L78 -228Q23 -151 -32.5 -109.5Q-88 -68 -162 -68Q-214 -68 -239 -86Q-264 -104 -264 -133Q-264 -169 -239.5 -182.5Q-215 -196 -184 -196Q-156 -196 -135 -190.5Q-114 -185 -93 -175L-68 -245Q-94 -255 -122.5 -261.5Q-151 -268 -178 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-88 -208 L-88 -208" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-88 -208 L-130 -226 L-184 -232 L-240 -222 L-285 -185 L-301 -133" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-301" cy="-133" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-99.5" y="457.4" text-anchor="middle" font-size="49.4" fill="#6b7280"><tspan x="-99.5" y="457.4">1. start low and curl to</tspan><tspan x="-99.5" y="517.7">the left</tspan></text></svg><rect x="176" y="42" width="150" height="147.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="147.08" viewBox="-408 -70 617 605" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-178 -268Q-255 -268 -296.5 -230Q-338 -192 -338 -132Q-338 -76 -293 -38Q-248 0 -167 0Q-92 0 -36 -26Q20 -52 62.5 -95Q105 -138 139 -189L78 -228Q23 -151 -32.5 -109.5Q-88 -68 -162 -68Q-214 -68 -239 -86Q-264 -104 -264 -133Q-264 -169 -239.5 -182.5Q-215 -196 -184 -196Q-156 -196 -135 -190.5Q-114 -185 -93 -175L-68 -245Q-94 -255 -122.5 -261.5Q-151 -268 -178 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-88 -208 L-130 -226 L-184 -232 L-240 -222 L-285 -185 L-301 -133 L-301 -133" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-301 -133 L-285 -80 L-232 -42 L-167 -33 L-95 -42" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-95" cy="-42" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-99.5" y="457.4" text-anchor="middle" font-size="49.4" fill="#6b7280"><tspan x="-99.5" y="457.4">2. climb and arch over</tspan><tspan x="-99.5" y="517.7">the top</tspan></text></svg><rect x="336" y="42" width="150" height="147.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="147.08" viewBox="-408 -70 617 605" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-178 -268Q-255 -268 -296.5 -230Q-338 -192 -338 -132Q-338 -76 -293 -38Q-248 0 -167 0Q-92 0 -36 -26Q20 -52 62.5 -95Q105 -138 139 -189L78 -228Q23 -151 -32.5 -109.5Q-88 -68 -162 -68Q-214 -68 -239 -86Q-264 -104 -264 -133Q-264 -169 -239.5 -182.5Q-215 -196 -184 -196Q-156 -196 -135 -190.5Q-114 -185 -93 -175L-68 -245Q-94 -255 -122.5 -261.5Q-151 -268 -178 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-88 -208 L-130 -226 L-184 -232 L-240 -222 L-285 -185 L-301 -133 L-285 -80 L-232 -42 L-167 -33 L-95 -42 L-95 -42" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-95 -42 L-25 -78 L35 -125 L80 -178 L100 -203" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="-203" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-99.5" y="457.4" text-anchor="middle" font-size="49.4" fill="#6b7280"><tspan x="-99.5" y="457.4">3. sweep down to the</tspan><tspan x="-99.5" y="517.7">right</tspan></text></svg><text x="16" y="202.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="214.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/5_koo.svg, group g1 (stroke g1s0):</text><text x="16" y="227.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the uu sign drawn after the consonant (GitHub, 2026)</text><text x="16" y="239.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
