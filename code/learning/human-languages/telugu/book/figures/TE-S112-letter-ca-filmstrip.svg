<svg xmlns="http://www.w3.org/2000/svg" width="662" height="306" viewBox="0 0 662 306" role="img" aria-label="How to write చ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing చ</title><desc>4 frames; frame N shows movements 1 to N of చ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant చ packaged tracing guide res/drawable/dot_stroke_c_2_1_cha.png, movements 1–4 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the short horizontal lead-in as movement 1, joins movements 2–3 around the broad lower bowl, and restarts for the upper flourish as movement 4. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="662" height="306" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="200" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200" viewBox="-45 -795 840 1120" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M543 -12Q502 -12 473 -2Q444 8 421 30.5Q398 53 375 89L395 91Q373 50 347.5 27.5Q322 5 292.5 -3.5Q263 -12 228 -12Q180 -12 143.5 7.5Q107 27 86.5 62.5Q66 98 66 144Q66 178 86.5 215Q107 252 151 274L139 258L25 258L25 332L259 332L259 261Q199 248 173 218Q147 188 147 149Q147 112 170 89.5Q193 67 233 67Q283 67 312.5 99.5Q342 132 346 185L423 185Q426 144 442.5 118Q459 92 484 79.5Q509 67 535 67Q563 67 587.5 77Q612 87 627 114Q642 141 642 192Q642 248 620.5 290.5Q599 333 563.5 362Q528 391 484.5 407Q441 423 397 426L