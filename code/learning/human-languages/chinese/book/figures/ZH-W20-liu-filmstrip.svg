<svg xmlns="http://www.w3.org/2000/svg" width="662" height="311.87" viewBox="0 0 662 311.87" role="img" aria-label="How to write 六: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 六</title><desc>4 frames; frame N shows movements 1 to N of 六 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 六.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%85%AD.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 六. Median 1 is the short top dot, descending to the right; median 2 is the long horizontal that spans the character beneath it; medians 3 and 4 are the two legs, the left one falling to the lower left and the right one falling to the lower right. Top before bottom and left before right, the two rules this course has already used for 三 and 八.</desc><rect x="0" y="0" width="662" height="311.87" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="205.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="205.87" viewBox="-26 -905 1047 1437" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M57 575L946 575L946 498L57 498L57 575ZM308 382L391 356Q354 278 308.5 199.5Q263 121 214 51Q165 -19 119 -74Q110 -67 96.5 -57Q83 -47 68.5 -37.5Q54 -28 44 -22Q92 29 140.5 95Q189 161 232 235Q275 309 308 382ZM604 357L675 390Q710 341 748.5 285.5Q787 230 825 173.5Q863 117 895.5 66Q928 15 951 -25L873 -68Q853 -28 821.5 24Q790 76 753 133.5Q716 191 678 248.5Q640 306 604 357ZM407 810L484 835Q501 803 519.5 765Q538 727 554.5 691.5Q571 656 581 629L500 597Q491 624 475.5 661Q460 698 442 737Q424 776 407 810Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M445 800 L445 800" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M445 800 L470 750 L510 690 L545 635" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="545" cy="635" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="497.5" y="297.9" text-anchor="middle" font-size="83.9" fill="#6b7280"><tspan x="497.5" y="297.9">1. draw the short top</tspan><tspan x="497.5" y="400.3">dot down and to the</tspan><tspan x="497.5" y="502.6">right</tspan></text></svg><rect x="176" y="42" width="150" height="205.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="205.87" viewBox="-26 -905 1047 1437" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M57 575L946 575L946 498L57 498L57 575ZM308 382L391 356Q354 278 308.5 199.5Q263 121 214 51Q165 -19 119 -74Q110 -67 96.5 -57Q83 -47 68.5 -37.5Q54 -28 44 -22Q92 29 140.5 95Q189 161 232 235Q275 309 308 382ZM604 357L675 390Q710 341 748.5 285.5Q787 230 825 173.5Q863 117 895.5 66Q928 15 951 -25L873 -68Q853 -28 821.5 24Q790 76 753 133.5Q716 191 678 248.5Q640 306 604 357ZM407 810L484 835Q501 803 519.5 765Q538 727 554.5 691.5Q571 656 581 629L500 597Q491 624 475.5 661Q460 698 442 737Q424 776 407 810Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M445 800 L470 750 L510 690 L545 635" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M75 536 L75 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M75 536 L250 536 L500 536 L750 536 L930 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="930" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="497.5" y="297.9" text-anchor="middle" font-size="83.9" fill="#6b7280"><tspan x="497.5" y="297.9">2. lift, then draw the</tspan><tspan x="497.5" y="400.3">long horizontal left to</tspan><tspan x="497.5" y="502.6">right</tspan></text></svg><rect x="336" y="42" width="150" height="205.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="205.87" viewBox="-26 -905 1047 1437" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M57 575L946 575L946 498L57 498L57 575ZM308 382L391 356Q354 278 308.5 199.5Q263 121 214 51Q165 -19 119 -74Q110 -67 96.5 -57Q83 -47 68.5 -37.5Q54 -28 44 -22Q92 29 140.5 95Q189 161 232 235Q275 309 308 382ZM604 357L675 390Q710 341 748.5 285.5Q787 230 825 173.5Q863 117 895.5 66Q928 15 951 -25L873 -68Q853 -28 821.5 24Q790 76 753 133.5Q716 191 678 248.5Q640 306 604 357ZM407 810L484 835Q501 803 519.5 765Q538 727 554.5 691.5Q571 656 581 629L500 597Q491 624 475.5 661Q460 698 442 737Q424 776 407 810Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M445 800 L470 750 L510 690 L545 635" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M75 536 L250 536 L500 536 L750 536 L930 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M335 350 L335 350" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M335 350 L300 275 L255 190 L200 105 L125 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="125" cy="-30" r="34" fill="#3b5bdb"/></g><text class