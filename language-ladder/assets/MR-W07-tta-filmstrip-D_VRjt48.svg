<svg xmlns="http://www.w3.org/2000/svg" width="342" height="353.69" viewBox="0 0 342 353.69" role="img" aria-label="How to write ट: 2 strokes · 1 pen lift · 2 movements"><title>Writing ट</title><desc>2 frames; frame N shows movements 1 to N of ट (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ट-order.gif’, strokes 1–2, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9F-order.gif&gt;. Source note on variation: The 17-frame animation shows two ordered pen-down runs over its gray guide: frames 2–11 start at the central stem&apos;s headline junction, descend top-to-bottom, turn left through the upper shoulder, and continue counterclockwise around the open round body to its up-right tip without lifting; frames 12–15 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for one intervening lift. The 250 ms hold at frame 11 marks the body-run ending before the one-second completed frame 16. This learner path follows that sourced two-run order and fits its round body to Noto Sans Devanagari; everyday handwriting may narrow or simplify the curve differently.</desc><rect x="0" y="0" width="342" height="353.69" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="235.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="235.19" viewBox="-70 -692 658 1031.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 551L400 551L400 358L317 358Q225 358 175.5 325Q126 292 126 217Q126 147 172 110.5Q218 74 283 74Q330 74 368.5 89Q407 104 450 135L484 70Q444 37 395.5 18.5Q347 0 282 0Q213 0 160 26.5Q107 53 76.5 102Q46 151 46 218Q46 323 113.5 375.5Q181 428 306 428L348 428L319 404L319 551L0 551L0 622L518 622L518 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M358 551 L358 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M358 551 L358 500 L358 445 L358 395 L330 390 L290 388 L245 382 L200 368 L158 345 L125 312 L100 272 L86 225 L88 178 L105 135 L138 98 L180 72 L228 58 L278 57 L328 66 L375 84 L416 110 L430 125" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="125" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="259" y="192.7" text-anchor="middle" font-size="52.7" fill="#6b7280"><tspan x="259" y="192.7">1. descend the stem and</tspan><tspan x="259" y="257">sweep counterclockwise</tspan><tspan x="259" y="321.3">around the open body</tspan></text></svg><rect x="176" y="42" width="150" height="235.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="235.19" viewBox="-70 -692 658 1031.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 551L400 551L400 358L317 358Q225 358 175.5 325Q126 292 126 217Q126 147 172 110.5Q218 74 283 74Q330 74 368.5 89Q407 104 450 135L484 70Q444 37 395.5 18.5Q347 0 282 0Q213 0 160 26.5Q107 53 76.5 102Q46 151 46 218Q46 323 113.5 375.5Q181 428 306 428L348 428L319 404L319 551L0 551L0 622L518 622L518 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M358 551 L358 500 L358 445 L358 395 L330 390 L290 388 L245 382 L200 368 L158 345 L125 312 L100 272 L86 225 L88 178 L105 135 L138 98 L180 72 L228 58 L278 57 L328 66 L375 84 L416 110 L430 125" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L75 585 L145 585 L215 585 L285 585 L355 585 L425 585 L500 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="500" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="259" y="192.7" text-anchor="middle" font-size="52.7" fill="#6b7280"><tspan x="259" y="192.7">2. lift, then draw the</tspan><tspan x="259" y="257">shirorekha left-to-right</tspan></text></svg><text x="16" y="290.19" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ट-order.gif’, strokes</text><text x="16" y="302.69" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">1–2, Wikimedia Commons, 10 May 2009</text><text x="16" y="315.19" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="327.69" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
