<svg xmlns="http://www.w3.org/2000/svg" width="982" height="296.01" viewBox="0 0 982 296.01" role="img" aria-label="How to write 传: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 传</title><desc>6 frames; frame N shows movements 1 to N of 传 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 传.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BC%A0.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 传, in two pieces. Medians 1–2 draw the person piece as 你 opens. Medians 3–6 draw the right side: a short horizontal and a longer one under it, a stroke that starts above them, runs down through them, turns right and sweeps down to the left without lifting, then a dot at the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="296.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="202.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.51" viewBox="-52 -906 1076 1452.7" preserveAspectRatio="xMidYMid meet" overflow="hidd