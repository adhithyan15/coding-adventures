74 384 64.5Q412 55 452 49Q488 44 513 37.5Q538 31 553 21Q570 9 576.5 -7.5Q583 -24 583 -47Q583 -77 557.5 -111Q532 -145 489.5 -176Q447 -207 394 -229Q316 -262 249 -262Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M548 285 L510 288 L472 270 L430 238 L395 205 L365 168 L345 125 L330 82 L340 45 L375 25 L420 8 L470 -2 L520 -24 L555 -55 L555 -55" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M555 -55 L535 -98 L495 -145 L445 -188 L390 -218 L325 -238 L255 -238 L190 -218 L140 -180 L105 -130 L90 -78 L94 -25 L105 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="326" y="454.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="326" y="454.6">2. continue around the</tspan><tspan x="326" y="518.8">below-baseline bowl and</tspan><tspan x="326" y="582.9">finish at its rising</tspan><tspan x="326" y="647.1">tip without lifting</tspan></text></svg><text x="16" y="300.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="313.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, closing ی demonstration at 02:55–02:58 (Liberal</text><text x="16" y="325.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Arts Instructional Technology Services, Univ. of Texas at</text><text x="16" y="338.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="350.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="363.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
