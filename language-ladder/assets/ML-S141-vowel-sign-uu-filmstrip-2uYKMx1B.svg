<svg xmlns="http://www.w3.org/2000/svg" width="662" height="449.67" viewBox="0 0 662 449.67" role="img" aria-label="How to write ൂ: one unbroken stroke · 4 movements"><title>Writing ൂ</title><desc>4 frames; frame N shows movements 1 to N of ൂ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table III &apos;How to Write Internal Vowel Symbols&apos;, p. xxi: movements 1-4 for ൂ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-031.jpg&gt;. Source note on variation: Moag&apos;s Table III (p. xxi) draws it as four movements to the right of the dash: down the stem from its hook (1), round the left side and bottom of the loop at its foot (2), up the loop&apos;s right side (3) and round the small inner loop (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 25 unique samples jumps between consecutive points the way a lift would; they most often start at the upper left (19 of 25) and end at the lower right (15 of 25). The path is fitted to the bundled Noto Sans Malayalam outline of the sign on its own rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="662" height="449.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="331.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="331.17" viewBox="-96 -636 501 1106.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M154 -227Q70 -227 22 -178.5Q-26 -130 -26 -53Q-26 -2 -3 37Q20 76 60.5 98Q101 120 154 120Q207 120 248 99Q289 78 312 39.5Q335 1 335 -53Q335 -106 312 -145Q289 -184 248 -205.5Q207 -227 154 -227ZM153 57Q106 57 73 29.5Q40 2 40 -54Q40 -109 72.5 -136.5Q105 -164 154 -164Q201 -164 234.5 -136Q268 -108 268 -53Q268 2 234.5 29.5Q201 57 153 57ZM154 -98Q97 -98 69 -65.5Q41 -33 41 19Q41 36 51.5 55Q62 74 81 97L124 68Q106 61 98 47Q90 33 90 21Q90 5 97.5 -6.5Q105 -18 119.5 -24Q134 -30 155 -30Q174 -30 187.5 -24Q201 -18 209 -6.5Q217 5 217 21Q217 31 209.5 43Q202 55 185 63L228 97Q249 73 259 56.5Q269 40 269 18Q269 -11 258 -37.5Q247 -64 222 -81Q197 -98 154 -98ZM104 566Q164 566 198.5 543.5Q233 521 247.5 483Q262 445 262 400Q262 339 244.5 255.5Q227 172 199 84L119 99Q144 185 159 257.5Q174 330 174 395Q174 437 157.5 465.5Q141 494 94 494Q78 494 61.5 491.5Q45 489 34 486L17 555Q33 560 56 563Q79 566 104 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M58 529 L58 529" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M58 529 L126 527 L184 497 L213 437 L218 370 L210 303 L197 236 L182 171 L166 105" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="166" cy="105" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="154.5" y="407.1" text-anchor="middle" font-size="40.1" fill="#6b7280"><tspan x="154.5" y="407.1">1. draw the stem down</tspan><tspan x="154.5" y="456">from the hook</tspan></text></svg><rect x="176" y="42" width="150" height="331