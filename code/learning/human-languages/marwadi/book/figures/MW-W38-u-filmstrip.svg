30 335 L380 325 L420 290 L450 240 L465 180 L450 125 L420 85 L375 55 L325 40 L275 45 L225 65 L180 95 L140 135 L110 180 L85 230 L70 280" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="70" cy="280" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="281.5" y="196.3" text-anchor="middle" font-size="56.3" fill="#6b7280"><tspan x="281.5" y="196.3">2. sweep back through</tspan><tspan x="281.5" y="265">the waist and around the</tspan><tspan x="281.5" y="333.7">lower loop without</tspan><tspan x="281.5" y="402.4">lifting</tspan></text></svg><rect x="336" y="42" width="150" height="237.72" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="237.72" viewBox="-70 -692 703 1114.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L563 622L563 551L0 551L0 622ZM418 563Q444 542 457.5 514Q471 486 471 452Q471 405 445 368.5Q419 332 367.5 310Q316 288 238 283L222 356Q311 364 350.5 386Q390 408 390 458Q390 494 368.5 522Q347 550 312 563L418 563ZM400 346Q453 304 476 261Q499 218 499 168Q499 89 448.5 44.5Q398 0 318 0Q268 0 227 16Q186 32 151.5 68Q117 104 87 163Q57 222 29 308L102 338Q133 241 163 183Q193 125 228 99.5Q263 74 308 74Q355 74 384.5 99Q414 124 414 173Q414 221 389.5 256Q365 291 317 319L400 346Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 555 L390 530 L420 500 L435 460 L420 420 L380 380 L330 345 L275 325 L235 320 L280 325 L330 335 L380 325 L420 290 L450 240 L465 180 L450 125 L420 85 L375 55 L325 40 L275 45 L225 65 L180 95 L140 135 L110 180 L85 230 L70 280" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L95 585 L185 585 L275 585 L365 585 L455 585 L558 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="558" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="281.5" y="196.3" text-anchor="middle" font-size="56.3" fill="#6b7280"><tspan x="281.5" y="196.3">3. lift, then draw the</tspan><tspan x="281.5" y="265">shirorekha left-to-right</tspan></text></svg><text x="16" y="292.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Saurmandal, ‘Devanagari उ stroke order.svg’, panels 1–2, Wikimedia</text><text x="16" y="305.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Commons, 5 August 2023</text><text x="16" y="317.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
