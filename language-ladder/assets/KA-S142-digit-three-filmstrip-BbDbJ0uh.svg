<svg xmlns="http://www.w3.org/2000/svg" width="662" height="332.73" viewBox="0 0 662 332.73" role="img" aria-label="How to write ೩: one unbroken stroke · 4 movements"><title>Writing ೩</title><desc>4 frames; frame N shows movements 1 to N of ೩ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೩, trace image file-m7bd6nf8.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೩ as one path that starts at the inner tip of the upper loop, curls clockwise round it, runs down the stem, circles the lower bowl clockwise and sweeps out along the tail to finish at the lower right (start middle left, end lower right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="662" height="332.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="214.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.23" viewBox="9 -772 756 1079.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M241 330Q308 330 348 300Q388 270 417 228L438 211Q473 155 499.5 124Q526 93 551 81Q576 69 604 69Q618 69 634.5 72.5Q651 76 671 85L695 7Q674 -3 652 -7.5Q630 -12 607 -12Q559 -12 523 6.5Q487 25 457 59Q427 93 398 139L374 173Q349 208 319.5 231.5Q290 255 247 255Q213 255 188.5 236.5Q164 218 164 183Q164 146 185.5 129Q207 112 244 112Q299 112 335 150Q371 188 389 250Q407 312 407 384Q407 504 371 564Q335 624 266 624Q226 624 204 600.5Q182 577 182 545Q182 517 195 501Q208 485 231 485Q250 485 259.5 490Q269 495 272.5 505.5Q276 516 276 530L348 535Q350 531 350.5 524Q351 517 351 510Q351 488 340 465Q329 442 303 426.5Q277 411 232 411Q195 411 164.5 426.5Q134 442 115.5 473Q97 504 97 548Q97 590 117 625Q137 660 175 681Q213 702 268 702Q329 702 372 677.5Q415 653 442 610Q469 567 481.5 512.5Q494 458 494 398Q494 351 487.5 308Q481 265 468.5 228Q456 191 438 160Q402 97 352 66Q302 35 239 35Q170 35 124.5 72.5Q79 110 79 184Q79 252 124.5 291Q170 330 241 330Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M322 506 L322 506" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M322 506 L298 481 L269 462 L235 455 L200 461 L172 480 L155 510 L149 546 L154 582 L170 614 L197 638 L231 652 L268 657 L305 654 L341 642 L374 625" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductu