<svg xmlns="http://www.w3.org/2000/svg" width="982" height="266.98" viewBox="0 0 982 266.98" role="img" aria-label="How to write ஷ: one unbroken stroke · 6 movements"><title>Writing ஷ</title><desc>6 frames; frame N shows movements 1 to N of ஷ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Ratnakar Narale, Learn Tamil Through English/Hindi, Reading and Writing Tamil Granthakshars, Third Tamil Granthakshar ஷ, Sanskrit Hindi Research Institute, p. 13; drawn in one stroke after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 31 (ஷ): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://tamilnavarasam.in/Books/Others/Tamil_eng_hindi.pdf&gt;. Source note on variation: Narale&apos;s chart numbers ஷ&apos;s four parts in order: the inner loop, the outer left body, the joining bar and the right loop with its tail. This ductus used to draw them as four pen-down runs, but a numbered part of a teaching chart is not evidence of a lift. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 175 of the 188 stored prototypes of ஷ (93%) are one pen-down stroke. 170 of the 175 (97%) start at the upper left, inside the small loop, and 174 (99%) turn it clockwise; 126 (72%) turn the right loop clockwise too, and 174 (99%) end in the bottom fifth, at the foot of the tail. So this ductus overrides the four runs: it follows Narale&apos;s four parts in his order without lifting. The bundled Noto Sans Tamil outline spirals out of the inner loop into the outer body, and turns the bar&apos;s right end up and back left into the right loop, so the pen goes round the inner loop, on round the bottom and over the outer body into the bar, along the bar, up its right end and back over to the loop, round the loop and down the tail. The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Tamil handwriting varies by school.</desc><rect x="0" y="0" width="982" height="266.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="148.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="148.48" viewBox="-13 -636 1352 1338.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M909 566Q952 566 982.5 553.5Q1013 541 1032 518.5Q1051 496 1060 467Q1069 438 1069 406Q1069 368 1062.5 327Q1056 286 1044 239L1032 191L912 -284L833 -262L901 8L915 64L957 230Q970 283 976 324.5Q982 366 982 403Q982 447 963 470.5Q944 494 909 494Q868 494 843 466Q818 438 818 382Q818 337 839 308Q860 279 897.5 265.5Q935 252 984 252L1001 252Q1071 252 1116 277.5Q1161 303 1188 328L1269 328L1269 0L780 0L798 72L1188 72L1188 153Q1188 176 1189 201Q1190 226 1192 247Q1163 222 1114 202Q1065 182 999 182L984 182Q930 182 885 194Q840 206 806 231Q772 256 753.5 294Q735 332 735 384Q735 435 755.5 476Q776 517 815 541.5Q854 566 909 566ZM249 -12Q196 -12 152 14.5Q108 41 82.5 97Q57 153 57 243Q57 350 99.5 422Q142 494 212 530Q282 566 364 566Q440 566 494.5 543.5Q549 521 583.5 481.5Q618 442 634.5 390.5Q651 339 651 280Q651 216 637 166Q623 116 603 72L869 72L867 0L515 0L511 63Q534 98 548.5 149.5Q563 201 563 269Q563 340 538 390Q513 440 467.5 466Q422 492 360 492Q290 492 240 458.5Q190 425 163 367.5Q136 310 136 237Q136 170 151.5 130.5Q167 91 193.5 73.5Q220 56 253 56Q279 56 298.5 67.5Q318 79 329 101Q340 123 340 155Q340 205 314 231.5Q288 258 247 258Q207 258 172 237Q13