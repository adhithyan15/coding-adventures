<svg xmlns="http://www.w3.org/2000/svg" width="982" height="321.42" viewBox="0 0 982 321.42" role="img" aria-label="How to write 同: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 同</title><desc>6 frames; frame N shows movements 1 to N of 同 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 同.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%90%8C.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 同. Medians 1–2 build the outer frame, median 3 places the inner horizontal, and medians 4–6 complete 口 inside. This learner path preserves the two joined top-right corners, the outside-before-inside order, the close-last rule for the inner 口, and five intervening pen lifts while adapting the paths to the vendored Noto Sans SC outline.</desc><rect x="0" y="0" width="982" height="321.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="227.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="227.92" viewBox="18 -858 966 1467.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M248 612L756 612L756 547L248 547L248 612ZM299 442L368 442L368 51L299 51L299 442ZM336 442L702 442L702 123L336 123L336 188L632 188L632 378L336 378L336 442ZM88 788L886 788L886 717L161 717L161 -82L88 -82L88 788ZM840 788L914 788L914 15Q914 -19 904.5 -38.5Q895 -58 872 -67Q850 -76 809.5 -78.5Q769 -81 705 -81Q704 -71 699.5 -57.5Q695 -44 689.5 -30.5Q684 -17 678 -8Q725 -9 764 -9Q803 -9 816 -9