<svg xmlns="http://www.w3.org/2000/svg" width="822" height="310.37" viewBox="0 0 822 310.37" role="img" aria-label="How to write 发: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 发</title><desc>5 frames; frame N shows movements 1 to N of 发 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 发.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%91.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 发. Medians 1–2 draw a short stroke that drops and turns right without lifting, then a long left-falling stroke from the top through it; medians 3–4 draw a horizontal that turns and falls to the left without lifting and a right-falling stroke, as on the left of 对; median 5 draws the dot at the upper right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="310.37" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="204.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="204.37" viewBox="-40 -914 1074 1463.3" preserveAspectRatio="x