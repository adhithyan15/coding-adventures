<svg xmlns="http://www.w3.org/2000/svg" width="662" height="292.53" viewBox="0 0 662 292.53" role="img" aria-label="How to write ਨ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ਨ</title><desc>4 frames; frame N shows movements 1 to N of ਨ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਨ (nannaa) checkpoints, strokes 1–4 (lib/data/lessons/lesson_tracing.dart line 785, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L785&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਨ in four pen-down strokes: the headline from left to right; then the short stem from the top down; then from its foot, the left leg down to the bottom; then from the same point, the right leg. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਨ, each by a different non-native copyist copying a printed letter; where the same dataset can be set beside native writers&apos; pen data (HP Labs India&apos;s Devanagari and Bangla sets), the copyists use more strokes than those writers, so their counts are read here only as a ceiling on native lifts, and only counts and shares are cited. Even under that ceiling, 70% (14 of 20) draw ਨ in three strokes, their most common count; 25% (5 of 20) use the source&apos;s four. Those counts say how many strokes, not where they break, so this path keeps every stroke&apos;s order, start and direction and joins the stem and the left leg, since the left leg starts where the stem ends; the right leg still starts again from that point. For the first stroke of the body, 90% (18 of 20) of the copyists start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="292.53" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="186.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.53" viewBox="-77 -692 802 997.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M240 0Q181 0 142 19Q103 38 80.5 68Q58 98 48.5 131.5Q39 165 39 194Q39 271 98.5 338Q158 405 284 438L284 551L-7 551L-7 622L655 622L655 551L364 551L364 438Q491 405 550 338Q609 271 609 194Q609 165 600 131.5Q591 98 568.5 68Q546 38 507 19Q468 0 409 0L404 73Q471 73 500 107Q529 141 529 195Q529 257 477 305Q425 353 324 378Q223 353 171 305Q119 257 119 195Q119 141 148.5 107Q178 73 245 73L240 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L56 586 L97 586 L138 586 L179 586 L220 586 L261 586 L302 586 L343 586 L384 586 L425 586 L466 586 L507 586 L548 586 L589 586 L630 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="630" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324" y="204.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="324" y="204.3">1. draw the headline</tspan><tspan x="324" y="282.7">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="186.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="186.53" viewBox="-77 -692 802 997.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M240 0Q181 0 142 19Q103 38 80.5 68Q58 98 48.5 131.5Q39 165 39 194Q39 271 98.5 338Q158 405 284 438L284 551L-7 551L-7 622L655 622L655 551L364 551L364 438Q491 405 550 338Q609 271 609 194Q609 165 600 131.5Q591 98 568.5 68Q546 38 507 19Q468 0 409 0L404 73Q471 73 500 107Q529 141 529 195Q529 257 477 305Q425 353 324 378Q223 353 171 305Q119 257 119 195Q119 141 148.5 107Q178 73 245 73L240 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L56 586 L97 586 L138 586 L179 586 L220 586 L261 586 L302 586 L343 586 L384 586 L425 586 L466 586 L507 586 L548 586 L589 586 L630 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M332 586 L332 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M332 586 L327 553 L324 519 L324 483 L326 447 L330 412" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="330" cy="412" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324" y="204.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="324" y="204.3">2. lift, then come down</tspan><tspan x="324" y="282.7">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="186.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="186.53" viewBox="-77 -692 802 997.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M240 0Q181 0 142 19Q103 38 80.5 68Q58 98 48.5 131.5Q39 165 39 194Q39 271 98.5 338Q158 405 284 438L284 551L-7 551L-7 622L655 622L655 551L364 551L364 438Q491 405 550 338Q609 271 609 194Q609 165 600 131.5Q591 98 568.5 68Q546 38 507 19Q468 0 409 0L404 73Q471 73 500 107Q529 141 529 195Q529 257 477 305Q425 353 324 378Q223 353 171 305Q119 257 119 195Q119 141 148.5 107Q178 73 245 73L240 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L56 586 L97 586 L138 586 L179 586 L220 586 L261 586 L302 586 L343 586 L384 586 L425 586 L466 586 L507 586 L548 586 L589 586 L630 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M332 586 L327 553 L324 519 L324 483 L326 447 L330 412 L330 412" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M330 412 L295 404 L260 393 L226 380 L193 363 L162 342 L134 317 L112 287 L96 254 L87 218 L85 180 L91 144 L106 110 L128 82 L157 61 L189 53 L222 55" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="222" cy="55" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324" y="204.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="324" y="204.3">3. curve down the left</tspan><tspan x="324" y="282.7">leg</tspan></text></svg><rect x="496" y="42" width="150" height="186.53" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="186.53" viewBox="-77 -692 802 997.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M240 0Q181 0 142 19Q103 38 80.5 68Q58 98 48.5 131.5Q39 165 39 194Q39 271 98.5 338Q158 405 284 438L284 551L-7 551L-7 622L655 622L655 551L364 551L364 438Q491 405 550 338Q609 271 609 194Q609 165 600 131.5Q591 98 568.5 68Q546 38 507 19Q468 0 409 0L404 73Q471 73 500 107Q529 141 529 195Q529 257 477 305Q425 353 324 378Q223 353 171 305Q119 257 119 195Q119 141 148.5 107Q178 73 245 73L240 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L56 586 L97 586 L138 586 L179 586 L220 586 L261 586 L302 586 L343 586 L384 586 L425 586 L466 586 L507 586 L548 586 L589 586 L630 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M332 586 L327 553 L324 519 L324 483 L326 447 L330 412 L295 404 L260 393 L226 380 L193 363 L162 342 L134 317 L112 287 L96 254 L87 218 L85 180 L91 144 L106 110 L128 82 L157 61 L189 53 L222 55" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M334 410 L334 410" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M334 410 L369 399 L403 387 L437 372 L470 353 L500 330 L526 303 L545 271 L558 236 L563 199 L561 161 L550 125 L532 93 L505 68 L473 52 L438 43" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="438" cy="43" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324" y="204.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="324" y="204.3">4. lift, then curve</tspan><tspan x="324" y="282.7">down the right leg</tspan></text></svg><text x="16" y="241.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਨ (nannaa) checkpoints, strokes 1–4</text><text x="16" y="254.03" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 785, commit de1e560; Apache-2.0)</text><text x="16" y="266.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
