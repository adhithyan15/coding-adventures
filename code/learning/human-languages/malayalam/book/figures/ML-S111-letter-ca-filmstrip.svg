nchor="middle" font-size="78.9" fill="#6b7280"><tspan x="439.5" y="218.9">4. climb the upright to</tspan><tspan x="439.5" y="315.2">the top</tspan></text></svg><text x="16" y="202.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin</text><text x="16" y="214.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p.</text><text x="16" y="227.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">xxvi: movements 1-4 for ച, written by hand by Thomas Joseph</text><text x="16" y="239.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
