[package]
name = "x509-rsa-signature-routing"
version = "0.1.0"
edition = "2021"
description = "Profile-index routing for repository-owned X.509 RSA signature verifiers"

[dependencies]
rsa-public-operation = { path = "../rsa-public-operation" }
x509-certificate-policy = { path = "../x509-certificate-policy" }
x509-rsa-algorithm-policy = { path = "../x509-rsa-algorithm-policy" }
x509-rsa-pkcs1-v1-5-sha256-signature = { path = "../x509-rsa-pkcs1-v1-5-sha256-signature" }
x509-rsa-pkcs1-v1-5-sha384-signature = { path = "../x509-rsa-pkcs1-v1-5-sha384-signature" }
x509-rsa-pkcs1-v1-5-sha512-signature = { path = "../x509-rsa-pkcs1-v1-5-sha512-signature" }

[dev-dependencies]
der-asn1 = { path = "../der-asn1" }
x509-certificate = { path = "../x509-certificate" }
x509-rsa-public-key = { path = "../x509-rsa-public-key" }
