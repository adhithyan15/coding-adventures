.5 123.5Q39 186 39 262Q39 328 57 381Q75 434 109.5 478.5Q144 523 194 562L248 501Q213 476 185.5 442.5Q158 409 142.5 365Q127 321 127 262Q127 205 146 159Q165 113 200 86.5Q235 60 282 60Q323 60 349.5 75Q376 90 392 118Q405 141 409 172.5Q413 204 413 263L413 554L499 554L499 263Q499 206 503.5 173.5Q508 141 521 118Q538 89 564 74.5Q590 60 627 60Q673 60 708.5 86.5Q744 113 764 158.5Q784 204 784 262Q784 323 768 367.5Q752 412 724.5 444.5Q697 477 664 499L722 562Q765 528 799 486Q833 444 852.5 389.5Q872 335 872 262Q872 182 841.5 120Q811 58 755.5 23Q700 -12 623 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M191 508 L146 458 L112 399 L91 335 L87 268 L88 200 L110 136 L151 84 L204 41 L269 28 L337 31 L393 66 L439 116 L455 178 L455 245 L455 312 L455 378 L455 445 L455 512 L455 512" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M455 512 L455 446 L455 380 L455 313 L455 247 L455 181 L471 120" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="471" cy="120" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="455.5" y="230" text-anchor="middle" font-size="78" fill="#6b7280"><tspan x="455.5" y="230">3. retrace the stem</tspan><tspan x="455.5" y="325.2">down</tspan></text></svg><rect x="496" y="42" width="150" height="151.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="151.77" viewBox="-31 -632 973 984.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M623 -12Q577 -12 544 1.5Q511 15 488.5 38Q466 61 449 89L462 88Q431 36 388.5 12Q346 -12 281 -12Q204 -12 150 24.5Q96 61 67.5 123.5Q39 186 39 262Q39 328 57 381Q75 434 109.5 478.5Q144 523 194 562L248 501Q213 476 185.5 442.5Q158 409 142.5 365Q127 321 127 262Q127 205 146 159Q165 113 200 86.5Q235 60 282 60Q323 60 349.5 75Q376 90 392 118Q405 141 409 172.5Q413 