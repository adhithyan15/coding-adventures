name: VisiCalc interactions

on:
  pull_request:
    paths:
      - '.github/workflows/visicalc.yml'
      - 'code/programs/typescript/visicalc/**'
      - 'code/programs/typescript/visicalc-html/vendor/spreadsheet-engine-wasm.js'
      - 'code/programs/mosaic/visicalc/**'
      - 'code/packages/mosaic/mosaic-pkg-grid/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/packages/rust/visicalc-mosaic-app/**'
      - 'code/packages/rust/spreadsheet-core/**'
      - 'code/packages/rust/mosmodel-compiler/**'
      - 'code/packages/rust/moslayout-compiler/**'
      - 'code/packages/rust/mosstyle-compiler/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/visicalc.yml'
      - 'code/programs/typescript/visicalc/**'
      - 'code/programs/typescript/visicalc-html/vendor/spreadsheet-engine-wasm.js'
      - 'code/programs/mosaic/visicalc/**'
      - 'code/packages/mosaic/mosaic-pkg-grid/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/packages/rust/visicalc-mosaic-app/**'
      - 'code/packages/rust/spreadsheet-core/**'
      - 'code/packages/rust/mosmodel-compiler/**'
      - 'code/packages/rust/moslayout-compiler/**'
      - 'code/packages/rust/mosstyle-compiler/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visicalc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-edit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: code/programs/typescript/visicalc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux compiler dependencies
        if: runner.os == 'Linux'
        run: bash ../../../scripts/ci/apt-install.sh libcairo2-dev
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the root Mosaic package
        run: cargo test --manifest-path ../../mosaic/visicalc/Cargo.toml
      - name: Test the standard Rust application and native ABI
        run: cargo test --manifest-path ../../../packages/rust/Cargo.toml -p visicalc-mosaic-app
      - name: Build and exercise the standard WASM lifecycle bridge
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path ../../../packages/rust/Cargo.toml -p mosaic-app-conformance -p visicalc-mosaic-app --target wasm32-unknown-unknown
          node --test ../../../packages/rust/mosaic-app-wasm/js/conformance.test.mjs
          node --test ../../../packages/rust/mosaic-app-wasm/js/file-effects.test.mjs
      - name: Regenerate Mosaic controls and test the real WASM engine
        run: npm test
      - name: Check the production build
        run: npm run build

  flutter-typography:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
      - name: Generate typography fixture
        env:
          MOSAIC_FLUTTER_TYPOGRAPHY_OUTPUT: ${{ runner.temp }}/mosaic-flutter-typography
        run: cargo test --manifest-path code/packages/rust/Cargo.toml -p mosaic-emit-flutter --test numeric_typography
      - name: Analyze and exercise generated widgets
        working-directory: ${{ runner.temp }}/mosaic-flutter-typography
        run: |
          flutter pub get
          flutter analyze
          flutter test

  xaml-typography:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Generate and compile two native typography controls
        shell: pwsh
        run: |
          $env:MOSAIC_TYPOGRAPHY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mosaic-typography'
          cargo test --manifest-path code/packages/rust/Cargo.toml -p mosaic-emit-xaml --test numeric_typography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "$env:MOSAIC_TYPOGRAPHY_OUTPUT/Typography.csproj" -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOSAIC_TYPOGRAPHY_RESULT = Join-Path $env:RUNNER_TEMP 'mosaic-typography-result.txt'
          $exe = Join-Path $env:MOSAIC_TYPOGRAPHY_OUTPUT 'bin/x64/Debug/net9.0-windows10.0.19041.0/win-x64/Typography.exe'
          $fixture = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          if (-not $fixture.WaitForExit(60000)) { $fixture.Kill(); throw 'Typography fixture timed out' }
          if (-not (Test-Path $env:MOSAIC_TYPOGRAPHY_RESULT)) { throw 'No native acceptance result' }
          $result = Get-Content $env:MOSAIC_TYPOGRAPHY_RESULT -Raw
          Write-Output $result
          if (-not $result.StartsWith('PASS:')) { throw $result }
