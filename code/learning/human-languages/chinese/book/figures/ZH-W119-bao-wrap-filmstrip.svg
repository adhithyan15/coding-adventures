<svg xmlns="http://www.w3.org/2000/svg" width="822" height="308.3" viewBox="0 0 822 308.3" role="img" aria-label="How to write 包: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 包</title><desc>5 frames; frame N shows movements 1 to N of 包 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 包.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8C%85.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 包, in two pieces. Medians 1–2 draw 勹: a left-falling stroke, then a horizontal that turns down the right side and hooks to the left without lifting. Medians 3–5 draw 巳 inside: a horizontal that turns down without lifting, a horizontal, then a vertical that bends right along the foot and hooks up without lifting, as 也 ends. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns, the two hooks and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="308.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="202.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.3" viewBox="-35 -915 1066 14