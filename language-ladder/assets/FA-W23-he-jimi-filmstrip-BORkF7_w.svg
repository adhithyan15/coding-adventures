<svg xmlns="http://www.w3.org/2000/svg" width="342" height="379.68" viewBox="0 0 342 379.68" role="img" aria-label="How to write ح: one unbroken stroke · 2 movements"><title>Writing ح</title><desc>2 frames; frame N shows movements 1 to N of ح (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ح demonstration at 00:42–00:46 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ح body-first in one continuous Naskh motion: the short upper head travels left to right, then the same pen-down run turns through the hooked descent and deep lower bowl without lifting. Contextual joins reshape the head; this isolated learner path fits the vendored Noto Naskh outline and records Persian-scoped provenance rather than borrowing the separately sourced Arabic or Urdu ح order.</desc><rect x="0" y="0" width="342" height="379.68" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="236.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="236.18" viewBox="-2 -451 691 1088" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M360 -287Q236 -287 168.5 -224Q101 -161 101 -42Q101 20 131.5 81.5Q162 143 216 190Q243 213 272.5 231Q302 249 333 261Q321 266 295.5 274.5Q270 283 242 290Q214 297 192 297Q162 297 140.5 289.5Q119 282 83 259Q77 264 72.5 274.5Q68 285 68 297Q68 335 101.5 358Q135 381 189 381Q232 381 273.5 370Q315 359 357 346Q399 333 442 322Q485 311 531 311L597 313L568 236Q559 235 549.5 234Q540 233 530.5 232.5Q521 232 512 232Q471 229 424 216.5Q377 204 332.5 184Q288 164 251 138Q196 100 166 54Q136 8 136 -42Q136 -94 161 -130.5Q186 -167 236.5 -186Q287 -205 363 -205Q425 -205 486 -197.5Q547 -190 607 -177L619 -210Q570 -237 525.5 -254Q481 -271 440 -279Q399 -287 360 -287Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 315 L110 315" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 315 L150 335 L210 340 L280 325 L350 305 L420 285 L490 270 L540 270" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="540" cy="270" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="482.4" text-anchor="middle" font-size="55.4" fill="#6b7280"><tspan x="343.5" y="482.4">1. draw the short upper</tspan><tspan x="343.5" y="550">head from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="236.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="236.18" viewBox="-2 -451 691 1088" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M360 -287Q236 -287 168.5 -224Q101 -161 101 -42Q101 20 131.5 81.5Q162 143 216 190Q243 213 272.5 231Q302 249 333 261Q321 266 295.5 274.5Q270 283 242 290Q214 297 192 297Q162 297 140.5 289.5Q119 282 83 259Q77 264 72.5 274.5Q68 285 68 297Q68 335 101.5 358Q135 381 189 381Q232 381 273.5 370Q315 359 357 346Q399 333 442 322Q485 311 531 311L597 313L568 236Q559 235 549.5 234Q540 233 530.5 232.5Q521 232 512 232Q471 229 424 216.5Q377 204 332.5 184Q288 164 251 138Q196 100 166 54Q136 8 136 -42Q136 -94 161 -130.5Q186 -167 236.5 -186Q287 -205 363 -205Q425 -205 486 -197.5Q547 -190 607 -177L619 -210Q570 -237 525.5 -254Q481 -271 440 -279Q399 -287 360 -287Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 315 L150 335 L210 340 L280 325 L350 305 L420 285 L490 270 L540 270 L540 270" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M540 270 L490 270 L420 285 L350 305 L280 325 L210 340 L150 335 L110 315 L100 290 L130 305 L170 310 L220 305 L270 285 L320 265 L300 245 L260 220 L216 190 L180 130 L145 65 L118 -42 L130 -110 L180 -175 L225 -200 L300 -245 L400 -245 L500 -230 L575 -210 L608 -195" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="608" cy="-195" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="482.4" text-anchor="middle" font-size="55.4" fill="#6b7280"><tspan x="343.5" y="482.4">2. continue down and</tspan><tspan x="343.5" y="550">around the deep bowl</tspan><tspan x="343.5" y="617.6">without lifting</tspan></text></svg><text x="16" y="291.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="303.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, ح demonstration at 00:42–00:46 (Liberal Arts</text><text x="16" y="316.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Instructional Technology Services, Univ. of Texas at</text><text x="16" y="328.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="341.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="353.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
