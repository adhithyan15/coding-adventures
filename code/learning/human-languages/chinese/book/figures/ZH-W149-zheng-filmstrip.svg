aw the</tspan><tspan x="501" y="359.7">middle vertical</tspan></text></svg><rect x="336" y="42" width="150" height="191.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="191.81" viewBox="-18 -837 1038 1327.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M90 767L917 767L917 693L90 693L90 767ZM523 426L878 426L878 353L523 353L523 426ZM52 38L950 38L950 -35L52 -35L52 38ZM486 739L565 739L565 2L486 2L486 739ZM188 510L265 510L265 -1L188 -1L188 510Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M173 751 L345 719 L422 726 L527 716 L892 746" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M485 752 L524 576 L520 104 L490 -22" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 400 L500 400" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M500 400 L552 396 L563 381 L612 391 L862 389" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="862" cy="389" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501" y="258.2" text-anchor="middle" font-size="83.2" fill="#6b7280"><tspan x="501" y="258.2">3. lift, then draw the</tspan><tspan x="501" y="359.7">short horizontal to its</tspan><tspan x="501" y="461.2">right</tspan></text></svg><rect x="496" y="42" width="150" height="191.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="191.81" viewBox="-18 -837 1038 1327.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M90 767L917 767L917 693L90 693L90 767ZM523 426L878 426L878 353L523 353L523 426ZM52 38L950 38L950 -35L52 -35L52 38ZM486 7