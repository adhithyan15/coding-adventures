<svg xmlns="http://www.w3.org/2000/svg" width="662" height="328.58" viewBox="0 0 662 328.58" role="img" aria-label="How to write খ: one unbroken stroke · 4 movements"><title>Writing খ</title><desc>4 frames; frame N shows movements 1 to N of খ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 12 (খ, kha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 189 of the 212 stored prototypes of kha are one pen-down stroke. 179 of those 189 start on the left, in the curl, and in 169 the curl turns counterclockwise. The stroke then crosses the middle, comes down to the pointed left tip, rounds the lower curve and climbs the stem: 185 end at the top right, and 128 finish with a short move to the right, the flag beside the top of the stem. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="328.58" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="222.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.58" viewBox="-20 -758 761 1129.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M489 0Q437 90 349 153Q261 216 141 232L103 331Q234 349 287 384Q340 419 340 473Q340 498 332 519Q307 4