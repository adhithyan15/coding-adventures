<svg xmlns="http://www.w3.org/2000/svg" width="822" height="295.72" viewBox="0 0 822 295.72" role="img" aria-label="How to write ஐ: one unbroken stroke · 5 movements"><title>Writing ஐ</title><desc>5 frames; frame N shows movements 1 to N of ஐ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Info-farmer, Writing Tamil 10.gif, ஐ stroke-order animation (Wikimedia Commons, CC BY-SA 3.0, 2008), cross-checked with Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I Frame 11 (University of Texas at Austin), p. 194 &lt;https://commons.wikimedia.org/wiki/File:Writing_Tamil_10.gif&gt;. Source note on variation: Info-farmer&apos;s 13-frame animation draws ஐ in five parts in this order: the upper-left spiral, the central upright drawn upward, the upper-right loop returning left across the middle, the lower-left bowl, then the lower-right bowl. The frames sample one movement; they are not evidence of pen lifts. Radhakrishnan&apos;s Appendix I Frame 11 independently numbers the same shape as seven movements. Native writers draw ஐ as one continuous stroke, and this ductus follows the five parts in order without lifting. In the bundled Noto Sans Tamil outline the spiral&apos;s inner end and the central upright&apos;s foot are free ends, so the pen starts inside the spiral and curls outward, runs down the upright to its foot and draws it back up; the lower-left bowl ends at the top of the short centre stem, so the pen comes back down that stem into the lower-right bowl. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 99% of the 169 stored prototypes of ஐ are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="822" height="295.72" fill="#ffffff"/><text x="16" y="31" f