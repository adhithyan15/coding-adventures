pan></text></svg><text x="16" y="250.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Gopala Krishna A, Kannada-alphabet-ai.gif, animation of Kannada</text><text x="16" y="262.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">independent vowel ಐ, 28 frames, 2.8 seconds (Wikimedia Commons, 25 May 2016)</text><text x="16" y="275.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
