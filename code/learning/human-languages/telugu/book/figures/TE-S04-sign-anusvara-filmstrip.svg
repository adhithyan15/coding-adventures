<svg xmlns="http://www.w3.org/2000/svg" width="342" height="375.66" viewBox="0 0 342 375.66" role="img" aria-label="How to write ం: one unbroken stroke · 2 movements"><title>Writing ం</title><desc>2 frames; frame N shows movements 1 to N of ం (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 14 (ం, anusvara): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 103 of the 104 stored prototypes of the anusvara (99%) are one pen-down stroke. All 103 turn anticlockwise, and 101 of them start in the ring&apos;s upper half, so the path starts at the top. The printed ring is open in the middle, so the path runs round the middle of its band. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="342" height="375.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 2 movements</text><rect x="16" y="60.75" width="150" height="213.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="213.41" viewBox="-37 -498 581 826.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M33 208Q33 271 60.5 320.5Q88 370 138 399Q188 428 253 428Q319 428 369 399.5Q419 371 446.5 321Q474 271 474 208Q474 145 447 95.5Q420 46 370.5 17Q321 -12 253 -12Q186 -12 136.5 17Q87 46 60 96Q33 146 33 208ZM115 209Q115 149 150 107.5Q185 66 253 66Q299 66 330 85Q361 104 376.5 136.5Q392 169 392 209Q392 268 355.5 309Q319 350 253 350Q209 350 178 331Q147 312 131 280.5Q115 249 115 209Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M253 389 L253 389" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M253 389 L223 385 L191 376 L159 361 L132 339 L110 311 L93 279 L81 244 L77 208 L81 172 L93 137 L110 105 L132 77 L159 55 L191 40 L223 31 L253 27" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="253" cy="27" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="253.5" y="198.6" text-anchor="middle" font-size="46.6" fill="#6b7280"><tspan x="253.5" y="198.6">1. start at the top of</tspan><tspan x="253.5" y="255.5">the ring and curve down</tspan><tspan x="253.5" y="312.3">its left side</tspan></text></svg><rect x="176" y="60.75" width="150" height="213.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="213.41" viewBox="-37 -498 581 826.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M33 208Q33 271 60.5 320.5Q88 370 138 399Q188 428 253 428Q319 428 369 399.5Q419 371 446.5 321Q474 271 474 208Q474 145 447 95.5Q420 46 370.5 17Q321 -12 253 -12Q186 -12 136.5 17Q87 46 60 96Q33 146 33 208ZM115 209Q115 149 150 107.5Q185 66 253 66Q299 66 330 85Q361 104 376.5 136.5Q392 169 392 209Q392 268 355.5 309Q319 350 253 350Q209 350 178 331Q147 312 131 280.5Q115 249 115 209Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M253 389 L223 385 L191 376 L159 361 L132 339 L110 311 L93 279 L81 244 L77 208 L81 172 L93 137 L110 105 L132 77 L159 55 L191 40 L223 31 L253 27 L253 27" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M253 27 L283 31 L315 40 L347 55 L374 77 L396 105 L413 137 L425 172 L430 208 L425 244 L413 279 L396 311 L374 339 L347 361 L315 376 L283 385 L253 389" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="253" cy="389" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="253.5" y="198.6" text-anchor="middle" font-size="46.6" fill="#6b7280"><tspan x="253.5" y="198.6">2. round the bottom and</tspan><tspan x="253.5" y="255.5">come up the right side</tspan><tspan x="253.5" y="312.3">to close the ring</tspan></text></svg><text x="16" y="287.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic</text><text x="16" y="299.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Character Recognizers 4.0, Telugu recognizer, class 14 (ం,</text><text x="16" y="312.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">anusvara): stored online-handwriting prototypes from native</text><text x="16" y="324.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">writers (MIT licence, 2012)</text><text x="16" y="337.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="349.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
