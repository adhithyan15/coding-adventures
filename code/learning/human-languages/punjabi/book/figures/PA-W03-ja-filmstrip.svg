<svg xmlns="http://www.w3.org/2000/svg" width="822" height="299.83" viewBox="0 0 822 299.83" role="img" aria-label="How to write ਜ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ਜ</title><desc>5 frames; frame N shows movements 1 to N of ਜ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਜ (jajjaa) checkpoints, strokes 1–3 (lib/data/lessons/lesson_tracing.dart line 408, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L408&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਜ in three pen-down strokes: the headline from left to right; then the right stem from the top down; then from the stem, left along the bar, clockwise round the knob and down the left stem to the bottom left. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the knob as a solid teardrop, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਜ, each by a different non-native copyist; only counts and shares are cited. 55% (11 of 20) draw it in three strokes, the source&apos;s count and their most common one. For the first stroke of the body, 85% (17 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="299.83" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="193.83" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="193.83" viewBox="-77 -692 766 989.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M106 0L106 291L88 291Q60 291 48.5 302Q37 313 37 329Q37 353 55 379.5Q73 406 97.5 424Q122 442 144 442Q168 442 177.5 425.5Q187 409 187 387L187 362L442 362L442 551L-7 551L-7 622L619 622L619 551L523 551L523 0L442 0L442 291L187 291L187 0L106 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L56 586 L98 586 L139 586 L180 586 L222 586 L263 586 L304 586 L346 586 L387 586 L429 586 L470 586 L511 586 L553 586 L594 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="594" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="201.4" text-anchor="middle" font-size="61.4" fill="#6b7280"><tspan x="306" y="201.4">1. draw the headline</tspan><tspan x="306" y="276.3">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="193.83" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="193.83" viewBox="-77 -692 766 989.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M106 0L106 291L88 291Q60 291 48.5 302Q37 313 37 329Q37 353 55 379.5Q73 406 97.5 424Q122 442 144 442Q168 442 177.5 425.5Q187 409 187 387L187 362L442 362L442 551L-7 551L-7 622L619 622L619 551L523 551L523 0L442 0L442 291L187 291L187 0L106 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L56 586 L98 586 L139 586 L180 586 L222 586 L263 586 L304 586 L346 586 L387 586 L429 586 L470 586 L511 586 L553 586 L594 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M482 586 L482 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M482 586 L483 548 L483 510 L483 471 L483 431 L483 392 L483 352 L483 312 L483 273 L483 233 L483 194 L483 154 L483 115 L484 76 L486 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="486" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="201.4" text-anchor="middle" font-size="61.4" fill="#6b7280"><tspan x="306" y="201.4">2. lift, then come down</tspan><tspan x="306" y="276.3">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="193.83" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="193.83" viewBox="-77 -692 766 989.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M106 0L106 291L88 291Q60 291 48.5 302Q37 313 37 329Q37 353 55 379.5Q73 406 97.5 424Q122 442 144 442Q168 442 177.5 425.5Q187 409 187 387L187 362L442 362L442 551L-7 551L-7 622L619 622L619 551L523 551L523 0L442 0L442 291L187 291L187 0L106 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L56 586 L98 586 L139 586 L180 586 L222 586