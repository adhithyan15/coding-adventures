<svg xmlns="http://www.w3.org/2000/svg" width="822" height="327.39" viewBox="0 0 822 327.39" role="img" aria-label="How to write ಓ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ಓ</title><desc>5 frames; frame N shows movements 1 to N of ಓ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-oo.gif, animation of Kannada independent vowel ಓ, 35 frames, 3.5 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-oo.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಓ in two pen-down runs: turn around the compact upper-left loop, descend through the curved middle into the joined lower bowls, then climb and curl left at the open terminal; after one lift, sweep left and curl upward through the small upper flourish. The path is fitted to the bundled Noto Sans Kannada outline; handwritten loop width, bowl depth, terminal curl, and flourish shape vary, but the one-lift order remains the same.</desc><rect x="0" y="0" width="822" height="327.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="221.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.39" viewBox="-44 -855 859 1267.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M145 531Q109 558 87.5 589.5Q66 621 66 658Q66 692 81.5 720Q97 748 133 765.5Q169 783 229 785L237 707Q188 706 166.5 691.5Q145 677 145 649Q145 622 164.5 600Q184 578 217 558L145 531ZM561 -12Q500 -12 457.5 14.5Q415 41 380 104L411 104Q388 59 360.5 34Q333 9 298.5 -1.5Q264 -12 218 -12Q162 -12 124 9.5Q86 31 67.5 65Q49 99 49 136Q49 179 65.5 210Q82 241 113 267.5Q144 294 187 321Q225 346 248 368Q271 390 271 422Q271 443 263 458.5Q255 474 237.5 482Q220 490 190 490Q147 490 127 471.5Q107 453 107 422Q107 406 112 391.5Q117 377 127 363L57 332Q41 357 33.5 381.5Q26 406 26 431Q26 466 44 496Q62 526 98.5 544.5Q135 563 191 563Q253 563 288 541.5Q323 520 337.5 488Q352 456 352 423Q352 387 336.5 358.5Q321 330 292.5 305Q264 280 224 254Q178 224 154.5 201Q131 178 131 141Q131 102 157 84.5Q183 67 223 67Q290 67 322 102Q354 137 358 195L434 195Q439 128 475.5 97.5Q512 67 561 67Q616 67 639.5 94.5Q663 122 663 158Q663 189 651.5 216.5Q640 244 620 267L691 313Q717 280 731 243Q745 206 745 160Q745 109 725.5 70.5Q706 32 665.5 10Q625 -12 561 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M125 365 L125 365" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M125 365 L105 400 L105 445 L130 490 L180 525 L235 515 L285 480 L310 435 L305 400" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="305" cy="400" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="385.5" y="220.8" text-anchor="middle" font-size="68.8" fill="#6b7280"><tspan x="385.5" y="220.8">1. turn counterclockwise</tspan><tspan x="385.5" y="304.7">around the compact</tspan><tspan x="385.5" y="388.7">upper-left loop</tspan></text></svg><rect x="176" y="42" width="150" height="221.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.39" viewBox="-44 -855 859 1267.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M145 531Q109 558 87.5 589.5Q66 621 66 658Q66 692 81.5 720Q97 748 133 765.5Q169 783 229 785L237 707Q188 706 166.5 691.5Q145 677 145 649Q145 622 164.5 600Q184 578 217 558L145 531ZM561 -12Q500 -12 457.5 14.5Q415 41 380 104L411 104Q388 59 360.5 34Q333 9 298.5 -1.5Q264 -12 218 -12Q162 -12 124 9.5Q86 31 67.5 65Q49 99 49 136Q49 179 6