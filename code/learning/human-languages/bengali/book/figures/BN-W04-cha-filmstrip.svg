<svg xmlns="http://www.w3.org/2000/svg" width="662" height="325.18" viewBox="0 0 662 325.18" role="img" aria-label="How to write চ: 2 strokes · 1 pen lift · 4 movements"><title>Writing চ</title><desc>4 frames; frame N shows movements 1 to N of চ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 16 (চ, cha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 170 of the 234 stored prototypes draw the body in one pen-down stroke. 140 of those 170 start at the top left, at the stem under the headline, 157 turn counterclockwise (down the stem, round the bottom, up the right side and back over the top) and 132 end in the left half, back at the stem. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 69 of the 234 draw none at all, 75 open with it, 79 end with it and 11 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 153 of the 155 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="325.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="219.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.18" viewBox="-80 -692 698 1019.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 24Q95 24 95 195L95 551L-10 551L-10 622L548 622L548 551L172 551L172 541Q194 487 229.5 464Q265 441 333 434Q420 426 451.5 393Q483 360 483 303Q483 255 463.5 205.5Q444 156 409 115Q374 74 328.5 49Q283 24 232 24ZM172 187Q172 142 186 119Q200 96 237 96Q268 96 297.5 115.5Q327 135 351 166Q375 197 389.5 233Q404 269 404 302Q404 331 388.5 343Q373 355 329 359Q275 364 234.5 381Q194 398 170 441Q171 427 171.5 410Q172 393 172 378L172 187Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M138 572 L138 572" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M138 572 L138 525 L138 479 L134 433 L134 386 L134 340 L134 293 L134 247 L134 200" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="134" cy="200" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="269" y="171.9" text-anchor="middle" font-size="55.9" fill="#6b7280"><tspan x="269" y="171.9">1. start under the</tspan><tspan x="269" y="240.1">headline and come down</tspan><tspan x="269" y="308.3">the stem</tspan></text></svg><rect x="176" y="42" width="150" height="219.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="219.18" viewBox="-80 -692 698 1019.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 24Q95 24 95 195L95 551L-10 551L-10 622L548 622L548 551L172 551L172 541Q194 487 229.5 464Q265 441 333 434Q420 426 451.5 393Q483 360 483 303Q483 255 463.5 205.5Q444 156 409 115Q374 74 328.5 49Q283 24 232 24ZM172 187Q172 142 186 119Q200 96 237 96Q268 96 297.5 115.5Q327 135 351 166Q375 197 389.5 233Q404 269 404 302Q404 331 388.5 343Q373 355 329 359Q275 364 234.5 381Q194 398 170 441Q171 427 171.5 410Q172 393 172 378L172 187Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M138 572 L138 525 L138 479 L134 433 L134 386 L134 340 L134 293 L134 247 L134 200 L134 200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M134 200 L136 155 L148 111 L177 77 L220 64 L265 65 L308 79 L345 105 L377 137 L403 174 L424 215 L437 258 L438 303 L434 348" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="434" cy="348" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="269" y="171.9" text-anchor="middle" font-size="55.9" fill="#6b7280"><tspan x="269" y="171.9">2. round the bottom and</tspan><tspan x="269" y="240.1">climb the right side</tspan></text></svg><rect x="336" y="42" width="150" height="219.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="219.18" viewBox="-80 -692 698 1019.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 24Q95 24 95 195L95 551L-10 551L-10 622L548 622L548 551L172 551L172 541Q194 487 229.5 464Q265 441 333 434Q420 426 451.5 393Q483 360 483 303Q483 255 463.5 205.5Q444 156 409 115Q374 74 328.5 49Q283 24 232 24ZM172 187Q172 142 186 119Q200 96 237 96Q268 96 297.5 115.5Q327 135 351 166Q375 197 389.5 233Q404 269 404 302Q404 331 388.5 343Q373 355 329 359Q275 364 234.5 381Q194 398 170 441Q171 427 171.5 410Q172 393 172 378L172 187Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M138 572 L138 525 L138 479 L134 433 L134 386 L134 340 L134 293 L134 247 L134 200 L136 155 L148 111 L177 77 L220 64 L265 65 L308 79 L345 105 L377 137 L403 174 L424 215 L437 258 L438 303 L434 348" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M434 348 L434 348 L400 379 L356 393 L310 399 L264 409 L223 430 L188 460 L146 480" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="146" cy="480" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="269" y="171.9" text-anchor="middle" font-size="55.9" fill="#6b7280"><tspan x="269" y="171.9">3. turn left over the</tspan><tspan x="269" y="240.1">top and come back to the</tspan><tspan x="269" y="308.3">stem</tspan></text></svg><rect x="496" y="42" width="150" height="219.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="219.18" viewBox="-80 -692 698 1019.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 24Q95 24 95 195L95 551L-10 551L-10 622L548 622L548 551L172 551L172 541Q194 487 229.5 464Q265 441 333 434Q420 426 451.5 393Q483 360 483 303Q483 255 463.5 205.5Q444 156 409 115Q374 74 328.5 49Q283 24 232 24ZM172 187Q172 142 186 119Q200 96 237 96Q268 96 297.5 115.5Q327 135 351 166Q375 197 389.5 233Q404 269 404 302Q404 331 388.5 343Q373 355 329 359Q275 364 234.5 381Q194 398 170 441Q171 427 171.5 410Q172 393 172 378L172 187Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M138 572 L138 525 L138 479 L134 433 L134 386 L134 340 L134 293 L134 247 L134 200 L136 155 L148 111 L177 77 L220 64 L265 65 L308 79 L345 105 L377 137 L403 174 L424 215 L437 258 L438 303 L434 348 L400 379 L356 393 L310 399 L264 409 L223 430 L188 460 L146 480" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L144 586 L268 586 L391 586 L515 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="515" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="269" y="171.9" text-anchor="middle" font-size="55.9" fill="#6b7280"><tspan x="269" y="171.9">4. lift, then draw the</tspan><tspan x="269" y="240.1">headline last, from left</tspan><tspan x="269" y="308.3">to right</tspan></text></svg><text x="16" y="274.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 16 (চ,</text><text x="16" y="286.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">cha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="299.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
