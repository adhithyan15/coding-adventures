<svg xmlns="http://www.w3.org/2000/svg" width="342" height="390.95" viewBox="0 0 342 390.95" role="img" aria-label="How to write ક: 2 strokes · 1 pen lift · 2 movements"><title>Writing ક</title><desc>2 frames; frame N shows movements 1 to N of ક (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ક animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ક as two ordered pen-down runs. Its first SVG path begins at the upper right, circles left around the upper loop, continues diagonally down-right through the middle crossing, then circles the rounded lower body and finishes at the lower left. The animation lifts once and its second SVG path sweeps a separate diagonal cross-stroke from lower left to upper right. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the upper loop, central diagonal, rounded lower body, and crossing diagonal, but its printed loops are broader and the crossing more angular than the animated school-hand form. This learner path preserves the source&apos;s joined-loop-body-before-diagonal-cross-stroke order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loops, diagonal, and terminals differently.</desc><rect x="0" y="0" width="342" height="390.95" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="259.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-widt