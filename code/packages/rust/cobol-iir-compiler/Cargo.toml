[package]
name = "cobol-iir-compiler"
version = "0.70.0"
edition = "2021"
description = "COBOL-60 frontend for the LANG VM AOT chain — lowers a parsed COBOL program into interpreter_ir::IIRModule so it runs on every execution backend. v0.49.0 supports STRING … DELIMITED BY a single-character ASCII delimiter — STRING \"ab,cd\" \"ef\" DELIMITED BY \",\" INTO t → \"abef\" — where each sending field contributes only its prefix up to its first delimiter char (a field with no delimiter is taken whole; a field starting with the delimiter contributes the empty string), byte-identical to the runtime 0.53.0 oracle. The DELIMITED BY SIZE path is unchanged (all compile-time lengths); the delimited path emits a per-field scan loop (flen = str_len(F); j = 0; while j < flen && F[j] != d { j++ }; prefix = F[0,j]) and a run-time no-space-fill overlay (take = min(str_len(concat), W); t = concat[0,take] ++ t[take,W]). The delimiter is reduced by the SAME single_delim_code UNSTRING uses; a non-ASCII literal delimiter and a non-ASCII string-literal sending field under a delimiter are rejected (byte-vs-char) matching the oracle, while a multi-character delimiter, per-field different delimiters, WITH POINTER, ON OVERFLOW, and a numeric receiver stay later rungs. This SUPERSEDES the earlier \"STRING with a real delimiter is a later rung\" deferral. v0.48.0 supports UNSTRING with an alphanumeric STRING-LITERAL source — UNSTRING \"a,b,c\" DELIMITED BY \",\" INTO w1 w2 w3 — accepted in the source position (no grammar change; the grammar already parses a literal operand there, so this is a read-time acceptance only), byte-identical to the runtime 0.52.0 oracle. Only the character PROVIDER differs: emit_unstring obtains its string register from an item's char register (identifier source) OR, for a string literal, from a fresh str_const of the literal's bytes, which the SAME scan-and-fill loop reads (str_len/str_index/str_slice treat a str_const register exactly like an item register); the delimiter scan and per-receiver truncate/pad reshape are unchanged and shared. Only an ASCII literal is accepted — the oracle scans a literal by character while the byte-based IIR string ops agree only for one-byte chars, so emit_unstring rejects a non-ASCII literal (if !s.is_ascii()) with the same message as the oracle, keeping the accept/reject sets co-total. A NUMERIC-literal source (UNSTRING 123 …), a FIGURATIVE source (UNSTRING SPACE …), a NON-ASCII string-literal source (UNSTRING \"café\" …) — only an ASCII alphanumeric string literal is supported — and a reference-modified source stay later rungs, rejected on both engines. v0.47.0 supports INSPECT source TALLYING c1 FOR ALL a [ALL b …] c2 FOR ALL d … — TWO OR MORE tally_for groups, each with its OWN counter and one-or-more single-char ALL delimiters — lowered as ONE left-to-right runtime scan over a COMBINED priority list across all counters (the ISO rule): at each position the delimiters are tried in written order (group-1's items first, then group-2's, …) and the FIRST match bumps ITS OWN group's accumulator then the scan advances, so a position CLAIMED by an earlier group NEVER reaches a later group (INSPECT \"aa\" TALLYING C1 FOR ALL \"a\" C2 FOR ALL \"a\" gives C1 += 2, C2 += 0). emit_inspect_tally_counters keeps one accumulator per GROUP through a single top:/end: loop, then folds counter := counter + accumulator per group via the same store_scaled the single-item tally uses (re-reading each counter's register so two groups naming the SAME counter both add to it), byte-identical to the runtime 0.51.0 oracle. A new inspect_tally_counters CST reader walks the same tally_for/tally_item children the oracle walks so the two engines' accept/reject sets are co-total; the path is ALL-only single-char with no BEFORE/AFTER region and no LEADING/CHARACTERS, every counter an unsigned integer PIC 9(n), and the combined TALLYING … REPLACING form with several counters stays a later rung; exactly ONE tally_for keeps the single-counter paths unchanged. v0.46.0 supports INSPECT source TALLYING counter FOR ALL a ALL b [ALL d …] — TWO OR MORE ALL tally items under ONE counter — lowered as a single left-to-right runtime scan with FIRST-MATCH-PER-POSITION into the shared counter: at each position the delimiters are tried in written order and the FIRST match bumps the count by 1 then the scan advances, so DUPLICATE delimiters never double-count (FOR ALL \"a\" ALL \"a\" over \"aa\" adds 2, not 4). Net the count is the number of source positions whose char equals SOME delimiter, each counted once, ADDED to the counter (INSPECT adds; it does not clear). emit_inspect_tally_multi emits a genuine runtime top:/end: loop over str_len(S) (the tally builds no fixed-width string, so the length is a runtime value) with an ordered cmp_eq chain per position (first match bumps cnt and jumps past the rest to the continue label; no match falls through), then folds counter := counter + cnt via the same store_scaled the single-item tally uses, byte-identical to the runtime 0.50.0 oracle. A new inspect_tally_multi CST reader counts the same tally_item children the oracle counts so the two engines' accept/reject sets are co-total. The multi path is ALL-only, single-char, with no BEFORE/AFTER region and no LEADING/CHARACTERS, under EXACTLY ONE counter; a multi-item list carrying any of those, SEVERAL counters (more than one FOR phrase group), and the combined TALLYING … REPLACING form with several tally items stay later rungs; a single tally item keeps the full single-item path (LEADING, region). v0.45.0 supports INSPECT source REPLACING ALL a BY x ALL b BY y [ALL c BY z …] — TWO OR MORE ALL replace items in ONE REPLACING clause — lowered as a single left-to-right per-position rebuild with FIRST-MATCH-WINS and NO RE-CHAINING (each position takes the first item, in written order, whose single-char search matches the ORIGINAL s[j]; the produced byte is never re-examined, so REPLACING ALL \"a\" BY \"b\" ALL \"b\" BY \"z\" over \"ab\" is \"bz\", not \"zz\"), byte-identical to the runtime 0.49.0 oracle. emit_inspect_replacing_multi unrolls over the width and emits an ordered if-else chain per position (append the first matching item's replacement, jump to the position done label; else the original char), and a new inspect_replacing_multi CST reader counts the same replace_item children the oracle counts so the two engines' accept/reject sets are co-total. The multi path is ALL-only, single-char, with no BEFORE/AFTER region and no LEADING/CHARACTERS/FIRST; a multi-item list carrying any of those, and the combined TALLYING … REPLACING form with several items, stay later rungs; a single replace item keeps the full single-item path. v0.44.0 supports the STANDALONE INSPECT … FOR LEADING and REPLACING LEADING with a BEFORE/AFTER region, byte-identical to the runtime oracle. The leading scan/substitution is ANCHORED at the window start: emit_inspect_tallying seats the count loop counter at the window start and bounds it by the window end (skipping the per-position region guard) so FOR LEADING counts the run beginning mid-window; emit_inspect_replacing threads use_repl = active AND eq AND in_region and decays the run only on an IN-WINDOW mismatch (active := active AND (eq OR NOT in_region)) so positions before the window neither begin nor break the run. The FOR ALL + region lowerings are untouched (byte-identical). A new allow_leading_region flag re-imposes the deferral for the COMBINED TALLYING … REPLACING form, whose LEADING half with a region stays a later rung with the same messages. v0.33.0 extends the mixed numeric↔alphanumeric COMPARISON (IF NUM = \"str\", <, >, … in IF/EVALUATE/any condition) to a SIGNED numeric operand (PIC S9(i)V9(d), integer or scaled), not only an unsigned one. When a signed DISPLAY numeric is compared against an alphanumeric operand, its comparison image is its (i+d)-digit zero-padded MAGNITUDE with the operational sign folded into a TRAILING OVERPUNCH on the units (last) digit — the SAME image the signed numeric→alphanumeric MOVE (v0.32.0) produces (units u maps positive {ABCDEFGHI, negative }JKLMNOPQR). So PIC S9(3) = -123 compares equal to \"12L\", = +123 equal to \"12C\", scaled PIC S9V9 = -4.2 equal to \"4K\"; ordering follows the byte comparison of those images. num_digit_str_operand's signed arm (previously a clean Unsupported) now returns StrOperand::Fixed{ reg: emit_signed_num_alpha_image(&num_reg, i+d), len: i+d } — the exact overpunched-image builder the signed MOVE uses — and both operands flow through the identical space-padded str_cmp an all-alphanumeric relation takes, so the byte comparison matches the oracle (whose overpunch_trailing yields the same image). A value truncating to a zero magnitude stores neg=false (no negative zero), so the zero-slot image is \"00{\" on both engines. The unsigned path and pure numeric-vs-numeric path are byte-identical to before. A numeric LITERAL vs alphanumeric (a different pairing, out of scope) and a group item in a mixed comparison remain clean later rungs; no grammar/lexer/parser change was needed. v0.31.0 extends the REVERSE cross-category MOVE (alphanumeric → numeric) to an UNSIGNED SCALED receiver PIC 9(i)V9(d) (d>0), not only an unsigned integer. The source's m characters fold into an unsigned integer V (V = V*10 + (byte-'0'), left to right), and that fold IS the receiver's scaled-slot magnitude directly — it fills the (i+d) digit positions RIGHT-justified with the implied point d places from the right, so the slot = V mod 10^(i+d) (left-zero-padded when the source is shorter than i+d, high-order-truncated when longer). This is NOT the arithmetic decimal-align rule: V is not multiplied by 10^d. The compiler folds V exactly as for the integer receiver, then hands store_scaled the receiver's OWN scale d as the value scale, so store_scaled rescales d→d (a no-op — no shift) and keeps the low-order (i+d) digits (mag mod 10^(i+d)) = V mod 10^(i+d); passing scale 0 would wrongly up-shift by 10^d. For d=0 this reproduces the old integer-receiver path byte-for-byte. So MOVE \"042\" TO 9(2)V9 is slot 042 (reads 4.2), MOVE \"42\" TO 9(2)V9 is 042, MOVE \"12345\" TO 9(2)V9 is 345 (reads 34.5). Byte-identical to the oracle, which folds the identical arithmetic and splits the fold at scale d for move_into_numeric. A SIGNED (PIC S9) receiver, a source wider than 18 characters, and group items remain clean later rungs; no grammar/lexer/parser change was needed. v0.30.0 extended the numeric→alphanumeric MOVE and the mixed numeric↔alphanumeric comparison to an UNSIGNED SCALED numeric operand (PIC 9(i)V9(d), d>0, no S). A scaled numeric moved to / compared as alphanumeric uses its digit image = ALL its digits, integer part followed by fractional part, concatenated with NO decimal point — the (i+d)-digit zero-padded magnitude the scaled i64 slot already holds (value * 10^d), exactly what the oracle's Decimal::digits() = int+frac yields. So PIC 9(2)V9 = 4.2 → \"042\", PIC 9(1)V99 = 3.14 → \"314\"; MOVE 9(2)V9=4.2 TO X(3) is \"042\", X(5) is \"042  \", X(2) is \"04\"; IF F = \"042\" is TRUE and IF F > \"040\" is TRUE. emit_num_digit_string is reused unchanged over n = int_digits + dec_digits digits (the same div/mod/table-slice loop, no point inserted); both the MOVE arm and num_digit_str_operand relax their dec_digits==0 gate to accept dec_digits>0 when unsigned. A SIGNED (PIC S9) scaled/integer operand, the REVERSE alphanumeric→scaled-receiver MOVE, a numeric-edited receiver, and group items remain clean later rungs; no grammar/lexer/parser change was needed. v0.29.0 adds NUMERIC ↔ ALPHANUMERIC comparison: a relational condition (in IF / EVALUATE / any condition context) comparing an UNSIGNED-INTEGER numeric operand (PIC 9(n), no S, no V) with an ALPHANUMERIC operand (a PIC X item OR a string literal). Per COBOL, when a numeric and a non-numeric operand are compared, the numeric operand is treated as though moved to an alphanumeric field — its n-digit zero-padded digit image, exactly the image emit_num_digit_string builds for a numeric→alphanumeric MOVE — and the comparison proceeds by the ALPHANUMERIC byte rule: the shorter operand is space-padded on the right to the longer's length, then the two are compared byte-by-byte via str_cmp (so IF NUM = \"042\" with NUM PIC 9(3)=42 is TRUE, but IF NUM = \"42\" is FALSE because \"042\" vs \"42 \" differ, and IF NUM > \"040\" is TRUE). The compiler builds the numeric side's digit image (reusing emit_num_digit_string) and feeds BOTH operands through the SAME str_cmp / space-pad-to-common-length path (emit_str_operand / emit_str_condition) a same-category alphanumeric relation uses, so the byte comparison is byte-identical to the oracle (whose Decimal::digits() yields the same image and whose compare_operands runs the same space-padded byte compare). The numeric operand may be on either side, and the alphanumeric side may be a PIC X item or a string literal. A SIGNED (PIC S9) or SCALED (PIC 9V9) or edited numeric operand, a group item on either side, and a numeric-literal-vs-alphanumeric pairing (a different pairing, kept out of scope) remain clean later rungs; no grammar/lexer/parser change was needed. v0.28.0 adds the REVERSE cross-category MOVE: MOVE alphanumeric-item TO numeric-item for an alphanumeric source (PIC X(m)) into an UNSIGNED INTEGER receiver (PIC 9(n), no S, no V). COBOL reads the source's m characters as an unsigned integer and de-scales it into the receiver RIGHT-justified — the receiver keeps the low-order n digits (left-zero-padded when the source has fewer than n digits, high-order-truncated when more), i.e. receiver = (integer formed from the m source chars) mod 10^n (so X(3)=\"042\" → 9(3) is 42, X(2)=\"05\" → 9(4) is 0005, X(5)=\"12345\" → 9(3) is 345). The compiler folds the m bytes left-to-right into an i64 — for each character d = str_index(src,k) - '0'; value = value*10 + d (mul/add/sub/const over i64) — then stores value through the SAME numeric-store helper (store_scaled at scale 0) a numeric MOVE/COMPUTE uses, which applies the receiver-width truncation (mod 10^n), so it is byte-identical to the oracle (which folds the identical per-character arithmetic and stores via move_into_numeric at scale 0). This rung scopes to an ALL-DIGIT source: a non-digit byte runs the identical (byte - '0') arithmetic on both engines (defined-but-unspecified, so no reject is needed and no test exercises it), and a source wider than 18 characters — whose fold could overflow the i64 intermediate — is a clean later rung rejected identically on both engines. A SIGNED (PIC S9) or SCALED (PIC 9V9) or edited numeric receiver, and a group item on either side, remain clean later rungs. v0.27.0 adds the first CROSS-category MOVE: MOVE numeric-item TO alphanumeric-item for an UNSIGNED INTEGER source (PIC 9(n), no S, no V) into a PIC X(m) receiver. COBOL treats the numeric sending item as though it held its digit characters — the n-digit zero-padded magnitude image DISPLAY shows — then moves it by the alphanumeric rules: LEFT-justified, space-padded on the right when the receiver is wider, truncated on the right when narrower (so PIC 9(3)=042 → X(5) is \"042  \", → X(2) is \"04\", → X(3) is \"042\"). The compiler builds the n-character digit string at run time from the numeric slot — each digit is (slot / 10^k) % 10, sliced out of a constant \"0123456789\" table via str_slice[d,d+1) and concatenated — then feeds it through the SAME str_slice/str_concat char reshape a same-category alphanumeric MOVE emits, so it is byte-identical to the oracle (which takes Decimal::digits() through move_into_char). The reverse direction (alphanumeric → numeric), a signed (PIC S9) or scaled (PIC 9V9) or edited numeric source, a numeric-edited receiver, and a group item on either side remain clean later rungs. v0.26.0 adds COMPUTED reference modification IDENT(start:len) where start and/or len are DATA-NAME (run-time integer) operands — WS(J:K), WS(J:), WS(2:K) — lowering to a run-time str_slice(src, start0, end) with start0 = start-1 and end = start0+len (or the item width for an omitted length) computed via sub/add over the index registers; the index item must be an unsigned integer. An out-of-range computed refmod traps at run time under the identical predicate the str_slice VM/wasm bounds check enforces (start0 < 0 || end < start0 || end > width), and the oracle applies the same predicate (returning RefModOutOfRange), so an in-range program slices byte-identically and an out-of-range one errors on both engines. A literal:literal refmod is still constant-folded exactly as before. A signed/fractional/non-numeric index item, reference modification of a numeric item, and use in a numeric/MOVE-source context remain later rungs. v0.25.0 adds INSPECT source CONVERTING from TO to (translate every character of an alphanumeric source through a per-character table built from two equal-length string literals — a character equal to from[k] becomes to[k], first occurrence wins, others unchanged — via a compile-time unroll over the source width with a first-match-wins chain per position, byte-identical to the oracle's char→char map; unequal-length or non-ASCII literals, a data-name/figurative/reference-modified from/to, and a BEFORE/AFTER region remain later rungs). v0.24.0 adds the combined INSPECT source TALLYING counter FOR ALL delim REPLACING ALL x BY y (one INSPECT carrying BOTH phrases), which composes the two existing lowerings in ISO order — count FIRST over the original source bytes into the counter, then rewrite the source — so a shared delimiter/search character is tallied before it is substituted. v0.23.0: DISPLAY / MOVE / STOP RUN, integer + scaled-decimal (PIC …V…) ADD/SUBTRACT/MULTIPLY/DIVIDE with ROUNDED and ON SIZE ERROR, numeric and character item-to-item MOVE reshaping, reference modification IDENT(start:len) / IDENT(start:) with constant integer indices in DISPLAY and alphanumeric-comparison contexts (constant-index str_slice), STRING … DELIMITED BY SIZE INTO (concatenate sending fields into an alphanumeric receiver, left-justified, truncated at the receiver width, with the ANSI-85 no-space-fill tail), UNSTRING source DELIMITED BY delim INTO r1 [r2 …] (split one alphanumeric source on a single-character delimiter — a 1-char literal or a PIC X(1) item — into successive receivers via a run-time scan loop; each receiver including the last takes the field up to the next delimiter, extra fields are dropped, empty fields become spaces, and once the source is exhausted the remaining receivers are left unchanged), INSPECT source TALLYING counter FOR ALL delim (a run-time scan loop counting the occurrences of a single-character delimiter — a 1-char literal or a PIC X(1) item — in an alphanumeric source and ADDING them to an unsigned-integer counter, byte-identical to the oracle's store path), INSPECT source REPLACING ALL x BY y (rebuild the alphanumeric source in place, mapping every occurrence of the single character x — a 1-char literal or PIC X(1) item — to the single character y, via a compile-time unroll over the source width matching the oracle's per-position map), IF/ELSE with compound (AND/OR/NOT, parenthesised) conditions over numeric and alphanumeric (space-padded) relations using word or symbolic (> < = >= <= <>) operators and level-88 condition-names (single value, multiple values, and THRU ranges) with SET … TO TRUE, GO TO and PERFORM (paragraph / TIMES / UNTIL / VARYING / THRU), EVALUATE (case statement, numeric or alphanumeric subject, with multi-value and THRU-range WHENs), COMPUTE with operator precedence, exponentiation (** with a constant integer exponent), and nested division (scale-12 intermediate matching the oracle), and signed numerics (PIC S9…, trailing overpunch DISPLAY) — over scaled-i64 slots and str slots, byte-identical to the cobol-runtime oracle. Group items, cross-category MOVE, a signed/fractional/non-numeric reference-modification index item or reference modification of a numeric item or in a numeric/MOVE-source context, a variable/fractional ** exponent, ON-SIZE-ERROR-with-nested-division, alphanumeric level-88 condition-names, figuratives, STRING with a real delimiter / WITH POINTER / ON OVERFLOW, UNSTRING with a multi-character / ALL / OR delimiter or WITH POINTER / ON OVERFLOW, INSPECT with a LEADING / CHARACTERS tally, BEFORE/AFTER phrases, several counters or FOR phrases, REPLACING CHARACTERS / LEADING / FIRST, several replace items, and a combined statement whose TALLYING or REPLACING half is itself a deferred sub-form, and the other string verbs remain later rungs. See PL09-codegen.md."

[dependencies]
coding-adventures-cobol-parser  = { path = "../cobol-parser" }
# Reused for its exact PICTURE and fixed-point-value logic (Picture / Decimal /
# move_into_char / move_into_numeric) — not its interpreter (PL09).
coding-adventures-cobol-runtime = { path = "../cobol-runtime" }
parser         = { path = "../parser" }
interpreter-ir = { path = "../interpreter-ir" }

[dev-dependencies]
# tests/backend_compat.rs proves the compiled module is accepted by
# every IIR-to-* backend validator.
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/jit_e2e.rs runs the compiled module through the generic VM/JIT and
# checks the DISPLAYed bytes against the cobol-runtime oracle.
vm-core  = { path = "../vm-core" }
jit-core = { path = "../jit-core" }
