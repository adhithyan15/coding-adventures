<svg xmlns="http://www.w3.org/2000/svg" width="502" height="261.94" viewBox="0 0 502 261.94" role="img" aria-label="How to write ഫ: one unbroken stroke · 3 movements"><title>Writing ഫ</title><desc>3 frames; frame N shows movements 1 to N of ഫ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxix: movements 1-3 for ഫ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-039.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxix) starts at the foot of the small arch and climbs clockwise over it to the base (1), runs right along the base (2), then climbs the right leg, arches anticlockwise over the top and comes down the inner leg to the base (3). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 37 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (27 of 37) and end at the lower centre (27 of 37). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its PHA.png at the lower left and ends it at the lower centre. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="502" height="261.94" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="130.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="130.94" viewBox="-38 -636 1174 1024.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M229 346Q297 346 340.5 320.5Q384 295 405.5 255.5Q427 216 427 173Q427 133 414 102Q401 71 382 57L357 70L634 70L634 0L328 0L299 52Q319 72 331 96.5Q343 121 343 158Q343 212 314 244Q285 276 229 276Q194 276 168.5 260.5Q143 245 129.5 220Q116 195 116 164Q116 130 130 101.5Q144 73 175 51L129 -7Q86 23 59 66Q32 109 32 166Q32 219 56.5 259.5Q81 300 125.5 323Q170 346 229 346ZM816 566Q878 566 924 549Q970 532 1001 501Q1035 468 1050.5 419Q1066 370 1066 292L1066 0L573 0L573 292Q573 347 580 385.5Q587 424 601.5 452Q616 480 638 502Q669 532 713.5 549Q758 566 816 566ZM817 494Q780 494 751.5 482.5Q723 471 703 451Q682 429 670.5 391.5Q659 354 659 279L659 70L980 70L980 271Q980 345 968 387Q956 429 934 451Q914 471 886 482.5Q858 494 817 494Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 45 L124 45" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 45 L85 106 L76 177 L100 244 L153 293 L223 309 L295 300 L351 254 L382 190 L379 118 L360 49" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="360" cy="49" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="549" y="241.1" text-anchor="middle" font-size="94.1" fill="#6b7280"><tspan x="549" y="241.1">1. climb clockwise over</tspan><tspan x="549" y="355.9">the small arch</tspan></text></svg><rect x="176" y="42" width="150" height="130.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="130.94" viewBox="-38 -636 1174 1024.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M229 346Q297 346 340.5 320.5Q384 295 405.5 255.5Q427 216 427 173Q427 133 414 102Q401 71 382 57L357 70L634 70L634 0L328 0L299 52Q319 72 331 96.5Q343 121 343 158Q343 212 314 244Q285 276 229 276Q194 276 168.5 260.5Q143 245 129.5 220Q116 195 116 164Q116 130 130 101.5Q144 73 175 51L129 -7Q86 23 59 66Q32 109 32 166Q32 219 56.5 259.5Q81 300 125.5 323Q170 346 229 346ZM816 566Q878 566 924 549Q970 532 1001 501Q1035 468 1050.5 419Q1066 370 1066 292L1066 0L573 0L573 292Q573 347 580 385.5Q587 424 601.5 452Q616 480 638 502Q669 532 713.5 549Q758 566 816 566ZM817 494Q780 494 751.5 482.5Q723 471 703 451Q682 429 670.5 391.5Q659 354 659 279L659 70L980 70L980 271Q980 345 968 387Q956 429 934 451Q914 471 886 482.5Q858 494 817 494Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 45 L85 106 L76 177 L100 244 L153 293 L223 309 L295 300 L351 254 L382 190 L379 118 L360 49 L360 49" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M360 49 L431 37 L505 37 L579 37 L650 38 L724 37 L798 37 L871 37 L945 37 L1016 49" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="1016" cy="49" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="549" y="241.1" text-anchor="middle" font-size="94.1" fill="#6b7280"><tspan x="549" y="241.1">2. run right along the</tspan><tspan x="549" y="355.9">base</tspan></text></svg><rect x="336" y="42" width="150" height="130.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="130.94" viewBox="-38 -636 1174 1024.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M229 346Q297 346 340.5 320.5Q384 295 405.5 255.5Q427 216 427 173Q427 133 414 102Q401 71 382 57L357 70L634 70L634 0L328 0L299 52Q319 72 331 96.5Q343 121 343 158Q343 212 314 244Q285 276 229 276Q194 276 168.5 260.5Q143 245 129.5 220Q116 195 116 164Q116 130 130 101.5Q144 73 175 51L129 -7Q86 23 59 66Q32 109 32 166Q32 219 56.5 259.5Q81 300 125.5 323Q170 346 229 346ZM816 566Q878 566 924 549Q970 532 1001 501Q1035 468 1050.5 419Q1066 370 1066 292L1066 0L573 0L573 292Q573 347 580 385.5Q587 424 601.5 452Q616 480 638 502Q669 532 713.5 549Q758 566 816 566ZM817 494Q780 494 751.5 482.5Q723 471 703 451Q682 429 670.5 391.5Q659 354 659 279L659 70L980 70L980 271Q980 345 968 387Q956 429 934 451Q914 471 886 482.5Q858 494 817 494Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 45 L85 106 L76 177 L100 244 L153 293 L223 309 L295 300 L351 254 L382 190 L379 118 L360 49 L431 37 L505 37 L579 37 L650 38 L724 37 L798 37 L871 37 L945 37 L1016 49 L1016 49" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M1016 49 L1022 119 L1024 189 L1024 260 L1020 330 L1010 399 L975 458 L923 506 L856 526 L786 528 L718 510 L666 463 L630 403 L617 334 L616 264 L616 194 L616 123 L616 53" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="616" cy="53" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="549" y="241.1" text-anchor="middle" font-size="94.1" fill="#6b7280"><tspan x="549" y="241.1">3. climb, arch over and</tspan><tspan x="549" y="355.9">come down</tspan></text></svg><text x="16" y="185.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar</text><text x="16" y="198.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC</text><text x="16" y="210.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxix: movements 1-3 for ഫ,</text><text x="16" y="223.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">written by hand by Thomas Joseph</text><text x="16" y="235.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
