<svg xmlns="http://www.w3.org/2000/svg" width="982" height="280.14" viewBox="0 0 982 280.14" role="img" aria-label="How to write щ: one unbroken stroke · 6 movements"><title>Writing щ</title><desc>6 frames; frame N shows movements 1 to N of щ (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase щ demonstration, 10:17–10:25, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 10:17–10:25 lowercase щ demonstration, the pen begins at the upper left, descends the left stem to the baseline, turns through a rounded diagonal join and rises to the top of the middle stem, descends the middle stem, turns through a second rounded diagonal join and rises to the top of the right stem, descends the right stem, and continues directly into a small lower tail loop and rising exit without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: left stem down, first joined rise, middle stem down, second joined rise, right stem down, then the looped tail. The bundled Noto Sans Cyrillic glyph is a printed щ-like form with three straight full-height vertical stems joined by two horizontal baseline bars and a short separate-looking right descender, without diagonal rounded joins or an exit loop. This learner path preserves the source&apos;s left-to-middle-to-right-to-tail order and zero-lift evidence while fitting the printed outline: descend the left stem, cross the first bottom bar and rise then retrace the middle stem, cross the second bottom bar and rise then retrace the right stem, cross the tail shoulder, and descend the short tail without lifting. Connected cursive restores the source&apos;s diagonal rounded joins, lower tail loop, and rising exit, and individual handwriting may round, narrow, widen, or slant the joins, stems, and tail differently.</desc><rect x="0" y="0" width="982" height="280.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 536 L129 270 L129 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">1. descend the left</tspan><tspan x="486" y="447.6">stem to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 270 L129 37 L129 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 37 L287 37 L445 37 L445 270 L445 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="445" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">2. cross the first base</tspan><tspan x="486" y="447.6">join and rise through</tspan><tspan x="486" y="539.7">the middle stem</tspan></text></svg><rect x="336" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 270 L129 37 L287 37 L445 37 L445 270 L445 536 L445 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M445 536 L445 270 L445 37 L445 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="445" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">3. retrace the middle</tspan><tspan x="486" y="447.6">stem to the baseline</tspan></text></svg><rect x="496" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 270 L129 37 L287 37 L445 37 L445 270 L445 536 L445 270 L445 37 L445 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M445 37 L603 37 L760 37 L760 270 L760 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="760" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">4. cross the second</tspan><tspan x="486" y="447.6">base join and rise</tspan><tspan x="486" y="539.7">through the right stem</tspan></text></svg><rect x="656" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 270 L129 37 L287 37 L445 37 L445 270 L445 536 L445 270 L445 37 L603 37 L760 37 L760 270 L760 536 L760 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M760 536 L760 270 L760 37 L845 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="845" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">5. retrace the right</tspan><tspan x="486" y="447.6">stem and cross the tail</tspan><tspan x="486" y="539.7">shoulder</tspan></text></svg><rect x="816" y="42" width="150" height="186.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="816" y="42" width="150" height="186.64" viewBox="15 -606 942 1172.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M803 -140L803 0L85 0L85 536L173 536L173 74L401 74L401 536L489 536L489 74L717 74L717 536L804 536L804 73L887 73L887 -140L803 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 270 L129 37 L287 37 L445 37 L445 270 L445 536 L445 270 L445 37 L603 37 L760 37 L760 270 L760 536 L760 270 L760 37 L845 37 L845 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M845 37 L845 -50 L845 -140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="845" cy="-140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="486" y="355.5" text-anchor="middle" font-size="75.5" fill="#6b7280"><tspan x="486" y="355.5">6. descend the short</tspan><tspan x="486" y="447.6">tail below the baseline</tspan></text></svg><text x="16" y="241.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase щ demonstration, 10:17–10:25, YouTube, 5 February 2013</text><text x="16" y="254.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
