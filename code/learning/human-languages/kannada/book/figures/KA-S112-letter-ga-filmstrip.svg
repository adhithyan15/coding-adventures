 L535 287 L542 250 L546 211 L548 172 L550 133 L551 94 L551 54 L549 14" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M55 516 L95 516 L135 516 L175 516 L215 516 L255 516 L295 516 L335 516 L375 516 L415 516 L415 516" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M415 516 L447 518 L479 525 L510 540 L534 565 L547 597 L549 632 L543 668 L531 701 L516 734 L500 766" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="500" cy="766" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="322.5" y="195.4" text-anchor="middle" font-size="55.4" fill="#6b7280"><tspan x="322.5" y="195.4">4. curl up into the</tspan><tspan x="322.5" y="263">hook</tspan></text></svg><text x="16" y="302.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Gopala Krishna A, Kannada-alphabet-ga.gif, animation of Kannada consonant ಗ, 37 frames, 3.7 seconds</text><text x="16" y="315.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Wikimedia Commons, 25 May 2016)</text><text x="16" y="327.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
