[workspace]

[package]
name = "heap-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for Rust min-heaps and max-heaps via wasm-bindgen"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heap = { package = "coding-adventures-heap", version = "0.1.0", path = "../../rust/heap" }
wasm-bindgen = "0.2"
