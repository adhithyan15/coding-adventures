[package]
name = "rpg-battle-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic zero-allocation turn-based creature battle state machine with type chart, damage, capture and XP"
license = "MIT"

[dependencies]
palette-indexed = { path = "../palette-indexed" }

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
coding_adventures_sha256 = { path = "../sha256" }
capability-runtime-conformance = { path = "../capability-runtime-conformance" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "hostile_inputs"
path = "tests/hostile_inputs.rs"

[[test]]
name = "microbenchmarks"
path = "tests/microbenchmarks.rs"
harness = false

[[test]]
name = "runtime_capability"
path = "tests/runtime_capability.rs"
harness = false
