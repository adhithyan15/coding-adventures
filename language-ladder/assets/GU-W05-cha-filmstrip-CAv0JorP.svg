<svg xmlns="http://www.w3.org/2000/svg" width="342" height="351.49" viewBox="0 0 342 351.49" role="img" aria-label="How to write ચ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ચ</title><desc>2 frames; frame N shows movements 1 to N of ચ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ચ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ચ as two ordered pen-down runs. Its first SVG path begins at the upper left, circles clockwise around the upper bowl, turns through the small middle loop, then continues clockwise around the broad lower body and finishes at its upper right. The animation lifts once and its second SVG path descends the full right spine before turning through its lower foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the upper bowl, middle loop, broad lower body, and tall right spine, but its printed bowls are broader and the spine foot more angular than the animated school-hand form. This learner path preserves the source&apos;s joined-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the bowls, loop, spine, and terminals differently.</desc><rect x="0" y="0" width="342" height="351.49" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="220.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="220.49" viewBox="-39 -673 761 1118.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M326 131Q267 131 214 157Q161 183 124 237Q121 237 117 237Q78 237 56.5 252.5Q35 268 35 297Q35 316 49.5 331Q64 346 94 346Q119 346 137 337Q155 328 172 311Q216 325 244 356.5Q272 388 272 430Q272 478 244.5 504Q217 530 158 530Q136 530 108.5 524.5Q81 519 58 508L31 576Q55 587 90 595Q125 603 161 603Q252 603 302 557Q352 511 352 428Q352 365 311 318.5Q270 272 207 251Q229 229 255 216Q281 203 323 203Q384 203 421 226Q458 249 486 278L486 603L566 592L566 152Q566 125 569 112.5Q572 100 578 92Q589 78 610.5 75.5Q632 73 652 73L645 0L634 0Q591 0 562.5 9.5Q534 19 517 37Q501 54 493.5 79Q486 104 486 148L486 184Q457 161 419.5 146Q382 131 326 131Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M70 550 L70 550" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M70 550 L120 565 L175 565 L225 550 L265 520 L290 480 L305 435 L300 395 L280 360 L245 330 L205 305 L165 290 L125 285 L90 295 L65 285 L75 265 L100 260 L125 275 L145 240 L180 205 L225 175 L280 155 L335 155 L385 170 L430 200 L470 245" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="470" cy="245" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="341.5" y="201" text-anchor="middle" font-size="61" fill="#6b7280"><tspan x="341.5" y="201">1. circle the upper</tspan><tspan x="341.5" y="275.4">bowl, turn through the</tspan><tspan x="341.5" y="349.8">middle loop, and round</tspan><tspan x="341.5" y="424.3">the lower body</tspan></text></svg><rect x="176" y="42" width="150" height="220.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="220.49" viewBox="-39 -673 761 1118.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M326 131Q267 131 214 157Q161 183 124 237Q121 237 117 237Q78 237 56.5 252.5Q35 268 35 297Q35 316 49.5 331Q64 346 94 346Q119 346 137 337Q155 328 172 311Q216 325 244 356.5Q272 388 272 430Q272 478 244.5 504Q217 530 158 530Q136 530 108.5 524.5Q81 519 58 508L31 576Q55 587 90 595Q125 603 161 603Q252 603 302 557Q352 511 352 428Q352 365 311 318.5Q270 272 207 251Q229 229 255 216Q281 203 323 203Q384 203 421 226Q458 249 486 278L486 603L566 592L566 152Q566 125 569 112.5Q572 100 578 92Q589 78 610.5 75.5Q632 73 652 73L645 0L634 0Q591 0 562.5 9.5Q534 19 517 37Q501 54 493.5 79Q486 104 486 148L486 184Q457 161 419.5 146Q382 131 326 131Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M70 550 L120 565 L175 565 L225 550 L265 520 L290 480 L305 435 L300 395 L280 360 L245 330 L205 305 L165 290 L125 285 L90 295 L65 285 L75 265 L100 260 L125 275 L145 240 L180 205 L225 175 L280 155 L335 155 L385 170 L430 200 L470 245" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M526 560 L526 560" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M526 560 L526 500 L526 430 L526 350 L526 270 L526 190 L526 120 L545 75 L580 45 L620 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="620" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="341.5" y="201" text-anchor="middle" font-size="61" fill="#6b7280"><tspan x="341.5" y="201">2. lift, then descend</tspan><tspan x="341.5" y="275.4">the right spine and</tspan><tspan x="341.5" y="349.8">turn through its lower</tspan><tspan x="341.5" y="424.3">foot</tspan></text></svg><text x="16" y="275.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="287.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ચ animation, first and second SVG</text><text x="16" y="300.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="312.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="325.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
