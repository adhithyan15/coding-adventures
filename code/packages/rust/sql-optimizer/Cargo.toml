[package]
name = "coding-adventures-sql-optimizer"
version = "0.1.7"
edition = "2021"
description = "Logical query plan optimizer for the Mini-SQLite SQL pipeline (Level 1)"
authors = ["Adhithya Rajasekaran <adhithyan15@gmail.com>"]
license = "MIT"
repository = "https://github.com/adhithyan15/coding-adventures"
keywords = ["sql", "optimizer", "query-plan", "database", "mini-sqlite"]
categories = ["database-implementations"]

[dependencies]
coding-adventures-sql-planner = { path = "../sql-planner" }
coding-adventures-sql-backend = { path = "../sql-backend" }

[dev-dependencies]

[lib]
name = "coding_adventures_sql_optimizer"
path = "src/lib.rs"
