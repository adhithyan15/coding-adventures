[package]
name = "smart-home-knxnet-ip-integration"
version = "0.1.0"
edition = "2021"
description = "Authorized bounded KNXnet/IP interface discovery for Smart Home"
license = "MIT"

[dependencies]
knxnet-ip-protocol = { path = "../knxnet-ip-protocol" }
