L245 260 L210 285 L170 295 L135 290 L90 270 L65 225 L67 165 L100 105 L160 55 L230 28 L300 35 L350 85 L370 150 L370 180 L390 145 L430 95 L475 55 L525 30 L575 28 L630 48 L680 95 L710 155 L710 220 L690 290 L650 355 L590 415 L515 460 L515 460" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M515 460 L440 500 L360 525 L290 540 L240 540" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="240" cy="540" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="389.5" y="221" text-anchor="middle" font-size="69" fill="#6b7280"><tspan x="389.5" y="221">4. carry the tall outer</tspan><tspan x="389.5" y="305.2">arch over and finish to</tspan><tspan x="389.5" y="389.4">the left</tspan></text></svg><text x="16" y="255.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Gopala Krishna A, Kannada-alphabet-ae.gif, animation of Kannada independent vowel ಎ, 30 frames, 3.0</text><text x="16" y="267.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">seconds (Wikimedia Commons, 25 May 2016)</text><text x="16" y="280.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
