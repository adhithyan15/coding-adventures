<svg xmlns="http://www.w3.org/2000/svg" width="822" height="356.59" viewBox="0 0 822 356.59" role="img" aria-label="How to write ತ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ತ</title><desc>5 frames; frame N shows movements 1 to N of ತ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-tha.gif, animation of Kannada consonant ತ, 43 frames, 4.3 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-tha.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation is filed under the slug &quot;tha&quot; but draws dental ತ (U+0CA4); in this series &quot;ta&quot; and &quot;tta&quot; animate ಟ and ಠ, so the glyph was checked frame by frame rather than taken from the file name. It writes ತ in two pen-down runs: from the upper-left end the pen sweeps down around the broad bowl and up its right side, turns left over the top, curls down into the small inner loop and rises out of it to the top (frames 0–21); after one lift it draws the top bar from left to right and curls up into the hook (frames 22–29). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (209×186) and frame count. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the arc over the top is the inner loop&apos;s upper edge, so the loop&apos;s right side is retraced on the way up, but the one-lift order remains the same.</desc><rect x="0" y="0" width="822" height="356.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="250.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="250.59" vie