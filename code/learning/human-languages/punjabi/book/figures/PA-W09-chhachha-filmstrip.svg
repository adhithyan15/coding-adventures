<svg xmlns="http://www.w3.org/2000/svg" width="982" height="295.05" viewBox="0 0 982 295.05" role="img" aria-label="How to write ਛ: 2 strokes · 1 pen lift · 6 movements"><title>Writing ਛ</title><desc>6 frames; frame N shows movements 1 to N of ਛ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਛ (chhachhaa) checkpoints, strokes 1–3 (lib/data/lessons/lesson_tracing.dart line 373, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L373&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਛ in three pen-down strokes: the headline from left to right; then from the top right down the short stem, left along the upper bar, down and clockwise round the lower bowl, ending on its left; then the middle stroke from the bowl&apos;s top down. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਛ, each by a different non-native copyist copying a printed letter; where the same dataset can be set beside native writers&apos; pen data (HP Labs India&apos;s Devanagari and Bangla sets), the copyists use more strokes than those writers, so their counts are read here only as a ceiling on native lifts, and only counts and shares are cited. Even under that ceiling, 55% (11 of 20) draw ਛ in two strokes, their most common count; 30% (6 of 20) use the source&apos;s three. Those counts say how many strokes, not where they break, so this path keeps every stroke&apos;s order, start and direction and joins the last two strokes: after closing the bowl the pen runs back along its top to the head of the middle stroke and draws it down without a lift. For the first stroke of the body, 90% (18 of 20) of the copyists start in the same part of the letter as the source and 70% (14 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="982" height="295.05" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="189.05" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="189.05" viewBox="-77 -692 789 994.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M316 0Q179 0 112.5 34Q46 68 46 144Q46 167 61 195Q76 223 121 242Q90 256 70.5 280Q51 304 51 341Q51 365 61.5 386Q72 407 88 420Q114 442 148 449.5Q182 457 243 457L454 457L454 551L-7 551L-7 622L642 622L642 551L534 551L534 415L505 386L229 386Q204 386 183.5 383.5Q163 381 151 373Q132 362 132 338Q132 306 160 296.5Q188 287 230 287L399 287Q456 287 500.5 272Q545 257 570.5 226Q596 195 596 146Q596 72 530 36Q464 0 316 0ZM126 146Q126 108 163 89.5Q200 71 284 68L284 218L246 218Q194 218 160 201Q126 184 126 146ZM379 218L359 218L359 68Q441 70 478.5 88.5Q516 107 516 147Q516 176 497 191.5Q478 207 446.5 2