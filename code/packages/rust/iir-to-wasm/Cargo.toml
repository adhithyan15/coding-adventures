[package]
name = "iir-to-wasm"
version = "0.43.0"
edition = "2021"
description = "IIR → WASM backend — lowers IIRModule to WasmModule. v0.43.0: runtime str_concat now reserves linear memory and __array_bump even without arrays; v0.42.0: runtime str_slice i64 index truncation guard; v0.39.0: runtime str_cmp; v0.36.0: array<str>; v0.30.0: runtime string call results and parameters."

[lib]
name = "iir_to_wasm"
path = "src/lib.rs"

[dependencies]
interpreter-ir      = { path = "../interpreter-ir" }
wasm-types          = { path = "../wasm-types" }
wasm-module-encoder = { path = "../wasm-module-encoder" }
wasm-leb128         = { path = "../wasm-leb128" }
codegen-core        = { path = "../codegen-core" }

[dev-dependencies]
# Executes the lowered wasm to prove the width-wrap end-to-end (E2).
wasm-runtime = { path = "../wasm-runtime" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"

[[test]]
name = "width_wrap"
path = "tests/width_wrap.rs"
