<svg xmlns="http://www.w3.org/2000/svg" width="502" height="320.48" viewBox="0 0 502 320.48" role="img" aria-label="How to write ദ: one unbroken stroke · 3 movements"><title>Writing ദ</title><desc>3 frames; frame N shows movements 1 to N of ദ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ദ in data/DA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/DA.png&gt;. Source note on variation: Thooval&apos;s DA.png starts at the left foot (green), climbs clockwise over the top and curves in to the middle tip (blue turn), then runs back right and round the lower bowl to finish at its lower-left end (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ദ as one stroke from the lower left to the lower centre. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (33 of 34) and end at the lower centre (30 of 34). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; in that outline the two bowls share one band in the middle, so the turn at the tip retraces it.</desc><rect x="0" y="0" width="502" height="320.48" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="201.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.98" viewBox="-18 -636 690 929.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M373 566Q445 566 493.5 545.5Q542 525 566.5 490Q591 455 591 411Q591 363 567 329.5Q543 296 489 274L485 280Q542 264 572 227.5Q602 191 602 143Q602 70 552 29.5Q502 -11 413 -11Q377 -11 351 -7.5Q325 -4 305 0L323 69Q345 65 365 62Q385 59 406 59Q458 59 486.5 78.5Q515 98 515 144Q515 163 508 180Q501 197 485 210Q469 224 445 232Q421 240 368 240L322 240L322 310L367 310Q405 310 434 317Q463 324 480 341Q492 352 498 367Q504 382 504 403Q504 448 469 471Q434 494 371 494Q290 494 239 457.5Q188 421 164 358.5Q140 296 140 217Q140 165 146 111Q152 57 165 9L83 -4Q68 45 60 106Q52 167 52 219Q52 322 87.5 400Q123 478 194.5 522Q266 566 373 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M112 49 L112 49" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M112 49 L102 118 L100 188 L100 257 L108 326 L132 392 L174 447 L226 493 L290 520 L359 525 L429 524 L494 501 L540 449" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="540" cy="449" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="327" y="206.3" text-anchor="middle" font-size="55.3" fill="#6b7280"><tspan x="327" y="206.3">1. climb clockwise over</tspan><tspan x="327" y="273.8">the top</tspan></text></svg><rect x="176" y="42" width="150" height="201.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.98" viewBox="-18 -636 690 929.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M373 566Q445 566 493.5 545.5Q542 525 566.5 490Q591 455 591 411Q591 363 567 329.5Q543 296 489 274L485 280Q542 264 572 227.5Q602 191 602 143Q602 70 552 29.5Q502 -11 413 -11Q377 -11 351 -7.5Q325 -4 305 0L323 69Q345 65 365 62Q385 59 406 59Q458 59 486.5 78.5Q515 98 515 144Q515 163 508 180Q501 197 485 210Q469 224 445 232Q421 240 368 240L322 240L322 310L367 310Q405 310 434 317Q463 324 480 341Q492 352 498 367Q504 382 504 403Q504 448 469 471Q434 494 371 494Q290 494 239 457.5Q188 421 164 358.5Q140 296 140 217Q140 165 146 111Q152 57 165 9L83 -4Q68 45 60 106Q52 167 52 219Q52 322 87.5 400Q123 478 194.5 522Q266 566 373 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M112 49 L102 118 L100 188 L100 257 L108 326 L132 392 L174 447 L226 493 L290 520 L359 525 L429 524 L494 501 L540 449 L540 449" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M540 449 L542 374 L496 315 L432 277 L356 277" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="356" cy="277" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="327" y="206.3" text-anchor="middle" font-size="55.3" fill="#6b7280"><tspan x="327" y="206.3">2. curve in to the</tspan><tspan x="327" y="273.8">middle tip</tspan></text></svg><rect x="336" y="42" width="150" height="201.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="201.98" viewBox="-18 -636 690 929.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M373 566Q445 566 493.5 545.5Q542 525 566.5 490Q591 455 591 411Q591 363 567 329.5Q543 296 489 274L485 280Q542 264 572 227.5Q602 191 602 143Q602 70 552 29.5Q502 -11 413 -11Q377 -11 351 -7.5Q325 -4 305 0L323 69Q345 65 365 62Q385 59 406 59Q458 59 486.5 78.5Q515 98 515 144Q515 163 508 180Q501 197 485 210Q469 224 4