<svg xmlns="http://www.w3.org/2000/svg" width="662" height="338.65" viewBox="0 0 662 338.65" role="img" aria-label="How to write я: one unbroken stroke · 4 movements"><title>Writing я</title><desc>4 frames; frame N shows movements 1 to N of я (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase я demonstration, 12:13–12:21, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 12:13–12:21 lowercase я demonstration, the pen begins at the baseline with a curved entry, rises to the upper-right junction, circles the upper loop counterclockwise, returns to the junction, descends through the long diagonal leg, and turns into a short baseline exit without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: rising entry, upper loop, then descending diagonal leg and exit. The bundled Noto Sans Cyrillic glyph is a printed я-like form with a straight full-height right upright, a broad upper bowl, and an angular lower-left leg, rather than the source&apos;s curved rising entry, narrow loop, slanted leg, and exit join. This learner path preserves the source&apos;s rise-to-loop-to-leg order, counterclockwise loop direction, and zero-lift evidence while fitting the printed outline: climb the right stem, circle the upper bowl counterclockwise, sweep through its lower join, and descend the diagonal leg without lifting. Connected cursive restores the source&apos;s curved entry and baseline exit, and individual handwriting may round, narrow, widen, or slant the loop and leg differently.</desc><rect x="0" y="0" width="662" height="338.65" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="232.65" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="232.65" viewBox="-35 -606 598 927.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 0L187 218Q127 233 94 273.5Q61 314 62 375Q62 451 112 493.5Q162 536 252 536L493 536L493 0L405 0L405 207L277 207L136 0L35 0ZM280 279L405 279L405 463L263 463Q151 463 153 374Q151 279 280 279Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M449 0 L449 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M449 0 L449 140 L449 300 L449 440 L449 499" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="449" cy="499" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="264" y="187.9" text-anchor="middle" font-size="47.9" fill="#6b7280"><tspan x="264" y="187.9">1. climb the right stem</tspan><tspan x="264" y="246.3">from the baseline to the</tspan><tspan x="264" y="304.8">top</tspan></text></svg><rect x="176" y="42" width="150" height="232.65" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="232.65" viewBox="-35 -606 598 927.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 0L187 218Q127 233 94 273.5Q61 314 62 375Q62 451 112 493.5Q162 536 252 536L493 536L493 0L405 0L405 207L277 207L136 0L35 0ZM280 279L405 279L405 463L263 463Q151 463 153 374Q151 279 280 279Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M449 0 L449 140 L449 300 L449 440 L449 499" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M449 499 L449 499 L360 499 L265 499 L175 475 L115 425 L105 370 L120 325 L180 290 L280 243 L405 243" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="405" cy="243" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="264" y="187.9" text-anchor="middle" font-size="47.9" fill="#6b7280"><tspan x="264" y="187.9">2. curve</tspan><tspan x="264" y="246.3">counterclockwise around</tspan><tspan x="264" y="304.8">the upper bowl</tspan></text></svg><rect x="336" y="42" width="150" height="232.65" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="232.65" viewBox="-35 -606 598 927.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 0L187 218Q127 233 94 273.5Q61 314 62 375Q62 451 112 493.5Q162 536 252 536L493 536L493 0L405 0L405 207L277 207L136 0L35 0ZM280 279L405 279L405 463L263 463Q151 463 153 374Q151 279 280 279Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M449 0 L449 140 L449 300 L449 440 L449 499 L360 499 L265 499 L175 475 L115 425 L105 370 L120 325 L180 290 L280 243 L405 243 L405 243" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M405 243 L340 243 L277 225 L187 218" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="187" cy="218" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="264" y="187.9" text-anchor="middle" font-size="47.9" fill="#6b7280"><tspan x="264" y="187.9">3. sweep left through</tspan><tspan x="264" y="246.3">the bowl&apos;s lower join</tspan></text></svg><rect x="496" y="42" width="150" height="232.65" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="232.65" viewBox="-35 -606 598 927.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 0L187 218Q127 233 94 273.5Q61 314 62 375Q62 451 112 493.5Q162 536 252 536L493 536L493 0L405 0L405 207L277 207L136 0L35 0ZM280 279L405 279L405 463L263 463Q151 463 153 374Q151 279 280 279Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M449 0 L449 140 L449 300 L449 440 L449 499 L360 499 L265 499 L175 475 L115 425 L105 370 L120 325 L180 290 L280 243 L405 243 L340 243 L277 225 L187 218 L187 218" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M187 218 L155 170 L120 120 L85 70 L35 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="35" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="264" y="187.9" text-anchor="middle" font-size="47.9" fill="#6b7280"><tspan x="264" y="187.9">4. descend the diagonal</tspan><tspan x="264" y="246.3">leg to the lower-left</tspan><tspan x="264" y="304.8">tip</tspan></text></svg><text x="16" y="287.65" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase я demonstration,</text><text x="16" y="300.15" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">12:13–12:21, YouTube, 5 February 2013</text><text x="16" y="312.65" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
