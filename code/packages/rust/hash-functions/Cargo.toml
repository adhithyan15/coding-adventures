[package]
name = "coding_adventures_hash_functions"
version = "0.2.0"
edition = "2021"
description = "FNV-1a, DJB2, polynomial rolling, MurmurHash3, and SipHash hash functions"

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
# Parse the shared DT17 fixture without adding a third-party dependency.
coding_adventures_json_value = { package = "coding-adventures-json-value", path = "../json-value" }
# The generated evidence harness hashes the spec and the source tree.
coding_adventures_sha256 = { path = "../sha256" }
# VER08b: runtime capability conformance (a sandboxed run of the public API).
capability-runtime-conformance = { path = "../capability-runtime-conformance" }

# Generated from code/specs/hash-functions.warrant (VER04h): examples, bounded
# exhaustive suites, property suites, fuzz suites and sabotage controls.
[[test]]
name = "warrant_evidence"
path = "tests/warrant_evidence.rs"
harness = false

# VER08b: runs the covered public API inside a process sandboxed, from
# required_capabilities.json, to the minimal baseline (the library is pure).
[[test]]
name = "runtime_capability"
path = "tests/runtime_capability.rs"
harness = false
