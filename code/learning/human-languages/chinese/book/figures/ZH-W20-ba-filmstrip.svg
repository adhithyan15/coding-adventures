<svg xmlns="http://www.w3.org/2000/svg" width="342" height="322.38" viewBox="0 0 342 322.38" role="img" aria-label="How to write 八: 2 strokes · 1 pen lift · 2 movements"><title>Writing 八</title><desc>2 frames; frame N shows movements 1 to N of 八 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 八.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%85%AB.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 八, left before right. They are the same piě and nà pair the course learned in 人, and unlike 人 they do not meet at the top — the gap between them is the whole difference between the two characters.</desc><rect x="0" y="0" width="342" height="322.38" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="191.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="191.38" viewBox="-38 -836 1081 1379.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M305 743L387 736Q376 625 358.5 511Q341 397 308.5 288.5Q276 180 222.5 87Q169 -6 87 -75Q81 -67 71.5 -56.5Q62 -46 51.5 -35.5Q41 -25 32 -19Q110 46 159.5 133.5Q209 221 238.5 323Q268 425 282.5 532Q297 639 305 743ZM660 766Q661 748 665 698Q669 648 679.5 578Q690 508 711 426.5Q732 345 766 262.5Q800 180 851 106Q902 32 973 -22Q954 -33 937 -46.5Q920 -60 908 -74Q836 -17 784 61Q732 139 697 226Q662 313 641 399Q620 485 608.5 559.5Q597 634 593 687Q589 740 587 761L660 766Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 720 L345 720" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M345 720 L325 560 L290 390 L240 220 L175 80 L90 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="90" cy="-30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="301.6" text-anchor="middle" font-size="86.6" fill="#6b7280"><tspan x="502.5" y="301.6">1. draw the left-falling</tspan><tspan x="502.5" y="407.3">stroke</tspan></text></svg><rect x="176" y="42" width="150" height="191.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="191.38" viewBox="-38 -836 1081 1379.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M305 743L387 736Q376 625 358.5 511Q341 397 308.5 288.5Q276 180 222.5 87Q169 -6 87 -75Q81 -67 71.5 -56.5Q62 -46 51.5 -35.5Q41 -25 32 -19Q110 46 159.5 133.5Q209 221 238.5 323Q268 425 282.5 532Q297 639 305 743ZM660 766Q661 748 665 698Q669 648 679.5 578Q690 508 711 426.5Q732 345 766 262.5Q800 180 851 106Q902 32 973 -22Q954 -33 937 -46.5Q920 -60 908 -74Q836 -17 784 61Q732 139 697 226Q662 313 641 399Q620 485 608.5 559.5Q597 634 593 687Q589 740 587 761L660 766Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 720 L325 560 L290 390 L240 220 L175 80 L90 -30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M625 735 L625 735" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M625 735 L645 585 L680 420 L730 260 L805 115 L915 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="915" cy="-30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="301.6" text-anchor="middle" font-size="86.6" fill="#6b7280"><tspan x="502.5" y="301.6">2. lift, then draw the</tspan><tspan x="502.5" y="407.3">separate right-falling</tspan><tspan x="502.5" y="512.9">stroke</tspan></text></svg><text x="16" y="246.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 八.json, ordered stroke</text><text x="16" y="258.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="271.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="283.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="296.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
