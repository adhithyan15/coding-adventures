[package]
name = "vos-sched-fp-bitmap"
version = "0.1.0"
edition = "2021"
description = "Fixed-priority bitmap scheduler of the verified-OS program (VOS-011): a one-byte ready set with a branch-free leading-zero dispatch, implementing vos-sched-contract at N = 8"

[lib]
name = "vos_sched_fp_bitmap"
path = "src/lib.rs"

# SH13/SH18: the ghost face (the public-field state image and its wrappers) is compiled
# only for the evidence build.  A plain `cargo build` or `cargo test` never sees it.
[features]
ghost = []

[dependencies]
# SH12: the interface's own contract crate and `core`, nothing else.
vos-sched-contract = { path = "../vos-sched-contract" }

[dev-dependencies]
# SH12: the generated evidence harness hashes the spec and the source tree.
coding_adventures_sha256 = { path = "../sha256" }
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }

# The evidence target (VOS02 section 4.5) is parked until the generator can read the document
# (VOS-D064): warrant/warrant_evidence.rs.pending is its shim.  When it returns it is
#   [[test]] name = "warrant_evidence", path = "tests/warrant_evidence.rs", harness = false,
#   required-features = ["ghost"]
# so a plain `cargo test` skips it.

[[test]]
name = "behaviour"
path = "tests/behaviour.rs"
