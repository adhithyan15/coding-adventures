<svg xmlns="http://www.w3.org/2000/svg" width="822" height="304.61" viewBox="0 0 822 304.61" role="img" aria-label="How to write 世: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 世</title><desc>5 frames; frame N shows movements 1 to N of 世 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 世.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%96.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 世. Median 1 draws the long horizontal; medians 2–3 the two verticals through it, the left one first; median 4 the short horizontal joining their feet; median 5 a stroke down the left side that turns right along the foot without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="304.61" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="198.61" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.61" viewBox="-19 -905 1039 1375.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M51 590L950 590L950 517L51 517L51 590ZM197 813L275 813L275 58L922 58L922 -15L197 -15L197 813ZM457 835L532 835L532 269L723 269L723 824L801 824L801 200L457 200L457 835Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M72 555 L72 555" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M72 555 L928 555" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="928" cy="555" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="238.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="238.3">1. draw the long</tspan><tspan x="500.5" y="339.9">horizontal</tspan></text></svg><rect x="176" y="42" width="150" height="198.61" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="198.61" viewBox="-19 -905 1039 1375.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M51 590L950 590L950 517L51 517L51 590ZM197 813L275 813L275 58L922 58L922 -15L197 -15L197 813ZM457 835L532 835L532 269L723 269L723 824L801 824L801 200L457 200L457 835Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M72 555 L928 555" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M490 814 L490 814" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M490 814 L490 235" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="490" cy="235" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="238.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="238.3">2. lift, then draw the</tspan><tspan x="500.5" y="339.9">left vertical</ts