<svg xmlns="http://www.w3.org/2000/svg" width="982" height="316.07" viewBox="0 0 982 316.07" role="img" aria-label="How to write 吃: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 吃</title><desc>6 frames; frame N shows movements 1 to N of 吃 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 吃.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%90%83.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 吃, in two pieces. Medians 1–3 draw 口 on the left in the order the standalone character uses. Medians 4–6 draw 乞 on the right: a short left-falling stroke, a horizontal, then a horizontal that turns down to the left, runs along the foot and hooks up without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns, the hook and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s last stroke turns further right than the source&apos;s.</desc><rect x="0" y="0" width="982" height="316.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="222.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.57" viewBox="6 -910 10