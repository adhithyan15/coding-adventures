<svg xmlns="http://www.w3.org/2000/svg" width="982" height="505.98" viewBox="0 0 982 505.98" role="img" aria-label="How to write 早: 6 strokes · 5 pen lifts · 7 movements"><title>Writing 早</title><desc>7 frames; frame N shows movements 1 to N of 早 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 早.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%97%A9.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 早. Medians 1–4 complete 日 first: the left side, a separately started top horizontal that turns down the right side without lifting, the middle horizontal, and the separately closing bottom horizontal. Median 5 then draws 十&apos;s horizontal left-to-right, and median 6 separately descends its vertical through the horizontal. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving the complete 日-before-十 component order, the joined top-right turn, and five intervening lifts; Noto&apos;s 日 is squarer and 十&apos;s horizontal is flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="982" height="505.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="200.24" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.24" viewBox="-23 -863 1050 1401.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M458 389L535 3