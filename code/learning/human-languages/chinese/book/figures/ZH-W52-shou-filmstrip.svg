stroke-linejoin="round"/><path class="ductus__pen" d="M449 763 L486 710 L507 614 L509 57 L481 -17 L453 -43 L273 -18" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="273" cy="-18" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="300.6" text-anchor="middle" font-size="83.6" fill="#6b7280"><tspan x="501.5" y="300.6">4. lift, then draw the</tspan><tspan x="501.5" y="402.6">vertical through all</tspan><tspan x="501.5" y="504.6">three and hook left</tspan></text></svg><text x="16" y="262.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 手.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="275" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="287.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
