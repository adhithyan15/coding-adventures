<svg xmlns="http://www.w3.org/2000/svg" width="502" height="391.11" viewBox="0 0 502 391.11" role="img" aria-label="How to write ñ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ñ</title><desc>3 frames; frame N shows movements 1 to N of ñ (latin), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/LatinPrint-Subset.ttf. Stroke order after UJIpenchars2 (F. Prat, M. J. Castro, D. Llorens, A. Marzal and J. M. Vilar), UCI Machine Learning Repository dataset 177, class ñ: 120 tablet pen traces by 60 native Spanish writers (CC BY 4.0); the n after the Grundschrift-App, level kleinbuchstaben/n (commit f6dbd80) &lt;https://archive.ics.uci.edu/dataset/177/uji+pen+characters+version+2&gt;. Source note on variation: UJIpenchars2 (Prat, Castro, Llorens, Marzal and Vilar; UCI Machine Learning Repository dataset 177, CC BY 4.0) holds 120 tablet pen traces of ñ, two by each of 60 adult Spanish writers; only counts are cited. All 120 are two strokes. The tilde is found as a separate mark above the letter in 108 of the 120, and in all 108 it is drawn last, after the n; 104 of those 108 draw it from left to right. The n is the Grundschrift-App&apos;s n (level kleinbuchstaben/n, commit f6dbd80; no licence, facts only): one stroke, down the stem, back up it, over the arch and down the right side. Only counts and shares are cited; no trace is copied, and the path is fitted to the ñ of the bundled LatinPrint-Subset.ttf, a renamed subset of SIL Global&apos;s literacy typeface Andika 7.000, which prints the one-storey a the school model teaches; the book&apos;s own text face is a different font. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="391.11" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="260.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" strok