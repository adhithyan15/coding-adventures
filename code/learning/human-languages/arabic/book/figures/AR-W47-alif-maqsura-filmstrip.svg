<svg xmlns="http://www.w3.org/2000/svg" width="342" height="389.42" viewBox="0 0 342 389.42" role="img" aria-label="How to write ى: one unbroken stroke · 2 movements"><title>Writing ى</title><desc>2 frames; frame N shows movements 1 to N of ى (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Arabic Language Learning Notes (アラビア語学習メモ), Learn How to Write Arabic Letters — Basic Naskh: Alif Maqsura ى, isolated form and stroke order (updated 2025-01-29; accessed 2026-08-23) &lt;https://alarabiyah.sakura.ne.jp/arabic/alphabets/naskh/alifmaqsuurah/&gt;. Source note on variation: The lesson identifies ى as a word-final-only character outside the 28- or 29-row alphabet table, with isolated ى and connected final ـى shapes. Its isolated path starts above the baseline, draws the upper half of an S above it, continues without lifting through a large flat lower half below it, and finishes near the baseline. The lesson explains that the form is historically the old dotless final Yaa shape but represents long ā (or -an in specified spellings), and explicitly distinguishes true alif maqsura from the dotless Yaa carrier in ئ and from regional dotless final Yaa spellings. This learner path therefore reuses only the verified ي body geometry, never its dots, while retaining its own identity and provenance.</desc><rect x="0" y="0" width="342" height="389.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="245.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.92" viewBox="-2 -410 656 1075.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5