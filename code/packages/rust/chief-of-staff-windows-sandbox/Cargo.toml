[package]
name = "chief-of-staff-windows-sandbox"
version = "0.1.0"
edition = "2021"
description = "The D18S Windows applier: a per-agent LPAC AppContainer, a one-process job, an explicit handle list, checked before the agent's first instruction"
license = "MIT"

[dependencies]
capability-os-sandbox = { path = "../capability-os-sandbox" }
chief-of-staff-spawn-isolation = { path = "../chief-of-staff-spawn-isolation" }
coding_adventures_sha256 = { path = "../sha256" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_Networking_WinSock",
] }

[[bin]]
name = "windows-sandbox-probe"
path = "src/bin/windows_sandbox_probe.rs"
test = false

[dev-dependencies]
coding_adventures_sha256 = { path = "../sha256" }
