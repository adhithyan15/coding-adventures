<svg xmlns="http://www.w3.org/2000/svg" width="982" height="508.52" viewBox="0 0 982 508.52" role="img" aria-label="How to write 但: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 但</title><desc>7 frames; frame N shows movements 1 to N of 但 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 但.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BD%86.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 但, in two pieces. Medians 1–2 draw the person piece as 你 opens. Medians 3–7 draw the right side: 日 in the order the standalone character uses, then a long horizontal under it. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="508.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="201.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.51" viewBox="-44 -906 1081 1452.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M308 31L967 31L967 -39L308 -39L308 31ZM47