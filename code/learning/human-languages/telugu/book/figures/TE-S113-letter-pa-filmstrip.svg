<svg xmlns="http://www.w3.org/2000/svg" width="662" height="317.41" viewBox="0 0 662 317.41" role="img" aria-label="How to write ప: 2 strokes · 1 pen lift · 4 movements"><title>Writing ప</title><desc>4 frames; frame N shows movements 1 to N of ప (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ప packaged tracing guides res/drawable/dot_stroke_c_5_1_pa.png and res/drawable/line_stroke_c_5_1_pa.png, movements 1–4 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged guide separates the left bowl into two movements, gives the broad right bowl a third movement, and adds the top flourish last. The c_5_1 filename, its position before c_5_2 ఫ, and the pictured glyph agree that this guide teaches ప. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the breaks keep the guide&apos;s order and fall only between the body and its detached parts. The centre lines are fitted to the bundled Noto Sans Telugu outline, which tightens the joins between the printed bowls.</desc><rect x="0" y="0" width="662" height="317.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="211.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="211.41" viewBox="-41 -795 787 1109.2" preserveAspectRatio="xMidYMid meet" overflow