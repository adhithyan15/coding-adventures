<svg xmlns="http://www.w3.org/2000/svg" width="502" height="446.18" viewBox="0 0 502 446.18" role="img" aria-label="How to write ી: one unbroken stroke · 3 movements"><title>Writing ી</title><desc>3 frames; frame N shows movements 1 to N of ી (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/3_kee.svg, group g1 (stroke g1s0): the ii sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કી, and in all 34 consonant rows, ી is one pen-down run that starts at the left tip of the top hook, arches up and over to the right, comes down the right stem and ends in a foot to the right. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: its one-stroke prototypes of the ii sign (32 of 91, 35%) also start on the left and end at the lower right, though its most common form (51 of 91) is two strokes. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="446.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="327.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="327.68" viewBox="-261 -966 588 1284.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q204 0 173.5 7.5Q143 15 122 37Q102 57 96 84Q90 111 90 148L90 611Q75 711 40.5 767.5Q6 824 -41 824Q-71 824 -91.5 801.5Q-112 779 -112 729Q-112 715 -111 699Q-110 683 -107 668L-184 668Q-187 682 -189 702.5Q-191 723 -191 739Q-191 813 -151 854.5Q-111 896 -41 896Q20 896 63.5 856.5Q107 817 134 752.5Q161 688 170 614L170 152Q170 124 173 113Q176 102 183 92Q194 78 215.5 75.5Q237 73 257 73L249 0L239 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-148 672 L-148 672" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-148 672 L-148 740 L-132 800 L-92 845 L-41 860 L10 850 L60 810 L98 745 L120 670 L130 600" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="130" cy="600" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="33" y="187.1" text-anchor="middle" font-size="47.1" fill="#6b7280"><tspan x="33" y="187.1">1. rise from the hook&apos;s</tspan><tspan x="33" y="244.6">tip and arch over to the</tspan><tspan x="33" y="302">right</tspan></text></svg><rect x="176" y="42" width="150" height="327.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="327.68" viewBox="-261 -966 588 1284.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q204 0 173.5 7.5Q143 15 122 37Q102 57 96 84Q90 111 90 148L90 611Q75 711 40.5 767.5Q6 824 -41 824Q-71 824 -91.5 801.5Q-112 779 -112 729Q-112 715 -111 699Q-110 683 -107 668L-184 668Q-187 682 -189 702.5Q-191 723 -191 739Q-191 813 -151 854.5Q-111 896 -41 896Q20 896 63.5 856.5Q107 817 134 752.5Q161 688 170 614L170 152Q170 124 173 113Q176 102 183 92Q194 78 215.5 75.5Q237 73 257 73L249 0L239 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-148 672 L-148 740 L-132 800 L-92 845 L-41 860 L10 850 L60 810 L98 745 L120 670 L130 600 L130 600" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 600 L130 500 L130 400 L130 300 L130 200 L131 140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="33" y="187.1" text-anchor="middle" font-size="47.1" fill="#6b7280"><tspan x="33" y="187.1">2. draw the stem down</tspan></text></svg><rect x="336" y="42" width="150" height="327.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="327.68" viewBox="-261 -966 588 1284.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q204 0 173.5 7.5Q143 15 122 37Q102 57 96 84Q90 111 90 148L90 611Q75 711 40.5 767.5Q6 824 -41 824Q-71 824 -91.5 801.5Q-112 779 -112 729Q-112 715 -111 699Q-110 683 -107 668L-184 668Q-187 682 -189 702.5Q-191 723 -191 739Q-191 813 -151 854.5Q-111 896 -41 896Q20 896 63.5 856.5Q107 817 134 752.5Q161 688 170 614L170 152Q170 124 173 113Q176 102 183 92Q194 78 215.5 75.5Q237 73 257 73L249 0L239 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-148 672 L-148 740 L-132 800 L-92 845 L-41 860 L10 850 L60 810 L98 745 L120 670 L130 600 L130 500 L130 400 L130 300 L130 200 L131 140 L131 140" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 140 L136 95 L155 62 L185 44 L215 38 L248 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="248" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="33" y="187.1" text-anchor="middle" font-size="47.1" fill="#6b7280"><tspan x="33" y="187.1">3. turn into the foot to</tspan><tspan x="33" y="244.6">the right</tspan></text></svg><text x="16" y="382.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="395.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/3_kee.svg, group g1 (stroke g1s0):</text><text x="16" y="407.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the ii sign drawn after the consonant (GitHub, 2026)</text><text x="16" y="420.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
