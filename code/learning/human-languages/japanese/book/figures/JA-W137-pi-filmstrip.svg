<svg xmlns="http://www.w3.org/2000/svg" width="662" height="296.05" viewBox="0 0 662 296.05" role="img" aria-label="How to write ぴ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ぴ</title><desc>4 frames; frame N shows movements 1 to N of ぴ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03074.svg, hiragana ぴ (U+3074 HIRAGANA LETTER PI), two stroke paths kvg:03074-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03074.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is ひ&apos;s stroke, the same paths as in its file for ひ, kanji/03072.svg; s2 is the handakuten, one closed ring that starts at its foot and runs clockwise, round the left side, over the top and down the right side back to the foot. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="662" height="296.05" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="190.05" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="190.05" viewBox="20 -888 1031 1306.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M715 724Q723 678 736.5 625Q750 572 773.5 516Q797 460 834 405Q871 350 927 300L874 229Q819 289 776.5 359Q734 429 700 514Q666 599 636 701L715 724ZM90 670Q113 668 144 670Q177 672 222 676.5Q267 681 313 688.5Q359 696 398.5 704Q438 712 459 720L483 650Q473 647 457 642.5Q441 638 