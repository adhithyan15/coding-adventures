stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 544 L338 226" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 533 L654 533 L654 226" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 237 L338 237" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M338 237 L654 237" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="654" cy="237" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="297.3" text-anchor="middle" font-size="78.3" fill="#6b7280"><tspan x="500.5" y="297.3">5. lift, then close 口</tspan><tspan x="500.5" y="392.8">with a horizontal</tspan></text></svg><rect x="816" y="42" width="150" height="227.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="816" y="42" width="150" height="227.27" viewBox="12 -869 977 1480.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M374 500L374 271L618 271L618 500L374 500ZM303 568L692 568L692 204L303 204L303 568ZM82 799L919 799L919 -79L839 -79L839 724L159 724L159 -79L82 -79L82 799ZM126 46L885 46L885 -25L126 -25L126 46Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 774 L120 -54" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M120 761 L879 761 L879 -54" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 544 L338 226" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 533 L654 533 L654 226" fill="none" stroke="#9aa1ad" st