<svg xmlns="http://www.w3.org/2000/svg" width="982" height="296.89" viewBox="0 0 982 296.89" role="img" aria-label="How to write 米: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 米</title><desc>6 frames; frame N shows movements 1 to N of 米 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 米.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%B1%B3.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 米. Medians 1–2 draw the two short strokes above, the left one first; medians 3–4 draw the horizontal and the vertical down through it; medians 5–6 draw a left-falling and then a right-falling stroke from the crossing. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="296.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="203.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.39" viewBox="-35 -909 1073 1454.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M58 455L941 