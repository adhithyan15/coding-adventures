<svg xmlns="http://www.w3.org/2000/svg" width="822" height="302.88" viewBox="0 0 822 302.88" role="img" aria-label="How to write ਥ: 4 strokes · 3 pen lifts · 5 movements"><title>Writing ਥ</title><desc>5 frames; frame N shows movements 1 to N of ਥ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਥ (thathaa) checkpoints, strokes 1–4 (lib/data/lessons/lesson_tracing.dart line 696, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L696&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਥ in four pen-down strokes: the headline from left to right; then from the top left down the left side and round the bowl to the stem; then the middle bar from left to right; then the stem from the top down. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਥ, each by a different non-native copyist; only counts and shares are cited. 40% (8 of 20) draw it in four strokes, the source&apos;s count and their most common one. For the first stroke of the body, 65% (13 of 20) start in the same part of the letter as the source and 95% (19 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="302.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="196.88" viewBox="-77 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M428 0L428 165Q394 149 360 140.5Q326 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L605 622L605 551L509 551L509 0L428 0ZM188 460Q188 442 185 426L428 426L428 551L170 551Q188 503 188 460ZM284 206Q324 206 358.5 217.5Q393 229 428 250L428 357L159 357Q147 341 132 327Q161 267 196.5 236.5Q232 206 284 206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L55 586 L96 586 L136 586 L176 586 L217 586 L257 586 L298 586 L338 586 L378 586 L419 586 L459 586 L499 586 L540 586 L580 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="580" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="299" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="299" y="200.3">1. draw the headline</tspan><tspan x="299" y="273.9">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="196.88" viewBox="-77 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M428 0L428 165Q394 149 360 140.5Q326 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L605 622L605 551L509 551L509 0L428 0ZM188 460Q188 442 185 426L428 426L428 551L170 551Q188 503 188 460ZM284 206Q324 206 358.5 217.5Q393 229 428 250L428 357L159 357Q147 341 132 327Q161 267 196.5 236.5Q232 206 284 206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L96 586 L136 586 L176 586 L217 586 L257 586 L298 586 L338 586 L378 586 L419 586 L459 586 L499 586 L540 586 L580 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M128 586 L128 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M128 586 L134 547 L139 507 L142 466 L139 426 L128 389 L112 354 L96 319" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="96" cy="319" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="299" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="299" y="200.3">2. lift, then come down</tspan><tspan x="299" y="273.9">the left side</tspan></text></svg><rect x="336" y="42" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="196.88" viewBox="-77 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M428 0L428 165Q394 149 360 140.5Q326 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L605 622L605 551L509 551L509 0L428 0ZM188 460Q188 442 185 426L428 426L428 551L170 551Q1