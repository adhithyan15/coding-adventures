 378 448 353Q448 323 465.5 304.5Q483 286 516 286Q551 286 565.5 304.5Q580 323 580 350Q580 392 554.5 408.5Q529 425 483 425L79 425L89 500L441 500Q484 500 514 496.5Q544 493 566 485Q588 477 606 462Q627 446 640 418.5Q653 391 653 353Q653 290 615 255Q577 220 512 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28 L160 35 L200 53 L233 82 L255 119 L266 159 L268 201 L262 243 L250 280 L233 316 L208 352 L174 382 L143 410 L120 439 L95 455 L124 459 L160 467 L200 466 L243 462 L286 462 L330 462 L374 464 L415 467 L448 462 L448 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M448 462 L493 466 L536 456 L571 439 L594 417 L609 387 L614 353 L607 318 L589 287 L558 265 L519 256 L480 261 L447 278 L424 306 L415 339 L418 371 L433 400 L458 432" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="458" cy="432" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="281" y="222.8" text-anchor="middle" font-size="70.8" fill="#6b7280"><tspan x="281" y="222.8">5. round the loop on the</tspan><tspan x="281" y="309.2">right, down, under and</tspan><tspan x="281" y="395.6">up, to the tip under the</tspan><tspan x="281" y="481.9">bar</tspan></text></svg><text x="16" y="237.7" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 56 (ూ, uu sign): stored</text><text x="16" y="250.2" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native writers (MIT licence, 2012)</text><text x="16" y="262.7" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
