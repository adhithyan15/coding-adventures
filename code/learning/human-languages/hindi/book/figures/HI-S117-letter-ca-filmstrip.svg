0 395 L300 380 L270 372 L235 365 L215 350 L200 330 L187 305 L178 275 L177 250 L180 218 L200 185 L235 160 L280 145 L325 145 L370 160 L410 182 L447 210 L470 238" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M505 551 L505 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M505 551 L505 475 L505 395 L505 315 L505 235 L505 155 L505 75 L505 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="505" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324.5" y="203.2" text-anchor="middle" font-size="63.2" fill="#6b7280"><tspan x="324.5" y="203.2">2. lift, then descend</tspan><tspan x="324.5" y="280.3">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="203.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="203.71" viewBox="-70 -692 789 1071.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M649 551L545 551L545 0L465 0L465 179L483 171Q456 143 413.5 126Q371 109 322 109Q267 109 225.5 129Q184 149 160.5 185Q137 221 137 269Q137 307 151.5 334.5Q166 362 187 378L38 376L38 448L389 448L382 377L350 377Q292 377 254.5 351.5Q217 326 217 273Q217 229 245 205Q273 181 316 181Q368 181 409.5 207Q451 233 477 270L465 212L465 551L0 551L0 622L649 622L649 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M45 412 L100 412 L160 412 L220 412 L280 412 L340 412 L320 395 L300 380 L270 372 L235 365 L215 350 L200 330 L187 305 L178 275 L177 250 L180 218 L200 185 L235 160 L280 145 L325 145 L370 160 L410 182 L447 210 L470 238" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M505 551 L505 475 L505 395 L505 315 L505 235 L505 155 L505 75 L505 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L95 585 L185 585 L275 585 L365 585 L455 585 L545 585 L644 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="644" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="324.5" y="203.2" text-anchor="middle" font-size="63.2" fill="#6b7280"><tspan x="324.5" y="203.2">3. lift, then draw the</tspan><tspan x="324.5" y="280.3">shirorekha left-to-right</tspan></text></svg><text x="16" y="258.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-च-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="271.21" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="283.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
