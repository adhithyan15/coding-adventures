<svg xmlns="http://www.w3.org/2000/svg" width="822" height="422.77" viewBox="0 0 822 422.77" role="img" aria-label="How to write ই: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ই</title><desc>5 frames; frame N shows movements 1 to N of ই (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 2 (ই, i; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: setting aside a straight headline lifted out as a stroke of its own, 165 of the 218 stored prototypes draw the body in two pen-down strokes. In 162 of those 165 the lower part, written like ha (হ), comes first: 143 start it inside the curl, 120 turn it clockwise and 150 end it at the bottom right, at the end of the tail. The second part is the hook above the headline: 131 draw it upward, ending at its tip. THE HEADLINE: of the 165, 80 open the hook&apos;s stroke with it, 22 lift it out as the last stroke, 8 draw it first, 5 between the two parts, and 50 inside one of the parts elsewhere, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="422.77" fill="#ffffff"/>