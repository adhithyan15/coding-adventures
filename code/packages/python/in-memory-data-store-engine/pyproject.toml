[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-in-memory-data-store-engine"
version = "0.1.0"
description = "Pure-Python execution engine for the in-memory data store"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
dependencies = [
    "coding-adventures-hyperloglog",
    "coding-adventures-in-memory-data-store-protocol",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/in_memory_data_store_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=in_memory_data_store_engine --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/in_memory_data_store_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
