<svg xmlns="http://www.w3.org/2000/svg" width="662" height="295.01" viewBox="0 0 662 295.01" role="img" aria-label="How to write ಆ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ಆ</title><desc>4 frames; frame N shows movements 1 to N of ಆ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-aa.gif, animation of Kannada independent vowel ಆ, 35 frames, 3.5 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-aa.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಆ in two pen-down runs: turn around the compact left loop and sweep through the broad lower bowl to the upper right; lift once, turn around the rounded right loop, then return left along the inner horizontal bar. The path is fitted to the bundled Noto Sans Kannada outline; handwritten loop width, bowl depth, and bar length vary, but the one-lift order remains the same.</desc><rect x="0" y="0" width="662" height="295.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="189.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="189.01" viewBox="-33 -633 914 1151.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M435 -12Q302 -12 213.5 29.5Q125 71 81 144Q37 217 37 311Q37 392 64 448Q91 504 137.5 533.5Q184 563 242 563Q286 563 318 547Q350 531 367.5 501Q385 471 385 429Q385 386 365.5 352Q346 318 307.5 298Q269 278 212 278Q176 278 147 289Q118 300 97.5 316Q77 332 63 348L87 414Q96 402 112 386.5Q128 371 151.5 359.5Q175 348 206 348Q259 348 283 370Q307 392 307 426Q307 458 289 475.5Q271 493 242 493Q183 493 150 446.5Q117 400 117 315L117 311Q117 265 134