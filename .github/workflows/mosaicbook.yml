name: MosaicBook stories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mosaicbook.yml'
      - 'code/packages/mosaic/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/programs/go/mosaicbook-server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mosaicbook.yml'
      - 'code/packages/mosaic/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/programs/go/mosaicbook-server/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main always finishes, so main's state is always known; a
  # newer push queues behind it (GitHub keeps only the newest waiting).
  # Pull requests and other branches still cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stories:
    name: Compile every MosaicBook story
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'code/**/go.sum'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # `mosaic-compile` links `cairo-sys-rs` through the paint backend even
      # though this gate exercises browser emitters. GitHub's Ubuntu runner
      # does not include the Cairo development package by default.
      - name: Install Linux build dependencies
        shell: bash
        timeout-minutes: 10  # apt can stall on a mirror; fail fast, not at 6h (#12163)
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      - name: Build Mosaic compiler
        run: cargo build --release --manifest-path code/packages/rust/mosaic-compile/Cargo.toml

      - name: Test MosaicBook checker
        working-directory: code/programs/go/mosaicbook-server
        run: go test ./...

      - name: Compile the story catalogue
        working-directory: code/programs/go/mosaicbook-server
        run: |
          go run . \
            --check \
            --root ../../../packages/mosaic \
            --compiler ../../../packages/rust/target/release/mosaic-compile \
            --check-degradations ../../../packages/mosaic/mosaicbook-degradations.json \
            --check-workers 4 \
            --check-timeout 10m
