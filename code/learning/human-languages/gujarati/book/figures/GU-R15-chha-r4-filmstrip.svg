<svg xmlns="http://www.w3.org/2000/svg" width="838" height="356.92" viewBox="0 0 838 356.92" role="img" aria-label="How to write છ શ: 2 letters, છ, શ, one after another"><title>Writing છ શ</title><desc>2 letters written one after another: છ, શ (gujarati). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: છ: t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, છ animation, first SVG path &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;; શ: t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, શ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source notes on variation: છ: The teaching app animates છ as one continuous pen-down run in its first SVG path; its remaining path slots are empty. The run begins near the upper left, circles clockwise around the upper-left lobe, turns back through the middle, continues clockwise around the broad lower body, climbs the tall outer-right curve, then circles the upper-right lobe and finishes beside the outer curve without lifting. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves both upper lobes, the middle turn, broad lower body, and tall outer-right curve, but its printed bodies are broader and the right lobe more angular than the animated school-hand form. This learner path preserves the source&apos;s upper-left-lobe-to-lower-body-to-upper-right-lobe order and zero-lift evidence while fitting the continuous run to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the lobes, body, curve, and terminals differently. શ: The teaching app animates શ as two ordered pen-down runs. Its first SVG path begins at the upper right, circles the small upper loop, then continues through the broad lower body and into its lower-right tail. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the small upper loop, broad lower body, tail, tall spine, and lower foot, but its printed body is wider and more angular and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s loop-and-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loop, body, tail, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="838" height="356.92" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 3 movements</text><rect x="16" y="76" width="150" height="215.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="76" width="150" height="215.14" viewBox="-26 -673 797 1143.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M318 -10Q201 -10 144.5 42Q88 94 88 176Q88 252 139 302Q98 329 71 367Q44 405 44 461Q44 499 63 531.5Q82 564 119 583.5Q156 603 210 603Q263 603 304 592L290 520Q275 524 258 526