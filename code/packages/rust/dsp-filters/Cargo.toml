[package]
name = "dsp-filters"
version = "0.2.0"
edition = "2021"
description = "DSP03 Phases 1-2 + 4: scalar reference FIR (direct convolution) + IIR (direct-form-II Transposed) filters. IIR matches scipy.signal.lfilter(b, a, x) exactly. Phase 3 (FIR via FFT overlap-add) is deferred; Phase 5 adds Butterworth / Chebyshev / windowed-sinc design helpers; Phase 6 lowers FIR onto the matrix execution layer."
license = "MIT"

[dependencies]
dsp-fft = { path = "../dsp-fft" }

[dev-dependencies]
