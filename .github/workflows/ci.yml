# ================================================================
# CI — Incremental, parallel monorepo build with conditional toolchains
# ================================================================
#
# Core pipeline plus always-on contract consumers:
#   1. detect: Fast (~10s) — compiles the Go build tool and runs
#      --detect-languages to determine which toolchains are needed.
#   2. phy00-phy01-fixture-consumers: proves external corpus changes against
#      the Dart packages without granting their tests filesystem authority.
#   3. d18f-message-conformance: runs the one D18F manifest through all six
#      language packages and rejects stale generated vectors.
#   4. d18p-channel-conformance: runs the D18P durable-channel manifest through
#      all six language packages and rejects stale generated transitions.
#   5. d18q-channel-key-grant-conformance: same shape, for the D18Q manifest.
#   6. d18t-durable-epoch-activation-conformance: same shape, for the D18T
#      manifest -- the epoch-activation transaction all six languages share.
#   7. ruby-grammar-regen-check: regenerates every Ruby _grammar.rb from its
#      .tokens/.grammar source and rejects a stale committed file.
#   8. build: Installs only the needed toolchains, then runs the build.
#
# This saves 3-5 minutes on language-specific changes by skipping
# unneeded toolchain installations (e.g., Rust tarpaulin, Elixir/Erlang).
#
# Change detection: git diff against the base branch determines which
# files changed, maps them to packages, then uses the dependency graph
# to find all affected packages (changed + transitive dependents).
#
# Parallelism: independent packages run concurrently via goroutines.
#
# Tiered strategy:
# - Every push: Linux only (fast feedback)
# - PRs to main: Linux + macOS + Windows (thorough validation)

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Detect which languages need toolchains ────────────
  #
  # This job is fast (~10s). It compiles the Go build tool, runs
  # --detect-languages, and outputs boolean flags for each language.
  # The build job reads these flags to conditionally install toolchains.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_python: ${{ steps.toolchains.outputs.needs_python }}
      needs_ruby: ${{ steps.toolchains.outputs.needs_ruby }}
      needs_go: ${{ steps.toolchains.outputs.needs_go }}
      needs_typescript: ${{ steps.toolchains.outputs.needs_typescript }}
      needs_rust: ${{ steps.toolchains.outputs.needs_rust }}
      needs_elixir: ${{ steps.toolchains.outputs.needs_elixir }}
      needs_lua: ${{ steps.toolchains.outputs.needs_lua }}
      needs_perl: ${{ steps.toolchains.outputs.needs_perl }}
      needs_dart: ${{ steps.toolchains.outputs.needs_dart }}
      needs_haskell: ${{ steps.toolchains.outputs.needs_haskell }}
      needs_dotnet: ${{ steps.toolchains.outputs.needs_dotnet }}
      needs_java: ${{ steps.toolchains.outputs.needs_java }}
      needs_kotlin: ${{ steps.toolchains.outputs.needs_kotlin }}
      needs_swift: ${{ steps.toolchains.outputs.needs_swift }}
      needs_cpp: ${{ steps.toolchains.outputs.needs_cpp }}
      needs_venture_windows: ${{ steps.venture-windows.outputs.required }}
      needs_mosaic_xaml_windows: ${{ steps.mosaic-xaml-windows.outputs.required }}
      needs_mosaic_swift_runtime: ${{ steps.mosaic-swift-runtime.outputs.required }}
      needs_mosaic_qt_runtime: ${{ steps.mosaic-qt-runtime.outputs.required }}
      needs_mosaic_flutter_runtime: ${{ steps.mosaic-flutter-runtime.outputs.required }}
      needs_mosaic_compose_runtime: ${{ steps.mosaic-compose-runtime.outputs.required }}
      diff_base: ${{ steps.diff-base.outputs.base }}
      is_main: ${{ steps.detect-main.outputs.is_main }}
      build_shards: ${{ steps.detect.outputs.build_shards }}
      build_matrix: ${{ steps.build-matrix.outputs.build_matrix }}
      shard_count: ${{ steps.build-matrix.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Rust for capability taxonomy conformance
        uses: dtolnay/rust-toolchain@stable

      - name: Test parity metadata contracts
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.26.0
          cargo build --manifest-path code/packages/rust/adj-lang-cli/Cargo.toml --bin adj-formula-inventory
          cargo build --manifest-path code/packages/rust/adj-lang-cli/Cargo.toml --bin adj-formula-audit
          python3 -m unittest discover -s code/scripts/tests -p 'test_package_parity_report.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_typescript_tsconfig_portability.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_haskell_required_capabilities.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_ocaml_toolchain_lock.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_setup_lua.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_capability_taxonomy.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_phy00_phy01_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18f_message_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18p_channel_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18q_channel_key_grant_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18t_durable_epoch_activation_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_report.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_manifest.py'
          ADJ_CGROUP_ORIGINAL=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
          ADJ_CGROUP_ROOT="/sys/fs/cgroup/adj-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ADJ_CGROUP_SHELL_PID=$$
          cleanup_adj_cgroup() {
            printf '%s\n' "$ADJ_CGROUP_SHELL_PID" | sudo tee "/sys/fs/cgroup${ADJ_CGROUP_ORIGINAL}/cgroup.procs" >/dev/null
            sudo rmdir "$ADJ_CGROUP_ROOT"
          }
          sudo mkdir "$ADJ_CGROUP_ROOT"
          sudo chown "$(id -u):$(id -g)" \
            "$ADJ_CGROUP_ROOT" \
            "$ADJ_CGROUP_ROOT/cgroup.procs" \
            "$ADJ_CGROUP_ROOT/cgroup.threads" \
            "$ADJ_CGROUP_ROOT/cgroup.subtree_control"
          printf '%s\n' "$ADJ_CGROUP_SHELL_PID" | sudo tee "$ADJ_CGROUP_ROOT/cgroup.procs" >/dev/null
          export ADJ_PROVENANCE_CGROUP_ROOT="$ADJ_CGROUP_ROOT"
          trap cleanup_adj_cgroup EXIT
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_provenance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_onvif_origin_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_authority.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_backend_loader.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_capability_broker.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_linux_oci.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_venture_windows_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_xaml_windows_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_swift_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_qt_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_flutter_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_compose_runtime_ci_acceptance.py'
          python3 code/scripts/build_tool_conformance.py validate-corpus
          python3 code/scripts/build_tool_conformance_execution.py validate-contract
          python3 code/scripts/package_parity_report.py --format json --fail-on-collisions > /tmp/package-parity-report.json
          python3 code/scripts/adj_stdlib_report.py --format json --fail-on-unreferenced-tests \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-report.json
          python3 code/scripts/adj_stdlib_manifest.py --validate-json-schema \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-manifest.json
          python3 code/scripts/adj_stdlib_provenance.py verify \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-provenance.json
          cleanup_adj_cgroup
          trap - EXIT
          unset ADJ_PROVENANCE_CGROUP_ROOT
          (cd code/programs/go/capability-cage-generator && go test ./...)
          (cd code/packages/go/ca-capability-analyzer && go test ./...)
          (cd code/packages/go/capability-cage && go test ./...)
          cargo test -p capability-cage --manifest-path code/packages/rust/Cargo.toml

      - name: Determine diff base
        id: diff-base
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Validate the base ref before using it to prevent script injection.
            # Branch names may only contain alphanumerics, dots, hyphens, underscores,
            # and forward slashes — anything else is rejected.
            if [[ "$PR_BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              BASE="origin/$PR_BASE_REF"
            else
              echo "::error::Unsafe base ref value: $PR_BASE_REF"
              exit 1
            fi
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            BASE="HEAD~1"
          else
            git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
            BASE="origin/main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      - name: Check if main branch
        id: detect-main
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GIT_REF" = "refs/heads/main" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect needed languages and emit build plan
        id: detect
        shell: bash
        run: |
          cd code/programs/go/build-tool
          go build -o ../../../../build-tool .
          cd ../../../..
          force_flag=()
          shard_flags=()
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            force_flag=(-force)
            shard_flags=(-shard-count 5 -emit-shard-matrix)
          fi
          ./build-tool \
            -root . \
            -diff-base "${{ steps.diff-base.outputs.base }}" \
            "${force_flag[@]}" \
            -validate-build-files \
            -detect-languages \
            -emit-plan build-plan.json \
            "${shard_flags[@]}"

      - name: Detect Venture native-shell acceptance
        id: venture-windows
        shell: bash
        run: |
          python3 code/scripts/venture_windows_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic XAML native-shell acceptance
        id: mosaic-xaml-windows
        shell: bash
        run: |
          python3 code/scripts/mosaic_xaml_windows_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Swift runtime acceptance
        id: mosaic-swift-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_swift_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Qt runtime acceptance
        id: mosaic-qt-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_qt_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Flutter runtime acceptance
        id: mosaic-flutter-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_flutter_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Compose runtime acceptance
        id: mosaic-compose-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_compose_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Normalize toolchain requirements
        id: toolchains
        shell: bash
        run: |
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            echo "Main branch push detected; enabling all supported toolchains for the forced full build"
            printf '%s\n' \
              'needs_python=true' \
              'needs_ruby=true' \
              'needs_go=true' \
              'needs_typescript=true' \
              'needs_rust=true' \
              'needs_elixir=true' \
              'needs_lua=true' \
              'needs_perl=true' \
              'needs_dart=true' \
              'needs_haskell=true' \
              'needs_dotnet=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=true' \
              'needs_kotlin=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              'needs_python=${{ steps.detect.outputs.needs_python }}' \
              'needs_ruby=${{ steps.detect.outputs.needs_ruby }}' \
              'needs_go=${{ steps.detect.outputs.needs_go }}' \
              'needs_typescript=${{ steps.detect.outputs.needs_typescript }}' \
              'needs_rust=${{ steps.detect.outputs.needs_rust }}' \
              'needs_elixir=${{ steps.detect.outputs.needs_elixir }}' \
              'needs_lua=${{ steps.detect.outputs.needs_lua }}' \
              'needs_perl=${{ steps.detect.outputs.needs_perl }}' \
              'needs_dart=${{ steps.detect.outputs.needs_dart }}' \
              'needs_haskell=${{ steps.detect.outputs.needs_haskell }}' \
              'needs_dotnet=${{ steps.detect.outputs.needs_dotnet }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=${{ steps.detect.outputs.needs_java }}' \
              'needs_kotlin=${{ steps.detect.outputs.needs_kotlin }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=${{ steps.detect.outputs.needs_swift }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=${{ steps.detect.outputs.needs_cpp }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Plan build matrix
        id: build-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_MAIN: ${{ steps.detect-main.outputs.is_main }}
          BUILD_SHARDS: ${{ steps.detect.outputs.build_shards }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          if os.environ["IS_MAIN"] == "true":
            shards = json.loads(os.environ.get("BUILD_SHARDS") or "[]")
            entries = [
              {
                "os": "ubuntu-latest",
                "label": shard["label"],
                "sharded": True,
                "shard_index": shard["shard_index"],
                "package_count": shard.get("package_count", 0),
                "languages": shard.get("languages", []),
              }
              for shard in shards
            ]
            shard_count = len(entries)
          elif os.environ["EVENT_NAME"] == "pull_request":
            entries = [
              {"os": "ubuntu-latest", "label": "ubuntu-latest", "sharded": False, "shard_index": -1},
              {"os": "macos-latest", "label": "macos-latest", "sharded": False, "shard_index": -1},
              {"os": "windows-latest", "label": "windows-latest", "sharded": False, "shard_index": -1},
            ]
            shard_count = 0
          else:
            entries = [
              {"os": "ubuntu-latest", "label": "ubuntu-latest", "sharded": False, "shard_index": -1},
            ]
            shard_count = 0

          print("build_matrix=" + json.dumps(entries, separators=(",", ":")))
          print(f"shard_count={shard_count}")
          PY

      - name: Upload build plan
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 1

  # ── Job 2: Always-on external fixture consumers ─────────────────
  phy00-phy01-fixture-consumers:
    name: PHY00/PHY01 fixture consumers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify generated fixtures and Dart consumers
        shell: bash
        run: |
          python3 code/scripts/generate_phy00_phy01_dart_fixtures.py --check
          (cd code/packages/dart/trig && dart pub get && dart test test/conformance_fixture_test.dart)
          (cd code/packages/dart/wave && dart pub get && dart test test/conformance_fixture_test.dart)

  # ── Job 3: D18F six-language message conformance ───────────────
  d18f-message-conformance:
    name: D18F message conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Run every D18F manifest consumer and verify regeneration
        run: python3 code/scripts/validate_d18f_message_conformance.py

  # ── Job 4: D18P six-language channel conformance ───────────────
  d18p-channel-conformance:
    name: D18P channel conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Run every D18P manifest consumer and verify regeneration
        run: python3 code/scripts/validate_d18p_channel_conformance.py

  # ── Job 5: D18Q six-language channel-key grant conformance ────
  d18q-channel-key-grant-conformance:
    name: D18Q channel-key grant conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Run every D18Q manifest consumer and verify regeneration
        run: python3 code/scripts/validate_d18q_channel_key_grant_conformance.py

  # ── Job 6: D18T six-language durable epoch-activation conformance ────
  #
  # D18T is the transaction that makes a rotated channel key current. Six
  # languages implement it against one Rust-authored manifest, and this job is
  # what makes their agreement enforced rather than asserted: it validates the
  # shared contract, proves the generator has not drifted from its output,
  # runs every package's own BUILD front door, and regenerates the manifest
  # byte for byte.
  d18t-durable-epoch-activation-conformance:
    name: D18T durable epoch-activation conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Run every D18T manifest consumer and verify regeneration
        run: python3 code/scripts/validate_d18t_durable_epoch_activation_conformance.py

  # ── Job 7: Ruby compiled-grammar regeneration check ─────────────
  #
  # Ruby lexer/parser packages ship a pre-compiled _grammar.rb (grammar
  # data baked into native Ruby structures) instead of parsing the raw
  # .tokens/.grammar text at runtime. That _grammar.rb is generated code,
  # hand-committed alongside its source -- nothing enforced that the two
  # stayed in sync, and they drifted apart more than once (see
  # coding_adventures_ruby_parser's CHANGELOG). This job regenerates every
  # Ruby _grammar.rb from the current .tokens/.grammar source and fails if
  # that produces any diff, so a grammar-source change without the
  # matching regenerated output can't merge silently. Ruby-only regen
  # needs no Go/Rust/Python/Node toolchain (see generator.rb#run_ruby_only).
  ruby-grammar-regen-check:
    name: Ruby compiled-grammar regeneration check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Regenerate every Ruby _grammar.rb from current .tokens/.grammar source
        run: |
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 ruby -E UTF-8 \
            code/programs/ruby/grammar-tools/main.rb generate-compiled-grammars --lane ruby

      - name: Fail if regeneration produced any diff
        run: |
          if ! git diff --quiet -- code/packages/ruby; then
            echo "::error::Regenerating Ruby's compiled grammars (grammar-tools generate-compiled-grammars --lane ruby) produced changes that are not committed."
            echo "A .tokens/.grammar source file changed without regenerating the downstream _grammar.rb file(s) that embed it."
            echo
            git diff --stat -- code/packages/ruby
            echo
            echo "Run 'code/scripts/generate-compiled-grammars.sh --lane ruby' locally and commit the result."
            exit 1
          fi
          echo "All Ruby compiled grammars are up to date."

  # ── Job 7: Build and test ──────────────────────────────────────
  #
  # Installs only the toolchains flagged by the detect job, then
  # compiles the build tool and runs the incremental build.
  build:
    needs: detect
    name: build (${{ matrix.label }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Language toolchains (conditional) ───────────────────────
      #
      # Go is always installed — the build tool is written in Go.
      # Other toolchains are installed only if their language has
      # affected packages, as determined by the detect job.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Python
        if: needs.detect.outputs.needs_python == 'true' || runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Test ADJ Windows Job containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest discover -s code/scripts/tests -p test_adj_stdlib_provenance.py -k windows_job -k process_tree -k windows_containment -k job_close_root -k raw_pipe_close -k stuck_stdout -k stuck_drain

      - name: Test ADJ macOS strict-containment boundary
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s code/scripts/tests -p test_adj_stdlib_provenance.py -k posix_process -k process_tree -k guardian -k drain -k raw_pipe_close

      - name: Install uv
        if: needs.detect.outputs.needs_python == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # ── Lua must be set up BEFORE Ruby on Windows ──────────────
      #
      # Ruby's MSYS2 ships its own `link.exe` which shadows the MSVC
      # linker that Lua needs to compile. By installing MSVC + Lua
      # first, the MSVC `link.exe` is in PATH before Ruby's MSYS2.

      # MSVC on Windows serves two consumers: Lua (needs the MSVC linker) and
      # the C/C++ lane (needs `cl.exe` for the MSVC arm of the pure-ISO check).
      # A single msvc-dev-cmd invocation covers both — invoking the action twice
      # would double-prepend the MSVC environment.
      - name: Set up MSVC (Lua linker + C/C++ cl.exe + Venture browser)
        if: (needs.detect.outputs.needs_lua == 'true' || needs.detect.outputs.needs_cpp == 'true' || needs.detect.outputs.needs_venture_windows == 'true') && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore pinned Lua 5.4.7 cache
        id: lua-cache
        if: needs.detect.outputs.needs_lua == 'true'
        uses: actions/cache@v4
        with:
          path: .lua
          key: lua-5.4.7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('code/scripts/setup_lua.py') }}

      - name: Install pinned Lua 5.4.7 from verified mirrors
        if: needs.detect.outputs.needs_lua == 'true' && steps.lua-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python code/scripts/setup_lua.py --prefix .lua
          else
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install readline ncurses
            else
              sudo apt-get install -q libreadline-dev libncurses-dev
            fi
            python3 code/scripts/setup_lua.py --prefix .lua
          fi

      - name: Activate and verify pinned Lua 5.4.7
        if: needs.detect.outputs.needs_lua == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            lua_bin="$(cygpath -u "$GITHUB_WORKSPACE")/.lua/bin"
            cygpath -w "$lua_bin" >> "$GITHUB_PATH"
            "$lua_bin/lua.exe" -v
          else
            lua_bin="$GITHUB_WORKSPACE/.lua/bin"
            echo "$lua_bin" >> "$GITHUB_PATH"
            "$lua_bin/lua" -v
          fi

      - name: Set up LuaRocks (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        uses: leafo/gh-actions-luarocks@v4

      - name: Set up LuaRocks (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          curl -L -o luarocks.zip https://luarocks.github.io/luarocks/releases/luarocks-3.11.1-windows-64.zip
          powershell -Command "Expand-Archive -Path luarocks.zip -DestinationPath luarocks-install"
          cd luarocks-install\luarocks-3.11.1-windows-64
          echo %CD%>> %GITHUB_PATH%

      - name: Install Lua test tools (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -L --fail https://luarocks.org/manifests/hoelzro/lua-term-0.8-1.rockspec -o "$tmpdir/lua-term-0.8-1.rockspec"
          sed -i.bak 's|archive/0\.08\.tar\.gz|archive/refs/tags/0.08.tar.gz|' "$tmpdir/lua-term-0.8-1.rockspec"
          luarocks install "$tmpdir/lua-term-0.8-1.rockspec"
          rm -rf "$tmpdir"
          luarocks install busted
          luarocks install luacov
          luarocks install luacheck
          luarocks install luasocket 2>/dev/null || true

      - name: Install Lua test tools (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          luarocks install busted
          luarocks install luacov
          luarocks install luacheck
          for /f "delims=" %%i in ('luarocks path --lr-bin') do echo %%i>> %GITHUB_PATH%

      - name: Set up Ruby
        if: needs.detect.outputs.needs_ruby == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install bundler
        if: needs.detect.outputs.needs_ruby == 'true'
        shell: bash
        run: gem install bundler

      - name: Set up Node.js
        if: needs.detect.outputs.needs_typescript == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── C/C++ compilers (pure-ISO multi-compiler lane) ──────────
      #
      # The goal is that every pure-ISO C/C++ package compiles under GCC, Clang
      # (LLVM), and MSVC across the 3-OS matrix. Each runner contributes the
      # compilers only it can host:
      #   • ubuntu  → GCC (g++/gcc, preinstalled) + Clang (installed below)
      #   • windows → MSVC (cl.exe, via the msvc-dev-cmd step above)
      #   • macOS   → Apple Clang (preinstalled)
      # A real GCC exists only on Linux and real MSVC only on Windows, so no
      # single machine can host all three — coverage is achieved across the
      # matrix, and the ISO harness compiles with every compiler it finds.
      - name: Install Clang alongside GCC (Linux C/C++)
        if: needs.detect.outputs.needs_cpp == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          gcc --version | head -1
          clang --version | head -1

      - name: Set up Rust
        if: needs.detect.outputs.needs_rust == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_xaml_windows == 'true' || needs.detect.outputs.needs_mosaic_swift_runtime == 'true' || needs.detect.outputs.needs_mosaic_qt_runtime == 'true' || needs.detect.outputs.needs_mosaic_flutter_runtime == 'true' || needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        # Uses the `stable` channel (matching the rest of this repo's Rust CI).
        # NOTE on the -clippy gate: clippy adds/tightens lints on each stable
        # release, so a new Rust release can surface new lints on `main` — treat
        # that as normal maintenance (run `cargo clippy --fix` + resolve). Pinning
        # to a specific version was tried but broke BUILDs that invoke
        # `rustup run stable` / `rustup target add` (wasm + embedded firmware),
        # because a version-pinned default toolchain is not the `stable` alias
        # those scripts expect. Reproduce CI's clippy locally with the *current*
        # stable (`rustup update stable`), not a stale cached toolchain.
        uses: dtolnay/rust-toolchain@stable
        with:
          # dtolnay/rust-toolchain installs the minimal profile, which omits
          # clippy; the -clippy gate needs it, so request it explicitly.
          components: clippy

      - name: Install native Paint VM dependencies
        if: (needs.detect.outputs.needs_rust == 'true' || needs.detect.outputs.needs_venture_windows == 'true') && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install Venture Qt acceptance dependencies
        if: (needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_qt_runtime == 'true') && runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install cargo-tarpaulin
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Linux'
        run: cargo install cargo-tarpaulin

      - name: Set up Elixir
        # Elixir NIF packages skip Windows (BEAM import-library linkage isn't
        # wired up — see each Elixir package's BUILD_windows), and
        # erlef/setup-beam can't map newer Windows runner images (e.g.
        # win25-vs2026), so don't install Elixir on Windows at all.
        if: needs.detect.outputs.needs_elixir == 'true' && runner.os != 'Windows'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Set up Dart
        if: needs.detect.outputs.needs_dart == 'true' || needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Set up Swift (Windows)
        if: needs.detect.outputs.needs_swift == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --accept-package-agreements --accept-source-agreements --source winget
          $wingetExitCode = $LASTEXITCODE

          if ($wingetExitCode -ne 0) {
            Write-Warning "winget install exited with code $wingetExitCode; checking whether Swift is available anyway"
          }

          $currentPathEntries = @($env:Path -split ';')
          $currentPathSet = @{}
          foreach ($entry in $currentPathEntries) {
            if (-not [string]::IsNullOrWhiteSpace($entry)) {
              $currentPathSet[$entry] = $true
            }
          }

          $registryPathEntries = @(
            [System.Environment]::GetEnvironmentVariable('Path', 'User')
            [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          ) | Where-Object { $_ } | ForEach-Object { $_ -split ';' } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $newPathEntries = @()
          foreach ($entry in $registryPathEntries) {
            if (-not $currentPathSet.ContainsKey($entry)) {
              $currentPathSet[$entry] = $true
              $newPathEntries += $entry
            }
          }

          foreach ($entry in $newPathEntries) {
            $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if ($newPathEntries.Count -gt 0) {
            $env:Path = "$env:Path;$($newPathEntries -join ';')"
          }

          $swiftRoots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift')
            (Join-Path $env:ProgramFiles 'Swift')
          ) | Where-Object { Test-Path $_ }

          $swiftExe = @(
            (Get-Command swift -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
            ($swiftRoots | ForEach-Object {
              Get-ChildItem -Path $_ -Filter swift.exe -Recurse -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            })
          ) | Where-Object { $_ } | Select-Object -First 1

          if (-not $swiftExe) {
            if ($wingetExitCode -ne 0) {
              throw "winget install exited with code $wingetExitCode and swift.exe was not found"
            }
            throw 'swift.exe not found after winget install'
          }

          $toolchainBin = Split-Path -Parent $swiftExe
          if (-not $currentPathSet.ContainsKey($toolchainBin)) {
            $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$env:Path;$toolchainBin"
            $currentPathSet[$toolchainBin] = $true
          }
          Write-Host "Using Swift from $swiftExe"

          $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'User')
          if (-not $sdkRoot) {
            $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'Machine')
          }
          if (-not $sdkRoot) {
            $sdkRoot = $swiftRoots | ForEach-Object {
            Get-ChildItem -Path $_ -Filter Windows.sdk -Directory -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            } | Where-Object { $_ } | Select-Object -First 1
          }

          if ($sdkRoot) {
            "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:SDKROOT = $sdkRoot
            Write-Host "Using SDKROOT=$sdkRoot"
          }

          where.exe swift

      # ── Java / Kotlin ──────────────────────────────────────────
      #
      # Both Java and Kotlin packages use Gradle and JDK 21. Venture's
      # cross-platform package acceptance also emits and directly exercises
      # its Compose Desktop shell, even though the package harness is Rust.
      # A single JDK + Gradle setup covers all three cases.

      - name: Set up JDK 21
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || (needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && runner.os == 'Linux')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || (needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && runner.os == 'Linux')
        uses: gradle/actions/setup-gradle@v4

      - name: Disable long-lived Gradle services on Windows CI
        if: (needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true') && runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
          } >> "$GITHUB_ENV"

      - name: Install cpanm and test dependencies (Perl)
        if: needs.detect.outputs.needs_perl == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y cpanminus
            # Pre-install Test2::V0 to the system Perl location (requires sudo).
            # Without sudo, cpanm falls back to ~/perl5 which prove cannot find.
            sudo cpanm --quiet --notest Test2::V0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cpanminus
            cpanm --quiet --notest Test2::V0
          fi

      - name: Set up Haskell
        if: needs.detect.outputs.needs_haskell == 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4'
          cabal-version: '3.10'

      - name: Set up .NET
        if: needs.detect.outputs.needs_dotnet == 'true' || ((needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_xaml_windows == 'true') && runner.os == 'Windows')
        uses: actions/setup-dotnet@v4
        with:
          # .NET 9 is the current LTS release. No platform exclusions needed —
          # actions/setup-dotnet@v4 works identically on Ubuntu, macOS, and Windows.
          dotnet-version: '9.0.x'

      - name: Install ILAsm (real-CoreCLR assembler for the CLR-real conformance column)
        # The W16 conformance suite's `CLR-real` backend assembles textual `.il`
        # with `ilasm` and runs it on real `dotnet`. `ilasm` ships only in the
        # RID-specific NuGet runtime pack `runtime.<rid>.Microsoft.NETCore.ILAsm`
        # (the bare `Microsoft.NETCore.ILAsm` is ref-only, no binary). A
        # `<PackageDownload>` restore drops the binary into `~/.nuget/packages`,
        # exactly where the test harness's `find_ilasm()` searches — so the CLR
        # column is verified on the *real* runtime, not just the simulator.
        if: needs.detect.outputs.needs_dotnet == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rid=$(dotnet --info | sed -n 's/^[[:space:]]*RID:[[:space:]]*//p' | head -1)
          echo "Host RID: ${rid:-<unknown>}"
          if [ -z "${rid:-}" ]; then
            echo "Could not determine RID; the CLR-real column will skip gracefully."
            exit 0
          fi
          work=$(mktemp -d)
          cat > "$work/ilasm.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="runtime.$rid.Microsoft.NETCore.ILAsm" Version="[9.0.0]" />
            </ItemGroup>
          </Project>
          EOF
          # Non-fatal: if the pack is unavailable for this RID, the conformance
          # CLR-real arm simply returns None (skip), leaving the simulator floor.
          dotnet restore "$work/ilasm.csproj" || echo "ILAsm restore failed; CLR-real column will skip."
          found=$(find "$HOME/.nuget/packages" -iname ilasm -type f 2>/dev/null | head -1 || true)
          echo "ilasm binary: ${found:-<not found>}"

      - name: Install test runners
        shell: bash
        run: |
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            uv pip install --system pytest
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            npm install -g jest
          fi

      # ── Verify toolchains ────────────────────────────────────
      - name: Verify tools
        shell: bash
        run: |
          echo "Go: $(go version)"
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            echo "Python: $(python --version)"
            echo "uv: $(uv --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_ruby }}" = "true" ]; then
            echo "Ruby: $(ruby --version)"
            echo "Bundler: $(bundle --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_rust }}" = "true" ] || [ "${{ needs.detect.outputs.needs_venture_windows }}" = "true" ] || [ "${{ needs.detect.outputs.needs_mosaic_xaml_windows }}" = "true" ]; then
            echo "Rust: $(rustc --version)"
            echo "Cargo: $(cargo --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_swift }}" = "true" ]; then
            echo "Swift: $(swift --version | head -1)"
          fi
          if [ "${{ needs.detect.outputs.needs_elixir }}" = "true" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Elixir: $(elixir --version)"
            echo "Mix: $(mix --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dart }}" = "true" ]; then
            echo "Dart: $(dart --version 2>&1)"
          fi
          if [ "${{ needs.detect.outputs.needs_lua }}" = "true" ]; then
            echo "Lua: $(lua -v)"
            echo "LuaRocks: $(luarocks --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_perl }}" = "true" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Perl: $(perl --version | head -2 | tail -1)"
            echo "cpanm: $(cpanm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_haskell }}" = "true" ]; then
            echo "GHC: $(ghc --version)"
            echo "Cabal: $(cabal --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dotnet }}" = "true" ]; then
            echo ".NET: $(dotnet --version)"
          fi

      # ── Download build plan (skip discovery in build job) ─────
      - name: Download build plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan

      # ── Build the build tool ──────────────────────────────────
      - name: Compile build tool
        shell: bash
        run: |
          cd code/programs/go/build-tool
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o ../../../../build-tool.exe .
          else
            go build -o ../../../../build-tool .
          fi

      - name: Reclaim Linux runner disk
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEEDS_KOTLIN: ${{ needs.detect.outputs.needs_kotlin }}
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          # Keep the pre-installed Android SDK when Kotlin (Android) builds are
          # needed — deleting it forces a full re-download later, wasting several
          # minutes and ~5 GB of bandwidth per shard.
          if [ "$NEEDS_KOTLIN" != "true" ]; then
            sudo rm -rf /usr/local/lib/android || true
          fi
          docker system prune --all --force || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # ── Android SDK (Kotlin / Android) ────────────────────────
      #
      # android-actions/setup-android accepts licences, installs platform-tools
      # and build-tools via sdkmanager, and sets ANDROID_HOME / ANDROID_SDK_ROOT.
      # On Linux the pre-installed SDK is reused (we kept it above); on macOS and
      # Windows the action downloads a fresh SDK. Gradle then auto-downloads
      # the specific platform (API 35 / 36) on first build.
      - name: Set up Android SDK
        if: needs.detect.outputs.needs_kotlin == 'true'
        uses: android-actions/setup-android@v3

      - name: Build and test affected Swift packages on Windows
        if: runner.os == 'Windows' && needs.detect.outputs.needs_swift == 'true'
        shell: pwsh
        run: |
          $planFlag = @()
          if (Test-Path 'build-plan.json') {
            Write-Host 'Using pre-computed build plan'
            $planFlag = @('-plan-file', 'build-plan.json')
          }
          $shardFlag = @()
          if ('${{ matrix.sharded }}' -eq 'true') {
            $shardFlag = @('-shard-index', '${{ matrix.shard_index }}')
          }
