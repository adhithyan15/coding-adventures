[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-microbenchmark"
version = "0.1.0"
description = "Paired reference microbenchmark collection and analysis"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["coding-adventures-rank-statistics>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
array-microbenchmark = "microbenchmark.array_driver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microbenchmark"]

[tool.hatch.build.targets.sdist.force-include]
"../../../specs/fixtures/microbenchmark-pairs-v1.json" = "tests/microbenchmark-pairs-v1.json"

[tool.uv.sources]
coding-adventures-rank-statistics = { path = "../rank-statistics", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=microbenchmark --cov-fail-under=80"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
