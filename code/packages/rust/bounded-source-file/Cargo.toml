[package]
name = "bounded-source-file"
version = "0.1.0"
edition = "2021"
description = "Read a source file without ever holding more than a byte budget: regular files only, size checked before reading, read bounded after."

[dependencies]

# `O_NONBLOCK | O_NOCTTY` for the open, so a FIFO or tty swapped in after
# the regular-file check can neither block the open nor become the
# controlling terminal (see src/lib.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
