<svg xmlns="http://www.w3.org/2000/svg" width="982" height="541.24" viewBox="0 0 982 541.24" role="img" aria-label="How to write 四: 5 strokes · 4 pen lifts · 7 movements"><title>Writing 四</title><desc>7 frames; frame N shows movements 1 to N of 四 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 四.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%9B%9B.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 四. Medians 1–2 build the outer box exactly as 口 does — the left side, then the top and right in one turning stroke; medians 3–4 are the two pieces inside it; median 5 closes the bottom last. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those ordered medians to the vendored Noto Sans SC outline while preserving their directions and pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="541.24" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="217.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.87" viewBox="18 -823 961 1395.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 753L909 753L909 -39L832 -39L832 681L164 681L164 -47L88 -47L88 753ZM128