<svg xmlns="http://www.w3.org/2000/svg" width="342" height="339.16" viewBox="0 0 342 339.16" role="img" aria-label="How to write ゛: 2 strokes · 1 pen lift · 2 movements"><title>Writing ゛</title><desc>2 frames; frame N shows movements 1 to N of ゛ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0309b.svg, the spacing dakuten ゛ (U+309B), two stroke paths kvg:0309b-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0309b.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left tick, s2 the right one, which starts a little higher; both run down to the right. They are the same two paths KanjiVG gives the dakuten inside every voiced kana, such as が (kanji/0304c.svg, s4 and s5). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="342" height="339.16" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="189.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="189.41" viewBox="-57 -910 421 531.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M70 791Q83 773 101.5 742.5Q120 712 138.5 681Q157 650 167 630L109 605Q98 627 80.5 658Q63 689 45 719.5Q27 750 13 768L70 791ZM196 840Q209 822 227.5 791.5Q246 761 264.5 730.5Q283 700 294 679L236 655Q225 677 207.5 707.5Q190 738 172 768.5Q154 799 139 816L196 840Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M57 753 L57 753" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M57 753 L91 699 L125 645" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="125" cy="645" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="153.5" y="-431.3" text-anchor="middle" font-size="33.7" fill="#6b7280"><tspan x="153.5" y="-431.3">1. draw the left tick</tspan><tspan x="153.5" y="-390.2">down to the right</tspan></text></svg><rect x="176" y="60.75" width="150" height="189.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="189.41" viewBox="-57 -910 421 531.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M70 791Q83 773 101.5 742.5Q120 712 138.5 681Q157 650 167 630L109 605Q98 627 80.5 658Q63 689 45 719.5Q27 750 13 768L70 791ZM196 840Q209 822 227.5 791.5Q246 761 264.5 730.5Q283 700 294 679L236 655Q225 677 207.5 707.5Q190 738 172 768.5Q154 799 139 816L196 840Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M57 753 L91 699 L125 645" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M181 801 L181 801" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M181 801 L218 748 L253 693" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="253" cy="693" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="153.5" y="-431.3" text-anchor="middle" font-size="33.7" fill="#6b7280"><tspan x="153.5" y="-431.3">2. draw the right tick</tspan><tspan x="153.5" y="-390.2">down to the right</tspan></text></svg><text x="16" y="263.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/0309b.svg, the spacing</text><text x="16" y="275.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">dakuten ゛ (U+309B), two stroke paths kvg:0309b-s1 and s2</text><text x="16" y="288.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="300.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="313.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
