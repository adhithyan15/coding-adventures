<svg xmlns="http://www.w3.org/2000/svg" width="502" height="364.85" viewBox="0 0 502 364.85" role="img" aria-label="How to write ह: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ह</title><desc>3 frames; frame N shows movements 1 to N of ह (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ह-order.gif’, strokes 1–3, Wikimedia Commons, 9 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%B9-order.gif&gt;. Source note on variation: The 22-frame animation shows three ordered pen-down runs over a gray guide. Frames 2–12 start at the right stem&apos;s headline junction, descend top-to-bottom, sweep left through the shoulder, and curve clockwise around the hooked body to its lower-right tip without lifting. Frames 13–16 restart at the body&apos;s left junction, sweep down-left around the outer curve, and continue diagonally down-right through the tail. Frames 17–21 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. A 230 ms hold at frame 12 and a 250 ms hold at frame 16 delimit the first two runs before the one-second completed frame 21. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit IX, p. 48, independently shows the same right stem, leftward shoulder, hooked body, outer curve and tail, then headline buildup, but stages the joined first body across more component steps. The three-run lift count therefore comes from the animation. This learner path follows that animation-backed form and fits its turns and directions to Noto Sans Devanagari; everyday handwriting may divide or simplify the body differently.</desc><rect x="0" y="0" width="502" height="364.85" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="258.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="258.85" viewBox="-70 -692 685 1182.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M147 229Q112 256 90.5 286.5Q69 317 69 354Q69 408 107 436.5Q145 465 223 465L361 465L361 551L0 551L0 622L545 622L545 551L442 551L442 394L234 394Q190 394 169.5 381Q149 368 149 341Q149 322 161.5 304.5Q174 287 193 274L147 229ZM333 64Q368 79 386.5 100.5Q405 122 405 146Q405 179 378.5 200.5Q352 222 291 222Q222 222 185.5 193Q149 164 149 114Q149 74 176.5 42.5Q204 11 256.5 -16.5Q309 -44 383 -74L343 -142Q265 -110 203 -74.5Q141 -39 105 7.5Q69 54 69 117Q69 177 99 216Q129 255 179.5 274Q230 293 293 293Q361 293 403 272.5Q445 252 464.5 218.5Q484 185 484 145Q484 103 463.5 68.5Q443 34 390 6L333 64Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M402 550 L402 550" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M402 550 L402 510 L402 470 L402 430 L360 430 L315 430 L270 430 L225 430 L180 420 L140 400 L110 370 L105 340 L110 310 L135 285 L175 265 L225 258 L280 260 L335 245 L385 220 L425 185 L445 145 L445 110 L425 70 L390 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="390" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="272.5" y="336.9" text-anchor="middle" font-size="54.9" fill="#6b7280"><tspan x="272.5" y="336.9">1. descend, sweep left,</tspan><tspan x="272.5" y="403.9">and curve around the</tspan><tspan x="272.5" y="470.9">hooked body</tspan></text></svg><rect x="176" y="42" width="150" height="258.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="258.85" viewBox="-70 -692 685 1182.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M147 229Q112 256 90.5 286.5Q69 317 69 354Q69 408 107 436.5Q145 465 223 465L361 465L361 551L0 551L0 622L545 622L545 551L442 551L442 394L234 394Q190 394 169.5 381Q149 368 149 341Q149 322 161.5 304.5Q174 287 193 274L147 229ZM333 64Q368 79 386.5 100.5Q405 122 405 146Q405 179 378.5 200.5Q352 222 291 222Q222 222 185.5 193Q149 164 149 114Q149 74 176.5 42.5Q204 11 256.5 -16.5Q309 -44 383 -74L343 -142Q265 -110 203 -74.5Q141 -39 105 7.5Q69 54 69 117Q69 177 99 216Q129 255 179.5 274Q230 293 293 293Q361 293 403 272.5Q445 252 464.5 218.5Q484 185 484 145Q484 103 463.5 68.5Q443 34 390 6L333 64Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M402 550 L402 510 L402 470 L402 430 L360 430 L315 430 L270 430 L225 430 L180 420 L140 400 L110 370 L105 340 L110 310 L135 285 L175 265 L225 258 L280 260 L335 245 L385 220 L425 185 L445 145 L445 110 L425 70 L390 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M150 245 L150 245" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M150 245 L125 220 L100 185 L88 145 L90 105 L110 65 L145 25 L190 -10 L240 -40 L295 -70 L350 -100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="350" cy="-100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="272.5" y="336.9" text-anchor="middle" font-size="54.9" fill="#6b7280"><tspan x="272.5" y="336.9">2. lift, then sweep</tspan><tspan x="272.5" y="403.9">down-left and through</tspan><tspan x="272.5" y="470.9">the diagonal tail</tspan></text></svg><rect x="336" y="42" width="150" height="258.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="258.85" viewBox="-70 -692 685 1182.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M147 229Q112 256 90.5 286.5Q69 317 69 354Q69 408 107 436.5Q145 465 223 465L361 465L361 551L0 551L0 622L545 622L545 551L442 551L442 394L234 394Q190 394 169.5 381Q149 368 149 341Q149 322 161.5 304.5Q174 287 193 274L147 229ZM333 64Q368 79 386.5 100.5Q405 122 405 146Q405 179 378.5 200.5Q352 222 291 222Q222 222 185.5 193Q149 164 149 114Q149 74 176.5 42.5Q204 11 256.5 -16.5Q309 -44 383 -74L343 -142Q265 -110 203 -74.5Q141 -39 105 7.5Q69 54 69 117Q69 177 99 216Q129 255 179.5 274Q230 293 293 293Q361 293 403 272.5Q445 252 464.5 218.5Q484 185 484 145Q484 103 463.5 68.5Q443 34 390 6L333 64Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M402 550 L402 510 L402 470 L402 430 L360 430 L315 430 L270 430 L225 430 L180 420 L140 400 L110 370 L105 340 L110 310 L135 285 L175 265 L225 258 L280 260 L335 245 L385 220 L425 185 L445 145 L445 110 L425 70 L390 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M150 245 L125 220 L100 185 L88 145 L90 105 L110 65 L145 25 L190 -10 L240 -40 L295 -70 L350 -100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L70 585 L135 585 L200 585 L265 585 L330 585 L395 585 L460 585 L540 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="540" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="272.5" y="336.9" text-anchor="middle" font-size="54.9" fill="#6b7280"><tspan x="272.5" y="336.9">3. lift, then draw the</tspan><tspan x="272.5" y="403.9">shirorekha</tspan><tspan x="272.5" y="470.9">left-to-right</tspan></text></svg><text x="16" y="313.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ह-order.gif’, strokes 1–3, Wikimedia Commons, 9 May</text><text x="16" y="326.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="338.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
