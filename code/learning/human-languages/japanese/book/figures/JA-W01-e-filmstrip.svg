<svg xmlns="http://www.w3.org/2000/svg" width="982" height="291.94" viewBox="0 0 982 291.94" role="img" aria-label="How to write え: 2 strokes · 1 pen lift · 6 movements"><title>Writing え</title><desc>6 frames; frame N shows movements 1 to N of え (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03048.svg, hiragana え (U+3048 HIRAGANA LETTER E), two stroke paths kvg:03048-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03048.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short top stroke drawn left to right, ending in a small turn down that the print glyph does not show; s2 starts at the left, runs right, turns sharply down to the lower left, turns back and climbs up and to the right to the small hump, comes down over it and runs out to the right along the base. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. The print glyph&apos;s hump branches off the diagonal, so where KanjiVG&apos;s handwriting climbs back beside the diagonal, the path retraces the diagonal&apos;s ink up to that branch.</desc><rect x="0" y="0" width="982" height="291.94" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="198.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.44" viewBox="46 -859 932 1233" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M312 789Q353 780 4