<svg xmlns="http://www.w3.org/2000/svg" width="502" height="291.36" viewBox="0 0 502 291.36" role="img" aria-label="How to write ப: one unbroken stroke · 3 movements"><title>Writing ப</title><desc>3 frames; frame N shows movements 1 to N of ப (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Frame 1, ப (University of Texas at Austin, 2009) &lt;https://sites.la.utexas.edu/tamilscript/category/3-moduals/module-01&gt;. Source note on variation: Frame 1 teaches the usual left-to-right and top-to-bottom movement and directly presents ப for copying. Tamil handwriting varies by school; this is one attested continuous order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="502" height="291.36" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="185.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="185.36" viewBox="18 -624 742 916.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L174 554L174 72L604 72L604 554L690 554L690 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 548 L110 548" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 548 L104 120 L104 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="104" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="389" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="389" y="199.5">1. down the left</tspan><tspan x="389" y="272.1">upright</tspan></text></svg><rect x="176" y="42" width="150" height="185.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="185.36" viewBox="18 -624 742 916.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L174 554L174 72L604 72L604 554L690 554L690 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 548 L104 120 L104 40 L104 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M104 40 L240 24 L410 22 L570 28 L664 42" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="664" cy="42" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="389" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="389" y="199.5">2. along the bottom</tspan></text></svg><rect x="336" y="42" width="150" height="185.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="185.36" viewBox="18 -624 742 916.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L174 554L174 72L604 72L604 554L690 554L690 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 548 L104 120 L104 40 L240 24 L410 22 L570 28 L664 42 L664 42" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M664 42 L674 180 L672 430 L672 548" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="672" cy="548" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="389" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="389" y="199.5">3. up the right upright</tspan></text></svg><text x="16" y="240.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Frame 1, ப</text><text x="16" y="252.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin, 2009)</text><text x="16" y="265.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
