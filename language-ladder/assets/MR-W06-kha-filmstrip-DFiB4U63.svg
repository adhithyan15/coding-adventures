<svg xmlns="http://www.w3.org/2000/svg" width="662" height="282.13" viewBox="0 0 662 282.13" role="img" aria-label="How to write ख: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ख</title><desc>4 frames; frame N shows movements 1 to N of ख (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ख-order.gif’, strokes 1–4, Wikimedia Commons, 9 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%96-order.gif&gt;. Source note on variation: The 28-frame animation shows four ordered pen-down runs: frames 2–12 descend the left stem, curl clockwise around the small left opening, and continue through the broad lower bowl to its lower-right junction without lifting; frames 13–20 restart at the upper-left of the right opening and sweep clockwise around its oval to the open lower-left tip; frames 21–23 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 24–27 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. This learner path follows that sourced four-run order and fits both loops to Noto Sans Devanagari; everyday handwriting may narrow or join the bowls differently.</desc><rect x="0" y="0" width="662" height="282.13" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="188.63" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="188.63" viewBox="-70 -692 972 1222.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M265 551L276 561Q287 542 292.5 516.5Q298 491 298 458Q298 374 260.5 324Q223 274 153 240L157 247Q192 193 238.5 155.5Q285 118 343 98.5Q401 79 469 79Q531 79 584 94Q637 109 681 