[package]
name = "chief-of-staff-daemon-secret-file"
version = "0.1.0"
edition = "2021"
description = "Race-resistant owner-only secret-file loading for the D18 Chief daemon"
license = "MIT"

[features]
# `write_test_secret`, for other crates' tests only.
test-support = []

[dependencies]
coding_adventures_zeroize = { path = "../zeroize" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
