<svg xmlns="http://www.w3.org/2000/svg" width="822" height="274.93" viewBox="0 0 822 274.93" role="img" aria-label="How to write ਗ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ਗ</title><desc>5 frames; frame N shows movements 1 to N of ਗ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਗ (gaggaa) checkpoints, strokes 1–3 (lib/data/lessons/lesson_tracing.dart line 247, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L247&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਗ in three pen-down strokes: the headline from left to right; then from the top of the middle stem down, clockwise round the bowl and along its bar back to the stem, ending in the upper middle; then the right stem from the top down. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਗ, each by a different non-native copyist; only counts and shares are cited. 90% (18 of 20) draw it in three strokes, the source&apos;s count and their most common one. For the first stroke of the body, 50% (10 of 20) start in the same part of the letter as the source and 95% (19 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="274.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="168.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="168.93" viewBox="-77 -692 904 1018.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M275 0Q226 0 183 22Q140 44 107 81.5Q74 119 55.5 165Q37 211 37 258Q37 291 48.5 317.5Q60 344 78 362Q102 386 139.5 397Q177 408 247 408L351 408L351 551L-7 551L-7 622L757 622L757 551L661 551L661 0L580 0L580 551L432 551L432 170Q432 83 391.5 41.5Q351 0 275 0ZM274 73Q292 73 307 77Q322 81 334 94Q342 104 346.5 120.5Q351 137 351 176L351 337L263 337Q202 337 177 331.5Q152 326 137 311Q127 300 122.5 285Q118 270 118 252Q118 222 131 191Q144 160 166.5 133Q189 106 216.5 89.5Q244 73 274 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L55 586 L95 586 L134 586 L174 586 L214 586 L254 586 L294 586 L334 586 L374 586 L413 586 L453 586 L493 586 L533 586 L573 586 L612 586 L652 586 L692 586 L732 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="732" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="375" y="212.4" text-anchor="middle" font-size="72.4" fill="#6b7280"><tspan x="375" y="212.4">1. draw the headline</tspan><tspan x="375" y="300.7">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="168.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="168.93" viewBox="-77 -692 904 1018.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M275 0Q226 0 183 22Q140 44 107 81.5Q74 119 55.5 165Q37 211 37 258Q37 291 48.5 317.5Q60 344 78 362Q102 386 139.5 397Q177 408 247 408L351 408L351 551L-7 551L-7 622L757 622L757 551L661 551L661 0L580 0L580 551L432 551L432 170Q432 83 391.5 41.5Q351 0 275 0ZM274 73Q292 73 307 77Q322 81 334 94Q342 104 346.5 120.5Q351 137 351 176L351 337L263 337Q202 337 177 331.5Q152 326 137 311Q127 300 122.5 285Q118 270 118 252Q118 222 131 191Q144 160 166.5 133Q189 106 216.5 89.5Q244 73 274 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L95 586 L134 586 L174 586 L214 586 L254 586 L294 586 L334 586 L374 586 L413 586 L453 586 L493 586 L533 586 L573 586 L612 586 L652 586 L692 586 L732 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M385 586 L385 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M385 586 L388 549 L390 511 L390 472 L390 433 L390 394 L390 355 L390 316 L390 277 L390 238 L389 200 L387 162 L384 124" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="384" cy="124" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="375" y="212.4" text-anchor="middle" font-size="72.4" fill="#6b7280"><tspan x="375" y="212.4">2. lift, then come down</tspan><tspan x="375" y="300.7">the middle stem</tspan></text></svg><rect x="336" y="42" width="150" height="168.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="168.93" viewBox="-77 -692 904 1018.