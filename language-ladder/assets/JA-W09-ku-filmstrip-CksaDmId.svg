<svg xmlns="http://www.w3.org/2000/svg" width="342" height="418.47" viewBox="0 0 342 418.47" role="img" aria-label="How to write く: one unbroken stroke · 2 movements"><title>Writing く</title><desc>2 frames; frame N shows movements 1 to N of く (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana く stroke order animation.gif, hiragana く, 20 frames, 2.0 seconds (Wikimedia Commons, 8 March 2010) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%8F_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws く in one uninterrupted run: sweep down and left from the upper right into the sharp central turn, then continue down and right to the lower tip. The path is fitted to the bundled Noto Sans JP subset; handwritten curvature and turn sharpness vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="342" height="418.47" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="287.47" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="287.47" viewBox="127 -874 669 1282.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M704 738Q688 726 668 708.5Q648 691 635 681Q609 658 572 627.5Q535 597 494 563.5Q453 530 415 499.5Q377 469 349 445Q319 419 309 402.5Q299 386 309.5 369Q320 352 352 324Q380 302 416 272.5Q452 243 492.5 209Q533 175 575 139Q617 103 656 68Q695 33 726 1L655 -65Q624 -29 586 8Q560 35 521 71Q482 107 437.5 146Q393 185 349.5 221.5Q306 258 271 287Q223 327 210 357.5Q197 388 215 418Q233 448 278 485Q306 509 345.5 541Q385 573 428 608.5Q471 644 509.5 677.5Q548 711 573 737Q588 752 604.5 771Q621 790 630 804L704 738Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M667 770 L667 770" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M667 770 L600 700 L500 610 L400 525 L310 450 L250 390" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="250" cy="390" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="461.5" y="258.6" text-anchor="middle" font-size="53.6" fill="#6b7280"><tspan x="461.5" y="258.6">1. sweep down-left from</tspan><tspan x="461.5" y="324">the upper right into the</tspan><tspan x="461.5" y="389.4">central turn</tspan></text></svg><rect x="176" y="42" width="150" height="287.47" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="287.47" viewBox="127 -874 669 1282.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M704 738Q688 726 668 708.5Q648 691 635 681Q609 658 572 627.5Q535 597 494 563.5Q453 530 415 499.5Q377 469 349 445Q319 419 309 402.5Q299 386 309.5 369Q320 352 352 324Q380 302 416 272.5Q452 243 492.5 209Q533 175 575 139Q617 103 656 68Q695 33 726 1L655 -65Q624 -29 586 8Q560 35 521 71Q482 107 437.5 146Q393 185 349.5 221.5Q306 258 271 287Q223 327 210 357.5Q197 388 215 418Q233 448 278 485Q306 509 345.5 541Q385 573 428 608.5Q471 644 509.5 677.5Q548 711 573 737Q588 752 604.5 771Q621 790 630 804L704 738Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M667 770 L600 700 L500 610 L400 525 L310 450 L250 390 L250 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 390 L300 330 L390 250 L490 165 L590 75 L690 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="-30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="461.5" y="258.6" text-anchor="middle" font-size="53.6" fill="#6b7280"><tspan x="461.5" y="258.6">2. continue down-right</tspan><tspan x="461.5" y="324">to the lower tip</tspan></text></svg><text x="16" y="342.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana く stroke order</text><text x="16" y="354.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">animation.gif, hiragana く, 20 frames, 2.0 seconds</text><text x="16" y="367.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Wikimedia Commons, 8 March 2010)</text><text x="16" y="379.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="392.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
