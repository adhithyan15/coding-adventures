[package]
name = "adjudication-tsa-demo"
version = "0.11.1"
edition = "2021"
description = "A/B/C demo harness: compare a raw local Ollama model (Arm A) and the full adjudication pipeline (Arm B) against a third deterministic engine arm (Arm C, v0.11). v0.10 added adversarial multi-model elicitation; v0.10.1 fixed a cache-bypass in Stage 0. v0.11 added ADJ16 step 5 library API for the engine arm. v0.11.1 wires the engine arm into main.rs behind ADJ_DEMO_ENGINE_ARM={strict|lenient|both} for CLI side-by-side output."

[[bin]]
name = "adjudication-tsa-demo"
path = "src/main.rs"

[dependencies]
adjudication-audit-trail = { path = "../adjudication-audit-trail" }
adjudication-clarification = { path = "../adjudication-clarification" }
adjudication-ir = { path = "../adjudication-ir" }
adjudication-pipeline = { path = "../adjudication-pipeline" }
adjudication-rulebook = { path = "../adjudication-rulebook" }
llm-cache = { path = "../llm-cache" }
llm-gateway = { path = "../llm-gateway" }
llm-primitives = { path = "../llm-primitives" }
llm-provider-ollama = { path = "../llm-provider-ollama" }
logic-core = { path = "../logic-core" }
serde_json = "1"
