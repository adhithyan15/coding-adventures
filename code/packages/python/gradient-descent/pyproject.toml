[project]
name = "coding-adventures-gradient-descent"
version = "1.1.0"
description = "Pure mathematical gradient descent optimizers"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv*",
    "/dist",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gradient_descent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gradient_descent --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
