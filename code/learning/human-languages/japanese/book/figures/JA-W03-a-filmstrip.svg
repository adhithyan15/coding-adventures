<svg xmlns="http://www.w3.org/2000/svg" width="822" height="305.81" viewBox="0 0 822 305.81" role="img" aria-label="How to write あ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing あ</title><desc>5 frames; frame N shows movements 1 to N of あ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03042.svg, hiragana あ (U+3042 HIRAGANA LETTER A), three stroke paths kvg:03042-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03042.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the bar drawn left to right; s2 starts above the bar and runs down through it; s3 starts at the upper right, cuts down and to the left across the vertical, turns at the lower left without lifting, loops back up and over to the right, rounds the right side of the bowl and finishes low, heading left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="305.81" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="199.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.81" viewBox="39 -864 936 1246.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M472 792Q468 783 465.5 770.5Q463 758 460 747Q452 706 444 643Q436 580 431 508.5Q426 437 426 368Q426 304 434.5 243Q443 182 456.5 126.5Q470 71 485 24L413 2Q398 47 385 106.5Q372 166 364 231.5Q356 297 356