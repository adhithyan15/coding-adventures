<svg xmlns="http://www.w3.org/2000/svg" width="982" height="293.64" viewBox="0 0 982 293.64" role="img" aria-label="How to write 那: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 那</title><desc>6 frames; frame N shows movements 1 to N of 那 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 那.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E9%82%A3.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 那, in two pieces. Medians 1–4 draw the left piece: a horizontal that turns down the right side and hooks to the left at the foot without lifting, two horizontals, then a left-falling stroke from the top through both. Medians 5–6 draw 阝 on the right: a stroke that runs right, falls back to the left, swells round to the right and hooks to the left without lifting, then the vertical. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns, the two hooks and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s left piece reaches lower than the source&apos;s, so its hook sits at the foot.</desc><rect x="0" y="0" width="982" height="293.64" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" widt