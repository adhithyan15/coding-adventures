<svg xmlns="http://www.w3.org/2000/svg" width="342" height="314.62" viewBox="0 0 342 314.62" role="img" aria-label="How to write ె: one unbroken stroke · 2 movements"><title>Writing ె</title><desc>2 frames; frame N shows movements 1 to N of ె (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 57 (ె, e sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. All 210 stored prototypes of the e sign are one pen-down stroke. 208 start in the lower half, at the printed sign&apos;s lower tip, and 207 turn anticlockwise; 179 end in the top third and 203 in the left third, at the left end of the top bar (175 do all four). Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="342" height="314.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 2 movements</text><rect x="16" y="60.75" width="150" height="152.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="152.37" viewBox="-619 -753 657 667.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-32 553Q-32 520 -43.5 496.5Q-55 473 -71 460Q-94 441 -126.5 433Q-159 425 -216 425L-271 425L-271 500L-204 500Q-172 500 -155.5 503.5Q-139 507 -129 515Q-121 522 -117.5 531Q-114 540 -114 552Q-114 565 -118 575Q-122 585 -130 592Q-140 600 -155 604Q-170 608 -205 608L-549 608L-549 683L-211 683Q-156 683 -124.5 675Q-93 667 -70 647Q-53 632 -42.5 609.5Q-32 587 -32 553Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-255 462 L-255 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-255 462 L-206 463 L-170 465 L-136 474 L-100 495 L-79 523 L-73 553" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-73" cy="553" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-290.5" y="-232.4" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="-290.5" y="-232.4">1. start at the lower</tspan><tspan x="-290.5" y="-168.2">tip and curve to the</tspan><tspan x="-290.5" y="-104.1">right</tspan></text></svg><rect x="176" y="60.75" width="150" height="152.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="152.37" viewBox="-619 -753 657 667.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-32 553Q-32 520 -43.5 496.5Q-55 473 -71 460Q-94 441 -126.5 433Q-159 425 -216 425L-271 425L-271 500L-204 500Q-172 500 -155.5 503.5Q-139 507 -129 515Q-121 522 -117.5 531Q-114 540 -114 552Q-114 565 -118 575Q-122 585 -130 592Q-140 600 -155 604Q-170 608 -205 608L-549 608L-549 683L-211 683Q-156 683 -124.5 675Q-93 667 -70 647Q-53 632 -42.5 609.5Q-32 587 -32 553Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-255 462 L-206 463 L-170 465 L-136 474 L-100 495 L-79 523 L-73 553 L-73 553" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-73 553 L-79 581 L-94 608 L-119 629 L-149 640 L-183 645 L-219 645 L-259 645 L-302 645 L-349 645 L-397 645 L-446 645 L-491 645 L-528 645" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-528" cy="645" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-290.5" y="-232.4" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="-290.5" y="-232.4">2. curve up and back to</tspan><tspan x="-290.5" y="-168.2">the left along the top</tspan><tspan x="-290.5" y="-104.1">bar</tspan></text></svg><text x="16" y="226.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic</text><text x="16" y="238.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Character Recognizers 4.0, Telugu recognizer, class 57 (ె,</text><text x="16" y="251.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">e sign): stored online-handwriting prototypes from native</text><text x="16" y="263.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">writers (MIT licence, 2012)</text><text x="16" y="276.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="288.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
