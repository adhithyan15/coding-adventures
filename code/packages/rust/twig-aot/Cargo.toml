[package]
name = "twig-aot"
version = "0.15.0"
edition = "2021"
description = "Twig AOT compiler — produces native Mach-O / ELF executables from Twig source.  v0.15.0 (LANG-FULL E2 — register width & wrap): a new IIR prep pass `mask_narrow_width_arith` wraps narrow unsigned arithmetic (u4/u8/u16/u32) by appending `const <mask>; and dest, tmp, mask` after each narrow op, so the native aarch64/x86_64 backends compute `200u8+100u8=44` without any machine-backend change.  No-op for i64/u64 programs (Twig/McCarthy/Brainfuck/BASIC)."

[dependencies]
twig-ir-compiler     = { path = "../twig-ir-compiler" }
interpreter-ir        = { path = "../interpreter-ir" }
aot-core              = { path = "../aot-core" }
aarch64-backend       = { path = "../aarch64-backend" }
x86_64-backend        = { path = "../x86_64-backend" }
x86_64-encoder        = { path = "../x86_64-encoder" }
jit-core              = { path = "../jit-core" }
code-packager         = { path = "../code-packager" }
cli-builder           = { path = "../cli-builder" }
iir-builtin-lowering  = { path = "../iir-builtin-lowering" }
iir-refinement-pass   = { path = "../iir-refinement-pass" }
tempfile             = "3"

[[bin]]
name = "twig-aot"
path = "bin/twig_aot.rs"

[build-dependencies]
cc = "1"

[dev-dependencies]
aarch64-encoder  = { path = "../aarch64-encoder" }
# Golden divergence guard (LANG77): the `lispy_runtime_golden` test pins the
# C runtime's tag constants and encodings against lispy-runtime's canonical
# `pub const`s and constructors, so the two implementations cannot silently
# drift.  Dev-only — the AOT binary itself never links the Rust crate.
lispy-runtime    = { path = "../lispy-runtime" }
