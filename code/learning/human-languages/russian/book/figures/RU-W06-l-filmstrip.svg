<svg xmlns="http://www.w3.org/2000/svg" width="502" height="327.45" viewBox="0 0 502 327.45" role="img" aria-label="How to write л: one unbroken stroke · 3 movements"><title>Writing л</title><desc>3 frames; frame N shows movements 1 to N of л (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase л demonstration, 05:06–05:10, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 05:06–05:10 lowercase л demonstration, the pen begins near the baseline, curves left around a small hook, rises steeply to a high apex, descends through the right leg to the baseline, and finishes through a small rising exit in one continuous pen-down run, for zero intervening lifts. The demonstrated school hand has a pointed apex, a slanted right leg, and entry and exit joins; the bundled Noto Sans Cyrillic glyph is a block-like printed form with a curved left leg, a horizontal top shoulder, and a straight right stem. This learner path preserves the source&apos;s hooked-left-leg-to-apex-to-right-leg order and zero-lift evidence while fitting the printed form: curve through the left leg, sweep along the top shoulder, and descend the right stem without lifting. Connected cursive restores the source&apos;s pointed apex, slanted right leg, and rising exit, and individual handwriting may round, narrow, or slant the legs differently.</desc><rect x="0" y="0" width="502" height="327.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="221.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.45" viewBox="-70 -606 642 947.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 -7Q26 -7 0 2L0 78Q13 75 21.5 74Q30 73 39 73Q75 73 93 97.5Q111 122 118 194Q121 229 123.5 262Q126 295 128 333Q130 371 133 420Q136 469 139 536L502 536L502 0L414 0L414 462L215 462Q210 371 206 307.5Q202 244 197 185Q187 81 155 37Q123 -7 54 -7Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M25 30 L25 30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M25 30 L55 25 L85 35 L110 75 L125 140 L135 240 L145 360 L160 460 L175 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="175" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="251" y="198.4" text-anchor="middle" font-size="51.4" fill="#6b7280"><tspan x="251" y="198.4">1. curve from the</tspan><tspan x="251" y="261.1">baseline hook up the</tspan><tspan x="251" y="323.8">left leg</tspan></text></svg><rect x="176" y="42" width="150" height="221.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.45" viewBox="-70 -606 642 947.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 -7Q26 -7 0 2L0 78Q13 75 21.5 74Q30 73 39 73Q75 73 93 97.5Q111 122 118 194Q121 229 123.5 262Q126 295 128 333Q130 371 133 420Q136 469 139 536L502 536L502 0L414 0L414 462L215 462Q210 371 206 307.5Q202 244 197 185Q187 81 155 37Q123 -7 54 -7Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M25 30 L55 25 L85 35 L110 75 L125 140 L135 240 L145 360 L160 460 L175 500 L175 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M175 500 L260 500 L360 500 L458 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="458" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="251" y="198.4" text-anchor="middle" font-size="51.4" fill="#6b7280"><tspan x="251" y="198.4">2. sweep right along the</tspan><tspan x="251" y="261.1">top shoulder</tspan></text></svg><rect x="336" y="42" width="150" height="221.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="221.45" viewBox="-70 -606 642 947.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 -7Q26 -7 0 2L0 78Q13 75 21.5 74Q30 73 39 73Q75 73 93 97.5Q111 122 118 194Q121 229 123.5 262Q126 295 128 333Q130 371 133 420Q136 469 139 536L502 536L502 0L414 0L414 462L215 462Q210 371 206 307.5Q202 244 197 185Q187 81 155 37Q123 -7 54 -7Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M25 30 L55 25 L85 35 L110 75 L125 140 L135 240 L145 360 L160 460 L175 500 L260 500 L360 500 L458 500 L458 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M458 500 L458 380 L458 260 L458 140 L458 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="458" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="251" y="198.4" text-anchor="middle" font-size="51.4" fill="#6b7280"><tspan x="251" y="198.4">3. descend the right</tspan><tspan x="251" y="261.1">stem to the baseline</tspan></text></svg><text x="16" y="276.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’,</text><text x="16" y="288.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">lowercase л demonstration, 05:06–05:10, YouTube, 5 February 2013</text><text x="16" y="301.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
