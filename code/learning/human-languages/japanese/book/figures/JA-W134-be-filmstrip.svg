<svg xmlns="http://www.w3.org/2000/svg" width="662" height="269.93" viewBox="0 0 662 269.93" role="img" aria-label="How to write べ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing べ</title><desc>4 frames; frame N shows movements 1 to N of べ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03079.svg, hiragana べ (U+3079 HIRAGANA LETTER BE), three stroke paths kvg:03079-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03079.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is へ&apos;s stroke, the same paths as in its file for へ, kanji/03078.svg; s2 and s3 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="662" height="269.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="163.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="163.93" viewBox="-23 -796 1035 1131.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M47 256Q66 270 82.5 285.5Q99 301 119 322Q139 342 163.5 371.5Q188 401 214.5 434.5Q241 468 267 501Q293 534 315 560Q359 612 400.5 616.5Q442 621 492 571Q522 540 556 499.5Q590 459 625.5 418Q661 377 692 342Q715 317 744 286Q773 255 806 221.5Q839 188 873.5 154Q908 120 942 90L878 18Q840 54 799 98.5Q758 143 718 188Q678 233 644 272Q6