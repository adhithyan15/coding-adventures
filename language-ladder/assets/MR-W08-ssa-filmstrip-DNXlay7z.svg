L145 255 L170 220 L205 195 L245 182 L285 182 L325 195 L360 220 L388 255 L408 300 L420 350 L420 410 L420 475 L420 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M420 551 L420 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M420 551 L420 475 L420 395 L420 315 L420 235 L420 155 L420 75 L420 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="296" y="198.7">2. lift, then descend</tspan><tspan x="296" y="270.3">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="230.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="230.76" viewBox="-70 -692 732 1126.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M138 534L184 578L428 273L379 232L138 534ZM489 551L489 0L408 0L408 236L427 209Q402 184 359 168.5Q316 153 266 153Q207 153 165 175Q123 197 101 241.5Q79 286 79 352L79 551L0 551L0 622L592 622L592 551L489 551ZM408 551L160 551L160 349Q160 306 172 278.5Q184 251 207.5 237.5Q231 224 264 224Q300 224 329.5 235.5Q359 247 382.5 266Q406 285 424 307L408 255L408 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 551 L120 480 L120 410 L120 350 L128 300 L145 255 L170 220 L205 195 L245 182 L285 182 L325 195 L360 220 L388 255 L408 300 L420 350 L420 410 L420 475 L420 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M420 551 L420 475 L420 395 L420 315 L420 235 L420 155 L420 75 L420 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="ro