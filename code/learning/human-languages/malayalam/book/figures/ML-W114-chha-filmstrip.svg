<svg xmlns="http://www.w3.org/2000/svg" width="822" height="219.36" viewBox="0 0 822 219.36" role="img" aria-label="How to write ഛ: one unbroken stroke · 5 movements"><title>Writing ഛ</title><desc>5 frames; frame N shows movements 1 to N of ഛ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxvi: movements 1-5 for ഛ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-036.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxvi) starts at the inner tip and curls clockwise over the top and down (1), runs left along the base (2) and back right along it (3), then climbs clockwise over the big arch and down its right side (4) and curls up round the inner loop (5). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 45 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (21 of 45) and end at the upper right (44 of 45). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its CHA.png at the middle left and ends it at the upper right. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing; the run back along the base retraces the ink just drawn, and the inner loop ends where Noto runs it into the right side.</desc><rect x="0" y="0" width="822" height="219.36" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="113.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="113.36" viewBox="-53 -636 1433 1083" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 365Q404 365 439 350Q474 335 496 309Q518 283 528.5 251Q539 219 539 185Q539 156 531.5 131.5Q524 107 511.5 87.5Q499 68 485 54L460 70L775 70L790 0L17 0L17 70L448 70L394 58Q414 72 434.5 101.5Q455 131 455 179Q455 231 428.5 263Q402 295 351 295Q300 295 273.5 265Q247 235 247 185Q247 172 248 162.5Q249 153 250 146L167 135Q165 145 163 161.5Q161 178 161 194Q161 271 213.5 318Q266 365 354 365ZM977 566Q1060 566 1122.5 542Q1185 518 1226.5 474Q1268 430 1289 371Q1310 312 1310 242Q1310 153 1282 96.5Q1254 40 1206 14Q1158 -12 1098 -12Q1033 -12 990 17Q947 46 925.5 93.5Q904 141 904 196Q904 291 955 347.5Q1006 404 1091 404Q1147 404 1189 375Q1231 346 1255 301Q1279 256 1281 206L1256 209Q1249 240 1229 268.5Q1209 297 1178.5 315.5Q1148 334 1108 334Q1046 334 1017 296.5Q988 259 988 198Q988 157 999.5 125Q1011 93 1035 75.5Q1059 58 1098 58Q1139 58 1167.5 77Q1196 96 1211.5 138Q1227 180 1227 248Q1227 250 1225.5 270Q1224 290 1220 310Q1219 315 1219 323Q1219 331 1217 335Q1208 378 1178 414Q1148 450 1098 472Q1048 494 977 494Q905 494 852 468Q799 442 770 393Q741 344 741 273Q741 217 756.5 178Q772 139 797.5 109.5Q823 80 852 54L816 0L774 0L758 43Q732 67 707.5 101.5Q683 136 667.5 180.5Q652 225 652 277Q652 333 671 385Q690 437 729.5 478Q769 519 830.5 542.5Q892 566 977 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 176 L205 176" fill="none" stroke="#9aa1ad" stroke