<svg xmlns="http://www.w3.org/2000/svg" width="982" height="319.53" viewBox="0 0 982 319.53" role="img" aria-label="How to write ந: one unbroken stroke · 6 movements"><title>Writing ந</title><desc>6 frames; frame N shows movements 1 to N of ந (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 5, ந (University of Texas at Austin), p. 193 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Module 5 identifies ந as the voiced dental nasal and notes that its extended final curve may be omitted. Appendix I Frame 5 numbers six hand-movements. Native writers draw them as one continuous stroke, and this ductus follows the six movements in order without lifting: the pen climbs back up the middle upright to where the right bowl leaves it. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 85% of the 224 stored prototypes of ந are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="982" height="319.53" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="226.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.03" viewBox="-23 -624 834 1256.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M557 362Q608 362 649.5 336Q691 310 716 259Q741 208 741 134Q741 44 715 -8Q689 -60 642 -94Q610 -117 568.5 -131Q527 -145 473 -150.5Q419 -156 347 -156L272 -156Q230 -156 207 -162Q1