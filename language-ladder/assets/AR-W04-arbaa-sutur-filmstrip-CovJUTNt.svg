<svg xmlns="http://www.w3.org/2000/svg" width="342" height="419.67" viewBox="0 0 342 419.67" role="img" aria-label="How to write و: one unbroken stroke · 2 movements"><title>Writing و</title><desc>2 frames; frame N shows movements 1 to N of و (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ه و ي, independent Waw at 00:45.7–00:46.9 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%d9%87-%d9%88-%d9%8a/&gt;. Source note on variation: The page&apos;s directly linked waw.mov demonstrates independent و in one continuous pen-down run at 00:45.7–00:46.9. From the lower-right junction at 00:45.7–00:46.5, the pen sweeps left, curves up and around, and closes the small head loop. Without lifting, it continues from the junction at 00:46.5–00:46.9, descends, and curls left through the tail. The adjacent lesson identifies Waw as a one-way connector and gives both consonant w and long-vowel ū values. This one-stroke, zero-lift learner path fits the course&apos;s vendored Noto Naskh outline. Arabic و retains its own script-scoped provenance independently of the existing Persian record for the same Unicode glyph and source-backed geometry.</desc><rect x="0" y="0" width="342" height="419.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="276.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="276.17" viewBox="-36 -410 523 962.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M193 -203Q172 -203 141.5 -193.5Q111 -184 81.5 -169Q52 -154 34 -139L48 -106Q75 -116 105.5 -120.5Q136 -125 1