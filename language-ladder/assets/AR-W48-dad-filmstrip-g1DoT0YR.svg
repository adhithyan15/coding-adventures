<svg xmlns="http://www.w3.org/2000/svg" width="662" height="308.41" viewBox="0 0 662 308.41" role="img" aria-label="How to write ض: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ض</title><desc>4 frames; frame N shows movements 1 to N of ض (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: س ش ص ض, independent Daad at 00:43.1–00:46.3 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%D8%B3-%D8%B4-%D8%B5-%D8%B6/&gt;. Source note on variation: The page&apos;s embedded Panopto Daad lesson demonstrates independent ض in three pen-down runs at 00:43.1–00:46.3. The first run at 00:43.1–00:45.0 begins at the lower-left junction, closes the oval clockwise, then turns left and rises into the short shoulder without lifting. After one lift, the second run at 00:45.2–00:45.4 restarts at the baseline junction and sweeps through the trailing bowl. After a second lift, the pen places the upper dot last at 00:46.0–00:46.3. The page&apos;s directly linked FullSizeRender-5.mov returned HTTP 403 during this audit, so these timestamps come from the accessible embedded primary lesson; cross-checking the embedded Saad lesson against the separately audited direct Saad clip confirms the same two body runs. The adjacent lesson identifies Daad as a two-way connector and separately prints its contextual shapes. This three-stroke, two-lift learner path fits the course&apos;s vendored Noto Naskh outline while keeping Daad&apos;s dot order independently evidenced rather than inferred from Saad.</desc><rect x="0" y="0" width="662" height="308.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="202