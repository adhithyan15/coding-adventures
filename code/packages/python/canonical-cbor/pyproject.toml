[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-canonical-cbor"
version = "0.1.0"
description = "Deterministic length-first canonical CBOR codec"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/canonical_cbor"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=canonical_cbor --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["canonical_cbor"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
