[package]
name = "semantic-ir-to-c"
version = "0.42.2"
edition = "2021"
description = "Semantic IR → self-contained C source code (SIR24). Sixth backend for the SIR10 narrow-waist IR — gives Ruby→C (and Python/JS/Twig→C) through the shared waist."

[dependencies]
semantic-ir = { path = "../semantic-ir" }

[dev-dependencies]
# Private scratch directories and an isolated Go build cache for the
# execution tests (see sir-test-scratch's README).
sir-test-scratch = { path = "../sir-test-scratch" }
twig-to-semantic-ir = { path = "../twig-to-semantic-ir" }
ruby-to-semantic-ir = { path = "../ruby-to-semantic-ir" }
