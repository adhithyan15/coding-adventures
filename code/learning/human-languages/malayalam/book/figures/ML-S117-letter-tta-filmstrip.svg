<svg xmlns="http://www.w3.org/2000/svg" width="502" height="329.6" viewBox="0 0 502 329.6" role="img" aria-label="How to write ട: one unbroken stroke · 3 movements"><title>Writing ട</title><desc>3 frames; frame N shows movements 1 to N of ട (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ട in data/TTA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/TTA.png&gt;. Source note on variation: Thooval&apos;s TTA.png starts at the top-right tip (green), curves left over the top and down, swings right through the middle and rounds the lower bowl to finish at the lower-left tail (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ട as one stroke from the upper right to the lower left. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the upper right (30 of 34) and end at the lower left (32 of 34). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms.</desc><rect x="0" y="0" width="502" height="329.6" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="211.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="211.1" viewBox="-50 -636 656 923.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M269 566Q358 566 422.5 546.5Q487 527 536 500L489 433Q449 459 394 476.5Q339 494 268 494Q217 494 185 482Q153 470 137.5 449.5Q122 429 122 403Q122 384 127 371Q132 358 142 349Q162 329 203 323Q244 317 299 317L307 317Q386 317 430.5 301Q475 285 500 253Q515 235 521.5 210Q528 185 528 158Q528 108 502 69.5Q476 31 423 9.5Q370 -12 289 -12Q204 -12 141.5 7Q79 26 20 59L66 125Q96 107 130.5 92Q165 77 205.5 68.5Q246 60 293 60Q346 60 378.5 72Q411 84 426 105Q441 126 441 153Q441 175 434.5 192Q428 209 412 220Q396 232 366 238Q336 244 280 244L270 244Q201 244 146.5 259Q92 274 65 307Q50 325 42.5 348Q35 371 35 402Q35 450 60 487Q85 524 137 545Q189 566 269 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M476 484 L476 484" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M476 484 L415 508 L351 523 L286 528 L220 528 L157 511 L104 473 L84 412 L92 348" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="92" cy="348" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="278" y="204.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="278" y="204.6">1. curve left over the</tspan><tspan x="278" y="268.8">top and down</tspan></text></svg><rect x="176" y="42" width="150" height="211.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="211.1" viewBox="-50 -636 656 923.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M269 566Q358 566 422.5 546.5Q487 527 536 500L489 433Q449 459 394 476.5Q339 494 268 494Q217 494 185 482Q153 470 137.5 449.5Q122 429 122 403Q122 384 127 371Q132 358 142 349Q162 329 203 323Q244 317 299 317L307 317Q386 317 430.5 301Q475 285 500 253Q515 235 521.5 210Q528 185 528 158Q528 108 502 69.5Q476 31 423 9.5Q370 -12 289 -12Q204 -12 141.5 7Q79 26 20 59L66 125Q96 107 130.5 92Q165 77 205.5 68.5Q246 60 293 60Q346 60 378.5 72Q411 84 426 105Q441 126 441 153Q441 175 434.5 192Q428 209 412 220Q396 232 366 238Q336 244 280 244L270 244Q201 244 146.5 259Q92 274 65 307Q50 325 42.5 348Q35 371 35 402Q35 450 60 487Q85 524 137 545Q189 566 269 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M476 484 L415 508 L351 523 L286 528 L220 528 L157 511 L104 473 L84 412 L92 348 L92 348" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M92 348 L145 301 L214 285 L286 280 L357 278 L424 257 L476 208" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="476" cy="208" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="278" y="204.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="278" y="204.6">2. swing right through</tspan><tspan x="278" y="268.8">the middle</tspan></text></svg><rect x="336" y="42" width="150" height="211.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="211.1" viewBox="-50 -636 656 923.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M269 566Q358 566 422.5 546.5Q487 527 536 500L489 433Q449 459 394 476.5Q339 494 268 494Q217 494 185 482Q153 470 137.5 449.5Q122 429 122 403Q122 384 127 371Q132 358 142 349Q162 329 203 323Q244 317 299 317L307 317Q386 317 430.5 301Q475 285 500 253Q515 235 521.5 210Q528 185 528 158Q528 108 502 69.5Q476 31 423 9.5Q370 -12 289 -12Q204 -12 141.5 7Q79 26 20 59L66 125Q96 107 130.5 92Q165 77 205.5 68.5Q246 60 293 60Q346 60 378.5 72Q411 84 426 105Q441