<svg xmlns="http://www.w3.org/2000/svg" width="982" height="331.75" viewBox="0 0 982 331.75" role="img" aria-label="How to write ఢ: 3 strokes · 2 pen lifts · 6 movements"><title>Writing ఢ</title><desc>6 frames; frame N shows movements 1 to N of ఢ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ఢ packaged tracing guides res/drawable/dot_stroke_c_3_4_dha.png and res/drawable/line_stroke_c_3_4_dha.png, movements 1–6 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers four successive sections of the rounded main body, the separate upper flourish, and the separate lower stem as six movements. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the breaks keep the guide&apos;s order and fall only between the body and its detached parts. Noto Sans Telugu extends the top curve into a short right arm and closes the lower-right bowl into a ring, so movement 1 starts at that arm&apos;s tip and movement 4 closes the ring. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="982" height="331.75" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="225.75" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-wi