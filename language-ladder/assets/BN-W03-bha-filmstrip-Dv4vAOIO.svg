<svg xmlns="http://www.w3.org/2000/svg" width="662" height="287.79" viewBox="0 0 662 287.79" role="img" aria-label="How to write ভ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ভ</title><desc>4 frames; frame N shows movements 1 to N of ভ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 34 (ভ, bha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 208 of the 234 stored prototypes draw the body in one pen-down stroke. 192 of those 208 start inside the curl, 206 turn clockwise (out to the point, down the right side and round the bottom) and 180 end at the top left, at the tip of the left arm. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 142 of the 234 draw none at all, 22 open with it, 61 end with it and 9 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 72 of the 78 writers whose headline run has a direction draw it left to right. Noto prints this letter&apos;s headline apart from its body. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="287.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="181.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="181.79" viewBox="-80 -692 861 1043.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L711 622L711 551L-10 551ZM412 50Q326 50 254.5 90.5Q183 131 127.5 222.5Q72 314 32 467L105 486Q139 362 180.5 282Q222 202 278 164Q334 126 411 126Q488 126 523 170Q558 214 558 276Q558 311 551 336Q544 361 533 380Q471 289 369 289Q317 289 282 316.5Q247 344 247 390Q247 419 267 441.5Q287 464 324 464Q356 464 374 444.5Q392 425 392 397Q392 378 382 363Q405 363 436.5 385.5Q468 408 498 474L561 484Q599 429 617 378Q635 327 635 271Q635 210 609.5 159.5Q584 109 534 79.5Q484 50 412 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M306 410 L306 410" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M306 410 L326 372 L356 341 L397 330 L438 342 L473 369 L503 399 L534 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="534" cy="430" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="350.5" y="159" text-anchor="middle" font-size="69" fill="#6b7280"><tspan x="350.5" y="159">1. start inside the</tspan><tspan x="350.5" y="243.2">curl and run right to</tspan><tspan x="350.5" y="327.4">the point</tspan></text></svg><rect x="176" y="42" width="150" height="181.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="181.79" viewBox="-80 -692 861 1043.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L711 622L711 551L-10 551ZM412 50Q326 50 254.5 90.5Q183 131 127.5 222.5Q72 314 32 467L105 486Q139 362 180.5 282Q222 202 278 164Q334 126 411 126Q488 126 523 170Q558 214 558 276Q558 311 551 336Q544 361 533 380Q471 289 369 289Q317 289 282 316.5Q247 344 247 390Q247 419 267 441.5Q287 464 324 464Q356 464 374 444.5Q392 425 392 397Q392 378 382 363Q405 363 436.5 385.5Q468 408 498 474L561 484Q599 429 617 378Q635 327 635 271Q635 210 609.5 159.5Q584 109 534 79.5Q484 50 412 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M306 410 L326 372 L356 341 L397 330 L438 342 L473 369 L503 399 L534 430 L534 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M534 430 L564 398 L583 359 L593 316 L594 272 L592 228 L579 186 L554 150 L522 120 L483 99 L440 90 L396 90 L352 94 L310 106 L310 106" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="310" cy="106" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="350.5" y="159" text-anchor="middle" font-size="69" fill="#6b7280"><tspan x="350.5" y="159">2. come down the right</tspan><tspan x="350.5" y="243.2">side and round the</tspan><tspan x="350.5" y="327.4">bottom</tspan></text></svg><rect x="336" y="42" width="150" height="181.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="181.79" viewBox="-80 -692 861 1043.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L711 622L711 551L-10 551ZM412 50Q326 50 254.5 90.5Q183 131 127.5 222.5Q72 314 32 467L105 486Q139 362 180.5 282Q222 202 278 164Q334 126 411 126Q488 126 523 170Q558 214 558 276Q558 311 551 336Q544 361 533 380Q471 289 369 289Q317 289 282 316.5Q247 344 247 390Q247 419 267 441.5Q287 464 324 464Q356 464 374 444.5Q392 425 392 397Q392 378 382 363Q405 363 436.5 385.5Q468 408 498 474L561 484Q599 429 617 378Q635 327 635 271Q635 210 609.5 159.5Q584 109 534 79.5Q484 50 412 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M306 410 L326 372 L356 341 L397 330 L438 342 L473 369 L503 399 L534 430 L564 398 L583 359 L593 316 L594 272 L592 228 L579 186 L554 150 L522 120 L483 99 L440 90 L396 90 L352 94 L310 106 L310 106" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M310 106 L269 126 L234 154 L202 187 L173 222 L150 261 L129 302 L112 344 L96 387 L82 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="82" cy="430" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="350.5" y="159" text-anchor="middle" font-size="69" fill="#6b7280"><tspan x="350.5" y="159">3. climb the left arm</tspan><tspan x="350.5" y="243.2">to its tip</tspan></text></svg><rect x="496" y="42" width="150" height="181.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="181.79" viewBox="-80 -692 861 1043.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L711 622L711 551L-10 551ZM412 50Q326 50 254.5 90.5Q183 131 127.5 222.5Q72 314 32 467L105 486Q139 362 180.5 282Q222 202 278 164Q334 126 411 126Q488 126 523 170Q558 214 558 276Q558 311 551 336Q544 361 533 380Q471 289 369 289Q317 289 282 316.5Q247 344 247 390Q247 419 267 441.5Q287 464 324 464Q356 464 374 444.5Q392 425 392 397Q392 378 382 363Q405 363 436.5 385.5Q468 408 498 474L561 484Q599 429 617 378Q635 327 635 271Q635 210 609.5 159.5Q584 109 534 79.5Q484 50 412 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M306 410 L326 372 L356 341 L397 330 L438 342 L473 369 L503 399 L534 430 L564 398 L583 359 L593 316 L594 272 L592 228 L579 186 L554 150 L522 120 L483 99 L440 90 L396 90 L352 94 L310 106 L269 126 L234 154 L202 187 L173 222 L150 261 L129 302 L112 344 L96 387 L82 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L188 586 L355 586 L522 586 L690 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="350.5" y="159" text-anchor="middle" font-size="69" fill="#6b7280"><tspan x="350.5" y="159">4. lift, then draw the</tspan><tspan x="350.5" y="243.2">headline last, from</tspan><tspan x="350.5" y="327.4">left to right</tspan></text></svg><text x="16" y="236.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 34 (ভ,</text><text x="16" y="249.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">bha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="261.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
