<svg xmlns="http://www.w3.org/2000/svg" width="982" height="517.88" viewBox="0 0 982 517.88" role="img" aria-label="How to write 尔: 5 strokes · 4 pen lifts · 7 movements"><title>Writing 尔</title><desc>7 frames; frame N shows movements 1 to N of 尔 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 尔.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B0%94.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 尔, the same five that close 你. Median 1 starts at the top and falls down-left; median 2 restarts below it, crosses rightward, then hooks down-left without lifting; median 3 restarts at the centre, descends, then hooks left without lifting; medians 4-5 separately draw the lower-left dot down-left and the lower-right dot down-right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their directions, the two unbroken hooks and the four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="517.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="206.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="206.19" viewBox="-35 -911 1056 