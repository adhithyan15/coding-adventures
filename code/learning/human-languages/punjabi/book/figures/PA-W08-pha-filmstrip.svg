<svg xmlns="http://www.w3.org/2000/svg" width="822" height="307.14" viewBox="0 0 822 307.14" role="img" aria-label="How to write ਫ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ਫ</title><desc>5 frames; frame N shows movements 1 to N of ਫ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਫ (phaphaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 854, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L854&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਫ in two pen-down strokes: the headline from left to right; then from the top right down the stem, left along the bar, down the left side and counterclockwise round the lower loop, ending at the bottom left where the loop began. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਫ, each by a different non-native copyist; only counts and shares are cited. 90% (18 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 70% (14 of 20) start in the same part of the letter as the source and 95% (19 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="307.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M336 0Q249 0 181.5 35Q114 70 75.5 130Q37 190 37 264Q37 299 49 327.5Q61 356 82 374Q101 390 123.5 400Q146 410 180.5 415Q215 420 268 420L408 420L408 551L-7 551L-7 622L586 622L586 551L489 551L489 378L460 349L279 349Q219 349 189.5 342.5Q160 336 141 320Q128 310 123 294Q118 278 118 259Q118 222 132 189.5Q146 157 171 132Q209 173 264.5 205Q320 237 396 237Q469 237 503 204Q537 171 537 127Q537 69 491.5 34.5Q446 0 336 0ZM388 166Q340 166 300 144Q260 122 229 93Q279 69 341 69Q457 69 457 124Q457 143 440 154.5Q423 166 388 166Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="561" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="289.5" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="289.5" y="198.7">1. draw the headline</tspan><tspan x="289.5" y="270.3">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M336 0Q249 0 181.5 35Q114 70 75.5 130Q37 190 37 264Q37 299 49 327.5Q61 356 82 374Q101 390 123.5 400Q146 410 180.5 415Q215 420 268 420L408 420L408 551L-7 551L-7 622L586 622L586 551L489 551L489 378L460 349L279 349Q219 349 189.5 342.5Q160 336 141 320Q128 310 123 294Q118 278 118 259Q118 222 132 189.5Q146 157 171 132Q209 173 264.5 205Q320 237 396 237Q469 237 503 204Q537 171 537 127Q537 69 491.5 34.5Q446 0 336 0ZM388 166Q340 166 300 144Q260 122 229 93Q279 69 341 69Q457 69 457 124Q457 143 440 154.5Q423 166 388 166Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M442 586 L442 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M442 586 L445 551 L447 516 L447 480 L446 444 L444 409" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="444" cy="409" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="289.5" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="289.5" y="198.7">2. lift, then come down</tspan><tspan x="289.5" y="270.3">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g tran