<svg xmlns="http://www.w3.org/2000/svg" width="822" height="269.11" viewBox="0 0 822 269.11" role="img" aria-label="How to write బ: one unbroken stroke · 5 movements"><title>Writing బ</title><desc>5 frames; frame N shows movements 1 to N of బ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant బ packaged tracing guides res/drawable/dot_stroke_c_5_3_ba.png and res/drawable/line_stroke_c_5_3_ba.png, movements 1–4 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged guide builds the two left curves first, then the lower-right bowl and upper-right shoulder as separate movements. The c_5_3 filename, its position after c_5_2 ఫ, and the pictured glyph agree that this guide teaches బ. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the guide&apos;s order. The bundled Noto Sans Telugu outline joins the upper-left curve to the lower-left bowl with a broad diagonal shoulder, so the run curves down through it; that is a new segment, so the filmstrip shows one more frame than the guide has movements.</desc><rect x="0" y="0" width="822" height="269.11" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="163.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="163.11" viewBox="-34 -570 8