 95.5 187Q70 223 70 270Q70 303 85.5 336Q101 369 141 389L158 403Q178 411 207.5 415.5Q237 420 262 420Q276 420 289 419.5Q302 419 313 417L307 346Q295 348 285.5 348Q276 348 265 348Q208 348 179.5 326.5Q151 305 151 266Q151 224 183.5 203.5Q216 183 270 183Q319 183 363 205Q407 227 432 261L421 221L421 551L0 551L0 622L605 622L605 551ZM183 352Q144 362 114 380.5Q84 399 67 425.5Q50 452 50 485Q50 520 65.5 544Q81 568 110 590L173 560Q152 547 141.5 528Q131 509 131 485Q131 451 155 430Q179 409 213 404L183 352Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M115 525 L90 515 L82 485 L90 450 L115 420 L155 395 L205 375 L260 365 L285 360 L255 350 L215 345 L170 342 L135 325 L115 295 L110 260 L120 225 L145 195 L185 170 L235 155 L290 150 L345 155 L395 165 L430 185 L450 225 L468 290 L470 360 L470 430 L470 500 L470 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M470 175 L470 175" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M470 175 L470 135 L470 95 L470 70 L470 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="470" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="302.5" y="199.7" text-anchor="middle" font-size="59.7" fill="#6b7280"><tspan x="302.5" y="199.7">2. lift, then descend</tspan><tspan x="302.5" y="272.5">the short lower stem</tspan></text></svg><rect x="336" y="42" width="150" height="227.74" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="227.74" viewBox="-70 -692 745 1131.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M605 551L502 551L502 0L421 0L421 183L441 167Q412 142 368 127Q324 112 270 112Q211 112 166 131.5Q121 151 95.5 187Q70 223 70 270Q70 303 85.5 336Q101 369 141 389L158 403Q178 411 207.5 