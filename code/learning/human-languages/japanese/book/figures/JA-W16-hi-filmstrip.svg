686Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 645 L205 650 L295 660 L385 675 L465 695 L430 660 L390 615 L335 545 L285 455 L245 355 L215 255 L205 165 L225 90 L275 35 L350 5 L435 -5 L520 20 L520 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M520 20 L590 65 L640 135 L675 225 L700 330 L710 440 L720 545 L710 635 L690 700 L720 650 L750 575 L785 495 L825 420 L870 350 L915 290" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="915" cy="290" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="527.5" y="268.3" text-anchor="middle" font-size="78.3" fill="#6b7280"><tspan x="527.5" y="268.3">3. rise up the right</tspan><tspan x="527.5" y="363.8">side and finish with</tspan><tspan x="527.5" y="459.4">the outward flick</tspan></text></svg><text x="16" y="253.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana ひ stroke order animation.gif, hiragana ひ, 33 frames,</text><text x="16" y="266.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">3.3 seconds (Wikimedia Commons, 1 October 2009)</text><text x="16" y="278.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
