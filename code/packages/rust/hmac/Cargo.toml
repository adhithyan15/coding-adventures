[package]
name = "coding_adventures_hmac"
version = "0.1.0"
edition = "2021"
description = "HMAC (Hash-based Message Authentication Code) — RFC 2104 / FIPS 198-1 — implemented from scratch"

[dependencies]
coding_adventures_md5 = { path = "../md5" }
coding_adventures_sha1 = { path = "../sha1" }
coding_adventures_sha256 = { path = "../sha256" }
coding_adventures_sha384 = { path = "../sha384" }
coding_adventures_sha512 = { path = "../sha512" }
coding_adventures_ct_compare = { path = "../ct-compare" }
# Every key-derived intermediate inside `hmac()` is `K'` in lightly disguised
# form — `K' XOR ipad` is recovered by XORing 0x36 back out — so the buffers
# holding them are wipe-on-drop rather than merely dropped.
coding_adventures_zeroize = { path = "../zeroize" }
