<svg xmlns="http://www.w3.org/2000/svg" width="982" height="524.84" viewBox="0 0 982 524.84" role="img" aria-label="How to write 草: 9 strokes · 8 pen lifts · 9 movements"><title>Writing 草</title><desc>9 frames; frame N shows movements 1 to N of 草 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 草.json, ordered stroke paths and medians 1–9 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%8D%89.json&gt;. Source note on variation: The cited PRC-order dataset supplies nine ordered strokes for 草, in two pieces. Medians 1–3 draw 艹 on top as 菜 opens: a horizontal, then two short verticals through it. Medians 4–9 draw 早 under it as 早 is written alone: 日, a long horizontal, then a vertical down from 日 through it. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those nine ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and eight intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="524.84" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 9 strokes · 8 pen lifts · 9 movements</text><rect x="16" y="42" width="150" height="209.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.67" viewBox="-14 -910 1031 1441.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" 