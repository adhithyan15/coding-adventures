<svg xmlns="http://www.w3.org/2000/svg" width="822" height="349.62" viewBox="0 0 822 349.62" role="img" aria-label="How to write 日: 4 strokes · 3 pen lifts · 5 movements"><title>Writing 日</title><desc>5 frames; frame N shows movements 1 to N of 日 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 日.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%97%A5.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 日. Median 1 starts at the upper left and descends the left side; median 2 restarts near the upper left, crosses the top from left to right, turns without lifting, then descends the right side; median 3 restarts at the left edge and crosses the middle from left to right; median 4 restarts at the lower left and closes the bottom from left to right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their directions, the joined top-right corner, the inside-before-close order, and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="349.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="243.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="243.62" viewBox="106 -842 796 1292.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M176 772L832 772L832 -64L752 -64L752 697L253 697L253 -69L176 -69L176 772ZM228 426L786 426L786 352L228 352L228 426ZM226 71L787 71L787 -4L226 -4L226 71Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M214 735 L214 735" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M214 735 L214 630 L214 520 L214 410 L214 300 L214 190 L214 80 L214 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="214" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="272.8" text-anchor="middle" font-size="63.8" fill="#6b7280"><tspan x="504" y="272.8">1. descend the left</tspan><tspan x="504" y="350.6">vertical shù from top</tspan><tspan x="504" y="428.5">to bottom</tspan></text></svg><rect x="176" y="42" width="150" height="243.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="243.62" viewBox="106 -842 796 1292.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M176 772L832 772L832 -64L752 -64L752 697L253 697L253 -69L176 -69L176 772ZM228 426L786 426L786 352L228 352L228 426ZM226 71L787 71L787 -4L226 -4L226 71Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M214 735 L214 630 L214 520 L214 410 L214 300 L214 190 L214 80 L214 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M214 735 L214 735" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M214 735 L310 735 L410 735 L510 735 L610 735 L710 735 L792 735" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="792" cy="735" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="272.8" text-anchor="middle" font-size="63.8" fill="#6b7280"><tspan x="504" y="272.8">2. lift, then draw the</tspan><tspan x="504" y="350.6">top horizontal héng</tspan><tspan x="504" y="428.5">from left to right</tspan></text></svg><rect x="336" y="42" width="150" height="243.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="243.62" viewBox="106 -842 796 1292.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M176 772L832 772L832 -64L752 -64L752 697L253 697L253 -69L176 -69L176 772ZM228 426L786 426L786 352L228 352L228 426ZM226 71L787 71L787 -4L226 -4L226 71Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M214 735 L214 630 L214 520 L214 410 L214 300 L214 190 L214 80 L214 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M214 735 L310 735 L410 735 L510 735 L610 735 L710 735 L792 735 L792 735" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M792 735 L792 630 L792 520 L792 410 L792 300 L792 190 L792 80 L792 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="792" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="272.8" text-anchor="middle" font-size="63.8" fill="#6b7280"><tspan x="504" y="272.8">3. turn without lifting</tspan><tspan x="504" y="350.6">and descend the right</tspan><tspan x="504" y="428.5">side</tspan></text></svg><rect x="496" y="42" width="150" height="243.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="243.62" viewBox="106 -842 796 1292.8" preserveAspectRatio="xMidYMid