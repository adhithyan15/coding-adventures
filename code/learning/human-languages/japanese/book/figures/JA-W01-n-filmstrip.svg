<svg xmlns="http://www.w3.org/2000/svg" width="662" height="289.12" viewBox="0 0 662 289.12" role="img" aria-label="How to write ん: one unbroken stroke · 4 movements"><title>Writing ん</title><desc>4 frames; frame N shows movements 1 to N of ん (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03093.svg, hiragana ん (U+3093 HIRAGANA LETTER N), one stroke path kvg:03093-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03093.svg&gt;. Source note on variation: KanjiVG stores ん as one directed path in writing order: it starts at the top, cuts down to the lower left, turns back up the same line, arches over a small hump, comes down, rounds the foot and rises to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In the print glyph the hump leaves the diagonal partway up, so the path goes down to the tip of the diagonal and climbs back up that ink to the branch before turning over the hump.</desc><rect x="0" y="0" width="662" height="289.12" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="183.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="183.12" viewBox="6 -848 1011 1234.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M547 742Q541 734 532.5 720.5Q524 707 515 693Q498 668 474.5 626.5Q451 585 424 537.5Q397 490 371.5 444Q346 398 327 361Q363 394 401.5 408.5Q440 423 476 423Q526 423 558.5 392Q591 361 593 302Q594 27