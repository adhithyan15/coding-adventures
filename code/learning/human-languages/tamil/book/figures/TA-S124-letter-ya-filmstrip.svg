203 -11 175.5 1.5Q148 14 129 36Q118 51 108.5 70Q99 89 93.5 120Q88 151 88 202L88 554L174 554L174 223Q174 177 178 139.5Q182 102 202 82Q212 72 225.5 66.5Q239 61 258 61Q287 61 312.5 76Q338 91 360 125L358 39Q339 20 310 4.5Q281 -11 240 -11Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 548 L130 280 L130 145 L145 90 L185 55 L240 40 L295 55 L335 90 L354 130 L354 130" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M354 130 L354 330 L354 548" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="354" cy="548" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="481.5" y="225.3" text-anchor="middle" font-size="74.3" fill="#6b7280"><tspan x="481.5" y="225.3">3. up the central</tspan><tspan x="481.5" y="315.9">upright</tspan></text></svg><rect x="496" y="42" width="150" height="156.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="156.31" viewBox="18 -624 927 966" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 0L354 554L440 554L440 72L789 72L789 554L875 554L875 0L354 0ZM240 -11Q203 -11 175.5 1.5Q148 14 129 36Q118 51 108.5 70Q99 89 93.5 120Q88 151 88 202L88 554L174 554L174 223Q174 177 178 139.5Q182 102 202 82Q212 72 225.5 66.5Q239 61 258 61Q287 61 312.5 76Q338 91 360 125L358 39Q339 20 310 4.5Q281 -11 240 -11Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 548 L130 280 L130 145 L145 90 L185 55 L240 40 L295 55 L335 90 L354 130 L354 330 L354 548 L354 548" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M354 548 L354 300 L354 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="354" cy="40" r="34" fill="#3b5bd