<svg xmlns="http://www.w3.org/2000/svg" width="822" height="337.09" viewBox="0 0 822 337.09" role="img" aria-label="How to write 汉: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 汉</title><desc>5 frames; frame N shows movements 1 to N of 汉 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 汉.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%B1%89.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 汉. Medians 1–3 form 氵 in dot, dot, rising-stroke order; median 4 crosses the upper right and turns down-left without lifting; median 5 falls down-right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians share the coordinate system used for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. The ductus uses those ordered source medians directly; the vendored Noto Sans SC outline can differ in width and proportion from the Arphic-derived source graphics.</desc><rect x="0" y="0" width="822" height="337.09" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="231.09" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="231.09" viewBox="-28 -894 1069 1646.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M361 764L855 764L855 693L361 693L361 764ZM471 706Q507 537 572 394.5Q637 252 735.5 146.5Q834 41 971 -16Q963 -23 953 -33.5Q943 -44 934.5 -55.5Q926 -67 920 -76Q779 -12 678 99Q57