  <title>ChecklistRun</title>

<body>
  <section data-component="ChecklistRun" data-mosaic-html-root="ChecklistRun">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->

      <div style="display: flex; flex-direction: column; padding: 16px; gap: 8px; background: #ffffff; border-width: 1px; border-color: #dee2e6; border-radius: 4px">
        <span style="color: #212529; font-size: 18px">{{title}}</span>
        <span style="color: #6c757d; font-size: 13px">{{progressLabel}}</span>
        <!-- mosaic-for each="rows" as="row" index="i" -->
          <div style="display: flex; flex-direction: row; gap: 6px">
            <!-- mosaic-if when="( row [ 1 ] )" -->
              <span style="color: #6c757d; font-size: 14px">{{row.1}}</span>
            <!-- /mosaic-if -->
            <!-- mosaic-if when="( row [ 3 ] )" -->
              <div style="display: flex; flex-direction: row; gap: 8px">
                <span style="color: #212529; font-size: 14px">{{row.2}}</span>
                <!-- mosaic-if when="( row [ 4 ] )" -->
                  <!-- emit "onAnswerYes" dropped: HTML is static -->
                  <button data-on-click="onAnswerYes" aria-pressed="true" style="padding: 6px; background: #e7f1ff; color: #084298; border-width: 1px; border-color: #9ec5fe; border-radius: 4px; font-size: 14px">{{yesLabel}}</button>
                <!-- mosaic-else -->
                  <!-- emit "onAnswerYes" dropped: HTML is static -->
                  <button data-on-click="onAnswerYes" aria-pressed="false" style="padding: 6px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 14px">{{yesLabel}}</button>
                <!-- /mosaic-if -->
                <!-- mosaic-if when="( row [ 5 ] )" -->
                  <!-- emit "onAnswerNo" dropped: HTML is static -->
                  <button data-on-click="onAnswerNo" aria-pressed="true" style="padding: 6px; background: #e7f1ff; color: #084298; border-width: 1px; border-color: #9ec5fe; border-radius: 4px; font-size: 14px">{{noLabel}}</button>
                <!-- mosaic-else -->
                  <!-- emit "onAnswerNo" dropped: HTML is static -->
                  <button data-on-click="onAnswerNo" aria-pressed="false" style="padding: 6px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 14px">{{noLabel}}</button>
                <!-- /mosaic-if -->
              </div>
            <!-- mosaic-else -->
              <!-- mosaic-if when="( row [ 4 ] )" -->
                <!-- emit "onToggle" dropped: HTML is static -->
                <label><input type="checkbox" checked data-on-toggle="onToggle" style="color: #6c757d"> {{row.2}}</label>
              <!-- mosaic-else -->
                <!-- emit "onToggle" dropped: HTML is static -->
                <label><input type="checkbox" data-on-toggle="onToggle" style="color: #212529"> {{row.2}}</label>
              <!-- /mosaic-if -->
            <!-- /mosaic-if -->
          </div>
        <!-- /mosaic-for -->
        <div style="display: flex; flex-direction: row; gap: 8px">
          <!-- mosaic-if when="completeLabel" -->
            <!-- emit "onComplete" dropped: HTML is static -->
            <button data-on-click="onComplete" style="padding: 6px; background: #198754; color: #ffffff; border-width: 1px; border-color: #198754; border-radius: 4px; font-size: 14px">{{completeLabel}}</button>
          <!-- /mosaic-if -->
          <!-- mosaic-if when="abandonLabel" -->
            <!-- emit "onAbandon" dropped: HTML is static -->
            <button data-on-click="onAbandon" style="padding: 6px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 14px">{{abandonLabel}}</button>
          <!-- /mosaic-if -->
        </div>
