<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
</head>
<body>
  <section data-component="Notes" data-mosaic-html-root="Notes">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="Notes">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 16px; font-weight: bold; color: #2b2723">{{notesTitle}}</span>
        <div style="display: flex; flex-direction: row; gap: 16px">
          <div style="display: flex; flex-direction: column; width: 220px; flex-shrink: 0; gap: 4px; padding-right: 12px; border-right-width: 1px; border-right-color: #e6ded3; border-right-style: solid">
            <!-- emit "onNewNote" dropped: HTML is static -->
            <button data-on-click="onNewNote" style="width: 100%; padding-top: 8px; padding-right: 12px; padding-bottom: 8px; padding-left: 12px; border-radius: 8px; border-width: 0; background: #e0942a; color: #ffffff; font-size: 13px; font-weight: bold">+ New note</button>
            <!-- mosaic-for each="noteRows" as="n" index="ni" -->
              <!-- mosaic-if when="( n [ 0 ] == selectedNoteId )" -->
                <!-- emit "onSelectNote" dropped: HTML is static -->
                <button data-on-click="onSelectNote" style="width: 100%; text-align: left; padding-top: 8px; padding-right: 12px; padding-bottom: 8px; padding-left: 12px; border-radius: 8px; border-width: 0; background: #fffdfa; color: #2b2723; font-size: 13px; font-weight: bold; box-shadow: 0 1px 2px rgba(60,45,25,.05), 0 4px 14px rgba(60,45,25,.05); elevation: raised">{{n [ 1 ]}}</button>
              <!-- mosaic-else -->
                <!-- emit "onSelectNote" dropped: HTML is static -->
                <button data-on-click="onSelectNote" style="width: 100%; text-align: left; padding-top: 8px; padding-right: 12px; padding-bottom: 8px; padding-left: 12px; border-radius: 8px; border-width: 0; background: transparent; color: #6a625a; font-size: 13px">{{n [ 1 ]}}</button>
              <!-- /mosaic-if -->
            <!-- /mosaic-for -->
          </div>
          <!-- mosaic-if when="selectedNoteId" -->
            <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 10px">
              <!-- emit "onTitleChange" dropped: HTML is static -->
              <input type="text" value="{{titleValue}}" placeholder="Title" data-on-change="onTitleChange" style="padding: 10px; border-radius: 6px; background: #ffffff; color: #2b2723; border-width: 1px; border-color: #e6ded3; font-size: 14px; font-weight: bold">
              <!-- emit "onBodyChange" dropped: HTML is static -->
              <textarea placeholder="Write something…" data-on-change="onBodyChange" style="width: 100%; min-height: 200px; padding: 10px; border-radius: 6px; background: #ffffff; color: #2b2723; border-width: 1px; border-color: #e6ded3; font-size: 13px">{{bodyValue}}</textarea>
              <!-- emit "onTaskNameChange" dropped: HTML is static -->
              <input type="text" value="{{taskNameValue}}" placeholder="Attach to task (optional)" data-on-change="onTaskNameChange" style="padding: 10px; border-radius: 6px; background: #ffffff; color: #6a625a; border-width: 1px; border-color: #e6ded3; font-size: 13px">
              <div style="display: flex; flex-direction: row; gap: 8px">
                <!-- emit "onSave" dropped: HTML is static -->
                <button data-on-click="onSave" style="padding-top: 8px; padding-right: 16px; padding-bottom: 8px; padding-left: 16px; border-radius: 8px; border-width: 0; background: #e0942a; color: #ffffff; font-size: 13px; font-weight: bold">Save</button>
                <!-- emit "onDelete" dropped: HTML is static -->
                <button data-on-click="onDelete" style="padding-top: 8px; padding-right: 16px; padding-bottom: 8px; padding-left: 16px; border-radius: 8px; border-width: 0; background: #f8e4df; color: #cf4b34; font-size: 13px; font-weight: bold">Delete</button>
                <!-- emit "onCancel" dropped: HTML is static -->
                <button data-on-click="onCancel" style="padding-top: 8px; padding-right: 16px; padding-bottom: 8px; padding-left: 16px; border-radius: 8px; border-width: 0; background: transparent; color: #6a625a; font-size: 13px">Cancel</button>
              </div>
            </div>
          <!-- mosaic-else -->
            <div style="display: flex; flex-direction: column; flex-grow: 1; align: center">
              <span style="font-size: 13px; color: #9b9289">Select a note, or start a new one.</span>
            </div>
          <!-- /mosaic-if -->
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
