<svg xmlns="http://www.w3.org/2000/svg" width="502" height="315.35" viewBox="0 0 502 315.35" role="img" aria-label="How to write ও: one unbroken stroke · 3 movements"><title>Writing ও</title><desc>3 frames; frame N shows movements 1 to N of ও (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 9 (ও, o; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 231 of the 239 stored prototypes of the independent o are one pen-down stroke. 222 of those 231 start in the upper half, in the top curl, and all 231 turn clockwise overall: round the top curl and the upper bowl, into the middle, and round the lower bowl. 218 end on the left, at the top of the left arm. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="315.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="196.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="196.85" viewBox="-37 -702 793 1040.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M468 42Q376 42 293 88Q210 134 143.5 236Q77 338 33 507L108 529Q167 315 255.5 216.5Q344 118 465 118Q524 118 564.5 144Q605 170 605 227Q605 267 587 294Q556 273 522 273Q485 273 465.5 293Q446 313 446 338Q446 359 464 380.5Q482 402 526 402Q551 402 573 395Q582 413 586.5 434.5Q591 456 591 480Q591 561 508 561Q471 561 437.5 547.5Q404 534 378.5 512.5Q353 491 340 468Q372 465 386 446Q400 427 400 404Q400 373 380.5 356Q361 339 332 339Q291 339 272 365.5Q253 392 253 425Q253 463 273.5 499.5Q294 536 329 566Q364 596 410 614Q456 632 507 632Q585 632 628 591.5Q671 551 671 477Q671 442 662.5 410.5Q654 379 639 352Q662 326 674 291.5Q686 257 686 221Q686 135 626 88.5Q566 42 468 42Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 462 L345 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M345 462 L385 440 L392 395 L362 358 L318 355 L285 385 L278 440 L305 505 L370 565 L450 595 L510 597 L585 585 L625 530 L632 470 L628 420" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="628" cy="420" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="359.5" y="161.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="359.5" y="161.5">1. start inside the top</tspan><tspan x="359.5" y="239">curl and turn clockwise</tspan><tspan x="359.5" y="316.4">round the upper bowl</tspan></text></svg><rect x="176" y="42" width="150" height="196.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="196.85" viewBox="-37 -702 793 1040.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M468 42Q376 42 293 88Q210 134 143.5 236Q77 338 33 507L108 529Q167 315 255.5 216.5Q344 118 465 118Q524 118 564.5 144Q605 170 605 227Q605 267 587 294Q556 273 522 273Q485 273 465.5 293Q446 313 446 338Q446 359 464 380.5Q482 402 526 402Q551 402 573 395Q582 413 586.5 434.5Q591 456 591 480Q591 561 508 561Q471 561 437.5 547.5Q404 534 378.5 512.5Q353 491 340 468Q372 465 386 446Q400 427 400 404Q400 373 380.5 356Q361 339 332 339Q291 339 272 365.5Q253 392 253 425Q253 463 273.5 499.5Q294 536 329 566Q364 596 410 614Q456 632 507 632Q585 632 628 591.5Q671 551 671 477Q671 442 662.5 410.5Q654 379 639 352Q662 326 674 291.5Q686 257 686 221Q686 135 626 88.5Q566 42 468 42Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 462 L385 440 L392 395 L362 358 L318 355 L285 385 L278 440 L305 505 L370 565 L450 595 L510 597 L585 585 L625 530 L632 470 L628 420 L628 420" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M628 420 L600 380 L545 362 L490 345 L505 305 L560 300 L612 300 L640 262" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="640" cy="262" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="359.5" y="161.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="359.5" y="161.5">2. dip into the middle</tspan></text></svg><rect x="336" y="42" width="150" height="196.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="196.85" viewBox="-37 -702 793 1040.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M468 42Q376 42 293 88Q210 134 143.5 236Q77 338 33 507L108 529Q167 315 255.5 216.5Q344 118 465 118Q524 118 564.5 144Q605 170 605 227Q605 267 587 294Q556 273 522 273Q485 273 465.5 293Q446 313 446 338Q446 359 464 380.5Q482 402 526 402Q551 402 573 395Q582 413 586.5 434.5Q591 456 591 480Q591 561 508 561Q471 561 437.5 547.5Q404 534 378.5 512.5Q353 491 340 468Q372 465 386 446Q400 427 400 404Q400 373 380.5 356Q361 339 332 339Q291 339 272 365.5Q253 392 253 425Q253 463 273.5 499.5Q294 536 329 566Q364 596 410 614Q456 632 507 632Q585 632 628 591.5Q671 551 671 477Q671 442 662.5 410.5Q654 379 639 352Q662 326 674 291.5Q686 257 686 221Q686 135 626 88.5Q566 42 468 42Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 462 L385 440 L392 395 L362 358 L318 355 L285 385 L278 440 L305 505 L370 565 L450 595 L510 597 L585 585 L625 530 L632 470 L628 420 L600 380 L545 362 L490 345 L505 305 L560 300 L612 300 L640 262 L640 262" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M640 262 L648 215 L640 160 L590 105 L480 80 L360 95 L255 165 L175 290 L110 420 L72 515" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="72" cy="515" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="359.5" y="161.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="359.5" y="161.5">3. round the lower bowl</tspan><tspan x="359.5" y="239">clockwise and up the</tspan><tspan x="359.5" y="316.4">left arm</tspan></text></svg><text x="16" y="251.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="264.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Bangla recognizer, class 9 (ও, o; user manual Table 4): stored online-handwriting</text><text x="16" y="276.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="289.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
