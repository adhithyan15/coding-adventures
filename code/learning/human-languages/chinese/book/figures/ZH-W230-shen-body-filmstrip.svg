<svg xmlns="http://www.w3.org/2000/svg" width="982" height="556.02" viewBox="0 0 982 556.02" role="img" aria-label="How to write 身: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 身</title><desc>7 frames; frame N shows movements 1 to N of 身 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 身.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%BA%AB.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 身. Median 1 draws a short left-falling stroke on top; medians 2–3 draw the frame: a short left side, then a horizontal that turns down the right side and hooks to the left at the foot without lifting; medians 4–5 draw two short horizontals inside; median 6 draws a stroke rising from the far left across the frame; median 7 draws a long left-falling stroke from the upper right to the lower left. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s rising stroke lies almost level.</desc><rect x="0" y="0" width="982" height="556.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="225.26" rx="6" fill=