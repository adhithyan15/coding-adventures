<svg xmlns="http://www.w3.org/2000/svg" width="502" height="338.06" viewBox="0 0 502 338.06" role="img" aria-label="How to write थ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing थ</title><desc>3 frames; frame N shows movements 1 to N of थ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-थ-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A5-order.gif&gt;. Source note on variation: The 27-frame animation shows three ordered pen-down runs over its gray guide: frames 2–19 start at the upper spiral&apos;s inner-right tip, curl clockwise around the small opening and outward to the left waist, then continue down and clockwise around the broad lower bowl to the right-stem junction without lifting; frames 20–22 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 23–25 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 19 and 22 mark the first two run endings before the one-second completed frame 26. This learner path follows that sourced three-run order and fits its joined spiral-and-bowl body to Noto Sans Devanagari; everyday handwriting may narrow, divide, or simplify the loops differently.</desc><rect x="0" y="0" width="502" height="338.06" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="232.06" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="232.06" viewBox="-12 -702 735 1137.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M469 210L486 181Q459 155 414.5 137.5Q370 120 312 120Q249 120 