<svg xmlns="http://www.w3.org/2000/svg" width="502" height="352.6" viewBox="0 0 502 352.6" role="img" aria-label="How to write ర: one unbroken stroke · 3 movements"><title>Writing ర</title><desc>3 frames; frame N shows movements 1 to N of ర (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after AppChant, Telugu Alphabets Writing, consonant ర animated path guide encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_ర in version 3.8.05 (3805) &lt;https://play.google.com/store/apps/details?id=com.banuchanderjj.tracer.telugu&gt;. Source note on variation: The packaged auto-trace data gives two ordered starts, paths, and ends. Its ర.png atlas mapping and pictured glyph independently identify U+0C30 ర. Those ordered starts mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the source&apos;s order. The bundled Noto Sans Telugu outline joins the chevron to the top of the bowl, so the run climbs up the chevron&apos;s left arm before drawing it; that climb is a new segment, so the filmstrip shows one more frame than the source has movements. Inspected XAPK SHA-256: 30c6e520a5b469cbe8d17568718bf75796987ea9596f69850eb921db2fe7bd57; libTracer.so SHA-256: 444511c98b69ada4de57900776945837c013da6a4fbfb21833c180d06f9c3ac5.</desc><rect x="0" y="0" width="502" height="352.6" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="234.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg