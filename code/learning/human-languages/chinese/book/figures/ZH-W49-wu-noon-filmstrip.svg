<svg xmlns="http://www.w3.org/2000/svg" width="662" height="301.57" viewBox="0 0 662 301.57" role="img" aria-label="How to write 午: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 午</title><desc>4 frames; frame N shows movements 1 to N of 午 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 午.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8D%88.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 午. Median 1 draws a short left-falling stroke; medians 2–3 draw the upper and the long horizontal; median 4 draws the vertical last, from above the upper horizontal through both. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="301.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="195.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.57" viewBox="-16 -913 1033 1346.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M254 843L332 824Q309 750 276.5 680Q244 610 205 549.5Q166 489 124 443Q117 450 104.5 458.5Q92 467 79 475.5Q66 484 56 489Q99 531 136 587.5Q173 644 203 709.5Q233 775 254 843ZM250 706L871 706L871 632L214 632L250 706ZM54 381L947 381L947 305L54 305L54 381ZM462 674L539 674L539 -81L462 -81L462 674Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M276 821 L276 821" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M276 821 L290 786 L264 701 L196 590 L82 490" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="82" cy="490" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="303.8" text-anchor="middle" font-size="82.8" fill="#6b7280"><tspan x="500.5" y="303.8">1. draw the short</tspan><tspan x="500.5" y="404.8">left-falling stroke</tspan></text></svg><rect x="176" y="42" width="150" height="195.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="195.57" viewBox="-16 -913 1033 1346.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M254 843L332 824Q309 750 276.5 680Q244 610 205 549.5Q166 489 124 443Q117 450 104.5 458.5Q92 467 79 475.5Q66 484 56 489Q99 531 136 587.5Q173 644 203 709.5Q233 775 254 843ZM250 706L871 706L871 632L214 632L250 706ZM54 381L947 381L947 305L54 305L54 381ZM462 674L539 674L539 -81L462 -81L462 674Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M276 821 L290 786 L264 701 L196 590 L82 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M224 649 L224 649" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M224 649 L446 662 L483 645 L669 674 L846 679" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="846" cy="679" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="303.8" text-anchor="middle" font-size="82.8" fill="#6b7280"><tspan x="500.5" y="303.8">2. lift, then draw the</tspan><tspan x="500.5" y="404.8">upper horizontal</tspan></text></svg><rect x="336" y="42" width="150" height="195.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="195.57" viewBox="-16 -913 1033 1346.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M254 843L332 824Q309 750 276.5 680Q244 610 205 549.5Q166 489 124 443Q117 450 104.5 458.5Q92 467 79 475.5Q66 484 56 489Q99 531 136 587.5Q173 644 203 709.5Q233 775 254 843ZM250 706L871 706L871 632L214 632L250 706ZM54 381L947 381L947 305L54 305L54 381ZM462 674L539 674L539 -81L462 -81L462 674Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M276 821 L290 786 L264 701 L196 590 L82 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M224 649 L446 662 L483 645 L669 674 L846 679" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M68 355 L68 355" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M68 355 L154 339 L227 350 L689 345 L807 355 L932 323" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="932" cy="323" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="303.8" text-anchor="middle" font-size="82.8" fill="#6b7280"><tspan x="500.5" y="303.8">3. lift, then draw the</tspan><tspan x="500.5" y="404.8">long horizontal</tspan></text></svg><rect x="496" y="42" width="150" height="195.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42"