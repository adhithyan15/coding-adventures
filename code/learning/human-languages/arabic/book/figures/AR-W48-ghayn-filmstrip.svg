<svg xmlns="http://www.w3.org/2000/svg" width="502" height="416.02" viewBox="0 0 502 416.02" role="img" aria-label="How to write غ: 2 strokes · 1 pen lift · 3 movements"><title>Writing غ</title><desc>3 frames; frame N shows movements 1 to N of غ (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ع غ, independent Ghayn at 00:02.4–00:04.0 (University of Oregon Libraries Open Textbook, 2023; accessed 2026-08-23) &lt;https://opentext.uoregon.edu/introarabic/chapter/%D8%B9-%D8%BA/&gt;. Source note on variation: The page&apos;s directly linked ghayn.mov demonstrates independent غ in two pen-down runs at 00:02.4–00:04.0. The first run at 00:02.4–00:03.2 begins at the upper-right tip, sweeps left, shapes the open ع head, and continues without lifting down and around the broad lower bowl to finish toward the right. After one lift, the single upper dot is placed at 00:03.9–00:04.0. The adjacent lesson identifies Ghayn as a two-way connector, notes that its sound has no English equivalent, and gives gh transliteration. This two-stroke, one-lift learner path fits the course&apos;s vendored Noto Naskh outline while keeping Ghayn&apos;s independently evidenced dot-last order distinct from the adjacent Ayn demonstration.</desc><rect x="0" y="0" width="502" height="416.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="297.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="297.52" viewBox="3 -743 696 1380.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M372 -286Q294 -286 236 -259.5Q178 -233 146 -184Q114 -135 114 -70Q114 42 195 129