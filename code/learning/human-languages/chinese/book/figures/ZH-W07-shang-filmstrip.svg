<svg xmlns="http://www.w3.org/2000/svg" width="502" height="305.62" viewBox="0 0 502 305.62" role="img" aria-label="How to write 上: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 上</title><desc>3 frames; frame N shows movements 1 to N of 上 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 上.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%8A.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 上. Median 1 descends the central vertical from the top toward the base. Median 2 separately starts at the vertical and draws the short middle horizontal left-to-right. Median 3 separately draws the long base horizontal left-to-right. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all three medians to Noto Sans SC while preserving their order, both intervening lifts, and the short-before-long horizontal contrast; Noto&apos;s vertical is straighter and both horizontals are flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="502" height="305.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="199.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.62" viewBox="-19 -895 1039 1382.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M470 516L881 516L881 441L470 441L470 516ZM51 43L950 43L950 -32L51 -32L51 43ZM427 825L506 825L506 3L427 3L427 825Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M466 810 L466 810" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M466 810 L466 680 L466 550 L466 420 L466 290 L466 160 L466 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="466" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="255.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="255.3">1. descend the central</tspan><tspan x="500.5" y="356.9">vertical from top to</tspan><tspan x="500.5" y="458.6">bottom</tspan></text></svg><rect x="176" y="42" width="150" height="199.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="199.62" viewBox="-19 -895 1039 1382.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M470 516L881 516L881 441L470 441L470 516ZM51 43L950 43L950 -32L51 -32L51 43ZM427 825L506 825L506 3L427 3L427 825Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M466 810 L466 680 L466 550 L466 420 L466 290 L466 160 L466 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M470 478 L470 478" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M470 478 L550 478 L630 478 L710 478 L790 478 L868 478" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="868" cy="478" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="255.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="255.3">2. lift, then draw the</tspan><tspan x="500.5" y="356.9">short middle horizontal</tspan><tspan x="500.5" y="458.6">left-to-right</tspan></text></svg><rect x="336" y="42" width="150" height="199.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="199.62" viewBox="-19 -895 1039 1382.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M470 516L881 516L881 441L470 441L470 516ZM51 43L950 43L950 -32L51 -32L51 43ZM427 825L506 825L506 3L427 3L427 825Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M466 810 L466 680 L466 550 L466 420 L466 290 L466 160 L466 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M470 478 L550 478 L630 478 L710 478 L790 478 L868 478" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M65 5 L65 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M65 5 L210 5 L355 5 L500 5 L645 5 L790 5 L936 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="936" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="255.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="255.3">3. lift, then draw the</tspan><tspan x="500.5" y="356.9">long base horizontal</tspan><tspan x="500.5" y="458.6">left-to-right</tspan></text></svg><text x="16" y="254.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 上.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="267.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="279.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
