<svg xmlns="http://www.w3.org/2000/svg" width="662" height="307.84" viewBox="0 0 662 307.84" role="img" aria-label="How to write ਹ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਹ</title><desc>4 frames; frame N shows movements 1 to N of ਹ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਹ (haahaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 157, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L157&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਹ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the base and up the left side, ending in the upper middle at the open end. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਹ, each by a different non-native copyist; only counts and shares are cited. 85% (17 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 70% (14 of 20) start in the same part of the letter as the source and 95% (19 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="307.84" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="201.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.84" viewBox="-77 -692 730 982.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M309 0Q255 0 206.5 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 336 87.5 372Q138 408 228 408Q239 408 251 407.5Q263 407 270 405L264 333Q256 335 245 335Q234 335 226 335Q175 335 146.5 317.5Q118 300 118 253Q118 220 135 188Q152 156 180.5 130Q209 104 244.5 88.5Q280 73 317 73Q338 73 357 78Q376 83 387 96Q396 107 401 124.5Q406 142 406 183L406 551L-7 551L-7 622L583 622L583 551L487 551L487 172Q487 84 442.5 42Q398 0 309 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L131 586 L170 586 L209 586 L248 586 L286 586 L325 586 L364 586 L403 586 L442 586 L480 586 L519 586 L558 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="558" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288" y="198.5" text-anchor="middle" font-size="58.5" fill="#6b7280"><tspan x="288" y="198.5">1. draw the headline</tspan><tspan x="288" y="269.9">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="201.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.84" viewBox="-77 -692 730 982.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M309 0Q255 0 206.5 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 336 87.5 372Q138 408 228 408Q239 408 251 407.5Q263 407 270 405L264 333Q256 335 245 335Q234 335 226 335Q175 335 146.5 317.5Q118 300 118 253Q118 220 135 188Q152 156 180.5 130Q209 104 244.5 88.5Q280 73 317 73Q338 73 357 78Q376 83 387 96Q396 107 401 124.5Q406 142 406 183L406 551L-7 551L-7 622L583 622L583 551L487 551L487 172Q487 84 442.5 42Q398 0 309 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L131 586 L170 586 L209 586 L248 586 L286 586 L325 586 L364 586 L403 586 L442 586 L480 586 L519 586 L558 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M452 586 L452 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M452 586 L449 547 L447 507 L447 467 L447 426 L447 385 L447 344 L447 303 L447 262 L446 221 L444 181" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="444" cy="181" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288" y="198.5" text-anchor="middle" font-size="58.5" fill="#6b7280"><tspan x="288" y="198.5">2. lift, then come down</tspan><tspan x="288" y="269.9">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="201.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="201.84" viewBox="-77 -692 730 982.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M309 0Q255 0 206.5 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 336 87.5 372Q138 408 228 408Q239 408 251 407.5Q263 407 27