<svg xmlns="http://www.w3.org/2000/svg" width="662" height="308.51" viewBox="0 0 662 308.51" role="img" aria-label="How to write 从: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 从</title><desc>4 frames; frame N shows movements 1 to N of 从 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 从.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BB%8E.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 从, in two pieces. Medians 1–2 draw the left 人: a left-falling stroke, then a short right-falling stroke that stops at its middle. Medians 3–4 draw the right 人 as 人 is written alone: a left-falling stroke, then the right-falling stroke. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="308.51" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="202.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.51" viewBox="-29 -889 1058 1428.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__g