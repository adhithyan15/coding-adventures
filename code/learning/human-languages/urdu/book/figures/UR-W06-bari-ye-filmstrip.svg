87 638.5 97.5Q694 108 741 122Q755 107 755 89Q755 76 746.5 65Q738 54 720 45Q700 35 664 26.5Q628 18 584 12Q540 6 493.5 3Q447 0 406 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M360 280 L350 275 L330 252 L310 238 L292 230 L250 215 L200 195 L150 173 L115 145 L100 110 L100 110" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M100 110 L90 95 L82 78 L82 62 L95 55 L120 52" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="120" cy="52" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="411.5" y="206.3" text-anchor="middle" font-size="66.3" fill="#6b7280"><tspan x="411.5" y="206.3">2. curl back underneath</tspan><tspan x="411.5" y="287.2">at the far left without</tspan><tspan x="411.5" y="368.1">lifting</tspan></text></svg><rect x="336" y="42" width="150" height="155.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="155.3" viewBox="-2 -384 827 856.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M406 0Q359 0 305 3.5Q251 7 201.5 13.5Q152 20 116 29Q68 41 68 52Q68 63 71.5 80Q75 97 80 115Q85 133 90.5 147Q96 161 101 166Q116 182 137 196Q158 210 183 222Q190 225 212 232.5Q234 240 271 253Q306 264 322 279.5Q338 295 348 314L379 297Q364 253 344 230.5Q324 208 292 198Q258 188 235 180.5Q212 173 195 165Q174 156 156 145.5Q138 135 114 118Q170 96 242.5 86Q315 76 419 76Q470 76 526.5 81.5Q583 87 638.5 97.5Q694 108 741 122Q755 107 755 89Q755 76 746.5 65Q738 54 720 45Q700 35 664 26.5Q628 18 584 12Q540 6 493.5 3Q447 0 406 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M360 280 L350 275 L330 252 L310 238 L292 230 L250 215 L200 195 L150 173 L115 145 L100 110 L90 95 L82 78 L82 62 L95 55 L120 52 L120 52" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 52 L170 30 L250 20 L350 12 L450 10 L550 20 L650 40 L720 62 L740 90" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="740" cy="90" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="411.5" y="206.3" text-anchor="middle" font-size="66.3" fill="#6b7280"><tspan x="411.5" y="206.3">3. continue right along</tspan><tspan x="411.5" y="287.2">the lower fold without</tspan><tspan x="411.5" y="368.1">lifting</tspan></text></svg><text x="16" y="210.3" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Chhoṭī he, do-chashmī he, chhoṭī ye, baṛī ye, and</text><text x="16" y="222.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">punctuation, independent ے calligraphic and handwriting animations and Baṛī ye</text><text x="16" y="235.3" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">instructions (Northwestern University Libraries Open Textbook, 2026)</text><text x="16" y="247.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
