<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftEditor</title>
</head>
<body>
  <section data-component="DraftEditor" data-mosaic-html-root="DraftEditor">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="DraftEditor">
      <div style="display: flex; flex-direction: column; padding: 16px; gap: 8px; background: #ffffff; border-width: 1px; border-color: #dee2e6; border-radius: 4px">
        <!-- mosaic-if when="titleLabel" -->
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="color: #6c757d; font-size: 12px">{{titleLabel}}</span>
            <!-- emit "onTitleChange" dropped: HTML is static -->
            <input type="text" aria-label="{{titleLabel}}" value="{{titleValue}}" placeholder="{{titlePlaceholder}}" data-on-change="onTitleChange" style="width: 100%; padding: 8px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 16px">
          </div>
        <!-- /mosaic-if -->
        <span style="color: #6c757d; font-size: 12px">{{bodyLabel}}</span>
        <!-- emit "onBodyChange" dropped: HTML is static -->
        <textarea aria-label="{{bodyLabel}}" data-on-change="onBodyChange" style="width: 100%; min-height: 160px; padding: 8px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 14px">{{bodyValue}}</textarea>
        <div style="display: flex; flex-direction: row; gap: 8px">
          <!-- mosaic-if when="saveLabel" -->
            <!-- emit "onSave" dropped: HTML is static -->
            <button data-on-click="onSave" style="padding: 8px; background: #0d6efd; color: #ffffff; border-width: 1px; border-color: #0a58ca; border-radius: 4px; font-size: 14px">{{saveLabel}}</button>
          <!-- /mosaic-if -->
          <!-- mosaic-if when="deleteLabel" -->
            <!-- emit "onDelete" dropped: HTML is static -->
            <button data-on-click="onDelete" style="padding: 8px; background: #ffffff; color: #b02a37; border-width: 1px; border-color: #b02a37; border-radius: 4px; font-size: 14px">{{deleteLabel}}</button>
          <!-- /mosaic-if -->
          <!-- mosaic-if when="cancelLabel" -->
            <!-- emit "onCancel" dropped: HTML is static -->
            <button data-on-click="onCancel" style="padding: 8px; background: #ffffff; color: #212529; border-width: 1px; border-color: #dee2e6; border-radius: 4px; font-size: 14px">{{cancelLabel}}</button>
          <!-- /mosaic-if -->
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
