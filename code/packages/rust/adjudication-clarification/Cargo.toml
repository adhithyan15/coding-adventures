[package]
name = "adjudication-clarification"
version = "0.3.0"
edition = "2021"
description = "ADJ06 — clarification dialogue. v0.3 adds ADJ06-for-ADJ04 (round-trip drift retry) — when the model's rendering drifts from source, re-prompt the renderer with the drift direction and let it self-correct. Now covers ADJ02 coverage, ADJ03 polarity/modality, AND ADJ04 round-trip drift in one crate."

[dependencies]
adjudication-audit-trail = { path = "../adjudication-audit-trail" }
llm-gateway = { path = "../llm-gateway" }
llm-primitives = { path = "../llm-primitives" }
serde_json = "1"
