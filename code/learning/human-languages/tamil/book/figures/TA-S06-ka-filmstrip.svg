<svg xmlns="http://www.w3.org/2000/svg" width="982" height="258.66" viewBox="0 0 982 258.66" role="img" aria-label="How to write க: one unbroken stroke · 6 movements"><title>Writing க</title><desc>6 frames; frame N shows movements 1 to N of க (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, க (Univ. of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Tamil handwriting is taught with school-to-school variation; there is no single national stroke-order standard. Appendix I Frame 3 numbers six hand-movements for க. Native writers draw them as one continuous stroke, and this ductus follows the six movements in order without lifting: the pen returns up the lower-left bowl&apos;s outer side to the middle left and crosses the middle bar into the lower-right bowl. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 88% of the 203 stored prototypes of க are a single pen-down stroke.</desc><rect x="0" y="0" width="982" height="258.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="165.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="165.16" viewBox="-21 -624 867 954.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L512 328Q564 328 602 323Q640 318 668.5 307.5Q697 297 720 279Q746 259 761 226.5Q776 194 776 152Q776 76 730.5 34Q685 -8 602 -8