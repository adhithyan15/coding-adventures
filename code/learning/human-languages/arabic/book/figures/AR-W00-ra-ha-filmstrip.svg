<svg xmlns="http://www.w3.org/2000/svg" width="838" height="424.39" viewBox="0 0 838 424.39" role="img" aria-label="How to write ر ح: 2 letters, ر, ح, one after another"><title>Writing ر ح</title><desc>2 letters written one after another: ر, ح (arabic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: ر: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: د ذ ر, independent Raa at 00:08.8–00:09.3 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/chapter-1/&gt;; ح: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: ج ح خ, independent Haa at 00:00–00:01 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%D8%AC-%D8%AD-%D8%AE/&gt;. Source notes on variation: ر: The cited Raa demonstration draws independent ر in one continuous pen-down run at 00:08.8–00:09.3: it begins at the upper tip, descends through the short stroke, then sweeps left through the lower curve without lifting. The adjacent lesson identifies raa as a one-way connector and separately prints its independent and final forms. This independent learner path fits the course&apos;s vendored Noto Naskh outline while keeping its provenance scoped to Arabic rather than inheriting the already-authored Urdu ر source for the same Unicode glyph. ح: The page&apos;s Haa attachment demonstrates independent ح in two pen-down runs. The clip opens with the first mark already underway: visible motion lengthens the short left stem downward from 00:00.00–00:00.15. After a pause, the pen lifts once and restarts near the stem&apos;s upper portion at 00:00.32, sweeping down-right and around the bowl without another lift through 00:00.82. The adjacent lesson identifies haa as a two-way connector and separately prints its contextual shapes. Unlike the adjacent Jeem demonstration, there is no dot stroke; this stem-first order is source-specific rather than inherited from ج. The learner path fits the course&apos;s vendored Noto Naskh outline while preserving Arabic provenance.</desc><rect x="0" y="0" width="838" height="424.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 2 movements</text><rect x="16" y="61" width="150" height="274.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="274.39" viewBox="-90 -411 495 905.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L250 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="304" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="