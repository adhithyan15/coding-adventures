<svg xmlns="http://www.w3.org/2000/svg" width="822" height="279.3" viewBox="0 0 822 279.3" role="img" aria-label="How to write 五: 4 strokes · 3 pen lifts · 5 movements"><title>Writing 五</title><desc>5 frames; frame N shows movements 1 to N of 五 (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/04e94.svg, kanji 五 (U+4E94 CJK UNIFIED IDEOGRAPH-4E94), four stroke paths kvg:04e94-s1 to s4 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/04e94.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the top bar drawn left to right (kvg:type ㇐); s2 starts on the top bar and falls down and slightly to the left, to the base (㇑a); s3 is the middle bar drawn left to right, turning down at its right end without lifting (㇕c); s4 is the long base bar, drawn left to right (㇐). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="279.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="173.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="173.3" viewBox="-14 -813 1030 1190" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M120 743L875 743L875 669L120 669L120 743ZM56 49L946 49L946 -25L56 -25L56 49ZM412 717L496 717Q481 631 463 534Q445 437 426 340Q407 243 388 156Q369 69 353 4L269 4Q287 71 306.5 159Q326 247 345.5 344Q365 441 382.5 537Q400 633 412 