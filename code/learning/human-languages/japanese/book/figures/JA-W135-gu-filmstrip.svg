<svg xmlns="http://www.w3.org/2000/svg" width="662" height="339.19" viewBox="0 0 662 339.19" role="img" aria-label="How to write ぐ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ぐ</title><desc>4 frames; frame N shows movements 1 to N of ぐ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03050.svg, hiragana ぐ (U+3050 HIRAGANA LETTER GU), three stroke paths kvg:03050-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03050.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is く&apos;s stroke, the same paths as in its file for く, kanji/0304f.svg; s2 and s3 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="662" height="339.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="233.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="233.19" viewBox="114 -874 800 1243.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M639 569Q652 550 668 523Q684 496 699.5 468.5Q715 441 726 422L670 398Q660 419 645 445.5Q630 472 614.5 499.5Q599 527 586 546L639 569ZM756 614Q769 597 785.5 570.5Q802 544 818 517.5Q834 491 844 470L790 446Q778 467 762.5 493.5Q747 520 731.5 546Q716 572 702 590L756 614ZM691 738Q675 726 655 708.5Q635 691 622 681Q596 658 559 627.5Q