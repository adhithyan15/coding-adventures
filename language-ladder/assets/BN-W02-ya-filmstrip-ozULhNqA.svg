<svg xmlns="http://www.w3.org/2000/svg" width="662" height="339.68" viewBox="0 0 662 339.68" role="img" aria-label="How to write য: 2 strokes · 1 pen lift · 4 movements"><title>Writing য</title><desc>4 frames; frame N shows movements 1 to N of য (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 36 (য, ya; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 236 of the 251 stored prototypes draw the body in one pen-down stroke. 191 of those 236 start at the top left and 221 end at the top right, at the top of the stem; 210 reach the stem&apos;s foot first and climb back up it. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 92 of the 251 draw none at all, 62 open with it, 93 end with it and 4 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 154 of the 156 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="339.68" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="233.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="233.68" viewBox="-80 -692 786 1224.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M454 0Q410 56 362 94.5Q314 133 253.5 160Q193 187 109 208L73 299Q116 329 162.5 356.5Q209 384 265 408Q218 438 170 459Q122 480 55 505L73 551L-10 551L-10 622L636 622L636 551L531 551L531 0L454 0ZM356 367Q305 348 255 323.5Q205 299 162 269Q262 241 332.5 198.5Q403 156 456 96Q454 132 454 171L454 551L144 551Q199 530 253 496Q307 462 351 426L356 367Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 572 L110 572" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 572 L129 534 L161 505 L200 486 L238 464 L272 438 L300 404 L274 373 L235 355 L197 334 L159 312 L126 284" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="126" cy="284" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="313" y="203" text-anchor="middle" font-size="63" fill="#6b7280"><tspan x="313" y="203">1. start under the</tspan><tspan x="313" y="279.9">headline and zigzag</tspan><tspan x="313" y="356.7">down: out to the right</tspan><tspan x="313" y="433.6">point, back to the left</tspan><tspan x="313" y="510.4">point</tspan></text></svg><rect x="176" y="42" width="150" height="233.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="233.68" viewBox="-80 -692 786 1224.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M454 0Q410 56 362 94.5Q314 133 253.5 160Q193 187 109 208L73 299Q116 329 162.5 356.5Q209 384 265 408Q218 438 170 459Q122 480 55 505L73 551L-10 551L-10 622L636 622L636 551L531 551L531 0L454 0ZM356 367Q305 348 255 323.5Q205 299 162 269Q262 241 332.5 198.5Q403 156 456 96Q454 132 454 171L454 551L144 551Q199 530 253 496Q307 462 351 426L356 367Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 572 L129 534 L161 505 L200 486 L238 464 L272 438 L300 404 L274 373 L235 355 L197 334 L159 312 L126 284 L126 284" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M126 284 L149 249 L185 225 L225 211 L265 194 L303 175 L340 153 L375 128 L407 99 L439 70 L478 52" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="478" cy="52" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="313" y="203" text-anchor="middle" font-size="63" fill="#6b7280"><tspan x="313" y="203">2. run down to the</tspan><tspan x="313" y="279.9">right to the foot of</tspan><tspan x="313" y="356.7">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="233.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="233.68" viewBox="-80 -692 786 1224.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M454 0Q410 56 362 94.5Q314 133 253.5 160Q193 187 109 208L73 299Q116 329 162.5 356.5Q209 384 265 408Q218 438 170 459Q122 480 55 505L73 551L-10 551L-10 622L636 622L636 551L531 551L531 0L454 0ZM356 367Q305 348 255 323.5Q205 299 162 269Q262 241 332.5 198.5Q403 156 456 96Q454 132 454 171L454 551L144 551Q199 530 253 496Q307 462 351 426L356 367Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 572 L129 534 L161 505 L200 486 L238 464 L272 438 L300 404 L274 373 L235 355 L197 334 L159 312 L126 284 L149 249 L185 225 L225 211 L265 194 L303 175 L340 153 L375 128 L407 99 L439 70 L478 52" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M478 52 L478 52 L493 93 L494 137 L494 181 L490 224 L490 268 L490 312 L490 356 L490 400 L490 444 L490 488 L490 532 L490 576" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="490" cy="576" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="313" y="203" text-anchor="middle" font-size="63" fill="#6b7280"><tspan x="313" y="203">3. climb the stem to</tspan><tspan x="313" y="279.9">the headline</tspan></text></svg><rect x="496" y="42" width="150" height="233.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="233.68" viewBox="-80 -692 786 1224.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M454 0Q410 56 362 94.5Q314 133 253.5 160Q193 187 109 208L73 299Q116 329 162.5 356.5Q209 384 265 408Q218 438 170 459Q122 480 55 505L73 551L-10 551L-10 622L636 622L636 551L531 551L531 0L454 0ZM356 367Q305 348 255 323.5Q205 299 162 269Q262 241 332.5 198.5Q403 156 456 96Q454 132 454 171L454 551L144 551Q199 530 253 496Q307 462 351 426L356 367Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 572 L129 534 L161 505 L200 486 L238 464 L272 438 L300 404 L274 373 L235 355 L197 334 L159 312 L126 284 L149 249 L185 225 L225 211 L265 194 L303 175 L340 153 L375 128 L407 99 L439 70 L478 52 L493 93 L494 137 L494 181 L490 224 L490 268 L490 312 L490 356 L490 400 L490 444 L490 488 L490 532 L490 576" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L165 586 L310 586 L455 586 L600 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="600" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="313" y="203" text-anchor="middle" font-size="63" fill="#6b7280"><tspan x="313" y="203">4. lift, then draw the</tspan><tspan x="313" y="279.9">headline last, from</tspan><tspan x="313" y="356.7">left to right</tspan></text></svg><text x="16" y="288.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 36 (য, ya;</text><text x="16" y="301.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="313.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
