<svg xmlns="http://www.w3.org/2000/svg" width="502" height="309.37" viewBox="0 0 502 309.37" role="img" aria-label="How to write श: 3 strokes · 2 pen lifts · 3 movements"><title>Writing श</title><desc>3 frames; frame N shows movements 1 to N of श (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-श-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%B6-order.gif&gt;. Source note on variation: The 25-frame animation shows three ordered pen-down runs over its gray guide: frames 2–16 start at the upper loop&apos;s lower inner tip, sweep left and clockwise around the upper loop, descend the joined outer curve, curl around the lower loop, and continue down-right through the diagonal tail without lifting; frames 17–21 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 22–24 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 16 and 21 mark the first two run endings before the one-second completed frame 24. JackPotte&apos;s separate 26-frame ‘Devanagari ç श.gif’ animation independently uses the same joined body, restarted right stem, and restarted headline, with spatial restarts at frames 14 and 21; all its frames last 100 ms. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit IX, p. 45, independently shows the same body, right-stem, and headline buildup, while the animations supply the within-run directions and lift evidence. This learner path follows that corroborated three-run form and fits both loops and the diagonal tail to Noto Sans Devanagari; everyday handwriting may simplify or narrow the loops differently.</desc><rect x="0" y="0" width="502" height="309.37" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="203.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.37" viewBox="-42 -702 806 1092.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M591 551L591 0L510 0L510 551L421 551L421 622L694 622L694 551L591 551ZM129 173Q84 173 56 194Q28 215 28 249Q28 278 46.5 293.5Q65 309 94 309Q122 309 144 295.5Q166 282 191 251L202 230Q250 187 292.5 137.5Q335 88 372 38L303 -6Q251 66 210.5 117Q170 168 137 202L125 251Q180 257 222.5 281.5Q265 306 290 349Q315 392 315 451Q315 507 290.5 536.5Q266 566 221 566Q187 566 168 548.5Q149 531 149 505Q149 470 178.5 453.5Q208 437 260 433L248 368Q169 374 122 409Q75 444 75 509Q75 565 112.5 598.5Q150 632 219 632Q273 632 312 609.5Q351 587 372.5 545.5Q394 504 394 445Q394 378 368.5 326.5Q343 275 298 240.5Q253 206 194 189L183 182Q166 178 154.5 175.5Q143 173 129 173Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M240 380 L240 380" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M240 380 L220 395 L175 410 L135 440 L110 480 L105 520 L120 560 L155 590 L200 605 L245 600 L285 580 L315 545 L335 500 L340 450 L330 400 L310 350 L275 310 L235 280 L190 260 L175 265 L155 278 L115 290 L75 280 L50 255 L55 225 L85 200 L125 192 L165 210 L200 245 L205 220 L235 185 L270 145 L330 80 L350 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="350" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361" y="210.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="361" y="210.6">1. trace the joined</tspan><tspan x="361" y="289.4">double-loop body and</tspan><tspan x="361" y="368.2">diagonal tail</tspan></text></svg><rect x="176" y="42" width="150" height="203.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="203.37" viewBox="-42 -702 806 1092.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M591 551L591 0L510 0L510 551L421 551L421 622L694 622L694 551L591 551ZM129 173Q84 173 56 194Q28 215 28 249Q28 278 46.5 293.5Q65 309 94 309Q122 309 144 295.5Q166 282 191 251L202 230Q250 187 292.5 137.5Q335 88 372 38L303 -6Q251 66 210.5 117Q170 168 137 202L125 251Q180 257 222.5 281.5Q265 306 290 349Q315 392 315 451Q315 507 290.5 536.5Q266 566 221 566Q187 566 168 548.5Q149 531 149 505Q149 470 178.5 453.5Q208 437 260 433L248 368Q169 374 122 409Q75 444 75 509Q75 565 112.5 598.5Q150 632 219 632Q273 632 312 609.5Q351 587 372.5 545.5Q394 504 394 445Q394 378 368.5 326.5Q343 275 298 240.5Q253 206 194 189L183 182Q166 178 154.5 175.5Q143 173 129 173Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M240 380 L220 395 L175 410 L135 440 L110 480 L105 520 L120 560 L155 590 L200 605 L245 600 L285 580 L315 545 L335 500 L340 450 L330 400 L310 350 L275 310 L235 280 L190 260 L175 265 L155 278 L115 290 L75 280 L50 255 L55 225 L85 200 L125 192 L165 210 L200 245 L205 220 L235 185 L270 145 L330 80 L350 25" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M550 550 L550 550" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M550 550 L550 475 L550 395 L550 315 L550 235 L550 155 L550 75 L550 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="550" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361" y="210.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="361" y="210.6">2. lift, then descend</tspan><tspan x="361" y="289.4">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="203.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="203.37" viewBox="-42 -702 806 1092.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M591 551L591 0L510 0L510 551L421 551L421 622L694 622L694 551L591 551ZM129 173Q84 173 56 194Q28 215 28 249Q28 278 46.5 293.5Q65 309 94 309Q122 309 144 295.5Q166 282 191 251L202 230Q250 187 292.5 137.5Q335 88 372 38L303 -6Q251 66 210.5 117Q170 168 137 202L125 251Q180 257 222.5 281.5Q265 306 290 349Q315 392 315 451Q315 507 290.5 536.5Q266 566 221 566Q187 566 168 548.5Q149 531 149 505Q149 470 178.5 453.5Q208 437 260 433L248 368Q169 374 122 409Q75 444 75 509Q75 565 112.5 598.5Q150 632 219 632Q273 632 312 609.5Q351 587 372.5 545.5Q394 504 394 445Q394 378 368.5 326.5Q343 275 298 240.5Q253 206 194 189L183 182Q166 178 154.5 175.5Q143 173 129 173Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M240 380 L220 395 L175 410 L135 440 L110 480 L105 520 L120 560 L155 590 L200 605 L245 600 L285 580 L315 545 L335 500 L340 450 L330 400 L310 350 L275 310 L235 280 L190 260 L175 265 L155 278 L115 290 L75 280 L50 255 L55 225 L85 200 L125 192 L165 210 L200 245 L205 220 L235 185 L270 145 L330 80 L350 25" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M550 550 L550 475 L550 395 L550 315 L550 235 L550 155 L550 75 L550 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M425 585 L425 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M425 585 L480 585 L535 585 L590 585 L645 585 L690 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361" y="210.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="361" y="210.6">3. lift, then draw the</tspan><tspan x="361" y="289.4">shirorekha</tspan><tspan x="361" y="368.2">left-to-right</tspan></text></svg><text x="16" y="258.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-श-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="270.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="283.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
