<svg xmlns="http://www.w3.org/2000/svg" width="982" height="302.07" viewBox="0 0 982 302.07" role="img" aria-label="How to write 有: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 有</title><desc>6 frames; frame N shows movements 1 to N of 有 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 有.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%9C%89.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 有. Medians 1–2 are the horizontal and the long left-falling stroke that cross at the top, in that order — horizontal before left-falling, the rule 大 and 六 already showed. Medians 3–6 build 月 beneath: left side, then the joined top-and-right that hooks at the base, then the two inner horizontals, so the enclosure is closed before it is filled. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving their order, the joined corner, the base hook and five intervening lifts; Noto&apos;s 月 is slightly narrower than the source graphic.</desc><rect x="0" y="0" width="982" height="302.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="208.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.57" viewBox="-30 -910 1039 1444.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M63 710L939 710L939 640L63 640L63 710ZM308 353L777 353L77