[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-ca-capability-analyzer"
version = "0.1.0"
description = "Pure Python AST capability scanner and static CWE detector"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
ca-capability-analyzer = "coding_adventures_ca_capability_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/coding_adventures_ca_capability_analyzer",
    "src/ca_capability_analyzer",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=coding_adventures_ca_capability_analyzer --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/coding_adventures_ca_capability_analyzer"]

[tool.coverage.report]
fail_under = 95
show_missing = true
