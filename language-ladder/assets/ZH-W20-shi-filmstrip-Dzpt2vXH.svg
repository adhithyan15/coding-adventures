<svg xmlns="http://www.w3.org/2000/svg" width="342" height="339.86" viewBox="0 0 342 339.86" role="img" aria-label="How to write 十: 2 strokes · 1 pen lift · 2 movements"><title>Writing 十</title><desc>2 frames; frame N shows movements 1 to N of 十 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 十.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8D%81.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 十: median 1 crosses from left to right, median 2 descends through its centre. Horizontal before vertical, the same order 三 and 四 already used. The character is the lower component of 早 and appeared in this course as a part of that character for thirteen chapters before it was taught on its own.</desc><rect x="0" y="0" width="342" height="339.86" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="208.86" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.86" viewBox="-15 -909 1037 1443.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M55 466L952 466L952 389L55 389L55 466ZM461 839L542 839L542 -80L461 -80L461 839Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M70 427 L70 427" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M70 427 L300 427 L500 427 L700 427 L935 427" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="935" cy="427" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503.5" y="303.1" text-anchor="middle" font-size="83.1" fill="#6b7280"><tspan x="503.5" y="303.1">1. draw the horizontal</tspan><tspan x="503.5" y="404.5">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="208.86" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="208.86" viewBox="-15 -909 1037 1443.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M55 466L952 466L952 389L55 389L55 466ZM461 839L542 839L542 -80L461 -80L461 839Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M70 427 L300 427 L500 427 L700 427 L935 427" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M501 820 L501 820" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M501 820 L501 600 L501 350 L501 100 L501 -60" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="501" cy="-60" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503.5" y="303.1" text-anchor="middle" font-size="83.1" fill="#6b7280"><tspan x="503.5" y="303.1">2. lift, then draw the</tspan><tspan x="503.5" y="404.5">crossing vertical top</tspan><tspan x="503.5" y="505.9">to bottom</tspan></text></svg><text x="16" y="263.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 十.json, ordered stroke</text><text x="16" y="276.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="288.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="301.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="313.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
