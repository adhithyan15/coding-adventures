<svg xmlns="http://www.w3.org/2000/svg" width="662" height="286.87" viewBox="0 0 662 286.87" role="img" aria-label="How to write ত: 2 strokes · 1 pen lift · 4 movements"><title>Writing ত</title><desc>4 frames; frame N shows movements 1 to N of ত (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 26 (ত, ta; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 444 of the 512 stored prototypes draw the body in one pen-down stroke. 403 of those 444 start inside the curl, 436 turn clockwise (over the top, down the right side and round the bottom) and 368 end at the top left, at the tip of the left arm. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 321 of the 512 draw none at all, 51 open with it, 115 end with it and 25 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 166 of the 169 writers whose headline run has a direction draw it left to right. Noto prints this letter&apos;s headline apart from its body. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="286.87" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="180.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="180.87" viewBox="-80 -692 867 1045.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L717 622L717 551L-10 551ZM407 50Q325 50 254.5 90.5Q184 131 128 222.5Q72 314 32 467L105 486Q156 299 225.5 212.5Q295 126 406 126Q468 126 504.5 146.5Q541 167 557 201.5Q573 236 573 278Q573 338 543 379.5Q513 421 457 428Q463 412 463 392Q463 351 438.5 327.5Q414 304 373 304Q332 304 307.5 330Q283 356 283 395Q283 442 320 471Q357 500 422 500Q532 500 591 437.5Q650 375 650 274Q650 211 623.5 160.5Q597 110 543 80Q489 50 407 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M338 382 L338 382" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M338 382 L374 402 L398 437 L435 457 L479 457 L520 446 L555 421 L582 387 L600 348 L610 306" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="610" cy="306" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="353.5" y="159.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="353.5" y="159.5">1. start inside the</tspan><tspan x="353.5" y="244.3">curl and turn clockwise</tspan><tspan x="353.5" y="329.1">over the top</tspan></text></svg><rect x="176" y="42" width="150" height="180.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="180.87" viewBox="-80 -692 867 1045.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L717 622L717 551L-10 551ZM407 50Q325 50 254.5 90.5Q184 131 128 222.5Q72 314 32 467L105 486Q156 299 225.5 212.5Q295 126 406 126Q468 126 504.5 146.5Q541 167 557 201.5Q573 236 573 278Q573 338 543 379.5Q513 421 457 428Q463 412 463 392Q463 351 438.5 327.5Q414 304 373 304Q332 304 307.5 330Q283 356 283 395Q283 442 320 471Q357 500 422 500Q532 500 591 437.5Q650 375 650 274Q650 211 623.5 160.5Q597 110 543 80Q489 50 407 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M338 382 L374 402 L398 437 L435 457 L479 457 L520 446 L555 421 L582 387 L600 348 L610 306 L610 306" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M610 306 L610 263 L604 220 L588 180 L560 148 L528 118 L489 99 L447 91 L403 90 L360 92 L318 102" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="318" cy="102" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="353.5" y="159.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="353.5" y="159.5">2. come down the right</tspan><tspan x="353.5" y="244.3">side and round the</tspan><tspan x="353.5" y="329.1">bottom</tspan></text></svg><rect x="336" y="42" width="150" height="180.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="180.87" viewBox="-80 -692 867 1045.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L717 622L717 551L-10 551ZM407 50Q325 50 254.5 90.5Q184 131 128 222.5Q72 314 32 467L105 486Q156 299 225.5 212.5Q295 126 406 126Q468 126 504.5 146.5Q541 167 557 201.5Q573 236 573 278Q573 338 543 379.5Q513 421 457 428Q463 412 463 392Q463 351 438.5 327.5Q414 304 373 304Q332 304 307.5 330Q283 356 283 395Q283 442 320 471Q357 500 422 500Q532 500 591 437.5Q650 375 650 274Q650 211 623.5 160.5Q597 110 543 80Q489 50 407 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M338 382 L374 402 L398 437 L435 457 L479 457 L520 446 L555 421 L582 387 L600 348 L610 306 L610 263 L604 220 L588 180 L560 148 L528 118 L489 99 L447 91 L403 90 L360 92 L318 102" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M318 102 L318 102 L276 121 L239 150 L206 182 L176 218 L152 258 L131 299 L112 342 L97 386 L82 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="82" cy="430" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="353.5" y="159.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="353.5" y="159.5">3. climb the left arm</tspan><tspan x="353.5" y="244.3">to its tip</tspan></text></svg><rect x="496" y="42" width="150" height="180.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="180.87" viewBox="-80 -692 867 1045.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-10 551L-10 622L717 622L717 551L-10 551ZM407 50Q325 50 254.5 90.5Q184 131 128 222.5Q72 314 32 467L105 486Q156 299 225.5 212.5Q295 126 406 126Q468 126 504.5 146.5Q541 167 557 201.5Q573 236 573 278Q573 338 543 379.5Q513 421 457 428Q463 412 463 392Q463 351 438.5 327.5Q414 304 373 304Q332 304 307.5 330Q283 356 283 395Q283 442 320 471Q357 500 422 500Q532 500 591 437.5Q650 375 650 274Q650 211 623.5 160.5Q597 110 543 80Q489 50 407 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M338 382 L374 402 L398 437 L435 457 L479 457 L520 446 L555 421 L582 387 L600 348 L610 306 L610 263 L604 220 L588 180 L560 148 L528 118 L489 99 L447 91 L403 90 L360 92 L318 102 L276 121 L239 150 L206 182 L176 218 L152 258 L131 299 L112 342 L97 386 L82 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L188 586 L355 586 L522 586 L690 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="353.5" y="159.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="353.5" y="159.5">4. lift, then draw the</tspan><tspan x="353.5" y="244.3">headline last, from</tspan><tspan x="353.5" y="329.1">left to right</tspan></text></svg><text x="16" y="235.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 26 (ত, ta;</text><text x="16" y="248.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="260.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
