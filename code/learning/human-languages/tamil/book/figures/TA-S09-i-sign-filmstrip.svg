red online-handwriting prototypes from native</text><text x="16" y="367.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil writers (MIT licence, 2012)</text><text x="16" y="380.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
