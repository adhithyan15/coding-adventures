[package]
name = "iir-to-intel8008"
version = "0.2.0"
edition = "2021"
description = "IIR → Intel 8008 machine code backend (Oct's native target) — lowers IIRModule to a Vec<u8> of 8-bit Intel 8008 opcodes.  v0.2.0 (A2+): adds `const` → MVI A, n (3E nn) for the accumulator and treats `ret`/`ret_void` as HLT; multi-register MOV and real RET via CALL/stack land in A2++."

[lib]
name = "iir_to_intel8008"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
# Pulled in for the simulator's symbolic mnemonic comments / opcode
# constants — we mirror its naming so downstream consumers can decode
# our output by feeding it back into the simulator.
coding-adventures-intel8008-simulator = { path = "../intel8008-simulator" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"
