<svg xmlns="http://www.w3.org/2000/svg" width="662" height="291.8" viewBox="0 0 662 291.8" role="img" aria-label="How to write ಏ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ಏ</title><desc>4 frames; frame N shows movements 1 to N of ಏ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-aee.gif, animation of Kannada independent vowel ಏ, 31 frames, 3.1 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-aee.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಏ in two pen-down runs: the compact left loop flows through the joined lower curves and rounded right side into the tall outer arch; after one lift, a small upper loop is drawn from left to right. The path is fitted to the bundled Noto Sans Kannada outline; handwritten loop width, bowl depth, and the spacing of the upper loop vary, but the one-lift order remains the same.</desc><rect x="0" y="0" width="662" height="291.8" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="185.8" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="185.8" viewBox="-41 -653 861 1066.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M575 -12Q524 -12 492 1Q460 14 438 39.5Q416 65 394 101L425 105Q399 57 369.5 32Q340 7 304.5 -2.5Q269 -12 224 -12Q168 -12 123.5 10Q79 32 54 72Q29 112 29 167Q29 211 47 246.5Q65 282 99 303Q133 324 181 324Q234 324 266 299Q298 274 298 231Q298 215 295 199Q292 183 285 172L217 178Q219 186 221 194.5Q223 203 223 210Q223 232 211 243Q199 254 178 254Q147 254 126.5 232.5Q106 211 106 170Q106 125 137 96Q168 67 232 67Q301 67 333 102Q365 137 370 195