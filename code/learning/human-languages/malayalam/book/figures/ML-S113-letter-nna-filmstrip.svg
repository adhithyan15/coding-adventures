<svg xmlns="http://www.w3.org/2000/svg" width="982" height="219.71" viewBox="0 0 982 219.71" role="img" aria-label="How to write ണ: one unbroken stroke · 6 movements"><title>Writing ണ</title><desc>6 frames; frame N shows movements 1 to N of ണ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ണ in data/NNA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/NNA.png&gt;. Source note on variation: Thooval&apos;s NNA.png starts inside the small loop (green) and circles it clockwise into the big left arch, runs down the first stem to the line (blue turn), climbs it again and arches over to the second stem, down to the line (blue turn) and back up, and sweeps over the right arch to finish at its foot (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ണ as one stroke from the middle left to the lower right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (24 of 34) and end at the lower right (33 of 34). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; each climb back up a stem retraces the ink just drawn.</desc><rect x="0" y="0" width="982