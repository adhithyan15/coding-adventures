<svg xmlns="http://www.w3.org/2000/svg" width="342" height="345.79" viewBox="0 0 342 345.79" role="img" aria-label="How to write 了: 2 strokes · 1 pen lift · 2 movements"><title>Writing 了</title><desc>2 frames; frame N shows movements 1 to N of 了 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 了.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BA%86.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 了. Median 1 begins at the upper left, runs right and turns downward within the same stroke; median 2 restarts under that turn, descends most of the height of the square, and finishes with a leftward hook. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts both medians to Noto Sans SC while preserving their order, the single internal turn, the terminal hook and one intervening lift; Noto&apos;s hook is shorter than the Arphic-derived source graphic&apos;s.</desc><rect x="0" y="0" width="342" height="345.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="214.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.79" viewBox="27 -836 936 1340.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M464 491L543 491L543 17Q543 -20 531.5 -39Q520 -58 490 -68Q461 -76 410 -78Q359 -80 283 -80Q280 -64 271 -42Q262 -20 253 -4Q294 -5 332 -6Q370 -7 397.5 -6.5Q425 -6 436 -5Q453 -5 458.5 0Q464 5 464 18L464 491ZM97 762L819 762L819 688L97 688L97 762ZM797 762L817 762L834 766L893 723Q845 671 782 618Q719 565 650 518.5Q581 472 514 438Q509 446 499.5 456Q490 466 481 475.5Q472 485 464 491Q511 514 558.5 544.5Q606 575 651.5 609.5Q697 644 734.5 678.5Q772 713 797 743L797 762Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M112 724 L112 724" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M112 724 L632 724 L788 712 L732 624 L536 492" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="536" cy="492" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495" y="295" text-anchor="middle" font-size="75" fill="#6b7280"><tspan x="495" y="295">1. draw the upper</tspan><tspan x="495" y="386.5">horizontal and turn</tspan><tspan x="495" y="478">downward</tspan></text></svg><rect x="176" y="42" width="150" height="214.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="214.79" viewBox="27 -836 936 1340.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M464 491L543 491L543 17Q543 -20 531.5 -39Q520 -58 490 -68Q461 -76 410 -78Q359 -80 283 -80Q280 -64 271 -42Q262 -20 253 -4Q294 -5 332 -6Q370 -7 397.5 -6.5Q425 -6 436 -5Q453 -5 458.5 0Q464 5 464 18L464 491ZM97 762L819 762L819 688L97 688L97 762ZM797 762L817 762L834 766L893 723Q845 671 782 618Q719 565 650 518.5Q581 472 514 438Q509 446 499.5 456Q490 466 481 475.5Q472 485 464 491Q511 514 558.5 544.5Q606 575 651.5 609.5Q697 644 734.5 678.5Q772 713 797 743L797 762Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M112 724 L632 724 L788 712 L732 624 L536 492" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M516 480 L516 480" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M516 480 L500 160 L500 -44 L420 -60 L300 -48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="300" cy="-48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495" y="295" text-anchor="middle" font-size="75" fill="#6b7280"><tspan x="495" y="295">2. lift, then draw the</tspan><tspan x="495" y="386.5">long vertical and finish</tspan><tspan x="495" y="478">with a left hook</tspan></text></svg><text x="16" y="269.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 了.json, ordered stroke</text><text x="16" y="282.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="294.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="307.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="319.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
