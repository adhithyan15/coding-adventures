          bundler-cache: false

      - name: Run every D18T manifest consumer and verify regeneration
        run: python3 code/scripts/validate_d18t_durable_epoch_activation_conformance.py

  # ── Job 7: Ruby compiled-grammar regeneration check ─────────────
  #
  # Ruby lexer/parser packages ship a pre-compiled _grammar.rb (grammar
  # data baked into native Ruby structures) instead of parsing the raw
  # .tokens/.grammar text at runtime. That _grammar.rb is generated code,
  # hand-committed alongside its source -- nothing enforced that the two
  # stayed in sync, and they drifted apart more than once (see
  # coding_adventures_ruby_parser's CHANGELOG). This job regenerates every
  # Ruby _grammar.rb from the current .tokens/.grammar source and fails if
  # that produces any diff, so a grammar-source change without the
  # matching regenerated output can't merge silently. Ruby-only regen
  # needs no Go/Rust/Python/Node toolchain (see generator.rb#run_ruby_only).
  ruby-grammar-regen-check:
    name: Ruby compiled-grammar regeneration check
    needs: detect
    if: needs.detect.outputs.run_ruby_grammar_regen_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Regenerate every Ruby _grammar.rb from current .tokens/.grammar source
        run: |
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 ruby -E UTF-8 \
            code/programs/ruby/grammar-tools/main.rb generate-compiled-grammars --lane ruby

      - name: Fail if regeneration produced any diff
        run: |
          if ! git diff --quiet -- code/packages/ruby; then
            echo "::error::Regenerating Ruby's compiled grammars (grammar-tools generate-compiled-grammars --lane ruby) produced changes that are not committed."
            echo "A .tokens/.grammar source file changed without regenerating the downstream _grammar.rb file(s) that embed it."
            echo
            git diff --stat -- code/packages/ruby
            echo
            echo "Run 'code/scripts/generate-compiled-grammars.sh --lane ruby' locally and commit the result."
            exit 1
          fi
          echo "All Ruby compiled grammars are up to date."

  # ── Job 7b: Mosaic compiled-grammar regeneration check ──────────
  #
  # The three Mosaic language compilers (mosmodel, moslayout, mosstyle) keep
  # BOTH their token grammar and their parser grammar in one src/_grammar.rs.
  # They are `*-compiler` crates, so the `*-lexer` / `*-parser` sweep never
  # covered them: of 88 _grammar.rs files in the repository those three were
  # the only ones nothing could regenerate. Their sources drifted unnoticed for
  # months, and one drift -- mosmodel's slot_type alternation order -- would
  # have broken all 72 `list<>` slot declarations the moment anyone regenerated
  # (#14067). This job regenerates them from source and fails on any diff.
  #
  # Deliberately scoped to these three rather than sweeping every Rust grammar:
  # 33 other committed _grammar.rs files currently differ from their sources,
  # so a repo-wide check would fail on main from the first run. That backlog is
  # tracked in #14202; this gate protects what is already correct.
  mosaic-grammar-regen-check:
    name: Mosaic compiled-grammar regeneration check
    needs: detect
    if: needs.detect.outputs.run_mosaic_grammar_regen_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build grammar-tools
        run: cargo build --release --manifest-path code/programs/rust/grammar-tools/Cargo.toml

      - name: Regenerate the Mosaic compilers' _grammar.rs from current source
        run: |
          GT=code/programs/rust/grammar-tools/target/release/grammar-tools
          for stem in mosmodel moslayout mosstyle; do
            "$GT" generate-rust-compiled-grammars "$stem"
          done

      - name: Fail if regeneration produced any diff
        run: |
          if ! git diff --quiet -- code/packages/rust/mosmodel-compiler code/packages/rust/moslayout-compiler code/packages/rust/mosstyle-compiler; then
            echo "::error::Regenerating the Mosaic compiled grammars produced changes that are not committed."
            echo "A .tokens/.grammar source changed without regenerating the _grammar.rs that embeds it."
            echo
            git diff --stat -- code/packages/rust/mosmodel-compiler code/packages/rust/moslayout-compiler code/packages/rust/mosstyle-compiler
            echo
            echo "Run this locally and commit the result:"
            echo "  for s in mosmodel moslayout mosstyle; do grammar-tools generate-rust-compiled-grammars \$s; done"
            exit 1
          fi
          echo "All Mosaic compiled grammars are up to date."

  # ── Job 7c: reconciled Rust compiled-grammar regeneration ──────
  #
  # MacroOct and Nib are the first reconciled Rust grammar lanes. Protect them
  # without running the still-drifting full Rust sweep tracked by #14202. Keep
  # widening this job only after each additional lane has been reconciled.
  rust-grammar-regen-check:
    name: Reconciled Rust compiled-grammar regeneration check
    needs: detect
    if: needs.detect.outputs.run_rust_grammar_regen_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build grammar-tools
        run: cargo build --release --manifest-path code/programs/rust/grammar-tools/Cargo.toml

      - name: Regenerate the reconciled Rust grammar lanes
        run: |
          GT=code/programs/rust/grammar-tools/target/release/grammar-tools
          for stem in macrooct nib; do
            "$GT" generate-rust-compiled-grammars "$stem"
          done

      - name: Fail if generated tables differ from committed files
        run: |
          paths=(
            code/packages/rust/macrooct-lexer/src/_grammar.rs
            code/packages/rust/nib-lexer/src/_grammar.rs
            code/packages/rust/nib-parser/src/_grammar.rs
          )
          if ! git diff --quiet -- "${paths[@]}"; then
            echo "::error::A reconciled Rust compiled grammar differs from its canonical source."
            git diff --stat -- "${paths[@]}"
            echo "Regenerate with: for s in macrooct nib; do grammar-tools generate-rust-compiled-grammars \$s; done"
            exit 1
          fi
          echo "All reconciled Rust compiled grammars are up to date."

  # ── Job 8: Unicode 17 generated Elixir conformance ─────────────
  unicode17-elixir-conformance:
    name: Unicode 17 generated Elixir conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_elixir_conformance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Verify generated Elixir against every official Unicode 17 vector
        run: >-
          python3 code/scripts/generate_tracked_artifact_unicode17.py
          --check
          --self-check-runtime elixir

  # ── Job 9: Unicode 17 generated Lua conformance ────────────────
  unicode17-lua-conformance:
    name: Unicode 17 generated Lua conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_lua_conformance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Lua build prerequisites
        run: sudo apt-get install -qy libreadline-dev libncurses-dev

      - name: Install pinned Lua 5.4.7 from verified mirrors
        run: python3 code/scripts/setup_lua.py --prefix .lua

      - name: Activate and verify pinned Lua 5.4.7
        run: |
          echo "$GITHUB_WORKSPACE/.lua/bin" >> "$GITHUB_PATH"
          .lua/bin/lua -v

      - name: Verify generated Lua against every official Unicode 17 vector
        run: >-
          python3 code/scripts/generate_tracked_artifact_unicode17.py
          --check
          --self-check-runtime lua
          --lua-executable .lua/bin/lua

  # ── Job 10: Unicode 17 generated Perl conformance ──────────────
  unicode17-perl-conformance:
    name: Unicode 17 generated Perl conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_perl_conformance == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify reviewed Perl 5.38.2 runtime
        run: |
          test "$(command -v perl)" = "/usr/bin/perl"
          test "$(perl -e 'printf "%vd", $^V')" = "5.38.2"

      - name: Verify generated Perl against every official Unicode 17 vector
        run: >-
          python3 code/scripts/generate_tracked_artifact_unicode17.py
          --check
          --self-check-runtime perl
          --perl-executable /usr/bin/perl

  # ── Job 11: Unicode 17 generated Haskell conformance ───────────
  unicode17-haskell-conformance:
    name: Unicode 17 generated Haskell conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_haskell_conformance == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Haskell toolchain
        id: haskell
        uses: haskell-actions/setup@bda9c527d4136f7759733016190c34a24c84f4f4 # v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.3.0'
          cabal-update: false

      - name: Verify generated Haskell against every official Unicode 17 vector
        shell: bash
        run: |
          ghc_executable='${{ steps.haskell.outputs.ghc-exe }}'
          runghc_executable='${{ steps.haskell.outputs.ghc-path }}/runghc'
          test -x "$ghc_executable"
          test -x "$runghc_executable"
          test "$("$ghc_executable" --numeric-version)" = "9.4.8"
          test "$("$runghc_executable" --version)" = "runghc 9.4.8"
          python3 code/scripts/generate_tracked_artifact_unicode17.py \
            --check \
            --self-check-runtime haskell \
            --runghc-executable "$runghc_executable" \
            --ghc-executable "$ghc_executable"

  # ── Job 12: Unicode 17 generated Swift conformance ─────────────
  unicode17-swift-conformance:
    name: Unicode 17 generated Swift conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_swift_conformance == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The conformance check below requires exactly Swift 6.3.3. It used to
      # rely on the Swift that GitHub preinstalls on ubuntu-24.04, so every
      # runner-image update could swap the toolchain underneath it: image
      # 20260920.314.1 did, and the job failed on every PR that ran it. Install
      # the pinned release instead. The SHA-256 is of the official swift.org
      # tarball, whose signature was checked against the Swift 6.x Release
      # Signing Key (EF80A866B47A981F) when the pin was recorded; bump both
      # together.
      - name: Install Swift 6.3.3 (pinned)
        shell: bash
        env:
          SWIFT_URL: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          SWIFT_SHA256: da8272a5fddccd65b1529ed0e52e04526e2eadd4237d58d6220efeb973c6cd19
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/swift-6.3.3.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$SWIFT_URL"
          echo "$SWIFT_SHA256  $archive" | sha256sum --check --strict
          toolchain="$RUNNER_TEMP/swift-6.3.3"
          mkdir -p "$toolchain"
          tar -xzf "$archive" -C "$toolchain" --strip-components=1
          rm -f "$archive"
          # GITHUB_PATH prepends, so later steps resolve this swift first.
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Verify generated Swift against every official Unicode 17 vector
        shell: bash
        run: |
          # The Swift driver dispatches by argv[0], so retain these entrypoint names.
          swift_executable="$(command -v swift)"
          swiftc_executable="$(command -v swiftc)"
          test -x "$swift_executable"
          test -x "$swiftc_executable"
          test "$("$swift_executable" --version | sed -n '1p')" = "Swift version 6.3.3 (swift-6.3.3-RELEASE)"
          test "$("$swiftc_executable" --version | sed -n '1p')" = "Swift version 6.3.3 (swift-6.3.3-RELEASE)"
          python3 code/scripts/generate_tracked_artifact_unicode17.py \
            --check \
            --self-check-runtime swift \
            --swift-executable "$swift_executable" \
            --swiftc-executable "$swiftc_executable"

  # ── Job 13: Unicode 17 generated Dart conformance ──────────────
  unicode17-dart-conformance:
    name: Unicode 17 generated Dart conformance
    needs: detect
    if: needs.detect.outputs.run_unicode17_dart_conformance == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Dart toolchain
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      - name: Verify generated Dart against every official Unicode 17 vector
        shell: bash
        run: |
          dart_executable="$(command -v dart)"
          test -x "$dart_executable"
          test "$("$dart_executable" --version 2>&1 | sed -n '1p')" = "Dart SDK version: 3.12.2 (stable) (Tue Jun 9 01:11:39 2026 -0700) on \"linux_x64\""
          python3 code/scripts/generate_tracked_artifact_unicode17.py \
            --check \
            --self-check-runtime dart \
            --dart-executable "$dart_executable"

  # ── UI87 §7.7: the Flutter platform library off Linux x64 ──────
  #
  # The Flutter lane runs the platform library's headless harness on Linux
  # x64 only. The open(2) flag tables for macOS and Linux arm64, the macOS
  # lstat layout and the Windows save (CreateFileW, FlushFileBuffers,
  # MoveFileExW) are pinned by tests there but never ran. This runs the same
  # harness -- through tests/flutter_platform_effects.rs, which copies the
  # library exactly as a generated project gets it -- on a Mac (arm64), on
  # Windows and on Linux arm64. MOSAIC_REQUIRE_DART makes a runner without
  # Dart a failure rather than a skip.
  mosaic-flutter-platform-library:
    name: Flutter platform library (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Dart toolchain
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run the platform library's headless harness
        shell: bash
        env:
          MOSAIC_REQUIRE_DART: '1'
        run: |
          cargo test --manifest-path code/packages/rust/mosaic-app-bindings/Cargo.toml \
            --test flutter_platform_effects -- --nocapture

  # ── Job 14: Forme supported-platform release gate ─────────────
  #
  # Pull requests are authoritative. Every supported host runs the same API,
  # product, benchmark, browser, and reviewed-source contract; main repeats it
  # after the squash. Branch pushes deliberately skip this expensive duplicate.
  forme-release-platform:
    name: Forme release (${{ matrix.host }})
    needs: detect
    if: needs.detect.outputs.run_forme_release_platform == 'true' && (github.event_name == 'pull_request' || needs.detect.outputs.is_main == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            code/sites/blog/package-lock.json
            code/sites/landing-page/package-lock.json
            code/programs/typescript/forme-shell-desktop/package-lock.json

      - name: Set up Rust for the native macOS product
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # rust-toolchain action
        with:
          toolchain: '1.95.0'

      - name: Set up MSVC for the native Windows product
        if: runner.os == 'Windows'
        shell: pwsh
        run: python code/scripts/setup_msvc_dev_cmd.py --arch x64

      - name: Install reviewed Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 154.0.8037.92
          install-dependencies: true

      - name: Grant pinned Chrome read/execute to Windows AppContainers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $chrome = Get-Item -LiteralPath $env:CHROME_PATH -ErrorAction Stop
          if (-not $chrome.PSIsContainer -and $chrome.Name -ceq 'chrome.exe') {
            $chromePath = [IO.Path]::GetFullPath($chrome.FullName)
          } else {
            throw 'reviewed Windows Chrome output is not chrome.exe'
          }
          $toolCache = [IO.Path]::GetFullPath($env:RUNNER_TOOL_CACHE).TrimEnd('\') + '\'
          if (-not $chromePath.StartsWith($toolCache, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'reviewed Windows Chrome is outside RUNNER_TOOL_CACHE'
          }
          $browserRoot = $chrome.Directory.FullName

          function Get-OpaqueFileId {
            param([string] $Path)
            $fileId = (& fsutil.exe file queryfileid $Path 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($fileId)) {
              throw "could not bind Windows Chrome file identity: $Path"
            }
            return $fileId
          }
          function Get-AncestorSnapshot {
            param([string] $Root, [string] $TrustedRoot)
            $snapshot = @{}
            $cursor = Get-Item -LiteralPath $Root -Force -ErrorAction Stop
            while ($true) {
              if (($cursor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "reviewed Windows Chrome ancestor is a reparse point: $($cursor.FullName)"
              }
              $snapshot[$cursor.FullName] = Get-OpaqueFileId $cursor.FullName
              if ($cursor.FullName.TrimEnd('\') -ieq $TrustedRoot.TrimEnd('\')) { break }
              if ($null -eq $cursor.Parent) {
                throw 'reviewed Windows Chrome ancestry escaped RUNNER_TOOL_CACHE'
              }
              $cursor = Get-Item -LiteralPath $cursor.Parent.FullName -Force -ErrorAction Stop
            }
            return $snapshot
          }

          function Get-BrowserTree {
            param([string] $Root)
            $rootItem = Get-Item -LiteralPath $Root -Force -ErrorAction Stop
            $children = @(Get-ChildItem -LiteralPath $Root -Force -Recurse -ErrorAction Stop)
            return @($rootItem) + $children
          }
          function Get-TreeSnapshot {
            param([System.IO.FileSystemInfo[]] $Entries)
            $snapshot = @{}
            foreach ($entry in $Entries) {
              if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "reviewed Windows Chrome tree contains a reparse point: $($entry.FullName)"
              }
              $fileId = Get-OpaqueFileId $entry.FullName
              if (-not $entry.PSIsContainer) {
                $rawLinks = @(& fsutil.exe hardlink list $entry.FullName 2>&1)
                if ($LASTEXITCODE -ne 0) {
                  throw "could not enumerate Windows Chrome hardlinks: $($entry.FullName)"
                }
                $renderedLinks = ($rawLinks | Out-String)
                $links = @($rawLinks | ForEach-Object { ([string]$_).Trim() } |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
                if ($renderedLinks.Length -gt 32768 -or $links.Count -ne 1) {
                  throw "Windows Chrome file has an unexpected hardlink identity: $($entry.FullName)"
                }
                $listed = $links[0]
                if ($listed -match '[\x00-\x1f]' -or -not $listed.StartsWith('\')) {
                  throw "Windows Chrome file has an unexpected hardlink identity: $($entry.FullName)"
                }
                $listedPath = [IO.Path]::GetFullPath(
                  [IO.Path]::Combine([IO.Path]::GetPathRoot($entry.FullName), $listed.TrimStart('\'))
                )
                if ($listedPath -ine $entry.FullName) {
                  throw "Windows Chrome file has an unexpected hardlink identity: $($entry.FullName)"
                }
              }
              $length = if ($entry.PSIsContainer) { '-' } else { [string]$entry.Length }
              $snapshot[$entry.FullName] = "$fileId|$($entry.PSIsContainer)|$length"
            }
            return $snapshot
          }

          $ancestorBefore = Get-AncestorSnapshot $browserRoot $toolCache
          $before = Get-TreeSnapshot (Get-BrowserTree $browserRoot)
          & icacls.exe $browserRoot /remove:g '*S-1-15-2-1' /T /Q
          if ($LASTEXITCODE -ne 0) { throw "icacls removal failed with exit code $LASTEXITCODE" }
          & icacls.exe $browserRoot /grant:r '*S-1-15-2-1:RX' /Q
          if ($LASTEXITCODE -ne 0) { throw "root icacls failed with exit code $LASTEXITCODE" }
          & icacls.exe $browserRoot /grant '*S-1-15-2-1:(OI)(CI)RX' /T /Q
          if ($LASTEXITCODE -ne 0) { throw "tree icacls failed with exit code $LASTEXITCODE" }

          $afterEntries = Get-BrowserTree $browserRoot
          $after = Get-TreeSnapshot $afterEntries
          if ($before.Count -ne $after.Count) {
            throw 'Windows Chrome tree identity changed during ACL preparation'
          }
          foreach ($name in $before.Keys) {
            if (-not $after.ContainsKey($name) -or $before[$name] -cne $after[$name]) {
              throw 'Windows Chrome tree identity changed during ACL preparation'
            }
          }

          $appPackages = 'S-1-15-2-1'
          $requiredMask = [int][Security.AccessControl.FileSystemRights]::ReadAndExecute
          $allowedMask = $requiredMask -bor [int][Security.AccessControl.FileSystemRights]::Synchronize
          function Assert-ReviewedAppContainerAcl {
            param(
              [Security.AccessControl.RawSecurityDescriptor] $Descriptor,
              [string] $Label
            )
            $combined = 0
            foreach ($rule in $Descriptor.DiscretionaryAcl) {
              if (
                $rule.GetType() -ne [Security.AccessControl.CommonAce] -or
                $rule.IsCallback
              ) {
                throw "unexpected Windows Chrome AppContainer ACE form: $Label"
              }
              if ($rule.SecurityIdentifier.Value -ne $appPackages) { continue }
              $isEffective = ($rule.AceFlags -band [Security.AccessControl.AceFlags]::InheritOnly) -eq 0
              if ($rule.AceQualifier -eq [Security.AccessControl.AceQualifier]::AccessDenied) {
                if ($isEffective -and $rule.AccessMask -ne 0) {
                  throw "effective Windows Chrome AppContainer deny ACE: $Label"
                }
                continue
              }
              if ($rule.AceQualifier -ne [Security.AccessControl.AceQualifier]::AccessAllowed) {
                throw "unexpected Windows Chrome AppContainer ACE qualifier: $Label"
              }
              if (($rule.AccessMask -band (-bnot $allowedMask)) -ne 0) {
                throw "unexpected Windows Chrome AppContainer rights: $Label"
              }
              if ($isEffective) {
                $combined = $combined -bor $rule.AccessMask
              }
            }
            if (($combined -band $requiredMask) -ne $requiredMask) {
              throw "Windows Chrome AppContainer ACL lacks read/execute: $Label"
            }
          }

          function Assert-AclSelfTestFailure {
            param([string] $Sddl, [string] $Expected)
            try {
              Assert-ReviewedAppContainerAcl (
                [Security.AccessControl.RawSecurityDescriptor]::new($Sddl)
              ) 'self-test'
            } catch {
              if ($_.Exception.Message.Contains($Expected)) { return }
              throw
            }
            throw "Windows Chrome ACL self-test failed open: $Expected"
          }
          Assert-AclSelfTestFailure `
            'D:(A;OICIIO;0x1200a9;;;S-1-15-2-1)' `
            'lacks read/execute'
          Assert-ReviewedAppContainerAcl (
            [Security.AccessControl.RawSecurityDescriptor]::new(
              'D:(A;ID;0x1200a9;;;S-1-15-2-1)'
            )
          ) 'inherited-effective self-test'
          Assert-AclSelfTestFailure `
            'D:(A;;GA;;;S-1-15-2-1)' `
            'unexpected Windows Chrome AppContainer rights'

          $appPackagesSid = [Security.Principal.SecurityIdentifier]::new($appPackages)
          $callbackAcl = [Security.AccessControl.RawAcl]::new(2, 1)
          $callbackAcl.InsertAce(0, [Security.AccessControl.CommonAce]::new(
            [Security.AccessControl.AceFlags]::None,
            [Security.AccessControl.AceQualifier]::AccessAllowed,
            $allowedMask,
            $appPackagesSid,
            $true,
            [byte[]]@(0, 0, 0, 0)
          ))
          $callbackDescriptor = [Security.AccessControl.RawSecurityDescriptor]::new(
            [Security.AccessControl.ControlFlags]::DiscretionaryAclPresent,
            $null,
            $null,
            $null,
            $callbackAcl
          )
          try {
            Assert-ReviewedAppContainerAcl $callbackDescriptor 'callback self-test'
            throw 'Windows Chrome ACL self-test failed open: callback'
          } catch {
            if (-not $_.Exception.Message.Contains('unexpected Windows Chrome AppContainer ACE form')) {
              throw
            }
          }

          $compoundAcl = [Security.AccessControl.RawAcl]::new(2, 1)
          $compoundAcl.InsertAce(0, [Security.AccessControl.CompoundAce]::new(
            [Security.AccessControl.AceFlags]::None,
            $allowedMask,
            [Security.AccessControl.CompoundAceType]::Impersonation,
            $appPackagesSid
          ))
          $compoundDescriptor = [Security.AccessControl.RawSecurityDescriptor]::new(
            [Security.AccessControl.ControlFlags]::DiscretionaryAclPresent,
            $null,
            $null,
            $null,
            $compoundAcl
          )
          try {
            Assert-ReviewedAppContainerAcl $compoundDescriptor 'compound self-test'
            throw 'Windows Chrome ACL self-test failed open: compound'
          } catch {
            if (-not $_.Exception.Message.Contains('unexpected Windows Chrome AppContainer ACE form')) {
              throw
            }
          }

          $objectAcl = [Security.AccessControl.RawAcl]::new(4, 1)
          $objectAcl.InsertAce(0, [Security.AccessControl.ObjectAce]::new(
            [Security.AccessControl.AceFlags]::None,
            [Security.AccessControl.AceQualifier]::AccessAllowed,
            $allowedMask,
            $appPackagesSid,
            [Security.AccessControl.ObjectAceFlags]::ObjectAceTypePresent,
            [Guid]::NewGuid(),
            [Guid]::Empty,
            $false,
            $null
          ))
          $objectDescriptor = [Security.AccessControl.RawSecurityDescriptor]::new(
            [Security.AccessControl.ControlFlags]::DiscretionaryAclPresent,
            $null,
            $null,
            $null,
            $objectAcl
          )
          try {
            Assert-ReviewedAppContainerAcl $objectDescriptor 'object self-test'
            throw 'Windows Chrome ACL self-test failed open: object'
          } catch {
            if (-not $_.Exception.Message.Contains('unexpected Windows Chrome AppContainer ACE form')) {
              throw
            }
          }

          foreach ($entry in $afterEntries) {
            $acl = Get-Acl -LiteralPath $entry.FullName -ErrorAction Stop
            $descriptorBytes = $acl.GetSecurityDescriptorBinaryForm()
            $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new($descriptorBytes, 0)
            Assert-ReviewedAppContainerAcl $descriptor $entry.FullName
          }

          $final = Get-TreeSnapshot (Get-BrowserTree $browserRoot)
          if ($before.Count -ne $final.Count) {
            throw 'Windows Chrome tree identity changed during ACL preparation'
          }
          foreach ($name in $before.Keys) {
            if (-not $final.ContainsKey($name) -or $before[$name] -cne $final[$name]) {
              throw 'Windows Chrome tree identity changed during ACL preparation'
            }
          }
          $ancestorAfter = Get-AncestorSnapshot $browserRoot $toolCache
          if ($ancestorBefore.Count -ne $ancestorAfter.Count) {
            throw 'Windows Chrome ancestor identity changed during ACL preparation'
          }
          foreach ($name in $ancestorBefore.Keys) {
            if (
              -not $ancestorAfter.ContainsKey($name) -or
              $ancestorBefore[$name] -cne $ancestorAfter[$name]
            ) {
              throw 'Windows Chrome ancestor identity changed during ACL preparation'
            }
          }

      - name: Install the reviewed Chrome SUID sandbox
        if: runner.os == 'Linux'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FORME_CHROME_SANDBOX_SHA256: 24beb85e4149c65db5bf40fa307721143d0883ab8952e60dde1158606f644dee
        run: |
          sandbox_source="$(dirname "$CHROME_PATH")/chrome_sandbox"
          sandbox_target=/usr/local/sbin/forme-chrome-sandbox
          test -f "$sandbox_source"
          test ! -L "$sandbox_source"
          test "$(stat -c '%F %h' "$sandbox_source")" = "regular file 1"
          test "$(sha256sum "$sandbox_source" | cut -d ' ' -f 1)" = \
            "$FORME_CHROME_SANDBOX_SHA256"
          sudo install -o root -g root -m 0755 "$sandbox_source" "$sandbox_target"
          test -f "$sandbox_target"
          test ! -L "$sandbox_target"
          test "$(stat -c '%F %h %U:%G %a' "$sandbox_target")" = \
            "regular file 1 root:root 755"
          test "$(sha256sum "$sandbox_target" | cut -d ' ' -f 1)" = \
            "$FORME_CHROME_SANDBOX_SHA256"
          sudo chmod 4755 "$sandbox_target"
          test "$(stat -c '%F %h %U:%G %a' "$sandbox_target")" = \
            "regular file 1 root:root 4755"
          test "$(sha256sum "$sandbox_target" | cut -d ' ' -f 1)" = \
            "$FORME_CHROME_SANDBOX_SHA256"

      - name: Verify package and kernel API compatibility
        run: python -m unittest discover -s code/scripts/tests -p 'test_forme_spec_map.py'

      - name: Build and test every Forme product
        run: python code/scripts/forme_release_gate.py build-products --host ${{ matrix.host }}

      - name: Enforce browser and static-fallback budgets
        shell: bash
        working-directory: code/sites/blog
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: ${{ runner.os == 'Linux' && '/usr/local/sbin/forme-chrome-sandbox' || '' }}
          FORME_EXPECTED_CHROME_VERSION: 154.0.8037.92
          FORME_INSTALLED_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
        run: npm run quality:release

      - name: Emit reviewed host attestation
        run: >-
          python code/scripts/forme_release_gate.py attest
          --host ${{ matrix.host }}
          --commit ${{ github.sha }}
          --benchmark code/sites/blog/dist/.forme-release-benchmark.json
          --web-quality code/sites/blog/dist/.forme-web-quality.json
          --output .forme-release-evidence/forme-release-${{ matrix.host }}.json

      - name: Publish bounded Forme release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forme-release-${{ matrix.host }}
          path: .forme-release-evidence/forme-release-${{ matrix.host }}.json
          if-no-files-found: ignore
          retention-days: 7

  forme-release-verdict:
    name: Forme release verdict
    needs: [detect, forme-release-platform]
    if: always() && needs.detect.outputs.run_forme_release_platform == 'true' && (github.event_name == 'pull_request' || needs.detect.outputs.is_main == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every supported host
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs['forme-release-platform'].result }}
        run: test "$PLATFORM_RESULT" = success

      - name: Download host attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forme-release-*
          path: .forme-release-evidence

      - name: Compose one release verdict
        run: >-
          python code/scripts/forme_release_gate.py verdict
          --evidence-dir .forme-release-evidence
          --output forme-release-verdict.json

      - name: Publish the Forme release verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forme-release-verdict
          path: forme-release-verdict.json
          if-no-files-found: error
          retention-days: 30

  # ── Job 15: Build and test ─────────────────────────────────────
  #
  # Installs only the toolchains flagged by the detect job, then
  # compiles the build tool and runs the incremental build.
  build:
    needs: detect
    name: build (${{ matrix.label }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Language toolchains (conditional) ───────────────────────
      #
      # Go is always installed — the build tool is written in Go.
      # Other toolchains are installed only if their language has
      # affected packages, as determined by the detect job.

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'code/**/go.sum'

      - name: Set up Python
        if: needs.detect.outputs.needs_python == 'true' || runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Test ADJ Windows Job containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest discover -s code/scripts/tests -p test_adj_stdlib_provenance.py -k windows_job -k process_tree -k windows_containment -k job_close_root -k raw_pipe_close -k stuck_stdout -k stuck_drain

      - name: Test ADJ macOS strict-containment boundary
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s code/scripts/tests -p test_adj_stdlib_provenance.py -k posix_process -k process_tree -k guardian -k drain -k raw_pipe_close

      - name: Install uv
        if: needs.detect.outputs.needs_python == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          cache-dependency-glob: 'code/**/pyproject.toml'

      # ── Lua must be set up BEFORE Ruby on Windows ──────────────
      #
      # Ruby's MSYS2 ships its own `link.exe` which shadows the MSVC
      # linker that Lua needs to compile. By installing MSVC + Lua
      # first, the MSVC `link.exe` is in PATH before Ruby's MSYS2.

      # MSVC supplies the linker and SDK libraries for LANG and Venture, Lua,
      # and the C/C++ lane (`cl.exe` for the MSVC arm of the pure-ISO check).
      # A single bootstrap invocation covers these consumers — invoking it twice would
      # double-prepend the MSVC environment.
      - name: Test MSVC environment bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest discover -s code/scripts/tests -p 'test_setup_msvc_dev_cmd.py'

      - name: Set up MSVC (Lua + C/C++ + Venture + LANG)
        if: (needs.detect.outputs.needs_lua == 'true' || needs.detect.outputs.needs_cpp == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_lang_windows == 'true' || needs.detect.outputs.run_build_windows_os_suites == 'true') && runner.os == 'Windows'
        shell: pwsh
        run: python code/scripts/setup_msvc_dev_cmd.py --arch x64

      - name: Restore pinned Lua 5.4.7 cache
        id: lua-cache
        if: needs.detect.outputs.needs_lua == 'true'
        uses: actions/cache@v6
        with:
          path: .lua
          key: lua-5.4.7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('code/scripts/setup_lua.py') }}

      - name: Install pinned Lua 5.4.7 from verified mirrors
        if: needs.detect.outputs.needs_lua == 'true' && steps.lua-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python code/scripts/setup_lua.py --prefix .lua
          else
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install readline ncurses
            else
              sudo apt-get install -qy libreadline-dev libncurses-dev
            fi
            python3 code/scripts/setup_lua.py --prefix .lua
          fi

      - name: Activate and verify pinned Lua 5.4.7
        if: needs.detect.outputs.needs_lua == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            lua_bin="$(cygpath -u "$GITHUB_WORKSPACE")/.lua/bin"
            cygpath -w "$lua_bin" >> "$GITHUB_PATH"
            "$lua_bin/lua.exe" -v
          else
            lua_bin="$GITHUB_WORKSPACE/.lua/bin"
            echo "$lua_bin" >> "$GITHUB_PATH"
            "$lua_bin/lua" -v
          fi

      - name: Set up LuaRocks (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4.3.0

      - name: Set up LuaRocks (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          curl -L -o luarocks.zip https://luarocks.github.io/luarocks/releases/luarocks-3.11.1-windows-64.zip
          powershell -Command "Expand-Archive -Path luarocks.zip -DestinationPath luarocks-install"
          cd luarocks-install\luarocks-3.11.1-windows-64
          echo %CD%>> %GITHUB_PATH%

      - name: Install Lua test tools (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -L --fail https://luarocks.org/manifests/hoelzro/lua-term-0.8-1.rockspec -o "$tmpdir/lua-term-0.8-1.rockspec"
          sed -i.bak 's|archive/0\.08\.tar\.gz|archive/refs/tags/0.08.tar.gz|' "$tmpdir/lua-term-0.8-1.rockspec"
          luarocks install "$tmpdir/lua-term-0.8-1.rockspec"
          rm -rf "$tmpdir"
          luarocks install busted
          luarocks install dkjson
          luarocks install libdeflate 1.0.2-1
          luarocks install luacov
          luarocks install luacheck
          luarocks install luasocket 2>/dev/null || true

      - name: Install Lua test tools (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          luarocks install busted
          luarocks install dkjson
          luarocks install libdeflate 1.0.2-1
          luarocks install luacov
          luarocks install luacheck
          for /f "delims=" %%i in ('luarocks path --lr-bin') do echo %%i>> %GITHUB_PATH%

      - name: Set up Ruby
        if: needs.detect.outputs.needs_ruby == 'true'
        id: setup-ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install bundler
        if: needs.detect.outputs.needs_ruby == 'true'
        shell: bash
        run: gem install bundler

      - name: Set up Node.js
        if: needs.detect.outputs.needs_typescript == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # npm 10.9.8 crashes in Arborist while resolving Vitest peer dependencies
      # ("Cannot read properties of null (reading 'edgesOut')").
      # Keep the independently validated installer fixed across all build OSes.
      - name: Set up npm
        if: needs.detect.outputs.needs_typescript == 'true'
        run: npm install --global npm@11.13.0

      - name: Delegate Forme sandbox cgroup v2 root
        if: runner.os == 'Linux' && needs.detect.outputs.run_build_linux_os_suites == 'true'
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo mkdir -p \
            /sys/fs/cgroup/forme-sandbox \
            /sys/fs/cgroup/forme-sandbox/runner
          sudo chown "$(id -u):$(id -g)" \
            /sys/fs/cgroup/forme-sandbox \
            /sys/fs/cgroup/forme-sandbox/cgroup.procs \
            /sys/fs/cgroup/forme-sandbox/cgroup.threads \
            /sys/fs/cgroup/forme-sandbox/cgroup.subtree_control \
            /sys/fs/cgroup/forme-sandbox/runner \
            /sys/fs/cgroup/forme-sandbox/runner/cgroup.procs \
            /sys/fs/cgroup/forme-sandbox/runner/cgroup.threads
          test -w /sys/fs/cgroup/forme-sandbox
          test -w /sys/fs/cgroup/forme-sandbox/cgroup.procs
          test -w /sys/fs/cgroup/forme-sandbox/cgroup.subtree_control
          for controller in cpu memory pids; do
            grep -qw "$controller" /sys/fs/cgroup/forme-sandbox/cgroup.controllers
            echo "+$controller" >> /sys/fs/cgroup/forme-sandbox/cgroup.subtree_control
          done

      # ── C/C++ compilers (pure-ISO multi-compiler lane) ──────────
      #
      # The goal is that every pure-ISO C/C++ package compiles under GCC, Clang
      # (LLVM), and MSVC across the 3-OS matrix. Each runner contributes the
      # compilers only it can host:
      #   • ubuntu  → GCC (g++/gcc, preinstalled) + Clang (installed below)
      #   • windows → MSVC (cl.exe, via the msvc-dev-cmd step above)
      #   • macOS   → Apple Clang (preinstalled)
      # A real GCC exists only on Linux and real MSVC only on Windows, so no
      # single machine can host all three — coverage is achieved across the
      # matrix, and the ISO harness compiles with every compiler it finds.
      - name: Install Clang alongside GCC (Linux C/C++)
        if: needs.detect.outputs.needs_cpp == 'true' && runner.os == 'Linux'
        run: |
          bash code/scripts/ci/apt-install.sh clang
          gcc --version | head -1
          clang --version | head -1

      - name: Set up Rust
        if: needs.detect.outputs.needs_rust == 'true' || needs.detect.outputs.needs_lang_windows == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_xaml_windows == 'true' || needs.detect.outputs.needs_mosaic_swift_runtime == 'true' || needs.detect.outputs.needs_mosaic_qt_runtime == 'true' || needs.detect.outputs.needs_mosaic_flutter_runtime == 'true' || needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        # Uses the `stable` channel (matching the rest of this repo's Rust CI).
        # NOTE on the -clippy gate: clippy adds/tightens lints on each stable
        # release, so a new Rust release can surface new lints on `main` — treat
        # that as normal maintenance (run `cargo clippy --fix` + resolve). Pinning
        # to a specific version was tried but broke BUILDs that invoke
        # `rustup run stable` / `rustup target add` (wasm + embedded firmware),
        # because a version-pinned default toolchain is not the `stable` alias
        # those scripts expect. Reproduce CI's clippy locally with the *current*
        # stable (`rustup update stable`), not a stale cached toolchain.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # dtolnay/rust-toolchain installs the minimal profile, which omits
          # clippy; the -clippy gate needs it, so request it explicitly.
          #
          # llvm-tools is required for the same reason. The chief-of-staff
          # approval adapters measure coverage with `cargo tarpaulin --engine
          # llvm` (their integration tests re-exec their own binary, which
          # tarpaulin's default ptrace engine cannot instrument without raising
          # SIGILL). That engine shells out to `llvm-profdata` and `llvm-cov`
          # from the toolchain's sysroot, and the minimal profile ships
          # neither. Declared here rather than left to chance: a developer
          # machine usually has the component installed already, so omitting it
          # fails only on CI.
          components: clippy,llvm-tools

      - name: Install native Paint VM dependencies
        # needs_mosaic_qt_runtime is its own condition, independent of
        # needs_rust/needs_venture_windows: a change scoped to a Mosaic
        # package outside code/packages/rust/ (e.g. a mosaic-pkg-* smoke-test
        # crate whose Cargo.toml starts depending on mosaic-package-artifact-
        # builder, which pulls in mosaic-emit-qt) can trip
        # needs_mosaic_qt_runtime without tripping the other two. Without
        # this arm, "Round-trip Rust engine through standard Qt binding"
        # (which needs cairo transitively) runs while this installer is
        # skipped, and the build fails with a pkg-config "cairo not found"
        # error that has nothing to do with the actual diff. Matches the
        # same three-way condition "Install Venture Qt acceptance
        # dependencies" below already uses.
        if: (needs.detect.outputs.needs_rust == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_qt_runtime == 'true') && runner.os == 'Linux'
        run: |
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      # The `pdf` crate is verified against qpdf, an independent
      # implementation: a PDF writer checked only by reading its own output
      # back proves nothing, because a wrong idea of where the xref table goes
      # would be shared by both halves.
      #
      # `tests/qpdf_gate.rs` FAILS when qpdf is absent rather than skipping --
      # deliberately, since a suite that silently passes when its oracle is
      # missing is not a suite. That makes installing it here a requirement
      # rather than a convenience.
      # `font-subset` writes a font file, and a font writer checked only by
      # our own parser proves nothing -- a wrong idea of how the table
      # directory is padded would be shared by both halves and they would agree
      # perfectly. `tests/fonttools_oracle.rs` hands the subset to fontTools
      # and asks whether the retained glyphs still have the same outlines at
      # the same ids.
      #
      # Unlike poppler this installs identically everywhere: fontTools is pure
      # Python, so one pip command covers Linux, macOS and Windows rather than
      # three package managers with three different names.
      - name: Install fontTools for the font-subset oracle
        if: needs.detect.outputs.needs_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet fonttools
          python3 -c "import fontTools; print('fontTools', fontTools.version)"
          # Pin the exact interpreter fontTools was just installed into.
          # tests/fonttools_oracle.rs defaults to bare `python3` (see
          # FONTTOOLS_PYTHON) and doesn't run until much later in this job,
          # after dozens more toolchain-setup steps that can shift PATH --
          # so a bare `python3` two hours from now is not guaranteed to be
          # this one. Naming the literal path removes that dependency on
          # PATH staying stable for the rest of the job.
          echo "FONTTOOLS_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Install qpdf for the PDF oracle tests
        if: needs.detect.outputs.needs_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash code/scripts/ci/apt-install.sh qpdf
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install qpdf
          else
            choco install qpdf -y --no-progress
          fi
          qpdf --version

      # qpdf proves the file is well FORMED. It cannot prove the page is the
      # right way up: an upside-down page is structurally perfect, and PDF's
      # origin is bottom-left where every layout model this repository has puts
      # it top-left. So `tests/render_gate.rs` rasterises with poppler -- a
      # second independent implementation -- and asks where the ink actually
      # landed.
      #
      # It FAILS when poppler is absent, for the same reason the qpdf gate
      # does: an oracle that skips reports green while checking nothing.
      #
      # Linux and macOS only. The rendering oracle checks where ink lands on a
      # page, and the PDF bytes it rasterises are byte-identical on every
      # platform -- so a third rasteriser adds no coverage, while poppler has
      # no reliable Chocolatey package (`choco install poppler` fails on
      # windows-2025). The tests are correspondingly compiled out on Windows,
      # so this is a stated scope rather than a silent skip: everywhere the
      # gate runs, a missing poppler still fails the build.
      - name: Install poppler for the PDF rendering oracle
        if: needs.detect.outputs.needs_rust == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y poppler-utils
          else
            brew install poppler
          fi
          pdftoppm -v

      # VLT-PM51 slice 2 (vault-webauthn-ctap2-hid): ctap-hid-fido2's
      # `hidapi` dependency uses the `linux-static-hidraw` feature on
      # Linux, which links against `libudev` via pkg-config at build
      # time (confirmed by reading hidapi's own build.rs -- the
      # libusb-based backends aren't compiled in, so libusb-1.0-0-dev
      # is not needed here, only libudev-dev). macOS links the
      # preinstalled IOKit/CoreFoundation frameworks and Windows links
      # SetupAPI, neither of which needs a package install step.
      - name: Install native HID dependencies (vault-webauthn-ctap2-hid)
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Linux'
        run: |
          bash code/scripts/ci/apt-install.sh libudev-dev

      - name: Install Venture Qt acceptance dependencies
        if: (needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_qt_runtime == 'true') && runner.os == 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          cache: true

      - name: Install cargo-tarpaulin
        # PINNED, and --locked. An unpinned `cargo install` means coverage can
        # break with no repo change, and it already did once:
        # `chief-of-staff-biometric-approval` passed on the ptrace engine on
        # 2026-08-14 and SIGILLed months later on untouched code -- the tool
        # moved, not the crate.
        #
        # Diff-based CI hides that failure mode. A package is only rebuilt when
        # it changes, so tool drift sits dormant until an unrelated PR triggers
        # a near-full rebuild, and then looks like THAT PR's fault. Pinning
        # turns a mystery into a one-line, reviewable bump.
        #
        # `--locked` matters as much as the version: without it Cargo resolves
        # tarpaulin's own dependency tree fresh, so a patch release in any
        # transitive dep reintroduces exactly the drift the pin removes.
        #
        # 0.37.2, NOT the 0.35.2 this was first pinned to. Upstream fixed the
        # ptrace SIGILL in 0.35.3 ("PID parent event is delivered in iteration
        # after the child stop is reported"), which was yanked and republished
        # as 0.35.4 -- so 0.35.2 is the last release that still HAS the bug
        # this pin exists to prevent, and 17 of our 20 tarpaulin invocations
        # run on the default ptrace engine. Pinning to the version that
        # happened to be installed locally would have frozen CI on it.
        #
        # 0.37.1 also brought llvm_profparser 0.13 and with it LLVM 23 support,
        # which the `--engine llvm` crates need as the floating `@stable`
        # toolchain advances.
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Linux'
        run: cargo install cargo-tarpaulin --version 0.37.2 --locked

      - name: Set up Elixir
        # Pure-BEAM packages run executable BUILD_windows fronts on the pinned
        # Windows runner. Pin the setup-beam revision proven on Windows 2025 /
        # VS 2026; NIF and Metal packages retain narrow machine-reported
        # BUILD_windows exceptions.
        # setup-beam v1.24.1 -- version deliberately NOT a trailing
        # comment here: the Elixir Windows contract matches this block
        # literally and the SHA is bound in
        # code/specs/fixtures/elixir-windows-build-front-v1/contract.json
        if: needs.detect.outputs.needs_elixir == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Set up Dart
        if: needs.detect.outputs.needs_dart == 'true' || needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      - name: Set up Flutter
        # macOS too when the SwiftUI lane runs: Flutter on iOS (UI89 §7.7 step 3)
        # builds there, beside the SwiftUI iOS gates.
        if: needs.detect.outputs.needs_mosaic_flutter_runtime == 'true' && (runner.os == 'Linux' || (runner.os == 'macOS' && needs.detect.outputs.needs_mosaic_swift_runtime == 'true'))
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Enable Flutter native assets
        # macOS too when the SwiftUI lane runs: Flutter on iOS (UI89 §7.7 step 3)
        # builds there, beside the SwiftUI iOS gates.
        if: needs.detect.outputs.needs_mosaic_flutter_runtime == 'true' && (runner.os == 'Linux' || (runner.os == 'macOS' && needs.detect.outputs.needs_mosaic_swift_runtime == 'true'))
        shell: bash
        run: flutter config --enable-native-assets

      - name: Set up Swift (Windows)
        if: needs.detect.outputs.needs_swift == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --accept-package-agreements --accept-source-agreements --source winget
          $wingetExitCode = $LASTEXITCODE

          if ($wingetExitCode -ne 0) {
            Write-Warning "winget install exited with code $wingetExitCode; checking whether Swift is available anyway"
          }

          $currentPathEntries = @($env:Path -split ';')
          $currentPathSet = @{}
          foreach ($entry in $currentPathEntries) {
            if (-not [string]::IsNullOrWhiteSpace($entry)) {
              $currentPathSet[$entry] = $true
            }
          }

          $registryPathEntries = @(
            [System.Environment]::GetEnvironmentVariable('Path', 'User')
            [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          ) | Where-Object { $_ } | ForEach-Object { $_ -split ';' } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $newPathEntries = @()
          foreach ($entry in $registryPathEntries) {
            if (-not $currentPathSet.ContainsKey($entry)) {
              $currentPathSet[$entry] = $true
              $newPathEntries += $entry
            }
          }

          foreach ($entry in $newPathEntries) {
            $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if ($newPathEntries.Count -gt 0) {
            $env:Path = "$env:Path;$($newPathEntries -join ';')"
          }

          $swiftRoots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift')
            (Join-Path $env:ProgramFiles 'Swift')
          ) | Where-Object { Test-Path $_ }

          $swiftExe = @(
            (Get-Command swift -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
            ($swiftRoots | ForEach-Object {
              Get-ChildItem -Path $_ -Filter swift.exe -Recurse -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            })
          ) | Where-Object { $_ } | Select-Object -First 1

          if (-not $swiftExe) {
            if ($wingetExitCode -ne 0) {
              throw "winget install exited with code $wingetExitCode and swift.exe was not found"
            }
            throw 'swift.exe not found after winget install'
          }

          $toolchainBin = Split-Path -Parent $swiftExe
          if (-not $currentPathSet.ContainsKey($toolchainBin)) {
            $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$env:Path;$toolchainBin"
            $currentPathSet[$toolchainBin] = $true
          }
          Write-Host "Using Swift from $swiftExe"

          $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'User')
          if (-not $sdkRoot) {
            $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'Machine')
          }
          if (-not $sdkRoot) {
            $sdkRoot = $swiftRoots | ForEach-Object {
            Get-ChildItem -Path $_ -Filter Windows.sdk -Directory -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            } | Where-Object { $_ } | Select-Object -First 1
          }

          if ($sdkRoot) {
            "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:SDKROOT = $sdkRoot
            Write-Host "Using SDKROOT=$sdkRoot"
          }

          where.exe swift

      # ── Java / Kotlin ──────────────────────────────────────────
      #
      # Both Java and Kotlin packages use Gradle and JDK 21. Venture's
      # cross-platform package acceptance also emits and directly exercises
      # its Compose Desktop shell, even though the package harness is Rust.
      # A single JDK + Gradle setup covers all three cases.

      - name: Set up JDK 21
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || (needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && runner.os == 'Linux')
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true' || (needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && runner.os == 'Linux')
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Disable long-lived Gradle services on Windows CI
        if: (needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true' || needs.detect.outputs.needs_venture_windows == 'true') && runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
          } >> "$GITHUB_ENV"

      - name: Install cpanm and test dependencies (Perl)
        if: needs.detect.outputs.needs_perl == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y cpanminus
            # Pre-install Test2::V0 to the system Perl location (requires sudo).
            # Without sudo, cpanm falls back to ~/perl5 which prove cannot find.
            sudo cpanm --quiet --notest Test2::V0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cpanminus
            cpanm --quiet --notest Test2::V0
          fi

      - name: Set up Haskell
        if: needs.detect.outputs.needs_haskell == 'true'
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: '9.4'
          cabal-version: '3.10'

      # Cabal 3.10 can report a successful `cabal update` while deferring the
      # package-index cache materialization until the first solver query.  On
      # fresh hosted runners that made the first Haskell BUILD incorrectly
      # resolve a test-disabled plan.  Force and verify that read here so a
      # broken index is classified as bootstrap failure before package tests.
      - name: Verify Haskell package index
        if: needs.detect.outputs.needs_haskell == 'true'
        shell: bash
        run: |
          cabal list --simple-output hspec | grep -Eq '^hspec [0-9]'

      - name: Set up reviewed OCaml compiler and repository
        id: setup-ocaml
        if: needs.detect.outputs.needs_ocaml == 'true' && (matrix.sharded != true || contains(matrix.languages, 'ocaml'))
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0
        # Avoid opam/opam#7031 while opam inspects its Git-backed repository.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ocaml-compiler: ocaml-base-compiler.5.2.1
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#ba8cc66eb9e5baae7ebc88cf77f4c488d63d87ff
          opam-pin: false
          dune-cache: false
          cache-prefix: ocaml03-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ matrix.label }}
          windows-compiler: mingw
          windows-environment: cygwin
          github-token: ${{ github.token }}

      - name: Require reviewed OCaml bootstrap
        if: steps.setup-ocaml.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(opam --version)" = "2.5.2"
          test "$(opam exec -- ocamlc -version | tr -d '\r')" = "5.2.1"
          repository_names="$(
            opam repository list --all --short --color=never
          )"
          test "$repository_names" = "default"
          repository_listing="$(
            opam repository list --all --color=never
          )"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_cmd=python
          else
            python_cmd=python3
          fi
          "$python_cmd" "$GITHUB_WORKSPACE/code/scripts/ocaml_toolchain_lock.py" \
            validate-repository-report \
            --names "$repository_names" \
            --listing "$repository_listing"
          for package in dune alcotest bisect_ppx ocamlformat; do
            if opam list --installed --short --columns=name "$package" \
                | grep -Fxq "$package"; then
              printf 'fresh switch unexpectedly contains %s\n' "$package" >&2
              exit 1
            fi
          done
          export OPAMREQUIRECHECKSUMS=true
          opam install \
            dune.3.17.2 \
            alcotest.1.9.0 \
            bisect_ppx.2.8.3 \
            ocamlformat.0.27.0 \
            --yes --require-checksums
          "$python_cmd" "$GITHUB_WORKSPACE/code/scripts/ocaml_toolchain_lock.py" \
            validate-runtime
          printf 'OPAMREQUIRECHECKSUMS=true\n' >> "$GITHUB_ENV"

      - name: Set up .NET
        if: needs.detect.outputs.needs_dotnet == 'true' || ((needs.detect.outputs.needs_venture_windows == 'true' || needs.detect.outputs.needs_mosaic_xaml_windows == 'true') && runner.os == 'Windows')
        uses: actions/setup-dotnet@v6
        with:
          # .NET 9 is the current LTS release. No platform exclusions needed —
          # actions/setup-dotnet@v6 works identically on Ubuntu, macOS, and Windows.
          dotnet-version: '9.0.x'

      - name: Install ILAsm (real-CoreCLR assembler for the CLR-real conformance column)
        # The W16 conformance suite's `CLR-real` backend assembles textual `.il`
        # with `ilasm` and runs it on real `dotnet`. `ilasm` ships only in the
        # RID-specific NuGet runtime pack `runtime.<rid>.Microsoft.NETCore.ILAsm`
        # (the bare `Microsoft.NETCore.ILAsm` is ref-only, no binary). A
        # `<PackageDownload>` restore drops the binary into `~/.nuget/packages`,
        # exactly where the test harness's `find_ilasm()` searches — so the CLR
        # column is verified on the *real* runtime, not just the simulator.
        if: needs.detect.outputs.needs_dotnet == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rid=$(dotnet --info | sed -n 's/^[[:space:]]*RID:[[:space:]]*//p' | head -1)
          echo "Host RID: ${rid:-<unknown>}"
          if [ -z "${rid:-}" ]; then
            echo "Could not determine RID; the CLR-real column will skip gracefully."
            exit 0
          fi
          work=$(mktemp -d)
          cat > "$work/ilasm.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="runtime.$rid.Microsoft.NETCore.ILAsm" Version="[9.0.0]" />
            </ItemGroup>
          </Project>
          EOF
          # Non-fatal: if the pack is unavailable for this RID, the conformance
          # CLR-real arm simply returns None (skip), leaving the simulator floor.
          dotnet restore "$work/ilasm.csproj" || echo "ILAsm restore failed; CLR-real column will skip."
          found=$(find "$HOME/.nuget/packages" -iname ilasm -type f 2>/dev/null | head -1 || true)
          echo "ilasm binary: ${found:-<not found>}"

      - name: Install test runners
        shell: bash
        run: |
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            uv pip install --system pytest
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            npm install -g jest
          fi

      - name: Restore selected Ruby to Windows PATH
        if: needs.detect.outputs.needs_ruby == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          RUBY_PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          if (-not $env:RUBY_PREFIX) {
            throw "ruby/setup-ruby did not report its installation prefix"
          }
          @(
            (Join-Path $env:RUBY_PREFIX 'bin')
            (Join-Path $env:RUBY_PREFIX 'msys64\ucrt64\bin')
            (Join-Path $env:RUBY_PREFIX 'msys64\usr\bin')
          ) | ForEach-Object {
            if (Test-Path $_) {
              Add-Content -Path $env:GITHUB_PATH -Value $_
            }
          }

      # ── Verify toolchains ────────────────────────────────────
      - name: Verify tools
        shell: bash
        run: |
          echo "Go: $(go version)"
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            echo "Python: $(python --version)"
            echo "uv: $(uv --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_ruby }}" = "true" ]; then
            echo "Ruby: $(ruby --version)"
            echo "Bundler: $(bundle --version)"
            ruby -e 'require "rubygems"; required = Gem::Version.new("3.4"); current = Gem::Version.new(RUBY_VERSION); abort "Ruby #{required}+ required, got #{current}" if current < required'
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_rust }}" = "true" ] || [ "${{ needs.detect.outputs.needs_venture_windows }}" = "true" ] || [ "${{ needs.detect.outputs.needs_mosaic_xaml_windows }}" = "true" ]; then
            echo "Rust: $(rustc --version)"
            echo "Cargo: $(cargo --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_swift }}" = "true" ]; then
            echo "Swift: $(swift --version | head -1)"
          fi
          if [ "${{ needs.detect.outputs.needs_elixir }}" = "true" ]; then
            echo "Elixir: $(elixir --version)"
            echo "Mix: $(mix --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dart }}" = "true" ]; then
            echo "Dart: $(dart --version 2>&1)"
          fi
          if [ "${{ needs.detect.outputs.needs_lua }}" = "true" ]; then
            echo "Lua: $(lua -v)"
            echo "LuaRocks: $(luarocks --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_perl }}" = "true" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Perl: $(perl --version | head -2 | tail -1)"
            echo "cpanm: $(cpanm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_haskell }}" = "true" ]; then
            echo "GHC: $(ghc --version)"
            echo "Cabal: $(cabal --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dotnet }}" = "true" ]; then
            echo ".NET: $(dotnet --version)"
          fi

      # ── Download build plan (skip discovery in build job) ─────
      - name: Download build plan
        uses: actions/download-artifact@v8
        with:
          name: build-plan

      # ── Build the build tool ──────────────────────────────────
      - name: Compile build tool
        shell: bash
        run: |
          cd code/programs/go/build-tool
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o ../../../../build-tool.exe .
          else
            go build -o ../../../../build-tool .
          fi

      - name: Reclaim Linux runner disk
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEEDS_KOTLIN: ${{ needs.detect.outputs.needs_kotlin }}
          NEEDS_MOSAIC_COMPOSE: ${{ needs.detect.outputs.needs_mosaic_compose_runtime }}
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          # Keep the pre-installed Android SDK when Kotlin (Android) builds are
          # needed — deleting it forces a full re-download later, wasting several
          # minutes and ~5 GB of bandwidth per shard. Mosaic's Compose lane
          # builds an Android APK too (UI89 §3.4).
          if [ "$NEEDS_KOTLIN" != "true" ] && [ "$NEEDS_MOSAIC_COMPOSE" != "true" ]; then
            sudo rm -rf /usr/local/lib/android || true
          fi
          docker system prune --all --force || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # ── Android SDK (Kotlin / Android) ────────────────────────
      #
      # android-actions/setup-android accepts licences, installs platform-tools
      # and build-tools via sdkmanager, and sets ANDROID_HOME / ANDROID_SDK_ROOT.
      # On Linux the pre-installed SDK is reused (we kept it above); on macOS and
      # Windows the action downloads a fresh SDK. Gradle then auto-downloads
      # the specific platform (API 35 / 36) on first build.
      - name: Set up Android SDK
        if: needs.detect.outputs.needs_kotlin == 'true' || (needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && runner.os == 'Linux')
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools'

      - name: Build and test affected Swift packages on Windows
        if: runner.os == 'Windows' && needs.detect.outputs.needs_swift == 'true'
        shell: pwsh
        run: |
          $planFlag = @()
          if (Test-Path 'build-plan.json') {
            Write-Host 'Using pre-computed build plan'
            $planFlag = @('-plan-file', 'build-plan.json')
          }
          $shardFlag = @()
          if ('${{ matrix.sharded }}' -eq 'true') {
            $shardFlag = @('-shard-index', '${{ matrix.shard_index }}')
          }
          & ./build-tool.exe -root . @planFlag @shardFlag -validate-build-files -language swift

      # Rust-only Windows changes do not enter the general BUILD step. This
      # separate runtime gate must link and launch executables, not just lint.
      - name: Test LANG Windows native execution
        if: runner.os == 'Windows' && needs.detect.outputs.needs_lang_windows == 'true'
        shell: pwsh
        working-directory: code/packages/rust
        env:
          LANG_REQUIRE_WINDOWS_AOT: "1"
        run: |
          cargo test -p twig-aot --test windows_x86_64_smoke -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "LANG Windows native execution failed with exit code $LASTEXITCODE"
          }
          cargo test -p lang-aot --test conformance mccarthy_native_corpus_executes -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "McCarthy Windows native corpus failed with exit code $LASTEXITCODE"
          }

      - name: Build and test Venture Windows acceptance
        if: runner.os == 'Windows' && needs.detect.outputs.needs_venture_windows == 'true'
        shell: pwsh
        env:
          # GitHub-hosted Windows workers do not provide a reliable interactive
          # WinUI desktop. The test still builds the complete generated app;
          # local/self-hosted Windows runs launch and interact by default.
          MOSAIC_SKIP_INTERACTIVE_WINDOWS_ACCEPTANCE: '1'
        run: |
          Set-Location code/packages/rust
          cargo test -p paint-vm-cairo -p venture-browser-cairo -p venture-browser-qt -p venture-browser-windows
          if ($LASTEXITCODE -ne 0) {
            throw "Venture Windows render and bridge tests failed with exit code $LASTEXITCODE"
          }
          Set-Location ..\..\programs\mosaic\venture-browser
          cargo test
          if ($LASTEXITCODE -ne 0) {
            throw "Venture Mosaic package tests failed with exit code $LASTEXITCODE"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-all.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Venture Windows backend matrix failed with exit code $LASTEXITCODE"
          }

      - name: Build and test Venture macOS acceptance
        if: runner.os == 'macOS' && needs.detect.outputs.needs_venture_windows == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd code/packages/rust
          cargo test -p venture-browser-macos

      - name: Round-trip Rust engine through standard SwiftUI binding
        if: runner.os == 'macOS' && needs.detect.outputs.needs_mosaic_swift_runtime == 'true'
        shell: bash
        # 16 minutes before Journal's iOS gate (UI89 §2.4) joined it, about 25
        # after; Engram's (§2.5) adds a second engine and app build, and
        # Journal's XCUITest (§4.3), Trestle's and Engram's (§4.4) each a test
        # build and run on the iPad.
        timeout-minutes: 105
        run: |
          set -euo pipefail
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          runtime_library="$(pwd)/code/packages/rust/target/debug/libmosaic_app_conformance.dylib"

          bundled_output="$RUNNER_TEMP/mosaic-swift-bundled-conformance"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-app-conformance/package --backend swiftui --output "$bundled_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$bundled_output/swiftui/mosaic-degradations.json"
          swift build --package-path "$bundled_output/swiftui"
          swift_bin="$(swift build --package-path "$bundled_output/swiftui" --show-bin-path)"
          installed_runtime="$(find "$swift_bin" -type f -path '*/Runtime/libmosaic_app.dylib' -print -quit)"
          test -n "$installed_runtime"
          cmp "$runtime_library" "$installed_runtime"

          harness="$RUNNER_TEMP/mosaic-swift-runtime-conformance"
          cp -R code/packages/rust/mosaic-app-bindings/conformance/swiftui "$harness"
          mkdir -p "$harness/Sources/CMosaicRuntime/include"
          cp "$bundled_output/swiftui/Sources/App/MosaicRuntimeHost.swift" "$harness/Sources/Conformance/MosaicRuntimeHost.swift"
          cp "$bundled_output/swiftui/Sources/CMosaicRuntime/CMosaicRuntime.c" "$harness/Sources/CMosaicRuntime/CMosaicRuntime.c"
          cp "$bundled_output/swiftui/Sources/CMosaicRuntime/include/CMosaicRuntime.h" "$harness/Sources/CMosaicRuntime/include/CMosaicRuntime.h"

          state_path="$RUNNER_TEMP/mosaic-swift-runtime-state.json"
          rm -f "$state_path" "$state_path.corrupt" "$state_path.tmp"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" \
            swift run --package-path "$harness" Conformance --library "$installed_runtime"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_RESTORED=1 \
            swift run --package-path "$harness" Conformance --library "$installed_runtime"
          printf '{}' > "$state_path"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" \
            MOSAIC_EXPECT_PERSISTENCE_WARNING=1 \
            swift run --package-path "$harness" Conformance --library "$installed_runtime"

          # The SwiftUI platform library's own behaviour (UI87 §7): every SwiftUI app
          # gets MosaicPlatformEffects.swift, and this drives its open/save
          # logic, limits and routing with a fake host and fake panels.
          cp "$bundled_output/swiftui/Sources/App/MosaicPlatformEffects.swift" "$harness/Sources/Conformance/MosaicPlatformEffects.swift"
          swift run --package-path "$harness" -Xswiftc -DMOSAIC_PLATFORM_EFFECTS Conformance --platform-effects

          cargo build --manifest-path code/packages/rust/Cargo.toml -p task-mosaic-app
          task_runtime_library="$(pwd)/code/packages/rust/target/debug/libtask_mosaic_app.dylib"
          taskapp_output="$RUNNER_TEMP/mosaic-swift-taskapp"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend swiftui --output "$taskapp_output" --emit-project --profile native-complete --runtime-library "$task_runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$taskapp_output/swiftui/mosaic-degradations.json"
          python3 code/scripts/taskapp_native_control_contract.py --backend swiftui --generated-dir "$taskapp_output/swiftui"
          swift build --package-path "$taskapp_output/swiftui"
          taskapp_bin="$(swift build --package-path "$taskapp_output/swiftui" --show-bin-path)"
          installed_taskapp_runtime="$(find "$taskapp_bin" -type f -path '*/Runtime/libmosaic_app.dylib' -print -quit)"
          test -n "$installed_taskapp_runtime"
          cmp "$task_runtime_library" "$installed_taskapp_runtime"

          # The strict shell must mount a window before probing the runtime and
          # stay alive on a loader failure. Remove the bundled dylib from the
          # built resource bundle, launch from / so no checkout-relative copy
          # can be found, and require the process to remain alive in its visible
          # recoverable failure state. The emitted-control contract above pins
          # that state's detail, reassurance, and retry control.
          installed_taskapp="$taskapp_bin/App"
          test -x "$installed_taskapp"
          missing_runtime="$installed_taskapp_runtime.startup-acceptance"
          mv "$installed_taskapp_runtime" "$missing_runtime"
          startup_failure_log="$RUNNER_TEMP/mosaic-swift-taskapp-startup-failure.log"
          (
            cd /
            env -u MOSAIC_APP_LIBRARY "$installed_taskapp" \
              >"$startup_failure_log" 2>&1 &
            startup_pid=$!
            trap 'kill "$startup_pid" 2>/dev/null || true; mv "$missing_runtime" "$installed_taskapp_runtime" 2>/dev/null || true' EXIT
            sleep 5
            kill -0 "$startup_pid"
            kill "$startup_pid"
            wait "$startup_pid" || true
            mv "$missing_runtime" "$installed_taskapp_runtime"
            trap - EXIT
          )
          cmp "$task_runtime_library" "$installed_taskapp_runtime"

          task_harness="$RUNNER_TEMP/mosaic-swift-taskapp-runtime-conformance"
          cp -R code/packages/rust/task-mosaic-app/conformance/swiftui "$task_harness"
          mkdir -p "$task_harness/Sources/CMosaicRuntime/include"
          cp "$taskapp_output/swiftui/Sources/App/MosaicRuntimeHost.swift" "$task_harness/Sources/Conformance/MosaicRuntimeHost.swift"
          cp "$taskapp_output/swiftui/Sources/CMosaicRuntime/CMosaicRuntime.c" "$task_harness/Sources/CMosaicRuntime/CMosaicRuntime.c"
          cp "$taskapp_output/swiftui/Sources/CMosaicRuntime/include/CMosaicRuntime.h" "$task_harness/Sources/CMosaicRuntime/include/CMosaicRuntime.h"
          task_state_path="$RUNNER_TEMP/mosaic-swift-taskapp-state.json"
          rm -f "$task_state_path" "$task_state_path.corrupt" "$task_state_path.tmp"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$task_state_path" \
            swift run --package-path "$task_harness" Conformance --library "$installed_taskapp_runtime"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$task_state_path" MOSAIC_EXPECT_RESTORED=1 \
            swift run --package-path "$task_harness" Conformance --library "$installed_taskapp_runtime"
          taskapp_log="$RUNNER_TEMP/mosaic-swift-taskapp-launch.log"
          diagnose_taskapp_crash() {
            local diagnostic_log="$RUNNER_TEMP/mosaic-swift-taskapp-lldb.log"
            local entitlements="$RUNNER_TEMP/taskapp-debug-entitlements.plist"
            cat >"$entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.get-task-allow</key>
            <true/>
          </dict>
          </plist>
          PLIST
            codesign --force --sign - --entitlements "$entitlements" "$installed_taskapp"
            (
              cd /
              env -u MOSAIC_APP_LIBRARY \
                lldb --batch -o run -o "thread backtrace all" -- "$installed_taskapp" \
                >"$diagnostic_log" 2>&1 &
              debugger_pid=$!
              sleep 10
              if kill -0 "$debugger_pid" 2>/dev/null; then
                pkill -TERM -P "$debugger_pid" 2>/dev/null || true
                kill "$debugger_pid" 2>/dev/null || true
              fi
              wait "$debugger_pid" || true
            )
            cat "$diagnostic_log"
          }
          (
            cd /
            env -u MOSAIC_APP_LIBRARY \
              SWIFT_BACKTRACE="enable=yes,interactive=no,output-to=stderr" \
              "$installed_taskapp" >"$taskapp_log" 2>&1 &
            taskapp_pid=$!
            trap 'kill "$taskapp_pid" 2>/dev/null || true' EXIT
            sleep 5
            if ! kill -0 "$taskapp_pid" 2>/dev/null; then
              cat "$taskapp_log"
              sleep 2
              find "$HOME/Library/Logs/DiagnosticReports" -type f \
                -name 'App*.ips' -mmin -2 -print -exec cat {} \; || true
              diagnose_taskapp_crash
              exit 1
            fi
            kill "$taskapp_pid"
            wait "$taskapp_pid" || true
            trap - EXIT
          )
          ! grep -F "Mosaic Rust runtime unavailable" "$taskapp_log"
          ! grep -E "missing required MIL prop|Mosaic runtime failed|Fatal error|Precondition failed" "$taskapp_log"

          # Engram on SwiftUI, the mirror of the Qt Engram lane further down.
          #
          # `.dylib`, not `.so`: this block is macOS-gated, the inverse of the
          # Qt lane, which runs on Linux.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p engram-mosaic-app
          engram_swift_runtime="$(pwd)/code/packages/rust/target/debug/libengram_mosaic_app.dylib"
          test -f "$engram_swift_runtime"
          engram_swift_output="$RUNNER_TEMP/mosaic-swiftui-engram"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend swiftui --output "$engram_swift_output" --emit-project --profile native-complete --runtime-library "$engram_swift_runtime"

          # Pinned empty, exactly as the Qt lane pins it: SwiftUI's
          # `MosaicHost.swift` override is retired, and a package that starts
          # overriding the generated host again has undone that and must fail
          # here rather than pass quietly.
          jq -e '.replacedGeneratedFiles == []' "$engram_swift_output/swiftui/mosaic-degradations.json"
          # `type == "array"` first: `null | length` is 0 in jq, so a report that
          # lost the key entirely would satisfy a bare length check.
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$engram_swift_output/swiftui/mosaic-degradations.json"

          # The handler is wired into the generated app, and lands INSIDE the
          # host class rather than ahead of it. This is the half no assertion
          # over a source file can reach -- and it matters more here than on Qt,
          # because SwiftPM compiles everything under `Sources/App`, so an
          # uninstalled handler still compiles, links and ships with no
          # diagnostic at all.
          grep -q 'installEngramEffects(mosaicEffectHost)' "$engram_swift_output/swiftui/Sources/App/App.swift"
          python3 - "$engram_swift_output/swiftui/Sources/App/App.swift" <<'PY'
          import re
          import sys

          text = open(sys.argv[1]).read()
          install = text.index("installEngramEffects(mosaicEffectHost)")

          # "Inside MosaicHostState" means the nearest type declaration ABOVE the
          # install is that class. Asserting `class_idx < install` instead would
          # be near-vacuous -- the class is declared once, far up the file, so
          # the ordering holds even if the call landed in a later type.
          declarations = [
              (m.start(), m.group(1))
              for m in re.finditer(r"(?m)^[ \t]*(?:(?:private|fileprivate|internal|public|final)\s+)*"
                                   r"(?:class|struct|enum|extension)\s+(\w+)", text)
              if m.start() < install
          ]
          assert declarations, "no type declaration precedes the install"
          enclosing = declarations[-1][1]
          assert enclosing == "MosaicHostState", (
              f"install landed in {enclosing}, not MosaicHostState"
          )

          # And after the bridge exists: installing onto a nil bridge compiles
          # and silently does nothing.
          assignment = text.index("self.bridge = ", declarations[-1][0])
          assert assignment < install, "install must follow the bridge assignment"
          PY

          # The gate: it builds.
          swift build --package-path "$engram_swift_output/swiftui"

          # ---- Journal: emit and BUILD on SwiftUI (J5b, #14416). -------------
          # The strict standard binding (native-complete + runtime library), no
          # replaced generated files, zero degradations, and the package builds.
          # Journal raises no effects, so there is no handler to grep for.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p journal-mosaic-app
          journal_swift_runtime="$(pwd)/code/packages/rust/target/debug/libjournal_mosaic_app.dylib"
          test -f "$journal_swift_runtime"
          journal_swift_output="$RUNNER_TEMP/mosaic-swiftui-journal"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/journal-app --backend swiftui --output "$journal_swift_output" --emit-project --profile native-complete --runtime-library "$journal_swift_runtime"
          jq -e '.replacedGeneratedFiles == []' "$journal_swift_output/swiftui/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$journal_swift_output/swiftui/mosaic-degradations.json"
          swift build --package-path "$journal_swift_output/swiftui"

          ios_output="$RUNNER_TEMP/mosaic-swift-taskapp-ios-source"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend swiftui --output "$ios_output" --emit-project
          jq -e '.nativeComplete == false and ([.degradations[].code] == ["runtime.sample-fallback"])' "$ios_output/swiftui/mosaic-degradations.json"
          (
            cd "$ios_output/swiftui"
            xcodebuild -scheme App -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/mosaic-swift-taskapp-ios" CODE_SIGNING_ALLOWED=NO build
          )

          # iOS and iPadOS with the REAL runtime linked in (UI89 §2.1): the
          # Rust engine is built as an .xcframework of static libraries (device
          # + a fat simulator slice), because iOS does not allow loading an
          # app's own dylib. The loader then calls it directly
          # (MOSAIC_RUNTIME_STATIC); nm confirms the engine is in the binary,
          # not merely that the link succeeded.
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          ios_runtime="$RUNNER_TEMP/TaskAppRuntime.xcframework"
          bash code/scripts/build-mosaic-xcframework.sh task-mosaic-app "$ios_runtime"
          ios_linked_output="$RUNNER_TEMP/mosaic-swift-taskapp-ios-linked"
          # Trestle's XCUITest (UI89 §4.4) goes into the iOS project as a UI
          # test bundle with a shared scheme; it runs on the iPad below.
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend swiftui --output "$ios_linked_output" --emit-project --profile native-complete --runtime-library "$ios_runtime" --ios-ui-test code/packages/rust/task-mosaic-app/conformance/swiftui-ios/TrestleUiTests.swift
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$ios_linked_output/swiftui/mosaic-degradations.json"
          grep -q 'cSettings: \[.define("MOSAIC_RUNTIME_STATIC")\]' "$ios_linked_output/swiftui/Package.swift"
          ios_linked_data="$RUNNER_TEMP/mosaic-swift-taskapp-ios-linked-dd"
          (
            cd "$ios_linked_output/swiftui"
            xcodebuild -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath "$ios_linked_data" CODE_SIGNING_ALLOWED=NO build
            xcodebuild -scheme App -destination 'generic/platform=iOS' -derivedDataPath "$ios_linked_data" CODE_SIGNING_ALLOWED=NO build
          )
          # nm writes to a file before grep reads it: `nm | grep -q` under
          # pipefail fails whenever grep exits at its first match while nm is
          # still writing (SIGPIPE, "LLVM ERROR: ... Broken pipe"), which depends
          # only on where the symbol happens to fall in nm's output.
          for binary in "$ios_linked_data/Build/Products/Debug-iphonesimulator/App" "$ios_linked_data/Build/Products/Debug-iphoneos/App"; do
            nm -gU "$binary" > "$RUNNER_TEMP/mosaic-ios-symbols.txt"
            grep -q ' _mosaic_app_create$' "$RUNNER_TEMP/mosaic-ios-symbols.txt"
          done

          # An installable iOS / iPadOS APP (UI89 §2.2): the same build wrote
          # iOS/App.xcodeproj, generated by mosaic-ios-project for any package with
          # a static runtime. It builds an .app carrying the package's identity
          # and the engine, which installs and keeps running on a simulator.
          test -f "$ios_linked_output/swiftui/iOS/App.xcodeproj/project.pbxproj"
          ios_app_build="$RUNNER_TEMP/mosaic-taskapp-ios-app"
          (
            cd "$ios_linked_output/swiftui/iOS"
            xcodebuild -project App.xcodeproj -target App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$ios_app_build" build
          )
          ios_app="$ios_app_build/Debug-iphonesimulator/App.app"
          nm -gU "$ios_app/App" > "$RUNNER_TEMP/mosaic-ios-app-symbols.txt"
          grep -q ' _mosaic_app_create$' "$RUNNER_TEMP/mosaic-ios-app-symbols.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ios_app/Info.plist")" = dev.codingadventures.trestle
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$ios_app/Info.plist")" = Trestle
          simulator="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$simulator" && test "$simulator" != null
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$ios_app"
          xcrun simctl launch "$simulator" dev.codingadventures.trestle
          sleep 10
          # Still running ten seconds later: it started, loaded the engine and
          # did not crash rendering the first frame. Drain all launchctl output:
          # grep -q can close the pipe early and make simctl fail with SIGPIPE.
          xcrun simctl spawn "$simulator" launchctl list | grep 'dev.codingadventures.trestle' > /dev/null

          # State lives in the app's sandbox and is read back (UI89 §2.3,
          # step 3). The host writes state only after the first event, so it
          # is seeded: state the runtime rejects must be quarantined INSIDE
          # the container (the host found and read that path), and the
          # snapshot the macOS TaskApp run above persisted -- the same engine
          # -- must be restored with nothing quarantined. Each time the app
          # must still be running ten seconds later.
          ios_container="$(xcrun simctl get_app_container "$simulator" dev.codingadventures.trestle data)"
          test -n "$ios_container" && test -d "$ios_container"
          ios_state_dir="$ios_container/Library/Application Support/task-app"
          ios_state="$ios_state_dir/mosaic-state.v1.json"
          test -s "$task_state_path"
          xcrun simctl terminate "$simulator" dev.codingadventures.trestle || true
          mkdir -p "$ios_state_dir"
          rm -f "$ios_state" "$ios_state.corrupt"
          printf '{}' > "$ios_state"
          xcrun simctl launch "$simulator" dev.codingadventures.trestle
          sleep 10
          test -f "$ios_state.corrupt"
          xcrun simctl spawn "$simulator" launchctl list | grep 'dev.codingadventures.trestle' > /dev/null
          xcrun simctl terminate "$simulator" dev.codingadventures.trestle
          rm -f "$ios_state" "$ios_state.corrupt"
          cp "$task_state_path" "$ios_state"
          xcrun simctl launch "$simulator" dev.codingadventures.trestle
          sleep 10
          test ! -e "$ios_state.corrupt"
          # Still there (the environment report is an event, so the host may
          # have rewritten it; its bytes are not the point).
          test -s "$ios_state"
          xcrun simctl spawn "$simulator" launchctl list | grep 'dev.codingadventures.trestle' > /dev/null
          xcrun simctl shutdown "$simulator"

          # The same app on iPadOS (UI89 §2.2: one target, TARGETED_DEVICE_FAMILY
          # 1,2): it installs and keeps running on an iPad simulator.
          ipad="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')"
          test -n "$ipad" && test "$ipad" != null
          xcrun simctl boot "$ipad" || true
          xcrun simctl bootstatus "$ipad" -b
          xcrun simctl install "$ipad" "$ios_app"
          xcrun simctl launch "$ipad" dev.codingadventures.trestle
          sleep 10
          xcrun simctl spawn "$ipad" launchctl list | grep 'dev.codingadventures.trestle' > /dev/null
          # A person's use of it (UI89 §4.4): add, complete, reopen and delete
          # a task through the generated controls, and find a saved task after
          # a relaunch. Uninstalled first, so launch 1 starts without the state
          # the launch above left; `xcodebuild test` installs the app fresh.
          xcrun simctl uninstall "$ipad" dev.codingadventures.trestle
          trestle_ui_test_log="$RUNNER_TEMP/mosaic-trestle-ios-ui-test.log"
          (
            cd "$ios_linked_output/swiftui/iOS"
            xcodebuild test -workspace App.xcworkspace -scheme AppUITests -sdk iphonesimulator -destination "platform=iOS Simulator,id=$ipad" -derivedDataPath "$RUNNER_TEMP/mosaic-trestle-ios-ui-test" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$trestle_ui_test_log"
          )
          # The count, not just the exit status, as for Journal below.
          grep -q 'Executed 1 test, with 0 failures' "$trestle_ui_test_log"
          xcrun simctl shutdown "$ipad"

          # ---- Journal on iOS and iPadOS (UI89 §2.4, step 7). ---------------
          # The same path as Trestle: the engine as a static .xcframework, the
          # native-complete SwiftUI project, and the generated iOS app target.
          # mosaic-ios-simulator-gate.sh then launches it three times on the
          # iPhone simulator: a fresh launch writes state (the environment
          # report is its first event), a second restores it with nothing
          # quarantined, and a third quarantines a seeded `{}` and starts
          # fresh. The same .app then runs on the iPad simulator.
          journal_ios_runtime="$RUNNER_TEMP/JournalAppRuntime.xcframework"
          bash code/scripts/build-mosaic-xcframework.sh journal-mosaic-app "$journal_ios_runtime"
          journal_ios_output="$RUNNER_TEMP/mosaic-swift-journal-ios-linked"
          # Journal's XCUITest (UI89 §4.3) goes into the project as a UI test
          # bundle with a shared scheme; it runs on the iPad below.
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/journal-app --backend swiftui --output "$journal_ios_output" --emit-project --profile native-complete --runtime-library "$journal_ios_runtime" --ios-ui-test code/packages/rust/journal-mosaic-app/conformance/swiftui-ios/JournalUiTests.swift
          jq -e '.replacedGeneratedFiles == []' "$journal_ios_output/swiftui/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$journal_ios_output/swiftui/mosaic-degradations.json"
          test -f "$journal_ios_output/swiftui/iOS/App.xcodeproj/project.pbxproj"
          journal_ios_build="$RUNNER_TEMP/mosaic-journal-ios-app"
          (
            cd "$journal_ios_output/swiftui/iOS"
            xcodebuild -project App.xcodeproj -target App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$journal_ios_build" build
          )
          journal_ios_app="$journal_ios_build/Debug-iphonesimulator/App.app"
          nm -gU "$journal_ios_app/App" > "$RUNNER_TEMP/mosaic-journal-ios-app-symbols.txt"
          grep -q ' _mosaic_app_create$' "$RUNNER_TEMP/mosaic-journal-ios-app-symbols.txt"
          # The defaults Journal's manifest leaves in place (UI89 §2.4, §3.9).
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$journal_ios_app/Info.plist")" = dev.codingadventures.journalapp
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$journal_ios_app/Info.plist")" = JournalApp
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          bash code/scripts/mosaic-ios-simulator-gate.sh "$journal_ios_app" dev.codingadventures.journalapp journal-app "$simulator"
          xcrun simctl shutdown "$simulator"
          xcrun simctl boot "$ipad" || true
          xcrun simctl bootstatus "$ipad" -b
          xcrun simctl install "$ipad" "$journal_ios_app"
          xcrun simctl launch "$ipad" dev.codingadventures.journalapp
          sleep 10
          # Running, not merely listed: launchctl keeps an exited job with `-`
          # for its PID, so the label is matched exactly with a numeric PID.
          ipad_services="$(xcrun simctl spawn "$ipad" launchctl list)"
          awk -v b=dev.codingadventures.journalapp '$1 ~ /^[0-9]+$/ && ($3 == b || index($3, "UIKitApplication:" b "[") == 1) { f = 1 } END { exit !f }' <<< "$ipad_services"
          # A person's use of it (UI89 §4.3): write, save and delete entries
          # through the generated controls, in landscape so both columns of
          # the split are on screen, and find the survivor after a relaunch.
          # Uninstalled first, so launch 1 starts without the state the launch
          # above left; `xcodebuild test` installs the app fresh.
          xcrun simctl uninstall "$ipad" dev.codingadventures.journalapp
          journal_ui_test_log="$RUNNER_TEMP/mosaic-journal-ios-ui-test.log"
          (
            cd "$journal_ios_output/swiftui/iOS"
            # What xcodebuild makes of the generated scheme, logged before the
            # run so a scheme it cannot use is diagnosable from this log.
            # The UI test scheme lives in a workspace beside the project: the
            # project's own schemes resolve against its `..` project directory
            # and found no buildables (mosaic-ios-project, shared_scheme).
            find App.xcworkspace App.xcodeproj -name '*.xcscheme' -print
            xcodebuild -list -workspace App.xcworkspace || true
            xcodebuild -showdestinations -workspace App.xcworkspace -scheme AppUITests -sdk iphonesimulator || true
            # -sdk as the app build above passes it: the destination is a
            # simulator, so the SDK is the simulator's.
            xcodebuild test -workspace App.xcworkspace -scheme AppUITests -sdk iphonesimulator -destination "platform=iOS Simulator,id=$ipad" -derivedDataPath "$RUNNER_TEMP/mosaic-journal-ios-ui-test" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$journal_ui_test_log"
          )
          # The count, not just the exit status: a test that was never compiled
          # in, or was filtered out, would leave xcodebuild green.
          grep -q 'Executed 1 test, with 0 failures' "$journal_ui_test_log"
          xcrun simctl shutdown "$ipad"

          # ---- Engram on iOS and iPadOS (UI89 §2.5, step 7). ----------------
          # Journal's recipe and gate. The app also compiles Engram's
          # [host_effects] handler (EngramEffects.swift), which answers Anki
          # import/export through the platform library's document picker, and
          # its touch layout. Its XCUITest (UI89 §4.4) goes in as a UI test
          # bundle; with it, the Debug build compiles the fake picker the
          # test selects with -MosaicUITestPicker.
          engram_ios_runtime="$RUNNER_TEMP/EngramAppRuntime.xcframework"
          bash code/scripts/build-mosaic-xcframework.sh engram-mosaic-app "$engram_ios_runtime"
          engram_ios_output="$RUNNER_TEMP/mosaic-swift-engram-ios-linked"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend swiftui --output "$engram_ios_output" --emit-project --profile native-complete --runtime-library "$engram_ios_runtime" --ios-ui-test code/programs/mosaic/engram-app/conformance/swiftui-ios/EngramUiTests.swift
          jq -e '.replacedGeneratedFiles == []' "$engram_ios_output/swiftui/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$engram_ios_output/swiftui/mosaic-degradations.json"
          test -f "$engram_ios_output/swiftui/iOS/App.xcodeproj/project.pbxproj"
          # The handler is part of the iOS app target, so its #else branch
          # (the iOS answer to Anki import/export) is compiled here.
          grep -qF 'Sources/App/EngramEffects.swift' "$engram_ios_output/swiftui/iOS/App.xcodeproj/project.pbxproj"
          engram_ios_build="$RUNNER_TEMP/mosaic-engram-ios-app"
          (
            cd "$engram_ios_output/swiftui/iOS"
            xcodebuild -project App.xcodeproj -target App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$engram_ios_build" build
          )
          engram_ios_app="$engram_ios_build/Debug-iphonesimulator/App.app"
          nm -gU "$engram_ios_app/App" > "$RUNNER_TEMP/mosaic-engram-ios-app-symbols.txt"
          grep -q ' _mosaic_app_create$' "$RUNNER_TEMP/mosaic-engram-ios-app-symbols.txt"
          # The defaults Engram's manifest leaves in place (UI89 §2.5, §3.10).
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$engram_ios_app/Info.plist")" = dev.codingadventures.engramapp
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$engram_ios_app/Info.plist")" = EngramApp
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          bash code/scripts/mosaic-ios-simulator-gate.sh "$engram_ios_app" dev.codingadventures.engramapp engram-app "$simulator"
          xcrun simctl shutdown "$simulator"
          xcrun simctl boot "$ipad" || true
          xcrun simctl bootstatus "$ipad" -b
          xcrun simctl install "$ipad" "$engram_ios_app"
          xcrun simctl launch "$ipad" dev.codingadventures.engramapp
          sleep 10
          # Running, not merely listed: launchctl keeps an exited job with `-`
          # for its PID, so the label is matched exactly with a numeric PID.
          ipad_services="$(xcrun simctl spawn "$ipad" launchctl list)"
          awk -v b=dev.codingadventures.engramapp '$1 ~ /^[0-9]+$/ && ($3 == b || index($3, "UIKitApplication:" b "[") == 1) { f = 1 } END { exit !f }' <<< "$ipad_services"
          # Anki export and import through the fake picker, and the imported
          # deck again after a relaunch (UI89 §4.4). Uninstalled first, so
          # launch 1 starts from an empty collection.
          xcrun simctl uninstall "$ipad" dev.codingadventures.engramapp
          engram_ui_test_log="$RUNNER_TEMP/mosaic-engram-ios-ui-test.log"
          (
            cd "$engram_ios_output/swiftui/iOS"
            xcodebuild test -workspace App.xcworkspace -scheme AppUITests -sdk iphonesimulator -destination "platform=iOS Simulator,id=$ipad" -derivedDataPath "$RUNNER_TEMP/mosaic-engram-ios-ui-test" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$engram_ui_test_log"
          )
          grep -q 'Executed 1 test, with 0 failures' "$engram_ui_test_log"
          xcrun simctl shutdown "$ipad"

          toolkit_output="$RUNNER_TEMP/mosaic-swift-toolkit"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-toolkit --backend swiftui --output "$toolkit_output" --emit-project
          swift build --package-path "$toolkit_output/swiftui"

          slider_output="$RUNNER_TEMP/mosaic-swift-host-slider"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-swiftui/fixtures/host-slider --backend swiftui --output "$slider_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$slider_output/swiftui/mosaic-degradations.json"
          swift build --package-path "$slider_output/swiftui"
          (
            cd "$slider_output/swiftui"
            xcodebuild -scheme App -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/mosaic-swift-host-slider-ios" CODE_SIGNING_ALLOWED=NO build
          )

          navigation_split_output="$RUNNER_TEMP/mosaic-swift-host-navigation-split"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-swiftui/fixtures/host-navigation-split --backend swiftui --output "$navigation_split_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0) and (.behaviorDegradations | length == 0)' "$navigation_split_output/swiftui/mosaic-degradations.json"
          swift build --package-path "$navigation_split_output/swiftui"
          (
            cd "$navigation_split_output/swiftui"
            xcodebuild -scheme App -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/mosaic-swift-host-navigation-split-ios" CODE_SIGNING_ALLOWED=NO build
          )

      # UI89 §7.7 step 3: Trestle through the Flutter backend, on iOS. The
      # engine is built as iOS dynamic libraries (Flutter's native assets
      # bundle a dylib as a framework; SwiftUI's static xcframework cannot be
      # used), checked per SDK by the builder and the hook, and the simulator
      # build runs through the same gate as the SwiftUI app. Gate: the
      # Runner.app's frameworks carry the engine, and it launches, restores
      # and quarantines on the iPhone simulator.
      - name: Build Trestle for iOS with Flutter (UI89 §7)
        if: runner.os == 'macOS' && needs.detect.outputs.needs_mosaic_swift_runtime == 'true' && needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          phone_runtime="$RUNNER_TEMP/mosaic-trestle-flutter-ios-runtime"
          rm -rf "$phone_runtime"
          bash code/scripts/build-mosaic-ios-dylibs.sh task-mosaic-app "$phone_runtime"
          output="$RUNNER_TEMP/mosaic-flutter-trestle-ios"
          rm -rf "$output"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend flutter --output "$output" --emit-project --profile native-complete --runtime-library "$phone_runtime"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$output/flutter/mosaic-degradations.json"
          cd "$output/flutter"
          # The README's command, from the manifest's identity (UI89 §7.1).
          grep -qxF '    flutter create --platforms=ios --org dev.codingadventures --project-name trestle .' README.md
          flutter create --platforms=ios --org dev.codingadventures --project-name trestle .
          flutter pub get
          # What path_provider's implementations resolved to (UI89 §7.4).
          grep -A3 -E '^  path_provider(_android|_foundation|_platform_interface)?:' pubspec.lock
          flutter analyze
          flutter build ios --simulator --debug
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = dev.codingadventures.trestle
          # The engine rides in the app's frameworks, as a native asset.
          found=0
          for binary in "$app"/Frameworks/*.framework/*; do
            [ -f "$binary" ] || continue
            if nm -gU "$binary" 2>/dev/null > "$RUNNER_TEMP/mosaic-flutter-ios-symbols.txt" \
              && grep -q ' _mosaic_app_create$' "$RUNNER_TEMP/mosaic-flutter-ios-symbols.txt"; then
              echo "engine: $binary"
              found=1
            fi
          done
          test "$found" = 1
          simulator="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$simulator" && test "$simulator" != null
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          # Uninstalled first: the SwiftUI Trestle has the same bundle id.
          xcrun simctl uninstall "$simulator" dev.codingadventures.trestle || true
          cd "$GITHUB_WORKSPACE"
          bash code/scripts/mosaic-ios-simulator-gate.sh "$output/flutter/$app" dev.codingadventures.trestle task-app "$simulator"
          xcrun simctl shutdown "$simulator"

      - name: Round-trip Rust engine through standard Qt binding
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_qt_runtime == 'true'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          runtime_library="$(pwd)/code/packages/rust/target/debug/libmosaic_app_conformance.so"

          bundled_output="$RUNNER_TEMP/mosaic-qt-bundled-conformance"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-app-conformance/package --backend qt --output "$bundled_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$bundled_output/qt/mosaic-degradations.json"
          cmake -S "$bundled_output/qt" -B "$bundled_output/qt/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$bundled_output/install"
          cmake --build "$bundled_output/qt/build" --config Release --parallel
          cmake --install "$bundled_output/qt/build" --config Release

          installed_runtime="$(find "$bundled_output/install" -type f -name libmosaic_app.so -print -quit)"
          test -n "$installed_runtime"
          cmp "$runtime_library" "$installed_runtime"

          installed_app="$(dirname "$installed_runtime")/Counter"
          bundled_log="$RUNNER_TEMP/mosaic-qt-bundled-launch.log"
          set +e
          env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen \
            timeout 5s "$installed_app" >"$bundled_log" 2>&1
          bundled_status=$?
          set -e
          test "$bundled_status" -eq 124
          ! grep -F "Mosaic Rust runtime unavailable" "$bundled_log"

          harness="$RUNNER_TEMP/mosaic-qt-runtime-conformance"
          cp -R code/packages/rust/mosaic-app-bindings/conformance/qt "$harness"
          cp "$bundled_output/qt/MosaicHost.cpp" "$harness/MosaicHost.cpp"
          cp "$bundled_output/qt/MosaicHost.h" "$harness/MosaicHost.h"

          cmake -S "$harness" -B "$harness/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$harness/build" --config Release --parallel
          installed_harness="$(dirname "$installed_runtime")/mosaic_qt_runtime_conformance"
          cp "$harness/build/mosaic_qt_runtime_conformance" "$installed_harness"
          (
            cd /
            state_path="$RUNNER_TEMP/mosaic-qt-runtime-state.json"
            rm -f "$state_path" "$state_path.corrupt" "$state_path.tmp"
            env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" "$installed_harness"
            env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_RESTORED=1 "$installed_harness"
            printf '{}' > "$state_path"
            env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state_path" \
              MOSAIC_EXPECT_PERSISTENCE_WARNING=1 "$installed_harness"
            env -u MOSAIC_APP_LIBRARY "$installed_harness" --expect-missing-prop-failure
          )

          cargo build --manifest-path code/packages/rust/Cargo.toml -p task-mosaic-app
          task_runtime_library="$(pwd)/code/packages/rust/target/debug/libtask_mosaic_app.so"

          taskapp_output="$RUNNER_TEMP/mosaic-qt-taskapp"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend qt --output "$taskapp_output" --emit-project --profile native-complete --runtime-library "$task_runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$taskapp_output/qt/mosaic-degradations.json"
          python3 code/scripts/taskapp_native_control_contract.py --backend qt --generated-dir "$taskapp_output/qt"
          cmake -S "$taskapp_output/qt" -B "$taskapp_output/qt/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$taskapp_output/install"
          cmake --build "$taskapp_output/qt/build" --config Release --parallel
          cmake --install "$taskapp_output/qt/build" --config Release
          installed_taskapp_runtime="$(find "$taskapp_output/install" -type f -name libmosaic_app.so -print -quit)"
          test -n "$installed_taskapp_runtime"
          cmp "$task_runtime_library" "$installed_taskapp_runtime"
          installed_taskapp="$(dirname "$installed_taskapp_runtime")/TaskApp"
          taskapp_log="$RUNNER_TEMP/mosaic-qt-taskapp-launch.log"
          set +e
          env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen timeout 5s "$installed_taskapp" >"$taskapp_log" 2>&1
          taskapp_status=$?
          set -e
          test "$taskapp_status" -eq 124
          ! grep -F "Mosaic Rust runtime unavailable" "$taskapp_log"
          ! grep -E "missing required MIL prop|ReferenceError|TypeError" "$taskapp_log"

          # Rebuild the exact generated shell with its compile-time acceptance
          # seam, force runtime loading to fail, and drive the emitted Try again
          # button. The probe exits successfully only after the second visible
          # failure, proving retry creates a fresh host instead of merely
          # checking source markers around a blank window.
          task_startup_source="$RUNNER_TEMP/mosaic-qt-taskapp-startup-conformance"
          cp -R "$taskapp_output/qt" "$task_startup_source"
          cmake -S "$task_startup_source" -B "$task_startup_source/startup-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-DMOSAIC_STARTUP_CONFORMANCE=1
          cmake --build "$task_startup_source/startup-build" --config Release --parallel
          task_startup_log="$RUNNER_TEMP/mosaic-qt-taskapp-startup.log"
          env QT_QPA_PLATFORM=offscreen \
            MOSAIC_APP_LIBRARY="$RUNNER_TEMP/does-not-exist/libtask_mosaic_app.so" \
            MOSAIC_APP_STATE_PATH="$RUNNER_TEMP/mosaic-qt-taskapp-startup-state.json" \
            timeout 10s "$task_startup_source/startup-build/TaskApp" >"$task_startup_log" 2>&1
          grep -F "Qt startup failure/retry conformance passed" "$task_startup_log"

          task_ui_source="$RUNNER_TEMP/mosaic-qt-taskapp-ui-conformance"
          cp -R "$taskapp_output/qt" "$task_ui_source"
          cp code/packages/rust/task-mosaic-app/conformance/qt/ui-main.cpp "$task_ui_source/main.cpp"
          cmake -S "$task_ui_source" -B "$task_ui_source/acceptance-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$task_ui_source/acceptance-build" --config Release --parallel
          task_ui_binary="$task_ui_source/acceptance-build/TaskApp"
          test -x "$task_ui_binary"
          task_state_path="$RUNNER_TEMP/mosaic-qt-taskapp-state.json"
          rm -f "$task_state_path" "$task_state_path.corrupt" "$task_state_path.tmp"
          env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen MOSAIC_APP_STATE_PATH="$task_state_path" \
            "$task_ui_binary"
          env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen MOSAIC_APP_STATE_PATH="$task_state_path" \
            MOSAIC_EXPECT_RESTORED=1 "$task_ui_binary"

          # ---- Journal: build, install and LAUNCH (J5a, #14416). --------------
          #
          # The first native host Journal runs in. Same shape as TaskApp above:
          # the strict standard binding (native-complete + runtime library), the
          # built runtime is the one installed, and the installed app must stay
          # up for five seconds without the runtime or a required prop missing.
          # It launches twice against one state file, so the second start
          # restores whatever the first saved. Journal raises no effects and
          # ships no host assets, so no harness files are needed.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p journal-mosaic-app
          journal_runtime_library="$(pwd)/code/packages/rust/target/debug/libjournal_mosaic_app.so"
          test -f "$journal_runtime_library"

          journal_output="$RUNNER_TEMP/mosaic-qt-journal"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/journal-app --backend qt --output "$journal_output" --emit-project --profile native-complete --runtime-library "$journal_runtime_library"
          jq -e '.replacedGeneratedFiles == []' "$journal_output/qt/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$journal_output/qt/mosaic-degradations.json"
          cmake -S "$journal_output/qt" -B "$journal_output/qt/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$journal_output/install"
          cmake --build "$journal_output/qt/build" --config Release --parallel
          cmake --install "$journal_output/qt/build" --config Release
          installed_journal_runtime="$(find "$journal_output/install" -type f -name libmosaic_app.so -print -quit)"
          test -n "$installed_journal_runtime"
          cmp "$journal_runtime_library" "$installed_journal_runtime"
          installed_journal="$(dirname "$installed_journal_runtime")/JournalApp"
          test -x "$installed_journal"
          journal_state_path="$RUNNER_TEMP/mosaic-qt-journal-state.json"
          rm -f "$journal_state_path" "$journal_state_path.corrupt" "$journal_state_path.tmp"
          for journal_launch in first restored; do
            journal_log="$RUNNER_TEMP/mosaic-qt-journal-launch-$journal_launch.log"
            set +e
            env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen MOSAIC_APP_STATE_PATH="$journal_state_path" \
              timeout 5s "$installed_journal" >"$journal_log" 2>&1
            journal_status=$?
            set -e
            cat "$journal_log"
            test "$journal_status" -eq 124
            # Explicit exits, not `! grep`: bash's `set -e` ignores a command
            # whose status is inverted with `!`, so a bare `! grep` that
            # matches would not fail this step.
            if grep -F "Mosaic Rust runtime unavailable" "$journal_log"; then exit 1; fi
            if grep -E "missing required MIL prop|ReferenceError|TypeError" "$journal_log"; then exit 1; fi
          done

          # Journal's own suite (the package opts out of the workspace).
          cargo test --manifest-path code/programs/mosaic/journal-app/Cargo.toml

          # ---- Engram: prove the Qt emission COMPILES. ------------------------
          #
          # Nothing compiled Engram's Qt output before this. Its own suite is
          # substring assertions over emitted text, so a project that could not
          # build would have looked entirely healthy.
          #
          # NOW --profile native-complete WITH --runtime-library, which the
          # comment here used to say was impossible.
          #
          # It was, and the reason is worth keeping: those flags switch the
          # generated main.cpp to the strict standard-binding shape, calling
          # registerTypes/requireRuntime/configureRequiredProps/attach, and
          # Engram used to replace MosaicHost.h/.cpp through [host_assets] with
          # its own engram-capi binding exposing props/handleEvent/ensureLoaded
          # instead. Combining them emitted a project that did not compile:
          #
          #   main.cpp:26: error: 'registerTypes' is not a member of 'MosaicHost'
          #
          # #13728 removed that override for Qt. Props, events, snapshot and
          # restore go through engram-mosaic-app and the generated binding now,
          # and the file dialogs ride Effect through [host_effects] (UI47 §5.5).
          # So the incoherent combination became the coherent one, and this lane
          # gates the configuration Engram will actually ship.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p engram-mosaic-app

          engram_output="$RUNNER_TEMP/mosaic-qt-engram"
          # `.so` and absolute, matching the TaskApp lane above: this job runs on
          # Linux, and `.dylib` would be a macOS-only path that fails here.
          engram_runtime_library="$(pwd)/code/packages/rust/target/debug/libengram_mosaic_app.so"
          test -f "$engram_runtime_library"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend qt --output "$engram_output" --emit-project --profile native-complete --runtime-library "$engram_runtime_library"

          # Empty, and pinned empty. This assertion used to name
          # ["MosaicHost.cpp", "MosaicHost.h"] precisely so #13728 could not be
          # forgotten -- updating it was the migration's definition of done
          # (UI47 §5.5.5). Pinned rather than dropped: a package that starts
          # overriding the generated host again has undone this, and that must
          # fail here rather than pass quietly.
          jq -e '.replacedGeneratedFiles == []' "$engram_output/qt/mosaic-degradations.json"

          # And native-complete means zero degradations, not merely few.
          # `type == "array"` first: `null | length` is 0 in jq, so a report that
          # lost the key entirely would satisfy a bare length check.
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$engram_output/qt/mosaic-degradations.json"

          # The handler is wired into the generated entry point, which is the
          # half a text assertion over the manifest cannot see.
          grep -q 'installEngramEffects(mosaicHost);' "$engram_output/qt/main.cpp"
          # Mosaic's Qt platform library (UI87 §7.4a) wraps it, routing the two
          # kinds Engram's manifest claims to it (UI87 §7.2), and is in the
          # build the cmake step below compiles.
          grep -qF 'installMosaicPlatformEffects(mosaicHost, QSet<QString>{QStringLiteral("importAnki"), QStringLiteral("exportAnki")});' "$engram_output/qt/main.cpp"
          grep -q 'MosaicHost.h MosaicPlatformEffects.cpp MosaicPlatformEffects.h)' "$engram_output/qt/CMakeLists.txt"

          # UI48 §7.10 (ENV2/ENV3): Engram is the one package with a layout
          # variant (EngramApp.touch.mll). Both roots must be in the QML
          # module, each its own type, and main.cpp must carry the selector, so
          # the build below proves they compile together. Each check names
          # itself when it fails.
          qt_layout_expect() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error::Qt layout variants: expected $3 -- '$2' is not in $1"
              exit 1
            fi
          }
          qt_layout_expect "$engram_output/qt/CMakeLists.txt" 'set_source_files_properties(EngramApp.touch.qml PROPERTIES QT_QML_SOURCE_TYPENAME EngramAppTouch)' "the touch root's QML type"
          qt_layout_expect "$engram_output/qt/CMakeLists.txt" 'qt_target_qml_sources(EngramApp QML_FILES EngramApp.touch.qml)' "the touch root in the module"
          qt_layout_expect "$engram_output/qt/EngramApp.touch.qml" 'required property var mosaicHost' "a strict touch root"
          qt_layout_expect "$engram_output/qt/main.cpp" '{"touch", "qrc:/qt/qml/Mosaic/EngramApp/EngramApp.touch.qml", {{"pointer", "coarse"}}},' "the conventional touch rule"
          qt_layout_expect "$engram_output/qt/main.cpp" 'if (!layoutSwitch->isActive()) layoutSwitch->start(0);' "the observer queueing the root switch"
          if grep -qF 'const QUrl url(QStringLiteral("qrc:/qt/qml/Mosaic/EngramApp/EngramApp.qml"));' "$engram_output/qt/main.cpp"; then
            echo "::error::Qt layout variants: main.cpp still mounts EngramApp.qml unconditionally"
            exit 1
          fi

          # The gate: it builds.
          cmake -S "$engram_output/qt" -B "$engram_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$engram_output/qt/build" --config Release --parallel

          # UI48 §7.10: the resize gate §7 asks for. The fixture has a default
          # and a `compact` layout; its harness compiles the generated main.cpp
          # verbatim, runs it offscreen, resizes the window across 600 logical
          # pixels and asserts the root swaps and keeps its props, so a shell
          # frozen on one layout fails here. No runtime: the sample shell's
          # host reports to nobody.
          layout_variants_output="$RUNNER_TEMP/mosaic-qt-layout-variants"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-qt/fixtures/layout-variants --backend qt --output "$layout_variants_output" --emit-project
          mv "$layout_variants_output/qt/main.cpp" "$layout_variants_output/qt/generated_main.cpp"
          cp code/packages/rust/mosaic-emit-qt/fixtures/layout-variants-test/main.cpp "$layout_variants_output/qt/main.cpp"
          cmake -S "$layout_variants_output/qt" -B "$layout_variants_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$layout_variants_output/qt/build" --config Release --parallel
          layout_variants_log="$RUNNER_TEMP/mosaic-qt-layout-variants.log"
          set +e
          env -u MOSAIC_APP_LIBRARY QT_QPA_PLATFORM=offscreen \
            timeout 60s "$layout_variants_output/qt/build/LayoutProbe" >"$layout_variants_log" 2>&1
          layout_variants_status=$?
          set -e
          cat "$layout_variants_log"
          if [ "$layout_variants_status" -ne 0 ]; then
            echo "::error::Qt layout-variant resize gate exited $layout_variants_status"
            exit 1
          fi
          qt_layout_expect "$layout_variants_log" 'Qt layout-variant resize gate passed' "the resize gate to pass"

          # Engram's own suite, which the parent workspace cannot reach: the
          # package opts OUT of it (`[workspace]` empty in its Cargo.toml), so
          # `cargo test` at the workspace root never sees these tests and the
          # epic's "changing Engram triggers executing verification" stayed
          # false even after the tests existed.
          #
          # `native_complete_gate.rs` is the one that matters here: it asserts
          # Engram lowers with ZERO capability degradations on all five native
          # backends, and pins the XAML style drops by property so a new one
          # cannot arrive unnoticed (#14132).
          #
          # That gate and the emission above now agree rather than needing to be
          # reconciled: this comment used to explain why Engram could reach
          # native-complete in capability analysis while failing it in project
          # emission, which was true only while the [host_assets] override
          # existed. It does not, for Qt, since #13728.
          cargo test --manifest-path code/programs/mosaic/engram-app/Cargo.toml

          toolkit_output="$RUNNER_TEMP/mosaic-qt-toolkit"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-toolkit --backend qt --output "$toolkit_output" --emit-project
          cmake -S "$toolkit_output/qt" -B "$toolkit_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$toolkit_output/qt/build" --config Release --parallel

          MOSAIC_APP_LIBRARY="$RUNNER_TEMP/mosaic-app-does-not-exist.so" \
            "$harness/build/mosaic_qt_runtime_conformance" --expect-required-failure

          strict_output="$RUNNER_TEMP/mosaic-qt-native-complete-rating-controls"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-rating-controls --backend qt --output "$strict_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$strict_output/qt/mosaic-degradations.json"
          cmake -S "$strict_output/qt" -B "$strict_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$strict_output/qt/build" --config Release --parallel

          slider_output="$RUNNER_TEMP/mosaic-qt-host-slider"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-qt/fixtures/host-slider --backend qt --output "$slider_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$slider_output/qt/mosaic-degradations.json"
          cmake -S "$slider_output/qt" -B "$slider_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$slider_output/qt/build" --config Release --parallel

          # UI29-6 (#15481) slice K-qt: HostNavigationSplit lowers to a
          # real Qt Quick Controls SplitView. Qt's static-collapse limitation
          # stays visible on the non-gating behavior axis; the nested fixture
          # also proves collapse: never adds no second entry.
          navigation_split_output="$RUNNER_TEMP/mosaic-qt-host-navigation-split"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-qt/fixtures/host-navigation-split --backend qt --output "$navigation_split_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0) and ([.behaviorDegradations[].code] == ["interaction.navigation-split-collapse-static"])' "$navigation_split_output/qt/mosaic-degradations.json"
          grep -q 'SplitView {' "$navigation_split_output/qt/Shell.qml"
          grep -q 'Accessible.role: Accessible.Pane' "$navigation_split_output/qt/Shell.qml"
          cmake -S "$navigation_split_output/qt" -B "$navigation_split_output/qt/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$navigation_split_output/qt/build" --config Release --parallel

          # #15833 -- and now measure it, because none of the above could.
          #
          # The greps and the cmake build all passed for months against a
          # split that laid out to 0 x 0 and drew nothing at any window size:
          # `Layout.fillWidth` is inert outside a Layout, QML warns about it
          # in silence, and a component that measures nothing still compiles
          # perfectly. This loads the generated QML at a known window size and
          # asserts the split fills it and the detail area is real.
          cp code/scripts/qt-navigation-split-render-check.qml "$navigation_split_output/qt/"
          (
            cd "$navigation_split_output/qt"
            QT_QPA_PLATFORM=offscreen qml qt-navigation-split-render-check.qml
          )

          # qt_main_with_startup_states (this PR) made every native-complete Qt
          # shell keep a missing/failed runtime visible in the window and
          # retryable instead of exiting, so RatingControls no longer exits
          # non-zero here either. Rebuild it with the same compile-time
          # acceptance seam TaskApp's startup probe uses above: it self-drives
          # two attempts and only exits (0) once the second failure is
          # observed, proving the missing-runtime path is actually reached
          # and recovered rather than merely not crashing.
          strict_startup_source="$RUNNER_TEMP/mosaic-qt-rating-controls-startup-conformance"
          cp -R "$strict_output/qt" "$strict_startup_source"
          cmake -S "$strict_startup_source" -B "$strict_startup_source/startup-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-DMOSAIC_STARTUP_CONFORMANCE=1
          cmake --build "$strict_startup_source/startup-build" --config Release --parallel
          strict_log="$RUNNER_TEMP/mosaic-qt-native-complete-missing-runtime.log"
          env QT_QPA_PLATFORM=offscreen \
            MOSAIC_APP_LIBRARY="$RUNNER_TEMP/mosaic-app-does-not-exist.so" \
            timeout 15s "$strict_startup_source/startup-build/RatingControls" >"$strict_log" 2>&1
          grep -F "Qt startup failure/retry conformance passed" "$strict_log"

      - name: Round-trip Rust engine through standard Flutter binding
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get install -y libgtk-3-dev xvfb
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          runtime_library="$(pwd)/code/packages/rust/target/debug/libmosaic_app_conformance.so"
          bundled_output="$RUNNER_TEMP/mosaic-flutter-bundled-conformance"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-app-conformance/package --backend flutter --output "$bundled_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$bundled_output/flutter/mosaic-degradations.json"
          (
            cd "$bundled_output/flutter"
            flutter create --platforms=linux --project-name mosaic_flutter_runtime_conformance .
            flutter pub get
            flutter analyze
            flutter build linux --debug
          )

          installed="$(find "$bundled_output/flutter/build/linux" -type f -path '*/bundle/mosaic_flutter_runtime_conformance' -perm -111 -print -quit)"
          test -n "$installed"
          bundled_runtime="$(find "$(dirname "$installed")" -type f -name 'libmosaic_app.so' -print -quit)"
          test -n "$bundled_runtime"
          cmp "$runtime_library" "$bundled_runtime"

          mkdir -p "$bundled_output/flutter/bin"
          sed 's|package:mosaic_flutter_runtime_conformance/mosaic_host.dart|package:mosaic_counter/mosaic_host.dart|' \
            code/packages/rust/mosaic-app-bindings/conformance/flutter/bin/conformance.dart \
            > "$bundled_output/flutter/bin/mosaic_runtime_conformance.dart"
          (
            cd "$bundled_output/flutter"
            unset MOSAIC_APP_LIBRARY
            state_path="$RUNNER_TEMP/mosaic-flutter-runtime-state.json"
            rm -f "$state_path" "$state_path.corrupt" "$state_path.tmp"
            dart analyze bin/mosaic_runtime_conformance.dart
            MOSAIC_APP_STATE_PATH="$state_path" dart run bin/mosaic_runtime_conformance.dart
            MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_RESTORED=1 \
              dart run bin/mosaic_runtime_conformance.dart
            printf '{}' > "$state_path"
            MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_PERSISTENCE_WARNING=1 \
              dart run bin/mosaic_runtime_conformance.dart
          )

          cargo build --manifest-path code/packages/rust/Cargo.toml -p task-mosaic-app
          task_runtime_library="$(pwd)/code/packages/rust/target/debug/libtask_mosaic_app.so"
          taskapp_output="$RUNNER_TEMP/mosaic-flutter-taskapp"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend flutter --output "$taskapp_output" --emit-project --profile native-complete --runtime-library "$task_runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$taskapp_output/flutter/mosaic-degradations.json"
          python3 code/scripts/taskapp_native_control_contract.py --backend flutter --generated-dir "$taskapp_output/flutter"
          (
            cd "$taskapp_output/flutter"
            flutter create --platforms=linux --project-name mosaic_taskapp_acceptance .
            flutter pub get
            flutter analyze
            flutter build linux --debug
          )

          installed_taskapp="$(find "$taskapp_output/flutter/build/linux" -type f -path '*/bundle/mosaic_taskapp_acceptance' -perm -111 -print -quit)"
          test -n "$installed_taskapp"
          bundled_taskapp_runtime="$(find "$(dirname "$installed_taskapp")" -type f -name 'libmosaic_app.so' -print -quit)"
          test -n "$bundled_taskapp_runtime"
          cmp "$task_runtime_library" "$bundled_taskapp_runtime"
          taskapp_log="$RUNNER_TEMP/mosaic-flutter-taskapp-launch.log"
          set +e
          env -u MOSAIC_APP_LIBRARY bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" timeout 8s "$installed_taskapp" >"$taskapp_log" 2>&1
          taskapp_status=$?
          set -e
          test "$taskapp_status" -eq 124
          ! grep -F "Mosaic Rust runtime unavailable" "$taskapp_log"
          ! grep -E "Unhandled Exception|MissingPluginException|NoSuchMethodError|TypeError" "$taskapp_log"

          mkdir -p "$taskapp_output/flutter/bin"
          cp code/packages/rust/task-mosaic-app/conformance/flutter/task_app_conformance.dart \
            "$taskapp_output/flutter/bin/task_app_conformance.dart"
          cp code/packages/rust/task-mosaic-app/conformance/flutter/widget_test.dart \
            "$taskapp_output/flutter/test/task_app_lifecycle_test.dart"
          (
            cd "$taskapp_output/flutter"
            unset MOSAIC_APP_LIBRARY
            host_state_path="$RUNNER_TEMP/mosaic-flutter-taskapp-host-state.json"
            rm -f "$host_state_path" "$host_state_path.corrupt" "$host_state_path.tmp"
            MOSAIC_APP_STATE_PATH="$host_state_path" dart run bin/task_app_conformance.dart
            MOSAIC_APP_STATE_PATH="$host_state_path" MOSAIC_EXPECT_RESTORED=1 \
              dart run bin/task_app_conformance.dart
            ui_state_path="$RUNNER_TEMP/mosaic-flutter-taskapp-ui-state.json"
            rm -f "$ui_state_path" "$ui_state_path.corrupt" "$ui_state_path.tmp"
            MOSAIC_APP_STATE_PATH="$ui_state_path" flutter test test/task_app_lifecycle_test.dart
            MOSAIC_APP_STATE_PATH="$ui_state_path" MOSAIC_EXPECT_RESTORED=1 \
              flutter test test/task_app_lifecycle_test.dart
            # UI87 §7.7: on Linux the platform library asks before a save
            # replaces a file (GTK's chooser, as file_selector opens it, does
            # not). Drive that "Replace it?" dialog with the widget tester.
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-app-bindings/conformance/flutter-replace-dialog/replace_dialog_test.dart" \
              test/mosaic_replace_dialog_test.dart
            flutter test test/mosaic_replace_dialog_test.dart
          )

          # UI29-1 §3.3: every HostDialog lowers to _MosaicDialogHost, which
          # pushes its own DialogRoute (never showDialog, whose windowing path
          # breaks macOS AOT builds). Drive the helper, exactly as emitted,
          # with the widget tester: one dialog per open, one close per open,
          # and no other route popped or left behind.
          MOSAIC_REQUIRE_FLUTTER=1 cargo test --manifest-path code/packages/rust/mosaic-emit-flutter/Cargo.toml \
            --test flutter_dialog_host -- --nocapture

          # UI87 §7.7: every Flutter app gets Mosaic's platform library
          # (files.open / files.save and the router), installed on each started
          # host right after it is assigned. The TaskApp build above compiled
          # and analysed its file_selector dialogs; this runs the rest -- the
          # plain-Dart core, exactly as generated -- headless on the Dart VM
          # with a fake host and fake dialogs.
          python3 - "$taskapp_output/flutter/lib/main.dart" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          assert "import 'mosaic_platform_effects.dart';" in text, "the platform library is never imported"
          assign = text.index("_mosaicHost = host;")
          install = text.index("installMosaicPlatformEffects(host, appKinds: null);")
          props = text.index("host.setPropsChangedHandler")
          assert assign < install < props, "the platform library is not installed on the started host"
          PY
          platform_harness="$RUNNER_TEMP/mosaic-flutter-platform-effects"
          rm -rf "$platform_harness"
          cp -R code/packages/rust/mosaic-app-bindings/conformance/flutter-platform-effects "$platform_harness"
          mkdir -p "$platform_harness/lib"
          cp "$taskapp_output/flutter/lib/mosaic_host.dart" \
            "$taskapp_output/flutter/lib/mosaic_platform_effects_core.dart" \
            "$platform_harness/lib/"
          (
            cd "$platform_harness"
            dart pub get
            dart analyze --fatal-infos
            dart run bin/conformance.dart | tee "$RUNNER_TEMP/mosaic-flutter-platform-effects.log"
          )
          grep -F "Mosaic Flutter platform effects conformance passed" "$RUNNER_TEMP/mosaic-flutter-platform-effects.log"

          strict_output="$RUNNER_TEMP/mosaic-flutter-native-complete-rating-controls"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-rating-controls --backend flutter --output "$strict_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$strict_output/flutter/mosaic-degradations.json"
          (
            cd "$strict_output/flutter"
            flutter pub get
            flutter analyze
          )

          slider_output="$RUNNER_TEMP/mosaic-flutter-host-slider"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/host-slider --backend flutter --output "$slider_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$slider_output/flutter/mosaic-degradations.json"
          (
            cd "$slider_output/flutter"
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/host-slider-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          navigation_split_output="$RUNNER_TEMP/mosaic-flutter-host-navigation-split"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/host-navigation-split --backend flutter --output "$navigation_split_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0) and (.behaviorDegradations | length == 1) and .behaviorDegradations[0].code == "interaction.navigation-split-collapse-static"' "$navigation_split_output/flutter/mosaic-degradations.json"
          (
            cd "$navigation_split_output/flutter"
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/host-navigation-split-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          pinned_navigation_split_output="$RUNNER_TEMP/mosaic-flutter-host-navigation-split-never"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/host-navigation-split-never --backend flutter --output "$pinned_navigation_split_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0) and (.behaviorDegradations | length == 0)' "$pinned_navigation_split_output/flutter/mosaic-degradations.json"
          (
            cd "$pinned_navigation_split_output/flutter"
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/host-navigation-split-never-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          nested_conditional_output="$RUNNER_TEMP/mosaic-flutter-nested-row-conditional"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/nested-row-conditional --backend flutter --output "$nested_conditional_output" --emit-project
          (
            cd "$nested_conditional_output/flutter"
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/nested-row-conditional-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          # UI48 §7.9 (ENV2/ENV3): the resize gate §7 asks for. The fixture has
          # a default and a `compact` layout; its widget test changes the
          # window's size across 600 logical pixels and asserts the root
          # swaps, so a shell frozen on one layout fails here.
          layout_variants_output="$RUNNER_TEMP/mosaic-flutter-layout-variants"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/layout-variants --backend flutter --output "$layout_variants_output" --emit-project
          (
            cd "$layout_variants_output/flutter"
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/layout-variants-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          toolkit_output="$RUNNER_TEMP/mosaic-flutter-toolkit"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-toolkit --backend flutter --output "$toolkit_output" --emit-project
          (
            cd "$toolkit_output/flutter"
            flutter create --platforms=linux --project-name mosaic_toolkit_acceptance .
            flutter pub get
            flutter analyze
            flutter test
            flutter build linux --debug
          )

          drag_output="$RUNNER_TEMP/mosaic-flutter-drag-board"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/drag-board --backend flutter --output "$drag_output" --emit-project
          (
            cd "$drag_output/flutter"
            flutter create --platforms=linux --project-name mosaic_drag_board .
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/drag-board-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          table_output="$RUNNER_TEMP/mosaic-flutter-data-grid"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-flutter/fixtures/data-grid --backend flutter --output "$table_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$table_output/flutter/mosaic-degradations.json"
          (
            cd "$table_output/flutter"
            flutter create --platforms=linux --project-name mosaic_data_grid_acceptance .
            cp "$GITHUB_WORKSPACE/code/packages/rust/mosaic-emit-flutter/fixtures/data-grid-test/widget_test.dart" test/widget_test.dart
            flutter pub get
            flutter analyze
            flutter test test/widget_test.dart
          )

          # Engram on Flutter, the mirror of the Qt, SwiftUI and Compose Engram
          # lanes.
          #
          # This block is what was missing. `engram-app` was not in the Flutter
          # acceptance set, so nothing ever emitted Engram on this backend with
          # `--profile native-complete` -- and when something finally did, it
          # did not compile: the hand-written `mosaic_host.dart` overrode the
          # generated host without defining `loadRequired`, which the
          # native-complete `main.dart` calls. The lane was green throughout,
          # because it built task-app.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p engram-mosaic-app
          engram_runtime_library="$(pwd)/code/packages/rust/target/debug/libengram_mosaic_app.so"
          test -f "$engram_runtime_library"
          engram_output="$RUNNER_TEMP/mosaic-flutter-engram"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend flutter --output "$engram_output" --emit-project --profile native-complete --runtime-library "$engram_runtime_library"

          # Pinned empty, exactly as the Qt, SwiftUI and Compose Engram lanes
          # pin it: the `mosaic_host.dart` override is retired, and a package
          # that starts overriding the generated host again has undone that and
          # must fail here rather than pass quietly.
          jq -e '.replacedGeneratedFiles == []' "$engram_output/flutter/mosaic-degradations.json"
          # `type == "array"` first: `null | length` is 0 in jq, so a report
          # that lost the key entirely would satisfy a bare length check.
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$engram_output/flutter/mosaic-degradations.json"

          # The handler is wired into the generated app, and wired in the one
          # place that works.
          #
          # A grep for `installEngramEffects(` is not enough on its own: Dart
          # compiles everything under `lib/`, so the handler file ships and
          # compiles whether or not anything calls it, and an install that
          # landed in the wrong scope would still satisfy the grep while the
          # first symptom at runtime is an `Await` going unanswered. So the
          # import and the call site are both checked, and the call is required
          # to come after the fresh local host is assigned to app state.
          python3 - "$engram_output/flutter/lib/main.dart" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          assert "import 'engram_effects.dart';" in text, "handler is never imported"
          assign = text.index("_mosaicHost = host;")
          install = text.index("installEngramEffects(host);")
          assert install > assign, "handler is installed before the host exists"
          PY

          # UI48 §7.9 (ENV2/ENV3): Engram is the one package with a layout
          # variant (EngramApp.touch.mll). Both roots and the selector must be
          # in lib/, so the analyze and build below prove they coexist.
          grep -q '^class EngramAppTouch extends StatelessWidget {$' "$engram_output/flutter/lib/EngramApp.touch.dart"
          if grep -q '^sealed class EngramAppEvent' "$engram_output/flutter/lib/EngramApp.touch.dart"; then exit 1; fi
          grep -q "^import 'EngramApp.touch.dart';$" "$engram_output/flutter/lib/main.dart"
          grep -q 'switch (mosaicLayoutVariant(environment))' "$engram_output/flutter/lib/main.dart"
          grep -q 'return EngramAppTouch($' "$engram_output/flutter/lib/main.dart"

          (
            cd "$engram_output/flutter"
            flutter create --platforms=linux --project-name mosaic_engram_app .
            flutter pub get
            flutter analyze
            flutter build linux --debug
          )

      - name: Round-trip Rust engine through standard Compose binding
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          runtime_library="$(pwd)/code/packages/rust/target/debug/libmosaic_app_conformance.so"

          bundled_output="$RUNNER_TEMP/mosaic-compose-bundled-conformance"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-app-conformance/package --backend compose --output "$bundled_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$bundled_output/compose/mosaic-degradations.json"
          gradle --no-daemon --stacktrace -Pcompose.desktop.packaging.checkJdkVendor=false -p "$bundled_output/compose" compileKotlin createDistributable
          installed_runtime="$(find "$bundled_output/compose/build/compose/binaries/main/app" -path '*/resources/libmosaic_app.so' -print -quit)"
          test -n "$installed_runtime"
          cmp "$runtime_library" "$installed_runtime"

          harness="$RUNNER_TEMP/mosaic-compose-runtime-conformance"
          cp -R code/packages/rust/mosaic-app-bindings/conformance/compose "$harness"
          cp "$bundled_output/compose/src/main/kotlin/MosaicRuntimeHost.kt" "$harness/src/main/kotlin/MosaicRuntimeHost.kt"

          unset MOSAIC_APP_LIBRARY
          state_path="$RUNNER_TEMP/mosaic-compose-runtime-state.json"
          rm -f "$state_path" "$state_path.corrupt" "$state_path.tmp"
          MOSAIC_APP_STATE_PATH="$state_path" \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_runtime")" \
            gradle --no-daemon --stacktrace -p "$harness" run
          MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_RESTORED=1 \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_runtime")" \
            gradle --no-daemon --stacktrace -p "$harness" run
          printf '{}' > "$state_path"
          MOSAIC_APP_STATE_PATH="$state_path" MOSAIC_EXPECT_PERSISTENCE_WARNING=1 \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_runtime")" \
            gradle --no-daemon --stacktrace -p "$harness" run

          cargo build --manifest-path code/packages/rust/Cargo.toml -p task-mosaic-app
          task_runtime_library="$(pwd)/code/packages/rust/target/debug/libtask_mosaic_app.so"
          taskapp_output="$RUNNER_TEMP/mosaic-compose-taskapp"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend compose --output "$taskapp_output" --emit-project --profile native-complete --runtime-library "$task_runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$taskapp_output/compose/mosaic-degradations.json"
          python3 code/scripts/taskapp_native_control_contract.py --backend compose --generated-dir "$taskapp_output/compose"
          gradle --no-daemon --stacktrace -Pcompose.desktop.packaging.checkJdkVendor=false -p "$taskapp_output/compose" compileKotlin createDistributable
          installed_taskapp_runtime="$(find "$taskapp_output/compose/build/compose/binaries/main/app" -path '*/resources/libmosaic_app.so' -print -quit)"
          test -n "$installed_taskapp_runtime"
          cmp "$task_runtime_library" "$installed_taskapp_runtime"
          installed_taskapp="$(find "$taskapp_output/compose/build/compose/binaries/main/app" -type f -path '*/bin/task_app' -perm -111 -print -quit)"
          test -n "$installed_taskapp"
          taskapp_log="$RUNNER_TEMP/mosaic-compose-taskapp-launch.log"
          set +e
          env -u MOSAIC_APP_LIBRARY bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" timeout 8s "$installed_taskapp" >"$taskapp_log" 2>&1
          taskapp_status=$?
          set -e
          test "$taskapp_status" -eq 124
          ! grep -F "Mosaic Rust runtime unavailable" "$taskapp_log"
          ! grep -E "missing required MIL prop|Exception in thread|NoClassDefFoundError|UnsatisfiedLinkError" "$taskapp_log"

          task_host_harness="$RUNNER_TEMP/mosaic-compose-taskapp-runtime-conformance"
          cp -R code/packages/rust/task-mosaic-app/conformance/compose "$task_host_harness"
          cp "$taskapp_output/compose/src/main/kotlin/MosaicRuntimeHost.kt" "$task_host_harness/MosaicRuntimeHost.kt"
          mkdir -p "$task_host_harness/src/main/kotlin"
          mv "$task_host_harness/Conformance.kt" "$task_host_harness/src/main/kotlin/Conformance.kt"
          mv "$task_host_harness/MosaicRuntimeHost.kt" "$task_host_harness/src/main/kotlin/MosaicRuntimeHost.kt"
          rm -f "$task_host_harness/TaskAppUiTest.kt"
          host_state_path="$RUNNER_TEMP/mosaic-compose-taskapp-host-state.json"
          rm -f "$host_state_path" "$host_state_path.corrupt" "$host_state_path.tmp"
          MOSAIC_APP_STATE_PATH="$host_state_path" \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_taskapp_runtime")" \
            gradle --no-daemon --stacktrace -p "$task_host_harness" run
          MOSAIC_APP_STATE_PATH="$host_state_path" MOSAIC_EXPECT_RESTORED=1 \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_taskapp_runtime")" \
            gradle --no-daemon --stacktrace -p "$task_host_harness" run

          mkdir -p "$taskapp_output/compose/src/test/kotlin"
          cp code/packages/rust/task-mosaic-app/conformance/compose/TaskAppUiTest.kt \
            "$taskapp_output/compose/src/test/kotlin/TaskAppUiTest.kt"
          taskapp_ui_state="$RUNNER_TEMP/mosaic-compose-taskapp-ui-state.json"
          rm -f "$taskapp_ui_state" "$taskapp_ui_state.corrupt" "$taskapp_ui_state.tmp"
          MOSAIC_APP_STATE_PATH="$taskapp_ui_state" \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_taskapp_runtime")" \
            bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" gradle --no-daemon --stacktrace -p "$taskapp_output/compose" \
              test --tests TaskAppUiTest
          MOSAIC_APP_STATE_PATH="$taskapp_ui_state" MOSAIC_EXPECT_RESTORED=1 \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_taskapp_runtime")" \
            bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" gradle --no-daemon --stacktrace --rerun-tasks -p "$taskapp_output/compose" \
              test --tests TaskAppUiTest.generatedControlsDriveRustSchedulingLifecycle

          # Engram on Compose, the mirror of the SwiftUI and Qt Engram lanes.
          #
          # `.so`, not `.dylib`: this block is Linux-gated, unlike the SwiftUI
          # one.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p engram-mosaic-app
          engram_runtime_library="$(pwd)/code/packages/rust/target/debug/libengram_mosaic_app.so"
          test -f "$engram_runtime_library"
          engram_output="$RUNNER_TEMP/mosaic-compose-engram"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend compose --output "$engram_output" --emit-project --profile native-complete --runtime-library "$engram_runtime_library"

          # Pinned empty, exactly as the Qt and SwiftUI lanes pin it: Compose's
          # `MosaicHost.kt` override is retired, and a package that starts
          # overriding the generated host again has undone that and must fail
          # here rather than pass quietly.
          jq -e '.replacedGeneratedFiles == []' "$engram_output/compose/mosaic-degradations.json"
          # `type == "array"` first: `null | length` is 0 in jq, so a report that
          # lost the key entirely would satisfy a bare length check.
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$engram_output/compose/mosaic-degradations.json"

          # The handler is wired into the generated app. This is the half no
          # assertion over a source file can reach -- and as on SwiftUI it
          # matters more than on Qt, because Gradle compiles everything under
          # `src/main/kotlin`, so an uninstalled handler still compiles, links
          # and ships with no diagnostic at all. The failure only appears at
          # runtime, when an unanswered `Await` disables snapshot and restore
          # for the rest of the process.
          grep -q 'installEngramEffects(it)' "$engram_output/compose/src/main/kotlin/Main.kt"
          python3 - "$engram_output/compose/src/main/kotlin/Main.kt" <<'PY'
          import sys

          text = open(sys.argv[1]).read()
          install = text.index("installEngramEffects(it)")

          # After the host exists and before the loader returns it: installing
          # onto a host that has not been loaded yet would not compile, while
          # returning the host first would let the initial composition raise
          # effects before the handler is attached.
          creation = text.index("val mosaicHost =")
          assert creation < install, "install must follow the host's creation"
          returned = text.index("return mosaicHost", creation)
          assert install < returned, "install must precede returning the host"
          PY

          # UI48 §7.5 (ENV2/ENV3): Engram is the one package with a layout
          # variant (EngramApp.touch.mll). Both roots and the selector must be
          # in the source set, so the compile below proves they coexist.
          grep -q '^fun EngramAppTouch($' "$engram_output/compose/src/main/kotlin/EngramApp.touch.kt"
          if grep -q '^sealed class EngramAppEvent' "$engram_output/compose/src/main/kotlin/EngramApp.touch.kt"; then exit 1; fi
          grep -q 'when (mosaicLayoutVariant(environmentReport))' "$engram_output/compose/src/main/kotlin/MosaicAppShell.kt"
          grep -q '"touch" -> EngramAppTouch(' "$engram_output/compose/src/main/kotlin/MosaicAppShell.kt"

          # The gate: it builds. `compileKotlin` is enough -- this lane already
          # exercises `createDistributable` on task-app, and what is new here is
          # the handler source, not the packaging.
          gradle --no-daemon --stacktrace -p "$engram_output/compose" compileKotlin

          # ---- Journal: emit and COMPILE on Compose (J5b, #14416). -----------
          # Same gate as Engram above, minus the effects handler Journal does
          # not have.
          cargo build --manifest-path code/packages/rust/Cargo.toml -p journal-mosaic-app
          journal_runtime_library="$(pwd)/code/packages/rust/target/debug/libjournal_mosaic_app.so"
          test -f "$journal_runtime_library"
          journal_output="$RUNNER_TEMP/mosaic-compose-journal"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/journal-app --backend compose --output "$journal_output" --emit-project --profile native-complete --runtime-library "$journal_runtime_library"
          jq -e '.replacedGeneratedFiles == []' "$journal_output/compose/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | type == "array" and length == 0)' "$journal_output/compose/mosaic-degradations.json"
          gradle --no-daemon --stacktrace -Pcompose.desktop.packaging.checkJdkVendor=false -p "$journal_output/compose" compileKotlin createDistributable
          installed_journal_runtime="$(find "$journal_output/compose/build/compose/binaries/main/app" -path '*/resources/libmosaic_app.so' -print -quit)"
          test -n "$installed_journal_runtime"
          cmp "$journal_runtime_library" "$installed_journal_runtime"

          # Drive the generated app, not just compile it (J5, #14416):
          # JournalUiTest writes and saves entries through the generated
          # editor, then a second launch on the same state file must find the
          # survivor. Same two-launch shape as TaskAppUiTest above.
          mkdir -p "$journal_output/compose/src/test/kotlin"
          cp code/packages/rust/journal-mosaic-app/conformance/compose/JournalUiTest.kt \
            "$journal_output/compose/src/test/kotlin/JournalUiTest.kt"
          journal_ui_state="$RUNNER_TEMP/mosaic-compose-journal-ui-state.json"
          rm -f "$journal_ui_state" "$journal_ui_state.corrupt" "$journal_ui_state.tmp"
          MOSAIC_APP_STATE_PATH="$journal_ui_state" \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_journal_runtime")" \
            bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" gradle --no-daemon --stacktrace -p "$journal_output/compose" \
              test --tests JournalUiTest
          MOSAIC_APP_STATE_PATH="$journal_ui_state" MOSAIC_EXPECT_RESTORED=1 \
            JAVA_TOOL_OPTIONS="-Dcompose.application.resources.dir=$(dirname "$installed_journal_runtime")" \
            bash "$GITHUB_WORKSPACE/code/scripts/run-under-xvfb.sh" gradle --no-daemon --stacktrace --rerun-tasks -p "$journal_output/compose" \
              test --tests JournalUiTest

          # The platform library's own behaviour (UI87 §7): every Compose app
          # gets MosaicFileEffects.kt and MosaicPlatformEffects.kt, and this
          # drives their open/save logic, limits, routing and the asynchronous
          # picker path (UI89 §3.8) with fakes -- no display needed.
          cp code/packages/rust/mosaic-app-bindings/conformance/compose/MosaicPlatformEffectsTest.kt \
            "$journal_output/compose/src/test/kotlin/MosaicPlatformEffectsTest.kt"
          gradle --no-daemon --stacktrace -p "$journal_output/compose" \
            test --tests MosaicPlatformEffectsTest

          toolkit_output="$RUNNER_TEMP/mosaic-compose-toolkit"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-toolkit --backend compose --output "$toolkit_output" --emit-project
          gradle --no-daemon --stacktrace -p "$toolkit_output/compose" compileKotlin

          slider_output="$RUNNER_TEMP/mosaic-compose-host-slider"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-compose/tests/fixtures/host-slider-package --backend compose --output "$slider_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$slider_output/compose/mosaic-degradations.json"
          gradle --no-daemon --stacktrace -p "$slider_output/compose" compileKotlin

          navigation_split_output="$RUNNER_TEMP/mosaic-compose-host-navigation-split"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-compose/tests/fixtures/host-navigation-split-package --backend compose --output "$navigation_split_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0) and (.behaviorDegradations | length == 0)' "$navigation_split_output/compose/mosaic-degradations.json"
          gradle --no-daemon --stacktrace -p "$navigation_split_output/compose" compileKotlin

          strict_output="$RUNNER_TEMP/mosaic-compose-native-complete-rating-controls"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-rating-controls --backend compose --output "$strict_output" --emit-project --profile native-complete --runtime-library "$runtime_library"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$strict_output/compose/mosaic-degradations.json"
          gradle --no-daemon --stacktrace -p "$strict_output/compose" compileKotlin

      # UI89 step 4: the Compose build of TaskApp above also wrote
      # compose/android/, an Android project over the same shared Kotlin, with
      # its own activity and the Android half of the platform seams. Gate: it
      # builds a debug APK that carries the app's identity, launches
      # MosaicActivity, and compiled the shared sources. The Rust runtime
      # joins in step 5, and the emulator with it.
      - name: Build Trestle for Android (UI89 step 4)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          android_project="$RUNNER_TEMP/mosaic-compose-taskapp/compose/android"
          test -f "$android_project/src/main/kotlin/mosaic/android/MosaicActivity.kt"
          test -f "$android_project/src/main/kotlin/TaskApp.kt"
          test ! -e "$android_project/src/main/kotlin/Main.kt"
          # UI89 §3.8: the platform library's shared half, and Android's own
          # half in place of the desktop's AWT dialogs.
          test -f "$android_project/src/main/kotlin/MosaicFileEffects.kt"
          if ! grep -q 'class MosaicAndroidDocumentPicker' "$android_project/src/main/kotlin/MosaicPlatformEffects.kt"; then
            echo "::error::the Android project's MosaicPlatformEffects.kt is not Android's"
            exit 1
          fi
          if grep -rl 'java\.awt' "$android_project/src"; then
            echo "::error::desktop-only AWT reached the Android sources"
            exit 1
          fi

          # The project names its Gradle in gradle-wrapper.properties. Write
          # the wrapper's jar with whatever Gradle is installed, in
          # an empty directory so that Gradle never configures the Android
          # plugin it may not support.
          gradle_version="$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' "$android_project/gradle/wrapper/gradle-wrapper.properties")"
          test -n "$gradle_version"
          wrapper_seed="$RUNNER_TEMP/mosaic-android-gradle-wrapper"
          rm -rf "$wrapper_seed"
          mkdir -p "$wrapper_seed"
          touch "$wrapper_seed/settings.gradle.kts"
          gradle --no-daemon -q -p "$wrapper_seed" wrapper --gradle-version "$gradle_version"
          cp "$wrapper_seed/gradle/wrapper/gradle-wrapper.jar" "$android_project/gradle/wrapper/gradle-wrapper.jar"
          # Refuse to run a wrapper jar that is not the one Gradle published.
          bash code/scripts/verify-gradle-wrapper-jar.sh "$android_project/gradle/wrapper/gradle-wrapper.jar"
          # Run the verified jar itself, with gradlew's JVM options, rather
          # than the generated gradlew script: Gradle publishes no checksum for
          # the script, so it is the one part of the wrapper nothing can
          # verify. Naming the main class (not `-jar`) works with every
          # Gradle's wrapper jar, including old ones without a Main-Class.
          (
            cd "$android_project"
            "${JAVA_HOME:+$JAVA_HOME/bin/}java" -Xmx64m -Xms64m -Dorg.gradle.appname=gradlew \
              -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
              --no-daemon --stacktrace assembleDebug
          )

          apk="$(find "$android_project/build/outputs/apk/debug" -name '*.apk' -print -quit)"
          test -n "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$aapt2"
          badging="$RUNNER_TEMP/mosaic-trestle-android-badging.txt"
          "$aapt2" dump badging "$apk" > "$badging"
          # Every check names what it wanted and shows what it got: a bare
          # `grep -q` under `set -e` fails the step without saying which line.
          expect_badging() {
            if ! grep -Eq "$1" "$badging"; then
              echo "::error::the APK's badging has no line matching $1"
              cat "$badging"
              exit 1
            fi
          }
          expect_badging "^package: name='dev\.codingadventures\.trestle'"
          expect_badging "^application-label:'Trestle'"
          expect_badging "^launchable-activity: name='mosaic\.android\.MosaicActivity'"
          # aapt prints `sdkVersion:`, newer aapt2 `minSdkVersion:`.
          expect_badging "^(min)?[sS]dkVersion:'26'"
          expect_badging "^targetSdkVersion:'36'"
          # The shared sources and the Android seams are in the dex, and JNA
          # brought its dispatcher for the emulator's ABI.
          dex="$RUNNER_TEMP/mosaic-trestle-android-dex"
          rm -rf "$dex"
          unzip -q -o "$apk" 'classes*.dex' 'lib/*' -d "$dex"
          for class in 'Lmosaic/android/MosaicActivity;' 'LTaskAppKt;' 'LMosaicAppShellKt;' 'LMosaicRuntimeHost;' 'LMosaicPlatformKt;' \
            'LMosaicPlatformRouter;' 'LMosaicFileEffectsKt;' 'LMosaicAndroidDocumentPicker;'; do
            if ! grep -a -q -F "$class" "$dex"/classes*.dex; then
              echo "::error::no $class in the APK's dex"
              ls -l "$dex"
              exit 1
            fi
          done
          if ! test -f "$dex/lib/x86_64/libjnidispatch.so"; then
            echo "::error::no lib/x86_64/libjnidispatch.so in the APK"
            find "$dex/lib" -type f
            exit 1
          fi

      # UI89 step 5: the Android app carries its Rust runtime. The TaskApp
      # engine is built for every Android ABI with cargo-ndk
      # (build-mosaic-android-libs.sh), handed to the Compose build as
      # --runtime-library, and installed into the Android project's jniLibs.
      # Gate: the APK carries libmosaic_app.so for all four ABIs, and each one
      # exports mosaic_app_create. The emulator launch follows.
      - name: Build Trestle for Android with its Rust runtime (UI89 step 5)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::this runner has no Android NDK (ANDROID_NDK_LATEST_HOME / ANDROID_NDK_HOME)"
            exit 1
          fi
          export ANDROID_NDK_HOME="$ndk"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk --version 4.1.2

          jni_libs="$RUNNER_TEMP/mosaic-trestle-jnilibs"
          bash code/scripts/build-mosaic-android-libs.sh task-mosaic-app "$jni_libs"

          output="$RUNNER_TEMP/mosaic-compose-taskapp-android-runtime"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend compose --output "$output" --emit-project --profile native-complete --runtime-library "$jni_libs"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$output/compose/mosaic-degradations.json"
          android_project="$output/compose/android"
          # Trestle's instrumented UI test (UI89 §4.4) lives with the app, as
          # the desktop TaskAppUiTest does; the emulator step runs it.
          mkdir -p "$android_project/src/androidTest/kotlin"
          cp code/packages/rust/task-mosaic-app/conformance/compose-android/TrestleAndroidUiTest.kt "$android_project/src/androidTest/kotlin/"

          # The wrapper, written outside the project as in the step above.
          gradle_version="$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' "$android_project/gradle/wrapper/gradle-wrapper.properties")"
          test -n "$gradle_version"
          wrapper_seed="$RUNNER_TEMP/mosaic-android-runtime-gradle-wrapper"
          rm -rf "$wrapper_seed"
          mkdir -p "$wrapper_seed"
          touch "$wrapper_seed/settings.gradle.kts"
          gradle --no-daemon -q -p "$wrapper_seed" wrapper --gradle-version "$gradle_version"
          cp "$wrapper_seed/gradle/wrapper/gradle-wrapper.jar" "$android_project/gradle/wrapper/gradle-wrapper.jar"
          # Refuse to run a wrapper jar that is not the one Gradle published.
          bash code/scripts/verify-gradle-wrapper-jar.sh "$android_project/gradle/wrapper/gradle-wrapper.jar"
          # Run the verified jar itself, with gradlew's JVM options, rather
          # than the generated gradlew script: Gradle publishes no checksum for
          # the script, so it is the one part of the wrapper nothing can
          # verify. Naming the main class (not `-jar`) works with every
          # Gradle's wrapper jar, including old ones without a Main-Class.
          (
            cd "$android_project"
            "${JAVA_HOME:+$JAVA_HOME/bin/}java" -Xmx64m -Xms64m -Dorg.gradle.appname=gradlew \
              -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
              --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
          )
          test_apk="$(find "$android_project/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$test_apk"

          apk="$(find "$android_project/build/outputs/apk/debug" -name '*.apk' -print -quit)"
          test -n "$apk"
          unpacked="$RUNNER_TEMP/mosaic-trestle-android-runtime-apk"
          rm -rf "$unpacked"
          unzip -q -o "$apk" 'lib/*' -d "$unpacked"
          llvm_nm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$llvm_nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            library="$unpacked/lib/$abi/libmosaic_app.so"
            if ! test -f "$library"; then
              echo "::error::the APK has no lib/$abi/libmosaic_app.so"
              find "$unpacked/lib" -type f
              exit 1
            fi
            symbols="$RUNNER_TEMP/mosaic-trestle-$abi-symbols.txt"
            "$llvm_nm" -D --defined-only "$library" > "$symbols"
            if ! grep -Eq ' T mosaic_app_create$' "$symbols"; then
              echo "::error::lib/$abi/libmosaic_app.so does not export mosaic_app_create"
              head -n 40 "$symbols"
              exit 1
            fi
          done

      # UI89 step 7 (§3.9): Journal is the second app on Android. Its engine
      # is built for every ABI and packaged exactly as Trestle's above; the
      # APK is assembled through the same verified wrapper jar, by
      # assemble-mosaic-android-debug.sh. Gate: native-complete with no
      # degradations, Journal's own identity in the badging, and
      # libmosaic_app.so exporting mosaic_app_create for each ABI.
      - name: Build Journal for Android with its Rust runtime (UI89 step 7)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::this runner has no Android NDK (ANDROID_NDK_LATEST_HOME / ANDROID_NDK_HOME)"
            exit 1
          fi
          export ANDROID_NDK_HOME="$ndk"
          # Both no-ops after the Trestle step; kept so this step stands alone.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk --version 4.1.2

          jni_libs="$RUNNER_TEMP/mosaic-journal-jnilibs"
          rm -rf "$jni_libs"
          bash code/scripts/build-mosaic-android-libs.sh journal-mosaic-app "$jni_libs"

          output="$RUNNER_TEMP/mosaic-compose-journal-android-runtime"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/journal-app --backend compose --output "$output" --emit-project --profile native-complete --runtime-library "$jni_libs"
          jq -e '.replacedGeneratedFiles == []' "$output/compose/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$output/compose/mosaic-degradations.json"
          android_project="$output/compose/android"
          # Journal's instrumented UI test (UI89 §4.2) lives with the app, as
          # the desktop JournalUiTest does; the emulator step runs it.
          mkdir -p "$android_project/src/androidTest/kotlin"
          cp code/packages/rust/journal-mosaic-app/conformance/compose-android/JournalAndroidUiTest.kt "$android_project/src/androidTest/kotlin/"
          bash code/scripts/assemble-mosaic-android-debug.sh "$android_project" --with-android-test
          test_apk="$(find "$android_project/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$test_apk"

          apk="$(find "$android_project/build/outputs/apk/debug" -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$aapt2"
          badging="$RUNNER_TEMP/mosaic-journal-android-badging.txt"
          "$aapt2" dump badging "$apk" > "$badging"
          expect_badging() {
            if ! grep -Eq "$1" "$badging"; then
              echo "::error::Journal's APK badging has no line matching $1"
              cat "$badging"
              exit 1
            fi
          }
          # The defaults Journal's manifest leaves in place (UI89 §3.9).
          expect_badging "^package: name='dev\.codingadventures\.journalapp'"
          expect_badging "^application-label:'JournalApp'"
          expect_badging "^launchable-activity: name='mosaic\.android\.MosaicActivity'"
          # aapt prints `sdkVersion:`, newer aapt2 `minSdkVersion:`.
          expect_badging "^(min)?[sS]dkVersion:'26'"
          expect_badging "^targetSdkVersion:'36'"

          unpacked="$RUNNER_TEMP/mosaic-journal-android-runtime-apk"
          rm -rf "$unpacked"
          unzip -q -o "$apk" 'classes*.dex' 'lib/*' -d "$unpacked"
          for class in 'LJournalAppKt;' 'LMosaicRuntimeHost;' 'Lmosaic/android/MosaicActivity;'; do
            if ! grep -a -q -F "$class" "$unpacked"/classes*.dex; then
              echo "::error::no $class in Journal's dex"
              exit 1
            fi
          done
          if ! test -f "$unpacked/lib/x86_64/libjnidispatch.so"; then
            echo "::error::Journal's APK has no lib/x86_64/libjnidispatch.so"
            find "$unpacked/lib" -type f
            exit 1
          fi
          llvm_nm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$llvm_nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            library="$unpacked/lib/$abi/libmosaic_app.so"
            if ! test -f "$library"; then
              echo "::error::Journal's APK has no lib/$abi/libmosaic_app.so"
              find "$unpacked/lib" -type f
              exit 1
            fi
            symbols="$RUNNER_TEMP/mosaic-journal-$abi-symbols.txt"
            "$llvm_nm" -D --defined-only "$library" > "$symbols"
            if ! grep -Eq ' T mosaic_app_create$' "$symbols"; then
              echo "::error::Journal's lib/$abi/libmosaic_app.so does not export mosaic_app_create"
              head -n 40 "$symbols"
              exit 1
            fi
          done

      # UI89 step 7 (§3.10): Engram is the third app on Android, built and
      # checked exactly as Journal's above. Its touch layout variant reaches
      # the Android project with the default one. Its Anki import and export
      # are its own `compose-android` [host_effects] handler (§3.12), which
      # MosaicActivity installs ahead of the platform library and which must
      # reach the dex; the desktop handler (EngramEffectsKt) must not.
      - name: Build Engram for Android with its Rust runtime (UI89 step 7)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::this runner has no Android NDK (ANDROID_NDK_LATEST_HOME / ANDROID_NDK_HOME)"
            exit 1
          fi
          export ANDROID_NDK_HOME="$ndk"
          # Both no-ops after the steps above; kept so this step stands alone.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk --version 4.1.2

          jni_libs="$RUNNER_TEMP/mosaic-engram-jnilibs"
          rm -rf "$jni_libs"
          bash code/scripts/build-mosaic-android-libs.sh engram-mosaic-app "$jni_libs"

          output="$RUNNER_TEMP/mosaic-compose-engram-android-runtime"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/engram-app --backend compose --output "$output" --emit-project --profile native-complete --runtime-library "$jni_libs"
          jq -e '.replacedGeneratedFiles == []' "$output/compose/mosaic-degradations.json"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$output/compose/mosaic-degradations.json"
          android_project="$output/compose/android"
          # Installed as the host loads, before the platform library, which
          # wraps it and routes the kinds it claims to it (UI89 §3.12).
          grep -q -F 'installEngramAndroidEffects(it); platformRouter = installMosaicPlatformEffects(it, documentPicker, setOf("importAnki", "exportAnki"))' \
            "$android_project/src/main/kotlin/mosaic/android/MosaicActivity.kt"
          # Engram's instrumented UI test (UI89 §4.4) answers the document
          # picker itself; the emulator step runs it.
          mkdir -p "$android_project/src/androidTest/kotlin"
          cp code/programs/mosaic/engram-app/conformance/compose-android/EngramAndroidUiTest.kt "$android_project/src/androidTest/kotlin/"
          bash code/scripts/assemble-mosaic-android-debug.sh "$android_project" --with-android-test
          test_apk="$(find "$android_project/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$test_apk"

          apk="$(find "$android_project/build/outputs/apk/debug" -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$aapt2"
          badging="$RUNNER_TEMP/mosaic-engram-android-badging.txt"
          "$aapt2" dump badging "$apk" > "$badging"
          expect_badging() {
            if ! grep -Eq "$1" "$badging"; then
              echo "::error::Engram's APK badging has no line matching $1"
              cat "$badging"
              exit 1
            fi
          }
          # The defaults Engram's manifest leaves in place (UI89 §3.10).
          expect_badging "^package: name='dev\.codingadventures\.engramapp'"
          expect_badging "^application-label:'EngramApp'"
          expect_badging "^launchable-activity: name='mosaic\.android\.MosaicActivity'"
          # aapt prints `sdkVersion:`, newer aapt2 `minSdkVersion:`.
          expect_badging "^(min)?[sS]dkVersion:'26'"
          expect_badging "^targetSdkVersion:'36'"

          unpacked="$RUNNER_TEMP/mosaic-engram-android-runtime-apk"
          rm -rf "$unpacked"
          unzip -q -o "$apk" 'classes*.dex' 'lib/*' -d "$unpacked"
          # Engram's own Android handler, which MosaicActivity installs
          # (UI89 §3.12): its class and its install function.
          for class in 'LEngramAppKt;' 'LMosaicRuntimeHost;' 'Lmosaic/android/MosaicActivity;' 'LEngramAndroidEffectsKt;' 'installEngramAndroidEffects'; do
            if ! grep -a -q -F "$class" "$unpacked"/classes*.dex; then
              echo "::error::no $class in Engram's dex"
              exit 1
            fi
          done
          # The desktop Anki handler stays out (UI89 §3.10, §3.12): its
          # Swing dialogs are not Android's. Both its class and its install
          # function are looked for, so a renamed file or an added
          # `@file:JvmName` cannot slip past; neither is a substring of the
          # Android handler's names. grep's exit is read whole: 1 is
          # "absent", anything else (no dex, unreadable) is a failure, never
          # a pass.
          for needle in 'LEngramEffectsKt;' 'installEngramEffects'; do
            found=0
            grep -a -q -F "$needle" "$unpacked"/classes*.dex || found=$?
            if [ "$found" -eq 0 ]; then
              echo "::error::Engram's desktop effect handler ($needle) reached the Android dex"
              exit 1
            fi
            if [ "$found" -ne 1 ]; then
              echo "::error::could not scan Engram's dex for $needle (grep exit $found)"
              exit 1
            fi
          done
          if ! test -f "$unpacked/lib/x86_64/libjnidispatch.so"; then
            echo "::error::Engram's APK has no lib/x86_64/libjnidispatch.so"
            find "$unpacked/lib" -type f
            exit 1
          fi
          llvm_nm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$llvm_nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            library="$unpacked/lib/$abi/libmosaic_app.so"
            if ! test -f "$library"; then
              echo "::error::Engram's APK has no lib/$abi/libmosaic_app.so"
              find "$unpacked/lib" -type f
              exit 1
            fi
            symbols="$RUNNER_TEMP/mosaic-engram-$abi-symbols.txt"
            "$llvm_nm" -D --defined-only "$library" > "$symbols"
            if ! grep -Eq ' T mosaic_app_create$' "$symbols"; then
              echo "::error::Engram's lib/$abi/libmosaic_app.so does not export mosaic_app_create"
              head -n 40 "$symbols"
              exit 1
            fi
          done

      # UI89 §7 (step 8): Trestle through the Flutter backend, on Android. The
      # same per-ABI engines the Compose APK packages go into a Flutter phone
      # runtime (android/<abi>/libmosaic_app.so). hook/build.dart bundles the
      # one each ABI's build asks for. `flutter create` uses the command the
      # generated README derives from the manifest. Gate: allowBackup is
      # false, and the APK carries each packaged ABI's own engine (its ELF
      # machine and exported symbols equal the input's), x86_64 (the
      # emulator's) and arm64-v8a among them. The emulator step
      # below then runs it through the same gate as the Compose APK.
      - name: Build Trestle for Android with Flutter (UI89 §7)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true' && needs.detect.outputs.needs_mosaic_flutter_runtime == 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Built by "Build Trestle for Android with its Rust runtime" above.
          jni_libs="$RUNNER_TEMP/mosaic-trestle-jnilibs"
          test -d "$jni_libs"
          phone_runtime="$RUNNER_TEMP/mosaic-trestle-flutter-phone-runtime"
          rm -rf "$phone_runtime"
          mkdir -p "$phone_runtime"
          cp -R "$jni_libs" "$phone_runtime/android"
          output="$RUNNER_TEMP/mosaic-flutter-trestle-android"
          rm -rf "$output"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend flutter --output "$output" --emit-project --profile native-complete --runtime-library "$phone_runtime"
          jq -e '.nativeComplete == true and (.degradations | length == 0)' "$output/flutter/mosaic-degradations.json"
          cd "$output/flutter"
          # The README's command, from the manifest's identity (UI89 §7.1).
          grep -qxF '    flutter create --platforms=android --org dev.codingadventures --project-name trestle .' README.md
          flutter create --platforms=android --org dev.codingadventures --project-name trestle .
          # State stays on the device, as with Compose's manifest (UI89 §7.5).
          manifest=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup=' "$manifest"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$manifest"
          else
            sed -i 's/<application/<application android:allowBackup="false"/' "$manifest"
          fi
          test "$(grep -c 'android:allowBackup="false"' "$manifest")" = 1
          flutter pub get
          # What path_provider's implementations resolved to (UI89 §7.4).
          grep -A3 -E '^  path_provider(_android|_foundation|_platform_interface)?:' pubspec.lock
          flutter analyze
          flutter build apk --debug
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/mosaic-flutter-trestle-manifest.txt"
          grep -Eq 'allowBackup\(0x01010280\)=false' "$RUNNER_TEMP/mosaic-flutter-trestle-manifest.txt"
          unpacked="$RUNNER_TEMP/mosaic-flutter-trestle-apk"
          rm -rf "$unpacked"
          unzip -q -o "$apk" 'lib/*' -d "$unpacked"
          # Each packaged library is that ABI's engine, never another's. Not
          # byte-for-byte: the Android Gradle plugin strips debug symbols as it
          # packages native libraries, so the APK's copy differs from the input
          # (in the section headers). Its ELF machine and its exported symbols
          # survive stripping, so those must equal the input's, with
          # mosaic_app_create among them.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          # One test per line: `set -e` ignores a failure left of `&&`.
          test -n "$ndk"
          test -d "$ndk"
          llvm_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$llvm_bin/llvm-nm"
          test -x "$llvm_bin/llvm-readelf"
          packaged=0
          for library in "$unpacked"/lib/*/libmosaic_app.so; do
            abi="$(basename "$(dirname "$library")")"
            input="$jni_libs/$abi/libmosaic_app.so"
            test -f "$input"
            for file in "$library" "$input"; do
              "$llvm_bin/llvm-readelf" -h "$file" | grep -E '^ +Machine:' > "$file.machine"
              "$llvm_bin/llvm-nm" -D --defined-only "$file" > "$file.symbols"
            done
            diff "$library.machine" "$input.machine"
            diff "$library.symbols" "$input.symbols"
            grep -Eq ' T mosaic_app_create$' "$library.symbols"
            rm -f "$input.machine" "$input.symbols"
            packaged=$((packaged + 1))
          done
          test "$packaged" -ge 2
          for abi in x86_64 arm64-v8a; do
            test -f "$unpacked/lib/$abi/libmosaic_app.so"
          done

      # UI89 step 5, second half, and step 7: the APKs above run. An x86_64
      # emulator boots headless under KVM, and mosaic-android-emulator-gate.sh
      # installs Trestle, then Journal, then Engram, launches each one's MosaicActivity
      # three times and requires that it writes its state under filesDir,
      # restores it, quarantines state the runtime refuses, and is still
      # running ten seconds after each launch.
      - name: Launch Trestle, Journal and Engram on an Android emulator (UI89 steps 5, 7)
        if: runner.os == 'Linux' && needs.detect.outputs.needs_mosaic_compose_runtime == 'true'
        shell: bash
        # Each app's gate, then each one's UI test in two cold launches (§4),
        # then the Flutter Trestle's gate (§7) when its lane built it.
        timeout-minutes: 55
        env:
          MOSAIC_FLUTTER_LANE: ${{ needs.detect.outputs.needs_mosaic_flutter_runtime }}
        run: |
          set -euo pipefail
          # Let the runner's user open /dev/kvm (GitHub's documented recipe).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          apk="$(find "$RUNNER_TEMP/mosaic-compose-taskapp-android-runtime/compose/android/build/outputs/apk/debug" -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          emulator_log="$RUNNER_TEMP/mosaic-android-emulator.log"
          # However the step ends: stop the emulator, and on failure show why.
          finish() {
            local status=$?
            adb emu kill > /dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              echo "---- emulator log ----"
              tail -n 80 "$emulator_log" || true
              df -h "$RUNNER_TEMP" "$HOME" || true
            fi
          }
          trap finish EXIT
          bash code/scripts/start-mosaic-android-emulator.sh "$emulator_log"
          bash code/scripts/mosaic-android-emulator-gate.sh "$apk" dev.codingadventures.trestle task-app
          # Then a person's use of it (UI89 §4.4): add, complete, reopen and
          # delete a task through the generated controls, and find a saved
          # task again after a cold relaunch.
          trestle_test_apk="$(find "$RUNNER_TEMP/mosaic-compose-taskapp-android-runtime/compose/android/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$trestle_test_apk"
          bash code/scripts/mosaic-android-ui-test.sh "$apk" "$trestle_test_apk" dev.codingadventures.trestle dev.codingadventures.trestle.uitest.TrestleAndroidUiTest

          journal_apk="$(find "$RUNNER_TEMP/mosaic-compose-journal-android-runtime/compose/android/build/outputs/apk/debug" -name '*-debug.apk' -print -quit)"
          test -n "$journal_apk"
          bash code/scripts/mosaic-android-emulator-gate.sh "$journal_apk" dev.codingadventures.journalapp journal-app
          # Then a person's use of it (UI89 §4.2): write, save and delete
          # entries through the generated controls, and find the survivor
          # again after a cold relaunch.
          journal_test_apk="$(find "$RUNNER_TEMP/mosaic-compose-journal-android-runtime/compose/android/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$journal_test_apk"
          bash code/scripts/mosaic-android-ui-test.sh "$journal_apk" "$journal_test_apk" dev.codingadventures.journalapp dev.codingadventures.journalapp.uitest.JournalAndroidUiTest

          engram_apk="$(find "$RUNNER_TEMP/mosaic-compose-engram-android-runtime/compose/android/build/outputs/apk/debug" -name '*-debug.apk' -print -quit)"
          test -n "$engram_apk"
          bash code/scripts/mosaic-android-emulator-gate.sh "$engram_apk" dev.codingadventures.engramapp engram-app
          # Then Anki export and import through the document picker, which
          # the test answers with a file in the app's cache (UI89 §4.4), and
          # the imported deck again after a cold relaunch.
          engram_test_apk="$(find "$RUNNER_TEMP/mosaic-compose-engram-android-runtime/compose/android/build/outputs/apk/androidTest/debug" -name '*-debug-androidTest.apk' -print -quit)"
          test -n "$engram_test_apk"
          bash code/scripts/mosaic-android-ui-test.sh "$engram_apk" "$engram_test_apk" dev.codingadventures.engramapp dev.codingadventures.engramapp.uitest.EngramAndroidUiTest

          # Trestle through Flutter (UI89 §7.5), built by its own step when the
          # Flutter lane runs. Same gate, launched through Flutter's
          # .MainActivity. The Compose Trestle has the same package, so it
          # is uninstalled first: neither its data nor its signing key carry
          # over.
          if [ "$MOSAIC_FLUTTER_LANE" = true ]; then
            flutter_apk="$RUNNER_TEMP/mosaic-flutter-trestle-android/flutter/build/app/outputs/flutter-apk/app-debug.apk"
            test -f "$flutter_apk"
            adb uninstall dev.codingadventures.trestle > /dev/null
            bash code/scripts/mosaic-android-emulator-gate.sh "$flutter_apk" dev.codingadventures.trestle task-app .MainActivity
          fi

      - name: Build concrete Mosaic TaskApp WinUI shell
        if: runner.os == 'Windows' && needs.detect.outputs.needs_mosaic_xaml_windows == 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance -p task-mosaic-app
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic Rust application builds failed with exit code $LASTEXITCODE"
          }
          $library = Resolve-Path 'code/packages/rust/target/debug/mosaic_app_conformance.dll'
          $taskLibrary = Resolve-Path 'code/packages/rust/target/debug/task_mosaic_app.dll'

          $output = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-taskapp'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/programs/mosaic/task-app --backend xaml --output $output --emit-project --profile native-complete --runtime-library $taskLibrary.Path
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML generation failed with exit code $LASTEXITCODE"
          }
          python3 code/scripts/mosaic_xaml_windows_ci_acceptance.py --validate-taskapp-report (Join-Path $output 'xaml/mosaic-degradations.json')
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML degradation validation failed with exit code $LASTEXITCODE"
          }
          python3 code/scripts/taskapp_native_control_contract.py --backend xaml --generated-dir (Join-Path $output 'xaml')
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML emitted-control contract failed with exit code $LASTEXITCODE"
          }

          $project = Join-Path $output 'xaml/TaskApp.csproj'
          $binaryLog = Join-Path $output 'xaml/TaskApp.binlog'
          Push-Location (Split-Path -Parent $project)
          Write-Host "Using .NET SDK $(dotnet --version) selected by generated global.json"
          dotnet build (Split-Path -Leaf $project) -c Debug -p:Platform=x64 --nologo "-bl:$binaryLog"
          $buildExitCode = $LASTEXITCODE
          Pop-Location
          if ($buildExitCode -ne 0) {
            Get-ChildItem -Path (Join-Path $output 'xaml/obj') -Filter 'output.json' -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName
            }
            throw "TaskApp WinUI build failed with exit code $buildExitCode"
          }
          $executable = Get-ChildItem -Path (Join-Path $output 'xaml/bin') -Filter 'TaskApp.exe' -Recurse -File | Select-Object -First 1
          if ($null -eq $executable) {
            throw 'TaskApp WinUI build did not produce TaskApp.exe'
          }
          $installedTaskRuntime = Join-Path $executable.DirectoryName 'mosaic_app.dll'
          if (!(Test-Path $installedTaskRuntime)) {
            throw 'TaskApp WinUI build did not copy mosaic_app.dll beside TaskApp.exe'
          }
          $taskSourceHash = (Get-FileHash $taskLibrary.Path -Algorithm SHA256).Hash
          $taskInstalledHash = (Get-FileHash $installedTaskRuntime -Algorithm SHA256).Hash
          if ($taskSourceHash -ne $taskInstalledHash) {
            throw 'TaskApp WinUI runtime bytes differ from task-mosaic-app.dll'
          }
          Write-Host "Built generated WinUI executable at $($executable.FullName)"

          # Launch the app and assert the SCREEN reacts to a real event.
          #
          # The runtime-conformance harness below asserts on the component
          # object's properties, which passes even when the app is broken --
          # props do reach the object. Three shipped defects were green under
          # that arrangement: a startup crash (missing PRI), a UI frozen after
          # first render (x:Bind defaulting to OneTime), and every row button
          # emitting no Content. Each was caught only by a human looking at the
          # window. This is that check, automated.
          #
          # UI Automation does not need a foreground window, so no interactive
          # desktop session is required.
          $env:MOSAIC_APP_STATE_PATH = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-taskapp-ui-state.json'
          Remove-Item $env:MOSAIC_APP_STATE_PATH, "$($env:MOSAIC_APP_STATE_PATH).corrupt", "$($env:MOSAIC_APP_STATE_PATH).tmp" -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File code/scripts/taskapp-xaml-startup-smoke.ps1 `
            -ExePath $executable.FullName `
            -RuntimePath $installedTaskRuntime
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML recoverable-startup smoke failed with exit code $LASTEXITCODE"
          }
          Remove-Item $env:MOSAIC_APP_STATE_PATH, "$($env:MOSAIC_APP_STATE_PATH).corrupt", "$($env:MOSAIC_APP_STATE_PATH).tmp" -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -ExecutionPolicy Bypass -File code/scripts/taskapp-xaml-smoke.ps1 -ExePath $executable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML smoke test failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:MOSAIC_APP_STATE_PATH -ErrorAction SilentlyContinue

          $taskHarness = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-taskapp-runtime-conformance'
          New-Item -ItemType Directory -Path $taskHarness -Force | Out-Null
          Copy-Item 'code/packages/rust/task-mosaic-app/conformance/xaml/*' $taskHarness -Recurse
          Copy-Item (Join-Path $output 'xaml/MosaicRuntimeHost.cs') (Join-Path $taskHarness 'MosaicRuntimeHost.cs')
          $taskHarnessProject = Join-Path $taskHarness 'TaskAppXamlRuntimeConformance.csproj'
          dotnet build $taskHarnessProject -c Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML runtime conformance build failed with exit code $LASTEXITCODE"
          }
          $taskHarnessBinary = Get-ChildItem -Path (Join-Path $taskHarness 'bin') -Filter 'TaskAppXamlRuntimeConformance.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $taskHarnessBinary) {
            throw 'TaskApp XAML runtime conformance build did not produce TaskAppXamlRuntimeConformance.dll'
          }
          Copy-Item $taskLibrary.Path (Join-Path $taskHarnessBinary.DirectoryName 'mosaic_app.dll')
          Remove-Item Env:MOSAIC_APP_LIBRARY -ErrorAction SilentlyContinue
          $env:MOSAIC_APP_STATE_PATH = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-taskapp-state.json'
          Remove-Item $env:MOSAIC_APP_STATE_PATH, "$($env:MOSAIC_APP_STATE_PATH).corrupt", "$($env:MOSAIC_APP_STATE_PATH).tmp" -Force -ErrorAction SilentlyContinue
          dotnet $taskHarnessBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML Rust runtime conformance failed with exit code $LASTEXITCODE"
          }
          $env:MOSAIC_EXPECT_RESTORED = '1'
          dotnet $taskHarnessBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "TaskApp XAML persisted-restart conformance failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:MOSAIC_EXPECT_RESTORED -ErrorAction SilentlyContinue
          Remove-Item Env:MOSAIC_APP_STATE_PATH -ErrorAction SilentlyContinue

          $strictOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-native-complete-rating-controls'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-rating-controls --backend xaml --output $strictOutput --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "Native-complete XAML generation failed with exit code $LASTEXITCODE"
          }
          $strictReport = Get-Content (Join-Path $strictOutput 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$strictReport.nativeComplete -or $strictReport.degradations.Count -ne 0) {
            throw 'Native-complete XAML generation reported degradations'
          }
          $strictProject = Join-Path $strictOutput 'xaml/RatingControls.csproj'
          Push-Location (Split-Path -Parent $strictProject)
          dotnet build (Split-Path -Leaf $strictProject) -c Debug -p:Platform=x64 --nologo
          $strictBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($strictBuildExitCode -ne 0) {
            throw "Native-complete XAML WinUI build failed with exit code $strictBuildExitCode"
          }

          $sliderOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-host-slider'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-xaml/fixtures/host-slider --backend xaml --output $sliderOutput --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "Native-complete XAML HostSlider generation failed with exit code $LASTEXITCODE"
          }
          $sliderReport = Get-Content (Join-Path $sliderOutput 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$sliderReport.nativeComplete -or $sliderReport.degradations.Count -ne 0) {
            throw 'Native-complete XAML HostSlider generation reported degradations'
          }
          $sliderProject = Join-Path $sliderOutput 'xaml/Volume.csproj'
          Push-Location (Split-Path -Parent $sliderProject)
          dotnet build (Split-Path -Leaf $sliderProject) -c Debug -p:Platform=x64 --nologo
          $sliderBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($sliderBuildExitCode -ne 0) {
            throw "Native-complete XAML HostSlider WinUI build failed with exit code $sliderBuildExitCode"
          }

          # UI86 (#15463): HostButton `selected` lowers to a generated Button
          # subclass with a SelectionItem automation peer. Emitter tests prove
          # the markup; this proves WinUI compiles it, for every value shape.
          $selectedOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-host-selected-button'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-xaml/fixtures/host-selected-button --backend xaml --output $selectedOutput --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "Native-complete XAML HostButton selected generation failed with exit code $LASTEXITCODE"
          }
          $selectedReport = Get-Content (Join-Path $selectedOutput 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$selectedReport.nativeComplete -or $selectedReport.degradations.Count -ne 0) {
            throw 'Native-complete XAML HostButton selected generation reported degradations'
          }
          $selectedProject = Join-Path $selectedOutput 'xaml/Picker.csproj'
          Push-Location (Split-Path -Parent $selectedProject)
          dotnet build (Split-Path -Leaf $selectedProject) -c Debug -p:Platform=x64 --nologo
          $selectedBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($selectedBuildExitCode -ne 0) {
            throw "Native-complete XAML HostButton selected WinUI build failed with exit code $selectedBuildExitCode"
          }

          # UI29-6 (#15481) slice K-xaml: HostNavigationSplit lowers to
          # NavigationView. The fixture nests an adaptive split inside a
          # pinned one, so the XAML compiler checks both collapse modes,
          # both title shapes, and a NavigationView living inside another
          # NavigationView's content.
          $navSplitOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-host-navigation-split'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-xaml/fixtures/host-navigation-split --backend xaml --output $navSplitOutput --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "Native-complete XAML HostNavigationSplit generation failed with exit code $LASTEXITCODE"
          }
          $navSplitReport = Get-Content (Join-Path $navSplitOutput 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$navSplitReport.nativeComplete -or $navSplitReport.degradations.Count -ne 0) {
            throw 'Native-complete XAML HostNavigationSplit generation reported degradations'
          }
          $navSplitProject = Join-Path $navSplitOutput 'xaml/Shell.csproj'
          Push-Location (Split-Path -Parent $navSplitProject)
          dotnet build (Split-Path -Leaf $navSplitProject) -c Debug -p:Platform=x64 --nologo
          $navSplitBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($navSplitBuildExitCode -ne 0) {
            throw "Native-complete XAML HostNavigationSplit WinUI build failed with exit code $navSplitBuildExitCode"
          }

          $bundledOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-bundled-conformance'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-app-conformance/package --backend xaml --output $bundledOutput --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled XAML conformance generation failed with exit code $LASTEXITCODE"
          }
          $bundledReport = Get-Content (Join-Path $bundledOutput 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$bundledReport.nativeComplete -or $bundledReport.degradations.Count -ne 0) {
            throw 'Bundled XAML conformance generation reported degradations'
          }
          $bundledProject = Join-Path $bundledOutput 'xaml/Counter.csproj'
          Push-Location (Split-Path -Parent $bundledProject)
          dotnet build (Split-Path -Leaf $bundledProject) -c Release -p:Platform=x64 --nologo
          $bundledBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($bundledBuildExitCode -ne 0) {
            throw "Bundled XAML WinUI build failed with exit code $bundledBuildExitCode"
          }
          $installedRuntime = Get-ChildItem -Path (Join-Path $bundledOutput 'xaml/bin') -Filter 'mosaic_app.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $installedRuntime) {
            throw 'Bundled XAML build did not copy mosaic_app.dll beside the executable'
          }
          $sourceHash = (Get-FileHash $library.Path -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $installedRuntime.FullName -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) {
            throw 'Bundled XAML runtime bytes differ from the selected Rust engine'
          }

          $toolkitOutput = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-toolkit'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/mosaic/mosaic-pkg-toolkit --backend xaml --output $toolkitOutput --emit-project
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic toolkit XAML generation failed with exit code $LASTEXITCODE"
          }
          $toolkitProject = Join-Path $toolkitOutput 'xaml/Accordion.csproj'
          Push-Location (Split-Path -Parent $toolkitProject)
          dotnet build (Split-Path -Leaf $toolkitProject) -c Debug -p:Platform=x64 --nologo
          $toolkitBuildExitCode = $LASTEXITCODE
          Pop-Location
          if ($toolkitBuildExitCode -ne 0) {
            throw "Complete Mosaic toolkit XAML build failed with exit code $toolkitBuildExitCode"
          }

      # UI48 ENV2/ENV3 on XAML (§7.11) -- the resize gate. The fixture has a
      # default layout and a `compact` one selected by convention (under 600
      # effective pixels); its interface is two of the conformance runtime's
      # props, so the native-complete window runs against that runtime and
      # mounts every root strictly. The source contract below checks both
      # controls share one event union and the window carries the selector;
      # the WinUI build compiles both roots; the smoke resizes the real window
      # across the threshold both ways and requires the root to swap with the
      # runtime's props on it. Linux cannot run WinUI, so this lane is where
      # the switch is exercised.
      - name: Resize the WinUI layout-variants fixture (UI48 §7.11)
        if: runner.os == 'Windows' && needs.detect.outputs.needs_mosaic_xaml_windows == 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic Rust conformance app build failed with exit code $LASTEXITCODE"
          }
          $library = Resolve-Path 'code/packages/rust/target/debug/mosaic_app_conformance.dll'
          $output = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-layout-variants'
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- pkg code/packages/rust/mosaic-emit-xaml/fixtures/layout-variants --backend xaml --output $output --emit-project --profile native-complete --runtime-library $library.Path
          if ($LASTEXITCODE -ne 0) {
            throw "XAML layout-variants generation failed with exit code $LASTEXITCODE"
          }
          $report = Get-Content (Join-Path $output 'xaml/mosaic-degradations.json') -Raw | ConvertFrom-Json
          if (!$report.nativeComplete -or $report.degradations.Count -ne 0) {
            throw 'XAML layout-variants generation reported degradations'
          }
          if (Test-Path (Join-Path $output 'xaml/LayoutProbe.compact.Event.cs')) {
            throw 'The compact layout declared an event union of its own'
          }
          $compactCode = Get-Content (Join-Path $output 'xaml/LayoutProbe.compact.xaml.cs') -Raw
          if (-not $compactCode.Contains('public event EventHandler<LayoutProbeEvent>? Dispatch;')) {
            throw 'The compact control does not raise the default layout''s LayoutProbeEvent'
          }
          $window = Get-Content (Join-Path $output 'xaml/MainWindow.xaml.cs') -Raw
          foreach ($marker in @(
              '("compact", new[] { ("sizeClass", "compact") }),',
              'var root = new LayoutProbeCompact();',
              'MosaicRuntimeHost.ApplyRequiredProps(next, RequiredProps);',
              'this.layoutSwitchQueued = this.DispatcherQueue.TryEnqueue(SwitchLayout);',
              'if (MosaicRuntimeHost.IsSettling)')) {
            if (-not $window.Contains($marker)) {
              throw "MainWindow.xaml.cs is missing the layout switch: $marker"
            }
          }
          $project = Join-Path $output 'xaml/LayoutProbe.csproj'
          Push-Location (Split-Path -Parent $project)
          dotnet build (Split-Path -Leaf $project) -c Debug -p:Platform=x64 --nologo
          $buildExitCode = $LASTEXITCODE
          Pop-Location
          if ($buildExitCode -ne 0) {
            throw "XAML layout-variants WinUI build failed with exit code $buildExitCode"
          }
          $executable = Get-ChildItem -Path (Join-Path $output 'xaml/bin') -Filter 'LayoutProbe.exe' -Recurse -File | Select-Object -First 1
          if ($null -eq $executable) {
            throw 'XAML layout-variants WinUI build did not produce LayoutProbe.exe'
          }
          Remove-Item Env:MOSAIC_APP_LIBRARY -ErrorAction SilentlyContinue
          $env:MOSAIC_APP_STATE_PATH = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-layout-variants-state.json'
          Remove-Item $env:MOSAIC_APP_STATE_PATH, "$($env:MOSAIC_APP_STATE_PATH).corrupt", "$($env:MOSAIC_APP_STATE_PATH).tmp" -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -ExecutionPolicy Bypass -File code/scripts/mosaic-xaml-layout-variants-smoke.ps1 -ExePath $executable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "XAML layout-variants resize smoke failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:MOSAIC_APP_STATE_PATH -ErrorAction SilentlyContinue

      - name: Round-trip Rust engine through standard XAML binding
        if: runner.os == 'Windows' && needs.detect.outputs.needs_mosaic_xaml_windows == 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          cargo build --manifest-path code/packages/rust/Cargo.toml -p mosaic-app-conformance
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic Rust conformance app build failed with exit code $LASTEXITCODE"
          }

          $library = Resolve-Path 'code/packages/rust/target/debug/mosaic_app_conformance.dll'
          $generatedBinding = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-bundled-conformance/xaml/MosaicRuntimeHost.cs'
          if (!(Test-Path $generatedBinding)) {
            throw "Generated XAML runtime binding not found at $generatedBinding"
          }

          $harness = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-runtime-conformance'
          New-Item -ItemType Directory -Path $harness -Force | Out-Null
          Copy-Item `
            'code/packages/rust/mosaic-app-bindings/conformance/xaml/*' `
            $harness `
            -Recurse
          Copy-Item $generatedBinding (Join-Path $harness 'MosaicRuntimeHost.cs')
          $harnessProject = Join-Path $harness 'XamlRuntimeConformance.csproj'
          dotnet build $harnessProject -c Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML conformance build failed with exit code $LASTEXITCODE"
          }
          $harnessBinary = Get-ChildItem `
            -Path (Join-Path $harness 'bin') `
            -Filter 'XamlRuntimeConformance.dll' `
            -Recurse `
            -File | Select-Object -First 1
          if ($null -eq $harnessBinary) {
            throw 'Mosaic XAML conformance build did not produce XamlRuntimeConformance.dll'
          }
          Copy-Item $library.Path (Join-Path $harnessBinary.DirectoryName 'mosaic_app.dll')
          Remove-Item Env:MOSAIC_APP_LIBRARY -ErrorAction SilentlyContinue
          $env:MOSAIC_APP_STATE_PATH = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-runtime-state.json'
          Remove-Item $env:MOSAIC_APP_STATE_PATH, "$($env:MOSAIC_APP_STATE_PATH).corrupt", "$($env:MOSAIC_APP_STATE_PATH).tmp" -Force -ErrorAction SilentlyContinue
          dotnet $harnessBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML Rust runtime conformance failed with exit code $LASTEXITCODE"
          }

          $env:MOSAIC_EXPECT_RESTORED = '1'
          dotnet $harnessBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML persisted-restart conformance failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:MOSAIC_EXPECT_RESTORED -ErrorAction SilentlyContinue

          Set-Content -LiteralPath $env:MOSAIC_APP_STATE_PATH -Value '{}' -NoNewline
          $env:MOSAIC_EXPECT_PERSISTENCE_WARNING = '1'
          dotnet $harnessBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML incompatible-state recovery conformance failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:MOSAIC_EXPECT_PERSISTENCE_WARNING -ErrorAction SilentlyContinue

          dotnet $harnessBinary.FullName --expect-missing-prop-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML required-prop failure check failed with exit code $LASTEXITCODE"
          }

          $env:MOSAIC_APP_LIBRARY = Join-Path $env:RUNNER_TEMP 'missing-mosaic-app.dll'
          dotnet $harnessBinary.FullName --expect-required-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML required-runtime failure check failed with exit code $LASTEXITCODE"
          }

      # UI87 §7.6: the XAML platform library (files.open / files.save and the
      # router), driven headless with a fake picker and a fake host. The files
      # are the ones TaskApp's generated WinUI project compiled in the step
      # above, so what is tested is what shipped; run here, rather than on
      # Linux, so the save's move-into-place runs on NTFS.
      - name: Check the XAML platform library headless
        if: runner.os == 'Windows' && needs.detect.outputs.needs_mosaic_xaml_windows == 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $generated = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-taskapp/xaml'
          $window = Get-Content (Join-Path $generated 'MainWindow.xaml.cs') -Raw
          if (!$window.Contains('MosaicPlatformEffects.Install(this, appKinds: null);')) {
            throw 'TaskApp MainWindow.xaml.cs does not install the XAML platform library'
          }
          $platformHarness = Join-Path $env:RUNNER_TEMP 'mosaic-xaml-platform-effects'
          New-Item -ItemType Directory -Path $platformHarness -Force | Out-Null
          Copy-Item 'code/packages/rust/mosaic-app-bindings/conformance/xaml-platform-effects/*' $platformHarness -Recurse
          foreach ($file in 'MosaicPlatformEffects.cs', 'MosaicRuntimeHost.cs') {
            $source = Join-Path $generated $file
            if (!(Test-Path $source)) {
              throw "Generated XAML $file not found at $source"
            }
            Copy-Item $source (Join-Path $platformHarness $file)
          }
          dotnet run -c Release --project (Join-Path $platformHarness 'XamlPlatformEffectsConformance.csproj')
          if ($LASTEXITCODE -ne 0) {
            throw "Mosaic XAML platform library conformance failed with exit code $LASTEXITCODE"
          }

      - name: Upload failed Mosaic TaskApp WinUI diagnostics
        if: failure() && runner.os == 'Windows' && needs.detect.outputs.needs_mosaic_xaml_windows == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mosaic-xaml-taskapp-diagnostics
          path: |
            ${{ runner.temp }}/mosaic-xaml-taskapp/xaml/TaskApp.binlog
            ${{ runner.temp }}/mosaic-xaml-taskapp/xaml/TaskApp.xaml
            ${{ runner.temp }}/mosaic-xaml-taskapp/xaml/obj/**/input.json
            ${{ runner.temp }}/mosaic-xaml-taskapp/xaml/obj/**/output.json
          if-no-files-found: warn
          retention-days: 3

      # ── Clippy for crates only Windows can compile ────────────
      #
      # THE HOLE THIS PLUGS. The `-clippy` gate below runs `cargo clippy
      # --all-targets -- -D warnings` per affected Rust package, but only where
      # that package's BUILD actually invokes cargo. A Windows-only crate's
      # default BUILD is a bare `echo SKIP` (it cannot compile on Linux/macOS:
      # it `compile_error!`s off Windows), so the Linux and macOS legs correctly
      # emit no clippy step for it. Its real commands live in BUILD_windows —
      # and the build step below is skipped on Windows unless Swift changed. Net
      # effect: `paint-vm-direct2d` and `paint-vm-gdi` were linted by NOBODY, on
      # any leg, ever. `paint-vm-direct2d` quietly accumulated 8 `-D warnings`
      # errors that way (PR #12119), which broke `cargo clippy` for every crate
      # depending on it — clippy lints path dependencies — while its own gate
      # step reported success.
      #
      # WHY THE LIST IS DERIVED. The crate set comes from the crates themselves:
      # a `#[cfg(not(target_os = "windows"))] compile_error!` IS the declaration
      # "this crate is Windows-only". Grepping for it means a new Windows-only
      # crate joins this gate the moment it declares its platform gate — no
      # hand-maintained list to forget to update. The step fails loudly if the
      # set ever comes back empty, so a drifted pattern cannot degrade into a
      # silently-passing no-op (which is the exact failure mode being fixed).
      #
      # This is clippy only — no tests. Driving GDI/Direct2D rendering tests on
      # a headless runner is a separate question from linting the source.
      - name: Clippy Windows-only Rust crates
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          crates=()
          while read -r dir; do
            name=$(sed -n 's/^name *= *"\([^"]*\)".*/\1/p' "$dir/Cargo.toml" | head -1)
            if [ -z "$name" ]; then
              echo "::error::no [package] name found in $dir/Cargo.toml"
              exit 1
            fi
            crates+=(-p "$name")
          done < <(
            grep -rl --include='*.rs' 'cfg(not(target_os = "windows"))' code/packages/rust \
            | while read -r file; do
                grep -A2 'cfg(not(target_os = "windows"))' "$file" \
                  | grep -q 'compile_error!' || continue
                dir=$(dirname "$file")
                while [ ! -f "$dir/Cargo.toml" ]; do dir=$(dirname "$dir"); done
                echo "$dir"
              done | sort -u
          )
          if [ ${#crates[@]} -eq 0 ]; then
            echo "::error::Derived no Windows-only crates. Either the last one was"
            echo "::error::removed (delete this step) or the detection pattern drifted."
            exit 1
          fi
          echo "Linting Windows-only crates: ${crates[*]}"
          cd code/packages/rust
          cargo clippy "${crates[@]}" --all-targets -- -D warnings

      # ── Run the build ─────────────────────────────────────────
      #
      # Why this step carries an explicit timeout-minutes:
      #
      # `vault-pm-cli-drill`'s crash/fault matrix (VLT-PM41/47) pays a real
      # production Argon2id derivation per prompt across dozens of
      # crash-injection landing points, parallelized internally up to the
      # runner's own core count. That is a legitimate, previously-measured
      # cost — its CHANGELOG records 1182s for the rotation sweep alone on a
      # hosted runner — not a bug: a from-scratch build and 2-CPU-constrained
      # run of the whole 18-test suite (including the two VLT-PM47 attachment
      # drills this PR added) reproduced clean in this investigation at
      # 11-14 minutes with no failures, so nothing here is unbounded by
      # construction. Without a ceiling, though, a genuine stall — a runner
      # anomaly, resource contention, anything this investigation could not
      # reproduce locally — is indistinguishable from "still legitimately
      # working" for the whole 360-minute default job timeout, which is
      # exactly what happened on this PR (2+ hours, `in_progress`, zero
      # visible test output). 150 minutes gives comfortable headroom above
      # every measured baseline (the historical ~91-minute whole-step run,
      # plus this PR's modest additions) while still turning a real hang into
      # a fast, loud CI failure instead of an hours-long silent stall.
      #
      # Why 300, not 150: pull-request builds are not sharded, so a change to a
      # crate nearly everything depends on (`parser`, #16054) makes one runner
      # rebuild ~750 packages. On Windows that took ~140 minutes, then ~150 on
      # the next run, which the old ceiling killed mid-`lang-aot` (a single
      # package that legitimately takes ~19 minutes there). 300 still ends
      # well inside the 360-minute job limit, with room for the ~25 minutes
      # of Windows setup before this step, so a real hang still fails.
      - name: Build and test affected packages
        if: needs.detect.outputs.is_main != 'true' && (runner.os != 'Windows' || needs.detect.outputs.needs_swift == 'true' || needs.detect.outputs.needs_elixir == 'true' || needs.detect.outputs.needs_dotnet == 'true' || needs.detect.outputs.needs_ocaml == 'true' || needs.detect.outputs.run_build_windows_os_suites == 'true')
        timeout-minutes: 300
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ -w /sys/fs/cgroup/forme-sandbox/runner/cgroup.procs ]; then
            printf '%s\n' "$$" | sudo tee /sys/fs/cgroup/forme-sandbox/runner/cgroup.procs >/dev/null
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then BT=./build-tool.exe; else BT=./build-tool; fi
          job_flags=()
          if [ "${{ steps.setup-ocaml.outcome }}" = "success" ]; then
            job_flags=(-jobs 1)
          fi
          PLAN_FLAG=""
          if [ -f build-plan.json ]; then
            PLAN_FLAG="-plan-file build-plan.json"
            echo "Using pre-computed build plan"
          fi
          $BT \
            "${job_flags[@]}" \
            -root . \
            $PLAN_FLAG \
            -validate-build-files \
            -clippy \
            -language all

      # ── Force full build on main ──────────────────────────────
      # Same bounded-hang rationale as "Build and test affected packages"
      # above — this step runs the identical build-tool invocation, just
      # forced and sharded, on every merge to main.
      - name: Full build on main merge
        if: needs.detect.outputs.is_main == 'true'
        timeout-minutes: 150
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ -w /sys/fs/cgroup/forme-sandbox/runner/cgroup.procs ]; then
            printf '%s\n' "$$" | sudo tee /sys/fs/cgroup/forme-sandbox/runner/cgroup.procs >/dev/null
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then BT=./build-tool.exe; else BT=./build-tool; fi
          job_flags=()
          if [ "${{ steps.setup-ocaml.outcome }}" = "success" ]; then
            job_flags=(-jobs 1)
          fi
          $BT "${job_flags[@]}" -root . -plan-file build-plan.json -shard-index "${{ matrix.shard_index }}" -force -validate-build-files -clippy -language all

  # ── Job 16: CI gate ────────────────────────────────────────────
  #
  # A single, always-present status check that summarizes the result of
  # every real job. The `build` job is a DYNAMIC matrix — its `build (…)`
  # labels vary per-PR (they come from the diff-based `detect` step), so an
  # individual label cannot be required by branch protection: a PR that does
  # not produce that label would have the check "expected" forever and never
  # merge. Requiring THIS job instead gives branch protection one stable
  # pull-request context (`CI gate`) that passes only when every required job
  # succeeded — or was legitimately skipped (e.g. an empty build matrix when
  # nothing relevant changed). Push workflows deliberately publish `CI push
  # gate` instead: using the protected context for both events lets a faster
  # branch push satisfy protection while the pull-request macOS/Windows matrix
  # is still running. `if: always()` makes the gate itself run even when a
  # dependency failed, so it can report the failure rather than being skipped.
  # A cancelled dependency is accepted only when a fresh API read proves this
  # run's PR head was superseded. A cancellation on the current head remains a
  # failure; merely skipping this required job would fail open because GitHub
  # accepts skipped required checks.
  ci-gate:
    name: ${{ github.event_name == 'pull_request' && 'CI gate' || 'CI push gate' }}
    needs: [detect, contracts, ocaml-capability-gate, phy00-phy01-fixture-consumers, d18f-message-conformance, d18p-channel-conformance, d18q-channel-key-grant-conformance, d18t-durable-epoch-activation-conformance, ruby-grammar-regen-check, mosaic-grammar-regen-check, rust-grammar-regen-check, unicode17-elixir-conformance, unicode17-lua-conformance, unicode17-perl-conformance, unicode17-haskell-conformance, unicode17-swift-conformance, unicode17-dart-conformance, mosaic-flutter-platform-library, forme-release-platform, forme-release-verdict, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify required jobs succeeded
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETECT_RESULT: ${{ needs.detect.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          OCAML_CAPABILITY_RESULT: ${{ needs['ocaml-capability-gate'].result }}
          PHY_RESULT: ${{ needs['phy00-phy01-fixture-consumers'].result }}
          D18F_RESULT: ${{ needs['d18f-message-conformance'].result }}
          D18P_RESULT: ${{ needs['d18p-channel-conformance'].result }}
          D18Q_RESULT: ${{ needs['d18q-channel-key-grant-conformance'].result }}
          D18T_RESULT: ${{ needs['d18t-durable-epoch-activation-conformance'].result }}
          RUBY_GRAMMAR_REGEN_RESULT: ${{ needs['ruby-grammar-regen-check'].result }}
          MOSAIC_GRAMMAR_REGEN_RESULT: ${{ needs['mosaic-grammar-regen-check'].result }}
          RUST_GRAMMAR_REGEN_RESULT: ${{ needs['rust-grammar-regen-check'].result }}
          UNICODE17_ELIXIR_RESULT: ${{ needs['unicode17-elixir-conformance'].result }}
          UNICODE17_LUA_RESULT: ${{ needs['unicode17-lua-conformance'].result }}
          UNICODE17_PERL_RESULT: ${{ needs['unicode17-perl-conformance'].result }}
          UNICODE17_HASKELL_RESULT: ${{ needs['unicode17-haskell-conformance'].result }}
          UNICODE17_SWIFT_RESULT: ${{ needs['unicode17-swift-conformance'].result }}
          UNICODE17_DART_RESULT: ${{ needs['unicode17-dart-conformance'].result }}
          MOSAIC_FLUTTER_PLATFORM_LIBRARY_RESULT: ${{ needs['mosaic-flutter-platform-library'].result }}
          FORME_RELEASE_PLATFORM_RESULT: ${{ needs['forme-release-platform'].result }}
          FORME_RELEASE_VERDICT_RESULT: ${{ needs['forme-release-verdict'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::Invalid repository identity."
              exit 1
            fi
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid pull-request number."
              exit 1
            fi
            if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid event pull-request head."
              exit 1
            fi

            current_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            if [[ ! "$current_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::GitHub returned an invalid current pull-request head."
              exit 1
            fi
            if [ "$current_head" != "$EVENT_HEAD_SHA" ]; then
              echo "::notice::This workflow head was superseded; its cancelled dependencies are obsolete."
              exit 0
            fi
          fi

          echo "detect=$DETECT_RESULT contracts=$CONTRACTS_RESULT ocaml_capability=$OCAML_CAPABILITY_RESULT phy=$PHY_RESULT d18f=$D18F_RESULT d18p=$D18P_RESULT d18q=$D18Q_RESULT d18t=$D18T_RESULT ruby_grammar_regen=$RUBY_GRAMMAR_REGEN_RESULT mosaic_grammar_regen=$MOSAIC_GRAMMAR_REGEN_RESULT rust_grammar_regen=$RUST_GRAMMAR_REGEN_RESULT unicode17_elixir=$UNICODE17_ELIXIR_RESULT unicode17_lua=$UNICODE17_LUA_RESULT unicode17_perl=$UNICODE17_PERL_RESULT unicode17_haskell=$UNICODE17_HASKELL_RESULT unicode17_swift=$UNICODE17_SWIFT_RESULT unicode17_dart=$UNICODE17_DART_RESULT mosaic_flutter_platform_library=$MOSAIC_FLUTTER_PLATFORM_LIBRARY_RESULT forme_release_platform=$FORME_RELEASE_PLATFORM_RESULT forme_release_verdict=$FORME_RELEASE_VERDICT_RESULT build=$BUILD_RESULT"
          fail=0
          for r in "$DETECT_RESULT" "$CONTRACTS_RESULT" "$OCAML_CAPABILITY_RESULT" "$PHY_RESULT" "$D18F_RESULT" "$D18P_RESULT" "$D18Q_RESULT" "$D18T_RESULT" "$RUBY_GRAMMAR_REGEN_RESULT" "$MOSAIC_GRAMMAR_REGEN_RESULT" "$RUST_GRAMMAR_REGEN_RESULT" "$UNICODE17_ELIXIR_RESULT" "$UNICODE17_LUA_RESULT" "$UNICODE17_PERL_RESULT" "$UNICODE17_HASKELL_RESULT" "$UNICODE17_SWIFT_RESULT" "$UNICODE17_DART_RESULT" "$MOSAIC_FLUTTER_PLATFORM_LIBRARY_RESULT" "$FORME_RELEASE_PLATFORM_RESULT" "$FORME_RELEASE_VERDICT_RESULT" "$BUILD_RESULT"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass (result: $r)"; fail=1 ;;
            esac
          done
          if [ "$fail" = "0" ]; then echo "CI gate passed"; else exit 1; fi
