<svg xmlns="http://www.w3.org/2000/svg" width="662" height="353.78" viewBox="0 0 662 353.78" role="img" aria-label="How to write ர: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ர</title><desc>4 frames; frame N shows movements 1 to N of ர (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 3 identifies ர as the three-movement ஈ frame plus a slightly angular short fourth movement. Tamil handwriting varies by school; this is one attested three-run order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="662" height="353.78" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 518 L131 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 518 L131 300 L131 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">1. down the left</tspan><tspan x="355.5" y="472.1">upright</tspan></text></svg><rect x="176" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 518 L131 300 L131 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M131 518 L131 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 518 L280 518 L450 518 L580 518" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="580" cy="518" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">2. across the top bar</tspan></text></svg><rect x="336" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 518 L131 300 L131 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M131 518 L280 518 L450 518 L580 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M410 518 L410 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M410 518 L410 300 L410 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="410" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">3. down the central</tspan><tspan x="355.5" y="472.1">upright</tspan></text></svg><rect x="496" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 518 L131 300 L131 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M131 518 L280 518 L450 518 L580 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M410 518 L410 300 L410 40 L410 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M410 40 L330 -40 L235 -135 L200 -170 L231 -210" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="231" cy="-210" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">4. around the short</tspan><tspan x="355.5" y="472.1">angular tail</tspan></text></svg><text x="16" y="302.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர</text><text x="16" y="315.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 191</text><text x="16" y="327.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
