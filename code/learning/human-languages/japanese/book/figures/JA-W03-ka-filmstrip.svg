<svg xmlns="http://www.w3.org/2000/svg" width="822" height="287.48" viewBox="0 0 822 287.48" role="img" aria-label="How to write か: 3 strokes · 2 pen lifts · 5 movements"><title>Writing か</title><desc>5 frames; frame N shows movements 1 to N of か (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0304b.svg, hiragana か (U+304B HIRAGANA LETTER KA), three stroke paths kvg:0304b-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0304b.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 starts at the left of the bar, runs right, turns down the right side without lifting and hooks back to the left at its foot; s2 starts above the bar and falls through it to the lower left; s3 starts at the top of the dot and runs down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="287.48" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="181.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="181.48" viewBox="8 -860 1027 1242.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M438 780Q435 767 432 751.5Q429 736 426 721Q423 703 417.5 672Q412 641 406 606.5Q400 572 392 541Q382 498 367 444.5Q352 391 333 331Q314 271 290 208.5Q266 146 237 84.5Q208 23 174 -31L92 1Q127 47 156.5 104Q186 161 211 222.5Q236 284 256.5 344Q277 404 291 455