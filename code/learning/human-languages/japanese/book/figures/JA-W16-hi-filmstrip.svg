<svg xmlns="http://www.w3.org/2000/svg" width="502" height="304.95" viewBox="0 0 502 304.95" role="img" aria-label="How to write ひ: one unbroken stroke · 3 movements"><title>Writing ひ</title><desc>3 frames; frame N shows movements 1 to N of ひ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana ひ stroke order animation.gif, hiragana ひ, 33 frames, 3.3 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%B2_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws ひ in one uninterrupted run: short shoulder rightward, a corner, a long open curve down and left around the bottom, then up the right side to a short outward flick. The learner path is fitted to the bundled Noto Sans JP subset; handwritten curve width and flick length vary, but the zero-lift order is the same.</desc><rect x="0" y="0" width="502" height="304.95" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="198.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.95" viewBox="39 -809 977 1295.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M734 739Q742 694 755.5 641Q769 588 792.5 532Q816 476 853.5 420.5Q891 365 946 316L894 245Q839 304 796 374.5Q753 445 719 530Q685 615 655 717L734 739ZM109 686Q132 684 162 686Q196 687 241 692Q286 697 332 704Q378 711 417.5 719Q457 727 479 736L502 665Q492 663 476 658Q460 653 449 647Q430 633 402.5 605Q375 577 345.5 536.5Q316 496 290.5 446Q265 396 249 339Q233 282 233 220Q233 167 248.5 131Q264 95 292 73Q320 51 355 41Q390 31 428 31Q548 31 614.5 111.5Q681 192 695 338Q709 484 671 680L745 544Q760 459 761.5 373.5Q763 288 7