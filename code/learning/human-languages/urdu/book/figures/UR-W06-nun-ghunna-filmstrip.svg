<svg xmlns="http://www.w3.org/2000/svg" width="182" height="449.01" viewBox="0 0 182 449.01" role="img" aria-label="How to write ں: one unbroken stroke · 1 movement"><title>Writing ں</title><desc>1 frames; frame N shows movements 1 to N of ں (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Sīn, shīn, baṛī he, nūn, and nūn-e ġhunna, independent ں calligraphic and handwriting animations and Nasalization with nūn-e ġhunna instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/sin-shin-bari-he-nun-nun-ghunna/&gt;. Source note on variation: Both independent-form animations draw one uninterrupted right-to-left bowl below the baseline without lifting. The lesson explicitly says final and independent nūn-e ġhunna look like nūn without any dot; initial and medial forms instead look identical to regular nūn and may occasionally carry a sukūn or small semicircular diacritic. The vendored Noto Naskh U+06BA outline exactly matches the U+0646 nūn body contour with the dot removed, so this learner path reuses that verified bowl motion while preserving the positional distinction. Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="182" height="449.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 1 movement</text><rect x="16" y="42" width="150" height="218.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="218.01" viewBox="-2 -296 607 882.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q301 -179 351.5 -162.5Q402 -146 442 -117.5Q482 -89 498 -54Q465 17 449 65Q433 113 433 137Q433 163 447.5 183.5Q462 204 498 226Q500 215 503 196.5Q506 178 510.5 153.5Q515 129 521 97Q528 61 531.5 32.5Q535 4 535 -17Q535 -78 496 -134.5Q457 -191 389 -226Q355 -244 320 -253Q285 -262 249 -262Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M495 210 L495 210" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M495 210 L475 160 L480 100 L500 40 L510 -20 L485 -80 L430 -140 L360 -190 L280 -220 L210 -215 L150 -170 L105 -110 L90 -60 L95 0 L105 45" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="45" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301.5" y="450.6" text-anchor="middle" font-size="48.6" fill="#6b7280"><tspan x="301.5" y="450.6">1. sweep the independent</tspan><tspan x="301.5" y="509.9">dotless bowl right to</tspan><tspan x="301.5" y="569.2">left below the baseline</tspan></text></svg><text x="16" y="273.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o</text><text x="16" y="285.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Zabar, Sīn, shīn, baṛī he,</text><text x="16" y="298.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">nūn, and nūn-e ġhunna,</text><text x="16" y="310.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">independent ں calligraphic</text><text x="16" y="323.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and handwriting animations</text><text x="16" y="335.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and Nasalization with nūn-e</text><text x="16" y="348.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">ġhunna instructions</text><text x="16" y="360.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Northwestern University</text><text x="16" y="373.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Libraries Open Textbook,</text><text x="16" y="385.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2026)</text><text x="16" y="398.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not</text><text x="16" y="410.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">standardised; the source</text><text x="16" y="423.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
