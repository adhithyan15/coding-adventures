[package]
name = "coding-adventures-motorola68k-gatelevel"
version = "0.1.0"
edition = "2021"
description = "Complete Motorola 68000 gate-level simulator with 134,218,289 DFFs, fixed gate MUL/DIV, typed atomic lifecycle, and full-state functional differentials"
license = "MIT"

[dependencies]
logic-gates = { path = "../logic-gates" }
arithmetic = { path = "../arithmetic" }
m68k-simulator = { path = "../m68k-simulator" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
