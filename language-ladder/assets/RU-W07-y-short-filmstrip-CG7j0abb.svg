<svg xmlns="http://www.w3.org/2000/svg" width="662" height="392.7" viewBox="0 0 662 392.7" role="img" aria-label="How to write й: 2 strokes · 1 pen lift · 4 movements"><title>Writing й</title><desc>4 frames; frame N shows movements 1 to N of й (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase й demonstration, 04:17–04:24, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 04:17–04:24 lowercase й demonstration, the pen first writes the same left-stem-to-rising-diagonal-to-right-stem body shown for и in one continuous pen-down run, finishes through its small rising exit, then lifts and draws the breve above from left to right as one dipped arc, for two strokes and one intervening lift. The demonstrated school hand resembles a rounded Latin u with entry and exit joins plus a shallow curved breve; the bundled Noto Sans Cyrillic glyph is a printed backwards-N body with two straight stems and a separate thicker breve, without the cursive body joins. This learner path preserves the source&apos;s body-before-breve order, left-to-right breve direction, and one-lift evidence while fitting the printed outline: descend the left stem, rise through the diagonal, descend the right stem, then lift and sweep down and up through the breve. Connected cursive restores the source&apos;s body entry and exit joins, while the breve remains separate; individual handwriting may round, narrow, or slant the body and breve differently.</desc><rect x="0" y="0" width="662" height="392.7" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="286.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="286.7" viewBox="15 -810 591 1129.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L172 536L172 209Q172 197 171 174Q170 151 168.5 128.5Q167 106 166 92L167 92L427 536L536 536L536 0L449 0L449 316Q449 332 449.5 356.5Q450 381 451 404.5Q452 428 453 441L452 441L194 0L85 0ZM311 606Q244 606 204.5 641Q165 676 157 740L235 740Q246 664 311 664Q376 664 387 740L465 740Q458 676 418.5 641Q379 606 311 606Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M125 510 L125 510" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M125 510 L125 390 L125 270 L125 150 L125 25 L160 25 L190 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="190" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="310.5" y="187.4" text-anchor="middle" font-size="47.4" fill="#6b7280"><tspan x="310.5" y="187.4">1. descend the left</tspan><tspan x="310.5" y="245.2">stem to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="286.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="286.7" viewBox="15 -810 591 1129.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L172 536L172 209Q172 197 171 174Q170 151 168.5 128.5Q167 106 166 92L167 92L427 536L536 536L536 0L449 0L449 316Q449 332 449.5 356.5Q450 381 451 404.5Q452 428 453 441L452 441L194 0L85 0ZM311 606Q244 606 204.5 641Q165 676 157 740L235 740Q246 664 311 664Q376 664 387 740L465 740Q458 676 418.5 641Q379 606 311 606Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M125 510 L125 390 L125 270 L125 150 L125 25 L160 25 L190 40 L190 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M190 40 L225 100 L270 180 L315 255 L360 335 L405 410 L450 485 L475 510" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="475" cy="510" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="310.5" y="187.4" text-anchor="middle" font-size="47.4" fill="#6b7280"><tspan x="310.5" y="187.4">2. rise diagonally to</tspan><tspan x="310.5" y="245.2">the upper right</tspan></text></svg><rect x="336" y="42" width="150" height="286.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="286.7" viewBox="15 -810 591 1129.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L172 536L172 209Q172 197 171 174Q170 151 168.5 128.5Q167 106 166 92L167 92L427 536L536 536L536 0L449 0L449 316Q449 332 449.5 356.5Q450 381 451 404.5Q452 428 453 441L452 441L194 0L85 0ZM311 606Q244 606 204.5 641Q165 676 157 740L235 740Q246 664 311 664Q376 664 387 740L465 740Q458 676 418.5 641Q379 606 311 606Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M125 510 L125 390 L125 270 L125 150 L125 25 L160 25 L190 40 L225 100 L270 180 L315 255 L360 335 L405 410 L450 485 L475 510 L475 510" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M475 510 L475 390 L475 270 L475 150 L475 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="475" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="310.5" y="187.4" text-anchor="middle" font-size="47.4" fill="#6b7280"><tspan x="310.5" y="187.4">3. descend the right</tspan><tspan x="310.5" y="245.2">stem and finish at the</tspan><tspan x="310.5" y="303.1">baseline</tspan></text></svg><rect x="496" y="42" width="150" height="286.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="286.7" viewBox="15 -810 591 1129.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L172 536L172 209Q172 197 171 174Q170 151 168.5 128.5Q167 106 166 92L167 92L427 536L536 536L536 0L449 0L449 316Q449 332 449.5 356.5Q450 381 451 404.5Q452 428 453 441L452 441L194 0L85 0ZM311 606Q244 606 204.5 641Q165 676 157 740L235 740Q246 664 311 664Q376 664 387 740L465 740Q458 676 418.5 641Q379 606 311 606Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M125 510 L125 390 L125 270 L125 150 L125 25 L160 25 L190 40 L225 100 L270 180 L315 255 L360 335 L405 410 L450 485 L475 510 L475 390 L475 270 L475 150 L475 25" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M195 715 L195 715" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M195 715 L220 675 L265 640 L310 635 L355 640 L400 675 L430 715" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="715" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="310.5" y="187.4" text-anchor="middle" font-size="47.4" fill="#6b7280"><tspan x="310.5" y="187.4">4. lift, then draw the</tspan><tspan x="310.5" y="245.2">breve from left to</tspan><tspan x="310.5" y="303.1">right</tspan></text></svg><text x="16" y="341.7" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase й demonstration,</text><text x="16" y="354.2" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">04:17–04:24, YouTube, 5 February 2013</text><text x="16" y="366.7" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
