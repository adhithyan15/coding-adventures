<!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
<div data-mosaic-component="Field">
  <div style="display: flex; flex-direction: column; padding: 8px">
    <span style="color: #212529; font-size: 14px; font-weight: 500; padding: 0">{{label}}</span>
    <!-- emit "onChange" dropped: HTML is static -->
    <!-- emit "onCommit" dropped: HTML is static -->
    <input type="text" value="{{value}}" placeholder="{{placeholder}}" data-disabled="{{disabled}}" data-on-change="onChange" data-on-commit="onCommit" style="padding: 8px; border-radius: 4px; background: #ffffff; color: #212529; border-width: 1px; border-color: #ced4da; font-size: 14px">
    <!-- mosaic-if when="error" -->
      <span style="color: #dc3545; font-size: 12px; padding: 0">{{error}}</span>
    <!-- mosaic-else -->
      <span style="color: #6c757d; font-size: 12px; padding: 0">{{help}}</span>
    <!-- /mosaic-if -->
  </div>
</div>
