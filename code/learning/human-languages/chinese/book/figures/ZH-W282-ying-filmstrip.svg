<svg xmlns="http://www.w3.org/2000/svg" width="982" height="521.02" viewBox="0 0 982 521.02" role="img" aria-label="How to write 应: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 应</title><desc>7 frames; frame N shows movements 1 to N of 应 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 应.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%BA%94.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 应, in two pieces. Medians 1–3 draw the roof as 店 opens: a dot, a horizontal, then a long left-falling stroke down the left side. Medians 4–7 draw under it two dots, a left-falling stroke on the right, then a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="521.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="207.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="207.76" viewBox="-34 -918 1059 1466.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductu