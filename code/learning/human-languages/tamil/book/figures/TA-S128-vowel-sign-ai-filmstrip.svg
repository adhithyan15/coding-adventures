<svg xmlns="http://www.w3.org/2000/svg" width="502" height="249.66" viewBox="0 0 502 249.66" role="img" aria-label="How to write ை: one unbroken stroke · 3 movements"><title>Writing ை</title><desc>3 frames; frame N shows movements 1 to N of ை (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 43 (ை, ai sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 189 of the 190 stored prototypes of the ai sign are one pen-down stroke. All 189 turn clockwise: the pen starts on the left (181 of 189), circles the small left loop, arches over to the right, rises through the middle into the second arch, and comes down on the right, where 146 end. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="249.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="131.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="131.16" viewBox="-13 -636 1179 1030.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -12Q196 -12 152 14.5Q108 41 82.5 97Q57 153 57 243Q57 342 100.5 414.5Q144 487 223 526.5Q302 566 408 566Q456 566 499 558.5Q542 551 582 536Q622 521 659 497L695 466Q758 415 791.5 343Q825 271 825 189Q825 122 805.5 77.5Q786 33 749.5 10.