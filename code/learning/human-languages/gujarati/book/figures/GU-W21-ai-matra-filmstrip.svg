<svg xmlns="http://www.w3.org/2000/svg" width="662" height="291.46" viewBox="0 0 662 291.46" role="img" aria-label="How to write ૈ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ૈ</title><desc>4 frames; frame N shows movements 1 to N of ૈ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/7_kai.svg, groups g1 then g2 (strokes g1s0, g2s0): the ai sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કૈ, and in all 32 consonant rows whose consonant keeps its bare outline, ૈ is two pen-down runs: the lower flag first, then the upper flag, each from its upper-left tip, arcing right and down to the lower right. t30apps, already cited for ઐ, sweeps the two high arcs in the same order and direction: the lower arc first, then the higher, each from left to right. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: 76 of its 83 stored prototypes of the ai sign (92%) are two strokes, the left flag first. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x=