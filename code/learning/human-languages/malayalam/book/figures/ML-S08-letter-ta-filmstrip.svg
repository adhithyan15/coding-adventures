<svg xmlns="http://www.w3.org/2000/svg" width="662" height="246.73" viewBox="0 0 662 246.73" role="img" aria-label="How to write ത: one unbroken stroke · 4 movements"><title>Writing ത</title><desc>4 frames; frame N shows movements 1 to N of ത (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ത in data/TA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/TA.png&gt;. Source note on variation: Thooval&apos;s TA.png starts at the left foot (green), climbs clockwise over the left arch, crosses down the right side of the middle loop, rounds its base, climbs its left side back through the crossing and sweeps over the right arch to finish at the right foot (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ത as one stroke from the lower left to the lower right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (21 of 34) and end at the lower right (34 of 34). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms.</desc><rect x="0" y="0" width="662" height="246.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font