<svg xmlns="http://www.w3.org/2000/svg" width="822" height="305.01" viewBox="0 0 822 305.01" role="img" aria-label="How to write 只: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 只</title><desc>5 frames; frame N shows movements 1 to N of 只 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 只.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%AA.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 只, in two pieces. Medians 1–3 draw 口 on top in the order the standalone character uses. Medians 4–5 draw 八 under it: a left-falling stroke, then a dot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="305.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="199.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.01" viewBox="-21 -836 1035 1373.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M593 182L657 221Q707 183 761.5 137.5Q816 92 864.5 47Q913 2 944 -35