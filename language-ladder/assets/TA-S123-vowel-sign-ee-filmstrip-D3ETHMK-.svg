 Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="304.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil recognizer, class 42 (ே, ee sign): stored online-handwriting prototypes from native</text><text x="16" y="316.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil writers (MIT licence, 2012)</text><text x="16" y="329.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
