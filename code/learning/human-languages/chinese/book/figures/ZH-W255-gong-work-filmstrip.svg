<svg xmlns="http://www.w3.org/2000/svg" width="502" height="272.62" viewBox="0 0 502 272.62" role="img" aria-label="How to write 工: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 工</title><desc>3 frames; frame N shows movements 1 to N of 工 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 工.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B7%A5.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 工. Median 1 draws a short horizontal on top; median 2 a vertical down from it; median 3 a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="272.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="166.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="166.62" viewBox="-18 -797 1039 1154.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 727L900 727L900 650L104 650L104 727ZM52 72L951 72L951 -3L52 -3L52 72ZM456 688L539 688L539 41L456 41L456 688Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 690 L126 690" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M126 690 L871 690" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="871" cy="690" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="226.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="501.5" y="226.3">1. draw the top</tspan><tspan x="501.5" y="327.9">horizontal</tspan></text></svg><rect x="176" y="42" width="150" height="166.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="166.62" viewBox="-18 -797 1039 1154.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 727L900 727L900 650L104 650L104 727ZM52 72L951 72L951 -3L52 -3L52 72ZM456 688L539 688L539 41L456 41L456 688Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 690 L871 690" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 680 L500 680" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M500 680 L500 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="500" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="226.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="501.5" y="226.3">2. lift, then draw the</tspan><tspan x="501.5" y="327.9">vertical</tspan></text></svg><rect x="336" y="42" width="150" height="166.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="166.62" viewBox="-18 -797 1039 1154.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 727L900 727L900 650L104 650L104 727ZM52 72L951 72L951 -3L52 -3L52 72ZM456 688L539 688L539 41L456 41L456 688Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 690 L871 690" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 680 L500 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M72 30 L72 30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M72 30 L922 30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="922" cy="30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="226.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="501.5" y="226.3">3. lift, then draw the</tspan><tspan x="501.5" y="327.9">long bottom horizontal</tspan></text></svg><text x="16" y="221.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 工.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="234.12" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="246.62" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
