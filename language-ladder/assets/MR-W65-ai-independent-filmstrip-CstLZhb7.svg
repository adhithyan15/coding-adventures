<svg xmlns="http://www.w3.org/2000/svg" width="822" height="407.93" viewBox="0 0 822 407.93" role="img" aria-label="How to write ऐ: 4 strokes · 3 pen lifts · 5 movements"><title>Writing ऐ</title><desc>5 frames; frame N shows movements 1 to N of ऐ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari ऐ stroke order.svg’, panels 1–4, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%90_stroke_order.svg&gt;. Source note on variation: The four-panel diagram shows four ordered pen-down runs. Panels 1 and 2 write the same continuous long left stem and tail, then shorter inward-hooked right stem, used for ए. Panel 3 restarts at the right headline junction and sweeps the upper arc upward and left to its open tip. Panel 4 restarts at the headline&apos;s left edge and draws the shirorekhā left-to-right, for three intervening lifts. This learner path follows that modern printed teaching form and fits its turns and directions to Noto Sans Devanagari. Other handwriting may simplify the curves, so this is a sourced learner path rather than a universal standard.</desc><rect x="0" y="0" width="822" height="407.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="314.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="314.43" viewBox="-70 -966 708 1484.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M568 551L474 551L474 390Q474 337 460.5 302.5Q447 268 418.5 247.5Q390 227 345 214L307 283Q341 293 359.5 306.5Q378 320 385.5 343Q393 366 393 402L393 551L160 551L160 349Q160 312 164 288Q168 264 179 247.5Q190 231 211.5 216Q233 201 269 183L347 