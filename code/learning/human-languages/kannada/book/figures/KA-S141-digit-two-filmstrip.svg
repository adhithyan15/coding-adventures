26):</text><text x="16" y="294.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the hidden, ordered tracing path for ೨, trace image 2.svg</text><text x="16" y="306.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
