<svg xmlns="http://www.w3.org/2000/svg" width="662" height="298.79" viewBox="0 0 662 298.79" role="img" aria-label="How to write ే: 2 strokes · 1 pen lift · 4 movements"><title>Writing ే</title><desc>4 frames; frame N shows movements 1 to N of ే (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 58 (ే, ee sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 163 of the 206 stored prototypes of the ee sign (79%) are two pen-down strokes, and 159 of those 163 draw the lower part, the e sign, first. 157 of the 159 draw it as the e sign is drawn, from its lower tip anticlockwise to the left end of the bar; all 159 then draw the hook clockwise, and 158 from its left foot to its right tip (153 do all of that). Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="298.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="192.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea