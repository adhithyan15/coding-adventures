<svg xmlns="http://www.w3.org/2000/svg" width="662" height="325.73" viewBox="0 0 662 325.73" role="img" aria-label="How to write 什: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 什</title><desc>4 frames; frame N shows movements 1 to N of 什 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 什.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BB%80.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 什. Medians 1–2 draw 亻 first: a left-falling stroke from the upper centre down-left, then a separately started vertical stroke to the baseline. Median 3 draws 十&apos;s horizontal left-to-right, and median 4 separately descends 十&apos;s vertical through it. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all four medians to Noto Sans SC while preserving the complete 亻-before-十 component order and three intervening lifts; Noto&apos;s left component is narrower and 十&apos;s horizontal is flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="662" height="325.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="219.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.73" viewBox="-34 -906 1059 1551.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M291 836L361 815Q327 729 282.5 645.5Q238 562 186.5 488Q135 414 79 357Q76 366 68 380Q60 394 51.5 408Q43 422 36 431Q87 480 134 545Q181 610 221.5 684.5Q262 759 291 836ZM189 579L261 651L262 650L262 -78L189 -78L189 579ZM327 494L955 494L955 420L327 420L327 494ZM607 830L685 830L685 -80L607 -80L607 830Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M280 810 L280 810" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M280 810 L265 760 L245 700 L220 640 L190 580 L155 525 L120 480 L85 450 L50 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="50" cy="430" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495.5" y="304.9" text-anchor="middle" font-size="84.9" fill="#6b7280"><tspan x="495.5" y="304.9">1. draw 亻&apos;s</tspan><tspan x="495.5" y="408.5">left-falling stroke</tspan><tspan x="495.5" y="512.1">from the upper centre</tspan><tspan x="495.5" y="615.6">down-left</tspan></text></svg><rect x="176" y="42" width="150" height="219.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="219.73" viewBox="-34 -906 1059 1551.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M291 836L361 815Q327 729 282.5 645.5Q238 562 186.5 488Q135 414 79 357Q76 366 68 380Q60 394 51.5 408Q43 422 36 431Q87 480 134 545Q181 610 221.5 684.5Q262 759 291 836ZM189 579L261 651L262 650L262 -78L189 -78L189 579ZM327 494L955 494L955 420L327 420L327 494ZM607 830L685 830L685 -80L607 -80L607 830Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M280 810 L265 760 L245 700 L220 640 L190 580 L155 525 L120 480 L85 450 L50 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M225 590 L225 590" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M225 590 L225 480 L225 370 L225 260 L225 150 L225 40 L225 -65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="225" cy="-65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495.5" y="304.9" text-anchor="middle" font-size="84.9" fill="#6b7280"><tspan x="495.5" y="304.9">2. lift, then descend</tspan><tspan x="495.5" y="408.5">亻&apos;s vertical stroke to</tspan><tspan x="495.5" y="512.1">the baseline</tspan></text></svg><rect x="336" y="42" width="150" height="219.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="219.73" viewBox="-34 -906 1059 1551.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M291 836L361 815Q327 729 282.5 645.5Q238 562 186.5 488Q135 414 79 357Q76 366 68 380Q60 394 51.5 408Q43 422 36 431Q87 480 134 545Q181 610 221.5 684.5Q262 759 291 836ZM189 579L261 651L262 650L262 -78L189 -78L189 579ZM327 494L955 494L955 420L327 420L327 494ZM607 830L685 830L685 -80L607 -80L607 830Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M280 810 L265 760 L245 700 L220 640 L190 580 L155 525 L120 480 L85 450 L50 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M225 590 L225 480 L225 370 L225 260 L225 150 L225 40 L225 -65" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M340 457 L340 457" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M340 457 L440 457 L540 457 L640 457 L740 457 L840 457 L940 457" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="940" cy="457" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495.5" y="304.9" text-anchor="middle"