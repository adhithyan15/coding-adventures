<svg xmlns="http://www.w3.org/2000/svg" width="342" height="376.02" viewBox="0 0 342 376.02" role="img" aria-label="How to write થ: 2 strokes · 1 pen lift · 2 movements"><title>Writing થ</title><desc>2 frames; frame N shows movements 1 to N of થ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, થ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates થ as two ordered pen-down runs. Its first SVG path begins at the right of the small upper loop, circles that loop, continues downward through the middle, sweeps left and around the broad lower body, then rises into the right shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the small upper loop, middle descent, broad lower body, right shoulder, tall spine, and lower foot, but its printed loop and body are wider and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s loop-and-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loop, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="376.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="245.02" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.02" viewBox="-30 -673 717 1171.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M275 146Q186 146 131.5 192Q77 238 48 321Q143 349 191.5 385.5Q240 422 240 477Q240 506 222.5 520.5Q205 535 179 535Q150 535 133.5 522.5Q117 510 117 489Q117 472 126.5 458Q136 444 162 430L116 376Q76 398 58 426.5Q40 455 40 491Q40 536 75.5 569.5Q111 603 178 603Q229 603 259.5 584Q290 565 304 535.5Q318 506 318 474Q318 408 274.5 361.5Q231 315 151 281Q169 252 198.5 235Q228 218 276 218Q336 218 377.5 239.5Q419 261 450 292L450 603L530 592L530 152Q530 125 533 112.5Q536 100 542 92Q553 78 574.5 75.5Q596 73 617 73L609 0L599 0Q556 0 527 9.5Q498 19 481 37Q465 54 457.5 79Q450 104 450 148L450 201Q420 179 379 162.5Q338 146 275 146Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 490 L270 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M270 490 L255 530 L225 560 L180 570 L135 555 L105 525 L95 485 L108 450 L140 425 L108 450 L95 485 L105 525 L135 555 L180 570 L225 560 L255 530 L270 490 L270 450 L270 410 L270 390 L250 350 L215 315 L180 300 L145 290 L120 285 L85 305 L100 260 L130 220 L175 190 L230 175 L290 178 L345 195 L390 225 L430 265 L465 295" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="465" cy="295" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="328.5" y="197.5">1. circle the small</tspan><tspan x="328.5" y="267.7">upper loop, descend,</tspan><tspan x="328.5" y="337.8">and sweep around the</tspan><tspan x="328.5" y="408">broad body into the</tspan><tspan x="328.5" y="478.1">right shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="245.02" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="245.02" viewBox="-30 -673 717 1171.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M275 146Q186 146 131.5 192Q77 238 48 321Q143 349 191.5 385.5Q240 422 240 477Q240 506 222.5 520.5Q205 535 179 535Q150 535 133.5 522.5Q117 510 117 489Q117 472 126.5 458Q136 444 162 430L116 376Q76 398 58 426.5Q40 455 40 491Q40 536 75.5 569.5Q111 603 178 603Q229 603 259.5 584Q290 565 304 535.5Q318 506 318 474Q318 408 274.5 361.5Q231 315 151 281Q169 252 198.5 235Q228 218 276 218Q336 218 377.5 239.5Q419 261 450 292L450 603L530 592L530 152Q530 125 533 112.5Q536 100 542 92Q553 78 574.5 75.5Q596 73 617 73L609 0L599 0Q556 0 527 9.5Q498 19 481 37Q465 54 457.5 79Q450 104 450 148L450 201Q420 179 379 162.5Q338 146 275 146Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 490 L255 530 L225 560 L180 570 L135 555 L105 525 L95 485 L108 450 L140 425 L108 450 L95 485 L105 525 L135 555 L180 570 L225 560 L255 530 L270 490 L270 450 L270 410 L270 390 L250 350 L215 315 L180 300 L145 290 L120 285 L85 305 L100 260 L130 220 L175 190 L230 175 L290 178 L345 195 L390 225 L430 265 L465 295" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M490 585 L490 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M490 585 L490 520 L490 450 L490 380 L490 310 L490 240 L490 175 L492 125 L500 90 L520 62 L548 45 L580 38 L603 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="603" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="328.5" y="197.5">2. lift, descend the</tspan><tspan x="328.5" y="267.7">tall right spine, and</tspan><tspan x="328.5" y="337.8">turn through its lower</tspan><tspan x="328.5" y="408">foot</tspan></text></svg><text x="16" y="300.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="312.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, થ animation, first and second SVG</text><text x="16" y="325.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="337.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="350.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
