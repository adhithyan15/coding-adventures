[package]
name = "vos-probe-ready"
version = "0.1.0"
edition = "2021"
description = "Fixture of the VOS-028b capacity probe: the bitmap ready set at N = 8 and N = 10, bound to a generated by-value evidence harness whose binder products reach 393,216"

[lib]
name = "vos_probe_ready"
path = "src/lib.rs"

[dev-dependencies]
# The generated evidence harness hashes the spec and the source tree.
coding_adventures_sha256 = { path = "../sha256" }
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }

# Generated from code/specs/vos-probe-ready.warrant (VER04h).  The probe program includes the
# same generated file and drives its `exh_*` entry points in process (E1).
[[test]]
name = "warrant_evidence"
path = "tests/warrant_evidence.rs"
harness = false

[[test]]
name = "behaviour"
path = "tests/behaviour.rs"
