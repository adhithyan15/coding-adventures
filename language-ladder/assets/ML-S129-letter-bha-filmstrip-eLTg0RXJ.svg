<svg xmlns="http://www.w3.org/2000/svg" width="662" height="316.32" viewBox="0 0 662 316.32" role="img" aria-label="How to write ഭ: one unbroken stroke · 4 movements"><title>Writing ഭ</title><desc>4 frames; frame N shows movements 1 to N of ഭ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxix: movements 1-4 for ഭ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-039.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxix) starts at the left foot and climbs clockwise over the top (1), comes down into the middle (2), curls left and then right (3) and rounds the lower bowl to finish at the bottom, heading left (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 37 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (35 of 37) and end at the lower centre (31 of 37). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its BHA.png at the lower left and ends it at the lower left. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="662" height="316.3