<svg xmlns="http://www.w3.org/2000/svg" width="982" height="298.54" viewBox="0 0 982 298.54" role="img" aria-label="How to write 百: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 百</title><desc>6 frames; frame N shows movements 1 to N of 百 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 百.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%99%BE.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 百. Median 1 is the bar across the very top; median 2 is the short left-falling stroke beneath it; medians 3–6 build the box below exactly as 四&apos;s outer frame and inner bar were built — left side, then the top-and-right turn, then the inner horizontal, then the closing floor. Outside before inside, and the box is closed last.</desc><rect x="0" y="0" width="982" height="298.54" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="205.04" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="205.04" viewBox="-6 -856 1013 1384.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M64 786L937 786L937 713L64 713L64 786ZM230 310L789 310L789 241L230 241L230 310ZM232 54L781 54L781 -16L232 -16L232 54ZM455 760L543 741Q534 703 523.5 662Q513 621 503.5 584Q494 547 483 518L413 536Q421 567 429.5 606.5Q438 646 445 686Q452 726 455 760ZM177 563L837 563L837 -81L759 -81L759 493L253 493L253 -81L177 -81L177 563Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M80