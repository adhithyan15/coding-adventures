<svg xmlns="http://www.w3.org/2000/svg" width="502" height="305.5" viewBox="0 0 502 305.5" role="img" aria-label="How to write ज: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ज</title><desc>3 frames; frame N shows movements 1 to N of ज (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ज-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9C-order.gif&gt;. Source note on variation: The 20-frame animation shows three ordered pen-down runs over its gray guide: frames 2–10 start at the open upper-left tip, sweep down and clockwise around the lower bowl, rise through the inner shoulder, and continue right along the middle bar to the right-stem junction without lifting; frames 11–15 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 16–18 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 10 and 15 mark the first two run endings before the one-second completed frame 19. This learner path follows that sourced three-run order and fits its hook and bowl to Noto Sans Devanagari; everyday handwriting may narrow or simplify the bowl differently.</desc><rect x="0" y="0" width="502" height="305.5" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="199.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.5" viewBox="-70 -692 896 1191.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M653 551L653 0L572 0L572 370L435 370Q409 370 393.5 371Q378 372 369 375L362 385Q404 356 431 312Q458 268 458 218Q458 172 437.5 141Q417 110 383.5 95Q350 80 310 80Q270 80 233.5 97Q197 114 162.5 151.5Q128 189 95.5 250.5Q63 312 31 401L102 426Q133 337 165 276Q197 215 232 184Q267 153 306 153Q338 153 358.5 170Q379 187 379 227Q379 271 348.5 310Q318 349 273 377L302 441L572 441L572 551L0 551L0 622L756 622L756 551L653 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 420 L90 420" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M90 420 L70 370 L90 300 L115 240 L155 180 L210 140 L270 115 L330 110 L390 135 L415 180 L420 240 L410 300 L390 350 L350 380 L300 400 L380 400 L480 400 L575 400 L610 400" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="610" cy="400" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378" y="211.8" text-anchor="middle" font-size="71.8" fill="#6b7280"><tspan x="378" y="211.8">1. sweep around the</tspan><tspan x="378" y="299.4">lower bowl and continue</tspan><tspan x="378" y="387">right through the</tspan><tspan x="378" y="474.6">middle bar</tspan></text></svg><rect x="176" y="42" width="150" height="199.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="199.5" viewBox="-70 -692 896 1191.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M653 551L653 0L572 0L572 370L435 370Q409 370 393.5 371Q378 372 369 375L362 385Q404 356 431 312Q458 268 458 218Q458 172 437.5 141Q417 110 383.5 95Q350 80 310 80Q270 80 233.5 97Q197 114 162.5 151.5Q128 189 95.5 250.5Q63 312 31 401L102 426Q133 337 165 276Q197 215 232 184Q267 153 306 153Q338 153 358.5 170Q379 187 379 227Q379 271 348.5 310Q318 349 273 377L302 441L572 441L572 551L0 551L0 622L756 622L756 551L653 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 420 L70 370 L90 300 L115 240 L155 180 L210 140 L270 115 L330 110 L390 135 L415 180 L420 240 L410 300 L390 350 L350 380 L300 400 L380 400 L480 400 L575 400 L610 400" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M610 551 L610 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M610 551 L610 475 L610 395 L610 315 L610 235 L610 155 L610 75 L610 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="610" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378" y="211.8" text-anchor="middle" font-size="71.8" fill="#6b7280"><tspan x="378" y="211.8">2. lift, then descend</tspan><tspan x="378" y="299.4">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="199.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="199.5" viewBox="-70 -692 896 1191.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M653 551L653 0L572 0L572 370L435 370Q409 370 393.5 371Q378 372 369 375L362 385Q404 356 431 312Q458 268 458 218Q458 172 437.5 141Q417 110 383.5 95Q350 80 310 80Q270 80 233.5 97Q197 114 162.5 151.5Q128 189 95.5 250.5Q63 312 31 401L102 426Q133 337 165 276Q197 215 232 184Q267 153 306 153Q338 153 358.5 170Q379 187 379 227Q379 271 348.5 310Q318 349 273 377L302 441L572 441L572 551L0 551L0 622L756 622L756 551L653 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 420 L70 370 L90 300 L115 240 L155 180 L210 140 L270 115 L330 110 L390 135 L415 180 L420 240 L410 300 L390 350 L350 380 L300 400 L380 400 L480 400 L575 400 L610 400" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M610 551 L610 475 L610 395 L610 315 L610 235 L610 155 L610 75 L610 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L585 585 L675 585 L750 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="750" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378" y="211.8" text-anchor="middle" font-size="71.8" fill="#6b7280"><tspan x="378" y="211.8">3. lift, then draw the</tspan><tspan x="378" y="299.4">shirorekha</tspan><tspan x="378" y="387">left-to-right</tspan></text></svg><text x="16" y="254.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ज-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="267" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="279.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
