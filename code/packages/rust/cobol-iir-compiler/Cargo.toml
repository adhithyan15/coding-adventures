[package]
name = "cobol-iir-compiler"
version = "0.27.0"
edition = "2021"
description = "COBOL-60 frontend for the LANG VM AOT chain — lowers a parsed COBOL program into interpreter_ir::IIRModule so it runs on every execution backend. v0.27.0 adds the first CROSS-category MOVE: MOVE numeric-item TO alphanumeric-item for an UNSIGNED INTEGER source (PIC 9(n), no S, no V) into a PIC X(m) receiver. COBOL treats the numeric sending item as though it held its digit characters — the n-digit zero-padded magnitude image DISPLAY shows — then moves it by the alphanumeric rules: LEFT-justified, space-padded on the right when the receiver is wider, truncated on the right when narrower (so PIC 9(3)=042 → X(5) is \"042  \", → X(2) is \"04\", → X(3) is \"042\"). The compiler builds the n-character digit string at run time from the numeric slot — each digit is (slot / 10^k) % 10, sliced out of a constant \"0123456789\" table via str_slice[d,d+1) and concatenated — then feeds it through the SAME str_slice/str_concat char reshape a same-category alphanumeric MOVE emits, so it is byte-identical to the oracle (which takes Decimal::digits() through move_into_char). The reverse direction (alphanumeric → numeric), a signed (PIC S9) or scaled (PIC 9V9) or edited numeric source, a numeric-edited receiver, and a group item on either side remain clean later rungs. v0.26.0 adds COMPUTED reference modification IDENT(start:len) where start and/or len are DATA-NAME (run-time integer) operands — WS(J:K), WS(J:), WS(2:K) — lowering to a run-time str_slice(src, start0, end) with start0 = start-1 and end = start0+len (or the item width for an omitted length) computed via sub/add over the index registers; the index item must be an unsigned integer. An out-of-range computed refmod traps at run time under the identical predicate the str_slice VM/wasm bounds check enforces (start0 < 0 || end < start0 || end > width), and the oracle applies the same predicate (returning RefModOutOfRange), so an in-range program slices byte-identically and an out-of-range one errors on both engines. A literal:literal refmod is still constant-folded exactly as before. A signed/fractional/non-numeric index item, reference modification of a numeric item, and use in a numeric/MOVE-source context remain later rungs. v0.25.0 adds INSPECT source CONVERTING from TO to (translate every character of an alphanumeric source through a per-character table built from two equal-length string literals — a character equal to from[k] becomes to[k], first occurrence wins, others unchanged — via a compile-time unroll over the source width with a first-match-wins chain per position, byte-identical to the oracle's char→char map; unequal-length or non-ASCII literals, a data-name/figurative/reference-modified from/to, and a BEFORE/AFTER region remain later rungs). v0.24.0 adds the combined INSPECT source TALLYING counter FOR ALL delim REPLACING ALL x BY y (one INSPECT carrying BOTH phrases), which composes the two existing lowerings in ISO order — count FIRST over the original source bytes into the counter, then rewrite the source — so a shared delimiter/search character is tallied before it is substituted. v0.23.0: DISPLAY / MOVE / STOP RUN, integer + scaled-decimal (PIC …V…) ADD/SUBTRACT/MULTIPLY/DIVIDE with ROUNDED and ON SIZE ERROR, numeric and character item-to-item MOVE reshaping, reference modification IDENT(start:len) / IDENT(start:) with constant integer indices in DISPLAY and alphanumeric-comparison contexts (constant-index str_slice), STRING … DELIMITED BY SIZE INTO (concatenate sending fields into an alphanumeric receiver, left-justified, truncated at the receiver width, with the ANSI-85 no-space-fill tail), UNSTRING source DELIMITED BY delim INTO r1 [r2 …] (split one alphanumeric source on a single-character delimiter — a 1-char literal or a PIC X(1) item — into successive receivers via a run-time scan loop; each receiver including the last takes the field up to the next delimiter, extra fields are dropped, empty fields become spaces, and once the source is exhausted the remaining receivers are left unchanged), INSPECT source TALLYING counter FOR ALL delim (a run-time scan loop counting the occurrences of a single-character delimiter — a 1-char literal or a PIC X(1) item — in an alphanumeric source and ADDING them to an unsigned-integer counter, byte-identical to the oracle's store path), INSPECT source REPLACING ALL x BY y (rebuild the alphanumeric source in place, mapping every occurrence of the single character x — a 1-char literal or PIC X(1) item — to the single character y, via a compile-time unroll over the source width matching the oracle's per-position map), IF/ELSE with compound (AND/OR/NOT, parenthesised) conditions over numeric and alphanumeric (space-padded) relations using word or symbolic (> < = >= <= <>) operators and level-88 condition-names (single value, multiple values, and THRU ranges) with SET … TO TRUE, GO TO and PERFORM (paragraph / TIMES / UNTIL / VARYING / THRU), EVALUATE (case statement, numeric or alphanumeric subject, with multi-value and THRU-range WHENs), COMPUTE with operator precedence, exponentiation (** with a constant integer exponent), and nested division (scale-12 intermediate matching the oracle), and signed numerics (PIC S9…, trailing overpunch DISPLAY) — over scaled-i64 slots and str slots, byte-identical to the cobol-runtime oracle. Group items, cross-category MOVE, a signed/fractional/non-numeric reference-modification index item or reference modification of a numeric item or in a numeric/MOVE-source context, a variable/fractional ** exponent, ON-SIZE-ERROR-with-nested-division, alphanumeric level-88 condition-names, figuratives, STRING with a real delimiter / WITH POINTER / ON OVERFLOW, UNSTRING with a multi-character / ALL / OR delimiter or WITH POINTER / ON OVERFLOW, INSPECT with a LEADING / CHARACTERS tally, BEFORE/AFTER phrases, several counters or FOR phrases, REPLACING CHARACTERS / LEADING / FIRST, several replace items, and a combined statement whose TALLYING or REPLACING half is itself a deferred sub-form, and the other string verbs remain later rungs. See PL09-codegen.md."

[dependencies]
coding-adventures-cobol-parser  = { path = "../cobol-parser" }
# Reused for its exact PICTURE and fixed-point-value logic (Picture / Decimal /
# move_into_char / move_into_numeric) — not its interpreter (PL09).
coding-adventures-cobol-runtime = { path = "../cobol-runtime" }
parser         = { path = "../parser" }
interpreter-ir = { path = "../interpreter-ir" }

[dev-dependencies]
# tests/backend_compat.rs proves the compiled module is accepted by
# every IIR-to-* backend validator.
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/jit_e2e.rs runs the compiled module through the generic VM/JIT and
# checks the DISPLAYed bytes against the cobol-runtime oracle.
vm-core  = { path = "../vm-core" }
jit-core = { path = "../jit-core" }
