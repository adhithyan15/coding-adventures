<svg xmlns="http://www.w3.org/2000/svg" width="502" height="312.18" viewBox="0 0 502 312.18" role="img" aria-label="How to write छ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing छ</title><desc>3 frames; frame N shows movements 1 to N of छ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-छ-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9B-order.gif&gt;. Source note on variation: The 28-frame animation shows three ordered pen-down runs over its gray guide: frames 2–20 start at the upper loop&apos;s headline-side junction, sweep counterclockwise around the upper-left loop, continue clockwise around the broad lower bowl, rise along the outer right side, and curl counterclockwise around the inner loop to its down-right tip without lifting; frames 21–22 restart at the short upper stem&apos;s headline junction and descend top-to-bottom; frames 23–26 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 20 and 22 mark the first two run endings before the one-second completed frame 27. This learner path follows that sourced three-run order and fits the disconnected upper-loop tip and nested curves to Noto Sans Devanagari; everyday handwriting may join, narrow, or simplify the loops differently.</desc><rect x="0" y="0" width="502" height="312.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="206.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="206.18" viewBox="-70 -692 855 1175.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__g