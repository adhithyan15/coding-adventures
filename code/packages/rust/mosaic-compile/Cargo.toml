[package]
name = "mosaic-compile"
version = "0.1.0"
edition = "2021"
description = "CLI that reads a .mosaic file and compiles to a target backend (webcomponent, html, react, paint)"

[[bin]]
name = "mosaic-compile"
path = "src/main.rs"

[dependencies]
cli-builder = { path = "../cli-builder" }
mosaic-analyzer = { path = "../mosaic-analyzer" }
mosaic-vm = { path = "../mosaic-vm" }
mosaic-emit-webcomponent = { path = "../mosaic-emit-webcomponent" }
mosaic-emit-html = { path = "../mosaic-emit-html" }
mosaic-emit-react = { path = "../mosaic-emit-react" }
mosaic-emit-paint = { path = "../mosaic-emit-paint" }
mosaic-emit-xaml = { path = "../mosaic-emit-xaml" }
# UI30 — every per-backend emitter exposes pipeline::from_pipeline().
# Wiring all of them into the CLI lets `mosaic-compile --backend <X>`
# work with .mil/.mll/.msl triples for X in
# {react, html, webcomponent, swiftui, qt, flutter, xaml}.
mosaic-emit-swiftui = { path = "../mosaic-emit-swiftui" }
mosaic-emit-qt = { path = "../mosaic-emit-qt" }
mosaic-emit-flutter = { path = "../mosaic-emit-flutter" }
mosaic-emit-compose = { path = "../mosaic-emit-compose" }
mosaic-package-manifest = { path = "../mosaic-package-manifest" }
mosaic-package-resolver = { path = "../mosaic-package-resolver" }
mosmodel-compiler = { path = "../mosmodel-compiler" }
moslayout-compiler = { path = "../moslayout-compiler" }
mosstyle-compiler = { path = "../mosstyle-compiler" }
mosaic-package-artifact-builder = { path = "../mosaic-package-artifact-builder" }
serde_json = "1"
