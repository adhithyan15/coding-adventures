<svg xmlns="http://www.w3.org/2000/svg" width="662" height="325.17" viewBox="0 0 662 325.17" role="img" aria-label="How to write 文: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 文</title><desc>4 frames; frame N shows movements 1 to N of 文 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 文.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%96%87.json&gt;. Source note on variation: The cited PRC-order dataset supplies four separately started strokes for 文: the top dot, the horizontal, the long left-falling stroke, and the long right-falling stroke. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians share the coordinate system used for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. The ductus uses those ordered source medians directly; the vendored Noto Sans SC outline can differ in width and proportion from the Arphic-derived source graphics.</desc><rect x="0" y="0" width="662" height="325.17" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="219.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.17" viewBox="-34 -917 1071 1564.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M725 630L802 607Q739 426 640 294Q541 162 403 71.5Q265 -19 83 -78Q79 -69 71 -55.5Q63 -42 53.5 -28.5Q44 -15 36 -7Q215 45 348.5 128.5Q482 212 575 335.5Q668 459 725 630ZM270 626Q327 471 424 345Q521 219 657 129.5Q793 40 967 -4Q959 -12 949 -24.5Q939 -37 930.5 -49.5Q922 -62 915 -73Q736 -24 599 70.5Q462 165 363.5 300Q265 435 201 603L270 626ZM50 664L954 664L954 590L50 590L50 664ZM423 823L501 847Q524 811 546.5 767.5Q569 724 580 693L497 666Q488 697 467 741.5Q446 786 423 823Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M440 820 L440 820" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M440 820 L470 770 L510 700" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="510" cy="700" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.8" text-anchor="middle" font-size="85.8" fill="#6b7280"><tspan x="501.5" y="303.8">1. draw the top dot down</tspan><tspan x="501.5" y="408.5">and right</tspan></text></svg><rect x="176" y="42" width="150" height="219.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="219.17" viewBox="-34 -917 1071 1564.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M725 630L802 607Q739 426 640 294Q541 162 403 71.5Q265 -19 83 -78Q79 -69 71 -55.5Q63 -42 53.5 -28.5Q44 -15 36 -7Q215 45 348.5 128.5Q482 212 575 335.5Q668 459 725 630ZM270 626Q327 471 424 345Q521 219 657 129.5Q793 40 967 -4Q959 -12 949 -24.5Q939 -37 930.5 -49.5Q922 -62 915 -73Q736 -24 599 70.5Q462 165 363.5 300Q265 435 201 603L270 626ZM50 664L954 664L954 590L50 590L50 664ZM423 823L501 847Q524 811 546.5 767.5Q569 724 580 693L497 666Q488 697 467 741.5Q446 786 423 823Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M440 820 L470 770 L510 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M50 625 L50 625" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d