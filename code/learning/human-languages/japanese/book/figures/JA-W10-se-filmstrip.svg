<svg xmlns="http://www.w3.org/2000/svg" width="822" height="286.26" viewBox="0 0 822 286.26" role="img" aria-label="How to write せ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing せ</title><desc>5 frames; frame N shows movements 1 to N of せ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana せ stroke order animation.gif, hiragana せ, 33 frames, 3.3 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%9B_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws せ in three pen-down runs with two lifts: the long horizontal from left to right, the left stem descending through it and curving right along the base, then the right stem descending through it and hooking left. The learner path is fitted to the bundled Noto Sans JP subset; handwritten stem spacing and hook depth vary, but the three-run order remains the same.</desc><rect x="0" y="0" width="822" height="286.26" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="192.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="192.76" viewBox="-25 -841 1017 1306.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M740 771Q739 763 738 750Q737 737 736.5 723.5Q736 710 735 699Q735 668 734.5 635Q734 602 733.5 571.5Q733 541 732 515Q731 477 729.5 431.5Q728 386 725.5 345Q723 304 717 278Q710 245 692.5 233Q675 221 640 221Q622 221 596 223.5Q570 226 546 229Q522 232 508 235L510 304Q536 298 564.5 294.5Q593 291 610 291Q629 291 637.5 296Q646 301 648 318Q652 338 654 370.5Q656 403 657.5 441.5Q659 480 660 515Q660 543 660 574.5Q660 606 660 637.5Q660 669 660 696Q660 707 659.5 72