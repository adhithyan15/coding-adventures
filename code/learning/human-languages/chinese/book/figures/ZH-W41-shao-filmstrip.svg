<svg xmlns="http://www.w3.org/2000/svg" width="662" height="311.3" viewBox="0 0 662 311.3" role="img" aria-label="How to write 少: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 少</title><desc>4 frames; frame N shows movements 1 to N of 少 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 少.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B0%91.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 少. Medians 1–3 draw 小 on top, its vertical without a hook: the vertical, a short stroke on the left falling to the lower left, then a dot on the right falling to the lower right. Median 4 draws the long left-falling stroke that sweeps under it. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="311.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="205.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="205.3" viewBox="-37 -910 1060 1450.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductu