[package]
name = "smart-home-govee-lan-integration"
version = "0.1.0"
edition = "2021"
description = "Production Govee LAN UDP integration for the smart-home runtime"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smart-home-core = { path = "../smart-home-core" }
smart-home-discovery = { path = "../smart-home-discovery" }
smart-home-runtime = { path = "../smart-home-runtime" }
udp-client = { path = "../udp-client" }
