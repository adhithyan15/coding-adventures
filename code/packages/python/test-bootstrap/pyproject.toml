[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-test-bootstrap"
version = "0.3.0"
description = "Deterministic SplitMix64 PRNG, property-based testing, fuzzing, and TFV evidence emission"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/coding_adventures_test_bootstrap",
    "src/test_bootstrap",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=coding_adventures_test_bootstrap --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/coding_adventures_test_bootstrap"]

[tool.coverage.report]
fail_under = 95
show_missing = true
