[package]
name = "coding_adventures_warrant_corpus_gen"
version = "0.1.0"
edition = "2021"
description = "Warrant corpus v2 emitter (VER04r slice S3): ir.core lowering, worst-path cost accounting and the single wrapping rule; evaluator, digests and emission follow in S3b to S3c"
license = "MIT"

[dependencies]
# The S2 public API (VER04r CV2-S2): the parsed and checked document, the fixed-width
# arithmetic helpers and, from S3b, the resolved-domain enumerator.
coding_adventures_warrant_grammar = { path = "../warrant-grammar" }
# SHA-256: S3a uses it for `profile_sha256` (the digest of corpus.profile, VER04r 1.4);
# S3b adds the suite and chunk digests on the same crate.
coding_adventures_sha256 = { path = "../sha256" }
