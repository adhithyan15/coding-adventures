<svg xmlns="http://www.w3.org/2000/svg" width="502" height="332.35" viewBox="0 0 502 332.35" role="img" aria-label="How to write 山: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 山</title><desc>3 frames; frame N shows movements 1 to N of 山 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 山.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B1%B1.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 山. Median 1 draws the tall vertical down the middle; median 2 draws the left side and turns right along the foot without lifting; median 3 draws the right vertical last. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="332.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="226.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.35" viewBox="38 -899 925 1395.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M460 829L538 829L538 37L460 37L460 829ZM816 633L893 633L893 -76L816 -76L816 633ZM108 632L185 632L185 74L855 74L855 -2L108 -2L108 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M498 812 L498 812" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M498 812 L498 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="498" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="290.1" text-anchor="middle" font-size="74.1" fill="#6b7280"><tspan x="500.5" y="290.1">1. draw the middle</tspan><tspan x="500.5" y="380.5">vertical</tspan></text></svg><rect x="176" y="42" width="150" height="226.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="226.35" viewBox="38 -899 925 1395.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M460 829L538 829L538 37L460 37L460 829ZM816 633L893 633L893 -76L816 -76L816 633ZM108 632L185 632L185 74L855 74L855 -2L108 -2L108 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M498 812 L498 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M146 613 L146 613" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M146 613 L146 35 L830 35" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="830" cy="35" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="290.1" text-anchor="middle" font-size="74.1" fill="#6b7280"><tspan x="500.5" y="290.1">2. lift, then draw the</tspan><tspan x="500.5" y="380.5">left side and turn along</tspan><tspan x="500.5" y="470.9">the foot</tspan></text></svg><rect x="336" y="42" width="150" height="226.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="226.35" viewBox="38 -899 925 1395.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M460 829L538 829L538 37L460 37L460 829ZM816 633L893 633L893 -76L816 -76L816 633ZM108 632L185 632L185 74L855 74L855 -2L108 -2L108 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M498 812 L498 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M146 613 L146 35 L830 35" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M854 616 L854 616" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M854 616 L854 -62" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="854" cy="-62" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="290.1" text-anchor="middle" font-size="74.1" fill="#6b7280"><tspan x="500.5" y="290.1">3. lift, then draw the</tspan><tspan x="500.5" y="380.5">right vertical</tspan></text></svg><text x="16" y="281.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 山.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="293.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="306.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
