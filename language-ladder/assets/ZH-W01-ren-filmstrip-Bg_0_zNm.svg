<svg xmlns="http://www.w3.org/2000/svg" width="342" height="335.17" viewBox="0 0 342 335.17" role="img" aria-label="How to write 人: 2 strokes · 1 pen lift · 2 movements"><title>Writing 人</title><desc>2 frames; frame N shows movements 1 to N of 人 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 人.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BA%BA.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 人. Median 1 starts near the upper centre and descends down-left; median 2 restarts near the central junction and descends down-right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their directions and one intervening pen lift; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="342" height="335.17" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="204.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="204.17" viewBox="-27 -907 1062 1445.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M457 837L541 837Q540 792 536 724Q532 656 520 572.5Q508 489 480.5 399Q453 309 405 221.5Q357 134 283.5 57Q210 -20 104 -76Q94 -62 77 -45.5Q60 -29 43 -17Q147 36 218.5 108.5Q290 181 335 264Q380 347 405 431.5Q430 516 440.5 594Q451 672 454 735Q457 798 457 837ZM531 713Q534 696 540 648Q546 600 562 533Q578 466 607.5 390Q637 314 684 239Q731 164 800.5 99Q870 34 965 -9Q949 -21 934 -39Q919 -57 910 -72Q812 -26 740.5 43Q669 112 620.5 192Q572 272 542 353.5Q512 435 495.5 507Q479 579 471 631.5Q463 684 460 706L531 713Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M500 810 L500 810" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M500 810 L500 740 L490 650 L470 555 L445 465 L410 375 L365 285 L310 200 L245 120 L175 55 L105 5 L65 -25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="65" cy="-25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="301.1" text-anchor="middle" font-size="85.1" fill="#6b7280"><tspan x="504" y="301.1">1. draw the</tspan><tspan x="504" y="404.9">left-falling piě stroke</tspan><tspan x="504" y="508.7">from the upper centre</tspan></text></svg><rect x="176" y="42" width="150" height="204.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="204.17" viewBox="-27 -907 1062 1445.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M457 837L541 837Q540 792 536 724Q532 656 520 572.5Q508 489 480.5 399Q453 309 405 221.5Q357 134 283.5 57Q210 -20 104 -76Q94 -62 77 -45.5Q60 -29 43 -17Q147 36 218.5 108.5Q290 181 335 264Q380 347 405 431.5Q430 516 440.5 594Q451 672 454 735Q457 798 457 837ZM531 713Q534 696 540 648Q546 600 562 533Q578 466 607.5 390Q637 314 684 239Q731 164 800.5 99Q870 34 965 -9Q949 -21 934 -39Q919 -57 910 -72Q812 -26 740.5 43Q669 112 620.5 192Q572 272 542 353.5Q512 435 495.5 507Q479 579 471 631.5Q463 684 460 706L531 713Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M500 810 L500 740 L490 650 L470 555 L445 465 L410 375 L365 285 L310 200 L245 120 L175 55 L105 5 L65 -25" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 690 L500 690" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M500 690 L515 620 L535 535 L565 445 L605 355 L655 265 L715 180 L785 105 L860 45 L925 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="925" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="301.1" text-anchor="middle" font-size="85.1" fill="#6b7280"><tspan x="504" y="301.1">2. lift, then draw the</tspan><tspan x="504" y="404.9">right-falling nà stroke</tspan><tspan x="504" y="508.7">from the junction</tspan></text></svg><text x="16" y="259.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 人.json, ordered stroke</text><text x="16" y="271.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="284.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="296.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="309.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
