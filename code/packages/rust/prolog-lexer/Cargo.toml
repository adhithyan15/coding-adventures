[package]
name = "prolog-lexer"
version = "0.2.0"
edition = "2021"
description = "ISO/Core Prolog lexer — thin glue around the grammar-driven GrammarLexer, sourced from code/grammars/prolog/iso.tokens. v0.2 adds the NAF (`\\+`) token and BLOCK_COMMENT (`/* ... */`) skip rule."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
