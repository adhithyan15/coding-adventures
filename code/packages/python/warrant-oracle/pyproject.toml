[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-warrant-oracle"
version = "0.1.2"
description = "Independent .warrant source reader and corpus oracle for Warrant corpus v2 (VER04r)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
warrant-oracle = "coding_adventures_warrant_oracle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_adventures_warrant_oracle"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
# Long lines are all prose (docstring tables and spec citations), which the
# formatter must not rewrap; ``zip`` is always over equal-length lists here.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
"src/coding_adventures_warrant_oracle/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coding_adventures_warrant_oracle --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/coding_adventures_warrant_oracle"]
# The enumeration tests run hot loops; sys.monitoring (3.12+) is ~7x faster than
# the default tracer and falls back automatically where unavailable.
core = "sysmon"

[tool.coverage.report]
fail_under = 95
show_missing = true
