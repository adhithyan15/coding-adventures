<svg xmlns="http://www.w3.org/2000/svg" width="502" height="342.1" viewBox="0 0 502 342.1" role="img" aria-label="How to write ೧: one unbroken stroke · 3 movements"><title>Writing ೧</title><desc>3 frames; frame N shows movements 1 to N of ೧ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೧, trace image file-vkey5uhp.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೧ as one path that starts at the foot of the left side, climbs it, turns clockwise over the top and comes down the right side to finish at the right foot (start lower left, end lower right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="502" height="342.1" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="223.6" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="223.6" viewBox="-16 -772 720 1073.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M344 702Q418 702 473 674.5Q528 647 563.5 599Q599 551 616.5 488.5Q634 426 634 355Q634 284 618 219Q602 154 573 96Q544 38 503 -13L431 37Q483 102 514.5 185Q546 268 546 359Q546 414 534 461.5Q522 509 497 545Q472 581 434 601Q396 621 344 621Q276 621 231 586Q186 551 164 492Q142 433 142 359Q142 271 170 190.5Q198 110 256 37L185 -13Q146 37 116.5 93Q87 149 70.5 214.5Q54 280 54 356Q54 427 72.5 490Q91 553 127.5 600.5Q164 648 218 675Q272 702 344 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M190 30 L190 30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M190 30 L178 65 L163 99 L146 134 L131 169 L120 206 L110 244 L104 283 L102 323 L101 364 L104 404 L108 444 L116 482 L127 519 L127 519" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="127" cy="519" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="210.7" text-anchor="middle" font-size="57.7" fill="#6b7280"><tspan x="344" y="210.7">1. climb the left side</tspan></text></svg><rect x="176" y="42" width="150" height="223.6" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="223.6" viewBox="-16 -772 720 1073.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M344 702Q418 702 473 674.5Q528 647 563.5 599Q599 551 616.5 488.5Q634 426 634 355Q634 284 618 219Q602 154 573 96Q544 38 503 -13L431 37Q483 102 514.5 185Q546 268 546 359Q546 414 534 461.5Q522 509 497 545Q472 581 434 601Q396 621 344 621Q276 621 231 586Q186 551 164 492Q142 433 142 359Q142 271 170 190.5Q198 110 256 37L185 -13Q146 37 116.5 93Q87 149 70.5 214.5Q54 280 54 356Q54 427 72.5 490Q91 553 127.5 600.5Q164 648 218 675Q272 702 344 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M190 30 L178 65 L163 99 L146 134 L131 169 L120 206 L110 244 L104 283 L102 323 L101 364 L104 404 L108 444 L116 482 L127 519 L127 519" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M127 519 L146 550 L168 579 L194 605 L223 626 L256 642 L290 651 L326 655 L363 655 L399 651 L434 642 L466 627 L496 606 L521 580 L542 550 L559 519" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="559" cy="519" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="210.7" text-anchor="middle" font-size="57.7" fill="#6b7280"><tspan x="344" y="210.7">2. arch clockwise over</tspan><tspan x="344" y="281.1">the top</tspan></text></svg><rect x="336" y="42" width="150" height="223.6" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="223.6" viewBox="-16 -772 720 1073.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M344 702Q418 702 473 674.5Q528 647 563.5 599Q599 551 616.5 488.5Q634 426 634 355Q634 284 618 219Q602 154 573 96Q544 38 503 -13L431 37Q483 102 514.5 185Q546 268 546 359Q546 414 534 461.5Q522 509 497 545Q472 581 434 601Q396 621 344 621Q276 621 231 586Q186 551 164 492Q142 433 142 359Q142 271 170 190.5Q198 110 256 37L185 -13Q146 37 116.5 93Q87 149 70.5 214.5Q54 280 54 356Q54 427 72.5 490Q91 553 127.5 600.5Q164 648 218 675Q272 702 344 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M190 30 L178 65 L163 99 L146 134 L131 169 L120 206 L110 244 L104 283 L102 323 L101 364 L104 404 L108 444 L116 482 L127 519 L146 550 L168 579 L194 605 L223 626 L256 642 L290 651 L326 655 L363 655 L399 651 L434 642 L466 627 L496 606 L521 580 L542 550 L559 519 L559 519" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M559 519 L570 485 L578 449 L583 413 L586 375 L586 338 L584 301 L579 264 L572 228 L563 194 L551 160 L537 127 L521 95 L507 63 L496 30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="496" cy="30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="210.7" text-anchor="middle" font-size="57.7" fill="#6b7280"><tspan x="344" y="210.7">3. come down the right</tspan><tspan x="344" y="281.1">side to the foot</tspan></text></svg><text x="16" y="278.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons</text><text x="16" y="291.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026):</text><text x="16" y="303.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the hidden, ordered tracing path for ೧, trace image file-vkey5uhp.svg</text><text x="16" y="316.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
