[package]
name = "iir-to-cil-bytecode"
version = "0.20.0"
edition = "2021"
description = "IIR → CIL bytecode backend — lowers IIRModule to CILProgramArtifact.  v0.20.0 (LANG-FULL E2 — register width & wrap, backend 5/6): masks a narrow-width (u4/u8/u16) arithmetic / bitwise / neg / not / shl result with `ldc.i4 <mask>; and` after the 32-bit CIL op — in BOTH emitters (the `lower` bytecode builder and the textual `il_text` path) — so `200u8+100u8=44` and `~0u8=255` (u32/i32 already wrap mod-2³² via the 32-bit op; a positive mask + `and`, not `conv.u1`, keeps the unsigned widths unsigned).  v0.18.0 (LANG-MATRIX LM-C Brainfuck): the textual `.il` emitter grows the byte-tape ops — alloc_bytes (`newarr [System.Runtime]System.Byte` into an `unsigned int8[]` local), load_byte (`ldelem.u1`), store_byte (`stelem.i1`) — and `putchar`/`getchar` (`Console::Write(char)`/`Read()`), with the Run() launcher discarding the entry result for a putchar program; so Brainfuck runs on real CoreCLR — the last code-gen cell of the matrix.  v0.7.0 (G4): whitelist call_builtin print_i64 and lower it to call env.BasicRuntime::PrintI64(int64), mirroring iir-to-wasm v0.8.0 (env.__print_i64) and iir-to-jvm-class-file v0.7.0 (env/BasicRuntime.println(J)V).  Together they let BASIC's PRINT reach real wasm, JVM, and CLR bytecode."

[lib]
name = "iir_to_cil_bytecode"
path = "src/lib.rs"

[dependencies]
interpreter-ir     = { path = "../interpreter-ir" }
ir-to-cil-bytecode = { path = "../ir-to-cil-bytecode" }
codegen-core       = { path = "../codegen-core" }
