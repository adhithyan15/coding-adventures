[package]
name = "coding-adventures-cobol-runtime"
version = "0.30.0"
edition = "2021"
description = "Runtime (tree-walking interpreter) for COBOL-60 — a faithful PICTURE-typed data model and statement execution, built on the cobol-parser CST. v0.30.0 adds COMPUTED reference modification IDENT(start:len) where start and/or len are DATA-NAME (run-time integer) operands — WS(J:K), WS(J:), WS(2:K): refmod_string evaluates each index to an i64 (a literal is its own value; a data-name must be an unsigned-integer item, its stored digits parsed), computes start0 = start-1 and end = start0+len (or the item width for an omitted length), and slices [start0, end). An out-of-range computed refmod returns the new RefModOutOfRange trap under the predicate start0 < 0 || end < start0 || end > width — the IDENTICAL bounds check the compiled str_slice enforces in the VM/wasm backends — so an in-range refmod slices byte-identically to the compiler and an out-of-range one errors on both. A signed/fractional/non-numeric index item, reference modification of a numeric item, and use in a numeric/MOVE-source context remain later rungs. v0.29.0 adds INSPECT source CONVERTING from TO to (translate every character of an alphanumeric source through a per-character table built from two equal-length string literals — a character equal to from[k] becomes to[k], the FIRST occurrence winning if from repeats a character, others left unchanged — in place, same width; unequal-length FROM/TO, a data-name/figurative/reference-modified from/to, a BEFORE/AFTER region, and a numeric/group source remain later rungs). v0.28.0 adds the combined INSPECT source TALLYING counter FOR ALL delim REPLACING ALL x BY y (one INSPECT carrying BOTH phrases): per ISO it runs as tally-then-replace — count delim in the ORIGINAL source into the counter FIRST, then replace every x with y — so a shared delimiter/search character (delim == x) is counted before it is substituted; a combined statement whose TALLYING or REPLACING half is itself a deferred sub-form remains a later rung. v0.27.0 adds INSPECT source REPLACING ALL x BY y (replace every occurrence of a single character x — a 1-char literal or PIC X(1) item — with a single character y in an alphanumeric source, in place, via a per-position map; REPLACING CHARACTERS/LEADING/FIRST, BEFORE/AFTER regions, several replace items, and a multi-character/figurative/wider search or replacement or a numeric/group source remain later rungs), on top of v0.26.0's INSPECT source TALLYING counter FOR ALL delim (count the occurrences of a single-character delimiter — a 1-char literal or PIC X(1) item — in an alphanumeric source and ADD them to an unsigned-integer counter; LEADING/CHARACTERS tallies, BEFORE/AFTER phrases, and several counters or FOR phrases remain later rungs)."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-cobol-parser = { path = "../cobol-parser" }
