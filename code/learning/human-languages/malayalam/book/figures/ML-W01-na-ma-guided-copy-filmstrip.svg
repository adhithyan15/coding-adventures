<svg xmlns="http://www.w3.org/2000/svg" width="662" height="522.3" viewBox="0 0 662 522.3" role="img" aria-label="How to write നമ: 2 letters, ന, മ, one after another"><title>Writing നമ</title><desc>2 letters written one after another: ന, മ (malayalam). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: ന: SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ന in data/NA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/NA.png&gt;; മ: SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for മ in data/MA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/MA.png&gt;. Source notes on variation: ന: Thooval&apos;s NA.png starts at the foot of the left arch (green), climbs clockwise over it and runs down the stem to the line, where a blue dot marks the turn; the pen climbs the stem again and sweeps clockwise over the right arch to finish at its foot (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ന as one stroke from the lower left to the lower right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (32 of 34) and end at the lower right (34 of 34). Sriveenkat&apos;s Commons animation of the chillu ൻ lifts once at the foot of its stem; for the full consonant both recorded sources run on, and Thooval turns back up the stem there. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the climb back up the stem retraces the ink just drawn. മ: Thooval&apos;s MA.png starts at the bottom left (green), climbs the left side and arches clockwise over the top, curves down the inner stroke to the bottom-left corner, runs right along the base and climbs the right side to finish at the top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record മ as one stroke from the middle left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 37 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (30 of 37) and end at the upper right (30 of 37). Omniglot&apos;s 20 non-native copyists most often used two strokes (8 of 20; one stroke 4, three 7). Copyists over-count, and both recordings run on, so one run is kept. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the last climb ends on the arch&apos;s ink where the right side meets it.</desc><rect x="0" y="0" width="662" height="522.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 4 movements</text><rect x="16" y="61" width="150" height="151.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="151.77" viewBox="-31 -636 973 984.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M288 566Q334 566 367 552.5Q400 539 423 516.5Q446 494 462 465L449 466Q480 518 523 542Q566 566 630 566Q707 566 761 529.5Q815 493 843.5 431Q872 369 872 292Q872 226 854 173Q836 120 801.5 75.5Q767 31 717 -8L663 53Q698 78 725.5 111.5Q753 145 768.5 189.5Q784 234 784 292Q784 350 765 395.5Q746 441 711 467.5Q676 494 629 494Q588 494 561.5 479.5Q535 465 519 436Q506 414 502 382Q498 350 498 291L498 0L412 0L412 291Q412 348 408 381Q404 414 390 436Q373 465 347 479.5Q321 494 284 494Q238 494 202.5 467.5Q167 441 147 395.5Q127 350 127 292Q127 232 143.5 187Q160 142 187 110Q214 78 247 55L189 -8Q146 27 112 68.5Q78 110 58.5 164.5Q39 219 39 292Q39 373 69.5 434.5Q100 496 156 531Q212 566 288 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M203 52 L203 52" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M203 52 L150 97 L111 154 L90 222 L87 292 L90 362 L115 427 L158 482 L217 518 L287 528 L355 516 L410 473 L455 420 L455 420" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="455" cy="420" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="455.5" y="226" text-anchor="middle" font-size="78" fill="#6b7280"><tspan x="455.5