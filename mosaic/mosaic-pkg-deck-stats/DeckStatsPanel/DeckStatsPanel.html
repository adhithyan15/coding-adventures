<!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
<div data-mosaic-component="DeckStatsPanel">
  <div style="display: flex; flex-direction: column; background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 14px">
    <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{deckLabel}}</span>
    <span style="color: #0f172a; font-size: 20px; font-weight: 800; padding-bottom: 10px">{{deckName}}</span>
    <span style="color: #155e75; font-size: 11px; font-weight: 700">{{deckListLabel}}</span>
    <div style="display: flex; flex-direction: column; padding-top: 4px; padding-bottom: 8px">
      <!-- mosaic-for each="deckRows" as="d" index="i" -->
        <div style="display: flex; flex-direction: row; align: center-vertical; gap: 8px; border-bottom-width: 1px; border-bottom-color: #e2e8f0; border-bottom-style: solid">
          <!-- emit "onSelectDeck" dropped: HTML is static -->
          <button data-on-click="onSelectDeck" style="flex-grow: 1; text-align: left; background: transparent; border-width: 0; border-radius: 6px; color: #0f172a; font-size: 13px; font-weight: 600; padding: 8px">{{d [ 0 ]}}</button>
          <span style="width: 56px; text-align: right; color: #b45309; font-size: 12px; font-weight: 700">{{d [ 1 ]}}</span>
          <span style="width: 56px; text-align: right; color: #1d4ed8; font-size: 12px; font-weight: 700">{{d [ 2 ]}}</span>
        </div>
      <!-- /mosaic-for -->
    </div>
    <div style="display: flex; flex-direction: row; padding: 2px; padding-top: 10px">
      <div style="background: #dbeafe; border-radius: 6px; padding: 9px">
        <span style="color: #1e40af; font-size: 18px; font-weight: 800">{{totalValue}}</span>
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{totalLabel}}</span>
      </div>
      <div style="background: #dcfce7; border-radius: 6px; padding: 9px">
        <span style="color: #166534; font-size: 18px; font-weight: 800">{{newValue}}</span>
        <span style="color: #166534; font-size: 11px; font-weight: 700">{{newLabel}}</span>
      </div>
      <div style="background: #fee2e2; border-radius: 6px; padding: 9px">
        <span style="color: #991b1b; font-size: 18px; font-weight: 800">{{dueValue}}</span>
        <span style="color: #991b1b; font-size: 11px; font-weight: 700">{{dueLabel}}</span>
      </div>
      <div style="background: #ede9fe; border-radius: 6px; padding: 9px">
        <span style="color: #5b21b6; font-size: 18px; font-weight: 800">{{learningValue}}</span>
        <span style="color: #5b21b6; font-size: 11px; font-weight: 700">{{learningLabel}}</span>
      </div>
      <div style="background: #f1f5f9; border-radius: 6px; padding: 9px">
        <span style="color: #0f172a; font-size: 18px; font-weight: 800">{{hiddenValue}}</span>
        <span style="color: #0f172a; font-size: 11px; font-weight: 700">{{hiddenLabel}}</span>
      </div>
    </div>
  </div>
</div>
