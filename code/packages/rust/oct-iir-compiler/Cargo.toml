[package]
name = "oct-iir-compiler"
version = "0.9.0"
edition = "2021"
description = "Oct frontend for the LANG VM AOT chain — lowers parsed and type-checked Oct into interpreter_ir::IIRModule.  v0.9.0 (LANG-FULL O-!): logical `!` lowers through portable truthiness branches and materialises a clean 0/1 bool on every backend.  v0.8.0 proved top-level `static` globals.  v0.7.0 (LANG-FULL O2 — u8 width & wrap): arithmetic/bitwise ops and unary `~` carry the `u8` type_hint so `200 + 100 = 44` and `~0 = 255`.  OCT03: emits FullyTyped functions so the JITCore + GenericCirJit chain can run Oct programs JIT-compiled.  OCT04: backend_compat e2e tests prove Oct's IIR is accepted by every IIR-to-{wasm,jvm,clr,beam} validator.  OCT05: threads real source positions through IIRFunction::source_map for line-based debugger breakpoints."

[dependencies]
lexer                        = { path = "../lexer" }
parser                       = { path = "../parser" }
coding-adventures-oct-parser = { path = "../oct-parser" }
oct-type-checker             = { path = "../oct-type-checker" }
interpreter-ir               = { path = "../interpreter-ir" }

[dev-dependencies]
# Used by tests/jit_e2e.rs to prove Oct programs run through the
# JITCore + GenericCirJit chain.
vm-core   = { path = "../vm-core" }
jit-core  = { path = "../jit-core" }
# Used by tests/backend_compat.rs to prove Oct programs are accepted
# by every IIR-to-* backend validator (wasm / jvm / clr / beam).
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/backend_encode.rs serialises WasmModule -> bytes.
wasm-module-encoder   = { path = "../wasm-module-encoder" }
