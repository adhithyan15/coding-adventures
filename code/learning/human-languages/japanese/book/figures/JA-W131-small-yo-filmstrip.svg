irst-stroke direction 4 January</text><text x="16" y="321.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2012); KanjiVG kanji/03087.svg, two stroke paths in the same order; the Unicode Standard</text><text x="16" y="333.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">names U+3087 HIRAGANA LETTER SMALL YO</text><text x="16" y="346.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
