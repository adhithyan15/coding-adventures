<svg xmlns="http://www.w3.org/2000/svg" width="822" height="284.33" viewBox="0 0 822 284.33" role="img" aria-label="How to write れ: 2 strokes · 1 pen lift · 5 movements"><title>Writing れ</title><desc>5 frames; frame N shows movements 1 to N of れ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0308c.svg, hiragana れ (U+308C HIRAGANA LETTER RE), two stroke paths kvg:0308c-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0308c.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the vertical drawn top to bottom; s2 starts at the left of the short bar, runs right across the vertical, turns sharply down and left, returns up and right without lifting, rises over the arch, descends its right side and ends in a flick to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs; where the print glyph has no separate ink for the climb back from the diagonal, the path retraces the diagonal.</desc><rect x="0" y="0" width="822" height="284.33" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="178.33" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="178.33" viewBox="-16 -864 1060 1260.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M974 76Q934 36 888 14.5Q842 -7 790 -7Q741 -7 710 25Q679 57 679 119Q679 161 685 210Q691 259 698 310.5Q705 362 711 408.5Q717 455 717 492Q