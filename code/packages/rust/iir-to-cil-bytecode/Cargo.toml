[package]
name = "iir-to-cil-bytecode"
version = "0.40.0"
edition = "2021"
description = "IIR → CIL bytecode backend — lowers IIRModule to CILProgramArtifact.  v0.39.0 (LANG-FULL E4-dyn E4d-BA-arr): `array<str>` element support (BASIC `DIM A$(n)`) in the textual `il_text` emitter — a `str` element is a `System.String[]` (`newarr [System.Runtime]System.String` + `stelem.ref`/`ldelem.ref`), the reference-element ops the McCarthy `object[]` cons cells already use; str values are real `System.String` references so no handle materialisation is needed.  v0.38.0 (LANG-FULL E4-dyn BA string INPUT): the textual `il_text` emitter grows an `input_str` arm for BASIC's string `INPUT A$` — `call string System.Console::ReadLine()` with NO `Int32.Parse` (unlike numeric `input_i64`), so the whole line is read as the string value and stored into the `str`-typed (`System.String`) local.  v0.21.0 (LANG-FULL N3 — unary `not` in the textual emitter): the bytecode `lower` path already lowered the unary IIR `not` op, but the textual `il_text` `.il` path had NO arm for it — only binary `and`/`or`/`xor` and the lispy `call_builtin \"not\"` — so a real `~` program (Nib `~0u8`) could not assemble on CoreCLR via `compile_source_to_cil_text` (the matrix's CLR path). Adds the arm: CIL `not` (one's complement) + the E2 narrow mask, so `~0u8 = 255` / `~15u4 = 0` now run on real dotnet. (The v0.20.0 `~0u8=255` claim held only for the bytecode emitter; this closes the textual gap.)  v0.20.1 (LANG-FULL E2 integration — verified for the i64-frontend value model): unlike wasm/jvm (which needed an i64-register rework so a narrow op wouldn't trap over i64 operands), the CIL backend is **uniformly int32** — `cil_local_type` maps every scalar including `i64` to `int32`, and `const` emits `ldc.i4` — so a frontend's i64 consts collapse to int32 and the existing `ldc.i4 <mask>; and` masking is already consistent. No rework needed; a regression test (`e2_u8_op_over_i64_operands_stays_int32`) locks it in.  v0.20.0 (E2 backend 5/6): masks a narrow-width (u4/u8/u16) arithmetic / bitwise / neg / not / shl result with `ldc.i4 <mask>; and` after the 32-bit CIL op — in BOTH emitters (the `lower` bytecode builder and the textual `il_text` path) — so `200u8+100u8=44` and `~0u8=255` (u32/i32 already wrap mod-2³² via the 32-bit op; a positive mask + `and`, not `conv.u1`, keeps the unsigned widths unsigned). masks a narrow-width (u4/u8/u16) arithmetic / bitwise / neg / not / shl result with `ldc.i4 <mask>; and` after the 32-bit CIL op — in BOTH emitters (the `lower` bytecode builder and the textual `il_text` path) — so `200u8+100u8=44` and `~0u8=255` (u32/i32 already wrap mod-2³² via the 32-bit op; a positive mask + `and`, not `conv.u1`, keeps the unsigned widths unsigned).  v0.18.0 (LANG-MATRIX LM-C Brainfuck): the textual `.il` emitter grows the byte-tape ops — alloc_bytes (`newarr [System.Runtime]System.Byte` into an `unsigned int8[]` local), load_byte (`ldelem.u1`), store_byte (`stelem.i1`) — and `putchar`/`getchar` (`Console::Write(char)`/`Read()`), with the Run() launcher discarding the entry result for a putchar program; so Brainfuck runs on real CoreCLR — the last code-gen cell of the matrix.  v0.7.0 (G4): whitelist call_builtin print_i64 and lower it to call env.BasicRuntime::PrintI64(int64), mirroring iir-to-wasm v0.8.0 (env.__print_i64) and iir-to-jvm-class-file v0.7.0 (env/BasicRuntime.println(J)V).  Together they let BASIC's PRINT reach real wasm, JVM, and CLR bytecode."

[lib]
name = "iir_to_cil_bytecode"
path = "src/lib.rs"

[dependencies]
interpreter-ir     = { path = "../interpreter-ir" }
ir-to-cil-bytecode = { path = "../ir-to-cil-bytecode" }
codegen-core       = { path = "../codegen-core" }
