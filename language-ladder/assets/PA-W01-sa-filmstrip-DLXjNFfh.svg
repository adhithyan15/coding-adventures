<svg xmlns="http://www.w3.org/2000/svg" width="822" height="303.3" viewBox="0 0 822 303.3" role="img" aria-label="How to write ਸ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ਸ</title><desc>5 frames; frame N shows movements 1 to N of ਸ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਸ (sassaa) checkpoints, strokes 1–3 (lib/data/lessons/lesson_tracing.dart line 127, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L127&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਸ in three pen-down strokes: the headline from left to right; then from the top left down the left arm, clockwise round the loop and on to the right, ending where the bar meets the stem; then the stem from the top down. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the loop as a solid tail, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਸ, each by a different non-native copyist; only counts and shares are cited. 45% (9 of 20) draw it in three strokes, the source&apos;s count and their most common one. For the first stroke of the body, 50% (10 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="303.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L603 622L603 551L507 551L507 0L426 0ZM193 332L426 332L426 551L153 551Q173 491 182.5 435Q192 379 193 332Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L55 586 L95 586 L136 586 L176 586 L216 586 L256 586 L296 586 L337 586 L377 586 L417 586 L457 586 L498 586 L538 586 L578 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="578" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">1. draw the headline</tspan><tspan x="298" y="273.4">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L603 622L603 551L507 551L507 0L426 0ZM193 332L426 332L426 551L153 551Q173 491 182.5 435Q192 379 193 332Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L95 586 L136 586 L176 586 L216 586 L256 586 L296 586 L337 586 L377 586 L417 586 L457 586 L498 586 L538 586 L578 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M108 586 L108 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M108 586 L115 552 L122 517 L130 481 L137 444 L144 407 L149 370 L152 332 L153 295" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="153" cy="295" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">2. lift, then come down</tspan><tspan x="298" y="273.4">the left arm</tspan></text></svg><rect x="336" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L603 622L603 551L507 551L507 0L426 0ZM193 332L426 332L426 551L153 551Q173 491 182.5 435Q192 379 193 332Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L95 586 L136 586 L176 586 L216 586 L256 586 L296 586 L337 586 L377 586 L417 586 L457 586 L498 586 L538 586 L578 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M108 586 L115 552 L122 517 L130 481 L137 444 L144 407 L149 370 L152 332 L153 295 L153 295" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="150" cy="296" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">3. loop round the tail</tspan></text></svg><rect x="496" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L603 622L603 551L507 551L507 0L426 0ZM193 332L426 332L426 551L153 551Q173 491 182.5 435Q192 379 193 332Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L95 586 L136 586 L176 586 L216 586 L256 586 L296 586 L337 586 L377 586 L417 586 L457 586 L498 586 L538 586 L578 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M108 586 L115 552 L122 517 L130 481 L137 444 L144 407 L149 370 L152 332 L153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296 L150 296" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M150 296 L187 295 L225 295 L264 295 L303 295 L342 295 L381 295 L420 295 L459 295" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="459" cy="295" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">4. draw the bar to the</tspan><tspan x="298" y="273.4">stem</tspan></text></svg><rect x="656" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L603 622L603 551L507 551L507 0L426 0ZM193 332L426 332L426 551L153 551Q173 491 182.5 435Q192 379 193 332Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L55 586 L95 586 L136 586 L176 586 L216 586 L256 586 L296 586 L337 586 L377 586 L417 586 L457 586 L498 586 L538 586 L578 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M108 586 L115 552 L122 517 L130 481 L137 444 L144 407 L149 370 L152 332 L153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296 L187 295 L225 295 L264 295 L303 295 L342 295 L381 295 L420 295 L459 295" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M462 586 L462 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M462 586 L464 549 L465 510 L465 471 L465 431 L465 392 L465 352 L465 313 L465 273 L465 234 L465 194 L465