<svg xmlns="http://www.w3.org/2000/svg" width="998" height="478.57" viewBox="0 0 998 478.57" role="img" aria-label="How to write ه، ة: 2 letters, ه, ة, one after another"><title>Writing ه، ة</title><desc>2 letters written one after another: ه, ة (arabic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: ه: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ه و ي, independent Heh at 00:04.9–00:06.0 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%d9%87-%d9%88-%d9%8a/&gt;; ة: Arabic Language Learning Notes (アラビア語学習メモ), Learn How to Write Arabic Letters — Basic Naskh: Taa Marbuta ة, isolated form and stroke order (updated 2022-03-31; accessed 2026-08-23) &lt;https://alarabiyah.sakura.ne.jp/arabic/alphabets/naskh/taabarbuutah/&gt;. Source notes on variation: ه: The page&apos;s directly linked letter-haa.mov demonstrates independent ه in one continuous pen-down run at 00:04.9–00:06.0. From the upper right at 00:04.9–00:05.4, the pen curves down-left and closes the lower counter. Without lifting, it threads through the centre and closes the upper-right counter at 00:05.4–00:05.7, then sweeps left along the baseline through 00:06.0. The adjacent lesson identifies Heh as a two-way connector and separately prints its contextual shapes. This one-stroke, zero-lift learner path reconciles the compact handwritten demonstration with the course&apos;s wider isolated two-counter Noto Naskh outline. Arabic ه retains its own script-scoped provenance independently of the existing Persian record for the same Unicode glyph and source-backed geometry. ة: The lesson identifies ة as a word-final-only form with isolated ة and connected final ـة shapes. For the isolated form it explicitly starts at the body&apos;s upper point, circles clockwise through a compact triangular o-shape resting on the baseline, and adds the two upper dots afterward. It notes that instructional traditions differ on whether the right or left dot comes first; this learner path follows the left-then-right order already used by the source-backed Arabic ت record. The Open University&apos;s introductory Arabic course independently confirms that ة occurs only word-finally, distinguishes its isolated and connected-final shapes, and explains its pause h versus linked t behavior. The path fits the course&apos;s vendored Noto Naskh outline without treating this ending as a base letter.</desc><rect x="0" y="0" width="998" height="478.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 3 movements</text><rect x="16" y="61" width="150" height="201.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="201.23" viewBox="-53 -503 703 943.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M529 -18Q464 -10 408.5 5.5Q353 21 307 44Q233 0 151 0Q137 0 117 5.5Q97 11 72 22.5Q47 34 17 50L26 84Q47 80 75 78Q103 76 137 76Q163 76 188 79.5Q213 83 238 90Q176 142 176 207Q176 238 187.5 270.5Q199 303 219 329.5Q239 356 264 368L287 433Q370 410 437.5 361.5Q505 313 542 248Q580 183 580 116Q580 68 529 -18ZM312 125Q338 145 350.5 171.5Q363 198 363 231Q363 260 344.5 284.5Q326 309 304 309Q288 309 269.5 296Q251 283 235 260Q227 249 221.5 235.5Q216 222 211 208Q233 183 258.5 162.5Q284 142 312 125ZM526 55Q526 99 510 1