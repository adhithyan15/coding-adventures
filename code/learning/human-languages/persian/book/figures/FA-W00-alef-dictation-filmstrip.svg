<svg xmlns="http://www.w3.org/2000/svg" width="182" height="753.56" viewBox="0 0 182 753.56" role="img" aria-label="How to write ا: one unbroken stroke · 1 movement"><title>Writing ا</title><desc>1 frames; frame N shows movements 1 to N of ا (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, opening ا demonstration at 00:08–00:11 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ا as one top-to-bottom Naskh stroke while presenting the alphabet right-to-left. Contextual joins change neighbouring ink, but the isolated non-connector remains the same one-stroke stem; this path fits the vendored Noto Naskh outline.</desc><rect x="0" y="0" width="182" height="753.56" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 1 movement</text><rect x="16" y="42" width="150" height="560.06" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="560.06" viewBox="5 -741 243 907.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 0Q103 88 100.5 168Q98 248 94.5 321Q91 394 87 459Q83 524 77 582Q75 609 80.5 627Q86 645 101.5 655.5Q117 666 143 671Q147 652 156.5 619.5Q166 587 178 552L151 529Q155 455 156.5 377Q158 299 156.5 209Q155 119 150 8L104 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 640 L120 640" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 640 L120 580 L119 500 L124 400 L128 250 L129 100 L127 10" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="127" cy="10" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="126.5" y="159.5" text-anchor="middle" font-size="19.5" fill="#6b7280"><tspan x="126.5" y="159.5">1. down</tspan></text></svg><text x="16" y="615.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian</text><text x="16" y="627.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Online, How to Write Persian</text><text x="16" y="640.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, opening ا</text><text x="16" y="652.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">demonstration at 00:08–00:11</text><text x="16" y="665.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Liberal Arts Instructional</text><text x="16" y="677.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Technology Services, Univ.</text><text x="16" y="690.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">of Texas at Austin)</text><text x="16" y="702.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not</text><text x="16" y="715.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">standardised; the source</text><text x="16" y="727.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
