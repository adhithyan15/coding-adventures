[package]
name = "twig-vm"
version = "0.15.0"
edition = "2021"
description = "LANG47 + LANG52 + LANG55 + LANG56 + LANG57 — string heap objects, builtins, host I/O, higher-order list ops, multi-file entry points, record/union/match runtime smoke tests"

[dependencies]
twig-ir-compiler   = { path = "../twig-ir-compiler" }
twig-parser        = { path = "../twig-parser" }
twig-lexer         = { path = "../twig-lexer" }
twig-module-driver = { path = "../twig-module-driver" }
lispy-runtime      = { path = "../lispy-runtime" }
lang-runtime-core  = { path = "../lang-runtime-core" }
interpreter-ir     = { path = "../interpreter-ir" }
serde_json         = "1"

[[bin]]
name = "twig-vm"
path = "bin/twig_vm.rs"
