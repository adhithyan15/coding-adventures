[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-multi-directed-graph"
version = "0.1.0"
description = "Generic multi-directed graph with stable edge IDs and metadata"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_directed_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
