name: coding_adventures_python_parser
version: 0.1.0
description: Python parser driven by compiled python.grammar grammars (legacy lines + LANG84 release tables). Dart lane of python-parser.
repository: https://github.com/adhithyan15/coding-adventures/tree/main/code/packages/dart/python-parser
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  coding_adventures_python_lexer:
    path: ../python-lexer
  coding_adventures_grammar_tools:
    path: ../grammar-tools
  coding_adventures_lexer:
    path: ../lexer
  coding_adventures_parser:
    path: ../parser

dev_dependencies:
  test: ^1.24.0
  coverage: ^1.6.0
  coding_adventures_pbt:
    path: ../pbt
  coding_adventures_fuzz:
    path: ../fuzz
