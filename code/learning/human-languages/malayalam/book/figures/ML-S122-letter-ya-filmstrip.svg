<svg xmlns="http://www.w3.org/2000/svg" width="662" height="257.45" viewBox="0 0 662 257.45" role="img" aria-label="How to write യ: one unbroken stroke · 4 movements"><title>Writing യ</title><desc>4 frames; frame N shows movements 1 to N of യ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxx: movements 1-4 for യ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-040.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxx) starts at the top of the left bowl and runs down its left side anticlockwise to the bottom (1), climbs through the crossing to the top of the middle loop (2), comes back down the loop&apos;s inner side (3) and rounds the right bowl to finish at the top right (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record യ as one stroke from the upper left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (22 of 31) and end at the upper right (31 of 31). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its YA.png at the upper centre and ends it at the upper right. All four sources end at the top right; the start varies (Moag and hand at the upper left, Thooval at the upper centre, grahyam most often at the middle left), so confidence in the start is medium. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="662" height="257.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="138.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="138.95" viewBox="-31 -636 1094 1013.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M661 -12Q621 -12 578 -3Q535 6 493 29Q487 32 477.5 36Q468 40 463 43Q408 82 375 129Q342 176 327 229Q312 282 312 338Q312 378 322 412Q332 446 349 473L356 484Q376 511 402.5 529Q429 547 460 556.5Q491 566 525 566Q624 566 679 502.5Q734 439 734 332Q734 242 696 169.5Q658 97 593 53Q585 47 577.5 42.5Q570 38 560 33Q518 9 472 -1.5Q426 -12 376 -12Q296 -12 233.5 14Q171 40 127.5 86.5Q84 133 61.5 196.5Q39 260 39 335Q39 405 65.5 456.5Q92 508 141 537Q190 566 256 566Q314 566 354 545.5Q394 525 421 490L362 431Q349 457 323.5 476.5Q298 496 257 496Q219 496 189.5 478Q160 460 143 423.5Q126 387 126 333Q126 261 155 198Q184 135 241 95.5Q298 56 383 56Q404 56 426 58.5Q448 61 469 66Q480 70 492 74Q504 78 514 82Q549 100 579 134.5Q609 169 628 219Q647 269 647 332Q647 392 630 428Q613 464 585 480Q557 496 525 496Q487 496 458.5 477Q430 458 414.5 421.5Q399 385 399 332Q399 279 415.5 228.5Q432 178 462.5 139Q493 100 534 78Q544 74 552 73.5Q560 73 570 69Q587 64 611 60Q635 56 661 56Q744 56 798 90Q852 124 879 182Q906 240 906 312Q906 371 887 424Q868 477 833 519L902 566Q948 512 970.5 447.5Q993 38