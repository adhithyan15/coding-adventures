<svg xmlns="http://www.w3.org/2000/svg" width="982" height="300.04" viewBox="0 0 982 300.04" role="img" aria-label="How to write ध: 2 strokes · 1 pen lift · 6 movements"><title>Writing ध</title><desc>6 frames; frame N shows movements 1 to N of ध (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ध-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A7-order.gif&gt;. Source note on variation: The 27-frame animation shows four ordered pen-down runs: frames 2–11 start at the upper spiral&apos;s inner crossing, curl around the small opening, widen left and down around the outer loop, then sweep right through the shoulder without lifting; frames 12–19 restart at the left waist and sweep down and around the lower bowl to its right junction; frames 20–22 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 23–26 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 250 ms holds at frames 11, 19, and 22 mark the first three run endings before the one-second completed frame. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VI, p. 33, independently shows the same upper spiral, lower bowl, right stem, and headline buildup. These runs stage the letter one part at a time; they are not a count of native pen lifts. The lift count follows HP Labs India&apos;s isolated handwritten Devanagari character data (hpl-dvng-iso-char, https://lipitk.sourceforge.net/datasets/dvngchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Devanagari recognizer. Those counts say how many strokes writers use, not where they break, so this learner path keeps every run&apos;s order, start and direction as a segment and joins the first three in one run, turning back along the shoulder to the waist and climbing the right stem before descending it, so the pen lifts only before the headline. Its curves are fitted to Noto Sans Devanagari.</desc><rect x="0" y="0" width="982" height="300.04" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="206.54" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="206.54" viewBox="-20 -702 719 990" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M629 551L526 551L526 0L445 0L445 185L463 160Q439 135 397 118.5Q355 102 296 102Q236 102 191.5 121Q147 140 122.5 174Q98 208 98 253Q98 285 113.5 315.5Q129 346 166 365Q168 367 171.5 368.5Q175 370 179 372Q201 385 227 389Q253 393 281 393Q295 393 309.5 391.5Q324 390 335 388L327 318Q317 320 307 320.5Q297 321 283 321Q249 321 225.5 313Q202 305 190 289Q178 273 178 249Q178 211 211 191.5Q244 172 295 172Q348 172 391 196.5Q434 221 459 260L445 208L445 551L383 551L383 622L629 622L629 551ZM172 331Q138 347 110 370.5Q82 394 66 425.5Q50 457 50 496Q50 560 90 596Q130 632 199 632Q244 632 273 617Q302 602 315.5 577Q329 552 329 521Q329 495 318.5 472Q308 449 285 428L225 464Q239 478 245.5 492Q252 506 252 520Q252 543 238.5 555.5Q225 568 199 568Q167 568 147.5 547Q128 526 128 490Q128 452 151 425Q174 398 217 378L172 331Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M285 450 L285 450" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M285 450 L300 475 L305 505 L300 535 L285 560 L260 585 L225 600 L185 605 L145 590 L110 565 L85 530 L75 490 L80 450 L95 420 L115 395 L145 375 L175 355 L210 340 L250 335 L290 340 L325 350" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round