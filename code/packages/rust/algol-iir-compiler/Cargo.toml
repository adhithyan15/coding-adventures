[package]
name = "algol-iir-compiler"
version = "0.5.0"
edition = "2021"
description = "ALGOL 60 scalar frontend for the LANG VM Rust chain, lowering parsed ALGOL into interpreter_ir::IIRModule. v0.3.0 adds switches (computed goto) + conditional designational expressions, and fixes comparison lowering to use the i64 operand width so ALGOL comparisons run on the code-gen backends. v0.2.0 added typed procedures with value parameters."

[dependencies]
coding-adventures-algol-parser = { path = "../algol-parser" }
interpreter-ir = { path = "../interpreter-ir" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
vm-core = { path = "../vm-core" }

[dev-dependencies]
aot-core = { path = "../aot-core" }
iir-to-beam = { path = "../iir-to-beam" }
iir-to-cil-bytecode = { path = "../iir-to-cil-bytecode" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-llvm = { path = "../iir-to-llvm" }
iir-to-wasm = { path = "../iir-to-wasm" }
jit-core = { path = "../jit-core" }
