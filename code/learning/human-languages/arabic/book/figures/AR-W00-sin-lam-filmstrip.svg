<svg xmlns="http://www.w3.org/2000/svg" width="678" height="478.96" viewBox="0 0 678 478.96" role="img" aria-label="How to write س ل: 2 letters, س, ل, one after another"><title>Writing س ل</title><desc>2 letters written one after another: س, ل (arabic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: س: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: س ش ص ض, independent Seen at 00:01.6–00:02.8 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%D8%B3-%D8%B4-%D8%B5-%D8%B6/&gt;; ل: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ي ك ل, independent Lam at 00:01.9–00:02.4 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/alphabet-%d9%82-%d9%84-%d9%85/&gt;. Source notes on variation: س: The page&apos;s directly linked FullSizeRender-8.mov demonstrates independent س in one continuous pen-down run at 00:01.6–00:02.8: it starts at the upper right, shapes three close teeth from right to left, then flows directly into the final bowl without lifting. The adjacent lesson identifies seen as a two-way connector and separately prints its contextual shapes. This independent learner path fits the course&apos;s vendored Noto Naskh outline while keeping its provenance scoped to Arabic rather than inheriting the already-authored Persian or Urdu س sources for the same Unicode glyph. ل: The page&apos;s directly linked lam.mov demonstrates independent ل in one continuous pen-down run at 00:01.9–00:02.4: it descends the tall upright, turns left through the base bowl without lifting, and rises at the bowl&apos;s outer edge. The adjacent lesson identifies Lam as a two-way connector and separately prints its contextual shapes. This one-stroke, zero-lift learner path fits the course&apos;s vendored Noto Naskh outline. Its Arabic-scoped ل identity and provenance remain distinct from the existing Persian and Urdu records for the same Unicode glyph, which retain their own source-backed orders.</desc><rect x="0" y="0" width="678" height="478.96" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 2 movements</text><rect x="16" y="61" width="150" height="163.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="163.38" viewBox="-2 -410 1034 1126.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q301 -179 351.5 -162.5Q402 -146 442 -117.5Q482 -89 498 -54Q465 17 449 65Q433 113 433 137Q433 163 447.5 183.5Q462 204 498 226Q500 212 502.5 195.5Q505 179 510 153.5Q515 128 523 85Q538 81 553 78.5Q568 76 583 76Q611 76 633 79Q655 82 671 86Q678 98 683 115Q695 156 704 182.5Q713 209 718 219Q726 239 734 245.5Q742 252 758 252Q772 252 782 245Q775 230 764 198.5Q753 167 739 118Q789 96 829 87.5Q869 79 915 79Q909 99 900 126.5Q891 154 877 188Q867 214 862 231.5Q857 249 857 256Q857 278 874.5 300.5Q892 323 923 340Q927 316 934.5 282Q942 248 947 225Q953 198 957.5 172Q962 146 962 123Q962 113 956.5 90.5Q951 68 942.5 43.5Q934 19 924 0Q860 0 813 9Q766 18 712 43L703 27Q696 15 658 7Q640 3 618.5 1.5Q597 0 571 0Q562 0 553 0.5Q544 1 535 2L535 -17Q535 -78 496 -134.5Q457 