<svg xmlns="http://www.w3.org/2000/svg" width="342" height="345.05" viewBox="0 0 342 345.05" role="img" aria-label="How to write ٹ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ٹ</title><desc>2 frames; frame N shows movements 1 to N of ٹ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Fe, qāf, ṭe, ḍāl, and ṛe, independent ٹ handwriting animation and Ṭe instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/fe-qaf-te-dal-re/&gt;. Source note on variation: The independent-form handwriting animation writes the be-series body and the upper retroflex mark as two pen-down runs. The adjacent prose says ṭe is written like dental te but replaces its dots with a small to&apos;e-shaped mark, drawn down, back up, and down again to form a loop. This learner path fits that body-first, one-lift order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The lesson identifies ṭe as an Urdu retroflex letter introduced for a sound absent from Persian and Arabic.</desc><rect x="0" y="0" width="342" height="345.05" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="214.05" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.05" viewBox="0 -596 793 1131.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM381 329Q314 329 259 361L265 386Q274 384 285.5 382Q297 380 311 378L329 398Q319 432 312 457.5Q305 483 305 493Q305 507 316 516Q327 525 346 526Q349 515 352 506.5Q355 498 357 492L349 486L352 421Q369 435 384.5 446.5Q400 458 414 458Q428 458 443.5 448.5Q459 439 470 426Q481 413 481 403Q481 382 467.5 365Q454 348 431.5 338.5Q409 329 381 329ZM383 373Q406 373 423 377.5Q440 382 459 389Q443 403 431 407Q419 411 408 411Q394 411 376 402Q358 393 337 375L383 373Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L678 382" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="255" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="203.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="203.5">1. sweep the independent</tspan><tspan x="396.5" y="281">be-series bowl from</tspan><tspan x="396.5" y="358.4">right to left</tspan></text></svg><rect x="176" y="42" width="150" height="214.05" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="214.05" viewBox="0 -596 793 1131.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM381 329Q314 329 259 361L265 386Q274 384 285.5 382Q297 380 311 378L329 398Q319 432 312 457.5Q305 483 305 493Q305 507 316 516Q327 525 346 526Q349 515 352 506.5Q355 498 357 492L349 486L352 421Q369 435 384.5 446.5Q400 458 414 458Q428 458 443.5 448.5Q459 439 470 426Q481 413 481 403Q481 382 467.5 365Q454 348 431.5 338.5Q409 329 381 329ZM383 373Q406 373 423 377.5Q440 382 459 389Q443 403 431 407Q419 411 408 411Q394 411 376 402Q358 393 337 375L383 373Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M340 500 L340 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M340 500 L335 445 L340 415 L335 445 L340 500 L335 445 L340 415 L325 380 L280 370 L325 348 L375 338 L425 348 L460 375 L470 395 L450 420 L405 448" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="405" cy="448" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="203.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="203.5">2. after one lift, draw</tspan><tspan x="396.5" y="281">the small retroflex mark</tspan><tspan x="396.5" y="358.4">downward, back upward,</tspan><tspan x="396.5" y="435.9">and down again to close</tspan><tspan x="396.5" y="513.4">its loop</tspan></text></svg><text x="16" y="269.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Fe, qāf, ṭe, ḍāl, and ṛe,</text><text x="16" y="281.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">independent ٹ handwriting animation and Ṭe instructions</text><text x="16" y="294.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Northwestern University Libraries Open Textbook, 2026)</text><text x="16" y="306.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="319.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
