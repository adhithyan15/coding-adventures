<svg xmlns="http://www.w3.org/2000/svg" width="662" height="228.63" viewBox="0 0 662 228.63" role="img" aria-label="How to write ൈ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ൈ</title><desc>4 frames; frame N shows movements 1 to N of ൈ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table III &apos;How to Write Internal Vowel Symbols&apos;, p. xxii: movements 1-4 for ൈ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-032.jpg&gt;. Source note on variation: Moag&apos;s Table III (p. xxii) draws it as four movements to the left of the dash that stands for the consonant: the inner loop of the first coil (1), its arch over the top and down to the lower right (2), the inner loop of the second coil (3) and its arch (4). Each coil is the e sign െ, drawn the way the same page numbers െ. Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd, and again at commit 2844253), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. No recording of ൈ itself was found, so the lift count is reasoned rather than observed and confidence is medium: the two coils are separate pieces of ink, so the pen must lift once between them, and each coil is written in one run, as recorded writers write െ (Santhosh Thottingal&apos;s hand curves, gitlab.com/santhoshtr/hand, MIT, record െ as one stroke; none of grahyam&apos;s 43 unique െ samples, github.com/bluebottlewize/grahyam, no licence, counts only, jumps the way a lift would). Moag does not number the consonant against the sign, so this record claims no written order against it: the sign is drawn only by itself, and a word with it stays refused. Noto Sans Malayalam builds the standalone sign from two copies of െ side by side, so each run follows the outline of one copy.</desc><rect x="0" y="0" width="662" height="228.63" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="110.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="110.13" viewBox="-31 -636 1492 1095.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M237 -12Q185 -12 139.5 14Q94 40 66.5 94.5Q39 149 39 232Q39 310 64.5 372Q90 434 135.5 477Q181 520 242 543Q303 566 374 566Q452 566 509 544Q566 522 603 483Q640 444 658 392Q676 340 676 281Q676 211 655 156.5Q634 102 598 61Q562 20 515 -9L466 54Q499 74 526.5 104Q554 134 570.5 176Q587 218 587 271Q587 339 562 389Q537 439 488.5 466.5Q440 494 370 494Q298 494 241.5 459.5Q185 425 152.5 365Q120 305 120 228Q120 171 135 133Q150 95 177 76.5Q204 58 240 58Q265 58 284 69.5Q303 81 314 103.5Q325 126 325 158Q325 206 298.5 232Q272 258 231 258Q192 258 157 238.5Q122 219 93 187L77 248Q107 284 151.5 306Q196 328 245 328Q294 328 330.5 309Q367 290 387.5 253.5Q408 217 408 165Q408 110 387 70Q366 30 327.5 9Q289 -12 237 -12ZM952 -12Q900 -12 854.5 14Q809 40 781.5 94.5Q754 149 754 232Q754 310 779.5 372Q805 434 850.5 477Q896 520 957 543Q1018 566 1089 566Q1167 566 1224 544Q1281 522 1318 483Q1355 444 1373 392Q1391 340 1391 281Q1391 211 1370 156.5Q1349 102 1313 61Q1277 20 1230 -9L1181 54Q1214 74 1241.5 104Q1269 134 1285.5 176Q1302 218 1302 271Q1302 339 1277 389Q1252 439 1203.5 466.5Q1155 494 1085 494Q1013 494 956.5 459.5Q900 425 867.5 365Q835 305 8