<svg xmlns="http://www.w3.org/2000/svg" width="662" height="291.93" viewBox="0 0 662 291.93" role="img" aria-label="How to write स: 4 strokes · 3 pen lifts · 4 movements"><title>Writing स</title><desc>4 frames; frame N shows movements 1 to N of स (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari s स.gif’, strokes 1–4, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_s_%E0%A4%B8.gif&gt;. Source note on variation: The 13-frame animation shows four ordered pen-down runs: frames 0–4 start just below the headline, descend the left stem, curve left around the central hook, and continue diagonally down-right through the tail without lifting; frames 5–6 restart at the central junction and draw the middle crossbar left-to-right; frames 7–9 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 10–12 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The spatial restarts at frames 5, 7, and 10 delimit the four runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit IX, p. 47, independently shows the same left curve, diagonal tail, middle crossbar, right stem, and headline order, but stages the left curve and tail separately rather than proving their join. The four-run lift count therefore comes from the animation. This learner path follows that animation-backed form and fits its hook and tail to Noto Sans Devanagari; everyday handwriting may divide or simplify the joined body differently.</desc><rect x="0" y="0" width="662" height="291.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts ·