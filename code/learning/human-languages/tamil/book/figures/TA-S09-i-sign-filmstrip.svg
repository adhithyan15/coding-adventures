<svg xmlns="http://www.w3.org/2000/svg" width="502" height="406.23" viewBox="0 0 502 406.23" role="img" aria-label="How to write ி: one unbroken stroke · 3 movements"><title>Writing ி</title><desc>3 frames; frame N shows movements 1 to N of ி (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 37 (ி, i sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 205 of the 206 stored prototypes of the i sign are one pen-down stroke. In 161 of those 205 the pen starts at the tip of the hook and first moves up; 200 turn clockwise, over the top to the right; 152 end at the foot of the stem. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="406.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="287.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="287.73" viewBox="-371 -913 615 1179.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-79 843Q-25 843 19.5 825.5Q64 808 98 773Q121 750 138 715.5Q155 681 164.5 626.5Q174 572 174 489L174 0L88 0L88 471Q88 543 81.5 590Q75 637 63 667.5Q51 698 34 718Q13 744 -16.5 756Q-46 768 -81 768Q-124 768 -154 751.5Q-184 735 -199.5 705.5Q-215 676 -215 637Q-215 609 -207 