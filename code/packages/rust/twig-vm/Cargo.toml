[package]
name = "twig-vm"
version = "0.10.0"
edition = "2021"
description = "LANG26 — host/ I/O builtins (write_byte, read_byte, exit, flush_stdout) via Rust stdlib dispatch"

[dependencies]
twig-ir-compiler  = { path = "../twig-ir-compiler" }
twig-parser       = { path = "../twig-parser" }
twig-lexer        = { path = "../twig-lexer" }
lispy-runtime     = { path = "../lispy-runtime" }
lang-runtime-core = { path = "../lang-runtime-core" }
interpreter-ir    = { path = "../interpreter-ir" }
serde_json        = "1"

[[bin]]
name = "twig-vm"
path = "bin/twig_vm.rs"
