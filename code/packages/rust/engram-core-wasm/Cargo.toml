[package]
name = "engram-core-wasm"
version = "0.1.0"
edition = "2021"
description = "String-in / JSON-out facade over engram-core for web, native, and Mosaic-generated shells."
license = "MIT"

[dependencies]
engram-core = { path = "../engram-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Anki package layer is available on every target now, including wasm.
#
# It used to be excluded from wasm entirely, because it linked `rusqlite`
# (bundled C SQLite) and `zstd_crate` (libzstd through `zstd-sys`) — both compile
# C, and `wasm32-unknown-unknown` has no C toolchain. That left browser Engram
# advertising an APKG API that always failed.
#
# The export has since moved onto the zero-dependency `sqlite-file` writer, and
# decompression onto the repo's own `zstd`, which now handles the Huffman and FSE
# frames real encoders emit. Both are pure Rust with no build script.
#
# There was briefly a split here — a `modern-format`-less wasm dependency beside
# a full native one — because the browser could do legacy `.apkg` but had to
# refuse modern `.anki21b` / `.colpkg` for want of a decompressor. That split is
# gone: **every target now gets the same package layer with the same
# capabilities**, which is the arrangement worth having, since a dependency that
# differs per target is a second configuration to keep honest.
engram-anki-package = { path = "../engram-anki-package" }
