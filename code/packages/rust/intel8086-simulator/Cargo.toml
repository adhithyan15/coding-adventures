[package]
name = "intel8086-simulator"
version = "0.1.0"
edition = "2021"
description = "Complete Intel 8086 (1978) behavioral simulator with segmented memory, full specified ISA execution, checked lifecycle, traces, ports, and Python-oracle differentials."

[dependencies]
cpu-simulator = { path = "../cpu-simulator" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
