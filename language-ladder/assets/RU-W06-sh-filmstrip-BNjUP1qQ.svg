<svg xmlns="http://www.w3.org/2000/svg" width="822" height="267.67" viewBox="0 0 822 267.67" role="img" aria-label="How to write ш: one unbroken stroke · 5 movements"><title>Writing ш</title><desc>5 frames; frame N shows movements 1 to N of ш (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ш demonstration, 09:49–09:57, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 09:49–09:57 lowercase ш demonstration, the pen begins at the upper left, descends the left stem to the baseline, turns through a rounded diagonal join and rises to the top of the middle stem, descends the middle stem, turns through a second rounded diagonal join and rises to the top of the right stem, descends the right stem, and curls into a small rising exit without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: left stem down, first joined rise, middle stem down, second joined rise, right stem down, then the curled exit. The bundled Noto Sans Cyrillic glyph is a printed ш-like form with three straight full-height vertical stems joined by two horizontal baseline bars, without diagonal rounded joins, curled baselines, or an exit join. This learner path preserves the source&apos;s left-to-middle-to-right order and zero-lift evidence while fitting the printed outline: descend the left stem, cross the first bottom bar and rise then retrace the middle stem, cross the second bottom bar and rise then retrace the right stem without lifting. Connected cursive restores the source&apos;s diagonal rounded joins, curled baseline, and rising exit, and individual handwriting may round, narrow, widen, or slant the joins and stems differently.</desc><rect x="0" y="0" width="822" height="267.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="174.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="174.17" viewBox="12 -606 870 1010.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M82 0L82 536L170 536L170 74L403 74L403 536L491 536L491 74L724 74L724 536L812 536L812 0L82 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 536 L126 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M126 536 L126 270 L126 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="126" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="447" y="209.7" text-anchor="middle" font-size="69.7" fill="#6b7280"><tspan x="447" y="209.7">1. descend the left stem</tspan><tspan x="447" y="294.7">to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="174.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="174.17" viewBox="12 -606 870 1010.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M82 0L82 536L170 536L170 74L403 74L403 536L491 536L491 74L724 74L724 536L812 536L812 0L82 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 536 L126 270 L126 37 L126 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M126 37 L286 37 L447 37 L447 270 L447 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="447" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="447" y="209.7" text-anchor="middle" font-size="69.7" fill="#6b7280"><tspan x="447" y="209.7">2. cross the first base</tspan><tspan x="447" y="294.7">join and rise through</tspan><tspan x="447" y="379.8">the middle stem</tspan></text></svg><rect x="336" y="42" width="150" height="174.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="174.17" viewBox="12 -606 870 1010.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M82 0L82 536L170 536L170 74L403 74L403 536L491 536L491 74L724 74L724 536L812 536L812 0L82 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 536 L126 270 L126 37 L286 37 L447 37 L447 270 L447 536 L447 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M447 536 L447 270 L447 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="447" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="447" y="209.7" text-anchor="middle" font-size="69.7" fill="#6b7280"><tspan x="447" y="209.7">3. retrace the middle</tspan><tspan x="447" y="294.7">stem to the baseline</tspan></text></svg><rect x="496" y="42" width="150" height="174.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="174.17" viewBox="12 -606 870 1010.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M82 0L82 536L170 536L170 74L403 74L403 536L491 536L491 74L724 74L724 536L812 536L812 0L82 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 536 L126 270 L126 37 L286 37 L447 37 L447 270 L447 536 L447 270 L447 37 L447 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M447 37 L607 37 L768 37 L768 270 L768 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="768" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="447" y="209.7" text-anchor="middle" font-size="69.7" fill="#6b7280"><tspan x="447" y="209.7">4. cross the second base</tspan><tspan x="447" y="294.7">join and rise through</tspan><tspan x="447" y="379.8">the right stem</tspan></text></svg><rect x="656" y="42" width="150" height="174.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="174.17" viewBox="12 -606 870 1010.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M82 0L82 536L170 536L170 74L403 74L403 536L491 536L491 74L724 74L724 536L812 536L812 0L82 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 536 L126 270 L126 37 L286 37 L447 37 L447 270 L447 536 L447 270 L447 37 L607 37 L768 37 L768 270 L768 536 L768 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M768 536 L768 270 L768 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="768" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="447" y="209.7" text-anchor="middle" font-size="69.7" fill="#6b7280"><tspan x="447" y="209.7">5. retrace the right</tspan><tspan x="447" y="294.7">stem to the baseline</tspan></text></svg><text x="16" y="229.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ш demonstration, 09:49–09:57, YouTube, 5 February 2013</text><text x="16" y="241.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
