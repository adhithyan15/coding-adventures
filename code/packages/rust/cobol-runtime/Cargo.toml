[package]
name = "coding-adventures-cobol-runtime"
version = "0.64.0"
edition = "2021"
description = "Runtime (tree-walking interpreter) for COBOL-60 — a faithful PICTURE-typed data model and statement execution, built on the cobol-parser CST. v0.53.0 supports STRING … DELIMITED BY a single-character ASCII delimiter — STRING \"ab,cd\" \"ef\" DELIMITED BY \",\" INTO t → \"abef\" — where each sending field contributes only its prefix up to its first delimiter char (a field with no delimiter is taken whole; a field starting with the delimiter contributes the empty string), then the prefixes are concatenated and overlaid onto the receiver exactly as DELIMITED BY SIZE does (no tail space-fill). Stmt::String gains a delim: Option<Operand> (None = SIZE); exec_string resolves the single delimiter via the same single_delim_char UNSTRING uses and truncates each field at its first delimiter char. A non-ASCII literal delimiter and a non-ASCII string-literal sending field under a delimiter are clean later rungs on both engines (the oracle scans by char, the compiler by byte — they agree only for ASCII), while a multi-character delimiter, per-field different delimiters, WITH POINTER, ON OVERFLOW, and a numeric/group receiver stay later rungs. This SUPERSEDES the earlier \"STRING with a real delimiter is a later rung\" deferral. v0.52.0 supports UNSTRING with an alphanumeric STRING-LITERAL source — UNSTRING \"a,b,c\" DELIMITED BY \",\" INTO w1 w2 w3 — accepted in the source position (no grammar change; the grammar already parses a literal operand there). Stmt::Unstring.source widened from String to Operand; only the character PROVIDER differs — an Operand::Ident reads an item's storage (as before), an Operand::Lit(Lit::Str) scans the literal's own bytes (no item lookup, no picture check). The delimiter scan and per-receiver reshape are unchanged and shared. Only an ASCII literal is accepted (the executor scans by character while the compiler lowers to byte-based IIR string ops, so they agree only for one-byte chars); a NUMERIC-literal source (UNSTRING 123 …), a FIGURATIVE source (UNSTRING SPACE …), a NON-ASCII string-literal source (UNSTRING \"café\" …), and a reference-modified source stay later rungs, rejected on both engines. v0.51.0 supports INSPECT source TALLYING c1 FOR ALL a [ALL b …] c2 FOR ALL d … — TWO OR MORE tally_for groups, each with its OWN counter and one-or-more single-char ALL delimiters — executed as ONE left-to-right pass over a COMBINED priority list across all counters (the ISO rule): at each position the delimiters are tried in written order (group-1's items first, then group-2's, …) and the FIRST match increments ITS OWN group's counter then the scan advances, so a position CLAIMED by an earlier group NEVER reaches a later group (\"aa\" TALLYING C1 FOR ALL \"a\" C2 FOR ALL \"a\" gives C1 += 2, C2 += 0). exec_inspect_tally_counters validates every counter unsigned-integer, flattens all groups' delimiters to (group, char) in written order, keeps one accumulator per group over a single pass, then ADDS each accumulator to its counter via the same store path (re-reading the counter each add, so two groups naming the SAME counter both add to it). The path is ALL-only single-char with no BEFORE/AFTER region and no LEADING/CHARACTERS; several counters combined with REPLACING stays a later rung; exactly ONE tally_for keeps the single-counter paths unchanged. v0.50.0 supports INSPECT source TALLYING counter FOR ALL a ALL b [ALL d …] — TWO OR MORE ALL tally items under ONE counter — executed as a SINGLE left-to-right pass with FIRST-MATCH-PER-POSITION into the shared counter: at each position the delimiters are tried in written order and the FIRST that matches increments the count by 1 then the scan advances, so DUPLICATE delimiters do NOT double-count (FOR ALL \"a\" ALL \"a\" over \"aa\" adds 2, not 4). The count collapses to the number of source positions whose character equals SOME delimiter, each counted exactly once, and is ADDED to the counter (INSPECT adds; it does not clear it first) through the same store_result path the single-item tally uses. exec_inspect_tally_multi resolves every delimiter via the same single_delim_char check first (so an invalid delimiter aborts without touching the counter), validates the counter as an unsigned PIC 9(n) integer, then counts; the read-side read_inspect_tally_multi counts the same tally_item children the compiler counts so the two engines are co-total. The multi path is ALL-only, single-char, with no BEFORE/AFTER region and no LEADING/CHARACTERS, under EXACTLY ONE counter; a multi-item list carrying any of those, SEVERAL counters (more than one FOR phrase group), and the combined TALLYING … REPLACING form with several tally items stay later rungs; a single tally item keeps the full single-item path (LEADING, region). v0.49.0 supports INSPECT source REPLACING ALL a BY x ALL b BY y [ALL c BY z …] — TWO OR MORE ALL replace items in ONE REPLACING clause — executed as a SINGLE left-to-right pass with FIRST-MATCH-WINS and NO RE-CHAINING: at each position the items are consulted in written order and the first whose single-char search matches the ORIGINAL character wins, and the produced byte is never re-examined (so REPLACING ALL \"a\" BY \"b\" ALL \"b\" BY \"z\" over \"ab\" is \"bz\", not \"zz\"). A new Stmt::InspectReplacingMulti { source, items } variant is read via read_inspect_replacing_multi (read_statement dispatches on the replace_item count: one → the single-item path with all its capabilities; two or more → the multi path); exec_inspect_replacing_multi resolves every (search, replace) char pair first via the shared single_delim_char, then rebuilds in one pass over the original characters. The multi path is ALL-only, single-char, with no BEFORE/AFTER region and no LEADING/CHARACTERS/FIRST; a multi-item list carrying any of those, and the combined TALLYING … REPLACING form with several items, stay later rungs (identical messages on both engines). v0.48.0 supports the STANDALONE INSPECT … FOR LEADING and REPLACING LEADING with a BEFORE/AFTER region: the leading run is ANCHORED at the window start (not source position 0), so INSPECT S TALLYING C FOR LEADING \"a\" AFTER \"X\" over \"aaXaab\" counts the run in the window \"aab\" (2), ignoring the \"aa\" before the X, and INSPECT S REPLACING LEADING \"a\" BY \"*\" AFTER \"X\" rewrites only that in-window run (→ \"aaX**b\"). inspect_tally's window take_while was already anchored; inspect_replace's leading path now copies positions outside [start,end) through unchanged and leaves the run state untouched so the run truly starts at the window start. AFTER x with x absent is an empty window (count 0 / no substitution); BEFORE x with x absent is the whole source. The read-time rejects that deferred FOR LEADING/REPLACING LEADING + region are relaxed in the shared readers; the COMBINED TALLYING … REPLACING form still defers a LEADING half carrying a region (that gate moved into the combined caller, with the same messages). v0.37.0 extends the mixed numeric↔alphanumeric COMPARISON (IF NUM = \"str\", <, >, … in IF/EVALUATE/any condition) to a SIGNED numeric operand (PIC S9(i)V9(d), integer or scaled), not only an unsigned one. A signed numeric operand's comparison image is its stored MAGNITUDE with the operational sign folded into a TRAILING OVERPUNCH on the units (last) digit — the SAME bytes the signed numeric→alphanumeric MOVE produces (overpunch_trailing(&storage, neg); units u maps positive {ABCDEFGHI, negative }JKLMNOPQR). So PIC S9(3) = -123 compares equal to \"12L\", = +123 equal to \"12C\", scaled PIC S9V9 = -4.2 equal to \"4K\"; ordering follows the byte comparison of those images. compare_operands no longer rejects a signed numeric operand in its mixed gate; its alphanumeric byte arm now computes each side as signed_overpunch_image(op).unwrap_or_else(|| src_chars(&src)) — a helper returning Some(overpunch_trailing) only for a signed-numeric data-name, else None — so the compared string changes ONLY for a signed operand (unsigned/figurative/literal keep their src_chars image; the space-pad/figurative-fill/byte-compare logic is otherwise unchanged). Byte-identical to the compiler, which builds the identical image via emit_signed_num_alpha_image and runs the same str_cmp. A value truncating to a zero magnitude stores neg=false (no negative zero), so overpunch_trailing(\"000\", false) → \"00{\" on both engines. Also aligns a numeric-literal asymmetry: a numeric LITERAL vs alphanumeric (a different pairing, out of scope) was previously answered silently by the oracle while the compiler rejected it; compare_operands now rejects it too, so both engines defer it identically. A group item in a mixed comparison remains a clean later rung; no grammar change. v0.35.0 extends the REVERSE cross-category MOVE (alphanumeric → numeric) to an UNSIGNED SCALED receiver PIC 9(i)V9(d) (d>0), not only an unsigned integer. exec_move folds the source's m characters into an unsigned integer V (V = V*10 + (byte-'0')), and that fold IS the receiver's scaled-slot magnitude directly — the (i+d) digit positions RIGHT-justified with the implied point d places from the right, so the slot = V mod 10^(i+d) (left-zero-padded when the source is shorter than i+d, high-order-truncated when longer). This is NOT the arithmetic decimal-align rule: V is not multiplied by 10^d. It builds a Decimal placing the folded magnitude at scale d — the point inserted d places from the right (int = the magnitude's digits above the last d, empty→\"0\"; frac = its last d digits left-zero-padded to d) — and move_into → move_into_numeric(int_digits=i, dec_digits=d) keeps the low-order i integer and high-order d fractional digits = V mod 10^(i+d) with the point at d. So MOVE \"042\" TO 9(2)V9 is slot 042 (reads 4.2), MOVE \"42\" TO 9(2)V9 is 042, MOVE \"12345\" TO 9(2)V9 is 345 (reads 34.5), MOVE \"5\" TO 9(1)V99 is 005 (reads 0.05). For d=0 the split is int=V_str, frac=\"\" — reproducing the old integer-receiver path exactly. A SPACE source byte (below '0') still keeps the MAGNITUDE (unsigned_abs), no stray sign. Byte-identical to the compiler, which folds the identical arithmetic and hands store_scaled the same scale d. A SIGNED (PIC S9) receiver, a source wider than 18 characters, and group items remain clean later rungs; no grammar change. v0.34.0 extended the numeric→alphanumeric MOVE and the mixed numeric↔alphanumeric comparison to an UNSIGNED SCALED numeric operand (PIC 9(i)V9(d), d>0, no S). A scaled numeric moved to / compared as alphanumeric uses its digit image = ALL its digits, integer part then fractional part, NO decimal point — exactly what Decimal::digits() (int+frac) already yields for the item (PIC 9(2)V9=4.2 → \"042\", PIC 9(1)V99=3.14 → \"314\"). item_as_decimal splits the stored digits into int (int_digits wide) and frac (dec_digits wide), so once the deferral gate is opened the existing digits()→move_into_char (MOVE) and compare_operands alphanumeric arm (comparison) produce the image with no code change: MOVE 9(2)V9=4.2 TO X(3) is \"042\", X(5) is \"042  \", X(2) is \"04\"; IF F = \"042\" is TRUE, IF F > \"040\" is TRUE. The num→alpha MOVE gate and operand_is_signed_numeric (renamed from operand_is_signed_or_scaled_numeric) now reject only a SIGNED operand. This is byte-identical to the compiler, which builds the same (i+d)-digit image via emit_num_digit_string. A SIGNED (PIC S9) operand, the REVERSE alphanumeric→scaled-receiver MOVE, and group items remain clean later rungs. v0.33.0 adds NUMERIC ↔ ALPHANUMERIC comparison: a relational condition (in IF / EVALUATE / any condition context) comparing an UNSIGNED-INTEGER numeric operand (PIC 9(n), no S, no V) with an ALPHANUMERIC operand (a PIC X item OR a string literal). Per COBOL, the numeric operand is treated as though moved to an alphanumeric field — its digit image, which Decimal::digits() already yields as the item's fixed-width zero-padded storage (PIC 9(3)=42 → \"042\") — and compare_operands falls into its alphanumeric arm: the shorter side is space-padded on the right to the longer's length and the two are byte-compared (so IF NUM = \"042\" is TRUE, IF NUM = \"42\" is FALSE because \"042\" vs \"42 \" differ, IF NUM > \"040\" is TRUE). This is byte-identical to the compiler, which builds the same digit image and runs the same space-padded str_cmp. Only an UNSIGNED-INTEGER numeric operand has an unambiguous image on this rung; compare_operands now rejects a SIGNED (PIC S9) or SCALED (PIC 9V9) numeric operand, or a group item, in a mixed comparison as a clean later rung (Unsupported) so the oracle errors precisely where the compiler does. (A numeric literal vs an alphanumeric operand is a different pairing, left as existing behavior — outside this rung's scope.) v0.32.0 adds the REVERSE cross-category MOVE: MOVE alphanumeric-item TO numeric-item for an alphanumeric source (PIC X(m)) into an UNSIGNED INTEGER receiver (PIC 9(n), no S, no V). COBOL reads the source's m characters as an unsigned integer and de-scales it into the receiver RIGHT-justified — keeping the low-order n digits (left-zero-padded when the source is shorter, high-order-truncated when longer): receiver = (integer formed from the m source chars) mod 10^n (so X(3)=\"042\" → 9(3) is 42, X(2)=\"05\" → 9(4) is 0005, X(5)=\"12345\" → 9(3) is 345). exec_move folds the source's bytes left-to-right into an i64 (value = value*10 + (byte - '0')) and stores it through move_into (as a scale-0 Decimal), whose move_into_numeric applies exactly that digit-count alignment/truncation. This matches the compiler byte-for-byte, which folds the identical per-character arithmetic and truncates via its numeric-store helper. The rung scopes to an ALL-DIGIT source (a non-digit byte runs the identical (byte - '0') arithmetic — defined-but-unspecified, identical on both engines — so it is untested and needs no reject), and a source wider than 18 characters is a clean later rung (its i64 fold could overflow) rejected identically on both engines. A SIGNED (PIC S9) or SCALED (PIC 9V9) numeric receiver, and a group item on either side, remain clean later rungs (exec_move only handles a genuine alphanumeric source item into an unsigned-integer receiver; every other shape falls through to move_into, which rejects a Src::Chars → numeric MOVE, so the two engines agree on the deferral). v0.31.0 adds the first CROSS-category MOVE: MOVE numeric-item TO alphanumeric-item for an UNSIGNED INTEGER source (PIC 9(n), no S, no V) into a PIC X(m) receiver. The numeric sending item is treated as though it held its digit characters — its n-digit zero-padded magnitude, exactly what DISPLAY shows — then moved by the alphanumeric rules (LEFT-justified, space-padded on the right if wider, truncated on the right if narrower): move_into resolves the source to a Decimal, takes Decimal::digits(), and stores it through the existing move_into_char left-justify/pad path, so PIC 9(3)=042 → X(5) is \"042  \", → X(2) is \"04\", → X(3) is \"042\". This matches the compiler byte-for-byte (which builds the same digit image at run time and runs it through the identical char reshape). The reverse direction (alphanumeric → numeric), a signed (PIC S9) or scaled (PIC 9V9) numeric source into an alphanumeric receiver, and a group item remain clean later rungs (exec_move rejects the signed/scaled numeric→alphanumeric shapes so the two engines agree on the deferral). v0.30.0 adds COMPUTED reference modification IDENT(start:len) where start and/or len are DATA-NAME (run-time integer) operands — WS(J:K), WS(J:), WS(2:K): refmod_string evaluates each index to an i64 (a literal is its own value; a data-name must be an unsigned-integer item, its stored digits parsed), computes start0 = start-1 and end = start0+len (or the item width for an omitted length), and slices [start0, end). An out-of-range computed refmod returns the new RefModOutOfRange trap under the predicate start0 < 0 || end < start0 || end > width — the IDENTICAL bounds check the compiled str_slice enforces in the VM/wasm backends — so an in-range refmod slices byte-identically to the compiler and an out-of-range one errors on both. A signed/fractional/non-numeric index item, reference modification of a numeric item, and use in a numeric/MOVE-source context remain later rungs. v0.29.0 adds INSPECT source CONVERTING from TO to (translate every character of an alphanumeric source through a per-character table built from two equal-length string literals — a character equal to from[k] becomes to[k], the FIRST occurrence winning if from repeats a character, others left unchanged — in place, same width; unequal-length FROM/TO, a data-name/figurative/reference-modified from/to, a BEFORE/AFTER region, and a numeric/group source remain later rungs). v0.28.0 adds the combined INSPECT source TALLYING counter FOR ALL delim REPLACING ALL x BY y (one INSPECT carrying BOTH phrases): per ISO it runs as tally-then-replace — count delim in the ORIGINAL source into the counter FIRST, then replace every x with y — so a shared delimiter/search character (delim == x) is counted before it is substituted; a combined statement whose TALLYING or REPLACING half is itself a deferred sub-form remains a later rung. v0.27.0 adds INSPECT source REPLACING ALL x BY y (replace every occurrence of a single character x — a 1-char literal or PIC X(1) item — with a single character y in an alphanumeric source, in place, via a per-position map; REPLACING CHARACTERS/LEADING/FIRST, BEFORE/AFTER regions, several replace items, and a multi-character/figurative/wider search or replacement or a numeric/group source remain later rungs), on top of v0.26.0's INSPECT source TALLYING counter FOR ALL delim (count the occurrences of a single-character delimiter — a 1-char literal or PIC X(1) item — in an alphanumeric source and ADD them to an unsigned-integer counter; LEADING/CHARACTERS tallies, BEFORE/AFTER phrases, and several counters or FOR phrases remain later rungs)."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-cobol-parser = { path = "../cobol-parser" }
