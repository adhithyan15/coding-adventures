<svg xmlns="http://www.w3.org/2000/svg" width="502" height="322.59" viewBox="0 0 502 322.59" role="img" aria-label="How to write 也: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 也</title><desc>3 frames; frame N shows movements 1 to N of 也 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 也.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B9%9F.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 也. Median 1 draws a horizontal that rises to the right, turns down and hooks to the left without lifting; median 2 draws a vertical through the middle; median 3 draws a long vertical that bends right along the foot and hooks up without lifting. These are the last three strokes of 他, in the same order. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the two turns, the two hooks and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="322.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="216.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="216.59" viewBox="-40 -908 1063 1534.9" preser