<svg xmlns="http://www.w3.org/2000/svg" width="662" height="467.18" viewBox="0 0 662 467.18" role="img" aria-label="How to write ો: 2 strokes · 1 pen lift · 4 movements"><title>Writing ો</title><desc>4 frames; frame N shows movements 1 to N of ો (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/8_ko.svg, groups g1 then g2 (strokes g1s0, g2s0): the o sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કો, and in all 33 consonant rows whose consonant keeps its bare outline, ો is two pen-down runs: the ા bar first, from the top down into its foot, then the flag above it, from its upper-left tip down to the right. t30apps, already cited for ઓ, draws its trailing stem before its high arc. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: its most common form of the o sign (42 of 83 prototypes, 51%) is two strokes, the bar first. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="467.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="348.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="348.68" viewBox="-195 -966 522 1213.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q196 0 168 9.5Q140 19 122 37Q105 54 97.5 79Q90 104 90 148L90 603L170 593L170 152Q170 124 173 112Q176 100 185 90Q196 77 215.5 75Q235 73 257 73L249 0L239 0ZM92 641Q64 740 33.5 782Q3 824 -49 824Q-60 824 -74 822Q-88 820 -101 815L-125 884Q-104 891 -83 893.5Q-62 896 -44 896Q3 896 40.5 876Q78 856 108.5 801Q139 746 163 641L92 641Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 595 L130 595" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 595 L130 500 L130 400 L130 300 L130 200 L131 140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="66" y="181.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="66" y="181.8">1. draw the bar down</tspan></text></svg><rect x="176" y="42" width="150" height="348.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="348.68" viewBox="-195 -966 522 1213.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q196 0 168 9.5Q140 19 122 37Q105 54 97.5 79Q90 104 90 148L90 603L170 593L170 152Q170 124 173 112Q176 100 185 90Q196 77 215.5 75Q235 73 257 73L249 0L239 0ZM92 641Q64 740 33.5 782Q3 824 -49 824Q-60 824 -74 822Q-88 820 -101 815L-125 884Q-104 891 -83 893.5Q-62 896 -44 896Q3 896 40.5 876Q78 856 108.5 801Q139 746 163 641L92 641Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 595 L130 500 L130 400 L130 300 L130 200 L131 140 L131 140" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 140 L136 95 L155 62 L185 44 L215 38 L248 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="248" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="66" y="181.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="66" y="181.8">2. turn into the foot to</tspan><tspan x="66" y="232.8">the right</tspan></text></svg><rect x="336" y="42" width="150" height="348.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="348.68" viewBox="-195 -966 522 1213.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q196 0 168 9.5Q140 19 122 37Q105 54 97.5 79Q90 104 90 148L90 603L170 593L170 152Q170 124 173 112Q176 100 185 90Q196 77 215.5 75Q235 73 257 73L249 0L239 0ZM92 641Q64 740 33.5 782Q3 824 -49 824Q-60 824 -74 822Q-88 820 -101 815L-125 884Q-104 891 -83 893.5Q-62 896 -44 896Q3 896 40.5 876Q78 856 108.5 801Q139 746 163 641L92 641Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 595 L130 500 L130 400 L130 300 L130 200 L131 140 L136 95 L155 62 L185 44 L215 38 L248 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M-113 850 L-113 850" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-113 850 L-75 858 L-44 860 L3 850 L43 822" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="43" cy="822" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="66" y="181.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="66" y="181.8">3. arc the flag to the</tspan><tspan x="66" y="232.8">right</tspan></text></svg><rect x="496" y="42" width="150" height="348.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="348.68" viewBox="-195 -966 522 1213.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M239 0Q196 0 168 9.5Q140 19 122 37Q105 54 97.5 79Q90 104 90 148L90 603L170 593L170 152Q170 124 173 112Q176 100 185 90Q196 77 215.5 75Q235 73 257 73L249 0L239 0ZM92 641Q64 740 33.5 782Q3 824 -49 824Q-60 824 -74 822Q-88 820 -101 815L-125 884Q-104 891 -83 893.5Q-62 896 -44 896Q3 896 40.5 876Q78 856 108.5 801Q139 746 163 641L92 641Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 595 L130 500 L130 400 L130 300 L130 200 L131 140 L136 95 L155 62 L185 44 L215 38 L248 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M-113 850 L-75 858 L-44 860 L3 850 L43 822 L43 822" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M43 822 L78 772 L104 712 L127 641" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="127" cy="641" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="66" y="181.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="66" y="181.8">4. curve it down to the</tspan><tspan x="66" y="232.8">right</tspan></text></svg><text x="16" y="403.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="416.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/8_ko.svg, groups g1 then g2 (strokes g1s0, g2s0): the o sign drawn</text><text x="16" y="428.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">after the consonant (GitHub, 2026)</text><text x="16" y="441.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
