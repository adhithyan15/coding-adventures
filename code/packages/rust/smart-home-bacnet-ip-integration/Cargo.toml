[package]
name = "smart-home-bacnet-ip-integration"
version = "0.1.0"
edition = "2021"
description = "Authorized bounded BACnet/IP discovery and Device telemetry for Smart Home"
license = "MIT"

[dependencies]
bacnet-protocol = { path = "../bacnet-protocol" }
serde_json = "1"
smart-home-core = { path = "../smart-home-core" }
smart-home-discovery = { path = "../smart-home-discovery" }
smart-home-runtime = { path = "../smart-home-runtime" }
udp-client = { path = "../udp-client" }

[[bin]]
name = "smart-home-bacnet-ip-integration"
path = "src/main.rs"
