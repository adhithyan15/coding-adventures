[package]
name = "mosaic-package-manifest"
version = "0.1.0"
edition = "2021"
description = "Parser and validator for mosaic-package.toml manifests (UI29 §4.1 / §4.2)"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
regex = "1"

[dev-dependencies]
# Pins EnvironmentAxis::wire_name to the runtime's Environment keys (UI48 §7.5).
mosaic-app-runtime = { path = "../mosaic-app-runtime" }
serde_json = "1"
