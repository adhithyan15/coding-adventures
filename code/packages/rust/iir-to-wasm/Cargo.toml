[package]
name = "iir-to-wasm"
version = "0.7.0"
edition = "2021"
description = "IIR → WASM backend — lowers IIRModule to WasmModule.  v0.7.0 (G1): accept `cmp_eq`/`cmp_ne`/`cmp_lt`/`cmp_le`/`cmp_gt`/`cmp_ge` alongside the bare `eq`/`ne`/`lt`/… form, so BASIC/Nib/Oct frontends (which prefix `cmp_`) lower to real wasm comparison opcodes."

[lib]
name = "iir_to_wasm"
path = "src/lib.rs"

[dependencies]
interpreter-ir      = { path = "../interpreter-ir" }
wasm-types          = { path = "../wasm-types" }
wasm-module-encoder = { path = "../wasm-module-encoder" }
wasm-leb128         = { path = "../wasm-leb128" }
codegen-core        = { path = "../codegen-core" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"
