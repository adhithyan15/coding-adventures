[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-hdd-simulator"
version = "0.1.0"
description = "Deterministic educational HDD geometry, sector I/O, and timing model"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
keywords = ["education", "database", "storage", "simulator", "hdd"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Education", "Topic :: Education", "Topic :: Database", "Programming Language :: Python :: 3.12", "License :: OSI Approved :: MIT License", "Typing :: Typed"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/hdd_simulator"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hdd_simulator --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["src/hdd_simulator"]

[tool.coverage.report]
fail_under = 95
show_missing = true
