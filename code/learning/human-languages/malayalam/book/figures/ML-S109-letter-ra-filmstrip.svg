rning tool, formation arrows for ര in data/RA.png: green start, blue turn, red end</text><text x="16" y="258.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(GPL-3.0, 2013)</text><text x="16" y="271.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
