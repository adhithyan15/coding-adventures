<svg xmlns="http://www.w3.org/2000/svg" width="342" height="335.52" viewBox="0 0 342 335.52" role="img" aria-label="How to write ഒ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ഒ</title><desc>2 frames; frame N shows movements 1 to N of ഒ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Donald R. Davis Jr., The Malayalam Script, Initial Vowels, ഒ handwriting clip, 00:00–00:04 (University of Texas at Austin) &lt;https://malayalam.la.utexas.edu/resources/the-malayalam-script/&gt;. Source note on variation: The page identifies initial vowels as word-initial forms and directly links the four-second o.mp4 handwriting clip. The clip visibly draws the compact inner curl continuously into the broad left arch, then lifts once and completes the right shoulder and rounded lower lobe in one run. This is one attested one-lift pedagogical order fitted to the bundled Noto Sans Malayalam outline.</desc><rect x="0" y="0" width="342" height="335.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="204.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="204.52" viewBox="-31 -636 819 1116.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M448 566Q544 566 600.5 545Q657 524 682 487.5Q707 451 707 404Q707 376 696.5 351.5Q686 327 663.5 307.5Q641 288 605 274L601 280Q658 264 688 227Q718 190 718 140Q718 69 670.5 29Q623 -11 539 -11Q511 -11 485.5 -7.5Q460 -4 441 0L459 69Q477 65 493.5 62Q510 59 529 59Q579 59 605 78.5Q631 98 631 144Q631 163 624 180Q617 197 601 210Q585 224 561.5 232Q538 240 490 240L468 240L468 310L492 310Q523 310 551.5 317.5Q580 325 597 341Q609 352 614.5 366Q620 380 620 399Q620 441 580 467.5Q540 494 445 494Q370 494 309.5 474Q249 454 207 419Q165 384 142.5 336.5Q120 289 120 233L120 225Q120 171 135 133.5Q150 96 176.5 77Q203 58 239 58Q265 58 284 69.5Q303 81 314 103.5Q325 126 325 157Q325 206 298.5 232Q272 258 231 258Q197 258 166 242.5Q135 227 109 201L113 283Q141 303 175.5 315.5Q210 328 245 328Q294 328 330.5 309Q367 290 387.5 253.5Q408 217 408 165Q408 110 387 70Q366 30 327.5 9Q289 -12 237 -12Q185 -12 139.5 14Q94 40 66.5 93.5Q39 147 39 229Q39 304 66.5 366Q94 428 147 473Q200 518 276 542Q352 566 448 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M190 290 L190 290" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M190 290 L245 293 L300 280 L350 230 L365 165 L355 95 L300 45 L240 20 L180 35 L120 95 L95 165 L105 220 L145 260 L190 290 L190 310 L125 315 L95 350 L110 390 L140 430 L180 465 L240 495 L310 520 L400 530 L520 510 L620 465 L665 410 L655 350 L600 300 L490 275" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="490" cy="275" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378.5" y="217.6" text-anchor="middle" font-size="65.6" fill="#6b7280"><tspan x="378.5" y="217.6">1. curl clockwise from</tspan><tspan x="378.5" y="297.6">the compact inner tip</tspan><tspan x="378.5" y="377.7">and sweep through the</tspan><tspan x="378.5" y="457.7">broad left arch</tspan></text></svg><rect x="176" y="42" width="150" height="204.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="204.52" viewBox="-31 -636 819 1116.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M448 566Q544 566 600.5 545Q657 524 682 487.5Q707 451 707 404Q707 376 696.5 351.5Q686 327 663.5 307.5Q641 288 605 274L601 280Q658 264 688 227Q718 190 718 140Q718 69 670.5 29Q623 -11 539 -11Q511 -11 485.5 -7.5Q460 -4 441 0L459