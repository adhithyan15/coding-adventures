[package]
name = "vos-model-sat"
version = "0.1.0"
edition = "2021"
description = "Host model-SAT lane of the verified-OS program (VOS-040a, VOS31): an N-parametric AIG encoder of the sched contract model and its ten lemmas, with mutant encoders and three cross-checks against the Warrant evaluator and a plain Rust reference; no solving yet (VOS-040b)"
# An evidence-only host program, not a published package (VOS-D104, checked by `vos-link check-publish`).
publish = false

[lib]
name = "vos_model_sat"
path = "src/lib.rs"

[[bin]]
name = "vos-model-sat"
path = "src/main.rs"

# A standalone cargo root (like the other programs under code/programs/rust): every
# dependency is an in-repository path dependency, no third-party crate.  VOS31 section 3: this
# crate DEPENDS ON the recorded inputs and edits none of them.
[workspace]

[dependencies]
# The encoder targets the bit-blaster's AIG and bit-vectors (VOS31 section 5).
bit-blaster = { path = "../../../packages/rust/bit-blaster" }
# The cross-checks use the Warrant evaluator, read-only (VOS31 section 6).
coding_adventures_warrant_grammar = { path = "../../../packages/rust/warrant-grammar" }
# The contract's own files are read through `vos-link check-contract`'s library surface
# (`load_inputs`, `evaluation_document`, `splice`: VOS31 section 6.1), so the lane evaluates the
# very document `check-contract` evaluates.
vos-link = { path = "../vos-link" }
vos-manifest = { path = "../../../packages/rust/vos-manifest" }

# A test-only edge (VOS-D058): the cross-checks read the real contract package's files, and the
# build tool selects a package's tests by its Cargo dependency edges, so an edit to a `.part`
# or to `contract.vos` must select them.
[dev-dependencies]
vos-sched-contract = { path = "../../../packages/rust/vos-sched-contract" }
