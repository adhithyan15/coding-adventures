<svg xmlns="http://www.w3.org/2000/svg" width="662" height="313.52" viewBox="0 0 662 313.52" role="img" aria-label="How to write ظ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ظ</title><desc>4 frames; frame N shows movements 1 to N of ظ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, To’e, zo’e, se, zhe, and ġhain, independent ظ handwriting animation and Zo’e instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/toe-zoe-se-zhe-ghain/&gt;. Source note on variation: The independent handwriting animation draws the closed to&apos;e-series body and leftward finish first, then adds the tall upright and the single dot above as separate marks. The adjacent prose identifies zo&apos;e as to&apos;e with one dot above and shows the same shape in every position. This learner path fits that body-first, two-lift order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Persian or Arabic ظ sources.</desc><rect x="0" y="0" width="662" height="313.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="207.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="207.52" viewBox="-28 -741 816 1128.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M396 0Q356 0 315 2Q274 4 241.5 6.5Q209 9 192 12Q175 16 147 28Q119 40 90.5 56Q62 72 42 86L53 121Q90 112 127.5 104Q165 96 204 90Q219 109 233.5 127Q248 145 26