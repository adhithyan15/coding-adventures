<svg xmlns="http://www.w3.org/2000/svg" width="502" height="308.54" viewBox="0 0 502 308.54" role="img" aria-label="How to write ण: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ण</title><desc>3 frames; frame N shows movements 1 to N of ण (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ण-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A3-order.gif&gt;. Source note on variation: The 19-frame animation shows three ordered pen-down runs over its gray guide: frames 2–9 start at the left stem&apos;s headline junction, descend top-to-bottom, curve clockwise around the lower bowl, and rise along the inner right stem back to the headline without lifting; frames 10–13 restart at the outer right stem&apos;s headline junction and descend top-to-bottom; frames 14–17 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 9 and 13 mark the first two run endings before the one-second completed frame 18. This learner path follows that sourced three-run order and fits its bowl and stems to Noto Sans Devanagari; everyday handwriting may narrow or simplify the bowl differently.</desc><rect x="0" y="0" width="502" height="308.54" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="202.54" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.54" viewBox="-70 -692 877 1184.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M634 551L634 0L553 0L553 551L420 551L420 321Q420 293 416 271Q412 249 404.5 231Q397 213 385 198Q364 173 331 159.5Q298 146 