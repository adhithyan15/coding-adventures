-131 484 -111Q508 -96 524 -80Q540 -64 547 -48Q534 -46 521.5 -44Q509 -42 495 -41Q419 -35 382 -22.5Q345 -10 325 18Q306 46 306 91Q306 122 320.5 159Q335 196 361 232.5Q387 269 419 297Q468 340 507 340Q541 340 558 317Q575 294 584 253L548 243Q541 253 534.5 255.5Q528 258 516 258Q499 258 474.5 245.5Q450 233 425.5 211.5Q401 190 380 164Q349 122 342 87Q356 74 384 64.5Q412 55 452 49Q488 44 513 37.5Q538 31 553 21Q570 9 576.5 -7.5Q583 -24 583 -47Q583 -77 557.5 -111Q532 -145 489.5 -176Q447 -207 394 -229Q316 -262 249 -262Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M548 285 L510 288 L472 270 L430 238 L395 205 L365 168 L345 125 L330 82 L340 45 L375 25 L420 8 L470 -2 L520 -24 L555 -55 L555 -55" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M555 -55 L535 -98 L495 -145 L445 -188 L390 -218 L325 -238 L255 -238 L190 -218 L140 -180 L105 -130 L90 -78 L94 -25 L105 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="326" y="454.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="326" y="454.6">2. continue left around</tspan><tspan x="326" y="518.8">the below-baseline bowl</tspan><tspan x="326" y="582.9">and finish at its</tspan><tspan x="326" y="647.1">rising tip</tspan></text></svg><text x="16" y="300.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Chhoṭī he, do-chashmī he,</text><text x="16" y="313.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">chhoṭī ye, baṛī ye, and punctuation, independent ی</text><text x="16" y="325.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">calligraphic and handwriting animations and Chhoṭī ye</text><text x="16" y="338.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">instructions (Northwestern University Libraries Open</text><text x="16" y="350.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2026)</text><text x="16" y="363.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="375.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
