<svg xmlns="http://www.w3.org/2000/svg" width="502" height="307.31" viewBox="0 0 502 307.31" role="img" aria-label="How to write भ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing भ</title><desc>3 frames; frame N shows movements 1 to N of भ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari bʰ भ.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_b%CA%B0_%E0%A4%AD.gif&gt;. Source note on variation: The 15-frame animation shows three ordered pen-down runs: frames 0–9 start at the upper loop&apos;s lower inner tip, sweep left and clockwise around the upper loop, descend the joined trunk, curl clockwise around the lower bowl, and continue right through the crossbar without lifting; frames 10–12 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 13–14 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The spatial restarts at frames 10 and 13 delimit the three runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 38, independently confirms the upper loop and trunk, lower bowl and crossbar, right stem, and headline order, while staging the upper and lower body parts separately rather than proving their join. This learner path takes its three-run lift count from the animation and fits its curves to Noto Sans Devanagari; everyday handwriting may divide or simplify the joined body differently.</desc><rect x="0" y="0" width="502" height="307.31" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="201.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.31" viewBox="-24 -702 811 1088.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M177 632Q235 632 269 610Q303 588 317.5 549.5Q332 511 332 463L332 321L533 321L533 551L402 551L402 622L717 622L717 551L614 551L614 0L533 0L533 250L332 250L332 213Q332 180 317.5 165.5Q303 151 283 151Q264 151 243 163.5Q222 176 204 195.5Q186 215 175 237Q164 259 164 278Q164 290 170 300Q176 310 189 315.5Q202 321 224 321L253 321L253 453Q253 509 236.5 538Q220 567 180 567Q152 567 137 552.5Q122 538 122 515Q122 487 143.5 471.5Q165 456 209 451L201 386Q134 391 90 424.5Q46 458 46 517Q46 574 83 603Q120 632 177 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M200 410 L200 410" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M200 410 L165 414 L135 425 L95 455 L75 495 L78 540 L100 575 L135 595 L180 602 L225 592 L260 565 L285 528 L292 485 L285 450 L292 405 L292 360 L292 315 L292 265 L286 220 L260 188 L225 184 L205 215 L180 242 L182 278 L200 300 L235 285 L275 285 L325 285 L380 285 L440 285 L495 285 L530 285" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="530" cy="285" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="381.5" y="205" text-anchor="middle" font-size="65" fill="#6b7280"><tspan x="381.5" y="205">1. circle clockwise</tspan><tspan x="381.5" y="284.3">through both loops and</tspan><tspan x="381.5" y="363.6">sweep right</tspan></text></svg><rect x="176" y="42" width="150" height="201.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.31" viewBox="-24 -702 811 1088.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M177 632Q235 632 269 610Q303 588 317.5 549.5Q332 511 332 463L332 321L533 321L533 551L402 551L402 622L717 622L717 551L614 551L614 0L533 0L533 250L332 250L332 213Q332 180 317.5 165.5Q303 151 283 151Q264 151 243 163.5Q222 176 204 195.5Q186 215 175 237Q164 259 164 278Q164 290 170 300Q176 310 189 315.5Q202 321 224 321L253 321L253 453Q253 509 236.5 538Q220 567 180 567Q152 567 137 552.5Q122 538 122 515Q122 487 143.5 471.5Q165 456 209 451L201 386Q134 391 90 424.5Q46 458 46 517Q46 574 83 603Q120 632 177 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M200 410 L165 414 L135 425 L95 455 L75 495 L78 540 L100 575 L135 595 L180 602 L225 592 L260 565 L285 528 L292 485 L285 450 L292 405 L292 360 L292 315 L292 265 L286 220 L260 188 L225 184 L205 215 L180 242 L182 278 L200 300 L235 285 L275 285 L325 285 L380 285 L440 285 L495 285 L530 285" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M575 551 L575 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M575 551 L575 475 L575 395 L575 315 L575 235 L575 155 L575 75 L575 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="575" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="381.5" y="205" text-anchor="middle" font-size="65" fill="#6b7280"><tspan x="381.5" y="205">2. lift, then descend</tspan><tspan x="381.5" y="284.3">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="201.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="201.31" viewBox="-24 -702 811 1088.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M177 632Q235 632 269 610Q303 588 317.5 549.5Q332 511 332 463L332 321L533 321L533 551L402 551L402 622L717 622L717 551L614 551L614 0L533 0L533 250L332 250L332 213Q332 180 317.5 165.5Q303 151 283 151Q264 151 243 163.5Q222 176 204 195.5Q186 215 175 237Q164 259 164 278Q164 290 170 300Q176 310 189 315.5Q202 321 224 321L253 321L253 453Q253 509 236.5 538Q220 567 180 567Q152 567 137 552.5Q122 538 122 515Q122 487 143.5 471.5Q165 456 209 451L201 386Q134 391 90 424.5Q46 458 46 517Q46 574 83 603Q120 632 177 632Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M200 410 L165 414 L135 425 L95 455 L75 495 L78 540 L100 575 L135 595 L180 602 L225 592 L260 565 L285 528 L292 485 L285 450 L292 405 L292 360 L292 315 L292 265 L286 220 L260 188 L225 184 L205 215 L180 242 L182 278 L200 300 L235 285 L275 285 L325 285 L380 285 L440 285 L495 285 L530 285" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M575 551 L575 475 L575 395 L575 315 L575 235 L575 155 L575 75 L575 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M405 585 L405 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M405 585 L455 585 L510 585 L565 585 L620 585 L675 585 L715 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="715" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="381.5" y="205" text-anchor="middle" font-size="65" fill="#6b7280"><tspan x="381.5" y="205">3. lift, then draw the</tspan><tspan x="381.5" y="284.3">shirorekha</tspan><tspan x="381.5" y="363.6">left-to-right</tspan></text></svg><text x="16" y="256.31" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after JackPotte, ‘Devanagari bʰ भ.gif’, strokes 1–3, Wikimedia Commons, 29</text><text x="16" y="268.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">March 2009</text><text x="16" y="281.31" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
