[package]
name = "hamurabi"
version = "0.1.0"
edition = "2021"
description = "Deterministic simulation core for the seminal 1968 mainframe resource allocation game"
license = "MIT"

[dependencies]
rng = { path = "../rng" }

[dev-dependencies]
coding_adventures_bounded_json = { path = "../bounded-json" }
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
coding_adventures_sha256 = { path = "../sha256" }
capability-runtime-conformance = { path = "../capability-runtime-conformance" }
coding-adventures-json-parser = { path = "../json-parser" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "microbenchmarks"
path = "tests/microbenchmarks.rs"
harness = false

[[test]]
name = "runtime_capability"
path = "tests/runtime_capability.rs"
harness = false
