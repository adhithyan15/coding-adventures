<svg xmlns="http://www.w3.org/2000/svg" width="662" height="957.77" viewBox="0 0 662 957.77" role="img" aria-label="How to write சரி: 3 parts, ச, ர, ி, one after another"><title>Writing சரி</title><desc>3 parts written one after another: ச, ர, ி (tamil). The parts are in the order the hand writes them, which is not always the order they are typed: a vowel sign written to the left of its consonant comes before it. Each vowel sign is drawn on its own, without the consonant it attaches to. Each part has its own group of frames; frame N of a group shows movements 1 to N of that part, the movement being added drawn in ink over the finished part, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Each part is drawn at its own scale from its own cited stroke order, so the strip does not show how large the parts are next to each other, how far apart they sit, or any join between them. Stroke order: ச: Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ச (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;; ர: Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;; ி: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 37 (ி, i sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source notes on variation: ச: Frame 3 numbers the three joined upper-frame movements before the separate fourth movement turns around ச&apos;s lower-left bowl. Tamil handwriting varies by school; this is one attested two-run order fitted to the bundled Noto Sans Tamil outline. ர: Frame 3 identifies ர as the three-movement ஈ frame plus a slightly angular short fourth movement. Native writers draw the four movements as one continuous stroke, and this ductus follows them in order without lifting: the first movement runs down the left upright, so the pen climbs back up it to begin the top bar and returns along the bar to the central upright. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 90% of the 189 stored prototypes of ர are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline. ி: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 205 of the 206 stored prototypes of the i sign are one pen-down stroke. In 161 of those 205 the pen starts at the tip of the hook and first moves up; 200 turn clockwise, over the top to the right; 152 end at the foot of the stem. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="957.77" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 parts, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Part 1 of 3 — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="61" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 300 L160 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M160 300 L160 400 L160 510" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="160" cy="510" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">1. climb the left</tspan><tspan x="366" y="289.6">upright</tspan></text></svg><rect x="176" y="61" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="61" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 300 L160 400 L160 510 L160 510" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M160 510 L300 510 L450 510 L680 510 L500 510 L420 510 L420 510" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="510" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">2. carry the top bar to</tspan><tspan x="366" y="289.6">the right</tspan></text></svg><rect x="336" y="61" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="61" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 300 L160 400 L160 510 L300 510 L450 510 L680 510 L500 510 L420 510 L420 510" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M420 510 L420 410 L420 300 L500 300 L680 300" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="680" cy="300" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">3. drop the inner</tspan><tspan x="366" y="289.6">upright and carry right</tspan></text></svg><rect x="496" y="61" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="61" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 300 L160 400 L160 510 L300 510 L450 510 L680 510 L500 510 L420 510 L420 410 L420 300 L500 300 L680 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M420 300 L420 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M420 300 L420 220 L440 160 L420 100 L380 60 L330 40 L280 35 L200 35 L125 50 L75 100 L65 160 L80 225 L115 275 L160 300 L290 300 L420 300" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="300" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">4. turn around and close</tspan><tspan x="366" y="289.6">the lower-left bowl</tspan></text></svg><text x="16" y="268.26" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Part 2 of 3 — one unbroken stroke · 4 movements</text><rect x="16" y="275.26" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="275.26" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 520 L124 520" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-line