<svg xmlns="http://www.w3.org/2000/svg" width="662" height="307.14" viewBox="0 0 662 307.14" role="img" aria-label="How to write ਰ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਰ</title><desc>4 frames; frame N shows movements 1 to N of ਰ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਰ (raaraa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 1014, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L1014&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਰ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the bowl and right along the bar, ending at the stem. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਰ, each by a different non-native copyist; only counts and shares are cited. 100% (20 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 65% (13 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="307.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M310 0Q256 0 207 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 294 49.5 319.5Q62 345 82 363Q109 386 150.5 397Q192 408 272 408L409 408L409 551L-7 551L-7 622L586 622L586 551L490 551L490 172Q490 85 446 42.5Q402 0 310 0ZM317 73Q340 73 359 78Q378 83 390 96Q399 107 404 124.5Q409 142 409 183L409 337L282 337Q220 337 189 331.5Q158 326 141 311Q128 300 123 285Q118 270 118 252Q118 220 135 188Q152 156 180.5 130Q209 104 244.5 88.5Q280 73 317 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="561" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="289.5" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="289.5" y="198.7">1. draw the headline</tspan><tspan x="289.5" y="270.3">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M310 0Q256 0 207 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 294 49.5 319.5Q62 345 82 363Q109 386 150.5 397Q192 408 272 408L409 408L409 551L-7 551L-7 622L586 622L586 551L490 551L490 172Q490 85 446 42.5Q402 0 310 0ZM317 73Q340 73 359 78Q378 83 390 96Q399 107 404 124.5Q409 142 409 183L409 337L282 337Q220 337 189 331.5Q158 326 141 311Q128 300 123 285Q118 270 118 252Q118 220 135 188Q152 156 180.5 130Q209 104 244.5 88.5Q280 73 317 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M452 586 L452 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M452 586 L451 546 L450 506 L450 465 L450 424 L450 384 L450 343 L450 302 L450 261 L449 221 L447 181" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="447" cy="181" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="289.5" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="289.5" y="198.7">2. lift, then come down</tspan><tspan x="289.5" y="270.3">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="201.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="201.14" viewBox="-77 -692 733 982.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M310 0Q256 0 207 21.5Q158 43 119.5 79.5Q81 116 59 162.5Q37 209 37 258Q37 294 49.5 319.5Q62 345 82