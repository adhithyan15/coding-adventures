<svg xmlns="http://www.w3.org/2000/svg" width="182" height="428.34" viewBox="0 0 182 428.34" role="img" aria-label="How to write ゜: one unbroken stroke · 1 movement"><title>Writing ゜</title><desc>1 frames; frame N shows movements 1 to N of ゜ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0309c.svg, the spacing handakuten ゜ (U+309C), one stroke path kvg:0309c-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0309c.svg&gt;. Source note on variation: KanjiVG stores the mark as one closed directed path: it starts at the foot of the circle and runs clockwise, round the left side, over the top and down the right side back to the foot. It is the same path KanjiVG gives the handakuten inside ぱ (kanji/03071.svg, s4). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="182" height="428.34" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written —</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">one unbroken</text><text x="16" y="68.5" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 1 movement</text><rect x="16" y="79.5" width="150" height="209.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="79.5" width="150" height="209.84" viewBox="-44 -892 368 514.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M26 707Q26 739 41 765Q56 791 82 806.5Q108 822 140 822Q172 822 198 806.5Q224 791 239 765Q254 739 254 707Q254 676 239 650Q224 624 198 608.5Q172 593 140 593Q108 593 82 608.5Q56 624 41 650Q26 676 26 707ZM69 707Q69 680 90.5 658.5Q112 637 140 637Q168 637 189 658.5Q210 680 210 707Q210 735 189 756Q168 777 140 777Q112 777 90.5 756Q69 735 69 707Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M142 613 L142 613" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M142 613 L118 619 L95 628 L75 643 L61 663 L51 686 L49 711 L53 736 L64 758 L81 776 L102 790 L125 797 L150 798 L175 792 L196 779 L213 761 L225 740 L230 715 L229 690 L222 666 L208 646 L188 630 L166 620 L142 613" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="142" cy="613" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="140" y="-423.5" text-anchor="middle" font-size="29.5" fill="#6b7280"><tspan x="140" y="-423.5">1. draw the circle</tspan><tspan x="140" y="-387.5">clockwise from its foot</tspan></text></svg><text x="16" y="302.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG,</text><text x="16" y="314.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">kanji/0309c.svg, the spacing</text><text x="16" y="327.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">handakuten ゜ (U+309C), one</text><text x="16" y="339.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">stroke path kvg:0309c-s1</text><text x="16" y="352.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Ulrich Apel and</text><text x="16" y="364.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">contributors, CC BY-SA 3.0)</text><text x="16" y="377.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not</text><text x="16" y="389.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">standardised; the source</text><text x="16" y="402.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
