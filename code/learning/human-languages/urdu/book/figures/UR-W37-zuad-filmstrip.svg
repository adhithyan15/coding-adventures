ke-linejoin="round"/><circle class="ductus__tip" cx="725" cy="470" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="556" y="491.4" text-anchor="middle" font-size="89.4" fill="#6b7280"><tspan x="556" y="491.4">3. after another lift,</tspan><tspan x="556" y="600.5">place the dot above last</tspan></text></svg><text x="16" y="272.07" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Khe, ze, zal, swad, and zwad, independent ض calligraphic</text><text x="16" y="284.57" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and handwriting animations and Zwad instructions (Northwestern University Libraries Open</text><text x="16" y="297.07" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2026)</text><text x="16" y="309.57" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
