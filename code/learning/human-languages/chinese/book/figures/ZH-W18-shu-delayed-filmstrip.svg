<svg xmlns="http://www.w3.org/2000/svg" width="662" height="330.03" viewBox="0 0 662 330.03" role="img" aria-label="How to write 书: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 书</title><desc>4 frames; frame N shows movements 1 to N of 书 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 书.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B9%A6.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 书: two upper folding strokes, the central upright, and the final upper-right dot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order and that the project follows People&apos;s Republic of China stroke order. The ductus preserves that ordered sequence while fitting its learner pen paths to the vendored Noto Sans SC outline, whose width and proportions differ from the Arphic-derived source graphics.</desc><rect x="0" y="0" width="662" height="330.03" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="224.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="224.03" viewBox="-10 -907 1031 1539.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M869 395L946 395Q946 395 945.5 388.5Q945 382 944.5 374.5Q944 367 943 361Q936 261 927.5 197.5Q919 134 908.5 99.5Q898 65 882 50Q867 34 848.5 27.5Q830 21 804 19Q781 18 739 18.5Q697 19 651 21Q650 38 643.5 58.5Q637 79 626 94Q673 89 716 88Q759 87 777 87Q793 87 802 89Q811 91 819 97Q831 107 839.5 138.5Q848 170 855.5 230Q863 290 869 384L869 395ZM418 837L494 837L494 -79L418 -79L418 837ZM717 760L762 810Q793 790 829 765.5Q865 741 898 717Q931 693 951 674L905 617Q885 637 853 662Q821 687 785.5 713Q750 739 717 760ZM60 395L902 395L902 323L60 323L60 395ZM126 665L800 665L800 348L726 348L726 592L126 592L126 665Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M140 630 L140 630" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M140 630 L280 630 L440 630 L600 630 L760 630 L760 540 L760 450 L760 365" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="760" cy="365" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="505.5" y="301.6">1. draw the short upper</tspan><tspan x="505.5" y="402.4">horizontal, then fold</tspan><tspan x="505.5" y="503.1">down without lifting</tspan></text></svg><rect x="176" y="42" width="150" height="224.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="224.03" viewBox="-10 -907 1031 1539.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M869 395L946 395Q946 395 945.5 388.5Q945 382 944.5 374.5Q944 367 943 361Q936 261 927.5 197.5Q919 134 908.5 99.5Q898 65 882 50Q867 34 848.5 27.5Q830 21 804 19Q781 18 739 18.5Q697 19 651 21Q650 38 643.5 58.5Q637 79 626 94Q673 89 716 88Q759 87 777 87Q793 87 802 89Q811 91 819 97Q831 107 839.5 138.5Q848 170 855.5 230Q863 290 869 384L869 395ZM418 837L494 837L494 -79L418 -79L418 837ZM717 760L762 810Q793 790 829 765.5Q865 741 898 717Q931 693 951 674L905 617Q885 637 853 662Q821 687 785.5 713Q750 739 717 760ZM60 395L902 395L902 323L60 323L60 395ZM126 665L800 665L800 348L726 348L726 592L126 592L126 665Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M140 630 L280 630 L440 630 L600 630 L760 630 L760 540 L760 450 L760 365" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M70 360 L70 360" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M70 360 L250 360 L470 360 L700 360 L900 360 L905 280 L900 200 L890 125 L870 75 L835 55 L785 52 L720 55 L650 60" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="650" cy="60" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="505.5" y="301.6">2. lift, draw the second</tspan><tspan x="505.5" y="402.4">horizontal, then fold</tspan><tspan x="505.5" y="503.1">down and finish with the</tspan><tspan x="505.5" y="603.9">hook without lifting</tspan></text></svg><rect x="336" y="42" width="150" height="224.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="224.03" viewBox="-10 -907 1031 1539.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M869 395L946 395Q946 395 945.5 388.5Q945 382 944.5 374.5Q944 367 943 361Q936 261 927.5 197.5Q919 134 908.5 99.5Q898 65 882 50Q867 34 848.5 27.5Q830 21 804 19Q781 18 739 18.5Q697 19 651 21Q650 38 643.5 58.5Q637 79 626 94Q673 89 716 88Q759 87 777 87Q793 87 802 89Q811 91 819 97Q831 107 839.5 138.5Q848 170 855.5 230Q863 290 869 384L869 395ZM418 837L494 837L494 -79L418 -79L418 837ZM717 760L762 810Q793 790 829 765.5Q865 741 898 717Q931 693 951 674L905 617Q885 637 853 662Q821 687 785.5 713Q750 739 717 760ZM60 395L902 395L902 323L60 323L60 395ZM126 665L800 665L800 348L726 348L726 592L126 592L126 665Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M140 630 L280 630 L440 630 L600 630 L760 630 L760 540 L760 