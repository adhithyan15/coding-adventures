77Q418 220 368 162.5Q318 105 249 45L247 65Q276 67 304 68.5Q332 70 360 70L577 70L577 249Q577 323 562.5 372Q548 421 515 450.5Q482 480 428 494L430 501Q449 479 460.5 454.5Q472 430 472 393Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M108 48 L104 116 L104 185 L104 253 L105 322 L121 388 L153 448 L203 496 L265 523 L334 528 L400 512 L428 447 L435 378 L412 309 L379 244 L336 186 L285 133 L236 80 L179 41 L108 48 L171 36 L237 36 L303 36 L369 36 L434 36 L500 36 L566 36 L632 40 L632 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M632 40 L620 104 L620 171 L620 237 L620 304 L612 369 L601 434 L551 478 L492 508" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="492" cy="508" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="361.5" y="199.5" text-anchor="middle" font-size="59.5" fill="#6b7280"><tspan x="361.5" y="199.5">4. climb the right side</tspan><tspan x="361.5" y="272.1">to the top</tspan></text></svg><text x="16" y="242.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows</text><text x="16" y="255.03" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">for മ in data/MA.png: green start, blue turn, red end (GPL-3.0, 2013)</text><text x="16" y="267.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
