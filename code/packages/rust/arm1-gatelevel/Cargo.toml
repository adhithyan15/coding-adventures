[package]
name = "arm1-gatelevel"
version = "0.1.0"
edition = "2021"
description = "Complete ARM1 gate-level simulator with exact 536,871,777-DFF state and 599-vector full-state conformance"

[dependencies]
logic-gates = { path = "../logic-gates" }
arithmetic = { path = "../arithmetic" }
arm1-simulator = { path = "../arm1-simulator" }

[dev-dependencies]
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
