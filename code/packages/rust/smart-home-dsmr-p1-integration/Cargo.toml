[package]
name = "smart-home-dsmr-p1-integration"
version = "0.1.0"
edition = "2021"
description = "Bounded supervised DSMR P1 serial telemetry integration for the smart-home runtime"
license = "MIT"

[dependencies]
dsmr-p1-protocol = { path = "../dsmr-p1-protocol" }
serde_json = "1"
serialport = { version = "4", default-features = false }
smart-home-core = { path = "../smart-home-core" }
smart-home-event-streams = { path = "../smart-home-event-streams" }
smart-home-runtime = { path = "../smart-home-runtime" }
