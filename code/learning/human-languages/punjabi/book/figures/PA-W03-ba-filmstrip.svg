<svg xmlns="http://www.w3.org/2000/svg" width="982" height="300.43" viewBox="0 0 982 300.43" role="img" aria-label="How to write ਬ: 3 strokes · 2 pen lifts · 6 movements"><title>Writing ਬ</title><desc>6 frames; frame N shows movements 1 to N of ਬ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਬ (babbaa) checkpoints, strokes 1–4 (lib/data/lessons/lesson_tracing.dart line 885, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L885&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਬ in four pen-down strokes: the headline from left to right; then from the top left down the left side and right along the bar to the stem; then from the bar&apos;s left end, round the lower bowl to the stem; then the stem from the top down. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਬ, each by a different non-native copyist copying a printed letter; where the same dataset can be set beside native writers&apos; pen data (HP Labs India&apos;s Devanagari and Bangla sets), the copyists use more strokes than those writers, so their counts are read here only as a ceiling on native lifts, and only counts and shares are cited. Even under that ceiling, 50% (10 of 20) draw ਬ in three strokes, their most common count; 30% (6 of 20) use the source&apos;s four. Those counts say how many strokes, not where they break, so this path keeps every stroke&apos;s order, start and direction and joins the second and third strokes: the pen runs back along the bar to its left end instead of lifting, then rounds the lower bowl. For the first stroke of the body, 45% (9 of 20) of the copyists start in the same part of the letter as the source and 95% (19 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="982" height="300.43" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="194.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="194.43" viewBox="-77 -692 763 989" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M41 248Q61 278 93.5 306.5Q126 335 169 353Q117 378 88 425Q59 472 59 551L-7 551L-7 622L616 622L616 551L519 551L519 0L438 0L438 94Q409 82 376.5 75.5Q344 69 307 69Q207 69 141.5 120Q76 171 41 248ZM296 392L438 392L438 551L141 551Q141 508 150.5 476Q160 444 182 423Q200 407 224.5 399.5Q249 392 296 392ZM307 143Q342 143 375.5 150Q409 157 438 172L438 322L313 322Q257 322 214 303.5Q171 285 135 243Q164 192 205.5 167.5Q247 143 307 143Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class