<svg xmlns="http://www.w3.org/2000/svg" width="662" height="307.75" viewBox="0 0 662 307.75" role="img" aria-label="How to write る: one unbroken stroke · 4 movements"><title>Writing る</title><desc>4 frames; frame N shows movements 1 to N of る (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0308b.svg, hiragana る (U+308B HIRAGANA LETTER RU), one stroke path kvg:0308b-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0308b.svg&gt;. Source note on variation: KanjiVG stores る as one directed path in writing order: it starts at the left of the short top bar, runs right, turns sharply down and left along the diagonal, swings back up to the right around the clockwise bowl, and curls into the small loop at the bottom. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each part of the stroke runs.</desc><rect x="0" y="0" width="662" height="307.75" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="201.75" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.75" viewBox="42 -824 884 1189" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M238 737Q255 735 274.5 734Q294 733 309 733Q324 733 358.5 734Q393 735 436.5 736.5Q480 738 523.5 739.5Q567 741 601.5 743Q636 745 652 746Q674 748 686 750Q698 752 706 754L752 696Q739 687 724.5 677Q710 667 696 655Q677 641 645 614.5Q613 588 574.5 555.5Q536 523 499 492Q462 461 432 436Q467 448 502.5 452.5Q538 457 571 457Q65