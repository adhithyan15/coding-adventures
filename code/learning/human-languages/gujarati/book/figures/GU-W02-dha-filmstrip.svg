<svg xmlns="http://www.w3.org/2000/svg" width="342" height="390.88" viewBox="0 0 342 390.88" role="img" aria-label="How to write ધ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ધ</title><desc>2 frames; frame N shows movements 1 to N of ધ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ધ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ધ as two ordered pen-down runs. Its first SVG path begins at the high left entry, descends through the upper turn, narrows through the middle, then continues left and around the broad lower body before rising into the right shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the high left entry, upper turn, narrow middle, broad lower body, right shoulder, tall spine, and lower foot, but its printed body is wider and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s joined-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the entry, turns, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="390.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="259.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="259.88" viewBox="-26 -716 694 1202.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M273 107Q183 107 133 150.5Q83 194 83 261Q83 317 114 355Q85 377 64.5 408Q44 439 44 481Q44 536 84 578.5Q124 621 206 646L235 574Q187 561 163.5 543.5Q140 526 132.5 508Q125 490 125 474Q125 426 172 396Q209 411 259 411Q273 411 290 409Q307 407 320 405L308 333Q285 338 257 338Q217 338 190.5 320.5Q164 303 164 264Q164 179 273 179Q318 179 356 194.5Q394 210 431 244L431 603L511 592L511 152Q511 125 514 112.5Q517 100 523 92Q534 78 555.5 75.5Q577 73 598 73L590 0L580 0Q537 0 508 9.5Q479 19 462 37Q446 54 438.5 79Q431 104 431 148L431 154Q403 135 365.5 121Q328 107 273 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M210 620 L210 620" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M210 620 L175 600 L140 575 L110 545 L90 510 L82 475 L88 440 L105 410 L130 385 L165 365 L210 355 L260 360 L305 375 L275 370 L235 355 L195 335 L165 305 L145 270 L140 230 L150 195 L175 165 L210 145 L255 135 L300 140 L345 155 L385 180 L420 215 L450 245" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="450" cy="245" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="321" y="195.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="321" y="195.6">1. descend from the high</tspan><tspan x="321" y="263.4">entry through the turns</tspan><tspan x="321" y="331.3">and sweep around the</tspan><tspan x="321" y="399.1">broad body into the</tspan><tspan x="321" y="466.9">right shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="259.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="259.88" viewBox="-26 -716 694 1202.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M273 107Q183 107 133 150.5Q83 194 83 261Q83 317 114 355Q85 377 64.5 408Q44 439 44 481Q44 536 84 578.5Q124 621 206 646L235 574Q187 561 163.5 543.5Q140 526 132.5 508Q125 490 125 474Q125 426 172 396Q209 411 259 411Q273 411 290 409Q307 407 320 405L308 333Q285 338 257 338Q217 338 190.5 320.5Q164 303 164 264Q164 179 273 179Q318 179 356 194.5Q394 210 431 244L431 603L511 592L511 152Q511 125 514 112.5Q517 100 523 92Q534 78 555.5 75.5Q577 73 598 73L590 0L580 0Q537 0 508 9.5Q479 19 462 37Q446 54 438.5 79Q431 104 431 148L431 154Q403 135 365.5 121Q328 107 273 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M210 620 L175 600 L140 575 L110 545 L90 510 L82 475 L88 440 L105 410 L130 385 L165 365 L210 355 L260 360 L305 375 L275 370 L235 355 L195 335 L165 305 L145 270 L140 230 L150 195 L175 165 L210 145 L255 135 L300 140 L345 155 L385 180 L420 215 L450 245" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M471 585 L471 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M471 585 L471 520 L471 450 L471 380 L471 310 L471 240 L471 175 L473 125 L481 90 L500 62 L530 45 L562 38 L585 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="585" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="321" y="195.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="321" y="195.6">2. lift, descend the</tspan><tspan x="321" y="263.4">tall right spine, and</tspan><tspan x="321" y="331.3">turn through its lower</tspan><tspan x="321" y="399.1">foot</tspan></text></svg><text x="16" y="314.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="327.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ધ animation, first and second SVG</text><text x="16" y="339.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="352.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="364.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
