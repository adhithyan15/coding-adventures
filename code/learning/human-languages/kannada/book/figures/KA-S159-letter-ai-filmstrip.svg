<svg xmlns="http://www.w3.org/2000/svg" width="502" height="301.41" viewBox="0 0 502 301.41" role="img" aria-label="How to write ಐ: one unbroken stroke · 3 movements"><title>Writing ಐ</title><desc>3 frames; frame N shows movements 1 to N of ಐ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-ai.gif, animation of Kannada independent vowel ಐ, 28 frames, 2.8 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-ai.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಐ in one uninterrupted run: turn through the compact left spiral and lower bowl, sweep through the join and around the broad right loop, then carry the high arch leftward to the open upper-left terminal. The path is fitted to the bundled Noto Sans Kannada outline; handwritten spiral size, loop width, and arch height vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="502" height="301.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="195.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.41" viewBox="-36 -633 871 1134.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M574 -12Q527 -12 495.5 1.5Q464 15 442 40.5Q420 66 398 102L430 105Q404 57 374.5 32Q345 7 309.5 -2.5Q274 -12 229 -12Q173 -12 128.5 10Q84 32 59 72Q34 112 34 167Q34 211 52 246.5Q70 282 104 303Q138 324 186 324Q239 324 271 299Q303 274 303 231Q303 215 300 199Q297 183 290 172L222 178Q224 184 226 193.5Q228 203 228 210Q228 232 216 243Q204 254 183 254Q152 254 131.5 232.5Q111 211 111 170Q111 125 142 96Q173 67 237 67Q306 67 338 102Q370 137 375 195L451 19