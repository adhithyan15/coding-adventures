<svg xmlns="http://www.w3.org/2000/svg" width="662" height="308.93" viewBox="0 0 662 308.93" role="img" aria-label="How to write 水: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 水</title><desc>4 frames; frame N shows movements 1 to N of 水 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 水.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%B0%B4.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 水. Median 1 draws the vertical down the middle and hooks it to the left without lifting; median 2 draws the left side, a horizontal that turns to fall to the lower left without lifting; medians 3–4 draw the right side, a short left-falling stroke, then the right-falling stroke from the vertical. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="308.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="202.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.93" viewBox="-31 -908 1076 1455.7" preserveAspectRatio="x