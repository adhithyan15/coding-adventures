name: Release TaskApp

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release TaskApp {0}', inputs.tag) || 'Validate TaskApp release payloads' }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-task-app.yml
      - code/scripts/taskapp_release.py
      - code/scripts/taskapp-xaml-smoke.ps1
      - code/programs/mosaic/task-app/**
      - code/packages/rust/task-mosaic-app/**
      - code/packages/rust/task-wasm/**
      - code/packages/rust/mosaic-app-bindings/**
      - code/packages/rust/mosaic-package-artifact-builder/**
      - code/packages/rust/mosaic-compile/**
      - code/packages/rust/mosaic-emit-*/**
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer without the product prefix (for example, 0.1.0)"
        required: true
        type: string
      tag:
        description: "Matching product tag (for example, task-app-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.0"

concurrency:
  group: release-task-app
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout the selected release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, tag, ref, and publication availability
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-ci' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'task-app-v0.0.0-ci' }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python code/scripts/taskapp_release.py validate \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
              echo "::error::TaskApp releases must be dispatched from main, not $RELEASE_REF"
              exit 1
            fi

            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
            tag_status=$?
            set -e
            case "$tag_status" in
              0)
                echo "::error::Tag $RELEASE_TAG already exists and will not be reused."
                exit 1
                ;;
              2)
                ;;
              *)
                echo "::error::Could not verify whether tag $RELEASE_TAG exists."
                exit 1
                ;;
            esac

            set +e
            gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
              >/dev/null 2>release-view-error.txt
            release_status=$?
            set -e
            if [[ "$release_status" -eq 0 ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
            if ! grep -Fq "release not found" release-view-error.txt; then
              cat release-view-error.txt >&2
              echo "::error::Could not verify whether release $RELEASE_TAG exists."
              exit 1
            fi
          fi

          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build and verify web release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/programs/mosaic/task-app/host/web/package-lock.json

      - name: Install web dependencies
        working-directory: code/programs/mosaic/task-app/host/web
        run: npm ci

      - name: Install Linux Rust build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      - name: Test the Rust release inputs
        run: >-
          cargo test --manifest-path code/packages/rust/Cargo.toml
          -p task-mosaic-app -p task-wasm

      - name: Regenerate, test, and build the production web bundle
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/task-app/scripts/build-web.sh
          npm --prefix code/programs/mosaic/task-app/host/web test
          npm --prefix code/programs/mosaic/task-app/host/web run build
          cmp \
            code/packages/rust/task-wasm/pkg/task_engine.wasm \
            code/programs/mosaic/task-app/host/web/public/task_engine.wasm
          git diff --exit-code -- . \
            ':(exclude)code/packages/rust/task-wasm/pkg/task_engine.wasm'

      - name: Archive the verified web bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          python code/scripts/taskapp_release.py archive-web \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source code/programs/mosaic/task-app/host/web/dist \
            --output-dir release-assets

      - name: Upload the verified web payload
        uses: actions/upload-artifact@v7
        with:
          name: task-app-web-release
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Build native payload (${{ matrix.toolkit }} / ${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: qt
            toolkit: Qt
            platform: Linux
            os: ubuntu-latest
            runtime: libtask_mosaic_app.so
          - backend: flutter
            toolkit: Flutter
            platform: Linux
            os: ubuntu-latest
            runtime: libtask_mosaic_app.so
          - backend: compose
            toolkit: Compose Desktop
            platform: Linux
            os: ubuntu-latest
            runtime: libtask_mosaic_app.so
          - backend: swiftui
            toolkit: SwiftUI
            platform: macOS
            os: macos-latest
            runtime: libtask_mosaic_app.dylib
          - backend: xaml
            toolkit: WinUI/XAML
            platform: Windows
            os: windows-2025
            runtime: task_mosaic_app.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Qt
        if: matrix.backend == 'qt'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Set up Flutter
        if: matrix.backend == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Enable Flutter native assets
        if: matrix.backend == 'flutter'
        shell: bash
        run: flutter config --enable-native-assets

      - name: Set up Java
        if: matrix.backend == 'compose'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: matrix.backend == 'compose'
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Install Linux Rust build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev libgtk-3-dev xvfb

      - name: Build the Rust runtime and strict generated project
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          RUNTIME_NAME: ${{ matrix.runtime }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          cargo build --release --manifest-path code/packages/rust/Cargo.toml -p task-mosaic-app
          runtime="code/packages/rust/target/release/$RUNTIME_NAME"
          test -f "$runtime"
          output="release-work/generated"
          cargo run --manifest-path code/packages/rust/mosaic-compile/Cargo.toml -- \
            pkg code/programs/mosaic/task-app \
            --backend "$BACKEND" \
            --output "$output" \
            --emit-project \
            --profile native-complete \
            --runtime-library "$runtime"
          python code/scripts/taskapp_native_control_contract.py \
            --backend "$BACKEND" \
            --generated-dir "$output/$BACKEND"
          python code/scripts/taskapp_release.py archive-native \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --backend "$BACKEND" \
            --source "$output/$BACKEND" \
            --output-dir release-assets

      - name: Build, verify, and archive the Qt Linux bundle
        if: matrix.backend == 'qt'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          generated="$PWD/release-work/generated/qt"
          bundle="$PWD/release-work/linux-bundle"
          expected="$PWD/code/packages/rust/target/release/libtask_mosaic_app.so"
          cmake -S "$generated" -B "$generated/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$bundle"
          cmake --build "$generated/build" --config Release --parallel
          cmake --install "$generated/build" --config Release
          runtime="$(find "$bundle" -type f -name libmosaic_app.so -print -quit)"
          executable="$(dirname "$runtime")/TaskApp"
          test -x "$executable"
          cmp "$expected" "$runtime"
          python code/scripts/taskapp_release.py archive-linux-bundle \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --backend qt \
            --source "$bundle" \
            --executable "$executable" \
            --runtime "$runtime" \
            --expected-runtime "$expected" \
            --output-dir release-assets
          mkdir -p release-work/unpacked
          tar -xzf "release-assets/task-app-qt-linux-bundle-v${RELEASE_VERSION}.tar.gz" \
            -C release-work/unpacked
          launcher="$PWD/release-work/unpacked/task-app-qt-linux-bundle-v${RELEASE_VERSION}/launch-trestle"
          state_root="$PWD/release-work/qt-state"
          state_file="$state_root/TaskApp/task-app/mosaic-state.v1.json"
          probe="$PWD/release-work/qt-pre-upgrade.json"
          python code/scripts/taskapp_release.py materialize-upgrade-fixture \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --output "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY \
            XDG_DATA_HOME="$state_root" QT_QPA_PLATFORM=offscreen \
            timeout 8s "$launcher") \
            >release-work/qt-launch.log 2>&1
          status=$?
          set -e
          cat release-work/qt-launch.log
          test "$status" -eq 124
          ! grep -Fq "Mosaic Rust runtime unavailable" release-work/qt-launch.log
          python code/scripts/taskapp_release.py verify-upgrade-state \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --state "$state_file"
          cmp "$probe" "$state_root/task-app/backups/pre-v${RELEASE_VERSION}-qt.json"
          printf 'invalid TaskApp state\n' > "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY \
            XDG_DATA_HOME="$state_root" QT_QPA_PLATFORM=offscreen \
            timeout 8s "$launcher") \
            >release-work/qt-recovery.log 2>&1
          status=$?
          set -e
          cat release-work/qt-recovery.log
          test "$status" -eq 124
          cmp "$probe" "$state_file.corrupt"

      - name: Build, verify, and archive the Flutter Linux bundle
        if: matrix.backend == 'flutter'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          generated="$PWD/release-work/generated/flutter"
          expected="$PWD/code/packages/rust/target/release/libtask_mosaic_app.so"
          (
            cd "$generated"
            flutter create --platforms=linux --project-name trestle .
            flutter pub get
            flutter analyze
            flutter build linux --release
          )
          executable="$(find "$generated/build/linux" -type f -path '*/bundle/trestle' -perm -111 -print -quit)"
          bundle="$(dirname "$executable")"
          runtime="$(find "$bundle" -type f -name libmosaic_app.so -print -quit)"
          test -x "$executable"
          test -n "$runtime"
          cmp "$expected" "$runtime"
          test -s "$bundle/lib/libapp.so"
          python code/scripts/taskapp_release.py archive-linux-bundle \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --backend flutter \
            --source "$bundle" \
            --executable "$executable" \
            --runtime "$runtime" \
            --expected-runtime "$expected" \
            --output-dir release-assets
          mkdir -p release-work/unpacked
          tar -xzf "release-assets/task-app-flutter-linux-bundle-v${RELEASE_VERSION}.tar.gz" \
            -C release-work/unpacked
          launcher="$PWD/release-work/unpacked/task-app-flutter-linux-bundle-v${RELEASE_VERSION}/launch-trestle"
          state_root="$PWD/release-work/flutter-state"
          state_file="$state_root/task-app/mosaic-state.v1.json"
          probe="$PWD/release-work/flutter-pre-upgrade.json"
          python code/scripts/taskapp_release.py materialize-upgrade-fixture \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --output "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY XDG_DATA_HOME="$state_root" \
            xvfb-run -a timeout 10s "$launcher") \
            >release-work/flutter-launch.log 2>&1
          status=$?
          set -e
          cat release-work/flutter-launch.log
          test "$status" -eq 124
          ! grep -Fq "Mosaic Rust runtime unavailable" release-work/flutter-launch.log
          python code/scripts/taskapp_release.py verify-upgrade-state \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --state "$state_file"
          cmp "$probe" "$state_root/task-app/backups/pre-v${RELEASE_VERSION}-flutter.json"
          printf 'invalid TaskApp state\n' > "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY XDG_DATA_HOME="$state_root" \
            xvfb-run -a timeout 10s "$launcher") \
            >release-work/flutter-recovery.log 2>&1
          status=$?
          set -e
          cat release-work/flutter-recovery.log
          test "$status" -eq 124
          cmp "$probe" "$state_file.corrupt"

      - name: Build, verify, and archive the Compose Linux bundle
        if: matrix.backend == 'compose'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          generated="$PWD/release-work/generated/compose"
          expected="$PWD/code/packages/rust/target/release/libtask_mosaic_app.so"
          gradle --no-daemon --stacktrace \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            -p "$generated" compileKotlin createDistributable
          executable="$(find "$generated/build/compose/binaries/main/app" -type f -path '*/bin/task_app' -perm -111 -print -quit)"
          bundle="$(dirname "$(dirname "$executable")")"
          runtime="$(find "$bundle" -type f -path '*/resources/libmosaic_app.so' -print -quit)"
          test -x "$executable"
          cmp "$expected" "$runtime"
          python code/scripts/taskapp_release.py archive-linux-bundle \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --backend compose \
            --source "$bundle" \
            --executable "$executable" \
            --runtime "$runtime" \
            --expected-runtime "$expected" \
            --output-dir release-assets
          mkdir -p release-work/unpacked
          tar -xzf "release-assets/task-app-compose-linux-bundle-v${RELEASE_VERSION}.tar.gz" \
            -C release-work/unpacked
          launcher="$PWD/release-work/unpacked/task-app-compose-linux-bundle-v${RELEASE_VERSION}/launch-trestle"
          state_root="$PWD/release-work/compose-state"
          state_file="$state_root/task-app/mosaic-state.v1.json"
          probe="$PWD/release-work/compose-pre-upgrade.json"
          python code/scripts/taskapp_release.py materialize-upgrade-fixture \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --output "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY XDG_DATA_HOME="$state_root" \
            xvfb-run -a timeout 10s "$launcher") \
            >release-work/compose-launch.log 2>&1
          status=$?
          set -e
          cat release-work/compose-launch.log
          test "$status" -eq 124
          ! grep -Fq "Mosaic Rust runtime unavailable" release-work/compose-launch.log
          python code/scripts/taskapp_release.py verify-upgrade-state \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --state "$state_file"
          cmp "$probe" "$state_root/task-app/backups/pre-v${RELEASE_VERSION}-compose.json"
          printf 'invalid TaskApp state\n' > "$state_file"
          cp "$state_file" "$probe"
          set +e
          (cd / && env -u MOSAIC_APP_LIBRARY XDG_DATA_HOME="$state_root" \
            xvfb-run -a timeout 10s "$launcher") \
            >release-work/compose-recovery.log 2>&1
          status=$?
          set -e
          cat release-work/compose-recovery.log
          test "$status" -eq 124
          cmp "$probe" "$state_file.corrupt"

      - name: Build, verify, and archive the SwiftUI macOS application
        if: matrix.backend == 'swiftui'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          generated="$PWD/release-work/generated/swiftui"
          expected="$PWD/code/packages/rust/target/release/libtask_mosaic_app.dylib"
          swift build -c release --package-path "$generated"
          swift_bin="$(swift build -c release --package-path "$generated" --show-bin-path)"
          executable="$swift_bin/App"
          resource_bundle="$(find "$swift_bin" -maxdepth 1 -type d -name 'App_App.bundle' -print -quit)"
          runtime="$(find "$resource_bundle" -type f -path '*/Runtime/libmosaic_app.dylib' -print -quit)"
          test -x "$executable"
          test -n "$runtime"
          cmp "$expected" "$runtime"
          python code/scripts/taskapp_release.py archive-macos-app \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --architecture "$(uname -m)" \
            --executable "$executable" \
            --resource-bundle "$resource_bundle" \
            --runtime "$runtime" \
            --expected-runtime "$expected" \
            --output-dir release-assets

          mkdir -p release-work/macos-v1 release-work/macos-replacement
          unzip -q "release-assets/task-app-swiftui-macos-bundle-v${RELEASE_VERSION}.zip" \
            -d release-work/macos-v1
          unzip -q "release-assets/task-app-swiftui-macos-bundle-v${RELEASE_VERSION}.zip" \
            -d release-work/macos-replacement
          app_v1="$PWD/release-work/macos-v1/Trestle.app"
          app_replacement="$PWD/release-work/macos-replacement/Trestle.app"
          plist="release-work/macos-v1/Trestle.app/Contents/Info.plist"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" \
            = "org.codingadventures.trestle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" \
            = "Trestle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" \
            = "$RELEASE_VERSION"
          sips -g format "$app_v1/Contents/Resources/Trestle.icns" | grep -F "format: icns"
          cmp "$expected" "$app_v1/App_App.bundle/Runtime/libmosaic_app.dylib"

          harness="$PWD/release-work/swiftui-conformance"
          cp -R code/packages/rust/task-mosaic-app/conformance/swiftui "$harness"
          mkdir -p "$harness/Sources/CMosaicRuntime/include"
          cp "$generated/Sources/App/MosaicRuntimeHost.swift" \
            "$harness/Sources/Conformance/MosaicRuntimeHost.swift"
          cp "$generated/Sources/CMosaicRuntime/CMosaicRuntime.c" \
            "$harness/Sources/CMosaicRuntime/CMosaicRuntime.c"
          cp "$generated/Sources/CMosaicRuntime/include/CMosaicRuntime.h" \
            "$harness/Sources/CMosaicRuntime/include/CMosaicRuntime.h"
          state="$PWD/release-work/macos-upgrade-state.json"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state" \
            swift run --package-path "$harness" Conformance \
            --library "$app_v1/App_App.bundle/Runtime/libmosaic_app.dylib"

          launch_app() {
            local app="$1"
            local log="$2"
            (
              cd /
              env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state" \
                "$app/Contents/MacOS/Trestle" >"$log" 2>&1 &
              app_pid=$!
              trap 'kill "$app_pid" 2>/dev/null || true' EXIT
              sleep 5
              kill -0 "$app_pid"
              kill "$app_pid"
              wait "$app_pid" || true
              trap - EXIT
            )
            ! grep -Fq "Mosaic Rust runtime unavailable" "$log"
            ! grep -E "missing required MIL prop|Mosaic runtime failed|Fatal error|Precondition failed" "$log"
          }
          launch_app "$app_v1" "$PWD/release-work/macos-v1-launch.log"
          launch_app "$app_replacement" "$PWD/release-work/macos-replacement-launch.log"
          env -u MOSAIC_APP_LIBRARY MOSAIC_APP_STATE_PATH="$state" \
            MOSAIC_EXPECT_RESTORED=1 \
            swift run --package-path "$harness" Conformance \
            --library "$app_replacement/App_App.bundle/Runtime/libmosaic_app.dylib"

          standard_state="$HOME/Library/Application Support/task-app/mosaic-state.v1.json"
          rm -f "$standard_state" "$standard_state.corrupt" "$standard_state.tmp"
          python code/scripts/taskapp_release.py materialize-upgrade-fixture \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --output "$standard_state"
          launch_standard_app() {
            local app="$1"
            local log="$2"
            (
              cd /
              env -u MOSAIC_APP_LIBRARY -u MOSAIC_APP_STATE_PATH \
                "$app/Contents/MacOS/Trestle" >"$log" 2>&1 &
              app_pid=$!
              trap 'kill "$app_pid" 2>/dev/null || true' EXIT
              sleep 5
              kill -0 "$app_pid"
              kill "$app_pid"
              wait "$app_pid" || true
              trap - EXIT
            )
            ! grep -Fq "Mosaic Rust runtime unavailable" "$log"
            ! grep -E "missing required MIL prop|Mosaic runtime failed|Fatal error|Precondition failed" "$log"
          }
          launch_standard_app "$app_v1" "$PWD/release-work/macos-upgrade-launch.log"
          python code/scripts/taskapp_release.py verify-upgrade-state \
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json \
            --state "$standard_state"
          env -u MOSAIC_APP_LIBRARY -u MOSAIC_APP_STATE_PATH \
            MOSAIC_EXPECT_RESTORED=1 MOSAIC_EXPECT_TASK_NAME="Upgrade fixture task" \
            swift run --package-path "$harness" Conformance \
            --library "$app_replacement/App_App.bundle/Runtime/libmosaic_app.dylib"

          printf 'invalid TaskApp state\n' > "$standard_state"
          cp "$standard_state" release-work/macos-corrupt-probe
          launch_standard_app "$app_replacement" "$PWD/release-work/macos-recovery.log"
          cmp release-work/macos-corrupt-probe "$standard_state.corrupt"
          rm -f "$standard_state" "$standard_state.corrupt" "$standard_state.tmp"

      - name: Build, verify, and archive the WinUI Windows application
        if: matrix.backend == 'xaml'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $generated = Join-Path $PWD 'release-work/generated/xaml'
          $project = Join-Path $generated 'TaskApp.csproj'
          $expected = Resolve-Path 'code/packages/rust/target/release/task_mosaic_app.dll'
          $icon = Join-Path $generated 'Trestle.ico'
          python code/scripts/taskapp_release.py write-windows-icon --output $icon
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the Trestle Windows icon' }

          $mainWindow = Join-Path $generated 'MainWindow.xaml'
          $windowSource = Get-Content $mainWindow -Raw
          $releaseWindowSource = $windowSource.Replace(
            'Title="TaskApp — Mosaic → XAML demo"',
            'Title="Trestle"'
          )
          if ($releaseWindowSource -eq $windowSource) {
            throw 'Could not apply the stable Trestle release window title'
          }
          Set-Content $mainWindow $releaseWindowSource -Encoding utf8NoBOM

          $publish = Join-Path $PWD 'release-work/windows-publish'
          $coreVersion = ($env:RELEASE_VERSION -split '[-+]')[0]
          Push-Location $generated
          try {
            dotnet publish (Split-Path -Leaf $project) `
              -c Release `
              -r win-x64 `
              -p:Platform=x64 `
              -p:SelfContained=true `
              -p:AssemblyName=Trestle `
              -p:Product=Trestle `
              "-p:Version=$($env:RELEASE_VERSION)" `
              "-p:AssemblyVersion=$coreVersion" `
              "-p:FileVersion=$coreVersion" `
              "-p:ApplicationIcon=$icon" `
              -o $publish `
              --nologo
            if ($LASTEXITCODE -ne 0) { throw "WinUI publish failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          $trestleExecutable = Join-Path $publish 'Trestle.exe'
          if (!(Test-Path $trestleExecutable)) {
            throw 'WinUI publish did not produce the build-time Trestle executable identity'
          }
          foreach ($resourceName in @('Trestle.pri', 'App.xbf', 'MainWindow.xbf', 'TaskApp.xbf')) {
            if (!(Test-Path (Join-Path $publish $resourceName))) {
              throw "WinUI publish omitted required application resource $resourceName"
            }
          }
          Copy-Item $expected.Path (Join-Path $publish 'mosaic_app.dll') -Force
          $runtime = Join-Path $publish 'mosaic_app.dll'
          if ((Get-FileHash $expected.Path -Algorithm SHA256).Hash -ne
              (Get-FileHash $runtime -Algorithm SHA256).Hash) {
            throw 'Published mosaic_app.dll differs from task_mosaic_app.dll'
          }
          $versionInfo = (Get-Item $trestleExecutable).VersionInfo
          if ($versionInfo.ProductName -ne 'Trestle') {
            throw "Expected Trestle ProductName, got '$($versionInfo.ProductName)'"
          }
          if (!$versionInfo.ProductVersion.StartsWith($env:RELEASE_VERSION)) {
            throw "Expected product version $($env:RELEASE_VERSION), got '$($versionInfo.ProductVersion)'"
          }

          python code/scripts/taskapp_release.py archive-windows-app `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT `
            --source $publish `
            --executable $trestleExecutable `
            --runtime $runtime `
            --expected-runtime $expected.Path `
            --output-dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the Windows release app' }

          $payload = "release-assets/task-app-xaml-windows-bundle-v$($env:RELEASE_VERSION).zip"
          $firstInstall = Join-Path $PWD 'release-work/windows-v1'
          $replacementInstall = Join-Path $PWD 'release-work/windows-replacement'
          Expand-Archive $payload $firstInstall
          Expand-Archive $payload $replacementInstall
          $rootName = "Trestle-windows-x64-v$($env:RELEASE_VERSION)"
          $firstExecutable = Join-Path $firstInstall "$rootName/Trestle.exe"
          $replacementExecutable = Join-Path $replacementInstall "$rootName/Trestle.exe"
          $replacementRuntime = Join-Path $replacementInstall "$rootName/mosaic_app.dll"
          if ((Get-FileHash $expected.Path -Algorithm SHA256).Hash -ne
              (Get-FileHash $replacementRuntime -Algorithm SHA256).Hash) {
            throw 'Archived Windows Rust runtime differs from task_mosaic_app.dll'
          }

          Remove-Item Env:MOSAIC_APP_LIBRARY -ErrorAction SilentlyContinue
          Remove-Item Env:MOSAIC_APP_STATE_PATH -ErrorAction SilentlyContinue
          $state = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) `
            'task-app/mosaic-state.v1.json'
          Remove-Item $state, "$state.corrupt", "$state.tmp" -Force -ErrorAction SilentlyContinue
          python code/scripts/taskapp_release.py materialize-upgrade-fixture `
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json `
            --output $state
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed the Windows upgrade fixture' }
          $upgradeProcess = Start-Process -FilePath $firstExecutable -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $upgradeProcess.Refresh()
            if ($upgradeProcess.HasExited) {
              throw "Upgrade-fixture app exited with code $($upgradeProcess.ExitCode)"
            }
          }
          finally {
            if (!$upgradeProcess.HasExited) { Stop-Process -Id $upgradeProcess.Id -Force }
          }
          python code/scripts/taskapp_release.py verify-upgrade-state `
            --fixture code/programs/mosaic/task-app/fixtures/release-upgrade-v0.1.0.json `
            --state $state
          if ($LASTEXITCODE -ne 0) { throw 'Windows app did not restore the upgrade fixture' }

          Remove-Item $state, "$state.corrupt", "$state.tmp" -Force -ErrorAction SilentlyContinue
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File code/scripts/taskapp-xaml-smoke.ps1 `
            -ExePath $firstExecutable `
            -RestartExePath $replacementExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows UI lifecycle failed' }
          if (!(Test-Path $state)) { throw 'Packaged app did not persist under stable LocalApplicationData identity' }

          Set-Content $state 'invalid TaskApp state' -Encoding utf8NoBOM
          $corruptProbe = Join-Path $PWD 'release-work/windows-corrupt-probe'
          Copy-Item $state $corruptProbe
          $recoveryProcess = Start-Process -FilePath $replacementExecutable -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $recoveryProcess.Refresh()
            if ($recoveryProcess.HasExited) {
              throw "Corrupt-state recovery app exited with code $($recoveryProcess.ExitCode)"
            }
          }
          finally {
            if (!$recoveryProcess.HasExited) { Stop-Process -Id $recoveryProcess.Id -Force }
          }
          if (!(Test-Path "$state.corrupt")) { throw 'Windows app did not quarantine invalid state' }
          if ((Get-FileHash $corruptProbe).Hash -ne (Get-FileHash "$state.corrupt").Hash) {
            throw 'Windows corrupt-state quarantine changed the rejected bytes'
          }

          $harness = Join-Path $PWD 'release-work/xaml-conformance'
          New-Item -ItemType Directory -Path $harness -Force | Out-Null
          Copy-Item 'code/packages/rust/task-mosaic-app/conformance/xaml/*' $harness -Recurse
          Copy-Item (Join-Path $generated 'MosaicRuntimeHost.cs') `
            (Join-Path $harness 'MosaicRuntimeHost.cs')
          $harnessProject = Join-Path $harness 'TaskAppXamlRuntimeConformance.csproj'
          dotnet build $harnessProject -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows console conformance build failed' }
          $harnessBinary = Get-ChildItem (Join-Path $harness 'bin') `
            -Filter 'TaskAppXamlRuntimeConformance.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $harnessBinary) { throw 'Windows console conformance binary is missing' }
          Copy-Item $replacementRuntime (Join-Path $harnessBinary.DirectoryName 'mosaic_app.dll')
          $env:MOSAIC_APP_STATE_PATH = Join-Path $PWD 'release-work/windows-console-state.json'
          dotnet $harnessBinary.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows console conformance failed' }
          $env:MOSAIC_EXPECT_RESTORED = '1'
          dotnet $harnessBinary.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows replacement restore failed' }
          Remove-Item Env:MOSAIC_EXPECT_RESTORED -ErrorAction SilentlyContinue
          Remove-Item Env:MOSAIC_APP_STATE_PATH -ErrorAction SilentlyContinue

      - name: Upload the verified native payload
        uses: actions/upload-artifact@v7
        with:
          name: task-app-native-${{ matrix.backend }}-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish one immutable TaskApp release
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build-web, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata from the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download every verified payload
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Build provenance, checksums, and product-scoped release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest="release-assets/task-app-release-manifest-v${RELEASE_VERSION}.json"
          python code/scripts/taskapp_release.py write-manifest \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --assets-dir release-assets \
            --output "$manifest"

          previous_published="$(
            gh release list --repo "$REPOSITORY" --limit 100 \
              --json tagName,publishedAt \
              --jq 'map(select(.tagName | startswith("task-app-v"))) | sort_by(.publishedAt) | last | .publishedAt // ""'
          )"
          gh pr list --repo "$REPOSITORY" --state merged --label task-app --limit 100 \
            --json number,title,url,mergedAt > taskapp-history.json
          notes_args=(
            --version "$RELEASE_VERSION"
            --tag "$RELEASE_TAG"
            --commit "$RELEASE_COMMIT"
            --repository "$REPOSITORY"
            --history taskapp-history.json
            --output release-notes.md
          )
          if [[ -n "$previous_published" ]]; then
            notes_args+=(--since "$previous_published")
          fi
          python code/scripts/taskapp_release.py write-notes "${notes_args[@]}"

          (
            cd release-assets
            sha256sum -- *.zip *.tar.gz *.json | sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          cat release-notes.md
          cat release-assets/SHA256SUMS

      - name: Revalidate publication availability after artifact work
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" \
            >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "::error::Tag $RELEASE_TAG appeared while artifacts were building."
              exit 1
              ;;
            2)
              ;;
            *)
              echo "::error::Could not revalidate tag $RELEASE_TAG."
              exit 1
              ;;
          esac

          set +e
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
            >/dev/null 2>release-view-error.txt
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "::error::Release $RELEASE_TAG appeared while artifacts were building."
            exit 1
          fi
          if ! grep -Fq "release not found" release-view-error.txt; then
            cat release-view-error.txt >&2
            echo "::error::Could not revalidate release $RELEASE_TAG."
            exit 1
          fi

      - name: Publish the release and all payloads exactly once
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          release_flags=(--latest=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "TaskApp v$RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
            --json tagName,targetCommitish,url,assets
