<svg xmlns="http://www.w3.org/2000/svg" width="502" height="328.43" viewBox="0 0 502 328.43" role="img" aria-label="How to write 门: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 门</title><desc>3 frames; frame N shows movements 1 to N of 门 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 门.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E9%97%A8.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 门. Median 1 draws a dot at the top left; median 2 draws the left vertical; median 3 draws a horizontal that turns down the right side and hooks to the left at the foot without lifting. These are the last three strokes of 们, in the same order. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="328.43" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="222.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.43" viewBox="23 -911 959 1422.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M359 803L876 803L876 731L359 731L359 803ZM836 803L912 803L912 20Q912 -18 901.5 -37Q891 -56 865 -66Q838 -75 790.5 -77Q743 -79 671 -78Q669 -68 665 -55Q661 -42 655.5 -28.5Q650 -15 645 -6Q682 -7 715.5 -7.5Q749 -8 774 -7.5Q799 -7 809 -7Q825 -6 830.5 -0.5Q836 5 836 20L836 803ZM127 805L185 841Q211 814 238.5 781Q266 748 290.5 716.5Q315 685 329 661L268 617Q254 642 230.5 675Q207 708 180 742Q153 776 127 805ZM93 638L168 638L168 -80L93 -80L93 638Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M158 811 L158 811" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M158 811 L263 704 L297 652" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="297" cy="652" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="296.8" text-anchor="middle" font-size="76.8" fill="#6b7280"><tspan x="502.5" y="296.8">1. draw 门&apos;s dot</tspan></text></svg><rect x="176" y="42" width="150" height="222.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="222.43" viewBox="23 -911 959 1422.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M359 803L876 803L876 731L359 731L359 803ZM836 803L912 803L912 20Q912 -18 901.5 -37Q891 -56 865 -66Q838 -75 790.5 -77Q743 -79 671 -78Q669 -68 665 -55Q661 -42 655.5 -28.5Q650 -15 645 -6Q682 -7 715.5 -7.5Q749 -8 774 -7.5Q799 -7 809 -7Q825 -6 830.5 -0.5Q836 5 836 20L836 803ZM127 805L185 841Q211 814 238.5 781Q266 748 290.5 716.5Q315 685 329 661L268 617Q254 642 230.5 675Q207 708 180 742Q153 776 127 805ZM93 638L168 638L168 -80L93 -80L93 638Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M158 811 L263 704 L297 652" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M111 621 L111 621" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M111 621 L140 604 L125 -65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="125" cy="-65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="296.8" text-anchor="middle" font-size="76.8" fill="#6b7280"><tspan x="502.5" y="296.8">2. lift, then draw 门&apos;s</tspan><tspan x="502.5" y="390.5">left vertical</tspan></text></svg><rect x="336" y="42" width="150" height="222.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="222.43" viewBox="23 -911 959 1422.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M359 803L876 803L876 731L359 731L359 803ZM836 803L912 803L912 20Q912 -18 901.5 -37Q891 -56 865 -66Q838 -75 790.5 -77Q743 -79 671 -78Q669 -68 665 -55Q661 -42 655.5 -28.5Q650 -15 645 -6Q682 -7 715.5 -7.5Q749 -8 774 -7.5Q799 -7 809 -7Q825 -6 830.5 -0.5Q836 5 836 20L836 803ZM127 805L185 841Q211 814 238.5 781Q266 748 290.5 716.5Q315 685 329 661L268 617Q254 642 230.5 675Q207 708 180 742Q153 776 127 805ZM93 638L168 638L168 -80L93 -80L93 638Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M158 811 L263 704 L297 652" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M111 621 L140 604 L125 -65" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M391 791 L391 791" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M391 791 L563 760 L799 777 L864 758 L868 747 L874 22 L849 -38 L756 -42 L670 -29" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="670" cy="-29" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="296.8" text-anchor="middle" font-size="76.8" fill="#6b7280"><tspan x="502.5" y="296.8">3. lift, then draw 门&apos;s</tspan><tspan x="502.5" y="390.5">top, turn down the right</tspan><tspan x="502.5" y="484.2">side and hook left</tspan></text></svg><text x="16" y="277.43" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 门.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="289.93" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="302.43" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
