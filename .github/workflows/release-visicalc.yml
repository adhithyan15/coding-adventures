name: VisiCalc release artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/release-visicalc.yml'
      - 'code/programs/mosaic/visicalc/**'
      - 'code/packages/rust/visicalc-mosaic-app/**'
      - 'code/packages/rust/spreadsheet-core/**'
      - 'code/packages/rust/mosaic-emit-react/**'
      - 'code/programs/typescript/visicalc/**'
  push:
    tags: ['visicalc-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: bash code/scripts/ci/apt-install.sh libcairo2-dev
      - run: python -m unittest discover -s code/programs/mosaic/visicalc/scripts -p 'test_*.py'
      - name: Build and test the shared Mosaic app
        working-directory: code/programs/typescript/visicalc
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Package the production website and Rust runtime
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="0.0.0-preview.${GITHUB_RUN_ID}"
          if [[ "$RELEASE_REF" == refs/tags/visicalc-v* ]]; then
            version="${RELEASE_REF#refs/tags/visicalc-v}"
          fi
          python code/programs/mosaic/visicalc/scripts/package-web.py \
            --dist code/programs/typescript/visicalc/dist --output release \
            --version "$version" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: visicalc-web
          path: release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: visicalc-release-tests
          path: |
            code/programs/mosaic/visicalc/release-tests/package.json
            code/programs/mosaic/visicalc/release-tests/package-lock.json
            code/programs/mosaic/visicalc/release-tests/*.mjs
          if-no-files-found: error

  verify:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Deliberately no checkout: the app runs exclusively from the downloaded ZIP.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: visicalc-release-tests
          path: release-tests
      - name: Install pinned browser acceptance tools
        working-directory: release-tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: visicalc-web
          path: release
      - name: Verify checksums and serve the extracted website
        run: |
          cd release
          sha256sum --check SHA256SUMS
          unzip '*.zip' -d app
          cd app
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('release.json').read_text())
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
          python -m http.server 8080 --bind 127.0.0.1 >server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/ -o /tmp/index.html
          curl --fail http://127.0.0.1:8080/visicalc_mosaic_app.wasm -o /tmp/engine.wasm
          cmp index.html /tmp/index.html
          cmp visicalc_mosaic_app.wasm /tmp/engine.wasm
          node -e 'const fs = require("node:fs"); const bytes = fs.readFileSync("/tmp/engine.wasm"); if (!WebAssembly.validate(bytes)) throw Error("Invalid WASM");'
          npm --prefix ../../release-tests test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visicalc-browser-evidence
          path: release-tests/test-results
          if-no-files-found: warn

  draft:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/visicalc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visicalc-web
          path: release
      - name: Create a new draft preview without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          VisiCalc Mosaic web preview. Extract the ZIP and follow README.txt to launch locally. The compiled Rust engine is included; Python 3 and a modern browser are required.

          This web-only draft has passed production build, shared-app tests, archive and internal checksums, HTTP/WASM loading, and Chromium UI editing/save/reopen tests of the downloaded CI archive in a job without a checkout. Picker handles are simulated in CI; OS file-dialog acceptance is separate. Before publishing a web prerelease, download these GitHub Release assets, verify SHA-256 and launch the extracted app. Native bundles, full design/accessibility, touch and screen-reader acceptance remain open under #14282 and #14267. This is not a signed native app.
          EOF
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
            --title "VisiCalc ${RELEASE_TAG#visicalc-v} preview" --notes-file notes.md
