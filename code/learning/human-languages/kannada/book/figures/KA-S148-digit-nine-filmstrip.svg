<svg xmlns="http://www.w3.org/2000/svg" width="502" height="336.09" viewBox="0 0 502 336.09" role="img" aria-label="How to write ೯: one unbroken stroke · 3 movements"><title>Writing ೯</title><desc>3 frames; frame N shows movements 1 to N of ೯ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೯, trace image file-2uvxi78v.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೯ as one path that starts at the foot, curves up the lower left, circles the middle loop clockwise (over its top first), climbs the upper left side and runs right along the top bar to finish at the upper right (start lower centre, end upper right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="502" height="336.09" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="217.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.59" viewBox="16 -760 723 1048.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M474 342Q474 290 438 257.5Q402 225 328 225Q272 225 225 248.5Q178 272 143 316Q115 351 100.5 390Q86 429 86 470Q86 525 106.5 565.5Q127 606 161 632Q188 653 221 665.5Q254 678 299.5 684Q345 690 410 690L669 690L669 608L424 608Q366 608 325 604Q284 600 255 589Q226 578 203 555Q188 540 178.5 514.5Q169 489 169 454Q169 433 175 411.5Q181 390 194 370Q212 341 244.5 320.5Q277 300 328 300Q346 300 360.5 304Q375 308 383.5 317.5Q392 327 392 342Q392 361 378 372.5Q364 384 328 384Q290 384 251.5 366Q213 348 190 314Q179 298 172 276.5Q165 255 165 228Q165 171 189 140Q213 109 250.5 96.5Q288 84 330 84L348 84L348 0L338 0Q267 0 209.5 25.5Q152 51 119 101Q86 151 86 223Q86 266 102 304Q118 342 146 373Q180 414 228 436.5Q276 459 337 459Q404 459 439 428.5Q474 398 474 342Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M325 20 L325 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M325 20 L299 39 L269 52 L235 64 L203 79 L175 102 L153 130 L139 162 L132 197 L131 233 L136 269 L149 301 L168 331" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="168" cy="331" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="377.5" y="197.9" text-anchor="middle" font-size="57.9" fill="#6b7280"><tspan x="377.5" y="197.9">1. curve up from the</tspa