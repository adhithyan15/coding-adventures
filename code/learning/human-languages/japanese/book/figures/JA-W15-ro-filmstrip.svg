<svg xmlns="http://www.w3.org/2000/svg" width="502" height="337.23" viewBox="0 0 502 337.23" role="img" aria-label="How to write ろ: one unbroken stroke · 3 movements"><title>Writing ろ</title><desc>3 frames; frame N shows movements 1 to N of ろ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana ろ stroke order animation.gif, hiragana ろ, 26 frames, 2.6 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%8D_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws ろ in one uninterrupted run: a short high shoulder rightward, a corner, a long diagonal down and left, then a broad clockwise belly that closes and finishes with a short left tail. The learner path is fitted to the bundled Noto Sans JP subset; handwritten belly width and tail length vary, but the zero-lift order is the same.</desc><rect x="0" y="0" width="502" height="337.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="231.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="231.23" viewBox="38 -815 884 1362.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M232 730Q246 729 263.5 728Q281 727 302 727Q318 727 351.5 727.5Q385 728 427.5 729Q470 730 513 731.5Q556 733 591.5 734Q627 735 646 736Q659 738 675 740Q691 742 702 745L750 687Q740 682 727 673Q714 664 706 658Q678 635 643.5 606Q609 577 571 546Q533 515 496.5 485.5Q460 456 429 430Q470 446 506 451.5Q542 457 572 457Q656 457 718.5 428Q781 399 816.5 347.5Q852 296 852 228Q852 132 791 67.5Q730 3 614 -25Q498 -53 332 -40L310 41Q414 28 498.5 35Q583 42 643 67Q703 92 735.5 133Q768 174 768 229Q768 301 711 346Q654