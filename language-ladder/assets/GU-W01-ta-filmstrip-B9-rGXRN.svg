<svg xmlns="http://www.w3.org/2000/svg" width="342" height="375.74" viewBox="0 0 342 375.74" role="img" aria-label="How to write ત: 2 strokes · 1 pen lift · 2 movements"><title>Writing ત</title><desc>2 frames; frame N shows movements 1 to N of ત (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ત animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ત as two ordered pen-down runs. Its first SVG path begins at the lower terminal, sweeps left and upward around the open left body, then continues right across the upper shoulder to the right-spine junction. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the open left body, upper shoulder, tall right spine, and lower foot, but its printed body is wider and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s open-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="375.74" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="244.74" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="244.74" viewBox="-27 -673 661 1078.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M209 12Q164 48 126.5 87.5Q89 127 66 170Q43 213 43 261Q43 300 56 330Q69 360 93 381Q123 407 170.5 420Q218 433 306 433L398 433L398 603L478 592L478 152Q478 125 481 112.5Q484 100 490 92Q501 78 522.5 75.5Q544 73 564 73L557 0L546 0Q503 0 474.5 9.5Q446 19 429 37Q413 54 405.5 79Q398 104 398 148L398 360L300 360Q255 360 228 357Q201 354 185 347.5Q169 341 156 331Q125 306 125 261Q125 209 161.5 164.5Q198 120 262 68L209 12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M215 45 L215 45" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M215 45 L185 75 L150 110 L120 150 L95 195 L85 245 L88 295 L105 335 L135 370 L175 392 L225 402 L280 402 L335 402 L380 402 L420 402" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="402" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="303.5" y="193" text-anchor="middle" font-size="53" fill="#6b7280"><tspan x="303.5" y="193">1. sweep from the lower</tspan><tspan x="303.5" y="257.7">terminal around the</tspan><tspan x="303.5" y="322.3">open body and across</tspan><tspan x="303.5" y="387">the upper shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="244.74" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="244.74" viewBox="-27 -673 661 1078.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M209 12Q164 48 126.5 87.5Q89 127 66 170Q43 213 43 261Q43 300 56 330Q69 360 93 381Q123 407 170.5 420Q218 433 306 433L398 433L398 603L478 592L478 152Q478 125 481 112.5Q484 100 490 92Q501 78 522.5 75.5Q544 73 564 73L557 0L546 0Q503 0 474.5 9.5Q446 19 429 37Q413 54 405.5 79Q398 104 398 148L398 360L300 360Q255 360 228 357Q201 354 185 347.5Q169 341 156 331Q125 306 125 261Q125 209 161.5 164.5Q198 120 262 68L209 12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M215 45 L185 75 L150 110 L120 150 L95 195 L85 245 L88 295 L105 335 L135 370 L175 392 L225 402 L280 402 L335 402 L380 402 L420 402" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M440 585 L440 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M440 585 L440 520 L440 450 L440 380 L440 310 L440 240 L440 175 L442 125 L450 90 L468 62 L495 45 L530 38 L550 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="550" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="303.5" y="193" text-anchor="middle" font-size="53" fill="#6b7280"><tspan x="303.5" y="193">2. lift, descend the</tspan><tspan x="303.5" y="257.7">tall right spine, and</tspan><tspan x="303.5" y="322.3">turn through its lower</tspan><tspan x="303.5" y="387">foot</tspan></text></svg><text x="16" y="299.74" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="312.24" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ત animation, first and second SVG</text><text x="16" y="324.74" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="337.24" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="349.74" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
