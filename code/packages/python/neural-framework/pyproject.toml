[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-neural-framework"
version = "0.1.0"
description = "Portable, inspectable dense neural network training"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = ["coding-adventures-matrix>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../matrix/src"]
addopts = "--cov=neural_framework --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
