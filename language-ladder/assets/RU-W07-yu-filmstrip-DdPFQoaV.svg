<svg xmlns="http://www.w3.org/2000/svg" width="822" height="281.61" viewBox="0 0 822 281.61" role="img" aria-label="How to write ю: one unbroken stroke · 5 movements"><title>Writing ю</title><desc>5 frames; frame N shows movements 1 to N of ю (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ю demonstration, 11:44–11:58, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 11:44–11:58 lowercase ю demonstration, the pen curls through a small looped entry, descends the tall left stem to the baseline, turns through a rising diagonal connector, and continues directly into the right oval. It rises around the oval&apos;s upper-left side, sweeps across the top, descends the right side, rounds the bottom, and rises along the left side to close without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: left stem down, joined connector, then the clockwise right oval. The bundled Noto Sans Cyrillic glyph is a printed ю-like form with a straight full-height left upright, a horizontal middle bar, and a wide closed oval, rather than the source&apos;s looped entry, diagonal connector, and narrow cursive oval. This learner path preserves the source&apos;s stem-to-connector-to-oval order, clockwise oval direction, and zero-lift evidence while fitting the printed outline: descend the left stem, retrace to the middle and cross the bar, then circle the right oval clockwise and close it without lifting. Connected cursive restores the source&apos;s looped entry and diagonal join, and individual handwriting may round, narrow, widen, or slant the stem, connector, and oval differently.</desc><rect x="0" y="0" width="822" height="281.61" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="188.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="188.11" viewBox="15 -616 806 1010.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M513 -10Q409 -10 346.5 54Q284 118 276 239L173 239L173 0L85 0L85 536L173 536L173 313L277 313Q288 426 350 486Q412 546 515 546Q585 546 638 513.5Q691 481 721 419.5Q751 358 751 269Q751 136 687 63Q623 -10 513 -10ZM514 63Q591 63 625 115.5Q659 168 659 269Q659 370 624.5 421.5Q590 473 514 473Q436 473 401 421.5Q366 370 366 269Q366 168 401 115.5Q436 63 514 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 536 L129 360 L129 180 L129 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="418" y="214.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="418" y="214.6">1. descend the left</tspan><tspan x="418" y="293.4">stem to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="188.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="188.11" viewBox="15 -616 806 1010.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M513 -10Q409 -10 346.5 54Q284 118 276 239L173 239L173 0L85 0L85 536L173 536L173 313L277 313Q288 426 350 486Q412 546 515 546Q585 546 638 513.5Q691 481 721 419.5Q751 358 751 269Q751 136 687 63Q623 -10 513 -10ZM514 63Q591 63 625 115.5Q659 168 659 269Q659 370 624.5 421.5Q590 473 514 473Q436 473 401 421.5Q366 370 366 269Q366 168 401 115.5Q436 63 514 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 0 L129 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 0 L129 140 L129 276 L210 276 L322 276" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="322" cy="276" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="418" y="214.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="418" y="214.6">2. retrace upward and</tspan><tspan x="418" y="293.4">sweep right along the</tspan><tspan x="418" y="372.2">middle bar</tspan></text></svg><rect x="336" y="42" width="150" height="188.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="188.11" viewBox="15 -616 806 1010.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M513 -10Q409 -10 346.5 54Q284 118 276 239L173 239L173 0L85 0L85 536L173 536L173 313L277 313Q288 426 350 486Q412 546 515 546Q585 546 638 513.5Q691 481 721 419.5Q751 358 751 269Q751 136 687 63Q623 -10 513 -10ZM514 63Q591 63 625 115.5Q659 168 659 269Q659 370 624.5 421.5Q590 473 514 473Q436 473 401 421.5Q366 370 366 269Q366 168 401 115.5Q436 63 514 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 0 L129 140 L129 276 L210 276 L322 276 L322 276" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M322 276 L330 390 L395 475 L514 510 L625 475 L695 390" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="695" cy="390" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="418" y="214.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="418" y="214.6">3. curve upward around</tspan><tspan x="418" y="293.4">the oval and across its</tspan><tspan x="418" y="372.2">top</tspan></text></svg><rect x="496" y="42" width="150" height="188.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="188.11" viewBox="15 -616 806 1010.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M513 -10Q409 -10 346.5 54Q284 118 276 239L173 239L173 0L85 0L85 536L173 536L173 313L277 313Q288 426 350 486Q412 546 515 546Q585 546 638 513.5Q691 481 721 419.5Q751 358 751 269Q751 136 687 63Q623 -10 513 -10ZM514 63Q591 63 625 115.5Q659 168 659 269Q659 370 624.5 421.5Q590 473 514 473Q436 473 401 421.5Q366 370 366 269Q366 168 401 115.5Q436 63 514 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 0 L129 140 L129 276 L210 276 L322 276 L330 390 L395 475 L514 510 L625 475 L695 390 L695 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M695 390 L715 320 L715 245 L695 165 L650 90" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="650" cy="90" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="418" y="214.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="418" y="214.6">4. continue down around</tspan><tspan x="418" y="293.4">the oval&apos;s right side</tspan></text></svg><rect x="656" y="42" width="150" height="188.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="188.11" viewBox="15 -616 806 1010.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M513 -10Q409 -10 346.5 54Q284 118 276 239L173 239L173 0L85 0L85 536L173 536L173 313L277 313Q288 426 350 486Q412 546 515 546Q585 546 638 513.5Q691 481 721 419.5Q751 358 751 269Q751 136 687 63Q623 -10 513 -10ZM514 63Q591 63 625 115.5Q659 168 659 269Q659 370 624.5 421.5Q590 473 514 473Q436 473 401 421.5Q366 370 366 269Q366 168 401 115.5Q436 63 514 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 536 L129 360 L129 180 L129 0 L129 140 L129 276 L210 276 L322 276 L330 390 L395 475 L514 510 L625 475 L695 390 L715 320 L715 245 L695 165 L650 90 L650 90" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M650 90 L585 30 L514 27 L405 55 L340 145 L322 276" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="322" cy="276" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="418" y="214.6" text-anchor="middle" font-size="64.6" fill="#6b7280"><tspan x="418" y="214.6">5. sweep left through</tspan><tspan x="418" y="293.4">the bottom and rise to</tspan><tspan x="418" y="372.2">close</tspan></text></svg><text x="16" y="243.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ю demonstration, 11:44–11:58, YouTube, 5 February 2013</text><text x="16" y="255.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
