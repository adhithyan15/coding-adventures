80 L388 187 L423 196 L459 205" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M147 422 L185 420 L223 418 L263 418 L302 418 L341 418 L380 418 L420 418 L459 418" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M583 586 L583 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M583 586 L543 586 L502 586 L462 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="462" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="299" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="299" y="200.3">4. lift, then run left</tspan><tspan x="299" y="273.9">along the top</tspan></text></svg><rect x="656" y="42" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="196.88" viewBox="-77 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M428 0L428 165Q394 149 360 140.5Q326 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 456 188 454L428 454L428 622L605 622L605 551L509 551L509 0L428 0ZM284 206Q325 206 359 217.5Q393 229 428 250L428 385L174 385Q160 352 132 327Q161 267 196.5 236.5Q232 206 284 206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L53 585 L88 579 L115 561 L131 533 L139 498 L144 461 L147 424 L131 392 L116 359 L107 326 L110 293 L126 262 L149 233 L177 208 L208 189 L242 178 L279 173 L316 174 L352 180 L388 187 L423 196 L459 205" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M147 422 L185 420 L223 418 L263 418 L302 418 L341 418 L380 418 L420 418 L459 418" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M583 586 L543 586 L502 586 L462 586 L462 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M462 586 L466 548 L468 509 L468 470 L468 430 L468 390 L468 351 L468 311 L468 271 L468 232 L468 194 L468 155 L468 115 L469 76 L471 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="471" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="299" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="299" y="200.3">5. turn down the stem</tspan></text></svg><text x="16" y="251.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਖ (khakhaa) checkpoints, strokes 1–3</text><text x="16" y="264.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 218, commit de1e560; Apache-2.0)</text><text x="16" y="276.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
