[package]
name = "coding-adventures-cobol-runtime"
version = "0.26.0"
edition = "2021"
description = "Runtime (tree-walking interpreter) for COBOL-60 — a faithful PICTURE-typed data model and statement execution, built on the cobol-parser CST. v0.26.0 adds INSPECT source TALLYING counter FOR ALL delim (count the occurrences of a single-character delimiter — a 1-char literal or PIC X(1) item — in an alphanumeric source and ADD them to an unsigned-integer counter; LEADING/CHARACTERS tallies, BEFORE/AFTER phrases, several counters or FOR phrases, and any REPLACING remain later rungs)."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-cobol-parser = { path = "../cobol-parser" }
