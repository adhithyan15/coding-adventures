2 202 82Q212 72 225.5 66.5Q239 61 258 61Q287 61 312.5 76Q338 91 360 125L358 39Q339 20 310 4.5Q281 -11 240 -11Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 548 L130 280 L130 145 L145 90 L185 55 L240 40 L295 55 L335 90 L354 130 L354 330 L354 548 L354 300 L354 40 L500 30 L675 30 L832 40 L832 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M832 40 L832 285 L832 548" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="832" cy="548" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="481.5" y="225.3" text-anchor="middle" font-size="74.3" fill="#6b7280"><tspan x="481.5" y="225.3">6. up the right upright</tspan></text></svg><text x="16" y="211.31" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 1, ய (University of Texas at Austin), p. 190</text><text x="16" y="223.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
