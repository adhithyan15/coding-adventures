<svg xmlns="http://www.w3.org/2000/svg" width="662" height="311.35" viewBox="0 0 662 311.35" role="img" aria-label="How to write 今: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 今</title><desc>4 frames; frame N shows movements 1 to N of 今 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 今.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BB%8A.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 今. Medians 1–2 draw the roof as 人 is written alone: the left-falling stroke, then the right-falling stroke from a little under the top; median 3 draws the dot under it; median 4 draws a horizontal that turns to fall to the lower left without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s last stroke runs further right before it turns than the source&apos;s.</desc><rect x="0" y="0" width="662" height="311.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="205.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="205.35" viewBox="-35 -917 1070 146