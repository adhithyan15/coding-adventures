[package]
name = "photo-picker-app"
version = "0.1.0"
description = "Reference Mosaic app for UI59's files.open effect -- pick a photo, see its name/type/size"
license = "MIT"

[components]
exports = ["PhotoPickerApp"]

# XAML and Qt this slice (UI59 §2) -- Compose and Flutter follow as separate
# PRs, in the same order `[host_effects]` itself landed in. No
# `[host_assets]` section: unlike Engram, this app has no legacy
# hand-written host to retire -- it starts on `[host_effects]` directly.
[host_effects]
files = [
  { backend = "xaml", source = "host/xaml/PhotoPickerEffects.cs", target = "PhotoPickerEffects.cs" },
  # Qt names its sources and needs `target_sources` (unlike SwiftUI/Compose,
  # which compile whole directories) -- both the header and the source are
  # listed, matching engram-app's own Qt `[host_effects]` entry.
  { backend = "qt", source = "host/qt/PhotoPickerEffects.h", target = "PhotoPickerEffects.h" },
  { backend = "qt", source = "host/qt/PhotoPickerEffects.cpp", target = "PhotoPickerEffects.cpp" },
]
handlers = [
  # No `include`: the XAML emitter refuses one outright (every type in the
  # assembly is already visible; `install` must be fully namespace-
  # qualified instead) -- confirmed against `xaml_main_with_host_effects`'s
  # own refusal message, not assumed from the `[host_assets]` precedent.
  #
  # Namespace is `PhotoPickerHost`, not `PhotoPickerApp` -- the generated
  # component class is `Mosaic.Generated.PhotoPickerApp` (from this
  # package's own `component PhotoPickerApp`), and the generated
  # `Install();` call site lives inside `namespace Mosaic.Generated`, where
  # an unqualified `PhotoPickerApp` would resolve to that class instead of
  # a same-named handler namespace. Confirmed by a real `dotnet build`
  # failure (CS0117) before this was caught.
  { backend = "xaml", install = "PhotoPickerHost.PhotoPickerEffects.Install" },
  # `include` names the header (plain C++, not a static class method like
  # XAML), matching engram-app's `{ backend = "qt", include = ...,
  # install = "installEngramEffects" }` shape exactly.
  { backend = "qt", include = "PhotoPickerEffects.h", install = "installPhotoPickerEffects" },
]

[kernel]
version = "1"
