<svg xmlns="http://www.w3.org/2000/svg" width="822" height="305.57" viewBox="0 0 822 305.57" role="img" aria-label="How to write そ: one unbroken stroke · 5 movements"><title>Writing そ</title><desc>5 frames; frame N shows movements 1 to N of そ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0305d.svg, hiragana そ (U+305D HIRAGANA LETTER SO), one stroke path kvg:0305d-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0305d.svg&gt;. Source note on variation: KanjiVG stores そ as one directed path in writing order: it starts at the left of the short top bar, runs right, turns sharply down and left to the start of the long bar, runs right along it, turns back and drops into the open curve, which rounds the lower left and ends on the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each part of the stroke runs; where the print glyph has no separate ink for the turn back from the bar into the curve, the path doubles back along the bar.</desc><rect x="0" y="0" width="822" height="305.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="199.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.57" viewBox="32 -838 915 1217.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M262 747Q280 745 299 744Q318 743 341 743Q355 743 384.5 744Q414 745 451.5 746.5Q489 748 528 750Q567 752 599.5 754.5Q632 757 649 759Q667 761 680.5 763.5Q694 766 703 76