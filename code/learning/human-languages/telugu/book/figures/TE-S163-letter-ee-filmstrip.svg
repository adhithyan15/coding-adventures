size="10" fill="#64748b">Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఏ packaged tracing guide</text><text x="16" y="328.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">res/drawable/dot_stroke_v_10_ae.png, movements 1–4 (version 2.6)</text><text x="16" y="340.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
