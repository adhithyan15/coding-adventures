<svg xmlns="http://www.w3.org/2000/svg" width="822" height="371.47" viewBox="0 0 822 371.47" role="img" aria-label="How to write ф: 2 strokes · 1 pen lift · 5 movements"><title>Writing ф</title><desc>5 frames; frame N shows movements 1 to N of ф (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ф demonstration, 08:16–08:26, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 08:16–08:26 lowercase ф demonstration, the pen first descends the long central stem from the upper line below the baseline, lifts once, restarts near the upper central junction, circles a narrow left loop, crosses the stem, circles a narrow right loop, and finishes through a small rising exit. The demonstrated school hand therefore uses two pen-down runs with one intervening lift: stem first, then the linked left-to-right looped body. The bundled Noto Sans Cyrillic glyph is a printed phi-like form with one straight central ascender-descender and two wider upright bowls without an exit join. This learner path preserves the source&apos;s stem-before-left-loop-before-right-loop order and one-lift evidence while fitting the printed outline: descend the central stem, lift, trace the left bowl, cross through the central junction, and trace the right bowl. Connected cursive restores the source&apos;s narrower linked loops and rising exit, and individual handwriting may round, narrow, widen, or slant the bowls and stem differently.</desc><rect x="0" y="0" width="822" height="371.47" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="277.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="277.97" viewBox="-22 -830 781 1447.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M325 -240L325 -14Q239 -10 177 25Q115 60 81.5 121Q48 182 48 265Q48 388 122 463Q196 538 325 545L325 760L411 760L411 545Q540 538 614.5 463.5Q689 389 689 265Q689 182 655.5 121Q622 60 559.5 24.5Q497 -11 411 -15L411 -240L325 -240ZM141 265Q141 171 189 118Q237 65 327 58L327 473Q236 466 188.5 412.5Q141 359 141 265ZM596 265Q596 359 548.5 412.5Q501 466 410 473L410 58Q501 65 548.5 118Q596 171 596 265Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M368 720 L368 720" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M368 720 L368 500 L368 265 L368 0 L368 -200" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="368" cy="-200" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368.5" y="442.6" text-anchor="middle" font-size="62.6" fill="#6b7280"><tspan x="368.5" y="442.6">1. descend the long</tspan><tspan x="368.5" y="519">central stem below the</tspan><tspan x="368.5" y="595.3">baseline</tspan></text></svg><rect x="176" y="42" width="150" height="277.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="277.97" viewBox="-22 -830 781 1447.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M325 -240L325 -14Q239 -10 177 25Q115 60 81.5 121Q48 182 48 265Q48 388 122 463Q196 538 325 545L325 760L411 760L411 545Q540 538 614.5 463.5Q689 389 689 265Q689 182 655.5 121Q622 60 559.5 24.5Q497 -11 411 -15L411 -240L325 -240ZM141 265Q141 171 189 118Q237 65 327 58L327 473Q236 466 188.5 412.5Q141 359 141 265ZM596 265Q596 359 548.5 412.5Q501 466 410 473L410 58Q501 65 548.5 118Q596 171 596 265Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M368 720 L368 500 L368 265 L368 0 L368 -200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M368 265 L368 265" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M368 265 L368 470 L325 500 L240 505 L160 440 L95 350 L95 265" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="265" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368.5" y="442.6" text-anchor="middle" font-size="62.6" fill="#6b7280"><tspan x="368.5" y="442.6">2. lift and curve over</tspan><tspan x="368.5" y="519">and around the left</tspan><tspan x="368.5" y="595.3">bowl</tspan></text></svg><rect x="336" y="42" width="150" height="277.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="277.97" viewBox="-22 -830 781 1447.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M325 -240L325 -14Q239 -10 177 25Q115 60 81.5 121Q48 182 48 265Q48 388 122 463Q196 538 325 545L325 760L411 760L411 545Q540 538 614.5 463.5Q689 389 689 265Q689 182 655.5 121Q622 60 559.5 24.5Q497 -11 411 -15L411 -240L325 -240ZM141 265Q141 171 189 118Q237 65 327 58L327 473Q236 466 188.5 412.5Q141 359 141 265ZM596 265Q596 359 548.5 412.5Q501 466 410 473L410 58Q501 65 548.5 118Q596 171 596 265Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M368 720 L368 500 L368 265 L368 0 L368 -200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M368 265 L368 470 L325 500 L240 505 L160 440 L95 350 L95 265 L95 265" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M95 265 L95 180 L160 95 L240 35 L325 25 L368 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="368" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368.5" y="442.6" text-anchor="middle" font-size="62.6" fill="#6b7280"><tspan x="368.5" y="442.6">3. sweep through the</tspan><tspan x="368.5" y="519">lower-left curve to the</tspan><tspan x="368.5" y="595.3">centre</tspan></text></svg><rect x="496" y="42" width="150" height="277.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="277.97" viewBox="-22 -830 781 1447.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M325 -240L325 -14Q239 -10 177 25Q115 60 81.5 121Q48 182 48 265Q48 388 122 463Q196 538 325 545L325 760L411 760L411 545Q540 538 614.5 463.5Q689 389 689 265Q689 182 655.5 121Q622 60 559.5 24.5Q497 -11 411 -15L411 -240L325 -240ZM141 265Q141 171 189 118Q237 65 327 58L327 473Q236 466 188.5 412.5Q141 359 141 265ZM596 265Q596 359 548.5 412.5Q501 466 410 473L410 58Q501 65 548.5 118Q596 171 596 265Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M368 720 L368 500 L368 265 L368 0 L368 -200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M368 265 L368 470 L325 500 L240 505 L160 440 L95 350 L95 265 L95 180 L160 95 L240 35 L325 25 L368 25 L368 25" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M368 25 L411 25 L500 35 L580 100 L640 180 L640 265" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="640" cy="265" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368.5" y="442.6" text-anchor="middle" font-size="62.6" fill="#6b7280"><tspan x="368.5" y="442.6">4. continue through the</tspan><tspan x="368.5" y="519">lower-right curve</tspan></text></svg><rect x="656" y="42" width="150" height="277.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="277.97" viewBox="-22 -830 781 1447.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M325 -240L325 -14Q239 -10 177 25Q115 60 81.5 121Q48 182 48 265Q48 388 122 463Q196 538 325 545L325 760L411 760L411 545Q540 538 614.5 463.5Q689 389 689 265Q689 182 655.5 121Q622 60 559.5 24.5Q497 -11 411 -15L411 -240L325 -240ZM141 265Q141 171 189 118Q237 65 327 58L327 473Q236 466 188.5 412.5Q141 359 141 265ZM596 265Q596 359 548.5 412.5Q501 466 410 473L410 58Q501 65 548.5 118Q596 171 596 265Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M368 720 L368 500 L368 265 L368 0 L368 -200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M368 265 L368 470 L325 500 L240 505 L160 440 L95 350 L95 265 L95 180 L160 95 L240 35 L325 25 L368 25 L411 25 L500 35 L580 100 L640 180 L640 265 L640 265" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M640 265 L640 350 L580 430 L500 500 L411 500 L368 470" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="368" cy="470" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368.5" y="442.6" text-anchor="middle" font-size="62.6" fill="#6b7280"><tspan x="368.5" y="442.6">5. rise over the right</tspan><tspan x="368.5" y="519">bowl to the upper</tspan><tspan x="368.5" y="595.3">junction</tspan></text></svg><text x="16" y="332.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning 