[package]
name = "mccarthy-lisp-iir-compiler"
version = "0.1.0"
edition = "2021"
description = "Lowers a McCarthy 1960 Lisp (Lisp 1.0) AST into an IIRModule. L2a v0.1.0 handles integer/nil literals, QUOTE (symbols + nested lists), and the primitives CONS/CAR/CDR/ATOM/EQ, emitting the same IIR opcode + builtin conventions Twig uses so the module runs end-to-end on twig-vm and feeds every IIR backend. COND, LAMBDA, and LABEL land in L2b/L2c."

[lib]
name = "mccarthy_lisp_iir_compiler"
path = "src/lib.rs"

[dependencies]
mccarthy-lisp-parser = { path = "../mccarthy-lisp-parser" }
interpreter-ir       = { path = "../interpreter-ir" }

[dev-dependencies]
# twig-vm is the cons-capable reference interpreter for the emitted IIR
# (vm-core is scalar-only and cannot represent symbols / cons cells).
# Used only to run the end-to-end tests — no twig-vm source is modified.
twig-vm       = { path = "../twig-vm" }
lispy-runtime = { path = "../lispy-runtime" }
