name: Release Engram

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release Engram {0}', inputs.tag) || 'Validate Engram release payloads' }}

# Engram v0.3.0 ships the WEB build of the Mosaic app plus the Rust core.
#
# This workflow used to build the hand-written TypeScript Electron SPA at
# code/programs/typescript/engram-app and attach installers on any `engram-v*`
# tag push. That app has not changed since March apart from dependency bumps,
# while everything since went into the Rust core and the Mosaic app — so tagging
# would have published five-month-old software regardless of intent. Leaving the
# trigger alone was itself a decision, so it is changed here.
#
# Native installers follow in a later tag, once the native lanes verify them.
#
# The trigger is `workflow_dispatch` rather than a tag push, matching
# release-task-app.yml: a tag push publishes whatever it points at, while an
# explicit dispatch names the version and tag up front so they can be validated
# against each other before anything is built. Pull requests run the same jobs
# minus publication, so the lane itself is tested by the PRs that change it.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-engram.yml
      - code/scripts/engram_release.py
      - code/scripts/tests/test_engram_release.py
      - code/scripts/verify_relocatable_bundle.py
      - code/scripts/tests/test_verify_relocatable_bundle.py
      - code/programs/mosaic/engram-app/**
      - code/packages/rust/engram-core/**
      - code/packages/rust/engram-core-wasm/**
      - code/packages/rust/engram-wasm/**
      - code/packages/rust/engram-anki-package/**
      - code/packages/mosaic/mosaic-pkg-**
      # The React emitter generates the project this lane builds — index.html,
      # vite.config.ts, package.json, tsconfig.json, src/main.tsx. Engram is the
      # only app that builds through `--emit-project`, so this lane is the only
      # place any of that is compiled and served rather than asserted as text.
      # A wrong `base` here shipped in v0.3.0 while 215 emitter unit tests
      # passed; without this path the same change would still not build
      # anything. See #13925.
      - code/packages/rust/mosaic-emit-react/**
      # XAML is the one backend nobody can build on a non-Windows machine, so
      # this lane is the ONLY place its emitted csproj and markup are ever
      # compiled -- and engram-capi is the crate whose Windows exports nothing
      # else verifies. Without these paths a change to either merges green and
      # first surfaces when a release is dispatched.
      - code/packages/rust/mosaic-emit-xaml/**
      - code/packages/rust/engram-capi/**
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer without the product prefix (for example, 0.3.0)"
        required: true
        type: string
      tag:
        description: "Matching product tag (for example, engram-v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-engram
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout the selected release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test the release helper itself
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s code/scripts/tests -p 'test_engram_release.py'
          python -m unittest discover -s code/scripts/tests \
            -p 'test_verify_relocatable_bundle.py'

      - name: Validate version and tag
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-ci' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'engram-v0.0.0-ci' }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python code/scripts/engram_release.py validate \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$commit"
          {
            echo "version=$RELEASE_VERSION"
            echo "tag=$RELEASE_TAG"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build-web:
    name: Build and verify the web release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `mosaic-compile` links `cairo-sys-rs` through the paint backend, and the
      # runner has no system cairo. Without this the emit step fails with
      # "Package cairo was not found in the pkg-config search path" — nothing to
      # do with Engram, but it stops the bundle being built at all.
      - name: Install Linux Rust build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      - name: Test the Rust release inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path code/packages/rust/Cargo.toml \
            -p engram-core-wasm -p engram-wasm -p engram-anki-package

      # The package layer must build for wasm with full Anki support — legacy
      # *and* modern. There is no longer a reduced-capability wasm
      # configuration to select, so this builds the same crate the native hosts
      # build. If a C-linking dependency ever creeps back into the graph, this
      # is where it fails, because `wasm32-unknown-unknown` has no C toolchain.
      - name: Verify the browser engine builds with Anki support
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path code/packages/rust/Cargo.toml \
            -p engram-anki-package --target wasm32-unknown-unknown

      - name: Build the production web bundle
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-web.sh \
            --output "$RUNNER_TEMP/engram-web" --build

      # The engine is what makes this release worth cutting, and a bundle
      # missing it builds, loads, and runs — it simply cannot import a deck.
      # A committed artifact went two months stale exactly this way, so the
      # freshly built engine is compared against what landed in dist/.
      - name: Verify the shipped engine is the one just built
        shell: bash
        run: |
          set -euo pipefail
          cmp code/packages/rust/engram-wasm/pkg/engram_engine.wasm \
              "$RUNNER_TEMP/engram-web/react/dist/engram_engine.wasm"
          node code/packages/rust/engram-wasm/js/smoke.mjs

      # v0.3.0 passed every check in this lane and still shipped a bundle that
      # only worked at the root of a domain: Vite emitted `/assets/index-HASH.js`
      # and the wasm host used `/engram_engine.wasm`. Unzipped into any
      # subdirectory, index.html returned 200 while both 404'd, so the page
      # rendered blank — which reads as a working deploy with no content.
      #
      # Every other check here asks whether a file is *present*. This one serves
      # the bundle from a nested path and asks whether the references between
      # those files actually *resolve*. The engine is passed explicitly because
      # script fetches it, so it never appears in index.html.
      - name: Verify the bundle works when served from a subdirectory
        shell: bash
        run: |
          set -euo pipefail
          python code/scripts/verify_relocatable_bundle.py \
            "$RUNNER_TEMP/engram-web/react/dist" \
            --also engram_engine.wasm

      - name: Archive the verified web bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          python code/scripts/engram_release.py archive-web \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source "$RUNNER_TEMP/engram-web/react/dist" \
            --output-dir release-assets

      - name: Upload the verified web payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-web-release
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Build the desktop app (${{ matrix.platform }})
    needs: validate
    strategy:
      # One platform failing should not hide whether the others work. The
      # publish job asserts the FULL payload set anyway, so a partial matrix
      # cannot produce a release that quietly ships less than it claims.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `mosaic-compile` links `cairo-sys-rs` through the paint backend.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      # The emit and packaging steps are a bash script, which the Windows runner
      # runs through Git Bash. `shell: bash` selects it explicitly rather than
      # relying on the default, which is PowerShell there.
      - name: Build and package the desktop app
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-electron.sh \
            --output "$RUNNER_TEMP/engram-desktop" --package

      # electron-builder names its output after the app and version; the
      # release names it after the platform. Renaming here rather than
      # configuring electron-builder to match keeps one source of truth for
      # published names -- `engram_release.py` -- which is what the publish
      # job's payload-set assertion compares against.
      - name: Name the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          target="$(python code/scripts/engram_release.py desktop-name \
            --version "$RELEASE_VERSION" --platform "$PLATFORM")"
          extension="${target##*.}"
          release_dir="$RUNNER_TEMP/engram-desktop/electron/release"
          built="$(find "$release_dir" -maxdepth 1 -name "*.$extension" -print -quit)"
          if [ -z "$built" ]; then
            echo "no .$extension in $release_dir" >&2
            ls -la "$release_dir" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$built" "release-assets/$target"
          ls -la release-assets

      - name: Upload the desktop payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-compose:
    name: Build the Compose Desktop app (${{ matrix.platform }})
    needs: validate
    strategy:
      # Same reasoning as the desktop matrix: one platform failing should not
      # hide whether the others work, and the publish job asserts the full
      # payload set anyway.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `mosaic-compile` links `cairo-sys-rs` through the paint backend.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev

      # The script builds the engine, emits the project, runs Gradle, and --
      # the part that matters -- asserts the engine landed beside the host jar
      # and still exports its symbols. Compose resolves `engram-capi` at
      # RUNTIME, so a distribution built without that step compiles perfectly
      # and launches into an app where every deck operation silently does
      # nothing. Compiling is exactly the step that still succeeds.
      - name: Build the Compose Desktop distribution
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-native.sh \
            --backend compose --output "$RUNNER_TEMP/engram-compose" --build

      # `createDistributable` produces an application DIRECTORY -- a `.app`
      # bundle on macOS, a plain tree elsewhere -- so the payload is a zip of
      # it rather than a single installer file.
      #
      # Archived through `engram_release.py` rather than the `zip` command:
      # Git Bash on the Windows runner has no `zip`, so the Compose app built
      # there perfectly and then failed to package. Python is already set up in
      # this job on every platform, and `ZipFile.write` carries the executable
      # bits through, which an app that has to launch needs.
      - name: Archive the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/engram-compose/compose/build/compose/binaries/main/app"
          if [ ! -d "$dist" ]; then
            echo "no Compose distribution at $dist" >&2
            exit 1
          fi
          mkdir -p release-assets
          python code/scripts/engram_release.py archive-compose \
            --version "$RELEASE_VERSION" --platform "$PLATFORM" \
            --source "$dist" --output-dir release-assets \
            --commit "$RELEASE_COMMIT"
          ls -la release-assets

      - name: Upload the Compose payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-compose-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # macOS only, and deliberately so: this is a SwiftUI app, so there is nowhere
  # else for it to run.
  build-swiftui:
    name: Build the SwiftUI app (macos)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # SwiftUI is the one backend that LINKS `engram-capi` statically rather
      # than loading it at runtime, so there is no library beside the binary to
      # check -- the engine is either inside the executable or every deck
      # operation silently does nothing. The script asserts DEFINED `_eg_`
      # symbols; an earlier form also accepted UNDEFINED ones, which is exactly
      # the binary that does NOT contain the engine.
      - name: Build the SwiftUI app bundle
        shell: bash
        env:
          ENGRAM_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-native.sh \
            --backend swiftui --output "$RUNNER_TEMP/engram-swiftui" --build

      # Only the `.app` is published. Archiving the SwiftPM project directory
      # instead sweeps in `.build/` -- module caches, object files, the dSYM,
      # the static archive -- which turned a 3.8 MB app into a 47 MB download.
      # The app ran perfectly either way, so only reading the member list
      # caught it.
      - name: Archive the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/engram-swiftui/swiftui/Engram.app"
          if [ ! -d "$bundle" ]; then
            echo "no SwiftUI bundle at $bundle" >&2
            exit 1
          fi
          mkdir -p release-assets
          python code/scripts/engram_release.py archive-swiftui \
            --version "$RELEASE_VERSION" --platform macos \
            --source "$bundle" --output-dir release-assets \
            --commit "$RELEASE_COMMIT"
          ls -la release-assets

      - name: Upload the SwiftUI payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-swiftui-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # Flutter puts native libraries in a different place on every target --
  # `Contents/Frameworks` on macOS, `lib` on Linux, beside the exe on Windows --
  # so the engine's placement is three problems rather than one, and the
  # archiver checks each platform against ITS OWN layout.
  build-flutter:
    name: Build the Flutter app (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            bundle: build/linux/x64/release/bundle
          - platform: macos
            runner: macos-latest
            # Located rather than named: the bundle takes its name from the
            # emitted pubspec, so hardcoding it makes the release lane break on
            # a rename that nothing else would notice.
            bundle: build/macos/Build/Products/Release
          - platform: windows
            runner: windows-latest
            bundle: build/windows/x64/runner/Release
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `mosaic-compile` links `cairo-sys-rs` through the paint backend; the
      # Linux desktop shell additionally needs GTK.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash code/scripts/ci/apt-install.sh libcairo2-dev libgtk-3-dev ninja-build \
            libglu1-mesa pkg-config

      - name: Build the Flutter desktop app
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-native.sh \
            --backend flutter --output "$RUNNER_TEMP/engram-flutter" --build

      - name: Archive the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE: ${{ matrix.bundle }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/engram-flutter/flutter/$BUNDLE"
          if [ "$PLATFORM" = "macos" ]; then
            bundle="$(find "$bundle" -maxdepth 1 -name '*.app' -print -quit)"
          fi
          if [ -z "$bundle" ] || [ ! -d "$bundle" ]; then
            echo "no Flutter bundle for $PLATFORM under" \
              "$RUNNER_TEMP/engram-flutter/flutter/$BUNDLE" >&2
            exit 1
          fi
          mkdir -p release-assets
          python code/scripts/engram_release.py archive-flutter \
            --version "$RELEASE_VERSION" --platform "$PLATFORM" \
            --source "$bundle" --output-dir release-assets \
            --commit "$RELEASE_COMMIT"
          ls -la release-assets

      - name: Upload the Flutter payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-flutter-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # macOS only for now. `macdeployqt` ships with Qt and makes a bundle
  # relocatable; `windeployqt` does the same on Windows and Linux has no
  # official equivalent, so each remaining platform is its own piece of work.
  # Declaring only what is actually built keeps the publish job's set-equality
  # assertion meaningful.
  build-qt:
    name: Build the Qt app (macos)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt
        shell: bash
        run: |
          set -euo pipefail
          brew install qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      # The script builds, bundles, runs macdeployqt, and re-signs. Every one
      # of those matters: `qt_add_executable` links the frameworks by ABSOLUTE
      # path, so an undeployed binary runs for whoever built it and fails to
      # launch for anyone else -- and macdeployqt then invalidates the
      # signatures it rewrites, which on arm64 makes the app exit instantly
      # with no output at all.
      - name: Build and deploy the Qt app bundle
        shell: bash
        env:
          ENGRAM_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-native.sh \
            --backend qt --output "$RUNNER_TEMP/engram-qt" --build

      - name: Archive the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/engram-qt/qt/Engram.app"
          if [ ! -d "$bundle" ]; then
            echo "no Qt bundle at $bundle" >&2
            exit 1
          fi
          mkdir -p release-assets
          python code/scripts/engram_release.py archive-qt \
            --version "$RELEASE_VERSION" --platform macos \
            --source "$bundle" --output-dir release-assets \
            --commit "$RELEASE_COMMIT"
          ls -la release-assets

      - name: Upload the Qt payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-qt-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # Windows only, and not as a scoping choice: WinUI's markup compiler is a
  # Windows-native tool, so `dotnet` restores and type-checks elsewhere and then
  # stops with `XamlCompiler output file was not created`.
  #
  # This is also the one backend nobody can build on a non-Windows machine, so
  # unlike the other four its payload has never been launched by hand. The
  # assertions here are correspondingly the only thing standing between a green
  # build and a broken download.
  build-xaml:
    name: Build the XAML app (windows)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # .NET probes for native libraries BESIDE the executable, so the script
      # copies the engine into the publish output and asserts it landed. An app
      # published without it launches and every deck operation silently does
      # nothing -- and `dotnet publish` succeeds either way.
      - name: Build and publish the XAML app
        shell: bash
        run: |
          set -euo pipefail
          bash code/programs/mosaic/engram-app/scripts/build-native.sh \
            --backend xaml --output "$RUNNER_TEMP/engram-xaml" --build

      - name: Archive the artifact for publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/engram-xaml/xaml/publish"
          if [ ! -d "$publish" ]; then
            echo "no XAML publish output at $publish" >&2
            exit 1
          fi
          mkdir -p release-assets
          python code/scripts/engram_release.py archive-xaml \
            --version "$RELEASE_VERSION" --platform windows \
            --source "$publish" --output-dir release-assets \
            --commit "$RELEASE_COMMIT"
          ls -la release-assets

      - name: Upload the XAML payload
        uses: actions/upload-artifact@v7
        with:
          name: engram-xaml-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish one Engram release
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build-web, build-desktop, build-compose, build-swiftui, build-flutter, build-qt, build-xaml]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download every verified payload
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # Only artifacts that passed their own verification are published. This
      # asserts the set on disk is exactly the set declared for this version, so
      # a job that silently produced nothing cannot result in a release that
      # quietly ships less than it claims.
      - name: Verify the payload set matches what this version declares
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(python code/scripts/engram_release.py artifact-names --version "$RELEASE_VERSION" | sort)"
          actual="$(cd release-assets && ls -1 | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "release payload mismatch" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi
          echo "$actual"

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            Engram ${{ needs.validate.outputs.version }} — web, desktop, and native.

            The browser app, built from the Mosaic package on the Rust core.
            **Anki import and export run in the browser** — legacy `.apkg` and
            modern `.anki21b` / `.colpkg` alike. Earlier builds delegated both to
            native hosts and refused them on the web.

            Media import is capped at 32 MiB in the browser.

            **Desktop builds are included** for Linux (AppImage), macOS (zip)
            and Windows (portable exe), built from the same Mosaic package on
            the same Rust core as the web build.

            **A real native build is included** for Linux, macOS and Windows:
            Compose Desktop, emitted from the same Mosaic package rather than a
            web view in a wrapper. Each carries the `engram-capi` engine beside
            its jar — the release lane asserts that, because the host resolves
            the engine at runtime and an app missing it launches perfectly with
            every deck operation silently unavailable.

            These bundle a JVM, so they are larger than the Electron builds.

            **A Flutter build is included** for Linux, macOS and Windows, from
            the same Mosaic package. Each carries the `engram-capi` engine in
            the directory that platform's loader reads — `Contents/Frameworks`,
            `lib`, and beside the executable respectively — which the release
            lane checks per platform, because an engine present in the wrong
            one of those produces an app that launches with every deck
            operation silently unavailable.

            **A XAML / WinUI 3 build is included for Windows** — a genuine
            WinUI application from the same Mosaic package, carrying the engine
            beside its executable where .NET probes for it.

            **A Qt build is included for macOS**, deployed with `macdeployqt`
            so the Qt frameworks travel inside the bundle — the app runs
            wherever it is unzipped rather than only on a machine that happens
            to have Qt installed at the same path. Windows and Linux Qt builds
            follow; each needs its own deployment tooling.

            **A SwiftUI build is included for macOS** — a genuine AppKit
            application from the same Mosaic package, with no JVM and no web
            view. It is by far the smallest payload here, a few megabytes
            against a hundred, because SwiftUI is the one backend that links
            the engine into the executable instead of loading it at runtime.
            The release lane asserts those symbols are in the packaged binary.

            The macOS and Windows builds are **unsigned**. macOS will refuse to
            open the app on first launch; right-click and choose Open, or clear
            the quarantine attribute. A signed build needs an Apple Developer
            certificate this project does not have.

            Built from ${{ needs.validate.outputs.commit }}.
        env:
          GITHUB_TOKEN: ${{ github.token }}
