<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.79" viewBox="0 0 822 321.79" role="img" aria-label="How to write ದ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ದ</title><desc>5 frames; frame N shows movements 1 to N of ದ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-dha.gif, animation of Kannada consonant ದ, 39 frames, 3.9 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-dha.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation is filed under the slug &quot;dha&quot; but draws dental ದ (U+0CA6); in this series &quot;da&quot; and &quot;dda&quot; animate ಡ and ಢ, so the glyph was checked frame by frame rather than taken from the file name. It writes ದ in two pen-down runs: from the upper left the pen goes down around the left lobe, up into the middle point, down around the right lobe, up the right side and back left across the top (frames 0–18); after one lift it draws the top bar from left to right and curls up into the hook (frames 19–24). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (198×143) and frame count. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the bowl&apos;s top is fused into the bar, so the closing movement runs along the lower part of the bar&apos;s ink and the bar retraces it, but the one-lift order remains the same.</desc><rect x="0" y="0" width="822" height="321.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="215.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.79"