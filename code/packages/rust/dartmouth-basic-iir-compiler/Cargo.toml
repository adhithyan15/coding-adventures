[package]
name = "dartmouth-basic-iir-compiler"
version = "0.14.0"
edition = "2021"
description = "Dartmouth BASIC frontend for the LANG VM AOT chain — lowers parsed BASIC into interpreter_ir::IIRModule. v0.14.0 adds E4/BA4 string literal PRINT on the VM/JIT path; v0.13.0 carries BA7 f64 values through scalar arithmetic, PRINT, DATA, READ, arrays, and historical real formatting."

[dependencies]
coding-adventures-dartmouth-basic-parser = { path = "../dartmouth-basic-parser" }
parser           = { path = "../parser" }
interpreter-ir   = { path = "../interpreter-ir" }
# Promoted from dev-dep — BasicCirJit lives in this crate.
jit-core         = { path = "../jit-core" }
vm-core          = { path = "../vm-core" }

[dev-dependencies]
# Used by tests/backend_compat.rs to prove BASIC programs are
# accepted by every IIR-to-* backend validator (wasm / jvm / clr /
# beam).
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# Needed by tests/backend_encode.rs to serialise WasmModule -> bytes.
wasm-module-encoder   = { path = "../wasm-module-encoder" }
