[package]
name = "cobol-iir-compiler"
version = "0.20.0"
edition = "2021"
description = "COBOL-60 frontend for the LANG VM AOT chain — lowers a parsed COBOL program into interpreter_ir::IIRModule so it runs on every execution backend. v0.20.0: DISPLAY / MOVE / STOP RUN, integer + scaled-decimal (PIC …V…) ADD/SUBTRACT/MULTIPLY/DIVIDE with ROUNDED and ON SIZE ERROR, numeric and character item-to-item MOVE reshaping, reference modification IDENT(start:len) / IDENT(start:) with constant integer indices in DISPLAY and alphanumeric-comparison contexts (constant-index str_slice), STRING … DELIMITED BY SIZE INTO (concatenate sending fields into an alphanumeric receiver, left-justified, truncated at the receiver width, with the ANSI-85 no-space-fill tail), IF/ELSE with compound (AND/OR/NOT, parenthesised) conditions over numeric and alphanumeric (space-padded) relations using word or symbolic (> < = >= <= <>) operators and level-88 condition-names (single value, multiple values, and THRU ranges) with SET … TO TRUE, GO TO and PERFORM (paragraph / TIMES / UNTIL / VARYING / THRU), EVALUATE (case statement, numeric or alphanumeric subject, with multi-value and THRU-range WHENs), COMPUTE with operator precedence, exponentiation (** with a constant integer exponent), and nested division (scale-12 intermediate matching the oracle), and signed numerics (PIC S9…, trailing overpunch DISPLAY) — over scaled-i64 slots and str slots, byte-identical to the cobol-runtime oracle. Group items, cross-category MOVE, a computed (data-name) reference-modification start/length or reference modification of a numeric item or in a numeric/MOVE-source context, a variable/fractional ** exponent, ON-SIZE-ERROR-with-nested-division, alphanumeric level-88 condition-names, figuratives, STRING with a real delimiter / WITH POINTER / ON OVERFLOW, and the other string verbs remain later rungs. See PL09-codegen.md."

[dependencies]
coding-adventures-cobol-parser  = { path = "../cobol-parser" }
# Reused for its exact PICTURE and fixed-point-value logic (Picture / Decimal /
# move_into_char / move_into_numeric) — not its interpreter (PL09).
coding-adventures-cobol-runtime = { path = "../cobol-runtime" }
parser         = { path = "../parser" }
interpreter-ir = { path = "../interpreter-ir" }

[dev-dependencies]
# tests/backend_compat.rs proves the compiled module is accepted by
# every IIR-to-* backend validator.
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/jit_e2e.rs runs the compiled module through the generic VM/JIT and
# checks the DISPLAYed bytes against the cobol-runtime oracle.
vm-core  = { path = "../vm-core" }
jit-core = { path = "../jit-core" }
