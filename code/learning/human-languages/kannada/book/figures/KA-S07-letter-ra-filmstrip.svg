<svg xmlns="http://www.w3.org/2000/svg" width="662" height="351.28" viewBox="0 0 662 351.28" role="img" aria-label="How to write ರ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ರ</title><desc>4 frames; frame N shows movements 1 to N of ರ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-ra.gif, animation of Kannada consonant ರ, 36 frames, 3.6 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-ra.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ರ in two pen-down runs: from the upper left the pen goes down the left side, round the base, up the right side and back left across the top (frames 0–14); after one lift it draws the top bar from left to right and curls up into the hook (frames 15–22). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (230×183) and frame count. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the bowl&apos;s top is fused into the bar, so the closing movement runs along the lower part of the bar&apos;s ink and the bar retraces it, but the one-lift order remains the same.</desc><rect x="0" y="0" width="662" height="351.28" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="245.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.28" viewBox="-28 -860 708 1157.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M326 -12Q245 -12 180.5 19Q116 50 79 109.5Q42 169 42 255Q42 312 57.5 356Q73 400 101 433Q129 466 168 488L186 474L42 474L42 