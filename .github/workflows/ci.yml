# ================================================================
# CI — Incremental, parallel monorepo build with conditional toolchains
# ================================================================
#
# Core pipeline plus always-on contract consumers:
#   1. detect: Fast (~10s) — compiles the Go build tool and runs
#      --detect-languages to determine which toolchains are needed.
#   2. phy00-phy01-fixture-consumers: proves external corpus changes against
#      the Dart packages without granting their tests filesystem authority.
#   3. d18f-message-conformance: runs the one D18F manifest through all six
#      language packages and rejects stale generated vectors.
#   4. d18p-channel-conformance: runs the D18P durable-channel manifest through
#      all six language packages and rejects stale generated transitions.
#   5. d18q-channel-key-grant-conformance: same shape, for the D18Q manifest.
#   6. d18t-durable-epoch-activation-conformance: same shape, for the D18T
#      manifest -- the epoch-activation transaction all six languages share.
#   7. ruby-grammar-regen-check: regenerates every Ruby _grammar.rb from its
#      .tokens/.grammar source and rejects a stale committed file.
#   8. unicode17-elixir-conformance: compiles the generated Elixir tables and
#      exercises every official Unicode 17 normalization/casing vector.
#   9. unicode17-lua-conformance: runs the generated Lua tables against every
#      official Unicode 17 normalization/casing vector.
#   10. unicode17-perl-conformance: runs the generated Perl tables against
#       every official Unicode 17 normalization/casing vector.
#   11. unicode17-haskell-conformance: runs the generated Haskell tables against
#       every official Unicode 17 normalization/casing vector.
#   12. unicode17-swift-conformance: runs the generated Swift tables against
#       every official Unicode 17 normalization/casing vector.
#   13. unicode17-dart-conformance: runs the generated Dart tables against
#       every official Unicode 17 normalization/casing vector.
#   14. forme-release-platform: composes the complete Forme release contract
#       on Linux, macOS, and Windows and publishes one reviewed verdict.
#   15. build: Installs only the needed toolchains, then runs the build.
#
# This saves 3-5 minutes on language-specific changes by skipping
# unneeded toolchain installations (e.g., Rust tarpaulin, Elixir/Erlang).
#
# Change detection: git diff against the base branch determines which
# files changed, maps them to packages, then uses the dependency graph
# to find all affected packages (changed + transitive dependents).
#
# Parallelism: independent packages run concurrently via goroutines.
#
# Event strategy:
# - Feature branches: one authoritative pull-request suite. A second push event
#   for the same commit used to duplicate Linux work and pollute the PR rollup.
# - Main pushes: repeat the committed squash with the full forced build.
# - PRs to main: Linux + macOS + Windows (thorough validation).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Detect which languages need toolchains ────────────
  #
  # This job is fast (~10s). It compiles the Go build tool, runs
  # --detect-languages, and outputs boolean flags for each language.
  # The build job reads these flags to conditionally install toolchains.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_python: ${{ steps.toolchains.outputs.needs_python }}
      needs_ruby: ${{ steps.toolchains.outputs.needs_ruby }}
      needs_go: ${{ steps.toolchains.outputs.needs_go }}
      needs_typescript: ${{ steps.toolchains.outputs.needs_typescript }}
      needs_rust: ${{ steps.toolchains.outputs.needs_rust }}
      needs_elixir: ${{ steps.toolchains.outputs.needs_elixir }}
      needs_lua: ${{ steps.toolchains.outputs.needs_lua }}
      needs_perl: ${{ steps.toolchains.outputs.needs_perl }}
      needs_dart: ${{ steps.toolchains.outputs.needs_dart }}
      needs_haskell: ${{ steps.toolchains.outputs.needs_haskell }}
      needs_ocaml: ${{ steps.toolchains.outputs.needs_ocaml }}
      needs_dotnet: ${{ steps.toolchains.outputs.needs_dotnet }}
      needs_java: ${{ steps.toolchains.outputs.needs_java }}
      needs_kotlin: ${{ steps.toolchains.outputs.needs_kotlin }}
      needs_swift: ${{ steps.toolchains.outputs.needs_swift }}
      needs_cpp: ${{ steps.toolchains.outputs.needs_cpp }}
      needs_lang_windows: ${{ steps.lang-windows.outputs.required }}
      needs_venture_windows: ${{ steps.venture-windows.outputs.required }}
      needs_mosaic_xaml_windows: ${{ steps.mosaic-xaml-windows.outputs.required }}
      needs_mosaic_swift_runtime: ${{ steps.mosaic-swift-runtime.outputs.required }}
      needs_mosaic_qt_runtime: ${{ steps.mosaic-qt-runtime.outputs.required }}
      needs_mosaic_flutter_runtime: ${{ steps.mosaic-flutter-runtime.outputs.required }}
      needs_mosaic_compose_runtime: ${{ steps.mosaic-compose-runtime.outputs.required }}
      diff_base: ${{ steps.diff-base.outputs.base }}
      is_main: ${{ steps.detect-main.outputs.is_main }}
      build_shards: ${{ steps.detect.outputs.build_shards }}
      build_matrix: ${{ steps.build-matrix.outputs.build_matrix }}
      shard_count: ${{ steps.build-matrix.outputs.shard_count }}
      # CI gate verdicts, one per entry in code/specs/data/ci-gates.json. The
      # build tool emits these during plan emission; each gated job consumes its
      # own flag as an `if:` condition. See code/specs/ci-gate-registry.md.
      # On main, ci.yml passes -force, which makes every flag true.
      run_phy00_phy01_fixture_consumers: ${{ steps.detect.outputs.run_phy00_phy01_fixture_consumers }}
      run_d18f_message_conformance: ${{ steps.detect.outputs.run_d18f_message_conformance }}
      run_d18p_channel_conformance: ${{ steps.detect.outputs.run_d18p_channel_conformance }}
      run_d18q_channel_key_grant_conformance: ${{ steps.detect.outputs.run_d18q_channel_key_grant_conformance }}
      run_d18t_durable_epoch_activation_conformance: ${{ steps.detect.outputs.run_d18t_durable_epoch_activation_conformance }}
      run_ruby_grammar_regen_check: ${{ steps.detect.outputs.run_ruby_grammar_regen_check }}
      run_mosaic_grammar_regen_check: ${{ steps.detect.outputs.run_mosaic_grammar_regen_check }}
      run_rust_grammar_regen_check: ${{ steps.detect.outputs.run_rust_grammar_regen_check }}
      run_unicode17_elixir_conformance: ${{ steps.detect.outputs.run_unicode17_elixir_conformance }}
      run_unicode17_lua_conformance: ${{ steps.detect.outputs.run_unicode17_lua_conformance }}
      run_unicode17_perl_conformance: ${{ steps.detect.outputs.run_unicode17_perl_conformance }}
      run_unicode17_haskell_conformance: ${{ steps.detect.outputs.run_unicode17_haskell_conformance }}
      run_unicode17_swift_conformance: ${{ steps.detect.outputs.run_unicode17_swift_conformance }}
      run_unicode17_dart_conformance: ${{ steps.detect.outputs.run_unicode17_dart_conformance }}
      run_contracts_adj_stdlib: ${{ steps.detect.outputs.run_contracts_adj_stdlib }}
      run_contracts_build_tool_conformance: ${{ steps.detect.outputs.run_contracts_build_tool_conformance }}
      run_contracts_capability_cage: ${{ steps.detect.outputs.run_contracts_capability_cage }}
      run_ocaml_capability_gate: ${{ steps.detect.outputs.run_ocaml_capability_gate }}
      run_build_linux_os_suites: ${{ steps.detect.outputs.run_build_linux_os_suites }}
      run_build_macos_os_suites: ${{ steps.detect.outputs.run_build_macos_os_suites }}
      run_build_windows_os_suites: ${{ steps.detect.outputs.run_build_windows_os_suites }}
      run_forme_release_platform: ${{ steps.detect.outputs.run_forme_release_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject double-encoded UTF-8
        shell: bash
        run: python3 code/scripts/check_mojibake.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'code/**/go.sum'

      - name: Determine diff base
        id: diff-base
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Validate the base ref before using it to prevent script injection.
            # Branch names may only contain alphanumerics, dots, hyphens, underscores,
            # and forward slashes — anything else is rejected.
            if [[ "$PR_BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              BASE="origin/$PR_BASE_REF"
            else
              echo "::error::Unsafe base ref value: $PR_BASE_REF"
              exit 1
            fi
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            BASE="HEAD~1"
          else
            git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
            BASE="origin/main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      - name: Check if main branch
        id: detect-main
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GIT_REF" = "refs/heads/main" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect needed languages and emit build plan
        id: detect
        shell: bash
        run: |
          cd code/programs/go/build-tool
          go build -o ../../../../build-tool .
          cd ../../../..
          force_flag=()
          shard_flags=()
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            force_flag=(-force)
            shard_flags=(-shard-count 15 -emit-shard-matrix)
          fi
          emit_plan() {
            ./build-tool \
              -root . \
              -diff-base "${{ steps.diff-base.outputs.base }}" \
              "${force_flag[@]}" \
              -validate-build-files \
              -detect-languages \
              -emit-plan build-plan.json \
              "${shard_flags[@]}"
          }
          if plan_output="$(emit_plan 2>&1)"; then
            printf '%s\n' "$plan_output"
          else
            plan_status=$?
            printf '%s\n' "$plan_output"
            if ! grep -Fqx "Error evaluating CI gate registry: CI_GATE_MATCH_LIMIT_EXCEEDED" <<< "$plan_output"; then
              exit "$plan_status"
            fi
            echo "::notice::CI gate match-work ceiling exceeded; starting a separate forced run-all planning operation"
            force_flag=(-force)
            emit_plan
          fi

      # Guard against the one failure mode gating introduces: if the build tool
      # emitted no verdicts (registry disabled, flag typo, plan written by an
      # older binary), every `if:` would compare against an empty string, every
      # gated job would skip, and `CI gate` would still report green. Silence is
      # indistinguishable from success here, so assert the verdicts exist.
      - name: Verify CI gate verdicts were emitted
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("build-plan.json", encoding="utf-8") as handle:
            plan = json.load(handle)
          with open("code/specs/data/ci-gates.json", encoding="utf-8") as handle:
            registry = json.load(handle)

          expected = set(registry["gates"])
          verdicts = plan.get("ci_jobs") or {}
          missing = sorted(expected - set(verdicts))
          if missing:
            print("::error::build plan is missing CI gate verdicts: " + ", ".join(missing))
            print("Every job gated on a missing verdict would silently skip while CI stayed green.")
            sys.exit(1)

          required = sorted(gate for gate, needed in verdicts.items() if needed)
          print(f"{len(required)}/{len(expected)} CI gates required by this change.")
          for gate in required:
            print(f"  run  {gate}")
          for gate in sorted(expected - set(required)):
            print(f"  skip {gate}")
          PY

      - name: Detect LANG Windows runtime acceptance
        id: lang-windows
        shell: bash
        run: |
          python3 code/scripts/lang_windows_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Venture native-shell acceptance
        id: venture-windows
        shell: bash
        run: |
          python3 code/scripts/venture_windows_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic XAML native-shell acceptance
        id: mosaic-xaml-windows
        shell: bash
        run: |
          python3 code/scripts/mosaic_xaml_windows_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Swift runtime acceptance
        id: mosaic-swift-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_swift_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Qt runtime acceptance
        id: mosaic-qt-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_qt_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Flutter runtime acceptance
        id: mosaic-flutter-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_flutter_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Detect Mosaic Compose runtime acceptance
        id: mosaic-compose-runtime
        shell: bash
        run: |
          python3 code/scripts/mosaic_compose_runtime_ci_acceptance.py \
            build-plan.json \
            --repo-root . \
            --diff-base "${{ steps.diff-base.outputs.base }}" >> "$GITHUB_OUTPUT"

      - name: Normalize toolchain requirements
        id: toolchains
        shell: bash
        run: |
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            echo "Main branch push detected; enabling all supported toolchains for the forced full build"
            printf '%s\n' \
              'needs_python=true' \
              'needs_ruby=true' \
              'needs_go=true' \
              'needs_typescript=true' \
              'needs_rust=true' \
              'needs_elixir=true' \
              'needs_lua=true' \
              'needs_perl=true' \
              'needs_dart=true' \
              'needs_haskell=true' \
              'needs_ocaml=true' \
              'needs_dotnet=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=true' \
              'needs_kotlin=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              'needs_python=${{ steps.detect.outputs.needs_python }}' \
              'needs_ruby=${{ steps.detect.outputs.needs_ruby }}' \
              'needs_go=${{ steps.detect.outputs.needs_go }}' \
              'needs_typescript=${{ steps.detect.outputs.needs_typescript }}' \
              'needs_rust=${{ steps.detect.outputs.needs_rust }}' \
              'needs_elixir=${{ steps.detect.outputs.needs_elixir }}' \
              'needs_lua=${{ steps.detect.outputs.needs_lua }}' \
              'needs_perl=${{ steps.detect.outputs.needs_perl }}' \
              'needs_dart=${{ steps.detect.outputs.needs_dart }}' \
              'needs_haskell=${{ steps.detect.outputs.needs_haskell }}' \
              'needs_ocaml=${{ steps.detect.outputs.needs_ocaml }}' \
              'needs_dotnet=${{ steps.detect.outputs.needs_dotnet }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=${{ steps.detect.outputs.needs_java }}' \
              'needs_kotlin=${{ steps.detect.outputs.needs_kotlin }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=${{ steps.detect.outputs.needs_swift }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=${{ steps.detect.outputs.needs_cpp }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Plan build matrix
        id: build-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_MAIN: ${{ steps.detect-main.outputs.is_main }}
          BUILD_SHARDS: ${{ steps.detect.outputs.build_shards }}
          NEEDS_SWIFT: ${{ steps.toolchains.outputs.needs_swift }}
          NEEDS_ELIXIR: ${{ steps.toolchains.outputs.needs_elixir }}
          NEEDS_RUST: ${{ steps.toolchains.outputs.needs_rust }}
          NEEDS_OCAML: ${{ steps.toolchains.outputs.needs_ocaml }}
          NEEDS_LANG_WINDOWS: ${{ steps.lang-windows.outputs.required }}
          NEEDS_VENTURE_WINDOWS: ${{ steps.venture-windows.outputs.required }}
          NEEDS_MOSAIC_XAML_WINDOWS: ${{ steps.mosaic-xaml-windows.outputs.required }}
          NEEDS_MOSAIC_SWIFT_RUNTIME: ${{ steps.mosaic-swift-runtime.outputs.required }}
          RUN_MACOS_OS_SUITES: ${{ steps.detect.outputs.run_build_macos_os_suites }}
          RUN_WINDOWS_OS_SUITES: ${{ steps.detect.outputs.run_build_windows_os_suites }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          LINUX = {"os": "ubuntu-latest", "label": "ubuntu-latest", "sharded": False, "shard_index": -1}
          MACOS = {"os": "macos-latest", "label": "macos-latest", "sharded": False, "shard_index": -1}
          WINDOWS = {"os": "windows-2025", "label": "windows-2025", "sharded": False, "shard_index": -1}

          def flag(name):
            return os.environ.get(name, "") == "true"

          # Languages whose behavior can genuinely differ between Linux and
          # macOS: native compilation, platform cfgs, and platform-gated clippy
          # lints. lessons.md records that Apple-gated dead code is only caught
          # on one of the two legs, so a Rust/Swift/C/.NET change keeps macOS.
          PLATFORM_SENSITIVE = {"rust", "wasm", "swift", "c", "cpp", "csharp", "fsharp", "dotnet", "ocaml"}

          def platform_state(plan, goos):
            override = (plan.get("platform_overrides") or {}).get(goos)
            if override is None:
              return plan.get("affected_packages")
            return override.get("affected_packages")

          def needs_macos(plan):
            """macOS re-runs the whole affected build. It earns its runner only
            when the change could behave differently there.

            These legs exist ONLY on pull requests -- main builds from ubuntu
            shards -- so unlike the job gates there is no main-merge safety net.
            Dropping a leg removes that coverage from the repo entirely, which
            is why the OS-only suites below get an explicit gate."""
            # The macOS leg carries one suite gated on runner.os alone, with no
            # toolchain condition: the ADJ POSIX process-tree containment tests.
            if flag("RUN_MACOS_OS_SUITES"):
              return True
            if flag("NEEDS_MOSAIC_SWIFT_RUNTIME") or flag("NEEDS_VENTURE_WINDOWS"):
              return True
            if plan is None:
              return True
            darwin = platform_state(plan, "darwin")
            # null means "rebuild everything" — never trim on that.
            if darwin is None:
              return True
            if not darwin:
              return False
            # A platform BUILD override changed the darwin closure, so the two
            # legs are no longer building the same thing.
            linux = platform_state(plan, "linux")
            if linux is None or set(darwin) != set(linux):
              return True
            language_of = {p["name"]: p.get("language", "") for p in plan.get("packages", [])}
            return any(language_of.get(name, "") in PLATFORM_SENSITIVE for name in darwin)

          def needs_windows():
            """The Windows leg's *build* step is guarded to Swift/Elixir/.NET and its
            other build steps to LANG/venture/XAML/Rust-clippy -- but it also carries
            two suites gated on runner.os alone: the ADJ Windows Job-object
            containment tests and the MSVC bootstrap test. Those have no
            toolchain flag, so they need their own gate, or a change to the
            containment code would drop the only tests that cover it."""
            return (
              flag("RUN_WINDOWS_OS_SUITES")
              or flag("NEEDS_SWIFT")
              or flag("NEEDS_ELIXIR")
              or flag("NEEDS_OCAML")
              or flag("NEEDS_DOTNET")
              or flag("NEEDS_RUST")
              or flag("NEEDS_LANG_WINDOWS")
              or flag("NEEDS_VENTURE_WINDOWS")
              or flag("NEEDS_MOSAIC_XAML_WINDOWS")
            )

          def load_plan():
            try:
              with open("build-plan.json", encoding="utf-8") as handle:
                return json.load(handle)
            except (OSError, ValueError):
              # Unreadable plan means we cannot reason about platforms. Run the
              # full matrix rather than silently narrowing coverage.
              return None

          if os.environ["IS_MAIN"] == "true":
            shards = json.loads(os.environ.get("BUILD_SHARDS") or "[]")
            entries = [
              {
                "os": "ubuntu-latest",
                "label": shard["label"],
                "sharded": True,
                "shard_index": shard["shard_index"],
                "package_count": shard.get("package_count", 0),
                "languages": shard.get("languages", []),
              }
              for shard in shards
            ]
            shard_count = len(entries)
          elif os.environ["EVENT_NAME"] == "pull_request":
            plan = load_plan()
            entries = [LINUX]
            if needs_macos(plan):
              entries.append(MACOS)
            if needs_windows():
              entries.append(WINDOWS)
            shard_count = 0
          else:
            entries = [LINUX]
            shard_count = 0

          print("build_matrix=" + json.dumps(entries, separators=(",", ":")))
          print(f"shard_count={shard_count}")
          PY

      - name: Upload build plan
        uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 1

  # ── Job 2: Repo-wide metadata contracts ────────────────────────
  #
  # This used to be a single "Test parity metadata contracts" step inside
  # `detect`. That put ~6 minutes of Python/cargo/go work on the critical path
  # of every run, ahead of the ~90 seconds of actual planning that `detect`
  # exists to do — and nothing later in `detect` depends on any of it. Moving it
  # here lets `build` start as soon as the plan is ready.
  #
  # The job itself stays unconditional, because several of these checks are
  # genuinely repo-wide invariants (package parity is computed from `git
  # ls-files` across every language bucket, so any package added or renamed
  # anywhere changes the answer). What IS gated is the expensive minority: two
  # cargo builds, a cgroup-scoped provenance verification, the build-tool
  # conformance corpus, and the capability-cage Go/Rust suites. On a change that
  # touches none of them this job does about a minute of cheap Python instead of
  # six minutes of everything.
  contracts:
    name: Repo-wide metadata contracts
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Barcode adoption evidence binds the checked-out package tree to the
          # exact pre-publication implementation commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'code/**/go.sum'

      - name: Set up JDK 21 for native build-tool contract consumers
        if: needs.detect.outputs.run_contracts_build_tool_conformance == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle for native build-tool contract consumers
        if: needs.detect.outputs.run_contracts_build_tool_conformance == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Dart for native build-tool contract consumers
        if: needs.detect.outputs.run_contracts_build_tool_conformance == 'true'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.12.2'

      # Rust is needed only by the two gated cargo clusters below. Installing it
      # unconditionally would re-add a chunk of what this split removed.
      - name: Set up Rust for ADJ and capability-cage contracts
        if: needs.detect.outputs.run_contracts_adj_stdlib == 'true' || needs.detect.outputs.run_contracts_capability_cage == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Python contract dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.26.0

      # `DOC_SHARD_PLANS` now names a document outside human-languages
      # (`code/packages/rust/lang-aot/CHANGELOG.md`), and its only gate until
      # now was the `build` job of `human-languages-books.yml`, which is gated
      # `if: needs.detect.outputs.books == 'true'`. A pull request touching
      # only that Rust package never sets `books`, so the plan would have been
      # governed by a check that cannot run on any PR able to break it.
      #
      # This job has `needs: detect` but no `if:`, so it runs on every pull
      # request. That is the property being relied on.
      - name: Set up Node for the document-shard registry
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify sharded documents rebuild
        run: |
          set -euo pipefail
          cd code/packages/typescript/human-language-data
          npm ci --quiet
          npm run build --silent
          # Parses every shard set in DOC_SHARD_PLANS and fails if it cannot
          # rebuild a structurally complete document, or if a locally rendered
          # aggregate has gone stale against its shards.
          #
          # It does NOT catch a DELETED shard, and does not test trackedness --
          # both measured. Delete one shard with no local aggregate present
          # (CI's state, since the aggregate is gitignored) and this exits 0;
          # a re-tracked aggregate that happens to be in sync also passes.
          # Those two are guarded by `doc_shard_globs` and
          # `tracked_doc_monoliths` in human-languages-books.yml, whose detect
          # job is ungated and so runs on every PR. `doc-shard.test.ts` pins
          # both lists against DOC_SHARD_PLANS so they cannot drift again.
          npm run check:doc-shards --silent

      - name: Verify repo-wide metadata contracts
        run: |
          # `lessons.d/` is one file per lesson so concurrent PRs cannot
          # conflict on it. `validate` is what keeps that true: it rejects a
          # duplicate title, a category absent from `_meta.md`, and a filename
          # that no longer derives from its own title -- the last being how a
          # lesson could be filed twice without git ever seeing a collision.
          python3 code/scripts/lessons.py validate
          python3 -m unittest discover -s code/scripts/tests -p 'test_lessons.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_forme_spec_map.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_package_parity_report.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_ct_compare_conformance.py'
          python3 code/scripts/ct_compare_conformance.py
          python3 -m unittest discover -s code/scripts/tests -p 'test_elixir_windows_build_fronts.py'
          python3 code/scripts/validate_elixir_windows_build_fronts.py --format json > /tmp/elixir-windows-build-fronts.json
          python3 -m unittest discover -s code/scripts/tests -p 'test_classical_cipher_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_barcode_symbologies_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_barcode_layout_1d_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_generate_scytale_fixture_consumers.py'
          python3 code/scripts/generate_scytale_fixture_consumers.py --check
          python3 -m unittest discover -s code/scripts/tests -p 'test_generate_vigenere_fixture_consumers.py'
          python3 code/scripts/generate_vigenere_fixture_consumers.py --check
          python3 -m unittest discover -s code/scripts/tests -p 'test_generate_atbash_fixture_consumers.py'
          python3 code/scripts/generate_atbash_fixture_consumers.py --check
          python3 -m unittest discover -s code/scripts/tests -p 'test_zip_raw_rfc1951_portable_coverage.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_image_codec_png_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_typescript_tsconfig_portability.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_haskell_required_capabilities.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_ocaml_toolchain_lock.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_ocaml_capability_gate.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_generate_tracked_artifact_unicode17.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_setup_lua.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_verify_gradle_wrapper_jar.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_deploy_workflows_drop_checkout_credentials.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_phy00_phy01_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18f_message_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18p_channel_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18q_channel_key_grant_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_d18t_durable_epoch_activation_conformance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_onvif_origin_fixtures.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_ci_gate_registry.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_lang_windows_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_venture_windows_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_xaml_windows_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_swift_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_qt_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_flutter_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_mosaic_compose_runtime_ci_acceptance.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_run_under_xvfb.py'
          python3 code/scripts/package_parity_report.py --format json --fail-on-collisions > /tmp/package-parity-report.json

      # The cgroup lifecycle (mkdir, chown, trap, cleanup) must stay inside one
      # step: `trap ... EXIT` does not survive across steps, and an orphaned
      # cgroup would leak for the rest of the job.
      - name: Verify ADJ stdlib contracts
        if: needs.detect.outputs.run_contracts_adj_stdlib == 'true'
        run: |
          cargo build --manifest-path code/packages/rust/adj-lang-cli/Cargo.toml --bin adj-formula-inventory
          cargo build --manifest-path code/packages/rust/adj-lang-cli/Cargo.toml --bin adj-formula-audit
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_report.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_manifest.py'
          ADJ_CGROUP_ORIGINAL=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
          ADJ_CGROUP_ROOT="/sys/fs/cgroup/adj-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ADJ_CGROUP_SHELL_PID=$$
          cleanup_adj_cgroup() {
            printf '%s\n' "$ADJ_CGROUP_SHELL_PID" | sudo tee "/sys/fs/cgroup${ADJ_CGROUP_ORIGINAL}/cgroup.procs" >/dev/null
            sudo rmdir "$ADJ_CGROUP_ROOT"
          }
          sudo mkdir "$ADJ_CGROUP_ROOT"
          sudo chown "$(id -u):$(id -g)" \
            "$ADJ_CGROUP_ROOT" \
            "$ADJ_CGROUP_ROOT/cgroup.procs" \
            "$ADJ_CGROUP_ROOT/cgroup.threads" \
            "$ADJ_CGROUP_ROOT/cgroup.subtree_control"
          printf '%s\n' "$ADJ_CGROUP_SHELL_PID" | sudo tee "$ADJ_CGROUP_ROOT/cgroup.procs" >/dev/null
          export ADJ_PROVENANCE_CGROUP_ROOT="$ADJ_CGROUP_ROOT"
          trap cleanup_adj_cgroup EXIT
          python3 -m unittest discover -s code/scripts/tests -p 'test_adj_stdlib_provenance.py'
          python3 code/scripts/adj_stdlib_report.py --format json --fail-on-unreferenced-tests \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-report.json
          python3 code/scripts/adj_stdlib_manifest.py --validate-json-schema \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-manifest.json
          python3 code/scripts/adj_stdlib_provenance.py verify \
            --formula-inventory-binary code/packages/rust/target/debug/adj-formula-inventory \
            --formula-audit-binary code/packages/rust/target/debug/adj-formula-audit \
            > /tmp/adj-stdlib-provenance.json
          cleanup_adj_cgroup
          trap - EXIT
          unset ADJ_PROVENANCE_CGROUP_ROOT

      - name: Verify build-tool conformance corpus
        if: needs.detect.outputs.run_contracts_build_tool_conformance == 'true'
        run: |
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_authority.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_backend_loader.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_capability_broker.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_linux_oci.py'
          python3 code/scripts/build_tool_conformance.py validate-corpus
          python3 code/scripts/build_tool_conformance_execution.py validate-contract
          gradle --no-daemon --no-build-cache --max-workers=1 -p code/programs/java/build-tool clean check
          gradle --no-daemon --no-build-cache --max-workers=1 -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -p code/programs/kotlin/build-tool clean check
          (cd code/programs/dart/build-tool && dart pub get && dart analyze --fatal-infos && dart test)

      - name: Verify capability cage contracts
        if: needs.detect.outputs.run_contracts_capability_cage == 'true'
        run: |
          python3 -m unittest discover -s code/scripts/tests -p 'test_capability_taxonomy.py'
          (cd code/programs/go/capability-cage-generator && go test ./...)
          (cd code/packages/go/ca-capability-analyzer && go test ./...)
          (cd code/packages/go/capability-cage && go test ./...)
          cargo test -p capability-cage --manifest-path code/packages/rust/Cargo.toml

      - name: Set up Python for language frontend oracle replay
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify language frontend neutral fixtures
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 13)'
          python -m pip install --disable-pip-version-check --quiet jsonschema==4.26.0
          python code/scripts/language_frontend_fixtures.py
          python -m unittest discover -s code/scripts/tests -p 'test_language_frontend_fixtures.py'

  # This gate is independent of package BUILD files. A package cannot silence
  # capability enforcement by editing its own build recipe.
  ocaml-capability-gate:
    name: OCaml capability gate
    needs: detect
    if: needs.detect.outputs.run_ocaml_capability_gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up reviewed OCaml compiler and repository
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0
        # Avoid opam/opam#7031 while opam inspects its Git-backed repository.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ocaml-compiler: ocaml-base-compiler.5.2.1
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#ba8cc66eb9e5baae7ebc88cf77f4c488d63d87ff
          opam-pin: false
          dune-cache: false
          cache-prefix: ocaml06-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-capability-gate
          github-token: ${{ github.token }}

      - name: Build the reviewed analyzer
        shell: bash
        run: |
          set -euo pipefail
          test "$(opam --version)" = "2.5.2"
          test "$(opam exec -- ocamlc -version | tr -d '\r')" = "5.2.1"
          repository_names="$(opam repository list --all --short --color=never)"
          test "$repository_names" = "default"
          repository_listing="$(opam repository list --all --color=never)"
          python code/scripts/ocaml_toolchain_lock.py validate-repository-report \
            --names "$repository_names" \
            --listing "$repository_listing"
          opam_config="$(opam var root --global)/config"
          test -f "$opam_config"
          if grep -q '^archive-mirrors:' "$opam_config"; then
            echo "unexpected preconfigured opam archive mirror" >&2
            exit 1
          fi
          printf 'archive-mirrors: "https://opam.ocaml.org/cache"\n' >> "$opam_config"
          test -z "$(find . -name dune-workspace -print -quit)"
          cd code/packages/ocaml/ca-capability-analyzer
          opam install . --deps-only --with-test --with-dev-setup \
            --yes --require-checksums
          rm -f bisect*.coverage
          BISECT_FILE="$PWD/bisect" opam exec -- \
            dune runtest --force --instrument-with bisect_ppx
          python test/check_coverage.py \
            --coverage-glob "bisect*.coverage" \
            --summary _build/coverage-summary.txt \
            --source src/coding_adventures_capability_analyzer.ml \
            --source bin/main.ml \
            --minimum 95
          opam exec -- dune build bin/main.exe

      - name: Analyze every OCaml package and program independently
        shell: bash
        run: |
          set -euo pipefail
          analyzer="$GITHUB_WORKSPACE/code/packages/ocaml/ca-capability-analyzer/_build/default/bin/main.exe"
          test -x "$analyzer"
          mapfile -d '' roots < <(
            find code/packages/ocaml code/programs/ocaml \
              -mindepth 2 -maxdepth 2 -name dune-project -print0 2>/dev/null \
              | sort -z
          )
          test "${#roots[@]}" -gt 0
          for project in "${roots[@]}"; do
            "$analyzer" --dir "$(dirname "$project")"
          done

