[package]
name = "macsyma-vm"
version = "0.1.0"
edition = "2021"
description = "A tiny interpreter for the Macsyma v0 arithmetic/assignment IIR subset (macsyma-iir-vm.md), built directly on `dynval-runtime`. Executes the `IIRModule` produced by `macsyma-iir-compiler`. Macsyma's own VM -- deliberately independent of `twig-vm`/`mccarthy-lisp-vm` (which are Twig's and McCarthy Lisp's own); all three languages share only the `dynval-runtime` foundation."

[lib]
name = "macsyma_vm"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
dynval-runtime = { path = "../dynval-runtime" }
# Provides `RuntimeError`, the error type dynval-runtime's builtins return.
lang-runtime-core = { path = "../lang-runtime-core" }
