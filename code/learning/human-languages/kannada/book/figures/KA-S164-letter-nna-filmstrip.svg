<svg xmlns="http://www.w3.org/2000/svg" width="662" height="263.36" viewBox="0 0 662 263.36" role="img" aria-label="How to write ಣ: one unbroken stroke · 4 movements"><title>Writing ಣ</title><desc>4 frames; frame N shows movements 1 to N of ಣ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-nna.gif, animation of Kannada consonant ಣ, 45 frames, 4.5 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-nna.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಣ in one pen-down run (frames 0–26): from the foot of the lower curl the pen runs left along its base and rounds it up to the waist, rounds the upper curl over the top and dips into the middle point, arches over to the right and comes down the right side, then rounds the base and spirals in to the centre. ಣ has no top bar, so nothing follows a lift. The frames were read from a mirror copy that matches the Commons file&apos;s listed size (252×200, 137 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the waist ends in a short tick, which the path runs out to and back from, but the one-run order remains the same.</desc><rect x="0" y="0" width="662" height="263.36" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="157.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="157.36" viewBox="-39 -633 931 976.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M602 -12Q523 -12 474 31Q425 74 425 148Q425 208 462 250Q499 292 561 292Q614 292 645.5 267