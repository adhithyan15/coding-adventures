<svg xmlns="http://www.w3.org/2000/svg" width="822" height="228.88" viewBox="0 0 822 228.88" role="img" aria-label="How to write സ: one unbroken stroke · 5 movements"><title>Writing സ</title><desc>5 frames; frame N shows movements 1 to N of സ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for സ in data/SA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/SA.png&gt;. Source note on variation: Thooval&apos;s SA.png starts at the foot of the left arch (green), climbs clockwise over it and runs down the stem to the line (blue turn), climbs the stem again, sweeps over the middle arch, down and round the bowl, and up to the top-right tip (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record സ as one stroke from the lower left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (26 of 31) and end at the upper right (31 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the climb back up the stem retraces the ink just drawn.</desc><rect x="0" y="0" width="822" height="228.88" fill="#ffffff"/><text x="16" y="31" font-famil