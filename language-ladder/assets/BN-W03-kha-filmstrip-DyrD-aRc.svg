rule="nonzero"/><path class="ductus__done" d="M160 505 L180 555 L165 605 L120 625 L78 605 L57 555 L70 495 L115 458 L180 445 L250 470 L295 520 L325 590 L325 590" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M325 590 L360 560 L378 500 L375 440 L345 385 L285 345 L200 315 L120 300" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="120" cy="300" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="360.5" y="201" text-anchor="middle" font-size="61" fill="#6b7280"><tspan x="360.5" y="201">2. cross the middle</tspan><tspan x="360.5" y="275.4">bend and come down to</tspan><tspan x="360.5" y="349.8">the pointed left tip</tspan></text></svg><rect x="336" y="42" width="150" height="222.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="222.58" viewBox="-20 -758 761 1129.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M489 0Q437 90 349 153Q261 216 141 232L103 331Q234 349 287 384Q340 419 340 473Q340 498 332 519Q307 473 267.5 451.5Q228 430 179 430Q121 430 85.5 463Q50 496 50 550Q50 582 68.5 607Q87 632 124 632Q156 632 170.5 613Q185 594 185 569Q185 546 175.5 531Q166 516 153 507Q165 501 181 501Q205 501 237.5 523Q270 545 299 612L361 625Q382 594 398.5 554.5Q415 515 415 470Q415 393 360.5 347Q306 301 221 284Q327 255 391.5 204Q456 153 492 97Q490 120 489.5 143Q489 166 489 193L489 688L542 688L565 622L671 622L671 551L566 551L566 0L489 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 505 L180 555 L165 605 L120 625 L78 605 L57 555 L70 495 L115 458 L180 445 L250 470 L295 520 L325 590 L360 560 L378 500 L375 440 L345 385 L285 345 L200 315 L120 300 L120 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 300 L150 255 