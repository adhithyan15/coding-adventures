<!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
<div data-mosaic-component="NoteEditor">
  <div style="display: flex; flex-direction: column; background: #f8fafc; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 14px">
    <span style="color: #0f172a; font-size: 20px; font-weight: 800; padding-bottom: 10px">{{editorLabel}}</span>
    <div style="display: flex; flex-direction: row; padding-bottom: 12px">
      <div style="display: flex; flex-direction: column; padding: 8px">
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{noteIdLabel}}</span>
        <span style="color: #334155; font-size: 14px; font-weight: 600">{{noteIdValue}}</span>
      </div>
      <div style="padding: 8px">
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{noteTypeLabel}}</span>
        <span style="color: #334155; font-size: 14px; font-weight: 600">{{noteTypeValue}}</span>
      </div>
      <div style="padding: 8px">
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{deckLabel}}</span>
        <span style="color: #334155; font-size: 14px; font-weight: 600">{{deckValue}}</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: row; padding-bottom: 12px">
      <div style="display: flex; flex-direction: column; padding: 2px">
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{noteTypeOptionsLabel}}</span>
        <div style="display: flex; flex-direction: column; padding-top: 6px">
          <!-- mosaic-for each="noteTypeNames" as="note-type" index="note-type-index" -->
            <!-- emit "onSelectNoteType" dropped: HTML is static -->
            <button data-on-click="onSelectNoteType" style="background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 6px; color: #0f172a; padding: 8px">{{note-type}}</button>
          <!-- /mosaic-for -->
        </div>
      </div>
      <div style="display: flex; flex-direction: column; padding: 2px">
        <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{deckOptionsLabel}}</span>
        <div style="display: flex; flex-direction: column; padding-top: 6px">
          <!-- mosaic-for each="deckNames" as="deck" index="deck-index" -->
            <!-- emit "onSelectDeck" dropped: HTML is static -->
            <button data-on-click="onSelectDeck" style="background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 6px; color: #0f172a; padding: 8px">{{deck}}</button>
          <!-- /mosaic-for -->
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: row; padding-bottom: 12px">
      <div style="display: flex; flex-direction: column; padding: 2px">
        <span style="color: #5b21b6; font-size: 11px; font-weight: 700">{{fieldsLabel}}</span>
        <div style="display: flex; flex-direction: column; padding-top: 6px">
          <!-- mosaic-for each="fieldLabels" as="field" index="field-index" -->
            <!-- emit "onSelectField" dropped: HTML is static -->
            <button data-on-click="onSelectField" style="background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 6px; color: #0f172a; padding: 8px">{{field}}</button>
          <!-- /mosaic-for -->
        </div>
      </div>
      <div style="padding: 2px">
        <div style="display: flex; flex-direction: column; padding: 16px; gap: 8px; background: #111827; border-width: 1px; border-color: #374151; border-radius: 4px">
          <span style="color: #9ca3af; font-size: 12px">{{selectedFieldLabel}}</span>
          <!-- emit "onFieldValueChange" dropped: HTML is static -->
          <!-- emit "onSaveNote" dropped: HTML is static -->
          <textarea aria-label="{{selectedFieldLabel}}" placeholder="{{selectedFieldPlaceholder}}" data-on-change="onFieldValueChange" data-on-commit="onSaveNote" data-commit-key="mod+Enter" style="width: 100%; min-height: 160px; padding: 8px; background: #1f2937; color: #f9fafb; border-width: 1px; border-color: #374151; border-radius: 4px; font-size: 14px">{{selectedFieldValue}}</textarea>
          <div style="display: flex; flex-direction: row; gap: 8px"></div>
        </div>
        <span style="color: #92400e; font-size: 11px; font-weight: 700; padding-top: 8px">{{tagsLabel}}</span>
        <!-- emit "onTagsChange" dropped: HTML is static -->
        <input type="text" aria-label="{{tagsLabel}}" value="{{tagsValue}}" placeholder="{{tagsPlaceholder}}" data-on-change="onTagsChange" style="background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 6px; color: #0f172a; padding: 8px">
      </div>
    </div>
    <div style="display: flex; flex-direction: row; padding-top: 2px">
      <!-- emit "onSaveNote" dropped: HTML is static -->
      <button data-on-click="onSaveNote" style="background: #ccfbf1; border-width: 1px; border-color: #99f6e4; border-radius: 6px; color: #115e59; font-weight: 700; padding: 8px">{{saveLabel}}</button>
      <!-- emit "onDeleteNote" dropped: HTML is static -->
      <button data-on-click="onDeleteNote" style="background: #ffe4e6; border-width: 1px; border-color: #fecdd3; border-radius: 6px; color: #9f1239; font-weight: 700; padding: 8px">{{deleteLabel}}</button>
      <!-- emit "onCancel" dropped: HTML is static -->
      <button data-on-click="onCancel" style="background: #f1f5f9; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; color: #0f172a; font-weight: 700; padding: 8px">{{cancelLabel}}</button>
    </div>
  </div>
</div>
