<svg xmlns="http://www.w3.org/2000/svg" width="342" height="387.88" viewBox="0 0 342 387.88" role="img" aria-label="How to write 儿: 2 strokes · 1 pen lift · 2 movements"><title>Writing 儿</title><desc>2 frames; frame N shows movements 1 to N of 儿 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 儿.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%84%BF.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 儿. Median 1 starts near the upper centre and falls down-left; median 2 restarts at the upper right, descends nearly vertically, bends right along the base, then hooks upward without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their directions, the second stroke&apos;s unbroken bend and hook, and one intervening pen lift; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="342" height="387.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="256.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="256.88" viewBox="-38 -869 1072 1835.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M259 7