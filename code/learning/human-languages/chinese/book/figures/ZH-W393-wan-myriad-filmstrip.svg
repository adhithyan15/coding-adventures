<svg xmlns="http://www.w3.org/2000/svg" width="502" height="303.25" viewBox="0 0 502 303.25" role="img" aria-label="How to write 万: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 万</title><desc>3 frames; frame N shows movements 1 to N of 万 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 万.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%87.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 万. Median 1 draws a long horizontal; median 2 a horizontal from under its middle that turns down and hooks to the left without lifting; median 3 a long left-falling stroke from the top horizontal down to the lower left. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="303.25" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="197.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.25" viewBox="-36 -835 1045 1374.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductu