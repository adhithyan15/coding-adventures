<svg xmlns="http://www.w3.org/2000/svg" width="982" height="377.18" viewBox="0 0 982 377.18" role="img" aria-label="How to write मम: 3 strokes · 2 pen lifts · 7 movements"><title>Writing मम</title><desc>7 frames; frame N shows movements 1 to N of मम (devanagari): each letter&apos;s body in reading order, then one headline over the whole word; the movement being added is drawn in ink over the finished word, whose outline (each letter&apos;s at the font&apos;s advance) is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after letters 1 and 2: JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009; the shared headline, drawn last: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer: native writers&apos; stored prototypes of the 33 consonants draw the headline as the last stroke in 82% of 2,706 and as the first in about 5% (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The letters are drawn in reading order, each as its own cited strip draws it but without its own headline, placed where the bundled font prints it in the word: letters 1 and 2 after JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_m_%E0%A4%AE.gif&gt;. Each letter&apos;s own note on variation is printed with that letter&apos;s own strip. The headline is then drawn once, left to right, over the whole word. That is the order most native writers use for a single letter: in HP Labs India&apos;s LipiTk 4.0 Devanagari recognizer the stored prototypes of the 33 consonants draw the headline last in 82% of 2,706 and first in about 5%. It is a majority, not a rule: some writers draw the headline first. The traces are single letters, so carrying their order across a word is this book&apos;s reading of them; no reachable source records native writers&apos; headline timing in whole words.</desc><rect x="0" y="0" width="982" height="377.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="123.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="123.34" viewBox="-70 -692 1350 1110.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M509 551L509 0L428 0L428 250L207 250L207 213Q207 180 192.5 165.5Q178 151 159 151Q140 151 119 163.5Q98 176 80 195.5Q62 215 50.5 237Q39 259 39 278Q39 296 52.5 308.5Q66 321 100 321L126 321L126 551L0 551L0 622L612 622L612 551L509 551ZM428 551L207 551L207 321L428 321L428 551ZM1107 551L1107 0L1026 0L1026 250L805 250L805 213Q805 180 790.5 165.5Q776 151 757 151Q738 151 717 163.5Q696 176 678 195.5Q660 215 648.5 237Q637 259 637 278Q637 296 650.5 308.5Q664 321 698 321L724 321L724 551L598 551L598 622L1210 622L1210 551L1107 551ZM1026 551L805 551L805 321L1026 321L1026 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 551 L166 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 551 L166 475 L166 405 L166 350 L167 315 L167 265 L161 220 L135 188 L100 184 L80 215 L55 242 L57 278 L75 300 L110 285 L150 285 L200 285 L255 285 L315 285 L370 285 L405 285 L405 285" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="405" cy="285" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="605" y="248.2" text-anchor="middle" font-size="108.2" fill="#6b7280"><tspan x="605" y="248.2">1. descend, loop</tspan><tspan x="605" y="380.2">clockwise, sweep right</tspan></text></svg><rect x="176" y="42" width="150" height="123.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="123.34"