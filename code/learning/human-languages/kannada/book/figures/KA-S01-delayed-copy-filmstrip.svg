<svg xmlns="http://www.w3.org/2000/svg" width="822" height="319.87" viewBox="0 0 822 319.87" role="img" aria-label="How to write ನ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ನ</title><desc>5 frames; frame N shows movements 1 to N of ನ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-na.gif, animation of Kannada consonant ನ, 34 frames, 3.4 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-na.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ನ in two pen-down runs: from the lower tail the pen climbs around the left bowl, slants down into the right bowl and climbs its right side, curving over to finish under the top (frames 0–13); after one lift it draws the top bar from left to right and curls up into the hook (frames 14–20). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (239×215) and frame count. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the right side runs straight into the bar instead of arching over, so the first run ends where the two meet, but the one-lift order remains the same.</desc><rect x="0" y="0" width="822" height="319.87" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="226.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.37" viewBox="-39 -860 778 1174.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M483 -12Q430 -12 395.5 8Q361 28 337.5 59.5Q314 91 294 125Q269 169 251 191Q233 213 217.5 221Q202 229 182 229Q148 229