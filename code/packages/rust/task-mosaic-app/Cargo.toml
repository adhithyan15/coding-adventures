[package]
name = "task-mosaic-app"
version = "0.1.0"
edition = "2021"
description = "Standard Mosaic application adapter for the task-core engine."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mosaic-app-capi = { path = "../mosaic-app-capi" }
mosaic-app-runtime = { path = "../mosaic-app-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
task-core = { path = "../task-core", features = ["serde"] }
