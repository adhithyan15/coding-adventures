name: VisiCalc release artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/release-visicalc.yml'
      - 'code/programs/mosaic/visicalc/**'
      - 'code/packages/rust/visicalc-mosaic-app/**'
      - 'code/packages/rust/spreadsheet-core/**'
      - 'code/programs/typescript/visicalc/**'
  push:
    tags: ['visicalc-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: bash code/scripts/ci/apt-install.sh libcairo2-dev
      - run: python -m unittest discover -s code/programs/mosaic/visicalc/scripts -p 'test_*.py'
      - name: Build and test the shared Mosaic app
        working-directory: code/programs/typescript/visicalc
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Package the production website and Rust runtime
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="0.0.0-preview.${GITHUB_RUN_ID}"
          if [[ "$RELEASE_REF" == refs/tags/visicalc-v* ]]; then
            version="${RELEASE_REF#refs/tags/visicalc-v}"
          fi
          python code/programs/mosaic/visicalc/scripts/package-web.py \
            --dist code/programs/typescript/visicalc/dist --output release \
            --version "$version" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: visicalc-web
          path: release/*
          if-no-files-found: error

  verify:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Deliberately no checkout: verify the downloaded distribution alone.
      - uses: actions/download-artifact@v8
        with:
          name: visicalc-web
          path: release
      - name: Verify checksums and serve the extracted website
        run: |
          cd release
          sha256sum --check SHA256SUMS
          unzip '*.zip' -d app
          cd app
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('release.json').read_text())
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
          python -m http.server 8080 --bind 127.0.0.1 >server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/ -o /tmp/index.html
          curl --fail http://127.0.0.1:8080/visicalc_mosaic_app.wasm -o /tmp/engine.wasm
          cmp index.html /tmp/index.html
          cmp visicalc_mosaic_app.wasm /tmp/engine.wasm
          node -e 'const fs = require("node:fs"); const bytes = fs.readFileSync("/tmp/engine.wasm"); if (!WebAssembly.validate(bytes)) throw Error("Invalid WASM");'

  draft:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/visicalc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: visicalc-web
          path: release
      - name: Create a new draft preview without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          VisiCalc Mosaic web preview. Extract the ZIP and follow README.txt to launch locally. The compiled Rust engine is included; Python 3 and a modern browser are required.

          This draft has passed production build, shared-app tests, archive checksum verification and HTTP/WASM loading checks. Known formula-range correctness bug #15519 blocks promotion. Actual downloaded-release browser persistence, full design/accessibility review and native bundles remain acceptance requirements under #14282 and #14267. Do not promote this draft until those checks pass.
          EOF
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
            --title "VisiCalc ${RELEASE_TAG#visicalc-v} preview" --notes-file notes.md
