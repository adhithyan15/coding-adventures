54ZM304 496Q223 496 186 454.5Q149 413 149 321L149 292L458 292L458 320Q458 415 421 455.5Q384 496 304 496Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M123 256 L198 256 L273 256 L348 256 L423 256 L495 272 L499 340 L491 407 L460 467 L409 511 L343 528 L275 530 L209 514 L156 473 L119 416 L107 343 L109 269 L107 196 L107 122 L111 48 L179 36 L249 36 L320 36 L390 36 L460 36 L531 36 L601 36 L671 36 L739 48 L739 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M739 48 L743 114 L743 180 L743 247 L747 313 L747 379 L747 446 L747 512" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="747" cy="512" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="425.5" y="209.3" text-anchor="middle" font-size="69.3" fill="#6b7280"><tspan x="425.5" y="209.3">5. climb the upright to</tspan><tspan x="425.5" y="293.8">the top</tspan></text></svg><text x="16" y="220.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ല in data/LA.png: green</text><text x="16" y="232.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">start, blue turn, red end (GPL-3.0, 2013)</text><text x="16" y="245.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
