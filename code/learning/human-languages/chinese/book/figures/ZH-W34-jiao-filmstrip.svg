nzero"/><path class="ductus__done" d="M130 735 L130 94" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M106 708 L106 708" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M106 708 L375 700 L375 186" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="375" cy="186" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="493.5" y="296.1" text-anchor="middle" font-size="75.1" fill="#6b7280"><tspan x="493.5" y="296.1">2. lift, then draw 口&apos;s</tspan><tspan x="493.5" y="387.7">top and turn down its</tspan><tspan x="493.5" y="479.3">right side</tspan></text></svg><rect x="336" y="42" width="150" height="225.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="225.18" viewBox="25 -901 937 1406.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M814 831L892 831L892 -81L814 -81L814 831ZM503 105L497 175L533 204L835 273Q837 257 841.5 238.5Q846 220 850 208Q743 180 678 163Q613 146 578.5 135.5Q544 125 528 118.5Q512 112 503 105ZM503 105Q500 114 494 125.5Q488 137 480.5 149Q473 161 467 168Q482 176 502.5 195.5Q523 215 523 248L523 749L599 749L599 187Q599 187 589.5 181.5Q580 176 565.5 166.5Q551 157 537 146Q523 135 513 124Q503 113 503 105ZM139 749L411 749L411 171L139 171L139 242L339 242L339 679L139 679L139 749ZM95 749L166 749L166 79L95 79L95 749Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 735 L130 94" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M106 708 L375 700 L375 186" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M106 210 L106 210" fill="none" stroke="#9aa1