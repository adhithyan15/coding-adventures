<svg xmlns="http://www.w3.org/2000/svg" width="982" height="299.37" viewBox="0 0 982 299.37" role="img" aria-label="How to write 成: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 成</title><desc>6 frames; frame N shows movements 1 to N of 成 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 成.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%88%90.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 成. Median 1 draws a horizontal from the left edge to past the middle; median 2 a long left-falling stroke from its left end; median 3 a short horizontal under it that turns down and hooks to the left without lifting; medians 4–6 a long slanting stroke from the top that hooks up at its foot without lifting, a short left-falling stroke across it, then a dot at the upper right, as the right side of 钱 ends. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hooks and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="299.37" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="205.87" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-wid