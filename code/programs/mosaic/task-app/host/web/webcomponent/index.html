<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trestle — Web Components parity host</title>
    <script>
      const stored = localStorage.getItem("task-app.theme");
      const theme = stored === "light" || stored === "dark"
        ? stored
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      location.replace(`./${theme}.html`);
    </script>
  </head>
  <body>
    <p>Opening the Trestle Web Components parity host…</p>
  </body>
</html>
