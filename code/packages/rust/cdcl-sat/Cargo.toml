[package]
name = "cdcl-sat"
version = "0.3.0"
edition = "2021"
description = "VER09 — conflict-driven clause-learning SAT solver: two watched literals, 1UIP learning, backjumping, VSIDS, Luby restarts, assumptions, DIMACS. Zero dependencies."
license = "MIT"
readme = "README.md"

[dependencies]

# The trusted kernel certifies the solver's UNSAT answers in tests. It is a
# dev-dependency only: the kernel never depends on the solver (VER11 §3.1),
# and the solver does not need the kernel to run.
[dev-dependencies]
drat-check = { path = "../drat-check" }
