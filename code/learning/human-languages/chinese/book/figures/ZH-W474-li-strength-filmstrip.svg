<svg xmlns="http://www.w3.org/2000/svg" width="342" height="351.45" viewBox="0 0 342 351.45" role="img" aria-label="How to write 力: 2 strokes · 1 pen lift · 2 movements"><title>Writing 力</title><desc>2 frames; frame N shows movements 1 to N of 力 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 力.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8A%9B.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 力. Median 1 draws a horizontal that turns down and hooks to the left without lifting; median 2 a long left-falling stroke from above it, down through it to the lower left. These are the last two strokes of 男. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and one intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="342" height="351.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="201.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="201.7" viewBox="-17 -908 994 1336.6" preserveAs