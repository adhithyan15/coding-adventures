<svg xmlns="http://www.w3.org/2000/svg" width="502" height="326.02" viewBox="0 0 502 326.02" role="img" aria-label="How to write ط: 2 strokes · 1 pen lift · 3 movements"><title>Writing ط</title><desc>3 frames; frame N shows movements 1 to N of ط (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ط ظ, independent emphatic Taa at 00:01.2–00:03.0 (University of Oregon Libraries Open Textbook, 2023; accessed 2026-08-23) &lt;https://opentext.uoregon.edu/introarabic/chapter/alphabet-%D8%B7-%D8%B8/&gt;. Source note on variation: The page&apos;s directly linked taaemphatic.mov and its embedded Panopto mirror demonstrate independent ط in two pen-down runs at 00:01.2–00:03.0. The first run starts at the oval&apos;s upper-right edge, curls counterclockwise around the closed body, and finishes leftward along the baseline. After one lift, the second run starts at the upright&apos;s top and descends into the body&apos;s right junction. The adjacent lesson identifies emphatic Taa as a two-way connector, describes its emphatic t sound and T transliteration, and separately prints its contextual shapes. This two-stroke, one-lift learner path fits the course&apos;s vendored Noto Naskh outline. Its Noto-adapted median retraces the loop&apos;s upper-left arc to reach the printed baseline exit without crossing the counter; the two evidenced pen-down runs and their directions stay unchanged. It records the independent form shown before the lesson proceeds to connected examples.</desc><rect x="0" y="0" width="502" height="326.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="207.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" 