<svg xmlns="http://www.w3.org/2000/svg" width="662" height="287.26" viewBox="0 0 662 287.26" role="img" aria-label="How to write ச: one unbroken stroke · 4 movements"><title>Writing ச</title><desc>4 frames; frame N shows movements 1 to N of ச (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ச (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 3 numbers three upper-frame movements and a fourth that turns around ச&apos;s lower-left bowl. Native writers draw the four movements as one continuous stroke, and this ductus follows them in order without lifting: movement 3 ends at the tip of the middle bar, so the pen comes back along the bar to the inner crossing before it turns around the bowl. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 88% of the 176 stored prototypes of ச are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="662" height="287.26" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 292 L205 292" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M205 292 L201 364 L201 436 L205 508" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="205" cy="508" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">1. climb the left</tspan><tspan x="366" y="289.6">upright</tspan></text></svg><rect x="176" y="42" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 292 L201 364 L201 436 L205 508 L205 508" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M205 508 L278 516 L353 519 L426 515 L500 516 L575 516 L649 520 L582 520 L515 520 L453 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="453" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">2. along the top and</tspan><tspan x="366" y="289.6">back</tspan></text></svg><rect x="336" y="42" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 292 L201 364 L201 436 L205 508 L278 516 L353 519 L426 515 L500 516 L575 516 L649 520 L582 520 L515 520 L453 500 L453 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M453 500 L453 431 L453 361 L453 292 L518 292 L584 292 L649 292" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="649" cy="292" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">3. down the stem, out</tspan><tspan x="366" y="289.6">right</tspan></text></svg><rect x="496" y="42" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 292 L201 364 L201 436 L205 508 L278 516 L353 519 L426 515 L500 516 L575 516 L649 520 L582 520 L515 520 L453 500 L453 431 L453 361 L453 292 L518 292 L584 292 L649 292 L649 292" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M649 292 L584 292 L518 292 L453 292 L453 221 L448 151 L421 86 L366 43 L298 28 L227 26 L160 48 L110 97 L97 164 L119 229 L176 271 L241 292 L312 292 L382 292 L453 292" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="453" cy="292" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="366" y="214" text-anchor="middle" font-size="62" fill="#6b7280"><tspan x="366" y="214">4. back, round the bowl</tspan></text></svg><text x="16" y="236.26" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ச</text><text x="16" y="248.76" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 191</text><text x="16" y="261.26" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
