<svg xmlns="http://www.w3.org/2000/svg" width="662" height="236.8" viewBox="0 0 662 236.8" role="img" aria-label="How to write ോ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ോ</title><desc>4 frames; frame N shows movements 1 to N of ോ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Sachin Nandakumar, Jayasree: Malayalam handwriting, animated stroke by stroke (github.com/sachn1/jayasree, commit e0c9d57, October 2026), js/src/stroke-data.raw.json: the hand-recorded centre-line strokes for ോ, drawn alone; &quot;Jayasree&quot; by Sachin Nandakumar, CC BY 4.0 &lt;https://github.com/sachn1/jayasree/blob/e0c9d57dd32031c948da4d5f8432aae3e22c5bba/js/src/stroke-data.raw.json&gt;. Source note on variation: Jayasree records ോ drawn alone as two strokes: first the left sign േ, the same way its own record draws it (its top loop, left round the bottom, then up round the lower loop), then, after a lift, ാ from its upper tip clockwise round to the lower tip. Noto Sans Malayalam prints the standalone sign as the േ outline, a placeholder dot where the consonant would sit, and the ാ outline 788 units to the right; the dot is not written, so no stroke draws it, and the coverage check skips exactly that contour for this glyph. The paths are the cited േ and ാ paths, the second shifted with its outline. This is the sign&apos;s own ductus only; it claims no written order against a consonant. Jayasree keeps one recorded gesture per pen-down stroke, so two strokes mean one lift. Only these facts (stroke count, start, order, direction and end) are taken; no recorded coordinate is copied. The stroke data is licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/) as &quot;Jayasree&quot; by Sachin Nandakumar, https://github.com/sachn1/jayasree; this record adapts it, and the pen path is fitted to the bundled Noto Sans Malayalam outline rather than to the recording, which was drawn over the Manjari typeface. One recorder, so confidence is medium.</desc><rect x="0" y="0" width="662" height="236.8" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="118.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="118.3" viewBox="-31 -636 1352 1066.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M364 -12Q300 -12 241.5 5Q183 22 137.5 57.5Q92 93 65.5 148.5Q39 204 39 281Q39 355 66 409Q93 463 139.5 498Q186 533 244.5 549.5Q303 566 366 566Q432 566 474.5 548.5Q517 531 537.5 500.5Q558 470 558 431Q558 388 539 359Q520 330 488.5 315Q457 300 421 300Q368 300 336 318.5Q304 337 290.5 367.5Q277 398 277 432Q277 452 282.5 469Q288 486 294 498L387 517Q368 503 358 480Q348 457 348 434Q348 412 363.5 388.5Q379 365 417 365Q450 365 465 384.5Q480 404 480 429Q480 467 452.5 485Q425 503 389 503Q375 503 362 503Q349 503 335 501Q270 496 223.5 468Q177 440 152.5 392.5Q128 345 128 280Q128 217 153 167Q178 117 224 87.5Q270 58 332 54Q344 53 356.5 52Q369 51 380 51Q406 51 427.5 59Q449 67 462 84Q475 101 475 127Q475 152 460 171Q445 190 411 190Q373 190 357.5 167Q342 144 342 121Q342 97 352 75Q362 53 381 39L289 58Q282 69 276.5 86.5Q271 104 271 126Q271 160 285 189Q299 218 330 236.5Q361 255 412 255Q450 255 482 240.5Q514 226 533.5 197Q553 168 553 125Q553 86 532.5 55Q512 24 470 6Q428 -12 364 -12ZM688 232Q662 232 644 248Q626 264 626 300Q626 338 644 353Q662 368 688 368Q714 368 732 353Q750 338 750 300Q750 264 732 248Q714 232 688 232ZM1251 279Q1251 221 1239.5 169Q1228 117 1201 76Q1174 35 1129.5 11.5Q1085 -12 1019 -12Q968 -12 930.5 4.5Q893 21 867.5 48Q842 75 827 107Q812 139 805 169L892 186Q899 159 912.5 129Q926 99 951.5 78.5Q977 58 1018 58Q1071 58 1102.5 86Q1134 114 1148.5 163.5Q1163 213 1163 278Q1163 343 1148.5 392Q1134 441 