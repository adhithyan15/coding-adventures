<svg xmlns="http://www.w3.org/2000/svg" width="342" height="503.52" viewBox="0 0 342 503.52" role="img" aria-label="How to write ঃ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ঃ</title><desc>2 frames; frame N shows movements 1 to N of ঃ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 47 (ঃ, bisarga; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. All 195 stored prototypes of the bisarga are two pen-down strokes: the upper loop first (193) and the lower loop second (193). 171 begin the upper loop near its top. 151 of the upper loops and 152 of the lower ones turn counterclockwise, the rest clockwise, so the path takes the majority direction for both. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="342" height="503.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="341.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="341.27" viewBox="8 -692 422 960.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M219 349Q159 349 118.5 386.5Q78 424 78 486Q78 548 118.5 585Q159 622 219 622Q279 622 319.5 585Q360 548 360 486Q360 424 319.5 386.5Q279 349 219 349ZM219 414Q251 414 271 433.5Q291 453 291 486Q291 519 271 538Q251 557 219 557Q188 557 167.5 537.5Q147 518 147 486Q147 453 167.5 433.5Q188 414 219 414ZM219 0Q159 0 118.5 37.5Q78 75 78 137Q78 199 118.5 236Q159 273 219 273Q279 273 319.5 236Q360 199 360 137Q360 75 319.5 37.5Q279 0 219 0ZM219 65Q251 65 271 84.5Q291 104 291 137Q291 170 271 189Q251 208 219 208Q188 208 167.5 188.5Q147 169 147 137Q147 104 167.5 84.5Q188 65 219 65Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M219 591 L219 591" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M219 591 L167 577 L128 538 L114 486 L128 434 L166 395 L219 381 L272 395 L310 433 L324 486 L310 538 L272 577 L219 591" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="219" cy="591" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="219" y="173.8" text-anchor="middle" font-size="33.8" fill="#6b7280"><tspan x="219" y="173.8">1. draw the upper loop</tspan><tspan x="219" y="215">counterclockwise from</tspan><tspan x="219" y="256.3">its top</tspan></text></svg><rect x="176" y="60.75" width="150" height="341.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="341.27" viewBox="8 -692 422 960.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M219 349Q159 349 118.5 386.5Q78 424 78 486Q78 548 118.5 585Q159 622 219 622Q279 622 319.5 585Q360 548 360 486Q360 424 319.5 386.5Q279 349 219 349ZM219 414Q251 414 271 433.5Q291 453 291 486Q291 519 271 538Q251 557 219 557Q188 557 167.5 537.5Q147 518 147 486Q147 453 167.5 433.5Q188 414 219 414ZM219 0Q159 0 118.5 37.5Q78 75 78 137Q78 199 118.5 236Q159 273 219 273Q279 273 319.5 236Q360 199 360 137Q360 75 319.5 37.5Q279 0 219 0ZM219 65Q251 65 271 84.5Q291 104 291 137Q291 170 271 189Q251 208 219 208Q188 208 167.5 188.5Q147 169 147 137Q147 104 167.5 84.5Q188 65 219 65Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M219 591 L167 577 L128 538 L114 486 L128 434 L166 395 L219 381 L272 395 L310 433 L324 486 L310 538 L272 577 L219 591" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M219 242 L219 242" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M219 242 L167 228 L128 190 L114 137 L128 84 L166 46 L219 32 L272 46 L310 84 L324 137 L310 190 L272 228 L219 242" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="219" cy="242" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="219" y="173.8" text-anchor="middle" font-size="33.8" fill="#6b7280"><tspan x="219" y="173.8">2. lift, then draw the</tspan><tspan x="219" y="215">lower loop the same way</tspan></text></svg><text x="16" y="415.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic</text><text x="16" y="427.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Character Recognizers 4.0, Bangla recognizer, class 47 (ঃ,</text><text x="16" y="440.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">bisarga; user manual Table 4): stored online-handwriting</text><text x="16" y="452.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="465.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="477.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
