[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-dsp-filters"
version = "0.1.0"
description = "Pure Python FIR and IIR filters, filter design, biquads, and SOS cascades for the DSP layer"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = [
    "coding-adventures-dsp-complex>=0.1.0",
    "coding-adventures-dsp-fft>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "coding-adventures-test-bootstrap>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_filters"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=dsp_filters --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/dsp_filters"]

[tool.coverage.report]
fail_under = 95
show_missing = true
