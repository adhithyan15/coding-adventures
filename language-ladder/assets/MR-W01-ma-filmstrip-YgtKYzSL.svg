4 L80 215 L55 242 L57 278 L75 300 L110 285 L150 285 L200 285 L255 285 L315 285 L370 285 L405 285" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M468 551 L468 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M468 551 L468 475 L468 395 L468 315 L468 235 L468 155 L468 75 L468 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="468" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="306" y="200.3">2. lift, then descend</tspan><tspan x="306" y="273.9">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="226.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="226.22" viewBox="-70 -692 752 1134.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M509 551L509 0L428 0L428 250L207 250L207 213Q207 180 192.5 165.5Q178 151 159 151Q140 151 119 163.5Q98 176 80 195.5Q62 215 50.5 237Q39 259 39 278Q39 296 52.5 308.5Q66 321 100 321L126 321L126 551L0 551L0 622L612 622L612 551L509 551ZM428 551L207 551L207 321L428 321L428 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 551 L166 475 L166 405 L166 350 L167 315 L167 265 L161 220 L135 188 L100 184 L80 215 L55 242 L57 278 L75 300 L110 285 L150 285 L200 285 L255 285 L315 285 L370 285 L405 285" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M468 551 L468 475 L468 395 L468 315 L468 235 L468 155 L468 75 L468 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L610 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="610" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="306" y="200.3">3. lift, then draw the</tspan><tspan x="306" y="273.9">shirorekha</tspan><tspan x="306" y="347.4">left-to-right</tspan></text></svg><text x="16" y="281.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29</text><text x="16" y="293.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">March 2009</text><text x="16" y="306.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
