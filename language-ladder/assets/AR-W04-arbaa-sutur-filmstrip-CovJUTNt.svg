-203 193 -203ZM269 82Q294 82 314.5 86Q335 90 370 104Q358 151 336 187Q314 223 288 240Q267 255 246 255Q225 255 205 239.5Q185 224 171 200Q158 176 158 157Q158 121 187 101.5Q216 82 269 82Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M390 60 L340 45 L285 40 L225 45 L175 80 L145 125 L145 165 L170 215 L210 260 L250 285 L300 285 L345 245 L375 185 L390 115 L390 60 L390 60" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M390 60 L370 -5 L340 -70 L300 -120 L250 -160 L195 -170 L135 -160 L80 -140 L45 -120" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="45" cy="-120" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="225.5" y="384.9" text-anchor="middle" font-size="41.9" fill="#6b7280"><tspan x="225.5" y="384.9">2. continue down and</tspan><tspan x="225.5" y="436">left through the tail</tspan><tspan x="225.5" y="487.1">without lifting</tspan></text></svg><text x="16" y="331.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Introduction to Arabic: Egyptian Arabic</text><text x="16" y="343.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">for first-year students, Alphabet ه و ي, independent Waw at</text><text x="16" y="356.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">00:45.7–00:46.9 (University of Oregon Libraries Open</text><text x="16" y="368.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2023)</text><text x="16" y="381.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="393.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
