[package]
name = "x509-rsa-reviewed-anchor-self-signature-binding"
version = "0.1.0"
edition = "2021"
description = "Bind routed repository-owned RSA self-signature evidence to one exact reviewed Web PKI root"

[dependencies]
x509-rsa-signature-routing = { path = "../x509-rsa-signature-routing" }
x509-webpki-root-anchor-selection = { path = "../x509-webpki-root-anchor-selection" }

[dev-dependencies]
der-asn1 = { path = "../der-asn1" }
rsa-public-operation = { path = "../rsa-public-operation" }
x509-certificate = { path = "../x509-certificate" }
x509-certificate-policy = { path = "../x509-certificate-policy" }
x509-rsa-algorithm-policy = { path = "../x509-rsa-algorithm-policy" }
x509-rsa-public-key = { path = "../x509-rsa-public-key" }
