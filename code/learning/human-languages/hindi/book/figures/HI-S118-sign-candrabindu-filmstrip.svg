<svg xmlns="http://www.w3.org/2000/svg" width="502" height="288.41" viewBox="0 0 502 288.41" role="img" aria-label="How to write ँ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ँ</title><desc>3 frames; frame N shows movements 1 to N of ँ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 59 (ँ, candrabindu): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 79 of the 82 stored prototypes of the candrabindu (96%) are two pen-down strokes. In 76 of the 82 the crescent comes first and the dot second; all 79 two-stroke crescents run from left to right, turning anticlockwise, and 78 put the dot above the crescent. The dot&apos;s own direction is not settled (48 of the 82 end lower than they start), so it is drawn as a short downward dab. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant or the headline; the book draws the sign alone and composes no Devanagari word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Devanagari outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="288.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="169.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="169.91" viewBox="-401 -966 516 584.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-192 847Q-192 868 -177.5 882Q-163 896 -143 896Q-123 896 -108.5 882Q-94 868 -94 847Q-94 826 -108.5 811.5Q-123 797 -143 797Q-163 797 -177.5 811.5Q-192 826 -192 847ZM45 848Q27 754 -21.5 716Q-70 678 -143 678Q-216 678 -264.5 716Q-313 754 -331 848L-262 870Q-251 797 -220.5 769.5Q-190 742 -143 742Q-96 742 -65 769.5Q-34 797 -24 870L45 848Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-300 850 L-300 850" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-300 850 L-290 800 L-265 760 L-220 725" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-220" cy="725" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-143" y="-496.7" text-anchor="middle" font-size="41.3" fill="#6b7280"><tspan x="-143" y="-496.7">1. start at the</tspan><tspan x="-143" y="-446.3">crescent&apos;s left tip and</tspan><tspan x="-143" y="-395.9">curve down</tspan></text></svg><rect x="176" y="42" width="150" height="169.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="169.91" viewBox="-401 -966 516 584.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-192 847Q-192 868 -177.5 882Q-163 896 -143 896Q-123 896 -108.5 882Q-94 868 -94 847Q-94 826 -108.5 811.5Q-123 797 -143 797Q-163 797 -177.5 811.5Q-192 826 -192 847ZM45 848Q27 754 -21.5 716Q-70 678 -143 678Q-216 678 -264.5 716Q-313 754 -331 848L-262 870Q-251 797 -220.5 769.5Q-190 742 -143 742Q-96 742 -65 769.5Q-34 797 -24 870L45 848Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-300 850 L-290 800 L-265 760 L-220 725 L-220 725" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-220 725 L-160 712 L-100 725 L-55 760 L-30 800 L-20 850" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-20" cy="850" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-143" y="-496.7" text-anchor="middle" font-size="41.3" fill="#6b7280"><tspan x="-143" y="-496.7">2. round the bottom and</tspan><tspan x="-143" y="-446.3">up to the right tip</tspan></text></svg><rect x="336" y="42" width="150" height="169.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="169.91" viewBox="-401 -966 516 584.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-192 847Q-192 868 -177.5 882Q-163 896 -143 896Q-123 896 -108.5 882Q-94 868 -94 847Q-94 826 -108.5 811.5Q-123 797 -143 797Q-163 797 -177.5 811.5Q-192 826 -192 847ZM45 848Q27 754 -21.5 716Q-70 678 -143 678Q-216 678 -264.5 716Q-313 754 -331 848L-262 870Q-251 797 -220.5 769.5Q-190 742 -143 742Q-96 742 -65 769.5Q-34 797 -24 870L45 848Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-300 850 L-290 800 L-265 760 L-220 725 L-160 712 L-100 725 L-55 760 L-30 800 L-20 850" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M-152 872 L-152 872" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-152 872 L-152 851 L-152 830" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-152" cy="830" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-143" y="-496.7" text-anchor="middle" font-size="41.3" fill="#6b7280"><tspan x="-143" y="-496.7">3. lift, then dab the</tspan><tspan x="-143" y="-446.3">dot above the crescent</tspan></text></svg><text x="16" y="224.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="237.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Devanagari recognizer, class 59 (ँ, candrabindu): stored online-handwriting prototypes</text><text x="16" y="249.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">from native writers (MIT licence, 2012)</text><text x="16" y="262.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
