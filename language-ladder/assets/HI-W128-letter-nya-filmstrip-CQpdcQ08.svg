 364 487 287Q487 237 469 204Q451 171 422.5 152Q394 133 361.5 125.5Q329 118 300 118Q243 118 194 141.5Q145 165 104 213.5Q63 262 29 338L98 365Q139 272 183.5 232Q228 192 294 192Q349 192 380 218Q411 244 411 287Q411 333 382.5 353Q354 373 313 373Q288 373 265 366Q242 359 219 348L192 420Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M215 420 L255 438 L305 442 L355 432 L400 410 L435 380 L455 345 L445 315 L430 285 L418 250 L400 220 L365 190 L320 165 L270 150 L220 145 L180 155 L145 175 L118 202 L95 230 L78 260 L62 290 L48 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M415 275 L415 275" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M415 275 L460 270 L505 275 L545 300 L575 330 L610 350 L610 410 L610 475 L610 551" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="610" cy="551" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378" y="211.8" text-anchor="middle" font-size="71.8" fill="#6b7280"><tspan x="378" y="211.8">2. lift, then sweep the</tspan><tspan x="378" y="299.4">shoulder right and rise</tspan><tspan x="378" y="387">to the headline</tspan></text></svg><rect x="336" y="42" width="150" height="184.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="184.84" viewBox="-70 -692 896 1104.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M653 551L653 0L572 0L572 551L0 551L0 622L756 622L756 551L653 551ZM646 290Q615 269 576 257Q537 245 484 245Q472 245 465.5 246Q459 247 448 249L437 326Q447 322 461 318.5Q475 315 493 315Q549 315 584.5 339Q620 363 646 391L646 290ZM192 420Q223 434 255.5 440Q288 446 315 446Q389 446 438 405Q487 364 487 287Q487 237 469 204Q451 171 422.5 152Q394 133 361.5 125.5Q329 118 300 118Q24