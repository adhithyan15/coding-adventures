 fill="#64748b">South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxv:</text><text x="16" y="225.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">movements 1-4 for ഖ, written by hand by Thomas Joseph</text><text x="16" y="238.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
