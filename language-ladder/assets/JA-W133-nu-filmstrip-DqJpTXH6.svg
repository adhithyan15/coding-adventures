<svg xmlns="http://www.w3.org/2000/svg" width="822" height="283.4" viewBox="0 0 822 283.4" role="img" aria-label="How to write ぬ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ぬ</title><desc>5 frames; frame N shows movements 1 to N of ぬ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0306c.svg, hiragana ぬ (U+306C HIRAGANA LETTER NU), two stroke paths kvg:0306c-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0306c.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short diagonal drawn from the upper left down to the right; s2 starts at the top, descends left across s1, loops round the lower left, rises and arches over the top, comes down the right side, closes a small loop at the bottom and ends in a flick to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="283.4" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="177.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="177.4" viewBox="5 -853 1031 1219.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M590 780Q586 762 583.5 739Q581 716 579 701Q573 648 565 590.5Q557 533 544.5 475Q532 417 513 361Q489 294 455.5 231Q422 168 382 118Q342 68 296.5 39.5Q251 11 202 11Q167 11 138 29Q109 47 92 82Q75 117 75 165Q75 243 98.5 307Q122 371 158 421Q186 462