0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="384" y="199.1" text-anchor="middle" font-size="59.1" fill="#6b7280"><tspan x="384" y="199.1">2. descend diagonally to</tspan><tspan x="384" y="271.2">the central valley</tspan></text></svg><rect x="336" y="42" width="150" height="197.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="197.15" viewBox="15 -606 738 970" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L205 536L383 106L565 536L683 536L683 0L601 0L601 342Q601 363 602.5 386Q604 409 606 431L603 431L417 0L345 0L167 431L164 431Q167 386 167 339L167 0L85 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 25 L126 140 L126 260 L126 380 L126 500 L185 500 L230 400 L275 290 L325 170 L380 50 L380 50" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M380 50 L435 170 L490 290 L535 400 L585 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="585" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="384" y="199.1" text-anchor="middle" font-size="59.1" fill="#6b7280"><tspan x="384" y="199.1">3. rise diagonally to</tspan><tspan x="384" y="271.2">the second apex</tspan></text></svg><rect x="496" y="42" width="150" height="197.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="197.15" viewBox="15 -606 738 970" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L205 536L383 106L565 536L683 536L683 0L601 0L601 342Q601 363 602.5 386Q604 409 606 431L603 431L417 0L345 0L167 431L164 431Q167 386 167 339L167 0L85 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 25 L126 140 L126 260 L126 380 L126 500 L185 500 L230 400 L275 290 L325 170 L380 50 L435 170 L490 290 L535 400 L585 500 L585 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M585 500 L642 500 L642 380 L642 260 L642 140 L642 25" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="642" cy="25" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="384" y="199.1" text-anchor="middle" font-size="59.1" fill="#6b7280"><tspan x="384" y="199.1">4. descend the right</tspan><tspan x="384" y="271.2">stem to the baseline</tspan></text></svg><text x="16" y="252.15" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase м demonstration,</text><text x="16" y="264.65" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">05:26–05:31, YouTube, 5 February 2013</text><text x="16" y="277.15" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
