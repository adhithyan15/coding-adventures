[package]
name = "iir-to-wasm"
version = "0.37.0"
edition = "2021"
description = "IIR → WASM backend — lowers IIRModule to WasmModule.  v0.36.0 (LANG-FULL E4-dyn E4d-BA-arr): `array<str>` element support — a `str` array element is a 4-byte i32 handle (`i32.load`/`i32.store`, 4-byte stride via `wasm_array_elem`), so a BASIC string array is a flat block of i32 handles; a folded str literal stored via `array_set` is promoted to a runtime-block handle (else the element would store 0 and a later read would trap); the validator accepts `str`-typed `array_get`/`array_set`.  v0.30.0 (LANG-FULL E4-dyn E4d-3b): a runtime string arriving as a function RETURN VALUE / call result / parameter is now first-class — print_str/str_len take the runtime i32.load-the-length path for ANY string lacking a compile-time literal entry (not only promoted slots); str boundaries already type as i32 handles, so an ALGOL string procedure's returned string prints/measures correctly.  v0.29.0 (LANG-FULL E4-dyn E4d-3): runtime (branch-selected) strings — a str var assigned by str_const in >1 basic block is promoted to a runtime i32 handle = the offset of a length-prefixed block [i32 len][bytes] in linear memory; str_const stores that offset and print_str reads the length back with i32.load before calling env.__print_str(ptr,len). Single-assignment strings keep the folded literal fast path.  v0.27.0 (LANG-FULL boolean): boolean i64/i32 width-coherence for and/or/xor — upgrades to i64 arithmetic when either operand local is i64, widens narrower operand with i64.extend_i32_u before the op, wraps result back to i32 when dest slot is bool.  v0.21.0 (LANG-FULL E4): str_index over direct str_const literals emits a bounds-checked i32.load8_u byte load from string data.  v0.20.0 (LANG-FULL E4): str_len/str_eq/str_concat over direct str_const literals materialise results from string data metadata.  v0.19.0 (LANG-FULL E4/BA4): str_const + print_str literal output via linear-memory data segments and env.__print_str(ptr,len).  v0.18.0 (LANG-FULL BA1-WASM): dispatch-loop fix — append a sentinel empty block when the last basic block contains jmp_if_true/jmp_if_false, so the GOSUB RETURN dispatch chain is in the second-to-last block where the loop-restart depth formula works correctly (eliminates the StackUnderflow trap).  v0.17.0 (E8 conversions): int_to_real/real_to_int_trunc/real_to_int_floor.  v0.16.0 (E5): array<T> over linear memory (length-prefixed, explicit bounds trap).  v0.15.0 (E2): narrow unsigned types ride the i64 register model + mask.  v0.13.0 (Brainfuck): byte-tape ops over linear memory."

[lib]
name = "iir_to_wasm"
path = "src/lib.rs"

[dependencies]
interpreter-ir      = { path = "../interpreter-ir" }
wasm-types          = { path = "../wasm-types" }
wasm-module-encoder = { path = "../wasm-module-encoder" }
wasm-leb128         = { path = "../wasm-leb128" }
codegen-core        = { path = "../codegen-core" }

[dev-dependencies]
# Executes the lowered wasm to prove the width-wrap end-to-end (E2).
wasm-runtime = { path = "../wasm-runtime" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"

[[test]]
name = "width_wrap"
path = "tests/width_wrap.rs"
