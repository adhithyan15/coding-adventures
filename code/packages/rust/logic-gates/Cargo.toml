[package]
name = "logic-gates"
version = "0.1.0"
edition = "2021"
description = "Logic gates and sequential circuits — foundation of all digital hardware"

[dependencies]
transistors = { path = "../transistors" }

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
# The generated evidence harness hashes the spec and the source tree.
coding_adventures_sha256 = { path = "../sha256" }
# VER08b: runtime capability conformance (a sandboxed run of the whole public API).
capability-runtime-conformance = { path = "../capability-runtime-conformance" }

# Generated from code/specs/logic-gates.warrant (VER04h): examples, exhaustive
# suites, property suites, fuzz suites and sabotage controls.
[[test]]
name = "warrant_evidence"
path = "tests/warrant_evidence.rs"
harness = false

# VER08b: runs the full public API (gates and combinational blocks) inside a
# process sandboxed, from required_capabilities.json, to the minimal baseline
# (the library is pure).
[[test]]
name = "runtime_capability"
path = "tests/runtime_capability.rs"
harness = false
