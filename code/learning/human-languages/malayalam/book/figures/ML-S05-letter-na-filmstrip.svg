 145 768.5 189.5Q784 234 784 292Q784 350 765 395.5Q746 441 711 467.5Q676 494 629 494Q588 494 561.5 479.5Q535 465 519 436Q506 414 502 382Q498 350 498 291L498 0L412 0L412 291Q412 348 408 381Q404 414 390 436Q373 465 347 479.5Q321 494 284 494Q238 494 202.5 467.5Q167 441 147 395.5Q127 350 127 292Q127 232 143.5 187Q160 142 187 110Q214 78 247 55L189 -8Q146 27 112 68.5Q78 110 58.5 164.5Q39 219 39 292Q39 373 69.5 434.5Q100 496 156 531Q212 566 288 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M203 52 L150 97 L111 154 L90 222 L87 292 L90 362 L115 427 L158 482 L217 518 L287 528 L355 516 L410 473 L455 420 L455 344 L455 268 L455 192 L455 116 L455 40 L455 114 L455 189 L455 263 L455 338 L455 412 L455 412" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M455 412 L498 467 L550 513 L618 528 L688 521 L749 488 L793 434 L818 369 L827 299 L824 229 L803 162 L769 101 L723 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="723" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="455.5" y="226" text-anchor="middle" font-size="78" fill="#6b7280"><tspan x="455.5" y="226">4. sweep over the right</tspan><tspan x="455.5" y="321.2">arch to its foot</tspan></text></svg><text x="16" y="206.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows</text><text x="16" y="219.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">for ന in data/NA.png: green start, blue turn, red end (GPL-3.0, 2013)</text><text x="16" y="231.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
