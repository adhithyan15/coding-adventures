" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="945" cy="357" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="303.5" text-anchor="middle" font-size="83.5" fill="#6b7280"><tspan x="502" y="303.5">5. lift, then draw the</tspan><tspan x="502" y="405.4">middle horizontal héng</tspan><tspan x="502" y="507.2">from left to right</tspan></text></svg><text x="16" y="254.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 子.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22</text><text x="16" y="266.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="279.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
