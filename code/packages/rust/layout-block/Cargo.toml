[package]
name = "layout-block"
version = "0.3.0"
edition = "2021"
description = "UI07 block-and-inline flow layout. Takes a LayoutNode tree + Constraints + TextMeasurer and produces a PositionedNode tree. The layout model underlying Markdown / rich-text document rendering."

[dependencies]
layout-ir = { path = "../layout-ir" }
layout-inline = { path = "../layout-inline" }
layout-float = { path = "../layout-float" }
layout-flexbox = { path = "../layout-flexbox" }
layout-grid = { path = "../layout-grid" }
layout-table = { path = "../layout-table" }
layout-positioned = { path = "../layout-positioned" }
layout-replaced = { path = "../layout-replaced" }
layout-generated = { path = "../layout-generated" }
