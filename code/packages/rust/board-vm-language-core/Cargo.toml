[package]
name = "board-vm-language-core"
version = "0.1.0"
edition = "2021"
description = "Stable Rust-owned Board VM host protocol boundary for language frontends"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
board-vm-bluetooth = { path = "../board-vm-bluetooth" }
board-vm-client = { path = "../board-vm-client" }
board-vm-esp-rom = { path = "../board-vm-esp-rom" }
board-vm-host = { path = "../board-vm-host" }
board-vm-protocol = { path = "../board-vm-protocol" }
board-vm-targets = { path = "../board-vm-targets" }

[dev-dependencies]
board-vm-loopback = { path = "../board-vm-loopback" }
