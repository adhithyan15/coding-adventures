L450 315 L450 235 L450 155 L450 75 L450 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L590 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="590" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="297" y="198.8" text-anchor="middle" font-size="58.8" fill="#6b7280"><tspan x="297" y="198.8">4. lift, then draw the</tspan><tspan x="297" y="270.5">shirorekha left-to-right</tspan></text></svg><text x="16" y="270.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-य-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009</text><text x="16" y="283.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
