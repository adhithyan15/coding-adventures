e="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M510 551 L510 530 L510 505 L510 480" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L95 585 L185 585 L275 585 L365 585 L455 585 L545 585 L635 585 L715 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="715" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="357.5" y="208.5" text-anchor="middle" font-size="68.5" fill="#6b7280"><tspan x="357.5" y="208.5">3. lift, then draw the</tspan><tspan x="357.5" y="292.1">shirorekha left-to-right</tspan></text></svg><text x="16" y="261.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-छ-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="273.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="286.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
