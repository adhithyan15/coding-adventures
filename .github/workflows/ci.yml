name: Venture SwiftUI zoom diagnostic (never merge)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic workflow commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: venture-zoom-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  macos-zoom:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Guard workflow identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$EVENT_SHA"
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Checkout exact instrumented source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 635df1be42522aaed21cb0f20fa83a9b39a2dd7e
          path: source
          persist-credentials: false
      - name: Verify source and harness identities
        env:
          DIAGNOSTIC_ARTIFACT_ROOT: ${{ runner.temp }}/venture-zoom-artifacts
        run: |
          set -euo pipefail
          test "$(git -C diagnostic rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "635df1be42522aaed21cb0f20fa83a9b39a2dd7e"
          test "$(git -C source rev-parse HEAD^)" = "a67e52726e8f4c88eae957ba620bc4f14af98e86"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "ab659b7e802e43397b0315875d910906536ea8f5"
          test "$(git -C source rev-parse HEAD:code/programs/mosaic/venture-browser/host/swiftui/MosaicHost.swift)" = "ec5a1777a9df5c7701358ac213dc0e0d1e0cffd0"
          test "$(git -C source rev-parse HEAD:code/packages/rust/venture-browser-macos/tests/swiftui_project_launch.rs)" = "c0668ee12275982d9ff6478ce488322e39e03283"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
          test "$(shasum -a 256 diagnostic/.github/diagnostics/venture-zoom.py | awk '{print $1}')" = "773d3003797954536d6b51d165db956be7dc3330a27d09f336484a7e95086e47"
          python3 --version
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          git -C source show -s --format='source=%H tree=%T parents=%P'
      - name: Install Rust version from the failed job
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0
      - name: Run one exact SwiftUI acceptance test
        working-directory: source/code/packages/rust
        env:
          VENTURE_UI_ZOOM_DIAGNOSTIC: '1'
          DIAGNOSTIC_ARTIFACT_ROOT: ${{ runner.temp }}/venture-zoom-artifacts
          TMPDIR: ${{ runner.temp }}/venture-zoom-test-tmp
          CARGO_TERM_COLOR: never
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          rustc -Vv
          cargo --version
          python3 "$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/venture-zoom.py"
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: venture-zoom-${{ github.run_id }}
          path: ${{ runner.temp }}/venture-zoom-artifacts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
