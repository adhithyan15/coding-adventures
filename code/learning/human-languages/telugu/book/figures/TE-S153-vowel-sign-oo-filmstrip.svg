<svg xmlns="http://www.w3.org/2000/svg" width="822" height="256.56" viewBox="0 0 822 256.56" role="img" aria-label="How to write ో: one unbroken stroke · 5 movements"><title>Writing ో</title><desc>5 frames; frame N shows movements 1 to N of ో (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 61 (ో, oo sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 301 of the 320 stored prototypes of the oo sign (94%) are one pen-down stroke. 299 of the 301 start in the left third and 277 move up first; 199 go round the loop on the right clockwise (27 the other way); 295 end in the right half and 222 in the top third, at the tip of the hook that rises out of the loop. The bundled font curls the left bowl in at its foot, so the path starts there and rounds it up its left side. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="256.56" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width