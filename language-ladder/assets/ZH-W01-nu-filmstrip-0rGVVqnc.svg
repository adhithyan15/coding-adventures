e-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M717 550 L700 490 L680 430 L650 360 L615 295 L570 235 L520 180 L460 125 L390 75 L310 30 L220 -10 L130 -45" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M70 561 L70 561" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M70 561 L180 561 L300 561 L420 561 L540 561 L660 561 L780 561 L890 561 L940 561" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="940" cy="561" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="495" y="302.2" text-anchor="middle" font-size="83.2" fill="#6b7280"><tspan x="495" y="302.2">4. lift, then draw the</tspan><tspan x="495" y="403.7">middle horizontal héng</tspan><tspan x="495" y="505.2">from left to right</tspan></text></svg><text x="16" y="279.83" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 女.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="292.33" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="304.83" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
