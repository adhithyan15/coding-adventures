<svg xmlns="http://www.w3.org/2000/svg" width="662" height="311.2" viewBox="0 0 662 311.2" role="img" aria-label="How to write ब: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ब</title><desc>4 frames; frame N shows movements 1 to N of ब (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari b ब.gif’, strokes 1–4, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_b_%E0%A4%AC.gif&gt;. Source note on variation: The 13-frame animation shows four ordered pen-down runs: frames 0–6 start at the body&apos;s upper-right junction and circle counterclockwise around the oval to its lower-right junction; frames 7–8 restart at the right stem&apos;s headline junction and descend top-to-bottom; frame 9 restarts at the body&apos;s upper-left interior and draws the inner diagonal down-right; frames 10–12 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The spatial restarts at frames 7, 9, and 10 delimit the four runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 37, independently shows the same oval body, right stem, inner diagonal, and headline buildup and directions. This learner path follows that sourced four-run form and fits its oval and diagonal to Noto Sans Devanagari; everyday handwriting may join or simplify the oval differently.</desc><rect x="0" y="0" width="662" height="311.2" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="217.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.7" viewBo