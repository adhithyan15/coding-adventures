<svg xmlns="http://www.w3.org/2000/svg" width="822" height="333.13" viewBox="0 0 822 333.13" role="img" aria-label="How to write 出: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 出</title><desc>5 frames; frame N shows movements 1 to N of 出 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 出.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%87%BA.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 出. Medians 1–2 draw the upper half: a vertical that turns right along the middle without lifting, then its right side; median 3 draws the long vertical down the middle; medians 4–5 draw the lower half the same way, its right side last. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the two turns and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="333.13" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="227.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="227.13" viewBox="34 -909 931 1409.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M457 839L539 839L539 19L457 19L457 839ZM814 341L895 341L895 -78L814 -78L814 341ZM150 749L228 749L228 477L774 477L774 750L855 750L855 404L150 404L150 749ZM104 341L187 341L187 54L853 54L853 -21L104 -21L104 341Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M188 729 L188 729" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M188 729 L188 440 L827 440" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="827" cy="440" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="499.5" y="292.6" text-anchor="middle" font-size="74.6" fill="#6b7280"><tspan x="499.5" y="292.6">1. draw the upper left</tspan><tspan x="499.5" y="383.6">side and turn right</tspan><tspan x="499.5" y="474.6">along the middle</tspan></text></svg><rect x="176" y="42" width="150" height="227.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="227.13" viewBox="34 -909 931 1409.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M457 839L539 839L539 19L457 19L457 839ZM814 341L895 341L895 -78L814 -78L814 341ZM150 749L228 749L228 477L774 477L774 750L855 750L855 404L150 404L150 749ZM104 341L187 341L187 54L853 54L853 -21L104 -21L104 341Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M188 729 L188 440 L827 440" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M814 729 L814 729" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M814 729 L814 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="814" cy="430" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x=