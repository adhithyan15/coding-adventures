name: Deploy ML Learning Visualizer

on:
  push:
    branches: [main]
    paths:
      - "code/programs/typescript/ml-learning-visualizer/**"
      - "code/specs/fixtures/neural-learning-v1/**"
      - "code/specs/fixtures/optimization-learning-v1/**"
      - "code/specs/fixtures/convolution-learning-v1/**"
      - "code/specs/fixtures/convolution-training-v1/**"
      - "code/specs/fixtures/tiny-image-cnn-v1/**"
      - "code/specs/fixtures/residual-receptive-v1/**"
      - "code/specs/fixtures/recurrent-unroll-v1/**"
      - "code/specs/fixtures/recurrent-bptt-v1/**"
      - "code/specs/fixtures/gated-recurrent-v1/**"
      - "code/specs/fixtures/attention-qkv-v1/**"
      - "code/specs/fixtures/attention-softmax-v1/**"
      - "code/specs/fixtures/multi-head-attention-v1/**"
      - "code/specs/fixtures/tiny-decoder-training-v1/**"
      - "code/specs/fixtures/two-number-autoencoder-v1/**"
      - "code/specs/fixtures/variational-autoencoder-v1/**"
      - "code/specs/fixtures/one-dimensional-gan-v1/**"
      - "code/specs/fixtures/one-dimensional-diffusion-v1/**"
      - "code/specs/fixtures/hopfield-associative-memory-v1/**"
      - "code/specs/fixtures/tiny-message-passing-v1/**"
      - "code/specs/fixtures/graph-convolution-attention-v1/**"
      - "code/specs/fixtures/initialization-activation-distribution-v1/**"
      - "code/specs/fixtures/gradient-flow-v1/**"
      - "code/specs/fixtures/training-stabilizers-v1/**"
      - "code/specs/fixtures/tensor-broadcasting-v1/**"
      - "code/specs/fixtures/dynamic-autograd-v1/**"
      - "code/specs/fixtures/gradient-accumulation-v1/**"
      - "code/specs/fixtures/forward-graph-lowering-v1/**"
      - "code/specs/fixtures/backward-optimizer-lowering-v1/**"
      - "code/specs/fixtures/backend-parity-v1/**"
      - "code/specs/fixtures/precision-residency-v1/**"
      - "code/specs/fixtures/reference-validation-v1/**"
      - "code/scripts/validate_*_labs.py"
      - "code/scripts/validate_reference_fixture_catalog.py"
      - "code/packages/typescript/cli-builder/**"
      - "code/packages/typescript/directed-graph/**"
      - "code/packages/typescript/state-machine/**"
      - "code/packages/typescript/grammar-tools/**"
      - "code/packages/typescript/lexer/**"
      - "code/packages/typescript/parser/**"
      - "code/packages/typescript/lattice-lexer/**"
      - "code/packages/typescript/lattice-parser/**"
      - "code/packages/typescript/lattice-ast-to-css/**"
      - "code/packages/typescript/lattice-transpiler/**"
      - "code/packages/typescript/matrix/**"
      - "code/packages/typescript/matrix-rust-napi/**"
      - "code/packages/typescript/multi-directed-graph/**"
      - "code/packages/typescript/neural-graph-vm/**"
      - "code/packages/typescript/neural-network/**"
      - "code/packages/typescript/paint-instructions/**"
      - "code/packages/typescript/paint-vm/**"
      - "code/packages/typescript/paint-vm-svg/**"
      - "code/packages/typescript/pixel-container/**"
      - "code/packages/typescript/two-layer-network/**"
      - ".github/workflows/deploy-ml-learning.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate complete neural fixture catalog
        run: python3 code/scripts/validate_reference_fixture_catalog.py

      - name: Install local source dependencies
        run: |
          cd code/packages/typescript/directed-graph && npm install --omit=dev --ignore-scripts
          cd ../state-machine && npm install --omit=dev --ignore-scripts
          cd ../cli-builder && npm install --omit=dev --ignore-scripts
          cd ../grammar-tools && npm install --omit=dev --ignore-scripts
          cd ../lexer && npm install --omit=dev --ignore-scripts
          cd ../parser && npm install --omit=dev --ignore-scripts
          cd ../lattice-lexer && npm install --omit=dev --ignore-scripts
          cd ../lattice-parser && npm install --omit=dev --ignore-scripts
          cd ../lattice-ast-to-css && npm install --omit=dev --ignore-scripts
          cd ../lattice-transpiler && npm install --omit=dev --ignore-scripts
          cd ../matrix-rust-napi && npm install --omit=dev --ignore-scripts
          cd ../matrix && npm install --omit=dev --ignore-scripts
          cd ../multi-directed-graph && npm install --omit=dev --ignore-scripts
          cd ../neural-network && npm install --omit=dev --ignore-scripts
          cd ../neural-graph-vm && npm install --omit=dev --ignore-scripts
          cd ../pixel-container && npm install --omit=dev --ignore-scripts
          cd ../paint-instructions && npm install --omit=dev --ignore-scripts
          cd ../paint-vm && npm install --omit=dev --ignore-scripts
          cd ../paint-vm-svg && npm install --omit=dev --ignore-scripts
          cd ../two-layer-network && npm install --omit=dev --ignore-scripts

      - name: Install app dependencies
        run: |
          cd code/programs/typescript/ml-learning-visualizer
          npm install

      - name: Build
        run: |
          cd code/programs/typescript/ml-learning-visualizer
          npm run build

      - name: Deploy to GitHub Pages (ml-learning/ subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: code/programs/typescript/ml-learning-visualizer/dist
          destination_dir: ml-learning
          keep_files: true
