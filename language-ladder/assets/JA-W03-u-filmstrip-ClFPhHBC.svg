<svg xmlns="http://www.w3.org/2000/svg" width="502" height="337.34" viewBox="0 0 502 337.34" role="img" aria-label="How to write う: 2 strokes · 1 pen lift · 3 movements"><title>Writing う</title><desc>3 frames; frame N shows movements 1 to N of う (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03046.svg, hiragana う (U+3046 HIRAGANA LETTER U), two stroke paths kvg:03046-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03046.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short top stroke drawn left to right, ending in a small turn down that the print glyph does not show; s2 starts at the left, rises to the right along the top, rounds the right side and sweeps away to the lower left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="502" height="337.34" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="231.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="231.34" viewBox="96 -853 779 1201.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M720 333Q720 375 698.5 407.5Q677 440 638.5 458.5Q600 477 549 477Q491 477 440 468Q389 459 347.5 447Q306 435 276 427Q253 420 231.5 412Q210 404 192 396L166 489Q187 491 211.5 495Q236 499 258 504Q294 512 341.5 523Q389 534 444.5 543Q500 552 557 552Q628 552 684 526Q740 500 772.5 450.5Q805 401 805 330Q805 248 771 184.5Q737 121 675.5 74.5Q614 28 531 -3Q448 -34 351 -48L306 28Q396 39 472 63.5Q548 88 603.5 125Q659 162 689.5 214Q720 266 720 333ZM300 783Q341 774 398.5 766Q456 758 517.5 751.5Q579 745 633.5 741Q688 737 725 737L713 660Q671 663 615.5 667.5Q560 672 500.5 678.5Q441 685 385.5 692.5Q330 700 287 707L300 783Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M330 740 L330 740" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M330 740 L400 728 L470 720 L541 712 L611 706 L682 700" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="682" cy="700" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="485.5" y="250.4" text-anchor="middle" font-size="62.4" fill="#6b7280"><tspan x="485.5" y="250.4">1. draw the short top</tspan><tspan x="485.5" y="326.5">stroke to the right</tspan></text></svg><rect x="176" y="42" width="150" height="231.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="231.34" viewBox="96 -853 779 1201.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M720 333Q720 375 698.5 407.5Q677 440 638.5 458.5Q600 477 549 477Q491 477 440 468Q389 459 347.5 447Q306 435 276 427Q253 420 231.5 412Q210 404 192 396L166 489Q187 491 211.5 495Q236 499 258 504Q294 512 341.5 523Q389 534 444.5 543Q500 552 557 552Q628 552 684 526Q740 500 772.5 450.5Q805 401 805 330Q805 248 771 184.5Q737 121 675.5 74.5Q614 28 531 -3Q448 -34 351 -48L306 28Q396 39 472 63.5Q548 88 603.5 125Q659 162 689.5 214Q720 266 720 333ZM300 783Q341 774 398.5 766Q456 758 517.5 751.5Q579 745 633.5 741Q688 737 725 737L713 660Q671 663 615.5 667.5Q560 672 500.5 678.5Q441 685 385.5 692.5Q330 700 287 707L300 783Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M330 740 L400 728 L470 720 L541 712 L611 706 L682 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M214 456 L214 456" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M214 456 L285 469 L355 488 L426 502 L498 512 L571 512 L642 500 L642 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="642" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="485.5" y="250.4" text-anchor="middle" font-size="62.4" fill="#6b7280"><tspan x="485.5" y="250.4">2. rise to the right</tspan><tspan x="485.5" y="326.5">along the top</tspan></text></svg><rect x="336" y="42" width="150" height="231.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="231.34" viewBox="96 -853 779 1201.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M720 333Q720 375 698.5 407.5Q677 440 638.5 458.5Q600 477 549 477Q491 477 440 468Q389 459 347.5 447Q306 435 276 427Q253 420 231.5 412Q210 404 192 396L166 489Q187 491 211.5 495Q236 499 258 504Q294 512 341.5 523Q389 534 444.5 543Q500 552 557 552Q628 552 684 526Q740 500 772.5 450.5Q805 401 805 330Q805 248 771 184.5Q737 121 675.5 74.5Q614 28 531 -3Q448 -34 351 -48L306 28Q396 39 472 63.5Q548 88 603.5 125Q659 162 689.5 214Q720 266 720 333ZM300 783Q341 774 398.5 766Q456 758 517.5 751.5Q579 745 633.5 741Q688 737 725 737L713 660Q671 663 615.5 667.5Q560 672 500.5 678.5Q441 685 385.5 692.5Q330 700 287 707L300 783Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M330 740 L400 728 L470 720 L541 712 L611 706 L682 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M214 456 L285 469 L355 488 L426 502 L498 512 L571 512 L642 500 L642 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M642 500 L704 464 L747 407 L758 336 L755 265 L730 198 L684 142 L631 94 L568 58 L502 31 L433 10 L362 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="362" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="485.5" y="250.4" text-anchor="middle" font-size="62.4" fill="#6b7280"><tspan x="485.5" y="250.4">3. curve down and sweep</tspan><tspan x="485.5" y="326.5">to the lower left</tspan></text></svg><text x="16" y="286.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/03046.svg, hiragana う (U+3046 HIRAGANA LETTER U), two</text><text x="16" y="298.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">stroke paths kvg:03046-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="311.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
