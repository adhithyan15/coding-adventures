<svg xmlns="http://www.w3.org/2000/svg" width="822" height="273.11" viewBox="0 0 822 273.11" role="img" aria-label="How to write ఐ: 5 strokes · 4 pen lifts · 5 movements"><title>Writing ఐ</title><desc>5 frames; frame N shows movements 1 to N of ఐ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఐ packaged tracing guide res/drawable/dot_stroke_v_11_ai.png, movements 1–5 (version 2.6) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers five disconnected directional movements, each drawn as a separate pen-down run: movements 1–3 construct the central and lower body before movements 4–5 add the two upper arches from right to left. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="822" height="273.11" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="167.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="167.11" viewBox="-34 -570 795 885.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M496 -12Q448 -12 412.5 6Q377 24 347 56Q317 88 284 131Q255 171 234 189Q213 207 183 207Q155 207 136.5 189Q118 171 118 136Q118 105 137 84Q156 63 190 63Q225 63 247.5 83Q270 103 286 141L339 81Q320 54 299 33Q278 12 251.5 0Q225 -12 186 -12Q133 -12 101 10Q69 32 54.5 66.5Q40 101 40 138Q40 182 59 214Q78 246 110 264Q142 282 181 282Q217 282 245 269.5Q273 257 300 230.5Q327 204 359 161Q387 125 407.5 104.5Q428 84 450 75.5Q472 67 501 67Q537 67 561 83.5Q585 100 597 136Q609 172