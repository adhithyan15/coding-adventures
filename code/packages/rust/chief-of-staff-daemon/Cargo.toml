[package]
name = "chief-of-staff-daemon"
version = "0.1.0"
edition = "2021"
description = "Concrete cross-platform daemon executable for D18 Chief of Staff"
license = "MIT"

[lib]
name = "chief_of_staff_daemon"
path = "src/lib.rs"

[[bin]]
name = "chief-of-staff-daemon"
path = "src/main.rs"

[dependencies]
actor = { path = "../actor" }
chief-of-staff-channel-endpoints = { path = "../chief-of-staff-channel-endpoints" }
chief-of-staff-daemon-api = { path = "../chief-of-staff-daemon-api" }
chief-of-staff-daemon-authority-provisioning = { path = "../chief-of-staff-daemon-authority-provisioning" }
chief-of-staff-daemon-config = { path = "../chief-of-staff-daemon-config" }
chief-of-staff-daemon-credential = { path = "../chief-of-staff-daemon-credential" }
chief-of-staff-daemon-keyring = { path = "../chief-of-staff-daemon-keyring" }
chief-of-staff-daemon-policy = { path = "../chief-of-staff-daemon-policy" }
chief-of-staff-daemon-runtime = { path = "../chief-of-staff-daemon-runtime" }
chief-of-staff-daemon-secret-file = { path = "../chief-of-staff-daemon-secret-file" }
chief-of-staff-host-data-plane = { path = "../chief-of-staff-host-data-plane" }
chief-of-staff-host-control-protocol = { path = "../chief-of-staff-host-control-protocol" }
chief-of-staff-smart-home-tools = { path = "../chief-of-staff-smart-home-tools" }
chief-of-staff-tool-api = { path = "../chief-of-staff-tool-api" }
chief-of-staff-orchestrator-core = { path = "../chief-of-staff-orchestrator-core" }
chief-of-staff-pipeline-bindings = { path = "../chief-of-staff-pipeline-bindings" }
chief-of-staff-process-supervisor = { path = "../chief-of-staff-process-supervisor" }
chief-of-staff-service-reconciler = { path = "../chief-of-staff-service-reconciler" }
coding_adventures_x3dh = { path = "../x3dh" }
coding_adventures_uuid = { path = "../uuid" }
embeddable-http-server = { path = "../embeddable-http-server" }
hue-core = { path = "../hue-core" }
process-shutdown = { path = "../process-shutdown" }
serde_json = "1"
storage-core = { path = "../storage-core" }
coding_adventures_storage_fs = { path = "../storage-fs" }
coding-adventures-json-serializer = { path = "../json-serializer" }
coding-adventures-json-value = { path = "../json-value" }
smart-home-controller-runtime = { path = "../smart-home-controller-runtime" }
smart-home-automation-runtime = { path = "../smart-home-automation-runtime" }
smart-home-core = { path = "../smart-home-core" }
smart-home-axis-pairing-service = { path = "../smart-home-axis-pairing-service" }
smart-home-discovery = { path = "../smart-home-discovery" }
smart-home-discovery-service = { path = "../smart-home-discovery-service" }
smart-home-hue-pairing-service = { path = "../smart-home-hue-pairing-service" }
smart-home-onvif-pairing-service = { path = "../smart-home-onvif-pairing-service" }
smart-home-platform-http = { path = "../smart-home-platform-http" }
smart-home-reolink-pairing-service = { path = "../smart-home-reolink-pairing-service" }
smart-home-runtime = { path = "../smart-home-runtime" }
smart-home-synology-pairing-service = { path = "../smart-home-synology-pairing-service" }
smart-home-zoneminder-pairing-service = { path = "../smart-home-zoneminder-pairing-service" }
transport-platform = { path = "../transport-platform" }
coding_adventures_vault_sealed_store = { path = "../vault-sealed-store" }
web-core = { path = "../web-core" }
websocket-runtime = { path = "../websocket-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
coding_adventures_ed25519 = { path = "../ed25519" }
chief-of-staff-service-registry = { path = "../chief-of-staff-service-registry" }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
