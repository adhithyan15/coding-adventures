name: Kiln G1 paired measurement

on:
  push:
    branches:
      - codex/kiln-g1-parser-fast-path
    paths:
      - .github/workflows/kiln-g1-abba.yml

permissions:
  contents: read

jobs:
  paired-gate:
    name: G1 A-B-B-A (${{ matrix.os }})
    if: contains(github.event.head_commit.message, '[kiln-g1-abba]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      BASELINE_SHA: 10eeb7add42d2e7af504eef2f5e3707a61971cc9
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
          sparse-checkout: |
            code/grammars
            code/packages/go
            code/programs/go/kiln
            code/specs
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Checkout pinned D33/D32 baseline
        uses: actions/checkout@v7
        with:
          ref: 10eeb7add42d2e7af504eef2f5e3707a61971cc9
          fetch-depth: 1
          persist-credentials: false
          path: baseline
          sparse-checkout: |
            code/grammars
            code/packages/go
            code/programs/go/kiln
            code/specs
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'candidate/code/**/go.sum'

      - name: Capture runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/g1_abba_measure_linux_amd64_test.go" <<'EOF'
          package main

          import (
            "bytes"
            "crypto/sha256"
            "fmt"
            "math"
            "os"
            "testing"

            "github.com/adhithyan15/coding-adventures/code/programs/go/kiln/internal/trace"
          )

          func TestG1ABBAExactSliceTime(t *testing.T) {
            one, err := os.ReadFile("internal/trace/testdata/build.strace")
            if err != nil {
              t.Fatal(err)
            }
            slice := bytes.Repeat(one, (64<<10)/len(one)+1)
            lines := bytes.Count(slice, []byte{'\n'})
            if len(slice) != 66600 || lines != 936 {
              t.Fatalf("ABBA fixture drifted: bytes=%d lines=%d", len(slice), lines)
            }
            fixtureSHA := sha256.Sum256(one)
            sliceSHA := sha256.Sum256(slice)
            if got := fmt.Sprintf("%x", fixtureSHA); got != "dc8acd0de1d9b235c3924d0d71e2fcd565274e09ded9975570f429b548525aae" {
              t.Fatalf("fixture SHA-256 drifted: %s", got)
            }
            if got := fmt.Sprintf("%x", sliceSHA); got != "6cd61f63fdec55ce37294ad061705394b1babda80e5368b17ecb5bd38e2207af" {
              t.Fatalf("slice SHA-256 drifted: %s", got)
            }
            best, refusal := trace.BestPass1(slice, true, gateRepeats)
            if refusal != "" || best <= 0 {
              t.Fatalf("BestPass1 result: duration=%v refusal=%q", best, refusal)
            }
            rate := float64(len(slice)) * 1e9 / float64(best.Nanoseconds())
            if rate <= 0 || math.IsNaN(rate) || math.IsInf(rate, 0) {
              t.Fatalf("BestPass1 rate is not finite and positive: %g", rate)
            }
            t.Logf("G1ABBA_DETAIL: fixture_sha256=%x slice_sha256=%x bytes=%d lines=%d best_ns=%d rate_bytes_per_second=%.9f helper_root=true gc_control=BestPass1 repeats_min=%d", fixtureSHA, sliceSHA, len(slice), lines, best.Nanoseconds(), rate, gateRepeats)
          }
          EOF
          helper_sha=$(sha256sum "$RUNNER_TEMP/g1_abba_measure_linux_amd64_test.go" | cut -d' ' -f1)
          identity="$RUNNER_TEMP/kiln-g1-abba-identity.txt"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "go=$(go version)"
            uname -a
            cat /etc/os-release
            lscpu
            echo "baseline_sha=$BASELINE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "workflow_event_sha=$GITHUB_SHA"
            echo "temporary_measurement_helper_sha256=$helper_sha"
            fixture_sha=dc8acd0de1d9b235c3924d0d71e2fcd565274e09ded9975570f429b548525aae
            gate_test=code/programs/go/kiln/sandbox_tracesize_linux_amd64_test.go
            measure_source=code/programs/go/kiln/internal/trace/measure.go
            baseline_gate=$(git -C "$GITHUB_WORKSPACE/baseline" rev-parse "HEAD:$gate_test")
            candidate_gate=$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse "HEAD:$gate_test")
            baseline_measure=$(git -C "$GITHUB_WORKSPACE/baseline" rev-parse "HEAD:$measure_source")
            candidate_measure=$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse "HEAD:$measure_source")
            echo "gate_test_blob baseline=$baseline_gate candidate=$candidate_gate"
            echo "measure_source_blob baseline=$baseline_measure candidate=$candidate_measure"
            if [[ "$baseline_gate" != "$candidate_gate" || "$baseline_measure" != "$candidate_measure" ]]; then
              echo 'G1 gate or measurement source changed between pinned revisions' >&2
              exit 1
            fi
            for checkout in baseline candidate; do
              root="$GITHUB_WORKSPACE/$checkout"
              echo "checkout=$checkout head=$(git -C "$root" rev-parse HEAD)"
              for path in \
                code/programs/go/kiln \
                code/programs/go/kiln/internal/trace \
                code/programs/go/kiln/internal/traced \
                code/packages/go/lexer \
                code/packages/go/parser \
                code/packages/go/strace-lexer \
                code/packages/go/strace-parser
              do
                echo "runtime_tree $checkout $path $(git -C "$root" rev-parse "HEAD:$path")"
              done
              fixture="$root/code/programs/go/kiln/internal/trace/testdata/build.strace"
              actual_fixture_sha=$(sha256sum "$fixture" | cut -d' ' -f1)
              echo "fixture_sha256 $checkout $actual_fixture_sha"
              if [[ "$actual_fixture_sha" != "$fixture_sha" ]]; then
                echo "unexpected gate fixture in $checkout" >&2
                exit 1
              fi
              cp "$RUNNER_TEMP/g1_abba_measure_linux_amd64_test.go" "$root/code/programs/go/kiln/g1_abba_measure_linux_amd64_test.go"
            done
          } | tee "$identity"

      - name: Run uninstrumented exact G1 A-B-B-A sequence
        id: abba
        shell: bash
        run: |
          set -uo pipefail
          summary="$RUNNER_TEMP/kiln-g1-abba-results.txt"
          candidate_fail=0
          missing_probe=0
          for cell in A1 B1 B2 A2; do
            if [[ "$cell" == A* ]]; then checkout=baseline; else checkout=candidate; fi
            root="$GITHUB_WORKSPACE/$checkout"
            log="$RUNNER_TEMP/kiln-g1-abba-$cell.log"
            echo "=== cell=$cell checkout=$checkout sha=$(git -C "$root" rev-parse HEAD) ===" | tee -a "$summary"
            if (cd "$root/code/programs/go/kiln" && KILN_G1_GATE=1 go test -count=1 -run '^TestSandboxTraceGateSynthetic$' -v .) >"$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$log" | tee -a "$summary"
            echo "cell_status cell=$cell exit=$status" | tee -a "$summary"
            if ! grep -Eq 'PROBE: trace synthetic-slice bytes=66600 lines=936 .*gated=1 repeats=7' "$log"; then
              echo "missing exact synthetic-slice probe in cell $cell" | tee -a "$summary"
              missing_probe=1
            fi
            detail_log="$RUNNER_TEMP/kiln-g1-abba-$cell-detail.log"
            if (cd "$root/code/programs/go/kiln" && KILN_G1_GATE=1 go test -count=1 -run '^TestG1ABBAExactSliceTime$' -v .) >"$detail_log" 2>&1; then
              detail_status=0
            else
              detail_status=$?
            fi
            cat "$detail_log" | tee -a "$summary"
            echo "detail_status cell=$cell exit=$detail_status" | tee -a "$summary"
            if [[ "$detail_status" -ne 0 ]] || ! grep -Eq 'G1ABBA_DETAIL: fixture_sha256=dc8acd0de1d9b235c3924d0d71e2fcd565274e09ded9975570f429b548525aae slice_sha256=6cd61f63fdec55ce37294ad061705394b1babda80e5368b17ecb5bd38e2207af bytes=66600 lines=936 best_ns=[1-9][0-9]* rate_bytes_per_second=[0-9]+\.[0-9]+' "$detail_log"; then
              echo "missing exact-duration measurement in cell $cell" | tee -a "$summary"
              missing_probe=1
            fi
            if [[ "$checkout" == candidate && "$status" -ne 0 ]]; then
              candidate_fail=1
            fi
            if [[ "$checkout" == candidate && "$detail_status" -ne 0 ]]; then
              candidate_fail=1
            fi
          done
          echo "candidate_gate_failure=$candidate_fail missing_probe=$missing_probe" | tee -a "$summary"
          if [[ "$candidate_fail" -ne 0 || "$missing_probe" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload paired measurements and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kiln-g1-abba-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/kiln-g1-abba-identity.txt
            ${{ runner.temp }}/kiln-g1-abba-results.txt
            ${{ runner.temp }}/kiln-g1-abba-*.log
          if-no-files-found: error
          retention-days: 3
