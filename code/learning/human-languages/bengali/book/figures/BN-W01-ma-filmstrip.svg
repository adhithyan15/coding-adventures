<svg xmlns="http://www.w3.org/2000/svg" width="822" height="327.91" viewBox="0 0 822 327.91" role="img" aria-label="How to write ম: 2 strokes · 1 pen lift · 5 movements"><title>Writing ম</title><desc>5 frames; frame N shows movements 1 to N of ম (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 35 (ম, ma; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 322 of the 353 stored prototypes draw the body in one pen-down stroke. 264 of those 322 start at the top left, 305 turn the loop at the lower left clockwise, and 295 end at the top right, at the top of the stem; 243 reach the stem&apos;s foot first and climb back up it. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 156 of the 353 draw none at all, 102 open with it, 82 end with it and 13 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 186 of the 192 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="327.91" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="221.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.91" viewBox="-80 -692 772 1142.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0L440 110Q416 158 375 192.5Q334 227 284 241Q274 198 249 177.5Q224 157 188 157Q150 157 124.5 180Q99 203 99 243Q99 284 131 308Q163 332 208 332Q210 332 211 332Q208 401 169.5 444Q131 487 38 494L48 551L-10 551L-10 622L622 622L622 551L517 551L517 0L440 0ZM440 551L115 551Q191 540 237 482.5Q283 425 288 321Q339 306 378 276Q417 246 441 208Q441 222 440.5 236.5Q440 251 440 266L440 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 568 L90 568" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M90 568 L114 529 L152 503 L190 475 L219 438 L238 395 L247 349 L248 303 L222 264" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="222" cy="264" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="201.9" text-anchor="middle" font-size="61.9" fill="#6b7280"><tspan x="306" y="201.9">1. start under the</tspan><tspan x="306" y="277.4">headline at the left</tspan><tspan x="306" y="352.9">and curve down to the</tspan><tspan x="306" y="428.5">loop</tspan></text></svg><rect x="176" y="42" width="150" height="221.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.91" viewBox="-80 -692 772 1142.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0L440 110Q416 158 375 192.5Q334 227 284 241Q274 198 249 177.5Q224 157 188 157Q150 157 124.5 180Q99 203 99 243Q99 284 131 308Q163 332 208 332Q210 332 211 332Q208 401 169.5 444Q131 487 38 494L48 551L-10 551L-10 622L622 622L622 551L517 551L517 0L440 0ZM440 551L115 551Q191 540 237 482.5Q283 425 288 321Q339 306 378 276Q417 246 441 208Q441 222 440.5 236.5Q440 251 440 266L440 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 568 L114 529 L152 503 L190 475 L219 438 L238 395 L247 349 L248 303 L222 264 L222 264" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M222 264 L262 262 L255 215 L222 182 L182 182 L155 212 L155 255 L180 288 L220 300 L262 282" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="262" cy="282" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="201.9" text-anchor="middle" font-size="61.9" fill="#6b7280"><tspan x="306" y="201.9">2. round the loop</tspan><tspan x="306" y="277.4">clockwise</tspan></text></svg><rect x="336" y="42" width="150" height="221.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="221.91" viewBox="-80 -692 772 1142.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0L440 110Q416 158 375 192.5Q334 227 284 241Q274 198 249 177.5Q224 157 188 157Q150 157 124.5 180Q99 203 99 243Q99 284 131 308Q163 332 208 332Q210 332 211 332Q208 401 169.5 444Q131 487 38 494L48 551L-10 551L-10 622L622 622L622 551L517 551L517 0L440 0ZM440 551L115 551Q191 540 237 482.5Q283 425 288 321Q339 306 378 276Q417 246 441 208Q441 222 440.5 236.5Q440 251 440 266L440 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 568 L114 529 L152 503 L190 475 L219 438 L238 395 L247 349 L248 303 L222 264 L262 262 L255 215 L222 182 L182 182 L155 212 L155 255 L180 288 L220 300 L262 282 L262 282" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap