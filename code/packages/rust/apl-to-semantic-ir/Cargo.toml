[package]
name = "apl-to-semantic-ir"
version = "0.1.4"
edition = "2021"
description = "APL CST → narrow-waist Semantic IR (SIR22 + SIR22 addendum array/matrix domain). MA-4f, the last APL rollout item per HML01."

[dependencies]
semantic-ir = { path = "../semantic-ir" }
coding-adventures-apl-parser = { path = "../apl-parser" }
# The parser emits a generic `parser::grammar_parser::GrammarASTNode` whose
# leaf tokens are `lexer::token::Token`; we walk both directly. Note this
# crate deliberately does NOT depend on `coding-adventures-apl-runtime` --
# lowering only needs the parse tree shape (`apl-parser`), not the tree-
# walking evaluator.
parser = { path = "../parser" }
lexer = { path = "../lexer" }

[dev-dependencies]
# Every lowered module uses at least one SIR22/SIR22-addendum node (there is
# no purely-scalar-literal escape hatch the way matlab-to-semantic-ir has,
# since even `3+4` is an `ElementwiseOp` here -- see `src/lower.rs`'s module
# doc comment, point 1). `semantic-ir-to-javascript` now implements real
# codegen for the full SIR22 domain (base cut + the "APL addendum" this
# crate is the first consumer of), so this dev-dependency backs both
# `tests/test_validator.rs` (capability-acceptance, mirroring
# `matlab-to-semantic-ir`'s own `tests/test_validator.rs`) and
# `tests/e2e_node.rs` (real `node`-executed behavioral proof -- the
# `sir-runtime-array` TypeScript package is SEPARATE, not-yet-shipped
# follow-on work per HML01 §4; this backend's own INLINED runtime is what
# these tests exercise).
semantic-ir-to-javascript = { path = "../semantic-ir-to-javascript" }
# `tests/oracle.rs`'s ground truth: the same tree-walking interpreter this
# frontend's own CST comes from (HML01 §7's oracle/golden testing), mirroring
# `matlab-to-semantic-ir`'s identical use of `coding-adventures-matlab-runtime`
# as its own oracle ground truth. Note the OTHER, non-dev `[dependencies]`
# section above still deliberately does NOT depend on this crate --
# lowering itself only needs the parse-tree shape, never the evaluator; only
# this test file needs it, for comparison purposes only.
coding-adventures-apl-runtime = { path = "../apl-runtime" }
