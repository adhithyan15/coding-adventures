81 300 125.5 323Q170 346 229 346Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 45 L85 106 L76 178 L100 244 L154 293 L224 311 L295 300 L351 254 L383 190 L378 118 L356 49 L356 49" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M356 49 L425 37 L496 37 L566 37 L637 37 L708 37 L776 49" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="776" cy="49" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="428.5" y="221.8" text-anchor="middle" font-size="74.8" fill="#6b7280"><tspan x="428.5" y="221.8">2. run right along the</tspan><tspan x="428.5" y="313.1">base</tspan></text></svg><rect x="336" y="42" width="150" height="154.86" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="154.86" viewBox="-38 -624 933 963.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M229 346Q297 346 340.5 320.5Q384 295 405.5 255.5Q427 216 427 173Q427 133 414 102Q401 71 382 57L357 70L739 70L739 554L825 554L825 0L328 0L299 52Q319 72 331 96.5Q343 121 343 158Q343 212 314 244Q285 276 229 276Q194 276 168.5 260.5Q143 245 129.5 220Q116 195 116 164Q116 130 130 102Q144 74 175 51L129 -7Q87 24 59.5 66.5Q32 109 32 166Q32 219 56.5 259.5Q81 300 125.5 323Q170 346 229 346Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 45 L85 106 L76 178 L100 244 L154 293 L224 311 L295 300 L351 254 L383 190 L378 118 L356 49 L425 37 L496 37 L566 37 L637 37 L708 37 L776 49 L776 49" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M776 49 L780 115 L780 181 L780 248 L780 314 L780 380 L780 447 L780 513" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="780" cy="513" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="428.5" y="221.8" text-anchor="middle" font-size="74.8" fill="#6b7280"><tspan x="428.5" y="221.8">3. climb the upright to</tspan><tspan x="428.5" y="313.1">the top</tspan></text></svg><text x="16" y="209.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet</text><text x="16" y="222.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">learning tool, formation arrows for പ in data/PA.png: green start, blue turn, red end</text><text x="16" y="234.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(GPL-3.0, 2013)</text><text x="16" y="247.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
