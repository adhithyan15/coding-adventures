<svg xmlns="http://www.w3.org/2000/svg" width="982" height="518.08" viewBox="0 0 982 518.08" role="img" aria-label="How to write 定: 8 strokes · 7 pen lifts · 8 movements"><title>Writing 定</title><desc>8 frames; frame N shows movements 1 to N of 定 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 定.json, ordered stroke paths and medians 1–8 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%AE%9A.json&gt;. Source note on variation: The cited PRC-order dataset supplies eight ordered strokes for 定, in two pieces. Medians 1–3 draw the roof as 安 opens. Medians 4–8 draw the lower part of 是 as 题 writes it: a horizontal, a short vertical down from it, a short horizontal to its right, a left-falling stroke, then a long right-falling stroke along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those eight ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and seven intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s roof turns straight down at its right end, where the source&apos;s hooks to the left.</desc><rect x="0" y="0" width="982" height="518.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 8 strokes · 7 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="206.29" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="206.29" v