# ================================================================
# Deploy Coding Adventures Blog to GitHub Pages
# ================================================================
#
# Builds the Forme pipeline (10 stages, FM00 §5 demo) and deploys the
# generated dist/blog/ tree to the gh-pages branch under blog/,
# preserving other content on Pages.
#
# Pages is configured to serve from the gh-pages branch (legacy mode).
# Project-page repos like this one are served at
# https://<user>.github.io/<repo>/, so the `coding-adventures/` segment
# of the live URL comes from the *repo name* (project-page prefix), not
# from the publish destination.  Files at gh-pages/blog/foo.html land at
#   https://adhithyan15.github.io/coding-adventures/blog/foo.html
# — getting the prefix from a directory on gh-pages too would
# double-prefix and produce 404s.
#
# Pipeline shape (see code/sites/blog/forme.config.ts):
#   forme-source-fs          Stream<ContentSource>
#   forme-parse-markdown     ContentSource → ContentNode
#   forme-resolve-asset-refs Stream<ContentNode> → Stream<ContentNode>
#   forme-router             Stream<ContentNode> → Stream<ContentNode>
#                               ├→ render-static ────────────┐
#                               ├→ load-assets ──────────────┴→ emit-articles
#                               └→ collect-chronological → blog-surface → emit-surface
#
# `npm run build:clean` is the canonical clean-checkout entry point. The shared
# Forme CLI bootstraps the `file:` graph and drives clean/build, so the live site
# proves the same product entry point external projects use.

name: Deploy Coding Adventures Blog

on:
  pull_request:
    paths:
      - "code/sites/blog/**"
      - "code/packages/typescript/forme-types/**"
      - "code/packages/typescript/forme-cli/**"
      - "code/packages/typescript/forme-deploy-runner-core/**"
      - "code/packages/typescript/forme-deploy-runner-fs-adapter/**"
      - "code/packages/typescript/forme-deploy-runner-github-pages-adapter/**"
      - "code/packages/typescript/forme-errors/**"
      - "code/packages/typescript/forme-capability/**"
      - "code/packages/typescript/forme-stage/**"
      - "code/packages/typescript/forme-identity/**"
      - "code/packages/typescript/forme-pipeline-config/**"
      - "code/packages/typescript/forme-cache/**"
      - "code/packages/typescript/forme-orchestrator/**"
      - "code/packages/typescript/forme-source-fs/**"
      - "code/packages/typescript/forme-parse-markdown/**"
      - "code/packages/typescript/forme-resolve-asset-refs-fs/**"
      - "code/packages/typescript/forme-router/**"
      - "code/packages/typescript/forme-collect-chronological/**"
      - "code/packages/typescript/forme-render-static/**"
      - "code/packages/typescript/forme-load-assets-fs/**"
      - "code/packages/typescript/forme-index-renderer/**"
      - "code/packages/typescript/forme-feeds/**"
      - "code/packages/typescript/forme-aot-sitemap-emitter/**"
      - "code/packages/typescript/forme-aot-meta-link-tags/**"
      - "code/packages/typescript/forme-aot-rss-discovery-link/**"
      - "code/packages/typescript/forme-emit-fs/**"
      - "code/packages/typescript/forme-emit-site-fs/**"
      - "code/packages/typescript/document-ast/**"
      - "code/packages/typescript/document-ast-to-html/**"
      - "code/packages/typescript/gfm-parser/**"
      - "code/packages/typescript/directed-graph/**"
      - "code/packages/typescript/state-machine/**"
      - "code/packages/typescript/blake2b/**"
      - ".github/workflows/deploy-blog.yml"
  push:
    branches: [main]
    paths:
      - "code/sites/blog/**"
      - "code/packages/typescript/forme-types/**"
      - "code/packages/typescript/forme-cli/**"
      - "code/packages/typescript/forme-deploy-runner-core/**"
      - "code/packages/typescript/forme-deploy-runner-fs-adapter/**"
      - "code/packages/typescript/forme-deploy-runner-github-pages-adapter/**"
      - "code/packages/typescript/forme-errors/**"
      - "code/packages/typescript/forme-capability/**"
      - "code/packages/typescript/forme-stage/**"
      - "code/packages/typescript/forme-identity/**"
      - "code/packages/typescript/forme-pipeline-config/**"
      - "code/packages/typescript/forme-cache/**"
      - "code/packages/typescript/forme-orchestrator/**"
      - "code/packages/typescript/forme-source-fs/**"
      - "code/packages/typescript/forme-parse-markdown/**"
      - "code/packages/typescript/forme-resolve-asset-refs-fs/**"
      - "code/packages/typescript/forme-router/**"
      - "code/packages/typescript/forme-collect-chronological/**"
      - "code/packages/typescript/forme-render-static/**"
      - "code/packages/typescript/forme-load-assets-fs/**"
      - "code/packages/typescript/forme-index-renderer/**"
      - "code/packages/typescript/forme-feeds/**"
      - "code/packages/typescript/forme-aot-sitemap-emitter/**"
      - "code/packages/typescript/forme-aot-meta-link-tags/**"
      - "code/packages/typescript/forme-aot-rss-discovery-link/**"
      - "code/packages/typescript/forme-emit-fs/**"
      - "code/packages/typescript/forme-emit-site-fs/**"
      - "code/packages/typescript/document-ast/**"
      - "code/packages/typescript/document-ast-to-html/**"
      - "code/packages/typescript/gfm-parser/**"
      - "code/packages/typescript/directed-graph/**"
      - "code/packages/typescript/state-machine/**"
      - "code/packages/typescript/blake2b/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forme-pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/sites/blog/package-lock.json

      - name: Test clean-checkout blog build
        run: |
          cd code/sites/blog
          npm run build:clean
          npm test

      - name: Verify expected output exists
        run: |
          test -d code/sites/blog/dist/blog
          ls code/sites/blog/dist/blog
          test -f code/sites/blog/dist/blog/index.html
          test -f code/sites/blog/dist/blog/rss.xml
          test -f code/sites/blog/dist/blog/atom.xml
          test -f code/sites/blog/dist/blog/sitemap.xml
          test -n "$(find code/sites/blog/dist/blog/assets -type f -name 'forme-pipeline.*.svg' -print -quit)"
          ! grep -R "forme-asset:" code/sites/blog/dist/blog

      - name: Prove write-free target plan
        working-directory: code/sites/blog
        env:
          # The dry run only reads repository metadata, but authenticating its
          # GitHub API requests avoids the shared unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy:dry-run

      - name: Prove filesystem rollback contract
        working-directory: code/packages/typescript/forme-deploy-runner-fs-adapter
        run: npm test

      - name: Checksum exact deploy input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: code/sites/blog/.forme/deploy-input
        run: find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256

      - name: Upload exact deploy input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forme-blog-deploy-input
          path: code/sites/blog/.forme/deploy-input
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Bootstrap reviewed local dependency graph
        working-directory: code/sites/blog
        run: npm run bootstrap

      - name: Download exact deploy input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: forme-blog-deploy-input
          path: code/sites/blog/.forme/deploy-input

      - name: Verify deploy input checksum
        working-directory: code/sites/blog/.forme/deploy-input
        run: sha256sum -c CHECKSUMS.sha256

      - name: Publish through Forme
        working-directory: code/sites/blog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy

      - name: Assert bounded live availability
        run: |
          curl --fail --location --retry 6 --retry-delay 10 --max-time 20 https://adhithyan15.github.io/coding-adventures/blog/ -o /tmp/forme-blog.html
          grep -q '<title>Coding Adventures</title>' /tmp/forme-blog.html
