[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-sir-runtime-core"
version = "0.2.0"
description = "Core runtime for Semantic-IR-emitted Python — SIR truthiness, symbols, equality, display, arithmetic, closures, globals"
requires-python = ">=3.12"
dependencies = [
    "coding-adventures-sir-runtime-pairs",
    "coding-adventures-sir-runtime-exceptions",
]
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
keywords = ["sir", "semantic-ir", "runtime", "compiler", "cross-language", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/adhithyan15/coding-adventures"
Repository = "https://github.com/adhithyan15/coding-adventures"
Documentation = "https://github.com/adhithyan15/coding-adventures/tree/main/code/specs/sir-runtime.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

# The cons-pair runtime is a sibling package in this monorepo; resolve it from
# the local path for editable dev/test installs (mirrors the aes -> gf256 setup).
[tool.uv.sources]
coding-adventures-sir-runtime-pairs = { path = "../sir-runtime-pairs", editable = true }
coding-adventures-sir-runtime-exceptions = { path = "../sir-runtime-exceptions", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/coding_adventures_sir_runtime_core"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coding_adventures_sir_runtime_core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/coding_adventures_sir_runtime_core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
