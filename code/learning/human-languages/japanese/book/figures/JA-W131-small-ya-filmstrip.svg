<svg xmlns="http://www.w3.org/2000/svg" width="502" height="338.43" viewBox="0 0 502 338.43" role="img" aria-label="How to write ゃ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ゃ</title><desc>3 frames; frame N shows movements 1 to N of ゃ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana や stroke order animation.gif, hiragana や, 28 frames, 2.8 seconds (Wikimedia Commons, 1 October 2009); KanjiVG kanji/03083.svg, three stroke paths in the same order; the Unicode Standard names U+3083 HIRAGANA LETTER SMALL YA &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%84_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws full-size や in three pen-down runs with two lifts: the long sweep and its hook first, then the short tick, then the descender. KanjiVG records U+3083 with the same three strokes in the same order. Unicode separately identifies U+3083 as small ya. This learner path therefore preserves the source&apos;s three-run movement while scaling and fitting it to the bundled Noto Sans JP small ゃ outline; the cited animation demonstrates や rather than a separately animated ゃ, so the size adaptation is explicit rather than presented as independent handwriting evidence.</desc><rect x="0" y="0" width="502" height="338.43" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="219.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.93" viewBox="43 -705 867 1271.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M520 498Q498 521 469 547.5Q440 574 411 593L467 635Q480 626 500.5 609Q521 592 541 574Q561 556 575 541L520 498ZM279 560Q285 548 291.5 