<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet</title>
</head>
<body>
  <section data-component="Sheet" data-mosaic-html-root="Sheet">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="Sheet">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; flex-direction: row; gap: 8px">
          <!-- emit "onFilterChange" dropped: HTML is static -->
          <input type="text" value="{{filterText}}" placeholder="Filter…" data-on-change="onFilterChange" style="padding: 8px; border-radius: 4px; background: #ffffff; color: #212529; border-width: 1px; border-color: #ced4da; font-size: 14px">
          <div style="display: flex; flex-direction: column; padding: 0">
            <!-- emit "onToggleSortOpen" dropped: HTML is static -->
            <button data-on-click="onToggleSortOpen" style="padding: 8px; background: #1f2937; color: #f3f4f6; border-width: 1px; border-color: #4b5563; font-size: 14px; border-radius: 4px">{{sortField}}</button>
            <!-- mosaic-if when="sortOpen" -->
              <div style="display: flex; flex-direction: column; padding: 4px; background: #111827; border-width: 1px; border-color: #374151">
                <!-- mosaic-for each="sortOptions" as="option" index="i" -->
                  <!-- emit "onSortFieldChange" dropped: HTML is static -->
                  <button data-on-click="onSortFieldChange" style="padding: 8px; background: #111827; color: #f3f4f6; border-width: 0; font-size: 14px; border-radius: 0">{{option}}</button>
                <!-- /mosaic-for -->
              </div>
            <!-- /mosaic-if -->
          </div>
          <!-- mosaic-if when="sortAscending" -->
            <!-- emit "onToggleSortDirection" dropped: HTML is static -->
            <button data-on-click="onToggleSortDirection" style="padding: 8px; border-radius: 4px; background: #ffffff; color: #212529; border-width: 1px; border-color: #ced4da; font-size: 14px">↑</button>
          <!-- mosaic-else -->
            <!-- emit "onToggleSortDirection" dropped: HTML is static -->
            <button data-on-click="onToggleSortDirection" style="padding: 8px; border-radius: 4px; background: #ffffff; color: #212529; border-width: 1px; border-color: #ced4da; font-size: 14px">↓</button>
          <!-- /mosaic-if -->
        </div>
        <table style="border-width: 1px; border-style: solid; border-color: #3f3f46; background: #1e1e1e">
          <colgroup>
            <!-- mosaic-for each="columnWidths" as="w" index="cw" -->
              <col>
            <!-- /mosaic-for -->
          </colgroup>
          <thead>
            <tr>
              <!-- mosaic-for each="columnHeaders" as="h" index="ch" -->
                <th>
                  <div>
                    <span>{{h}}</span>
                  </div>
                </th>
              <!-- /mosaic-for -->
            </tr>
          </thead>
          <tbody>
            <!-- mosaic-for each="viewportRows" as="row" index="r" -->
              <tr>
                <!-- mosaic-for each="row" as="v" index="c" -->
                  <td>
                    <!-- emit "onNavigate" dropped: HTML is static -->
                    <div style="padding: 4px; background: #1e1e1e; color: #cccccc">
                      <!-- mosaic-if when="( r == editRow &amp;&amp; c == editCol )" -->
                        <!-- emit "onFormulaChange" dropped: HTML is static -->
                        <!-- emit "onEditCommit" dropped: HTML is static -->
                        <!-- emit "onEditCancel" dropped: HTML is static -->
                        <input type="text" value="{{editContent}}" autofocus data-on-change="onFormulaChange" data-on-commit="onEditCommit" data-on-cancel="onEditCancel">
                      <!-- mosaic-else -->
                        <span>{{v}}</span>
                      <!-- /mosaic-if -->
                    </div>
                  </td>
                <!-- /mosaic-for -->
              </tr>
            <!-- /mosaic-for -->
          </tbody>
        </table>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
