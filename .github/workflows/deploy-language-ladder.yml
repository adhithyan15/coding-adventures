# Build and publish the shared-spine Language Ladder app under the repository's
# existing gh-pages site. Relative Vite asset URLs keep the deployed app usable
# at /coding-adventures/language-ladder/ without a second build configuration.

name: Deploy Language Ladder

on:
  push:
    branches: [main]
    paths:
      - "code/programs/typescript/language-ladder/**"
      - "code/packages/typescript/human-language-data/**"
      - "code/learning/human-languages/**"
      - ".github/workflows/deploy-language-ladder.yml"
  # Curriculum data is a build input to Language Ladder. Validate the app on
  # pull requests so a broken type, test, or bundle budget cannot reach main
  # and fail only after the deployment workflow starts.
  pull_request:
    branches: [main]
    paths:
      - "code/programs/typescript/language-ladder/**"
      - "code/packages/typescript/human-language-data/**"
      - "code/learning/human-languages/**"
      - ".github/workflows/deploy-language-ladder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep main deployments serialized without making independent curriculum PRs
  # cancel one another's validation runs.
  group: deploy-language-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build and validate Language Ladder
        working-directory: code/programs/typescript/language-ladder
        run: bash BUILD

      - name: Stage Language Ladder for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: language-ladder-dist
          path: code/programs/typescript/language-ladder/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore validated Language Ladder
        uses: actions/download-artifact@v8
        with:
          name: language-ladder-dist
          path: code/programs/typescript/language-ladder/dist

      - name: Deploy to GitHub Pages (language-ladder/ subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: code/programs/typescript/language-ladder/dist
          destination_dir: language-ladder
          keep_files: true
