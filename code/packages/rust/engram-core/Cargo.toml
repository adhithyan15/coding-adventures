[package]
name = "engram-core"
version = "0.1.0"
edition = "2021"
description = "Headless spaced-repetition and language-learning memory core for Engram and Mosaic frontends."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
fsrs = "6.6.1"
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
