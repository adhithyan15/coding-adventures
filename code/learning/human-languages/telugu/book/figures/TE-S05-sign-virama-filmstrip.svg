<svg xmlns="http://www.w3.org/2000/svg" width="662" height="316.41" viewBox="0 0 662 316.41" role="img" aria-label="How to write ్: one unbroken stroke · 4 movements"><title>Writing ్</title><desc>4 frames; frame N shows movements 1 to N of ్ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 62 (్, virama): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 101 of the 104 stored prototypes of the virama (97%) are one pen-down stroke. 98 of the 101 start in the lower half, 98 turn clockwise, 97 end in the top third and all 101 in the right half: from the lower bar round the lower bowl, up through the middle and round the upper bowl, out along the top bar (96 do all of that). The bundled font prints a short middle prong where the two bowls meet; the traces do not settle how it is drawn, so the path runs out along it and back. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="316.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="210.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="210.41" viewBox="-433 -908 622 872.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-355 540Q-355 572 -339 595Q-323 618 -292 637L-293 619Q-327 637 -345 663.5Q-363 690 -363 724Q-363 751 -353 771Q-343 791 -325 805Q-311 816 -292 823.5Q-273 831 -243.5 834.5Q-214 838 -168 838L119 838L119 763L-184 763Q-218 763 -233 761Q-248 759 -257 754Q-268 749 -274 739.5Q-280 730 -280 717Q-280 704 -275 694Q-270 684 -259 678Q-249 673 -232.5 670.5Q-216 668 -185 668L-48 668L-48 593L-189 593Q-217 593 -232.5 589.5Q-248 586 -256 580Q-272 568 -272 546Q-272 534 -267.5 525Q-263 516 -256 511Q-247 504 -233 502Q-219 500 -197 500L-160 500L-160 425L-198 425Q-245 425 -280.5 437Q-316 449 -335.5 474.5Q-355 500 -355 540Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-170 462 L-170 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-170 462 L-198 462 L-235 468 L-277 489 L-304 530 L-296 574 L-262 610" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-262" cy="610" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-122" y="-235.2" text-anchor="middle" font-size="49.8" fill="#6b7280"><tspan x="-122" y="-235.2">1. start at the right</tspan><tspan x="-122" y="-174.4">end of the lower bar and</tspan><tspan x="-122" y="-113.7">curve left round the</tspan><tspan x="-122" y="-52.9">lower bowl</tspan></text></svg><rect x="176" y="42" width="150" height="210.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="210.41" viewBox="-433 -908 622 872.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus