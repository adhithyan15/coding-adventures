[package]
name = "lang-aot"
version = "0.227.0"
edition = "2021"
description = "v0.227.0 (M68K lane -- eighth of the 9-architecture expansion): adds `--emit=m68k`, routing through the new `m68k-backend`/`m68k-encoder` pair (`aot_core::infer` + `aot_core::specialise` + `Backend::compile`, same pipeline every other arch backend uses). Minimal viable: `const_*`/`ret_*` only, single-register (D0) allocator; `ret_*` lowers to `TRAP #15` (the halt convention the pre-existing Python motorola-68000-simulator's own test suite already establishes -- its `_stop()` helper, used 100+ times, is TRAP #15 rather than the also-valid STOP #imm). Downstream: the new `m68k-simulator` crate (a from-scratch Rust port of the Python original covering MOVE/MOVEA/MOVEQ, ADD/SUB/AND/OR/EOR/CMP, ADDQ/SUBQ, Scc/DBcc, BRA/BSR/Bcc, register-form shift/rotate, and 8 of the 11 addressing-mode variants). v0.224.0 (BASIC \u2192 RV32I refuses floats loudly): the `end_to_end_smoke` BASIC \u2192 RV32I test asserted a `.bin` (tolerating \"lowering gap\" substrings) for a program that can never produce one \u2014 Dartmouth BASIC's only numeric type is REAL, so `10 PRINT 42` is `const_f64 42.0`, and RV32I is the base integer ISA with no floating-point registers. The test now pins the refusal itself (target, function, op, type, and the RV32F/RV32D explanation) and that no partial `.bin` is written; the RV32I error path also names the offending function, as its doc comment always promised. Multi-language AOT driver — compile Twig, Nib, Brainfuck, Dartmouth BASIC, Oct, and McCarthy Lisp to native executables through the shared IIR pipeline.  v0.222.0 (boxed dyn_car/dyn_cons/dyn_cdr fix): `e6d2b_dynamic_arith.rs`'s Windows skip guards on `dynamic_arith_over_boxed_operand_runs_on_native`/`_runs_on_llvm` are removed — `iir-builtin-lowering` 0.33.0 fixes the underlying bug (`(+ (car (cons 41 0)) 1)` returned 329 instead of 42, via `heap.rs::lower_heap_function_runtime` never retyping a renamed `dyn_car`/`dyn_cons`/`dyn_cdr`/predicate result to `ref<any>`). Both tests now run for real on every host, plus a new `dynamic_arith_over_boxed_operand_matches_vm_core_oracle` cross-checks the answer against `vm_core::core::VMCore` (the shared cross-language interpreter — structurally immune to this whole lowering-pass bug class, since it never runs `lower_dynamic_arith`/`lower_heap_builtins_runtime` at all) as an independent oracle, not just a hardcoded literal. Also root-caused (not fixed — see `twig-aot` 0.52.0 and the linked follow-ups) two further pre-existing bugs surfaced the same way: precise-GC frame-pointer-chain walking never actually crosses the Rust/Twig ABI boundary on x86-64 (LLVM/rustc's frame-pointer codegen doesn't produce the classic linked chain the walker assumes, confirmed via disassembly), and the Windows-native `STATUS_STACK_OVERFLOW` recursion crash is actually a pervasive, non-recursion-specific bug where any dynamically-boxed arithmetic result crossing a function-call boundary is never unboxed before the callee consumes it (confirmed with a non-recursive repro: `(dbl (- n 1))` returning 512 instead of 8). Also fixes two pre-existing compile errors that only surfaced once Windows CI actually started compiling this crate's full test suite (see the CI-gap fix in the same PR): `tests/end_to_end_smoke.rs` was missing `use std::io::Write` for its `writeln!` calls, and `tests/conformance.rs` unconditionally imported the `#[cfg(unix)]`-only `compile_file_to_macos_executable` instead of gating the import to match its macOS-gated use site. `tests/e6d7a_wasm_closures.rs`'s 3 failing tests are a separate, further pre-existing instance of the boxing bug above (confirmed unrelated to any change in this PR via a clean-`origin/main` stash test) — left as-is, tracked in the same follow-up.  v0.221.0 (Twig any-parameter comparison fix): `e6d2b_dynamic_arith.rs` gains `dynamic_arith_over_a_twig_parameter_runs_on_native`, proving Twig `(define (classify n) (if (< n 2) 111 222)) (classify 10)` → 222 on native Windows x86-64 AOT — the case that surfaced `iir-builtin-lowering` 0.32.0's `is_boxed` fix (a bare-`any`-typed Twig function *parameter* was misread as a boxed dynamic value and spuriously unboxed, corrupting every comparison/arithmetic op that used it as an operand; `n=10` compared `< 2` silently evaluated as true). Also enables `run_native`'s Windows arm (previously Linux/macOS-only) and fixes `common::gc_link_args()`'s missing dynamic-CRT import libs on Windows, closing the blind spot that let both this bug and `twig-aot` 0.51.0's two Windows-linker bugs (temp-file handle, CRT import libs) ship unnoticed — native Windows AOT execution had never actually been exercised end-to-end locally before. Doing so also surfaced three separate, pre-existing, NOT-yet-fixed bugs, each skipped with an explanatory `eprintln` pending its own investigation: a self-recursive Twig function crashes with `STATUS_STACK_OVERFLOW` on native Windows AOT specifically (LLVM unaffected); `(+ (car (cons 41 0)) 1)` returns `329` instead of `42` on native/LLVM Windows (a boxed-value dynamic-arithmetic bug, unrelated to the parameter fix — `ref<any>` handling is unconditional in both the old and new `is_boxed`); and `twig-aot`'s own `windows_x86_64_smoke.rs` has a CRLF-vs-`\n` stdout mismatch plus a GC precision mismatch under stress, both newly able to run (and fail) now that Windows linking works at all.  v0.212.0 (E6d-8 — Twig dynamic globals): a matrix cell proves Twig `(define (f) g) (define g 42) (f)` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. A forward-referenced value global is emitted as `call_builtin \"global_get\"/\"global_set\"` (the dynamic path); the shared `lower_global_io` pass rewrites those to typed `global_load`/`global_store`, but only the native `twig-aot` pipeline ran it — the managed pipelines (WASM/JVM/CLR/BEAM) + LLVM never did, so a dynamic global hit an unsupported `call_builtin`. Adding `lower_global_io` to those pipelines makes the set+get roundtrip work. (A dynamic global feeding dynamic *arithmetic* still needs the slot widened to boxed `any` — a follow-up.) Run-verified on WASM + real dotnet CLR.  v0.211.0 (E6d-6 — Twig unions / match): two matrix cells prove Twig `(union Opt (Some (v : int)) (None)) (match (Some 42) ((Some v) v) ((None) 0))` → 42 and matching the 2nd variant → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. A union erases to integer-tagged constructors (cons `(tag . fields)`); `match` compares the scrutinee's tag (car) to each variant's int tag and binds fields via `car(cdr^i)`. Two fixes made it run on all backends: (1) twig-ir-compiler 0.44.0 types the variant tag const `i64` not `any` (an `any` const was wrongly `unbox`ed → WASM `expected i32, got I64` trap); (2) iir-builtin-lowering 0.29.0 makes a boxed-bool `jmp_if_false` (a boxed `=` result) branch on its RAW bool — both dyn_repr passes (structural = WASM/JVM/CLR, and the native/LLVM `dyn_repr` `dyn_truthy` path) previously wrapped it with nil-truthiness, but a boxed `#f` is a non-nil i31/tagged-0 → every arm mis-matched. Run-verified on WASM + real dotnet CLR.  v0.210.0 (E6d-5 — Twig records): two matrix cells prove Twig `(record Point (x : int) (y : int)) (point-x (Point 42 7))` → 42 and `(point-y (Point 7 42))` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. A record erases to a constructor (cons chain via typed `alloc`+`field_store`) + accessors (`car(cdr^i(r))` via `field_load`) — the E6d-1 heap substrate, no new value type. Shipping this fixed a latent wasm-runtime 0.4.0 bug: struct field counts were indexed by per-function count (over-counting when functions share a signature, as a record's constructor+accessors+predicate do), so every `struct.set` trapped `field 0 out of range`; now indexed by the deduplicated function-type count. Run-verified on WASM + real dotnet CLR.  v0.209.0 (E6d-4 — Twig symbols / quote): two matrix cells prove Twig `(equal? 'a 'a)` → #t (exit 1) and `(equal? 'a 'b)` → #f (exit 0) on [NativeAot, Llvm, Wasm, Jvm, Clr]. A quote literal now lowers to `const Var(name) : symbol` (the interned-const form McCarthy emits; twig-ir-compiler 0.43.0) instead of the runtime `make_symbol` string path, so it rides the already-wired `intern_symbols`/`intern_symbols_structural` passes — each distinct name gets one module-wide id in a reserved range, making `equal?` on symbols bit-equality with no new value type. Run-verified on WASM + real dotnet CLR.  v0.208.0 (E6d-3b COMPLETE — Twig `assoc` list operation): two matrix cells prove Twig `(cdr (assoc 2 (list (cons 1 10) (cons 2 42) (cons 3 30))))` → 42 and not-found `(null? (assoc 9 …))` → 1 on [NativeAot, Llvm, Wasm, Jvm, Clr] — completing the E6d-3b list ops (length/list-ref/append/reverse/assoc). `assoc` searches an association list via a synthesized helper `__dyn_list_assoc(key, alist) = if null?(alist) then nil else if key==car(car(alist)) then car(alist) else assoc(key, cdr(alist))` (iir-builtin-lowering 0.28.0); V1 keys are integers (key test unboxes both to i64 + typed cmp_eq, since equal? lowers unevenly). Run-verified on WASM + real dotnet CLR.  v0.207.0 (E6d-3b — Twig `reverse` list operation): a matrix cell proves Twig `(car (reverse (list 1 2 42)))` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. `reverse` is lowered by iir-builtin-lowering 0.27.0's `lower_list_ops` to a nil-seeded call to a synthesized tail-recursive accumulator helper `__dyn_list_reverse(a, acc) = if null?(a) then acc else reverse(cdr(a), cons(car(a), acc))`; the call site seeds `acc` with a `const 0 : ref<LispyPair>` nil. No index → no unbox/box; reuses null?/car/cdr/cons (E6d-1). Run-verified on WASM + real dotnet CLR.  v0.206.0 (E6d-3b — Twig `append` list operation): a matrix cell proves Twig `(car (cdr (append (list 1 42) (list 3))))` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. `append` rebuilds the first list in front of the second via a synthesized recursive helper `__dyn_list_append` (iir-builtin-lowering 0.26.0's `lower_list_ops`): `if null?(a) then b else cons(car(a), append(cdr(a), b))`. No index → no unbox/box; its one new op is the `cons` in the recursive arm (the E6d-1 heap builtin, lowered for the injected helper too). Run-verified on WASM + real dotnet CLR.  v0.205.0 (E6d-3b — Twig `list-ref` list operation): a matrix cell proves Twig `(list-ref (list 10 20 42) 2)` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. Like `length`, `list-ref` walks the cons chain via a synthesized recursive helper `__dyn_list_ref` (iir-builtin-lowering 0.25.0's `lower_list_ops`) reusing `car`/`cdr` (E6d-1); `if ni==0 then car(lst) else list-ref(cdr(lst), ni-1)`. The index is a boxed lisp value (the uniform-anyref boundary boxes every lisp-call arg), unboxed once inside so the index test/decrement are typed `cmp_eq`/`sub`. Run-verified on WASM + real dotnet CLR.  v0.204.0 (E6d-3b — Twig `length` list operation): matrix cells prove Twig `(+ (length (list 1 2 3)) 39)` → 42 and `(null? (list))` → 1 on [NativeAot, Llvm, Wasm, Jvm, Clr]. `length` walks the cons chain via a synthesized recursive helper `__dyn_list_length` (iir-builtin-lowering 0.24.0's `lower_list_ops`), a proper lisp function reusing `null?`/`cdr` (E6d-1) + dynamic `+` (E6d-2). Also fixes the WASM nil const `const 0 : ref<LispyPair>` → `ref.null` (iir-to-wasm 0.38.0) so `is_null` detects the list terminator. Run-verified on WASM + real dotnet CLR.  v0.203.0 (E6d-3a — Twig `list` constructor on the code-gen backends): two matrix cells prove Twig `(car (list 42 1 2))` → 42 and `(car (cdr (list 1 42 3)))` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr]. `list` is desugared to a nil `const` + cons chain by iir-builtin-lowering 0.23.0's `desugar_list_in_function` (at the head of both heap-lowering entry points), so it rides the E6d-1 cons path with no pipeline change. Run-verified on WASM + real dotnet CLR.  v0.195.0 (E6d-1 — Twig dynamic cons on the code-gen backends): two matrix cells prove Twig `(car (cons 42 0))` → 42 and nested `(car (cdr (cons 1 (cons 42 0))))` → 42 on [NativeAot, Llvm, Wasm, Jvm, Clr] — Twig's first genuinely dynamic value (a heap cons of boxed `ref<any>`). Zero production code: the shared iir-builtin-lowering heap passes (which run for every language) already lower Twig's `call_builtin \"cons\"/\"car\"/\"cdr\"` to the same substrate McCarthy Lisp uses. Run-verified on WASM + real dotnet CLR; the generic Vm/Jit run vm-core typed IIR only, so dynamic Twig lists the 5 code-gen columns. Design: lang-full-e6-dispatch.md (E6 layer 2).  v0.194.0 (E4d-BA-arr — BASIC string arrays COMPLETE, all 7 backends): the string-array matrix cell (`DIM A$(2); A$(0)=\"O\"; A$(1)=\"K\"; PRINT A$(0)+A$(1)` → `OK`) now runs on ALL SEVEN backends — adds NativeAot (x86_64-backend 0.24.0 / aarch64-backend 0.23.0 accept a `str` 8-byte element), JVM (iir-to-jvm-class-file 0.30.0 — `String[]` via `anewarray`/`aaload`/`aastore`), and CLR (iir-to-cil-bytecode 0.39.0 — `System.String[]` via `ldelem.ref`/`stelem.ref`) to the part-1 Llvm/Wasm/Vm/Jit; also fixes an LLVM `array_set` str-literal materialisation bug (iir-to-llvm 0.36.0).  v0.193.0 (E4d-BA-arr — BASIC string arrays, part 1): a matrix cell proves Dartmouth BASIC `DIM A$(2); A$(0)=\"O\"; A$(1)=\"K\"; PRINT A$(0)+A$(1)` → `OK` on [Llvm, Wasm, Vm, Jit] — string arrays reuse the E5 aggregate substrate with a `str` element (dartmouth-basic-iir-compiler 0.37.0; iir-to-wasm 0.36.0 4-byte i32-handle elements; LLVM carries a str element as an i64 handle with no backend change; VM/JIT hold a tagged Value::Str element). NativeAot/JVM/CLR (native element-size allowance + managed reference arrays) land in part 2.  v0.183.0 (BA runtime string CONCAT foothold): a new matrix cell proves Dartmouth BASIC `PRINT A$ + B$` where BOTH operands are read from `INPUT` — the first `str_concat` over two genuinely runtime operands (no compile-time metadata) — on the four already-runtime-capable columns [Jvm, Clr, Vm, Jit]; the static/WASM columns (whose str_concat is literal-fold-only) are deferred to follow-up PRs.  v0.180.0 (BA string INPUT — managed columns): the `INPUT A$` matrix cell now also runs on the JVM (iir-to-jvm-class-file 0.29.0 — readLine()→String, astore) and CLR (iir-to-cil-bytecode 0.38.0 — Console.ReadLine()) columns; the harness `BasicRuntime` gains a `readLine()` host method. Cell now [Jvm, Clr, Vm, Jit].  v0.179.0 (BA string INPUT): a new matrix cell proves Dartmouth BASIC `INPUT A$` reading a whole stdin line as a runtime string (dartmouth-basic-iir-compiler 0.36.0) on the dynamic VM/JIT columns — a registered `input_str` closure returns a tagged Value::Str.  v0.178.0 (E4d-JVM/CLR): the ALGOL string-procedure matrix cell (a runtime string RETURNED from a procedure) now runs on ALL SEVEN backends — JVM gained str-on-call/ret validation (iir-to-jvm-class-file 0.28.0, str value already a java.lang.String); CLR already compiled it (iir-to-cil-bytecode, str already a System.String).  v0.177.0 (E4d-3b): the ALGOL string-procedure matrix cell (a runtime string RETURNED from a procedure) now runs on the Wasm column too (in-process wasm-runtime) — iir-to-wasm 0.30.0 reads the length header at run time for any non-foldable string (call result/return/param), not only promoted slots; the cell now runs on NativeAot + Llvm + Wasm + VM/JIT.  v0.176.0 (E4d-2b): the ALGOL string-procedure matrix cell (a runtime string RETURNED from a procedure) now runs on the Llvm column too (via clang) — iir-to-llvm 0.31.0 carries a str value as an i64 handle across function boundaries and reads the length header at run time for any non-foldable string.  v0.175.0 (E4d-AL): ALGOL 60 `string procedure`s — a matrix cell proves a runtime string RETURNED from a procedure and printed by the caller, running on NativeAot + VM/JIT (the columns that carry a call-result runtime string); also fixes a latent native miscompile (twig-aot 0.28.0 keeps every buffer of a multi-block string alias).  v0.174.0 (E4-dyn E4d-4): the runtime branch-selected-string foothold cell now runs on the NativeAot column too (aarch64 run-verified locally, x86_64 on CI) — twig-aot 0.27.0 keeps a branch-selected string out of the compile-time literal map so print_str reads the length from the [i64 len][bytes] buffer header at run time; the E4-dyn foothold is now proven on ALL SEVEN backends.  v0.173.0 (E4-dyn E4d-3): the runtime branch-selected-string foothold cell now runs on the Wasm column too (in-process wasm-runtime + env.__print_str host) — iir-to-wasm 0.29.0 runtime-string lowering (i32 handle → length-prefixed linear-memory block).  v0.172.0 (E4-dyn E4d-2): the runtime branch-selected-string foothold cell now runs on the Llvm column too (via clang) — iir-to-llvm 0.30.0 runtime-string lowering.  v0.171.0 (E4-dyn foothold): first RUNTIME string cell on the 4 already-dynamic backends.  v0.170.0 (AL-pow): ALGOL 60 exponentiation."

[dependencies]
twig-aot              = { path = "../twig-aot" }
twig-ir-compiler      = { path = "../twig-ir-compiler" }
nib-iir-compiler      = { path = "../nib-iir-compiler" }
brainfuck-iir-compiler = { path = "../brainfuck-iir-compiler" }
dartmouth-basic-iir-compiler = { path = "../dartmouth-basic-iir-compiler" }
oct-iir-compiler     = { path = "../oct-iir-compiler" }
mccarthy-lisp-iir-compiler = { path = "../mccarthy-lisp-iir-compiler" }
algol-iir-compiler = { path = "../algol-iir-compiler" }
flow-matic-iir-compiler = { path = "../flow-matic-iir-compiler" }
cobol-iir-compiler = { path = "../cobol-iir-compiler" }
interpreter-ir        = { path = "../interpreter-ir" }
cli-builder           = { path = "../cli-builder" }
iir-to-llvm           = { path = "../iir-to-llvm" }
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
iir-builtin-lowering  = { path = "../iir-builtin-lowering" }
riscv-backend         = { path = "../riscv-backend" }
riscv-encoder         = { path = "../riscv-encoder" }
intel8008-backend     = { path = "../intel8008-backend" }
intel8008-encoder     = { path = "../intel8008-encoder" }
armv7-backend         = { path = "../armv7-backend" }
armv7-encoder         = { path = "../armv7-encoder" }
intel4004-backend     = { path = "../intel4004-backend" }
intel4004-encoder     = { path = "../intel4004-encoder" }
ge225-backend         = { path = "../ge225-backend" }
ge225-encoder         = { path = "../ge225-encoder" }
ibm704-backend        = { path = "../ibm704-backend" }
ibm704-encoder        = { path = "../ibm704-encoder" }
arm1-backend          = { path = "../arm1-backend" }
arm1-encoder          = { path = "../arm1-encoder" }
mos6502-backend       = { path = "../mos6502-backend" }
mos6502-encoder       = { path = "../mos6502-encoder" }
m68k-backend          = { path = "../m68k-backend" }
m68k-encoder          = { path = "../m68k-encoder" }
aot-core              = { path = "../aot-core" }
jit-core              = { path = "../jit-core" }
# JIT McCarthy path (W15): the universal bytecode JIT (`jit-core`) executes
# McCarthy by dispatching its `lispy_*` builtins to the shared tagged-word value
# runtime (`dynval-runtime`), bridged through the VM's `Value`.
vm-core               = { path = "../vm-core" }
dynval-runtime         = { path = "../dynval-runtime" }

[[bin]]
name = "lang-aot"
path = "bin/lang_aot.rs"

[dev-dependencies]
tempfile = "3"
# In-repo wasm module runtime — used to RUN emitted wasm in tests and assert
# the computed result (LANG77 / McCarthy L3b-3a-2). Keeps wasm verification
# zero-external-dep.
wasm-runtime = { path = "../wasm-runtime" }
# The host-interface + value types the runtime resolves imports against. The
# LANG-MATRIX harness implements a tiny `HostInterface` to satisfy the generic
# `env.__print_i64` stdout import an I/O language (Dartmouth BASIC) emits, so
# its `PRINT` output can be captured and asserted (LM-W BASIC).
wasm-execution = { path = "../wasm-execution" }
wasm-types = { path = "../wasm-types" }
# In-repo JVM class-file parser + bytecode simulator — used to RUN the emitted
# JVM class in tests and assert the computed result (LANG77 / McCarthy W3a),
# mirroring how wasm-runtime verifies the wasm path. Keeps JVM verification
# zero-external-dep (no `java` needed for the scalar path).
jvm-class-file = { path = "../jvm-class-file" }
jvm-simulator = { path = "../jvm-simulator" }
# In-repo CLR (CIL) bytecode simulator — used to RUN the emitted CIL in tests and
# assert the computed result (LANG77 / McCarthy W6a), mirroring jvm-simulator.
clr-simulator = { path = "../clr-simulator" }
mccarthy-lisp-vm = { path = "../mccarthy-lisp-vm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
