ing lesson, ਕ (kakkaa) checkpoints, strokes 1–2</text><text x="16" y="259.23" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 190, commit de1e560; Apache-2.0)</text><text x="16" y="271.73" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
