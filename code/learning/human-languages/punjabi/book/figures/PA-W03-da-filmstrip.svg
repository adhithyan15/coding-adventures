<svg xmlns="http://www.w3.org/2000/svg" width="822" height="298.76" viewBox="0 0 822 298.76" role="img" aria-label="How to write ਦ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ਦ</title><desc>5 frames; frame N shows movements 1 to N of ਦ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਦ (daddaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 730, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L730&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਦ in two pen-down strokes: the headline from left to right; then from the top right down the stem, left along the bar, clockwise round the knob, and down and round to the bottom right. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the knob as a solid teardrop, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਦ, each by a different non-native copyist; only counts and shares are cited. 65% (13 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 70% (14 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="298.76" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="192.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="192.76" viewBox="-77 -692 771 990.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M368 0Q277 0 218 35.5Q159 71 130 134Q101 197 101 280L101 291L83 291Q55 291 43.5 302Q32 313 32 329Q32 353 50 379.5Q68 406 93 424Q118 442 139 442Q163 442 172.5 425.5Q182 409 182 387L182 362L447 362L447 551L-7 551L-7 622L624 622L624 551L527 551L527 320L498 291L182 291Q182 223 199 180Q216 137 243 114Q270 91 303 82Q336 73 369 73Q416 73 456.5 84Q497 95 542 117L570 46Q476 0 368 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L326 586 L365 586 L404 586 L443 586 L482 586 L521 586 L560 586 L599 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="599" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="308.5" y="201.8" text-anchor="middle" font-size="61.8" fill="#6b7280"><tspan x="308.5" y="201.8">1. draw the headline</tspan><tspan x="308.5" y="277.2">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="192.7