><text x="16" y="266.69" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="279.19" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
