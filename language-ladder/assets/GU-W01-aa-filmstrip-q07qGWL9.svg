<svg xmlns="http://www.w3.org/2000/svg" width="822" height="251.37" viewBox="0 0 822 251.37" role="img" aria-label="How to write આ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing આ</title><desc>5 frames; frame N shows movements 1 to N of આ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, આ animation, first through third SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates આ as three ordered pen-down runs. Its first SVG path writes the joined અ body: the upper-left open curve flows clockwise into the broad lower body, rises through the middle shoulder, and finishes through the small right arch. The animation lifts once and its second SVG path descends અ&apos;s separate right stem into a lower-right foot. It lifts again and the third SVG path descends the added trailing ā stem into a matching foot. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the same અ body, first right stem, and extra trailing stem, though its printed body is broader, its joins more angular, and its two stems more widely spaced than the animated school-hand form. This learner path preserves the source&apos;s body-before-first-stem-before-trailing-stem order and two-lift evidence while fitting all three runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, slant, or join these parts differently.</desc><rect x="0" y="0" width="822" height="251.37" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="157.87" rx="6" fill="#fdfdf