<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">The Forme authoring pipeline</title>
  <desc id="description">Source content flows through typed intermediate representations into reusable web, print, feed, and application surfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <g opacity="0.18" fill="none" stroke="#93c5fd">
    <circle cx="1090" cy="65" r="120"/>
    <circle cx="1090" cy="65" r="78"/>
    <circle cx="110" cy="380" r="105"/>
  </g>
  <text x="64" y="72" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">One pipeline, many surfaces.</text>
  <text x="64" y="105" fill="#bae6fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Forme keeps content, style, assets, and deployment policy independently reusable.</text>
  <g filter="url(#shadow)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(64 150)">
      <rect width="250" height="170" rx="22" fill="#111827" stroke="#334155"/>
      <rect x="22" y="22" width="58" height="58" rx="16" fill="#0c4a6e"/>
      <path d="M38 41h26M38 53h20M38 65h15" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="112" fill="#f8fafc" font-size="23" font-weight="700">Source</text>
      <text x="22" y="140" fill="#94a3b8" font-size="16">Markdown + local assets</text>
    </g>
    <path d="M334 235 H425" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(446 150)">
      <rect width="308" height="170" rx="22" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
      <rect x="22" y="22" width="58" height="58" rx="16" fill="#4c1d95"/>
      <path d="M39 39h24v24H39zM33 51h36M51 33v36" fill="none" stroke="#c4b5fd" stroke-width="4"/>
      <text x="22" y="112" fill="#f8fafc" font-size="23" font-weight="700">Typed IR</text>
      <text x="22" y="140" fill="#94a3b8" font-size="16">Content · Style · Asset · Route</text>
    </g>
    <path d="M774 235 H865" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(886 150)">
      <rect width="250" height="170" rx="22" fill="#111827" stroke="#334155"/>
      <rect x="22" y="22" width="58" height="58" rx="16" fill="#064e3b"/>
      <path d="M36 61l13-20 10 13 8-10 7 17z" fill="#6ee7b7"/>
      <text x="22" y="112" fill="#f8fafc" font-size="23" font-weight="700">Surfaces</text>
      <text x="22" y="140" fill="#94a3b8" font-size="16">Web · Feed · Print · App</text>
    </g>
  </g>
  <g id="pipeline">
    <rect x="446" y="344" width="308" height="38" rx="19" fill="url(#accent)" opacity="0.92"/>
    <text x="600" y="369" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">COMPOSE · VERIFY · DEPLOY</text>
  </g>
</svg>
