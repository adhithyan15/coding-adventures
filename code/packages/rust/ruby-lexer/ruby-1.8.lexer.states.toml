matcher = { eof = true }
to = "done"
consume = false
actions = ["set_text(*)", "emit(Op)", "emit(Eof)"]

# ─────────────────────────────────────────────────────────────────
# Phase 4i — instance / class variables  (`@x`, `@@x`)
# ─────────────────────────────────────────────────────────────────
# When `@` is seen at `data`, the dispatcher transitions to
# `after_at` with the text buffer pre-seeded as `@`.  This peek
# state then disambiguates:
#
#   @@x   →  cvar_body   (second `@` appended, then ident body)
#   @x    →  ivar_body   (ident-starter appended, then ident body)
#   @<X>  →  parse_error (and `@` falls back to a bare Op so the
#                          caller still gets a token stream)
#
# Both bodies emit `Name` with the full lexeme (e.g. `@count`,
# `@@all`).  The parser / SIR lowerer dispatch on the sigil prefix.

[[transitions]]
from = "after_at"
matcher = { literal = "@" }
to = "cvar_body"
actions = ["append_text(@)"]

[[transitions]]
from = "after_at"
matcher = { literal = "_" }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "after_at"
matcher = { range = ["a", "z"] }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "after_at"
matcher = { range = ["A", "Z"] }
to = "ivar_body"
actions = ["append_text(current)"]

# `@` followed by a digit (`@1`) or anything else: not a valid
# ivar.  Record a diagnostic and emit `@` as a generic Op so the
# parser still gets a clean stream.
[[transitions]]
from = "after_at"
matcher = { anything = true }
to = "data"
consume = false
actions = ["parse_error(invalid_ivar)", "set_text(@)", "emit(Op)"]

[[transitions]]
from = "after_at"
matcher = { eof = true }
to = "done"
consume = false
actions = ["parse_error(invalid_ivar)", "set_text(@)", "emit(Op)", "emit(Eof)"]

# ivar / cvar body share the same ident-char acceptance pattern as
# `ident_body`, minus the trailing `?` / `!` characters (those are
# method-name decorations and don't apply to variable names).
[[transitions]]
from = "ivar_body"
matcher = { literal = "_" }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "ivar_body"
matcher = { range = ["a", "z"] }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "ivar_body"
matcher = { range = ["A", "Z"] }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "ivar_body"
matcher = { range = ["0", "9"] }
to = "ivar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "ivar_body"
matcher = { anything = true }
to = "data"
consume = false
actions = ["emit(Name)"]

[[transitions]]
from = "ivar_body"
matcher = { eof = true }
to = "done"
consume = false
actions = ["emit(Name)", "emit(Eof)"]

# cvar_body — entered after the second `@` has been appended.
# We still need at least one ident character to follow; if not,
# the lexeme `@@` alone is invalid and gets reported.
[[transitions]]
from = "cvar_body"
matcher = { literal = "_" }
to = "cvar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "cvar_body"
matcher = { range = ["a", "z"] }
to = "cvar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "cvar_body"
matcher = { range = ["A", "Z"] }
to = "cvar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "cvar_body"
matcher = { range = ["0", "9"] }
to = "cvar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "cvar_body"
matcher = { anything = true }
to = "data"
consume = false
actions = ["emit(Name)"]

[[transitions]]
from = "cvar_body"
matcher = { eof = true }
to = "done"
consume = false
actions = ["emit(Name)", "emit(Eof)"]

# ─────────────────────────────────────────────────────────────────
# Phase 4j — global variables  (`$x`)
# ─────────────────────────────────────────────────────────────────
# When `$` is seen at `data`, the dispatcher seeds the text buffer
# with `$` and transitions to `after_dollar`, which requires at
# least one ident-starter to follow.  Any other follower falls back
# to emitting `$` as a bare Op token with a diagnostic, so the
# parser still gets a clean stream.  Future phases can extend
# `after_dollar` to handle Ruby's punctuation globals (`$~`, `$&`,
# `$_`, `$0`..`$9`, `$LOAD_PATH`-style names, etc.).
[[transitions]]
from = "after_dollar"
matcher = { literal = "_" }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "after_dollar"
matcher = { range = ["a", "z"] }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "after_dollar"
matcher = { range = ["A", "Z"] }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "after_dollar"
matcher = { anything = true }
to = "data"
consume = false
actions = ["parse_error(invalid_gvar)", "set_text($)", "emit(Op)"]

[[transitions]]
from = "after_dollar"
matcher = { eof = true }
to = "done"
consume = false
actions = ["parse_error(invalid_gvar)", "set_text($)", "emit(Op)", "emit(Eof)"]

[[transitions]]
from = "dollar_body"
matcher = { literal = "_" }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "dollar_body"
matcher = { range = ["a", "z"] }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "dollar_body"
matcher = { range = ["A", "Z"] }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "dollar_body"
matcher = { range = ["0", "9"] }
to = "dollar_body"
actions = ["append_text(current)"]

[[transitions]]
from = "dollar_body"
matcher = { anything = true }
to = "data"
consume = false
actions = ["emit(Name)"]

[[transitions]]
from = "dollar_body"
matcher = { eof = true }
to = "done"
consume = false
actions = ["emit(Name)", "emit(Eof)"]
