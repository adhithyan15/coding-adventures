<svg xmlns="http://www.w3.org/2000/svg" width="982" height="320.77" viewBox="0 0 982 320.77" role="img" aria-label="How to write 回: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 回</title><desc>6 frames; frame N shows movements 1 to N of 回 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 回.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%9B%9E.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 回, in two pieces. Medians 1–2 draw the large frame&apos;s left side, then a horizontal that turns down its right side without lifting. Medians 3–5 draw a small 口 inside it in the order the standalone character uses. Median 6 closes the large frame along the foot, as 国 closes. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="320.77" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="227.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="227.27" viewBox="12 -869 977 1480.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M374 500L374 271L618 271L618 500L374 500ZM303 568L692 568L692 204L303 204L303 568ZM82 799L919 799L919 -79L839 -79L839 724L159 724L159 -79L82 -79L82 799ZM126 46L885 46L885 -25L126 -25L126 46Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 774 L120 774" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 774 L120 -54" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="120" cy="-54" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="297.3" text-anchor="middle" font-size="78.3" fill="#6b7280"><tspan x="500.5" y="297.3">1. draw the large</tspan><tspan x="500.5" y="392.8">frame&apos;s left side</tspan></text></svg><rect x="176" y="42" width="150" height="227.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="227.27" viewBox="12 -869 977 1480.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M374 500L374 271L618 271L618 500L374 500ZM303 568L692 568L692 204L303 204L303 568ZM82 799L919 799L919 -79L839 -79L839 724L159 724L159 -79L82 -79L82 799ZM126 46L885 46L885 -25L126 -25L126 46Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 774 L120 -54" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M120 761 L120 761" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 761 L879 761 L879 -54" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="879" cy="-54" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="297.3" text-anchor="middle" font-size="78.3" fill="#6b7280"><tspan x="500.5" y="297.3">2. lift, then draw the</tspan><tspan x="500.5" y="392.8">large frame&apos;s top and</tspan><tspan x="500.5" y="488.4">turn down its right</tspan><tspan x="500.5" y="583.9">side</tspan></text></svg><rect x="336" y="42" width="150" height="227.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="227.27" viewBox="12 -869 977 1480.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M374 500L374 271L618 271L618 500L374 500ZM303 568L692 568L692 204L303 204L303 568ZM82 799L919 799L919 -79L839 -79L839 724L159 724L159 -79L82 -79L82 799ZM126 46L885 46L885 -25L126 -25L126 46Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 774 L120 -54" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M120 761 L879 761 L879 -54" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M338 544 L338 544" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M338 544 L338 226" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="338" cy="226" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="297.3" text-anchor="middle" font-size="78.3" fill="#6b7280"><tspan x="500.5" y="297.3">3. lift, then draw 口&apos;s</tspan><tspan x="500.5" y="392.8">left side</tspan></text></svg><rect x="496" y="42" width="150" height="227.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="227.27" viewBox="12 -869 977 1480.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M374 500L374 271L618 271L618 500L374 500ZM303 568L692 568L692 204L303 2