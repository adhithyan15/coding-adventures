<svg xmlns="http://www.w3.org/2000/svg" width="342" height="392.51" viewBox="0 0 342 392.51" role="img" aria-label="How to write و: one unbroken stroke · 2 movements"><title>Writing و</title><desc>2 frames; frame N shows movements 1 to N of و (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Dāl, re, and wāw, independent و handwriting animation and Wāw instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/dal-re-and-waw/&gt;. Source note on variation: The independent-form handwriting animation shows one uninterrupted stroke: shape the head as a loop, then continue down and left through the tail without lifting. The adjacent prose says the handwritten head is a loop, while calligraphic or printed wāw often has a solid, thicker, rounder head; it identifies wāw as a nonconnector with consonant v/w and vowel o, au, and ū values. This learner path covers the independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Persian or Arabic و sources.</desc><rect x="0" y="0" width="342" height="392.51" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="261.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="261.51" viewBox="-36 -410 523 911.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M193 -203Q172 -203 141.5 -193.5Q111 -184 81.5 -169Q52 -154 34 -139L48 -106Q75 -116 105.5 -120.5Q13