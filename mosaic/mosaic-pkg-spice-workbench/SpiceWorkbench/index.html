<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpiceWorkbench</title>
</head>
<body>
  <section data-component="SpiceWorkbench" data-mosaic-html-root="SpiceWorkbench">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="SpiceWorkbench">
      <div style="display: flex; flex-direction: column; background: #f8fafc; color: #1f2937; padding: 16px; gap: 12px">
        <div style="display: flex; flex-direction: row; align: center-vertical">
          <span style="width: 100%; font-size: 20px; font-weight: bold; color: #0f172a">{{workbenchTitle}}</span>
          <span style="background: #e0f2fe; color: #075985; border-radius: 4px; padding: 5px">{{modeLabel}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: bold; color: #475569">{{netlistLabel}}</span>
          <!-- emit "onNetlistChange" dropped: HTML is static -->
          <textarea placeholder="{{netlistPlaceholder}}" data-on-change="onNetlistChange" style="min-height: 240px; background: #ffffff; color: #0f172a; border-width: 1px; border-color: #cbd5e1; border-radius: 4px; padding: 10px; font-family: monospace">{{netlistText}}</textarea>
          <div style="display: flex; flex-direction: row; gap: 8px">
            <!-- emit "onInspect" dropped: HTML is static -->
            <button data-on-click="onInspect" style="background: #e0f2fe; color: #075985; border-width: 1px; border-color: #7dd3fc; border-radius: 4px; padding: 8px">{{inspectLabel}}</button>
            <!-- emit "onRun" dropped: HTML is static -->
            <button data-on-click="onRun" style="background: #dcfce7; color: #166534; border-width: 1px; border-color: #86efac; border-radius: 4px; padding: 8px">{{runLabel}}</button>
          </div>
          <span style="font-size: 12px; font-weight: bold; color: #475569">{{diagnosticsLabel}}</span>
          <span style="color: #334155">{{diagnostics}}</span>
        </div>
        <div style="display: flex; flex-direction: row; gap: 14px">
          <div style="display: flex; flex-direction: column; width: 30%; gap: 6px">
            <span style="font-size: 12px; font-weight: bold; color: #475569">{{analysisLabel}}</span>
            <!-- mosaic-for each="analysisRows" as="analysis" index="analysis-index" -->
              <!-- emit "onSelectAnalysis" dropped: HTML is static -->
              <button data-on-click="onSelectAnalysis" style="background: #ffffff; color: #0f172a; border-width: 1px; border-color: #cbd5e1; border-radius: 3px; padding: 7px">{{analysis [ 0 ]}}</button>
            <!-- /mosaic-for -->
            <span style="color: #0369a1; font-weight: bold">{{selectedAnalysisLabel}}</span>
          </div>
          <div style="display: flex; flex-direction: column; width: 70%; gap: 6px">
            <span style="font-size: 12px; font-weight: bold; color: #475569">{{resultLabel}}</span>
            <span style="min-height: 160px; background: #ffffff; color: #0f172a; border-width: 1px; border-color: #cbd5e1; border-radius: 4px; padding: 10px; font-family: monospace; white-space: pre-wrap">{{resultText}}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
