<svg xmlns="http://www.w3.org/2000/svg" width="982" height="252.76" viewBox="0 0 982 252.76" role="img" aria-label="How to write ங: 2 strokes · 1 pen lift · 6 movements"><title>Writing ங</title><desc>6 frames; frame N shows movements 1 to N of ங (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 2, ங (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Appendix I Frame 2 numbers a detached descending upright before five joined movements build ங&apos;s framed and returning body. The bundled Noto Sans Tamil face places that detached upright on the right and squares the handwritten lower return; Tamil handwriting varies by school, so this is one attested two-run order fitted to the font rather than a national standard.</desc><rect x="0" y="0" width="982" height="252.76" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="159.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="159.26" viewBox="18 -624 1008 1070.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L604 554L604 482L430 482L430 324Q450 336 482 349Q514 362 558 362Q608 362 644 343Q680 324 699 288Q718 252 718 201Q718 165 708 132Q698 99 682 72L804 72L804 0L344 0L344 72L595 72Q612 97 622 127.5Q632 158 632 192Q632 245 607 267Q582 289 543 289Q511 289 481.5 276Q452 263 430 246L430 144L344 144L344 482L174 482L174 0L88 0ZM733 0L733 72L870 72L870 554L956 554L956 0L733 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M915 520 L915 52