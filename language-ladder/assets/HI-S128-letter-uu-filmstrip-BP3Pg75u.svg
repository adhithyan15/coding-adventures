1 364 350.5 386Q390 408 390 458Q390 494 368.5 522Q347 550 312 563L418 563ZM400 346Q453 304 476 261Q499 218 499 168Q499 89 448.5 44.5Q398 0 318 0Q268 0 227 16Q186 32 151.5 68Q117 104 87 163Q57 222 29 308L102 338Q133 241 163 183Q193 125 228 99.5Q263 74 308 74Q355 74 384.5 99Q414 124 414 173Q414 221 389.5 256Q365 291 317 319L400 346Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 555 L390 530 L420 500 L435 460 L420 420 L380 380 L330 345 L275 325 L235 320 L280 325 L330 335 L380 325 L420 290 L450 240 L465 180 L450 125 L420 85 L375 55 L325 40 L275 45 L225 65 L180 95 L140 135 L110 180 L85 230 L70 280" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M455 250 L490 280 L535 305 L585 310 L630 295 L670 270 L700 235 L715 195 L715 150 L705 105 L685 65 L660 25 L635 -5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L135 585 L265 585 L395 585 L525 585 L655 585 L795 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="795" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="400" y="225.3" text-anchor="middle" font-size="75.3" fill="#6b7280"><tspan x="400" y="225.3">4. lift, then draw the</tspan><tspan x="400" y="317.2">shirorekha left-to-right</tspan></text></svg><text x="16" y="249.57" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Saurmandal, ‘Devanagari ऊ stroke order.svg’, panels 1–3, Wikimedia Commons, 5 August 2023</text><text x="16" y="262.07" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
