[package]
name = "iir-to-jvm-class-file"
version = "0.13.0"
edition = "2021"
description = "IIR → JVM class file backend — lowers IIRModule to JvmClassFile.  v0.13.0 (LANG-FULL E2 integration — compute-wide + mask): narrow **unsigned** types (u4/u8/u16/u32) now ride the JVM **long register model** (long locals/`J` descriptors + `ladd`/`land`/… ops + `ldc2_w <mask>; land`) instead of int. The int-op approach failed JVM verification the moment a narrow op met a `long` operand (a const/let) — exactly a real frontend's value model (Nib materialises every const/let as i64). Computing wide and masking the value is operand-width-agnostic, matching the vm/jit/llvm/native/wasm backends. (u4 newly recognised; u32 now masks; long shift counts narrowed via l2i.)  v0.12.0 (E2 backend 4/6): masked narrow results with `iconst/sipush/ldc <mask>; iand` after the int op (superseded by v0.13.0's long model).  v0.11.0 (LANG-MATRIX LM-J Brainfuck): adds the lowered byte-tape ops alloc_bytes (no-op — the tape is the static env/BFRuntime.__tape field), load_byte/store_byte (baload/bastore with l2i/i2l conversions for the widened i64 value model), and width-correct i64 branch conditions (lcmp before ifeq/ifne) — so the i64-widened Brainfuck runs on the JVM.  v0.7.0 (G3): whitelist call_builtin print_i64 and lower it to invokestatic env/BasicRuntime.println(J)V, mirroring iir-to-wasm v0.8.0's env.__print_i64 host import.  Together they let BASIC's PRINT reach real JVM and wasm bytecode."

[lib]
name = "iir_to_jvm_class_file"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
jvm-class-file = { path = "../jvm-class-file" }
codegen-core   = { path = "../codegen-core" }
