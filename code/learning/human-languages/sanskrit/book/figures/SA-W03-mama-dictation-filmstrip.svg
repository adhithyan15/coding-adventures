l="#64748b">Stroke order after letters 1 and 2: JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009; the shared headline, drawn last: HP Labs India, Lipi Toolkit, Lipi</text><text x="16" y="326.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Indic Character Recognizers 4.0, Devanagari recognizer: native writers&apos; stored prototypes of the 33 consonants draw the headline as the last stroke in 82% of 2,706 and as the first</text><text x="16" y="338.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">in about 5% (MIT licence, 2012)</text><text x="16" y="351.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
