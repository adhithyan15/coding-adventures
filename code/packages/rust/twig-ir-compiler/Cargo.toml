[package]
name = "twig-ir-compiler"
version = "0.27.0"
edition = "2021"
description = "TW00 — Twig (Lisp-precursor) → InterpreterIR (IIR) compiler.  v0.27.0 (LANG-FULL E4): immutable top-level string value defines lower to `str_const` registers, letting `string-length`, `string-append`, `string=?`, and `string-ref` run over named string values without dynamic globals/builtins.  v0.26.0 (LANG-FULL E4): literal `(string-ref \"...\" i)` lowers to typed `str_const` + integer `const` + `str_index`, letting every backend prove direct ASCII string indexing without dynamic builtin paths.  v0.25.0 (LANG-FULL E4): literal `(string-length \"...\")`, `(string=? \"...\" \"...\")`, and `(string-length (string-append \"...\" \"...\"))` lower to typed `str_const` + `str_len`/`str_eq`/`str_concat`, letting every backend prove direct string length, equality, and append length without dynamic builtin paths.  Path A increment 4 (LANG-FULL TW2): a top-level value `define` that is not captured by a lambda keeps its statically-typed value in a `main` register (reads return it directly) instead of the `call_builtin \"global_set\"`/`global_get` pair the code-gen backends reject — so top-level constants now run cross-backend, not just on the VM.  Path A increment 3 (LANG-FULL TW1): typed *variadic* arithmetic — an all-i64 `(+ a b c …)` / `-` / `*` / `/` call folds to a left-associated chain of typed binary CIR ops, so n-ary arithmetic clears the code-gen backend validators instead of falling back to the rejected `call_builtin \"any\"` path.  LANG52: let*, and/or special forms.  LANG55: HOF builtins.  LANG56: IIRExport from module_info.  LANG57: match jmpif bug fix + string/symbol conversion builtins.  LANG58: string/char builtins for TW05-E.  LANG72: compile_program_with_externs_and_globals for cross-module strict type checking.  Path A increment 6a: typed make_nil → const 0 [ref<LispyPair>].  Path A increment 6b: typed cons → alloc + field_store.  Path A increment 6c: typed car/cdr → field_load [ref<any>]."

[dependencies]
twig-parser        = { path = "../twig-parser" }
twig-lexer         = { path = "../twig-lexer" }
interpreter-ir     = { path = "../interpreter-ir" }
# LANG23 PR 23-E: convert parsed TypeAnnotation → RefinedType for IIR annotation fields.
lang-refined-types = { path = "../lang-refined-types" }
# LANG49 TW05-B: optional type-check pre-pass for (typed lenient|strict) modules.
twig-type-checker  = { path = "../twig-type-checker" }
# LANG50: AnnotatedNode type for post-processing type_hint fields.
type-declarations  = { path = "../type-declarations" }

[dev-dependencies]
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/backend_encode.rs serialises WasmModule -> bytes.
wasm-module-encoder   = { path = "../wasm-module-encoder" }
