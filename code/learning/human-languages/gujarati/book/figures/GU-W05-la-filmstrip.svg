<svg xmlns="http://www.w3.org/2000/svg" width="502" height="331.22" viewBox="0 0 502 331.22" role="img" aria-label="How to write લ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing લ</title><desc>3 frames; frame N shows movements 1 to N of લ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, લ animation, first through third SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates લ as three ordered pen-down runs. Its first SVG path begins at the upper right, circles counterclockwise around the broad rounded left body, and finishes at its lower-right terminal. The animation lifts once and its second SVG path sweeps the separate middle shoulder from left to right. It lifts again and its third SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the broad rounded body, middle shoulder, tall right spine, and lower foot, but its printed body is wider, its shoulder rises diagonally, and its spine is straighter than the animated school-hand form. This learner path preserves the source&apos;s rounded-body-before-middle-shoulder-before-right-spine order and two-lift evidence while fitting all three runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, join, or slant the body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="502" height="331.22" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="225.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="225.22" viewBox="-26 -673 739 1109.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M279 105Q172 105 108 167Q44 229 44 337Q44 438 110.5 507Q177 576 299 603L319 528Q226 509 176 462.5Q126 416 126 333Q126 255 169 217Q212 179 276 179Q308 179 333 184Q358 189 380 199L411 132Q384 119 350.5 112Q317 105 279 105ZM244 304L226 377L477 428L477 603L557 592L557 152Q557 125 560 112.5Q563 100 569 92Q580 78 601 75.5Q622 73 643 73L635 0L625 0Q590 0 559.5 7.5Q529 15 508 37Q489 57 483 81.5Q477 106 477 148L477 352L244 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M300 565 L300 565" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M300 565 L245 550 L190 525 L145 490 L110 445 L90 390 L85 335 L95 280 L120 230 L160 190 L210 160 L265 145 L320 150 L370 170" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="370" cy="170" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="199.2" text-anchor="middle" font-size="59.2" fill="#6b7280"><tspan x="343.5" y="199.2">1. circle</tspan><tspan x="343.5" y="271.4">counterclockwise around</tspan><tspan x="343.5" y="343.6">the broad rounded left</tspan><tspan x="343.5" y="415.9">body</tspan></text></svg><rect x="176" y="42" width="150" height="225.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="225.22" viewBox="-26 -673 739 1109.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M279 105Q172 105 108 167Q44 229 44 337Q44 438 110.5 507Q177 576 299 603L319 528Q226 509 176 462.5Q126 416 126 333Q126 255 169 217Q212 179 276 179Q308 179 333 184Q358 189 380 199L411 132Q384 119 350.5 112Q317 105 279 105ZM244 304L226 377L477 428L477 603L557 592L557 152Q557 125 560 112.5Q563 100 569 92Q580 78 601 75.5Q622 73 643 73L635 0L625 0Q590 0 559.5 7.5Q529 15 508 37Q489 57 483 81.5Q477 106 477 148L477 352L244 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M300 565 L245 550 L190 525 L145 490 L110 445 L90 390 L85 335 L95 280 L120 230 L160 190 L210 160 L265 145 L320 150 L370 170" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M235 340 L235 340" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M235 340 L285 350 L335 360 L385 370 L430 380 L475 390" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="475" cy="390" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="199.2" text-anchor="middle" font-size="59.2" fill="#6b7280"><tspan x="343.5" y="199.2">2. lift and sweep the</tspan><tspan x="343.5" y="271.4">middle shoulder from</tspan><tspan x="343.5" y="343.6">left to right</tspan></text></svg><rect x="336" y="42" width="150" height="225.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="225.22" viewBox="-26 -673 739 1109.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M279 105Q172 105 108 167Q44 229 44 337Q44 438 110.5 507Q177 576 299 603L319 528Q226 509 176 462.5Q126 416 126 333Q126 255 169 217Q212 179 276 179Q308 179 333 184Q358 189 380 199L411 132Q384 119 350.5 112Q317 105 279 105ZM244 304L226 377L477 428L477 603L557 592L557 152Q557 125 560 112.5Q563 100 569 92Q580 78 601 75.5Q622 73 643 73L635 0L625 0Q590 0 559.5 7.5Q529 15 508 37Q489 57 483 81.5Q477 106 477 148L477 352L244 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M300 565 L245 550 L190 525 L145 490 L110 445 L90 390 L85 335 L95 280 L120 230 L160 190 L210 160 L265 145 L320 150 L370 170" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M235 340 L285 350 L335 360 L385 370 L430 380 L475 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M517 585 L517 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M517 585 L517 500 L517 400 L517 300 L517 200 L517 125 L525 80 L550 55 L585 40 L620 38 L635 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="635" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="199.2" text-anchor="middle" font-size="59.2" fill="#6b7280"><tspan x="343.5" y="199.2">3. lift, descend the</tspan><tspan x="343.5" y="271.4">tall right spine, and</tspan><tspan x="343.5" y="343.6">turn through its lower</tspan><tspan x="343.5" y="415.9">foot</tspan></text></svg><text x="16" y="280.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, લ</text><text x="16" y="292.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">animation, first through third SVG paths</text><text x="16" y="305.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
