[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-image-codec-png"
version = "0.1.0"
description = "IC18: bounded PNG encoder and decoder using PixelContainer"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = [
    "coding-adventures-pixel_container>=0.1.0",
    "coding-adventures-zip>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "Pillow>=11.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image_codec_png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=image_codec_png --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["image_codec_png"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
