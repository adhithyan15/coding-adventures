stroke-linejoin="round"/><path class="ductus__done" d="M95 546 L95 546" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M95 546 L300 546 L520 546 L690 546 L690 380 L690 160 L690 45 L720 0 L800 -28 L875 -28 L920 15 L940 80 L945 120" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="945" cy="120" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="306.8" text-anchor="middle" font-size="86.8" fill="#6b7280"><tspan x="505.5" y="306.8">2. lift, cross right,</tspan><tspan x="505.5" y="412.7">turn downward and hook</tspan><tspan x="505.5" y="518.6">left at the foot</tspan></text></svg><text x="16" y="255.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 九.json, ordered stroke</text><text x="16" y="268.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="280.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="293.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="305.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
