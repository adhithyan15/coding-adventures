<svg xmlns="http://www.w3.org/2000/svg" width="822" height="306.81" viewBox="0 0 822 306.81" role="img" aria-label="How to write 必: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 必</title><desc>5 frames; frame N shows movements 1 to N of 必 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 必.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%BF%85.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 必. Median 1 draws a dot on the left; median 2 a curve along the foot that hooks up without lifting, as in 心; median 3 a dot on top; median 4 a long left-falling stroke from the upper right through the curve to the lower left; median 5 the dot on the right, last. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the hook and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="306.81" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="200.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.81" viewBox="-39 -907 1080 1445.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform=