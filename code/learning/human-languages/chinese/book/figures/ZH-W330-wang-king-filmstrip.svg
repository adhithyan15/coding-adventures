<svg xmlns="http://www.w3.org/2000/svg" width="662" height="284.15" viewBox="0 0 662 284.15" role="img" aria-label="How to write 王: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 王</title><desc>4 frames; frame N shows movements 1 to N of 王 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 王.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%8E%8B.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 王. Medians 1–2 draw two horizontals, the upper one first; median 3 the vertical down through them; median 4 the long horizontal along the foot, which closes the vertical. The left piece of 现 is written the same way, its last stroke rising. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="284.15" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="178.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="178.15" viewBox="-18 -843 1037 1231.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M103 773L897 773L897 699L103 699L103 773ZM147 422L863 422L863 348L147 348L147 422ZM52 39L949 39L949 -35L52 -35L52 39ZM460 754L538 754L538 -9L460 -9L460 754Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 738 L126 738" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M126 738 L874 738" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="874" cy="738" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="258.1" text-anchor="middle" font-size="83.1" fill="#6b7280"><tspan x="500.5" y="258.1">1. draw the upper</tspan><tspan x="500.5" y="359.5">horizontal</tspan></text></svg><rect x="176" y="42" width="150" height="178.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="178.15" viewBox="-18 -843 1037 1231.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M103 773L897 773L897 699L103 699L103 773ZM147 422L863 422L863 348L147 348L147 422ZM52 39L949 39L949 -35L52 -35L52 39ZM460 754L538 754L538 -9L460 -9L460 754Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M126 738 L874 738" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M166 390 L166 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 390 L834 390" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="834" cy="390" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="258.1" text-anchor="middle" font-size="83.1" fill="#6b7280"><tspan x="500.5" y="258.1">2. lift, then draw the</tspan><tspan x="500.5" y="359.5">second horizontal</tspan></text></svg>