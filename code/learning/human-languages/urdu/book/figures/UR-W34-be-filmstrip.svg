<svg xmlns="http://www.w3.org/2000/svg" width="342" height="332.39" viewBox="0 0 342 332.39" role="img" aria-label="How to write ب: 2 strokes · 1 pen lift · 2 movements"><title>Writing ب</title><desc>2 frames; frame N shows movements 1 to N of ب (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Be, kāf, and short vowels, independent ب handwriting animation and Be instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/be-kaf-and-short-vowels/&gt;. Source note on variation: The independent-form handwriting animation draws the full be-series bowl first in one uninterrupted right-to-left run, then places the single dot below after one lift. The adjacent prose identifies every be form as a shallow curve with one dot below and instructs writers to complete a word&apos;s right-to-left main line before returning, again right-to-left, to add dots and other marks. This learner path covers the independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Arabic or Persian ب sources.</desc><rect x="0" y="0" width="342" height="332.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="201.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.39" viewBox="0 -478 793 1064.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM380 -206Q336 -173 308 -141Q334 -115 351 -97Q368 -79 378 -68Q394 -85 410.5 -101.5Q427 -118 444 -133Q433 -149 416.5 -167.5Q400 -186 380 -206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L678 382" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="255" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="409.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="409.5">1. sweep the independent</tspan><tspan x="396.5" y="487">be-series bowl from</tspan><tspan x="396.5" y="564.4">right to left</tspan></text></svg><rect x="176" y="42" width="150" height="201.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.39" viewBox="0 -478 793 1064.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM380 -206Q336 -173 308 -141Q334 -115 351 -97Q368 -79 378 -68Q394 -85 410.5 -101.5Q427 -118 444 -133Q433 -149 416.5 -167.5Q400 -186 380 -206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M412 -137 L412 -137" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M412 -137 L379 -101 L344 -137" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="344" cy="-137" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="409.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="409.5">2. after one lift, place</tspan><tspan x="396.5" y="487">the single dot below</tspan></text></svg><text x="16" y="256.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Be, kāf, and short vowels,</text><text x="16" y="268.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">independent ب handwriting animation and Be instructions</text><text x="16" y="281.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Northwestern University Libraries Open Textbook, 2026)</text><text x="16" y="293.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="306.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
