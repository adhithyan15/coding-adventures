<svg xmlns="http://www.w3.org/2000/svg" width="662" height="323.79" viewBox="0 0 662 323.79" role="img" aria-label="How to write ಇ: one unbroken stroke · 4 movements"><title>Writing ಇ</title><desc>4 frames; frame N shows movements 1 to N of ಇ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Yogesh, Animation of hand-writing Kannada character &quot;ಇ&quot;.gif, independent vowel ಇ, 98 frames, 4.6 seconds (Wikimedia Commons, 26 December 2015) &lt;https://commons.wikimedia.org/wiki/File:Animation_of_hand-writing_Kannada_character_%22%E0%B2%87%22.gif&gt;. Source note on variation: The 98-frame animation writes ಇ in one uninterrupted run: climb the left upright, turn over the first arch and descend the middle stem, retrace that stem upward into the second arch, descend the broad outer curve, then close the lower loop and sweep out right. The path is fitted to the bundled Noto Sans Kannada outline; handwritten arch height, loop angularity, and exit length vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="662" height="323.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="217.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.79" viewBox="-44 -633 788 1144.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M321 -12Q255 -12 212.5 7.5Q170 27 149.5 61.5Q129 96 129 140Q129 205 177.5 243.5Q226 282 315 282Q373 282 420 265.5Q467 249 505.5 218.5Q544 188 574 145Q605 104 624 57.5Q643 11 653 -39L570 -55Q556 20 523.5 80Q491 140 439.5 174.5Q388 209 315 209Q264 209 237 191Q210 173 210 141Q210 105 237.5 84Q265 63 326 63Q400 63 450.5 84Q501 105 532.5 141.5Q564 178 578 225Q592 272 