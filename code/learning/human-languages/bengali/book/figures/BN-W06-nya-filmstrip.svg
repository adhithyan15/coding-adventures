<svg xmlns="http://www.w3.org/2000/svg" width="982" height="275.03" viewBox="0 0 982 275.03" role="img" aria-label="How to write ঞ: 2 strokes · 1 pen lift · 6 movements"><title>Writing ঞ</title><desc>6 frames; frame N shows movements 1 to N of ঞ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 20 (ঞ, nya; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 172 of the 191 stored prototypes of nya are two pen-down strokes. The first is the left part, written like the independent e: 163 of those 172 start in the upper half, 169 turn clockwise and 170 end on the left. The second is the right part: 160 start to the right of where the first began, 171 turn clockwise, and 145 end in the lower half. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="982" height="275.03" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="169.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="169.03" viewBox="-24 -702 1023 1152.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M564 0Q551 45 528.5 66Q506 87 465 87Q429 87 398 83Q367 79 333 74.5Q299 70 255 70Q227 70 191 77.5Q155 85 122 106Q89 127 67.5 168.5Q46 2