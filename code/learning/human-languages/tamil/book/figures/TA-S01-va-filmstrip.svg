 class="ductus__caption" x="506.5" y="235.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="506.5" y="235.3">5. rise up the right</tspan><tspan x="506.5" y="336.9">upright</tspan></text></svg><text x="16" y="199.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 9, வ (Univ. of Texas at Austin), p. 194</text><text x="16" y="212.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
