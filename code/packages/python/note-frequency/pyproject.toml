[project]
name = "coding-adventures-note-frequency"
version = "0.1.0"
description = "Parse note names like A4 and map them to equal-tempered frequencies"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=note_frequency --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/note_frequency"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_frequency"]
