<svg xmlns="http://www.w3.org/2000/svg" width="822" height="290.79" viewBox="0 0 822 290.79" role="img" aria-label="How to write ਚ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ਚ</title><desc>5 frames; frame N shows movements 1 to N of ਚ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਚ (chachaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 346, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L346&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਚ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the bowl and the knob, and right along the bar, ending where the bar meets the stem. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the knob as a solid teardrop, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਚ, each by a different non-native copyist; only counts and shares are cited. 75% (15 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 75% (15 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="290.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="184.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.79" viewBox="-77 -692 811 999.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M388 0Q323 0 270.5 27.5Q218 55 182 96Q151 131 128.5 183Q106 235 101 291L83 291Q55 291 43.5 302Q32 313 32 329Q32 353 50 379.5Q68 406 93 424Q118 442 139 442Q163 442 172.5 425.5Q182 409 182 387L182 362L487 362L487 551L-7 551L-7 622L664 622L664 551L568 551L568 175Q568 87 525 43.5Q482 0 388 0ZM487 183L487 291L182 291Q188 229 218.5 179.5Q249 130 295.5 101.5Q342 73 395 73Q418 73 437 78Q456 83 468 96Q477 107 482 124.5Q487 142 487 183Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586 L600 586 L639 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="639" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328.5" y="205" text-anchor="middle" font-size="65" fill="#6b7280"><tspan x="328.5" y="205">1. draw the headline</tspan><tspan x="328.5" y="284.3">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="184.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="184.79" viewBox="-77 -692 811 999.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M388 0Q323 0 270.5 27.5Q218 55 182 96Q151 131 128.5 183Q106 235 101 291L83 291Q55 291 43.5 302Q32 313 32 329Q32 353 50 379.5Q68 406 93 424Q118 442 139 442Q163 442 172.5 425.5Q182 409 182 387L182 362L487 362L487 551L-7 551L-7 622L664 622L664 551L568 551L568 175Q568 87 525 43.5Q482 0 388 0ZM487 183L487 291L182 291Q188 229 218.5 179.5Q249 130 295.5 101.5Q342 73 395 73Q418 73 437 78Q456 83 468 96Q477 107 482 124.5Q487 142 487 183Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L171 586 L210 586 L249 586 L288 586 L327 586 L366 586 L405 586 L444 586 L483 586 L522 586 L561 586 L600 586 L639 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M522 586 L522 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M522 586 L526 549 L528 510 L528 472 L528 433 L528 394 L528 355 L528 316 L528 277 L528 238 L528 199" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="528" cy="199" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328.5" y="205" text-anchor="middle" font-size="65" fill="#6b7280"><tspan x="328.5" y="205">2. lift, then come down</tspan><tspan x="328.5" y="284.3">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="184.79" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="184.79" viewBox="-77 -692 811 999.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductu