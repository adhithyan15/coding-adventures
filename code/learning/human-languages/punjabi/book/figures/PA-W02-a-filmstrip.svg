<svg xmlns="http://www.w3.org/2000/svg" width="982" height="458.34" viewBox="0 0 982 458.34" role="img" aria-label="How to write ਅ: 2 strokes · 1 pen lift · 8 movements"><title>Writing ਅ</title><desc>8 frames; frame N shows movements 1 to N of ਅ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਅ (airhaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 62, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L62&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਅ in two pen-down strokes. The first starts at the top left, runs right along the left part of the bar and turns down, then turns clockwise through about two full turns as it crosses the letter, ending where the body meets the stem; the second starts at the top right, runs left along the bar&apos;s right part and turns down the stem to its foot. In the bundled Noto Sans Gurmukhi outline this letter&apos;s top bar is split, with a gap above the body, and the source draws no separate headline: the first stroke opens along the bar&apos;s left part and the last stroke opens by running right to left along its right part before turning down the stem. The outline and the source agree, so there is no headline stroke to place first or last. The outline prints both loops as solid tails, so the path loops clockwise inside each. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਅ, each by a different non-native copyist; only counts and shares are cited. 65% (13 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 90% (18 of 20) start in the same part of the letter as the source and 55% (11 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="982" height="458.34" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 8 movements</text><rect x="16" y="42" width="150" height="170.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="170.17" viewBox="-77 -692 896 1016.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M572 0L572 353Q488 331 425 285Q423 207 402.5 157.5Q382 108 341 108Q320 108 306 120.5Q292 133 292 166Q292 204 310.5 246Q329 288 356 317Q355 357 346 398.5Q337 440 324 465Q285 451 248.5 430.5Q212 410 188 391Q186 310 166 261Q146 212 104 212Q83 212 69.5 224.5Q56 237 56 271Q56 308 74 349.5Q92 391 118 419Q115 473 104.5 505.5Q94 538 84 551L-7 551L-7 622L144 622Q156 595 169 552.5Q182 510 185 468Q202 483 232.5 500Q263 517 300 531.5Q337 546 374 554Q386 534 396 502Q406 470 413 433.5Q420 397 423 365Q450 384 488.5 401.5Q527 419 572 430L572 622L749 622L749 551L653 551L653 0L572 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L53 585 L87 579 L114 563 L131 536 L141 502 L148 466 L153 430" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linej