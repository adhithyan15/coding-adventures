<svg xmlns="http://www.w3.org/2000/svg" width="982" height="513.12" viewBox="0 0 982 513.12" role="img" aria-label="How to write 社: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 社</title><desc>7 frames; frame N shows movements 1 to N of 社 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 社.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%A4%BE.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 社, in two pieces. Medians 1–4 draw the spirit piece as 祝 opens: a dot, a horizontal that turns and falls to the left without lifting, a vertical, then a short dot. Medians 5–7 draw 土: a short horizontal, a vertical through it, then a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="513.12" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="203.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.81" viewBox="-43 -913 1073 1457.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transf