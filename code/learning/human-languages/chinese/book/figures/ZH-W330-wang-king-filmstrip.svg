round"/><path class="ductus__done" d="M166 390 L834 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M470 697 L494 602 L496 116 L475 -23" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M64 27 L64 27" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M64 27 L169 -9 L344 11 L600 5 L821 17 L935 -10" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="935" cy="-10" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="258.1" text-anchor="middle" font-size="83.1" fill="#6b7280"><tspan x="500.5" y="258.1">4. lift, then draw the</tspan><tspan x="500.5" y="359.5">long bottom horizontal</tspan></text></svg><text x="16" y="233.15" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 王.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="245.65" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="258.15" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
