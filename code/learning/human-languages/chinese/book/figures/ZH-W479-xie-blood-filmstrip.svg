<svg xmlns="http://www.w3.org/2000/svg" width="982" height="291.44" viewBox="0 0 982 291.44" role="img" aria-label="How to write 血: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 血</title><desc>6 frames; frame N shows movements 1 to N of 血 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 血.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%A1%80.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 血, in two pieces. Median 1 draws a short left-falling stroke on top. Medians 2–6 draw the dish as 温 ends: a short vertical, a horizontal that turns down the right side without lifting, two short verticals inside, then a long horizontal under everything. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="291.44" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="197.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.94" viewBox="-29 -911 1060 1398.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1