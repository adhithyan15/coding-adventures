<svg xmlns="http://www.w3.org/2000/svg" width="502" height="301.39" viewBox="0 0 502 301.39" role="img" aria-label="How to write の: one unbroken stroke · 3 movements"><title>Writing の</title><desc>3 frames; frame N shows movements 1 to N of の (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana の stroke order animation.gif, hiragana の, 32 frames, 3.2 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%AE_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws の in one uninterrupted run: down, round the bottom, up the left, across its own line near the top, then out to the right and down. The learner path is fitted to the bundled Noto Sans JP subset; loop width varies in handwriting, but the zero-lift order is the same.</desc><rect x="0" y="0" width="502" height="301.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="195.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.39" viewBox="18 -788 960 1250.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M564 683Q554 605 538.5 520Q523 435 499 355Q469 252 432.5 183Q396 114 354 79Q312 44 266 44Q222 44 181 76Q140 108 114 168.5Q88 229 88 311Q88 393 121.5 466Q155 539 214.5 595.5Q274 652 354 685Q434 718 525 718Q613 718 683.5 689Q754 660 804 609.5Q854 559 881 492.5Q908 426 908 350Q908 245 863.5 165Q819 85 735.5 35Q652 -15 533 -31L486 43Q510 46 532 49Q554 52 572 56Q620 67 665.5 90.5Q711 114 747 150.5Q783 187 804.5 237.5Q826 288 826 353Q826 414 806 466.5Q786 519 747 559Q708 599 652 622Q596 645 524 645Q442 645 375.5 615Q309 585 262.5 536.5Q216 488 191 430.5Q166 37