<svg xmlns="http://www.w3.org/2000/svg" width="502" height="354.68" viewBox="0 0 502 354.68" role="img" aria-label="How to write ج: 2 strokes · 1 pen lift · 3 movements"><title>Writing ج</title><desc>3 frames; frame N shows movements 1 to N of ج (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Te, mim, jim, che, and more diacritics, independent ج handwriting animation and flat-head insight (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/te-mim-jim-che/&gt;. Source note on variation: The independent-form animation places the dot below first, lifts once, then draws the pointed hooked head, descent, and bowl in one continuous stroke. The lesson says the back corner should be pointed rather than rounded and documents a flat-head alternative as purely aesthetic. This learner path covers the pointed independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="502" height="354.68" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="236.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="236.18" viewBox="-2 -451 691 1088" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M360 -287Q236 -287 168.5 -224Q101 -161 101 -42Q101 20 131.5 81.5Q162 143 216 190Q243 213 272.5 231Q302 249 333 261Q321 266 295.5 274.5Q270 283 242 290Q214 297 192 297Q162 297 140.5 289.5Q119 282 83 259Q77 264 72.5 274.5Q68 285 68 297Q68 335 101.5 358Q135 381 189 38