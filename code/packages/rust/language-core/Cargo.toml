[package]
name = "language-core"
version = "0.1.0"
edition = "2021"
description = "Headless language-learning domain model for scripts, lexemes, etymology, lessons, and Engram review bindings."
license = "MIT"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
