[package]
name = "cortex-m4-gatelevel"
version = "0.1.0"
edition = "2021"
description = "DFF-backed gate-level Arm Cortex-M4 simulator"
license = "MIT"

[lib]
name = "cortex_m4_gatelevel"
path = "src/lib.rs"

[dependencies]
arithmetic = { path = "../arithmetic" }
logic-gates = { path = "../logic-gates" }
cortex-m3-gatelevel = { path = "../cortex-m3-gatelevel" }

[dev-dependencies]
cortex-m4-simulator = { path = "../cortex-m4-simulator" }
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "visit"] }
