[package]
name = "iir-builtin-lowering"
version = "0.42.0"
edition = "2021"
description = "IIR builtin lowering pass — converts call_builtin instructions into typed IIR arithmetic/comparison ops"

[lib]
name = "iir_builtin_lowering"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }

[dev-dependencies]
# `tests/vm_lisp_on_vm.rs` runs `vm_lisp`'s output on the VM it targets.
vm-core = { path = "../vm-core" }
