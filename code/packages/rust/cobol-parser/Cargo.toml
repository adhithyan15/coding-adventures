[package]
name = "coding-adventures-cobol-parser"
version = "0.17.0"
edition = "2021"
description = "Parser for COBOL-60 — parses COBOL source into a generic parse tree using the grammar-driven parser and the cobol.grammar file. v0.17.0 adds the inspect_stmt rule (INSPECT … TALLYING … FOR ALL, plus the accepted-then-rejected LEADING/CHARACTERS/BEFORE/AFTER/REPLACING later-rung forms)."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-cobol-lexer = { path = "../cobol-lexer" }
