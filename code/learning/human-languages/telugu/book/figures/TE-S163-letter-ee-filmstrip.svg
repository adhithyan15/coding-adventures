<svg xmlns="http://www.w3.org/2000/svg" width="662" height="366.95" viewBox="0 0 662 366.95" role="img" aria-label="How to write ఏ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ఏ</title><desc>4 frames; frame N shows movements 1 to N of ఏ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఏ packaged tracing guide res/drawable/dot_stroke_v_10_ae.png, movements 1–4 (version 2.6) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers four directional movements and marks three pen-down runs: movements 1–2 join around the compact lower loop, movement 3 forms the broad outer arch, and movement 4 separately forms the tall upper-left hook. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="662" height="366.95" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="260.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="260.95" viewBox="-41 -901 787 1369.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q59