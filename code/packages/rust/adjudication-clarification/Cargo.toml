[package]
name = "adjudication-clarification"
version = "0.2.0"
edition = "2021"
description = "ADJ06 — clarification dialogue. v0.2 extends self-correction beyond ADJ02 coverage to ADJ03 polarity/modality. Small models that miss negation (e.g. \"no known drug allergy\" → Affirmed instead of Denied) can now self-correct on a re-prompt."

[dependencies]
adjudication-audit-trail = { path = "../adjudication-audit-trail" }
llm-gateway = { path = "../llm-gateway" }
llm-primitives = { path = "../llm-primitives" }
serde_json = "1"
