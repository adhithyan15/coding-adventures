[package]
name = "engram-capi"
version = "0.1.0"
edition = "2021"
description = "Stable C ABI over the Engram JSON facade for native shells."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "engram-host-cli"
path = "src/bin/engram_host_cli.rs"

[dependencies]
coding_adventures_base64 = { path = "../base64" }
serde = "1"
engram-anki-package = { path = "../engram-anki-package" }
engram-core = { path = "../engram-core", features = ["serde"] }
engram-core-wasm = { path = "../engram-core-wasm" }
serde_json = "1"

# No third-party dev-dependencies. The SQLite fixtures the tests import are
# built by our own `sqlite-file` writer, which is itself zero-dependency; the
# cross-check against real C SQLite lives in that crate, where it belongs.
# Keeping `rusqlite` here would have put a C amalgamation build back into the
# test path of the crate that exists to avoid one.
[dev-dependencies]
sqlite-file = { path = "../sqlite-file" }
