<svg xmlns="http://www.w3.org/2000/svg" width="982" height="249.81" viewBox="0 0 982 249.81" role="img" aria-label="How to write ய: one unbroken stroke · 6 movements"><title>Writing ய</title><desc>6 frames; frame N shows movements 1 to N of ய (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 1, ய (University of Texas at Austin), p. 190 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 1 numbers six joined movements for ய: down the left, around its foot, up and back down the central upright, across the bottom, and up the right. Tamil handwriting varies by school; this is one attested continuous order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="982" height="249.81" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="156.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="156.31" viewBox="18 -624 927 966" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M354 0L354 554L440 554L440 72L789 72L789 554L875 554L875 0L354 0ZM240 -11Q203 -11 175.5 1.5Q148 14 129 36Q118 51 108.5 70Q99 89 93.5 120Q88 151 88 202L88 554L174 554L174 223Q174 177 178 139.5Q182 102 202 82Q212 72 225.5 66.5Q239 61 258 61Q287 61 312.5 76Q338 91 360 125L358 39Q339 20 310 4.5Q281 -11 240 -11Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 548 L130 548" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 548 L130 280 L130 145" fill="none" stroke="#3b5b