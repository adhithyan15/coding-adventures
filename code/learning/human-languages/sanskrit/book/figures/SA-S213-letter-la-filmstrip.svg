<svg xmlns="http://www.w3.org/2000/svg" width="662" height="291.6" viewBox="0 0 662 291.6" role="img" aria-label="How to write ल: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ल</title><desc>4 frames; frame N shows movements 1 to N of ल (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ल-order.gif’, strokes 1–4, Wikimedia Commons, 11 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%B2-order.gif&gt;. Source note on variation: The 23-frame animation shows four ordered pen-down runs over its gray guide: frames 2–9 start at the open lower-left tip, curve up and clockwise around the left loop, and finish at the inner junction; frames 10–12 restart at that junction and sweep the diagonal arm up-right to the right stem; frames 13–17 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 18–21 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 250 ms holds at frames 9, 12, and 17 mark the first three run endings before the one-second completed frame 22. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VIII, p. 43, independently shows the same left loop, diagonal arm, right stem, and headline buildup and directions. JackPotte&apos;s 12-frame ‘Devanagari l ल.gif’ animation of 29 March 2009 instead draws the right stem first in frames 0–2, then the diagonal arm in frames 3–5, the left loop in frames 6–8, and the headline in frames 9–10; all frames last 100 ms, so it provides no long inter-stroke holds. This learner path follows the mutually corroborated loop-first four-run form and fits its loop and arm to Noto Sans Devanagari; everyday handwriting may use the documented stem-first order or simplify the loop differently.</desc><rect x="0" y="0" width="662" height="291.6" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="198.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.1" viewBox="-70 -692 832 1098.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 551L0 622L692 622L692 551L589 551L589 0L508 0L508 379L552 347Q536 354 522 356Q508 358 496 358Q462 358 435 342.5Q408 327 389.5 291Q371 255 360 193L280 217Q294 322 349.5 375Q405 428 496 428Q516 428 533 425Q550 422 562 418L565 396L508 415L508 551L0 551ZM332 304Q315 328 289 343Q263 358 227 358Q180 358 153 329.5Q126 301 126 254Q126 197 168 149Q210 101 302 48L255 -14Q157 44 101 110.5Q45 177 45 262Q45 345 94 387.5Q143 430 219 430Q269 430 306 411.5Q343 393 370 363L332 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M255 5 L255 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M255 5 L220 25 L185 50 L150 80 L120 115 L95 155 L75 205 L70 255 L82 305 L110 345 L150 375 L195 392 L235 392 L270 380 L300 360 L325 330 L345 295 L350 260 L330 240 L300 260" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="300" cy="260" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="346" y="220.7" text-anchor="middle" font-size="66.7" fill="#6b7280"><tspan x="346" y="220.7">1. curve up and</tspan><tspan x="346" y="302.1">clockwise around the</tspan><tspan x="346" y="383.4">open left loop</tspan></text></svg><rect x="176" y="42" width="150" height="198.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="198.1" viewBox="-70 -692 832 1098.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 551L0 622L692 622L692 551L589 551L589 0L508 0L508 379L552 347Q536 354 522 356Q508 358 496 358Q462 358 435 342.5Q408 327 389.5 291Q371 255 360 193L280 217Q294 322 349.5 375Q405 428 496 428Q516 428 533 425Q550 422 562 418L565 396L508 415L508 551L0 551ZM332 304Q315 328 289 343Q263 358 227 358Q180 358 153 329.5Q126 301 126 254Q126 197 168 149Q210 101 302 48L255 -14Q157 44 101 110.5Q45 177 45 262Q45 345 94 387.5Q143 430 219 430Q269 430 306 411.5Q343 393 370 363L332 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M255 5 L220 25 L185 50 L150 80 L120 115 L95 155 L75 205 L70 255 L82 305 L110 345 L150 375 L195 392 L235 392 L270 380 L300 360 L325 330 L345 295 L350 260 L330 240 L300 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M300 260 L300 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M300 260 L320 280 L340 300 L365 325 L390 350 L420 375 L455 393 L495 395 L510 395" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="510" cy="395" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="346" y="220.7" text-anchor="middle" font-size="66.7" fill="#6b7280"><tspan x="346" y="220.7">2. lift, then sweep the</tspan><tspan x="346" y="302.1">diagonal arm up-right</tspan></text></svg><rect x="336" y="42" width="150" height="198.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="198.1" viewBox="-70 -692 832 1098.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 551L0 622L692 622L692 551L589 551L589 0L508 0L508 379L552 347Q536 354 522 356Q508 358 496 358Q462 358 435 342.5Q408 327 389.5 291Q371 255 360 193L280 217Q294 322 349.5 375Q405 428 496 428Q516 428 533 425Q550 422 562 418L565 396L508 415L508 551L0 551ZM332 304Q315 328 289 343Q263 358 227 358Q180 358 153 329.5Q126 301 126 254Q126 197 168 149Q210 101 302 48L255 -14Q157 44 101 110.5Q45 177 45 262Q45 345 94 387.5Q143 430 219 430Q269 430 306 411.5Q343 393 370 363L332 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M255 5 L220 25 L185 50 L150 80 L120 115 L95 155 L75 205 L70 255 L82 305 L110 345 L150 375 L195 392 L235 392 L270 380 L300 360 L325 330 L345 295 L350 260 L330 240 L300 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M300 260 L320 280 L340 300 L365 325 L390 350 L420 375 L455 393 L495 395 L510 395" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M548 551 L548 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M548 551 L548 475 L548 395 L548 315 L548 235 L548 155 L548 75 L548 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="548" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="346" y="220.7" text-anchor="middle" font-size="66.7" fill="#6b7280"><tspan x="346" y="220.7">3. lift, then descend</tspan><tspan x="346" y="302.1">the right stem</tspan></text></svg><rect x="496" y="42" width="150" height="198.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="198.1" viewBox="-70 -692 832 1098.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 551L0 622L692 622L692 551L589 551L589 0L508 0L508 379L552 347Q536 354 522 356Q508 358 496 358Q462 358 435 342.5Q408 327 389.5 291Q371 255 360 193L280 217Q294 322 349.5 375Q405 428 496 428Q516 428 533 425Q550 422 562 418L565 396L508 415L508 551L0 551ZM332 304Q315 328 289 343Q263 358 227 358Q180 358 153 329.5Q126 301 126 254Q126 197 168 149Q210 101 302 48L255 -14Q157 44 101 110.5Q45 177 45 262Q45 345 94 387.5Q143 430 219 430Q269 430 306 411.5Q343 393 370 363L332 304Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M255 5 L220 25 L185 50 L150 80 L120 115 L95 155 L75 205 L70 255 L82 305 L110 345 L150 375 L195 392 L235 392 L270 380 L300 360 L325 330 L345 295 L350 260 L330 240 L300 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M300 260 L320 280 L340 300 L365 325 L390 350 L420 375 L455 393 L495 395 L510 395" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M548 551 L548 475 L548 395 L548 315 L548 235 L548 155 L548 75 L548 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L565 585 L690 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="346" y="220.7" text-anchor="middle" font-size="66.7" fill="#6b7280"><tspan x="346" y="220.7">4. lift, then draw the</tspan><tspan x="346" y="302.1">shirorekha</tspan><tspan x="346" y="383.4">left-to-right</tspan></text></svg><text x="16" y="253.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ल-order.gif’, strokes 1–4, Wikimedia Commons, 11 May 2009</text><text x="16" y="265.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
