[package]
name = "mccarthy-lisp-iir-compiler"
version = "0.5.0"
edition = "2021"
description = "Lowers a McCarthy 1960 Lisp (Lisp 1.0) AST into an IIRModule. Through L2c-3a: integer/nil literals, QUOTE, the primitives CONS/CAR/CDR/ATOM/EQ, COND, direct LAMBDA application, LABEL (named/recursive functions), and LAMBDA-as-a-value (closures with the dynamic `apply` opcode; no free-variable capture yet). Emits IIR over the `lispy-runtime` value model so the module runs end-to-end on `mccarthy-lisp-vm` and feeds every IIR backend. Free-variable capture lands in L2c-3b."

[lib]
name = "mccarthy_lisp_iir_compiler"
path = "src/lib.rs"

[dependencies]
mccarthy-lisp-parser = { path = "../mccarthy-lisp-parser" }
interpreter-ir       = { path = "../interpreter-ir" }

[dev-dependencies]
# McCarthy Lisp's own VM (built on lispy-runtime) is the reference
# interpreter for the emitted IIR — used only to run the end-to-end
# tests.  Deliberately NOT twig-vm (that VM is Twig-specific); the two
# languages share only the lispy-runtime value model.
mccarthy-lisp-vm = { path = "../mccarthy-lisp-vm" }
lispy-runtime    = { path = "../lispy-runtime" }
