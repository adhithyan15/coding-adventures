name: Q16 negctl Windows diagnostic

# This branch-only workflow isolates the existing vos-sched-any Windows
# negative control. It is not a required PR check and never runs for main or
# the Q16 PR branch.
on:
  push:
    branches:
      - codex/q16-negctl-windows-diagnostic

permissions:
  contents: read

concurrency:
  group: q16-negctl-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: isolate negctl process completion
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout bounded repository inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/code/learning/human-languages/
            /code/learning/human-languages/_fonts/
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.100.0'

      - name: Run bounded Cargo/prebuilt/negctl comparison
        shell: pwsh
        env:
          DIAG_OUT: ${{ runner.temp }}\q16-negctl-diagnostic
        run: python code/scripts/diag_windows_negctl.py

      - name: Preserve process and pipe diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q16-negctl-windows-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/q16-negctl-diagnostic
          if-no-files-found: warn
          retention-days: 3
