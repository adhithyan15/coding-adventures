<svg xmlns="http://www.w3.org/2000/svg" width="342" height="381.59" viewBox="0 0 342 381.59" role="img" aria-label="How to write પ: 2 strokes · 1 pen lift · 2 movements"><title>Writing પ</title><desc>2 frames; frame N shows movements 1 to N of પ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, પ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates પ as two ordered pen-down runs. Its first SVG path begins at the high left hook, curls upward and right over that hook, descends the left stem, then sweeps right around the broad lower body and rises into the right shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the high left hook, left stem, broad lower body, right shoulder, tall right spine, and lower foot, but its printed hook and body are wider and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s hooked-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the hook, stem, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="381.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="250.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="250.59" viewBox="-64 -673 694 1159.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M264 161Q225 161 194 173Q163 185 143 204Q118 229 105.5 262Q93 295 93 350L93 440Q93 467 90 479.5Q87 492 81 500Q71 514 49 516.5Q27 519 6 519L14 592L24 592Q68 592 96.5 582.5Q125 573 142 555Q159 538 166 513Q173 488 173 443L173 357Q173 311 181 288.5Q189 266 202 253Q223 233 272 233Q307 233 338.5 248.5Q370 264 393 286L393 603L473 592L473 152Q473 125 476 112.5Q479 100 485 92Q496 78 517.5 75.5Q539 73 560 73L552 0L542 0Q499 0 470 9.5Q441 19 424 37Q408 54 400.5 79Q393 104 393 148L393 199Q367 182 335.5 171.5Q304 161 264 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M20 520 L20 520" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 520 L25 555 L55 570 L90 565 L120 540 L133 500 L133 450 L133 390 L133 340 L140 300 L160 260 L190 225 L225 205 L270 197 L315 207 L350 225 L380 255 L410 285" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="410" cy="285" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="283" y="195.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="283" y="195.6">1. curl over the high</tspan><tspan x="283" y="263.4">left hook, descend, and</tspan><tspan x="283" y="331.3">sweep around the broad</tspan><tspan x="283" y="399.1">lower body into the</tspan><tspan x="283" y="466.9">right shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="250.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="250.59" viewBox="-64 -673 694 1159.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M264 161Q225 161 194 173Q163 185 143 204Q118 229 105.5 262Q93 295 93 350L93 440Q93 467 90 479.5Q87 492 81 500Q71 514 49 516.5Q27 519 6 519L14 592L24 592Q68 592 96.5 582.5Q125 573 142 555Q159 538 166 513Q173 488 173 443L173 357Q173 311 181 288.5Q189 266 202 253Q223 233 272 233Q307 233 338.5 248.5Q370 264 393 286L393 603L473 592L473 152Q473 125 476 112.5Q479 100 485 92Q496 78 517.5 75.5Q539 73 560 73L552 0L542 0Q499 0 470 9.5Q441 19 424 37Q408 54 400.5 79Q393 104 393 148L393 199Q367 182 335.5 171.5Q304 161 264 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M20 520 L25 555 L55 570 L90 565 L120 540 L133 500 L133 450 L133 390 L133 340 L140 300 L160 260 L190 225 L225 205 L270 197 L315 207 L350 225 L380 255 L410 285" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M433 585 L433 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M433 585 L433 520 L433 450 L433 380 L433 310 L433 240 L433 175 L435 125 L443 90 L460 62 L490 45 L525 38 L550 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="550" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="283" y="195.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="283" y="195.6">2. lift, descend the</tspan><tspan x="283" y="263.4">tall right spine, and</tspan><tspan x="283" y="331.3">turn through its lower</tspan><tspan x="283" y="399.1">foot</tspan></text></svg><text x="16" y="305.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="318.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, પ animation, first and second SVG</text><text x="16" y="330.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="343.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="355.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
