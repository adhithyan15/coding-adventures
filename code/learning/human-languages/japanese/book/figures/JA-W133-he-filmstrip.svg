<svg xmlns="http://www.w3.org/2000/svg" width="342" height="283.79" viewBox="0 0 342 283.79" role="img" aria-label="How to write へ: one unbroken stroke · 2 movements"><title>Writing へ</title><desc>2 frames; frame N shows movements 1 to N of へ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03078.svg, hiragana へ (U+3078 HIRAGANA LETTER HE), one stroke path kvg:03078-s1 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03078.svg&gt;. Source note on variation: KanjiVG stores へ as one directed path in writing order: it starts low on the left, rises to a peak left of the middle, turns over it and runs down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="342" height="283.79" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 2 movements</text><rect x="16" y="60.75" width="150" height="134.04" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="134.04" viewBox="-14 -710 1035 924.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M56 274Q75 289 91.5 304.5Q108 320 128 340Q148 361 172.5 390.5Q197 420 223.5 453.5Q250 487 276 520Q302 553 324 579Q368 630 409.5 635Q451 640 500 590Q531 559 565 518.5Q599 478 634.5 437Q670 396 701 361Q724 336 753 305Q782 274 815 240.5Q848 207 882.5 173Q917 139 951 110L887 37Q850 73 808.5 116.5Q767 160 727 205Q687 250 652 288Q620 325 585.5 366.5Q551 408 519.5 446Q488 484 465 510Q443 533 428 539Q413 545 399.5 536.5Q386 528 368 507Q351 485 328 455Q305 425 280 393Q255 361 231.5 330Q208 299 189 276Q174 256 157.5 235.5Q141 215 130 199L56 274Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 269 L120 269" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 269 L168 320 L213 375 L257 430 L300 486 L348 537 L400 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="400" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503.5" y="185.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="503.5" y="185.9">1. rise up to the peak</tspan></text></svg><rect x="176" y="60.75" width="150" height="134.04" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="134.04" viewBox="-14 -710 1035 924.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M56 274Q75 289 91.5 304.5Q108 320 128 340Q148 361 172.5 390.5Q197 420 223.5 453.5Q250 487 276 520Q302 553 324 579Q368 630 409.5 635Q451 640 500 590Q531 559 565 518.5Q599 478 634.5 437Q670 396 701 361Q724 336 753 305Q782 274 815 240.5Q848 207 882.5 173Q917 139 951 110L887 37Q850 73 808.5 116.5Q767 160 727 205Q687 250 652 288Q620 325 585.5 366.5Q551 408 519.5 446Q488 484 465 510Q443 533 428 539Q413 545 399.5 536.5Q386 528 368 507Q351 485 328 455Q305 425 280 393Q255 361 231.5 330Q208 299 189 276Q174 256 157.5 235.5Q141 215 130 199L56 274Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 269 L168 320 L213 375 L257 430 L300 486 L348 537 L400 585 L400 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M400 585 L464 564 L514 515 L559 462 L604 408 L649 355 L695 302 L743 251 L791 200 L839 150 L892 105" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="892" cy="105" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503.5" y="185.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="503.5" y="185.9">2. run down to the right</tspan></text></svg><text x="16" y="207.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/03078.svg, hiragana へ</text><text x="16" y="220.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(U+3078 HIRAGANA LETTER HE), one stroke path kvg:03078-s1</text><text x="16" y="232.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="245.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="257.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
