 x="16" y="259.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="272.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
