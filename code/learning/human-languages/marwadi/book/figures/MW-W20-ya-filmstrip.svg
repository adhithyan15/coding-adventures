<svg xmlns="http://www.w3.org/2000/svg" width="662" height="309.08" viewBox="0 0 662 309.08" role="img" aria-label="How to write य: 4 strokes · 3 pen lifts · 4 movements"><title>Writing य</title><desc>4 frames; frame N shows movements 1 to N of य (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-य-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%AF-order.gif&gt;. Source note on variation: The 22-frame animation shows four ordered pen-down runs over its gray guide: frames 2–5 start beneath the headline, curve clockwise around the inner curl, and finish at the left waist; frames 6–13 restart at that waist, curve down and right around the lower bowl, and rise to the right-stem junction; frames 14–16 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 17–20 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 190 ms hold at frame 5 and 250 ms holds at frames 13 and 16 mark the first three run endings before the one-second completed frame 21. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VIII, p. 41, independently shows the same inner curl, lower bowl, right stem, and headline buildup and directions. JackPotte&apos;s 11-frame ‘Devanagari j य.gif’ animation of 29 March 2009 instead joins the inner curl and lower bowl before the same separately descended right stem and left-to-right headline. This learner path follows the mutually corroborated four-run form and fits its curves to Noto Sans Devanagari; everyday handwriting may use the documented three-run join or simplify the bowls differently.</desc><rect x="0" y="0" width="662" height="309.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="215.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.58" viewBox="-70 -692 734 1054.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M594 622L594 551L491 551L491 0L410 0L410 216L433 191Q404 166 365.5 149Q327 132 270 132Q173 132 116 188Q59 244 33 358Q110 372 144 395.5Q178 419 178 459Q178 491 161 519Q144 547 116 566L159 551L0 551L0 622L594 622ZM175 551L203 572Q231 544 244.5 513Q258 482 258 450Q258 397 228 362.5Q198 328 133 307Q151 255 182.5 229Q214 203 269 203Q322 203 360 229.5Q398 256 425 290L410 239L410 551L175 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M165 551 L165 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M165 551 L195 540 L215 510 L220 475 L207 440 L185 410 L150 382 L105 360 L55 355" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="55" cy="355" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="297" y="198.8" text-anchor="middle" font-size="58.8" fill="#6b7280"><tspan x="297" y="198.8">1. curve clockwise</tspan><tspan x="297" y="270.5">around the inner curl</tspan></text></svg><rect x="176" y="42" width="150" height="215.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="215.58" viewBox="-70 -692 734 1054.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M594 622L594 551L491 551L491 0L410 0L410 216L433 191Q404 166 365.5 149Q327 132 270 132Q173 132 116 188Q59 244 33 358Q110 372 144 395.5Q178 419 178 459Q178 491 161 519Q144 547 116 566L159 551L0 551L0 622L594 622ZM175 551L203 572Q231 544 244.5 513Q258 482 258 450Q2