<svg xmlns="http://www.w3.org/2000/svg" width="502" height="498.89" viewBox="0 0 502 498.89" role="img" aria-label="How to write ڑ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ڑ</title><desc>3 frames; frame N shows movements 1 to N of ڑ (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Fe, qaf, te, dal, and re, independent ڑ calligraphic and handwriting animations and Re instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/fe-qaf-te-dal-re/&gt;. Source note on variation: The independent-form animations write the re-series body first as one downward line curving left, then add the small to&apos;e-shaped retroflex mark above after one pen lift. The adjacent prose identifies retroflex re as the nonconnecting re body with that mark; the chapter&apos;s retroflex-te instructions specify drawing the shared mark downward, back upward, and down again to form its loop. This learner path fits the two-run order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The evidence and glyph identity remain Urdu-specific rather than borrowing plain re&apos;s motion or retroflex te&apos;s complete letter order.</desc><rect x="0" y="0" width="502" height="498.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="380.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="380.39" viewBox="-90 -664 495 1255.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204