<svg xmlns="http://www.w3.org/2000/svg" width="662" height="471.71" viewBox="0 0 662 471.71" role="img" aria-label="How to write ः: 2 strokes · 1 pen lift · 4 movements"><title>Writing ः</title><desc>4 frames; frame N shows movements 1 to N of ः (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 60 (ः, visarga): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 77 of the 81 stored prototypes of the visarga (95%) are two pen-down strokes, one per dot, and 76 of those 77 draw the upper dot first. Each dot is a small closed loop: 66 of the 77 turn both of them anticlockwise, and most start in the dot&apos;s upper half (60 of the 77 for the upper dot, 67 for the lower). The printed dots are solid, so each path circles inside its dot. The writers drew the two dots alone; the bundled font prints them under a short piece of headline (x 0 to 217). The path leaves that piece undrawn, so the strip shows it in grey: in a word it is part of the word&apos;s one headline, which native writers draw last, across the whole word (82% of the 2,706 consonant prototypes in the same recognizer). Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant or the headline; the book draws the sign alone and composes no Devanagari word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Devanagari outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="471.71" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="365.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="365.71" viewBox="-70 -692 357 870.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M40 134Q40 160 58 179Q76 198 101 198Q126 198 144 179Q162 160 162 134Q162 108 144 89Q126 70 101 70Q76 70 58 89Q40 108 40 134ZM40 384Q40 410 58 429Q76 448 101 448Q126 448 144 429Q162 410 162 384Q162 358 144 339Q126 320 101 320Q76 320 58 339Q40 358 40 384ZM0 622L217 622L217 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M101 422 L101 422" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M101 422 L86 419 L74 411 L66 399 L63 384 L66 369 L74 357 L86 349 L101 346 L101 346" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="101" cy="346" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="108.5" y="98.6" text-anchor="middle" font-size="28.6" fill="#6b7280"><tspan x="108.5" y="98.6">1. start at the top and</tspan><tspan x="108.5" y="133.5">curve down the left side</tspan></text></svg><rect x="176" y="42" width="150" height="365.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="365.71" viewBox="-70 -692 357 870.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M40 134Q40 160 58 179Q76 198 101 198Q126 198 144 179Q162 160 162 134Q162 108 144 89Q126 70 101 70Q76 70 58 89Q40 108 40 134ZM40 384Q40 410 58 429Q76 448 101 448Q126 448 144 429Q162 410 162 384Q162 358 144 339Q126 320 101 320Q76 320 58 339Q40 358 40 384ZM0 622L217 622L217 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M101 422 L86 419 L74 411 L66 399 L63 384 L66 369 L74 357 L86 349 L101 346 L101 346" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M101 346 L116 349 L128 357 L136 369 L139 384 L136 399 L128 411 L116 419 L101 422" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="101" cy="422" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="108.5" y="98.6" text-anchor="middle" font-size="28.6" fill="#6b7280"><tspan x="108.5" y="98.6">2. round the bottom and</tspan><tspan x="108.5" y="133.5">up the right side to</tspan><tspan x="108.5" y="168.4">close the loop</tspan></text></svg><rect x="336" y="42" width="150" height="365.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="365.71" viewBox="-70 -692 357 870.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M40 134Q40 160 58 179Q76 198 101 198Q126 198 144 179Q162 160 162 134Q162 108 144 89Q126 70 101 70Q76 70 58 89Q40 108 40 134ZM40 384Q40 410 58 429Q76 448 101 448Q126 448 144 429Q162 410 162 384Q162 358 144 339Q126 320 101 320Q76 320 58 339Q40 358 40 384ZM0 622L217 622L217 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M101 422 L86 419 L74 411 L66 399 L63 384 L66 369 L74 357 L86 349 L101 346 L116 349 L128 357 L136 369 L139 384 L136 399 L128 411 L116 419 L101 422" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M101 172 L101 172" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M101 172 L86 169 L74 161 L66 149 L63 134 L66 119 L74 107 L86 99 L101 96 L101 96" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="101" cy="96" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="108.5" y="98.6" text-anchor="middle" font-size="28.6" fill="#6b7280"><tspan x="108.5" y="98.6">3. lift, then down the</tspan><tspan x="108.5" y="133.5">lower dot&apos;s left side</tspan></text></svg><rect x="496" y="42" width="150" height="365.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="365.71" viewBox="-70 -692 357 870.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M40 134Q40 160 58 179Q76 198 101 198Q126 198 144 179Q162 160 162 134Q162 108 144 89Q126 70 101 70Q76 70 58 89Q40 108 40 134ZM40 384Q40 410 58 429Q76 448 101 448Q126 448 144 429Q162 410 162 384Q162 358 144 339Q126 320 101 320Q76 320 58 339Q40 358 40 384ZM0 622L217 622L217 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M101 422 L86 419 L74 411 L66 399 L63 384 L66 369 L74 357 L86 349 L101 346 L116 349 L128 357 L136 369 L139 384 L136 399 L128 411 L116 419 L101 422" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M101 172 L86 169 L74 161 L66 149 L63 134 L66 119 L74 107 L86 99 L101 96 L101 96" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M101 96 L116 99 L128 107 L136 119 L139 134 L136 149 L128 161 L116 169 L101 172" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="101" cy="172" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="108.5" y="98.6" text-anchor="middle" font-size="28.6" fill="#6b7280"><tspan x="108.5" y="98.6">4. round the bottom and</tspan><tspan x="108.5" y="133.5">up the right side to</tspan><tspan x="108.5" y="168.4">close the loop</tspan></text></svg><text x="16" y="420.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 60 (ः,</text><text x="16" y="433.21" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">visarga): stored online-handwriting prototypes from native writers (MIT licence, 2012)</text><text x="16" y="445.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
