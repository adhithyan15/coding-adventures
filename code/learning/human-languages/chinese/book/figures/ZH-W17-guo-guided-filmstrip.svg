<svg xmlns="http://www.w3.org/2000/svg" width="982" height="562.26" viewBox="0 0 982 562.26" role="img" aria-label="How to write 国: 8 strokes · 7 pen lifts · 8 movements"><title>Writing 国</title><desc>8 frames; frame N shows movements 1 to N of 国 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 国.json, ordered stroke paths and medians 1–8 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%9B%BD.json&gt;. Source note on variation: The cited PRC-order dataset supplies eight ordered strokes for 国. Medians 1–2 open the outer frame, medians 3–7 finish every stroke of 玉 inside it, and median 8 closes the frame along the bottom. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians share the coordinate system used for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. The ductus uses those ordered source medians directly; the vendored Noto Sans SC outline can differ in width and proportion from the Arphic-derived source graphics.</desc><rect x="0" y="0" width="982" height="562.26" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 8 strokes · 7 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="228.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="228.38" viewBox="16 -865 968 1473.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M242 640L756 640L756 573L242 573L242 640ZM270 430L732 430L732 365L270 365L270 430ZM228 196L777 196L777 132L228 132L228 196ZM459 619L530 619L530 161L459 161L459 619ZM592 320L641 347Q670 323 698.5 