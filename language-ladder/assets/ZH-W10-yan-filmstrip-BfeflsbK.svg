<svg xmlns="http://www.w3.org/2000/svg" width="662" height="425.29" viewBox="0 0 662 425.29" role="img" aria-label="How to write 讠: 2 strokes · 1 pen lift · 4 movements"><title>Writing 讠</title><desc>4 frames; frame N shows movements 1 to N of 讠 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 讠.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%AE%A0.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 讠. Median 1 starts at the upper left and draws the dot down-right; median 2 restarts at the left edge, rises slightly across the short horizontal, turns without lifting to descend, then turns again without lifting and finishes up-right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their directions, both turns inside the second stroke, and one intervening pen lift; Noto&apos;s middle horizontal and descent are squarer than the source median, and stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="425.29" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="319.29" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="319.29" viewBox="-29 -888 594 1264.4" pre