<svg xmlns="http://www.w3.org/2000/svg" width="822" height="310.27" viewBox="0 0 822 310.27" role="img" aria-label="How to write 外: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 外</title><desc>5 frames; frame N shows movements 1 to N of 外 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 外.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%A4%96.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 外, in two pieces. Medians 1–3 draw 夕 on the left as 多 opens: a left-falling stroke, a horizontal that turns to fall to the lower left without lifting, then a dot. Medians 4–5 draw 卜 on the right: a vertical, then a dot falling to the lower right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="310.27" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="204.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="204.27" viewBox="-32 -911 1068 1454.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><p