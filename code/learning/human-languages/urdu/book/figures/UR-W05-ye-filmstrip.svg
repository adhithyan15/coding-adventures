<svg xmlns="http://www.w3.org/2000/svg" width="342" height="401.92" viewBox="0 0 342 401.92" role="img" aria-label="How to write ی: one unbroken stroke · 2 movements"><title>Writing ی</title><desc>2 frames; frame N shows movements 1 to N of ی (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Chhoṭī he, do-chashmī he, chhoṭī ye, baṛī ye, and punctuation, independent ی calligraphic and handwriting animations and Chhoṭī ye instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/chhoti-he-do-chashmi-he-chhoti-ye-bari-ye/&gt;. Source note on variation: Both independent-form animations draw one uninterrupted dotless S-shaped body: start at the upper right, descend through the upper curve, then sweep left around the below-baseline bowl and finish at its rising tip without lifting. The lesson says independent and final chhoṭī ye use this S-shaped form and make an ī sound. Initial and medial ye instead resemble a be-series tooth with two dots below the line and can represent chhoṭī or baṛī ye; those dots do not belong to the independent form. This learner path covers independent chhoṭī ye and fits the continuous zero-lift order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="342" height="401.92" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="245.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.92" viewBox="-2 -410 656 1075.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transfor