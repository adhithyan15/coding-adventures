<svg xmlns="http://www.w3.org/2000/svg" width="342" height="389.42" viewBox="0 0 342 389.42" role="img" aria-label="How to write ی: one unbroken stroke · 2 movements"><title>Writing ی</title><desc>2 frames; frame N shows movements 1 to N of ی (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, closing ی demonstration at 02:55–02:58 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated Persian ی as one uninterrupted dotless S-shaped run: begin at the upper right, sweep left into the upper curve, descend through the central turn, then continue around the below-baseline bowl to its rising tip without lifting. Initial and medial forms use a joined be-series tooth rather than this broad independent body. The learner path fits the vendored Noto Naskh outline and keeps Persian-scoped provenance separate from the independently verified Urdu ی record.</desc><rect x="0" y="0" width="342" height="389.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="245.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.92" viewBox="-2 -410 656 1075.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q287 -179 329 -170.5Q371 -162 412 -146.5Q453 -131 484 -111Q508 -96 524 -80Q540 -64 547 -48Q534 -46 521.5 -44Q509 -42 495 -41Q419 -35 382 -22.5Q345 -10 325 18Q30