<svg xmlns="http://www.w3.org/2000/svg" width="342" height="356.1" viewBox="0 0 342 356.1" role="img" aria-label="How to write こ: 2 strokes · 1 pen lift · 2 movements"><title>Writing こ</title><desc>2 frames; frame N shows movements 1 to N of こ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03053.svg, hiragana こ (U+3053 HIRAGANA LETTER KO), two stroke paths kvg:03053-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03053.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the upper stroke drawn left to right, ending in a small turn down and back to the left that the print glyph does not show; s2 starts at the left, curves down and runs out to the right along the base, rising slightly at its end. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="342" height="356.1" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="206.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="206.35" viewBox="103 -773 802 1103.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M235 702Q289 695 356.5 692Q424 689 499 689Q547 689 595.5 691Q644 693 688.5 696.5Q733 700 769 703L769 621Q735 619 690 616Q645 613 595.5 611Q546 609 499 609Q424 609 359 612.5Q294 616 235 620L235 702ZM275 299Q265 269 259.5 241Q254 213 254 185Q254 128 313 92Q372 56 492 56Q561 56 625 61Q689 66 742.5 75Q796 84 834 96L835 10Q799 0 746.5 -8Q694 -16 630 -20.5Q566 -25 494 -25Q393 -25 321 -3Q249 19 211 62Q173 105 173 168Q173 207 180 242Q187 277 194 307L275 299Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M273 659 L273 659" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M273 659 L348 655 L424 651 L499 651 L575 651 L650 655 L725 659" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="725" cy="659" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="229.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="504" y="229.3">1. draw the top stroke</tspan><tspan x="504" y="307.7">to the right</tspan></text></svg><rect x="176" y="60.75" width="150" height="206.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="206.35" viewBox="103 -773 802 1103.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M235 702Q289 695 356.5 692Q424 689 499 689Q547 689 595.5 691Q644 693 688.5 696.5Q733 700 769 703L769 621Q735 619 690 616Q645 613 595.5 611Q546 609 499 609Q424 609 359 612.5Q294 616 235 620L235 702ZM275 299Q265 269 259.5 241Q254 213 254 185Q254 128 313 92Q372 56 492 56Q561 56 625 61Q689 66 742.5 75Q796 84 834 96L835 10Q799 0 746.5 -8Q694 -16 630 -20.5Q566 -25 494 -25Q393 -25 321 -3Q249 19 211 62Q173 105 173 168Q173 207 180 242Q187 277 194 307L275 299Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M273 659 L348 655 L424 651 L499 651 L575 651 L650 655 L725 659" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M225 267 L225 267" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M225 267 L215 200 L222 132 L262 78 L320 43 L386 25 L454 19 L522 19 L590 19 L658 22 L726 31 L793 43" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="793" cy="43" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="229.3" text-anchor="middle" font-size="64.3" fill="#6b7280"><tspan x="504" y="229.3">2. curve down and run</tspan><tspan x="504" y="307.7">out to the right</tspan></text></svg><text x="16" y="280.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/03053.svg, hiragana こ</text><text x="16" y="292.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(U+3053 HIRAGANA LETTER KO), two stroke paths kvg:03053-s1</text><text x="16" y="305.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and s2 (Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="317.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="330.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
