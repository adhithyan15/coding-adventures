stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="830" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="431" y="228.9" text-anchor="middle" font-size="81.9" fill="#6b7280"><tspan x="431" y="228.9">5. lift, then draw the</tspan><tspan x="431" y="328.8">headline last, from</tspan><tspan x="431" y="428.7">left to right</tspan></text></svg><text x="16" y="238.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 18 (জ, ja; user manual Table 4): stored</text><text x="16" y="250.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="263.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
