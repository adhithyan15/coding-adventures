" cy="690" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="352.5" y="215.1" text-anchor="middle" font-size="63.1" fill="#6b7280"><tspan x="352.5" y="215.1">3. draw down and up</tspan><tspan x="352.5" y="292.1">through the separate</tspan><tspan x="352.5" y="369.1">upper chevron</tspan></text></svg><text x="16" y="295.74" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after AppChant, Telugu Alphabets Writing, consonant వ animated path guide</text><text x="16" y="308.24" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_వ in version 3.8.05</text><text x="16" y="320.74" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(3805)</text><text x="16" y="333.24" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
