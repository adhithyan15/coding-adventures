[package]
name = "smart-home-ssdp-discovery-integration"
version = "0.1.0"
edition = "2021"
description = "Authorized bounded UPnP SSDP discovery for Smart Home"
license = "MIT"

[dependencies]
serde_json = "1"
smart-home-core = { path = "../smart-home-core" }
smart-home-discovery = { path = "../smart-home-discovery" }
smart-home-runtime = { path = "../smart-home-runtime" }
ssdp-protocol = { path = "../ssdp-protocol" }
udp-client = { path = "../udp-client" }
url-parser = { path = "../url-parser" }

[[bin]]
name = "smart-home-ssdp-discovery-integration"
path = "src/main.rs"
