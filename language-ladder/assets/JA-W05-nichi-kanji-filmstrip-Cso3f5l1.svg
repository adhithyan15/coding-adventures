<svg xmlns="http://www.w3.org/2000/svg" width="822" height="334.96" viewBox="0 0 822 334.96" role="img" aria-label="How to write 日: 4 strokes · 3 pen lifts · 5 movements"><title>Writing 日</title><desc>5 frames; frame N shows movements 1 to N of 日 (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/065e5.svg, kanji 日 (U+65E5 CJK UNIFIED IDEOGRAPH-65E5), four stroke paths kvg:065e5-s1 to s4 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/065e5.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left side drawn top to bottom (kvg:type ㇑); s2 is the top drawn left to right, turning down the right side without lifting (㇕a); s3 is the middle bar and s4 the base, both drawn left to right (㇐a). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="334.96" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="228.96" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="228.96" viewBox="106 -842 796 1215" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M176 772L832 772L832 -64L752 -64L752 697L253 697L253 -69L176 -69L176 772ZM228 426L786 426L786 352L228 352L228 426ZM226 71L787 71L787 -4L226 -4L226 71Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M220 727 L220 727" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M220 727 L216 658 L216 589 L216 520 L216 451 L216 382 L215 312 L212 244 L212 174 L212 105 L212 36 L212 -33" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="212" cy="-33" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="272.8" text-anchor="middle" font-size="63.8" fill="#6b7280"><tspan x="504" y="272.8">1. draw the left side</tspan><tspan x="504" y="350.6">down</tspan></text></svg><rect x="176" y="42" width="150" height="228.96" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="228.96" viewBox="106 -842 796 1215" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M176 772L832 772L832 -64L752 -64L752 697L253 697L253 -69L176 -69L176 772ZM228 426L786 426L786 352L228 352L228 426ZM226 71L787 71L787 -4L226 -4L226 71Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M220 727 L216 658 L216 589 L216 520 L216 451 L216 382 L215 312 L212 244 L212 174 L212 105 L212 36 L212 -33" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M220 727 L220 727" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M220 727 L290 735 L361 735 L431 735 L502 735 L573 735 L643 735 L714 735 L784 727" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="784" cy="727" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="272.8" text-anchor="middle" font-size="63.8" fill="#6b7280"><tspan x="504" y="272.8">2. draw the top to the</tspan><tspan x="504" y="350.6">right</tspan></text></svg><rect x="336" y="42" width="150" height="228.96" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/>