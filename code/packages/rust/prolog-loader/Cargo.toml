[package]
name = "prolog-loader"
version = "0.4.0"
edition = "2021"
description = "Load Prolog source text into a logic-engine KnowledgeBase. v0.2 `execute` / `run_all_queries` runner (#2752). v0.3 ProblogProgram builder (#2756). v0.4 adds source-syntax `0.7 :: clause.` support: parses through prolog-parser, lowers into probabilistic Fact/Rule shapes with `[0, 1]` range checking."

[dependencies]
prolog-parser = { path = "../prolog-parser" }
parser = { path = "../parser" }
logic-core = { path = "../logic-core" }
logic-engine = { path = "../logic-engine" }
