rule="nonzero"/><path class="ductus__done" d="M140 515 L178 492 L182 450 L152 420 L105 416 L70 445 L60 495 L85 560 L150 605 L215 598 L290 590 L345 550 L360 490 L360 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M360 490 L350 420 L300 360 L200 318 L105 300" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="300" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="349.5" y="200.2" text-anchor="middle" font-size="60.2" fill="#6b7280"><tspan x="349.5" y="200.2">2. run over the top of</tspan><tspan x="349.5" y="273.6">the bowl and down to</tspan><tspan x="349.5" y="347.1">the pointed left tip</tspan></text></svg><rect x="336" y="42" width="150" height="224.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="224.94" viewBox="-26 -758 751 1126.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M473 0Q421 90 333 153Q245 216 125 232L87 331Q174 341 224.5 359.5Q275 378 297 406.5Q319 435 319 474Q319 513 295.5 537.5Q272 562 220 562Q187 562 164.5 550.5Q142 539 132 520Q158 519 173.5 504.5Q189 490 189 464Q189 439 173 421.5Q157 404 124 404Q84 404 64 431Q44 458 44 489Q44 548 89.5 590Q135 632 215 632Q277 632 317.5 610Q358 588 378.5 551.5Q399 515 399 471Q399 397 351 351Q303 305 211 282Q315 253 377.5 202.5Q440 152 476 97Q474 120 473.5 143Q473 166 473 193L473 688L526 688L549 622L655 622L655 551L550 551L550 0L473 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M140 515 L178 492 L182 450 L152 420 L105 416 L70 445 L60 495 L85 560 L150 605 L215 598 L290 590 L345 550 L360 490 L350 420 L300 360 L200 318 L105 300 L105 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M105 300 L140 255 L240 238 L330 190 L405 120 L465 40 L511 12" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="511" cy="12" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="349.5" y="200.2" text-anchor="middle" font-size="60.2" fill="#6b7280"><tspan x="349.5" y="200.2">3. round the lower</tspan><tspan x="349.5" y="273.6">curve to the foot of</tspan><tspan x="349.5" y="347.1">the stem</tspan></text></svg><rect x="496" y="42" width="150" height="224.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="224.94" viewBox="-26 -758 751 1126.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M473 0Q421 90 333 153Q245 216 125 232L87 331Q174 341 224.5 359.5Q275 378 297 406.5Q319 435 319 474Q319 513 295.5 537.5Q272 562 220 562Q187 562 164.5 550.5Q142 539 132 520Q158 519 173.5 504.5Q189 490 189 464Q189 439 173 421.5Q157 404 124 404Q84 404 64 431Q44 458 44 489Q44 548 89.5 590Q135 632 215 632Q277 632 317.5 610Q358 588 378.5 551.5Q399 515 399 471Q399 397 351 351Q303 305 211 282Q315 253 377.5 202.5Q440 152 476 97Q474 120 473.5 143Q473 166 473 193L473 688L526 688L549 622L655 622L655 551L550 551L550 0L473 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M140 515 L178 492 L182 450 L152 420 L105 416 L70 445 L60 495 L85 560 L150 605 L215 598 L290 590 L345 550 L360 490 L350 420 L300 360 L200 318 L105 300 L140 255 L240 238 L330 190 L405 120 L465 40 L511 12 L511 12" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M511 12 L511 200 L511 400 L511 600 L511 640 L555 600 L645 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="645" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="349.5" y="200.2" text-anchor="middle" font-size="60.2" fill="#6b7280"><tspan x="349.5" y="200.2">4. climb the stem and</tspan><tspan x="349.5" y="273.6">turn right into the</tspan><tspan x="349.5" y="347.1">flag</tspan></text></svg><text x="16" y="279.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 27 (থ,</text><text x="16" y="292.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">tha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="304.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
