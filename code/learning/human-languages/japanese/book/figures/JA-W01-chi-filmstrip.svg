<svg xmlns="http://www.w3.org/2000/svg" width="662" height="314.92" viewBox="0 0 662 314.92" role="img" aria-label="How to write ち: 2 strokes · 1 pen lift · 4 movements"><title>Writing ち</title><desc>4 frames; frame N shows movements 1 to N of ち (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03061.svg, hiragana ち (U+3061 HIRAGANA LETTER TI), two stroke paths kvg:03061-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03061.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the bar drawn left to right, rising slightly; s2 starts above the bar, falls through it to the lower left, turns sharply back up to the right, rounds the belly on the right and finishes low, heading left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. The print glyph&apos;s descender and rising stroke meet in a sharp point, so the path goes down to that tip and turns back up the same ink.</desc><rect x="0" y="0" width="662" height="314.92" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="208.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.92" viewBox="42 -858 878 1222.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 783Q417 763 413 741Q409 719 405 699Q400 675 393.5 639.5Q387 604 377.5 562.5Q368 521 358 479Q348 437 337.5 399.5Q327 362 316 334Q382 380 450.5 399.5Q519