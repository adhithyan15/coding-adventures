name: VOS negative-control Windows diagnostic

on:
  push:
    branches:
      - 'codex/vos-negctl-windows-diagnostic-*'
    paths:
      - '.github/workflows/vos-negctl-windows-diagnostic.yml'
      - 'code/scripts/diag_vos_negctl_windows.py'
      - 'code/scripts/tests/test_diag_vos_negctl_windows.py'
      - 'code/scripts/warrant_negctl.py'
      - 'code/packages/rust/Cargo.toml'
      - 'code/packages/rust/Cargo.lock'
      - 'code/packages/rust/mathml/**'
      - 'code/packages/rust/vos-sched-any/**'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out the exact diagnostic branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Test diagnostic observers and control oracles
        shell: pwsh
        run: python -m unittest discover -s code/scripts/tests -p test_diag_vos_negctl_windows.py

      - name: Build warrant_evidence in the default target and run bounded probes
        shell: pwsh
        run: >-
          python code/scripts/diag_vos_negctl_windows.py
          --repo-root .
          --candidate-sha $env:GITHUB_SHA
          --artifact-dir "$env:RUNNER_TEMP/vos-negctl-diagnostic"

      - name: Upload diagnostic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vos-negctl-windows-${{ github.sha }}
          path: ${{ runner.temp }}/vos-negctl-diagnostic/vos-negctl-windows-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
