[package]
name = "cobol-iir-compiler"
version = "0.8.0"
edition = "2021"
description = "COBOL-60 frontend for the LANG VM AOT chain — lowers a parsed COBOL program into interpreter_ir::IIRModule so it runs on every execution backend. v0.8.0: DISPLAY / MOVE / STOP RUN, integer + scaled-decimal (PIC …V…) ADD/SUBTRACT/MULTIPLY/DIVIDE with ROUNDED and ON SIZE ERROR, numeric and character item-to-item MOVE reshaping, IF/ELSE with numeric and alphanumeric (space-padded) conditions, GO TO and PERFORM (paragraph / TIMES / UNTIL / VARYING / THRU), COMPUTE with operator precedence and exponentiation (** with a constant integer exponent), and signed numerics (PIC S9…, trailing overpunch DISPLAY) — over scaled-i64 slots and str slots, byte-identical to the cobol-runtime oracle. Group items, cross-category MOVE, and a variable/fractional ** exponent remain later rungs. See PL09-codegen.md."

[dependencies]
coding-adventures-cobol-parser  = { path = "../cobol-parser" }
# Reused for its exact PICTURE and fixed-point-value logic (Picture / Decimal /
# move_into_char / move_into_numeric) — not its interpreter (PL09).
coding-adventures-cobol-runtime = { path = "../cobol-runtime" }
parser         = { path = "../parser" }
interpreter-ir = { path = "../interpreter-ir" }

[dev-dependencies]
# tests/backend_compat.rs proves the compiled module is accepted by
# every IIR-to-* backend validator.
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/jit_e2e.rs runs the compiled module through the generic VM/JIT and
# checks the DISPLAYed bytes against the cobol-runtime oracle.
vm-core  = { path = "../vm-core" }
jit-core = { path = "../jit-core" }
