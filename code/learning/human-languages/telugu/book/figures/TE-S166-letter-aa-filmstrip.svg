<svg xmlns="http://www.w3.org/2000/svg" width="342" height="315.69" viewBox="0 0 342 315.69" role="img" aria-label="How to write ఆ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ఆ</title><desc>2 frames; frame N shows movements 1 to N of ఆ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Hojaswani LUCIDA and Physics classes, practice Telugu letters with strokes (ఆ letter), 00:00–00:10 (YouTube, 15 September 2024) &lt;https://www.youtube.com/watch?v=vXdrj1pP6q0&gt;. Source note on variation: The demonstration writes the hooked bowl and rounded right lobe separately, then shows the two runs recombined as ఆ. This is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline; the printed inner bar is included in the second run, and Telugu handwriting may vary.</desc><rect x="0" y="0" width="342" height="315.69" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="184.69" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.69" viewBox="-34 -570 870 1071.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 -12Q320 -12 246 9.5Q172 31 126 70Q80 109 58 161Q36 213 36 273Q36 345 61 396Q86 447 128.5 473.5Q171 500 225 500Q265 500 294.5 484.5Q324 469 340.5 440.5Q357 412 357 373Q357 333 340 301.5Q323 270 289 252.5Q255 235 202 235Q152 235 115 258Q78 281 58 304L82 366Q90 355 104.5 340.5Q119 326 142 315.5Q165 305 197 305Q237 305 257.5 322Q278 339 278 369Q278 398 262 413.5Q246 429 220 429Q173 429 144 390Q115 351 115 280L115 271Q115 232 130 195.5Q145 159 180 130Q215 101 274.5 84Q334 67 423 67Q502 67 556.5 79.5Q611 92 639 115.5Q667 139 667 171Q667 191 654.5 206Q642 221 623 231.5Q604 242 58