<svg xmlns="http://www.w3.org/2000/svg" width="822" height="272.19" viewBox="0 0 822 272.19" role="img" aria-label="How to write ణ: 5 strokes · 4 pen lifts · 5 movements"><title>Writing ణ</title><desc>5 frames; frame N shows movements 1 to N of ణ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ణ packaged tracing guides res/drawable/dot_stroke_c_3_5_na.png and res/drawable/line_stroke_c_3_5_na.png, movements 1–5 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the lower-left, upper-left, upper-right and lower-right curves plus the inner curve as five movements. The guide has no counterpart for the short horizontal shelf inside the left bowl of bundled Noto Sans Telugu, so the filmstrip preserves the five attested curves while recording that font-only remainder. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled outline.</desc><rect x="0" y="0" width="822" height="272.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="166.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="166.19" viewBox="-37 -570 898 994.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M587 -12Q539 -12 505.5 5Q472 22 455 53Q438 84 438 124Q438 162 454 193.5Q470 225 503.5 243.5Q537 262 588 262Q631 262 661 249.5Q691 237 713 216Q735 195 753 170L716 105Q705 126 687.5 146Q670 166 646.5 179Q623 192 592 192Q559 192 539.5 174Q520 156 520 127Q520 96 537.5 78Q555 60 591 60Q623 60 649.5 74