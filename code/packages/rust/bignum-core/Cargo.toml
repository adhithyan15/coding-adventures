[package]
name = "bignum-core"
version = "0.3.0"
edition = "2021"
description = "A zero-dependency arbitrary-precision numeric core: a signed integer (BigInteger), an exact rational (BigRational), and an exact base-10 decimal (BigDecimal) with stated rounding modes — all built from scratch with no third-party deps and no unsafe."
license = "MIT"

[dependencies]
# No dependencies — this is a standalone foundation package (the integer core of
# the ADJ arbitrary-precision numeric substrate).
