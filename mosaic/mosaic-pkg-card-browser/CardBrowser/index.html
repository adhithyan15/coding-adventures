<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardBrowser</title>
</head>
<body>
  <section data-component="CardBrowser" data-mosaic-html-root="CardBrowser">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="CardBrowser">
      <div style="display: flex; flex-direction: column; background: #f8fafc; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 14px">
        <span style="color: #0f172a; font-size: 20px; font-weight: 800; padding-bottom: 10px">{{browserLabel}}</span>
        <div style="display: flex; flex-direction: row; padding-bottom: 10px">
          <div style="display: flex; flex-direction: column; padding: 2px">
            <span style="color: #1e40af; font-size: 11px; font-weight: 700">{{queryLabel}}</span>
            <!-- emit "onQueryChange" dropped: HTML is static -->
            <!-- emit "onSearch" dropped: HTML is static -->
            <input type="text" value="{{query}}" placeholder="{{queryPlaceholder}}" data-on-change="onQueryChange" data-on-commit="onSearch" style="padding: 8px; border-radius: 4px; background: #1e293b; color: #f1f5f9; border-width: 1px; border-color: #475569; font-size: 14px">
          </div>
          <div style="display: flex; flex-direction: column; padding: 2px">
            <span style="color: #155e75; font-size: 11px; font-weight: 700">{{filterLabel}}</span>
            <!-- emit "onToggleFilter" dropped: HTML is static -->
            <button data-on-click="onToggleFilter" style="background: #cffafe; border-width: 1px; border-color: #a5f3fc; border-radius: 6px; color: #155e75; font-weight: 700; padding: 8px">{{filterValue}}</button>
            <!-- mosaic-if when="filterOpen" -->
              <div style="display: flex; flex-direction: column; background: #ffffff; border-width: 1px; border-color: #a5f3fc; border-radius: 6px; padding: 4px">
                <!-- mosaic-for each="filterOptions" as="filter-option" index="i" -->
                  <!-- emit "onSetFilter" dropped: HTML is static -->
                  <button data-on-click="onSetFilter" style="background: #cffafe; border-width: 1px; border-color: #a5f3fc; border-radius: 6px; color: #155e75; padding: 6px">{{filter-option}}</button>
                <!-- /mosaic-for -->
              </div>
            <!-- /mosaic-if -->
          </div>
          <!-- emit "onSearch" dropped: HTML is static -->
          <button data-on-click="onSearch" style="background: #dbeafe; border-width: 1px; border-color: #93c5fd; border-radius: 6px; color: #1e40af; font-weight: 700; padding: 8px">{{searchLabel}}</button>
        </div>
        <span style="color: #5b21b6; font-size: 11px; font-weight: 700">{{resultsLabel}}</span>
        <span style="color: #334155; font-size: 14px; padding-bottom: 8px">{{resultsSummary}}</span>
        <div style="display: flex; flex-direction: column; border-radius: 4px; border-width: 1px; border-color: #334155; background: #1e293b">
          <!-- mosaic-for each="results" as="item" index="i" -->
            <!-- mosaic-if when="i == selectedIndex" -->
              <!-- emit "onSelectResult" dropped: HTML is static -->
              <button data-on-click="onSelectResult" style="padding: 12px; background: #1d4ed8; color: #ffffff; border-width: 0; font-size: 14px; border-radius: 0">{{item}}</button>
            <!-- mosaic-else -->
              <!-- emit "onSelectResult" dropped: HTML is static -->
              <button data-on-click="onSelectResult" style="padding: 12px; background: transparent; color: #f1f5f9; border-width: 0; font-size: 14px; border-radius: 0">{{item}}</button>
            <!-- /mosaic-if -->
          <!-- /mosaic-for -->
        </div>
        <div style="display: flex; flex-direction: row; padding-top: 10px; padding-bottom: 2px">
          <div style="display: flex; flex-direction: column; padding: 2px">
            <span style="color: #92400e; font-size: 11px; font-weight: 700">{{flagLabel}}</span>
            <div style="display: flex; flex-direction: column; padding: 0">
              <!-- emit "onToggleFlagPicker" dropped: HTML is static -->
              <button data-on-click="onToggleFlagPicker" style="padding: 8px; background: #1f2937; color: #f3f4f6; border-width: 1px; border-color: #4b5563; font-size: 14px; border-radius: 4px">{{flagValue}}</button>
              <!-- mosaic-if when="flagOpen" -->
                <div style="display: flex; flex-direction: column; padding: 4px; background: #111827; border-width: 1px; border-color: #374151">
                  <!-- mosaic-for each="flagOptions" as="option" index="i" -->
                    <!-- emit "onSetFlagSelected" dropped: HTML is static -->
                    <button data-on-click="onSetFlagSelected" style="padding: 8px; background: #111827; color: #f3f4f6; border-width: 0; font-size: 14px; border-radius: 0">{{option}}</button>
                  <!-- /mosaic-for -->
                </div>
              <!-- /mosaic-if -->
            </div>
          </div>
          <span style="color: #92400e; font-size: 12px; font-weight: 700; padding: 8px">{{selectedFlag}}</span>
        </div>
        <div style="display: flex; flex-direction: row; padding-top: 10px; padding-bottom: 2px">
          <div style="display: flex; flex-direction: column; padding: 2px">
            <span style="color: #166534; font-size: 11px; font-weight: 700">{{tagEditLabel}}</span>
            <!-- emit "onTagEditChange" dropped: HTML is static -->
            <input type="text" value="{{tagEdit}}" placeholder="{{tagEditPlaceholder}}" data-on-change="onTagEditChange" style="background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 6px; color: #0f172a; padding: 8px">
          </div>
          <!-- emit "onAddTagSelected" dropped: HTML is static -->
          <button data-on-click="onAddTagSelected" style="background: #dcfce7; border-width: 1px; border-color: #86efac; border-radius: 6px; color: #166534; font-weight: 700; padding: 8px">{{addTagLabel}}</button>
          <!-- emit "onRemoveTagSelected" dropped: HTML is static -->
          <button data-on-click="onRemoveTagSelected" style="background: #fee2e2; border-width: 1px; border-color: #fca5a5; border-radius: 6px; color: #991b1b; font-weight: 700; padding: 8px">{{removeTagLabel}}</button>
        </div>
        <div style="display: flex; flex-direction: row; background: #ffffff; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; padding: 10px; padding-top: 10px; padding-bottom: 10px">
          <div style="display: flex; flex-direction: column; padding: 2px">
            <span style="color: #a21caf; font-size: 11px; font-weight: 800">{{customStudyLabel}}</span>
            <span style="color: #475569; font-size: 11px; font-weight: 700">{{customStudyLimitLabel}}</span>
            <!-- emit "onCustomStudyLimitChange" dropped: HTML is static -->
            <input type="number" inputmode="numeric" value="{{customStudyLimitValue}}" placeholder="100" data-on-change="onCustomStudyLimitChange" style="background: #ffffff; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; color: #0f172a; padding: 8px">
          </div>
          <div style="display: flex; flex-direction: column; padding: 8px">
            <!-- emit "onCustomStudyRescheduleChange" dropped: HTML is static -->
            <label><input type="checkbox" data-checked="{{customStudyRescheduleValue}}" data-on-toggle="onCustomStudyRescheduleChange" style="color: #334155; font-size: 12px; font-weight: 700"> {{customStudyRescheduleLabel}}</label>
          </div>
          <!-- emit "onRebuildFilteredDeck" dropped: HTML is static -->
          <button data-on-click="onRebuildFilteredDeck" style="background: #ede9fe; border-width: 1px; border-color: #c4b5fd; border-radius: 6px; color: #5b21b6; font-weight: 700; padding: 8px">{{customStudyRebuildLabel}}</button>
          <!-- emit "onEmptyFilteredDeck" dropped: HTML is static -->
          <button data-on-click="onEmptyFilteredDeck" style="background: #f1f5f9; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; color: #0f172a; font-weight: 700; padding: 8px">{{customStudyEmptyLabel}}</button>
        </div>
        <div style="display: flex; flex-direction: row; padding-top: 10px">
          <!-- emit "onOpenSelected" dropped: HTML is static -->
          <button data-on-click="onOpenSelected" style="background: #f1f5f9; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; color: #0f172a; font-weight: 700; padding: 8px">{{openLabel}}</button>
          <!-- emit "onEditSelected" dropped: HTML is static -->
          <button data-on-click="onEditSelected" style="background: #ccfbf1; border-width: 1px; border-color: #5eead4; border-radius: 6px; color: #115e59; font-weight: 700; padding: 8px">{{editLabel}}</button>
          <!-- emit "onToggleSuspendSelected" dropped: HTML is static -->
          <button data-on-click="onToggleSuspendSelected" style="background: #ffedd5; border-width: 1px; border-color: #fdba74; border-radius: 6px; color: #92400e; font-weight: 700; padding: 8px">{{suspendLabel}}</button>
          <!-- emit "onToggleMarkSelected" dropped: HTML is static -->
          <button data-on-click="onToggleMarkSelected" style="background: #ffe4e6; border-width: 1px; border-color: #fda4af; border-radius: 6px; color: #9f1239; font-weight: 700; padding: 8px">{{markLabel}}</button>
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
