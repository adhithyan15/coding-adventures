<svg xmlns="http://www.w3.org/2000/svg" width="822" height="319.21" viewBox="0 0 822 319.21" role="img" aria-label="How to write 东: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 东</title><desc>5 frames; frame N shows movements 1 to N of 东 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 东.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%9C.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 东. Median 1 draws the horizontal; median 2 a stroke from above it that falls to the lower left through it and turns right without lifting; median 3 a vertical down the middle, starting above the turned stroke and hooking to the left at its foot without lifting; medians 4–5 a short left-falling stroke and a dot at the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="319.21" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="213.21" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="213.21" viewBox="1 -916 1009 1434.