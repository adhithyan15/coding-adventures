 360 -287ZM376 -74Q332 -41 304 -9Q330 17 347 35Q364 53 374 64Q390 47 406.5 30.5Q423 14 440 -1Q429 -17 412.5 -35.5Q396 -54 376 -74Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M415 -1 L374 38 L330 -9" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M540 270 L540 270" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M540 270 L490 270 L420 285 L350 305 L280 325 L210 340 L150 335 L110 315 L100 290 L130 305 L170 310 L220 305 L270 285 L320 265 L300 245 L260 220 L216 190" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="216" cy="190" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="482.4" text-anchor="middle" font-size="55.4" fill="#6b7280"><tspan x="343.5" y="482.4">2. lift, then sweep</tspan><tspan x="343.5" y="550">left through the</tspan><tspan x="343.5" y="617.6">pointed hooked head</tspan></text></svg><rect x="336" y="42" width="150" height="236.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="236.18" viewBox="-2 -451 691 1088" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M360 -287Q236 -287 168.5 -224Q101 -161 101 -42Q101 20 131.5 81.5Q162 143 216 190Q243 213 272.5 231Q302 249 333 261Q321 266 295.5 274.5Q270 283 242 290Q214 297 192 297Q162 297 140.5 289.5Q119 282 83 259Q77 264 72.5 274.5Q68 285 68 297Q68 335 101.5 358Q135 381 189 381Q232 381 273.5 370Q315 359 357 346Q399 333 442 322Q485 311 531 311L597 313L568 236Q559 235 549.5 234Q540 233 530.5 232.5Q521 232 512 232Q471 229 424 216.5Q377 204 332.5 184Q288 164 251 138Q196 100 166 54Q136 8 136 -42Q136 -94 161 -130.5Q186 -167 236.5 -186Q287 -205 363 -205Q425 -205 486 -197.5Q547 -190 607 -177L619 -210Q570 -237 525.5 -254Q481 -271 440 