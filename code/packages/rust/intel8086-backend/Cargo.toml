[package]
name = "intel8086-backend"
version = "0.1.0"
edition = "2021"
description = "Intel 8086 backend for jit-core / aot-core. Lowers fixed-width constants, bounded arithmetic, and returns from CIR via intel8086-encoder; emitted bytes execute in intel8086-simulator."

[lib]
name = "intel8086_backend"
path = "src/lib.rs"

[dependencies]
intel8086-encoder = { path = "../intel8086-encoder" }
jit-core           = { path = "../jit-core" }
vm-core            = { path = "../vm-core" }

[dev-dependencies]
intel8086-simulator = { path = "../intel8086-simulator" }
