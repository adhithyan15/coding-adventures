<svg xmlns="http://www.w3.org/2000/svg" width="662" height="305.08" viewBox="0 0 662 305.08" role="img" aria-label="How to write 云: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 云</title><desc>4 frames; frame N shows movements 1 to N of 云 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 云.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BA%91.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 云, in two pieces. Medians 1–2 draw 二 on top, the lower horizontal longer. Medians 3–4 draw 厶 under it as 去 ends: a stroke that falls to the left and turns right along the foot without lifting, then a dot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those four ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and three intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="305.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="199.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.08" viewBox="-14 -830 1029 1365.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M165 760L842