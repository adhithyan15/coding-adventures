<svg xmlns="http://www.w3.org/2000/svg" width="662" height="328.32" viewBox="0 0 662 328.32" role="img" aria-label="How to write х: 2 strokes · 1 pen lift · 4 movements"><title>Writing х</title><desc>4 frames; frame N shows movements 1 to N of х (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase х demonstration, 08:42–08:49, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 08:42–08:49 lowercase х demonstration, the pen begins at the upper left, curves right and descends through the middle crossing, sweeps left into a lower terminal, then lifts once. The second run begins at the upper right, curves left and descends through the same crossing, then sweeps right into a small rising exit. The demonstrated school hand therefore uses two facing curved runs with one intervening lift: a right-bulging left stroke followed by a left-bulging right stroke. The bundled Noto Sans Cyrillic glyph is a printed X-like form with four straight diagonal arms meeting at the centre and no entry or exit joins. This learner path preserves the source&apos;s upper-left-run-before-upper-right-run order, top-to-bottom directions, crossing, and one-lift evidence while fitting the printed outline: trace the two straight left arms through the centre, lift, then trace the two straight right arms through the same centre. Connected cursive restores the source&apos;s facing curves and rising exit, and individual handwriting may round, narrow, widen, or slant the curves differently.</desc><rect x="0" y="0" width="662" height="328.32" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="222.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.32" viewBox="-61 -606 633 938.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M9 0L203 274L18 536L118 536L256 334L393 536L492 536L307 274L502 0L402 0L256 214L108 0L9 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M68 536 L68 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M68 536 L160 408 L256 274" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="256" cy="274" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="255.5" y="190.7" text-anchor="middle" font-size="50.7" fill="#6b7280"><tspan x="255.5" y="190.7">1. descend from the</tspan><tspan x="255.5" y="252.6">upper-left tip to the</tspan><tspan x="255.5" y="314.4">central crossing</tspan></text></svg><rect x="176" y="42" width="150" height="222.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="222.32" viewBox="-61 -606 633 938.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M9 0L203 274L18 536L118 536L256 334L393 536L492 536L307 274L502 0L402 0L256 214L108 0L9 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M68 536 L160 408 L256 274 L256 274" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M256 274 L158 138 L58 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="58" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="255.5" y="190.7" text-anchor="middle" font-size="50.7" fill="#6b7280"><tspan x="255.5" y="190.7">2. sweep down-left from</tspan><tspan x="255.5" y="252.6">the crossing to the</tspan><tspan x="255.5" y="314.4">lower-left tip</tspan></text></svg><rect x="336" y="42" width="150" height="222.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="222.32" viewBox="-61 -606 633 938.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M9 0L203 274L18 536L118 536L256 334L393 536L492 536L307 274L502 0L402 0L256 214L108 0L9 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M68 536 L160 408 L256 274 L158 138 L58 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M442 536 L442 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M442 536 L350 408 L256 274" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="256" cy="274" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="255.5" y="190.7" text-anchor="middle" font-size="50.7" fill="#6b7280"><tspan x="255.5" y="190.7">3. lift and descend from</tspan><tspan x="255.5" y="252.6">the upper-right tip to</tspan><tspan x="255.5" y="314.4">the crossing</tspan></text></svg><rect x="496" y="42" width="150" height="222.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="222.32" viewBox="-61 -606 633 938.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M9 0L203 274L18 536L118 536L256 334L393 536L492 536L307 274L502 0L402 0L256 214L108 0L9 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M68 536 L160 408 L256 274 L158 138 L58 0" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M442 536 L350 408 L256 274 L256 274" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M256 274 L354 138 L452 0" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="452" cy="0" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="255.5" y="190.7" text-anchor="middle" font-size="50.7" fill="#6b7280"><tspan x="255.5" y="190.7">4. sweep down-right from</tspan><tspan x="255.5" y="252.6">the crossing to the</tspan><tspan x="255.5" y="314.4">lower-right tip</tspan></text></svg><text x="16" y="277.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase х demonstration,</text><text x="16" y="289.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">08:42–08:49, YouTube, 5 February 2013</text><text x="16" y="302.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
