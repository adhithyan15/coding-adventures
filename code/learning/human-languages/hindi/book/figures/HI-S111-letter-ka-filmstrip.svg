<svg xmlns="http://www.w3.org/2000/svg" width="662" height="274.3" viewBox="0 0 662 274.3" role="img" aria-label="How to write क: 4 strokes · 3 pen lifts · 4 movements"><title>Writing क</title><desc>4 frames; frame N shows movements 1 to N of क (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-क-order.gif’, strokes 1–4, Wikimedia Commons, 8 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%95-order.gif&gt;. Source note on variation: The 27-frame animation shows four ordered pen-down runs: frames 2–11 start at the bowl&apos;s upper-right junction and carry the curve left over the top, down the left side, and around the bottom to the lower-right junction; frames 12–15 descend the central stem top-to-bottom; frames 16–19 restart at the upper junction and sweep the right-hand arch clockwise down to its open tip; frames 20–27 draw the shirorekhā left-to-right, for three intervening lifts. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit III, p. 12, independently shows the same four-part buildup. This learner path follows that sourced form and fits its curves to Noto Sans Devanagari; everyday handwriting may join or simplify the body differently.</desc><rect x="0" y="0" width="662" height="274.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="180.8" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="180.8" viewBox="-70 -692 923 1112.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M783 551L458 551L458 333L444 343Q464 368 498 384Q532 400 575 400Q646 400 686 357Q726 314 726 240Q726 188 706 139.5Q686 91 642 42L572 86Q605 120 625.5 157.5Q646 195 646 241Q646 285 625 307.5Q604 330 566 330Q533 330 503.5 308.5Q474 287 455 250L458 287L458 0L377 0L377 210L391 183Q372 164 348.5 149Q325 134 296 126Q267 118 233 118Q182 118 139.5 137.5Q97 157 71.5 195.5Q46 234 46 291Q46 373 100.5 418.5Q155 464 252 464Q278 464 300.5 461.5Q323 459 342 454L335 381Q318 386 297.5 388.5Q277 391 254 391Q193 391 160 364.5Q127 338 127 288Q127 239 157.5 214.5Q188 190 233 190Q281 190 320 214.5Q359 239 381 273L377 224L377 551L0 551L0 622L783 622L783 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M355 430 L355 430" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M355 430 L315 430 L270 435 L225 430 L180 415 L140 390 L110 360 L90 325 L86 290 L95 250 L115 215 L145 185 L180 165 L220 154 L260 155 L300 170 L335 195 L360 225 L377 260 L387 290" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="387" cy="290" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="391.5" y="214" text-anchor="middle" font-size="74" fill="#6b7280"><tspan x="391.5" y="214">1. sweep left over the</tspan><tspan x="391.5" y="304.3">top and around the bowl</tspan></text></svg><rect x="176" y="42" width="150" height="180.8" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="180.8" viewBox="-70 -692 923 1112.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M783 551L458 551L458 333L444 343Q464 368 498 384Q532 400 575 400Q646 400 686 357Q726 314 726 240Q726 188 706 139.5Q686 91 642 42L572 86Q605 120 625.5 157.5Q646 195 646 241Q646 285 625 307.5Q604 330 566 330Q533 330 503.5 308.5Q474 287 455 250L458 287L458 0L377 0L377 210L391 183Q372 164 348.5 149Q325 134 296 126Q267 118 233 118Q182 118 139.5 137.5Q97 157 71.5 195.5Q46 234 46 291Q46 373 100.5 418.5Q155 464