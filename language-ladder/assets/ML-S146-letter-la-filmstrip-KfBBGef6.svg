ll-rule="nonzero"/><path class="ductus__done" d="M123 256 L198 256 L273 256 L348 256 L423 256 L495 272 L495 272" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M495 272 L499 340 L491 407 L460 467 L409 511 L343 528 L275 530 L209 514 L156 473 L119 416" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="119" cy="416" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="425.5" y="209.3" text-anchor="middle" font-size="69.3" fill="#6b7280"><tspan x="425.5" y="209.3">2. climb and arch back</tspan><tspan x="425.5" y="293.8">over the top</tspan></text></svg><rect x="336" y="42" width="150" height="165.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="165.45" viewBox="-7 -636 865 954.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M788 554L788 0L63 0L63 313Q63 387 79.5 431Q96 475 126 504Q158 535 202.5 550.5Q247 566 305 566Q365 566 409.5 551Q454 536 483 507Q515 476 529.5 429.5Q544 383 544 322L544 222L149 222L149 70L702 70L702 554L788 554ZM304 496Q223 496 186 454.5Q149 413 149 321L149 292L458 292L458 320Q458 415 421 455.5Q384 496 304 496Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M123 256 L198 256 L273 256 L348 256 L423 256 L495 272 L499 340 L491 407 L460 467 L409 511 L343 528 L275 530 L209 514 L156 473 L119 416" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M119 416 L119 416 L107 343 L109 269 L107 196 L107 122 L111 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="111" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="425.5" y="209.3" text-anchor="middle" font-size="69.3" fill="#6b7280"><tspan x="425.5" y