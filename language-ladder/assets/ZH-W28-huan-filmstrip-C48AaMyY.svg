<svg xmlns="http://www.w3.org/2000/svg" width="982" height="295.25" viewBox="0 0 982 295.25" role="img" aria-label="How to write 欢: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 欢</title><desc>6 frames; frame N shows movements 1 to N of 欢 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 欢.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%AC%A2.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 欢. Medians 1–2 draw 又 exactly as 对 draws it, which is why the two characters are taught near each other; medians 3–6 draw 欠 as a short left-falling stroke, a hooked horizontal, then the long left-falling and right-falling pair that carry the whole right half. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving their order, the internal turn in 又, the hook in 欠 and five intervening lifts; Noto&apos;s final right-falling stroke reaches further right than the Arphic-derived source graphic&apos;s.</desc><rect x="0" y="0" width="982" height="295.25" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="201.75" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.75" viewBox="-45 -909 1086 1460.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M50 725L379 725L379 657L50 657L50 725ZM358 725L370 725L383 728L429 713Q406 537 356 396.5Q