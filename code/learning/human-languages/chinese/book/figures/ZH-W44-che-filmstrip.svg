 168 321Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 680 L337 641 L462 654 L568 648 L673 666 L873 653" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M404 822 L404 822" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M404 822 L280 500 L180 370 L844 375" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="844" cy="375" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="301.8" text-anchor="middle" font-size="81.8" fill="#6b7280"><tspan x="501.5" y="301.8">2. lift, then draw the</tspan><tspan x="501.5" y="401.6">stroke down to the left</tspan><tspan x="501.5" y="501.4">and turn right across</tspan><tspan x="501.5" y="601.2">the middle</tspan></text></svg><rect x="336" y="42" width="150" height="226.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="226.95" viewBox="-9 -915 1021 1544.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M77 695L924 695L924 622L77 622L77 695ZM61 184L942 184L942 110L61 110L61 184ZM507 560L586 560L586 -80L507 -80L507 560ZM168 321Q166 330 161 344Q156 358 150.5 373Q145 388 140 399Q156 403 173 424Q190 445 210 478Q221 495 241.5 531.5Q262 568 287.5 619Q313 670 338 728.5Q363 787 383 845L468 822Q434 738 393 655.5Q352 573 309 499.5Q266 426 222 368L222 365Q222 365 214 360.5Q206 356 195 349.5Q184 343 176 335.5Q168 328 168 321ZM168 321L168 381L216 407L858 407L858 336L276 336Q246 336 223.5 334Q201 332 187 329Q173 326 168 321Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 680 L337 641 L462 654 L568 648 L673 666 L873 653" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M4