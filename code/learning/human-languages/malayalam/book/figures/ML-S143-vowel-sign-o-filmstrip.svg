<svg xmlns="http://www.w3.org/2000/svg" width="502" height="241.39" viewBox="0 0 502 241.39" role="img" aria-label="How to write ൊ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ൊ</title><desc>3 frames; frame N shows movements 1 to N of ൊ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Sachin Nandakumar, Jayasree: Malayalam handwriting, animated stroke by stroke (github.com/sachn1/jayasree, commit e0c9d57, October 2026), js/src/stroke-data.raw.json: the hand-recorded centre-line strokes for ൊ, drawn alone; &quot;Jayasree&quot; by Sachin Nandakumar, CC BY 4.0 &lt;https://github.com/sachn1/jayasree/blob/e0c9d57dd32031c948da4d5f8432aae3e22c5bba/js/src/stroke-data.raw.json&gt;. Source note on variation: Jayasree records ൊ drawn alone as two strokes: first the left sign െ, the same way its own record draws it (its small loop, then over and down to the foot), then, after a lift, ാ from its upper tip clockwise round to the lower tip. Noto Sans Malayalam prints the standalone sign as the െ outline, a placeholder dot where the consonant would sit, and the ാ outline 923 units to the right; the dot is not written, so no stroke draws it, and the coverage check skips exactly that contour for this glyph. The paths are the cited െ and ാ paths, the second shifted with its outline. This is the sign&apos;s own ductus only; it claims no written order against a consonant. Jayasree keeps one recorded gesture per pen-down stroke, so two strokes mean one lift. Only these facts (stroke count, start, order, direction and end) are taken; no recorded coordinate is copied. The stroke data is licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/) as &quot;Jayasree&quot; by Sachin Nandakumar, https://github.com/sachn1/jayasree; this record adapts it, and the pen path is fitted to the bundled Noto Sans Malayalam outline rather than to the recording, which was drawn over the Manjari typeface. One recorder, so confidence is medium.</desc><rect x="0" y="0" width="502" height="241.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="110.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="110.39" viewBox="-31 -636 1487 1094.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M237 -12Q185 -12 139.5 14Q94 40 66.5 94.5Q39 149 39 232Q39 310 64.5 372Q90 434 135.5 477Q181 520 242 543Q303 566 374 566Q452 566 509 544Q566 522 603 483Q640 444 658 392Q676 340 676 281Q676 211 655 156.5Q634 102 598 61Q562 20 515 -9L466 54Q499 74 526.5 104Q554 134 570.5 176Q587 218 587 271Q587 339 562 389Q537 439 488.5 466.5Q440 494 370 494Q298 494 241.5 459.5Q185 425 152.5 365Q120 305 120 228Q120 171 135 133Q150 95 177 76.5Q204 58 240 58Q265 58 284 69.5Q303 81 314 103.5Q325 126 325 158Q325 206 298.5 232Q272 258 231 258Q192 258 157 238.5Q122 219 93 187L77 248Q107 284 151.5 306Q196 328 245 328Q294 328 330.5 309Q367 290 387.5 253.5Q408 217 408 165Q408 110 387 70Q366 30 327.5 9Q289 -12 237 -12ZM822 232Q796 232 778 248Q760 264 760 300Q760 338 778 353Q796 368 822 368Q848 368 866 353Q884 338 884 300Q884 264 866 248Q848 232 822 232ZM1386 279Q1386 221 1374.5 169Q1363 117 1336 76Q1309 35 1264.5 11.5Q1220 -12 1154 -12Q1103 -12 1065.5 4.5Q1028 21 1002.5 48Q977 75 962 107Q947 139 940 169L1027 186Q1034 159 1047.5 129Q1061 99 1086.5 78.5Q1112 58 1153 58Q1206 58 1237.5 86Q1269 114 1283.5 163.5Q1298 213 1298 278Q1298 343 1283.5 392Q1269 441 1238 468.5Q1207 496 1158 496Q1119 496 1093 475.5Q1067 455 1052 426Q1037 397 1030 370L944 387Q953 419 969.5 450.5Q986 482 1012 508Q1038 534 1075.5 550Q1113 566 1164 566Q1226 566 1268.5 542.5Q1311 519 1337 478.5Q1363 438 1374.5 386.5Q1386 335 1386 279Z" fill="#e0ddd6" fill-rul