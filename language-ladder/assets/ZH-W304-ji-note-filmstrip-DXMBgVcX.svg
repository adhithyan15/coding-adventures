<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.03" viewBox="0 0 822 321.03" role="img" aria-label="How to write 记: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 记</title><desc>5 frames; frame N shows movements 1 to N of 记 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 记.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%AE%B0.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 记, in two pieces. Medians 1–2 draw the speech piece as 说 opens. Medians 3–5 draw 己 as 起 ends: a horizontal that turns down without lifting, a horizontal across the middle, then a vertical that bends right along the foot and hooks up without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns, the hook and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="321.03" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="215.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.03" viewBox="-24 -885 1056 1513.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="s