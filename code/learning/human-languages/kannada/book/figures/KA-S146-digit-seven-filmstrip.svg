<svg xmlns="http://www.w3.org/2000/svg" width="502" height="335.75" viewBox="0 0 502 335.75" role="img" aria-label="How to write ೭: one unbroken stroke · 3 movements"><title>Writing ೭</title><desc>3 frames; frame N shows movements 1 to N of ೭ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೭, trace image file-jzwz9r79.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೭ as one path that starts at the curled tip of the head, curls clockwise over it, runs down and left across the body and turns right along the base to finish at the lower right (start upper left, end lower right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="502" height="335.75" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="217.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.25" viewBox="-7 -772 734 1063.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M288 702Q365 702 413.5 662Q462 622 462 542Q462 491 443 452Q424 413 385.5 381Q347 349 287 317Q236 290 206 268Q176 246 163.5 224Q151 202 151 175Q151 153 159.5 135.5Q168 118 181 107Q199 94 228.5 88Q258 82 323 82L657 82L657 0L318 0Q233 0 188 11Q143 22 119 42Q90 66 76.5 100.5Q63 135 63 175Q63 223 84 259.5Q105 296 142 325Q179 354 226 378Q287 411 319 436.5Q351 462 362.5 487Q374 512 374 541Q374 580 350 602Q326 624 286 624Q256 624 229 609Q202 594 202 560Q202 541 215.5 526Q229 511 260 509L252 434Q214 434 183 449.5Q152 465 134 494.5Q116 524 116 565Q116 603 136.5 634Q157 665 195.5 683.5Q234 702 288 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M222 490 L222 490" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M222 490 L201 497 L183 516 L172 547 L172 582 L185 613 L210 637 L243 651 L279 657 L316 654 L351 644 L379 624 L399 596 L412 562" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="412" cy="562" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="360" y="198.8" text-anchor="middle" font-size="58.8" fill="#6b7280"><tspan x="360" y="198.8">1. curl clockwise over</tspan><tspan x="360" y="270.5">the head from its tip</tspan></text></svg><rect x="176" y="42" width="150" height="217.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="217.25" viewBox="-7 -772 734 1063.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M288 702Q365 702 413.5 662Q462 622 462 542Q462 491 443 452Q424 413 385.5 381Q347 349 287 317Q236 290 206 268Q176 246 163.5 224Q151 202 151 175Q151 153 159.5 135.5Q168 118 181 107Q199 94 228.5 88Q258 82 323 82L657 82L657 0L318 0Q233 0 188 11Q143 22 119 42Q90 66 76.5 100.5Q63 135 63 175Q63 223 84 259.5Q105 296 142 325Q179 354 226 378Q287 411 319 436.5Q351 462 362.5 487Q374 512 374 541Q374 580 350 602Q326 624 286 624Q256 624 229 609Q202 594 202 560Q202 541 215.5 526Q229 511 260 509L252 434Q214 434 183 449.5Q152 465 134 494.5Q116 524 116 565Q116 603 136.5 634Q157 665 195.5 683.5Q234 702 288 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M222 490 L201 497 L183 516 L172 547 L172 582 L185 613 L210 637 L243 651 L279 657 L316 654 L351 644 L379 624 L399 596 L412 562" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M412 562 L412 562 L411 525 L404 490 L390 457 L368 427 L341 402 L312 380 L280 361 L249 343 L218 324 L188 303 L158 279 L130 253" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="130" cy="253" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="360" y="198.8" text-anchor="middle" font-size="58.8" fill="#6b7280"><tspan x="360" y="198.8">2. run down and left</tspan><tspan x="360" y="270.5">across the body</tspan></text></svg><rect x="336" y="42" width="150" height="217.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="217.25" viewBox="-7 -772 734 1063.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M288 702Q365 702 413.5 662Q462 622 462 542Q462 491 443 452Q424 413 385.5 381Q347 349 287 317Q236 290 206 268Q176 246 163.5 224Q151 202 151 175Q151 153 159.5 135.5Q168 118 181 107Q199 94 228.5 88Q258 82 323 82L657 82L657 0L318 0Q233 0 188 11Q143 22 119 42Q90 66 76.5 100.5Q63 135 63 175Q63 223 84 259.5Q105 296 142 325Q179 354 226 378Q287 411 319 436.5Q351 462 362.5 487Q374 512 374 541Q374 580 350 602Q326 624 286 624Q256 624 229 609Q202 594 202 560Q202 541 215.5 526Q229 511 260 509L252 434Q214 434 183 449.5Q152 465 134 494.5Q116 524 116 565Q116 603 136.5 634Q157 665 195.5 683.5Q234 702 288 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M222 490 L201 497 L183 516 L172 547 L172 582 L185 613 L210 637 L243 651 L279 657 L316 654 L351 644 L379 624 L399 596 L412 562 L411 525 L404 490 L390 457 L368 427 L341 402 L312 380 L280 361 L249 343 L218 324 L188 303 L158 279 L130 253 L130 253" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 253 L119 217 L114 181 L116 144 L129 110 L151 82 L181 62 L216 50 L254 44 L293 41 L332 40 L372 40 L412 40 L453 40 L493 40 L533 40 L573 40 L613 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="613" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="360" y="198.8" text-anchor="middle" font-size="58.8" fill="#6b7280"><tspan x="360" y="198.8">3. round the lower left</tspan><tspan x="360" y="270.5">and run along the base</tspan></text></svg><text x="16" y="272.25" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons</text><text x="16" y="284.75" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026):</text><text x="16" y="297.25" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the hidden, ordered tracing path for ೭, trace image file-jzwz9r79.svg</text><text x="16" y="309.75" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
