[package]
name = "coding_adventures_test_bootstrap"
version = "0.2.1"
edition = "2021"
description = "The L0 bootstrap test harness (TF01): TFV corpus parser, pure verdict core, seeded shuffled runs, TAP v14 output, VER05 property testing engine, VER06 coverage-guided fuzz engine, and VER07 microbenchmark harness"

[dependencies]

# The self-corpus runs on this crate's own runner rather than libtest, so it
# is a plain `fn main()` test binary. Arguments after `--` reach it unchanged:
#   cargo test -p coding_adventures_test_bootstrap --test self_corpus -- --seed 7
[[test]]
name = "self_corpus"
path = "tests/self_corpus.rs"
harness = false

[[test]]
name = "pbt_corpus"
path = "tests/pbt_corpus.rs"
harness = false

[[test]]
name = "fuzz_corpus"
path = "tests/fuzz_corpus.rs"
harness = false
