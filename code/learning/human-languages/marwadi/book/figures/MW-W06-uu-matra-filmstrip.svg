<svg xmlns="http://www.w3.org/2000/svg" width="502" height="286.98" viewBox="0 0 502 286.98" role="img" aria-label="How to write ू: one unbroken stroke · 3 movements"><title>Writing ू</title><desc>3 frames; frame N shows movements 1 to N of ू (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 51 (ू, uu sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. All 83 stored prototypes of the uu sign are one pen-down stroke. In 75 of them the pen first moves to the left, 72 turn clockwise, and 77 end lower and to the right of where they began (69 both turn clockwise and end there): the pen curls left round the loop, arches over its top and sweeps down the tail to the right. Where the stroke starts is less settled: 41 of the 83 start in the top third of the sign, the rest lower down; the path starts at the loop&apos;s inner tip, where the printed outline begins. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant or the headline; the book draws the sign alone and composes no Devanagari word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Devanagari outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="286.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, 