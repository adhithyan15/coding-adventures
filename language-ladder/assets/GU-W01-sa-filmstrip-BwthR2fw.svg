.8">into the long right</tspan><tspan x="366" y="523.4">shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="224.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="224.67" viewBox="-41 -673 814 1219.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M413 0Q347 0 296.5 27.5Q246 55 207.5 98.5Q169 142 139 189Q130 188 121 188Q75 188 52 202.5Q29 217 29 249Q29 274 46 287.5Q63 301 90 301Q109 301 127.5 295Q146 289 168 273Q203 282 233 300.5Q263 319 281.5 347.5Q300 376 300 416Q300 472 268 501Q236 530 183 530Q149 530 119.5 523Q90 516 55 499L29 568Q66 584 106 593.5Q146 603 186 603Q274 603 327.5 556.5Q381 510 381 418Q381 391 375 366Q388 362 402.5 359.5Q417 357 432 357Q466 357 490 363Q514 369 537 383L537 603L617 592L617 152Q617 125 620 112.5Q623 100 629 92Q640 78 661 75.5Q682 73 703 73L695 0L685 0Q650 0 619.5 7.5Q589 15 568 37Q549 57 543 81.5Q537 106 537 148L537 306Q517 296 492.5 291Q468 286 435 286Q387 286 347 302Q324 267 290 242.5Q256 218 216 204Q254 153 286 125Q318 97 350 86Q382 75 422 75L436 75L427 0L413 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M45 500 L45 530 L60 555 L90 565 L120 560 L150 550 L195 575 L245 580 L295 565 L335 530 L355 485 L355 430 L365 380 L350 340 L320 305 L280 275 L235 245 L185 225 L135 215 L95 225 L70 250 L90 275 L130 275 L170 260 L215 275 L260 300 L305 325 L355 330 L405 320 L455 320 L500 335 L535 360 L500 335 L455 320 L405 320 L355 330 L305 325 L260 300 L215 275 L200 225 L220 180 L250 140 L290 100 L340 65 L390 40 L425 38" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M577 585 L577 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M577 585 L577 500 L577 400 L577 300 L577 200 L577 125 L585 80 L610 55 L650 40 L685 38 L700 38" fill="none" stroke="#