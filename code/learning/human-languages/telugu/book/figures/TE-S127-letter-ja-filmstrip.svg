<svg xmlns="http://www.w3.org/2000/svg" width="662" height="271.43" viewBox="0 0 662 271.43" role="img" aria-label="How to write జ: 2 strokes · 1 pen lift · 4 movements"><title>Writing జ</title><desc>4 frames; frame N shows movements 1 to N of జ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant జ packaged tracing guide res/drawable/dot_stroke_c_2_3_ja.png, movements 1–4 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the upper-left arch, the two lower bowls, and the upper-right flourish as four movements. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the break keeps the guide&apos;s order and falls where the pen reaches the tip of the lower-right bowl. In the bundled Noto Sans Telugu outline the arch runs into the left bowl through a long diagonal, which movement 2 follows. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="662" height="271.43" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="165.43" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="165.43" viewBox="-34 -570 805 887.8" preserveAspectRatio="xMidYMid meet" overflow="h