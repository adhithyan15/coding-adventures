<svg xmlns="http://www.w3.org/2000/svg" width="982" height="277.95" viewBox="0 0 982 277.95" role="img" aria-label="How to write だ: 6 strokes · 5 pen lifts · 6 movements"><title>Writing だ</title><desc>6 frames; frame N shows movements 1 to N of だ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03060.svg, hiragana だ (U+3060 HIRAGANA LETTER DA), six stroke paths kvg:03060-s1 to s6 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03060.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 to s4 are た&apos;s strokes, the same paths as in its file for た, kanji/0305f.svg; s5 and s6 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. KanjiVG&apos;s short right bar of た ends in a small turn down and back to the left that the print glyph does not show.</desc><rect x="0" y="0" width="982" height="277.95" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="184.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.45" viewBox="1 -853 1019 1253" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M413 772Q408 756 403 732Q398 708 395 693Q388 657 378.5 609.5Q369 562 357.5 510Q346 458 332 408Q319 355 300 292.5Q281 230 260 167Q239 104 217 48Q195 -8 176 -50L88 -20Q111 19 134.5 73Q158 127 180.5 189Q203