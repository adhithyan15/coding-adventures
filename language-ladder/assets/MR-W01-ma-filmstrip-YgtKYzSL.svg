<svg xmlns="http://www.w3.org/2000/svg" width="502" height="332.22" viewBox="0 0 502 332.22" role="img" aria-label="How to write म: 3 strokes · 2 pen lifts · 3 movements"><title>Writing म</title><desc>3 frames; frame N shows movements 1 to N of म (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_m_%E0%A4%AE.gif&gt;. Source note on variation: The 12-frame animation shows three ordered pen-down runs: frames 0–5 descend the left stem, curl left and clockwise around the lower loop, and continue right through the crossbar without lifting; frames 6–8 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 9–11 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The spatial restarts at frames 6 and 9 delimit the three runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 39, independently confirms the left stem, lower loop and crossbar, right stem, and headline order, while staging the left stem and loop-crossbar separately rather than proving their join. This learner path takes its three-run lift count from the animation and fits its loop to Noto Sans Devanagari; everyday handwriting may divide or simplify the joined lower body differently.</desc><rect x="0" y="0" width="502" height="332.22" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="226.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.22" 