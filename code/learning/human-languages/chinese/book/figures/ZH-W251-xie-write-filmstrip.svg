<svg xmlns="http://www.w3.org/2000/svg" width="822" height="313.88" viewBox="0 0 822 313.88" role="img" aria-label="How to write 写: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 写</title><desc>5 frames; frame N shows movements 1 to N of 写 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 写.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%86%99.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 写, in two pieces. Medians 1–2 draw the cover: a short stroke on the left, then a horizontal that hooks down to the left without lifting. Medians 3–5 draw under it a short horizontal, a stroke from under the cover that goes down, right, down again and hooks to the left without lifting, as 号 ends, then a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns, the hooks and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s cover turns straight down at its right end, where the source&apos;s hooks to the left.</desc><rect x="0" y="0" width="822" height="313.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="207.88" rx="6" fill="#fdfd