<svg xmlns="http://www.w3.org/2000/svg" width="822" height="288.7" viewBox="0 0 822 288.7" role="img" aria-label="How to write ూ: one unbroken stroke · 5 movements"><title>Writing ూ</title><desc>5 frames; frame N shows movements 1 to N of ూ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 56 (ూ, uu sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 482 of the 517 stored prototypes of the uu sign (93%) are one pen-down stroke. 474 of the 482 start on the left, at the u sign&apos;s lower tip, and 467 reach their rightmost point in the last third of the stroke: the u sign first, then the bar and the loop on the right. The loop&apos;s turn is the least settled part: 273 of the 482 (57%) go round it clockwise, down its right side and back up its left, and 200 go round it the other way. The bundled font prints the loop&apos;s tip tucked under the bar on the left, where the clockwise form ends, so the path follows the majority. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="288.7" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="182.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="182.7" viewBox="-161 -570 884 1076.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4 115Q31 91 59.5 79Q88 67 121 67Q174 67 201 99Q228 131 228 189Q228 244 204.5 288Q181 332 141 366.5Q101 401 53 425L89 500Q99 496 113.5 487.5Q128 479 138 471L158 446Q201 421 235.5 383Q270 345 290.5 297.5Q311 250 311 194Q311 99 261 43.5Q211 -12 116 -12ZM512 220Q475 220 448.5 231Q422 242 406 260.5Q390 279 382.5 301Q375 323 375 344Q375 376 384.5 399Q394 422 408 443L496 450Q471 425 459.5 401.5Q448 378 448 353Q448 323 465.5 304.5Q483 286 516 286Q551 286 565.5 304.5Q580 323 580 350Q580 392 554.5 408.5Q529 425 483 425L79 425L89 500L441 500Q484 500 514 496.5Q544 493 566 485Q588 477 606 462Q627 446 640 418.5Q653 391 653 353Q653 290 615 255Q577 220 512 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-71 143" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28 L120 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="120" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="281" y="222.8" text-anchor="middle" font-size="70.8" fill="#6b7280"><tspan x="281" y="222.8">1. start at the</tspan><tspan x="281" y="309.2">lower-left tip and curve</tspan><tspan x="281" y="395.6">down to the right</tspan></text></svg><rect x="176" y="42" width="150" height="182.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="182.7" viewBox="-161 -570 884 1076.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4 115Q31 91 59.5 79Q88 67 121 67Q174 67 201 99Q228 131 228 189Q228 244 204.5 288Q181 332 141 366.5Q101 401 53 425L89 500Q99 496 113.5 487.5Q128 479 138 471L158 446Q201 421 235.5 383Q270 345 290.5 297.5Q311 250 311 194Q311 99 261 43.5Q211 -12 116 -12ZM512 220Q475 220 448.5 231Q422 242 406 260.5Q390 279 382.5 301Q375 323 375 344Q375 376 384.5 399Q394 422 408 443L496 450Q471 425 459.5 401.5Q448 378 448 353Q448 323 465.5 304.5Q483 286 516 286Q551 286 565.5 304.5Q580 323 580 350Q580 392 554.5 408.5Q529 425 483 425L79 425L89 500L441 500Q484 500 514 496.5Q544 493 566 485Q588 477 606 462Q627 446 640 418.5Q653 391 653 353Q653 290 615 255Q577 220 512 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28 L120 28" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 28 L160 35 L200 53 L233 82 L255 119 L266 159 L268 201 L262 243 L250 280" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="250" cy="280" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="281" y="222.8" text-anchor="middle" font-size="70.8" fill="#6b7280"><tspan x="281" y="222.8">2. round the bowl and</tspan><tspan x="281" y="309.2">climb its right side</tspan></text></svg><rect x="336" y="42" width="150" height="182.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="182.7" viewBox="-161 -570 884 1076.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4 115Q31 91 59.5 79Q88 67 121 67Q174 67 201 99Q228 131 228 189Q228 244 204.