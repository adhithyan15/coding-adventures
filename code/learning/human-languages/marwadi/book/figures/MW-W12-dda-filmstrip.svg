<svg xmlns="http://www.w3.org/2000/svg" width="342" height="355.76" viewBox="0 0 342 355.76" role="img" aria-label="How to write ड: 2 strokes · 1 pen lift · 2 movements"><title>Writing ड</title><desc>2 frames; frame N shows movements 1 to N of ड (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ड-order.gif’, strokes 1–2, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A1-order.gif&gt;. Source note on variation: The 20-frame animation shows two ordered pen-down runs over its gray guide: frames 2–15 start at the right stem&apos;s headline junction, descend top-to-bottom, turn left across the upper shoulder, sweep counterclockwise around the upper-left loop, and continue clockwise around the broad lower bowl to its open up-left tip without lifting; frames 16–18 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for one intervening lift. The 250 ms hold at frame 15 marks the body-run ending before the one-second completed frame 19. This learner path follows that sourced two-run order and fits its joined S-shaped body to Noto Sans Devanagari; everyday handwriting may narrow or simplify the loops differently.</desc><rect x="0" y="0" width="342" height="355.76" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="237.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="237.26" viewBox="-80 -692 705 1115.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M315 222Q285 222 255 216Q225 210 201 199Q159 226 125.5 262.5Q92 299 92 348Q92 406 130 435Q168 464 247 464L365 464L365 551L-10 551L-10 622L545 622L545 551L446 551L446 394L248 394Q208 394 190 381Q172 368 172 342Q172 323 184.5 305.5Q197 288 214 276Q238 284 266 289Q294 294 323 294Q404 294 446.5 256.5Q489 219 489 154Q489 110 468.5 75Q448 40 405 20Q362 0 294 0Q208 0 140.5 33.5Q73 67 20 119L70 185Q123 130 177 102Q231 74 292 74Q351 74 379.5 94Q408 114 408 151Q408 184 386.5 203Q365 222 315 222Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M415 551 L415 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M415 551 L415 500 L415 450 L415 400 L370 400 L325 400 L280 400 L240 400 L195 398 L155 382 L125 355 L108 322 L110 288 L138 252 L160 235 L198 218 L275 220 L315 238 L360 242 L405 230 L445 205 L472 170 L485 130 L470 100 L450 70 L425 32 L380 17 L325 10 L270 12 L215 24 L165 45 L120 72 L82 102 L55 125" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="55" cy="125" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="272.5" y="196.5" text-anchor="middle" font-size="56.5" fill="#6b7280"><tspan x="272.5" y="196.5">1. descend the stem and</tspan><tspan x="272.5" y="265.4">sweep through the upper</tspan><tspan x="272.5" y="334.4">loop and open lower</tspan><tspan x="272.5" y="403.3">bowl</tspan></text></svg><rect x="176" y="42" width="150" height="237.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="237.26" viewBox="-80 -692 705 1115.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M315 222Q285 222 255 216Q225 210 201 199Q159 226 125.5 262.5Q92 299 92 348Q92 406 130 435Q168 464 247 464L365 464L365 551L-10 551L-10 622L545 622L545 551L446 551L446 394L248 394Q208 394 190 381Q172 368 172 342Q172 323 184.5 305.5Q197 288 214 276Q238 284 266 289Q294 294 323 294Q404 294 446.5 256.5Q489 219 489 154Q489 110 468.5 75Q448 40 405 20Q362 0 294 0Q208 0 140.5 33.5Q73 67 20 119L70 185Q123 130 177 102Q231 74 292 74Q351 74 379.5 94Q408 114 408 151Q408 184 386.5 203Q365 222 315 222Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M415 551 L415 500 L415 450 L415 400 L370 400 L325 400 L280 400 L240 400 L195 398 L155 382 L125 355 L108 322 L110 288 L138 252 L160 235 L198 218 L275 220 L315 238 L360 242 L405 230 L445 205 L472 170 L485 130 L470 100 L450 70 L425 32 L380 17 L325 10 L270 12 L215 24 L165 45 L120 72 L82 102 L55 125" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L75 585 L145 585 L215 585 L285 585 L355 585 L425 585 L500 585 L555 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="555" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="272.5" y="196.5" text-anchor="middle" font-size="56.5" fill="#6b7280"><tspan x="272.5" y="196.5">2. lift, then draw the</tspan><tspan x="272.5" y="265.4">shirorekha</tspan><tspan x="272.5" y="334.4">left-to-right</tspan></text></svg><text x="16" y="292.26" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ड-order.gif’, strokes</text><text x="16" y="304.76" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">1–2, Wikimedia Commons, 10 May 2009</text><text x="16" y="317.26" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="329.76" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
