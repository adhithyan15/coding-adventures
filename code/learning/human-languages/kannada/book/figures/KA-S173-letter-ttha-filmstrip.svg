<svg xmlns="http://www.w3.org/2000/svg" width="982" height="338.78" viewBox="0 0 982 338.78" role="img" aria-label="How to write ಠ: 3 strokes · 2 pen lifts · 6 movements"><title>Writing ಠ</title><desc>6 frames; frame N shows movements 1 to N of ಠ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-tta.gif, animation of Kannada consonant ಠ, 41 frames, 4.1 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-tta.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation is filed under the slug &quot;tta&quot; and draws retroflex ಠ (U+0CA0); in this series &quot;ta&quot; animates retroflex ಟ and &quot;thha&quot; dental ಥ, so the glyph was checked frame by frame rather than taken from the file name. It writes ಠ in three pen-down runs: from the upper left of the round bowl the pen goes counterclockwise down the left side, round the base, up the right side and back left across the top, closing the bowl where it began (frames 0–12; the pencil rests there to frame 14); after a lift, the top bar from left to right curling up into the hook (frames 15–22); after a second lift, the dot in the middle (frames 26–27). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (231×208, 105 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the bowl&apos;s top is fused into the bar, as in ದ, so the closing movement runs along the lower part of the bar&apos;s ink and the bar retraces it, and the dot is a filled disc, drawn as a small closed loop inside it. The two-lift order remains the same.</desc><rect x="0" y="0" width="982" height="338.78" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="245.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.28" viewBox="-28 -860 708 1157.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M326 -12Q245 -12 180.5 19Q116 50 79 109.5Q42 169 42 255Q42 312 57.5 356Q73 400 101 433Q129 466 168 488L186 474L42 474L42 551L398 551Q452 551 474 556Q496 561 507 569Q520 579 524.5 591.5Q529 604 529 618Q529 651 513 682.5Q497 714 464 747L529 790Q576 738 593 696.5Q610 655 610 612Q610 593 602 565.5Q594 538 569 516Q556 504 538 494.5Q520 485 496 480L491 488Q529 464 555.5 431.5Q582 399 596 356Q610 313 610 255Q610 177 576 117Q542 57 478.5 22.5Q415 -12 326 -12ZM327 69Q395 69 439.5 96Q484 123 506 169.5Q528 216 528 272Q528 337 501.5 382.5Q475 428 430 452Q385 476 328 476Q266 476 220 450.5Q174 425 149 379.5Q124 334 124 272Q124 175 179.5 122Q235 69 327 69ZM326 217Q302 217 285 234Q268 251 268 276Q268 301 285 318Q302 335 326 335Q351 335 367.5 318Q384 301 384 276Q384 251 367.5 234Q351 217 326 217Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 498 L205 498" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M205 498 L184 479 L163 454 L141 424 L120 392 L104 359 L93 323 L88 285 L87 246 L91 208 L101 171 L117 138 L139 107 L167 81 L198 60 L233 46 L269 37 L307 32 L345 32 L383 37 L420 46 L454 60 L485 81 L514 106" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="514" cy="106" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="326" y="208.7" text-anchor="middle" font-size="56.7" fill="#6b7280"><tspan x="326" y="208.7">1. go down the left side</tspan><tspan x="326" y="277.9">round the base</tspan></text></svg><rect x="176" y="42" width="150" height="245.28" rx="6" fi