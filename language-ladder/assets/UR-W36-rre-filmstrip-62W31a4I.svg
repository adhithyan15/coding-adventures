ies Open</text><text x="16" y="460.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2026)</text><text x="16" y="472.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
