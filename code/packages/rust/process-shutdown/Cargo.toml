[package]
name = "process-shutdown"
version = "0.1.0"
edition = "2021"
description = "Cross-platform cooperative process-shutdown signal adapter"
license = "MIT"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }
