[package]
name = "iir-to-wasm"
version = "0.48.2"
edition = "2021"
description = "IIR → WASM backend — lowers IIRModule to WasmModule. v0.48.2 marks an impossible value-returning dispatch-loop fallthrough unreachable so strict WASM validation sees a complete result path; v0.48.1 fixed the last-block fallback branch depth; v0.48.0 corrected dispatch-loop branch-depth formulas after the WASM11 interpreter fix."

[lib]
name = "iir_to_wasm"
path = "src/lib.rs"

[dependencies]
interpreter-ir      = { path = "../interpreter-ir" }
wasm-types          = { path = "../wasm-types" }
wasm-module-encoder = { path = "../wasm-module-encoder" }
wasm-leb128         = { path = "../wasm-leb128" }
codegen-core        = { path = "../codegen-core" }

[dev-dependencies]
# Executes the lowered wasm to prove the width-wrap end-to-end (E2).
wasm-runtime = { path = "../wasm-runtime" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"

[[test]]
name = "width_wrap"
path = "tests/width_wrap.rs"
