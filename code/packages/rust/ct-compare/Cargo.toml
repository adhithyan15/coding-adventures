[package]
name = "coding_adventures_ct_compare"
version = "0.1.0"
edition = "2021"
description = "Constant-time byte-slice equality — no early exit on first differing byte, no data-dependent branches"

[dependencies]

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
coding_adventures_sha256 = { path = "../sha256" }

capability-runtime-conformance = { path = "../capability-runtime-conformance" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false

[[test]]
name = "fuzz_targets"
path = "tests/fuzz_targets.rs"
harness = false

[[test]]
name = "microbenchmarks"
path = "tests/microbenchmarks.rs"
harness = false

# Generated from code/specs/ct-compare.warrant (VER04h): examples, bounded
# exhaustive suites, property suites, fuzz suites and sabotage controls.
[[test]]
name = "warrant_evidence"
path = "tests/warrant_evidence.rs"
harness = false

# VER08b: runs the public API inside a manifest-derived sandbox (Linux live;
# elsewhere reports NOT-LIVE). The BUILD runs every [[test]] target via
# `cargo test -p coding_adventures_ct_compare`.
[[test]]
name = "runtime_capability"
path = "tests/runtime_capability.rs"
harness = false
