<svg xmlns="http://www.w3.org/2000/svg" width="342" height="342.9" viewBox="0 0 342 342.9" role="img" aria-label="How to write 又: 2 strokes · 1 pen lift · 2 movements"><title>Writing 又</title><desc>2 frames; frame N shows movements 1 to N of 又 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 又.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%88.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 又. Median 1 draws a horizontal that turns and falls to the lower left without lifting; median 2 a long right-falling stroke from under its start, across it to the foot. These are the two strokes of 又 in 对, 反 and 报. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and one intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="342" height="342.9" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="193.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="193.15" viewBox="-32 -843 1070 1377.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M245 715Q300 536 396 391.5Q492 247 634 146.5Q776 46 968 -2Q960 -9 950.5 -21.5Q941 -34 932.5 -46.5Q924 -59 918 -70Q720 -17 576 89.5Q432 196 334 348.5Q236 501 175 695L245 715ZM98 769L802 769L802 695L98 695L98 769ZM781 769L795 769L808 773L858 749Q815 577 739.5 443.5Q664 310 562.5 210.5Q461 111 340 41.5Q219 -28 85 -70Q82 -61 73.5 -47.5Q65 -34 56 -21.5Q47 -9 38 -2Q169 37 287 100.5Q405 164 502 256Q599 348 670.5 471.5Q742 595 781 753L781 769Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 730 L118 730" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M118 730 L827 730 L728 500 L594 300 L511 232 L464 172 L359 100 L90 -30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="90" cy="-30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503" y="295.7" text-anchor="middle" font-size="85.7" fill="#6b7280"><tspan x="503" y="295.7">1. draw 又&apos;s horizontal</tspan><tspan x="503" y="400.3">and turn down to the</tspan><tspan x="503" y="504.8">left</tspan></text></svg><rect x="176" y="60.75" width="150" height="193.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="193.15" viewBox="-32 -843 1070 1377.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M245 715Q300 536 396 391.5Q492 247 634 146.5Q776 46 968 -2Q960 -9 950.5 -21.5Q941 -34 932.5 -46.5Q924 -59 918 -70Q720 -17 576 89.5Q432 196 334 348.5Q236 501 175 695L245 715ZM98 769L802 769L802 695L98 695L98 769ZM781 769L795 769L808 773L858 749Q815 577 739.5 443.5Q664 310 562.5 210.5Q461 111 340 41.5Q219 -28 85 -70Q82 -61 73.5 -47.5Q65 -34 56 -21.5Q47 -9 38 -2Q169 37 287 100.5Q405 164 502 256Q599 348 670.5 471.5Q742 595 781 753L781 769Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 730 L827 730 L728 500 L594 300 L511 232 L464 172 L359 100 L90 -30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M195 700 L195 700" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M195 700 L347 400 L416 300 L501 210 L664 83 L914 -22" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="914" cy="-22" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="503" y="295.7" text-anchor="middle" font-size="85.7" fill="#6b7280"><tspan x="503" y="295.7">2. lift, then draw 又&apos;s</tspan><tspan x="503" y="400.3">right-falling stroke</tspan></text></svg><text x="16" y="266.9" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 又.json, ordered stroke</text><text x="16" y="279.4" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="291.9" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="304.4" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="316.9" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
