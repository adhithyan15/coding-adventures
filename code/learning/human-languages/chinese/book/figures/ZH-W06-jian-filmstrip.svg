<svg xmlns="http://www.w3.org/2000/svg" width="982" height="506.4" viewBox="0 0 982 506.4" role="img" aria-label="How to write 见: 4 strokes · 3 pen lifts · 7 movements"><title>Writing 见</title><desc>7 frames; frame N shows movements 1 to N of 见 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 见.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%A7%81.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 见. Median 1 descends the frame&apos;s left side. Median 2 separately draws the top horizontal and turns down the right side without lifting. Median 3 draws the inner left-falling leg. Median 4 separately descends the second leg, bends right along the base, and finishes with an upward hook without lifting. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all four medians to Noto Sans SC while preserving their order, the frame-before-legs sequence, all three joined turns across the top-right frame and vertical-bend hook, and three intervening lifts; Noto&apos;s upper frame is squarer and its hooked leg is flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="982" height="506.4" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="200.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.45" viewBox="-24 -855 1041 1391.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path cl