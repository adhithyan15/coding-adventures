[package]
name = "iir-to-jvm-class-file"
version = "0.19.0"
edition = "2021"
description = "IIR → JVM class file backend — lowers IIRModule to JvmClassFile.  v0.14.0 (LANG-FULL O2 — narrow-width mask on the LONG model): the int-model mask (v0.13.1) is right for concretized exit-code programs, but a PRINTING program (Oct `out`, BASIC `PRINT`) keeps the i64/long model — so a narrow-hinted op (Oct's u8 `add`/`~`) has `long` operands. Such an op now stays on the long model (`ladd`/`lxor` + an `i2l; land` mask) instead of the bare-u8-hint `iadd`/`iand`, which would be unverifiable over long operands. `narrow_op_over_long` keys this off the actual operand types (in `build_type_map` and the op loop), so concretized programs are unchanged. Fixes Oct `200u8+100u8=44` / `~0u8=255` on real java.  v0.13.1 (LANG-FULL E2 integration — REVERT v0.13.0's long model back to the int model): narrow unsigned types (u4/u8/u16/u32) use the JVM **int model** (int locals/`I` descriptors + `iadd`/`iand` + `sipush <mask>; iand`). v0.13.0's long-register model was wrong on the JVM: a scalar program reaches this backend through lang_aot::concretize_scalar_any_for_jvm, which narrows i64→i32 (the jvm-simulator is 32-bit, the entry must ireturn) — so the long model left the narrow op `long` while the concretized consts/return were `int`, producing UNVERIFIABLE bytecode (istore consts feeding an lmul; lreturn from an int method) → the Nib u8 proof returned None on real java. The int model is operand-consistent with the concretized i32 and the i32 mask restores the wrap (200u8+100u8=44, verified on real java). u4 stays recognised (as int).  v0.12.0 (E2 backend 4/6): masked narrow results with `iconst/sipush/ldc <mask>; iand` after the int op (superseded by v0.13.0's long model).  v0.11.0 (LANG-MATRIX LM-J Brainfuck): adds the lowered byte-tape ops alloc_bytes (no-op — the tape is the static env/BFRuntime.__tape field), load_byte/store_byte (baload/bastore with l2i/i2l conversions for the widened i64 value model), and width-correct i64 branch conditions (lcmp before ifeq/ifne) — so the i64-widened Brainfuck runs on the JVM.  v0.7.0 (G3): whitelist call_builtin print_i64 and lower it to invokestatic env/BasicRuntime.println(J)V, mirroring iir-to-wasm v0.8.0's env.__print_i64 host import.  Together they let BASIC's PRINT reach real JVM and wasm bytecode."

[lib]
name = "iir_to_jvm_class_file"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
jvm-class-file = { path = "../jvm-class-file" }
codegen-core   = { path = "../codegen-core" }
