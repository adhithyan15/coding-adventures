<svg xmlns="http://www.w3.org/2000/svg" width="982" height="306.65" viewBox="0 0 982 306.65" role="img" aria-label="How to write 扫: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 扫</title><desc>6 frames; frame N shows movements 1 to N of 扫 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 扫.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%89%AB.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 扫, in two pieces. Medians 1–3 draw the hand piece 扌 on the left as 打 opens: a horizontal, a vertical that hooks to the left at its foot without lifting, then a rising stroke. Medians 4–6 draw the right piece: a horizontal that turns down the right side without lifting, a middle horizontal, then the bottom horizontal. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the hook, the turn and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s right side runs on below the bottom horizontal, where the source&apos;s stops above it.</desc><rect x="0" y="0" width="982" height="306.65" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="213.15" rx="6" fill="#fdfdfc" stroke="#dbe1ea"