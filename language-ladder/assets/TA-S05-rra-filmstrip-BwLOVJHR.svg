<svg xmlns="http://www.w3.org/2000/svg" width="822" height="307.22" viewBox="0 0 822 307.22" role="img" aria-label="How to write ற: one unbroken stroke · 5 movements"><title>Writing ற</title><desc>5 frames; frame N shows movements 1 to N of ற (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 10, ற (Univ. of Texas at Austin), p. 194 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Tamil handwriting is taught with school-to-school variation; there is no single national stroke-order standard. Appendix I Frame 10 numbers five hand-movements, with movement 3 on the middle upright beside movement 2. Native writers draw them as one continuous stroke, and this ductus follows the five movements in order without lifting. The bundled Noto Sans Tamil outline prints a single shared middle upright, so movement 3 climbs back up it to start the second arch. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 99% of the 378 stored prototypes of ற are a single pen-down stroke.</desc><rect x="0" y="0" width="822" height="307.22" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="213.72" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="213.72" viewBox="-25 -636 900 1282.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M570 566Q646 566 698.5 528Q751 490 778 418.5Q805 347 805 244Q805 122 774 44.5Q743 -33 690 -77Q652 -108 604 -125.5Q556 -143 501.5 -149.5Q447 -156 388 -156L270 -156Q228