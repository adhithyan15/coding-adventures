<svg xmlns="http://www.w3.org/2000/svg" width="982" height="392.02" viewBox="0 0 982 392.02" role="img" aria-label="How to write ക: one unbroken stroke · 7 movements"><title>Writing ക</title><desc>7 frames; frame N shows movements 1 to N of ക (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxv: movements 1-7 for ക, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-035.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxv) starts on the left leg of the top loop at the height of the crossbar, climbs clockwise over the loop and down its right leg (1), rounds the bottom of the middle bowl to the left (2), climbs the middle stem (3), runs back down into the left bowl (4), rounds the left bowl up to the left end of the crossbar (5), draws the crossbar left to right (6) and curls the right-hand hook down to finish at the lower right (7). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ക as one stroke from the upper centre to the lower right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker; 105 of the 107 unique samples show no jump between consecutive points of the kind a lift makes, and they most often start at the upper left (49 of 107) and end at the lower centre (59 of 107). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its KA.png at the middle centre and ends it at the lower right. Moag, Thooval and hand all start in the upper or middle centre and end at the lower right; grahyam is the outlier, and 2 of its 107 samples lift once. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing; the run back down the middle stem retraces the ink just drawn.</desc><rect x="0" y="0" width="982" height="392.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 7 movements</text><rect x="16" y="42" width="150" height="137.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="137.01" viewBox="-38 -636 1114 1017.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M216 -12Q126 -12 79 32Q32 76 32 152Q32 199 53 233.5Q74 268 109 288Q133 302 162.5 311Q192 320 233.5 324Q275 328 333 328L716 328Q802 328 853.5 318Q905 308 942 282Q971 262 988.5 230.5Q1006 199 1006 152Q1006 76 961 32Q916 -12 832 -12Q807 -12 780.5 -9.5Q754 -7 731 0L750 67Q764 63 783.5 60.5Q803 58 819 58Q870 58 895 81.5Q920 105 920 151Q920 180 909 198.5Q898 217 880 229Q852 247 811.5 252.5Q771 258 708 258L331 258Q260 258 222.5 252.5Q185 247 157 229Q139 218 128.5 199Q118 180 118 154Q118 121 130.5 99.5Q143 78 166 68Q189 58 219 58Q251 58 283.5 68.5Q316 79 352 106L402 52Q372 30 343 16Q314 2 283.5 -5Q253 -12 216 -12ZM523 566Q603 566 654.5 528.5Q706 491 731 426.5Q756 362 756 279Q756 185 728 120Q700 55 648 21.5Q596 -12 524 -12Q470 -12 426.5 6.5Q383 25 352 62Q321 99 304.5 153.5Q288 208 288 279Q288 413 351 489.5Q414 566 523 566ZM523 496Q447 496 410.5 442Q374 388 374 278Q374 204