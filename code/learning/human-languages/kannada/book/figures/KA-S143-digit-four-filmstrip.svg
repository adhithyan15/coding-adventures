<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.23" viewBox="0 0 822 321.23" role="img" aria-label="How to write ೪: one unbroken stroke · 5 movements"><title>Writing ೪</title><desc>5 frames; frame N shows movements 1 to N of ೪ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೪, trace image 4.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೪ as one path that starts inside the upper loop, turns anticlockwise over it and down the left side, crosses to the lower loop, circles it clockwise and climbs the right arm to finish at the upper right. Noto draws the upper loop&apos;s inner end at its lower left, so the path starts there and runs right along the loop&apos;s base before turning up; the top of the lower loop is crossed twice. The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="822" height="321.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="215.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.23" viewBox="-32 -772 752 1079" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M361 -12Q303 -12 265.5 5.5Q228 23 210 52.5Q192 82 192 119Q192 151 206.5 177.5Q221 204 256 220L279 199Q205 220 150.5 257Q96 294 67 350.5Q38 407 38 484Q38 547 62 596Q86 645 131.5 673.5Q177 702 240 702Q279 702 311 689Q343 676 362 648.5Q381 621 381 576Q381 538 364.5 506.5Q348 475 311.5 456.5Q275 438 213 438Q185 438 155.5 444.5Q126 451 106 462L113 535Q134 523 157 517.5Q180 512 202 512Q235 512 255.5 520.5Q276 529 285.5 544Q295 559 295 578Q295 604 277.5 616.5Q260 629 234 629Q207 629 186.5 618.5Q166 608 151.5 588.5Q137 569 130 541Q123 513 123 478Q123 448 132 414.5Q141 381 167 349.5Q193 318 241.5 294Q290 270 368 259Q432 277 475 307Q518 337 540 376.5Q562 416 562 460Q562 514 533.5 556Q505 598 444 632L498 702Q538 682 572.5 648Q607 614 628.5 568.5Q650 523 650 467Q650 399 621 348.5Q592 298 547 264Q502 230 453 209L460 224Q488 211 509.5 185.5Q531 160 531 119Q531 58 486 23Q441 -12 361 -12ZM361 62Q403 62 425.5 78.5Q448 95 448 123Q448 150 424 167Q400 184 362 191Q338 188 318 178.5Q298 169 286.5 155Q275 141 275 122Q275 99 294 80.5Q313 62 361 62Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M135 492 L135 492" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M13