<svg xmlns="http://www.w3.org/2000/svg" width="822" height="325.67" viewBox="0 0 822 325.67" role="img" aria-label="How to write き: 4 strokes · 3 pen lifts · 5 movements"><title>Writing き</title><desc>5 frames; frame N shows movements 1 to N of き (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0304d.svg, hiragana き (U+304D HIRAGANA LETTER KI), four stroke paths kvg:0304d-s1 to s4 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0304d.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 and s2 are the two bars, each drawn left to right; s3 starts above the upper bar, runs down and to the right through both bars and, without lifting, turns sharply back to the left; s4 starts at the upper left of the curve, drops and finishes along the base to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. Some hands join the hook to the curve below it; KanjiVG and the bundled print glyph keep them apart, and so does this book.</desc><rect x="0" y="0" width="822" height="325.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="219.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.67" viewBox="90 -868 839 1228.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M179 685Q284 673 379.5 671Q475 669 552 676Q613 682 673.5 694.5Q734 707 788 724L799 652Q750 638 689.5 626Q62