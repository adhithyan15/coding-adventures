# Cargo.toml - smoke-test harness for mosaic-pkg-draft-editor.
#
# This package's deliverables are Mosaic source files. The Cargo project exists
# only to run compile and native-gate tests for the .mil/.mll/.msl sources.

[workspace]
# Intentionally empty: opt out of the parent Rust workspace.

[package]
name        = "mosaic-pkg-draft-editor-smoke"
version     = "0.2.0"
edition     = "2021"
description = "Smoke-test harness for the DraftEditor Mosaic component package"
publish     = false

[dev-dependencies]
mosmodel-compiler   = { path = "../../rust/mosmodel-compiler" }
moslayout-compiler  = { path = "../../rust/moslayout-compiler" }
mosstyle-compiler   = { path = "../../rust/mosstyle-compiler" }
mosaic-package-artifact-builder = { path = "../../rust/mosaic-package-artifact-builder" }
# Zero-dependency in-house JSON parser, for reading DraftEditor.stories.json
# in the tests (as mosaic-pkg-toolkit does, in preference to serde_json).
coding_adventures_bounded_json = { path = "../../rust/bounded-json" }
tempfile            = "3"
toml                = "0.8"

[[test]]
name = "package_compiles"
path = "tests/package_compiles.rs"

[[test]]
name = "native_complete_gate"
path = "tests/native_complete_gate.rs"
