<svg xmlns="http://www.w3.org/2000/svg" width="342" height="331.09" viewBox="0 0 342 331.09" role="img" aria-label="How to write ખ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ખ</title><desc>2 frames; frame N shows movements 1 to N of ખ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ખ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ખ as two ordered pen-down runs. Its first SVG path begins at the upper left, descends through the left lobe, curls through the middle, and finishes beside the right spine. The animation lifts once and its second SVG path descends the full right spine before turning through its lower foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the left lobe, inner curl, and tall right spine, but its printed lobe is broader and the spine foot more angular than the animated school-hand form. This learner path preserves the source&apos;s joined-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the lobe, curl, spine, and terminals differently.</desc><rect x="0" y="0" width="342" height="331.09" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="200.09" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.09" viewBox="-64 -673 872 1163.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 161Q182 161 140 203Q115 228 104 260.5Q93 293 93 351L93 440Q93 467 90 479.5Q87 492 81 500Q71 514 49 516.5Q27 519 6 519L14 592L24 592Q68 592 96.5 582.5Q125 573 142 555Q159 538 166 513Q173 488 173 443L173 351Q173 311 179.5 289Q186 267 200 253Q222 233 262 233Q282 233 298.5 239Q315 245 327 258Q338 270 343.5 290Q349 310 349 351L349 481L429 471L429 362Q439 346 453.5 340Q468 334 486 334Q513 334 533 344.5Q553 355 571 374L571 603L651 592L651 152Q651 125 654.5 113Q658 101 664 92Q674 78 695.5 75.5Q717 73 738 73L730 0L720 0Q677 0 648.5 10Q620 20 603 37Q586 54 578.5 79Q571 104 571 148L571 285Q554 274 533.5 268Q513 262 486 262Q469 262 453 265.5Q437 269 423 278Q409 225 365.5 193Q322 161 261 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M45 555 L45 555" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M45 555 L90 550 L125 525 L135 480 L133 425 L133 360 L135 300 L155 245 L200 210 L255 195 L310 205 L350 240 L375 285 L388 335 L395 390 L420 330 L455 300 L495 298 L540 310 L585 340" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="585" cy="340" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="372" y="209.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="372" y="209.9">1. descend through the</tspan><tspan x="372" y="295.2">left lobe and curl</tspan><tspan x="372" y="380.5">right through the</tspan><tspan x="372" y="465.7">middle</tspan></text></svg><rect x="176" y="42" width="150" height="200.09" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="200.09" viewBox="-64 -673 872 1163.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 161Q182 161 140 203Q115 228 104 260.5Q93 293 93 351L93 440Q93 467 90 479.5Q87 492 81 500Q71 514 49 516.5Q27 519 6 519L14 592L24 592Q68 592 96.5 582.5Q125 573 142 555Q159 538 166 513Q173 488 173 443L173 351Q173 311 179.5 289Q186 267 200 253Q222 233 262 233Q282 233 298.5 239Q315 245 327 258Q338 270 343.5 290Q349 310 349 351L349 481L429 471L429 362Q439 346 453.5 340Q468 334 486 334Q513 334 533 344.5Q553 355 571 374L571 603L651 592L651 152Q651 125 654.5 113Q658 101 664 92Q674 78 695.5 75.5Q717 73 738 73L730 0L720 0Q677 0 648.5 10Q620 20 603 37Q586 54 578.5 79Q571 104 571 148L571 285Q554 274 533.5 268Q513 262 486 262Q469 262 453 265.5Q437 269 423 278Q409 225 365.5 193Q322 161 261 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M45 555 L90 550 L125 525 L135 480 L133 425 L133 360 L135 300 L155 245 L200 210 L255 195 L310 205 L350 240 L375 285 L388 335 L395 390 L420 330 L455 300 L495 298 L540 310 L585 340" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M610 560 L610 560" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M610 560 L610 500 L610 430 L610 350 L610 270 L610 190 L612 120 L630 75 L670 45 L710 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="710" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="372" y="209.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="372" y="209.9">2. lift, then descend</tspan><tspan x="372" y="295.2">the right spine and</tspan><tspan x="372" y="380.5">turn through its lower</tspan><tspan x="372" y="465.7">foot</tspan></text></svg><text x="16" y="255.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="267.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ખ animation, first and second SVG</text><text x="16" y="280.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="292.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="305.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
