<svg xmlns="http://www.w3.org/2000/svg" width="342" height="371.51" viewBox="0 0 342 371.51" role="img" aria-label="How to write し: one unbroken stroke · 2 movements"><title>Writing し</title><desc>2 frames; frame N shows movements 1 to N of し (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana し stroke order animation.gif, hiragana し, 23 frames, 2.3 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%97_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws し in one uninterrupted run: descend from the top, turn around the broad lower curve, and sweep upward to the right. The path is fitted to the bundled Noto Sans JP subset; handwritten curvature and finish height vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="342" height="371.51" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="240.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="240.51" viewBox="167 -850 801 1284.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M340 779Q336 754 334 728.5Q332 703 331 678Q329 636 327 574Q325 512 323 442.5Q321 373 320 304Q319 235 319 180Q319 125 340 92Q361 59 398 45Q435 31 483 31Q551 31 606 48.5Q661 66 704 95.5Q747 125 780.5 162Q814 199 841 238L898 170Q872 134 834.5 95.5Q797 57 746 24Q695 -9 628.5 -30Q562 -51 480 -51Q409 -51 354 -29Q299 -7 268 42Q237 91 237 172Q237 217 238 271.5Q239 326 241 384Q243 442 244 497.5Q245 553 246 600Q247 647 247 678Q247 706 245 732Q243 758 239 780L340 779Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M290 750 L290 750" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M290 750 L290 650 L290 500 L290 350 L290 180" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="290" cy="180" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="567.5" y="255.2" text-anchor="middle" font-size="64.2" fill="#6b7280"><tspan x="567.5" y="255.2">1. descend nearly</tspan><tspan x="567.5" y="333.5">straight from the top</tspan></text></svg><rect x="176" y="42" width="150" height="240.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="240.51" viewBox="167 -850 801 1284.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M340 779Q336 754 334 728.5Q332 703 331 678Q329 636 327 574Q325 512 323 442.5Q321 373 320 304Q319 235 319 180Q319 125 340 92Q361 59 398 45Q435 31 483 31Q551 31 606 48.5Q661 66 704 95.5Q747 125 780.5 162Q814 199 841 238L898 170Q872 134 834.5 95.5Q797 57 746 24Q695 -9 628.5 -30Q562 -51 480 -51Q409 -51 354 -29Q299 -7 268 42Q237 91 237 172Q237 217 238 271.5Q239 326 241 384Q243 442 244 497.5Q245 553 246 600Q247 647 247 678Q247 706 245 732Q243 758 239 780L340 779Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M290 750 L290 650 L290 500 L290 350 L290 180 L290 180" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M290 180 L300 110 L340 50 L410 5 L490 -10 L590 5 L690 55 L770 120 L850 190" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="850" cy="190" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="567.5" y="255.2" text-anchor="middle" font-size="64.2" fill="#6b7280"><tspan x="567.5" y="255.2">2. turn around the</tspan><tspan x="567.5" y="333.5">broad lower curve and</tspan><tspan x="567.5" y="411.8">sweep upward right</tspan></text></svg><text x="16" y="295.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana し stroke order</text><text x="16" y="308.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">animation.gif, hiragana し, 23 frames, 2.3 seconds</text><text x="16" y="320.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Wikimedia Commons, 1 October 2009)</text><text x="16" y="333.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="345.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
