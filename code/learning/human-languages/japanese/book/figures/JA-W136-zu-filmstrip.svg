<svg xmlns="http://www.w3.org/2000/svg" width="982" height="288.69" viewBox="0 0 982 288.69" role="img" aria-label="How to write ず: 4 strokes · 3 pen lifts · 6 movements"><title>Writing ず</title><desc>6 frames; frame N shows movements 1 to N of ず (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0305a.svg, hiragana ず (U+305A HIRAGANA LETTER ZU), four stroke paths kvg:0305a-s1 to s4 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0305a.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 to s2 are す&apos;s strokes, the same paths as in its file for す, kanji/03059.svg; s3 and s4 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In the print glyph the vertical and the loop&apos;s right side share one band of ink, so the path comes back down that band before the tail.</desc><rect x="0" y="0" width="982" height="288.69" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="195.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.19" viewBox="-3 -897 1006 1309.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M598 781Q598 776 596.5 763Q595 750 594.5 737Q594 724 593 718Q592 699 592 666Q592 633 592 594Q592 555 592.5 515Q593 475 593.5 439.5Q594 404 594 380L518 419Q518 433 518 461.5Q518 