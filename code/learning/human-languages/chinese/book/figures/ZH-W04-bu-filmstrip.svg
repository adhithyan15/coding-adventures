<svg xmlns="http://www.w3.org/2000/svg" width="662" height="301.82" viewBox="0 0 662 301.82" role="img" aria-label="How to write 不: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 不</title><desc>4 frames; frame N shows movements 1 to N of 不 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 不.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%8D.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 不: a top horizontal from left to right, a separately started long falling stroke from the upper centre down-left, a separately started central vertical, and a separately placed right-falling dot. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all four medians to Noto Sans SC while preserving their order, directions, and three intervening lifts; Noto&apos;s long falling stroke is smoother and its right dot is broader than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="662" height="301.82" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="195.82" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.82" viewBox="-26 -840 1056 1378.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M69 770L931 770L931 693L69 693L69 770ZM559 478L615 526Q659 497 708 463.5Q757 430 804 394Q851 358 891.5 324Q932 290 960 261L899 203Q872 232 832.5 267.5Q793 303 747 340Q701 