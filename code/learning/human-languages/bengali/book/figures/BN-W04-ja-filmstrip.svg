<svg xmlns="http://www.w3.org/2000/svg" width="822" height="289.36" viewBox="0 0 822 289.36" role="img" aria-label="How to write জ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing জ</title><desc>5 frames; frame N shows movements 1 to N of জ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 18 (জ, ja; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 189 of the 268 stored prototypes draw the body in two pen-down strokes. In 189 of those 189 the left part comes first: 184 start it at the top, 187 turn it clockwise and 177 end it on the left, at the tip of the left arm. 181 start the right part at the top and 169 end it at the bottom right, at the foot of the right leg. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 79 of the 268 draw none at all, 66 open with it, 60 end with it and 63 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 161 of the 165 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="289.36" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="183.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="183.36" viewBox="-80 -692 1022 1249.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M377 33Q254 33 167 134.5Q80 236 29 465L105 485Q146 296 207 202.5Q268 109 375 109Q437 109 476 141.5Q515 174 515 241Q515 269 509 293Q449 237 369 237Q306 237 270 271Q234 305 234 369Q234 424 265.5 471.5Q297 519 340 553Q320 552 294.5 551.5Q269 551 244 551L-10 551L-10 622L872 622L872 551L555 551Q537 551 520 551Q551 511 593.5 490Q636 469 696 469Q721 469 751 472L790 402Q766 357 756 313.5Q746 270 746 210Q746 158 754 112Q762 66 781 10L705 -7Q687 51 677.5 107Q668 163 668 227Q668 284 677.5 326Q687 368 700 397Q612 400 548 433.5Q484 467 441 539Q367 491 339 448.5Q311 406 311 371Q311 308 372 308Q400 308 431 323.5Q462 339 488 375L548 384Q570 347 580.5 310.5Q591 274 591 227Q591 176 568 131.5Q545 87 497.5 60Q450 33 377 33Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M370 569 L370 569" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M370 569 L361 525 L329 492 L301 457 L281 416 L274 372 L283 328 L313 294 L354 277 L400 277 L443 291 L481 316 L522 333" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="522" cy="333" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="431" y="228.9" text-anchor="middle" font-size="81.9" fill="#6b7280"><tspan x="431" y="228.9">1. start under the</tspan><tspan x="431" y="328.8">headline and curve down</tspan><tspan x="431" y="428.7">round the inner loop</tspan></text></svg><rect x="176" y="42" width="150" height="183.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="183.36" viewBox="-80 -692 1022 1249.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M377 33Q254 33 167 134.5Q80 236 29 465L105 485Q146 296 207 202.5Q268 109 375 109Q437 109 476 141.5Q515 174 515 241Q515 269 509 293Q449 237 369 237Q306 237 270 271Q234 305 234 369Q234 424 265.5 471.5Q297 519 340 553Q320 552 294.5 551.5Q269 551 244 551L-10 551L-10 622L872 622L872 551L555 551Q537 551 520 551Q551 511 593.5 490Q636 469 696 469Q721 469 751 472L790 402Q766 357 756 313.5Q746 270 746 210Q746 158 754 112Q762 66 781 10L705 -7Q687 51 677.5 107Q668 163 668 227Q668 284 677.5 326Q687 368 700 397Q612 400 548 433.5Q484 467 441 539Q367 491 339 448.5Q311 406 311 371Q311 308 372 308Q400 308 431 323.5Q462 339 488 375L548 384Q570 347 580.5 310.5Q591 274 591 227Q591 176 568 131.5Q545 87 497.5 60Q450 33 377 33Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M370 569 L361 525 L329 492 L301 457 L281 416 L274 372 L283 328 L313 294 L354 277 L400 277 L443 291 L481 316 L522 333 L522 333" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M522 333 L545 295 L552 250 L550 205 L539 162 L513 125 L479 96 L437 79 L392 73 L347 73 L303 82 L262 101" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="262" cy="101" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="431" y="228.9" text-anchor="middle" font-size="81.9" fill="#6b7280"><tspan x="431" y="228.9">2. come down the right</tspan><tspan x="431" y="328.8">side and round the</tspan><tspan x="431" y="428.7">bottom</tspan></text></svg><rect x="336" y="42" width="150" height="183.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="183.3