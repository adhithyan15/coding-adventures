<svg xmlns="http://www.w3.org/2000/svg" width="982" height="287.59" viewBox="0 0 982 287.59" role="img" aria-label="How to write ਲ: 4 strokes · 3 pen lifts · 6 movements"><title>Writing ਲ</title><desc>6 frames; frame N shows movements 1 to N of ਲ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਲ (lallaa) checkpoints, strokes 1–4 (lib/data/lessons/lesson_tracing.dart line 1040, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L1040&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਲ in four pen-down strokes: the headline from left to right; then from the top left down the left arm, through the dip and up the right arm to the headline; then the left bowl, from where the left arm meets the dip down to the bottom; then the right bowl, the same way on the right. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਲ, each by a different non-native copyist; only counts and shares are cited. 75% (15 of 20) draw it in four strokes, the source&apos;s count and their most common one. For the first stroke of the body, 85% (17 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="982" height="287.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="181.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="181.59" viewBox="-77 -692 828 1002.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M39 193Q39 256 76 308.5Q113 361 181 396Q157 432 140.5 471.5Q124 511 117 551L-7 551L-7 622L681 622L681 551L557 551Q543 469 495 397Q569 355 602 302Q635 249 635 194Q635 165 625 131.5Q615 98 592 68Q569 38 528.5 19Q488 0 426 0L420 0L415 73L426 73Q493 73 524 106.5Q555 140 555 191Q555 235 529.5 273.5Q504 312 450 340Q401 286 337 250Q274 285 223 341Q179 317 149 280.5Q119 244 119 195Q119 141 151 107Q183 73 254 73L259 73L254 0L248 0Q186 0 145.5 19Q105 38 81.5 67.5Q58 97 48.5 130.5Q39 164 39 193ZM475 551L199 551Q210 478 248 424.5Q286 371 337 335Q388 369 425.5 423.5Q463 478 475 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L55 586 L95 586 L135 586 L175 586 L215 586 L255 586 L295 586 L336 586 L376 586 L416 586 L456 586 L496 586 L536 586 L576 586 L616 586 L656 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="656" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="337" y="206