[package]
name = "mosaic-pkg-xaml-layout-variants-fixture"
version = "0.1.0"
description = "WinUI layout-variant (UI48 ENV2/ENV3) resize acceptance fixture"
license = "MIT OR Apache-2.0"

[components]
exports = ["LayoutProbe"]

[dependencies]

[kernel]
version = "1"

# No `[[app.layouts]]`: `LayoutProbe.compact.mll` is selected by the
# conventional rule (`compact` for `size-class = compact`), so the window's
# rules come from the same `effective_layout_rules` fallback every backend
# uses. CI's Windows lane builds this native-complete against the conformance
# runtime -- whose props carry `platform` and `status`, the two slots below --
# and `code/scripts/mosaic-xaml-layout-variants-smoke.ps1` resizes the window
# across 600 effective pixels, asserting which root is mounted and that the
# runtime's props reach each one.
