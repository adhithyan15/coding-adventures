<svg xmlns="http://www.w3.org/2000/svg" width="982" height="533.32" viewBox="0 0 982 533.32" role="img" aria-label="How to write 还: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 还</title><desc>7 frames; frame N shows movements 1 to N of 还 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 还.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%BF%98.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 还, in two pieces, the walking piece written last. Medians 1–4 draw 不 as 不 is written alone: a horizontal, a left-falling stroke, a vertical, then a dot. Medians 5–7 draw 辶 as 这 closes: a dot, a stroke that runs right, turns down, turns again and falls to the left without lifting, then the long flat right-falling stroke along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="533.32" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="213.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="213.91" viewBox="-46 -895 1090