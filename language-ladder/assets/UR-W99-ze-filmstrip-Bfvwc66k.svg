<svg xmlns="http://www.w3.org/2000/svg" width="502" height="451.98" viewBox="0 0 502 451.98" role="img" aria-label="How to write ز: 2 strokes · 1 pen lift · 3 movements"><title>Writing ز</title><desc>3 frames; frame N shows movements 1 to N of ز (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Ḳhe, ze, zāl, swād, and zwād, independent ز calligraphic and handwriting animations and Ze instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/khe-ze-zal-swad-and-zwad/&gt;. Source note on variation: Both independent-form animations write the re-series body first as one downward line curving left, then add the single dot above after one pen lift. The lesson identifies ze as a nonconnector that looks exactly like re with that dot, calls it the most common Urdu letter for z, and notes that its dot usually sits farther left when compact writing might resemble nūn plus re. This learner path fits the two-run order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="502" height="451.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="333.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="333.48" viewBox="-90 -606 495 1100.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204ZM203 398Q159 431 131 463Q157 489 174 507Q191 525 201 536Q217 519 233.5 502.5Q250 486 267 471Q256 455 239.5 436.5Q223 418 203 398Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L250 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="304" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">1. draw the independent</tspan><tspan x="157.5" y="432.1">ze downward</tspan></text></svg><rect x="176" y="42" width="150" height="333.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="333.48" viewBox="-90 -606 495 1100.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204ZM203 398Q159 431 131 463Q157 489 174 507Q191 525 201 536Q217 519 233.5 502.5Q250 486 267 471Q256 455 239.5 436.5Q223 418 203 398Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48 L304 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M304 48 L298 8 L284 -30 L260 -68 L226 -103 L185 -130 L140 -146 L95 -151 L52 -147 L10 -136" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="10" cy="-136" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">2. continue curving to</tspan><tspan x="157.5" y="432.1">the left without</tspan><tspan x="157.5" y="480.6">lifting</tspan></text></svg><rect x="336" y="42" width="150" height="333.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="333.48" viewBox="-90 -606 495 1100.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204ZM203 398Q159 431 131 463Q157 489 174 507Q191 525 201 536Q217 519 233.5 502.5Q250 486 267 471Q256 455 239.5 436.5Q223 418 203 398Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48 L298 8 L284 -30 L260 -68 L226 -103 L185 -130 L140 -146 L95 -151 L52 -147 L10 -136" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 405 L200 405" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M200 405 L140 465 L200 525 L260 465 L200 405" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="200" cy="405" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">3. after one lift,</tspan><tspan x="157.5" y="432.1">place the dot above</tspan></text></svg><text x="16" y="388.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Ḳhe, ze, zāl, swād, and zwād, independent ز calligraphic</text><text x="16" y="400.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and handwriting animations and Ze instructions (Northwestern University Libraries Open</text><text x="16" y="413.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2026)</text><text x="16" y="425.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
