<svg xmlns="http://www.w3.org/2000/svg" width="342" height="350.82" viewBox="0 0 342 350.82" role="img" aria-label="How to write 入: 2 strokes · 1 pen lift · 2 movements"><title>Writing 入</title><desc>2 frames; frame N shows movements 1 to N of 入 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 入.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%85%A5.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 入. Median 1 draws a short left-falling stroke from the middle down to the lower left; median 2 a long right-falling stroke that starts higher, above the top of the first, and sweeps down to the lower right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those two ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and one intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="342" height="350.82" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="201.07" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="201.07" viewBox="-29 -889 1063 1424.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M295 755L341 819Q410 770 459.5 713Q509 656 546.5 594.5Q584 533 615.5 469.5Q647 406 679.5 343Q712 280 750.5 221Q789 162 840.5 109.5Q892 57 964 15Q958 4 950 -11.5Q942 -27 935.5 -42.5Q929 -58 927 -70Q853 -29 799 25Q745 79 704 141.5Q663 204 628.5 270.5Q594 337 561.5 404Q529 471 492 534.5Q455 598 407.5 654.5Q360 711 295 755ZM459 607L543 591Q507 434 449.5 308.5Q392 183 308 88Q224 -7 110 -73Q103 -65 90.5 -54Q78 -43 64.5 -31.5Q51 -20 41 -13Q213 76 312.5 231.5Q412 387 459 607Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M470 677 L470 677" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M470 677 L470 462 L391 308 L255 102 L90 -38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="90" cy="-38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="298.2" text-anchor="middle" font-size="85.2" fill="#6b7280"><tspan x="502.5" y="298.2">1. draw the short</tspan><tspan x="502.5" y="402.1">left-falling stroke</tspan></text></svg><rect x="176" y="60.75" width="150" height="201.07" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="201.07" viewBox="-29 -889 1063 1424.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M295 755L341 819Q410 770 459.5 713Q509 656 546.5 594.5Q584 533 615.5 469.5Q647 406 679.5 343Q712 280 750.5 221Q789 162 840.5 109.5Q892 57 964 15Q958 4 950 -11.5Q942 -27 935.5 -42.5Q929 -58 927 -70Q853 -29 799 25Q745 79 704 141.5Q663 204 628.5 270.5Q594 337 561.5 404Q529 471 492 534.5Q455 598 407.5 654.5Q360 711 295 755ZM459 607L543 591Q507 434 449.5 308.5Q392 183 308 88Q224 -7 110 -73Q103 -65 90.5 -54Q78 -43 64.5 -31.5Q51 -20 41 -13Q213 76 312.5 231.5Q412 387 459 607Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M470 677 L470 462 L391 308 L255 102 L90 -38" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M324 768 L324 768" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M324 768 L388 740 L460 646 L504 546 L589 426 L647 293 L739 132 L840 30 L932 -17" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="932" cy="-17" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502.5" y="298.2" text-anchor="middle" font-size="85.2" fill="#6b7280"><tspan x="502.5" y="298.2">2. lift, then draw the</tspan><tspan x="502.5" y="402.1">long right-falling</tspan><tspan x="502.5" y="506.1">stroke</tspan></text></svg><text x="16" y="274.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 入.json, ordered stroke</text><text x="16" y="287.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="299.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="312.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="324.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
