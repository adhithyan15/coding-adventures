<svg xmlns="http://www.w3.org/2000/svg" width="822" height="242.07" viewBox="0 0 822 242.07" role="img" aria-label="How to write ങ: one unbroken stroke · 5 movements"><title>Writing ങ</title><desc>5 frames; frame N shows movements 1 to N of ങ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxv: movements 1-5 for ങ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-035.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxv) circles the small inner loop (1), arches over to the stem (2), runs down the stem (3), draws the upper right bowl (4) and rounds the lower bowl to finish at the bottom (5). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 106 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (72 of 106) and end at the lower right (77 of 106). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its NGA.png at the middle left and ends it at the lower right. Moag does not number the pen&apos;s return to the top of the stem between movements 3 and 4; the recorded single runs suggest the pen retraces the stem. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing; the climb back up the stem retraces the ink just drawn, and the turn at the middle tip retraces the band the two bowls share.</desc><rect x="0" y="0" width="822" height="242.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="136.07" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="136.07" viewBox="-28 -636 1124 1019.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M358 566Q442 566 493 538.5Q544 511 583 460L595 386L608 229L608 0L522 0L522 306Q522 365 511.5 400Q501 435 478 456Q457 475 429.5 484.5Q402 494 357 494Q285 494 232.5 460.5Q180 427 151.5 369.5Q123 312 123 239L123 228Q123 172 138 134Q153 96 179.5 77Q206 58 242 58Q267 58 286 69.5Q305 81 316 103Q327 125 327 157Q327 207 301 232.5Q275 258 233 258Q194 258 159 238Q124 218 95 186L80 248Q109 284 154 306Q199 328 248 328Q296 328 332.5 309Q369 290 389.5 253.5Q410 217 410 165Q410 110 389 70Q368 30 330 9Q292 -12 240 -12Q188 -12 142.5 14Q97 40 69.5 96Q42 152 42 241Q42 347 84.5 419Q127 491 198.5 528.5Q270 566 358 566ZM803 566Q872 566 919 545.5Q966 525 990.5 490Q1015 455 1015 411Q1015 379 1004.5 353.5Q994 328 971.5 308.5Q949 289 913 274L909 280Q967 264 996.5 227Q1026 190 1026 140Q1026 70 978.5 29.5Q931 -11 847 -11Q816 -11 792.5 -7.5Q769 -4 749 0L767 69Q787 65 802.5 62Q818 59 837 59Q887 59 913 78.5Q939 98 939 144Q939 163 932 180Q925 197 909 210Q893 224 868.5 232Q844 240 791 240L766 240L766 310L791 310Q829 310 858 317Q887 324 904 341Q916 352 922 367.5Q928 383 928 403Q928 448 894 471Q860 494 803 494Q755 494 719.5 479.5Q684 465 661 440Q645 423 633 399.5Q621 376 614.5 339Q608 302 608 243L608 80L532 80L532 243L564 438Q583 475 617 504Q651 533 698.5 549.5Q746 566 803 566Z" fill="