<svg xmlns="http://www.w3.org/2000/svg" width="662" height="316.23" viewBox="0 0 662 316.23" role="img" aria-label="How to write ൻ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ൻ</title><desc>4 frames; frame N shows movements 1 to N of ൻ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Sriveenkat, Ml ൻ order.gif, Malayalam chillu N stroke-order animation, 00:03.0–00:09.5 (Wikimedia Commons, 2 July 2023) &lt;https://commons.wikimedia.org/wiki/File:Ml_%E0%B5%BB_order.gif&gt;. Source note on variation: The 67-frame Gayathri-font animation completes the left arch and central stem in one run, then lifts once before carrying the upper shoulder through the right outer loop, inner return, and finishing hook above the line as a second joined run. This is one attested pedagogical order fitted to the bundled Noto Sans Malayalam outline.</desc><rect x="0" y="0" width="662" height="316.23" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="210.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="210.23" viewBox="-31 -862 1124 1575.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M288 566Q332 566 366 554Q400 542 426 518Q452 494 472 457L498 227L498 0L412 0L412 282Q412 347 408 380.5Q404 414 390 436Q373 465 347 479.5Q321 494 284 494Q238 494 202.5 467.5Q167 441 147 395.5Q127 350 127 292Q127 232 143.5 187Q160 142 187 110Q214 78 247 55L189 -8Q146 27 112 68.5Q78 110 58.5 164.5Q39 219 39 292Q39 373 69.5 434.5Q100 496 156 531Q212 566 288 566ZM822 -12Q758 -12 713.5 14.5Q669 41 646 92.5Q623 144 623 217Q623 275 641.5 324.5Q660 374 692.5 418Q725 462 767 501L796 532Q825 558 845.5 587Q866 616 866 651Q866 678