[package]
name = "tls13-rsa-pss-certificate-verify"
version = "0.1.0"
edition = "2021"
description = "Bound TLS 1.3 RSA-PSS CertificateVerify hashing and verification"

[dependencies]
coding_adventures_sha256 = { path = "../sha256" }
coding_adventures_sha384 = { path = "../sha384" }
coding_adventures_sha512 = { path = "../sha512" }
tls13-certificate-verify-input = { path = "../tls13-certificate-verify-input" }
tls13-certificate-verify-message = { path = "../tls13-certificate-verify-message" }
tls13-rsa-pss-signature-routing = { path = "../tls13-rsa-pss-signature-routing" }
tls13-signature-scheme-policy = { path = "../tls13-signature-scheme-policy" }
x509-rsa-public-key = { path = "../x509-rsa-public-key" }

[dev-dependencies]
der-asn1 = { path = "../der-asn1" }
rsa-pss-sha256-signature = { path = "../rsa-pss-sha256-signature" }
rsa-pss-sha384-signature = { path = "../rsa-pss-sha384-signature" }
rsa-pss-sha512-signature = { path = "../rsa-pss-sha512-signature" }
x509-subject-public-key-info = { path = "../x509-subject-public-key-info" }
