<svg xmlns="http://www.w3.org/2000/svg" width="502" height="298.47" viewBox="0 0 502 298.47" role="img" aria-label="How to write 千: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 千</title><desc>3 frames; frame N shows movements 1 to N of 千 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 千.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8D%83.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 千. Median 1 draws a short left-falling stroke across the top; medians 2–3 draw 十 under it as 十 is written alone: the horizontal, then the vertical through it. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="298.47" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="192.47" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="192.47" viewBox="-18 -897 1037 1330.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M52 445L949 445L949 372L52 372L52 445ZM458 705L537 705L537 -80L458 -