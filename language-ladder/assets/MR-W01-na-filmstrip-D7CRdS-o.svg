<svg xmlns="http://www.w3.org/2000/svg" width="502" height="327.57" viewBox="0 0 502 327.57" role="img" aria-label="How to write न: 3 strokes · 2 pen lifts · 3 movements"><title>Writing न</title><desc>3 frames; frame N shows movements 1 to N of न (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-न-order.gif’, strokes 1–3, Wikimedia Commons, 11 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A8-order.gif&gt;. Source note on variation: The 20-frame animation shows three ordered pen-down runs: frames 2–9 start at the loop&apos;s inner-right curve, sweep down and clockwise around the small opening, then continue right along the shoulder without lifting; frames 10–14 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 15–18 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 9 and 14 mark the first two run endings before the one-second completed frame. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VI, p. 34, independently shows the same clockwise loop-and-shoulder, right stem, and headline buildup and directions. This learner path follows that sourced three-run form and fits its loop to Noto Sans Devanagari; everyday handwriting may join or simplify the loop differently.</desc><rect x="0" y="0" width="502" height="327.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="221.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.57" viewBox="-70 -692 709 1047.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L569 622L569 551L466 551L466 0L385 0L385 298L204 298L204 244Q204 216 190 202Q176 188 153 188Q135 188 114.5 200Q94 212 76.5 232Q59 252 48 274.5Q37 297 37 318Q37 341 50.5 355Q64 369 98 369L385 369L385 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M185 255 L185 255" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M185 255 L178 225 L158 205 L130 202 L100 215 L72 242 L52 275 L48 310 L58 338 L82 350 L115 350 L155 335 L205 335 L260 335 L320 335 L380 335" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="380" cy="335" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="284.5" y="196.8" text-anchor="middle" font-size="56.8" fill="#6b7280"><tspan x="284.5" y="196.8">1. circle clockwise</tspan><tspan x="284.5" y="266.1">around the left loop and</tspan><tspan x="284.5" y="335.4">sweep right</tspan></text></svg><rect x="176" y="42" width="150" height="221.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.57" viewBox="-70 -692 709 1047.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L569 622L569 551L466 551L466 0L385 0L385 298L204 298L204 244Q204 216 190 202Q176 188 153 188Q135 188 114.5 200Q94 212 76.5 232Q59 252 48 274.5Q37 297 37 318Q37 341 50.5 355Q64 369 98 369L385 369L385 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M185 255 L178 225 L158 205 L130 202 L100 215 L72 242 L52 275 L48 310 L58 338 L82 350 L115 350 L155 335 L205 335 L260 335 L320 335 L380 335" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M425 551 L425 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M425 551 L425 475 L425 395 L425 315 L425 235 L425 155 L425 75 L425 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="425" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="284.5" y="196.8" text-anchor="middle" font-size="56.8" fill="#6b7280"><tspan x="284.5" y="196.8">2. lift, then descend</tspan><tspan x="284.5" y="266.1">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="221.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="221.57" viewBox="-70 -692 709 1047.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L569 622L569 551L466 551L466 0L385 0L385 298L204 298L204 244Q204 216 190 202Q176 188 153 188Q135 188 114.5 200Q94 212 76.5 232Q59 252 48 274.5Q37 297 37 318Q37 341 50.5 355Q64 369 98 369L385 369L385 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M185 255 L178 225 L158 205 L130 202 L100 215 L72 242 L52 275 L48 310 L58 338 L82 350 L115 350 L155 335 L205 335 L260 335 L320 335 L380 335" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M425 551 L425 475 L425 395 L425 315 L425 235 L425 155 L425 75 L425 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L80 585 L155 585 L230 585 L305 585 L380 585 L455 585 L565 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="565" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="284.5" y="196.8" text-anchor="middle" font-size="56.8" fill="#6b7280"><tspan x="284.5" y="196.8">3. lift, then draw the</tspan><tspan x="284.5" y="266.1">shirorekha left-to-right</tspan></text></svg><text x="16" y="276.57" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-न-order.gif’, strokes 1–3, Wikimedia Commons, 11 May</text><text x="16" y="289.07" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="301.57" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
