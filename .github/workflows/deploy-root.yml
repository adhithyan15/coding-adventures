# ================================================================
# Build and deploy the Forme repository landing page
# ================================================================
#
# The seven-stage site pipeline emits dist/index.html plus fingerprinted
# assets. Pull requests exercise the exact clean-checkout build; main pushes
# publish the verified artifact to the root of gh-pages while preserving all
# sub-app directories.

name: Deploy Root Landing Page

on:
  pull_request:
    paths:
      - "code/sites/landing-page/**"
      - "code/packages/typescript/document-ast/**"
      - "code/packages/typescript/forme-aot-css-slicer/**"
      - "code/packages/typescript/forme-cache/**"
      - "code/packages/typescript/forme-cli/**"
      - "code/packages/typescript/forme-deploy-runner-core/**"
      - "code/packages/typescript/forme-deploy-runner-fs-adapter/**"
      - "code/packages/typescript/forme-deploy-runner-github-pages-adapter/**"
      - "code/packages/typescript/forme-capability/**"
      - "code/packages/typescript/forme-emit-site-fs/**"
      - "code/packages/typescript/forme-errors/**"
      - "code/packages/typescript/forme-identity/**"
      - "code/packages/typescript/forme-load-assets-fs/**"
      - "code/packages/typescript/forme-orchestrator/**"
      - "code/packages/typescript/forme-pipeline-config/**"
      - "code/packages/typescript/forme-resolve-asset-refs-fs/**"
      - "code/packages/typescript/forme-router/**"
      - "code/packages/typescript/forme-source-fs/**"
      - "code/packages/typescript/forme-stage/**"
      - "code/packages/typescript/forme-style-ir/**"
      - "code/packages/typescript/forme-style-to-css/**"
      - "code/packages/typescript/forme-types/**"
      - "code/packages/typescript/blake2b/**"
      - ".github/workflows/deploy-root.yml"
  push:
    branches: [main]
    paths:
      - "code/sites/landing-page/**"
      - "code/packages/typescript/document-ast/**"
      - "code/packages/typescript/forme-aot-css-slicer/**"
      - "code/packages/typescript/forme-cache/**"
      - "code/packages/typescript/forme-cli/**"
      - "code/packages/typescript/forme-deploy-runner-core/**"
      - "code/packages/typescript/forme-deploy-runner-fs-adapter/**"
      - "code/packages/typescript/forme-deploy-runner-github-pages-adapter/**"
      - "code/packages/typescript/forme-capability/**"
      - "code/packages/typescript/forme-emit-site-fs/**"
      - "code/packages/typescript/forme-errors/**"
      - "code/packages/typescript/forme-identity/**"
      - "code/packages/typescript/forme-load-assets-fs/**"
      - "code/packages/typescript/forme-orchestrator/**"
      - "code/packages/typescript/forme-pipeline-config/**"
      - "code/packages/typescript/forme-resolve-asset-refs-fs/**"
      - "code/packages/typescript/forme-router/**"
      - "code/packages/typescript/forme-source-fs/**"
      - "code/packages/typescript/forme-stage/**"
      - "code/packages/typescript/forme-style-ir/**"
      - "code/packages/typescript/forme-style-to-css/**"
      - "code/packages/typescript/forme-types/**"
      - "code/packages/typescript/blake2b/**"
      - ".github/workflows/deploy-root.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forme-pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/sites/landing-page/package-lock.json

      - name: Test clean-checkout Forme build
        working-directory: code/sites/landing-page
        run: npm run build:clean

      - name: Verify generated root artifact
        run: |
          test -s code/sites/landing-page/dist/index.html
          test -n "$(find code/sites/landing-page/dist/assets -type f -name 'og.*.jpg' -print -quit)"
          grep -q '<meta name="generator" content="Forme">' code/sites/landing-page/dist/index.html
          ! grep -R "forme-asset:" code/sites/landing-page/dist
          ! grep -q "<script" code/sites/landing-page/dist/index.html

      - name: Prove write-free target plan
        working-directory: code/sites/landing-page
        run: npm run deploy:dry-run

      - name: Prove filesystem rollback contract
        working-directory: code/packages/typescript/forme-deploy-runner-fs-adapter
        run: npm test

      - name: Checksum exact deploy input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: code/sites/landing-page/.forme/deploy-input
        run: find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256

      - name: Upload exact deploy input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forme-landing-deploy-input
          path: code/sites/landing-page/.forme/deploy-input
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Bootstrap reviewed local dependency graph
        working-directory: code/sites/landing-page
        run: npm run bootstrap

      - name: Download exact deploy input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: forme-landing-deploy-input
          path: code/sites/landing-page/.forme/deploy-input

      - name: Verify deploy input checksum
        working-directory: code/sites/landing-page/.forme/deploy-input
        run: sha256sum -c CHECKSUMS.sha256

      - name: Publish through Forme
        working-directory: code/sites/landing-page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy

      - name: Assert bounded live availability
        run: |
          curl --fail --location --retry 6 --retry-delay 10 --max-time 20 https://adhithyan15.github.io/coding-adventures/ -o /tmp/forme-landing.html
          grep -q '<meta name="generator" content="Forme">' /tmp/forme-landing.html
