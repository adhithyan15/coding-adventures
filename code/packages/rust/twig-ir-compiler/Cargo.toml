[package]
name = "twig-ir-compiler"
version = "0.36.0"
edition = "2021"
description = "TW00 — Twig (Lisp-precursor) → InterpreterIR (IIR) compiler.  v0.36.0 (LANG-FULL E4): bare `str` / `string` top-level function parameter annotations seed concrete `str` IIR params, so parameter-derived E4 string ops like `(define (strlen (s : str)) (string-length s)) (strlen \"HELLO\")` run without dynamic string builtins.  v0.35.0 (LANG-FULL E4): direct top-level function calls inherit statically-known return types.  v0.34.0 (LANG-FULL E4): known `string<?` / `string>?` expressions lower through typed `str_cmp`.  v0.33.0 (LANG-FULL E4): `substring` can feed `string-ref` through `str_slice` + `str_index`.  v0.32.0 (LANG-FULL E4): `string-length` can compute typed `string-ref` indexes.  v0.31.0 (LANG-FULL E4): lexical string locals prove `string-append` / `str_concat` feeding `string-ref` / `str_index`.  Earlier E4 slices cover literal, named, and lexical string length/equality/concat/index proofs; TW2 covers typed top-level value defines; TW1 covers typed variadic arithmetic.  LANG52: let*, and/or special forms.  LANG55: HOF builtins.  LANG56: IIRExport from module_info.  LANG57: match jmpif bug fix + string/symbol conversion builtins.  LANG58: string/char builtins for TW05-E.  LANG72: compile_program_with_externs_and_globals for cross-module strict type checking.  Path A increment 6a/6b/6c: typed nil/cons/car/cdr list primitives."

[dependencies]
twig-parser        = { path = "../twig-parser" }
twig-lexer         = { path = "../twig-lexer" }
interpreter-ir     = { path = "../interpreter-ir" }
# LANG23 PR 23-E: convert parsed TypeAnnotation → RefinedType for IIR annotation fields.
lang-refined-types = { path = "../lang-refined-types" }
# LANG49 TW05-B: optional type-check pre-pass for (typed lenient|strict) modules.
twig-type-checker  = { path = "../twig-type-checker" }
# LANG50: AnnotatedNode type for post-processing type_hint fields.
type-declarations  = { path = "../type-declarations" }

[dev-dependencies]
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/backend_encode.rs serialises WasmModule -> bytes.
wasm-module-encoder   = { path = "../wasm-module-encoder" }
