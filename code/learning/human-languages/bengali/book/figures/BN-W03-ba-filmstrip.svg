<svg xmlns="http://www.w3.org/2000/svg" width="662" height="331.32" viewBox="0 0 662 331.32" role="img" aria-label="How to write ব: one unbroken stroke · 4 movements"><title>Writing ব</title><desc>4 frames; frame N shows movements 1 to N of ব (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 33 (ব, ba; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 433 of the 477 stored prototypes of ba are one pen-down stroke. 258 of those 433 open with the headline, drawn left to right; most of the rest (86) draw no headline run at all. 308 start at the upper left, 350 finish by climbing the stem, and 393 end at the top right. The path keeps that order: the headline left to right, the turn into the stem and down the diagonal to the pointed left tip, the lower curve to the stem&apos;s foot, and the climb back up the stem. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="331.32" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="225.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="225.32" viewBox="-80 -692 756 1135.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M424 0Q394 58 341.5 107.5Q289 157 221 192Q153 227 76 239L37 335Q128 390 224.5 437Q321 484 424 517L424 551L-10 551L-10 622L606 622L606 551L501 551L501 0L424 0ZM424 189L424 439Q352 414 274.5 377.5Q197 341 130 300Q181 289 238.5 263Q296 237 346 197.5Q396 158 427 108Q426 125 425 144.5Q424 164 424 189Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M0 586 L0 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M0 586 L150 586 L300 586 L450 586 L590 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="590" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.6" text-anchor="middle" font-size="60.6" fill="#6b7280"><tspan x="298" y="200.6">1. draw the headline</tspan><tspan x="298" y="274.5">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="225.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="225.32" viewBox="-80 -692 756 1135.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M424 0Q394 58 341.5 107.5Q289 157 221 192Q153 227 76 239L37 335Q128 390 224.5 437Q321 484 424 517L424 551L-10 551L-10 622L606 622L606 551L501 551L501 0L424 0ZM424 189L424 439Q352 414 274.5 377.5Q197 341 130 300Q181 289 238.5 263Q296 237 346 197.5Q396 158 427 108Q426 125 425 144.5Q424 164 424 189Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M0 586 L150 586 L300 586 L450 586 L590 586 L590 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M590 586 L501 562 L462 505 L400 465 L300 420 L200 370 L95 315 L95 315" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="315" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.6" text-anchor="middle" font-size="60.6" fill="#6b7280"><tspan x="298" y="200.6">2. turn into the stem</tspan><tspan x="298" y="274.5">and run down the</tspan><tspan x="298" y="348.5">diagonal to the pointed</tspan><tspan x="298" y="422.4">left tip</tspan></text></svg><rect x="336" y="42" width="150" height="225.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="225.32" viewBox="-80 -692 756 1135.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M424 0Q394 58 341.5 107.5Q289 157 221 192Q153 227 76 239L37 335Q128 390 224.5 437Q321 484 424 517L424 551L-10 551L-10 622L606 622L606 551L501 551L501 0L424 0ZM424 189L424 439Q352 414 274.5 377.5Q197 341 130 300Q181 289 238.5 263Q296 237 346 197.5Q396 158 427 108Q426 125 425 144.5Q424 164 424 189Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M0 586 L150 586 L300 586 L450 586 L590 586 L501 562 L462 505 L400 465 L300 420 L200 370 L95 315 L95 315" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M95 315 L110 270 L200 250 L290 210 L370 150 L425 80 L462 15" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="462" cy="15" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.6" text-anchor="middle" font-size="60.6" fill="#6b7280"><tspan x="298" y="200.6">3. round the lower</tspan><tspan x="298" y="274.5">curve to the foot of</tspan><tspan x="298" y="348.5">the stem</tspan></text></svg><rect x="496" y="42" width="150" height="225.32" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="225.32" viewBox="-80 -692 756 1135.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M424 0Q394 58 341.5 107.5Q289 157 221 192Q153 227 76 239L37 335Q128 390 224.5 437Q321 484 424 517L424 551L-10 551L-10 622L606 622L606 551L501 551L501 0L424 0ZM424 189L424 439Q352 414 274.5 377.5Q197 341 130 300Q181 289 238.5 263Q296 237 346 197.5Q396 158 427 108Q426 125 425 144.5Q424 164 424 189Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M0 586 L150 586 L300 586 L450 586 L590 586 L501 562 L462 505 L400 465 L300 420 L200 370 L95 315 L110 270 L200 250 L290 210 L370 150 L425 80 L462 15 L462 15" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M462 15 L462 150 L462 300 L462 450 L462 600" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="462" cy="600" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.6" text-anchor="middle" font-size="60.6" fill="#6b7280"><tspan x="298" y="200.6">4. climb the stem to</tspan><tspan x="298" y="274.5">the headline</tspan></text></svg><text x="16" y="280.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 33 (ব, ba;</text><text x="16" y="292.82" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="305.32" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
