<svg xmlns="http://www.w3.org/2000/svg" width="982" height="249.08" viewBox="0 0 982 249.08" role="img" aria-label="How to write आ: 5 strokes · 4 pen lifts · 6 movements"><title>Writing आ</title><desc>6 frames; frame N shows movements 1 to N of आ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari आ stroke order.svg’, frames 1–5, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%86_stroke_order.svg&gt;. Source note on variation: The five buildup frames show five ordered pen-down runs: frame 1 starts at the upper-left and carries the upper curve into the lower bowl without lifting; frame 2 restarts at the middle junction and sweeps right through the shoulder; frame 3 descends the inner stem top-to-bottom; frame 4 descends the trailing stem top-to-bottom; frame 5 draws the shirorekhā left-to-right, for four intervening lifts. Thomas Egenes, Learning the Sanskrit Alphabet, p. 12 (Maharishi International University Press, 1990), documents the shared base अ itself as a six-stroke traditional Sanskrit form, so the joined modern body is not universal. This learner path follows the five-run modern form and fits its joins and directions to Noto Sans Devanagari.</desc><rect x="0" y="0" width="982" height="249.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="155.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="155.58" viewBox="-41 -702 1148 1190.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M675 551L675 0L594 0L594 551L521 551L521 622L779 622L779 551L675 551ZM299 632Q356 632 391.5 612Q427 592 443 559.5Q459 527 459 488