[package]
name = "algol-iir-compiler"
version = "0.22.0"
edition = "2021"
description = "ALGOL 60 scalar frontend for the LANG VM Rust chain, lowering parsed ALGOL into interpreter_ir::IIRModule. v0.22.0 (boolean fix): emit_not_value uses ScalarType::Boolean+Operand::Bool(false) so WASM assigns the false_const slot type bool (i32), matching the boolean variable's i32 local; v0.21.0 (AL13-real-proc): real procedure unit test; v0.20.0 (AL8-arctan): arctan(E) lowers to the f64_atan IIR op on all 7 backends; v0.19.0 (AL8-trig): sin/cos/ln/exp IIR ops."

[dependencies]
coding-adventures-algol-parser = { path = "../algol-parser" }
interpreter-ir = { path = "../interpreter-ir" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
vm-core = { path = "../vm-core" }

[dev-dependencies]
aot-core = { path = "../aot-core" }
iir-to-beam = { path = "../iir-to-beam" }
iir-to-cil-bytecode = { path = "../iir-to-cil-bytecode" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-llvm = { path = "../iir-to-llvm" }
iir-to-wasm = { path = "../iir-to-wasm" }
jit-core = { path = "../jit-core" }
