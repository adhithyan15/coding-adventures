<svg xmlns="http://www.w3.org/2000/svg" width="982" height="589.62" viewBox="0 0 982 589.62" role="img" aria-label="How to write ధ: 2 strokes · 1 pen lift · 7 movements"><title>Writing ధ</title><desc>7 frames; frame N shows movements 1 to N of ధ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ధ packaged tracing guides res/drawable/dot_stroke_c_4_4_dha.png and res/drawable/line_stroke_c_4_4_dha.png, movements 1–6 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged guide numbers six movements: four curves form the broad body, followed by the top flourish and lower stem. The c_4_4 filename, its position after c_4_3 ద, and the pictured glyph agree that this guide teaches ధ. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the breaks keep the guide&apos;s order and fall only between the body and its detached parts. The centre lines are fitted to the bundled Noto Sans Telugu outline, which joins the flourish to the body.</desc><rect x="0" y="0" width="982" height="589.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 7 movements</text><rect x="16" y="42" width="150" height="235.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="235.81" viewBox="-35 -795 776 1219.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-