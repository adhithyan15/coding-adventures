<svg xmlns="http://www.w3.org/2000/svg" width="822" height="290.56" viewBox="0 0 822 290.56" role="img" aria-label="How to write ড: 2 strokes · 1 pen lift · 5 movements"><title>Writing ড</title><desc>5 frames; frame N shows movements 1 to N of ড (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 23 (ড, ḍa; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 246 of the 280 stored prototypes draw the body in one pen-down stroke. 206 of those 246 start at the top, at the stem under the headline, 245 turn clockwise (down the stem, up to the point, down the right side and round the bottom) and 243 end on the left arm. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 94 of the 280 draw none at all, 103 open with it, 73 end with it and 10 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 176 of the 176 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="290.56" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="184.56" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.56" viewBox="-80 -692 872 1072.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M417 24Q329 24 257 66Q185 108 128.5 204.5Q72 301 30 465L105 485Q141 346 184.5 261.5Q228 177 284.5 138.5Q341 100 415 100Q496 100 538 140Q580 180 580 243Q580 275 573.5 300Q567 325 557 344Q519 292 475.5 267Q432 242 390 242Q331 242 305 281Q279 320 279 393L279 551L-10 551L-10 622L722 622L722 551L356 551L356 372Q356 316 393 316Q422 316 454 343.5Q486 371 529 433L589 442Q620 399 638 347Q656 295 656 245Q656 182 628.5 132Q601 82 547.5 53Q494 24 417 24Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M318 572 L318 572" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M318 572 L318 530 L318 489 L318 447 L318 406 L318 364" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="318" cy="364" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="356" y="185.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="356" y="185.9">1. start under the</tspan><tspan x="356" y="271.2">headline and come down</tspan><tspan x="356" y="356.5">the stem</tspan></text></svg><rect x="176" y="42" width="150" height="184.56" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="184.56" viewBox="-80 -692 872 1072.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M417 24Q329 24 257 66Q185 108 128.5 204.5Q72 301 30 465L105 485Q141 346 184.5 261.5Q228 177 284.5 138.5Q341 100 415 100Q496 100 538 140Q580 180 580 243Q580 275 573.5 300Q567 325 557 344Q519 292 475.5 267Q432 242 390 242Q331 242 305 281Q279 320 279 393L279 551L-10 551L-10 622L722 622L722 551L356 551L356 372Q356 316 393 316Q422 316 454 343.5Q486 371 529 433L589 442Q620 399 638 347Q656 295 656 245Q656 182 628.5 132Q601 82 547.5 53Q494 24 417 24Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M318 572 L318 530 L318 489 L318 447 L318 406 L318 364" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M318 364 L318 364 L334 321 L368 288 L414 282 L457 300 L493 331 L526 364 L566 388" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="566" cy="388" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="356" y="185.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="356" y="185.9">2. turn right and up to</tspan><tspan x="356" y="271.2">the point</tspan></text></svg><rect x="336" y="42" width="150" height="184.56" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="184.56" viewBox="-80 -692 872 1072.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M417 24Q329 24 257 66Q185 108 128.5 204.5Q72 301 30 465L105 485Q141 346 184.5 261.5Q228 177 284.5 138.5Q341 100 415 100Q496 100 538 140Q580 180 580 243Q580 275 573.5 300Q567 325 557 344Q519 292 475.5 267Q432 242 390 242Q331 242 305 281Q279 320 279 393L279 551L-10 551L-10 622L722 622L722 551L356 551L356 372Q356 316 393 316Q422 316 454 343.5Q486 371 529 433L589 442Q620 399 638 347Q656 295 656 245Q656 182 628.5 132Q601 82 547.5 53Q494 24 417 24Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M318 572 L318 530 L318 489 L318 447 L318 406 L318 364 L334 321 L368 288 L414 282 L457 300 L493 331 L526 364 L566 388 L566 388" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M566 388 L593 354 L609 313 L616 270 L617 227 L609 184 L590 145 L560 114 L525 87 L485 70 L442 64 L398 64 L355 68 L313 81 L274 100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="274" cy="100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="356" y="185.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="356" y="185.9">3. come down the right</tspan><tspan x="356" y="271.2">side and round the</tspan><tspan x="356" y="356.5">bottom</tspan></text></svg><rect x="496" y="42" width="150" height="184.56" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="184.56" viewBox="-80 -692 872 1072.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M417 24Q329 24 257 66Q185 108 128.5 204.5Q72 301 30 465L105 485Q141 346 184.5 261.5Q228 177 284.5 138.5Q341 100 415 100Q496 100 538 140Q580 180 580 243Q580 275 573.5 300Q567 325 557 344Q519 292 475.5 267Q432 242 390 242Q331 242 305 281Q279 320 279 393L279 551L-10 551L-10 622L722 622L722 551L356 551L356 372Q356 316 393 316Q422 316 454 343.5Q486 371 529 433L589 442Q620 399 638 347Q656 295 656 245Q656 182 628.5 132Q601 82 547.5 53Q494 24 417 24Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M318 572 L318 530 L318 489 L318 447 L318 406 L318 364 L334 321 L368 288 L414 282 L457 300 L493 331 L526 364 L566 388 L593 354 L609 313 L616 270 L617 227 L609 184 L590 145 L560 114 L525 87 L485 70 L442 64 L398 64 L355 68 L313 81 L274 100 L274 100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M274 100 L239 127 L208 158 L181 193 L158 231 L138 270 L120 311 L105 352 L91 394 L78 436" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="78" cy="436" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="356" y="185.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="356" y="185.9">4. climb the left arm</tspan><tspan x="356" y="271.2">to its tip</tspan></text></svg><rect x="656" y="42" width="150" height="184.56" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="184.56" viewBox="-80 -692 872 1072.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M417 24Q329 24 257 66Q185 108 128.5 204.5Q72 301 30 465L105 485Q141 346 184.5 261.5Q228 177 284.5 138.5Q341 100 415 100Q496 100 538 140Q580 180 580 243Q580 275 573.5 300Q567 325 557 344Q519 292 475.5 267Q432 242 390 242Q331 242 305 281Q279 320 279 393L279 551L-10 551L-10 622L722 622L722 551L356 551L356 372Q356 316 393 316Q422 316 454 343.5Q486 371 529 433L589 442Q620 399 638 347Q656 295 656 245Q656 182 628.5 132Q601 82 547.5 53Q494 24 417 24Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M318 572 L318 530 L318 489 L318 447 L318 406 L318 364 L334 321 L368 288 L414 282 L457 300 L493 331 L526 364 L566 388 L593 354 L609 313 L616 270 L617 227 L609 184 L590 145 L560 114 L525 87 L485 70 L442 64 L398 64 L355 68 L313 81 L274 100 L239 127 L208 158 L181 193 L158 231 L138 270 L120 311 L105 352 L91 394 L78 436" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L188 586 L355 586 L522 586 L690 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="690" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="356" y="185.9" text-anchor="middle" font-size="69.9" fill="#6b7280"><tspan x="356" y="185.9">5. lift, then draw the</tspan><tspan x="356" y="271.2">headline last, from</tspan><tspan x="356" y="356.5">left to right</tspan></text></svg><text x="16" y="239.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 23 (ড, ḍa; user manual Table 4): stored</text><text x="16" y="252.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="264.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
