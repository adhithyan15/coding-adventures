<svg xmlns="http://www.w3.org/2000/svg" width="838" height="404.18" viewBox="0 0 838 404.18" role="img" aria-label="How to write ت ن: 2 letters, ت, ن, one after another"><title>Writing ت ن</title><desc>2 letters written one after another: ت, ن (perso-arabic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: ت: Persian Online, How to Write Persian Characters, ت demonstration at 00:22–00:27 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;; ن: Persian Online, How to Write Persian Characters, ن demonstration at 02:37–02:43 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source notes on variation: ت: The cited freehand lesson demonstrates isolated ت as a shallow right-to-left Naskh bowl, followed by one lift to the left dot above and another lift to the right dot. Contextual joins reshape the bowl; this isolated learner path fits the vendored Noto Naskh outline. ن: The source shows isolated ن as one continuous right-to-left Naskh bowl, followed by one lift to place the dot above. Contextual joins reshape the bowl; this isolated learner path fits the vendored Noto Naskh outline.</desc><rect x="0" y="0" width="838" height="404.18" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="76" width="150" height="157.04" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="76" width="150" height="157.04" viewBox="0 -527 793 830.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M314 0Q196 0 133 42.5Q70 85 70 170Q70 234 83 280L119 280Q118 276 117 259.5Q116 243 116 231Q116 173 138 141.5Q160 110 208 93Q232 85 263.5 80.5Q295 76 335 76Q428 76 517 95Q606 114 675 147Q670 168 661 195.5Q652 223 639 257Q629 283 624.5 299.5Q620 316 620 324Q620 345 637 367.5Q654 390 686 408Q697 359 705 318.5Q713 278 718 246.5Q723 215 723 191Q723 174 714 148.5Q705 123 688 89Q644 61 587 41Q530 21 461.5 10.5Q393 0 314 0ZM436 328Q414 345 397.5 360.5Q381 376 370 390Q375 395 391 412Q407 429 434 457Q440 451 455.5 436Q471 421 496 397Q477 367 436 328ZM286 314Q264 332 247 347.5Q230 363 219 375Q233 388 249 404.5Q265 421 284 443Q290 436 305 421Q320 406 345 383Q336 368 321 351Q306 334 286 314Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M678 382 L678 382" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M678 382 L663 345 L650 305 L654 260 L672 215 L688 170 L686 126 L620 94 L530 65 L430 42 L335 38 L245 51 L170 83 L120 135 L96 205 L100 255" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="100" cy="255" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="396.5" y="203.5" text-anchor="middle" font-size="63.5" fill="#6b7280"><tspan x="396.5" y="203.5">1. sweep the shallow</tspan><tspan x="396.5" y="281">bowl from right to left</tspan></text></svg><rect x="176" y="76" width="150" height="157.04" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="76" width="150" height="157.04" viewBox="0 -527 793 830.2" preserveAspectRatio="xMidYMid meet" overflow="hidd