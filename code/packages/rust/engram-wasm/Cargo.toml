[package]
name = "engram-wasm"
version = "0.1.0"
edition = "2021"
description = "extern \"C\" + linear-memory WASM ABI over the Engram JSON facade"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engram-core-wasm = { path = "../engram-core-wasm" }

[dev-dependencies]
# Test-only: the export payload is base64 now, and the ABI round-trip decodes
# it. Not a runtime dependency -- this crate ships no serialisation of its own.
coding_adventures_base64 = { path = "../base64" }
