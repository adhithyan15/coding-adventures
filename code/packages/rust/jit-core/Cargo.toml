[package]
name = "jit-core"
version = "0.3.0"
edition = "2021"
description = "JIT compilation engine for InterpreterIR — specialises hot IIRFunctions into typed CIR and compiles them via a pluggable Backend.  v0.2.0: ships GenericCirJit — a universal bytecode JIT that any language with typed IIR can plug into by registering builtin callbacks (no per-language Backend impl needed)."
license = "MIT"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }
vm-core        = { path = "../vm-core" }

[dev-dependencies]
