<svg xmlns="http://www.w3.org/2000/svg" width="822" height="306.59" viewBox="0 0 822 306.59" role="img" aria-label="How to write ফ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ফ</title><desc>5 frames; frame N shows movements 1 to N of ফ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 32 (ফ, pha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 177 of the 215 stored prototypes draw the body in one pen-down stroke. 139 of those 177 start at the top left, 122 reach the foot of the stem and climb it, and 176 end in the right part, 155 of them above its bottom 40%, inside the loop. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 140 of the 215 draw none at all, 29 open with it, 40 end with it and 6 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 59 of the 59 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="306.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="200.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.59" viewBox="-80 -692 993 1327.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0Q396 56 349.5 94.5Q303 133 243.5 160Q184 187 100 208L64 299Q107 329 153.5 356.5Q200 384 256 408Q209 438 161 459Q113 480 46 505L64 551L-10 551L-10 622L843 622L843 551L135 551Q190 530 244 496Q298 462 342 426L347 367Q296 348 246 323.5Q196 299 153 269Q253 241 321.5 198.5Q390 156 442 95Q441 112 440.5 131.5Q440 151 440 171L440 510L463 510Q527 510 585.5 495.5Q644 481 689.5 453Q735 425 761 384Q787 343 787 290Q787 256 775.5 226Q764 196 739.5 177Q715 158 677 158Q642 158 618 176.5Q594 195 594 229Q594 258 612.5 276.5Q631 295 660 295Q691 295 708 276Q709 282 709 288Q709 342 660 382Q611 422 517 432L517 0L440 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M102 572 L102 572" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M102 572 L121 534 L153 505 L192 485 L230 464 L264 438 L292 404 L266 373 L226 355 L188 335 L151 312 L118 284" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="118" cy="284" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="416.5" y="219.6" text-anchor="middle" font-size="79.6" fill="#6b7280"><tspan x="416.5" y="219.6">1. start under the</tspan><tspan x="416.5" y="316.7">headline and zigzag</tspan><tspan x="416.5" y="413.8">down: out to the right</tspan><tspan x="416.5" y="510.9">point, back to the left</tspan><tspan x="416.5" y="608">point</tspan></text></svg><rect x="176" y="42" width="150" height="200.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="200.59" viewBox="-80 -692 993 1327.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0Q396 56 349.5 94.5Q303 133 243.5 160Q184 187 100 208L64 299Q107 329 153.5 356.5Q200 384 256 408Q209 438 161 459Q113 480 46 505L64 551L-10 551L-10 622L843 622L843 551L135 551Q190 530 244 496Q298 462 342 426L347 367Q296 348 246 323.5Q196 299 153 269Q253 241 321.5 198.5Q390 156 442 95Q441 112 440.5 131.5Q440 151 440 171L440 510L463 510Q527 510 585.5 495.5Q644 481 689.5 453Q735 425 761 384Q787 343 787 290Q787 256 775.5 226Q764 196 739.5 177Q715 158 677 158Q642 158 618 176.5Q594 195 594 229Q594 258 612.5 276.5Q631 295 660 295Q691 295 708 276Q709 282 709 288Q709 342 660 382Q611 422 517 432L517 0L440 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M102 572 L121 534 L153 505 L192 485 L230 464 L264 438 L292 404 L266 373 L226 355 L188 335 L151 312 L118 284" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M118 284 L118 284 L145 246 L185 222 L229 205 L273 186 L314 162 L353 135 L389 104 L423 72 L466 52" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="466" cy="52" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="416.5" y="219.6" text-anchor="middle" font-size="79.6" fill="#6b7280"><tspan x="416.5" y="219.6">2. run down to the</tspan><tspan x="416.5" y="316.7">right to the foot of</tspan><tspan x="416.5" y="413.8">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="200.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="200.59" viewBox="-80 -692 993 1327.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0Q396 56 349.5 94.5Q303 133 243.5 160Q184 187 100 208L64 299Q107 329 153.5 356.5Q200 384 256 408Q209 438 161 459Q113 480 46 505L64 551L-10 551L-10 622L843 622L843 551L135 551Q190 530 244 496Q298 462 342 426L347 367Q296 348 246 323.5Q196 299 153 269Q253 241 321.5 198.5Q390 156 442 95Q441 112 440.5 131.5Q440 151 440 171L440 510L463 510Q527 510 585.5 495.5Q644 481 689.5 453Q735 425 761 384Q787 343 787 290Q787 256 775.5 226Q764 196 739.5 177Q715 158 677 158Q642 158 618 176.5Q594 195 594 229Q594 258 612.5 276.5Q631 295 660 295Q691 295 708 276Q709 282 709 288Q709 342 660 382Q611 422 517 432L517 0L440 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M102 572 L121 534 L153 505 L192 485 L230 464 L264 438 L292 404 L266 373 L226 355 L188 335 L151 312 L118 284 L145 246 L185 222 L229 205 L273 186 L314 162 L353 135 L389 104 L423 72 L466 52" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M466 52 L466 52 L478 96 L478 143 L478 189 L478 235 L478 281 L478 327 L478 373 L478 419 L486 464" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="486" cy="464" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="416.5" y="219.6" text-anchor="middle" font-size="79.6" fill="#6b7280"><tspan x="416.5" y="219.6">3. climb the stem</tspan></text></svg><rect x="496" y="42" width="150" height="200.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="200.59" viewBox="-80 -692 993 1327.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0Q396 56 349.5 94.5Q303 133 243.5 160Q184 187 100 208L64 299Q107 329 153.5 356.5Q200 384 256 408Q209 438 161 459Q113 480 46 505L64 551L-10 551L-10 622L843 622L843 551L135 551Q190 530 244 496Q298 462 342 426L347 367Q296 348 246 323.5Q196 299 153 269Q253 241 321.5 198.5Q390 156 442 95Q441 112 440.5 131.5Q440 151 440 171L440 510L463 510Q527 510 585.5 495.5Q644 481 689.5 453Q735 425 761 384Q787 343 787 290Q787 256 775.5 226Q764 196 739.5 177Q715 158 677 158Q642 158 618 176.5Q594 195 594 229Q594 258 612.5 276.5Q631 295 660 295Q691 295 708 276Q709 282 709 288Q709 342 660 382Q611 422 517 432L517 0L440 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M102 572 L121 534 L153 505 L192 485 L230 464 L264 438 L292 404 L266 373 L226 355 L188 335 L151 312 L118 284 L145 246 L185 222 L229 205 L273 186 L314 162 L353 135 L389 104 L423 72 L466 52 L478 96 L478 143 L478 189 L478 235 L478 281 L478 327 L478 373 L478 419 L486 464 L486 464" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M486 464 L533 468 L579 459 L623 445 L665 423 L699 391 L730 356 L742 312 L732 267 L698 235 L654 236" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="654" cy="236" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="416.5" y="219.6" text-anchor="middle" font-size="79.6" fill="#6b7280"><tspan x="416.5" y="219.6">4. arch over to the</tspan><tspan x="416.5" y="316.7">right and curl down</tspan><tspan x="416.5" y="413.8">into the loop</tspan></text></svg><rect x="656" y="42" width="150" height="200.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="200.59" viewBox="-80 -692 993 1327.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0Q396 56 349.5 94.5Q303 133 243.5 160Q184 187 100 208L64 299Q107 329 153.5 356.5Q200 384 256 408Q209 438 161 459Q113 480 46 505L64 551L-10 551L-10 622L843 622L843 551L135 551Q190 530 244 496Q298 462 342 426L347 367Q296 348 246 323.5Q196 299 153 269Q253 241 321.5 198.5Q390 156 442 95Q441 112 440.5 131.5Q440 151 440 171L440 510L463 510Q527 510 585.5 495.5Q644 481 689.5 453Q735 425 761 384Q787 343 787 290Q787 256 775.5 226Q764 196 739.5 177Q715 158 677 158Q642 158 618 176.5Q594 195 594 229Q594 258 612.5 276.5Q631 295 660 295Q691 295 708 276Q709 282 709 288Q709 342 660 382Q611 422 517 432L517 0L440 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M102 572 L121 534 L153 505 L192 485 L230 464 L264 438 L292 404 L266 373 L226 355 L188 335 L151 312 L118 284 L145 246 L185 222 L229 205 L273 186 L314 162 L353 135 L389 104 L423 72 L466 52 L478 96 L478 143 L478 189 L478 235 L478 281 L478 327 L478 373 L478 419 L486 464 L533 468 L579 459 L623 445 L665 423 L699 391 L730 356 L742 312 L732 267 L698 235 L654 236" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L216 586 L412 586 L609 586 L805 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="805" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="416.5" y="219.6" text-anchor="middle" font-size="79.6" fill="#6b7280"><tspan x="416.5" y="219.6">5. lift, then draw the</tspan><tspan x="416.5" y="316.7">headline last, from</tspan><tspan x="416.5" y="413.8">left to right</tspan></text></svg><text x="16" y="255.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 32 (ফ, pha; user manual Table 4): stored</text><text x="16" y="268.09" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="280.59" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
