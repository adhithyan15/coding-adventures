[package]
name = "coding-adventures-javascript-parser"
version = "0.58.0"
edition = "2021"
description = "JavaScript parser — parses JavaScript source code against any ECMAScript edition (es1 through es2025) using the grammar-driven parser. Includes correlation-vector plumbing per CLOC03 and a typed-AST bridge (GrammarASTNode → javascript_ast::Program) per CLOC12.136."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-javascript-lexer = { path = "../javascript-lexer" }
coding-adventures-javascript-tokens = { path = "../javascript-tokens" }
coding_adventures_correlation_vector = { path = "../correlation-vector" }
coding-adventures-javascript-ast = { path = "../javascript-ast" }
serde_json = "1"
