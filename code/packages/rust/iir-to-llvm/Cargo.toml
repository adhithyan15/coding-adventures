[package]
name = "iir-to-llvm"
version = "0.40.0"
edition = "2021"
description = "IIR → textual LLVM IR backend — emits .ll source for an LLVM target triple.  v0.36.0 (LANG-FULL E4-dyn E4d-BA-arr): `array<str>` element support (BASIC `DIM A$(n)`) — a `str` element is an i64 handle (`llvm_type_for(\"str\")` = `i64`); `array_set` of a folded str literal now `ptrtoint`s the literal's `{i64 len,[N x i8]}` global to the i64 handle before the `store i64` (mirroring the call-arg / ret guards), so a stored string literal is a valid runtime handle rather than invalid `store i64 @global`.  v0.31.0 (LANG-FULL E4-dyn E4d-2b): a runtime string that arrives as a function RETURN VALUE / call result / parameter is now first-class — `str` maps to an i64 handle at function boundaries, and print_str/str_len take the runtime header-read path for ANY string lacking a compile-time length (not only promoted slots), so an ALGOL string procedure's returned string prints/measures correctly.  v0.30.0 (LANG-FULL E4-dyn E4d-2): runtime (branch-selected) strings — a str var assigned across >1 basic block becomes an i64-handle slot (a literal's {i64 len,[N x i8]} global address is a valid handle, stored via ptrtoint); print_str of such a slot reads the length from the block header at runtime (inttoptr + load). Single-assignment strings keep the folded literal fast path.  v0.27.0 (LANG-FULL AL8-arctan): f64_atan and f64_tan ops lowered via direct libm declarations (`declare double @atan(double)` / `declare double @tan(double)`) — LLVM has no @llvm.atan.f64 / @llvm.tan.f64 intrinsics, so we call libm directly, same as @atan/@tan on Linux/macOS.  v0.22.0 (LANG-FULL E4 — computed string index): literal-only `str_len` constants can flow through typed i64 arithmetic and feed `str_index`.  v0.21.0 materializes derived `str_concat` constants for `print_str`.  v0.20.0 traps literal `str_index` OOB at runtime.  v0.15.0 (LANG-FULL E6 layer 1 — typed module globals): `global_load`/`global_store` lower to module-level `@__twig_global_N` slots.  v0.12.0 (LANG-FULL — bitwise `not`): lowers `not` to `xor x, -1`; narrow unsigned values use compute-wide+mask.  v0.9.0 adds Brainfuck byte-tape ops and libc I/O.  v0.4.0 adds user calls and `call_builtin print_i64`."

[lib]
name = "iir_to_llvm"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"
