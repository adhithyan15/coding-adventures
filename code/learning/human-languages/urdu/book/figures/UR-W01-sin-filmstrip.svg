<svg xmlns="http://www.w3.org/2000/svg" width="342" height="306.88" viewBox="0 0 342 306.88" role="img" aria-label="How to write س: one unbroken stroke · 2 movements"><title>Writing س</title><desc>2 frames; frame N shows movements 1 to N of س (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Sīn, shīn, baṛī he, nūn, and nūn-e ġhunna, independent س calligraphic and handwriting animations and Sīn instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/sin-shin-bari-he-nun-nun-ghunna/&gt;. Source note on variation: The independent-form animations and adjacent prose show one uninterrupted stroke: shape the three close teeth from right to left, then flow directly into the final bowl without lifting. The lesson also documents an optional long gentle curve in place of the teeth, especially common in handwriting and practical for distinguishing adjacent sīns. This learner path covers the standard toothed independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="342" height="306.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="163.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="163.38" viewBox="-2 -410 1034 1126.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q301 -179 351.