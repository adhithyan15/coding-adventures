<svg xmlns="http://www.w3.org/2000/svg" width="982" height="263.1" viewBox="0 0 982 263.1" role="img" aria-label="How to write ங: one unbroken stroke · 6 movements"><title>Writing ங</title><desc>6 frames; frame N shows movements 1 to N of ங (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 2, ங (University of Texas at Austin), p. 191; reordered, and drawn in one stroke, after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 13 (ங): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Appendix I Frame 2 draws ங&apos;s right upright first, downward, as a detached part, and then the body after a lift. Native writers draw ங in one stroke and draw that upright last. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 92 of the 108 stored prototypes of ங (85%) are one pen-down stroke. 75 of the 92 (82%) start at the upper left, and 69 (75%) go down the left upright and climb back up it before moving right; 81 (88%) draw the right upright upward at the end, and 73 (79%) end at the top right. So this ductus overrides Frame 2&apos;s order and its lift. The bundled Noto Sans Tamil outline joins the right upright to the low bar at its foot, carries the top bar past the inner stem, hangs the bowl from the stem above the stem&apos;s free foot, and carries the low bar left under the stem, so the pen goes down the left upright and back up it, out along the top bar and back to the inner stem, down the stem to its foot and back up into the bowl, round the bowl to the low bar, out to the low bar&apos;s left end and back, and up the right upright. The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Tamil handwriting varies by school.</desc><rect x="0" y="0" width="982" height="263.1" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="144.6" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="144.6" viewBox="18 -624 1008 971.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L604 554L604 482L430 482L430 324Q450 336 482 349Q514 362 558 362Q608 362 644 343Q680 324 699 288Q718 252 718 201Q718 165 708 132Q698 99 682 72L804 72L804 0L344 0L344 72L595 72Q612 97 622 127.5Q632 158 632 192Q632 245 607 267Q582 289 543 289Q511 289 481.5 276Q452 263 430 246L430 144L344 144L344 482L174 482L174 0L88 0ZM733 0L733 72L870 72L870 554L956 554L956 0L733 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M132 504 L132 504" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M132 504 L132 436 L132 368 L132 300 L132 232 L132 164 L132 96 L132 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="132" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="522" y="220.8" text-anchor="middle" font-size="80.8" fill="#6b7280"><tspan x="522" y="220.8">1. draw the left</tspan><tspan x="522" y="319.4">upright down</tspan></text></svg><rect x="176" y="42" width="150" height="144.6" rx="6" fill="#fdfdfc" stroke="#dbe1ea" 