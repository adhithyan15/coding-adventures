<svg xmlns="http://www.w3.org/2000/svg" width="662" height="315.37" viewBox="0 0 662 315.37" role="img" aria-label="How to write ন: 2 strokes · 1 pen lift · 4 movements"><title>Writing ন</title><desc>4 frames; frame N shows movements 1 to N of ন (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 30 (ন, na; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 421 of the 498 stored prototypes draw the body in one pen-down stroke. 324 of those 421 start at the lower left, in the curl, and 295 end at the top right, at the top of the stem; 284 reach the stem&apos;s foot first and climb back up it. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 238 of the 498 draw none at all, 44 open with it, 195 end with it and 21 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 211 of the 243 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="315.37" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="209.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.37" viewBox="-80 -692 762 1063.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M430 0L430 205Q389 269 330.5 309.5Q272 350 213 355Q231 337 231 301Q231 265 207.5 240.5Q184 216 146 216Q101 216 75.5 244Q50 272 50 312Q50 365 87 396.5Q124 428 182 428Q264 428 326.5 391.5Q389 355 432 298Q431 314 430.5 329.5Q430 345 430 361L430 551L-10 551L-10 622L612 622L612 551L507 551L507 0L430 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 264 L150 264" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M150 264 L142 308 L152 349 L184 379 L228 388 L271 378 L312 360 L350 336 L384 306 L417 276 L458 260" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="458" cy="260" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301" y="201.1" text-anchor="middle" font-size="61.1" fill="#6b7280"><tspan x="301" y="201.1">1. start inside the</tspan><tspan x="301" y="275.6">curl and arch up and</tspan><tspan x="301" y="350.2">over to the right</tspan></text></svg><rect x="176" y="42" width="150" height="209.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="209.37" viewBox="-80 -692 762 1063.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M430 0L430 205Q389 269 330.5 309.5Q272 350 213 355Q231 337 231 301Q231 265 207.5 240.5Q184 216 146 216Q101 216 75.5 244Q50 272 50 312Q50 365 87 396.5Q124 428 182 428Q264 428 326.5 391.5Q389 355 432 298Q431 314 430.5 329.5Q430 345 430 361L430 551L-10 551L-10 622L612 622L612 551L507 551L507 0L430 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 264 L142 308 L152 349 L184 379 L228 388 L271 378 L312 360 L350 336 L384 306 L417 276 L458 260 L458 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M458 260 L466 216 L466 171 L466 126 L466 81 L466 36" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="466" cy="36" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301" y="201.1" text-anchor="middle" font-size="61.1" fill="#6b7280"><tspan x="301" y="201.1">2. come down to the</tspan><tspan x="301" y="275.6">foot of the stem</tspan></text></svg><rect x="336" y="42" width="150" height="209.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="209.37" viewBox="-80 -692 762 1063.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M430 0L430 205Q389 269 330.5 309.5Q272 350 213 355Q231 337 231 301Q231 265 207.5 240.5Q184 216 146 216Q101 216 75.5 244Q50 272 50 312Q50 365 87 396.5Q124 428 182 428Q264 428 326.5 391.5Q389 355 432 298Q431 314 430.5 329.5Q430 345 430 361L430 551L-10 551L-10 622L612 622L612 551L507 551L507 0L430 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 264 L142 308 L152 349 L184 379 L228 388 L271 378 L312 360 L350 336 L384 306 L417 276 L458 260 L466 216 L466 171 L466 126 L466 81 L466 36" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M466 36 L466 36 L466 81 L466 126 L466 171 L466 216 L463 261 L470 306 L470 351 L468 396 L466 441 L466 486 L466 531 L466 576" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="466" cy="576" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301" y="201.1" text-anchor="middle" font-size="61.1" fill="#6b7280"><tspan x="301" y="201.1">3. climb the stem to</tspan><tspan x="301" y="275.6">the headline</tspan></text></svg><rect x="496" y="42" width="150" height="209.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="209.37" viewBox="-80 -692 762 1063.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M430 0L430 205Q389 269 330.5 309.5Q272 350 213 355Q231 337 231 301Q231 265 207.5 240.5Q184 216 146 216Q101 216 75.5 244Q50 272 50 312Q50 365 87 396.5Q124 428 182 428Q264 428 326.5 391.5Q389 355 432 298Q431 314 430.5 329.5Q430 345 430 361L430 551L-10 551L-10 622L612 622L612 551L507 551L507 0L430 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 264 L142 308 L152 349 L184 379 L228 388 L271 378 L312 360 L350 336 L384 306 L417 276 L458 260 L466 216 L466 171 L466 126 L466 81 L466 36 L466 81 L466 126 L466 171 L466 216 L463 261 L470 306 L470 351 L468 396 L466 441 L466 486 L466 531 L466 576" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L159 586 L298 586 L436 586 L575 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="575" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301" y="201.1" text-anchor="middle" font-size="61.1" fill="#6b7280"><tspan x="301" y="201.1">4. lift, then draw the</tspan><tspan x="301" y="275.6">headline last, from</tspan><tspan x="301" y="350.2">left to right</tspan></text></svg><text x="16" y="264.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 30 (ন, na;</text><text x="16" y="276.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="289.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
