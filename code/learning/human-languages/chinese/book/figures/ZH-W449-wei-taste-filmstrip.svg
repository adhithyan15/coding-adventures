<svg xmlns="http://www.w3.org/2000/svg" width="982" height="523.96" viewBox="0 0 982 523.96" role="img" aria-label="How to write 味: 8 strokes · 7 pen lifts · 8 movements"><title>Writing 味</title><desc>8 frames; frame N shows movements 1 to N of 味 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 味.json, ordered stroke paths and medians 1–8 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%91%B3.json&gt;. Source note on variation: The cited PRC-order dataset supplies eight ordered strokes for 味, in two pieces. Medians 1–3 draw 口 in the order the standalone character uses. Medians 4–8 draw the right side: a short horizontal, a longer horizontal under it, a vertical down through both, then a left-falling stroke and a right-falling stroke from the crossing. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those eight ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and seven intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="523.96" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 8 strokes · 7 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="209.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.23" viewBox="3 -905 1030 1436.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g trans