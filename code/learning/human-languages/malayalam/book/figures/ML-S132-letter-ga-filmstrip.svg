<svg xmlns="http://www.w3.org/2000/svg" width="502" height="272.63" viewBox="0 0 502 272.63" role="img" aria-label="How to write ഗ: one unbroken stroke · 3 movements"><title>Writing ഗ</title><desc>3 frames; frame N shows movements 1 to N of ഗ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ഗ in data/GA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/GA.png&gt;. Source note on variation: Thooval&apos;s GA.png starts at the top of the left bowl (green), curves counterclockwise down round it, climbs the middle stem and sweeps clockwise over the right arch to finish at its foot (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ഗ as one stroke from the upper left to the lower right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 107 unique samples jumps between consecutive points the way a lift would; they most often start at the upper left (86 of 107) and end at the lower right (85 of 107). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms.</desc><rect x="0" y="0" width="502" height="272.63" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="154.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="154.13" viewBox="-31 -636 959 985.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M622 566Q694 566 747 532Q800 498 829 437Q858 376 858 293Q858 227 840.5 173.5Q823 120 788.5 75.5Q754 31 703 -8L649 53Q685 78 712 111Q739 144 754.5 188.5Q770 233 770 290Q770 351 751.5 397Q733 443 699.5 468.5Q666 494 620 494Q581 494 558 480.5Q535 467 521 447Q505 422 498.5 380Q492 338 492 252L492 243Q492 196 486.5 161Q481 126 469.5 99.5Q458 73 439 51Q413 21 374 4.5Q335 -12 278 -12Q205 -12 151 20.5Q97 53 68 115Q39 177 39 263Q39 331 56.5 384.5Q74 438 109 482.5Q144 527 194 566L248 504Q213 480 185.5 446Q158 412 142.5 367Q127 322 127 265Q127 203 145 157Q163 111 196.5 85.5Q230 60 274 60Q318 60 340.5 72.5Q363 85 377 106Q394 132 399 176.5Q404 221 404 300L404 313Q404 381 416.5 425Q429 469 454 499Q483 532 522 549Q561 566 622 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M183 504 L183 504" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M183 504 L140 453 L107 394 L90 329 L86 262 L88 195 L109 131 L149 78 L203 38 L269 28 L336 32 L395 64" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="395" cy="64" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="448.5" y="228.8" text-anchor="middle" font-size="76.8" fill="#6b7280"><tspan x="448.5" y="228.8">1. curve down around the</tspan><tspan x="448.5" y="322.5">left bowl</tspan></text></svg><rect x="176" y="42" width="150" height="154.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="154.13" viewBox="-31 -636 959 985.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><pa