<svg xmlns="http://www.w3.org/2000/svg" width="342" height="436.16" viewBox="0 0 342 436.16" role="img" aria-label="How to write ß: one unbroken stroke · 2 movements"><title>Writing ß</title><desc>2 frames; frame N shows movements 1 to N of ß (latin), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Grundschrift-App (Laborschule Bielefeld, Bielefeld University, with the Grundschulverband), level kleinbuchstaben/sz, ordered stroke paths for ß (assets/levels/kleinbuchstaben/sz/metadata.json, commit f6dbd80; no licence, facts only) &lt;https://github.com/Medien-Treibhaus/grundschrift-app-source/blob/f6dbd807adbb3fc2f94207fe578def439f6e9c49/assets/levels/kleinbuchstaben/sz/metadata.json&gt;. Source note on variation: The Grundschrift-App was made in a research project of the Laborschule at Bielefeld University with the Grundschulverband, on its Grundschrift school model, with a teacher advisory team. Each letter is an ordered list of paths, one per pen-down stroke, which the app makes a child trace in order. It writes ß in one stroke: up the stem from the foot, over the top and round both bowls to the lower left. UJIpenchars2 is a Spanish data set and has no ß, so no native-writer count is cited; the order is the school model&apos;s. The app&apos;s repository has no licence, so only the order, the start, the direction and the lifts are taken from it; no point is copied, and the path is fitted to the Noto Sans ß bundled in NotoSansDevanagari-Static.ttf. Handwriting varies by writer.</desc><rect x="0" y="0" width="342" height="436.16" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">stroke · 2 movements</text><rect x="16" y="60.75" width="150" height="261.41" rx="6" fill="#fdfdfc" 