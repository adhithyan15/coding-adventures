<svg xmlns="http://www.w3.org/2000/svg" width="502" height="300.98" viewBox="0 0 502 300.98" role="img" aria-label="How to write फ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing फ</title><desc>3 frames; frame N shows movements 1 to N of फ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari pʰ फ.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_p%CA%B0_%E0%A4%AB.gif&gt;. Source note on variation: The 15-frame animation shows three ordered pen-down runs: frames 0–6 descend the left stem, curve right around the lower bowl, rise along the central side to the headline, and retrace down the central stem without lifting; frames 7–10 restart at the central junction and sweep clockwise through the open right arch; frames 11–14 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The spatial restarts at frames 7 and 11 delimit the three runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 36, independently confirms the left curve, central stem, right curve, and headline buildup while staging the components differently rather than proving the animation&apos;s joins. This learner path takes its three-run lift count from the animation and fits its curves to Noto Sans Devanagari; everyday handwriting may divide or simplify the joined body differently.</desc><rect x="0" y="0" width="502" height="300.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="194.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" 