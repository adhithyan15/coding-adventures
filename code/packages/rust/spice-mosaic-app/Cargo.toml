[package]
name = "spice-mosaic-app"
version = "0.1.0"
edition = "2021"
description = "Portable Mosaic application adapter for the Berkeley SPICE workbench."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mosaic-app-capi = { path = "../mosaic-app-capi" }
mosaic-app-runtime = { path = "../mosaic-app-runtime" }
mosaic-app-wasm = { path = "../mosaic-app-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spice-netlist-parser = { path = "../spice-netlist-parser" }
