<svg xmlns="http://www.w3.org/2000/svg" width="502" height="327.68" viewBox="0 0 502 327.68" role="img" aria-label="How to write ெ: one unbroken stroke · 3 movements"><title>Writing ெ</title><desc>3 frames; frame N shows movements 1 to N of ெ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 41 (ெ, e sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 131 of the 132 stored prototypes of the e sign are one pen-down stroke. All 131 turn clockwise: the pen starts inside the small curl (110 of 131), circles it, climbs the outer curve and comes down the right upright, where 115 end. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline, which tucks the end of the small curl into the bottom of the outer curve, so the fitted path starts at that tucked end. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="327.68" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="209.18" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.18" viewBox="-13 -913 896 1249.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M400 -12Q325 -12 262.5 17Q200 46 153.5 99Q107 152 82 227Q57 302 57 393Q57 505 93.5 589Q130 673 190.5 729.5Q251 786 325 814.5Q399 843 475 843Q555 843 611 823Q667 803 707 7