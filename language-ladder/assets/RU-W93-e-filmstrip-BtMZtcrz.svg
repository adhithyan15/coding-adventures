<svg xmlns="http://www.w3.org/2000/svg" width="662" height="362.4" viewBox="0 0 662 362.4" role="img" aria-label="How to write э: 2 strokes · 1 pen lift · 4 movements"><title>Writing э</title><desc>4 frames; frame N shows movements 1 to N of э (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase э demonstration, 11:25–11:32, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 11:25–11:32 lowercase э demonstration, the pen begins at the upper-left opening, curves right across the top, descends around the outer right side, and sweeps left through the lower curve to the lower-left opening. The pen then lifts once, restarts near the middle right, and draws the short middle tongue right-to-left with a gentle hook. The demonstrated school hand therefore uses two pen-down runs with one intervening lift: the outer backwards-C curve first, then the middle tongue from right to left. The bundled Noto Sans Cyrillic glyph is a printed э-like form with a broad open-left outer curve and a straight horizontal middle bar, rather than the source&apos;s narrower rounded curve and gently hooked tongue. This learner path preserves the source&apos;s outer-before-tongue order, clockwise outer direction, right-to-left tongue direction, and one-lift evidence while fitting the printed outline: sweep around the outer curve from upper left to lower left, lift once, then draw the middle bar from right to left. Connected cursive may narrow or hook both openings, and individual handwriting may round, widen, slant, or hook the curve and tongue differently.</desc><rect x="0" y="0" width="662" height="362.4" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="256.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="256.4" viewBox="-29 -616 545 931.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M189 -10Q146 -10 106.5 -2Q67 6 41 19L41 92Q75 78 112 71Q149 64 183 64Q345 64 356 240L95 240L95 312L354 312Q345 391 302.5 431.5Q260 472 190 472Q130 472 68 445L42 516Q76 530 116.5 538Q157 546 194 546Q310 546 378 474.5Q446 403 446 267Q446 136 378 63Q310 -10 189 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M82 472 L82 472" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M82 472 L150 500 L230 505 L315 480 L378 420" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="378" cy="420" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="243.5" y="193.7" text-anchor="middle" font-size="43.7" fill="#6b7280"><tspan x="243.5" y="193.7">1. sweep right across</tspan><tspan x="243.5" y="247">the upper curve</tspan></text></svg><rect x="176" y="42" width="150" height="256.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="256.4" viewBox="-29 -616 545 931.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M189 -10Q146 -10 106.5 -2Q67 6 41 19L41 92Q75 78 112 71Q149 64 183 64Q345 64 356 240L95 240L95 312L354 312Q345 391 302.5 431.5Q260 472 190 472Q130 472 68 445L42 516Q76 530 116.5 538Q157 546 194 546Q310 546 378 474.5Q446 403 446 267Q446 136 378 63Q310 -10 189 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M82 472 L150 500 L230 505 L315 480 L378 420 L378 420" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M378 420 L420 350 L425 270 L415 185 L378 110" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="378" cy="110" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="243.5" y="193.7" text-anchor="middle" font-size="43.7" fill="#6b7280"><tspan x="243.5" y="193.7">2. continue down around</tspan><tspan x="243.5" y="247">the outer right side</tspan></text></svg><rect x="336" y="42" width="150" height="256.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="256.4" viewBox="-29 -616 545 931.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M189 -10Q146 -10 106.5 -2Q67 6 41 19L41 92Q75 78 112 71Q149 64 183 64Q345 64 356 240L95 240L95 312L354 312Q345 391 302.5 431.5Q260 472 190 472Q130 472 68 445L42 516Q76 530 116.5 538Q157 546 194 546Q310 546 378 474.5Q446 403 446 267Q446 136 378 63Q310 -10 189 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M82 472 L150 500 L230 505 L315 480 L378 420 L420 350 L425 270 L415 185 L378 110 L378 110" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M378 110 L315 45 L230 25 L150 35 L82 72" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="82" cy="72" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="243.5" y="193.7" text-anchor="middle" font-size="43.7" fill="#6b7280"><tspan x="243.5" y="193.7">3. sweep left through</tspan><tspan x="243.5" y="247">the lower curve</tspan></text></svg><rect x="496" y="42" width="150" height="256.4" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="256.4" viewBox="-29 -616 545 931.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M189 -10Q146 -10 106.5 -2Q67 6 41 19L41 92Q75 78 112 71Q149 64 183 64Q345 64 356 240L95 240L95 312L354 312Q345 391 302.5 431.5Q260 472 190 472Q130 472 68 445L42 516Q76 530 116.5 538Q157 546 194 546Q310 546 378 474.5Q446 403 446 267Q446 136 378 63Q310 -10 189 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M82 472 L150 500 L230 505 L315 480 L378 420 L420 350 L425 270 L415 185 L378 110 L315 45 L230 25 L150 35 L82 72" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M356 276 L356 276" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M356 276 L290 276 L225 276 L160 276 L95 276" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="276" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="243.5" y="193.7" text-anchor="middle" font-size="43.7" fill="#6b7280"><tspan x="243.5" y="193.7">4. lift, then draw the</tspan><tspan x="243.5" y="247">middle tongue</tspan><tspan x="243.5" y="300.3">right-to-left</tspan></text></svg><text x="16" y="311.4" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase э demonstration,</text><text x="16" y="323.9" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">11:25–11:32, YouTube, 5 February 2013</text><text x="16" y="336.4" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
