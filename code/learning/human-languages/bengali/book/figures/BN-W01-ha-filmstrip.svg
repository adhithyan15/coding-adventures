315Q464 248 418 199.5Q372 151 283 140Q344 117 411 78Q478 39 540 -10L498 -65Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 375 L160 425 L200 460 L250 468 L320 462 L380 442 L396 402 L416 363 L422 319 L418 275 L397 236 L365 206 L325 187 L283 175 L241 160 L197 159 L154 167 L110 175 L110 175" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 175 L152 167 L194 160 L235 148 L265 117 L303 98 L341 79 L379 58 L415 36 L451 12 L486 -13" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="486" cy="-13" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="267" y="260.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="267" y="260.6">3. sweep back right</tspan><tspan x="267" y="328.4">along the base and down</tspan><tspan x="267" y="396.3">the tail</tspan></text></svg><rect x="496" y="42" width="150" height="239.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="239.42" viewBox="-80 -692 694 1107.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M498 -65Q435 -18 382.5 16Q330 50 279.5 75Q229 100 173 119Q117 138 46 154L61 223Q96 213 132.5 208.5Q169 204 207 204Q278 204 316.5 221Q355 238 370 265Q385 292 385 320Q385 373 347.5 401.5Q310 430 245 430L244 430Q246 416 246 401Q246 366 225.5 345.5Q205 325 170 325Q133 325 114.5 347.5Q96 370 96 400Q96 427 111.5 449Q127 471 155 484Q147 507 128 524Q109 541 78 551L-10 551L-10 622L544 622L544 551L198 551Q222 530 232 500Q314 500 365 473Q416 446 440 403.5Q464 361 464 315Q464 248 418 199.5Q372 151 283 140Q344 117 411 78Q478 39 540 -10L498 -65Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 375 L160 425 L200 460 L250 468 L320 462 L380 442 L396 402 L416 363 L422 319 L418 275 L397 236 L365 206 L325 187 L283 175 L241 160 L197 159 L154 167 L110 175 L152 167 L194 160 L235 148 L265 117 L303 98 L341 79 L379 58 L415 36 L451 12 L486 -13" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L142 586 L265 586 L388 586 L510 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="510" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="267" y="260.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="267" y="260.6">4. lift, then draw the</tspan><tspan x="267" y="328.4">headline last, from left</tspan><tspan x="267" y="396.3">to right</tspan></text></svg><text x="16" y="294.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 42 (হ, ha;</text><text x="16" y="306.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="319.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
