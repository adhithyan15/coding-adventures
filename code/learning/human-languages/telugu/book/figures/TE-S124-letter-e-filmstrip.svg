<svg xmlns="http://www.w3.org/2000/svg" width="502" height="344.27" viewBox="0 0 502 344.27" role="img" aria-label="How to write ఎ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ఎ</title><desc>3 frames; frame N shows movements 1 to N of ఎ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఎ packaged tracing guide res/drawable/dot_stroke_v_9_e.png, movements 1–3 (version 2.6) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers three directional movements and marks the compact loop and outer arch as two pen-down runs; the visible join groups movements 1–2 before movement 3 restarts. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="502" height="344.27" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="238.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="238.27" viewBox="-41 -782 787 1250.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q593 256 574.5 309Q556 362 523 409.5Q490 457 446 498.5Q402 540 350 574Q298 608 242 632L280 712Q335 689 391.5 653.5Q448 618 499 570.5Q550 523 590 465.5Q630 408 653 341Q676 274 676 198Q676 132 653.5 85Q631 38 588.5 13Q546 -12 485 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M275 141 L275 141" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M275 141 L255 195 L215 235 L170 245 L120 225 L80 180 L68 125 L78 82" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="78" cy="82" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="352.5" y="215.1" text-anchor="middle" font-size="63.1" fill="#6b7280"><tspan x="352.5" y="215.1">1. turn down and left</tspan><tspan x="352.5" y="292.1">around the compact</tspan><tspan x="352.5" y="369.1">lower loop</tspan></text></svg><rect x="176" y="42" width="150" height="238.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="238.27" viewBox="-41 -782 787 1250.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q593 256 574.5 309Q556 362 523 409.5Q490 457 446 498.5Q402 540 350 574Q298 608 242 632L280 712Q335 689 391.5 653.5Q448 618 499 570.5Q550 523 590 465.5Q630 408 653 341Q676 274 676 198Q676 132 653.5 85Q631 38 588.5 13Q546 -12 485 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M275 141 L255 195 L215 235 L170 245 L120 225 L80 180 L68 125 L78 82 L78 82" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M78 82 L105 42 L155 24 L205 30 L245 72 L275 141" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="275" cy="141" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="352.5" y="215.1" text-anchor="middle" font-size="63.1" fill="#6b7280"><tspan x="352.5" y="215.1">2. continue around its</tspan><tspan x="352.5" y="292.1">base and return to the</tspan><tspan x="352.5" y="369.1">central junction</tspan></text></svg><rect x="336" y="42" width="150" height="238.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="238.27" viewBox="-41 -782 787 1250.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 180 63Q214 63 236.5 83Q259 103 275 141L328 81Q309 54 288 33Q267 12 240.5 0Q214 -12 175 -12Q122 -12 90 10Q58 32 43.5 66.5Q29 101 29 138Q29 182 48 214Q67 246 99 264Q131 282 170 282Q206 282 234 269.5Q262 257 289 230.5Q316 204 348 161Q375 126 396 105Q417 84 439 75.5Q461 67 490 67Q540 67 566.5 99Q593 131 593 200Q593 256 574.5 309Q556 362 523 409.5Q490 457 446 498.5Q402 540 350 574Q298 608 242 632L280 712Q335 689 391.5 653.5Q448 618 499 570.5Q550 523 590 465.5Q630 408 653 341Q676 274 676 198Q676 132 653.5 85Q631 38 588.5 13Q546 -12 485 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M275 141 L255 195 L215 235 L170 245 L120 225 L80 180 L68 125 L78 82 L105 42 L155 24 L205 30 L245 72 L275 141" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M275 141 L275 141" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M275 141 L325 95 L390 52 L460 28 L525 45 L585 100 L615 180 L610 270 L575 370 L515 465 L435 545 L345 610 L260 655" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="260" cy="655" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="352.5" y="215.1" text-anchor="middle" font-size="63.1" fill="#6b7280"><tspan x="352.5" y="215.1">3. restart at the</tspan><tspan x="352.5" y="292.1">junction and sweep up</tspan><tspan x="352.5" y="369.1">through the broad outer</tspan><tspan x="352.5" y="446">arch</tspan></text></svg><text x="16" y="293.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఎ packaged</text><text x="16" y="305.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">tracing guide res/drawable/dot_stroke_v_9_e.png, movements 1–3 (version 2.6)</text><text x="16" y="318.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
