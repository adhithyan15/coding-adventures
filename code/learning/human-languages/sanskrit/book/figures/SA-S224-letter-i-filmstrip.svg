<svg xmlns="http://www.w3.org/2000/svg" width="822" height="369.99" viewBox="0 0 822 369.99" role="img" aria-label="How to write इ: 2 strokes · 1 pen lift · 5 movements"><title>Writing इ</title><desc>5 frames; frame N shows movements 1 to N of इ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari इ stroke order.svg’, panels 1–2, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%87_stroke_order.svg&gt;. Source note on variation: The two-panel diagram marks the body as one continuous pen-down run: panel 1&apos;s green start sits at the top of the upright; its arrows descend the upright, turn left around the upper bowl, sweep right through the waist and around the lower bowl, then finish down-right through the tail without lifting. Panel 2 restarts at the headline&apos;s left edge and draws the shirorekhā left-to-right, for one intervening lift. This learner path follows that modern printed teaching form and fits its turns and directions to Noto Sans Devanagari. Other handwriting may simplify the curves, so this is a sourced learner path rather than a universal standard.</desc><rect x="0" y="0" width="822" height="369.99" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="276.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="276.49" viewBox="-70 -692 645 1188.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M271 222Q242 222 212.5 215.5Q183 209 158 199Q130 217 105 240Q80 263 65 291.5Q50 320 50 352Q50 408 86.5 436.5Q123 465 199 465L323 465L323 551L0 551L0 622L505 622L505 551L404 551L404 394L206 394Q166 394 148 381Q130 368 