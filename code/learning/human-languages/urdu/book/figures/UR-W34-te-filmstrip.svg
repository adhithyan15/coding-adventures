<svg xmlns="http://www.w3.org/2000/svg" width="502" height="290.2" viewBox="0 0 502 290.2" role="img" aria-label="How to write ت: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ت</title><desc>3 frames; frame N shows movements 1 to N of ت (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Te, mīm, jīm, che, and more diacritics, independent ت handwriting animation and Te instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/te-mim-jim-che/&gt;. Source note on variation: The independent-form handwriting animation draws the full be-series bowl first in one uninterrupted right-to-left run, then places the left dot above the main line and the right dot beside it: three strokes separated by two pen lifts. The adjacent prose identifies te as the be-series shape with two dots side by side above the main line and notes that handwritten pairs of dots may be replaced by a squiggle or horizontal line. This learner path preserves the explicit two-dot independent form and fits the body-first, three-run order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Arabic or Persian ت sources.</desc><rect x="0" y="0" width="502" height="290.2" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="171.7" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="171.7" viewBox="0 -527 793 907.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><pat