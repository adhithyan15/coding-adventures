<svg xmlns="http://www.w3.org/2000/svg" width="502" height="314.93" viewBox="0 0 502 314.93" role="img" aria-label="How to write ఎ: one unbroken stroke · 3 movements"><title>Writing ఎ</title><desc>3 frames; frame N shows movements 1 to N of ఎ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఎ packaged tracing guide res/drawable/dot_stroke_v_9_e.png, movements 1–3 (version 2.6) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers three directional movements and places movement 3&apos;s start at the junction where movement 2 ends. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the guide&apos;s order. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="502" height="314.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="208.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="208.93" viewBox="-41 -782 787 1096.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M485 -12Q437 -12 401.5 6Q366 24 336 56Q306 88 273 131Q244 171 223 189Q202 207 172 207Q144 207 125.5 189Q107 171 107 136Q107 105 126.5 84Q146 63 