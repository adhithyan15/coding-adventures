<svg xmlns="http://www.w3.org/2000/svg" width="822" height="257.5" viewBox="0 0 822 257.5" role="img" aria-label="How to write ణ: one unbroken stroke · 5 movements"><title>Writing ణ</title><desc>5 frames; frame N shows movements 1 to N of ణ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ణ packaged tracing guides res/drawable/dot_stroke_c_3_5_na.png and res/drawable/line_stroke_c_3_5_na.png, movements 1–5 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the lower-left, upper-left, upper-right and lower-right curves plus the inner curve as five movements. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the guide&apos;s order. The guide has no counterpart for the short horizontal shelf inside the left bowl of bundled Noto Sans Telugu; the run passes the shelf&apos;s root, and only its tip is left untraced. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled outline.</desc><rect x="0" y="0" width="822" height="257.5" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="151.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="151.5" viewBox="-37 -570 898 907" preserveAspectRatio="