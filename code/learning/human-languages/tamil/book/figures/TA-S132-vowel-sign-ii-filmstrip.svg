<svg xmlns="http://www.w3.org/2000/svg" width="502" height="286.11" viewBox="0 0 502 286.11" role="img" aria-label="How to write ீ: one unbroken stroke · 3 movements"><title>Writing ீ</title><desc>3 frames; frame N shows movements 1 to N of ீ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 38 (ீ, ii sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 225 of the 229 stored prototypes of the ii sign (98%) are one pen-down stroke. In 213 of those 225 the pen starts low, at the foot of the tail, and 168 first move up; 224 turn clockwise, over the top to the right, and 190 end in the upper half, inside the closing curl. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="286.11" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="167.61" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="167.61" viewBox="-497 -913 575 642.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-168 843Q-82 843 -37 808.5Q8 774 8 718Q8 655 -30 624.5Q-68 594 -123 594Q-181 594 -216 623.5Q-251 653 -251 705Q-251 728 -241.5 759Q-232 790 -205 818L-154 796Q-170 777 -177.5 757.5Q-185 738 -185 719Q-185 697 -177 683Q-169 669 -1