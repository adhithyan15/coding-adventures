<svg xmlns="http://www.w3.org/2000/svg" width="822" height="308.62" viewBox="0 0 822 308.62" role="img" aria-label="How to write 五: 4 strokes · 3 pen lifts · 5 movements"><title>Writing 五</title><desc>5 frames; frame N shows movements 1 to N of 五 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 五.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BA%94.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 五. Median 1 is the top bar; median 2 descends from it leaning left; median 3 crosses to the right and turns down; median 4 is the widest stroke and closes the character along the bottom. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those ordered medians to the vendored Noto Sans SC outline while preserving their directions and pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="308.62" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="202.62" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.62" viewBox="-14 -813 1030 1391.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M120 743L875 743L875 669L120 669L120 743ZM56 49L946 49L946 -25L56 -25L56 49Z