<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectNav</title>
</head>
<body>
  <section data-component="ProjectNav" data-mosaic-html-root="ProjectNav">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="ProjectNav">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <span style="font-size: 10.5px; font-weight: bold; color: #9b9289; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 0; padding-right: 8px; padding-bottom: 6px; padding-left: 8px">{{navTitle}}</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <!-- mosaic-for each="projectRows" as="p" index="pi" -->
            <div style="display: flex; flex-direction: row; gap: 4px; align: center-vertical">
              <!-- mosaic-if when="( p [ 2 ] )" -->
                <span style="color: #9b9289; font-size: 13px">{{p [ 2 ]}}</span>
              <!-- /mosaic-if -->
              <!-- mosaic-if when="( p [ 1 ] )" -->
                <!-- emit "onSelectProject" dropped: HTML is static -->
                <button data-on-click="onSelectProject" style="width: 100%; background: #fffdfa; color: #2b2723; font-size: 13px; font-weight: bold; text-align: left; padding: 8px; border-radius: 8px; border-width: 0; box-shadow: 0 1px 2px rgba(60,45,25,.05), 0 4px 14px rgba(60,45,25,.05); elevation: raised">{{p [ 0 ]}}</button>
              <!-- mosaic-else -->
                <!-- emit "onSelectProject" dropped: HTML is static -->
                <button data-on-click="onSelectProject" style="width: 100%; background: transparent; color: #6a625a; font-size: 13px; text-align: left; padding: 8px; border-radius: 8px; border-width: 0">{{p [ 0 ]}}</button>
              <!-- /mosaic-if -->
            </div>
          <!-- /mosaic-for -->
        </div>
        <div style="display: flex; flex-direction: row; gap: 6px; align: center-vertical">
          <!-- emit "onNewProjectNameChange" dropped: HTML is static -->
          <input type="text" value="{{newProjectName}}" placeholder="New project" data-on-change="onNewProjectNameChange" style="width: 100%; background: #fffdfa; color: #2b2723; font-size: 12px; padding: 7px; border-width: 1px; border-color: #e6ded3; border-radius: 8px">
          <!-- emit "onAddProject" dropped: HTML is static -->
          <button data-on-click="onAddProject" style="background: #fffdfa; color: #b6741a; font-size: 15px; font-weight: bold; padding: 6px; border-width: 1px; border-color: #e6ded3; border-radius: 8px">+</button>
        </div>
        <!-- emit "onAddSubproject" dropped: HTML is static -->
        <button data-on-click="onAddSubproject" style="background: transparent; color: #9b9289; font-size: 12px; text-align: left; padding: 6px; border-width: 0; border-radius: 8px">+ Sub-project</button>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
