<svg xmlns="http://www.w3.org/2000/svg" width="662" height="324.26" viewBox="0 0 662 324.26" role="img" aria-label="How to write ष: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ष</title><desc>4 frames; frame N shows movements 1 to N of ष (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ष-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%B7-order.gif&gt;. Source note on variation: The 24-frame animation shows four ordered pen-down runs over its gray guide: frames 2–11 descend the left side, curve counterclockwise around the lower bowl, and rise along the right side to the headline without lifting; frames 12–14 restart at the right stem&apos;s headline junction and descend top-to-bottom, retracing the already inked upper segment before continuing below the bowl; frames 15–18 restart at the upper-left interior and draw the inner diagonal down-right to the bowl junction; frames 19–22 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 250 ms holds at frames 11, 14, and 18 mark the first three run endings before the one-second completed frame 23. This learner path follows that sourced four-run order and fits its bowl, stem, and diagonal to Noto Sans Devanagari; everyday handwriting may divide or simplify the body differently.</desc><rect x="0" y="0" width="662" height="324.26" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="230.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="230.76" viewBox="-70 -692 732 1126.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path c