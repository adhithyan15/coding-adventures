[package]
name = "journal-wasm"
version = "0.1.0"
edition = "2021"
description = "Linear-memory WASM ABI exposing the pure journal-core engine to web, Electron, and Mosaic hosts."
license = "MIT"

[lib]
# cdylib for the wasm32 target; rlib so the ABI logic is unit-testable natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pure engine, with `serde` on so commands and projections marshal as JSON
# across the linear-memory boundary. No model logic lives in this crate.
journal-core = { path = "../journal-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
