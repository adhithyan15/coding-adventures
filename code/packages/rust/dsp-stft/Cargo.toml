[package]
name = "dsp-stft"
version = "0.5.0"
edition = "2021"
description = "DSP05 Phases 1-6: scalar + matrix-IR-lowered STFT for the DSP layer. Forward + ISTFT, magnitude/log spectrograms, mel filterbank, mel-spectrogram, MFCC, and a matrix-IR-lowered build_stft_graph / stft_via_runtime. Hardened against CWE-400, CWE-190, CWE-674, CWE-20."
license = "MIT"

[dependencies]
dsp-fft           = { path = "../dsp-fft" }
dsp-filters       = { path = "../dsp-filters" }
dsp-complex       = { path = "../dsp-complex" }
dsp-dct           = { path = "../dsp-dct" }
matrix-ir         = { path = "../matrix-ir" }
matrix-cpu        = { path = "../matrix-cpu" }
matrix-runtime    = { path = "../matrix-runtime" }
compute-ir        = { path = "../compute-ir" }
executor-protocol = { path = "../executor-protocol" }

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
