<svg xmlns="http://www.w3.org/2000/svg" width="502" height="290.38" viewBox="0 0 502 290.38" role="img" aria-label="How to write 下: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 下</title><desc>3 frames; frame N shows movements 1 to N of 下 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 下.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%8B.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 下. Median 1 draws the horizontal; median 2 draws the vertical down from it; median 3 draws the dot to the right of the vertical. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="290.38" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="184.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.38" viewBox="-15 -836 1031 1267.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M55 766L946 766L946 691L55 691L55 766ZM441 707L520 707L520 -79L441 -79L441 707ZM484 470L534 527Q579 506 629 479Q679 452 728 423.5Q777 395 819.5 368Q862 341 892 318L839 250Q810 273 768.5 301.5Q727 330 678.5 359.5Q630 389 580 417.5Q530 446 484 470Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M66 743 L66 743" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M66 743 L165 717 L276 727 L497 712 L791 736 L932 711" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="932" cy="711" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="500.5" y="301.6">1. draw the horizontal</tspan></text></svg><rect x="176" y="42" width="150" height="184.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="184.38" viewBox="-15 -836 1031 1267.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M55 766L946 766L946 691L55 691L55 766ZM441 707L520 707L520 -79L441 -79L441 707ZM484 470L534 527Q579 506 629 479Q679 452 728 423.5Q777 395 819.5 368Q862 341 892 318L839 250Q810 273 768.5 301.5Q727 330 678.5 359.5Q630 389 580 417.5Q530 446 484 470Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M66 743 L165 717 L276 727 L497 712 L791 736 L932 711" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M451 748 L451 748" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M451 748 L484 637 L486 -65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="486" cy="-65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="500.5" y="301.6">2. lift, then draw the</tspan><tspan x="500.5" y="402.4">vertical down from it</tspan></text></svg><rect x="336" y="42" width="150" height="184.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="184.38" viewBox="-15 -836 1031 1267.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M55 766L946 766L946 691L55 691L55 766ZM441 707L520 707L520 -79L441 -79L441 707ZM484 470L534 527Q579 506 629 479Q679 452 728 423.5Q777 395 819.5 368Q862 341 892 318L839 250Q810 273 768.5 301.5Q727 330 678.5 359.5Q630 389 580 417.5Q530 446 484 470Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M66 743 L165 717 L276 727 L497 712 L791 736 L932 711" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M451 748 L484 637 L486 -65" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M526 498 L526 498" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M526 498 L849 286" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="849" cy="286" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="500.5" y="301.6">3. lift, then draw the</tspan><tspan x="500.5" y="402.4">dot</tspan></text></svg><text x="16" y="239.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 下.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="251.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="264.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
