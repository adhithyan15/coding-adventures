<svg xmlns="http://www.w3.org/2000/svg" width="502" height="304.47" viewBox="0 0 502 304.47" role="img" aria-label="How to write ف: 2 strokes · 1 pen lift · 3 movements"><title>Writing ف</title><desc>3 frames; frame N shows movements 1 to N of ف (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ف demonstration at 02:09–02:13 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ف body-first: loop clockwise around the small closed head, continue left through the broad bowl without lifting, then lift once and place the single dot above. Contextual joins shorten the bowl; this isolated learner path fits the vendored Noto Naskh outline and records Persian-scoped provenance rather than borrowing the independently verified Arabic or Urdu ف sources.</desc><rect x="0" y="0" width="502" height="304.47" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="198.47" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.47" viewBox="-2 -746 869 1149.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M320 0Q194 0 131 42.5Q68 85 68 170Q68 202 71.5 229Q75 256 82 280L118 280Q116 268 115 255.5Q114 243 114 231Q114 170 136.5 139.5Q159 109 209 92Q235 85 268 80.5Q301 76 342 76Q392 76 449 81.5Q506 87 562.5 96.5Q619 106 668 119Q717 132 750 147Q747 167 744 186.5Q741 206 736 225Q703 198 667.5 184Q632 170 594 170Q551 170 523 203Q495 236 495 287Q495 337 511.5 380.5Q528 424 554 450Q583 481 619 481Q669 481 7