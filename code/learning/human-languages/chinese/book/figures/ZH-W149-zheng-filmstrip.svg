" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 400 L552 396 L563 381 L612 391 L862 389" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M198 463 L230 392 L233 78 L251 -22" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M62 16 L62 16" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M62 16 L130 -1 L528 13 L567 0 L803 13 L935 -15" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="935" cy="-15" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501" y="258.2" text-anchor="middle" font-size="83.2" fill="#6b7280"><tspan x="501" y="258.2">5. lift, then draw the</tspan><tspan x="501" y="359.7">long bottom horizontal</tspan></text></svg><text x="16" y="246.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 正.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22</text><text x="16" y="259.31" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="271.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
