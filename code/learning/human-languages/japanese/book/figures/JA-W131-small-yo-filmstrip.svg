<svg xmlns="http://www.w3.org/2000/svg" width="502" height="372.42" viewBox="0 0 502 372.42" role="img" aria-label="How to write ょ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ょ</title><desc>3 frames; frame N shows movements 1 to N of ょ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana よ stroke order animation.gif, hiragana よ, 26 frames, 2.6 seconds (Wikimedia Commons, 1 October 2009; corrected first-stroke direction 4 January 2012); KanjiVG kanji/03087.svg, two stroke paths in the same order; the Unicode Standard names U+3087 HIRAGANA LETTER SMALL YO &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%88_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws full-size よ in two pen-down runs with one lift: the short upper bar from left to right, then the stem descending through it and the clockwise lower loop. KanjiVG records U+3087 with the same two strokes in the same order. Unicode separately identifies U+3087 as small yo. This learner path therefore preserves the source&apos;s two-run movement while scaling and fitting it to the bundled Noto Sans JP small ょ outline; the cited animation demonstrates よ rather than a separately animated ょ, so the size adaptation is explicit rather than presented as independent handwriting evidence.</desc><rect x="0" y="0" width="502" height="372.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="241.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="241.42" viewBox="121 -691 741 1192.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M537 621Q535 610 533 585Q531 560 531 539Q531 523 531 494Q531 46