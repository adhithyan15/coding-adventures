[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-chief-of-staff-channel-crypto"
version = "0.1.0"
description = "Portable D18F immutable encrypted-message profile for Chief of Staff channels"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = [
    "coding-adventures-chacha20-poly1305",
    "coding-adventures-ed25519",
    "coding-adventures-sha256",
    "coding-adventures-uuid",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_adventures_chief_of_staff_channel_crypto"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coding_adventures_chief_of_staff_channel_crypto --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/coding_adventures_chief_of_staff_channel_crypto"]

[tool.coverage.report]
fail_under = 80
show_missing = true
