<svg xmlns="http://www.w3.org/2000/svg" width="502" height="308.89" viewBox="0 0 502 308.89" role="img" aria-label="How to write 三: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 三</title><desc>3 frames; frame N shows movements 1 to N of 三 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 三.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%89.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 三, all horizontal, ordered top, middle, bottom. Median 3 is markedly the widest, which is what stops the character reading as a stack of identical bars. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those ordered medians to the vendored Noto Sans SC outline while preserving their directions and pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="502" height="308.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="202.89" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="202.89" viewBox="-5 -813 1009 1364.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M123 743L879 743L879 667L123 667L123 743ZM187 416L801 416L801 341L187 341L187 416ZM65 69L934 69L934 -7L65 -7L65 69Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M172 704 L172 704" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M172 704 L224 705 L276 704 L329 705 L381 704 L433 705 L485 704 L537 705 L589 704 L642 705 L694 704 L746 705 L798 704" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="798" cy="704" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="499.5" y="227.8" text-anchor="middle" font-size="80.8" fill="#6b7280"><tspan x="499.5" y="227.8">1. draw the top</tspan><tspan x="499.5" y="326.4">horizontal héng stroke</tspan><tspan x="499.5" y="425">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="202.89" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="202.89" viewBox="-5 -813 1009 1364.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M123 743L879 743L879 667L123 667L123 743ZM187 416L801 416L801 341L187 341L187 416ZM65 69L934 69L934 -7L65 -7L65 69Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M172 704 L224 705 L276 704 L329 705 L381 704 L433 705 L485 704 L537 705 L589 704 L642 705 L694 704 L746 705 L798 704" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M212 378 L212 378" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M212 378 L258 378 L303 378 L349 378 L394 378 L440 378 L485 378 L531 378 L576 378 L622 378 L667 378 L713 378 L758 378" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="758" cy="378" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="499.5" y="227.8" text-anchor="middle" font-size="80.8" fill="#6b7280"><tspan x="499.5" y="227.8">2. lift, then draw the</tspan><tspan x="499.5" y="326.4">middle horizontal héng</tspan><tspan x="499.5" y="425">stroke, the shortest of</tspan><tspan x="499.5" y="523.5">the three</tspan></text></svg><rect x="336" y="42" width="150" height="202.89" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="202.89" viewBox="-5 -813 1009 1364.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M123 743L879 743L879 667L123 667L123 743ZM187 416L801 416L801 341L187 341L187 416ZM65 69L934 69L934 -7L65 -7L65 69Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M172 704 L224 705 L276 704 L329 705 L381 704 L433 705 L485 704 L537 705 L589 704 L642 705 L694 704 L746 705 L798 704" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M212 378 L258 378 L303 378 L349 378 L394 378 L440 378 L485 378 L531 378 L576 378 L622 378 L667 378 L713 378 L758 378" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M74 31 L74 31" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M74 31 L145 30 L216 31 L287 30 L358 31 L429 30 L500 31 L571 30 L642 31 L713 30 L784 31 L855 30 L926 31" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="926" cy="31" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="499.5" y="227.8" text-anchor="middle" font-size="80.8" fill="#6b7280"><tspan x="499.5" y="227.8">3. lift, then draw the</tspan><tspan x="499.5" y="326.4">bottom horizontal héng</tspan><tspan x="499.5" y="425">stroke, the longest of</tspan><tspan x="499.5" y="523.5">the three</tspan></text></svg><text x="16" y="257.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 三.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="270.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="282.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
