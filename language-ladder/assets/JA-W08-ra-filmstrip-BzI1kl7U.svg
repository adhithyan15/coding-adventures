<svg xmlns="http://www.w3.org/2000/svg" width="502" height="328.71" viewBox="0 0 502 328.71" role="img" aria-label="How to write ら: 2 strokes · 1 pen lift · 3 movements"><title>Writing ら</title><desc>3 frames; frame N shows movements 1 to N of ら (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03089.svg, hiragana ら (U+3089 HIRAGANA LETTER RA), two stroke paths kvg:03089-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03089.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short top stroke drawn from left to right, ending in a small turn down that the print glyph does not show; s2 starts on the left below it, runs down, turns at its foot without lifting, rises to the right over the top of the bowl, rounds its right side and finishes at the lower left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="502" height="328.71" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="222.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.71" viewBox="108 -854 814 1208.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M335 784Q367 774 418.5 762Q470 750 527.5 738.5Q585 727 637 718.5Q689 710 722 707L703 630Q675 634 634.5 641Q594 648 548 657Q502 666 457 675.5Q412 685 375 693.5Q338 702 315 708L335 784ZM313 602Q308 576 302.5 538.5Q297 501 291 460Q285 419 280 382Q275 345 271 321Q344 384 425.5 413.5Q507 443 597 443Q674 443 731 415.5Q788 388 820 340.5Q852 293 852 234Q852 167 821.5 112.5Q791 58 726.5 21Q662 -16 562 -31.5Q462 -47 322 -35L298 47Q457 28 561 48.5Q665 69 716.5 118.5Q768 168 768 236Q768 276 745 307Q722 338 682.5 355.5Q643 373 592 373Q494 373 414.5 337.5Q335 302 282 239Q271 226 264 213.5Q257 201 252 189L178 207Q184 235 190 274.5Q196 314 202 359.5Q208 405 213.5 451Q219 497 223 539.5Q227 582 229 613L313 602Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M362 737 L362 737" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M362 737 L424 722 L486 708 L549 696 L611 684 L674 673" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="674" cy="673" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="515" y="252.2" text-anchor="middle" font-size="65.2" fill="#6b7280"><tspan x="515" y="252.2">1. draw the top stroke</tspan><tspan x="515" y="331.7">to the right</tspan></text></svg><rect x="176" y="42" width="150" height="222.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="222.71" viewBox="108 -854 814 1208.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M335 784Q367 774 418.5 762Q470 750 527.5 738.5Q585 727 637 718.5Q689 710 722 707L703 630Q675 634 634.5 641Q594 648 548 657Q502 666 457 675.5Q412 685 375 693.5Q338 702 315 708L335 784ZM313 602Q308 576 302.5 538.5Q297 501 291 460Q285 419 280 382Q275 345 271 321Q344 384 425.5 413.5Q507 443 597 443Q674 443 731 415.5Q788 388 820 340.5Q852 293 852 234Q852 167 821.5 112.5Q791 58 726.5 21Q662 -16 562 -31.5Q462 -47 322 -35L298 47Q457 28 561 48.5Q665 69 716.5 118.5Q768 168 768 236Q768 276 745 307Q722 338 682.5 355.5Q643 373 592 373Q494 373 414.5 337.5Q335 302 282 239Q271 226 264 213.5Q257 201 252 189L178 207Q184 235 190 274.5Q196 314 202 359.5Q208 405 213.5 451Q219 497 223 539.5Q227 582 229 613L313 602Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M362 737 L424 722 L486 708 L549 696 L611 684 L674 673" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M266 569 L266 569" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M266 569 L259 504 L250 439 L242 374 L238 309 L230 245" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="230" cy="245" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="515" y="252.2" text-anchor="middle" font-size="65.2" fill="#6b7280"><tspan x="515" y="252.2">2. run down the left</tspan><tspan x="515" y="331.7">side</tspan></text></svg><rect x="336" y="42" width="150" height="222.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="222.71" viewBox="108 -854 814 1208.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M335 784Q367 774 418.5 762Q470 750 527.5 738.5Q585 727 637 718.5Q689 710 722 707L703 630Q675 634 634.5 641Q594 648 548 657Q502 666 457 675.5Q412 685 375 693.5Q338 702 315 708L335 784ZM313 602Q308 576 302.5 538.5Q297 501 291 460Q285 419 280 382Q275 345 271 321Q344 384 425.5 413.5Q507 443 597 443Q674 443 731 415.5Q788 388 820 340.5Q852 293 852 234Q852 167 821.5 112.5Q791 58 726.5 21Q662 -16 562 -31.5Q462 -47 322 -35L298 47Q457 28 561 48.5Q665 69 716.5 118.5Q768 168 768 236Q768 276 745 307Q722 338 682.5 355.5Q643 373 592 373Q494 373 414.5 337.5Q335 302 282 239Q271 226 264 213.5Q257 201 252 189L178 207Q184 235 190 274.5Q196 314 202 359.5Q208 405 213.5 451Q219 497 223 539.5Q227 582 229 613L313 602Z" fill="#e0ddd6" fill-rule="nonzero"/><path clas