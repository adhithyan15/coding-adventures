<svg xmlns="http://www.w3.org/2000/svg" width="502" height="298.86" viewBox="0 0 502 298.86" role="img" aria-label="How to write ఆ: one unbroken stroke · 3 movements"><title>Writing ఆ</title><desc>3 frames; frame N shows movements 1 to N of ఆ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Hojaswani LUCIDA and Physics classes, practice Telugu letters with strokes (ఆ letter), 00:00–00:10 (YouTube, 15 September 2024); drawn in one stroke, with the right lobe turned clockwise, after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 1 (ఆ): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://www.youtube.com/watch?v=vXdrj1pP6q0&gt;. Source note on variation: The demonstration writes the hooked bowl and the rounded right lobe as two runs, starting the second at the bar&apos;s end and turning the lobe counterclockwise; this ductus used to lift there, but a part shown on its own in a demonstration is not evidence of a lift. In HP Labs India&apos;s online Telugu handwriting data (the LipiTk 4.0 Telugu isolated-character recognizer, trained on hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), 104 of the 105 stored prototypes of ఆ (99%) are one pen-down stroke. All 104 begin by turning the left lobe counterclockwise, as the demonstration does; 91 of them (88%) cross the top of the right lobe moving right, that is clockwise; and all 104 finish moving left, along the bar. So this ductus overrides the demonstration&apos;s lift, the start of its second run and the lobe&apos;s direction: from the bowl&apos;s right side the pen crosses up into the right lobe, turns it clockwise, comes back down through the crossing and draws the bar leftward. The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Telugu handwriting may vary.</desc><rect x="0" y="0" width="502" height="298.86" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="155.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="155.36" viewBox="-34 -570 870 901.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 -12Q320 -12 246 9.5Q172 31 126 70Q80 109 58 161Q36 213 36 273Q36 345 61 396Q86 447 128.5 473.5Q171 500 225 500Q265 500 294.5 484.5Q324 469 340.5 440.5Q357 412 357 373Q357 333 340 301.5Q323 270 289 252.5Q255 235 202 235Q152 235 115 258Q78 281 58 304L82 366Q90 355 104.5 340.5Q119 326 142 315.5Q165 305 197 305Q237 305 257.5 322Q278 339 278 369Q278 398 262 413.5Q246 429 220 429Q173 429 144 390Q115 351 115 280L115 271Q115 232 130 195.5Q145 159 180 130Q215 101 274.5 84Q334 67 423 67Q502 67 556.5 79.5Q611 92 639 115.5Q667 139 667 171Q667 191 654.5 206Q642 221 623 231.5Q604 242 586 248Q532 260 496 293Q460 326 460 378Q460 417 479.5 444Q499 471 532.5 485.5Q566 500 607 500Q663 500 698 480Q733 460 749.5 428Q766 396 766 360Q766 316 745.5 282Q725 248 691 225Q668 209 645.5 200Q623 191 600 187.5Q577 184 550 184L303 184L303 258L611 258Q631 269 647.5 282.5Q664 296 673.5 314.5Q683 333 683 357Q683 386 665.5 407Q648 428 610 428Q577 428 558.5 413Q540 398 540 373Q540 351 554.5 334.5Q569 318 593 306.5Q617 295 645 285Q671 277 695 262Q719 247 734.5 224Q750 201 750 169Q750 139 737 107Q724 75 689.5 48Q655 21 590.5 4.5Q526 -12 423 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M144 256 L144 256" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-