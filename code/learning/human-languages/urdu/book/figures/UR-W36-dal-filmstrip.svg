<svg xmlns="http://www.w3.org/2000/svg" width="342" height="382.01" viewBox="0 0 342 382.01" role="img" aria-label="How to write د: one unbroken stroke · 2 movements"><title>Writing د</title><desc>2 frames; frame N shows movements 1 to N of د (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Dāl, re, and wāw, independent د handwriting animation and Dāl instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/dal-re-and-waw/&gt;. Source note on variation: The independent-form animation shows one uninterrupted stroke from the upper tip through the folded shoulder and leftward baseline. The adjacent prose says independent dāl folds over itself, or forms at most a 90-degree angle, and does not drop below the line; final dāl rises before descending. Naskh folds both forms more sharply than Nastaliq. This learner path covers the independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The provenance remains Urdu-specific rather than borrowing the separate Persian or Arabic د sources.</desc><rect x="0" y="0" width="342" height="382.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="251.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="251.01" viewBox="-36 -468 478 799.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L270 350" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="342" cy="100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">1. begin at the</tspan><tspan x="203" y="225">independent form&apos;s upper</tspan><tspan x="203" y="271.8">tip and descend through</tspan><tspan x="203" y="318.5">the folded shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="251.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="251.01" viewBox="-36 -468 478 799.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100 L342 100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M342 100 L320 90 L290 75 L250 60 L210 50 L170 40 L130 40 L90 50 L60 65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="60" cy="65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">2. turn left along the</tspan><tspan x="203" y="225">baseline without lifting</tspan></text></svg><text x="16" y="306.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Dāl, re, and wāw,</text><text x="16" y="318.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">independent د handwriting animation and Dāl instructions</text><text x="16" y="331.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Northwestern University Libraries Open Textbook, 2026)</text><text x="16" y="343.51" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="356.01" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
