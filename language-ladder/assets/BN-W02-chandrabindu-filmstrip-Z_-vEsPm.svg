<svg xmlns="http://www.w3.org/2000/svg" width="342" height="342.52" viewBox="0 0 342 342.52" role="img" aria-label="How to write ঁ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ঁ</title><desc>2 frames; frame N shows movements 1 to N of ঁ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 48 (ঁ, chandrabindu; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 190 of the 194 stored prototypes of the chandrabindu are two pen-down strokes: the bowl first, then the dot. 178 of those 190 start the bowl on the left, 182 turn it counterclockwise (down, round and up), and 173 end it on the right; 180 place the dot within the bowl&apos;s width. The traces do not settle which way the dot is turned, so the path makes no claim about it and draws it as a short touch. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="342" height="342.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="167.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="167.77" viewBox="-245 -946 492 550.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 790Q-22 790 -33 803.5Q-44 817 -44 833Q-44 849 -33 862.5Q-22 876 0 876Q23 876 33.5 862.5Q44 849 44 833Q44 817 33.5 803.5Q23 790 0 790ZM4 685Q-83 685 -125 735Q-167 785 -175 860L-106 869Q-101 814 -77 782.5Q-53 751 0 751Q96 751 107 870L177 861Q170 785 129.5 735Q89 685 4 685Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-140 862 L-140 862" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-140 862 L-132 800 L-90 745 L-30 720 L30 720 L90 745 L132 800 L142 862" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="142" cy="862" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="1" y="-505.6" text-anchor="middle" font-size="39.4" fill="#6b7280"><tspan x="1" y="-505.6">1. draw the bowl from</tspan><tspan x="1" y="-457.5">its left tip, down,</tspan><tspan x="1" y="-409.5">round and up</tspan></text></svg><rect x="176" y="60.75" width="150" height="167.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="167.77" viewBox="-245 -946 492 550.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 790Q-22 790 -33 803.5Q-44 817 -44 833Q-44 849 -33 862.5Q-22 876 0 876Q23 876 33.5 862.5Q44 849 44 833Q44 817 33.5 803.5Q23 790 0 790ZM4 685Q-83 685 -125 735Q-167 785 -175 860L-106 869Q-101 814 -77 782.5Q-53 751 0 751Q96 751 107 870L177 861Q170 785 129.5 735Q89 685 4 685Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-140 862 L-132 800 L-90 745 L-30 720 L30 720 L90 745 L132 800 L142 862" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M-12 850 L-12 850" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-12 850 L0 833 L12 816" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="12" cy="816" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="1" y="-505.6" text-anchor="middle" font-size="39.4" fill="#6b7280"><tspan x="1" y="-505.6">2. lift, then place the</tspan><tspan x="1" y="-457.5">dot</tspan></text></svg><text x="16" y="241.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic</text><text x="16" y="254.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Character Recognizers 4.0, Bangla recognizer, class 48 (ঁ,</text><text x="16" y="266.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">chandrabindu; user manual Table 4): stored</text><text x="16" y="279.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers</text><text x="16" y="291.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(MIT licence, 2012)</text><text x="16" y="304.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="316.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
