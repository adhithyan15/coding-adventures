<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.98" viewBox="0 0 822 321.98" role="img" aria-label="How to write ゅ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ゅ</title><desc>5 frames; frame N shows movements 1 to N of ゅ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana ゆ stroke order animation.gif, hiragana ゆ, 30 frames, 3.0 seconds (Wikimedia Commons, 1 October 2009); the Unicode Standard names U+3085 HIRAGANA LETTER SMALL YU, alias small yu &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%86_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws full-size ゆ in two pen-down runs with one lift: the left stem, high shoulder and clockwise loop first, then a restart above the loop descending through its center. Unicode separately identifies U+3085 as small yu. This learner path therefore preserves the source&apos;s two-run movement while scaling and fitting it to the bundled Noto Sans JP small ゅ outline; the cited animation demonstrates ゆ rather than a separately animated ゅ, so the size adaptation is explicit rather than presented as independent handwriting evidence.</desc><rect x="0" y="0" width="822" height="321.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="215.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.98" viewBox="126 -685 800 1151.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M303 567Q300 558 297 547Q294 536 291 527Q287 507 282 477Q277 447 273 413Q269 379 267 347Q265 315 266 291Q296 362 349 412.5Q402 463 468.5 490.5Q535 518 604 518Q687 518 743 488Q799 458 827.5 407.5Q856 357 856 295Q856 