d="M76 163 L171 136 L286 153 L363 148 L556 165 L634 148 L789 161 L865 155 L927 128" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M526 547 L526 547" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M526 547 L538 489 L531 41 L552 -65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="552" cy="-65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="301.8" text-anchor="middle" font-size="81.8" fill="#6b7280"><tspan x="501.5" y="301.8">4. lift, then draw the</tspan><tspan x="501.5" y="401.6">vertical down through it</tspan></text></svg><text x="16" y="281.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 车.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="294.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="306.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
