<svg xmlns="http://www.w3.org/2000/svg" width="662" height="290.2" viewBox="0 0 662 290.2" role="img" aria-label="How to write ਠ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਠ</title><desc>4 frames; frame N shows movements 1 to N of ਠ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਠ (thathaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 535, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L535&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਠ in two pen-down strokes: the headline from left to right; then from the top of the short stem down, counterclockwise round the bowl and back to where it began. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਠ, each by a different non-native copyist; only counts and shares are cited. 70% (14 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 100% (20 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="290.2" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="184.2" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.2" viewBox="-77 -692 814 999.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M330 0Q251 0 184.5 18.5Q118 37 78.5 81Q39 125 39 202Q39 249 65.5 295.5Q92 342 147.5 380Q203 418 290 438L290 551L-7 551L-7 622L667 622L667 551L370 551L370 438Q458 418 513 380.5Q568 343 594.5 296Q621 249 621 202Q621 130 585 85.5Q549 41 483.5 20.5Q418 0 330 0ZM330 73Q365 73 402 77.5Q439 82 470.5 95Q502 108 521.5 133Q541 158 541 200Q541 258 487.5 306.5Q434 355 330 378Q224 354 171.5 306Q119 258 119 199Q119 157 138.5 132Q158 107 190 94.5Q222 82 259 77.5Q296 73 330 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L133 586 L172 586 L211 586 L250 586 L289 586 L328 586 L368 586 L407 586 L446 586 L485 586 L524 586 L564 586 L603 586 L642 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="642" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="330" y="205.2" text-anchor="middle" font-size="65.2" fill="#6b7280"><tspan x="330" y="205.2">1. draw the headline</tspan><tspan x="330" y="284.7">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="184.2" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="184.2" viewBox="-77 -692 814 999.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M330 0Q251 0 184.5 18.5Q118 37 78.5 81Q39 125 39 202Q39 249 65.5 295.5Q92 342 147.5 380Q203 418 290 438L290 551L-7 551L-7 622L667 622L667 551L370 551L370 438Q458 418 513 380.5Q568 343 594.5 296Q621 249 621 202Q621 130 585 85.5Q549 41 483.5 20.5Q418 0 330 0ZM330 73Q365 73 402 77.5Q439 82 470.5 95Q502 108 521.5 133Q541 158 541 200Q541 258 487.5 306.5Q434 355 330 378Q224 354 171.5 306Q119 258 119 199Q119 157 138.5 132Q158 107 190 94.5Q222 82 259 77.5Q296 73 330 73Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L133 586 L172 586 L211 586 L250 586 L289 586 L328 586 L368 586 L407 586 L446 586 L485 586 L524 586 L564 586 L603 586 L642 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M332 586 L332 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M332 586 L331 544 L330 501 L330 458 L330 415" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="330" cy="415" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="330" y="205.2" text-anchor="middle" font-size="65.2" fill="#6b7280"><tspan x="330" y="205.2">2. lift, then come down</tspan><tspan x="330" y="284.7">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="184.2" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="184.2" viewBox="-77 -692 814 999.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M330 0Q251 0 184.5 18.5Q118 37 78.5 81Q39 125 39 202Q39 249 65.5 295.5Q92 342 147.5 380Q203 418 290 43