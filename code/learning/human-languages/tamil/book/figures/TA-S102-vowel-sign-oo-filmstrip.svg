<svg xmlns="http://www.w3.org/2000/svg" width="998" height="386.51" viewBox="0 0 998 386.51" role="img" aria-label="How to write ோ: 2 parts, ே, ா, one after another"><title>Writing ோ</title><desc>2 parts written one after another: ே, ா (tamil). The parts are in the order the hand writes them, which is not always the order they are typed: a vowel sign written to the left of its consonant comes before it. Each vowel sign is drawn on its own, without the consonant it attaches to. Each part has its own group of frames; frame N of a group shows movements 1 to N of that part, the movement being added drawn in ink over the finished part, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Each part is drawn at its own scale from its own cited stroke order, so the strip does not show how large the parts are next to each other, how far apart they sit, or any join between them. Stroke order: ே: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 42 (ே, ee sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;; ா: HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 36 (ா, aa sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source notes on variation: ே: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 105 of the 108 stored prototypes of the ee sign (97%) are one pen-down stroke. 104 of those 105 turn counterclockwise: the pen starts in the upper half (98), inside the small upper curl, circles it, sweeps left and down the big curve, and curls up into the lower loop, ending in the lower half (102). The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. Handwriting varies by writer. ா: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 189 of the 217 stored prototypes of the aa sign (87%) are one pen-down stroke. In 135 of those 189 the pen starts on the left, partway down, and first moves down; 154 end at the foot of the right upright. So the left upright is drawn down, climbed back to the top bar, and the right upright comes last, without lifting. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline, whose top bar runs a little past the right upright. Handwriting varies by writer.</desc><rect x="0" y="0" width="998" height="386.51" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 parts, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Part 1 of 2 — one unbroken stroke · 3 movements</text><rect x="16" y="61" width="150" height="236.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="236.51" viewBox="-14 -913 777 1225.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M451 -12Q370 -12 298.5 15.5Q227 43 172.5 97Q118 151 87 231Q56 311 56 415Q56 519 88.5 599Q121 679 178.5 733.5Q236 788 312 815.5Q388 843 475 843Q535 843 584.5 825Q634 807 663.5 768.5Q693 730 693 667Q693 615 671 578.5Q649 542 611 523Q573 504 524 504Q473 504 437 523.5Q401 543 382 577.5Q363 612 363 656Q363 700 382 735Q401 770 427 792L484 774Q462 749 452.5 722Q443 695 443 665Q443 620 466 597Q489 574 526 574Q567 574 589.5 600.5Q612 627 612 667Q612 703 594.5 726Q577 749 547.5 760.5Q518 772 481 772Q470 772 455 772Q440 772 424 770Q367 761 316.5 735.5Q266 710 226.5 666Q187 622 164.5 560.5Q142 499 142 418Q142 339 162 277.5Q182 216 217.5 171.5Q253