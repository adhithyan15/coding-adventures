<svg xmlns="http://www.w3.org/2000/svg" width="502" height="284.46" viewBox="0 0 502 284.46" role="img" aria-label="How to write い: 2 strokes · 1 pen lift · 3 movements"><title>Writing い</title><desc>3 frames; frame N shows movements 1 to N of い (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03044.svg, hiragana い (U+3044 HIRAGANA LETTER I), two stroke paths kvg:03044-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03044.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 starts high on the left, comes down, curves round at its foot and flicks up to the right without lifting; s2 starts at the top of the short right stroke and runs down and slightly to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="502" height="284.46" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="178.46" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="178.46" viewBox="56 -770 934 1111.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M223 698Q221 686 219.5 668Q218 650 216.5 632Q215 614 215 601Q214 570 214.5 530.5Q215 491 216.5 448.5Q218 406 222 364Q230 281 249 218.5Q268 156 295.5 121Q323 86 358 86Q377 86 395 103.5Q413 121 429.5 150.5Q446 180 459.5 216.5Q473 253 482 290L545 219Q515 134 484.5 84.5Q454 35 422.5 13Q391 -9 357 -9Q310 -9 266 25.5Q222 60 190 137.5Q158 215 144 344Q139 388 136.5 439Q134 490 133.5 536Q133 582 133 611Q133 628 132 655Q131 682 126 700L223 698ZM744 670Q771 636 795.5 590.5Q820 545 840.5 493.5Q861 442 877.5 387Q894 332 904.5 277.5Q915 223 920 173L840 140Q834 208 819 278.5Q804 349 782 415.5Q760 482 731 541Q702 600 666 643L744 670Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M174 659 L174 659" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M174 659 L174 592 L174 526 L174 459 L178 393 L185 327 L196 261 L213 197 L237 135 L278 83 L330 43" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="330" cy="43" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="523" y="223.8" text-anchor="middle" font-size="74.8" fill="#6b7280"><tspan x="523" y="223.8">1. come down the left</tspan><tspan x="523" y="315.1">side</tspan></text></svg><rect x="176" y="42" width="150" height="178.46" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="178.46" viewBox="56 -770 934 1111.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M223 698Q221 686 219.5 668Q218 650 216.5 632Q215 614 215 601Q214 570 214.5 530.5Q215 491 216.5 448.5Q218 406 222 364Q230 281 249 218.5Q268 156 295.5 121Q323 86 358 86Q377 86 395 103.5Q413 121 429.5 150.5Q446 180 459.5 216.5Q473 253 482 290L545 219Q515 134 484.5 84.5Q454 35 422.5 13Q391 -9 357 -9Q310 -9 266 25.5Q222 60 190 137.5Q158 215 144 344Q139 388 136.5 439Q134 490 133.5 536Q133 582 133 611Q133 628 132 655Q131 682 126 700L223 698ZM744 670Q771 636 795.5 590.5Q820 545 840.5 493.5Q861 442 877.5 387Q894 332 904.5 277.5Q915 223 920 173L840 140Q834 208 819 278.5Q804 349 782 415.5Q760 482 731 541Q702 600 666 643L744 670Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M174 659 L174 592 L174 526 L174 459 L178 393 L185 327 L196 261 L213 197 L237 135 L278 83 L330 43 L330 43" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M330 43 L394 52 L442 97 L476 153 L498 215" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="498" cy="215" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="523" y="223.8" text-anchor="middle" font-size="74.8" fill="#6b7280"><tspan x="523" y="223.8">2. curve round and flick</tspan><tspan x="523" y="315.1">up to the right</tspan></text></svg><rect x="336" y="42" width="150" height="178.46" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="178.46" viewBox="56 -770 934 1111.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M223 698Q221 686 219.5 668Q218 650 216.5 632Q215 614 215 601Q214 570 214.5 530.5Q215 491 216.5 448.5Q218 406 222 364Q230 281 249 218.5Q268 156 295.5 121Q323 86 358 86Q377 86 395 103.5Q413 121 429.5 150.5Q446 180 459.5 216.5Q473 253 482 290L545 219Q515 134 484.5 84.5Q454 35 422.5 13Q391 -9 357 -9Q310 -9 266 25.5Q222 60 190 137.5Q158 215 144 344Q139 388 136.5 439Q134 490 133.5 536Q133 582 133 611Q133 628 132 655Q131 682 126 700L223 698ZM744 670Q771 636 795.5 590.5Q820 545 840.5 493.5Q861 442 877.5 387Q894 332 904.5 277.5Q915 223 920 173L840 140Q834 208 819 278.5Q804 349 782 415.5Q760 482 731 541Q702 600 666 643L744 670Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M174 659 L174 592 L174 526 L174 459 L178 393 L185 327 L196 261 L213 197 L237 135 L278 83 L330 43 L394 52 L442 97 L476 153 L498 215" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M726 627 L726 627" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M726 627 L759 570 L789 511 L813 450 L834 388 L851 324 L865 260 L874 195" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="874" cy="195" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="523" y="223.8" text-anchor="middle" font-size="74.8" fill="#6b7280"><tspan x="523" y="223.8">3. draw the short stroke</tspan><tspan x="523" y="315.1">down</tspan></text></svg><text x="16" y="233.46" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/03044.svg, hiragana い (U+3044 HIRAGANA LETTER I), two</text><text x="16" y="245.96" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">stroke paths kvg:03044-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="258.46" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
