<svg xmlns="http://www.w3.org/2000/svg" width="502" height="324.13" viewBox="0 0 502 324.13" role="img" aria-label="How to write प: 3 strokes · 2 pen lifts · 3 movements"><title>Writing प</title><desc>3 frames; frame N shows movements 1 to N of प (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-प-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%AA-order.gif&gt;. Source note on variation: The 19-frame animation shows three ordered pen-down runs: frames 2–10 descend the left stem, curve right around the lower bowl, and rise to its upper-right junction without lifting; frames 11–13 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 14–17 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 10 and 13 mark the first two run endings before the one-second completed frame. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VII, p. 35, independently shows the same left stem-and-bowl, right stem, and headline buildup and directions. This learner path follows that sourced three-run form and fits its bowl to Noto Sans Devanagari; everyday handwriting may join or simplify the bowl differently.</desc><rect x="0" y="0" width="502" height="324.13" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="218.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="218.13" viewBox="-70 -692 723 1051.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M479 551L479 0L398 0L398 244L417 217Q392 193 352.5 177Q313 161 266 161Q207 161 165 183Q123 205 101 249.5Q79 294 79 360L79 551L0 551L0 622L583 622L583 551L479 551ZM398 551L160 551L160 357Q160 314 172 286.5Q184 259 207.5 245.5Q231 232 264 232Q308 232 348.5 256.5Q389 281 414 315L398 263L398 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 551 L120 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 551 L120 480 L120 410 L120 355 L128 310 L145 270 L170 238 L205 215 L245 202 L285 202 L325 215 L360 238 L385 265 L402 295 L408 320" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="408" cy="320" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="291.5" y="197.9" text-anchor="middle" font-size="57.9" fill="#6b7280"><tspan x="291.5" y="197.9">1. descend the left stem</tspan><tspan x="291.5" y="268.5">and curve right around</tspan><tspan x="291.5" y="339.2">the lower bowl</tspan></text></svg><rect x="176" y="42" width="150" height="218.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="218.13" viewBox="-70 -692 723 1051.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M479 551L479 0L398 0L398 244L417 217Q392 193 352.5 177Q313 161 266 161Q207 161 165 183Q123 205 101 249.5Q79 294 79 360L79 551L0 551L0 622L583 622L583 551L479 551ZM398 551L160 551L160 357Q160 314 172 286.5Q184 259 207.5 245.5Q231 232 264 232Q308 232 348.5 256.5Q389 281 414 315L398 263L398 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 551 L120 480 L120 410 L120 355 L128 310 L145 270 L170 238 L205 215 L245 202 L285 202 L325 215 L360 238 L385 265 L402 295 L408 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M438 551 L438 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M438 551 L438 475 L438 395 L438 315 L438 235 L438 155 L438 75 L438 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="438" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="291.5" y="197.9" text-anchor="middle" font-size="57.9" fill="#6b7280"><tspan x="291.5" y="197.9">2. lift, then descend</tspan><tspan x="291.5" y="268.5">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="218.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="218.13" viewBox="-70 -692 723 1051.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M479 551L479 0L398 0L398 244L417 217Q392 193 352.5 177Q313 161 266 161Q207 161 165 183Q123 205 101 249.5Q79 294 79 360L79 551L0 551L0 622L583 622L583 551L479 551ZM398 551L160 551L160 357Q160 314 172 286.5Q184 259 207.5 245.5Q231 232 264 232Q308 232 348.5 256.5Q389 281 414 315L398 263L398 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 551 L120 480 L120 410 L120 355 L128 310 L145 270 L170 238 L205 215 L245 202 L285 202 L325 215 L360 238 L385 265 L402 295 L408 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M438 551 L438 475 L438 395 L438 315 L438 235 L438 155 L438 75 L438 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L578 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="578" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="291.5" y="197.9" text-anchor="middle" font-size="57.9" fill="#6b7280"><tspan x="291.5" y="197.9">3. lift, then draw the</tspan><tspan x="291.5" y="268.5">shirorekha left-to-right</tspan></text></svg><text x="16" y="273.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-प-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="285.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="298.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
