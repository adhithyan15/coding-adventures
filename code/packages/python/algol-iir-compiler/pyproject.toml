[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-algol-iir-compiler"
version = "0.1.0"
description = "ALGOL 60 to InterpreterIR compiler for the generic VM/JIT/AOT backend chain"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
keywords = ["algol", "compiler", "interpreter-ir", "vm", "jit", "aot", "llvm"]
dependencies = [
    "coding-adventures-lexer",
    "coding-adventures-parser",
    "coding-adventures-algol-parser",
    "coding-adventures-algol-type-checker",
    "coding-adventures-interpreter-ir",
    "coding-adventures-vm-core",
]

[tool.uv.sources]
coding-adventures-lexer = { path = "../lexer", editable = true }
coding-adventures-parser = { path = "../parser", editable = true }
coding-adventures-algol-parser = { path = "../algol-parser", editable = true }
coding-adventures-algol-type-checker = { path = "../algol-type-checker", editable = true }
coding-adventures-interpreter-ir = { path = "../interpreter-ir", editable = true }
coding-adventures-vm-core = { path = "../vm-core", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/algol_iir_compiler"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=algol_iir_compiler --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/algol_iir_compiler"]

[tool.coverage.report]
fail_under = 85
show_missing = true
