[package]
name = "smart-home-mqtt-integration"
version = "0.1.0"
edition = "2021"
description = "MQTT broker host and Home Assistant discovery adapter for the normalized smart-home runtime"
license = "MIT"

[dependencies]
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smart-home-core = { path = "../smart-home-core" }
smart-home-event-streams = { path = "../smart-home-event-streams" }
smart-home-runtime = { path = "../smart-home-runtime" }
zeroize = { version = "1", features = ["derive"] }
