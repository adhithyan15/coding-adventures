<svg xmlns="http://www.w3.org/2000/svg" width="502" height="268.58" viewBox="0 0 502 268.58" role="img" aria-label="How to write വ: one unbroken stroke · 3 movements"><title>Writing വ</title><desc>3 frames; frame N shows movements 1 to N of വ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for വ in data/VA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/VA.png&gt;. Source note on variation: Thooval&apos;s VA.png starts at the left foot (green), climbs clockwise over the tall arch, comes down to the line, runs right along the base and climbs the upright to finish at its top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record വ as one stroke from the lower left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (28 of 31) and end at the upper right (31 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms.</desc><rect x="0" y="0" width="502" height="268.58" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="150.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="150.08" viewBox="-31 -636 988 988.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M341 566Q415 566 470.5 544Q526 522 562.5 483Q599 444 617 392Q635 340 635 281Q635 228 622 187Q609 146 588 113.5Q567 81 541 53L517 70L801 70L801 554L887 554L887 0L467 0L433 59Q462 79 488 108Q514 137 530 177.5Q546 218 546 271Q546 337 522 387Q498 437 451.5 465.5Q405 494 337 494Q271 494 224.5 464.5Q178 435 153 385Q128 335 128 273Q128 221 143 180Q158 139 185.5 108Q213 77 250 54L200 -9Q157 16 120.5 55.5Q84 95 61.5 150.5Q39 206 39 277Q39 339 58.5 391.5Q78 444 116.5 483Q155 522 211.5 544Q268 566 341 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M191 47 L191 47" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M191 47 L143 96 L107 155 L89 221 L87 290 L95 358 L122 420 L168 471 L226 508 L292 525 L361 527 L429 518 L491 488 L540 440 L573 380 L587 313 L587 244 L574 177 L542 116 L511 55" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="511" cy="55" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="463" y="228.2" text-anchor="middle" font-size="79.2" fill="#6b7280"><tspan x="463" y="228.2">1. climb clockwise over</tspan><tspan x="463" y="324.8">the arch</tspan></text></svg><rect x="176" y="42" width="150" height="150.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="150.08" viewBox="-31 -636 988 988.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M341 566Q415 566 470.5 544Q526 522 562.5 483Q599 444 617 392Q635 340 635 281Q635 228 622 187Q609 146 588 113.5Q567 81 541 53L517 70L801 70L801 554L887 554L887 0L467 0L433 59Q462 79 488 108Q514 137 530 177.5Q546 218 546 271Q546 337 522 387Q498 437 451.5 465.5Q405 494 337 494Q271 494 224.5 464.5Q178 435 153 385Q128 335 128 273Q128 221 143 180Q158 139 185.5 108Q213 77 250 54L200 -9Q157 16 120.5 55.5Q84 95 61.5 150.5Q39 206 39 277Q39 339 58.5 391.5Q78 444 116.5 483Q155 522 211.5 544Q268 566 341 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M191 47 L143 96 L107 155 L89 221 L87 290 L95 358 L122 420 L168 471 L226 508 L292 525 L361 527 L429 518 L491 488 L540 440 L573 380 L587 313 L587 244 L574 177 L542 116 L511 55 L511 55" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M511 55 L573 35 L640 35 L707 35 L774 35 L839 47" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="839" cy="47" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="463" y="228.2" text-anchor="middle" font-size="79.2" fill="#6b7280"><tspan x="463" y="228.2">2. run right along the</tspan><tspan x="463" y="324.8">base</tspan></text></svg><rect x="336" y="42" width="150" height="150.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="150.08" viewBox="-31 -636 988 988.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M341 566Q415 566 470.5 544Q526 522 562.5 483Q599 444 617 392Q635 340 635 281Q635 228 622 187Q609 146 588 113.5Q567 81 541 53L517 70L801 70L801 554L887 554L887 0L467 0L433 59Q462 79 488 108Q514 137 530 177.5Q546 218 546 271Q546 337 522 387Q498 437 451.5 465.5Q405 494 337 494Q271 494 224.5 464.5Q178 435 153 385Q128 335 128 273Q128 221 143 180Q158 139 185.5 108Q213 77 250 54L200 -9Q157 16 120.5 55.5Q84 95 61.5 150.5Q39 206 39 277Q39 339 58.5 391.5Q78 444 116.5 483Q155 522 211.5 544Q268 566 341 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class