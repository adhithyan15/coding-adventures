<svg xmlns="http://www.w3.org/2000/svg" width="678" height="389.67" viewBox="0 0 678 389.67" role="img" aria-label="How to write શ સ: 2 letters, શ, સ, one after another"><title>Writing શ સ</title><desc>2 letters written one after another: શ, સ (gujarati). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: શ: t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, શ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;; સ: t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, સ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source notes on variation: શ: The teaching app animates શ as two ordered pen-down runs. Its first SVG path begins at the upper right, circles the small upper loop, then continues through the broad lower body and into its lower-right tail. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the small upper loop, broad lower body, tail, tall spine, and lower foot, but its printed body is wider and more angular and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s loop-and-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loop, body, tail, spine, foot, and terminals differently. સ: The teaching app animates સ as two ordered pen-down runs. Its first SVG path begins at the upper right, circles the rounded upper loop, descends through the left body, then sweeps across the long right shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the rounded upper loop, left body, long right shoulder, tall spine, and lower foot, but its printed loop is wider and more angular and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s loop-and-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loop, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="678" height="389.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — 2 strokes · 1 pen lift · 2</text><text x="16" y="69" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">movements</text><rect x="16" y="76" width="150" height="216.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="76" width="150" height="216.92" viewBox="-39 -673 778 1125.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M651 0Q608 0 580 9.5Q552 19 534 37Q517 54 509.5 79Q502 104 502 148L502 603L583 5