<svg xmlns="http://www.w3.org/2000/svg" width="502" height="355.01" viewBox="0 0 502 355.01" role="img" aria-label="How to write ே: one unbroken stroke · 3 movements"><title>Writing ே</title><desc>3 frames; frame N shows movements 1 to N of ே (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 42 (ே, ee sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 105 of the 108 stored prototypes of the ee sign (97%) are one pen-down stroke. 104 of those 105 turn counterclockwise: the pen starts in the upper half (98), inside the small upper curl, circles it, sweeps left and down the big curve, and curls up into the lower loop, ending in the lower half (102). The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="355.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="236.51" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="236.51" viewBox="-14 -913 777 1225.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M451 -12Q370 -12 298.5 15.5Q227 43 172.5 97Q118 151 87 231Q56 311 56 415Q56 519 88.5 599Q121 679 178.5 733.5Q236 788 312 815.5Q388 843 475 843Q535 843 584.5 825Q634 807 663.5 768.5Q693 730 693 667Q693 615 671 578.5Q649 