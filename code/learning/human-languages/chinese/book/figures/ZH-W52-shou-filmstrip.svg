lass="ductus__done" d="M817 799 L483 746 L140 724" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M163 537 L163 537" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M163 537 L371 519 L500 534 L605 520 L826 542" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="826" cy="542" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="300.6" text-anchor="middle" font-size="83.6" fill="#6b7280"><tspan x="501.5" y="300.6">2. lift, then draw the</tspan><tspan x="501.5" y="402.6">middle horizontal</tspan></text></svg><rect x="336" y="42" width="150" height="207.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="207.5" viewBox="-20 -909 1043 1442.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M798 839L853 778Q786 758 699.5 742.5Q613 727 516.5 716Q420 705 322.5 698Q225 691 134 688Q132 702 126.5 721.5Q121 741 116 753Q205 758 301 765Q397 772 489 782.5Q581 793 660.5 807Q740 821 798 839ZM117 556L896 556L896 484L117 484L117 556ZM50 322L953 322L953 248L50 248L50 322ZM463 732L540 732L540 25Q540 -15 527.5 -34.5Q515 -54 487 -63Q458 -72 407.5 -74.5Q357 -77 278 -76Q275 -65 270 -51.5Q265 -38 258.5 -24.5Q252 -11 246 -2Q288 -3 326 -3Q364 -3 392 -3Q420 -3 432 -3Q449 -2 456 4Q463 10 463 25L463 732Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M817 799 L483 746 L140 724" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M163 537 L371 519 L500 534 L605 520 L826 542" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M64 289 L64 289" fill="none" stroke="#9aa1ad" stroke-widt