<svg xmlns="http://www.w3.org/2000/svg" width="502" height="316.97" viewBox="0 0 502 316.97" role="img" aria-label="How to write ف: 2 strokes · 1 pen lift · 3 movements"><title>Writing ف</title><desc>3 frames; frame N shows movements 1 to N of ف (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ف ق, independent Faa at 00:01.7–00:03.3 (University of Oregon Libraries Open Textbook, 2023; accessed 2026-08-23) &lt;https://opentext.uoregon.edu/introarabic/chapter/alphabet-%d9%81-%d9%82/&gt;. Source note on variation: The page&apos;s directly linked faa.mov demonstrates independent ف in two pen-down runs at 00:01.7–00:03.3. The first run at 00:01.7–00:02.5 begins at the small head&apos;s upper-right edge, loops counterclockwise around its closed counter, then continues without lifting down from the head and left through the broad independent bowl to its rising left tip. After one lift, the single upper dot is placed at 00:03.2–00:03.3. The adjacent lesson identifies Faa as a two-way connector, gives its f sound and transliteration, and separately prints its contextual shapes. This two-stroke, one-lift learner path fits the course&apos;s vendored Noto Naskh outline while preserving the independently demonstrated loop-to-bowl continuity and dot-last order.</desc><rect x="0" y="0" width="502" height="316.97" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="198.47" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="198.47" viewBox="-2 -746 869 1149.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M320 0Q194 0 131 42.5Q68 85 68 170