troke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="311" cy="96" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298.5" y="204.8" text-anchor="middle" font-size="52.8" fill="#6b7280"><tspan x="298.5" y="204.8">3. curl up round the</tspan><tspan x="298.5" y="269.2">lower loop</tspan></text></svg><text x="16" y="265.25" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar</text><text x="16" y="277.75" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC</text><text x="16" y="290.25" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">BY-NC-SA 4.0), Table III &apos;How to Write Internal Vowel Symbols&apos;, p. xxii: movements 1-3 for</text><text x="16" y="302.75" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">േ, written by hand by Thomas Joseph</text><text x="16" y="315.25" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
