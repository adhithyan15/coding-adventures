<svg xmlns="http://www.w3.org/2000/svg" width="502" height="279.98" viewBox="0 0 502 279.98" role="img" aria-label="How to write ಲ: one unbroken stroke · 3 movements"><title>Writing ಲ</title><desc>3 frames; frame N shows movements 1 to N of ಲ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-la.gif, animation of Kannada consonant ಲ, 30 frames, 3.0 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-la.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಲ in one pen-down run (frames 0–13): the pen closes the small upper-left loop counterclockwise, sweeps down round the outer left side and along the base, and climbs the right side, curling in at its tip. ಲ has no top bar, so nothing follows a lift. The frames were read from a mirror copy that matches the Commons file&apos;s listed size (230×210, 78 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the small loop&apos;s left side is also the outer curve, so the path starts at the loop&apos;s lower left, where the two meet, but the one-run order remains the same.</desc><rect x="0" y="0" width="502" height="279.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="173.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="173.98" viewBox="-33 -635 825 956.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M375 -12Q267 -12 191.5 29Q116 70 76.5 142.5Q37 215 37 308Q37 387 62.5 444Q88 501 134.5 532Q181 563 242 563Q287 563 319 547Q351 531 368 501Q385 471 385 429Q385 386 365.5 352Q346 318 307.5 298Q269 278 212 278Q190 278 171 282Q152 286 136.5 293.5Q121 301 108 309L118 380Q128 373 141.5 365.5Q155 358 171 353Q187 348 206 348Q259 348 283 370.5Q307 393 307 427Q307 459 289 476Q271 493 242 493Q209 493 180 475Q151 457 133 416Q115 375 115 306Q115 241 145 187Q175 133 233.5 101Q292 69 378 69Q462 69 520.5 94Q579 119 609.5 166.5Q640 214 640 281Q640 352 600 403.5Q560 455 492 491L538 565Q625 518 673.5 448Q722 378 722 281Q722 201 686.5 134.5Q651 68 574.5 28Q498 -12 375 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M84 345 L84 345" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M84 345 L118 335 L153 325 L190 319 L227 318 L263 325 L295 342 L319 367 L333 400 L336 435 L328 469 L309 497 L279 515 L243 521 L207 517 L172 505 L142 485 L118 456 L103 422 L92 384 L84 345" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="84" cy="345" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="218.1" text-anchor="middle" font-size="66.1" fill="#6b7280"><tspan x="379.5" y="218.1">1. close the small loop</tspan><tspan x="379.5" y="298.7">counterclockwise</tspan></text></svg><rect x="176" y="42" width="150" height="173.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="173.98" viewBox="-33 -635 825 956.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M375 -12Q267 -12 191.5 29Q116 70 76.5 142.5Q37 215 37 308Q37 387 62.5 444Q88 501 134.5 532Q181 563 242 563Q287 563 319 547Q351 531 368 501Q385 471 385 429Q385 386 365.5 352Q346 318 307.5 298Q269 278 212 278Q190 278 171 282Q152 286 136.5 293.5Q121 301 108 309L118 380Q128 373 141.5 365.5Q155 358 171 353Q187 348 206 348Q259 348 283 370.5Q307 393 307 427Q307 459 289 476Q271 493 242 493Q209 493 180 475Q151 457 133 416Q115 375 115 306Q115 241 145 187Q175 133 233.5 101Q292 69 378 69Q462 69 520.5 94Q579 119 609.5 166.5Q640 214 640 281Q640 352 600 403.5Q560 455 492 491L538 565Q625 518 673.5 448Q722 378 722 281Q722 201 686.5 134.5Q651 68 574.5 28Q498 -12 375 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M84 345 L118 335 L153 325 L190 319 L227 318 L263 325 L295 342 L319 367 L333 400 L336 435 L328 469 L309 497 L279 515 L243 521 L207 517 L172 505 L142 485 L118 456 L103 422 L92 384 L84 345 L84 345" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M84 345 L80 308 L80 271 L86 234 L97 199 L113 165 L133 135 L159 107 L188 83 L220 64 L254 49 L289 39 L326 33 L365 30 L404 30 L442 33 L479 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="479" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="218.1" text-anchor="middle" font-size="66.1" fill="#6b7280"><tspan x="379.5" y="218.1">2. sweep down the left</tspan><tspan x="379.5" y="298.7">side and round the base</tspan></text></svg><rect x="336" y="42" width="150" height="173.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="173.98" viewBox="-33 -635 825 956.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M375 -12Q267 -12 191.5 29Q116 70 76.5 142.5Q37 215 37 308Q37 387 62.5 444Q88 501 134.5 532Q181 563 242 563Q287 563 319 547Q351 531 368 501Q385 471 385 429Q385 386 365.5 352Q346 318 307.5 298Q269 278 212 278Q190 278 171 282Q152 286 136.5 293.5Q121 301 108 309L118 380Q128 373 141.5 365.5Q155 358 171 353Q187 348 206 348Q259 348 283 370.5Q307 393 307 427Q307 459 289 476Q271 493 242 493Q209 493 180 475Q151 457 133 416Q115 375 115 306Q115 241 145 187Q175 133 233.5 101Q292 69 378 69Q462 69 520.5 94Q579 119 609.5 166.5Q640 214 640 281Q640 352 600 403.5Q560 455 492 491L538 565Q625 518 673.5 448Q722 378 722 281Q722 201 686.5 134.5Q651 68 574.5 28Q498 -12 375 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M84 345 L118 335 L153 325 L190 319 L227 318 L263 325 L295 342 L319 367 L333 400 L336 435 L328 469 L309 497 L279 515 L243 521 L207 517 L172 505 L142 485 L118 456 L103 422 L92 384 L84 345 L80 308 L80 271 L86 234 L97 199 L113 165 L133 135 L159 107 L188 83 L220 64 L254 49 L289 39 L326 33 L365 30 L404 30 L442 33 L479 40 L479 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M479 40 L515 51 L550 66 L583 85 L612 109 L636 139 L654 172 L667 207 L675 245 L677 284 L674 322 L665 359 L651 394 L632 427 L607 456 L577 481 L543 496 L505 505" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="505" cy="505" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="379.5" y="218.1" text-anchor="middle" font-size="66.1" fill="#6b7280"><tspan x="379.5" y="218.1">3. climb the right side</tspan><tspan x="379.5" y="298.7">and curl in to its tip</tspan></text></svg><text x="16" y="228.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Gopala Krishna A, Kannada-alphabet-la.gif, animation of Kannada</text><text x="16" y="241.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">consonant ಲ, 30 frames, 3.0 seconds (Wikimedia Commons, 25 May 2016)</text><text x="16" y="253.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
