none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M425 551 L425 475 L425 395 L425 315 L425 235 L425 155 L425 75 L425 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="425" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="284.5" y="196.8" text-anchor="middle" font-size="56.8" fill="#6b7280"><tspan x="284.5" y="196.8">2. lift, then descend</tspan><tspan x="284.5" y="266.1">the right stem</tspan></text></svg><rect x="336" y="61" width="150" height="206.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="61" width="150" height="206.91" viewBox="-70 -692 709 978" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L569 622L569 551L466 551L466 0L385 0L385 298L204 298L204 244Q204 216 190 202Q176 188 153 188Q135 188 114.5 200Q94 212 76.5 232Q59 252 48 274.5Q37 297 37 318Q37 341 50.5 355Q64 369 98 369L385 369L385 551L0 551L0 622Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M185 255 L178 225 L158 205 L130 202 L100 215 L72 242 L52 275 L48 310 L58 338 L82 350 L115 350 L155 335 L205 335 L260 335 L320 335 L380 335" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M425 551 L425 475 L425 395 L425 315 L425 235 L425 155 L425 75 L425 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L80 585 L155 585 L230 585 L305 585 L380 585 L455 585 L565 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="565" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="284.5" y="196.8" text-anchor="middle" font-size="56.8" fill="#6b7280"><tspan x="284.5" y="196.8">3. lift, then draw the</tspan><tspan x="284.5" y="266.1">shirorekha rightward</tspan></text></svg><text x="16" y="293.91" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 2 of 2 — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="300.91" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="300.91" width="150" height="196.88" viewBox="-70 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M509 551L509 0L428 0L428 250L207 250L207 213Q207 180 192.5 165.5Q178 151 159 151Q140 151 119 163.5Q98 176 80 195.5Q62 215 50.5 237Q39 259 39 278Q39 296 52.5 308.5Q66 321 100 321L126 321L126 551L0 551L0 622L612 622L612 551L509 551ZM428 551L207 551L207 321L428 321L428 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M166 551 L166 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M166 551 L166 475 L166 405 L166 350 L167 315 L167 265 L161 220 L135 188 L100 184 L80 215 L55 242 L57 278 L75 300 L110 285 L150 285 L200 285 L255 285 L315 285 L370 285 L405 285 L405 285" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="405" cy="285" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="306" y="200.3">1. descend, loop</tspan><tspan x="306" y="273.9">clockwise, sweep right</tspan></text></svg><rect x="176" y="300.91" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="300.91" width="150" height="196.88" viewBox="-70 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)