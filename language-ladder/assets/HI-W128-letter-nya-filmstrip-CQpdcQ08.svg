<svg xmlns="http://www.w3.org/2000/svg" width="662" height="278.34" viewBox="0 0 662 278.34" role="img" aria-label="How to write ञ: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ञ</title><desc>4 frames; frame N shows movements 1 to N of ञ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ञ-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9E-order.gif&gt;. Source note on variation: The 21-frame animation shows four ordered pen-down runs over its gray guide: frames 2–8 start at the open upper-left tip and curve clockwise around the bowl to the open lower-left tip; frames 9–13 restart at the bowl&apos;s right junction, sweep right through the shoulder, and curve upward along the right side to the headline; frames 14–16 restart at the lower right-side junction and descend the short stem below the bowl; frames 17–20 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 250 ms holds at frames 8, 13, and 16 mark the first three run endings before the one-second completed frame 20; frame 10&apos;s 120 ms pause occurs within the shoulder and does not add a lift. This learner path follows that sourced four-run order and fits its bowl and shoulder to Noto Sans Devanagari; everyday handwriting may narrow or simplify the bowl differently.</desc><rect x="0" y="0" width="662" height="278.34" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="184.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="184.84" viewBox="-70 -692 896 1104.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path