<svg xmlns="http://www.w3.org/2000/svg" width="982" height="484.54" viewBox="0 0 982 484.54" role="img" aria-label="How to write ऋ: 4 strokes · 3 pen lifts · 8 movements"><title>Writing ऋ</title><desc>8 frames; frame N shows movements 1 to N of ऋ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari ऋ stroke order.svg’, panels 1–4, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%8B_stroke_order.svg&gt;. Source note on variation: The four buildup panels show four ordered pen-down runs: panel 1 writes the short upper-left shoulder and diagonal hook; panel 2 restarts for the rounded middle body and lower tail; panel 3 descends the right stem; panel 4 draws the shirorekhā left-to-right, for three intervening lifts. This learner path follows that sourced modern printed form and fits its joins to Noto Sans Devanagari. Everyday handwriting may join or simplify the body differently, so it is not presented as a universal national order.</desc><rect x="0" y="0" width="982" height="484.54" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="189.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="189.52" viewBox="-70 -692 1007 1272.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M382 0L382 551L0 551L0 622L867 622L867 551L462 551L462 0L382 0ZM101 69L58 141L370 295L408 237L101 69ZM343 245Q318 283 298 309Q278 335 260 350.5Q242 366 223 373Q204 380 181 380Q154 380 123 371Q92 362 55 343L27 418Q62 435 100 445.5Q138 456 179 456Q223 456 257.5 440.5Q292 425 327 387.5Q362 350 405 285L397 261L343 245ZM708 -36Q635 -36 591 0Q547 36 547 101Q547 