<svg xmlns="http://www.w3.org/2000/svg" width="822" height="302.88" viewBox="0 0 822 302.88" role="img" aria-label="How to write ਖ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ਖ</title><desc>5 frames; frame N shows movements 1 to N of ਖ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਖ (khakhaa) checkpoints, strokes 1–3 (lib/data/lessons/lesson_tracing.dart line 218, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L218&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਖ in three pen-down strokes: from the top left along the bar&apos;s left part, down the left side and round the bowl to the stem; then the middle bar from left to right; then from the top right, left along the bar&apos;s right part and down the stem. In the bundled Noto Sans Gurmukhi outline this letter&apos;s top bar is split, with a gap above the body, and the source draws no separate headline: the first stroke opens along the bar&apos;s left part and the last stroke opens by running right to left along its right part before turning down the stem. The outline and the source agree, so there is no headline stroke to place first or last. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਖ, each by a different non-native copyist; only counts and shares are cited. 50% (10 of 20) draw it in three strokes, the source&apos;s count and their most common one. For the first stroke of the body, 85% (17 of 20) start in the same part of the letter as the source and 70% (14 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="302.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="196.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="196.88" viewBox="-77 -692 752 987" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M428 0L428 165Q394 149 360 140.5Q326 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 456 188 454L428 454L428 622L605 622L605 551L509 551L509 0L428 0ZM284 206Q325 206 359 217.5Q393 229 428 250L428 385L174 385Q160 352 132 327Q161 267 196.5 236.5Q232 206 284 206Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L53 585 L88 579 L115 561 L131 533 L139 498 L144 461 L147 424" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="147" cy="424" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="299" y="200.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="299" y="200.3">1. start at the top</tspan><tspan x="299" y="273.9">left and curve down</tspan></text></svg><rect x="176" y="42" width="150" height="196.88" rx="6" fill="#fdfdf