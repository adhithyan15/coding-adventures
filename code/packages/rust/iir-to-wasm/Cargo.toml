[package]
name = "iir-to-wasm"
version = "0.12.0"
edition = "2021"
description = "IIR → WASM backend — lowers IIRModule to WasmModule.  v0.7.0 (G1): accept cmp_*-prefixed comparison opcodes.  v0.8.0 (G2): whitelist call_builtin print_i64 and route it to the env.__print_i64 host import that io_out uses, so BASIC's PRINT reaches real wasm bytecode."

[lib]
name = "iir_to_wasm"
path = "src/lib.rs"

[dependencies]
interpreter-ir      = { path = "../interpreter-ir" }
wasm-types          = { path = "../wasm-types" }
wasm-module-encoder = { path = "../wasm-module-encoder" }
wasm-leb128         = { path = "../wasm-leb128" }
codegen-core        = { path = "../codegen-core" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"
