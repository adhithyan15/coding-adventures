[package]
name = "coding_adventures_vault_pm_application"
version = "0.1.0"
edition = "2021"
description = "Host-neutral application persistence and cryptographic framing for the local-first password manager"

[dependencies]
coding_adventures_argon2id = { path = "../argon2id" }
coding_adventures_canonical_cbor = { path = "../canonical-cbor" }
coding_adventures_chacha20_poly1305 = { path = "../chacha20-poly1305" }
coding_adventures_ct_compare = { path = "../ct-compare" }
coding_adventures_ed25519 = { path = "../ed25519" }
coding_adventures_hkdf = { path = "../hkdf" }
coding_adventures_sha256 = { path = "../sha256" }
# VLT-PM45 §7. The RFC 6238 engine is reused from VLT05 rather than rewritten
# here; VLT-PM00 §6's reuse map already assigns TOTP factors to that package.
coding_adventures_vault_auth = { path = "../vault-auth" }
coding_adventures_vault_pm_audit = { path = "../vault-pm-audit" }
coding_adventures_vault_pm_domain = { path = "../vault-pm-domain" }
coding_adventures_vault_pm_format = { path = "../vault-pm-format" }
coding_adventures_vault_pm_repository = { path = "../vault-pm-repository" }
coding_adventures_vault_search = { path = "../vault-search" }
coding_adventures_vault_pm_storage = { path = "../vault-pm-storage" }
coding_adventures_vault_records = { path = "../vault-records" }
coding_adventures_x25519 = { path = "../x25519" }
coding_adventures_zeroize = { path = "../zeroize" }
unicode-normalize = { path = "../unicode-normalize" }
