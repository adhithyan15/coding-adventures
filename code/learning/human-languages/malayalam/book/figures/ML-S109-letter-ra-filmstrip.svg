<svg xmlns="http://www.w3.org/2000/svg" width="502" height="297.48" viewBox="0 0 502 297.48" role="img" aria-label="How to write ര: one unbroken stroke · 3 movements"><title>Writing ര</title><desc>3 frames; frame N shows movements 1 to N of ര (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ര in data/RA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/RA.png&gt;. Source note on variation: Thooval&apos;s RA.png starts at the left foot (green), climbs clockwise over the top, descends the right side, runs left along the bottom and curls up the inner loop to finish at its top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ര as one stroke from the lower left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (28 of 31) and end at the upper right (18 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; in that outline the inner loop&apos;s top runs into the right side, so the path ends where they meet.</desc><rect x="0" y="0" width="502" height="297.48" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="178.98" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="178.98" viewBox="-31 -636 798 952.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M364 566Q447 566 509.5 542Q572 518 613.5 474Q655 430 676 371Q697 312 697 242Q697 153 669 96.5Q641 40 593 14Q545 -12 485 -12Q420 -12 377 17Q334 46 312.5 93.5Q291 141 291 196Q291 291 342 347.5Q393 404 479 404Q535 404 576.5 375Q618 346 642 301Q666 256 668 206L643 209Q636 240 616.5 268.5Q597 297 566.5 315.5Q536 334 496 334Q433 334 404 296.5Q375 259 375 198Q375 156 386 124.5Q397 93 421.5 75.5Q446 58 485 58Q526 58 554.5 77Q583 96 598.5 138Q614 180 614 248Q614 250 612.5 270Q611 290 607 310Q606 315 606 323Q606 331 604 335Q595 378 565 414Q535 450 485 472Q435 494 364 494Q292 494 239 468Q186 442 157 393Q128 344 128 273Q128 221 143 180Q158 139 185.5 108Q213 77 250 54L200 -9Q157 16 120.5 55.5Q84 95 61.5 150.5Q39 206 39 277Q39 333 58 385Q77 437 116.5 478Q156 519 217.5 542.5Q279 566 364 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M219 48 L219 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M219 48 L161 82 L116 136 L92 202 L87 272 L91 342 L116 408 L161 461 L219 500 L286 522 L356 528 L426 527 L493 508 L555 475 L604 425 L639 364" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="639" cy="364" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="368" y="215.9" text-anchor="middle" font-size="63.9" fill="#6b7280"><tspan x="368" y="215.9">1. climb clockwise over</tspan><tspan x="368" y="293.9">the top</tspan></text></svg><rect x="176" y="42" width="150" height="178.98" rx="6" fill="#fdfdfc" stroke="#d