[package]
name = "coding-adventures-closure-pass-pipeline"
version = "0.3.0"
edition = "2021"
description = "Pass trait + scheduler for the Closure Compiler clone's optimization pipeline. Every closure-pass-* crate plugs into this. Per CLOC06."

[dependencies]
