[workspace]

[package]
name = "forme-shell-desktop-native"
version = "1.0.0"
edition = "2021"
description = "Contained native authority for the Forme Tauri authoring product"
publish = false

[features]
default = []
desktop = ["dep:rfd", "dep:tauri", "dep:tauri-build"]

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
tauri = { version = "=2.12.1", optional = true , features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
url = "2"

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "native_storage"
path = "tests/native_storage.rs"

[[test]]
name = "native_commands"
path = "tests/native_commands.rs"

[[test]]
name = "native_worker"
path = "tests/native_worker.rs"

[[test]]
name = "native_preview"
path = "tests/native_preview.rs"

[[test]]
name = "native_target"
path = "tests/native_target.rs"

[[bin]]
name = "forme-shell-desktop-native"
path = "src/main.rs"
required-features = ["desktop"]
