" cy="131" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501" y="305.6" text-anchor="middle" font-size="85.6" fill="#6b7280"><tspan x="501" y="305.6">5. lift, then draw the</tspan><tspan x="501" y="410">short horizontal across</tspan><tspan x="501" y="514.5">the vertical</tspan></text></svg><text x="16" y="259.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 本.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22</text><text x="16" y="271.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="284.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
