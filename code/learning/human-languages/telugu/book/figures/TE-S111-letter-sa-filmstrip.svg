<svg xmlns="http://www.w3.org/2000/svg" width="342" height="375.89" viewBox="0 0 342 375.89" role="img" aria-label="How to write స: 2 strokes · 1 pen lift · 2 movements"><title>Writing స</title><desc>2 frames; frame N shows movements 1 to N of స (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after AppChant, Telugu Alphabets Writing, consonant స animated path guide encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_స in version 3.8.05 (3805) &lt;https://play.google.com/store/apps/details?id=com.banuchanderjj.tracer.telugu&gt;. Source note on variation: The packaged auto-trace data gives two ordered starts, paths, and ends. Its rotated స.png atlas mapping and pictured glyph independently identify U+0C38 స. The bundled Noto Sans Telugu outline rounds the printed joins differently, so the filmstrip preserves the two attested movement boundaries and directions while fitting their centre lines to that outline. Inspected XAPK SHA-256: 30c6e520a5b469cbe8d17568718bf75796987ea9596f69850eb921db2fe7bd57; libTracer.so SHA-256: 444511c98b69ada4de57900776945837c013da6a4fbfb21833c180d06f9c3ac5.</desc><rect x="0" y="0" width="342" height="375.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="213.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="213.64" viewBox="-41 -795 778 1108.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M472 -12Q425 -12 390 3.5Q355 19 324 51.5Q293 84 256 133Q235 162 220.5 178.5Q206 195 193.5 202Q181 209 164 209Q141 209 126 190.5Q111 172 111 143Q111 108 123 77Q13