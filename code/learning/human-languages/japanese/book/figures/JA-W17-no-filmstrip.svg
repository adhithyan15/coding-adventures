 680" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M520 680 L575 665 L665 640 L740 595 L800 530 L845 450 L865 360 L855 270 L820 190 L765 125 L695 80 L615 55 L525 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="525" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="498" y="247.9" text-anchor="middle" font-size="76.9" fill="#6b7280"><tspan x="498" y="247.9">3. cross near the top</tspan><tspan x="498" y="341.7">and swing right and down</tspan><tspan x="498" y="435.5">to the finish</tspan></text></svg><text x="16" y="250.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana の stroke order animation.gif, hiragana の, 32 frames,</text><text x="16" y="262.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">3.2 seconds (Wikimedia Commons, 1 October 2009)</text><text x="16" y="275.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
