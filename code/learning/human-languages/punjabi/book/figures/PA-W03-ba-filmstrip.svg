e 885, commit</text><text x="16" y="261.93" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">de1e560; Apache-2.0)</text><text x="16" y="274.43" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
