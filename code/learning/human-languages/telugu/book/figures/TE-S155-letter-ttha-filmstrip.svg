<svg xmlns="http://www.w3.org/2000/svg" width="662" height="340.1" viewBox="0 0 662 340.1" role="img" aria-label="How to write ఠ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ఠ</title><desc>4 frames; frame N shows movements 1 to N of ఠ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ఠ packaged tracing guides res/drawable/dot_stroke_c_3_2_ta.png and res/drawable/line_stroke_c_3_2_ta.png, movements 1–3 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the circular body, upper flourish and inner dot as three movements. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the breaks keep the guide&apos;s order and fall only between the body and its detached parts. The bundled Noto Sans Telugu outline joins the flourish to the top of the body, so movement 1 closes the circle there and the run climbs up the flourish&apos;s left arm before curling through it; that climb is a new segment, so the filmstrip shows one more frame than the guide has movements.</desc><rect x="0" y="0" width="662" height="340.1" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="234.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="234.1" viewBox="-35 -795 699 1090.9" preserveAspectRatio