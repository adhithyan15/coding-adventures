<svg xmlns="http://www.w3.org/2000/svg" width="822" height="295.41" viewBox="0 0 822 295.41" role="img" aria-label="How to write お: 3 strokes · 2 pen lifts · 5 movements"><title>Writing お</title><desc>5 frames; frame N shows movements 1 to N of お (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0304a.svg, hiragana お (U+304A HIRAGANA LETTER O), three stroke paths kvg:0304a-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0304a.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the bar drawn left to right; s2 starts above the bar, runs down through it to the foot, turns without lifting, loops up to the left and back across the vertical, rounds the bowl on the right and finishes low, heading left; s3 starts at the upper left of the dot and runs down to the right, ending in a small turn that the print glyph does not show. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="295.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="189.41" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="189.41" viewBox="35 -869 985 1243.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M411 799Q409 790 408 778.5Q407 767 406 754Q405 741 404 730Q403 707 401.5 670Q400 633 399 588.5Q398 544 397 498.5Q396 453 396 414Q396 375 396.5 328.5Q3