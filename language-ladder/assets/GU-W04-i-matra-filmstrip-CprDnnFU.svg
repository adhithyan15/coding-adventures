<svg xmlns="http://www.w3.org/2000/svg" width="502" height="414.63" viewBox="0 0 502 414.63" role="img" aria-label="How to write િ: one unbroken stroke · 3 movements"><title>Writing િ</title><desc>3 frames; frame N shows movements 1 to N of િ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/2_ki.svg, group g1 (stroke g1s0): the i sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કિ, and in all 34 consonant rows, િ is one pen-down run that starts at the right tip of the top hook, arcs up and to the left over the top, comes down the left stem and ends in a small foot to the right. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: its most common form of the i sign is two strokes (41 of 75 prototypes, 55%), but among its one-stroke prototypes (22 of 75) half start on the right and end at the lower left, as here. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="414.63" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="296.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="296.13" viewBox="20 -966 662 1306.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M238 0Q203 0 172.5 7.5Q142 15 121 37Q102 57 96 81.5Q90 106 90 148L90 672Q90 731 103.5 776.5Q117 822 156 854Q179 874 214 885Q249 896 292 896Q381 896 457.5 847Q534 798 612 710L553 665Q514 708 472 744Q430 780 386.5 802Q343 824 298 824Q271 824 249 818Q227 812 210 797Q188 778 179 743Q170 708 170 643L170 152Q170 125 173 112.5Q176 100 182 92Q193 78 214 75.5Q235 73 256 73L248 0L238 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M582 688 L582 688" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M582 688 L530 740 L460 800 L380 843 L295 860 L230 850 L176 815 L142 760 L131 690" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="690" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="351" y="193" text-anchor="middle" font-size="53" fill="#6b7280"><tspan x="351" y="193">1. curl up and over to</tspan><tspan x="351" y="257.7">the left from the hook&apos;s</tspan><tspan x="351" y="322.3">tip</tspan></text></svg><rect x="176" y="42" width="150" height="296.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="296.13" viewBox="20 -966 662 1306.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M238 0Q203 0 172.5 7.5Q142 15 121 37Q102 57 96 81.5Q90 106 90 148L90 672Q90 731 103.5 776.5Q117 822 156 854Q179 874 214 885Q249 896 292 896Q381 896 457.5 847Q534 798 612 710L553 665Q514 708 472 744Q430 780 386.5 802Q343 824 298 824Q271 824 249 818Q227 812 210 797Q188 778 179 743Q170 708 170 643L170 152Q170 125 173 112.5Q176 100 182 92Q193 78 214 75.5Q235 73 256 73L248 0L238 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M582 688 L530 740 L460 800 L380 843 L295 860 L230 850 L176 815 L142 760 L131 690 L131 690" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 690 L130 600 L130 500 L130 400 L130 300 L130 200 L131 140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="351" y="193" text-anchor="middle" font-size="53" fill="#6b7280"><tspan x="351" y="193">2. draw the stem down</tspan></text></svg><rect x="336" y="42" width="150" height="296.13" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="296.13" viewBox="20 -966 662 1306.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M238 0Q203 0 172.5 7.5Q142 15 121 37Q102 57 96 81.5Q90 106 90 148L90 672Q90 731 103.5 776.5Q117 822 156 854Q179 874 214 885Q249 896 292 896Q381 896 457.5 847Q534 798 612 710L553 665Q514 708 472 744Q430 780 386.5 802Q343 824 298 824Q271 824 249 818Q227 812 210 797Q188 778 179 743Q170 708 170 643L170 152Q170 125 173 112.5Q176 100 182 92Q193 78 214 75.5Q235 73 256 73L248 0L238 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M582 688 L530 740 L460 800 L380 843 L295 860 L230 850 L176 815 L142 760 L131 690 L130 600 L130 500 L130 400 L130 300 L130 200 L131 140 L131 140" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 140 L136 95 L155 62 L185 44 L215 38 L248 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="248" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="351" y="193" text-anchor="middle" font-size="53" fill="#6b7280"><tspan x="351" y="193">3. turn into the foot to</tspan><tspan x="351" y="257.7">the right</tspan></text></svg><text x="16" y="351.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="363.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/2_ki.svg, group g1 (stroke g1s0):</text><text x="16" y="376.13" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the i sign drawn after the consonant (GitHub, 2026)</text><text x="16" y="388.63" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
