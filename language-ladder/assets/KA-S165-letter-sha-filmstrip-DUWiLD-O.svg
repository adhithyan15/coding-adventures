<svg xmlns="http://www.w3.org/2000/svg" width="822" height="353.76" viewBox="0 0 822 353.76" role="img" aria-label="How to write ಶ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ಶ</title><desc>5 frames; frame N shows movements 1 to N of ಶ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-sha.gif, animation of Kannada consonant ಶ, 31 frames, 3.1 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-sha.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಶ in two pen-down runs: from the round head at the upper left the pen runs right along the top, curves down and sweeps across to the lower left, rounds the base and climbs the right side to the top (frames 0–12); after one lift it draws the top bar from left to right and curls up into the hook (frames 14–19). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (259×211, 80 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the head is a short wedge, where the path starts, and the top of the body is fused into the bar, so the first movement runs along the lower part of the bar&apos;s ink and the bar retraces it, but the one-lift order remains the same.</desc><rect x="0" y="0" width="822" height="353.76" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="247.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="247.76" viewBox="-39 -860 700 1156.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M269