[package]
name = "html-to-layout"
version = "0.4.0"
edition = "2021"
description = "Converts html-parser browser render trees into the shared Layout IR."

[dependencies]
coding-adventures-css-parser = { path = "../css-parser" }
coding-adventures-html-parser = { path = "../html-parser" }
layout-ir = { path = "../layout-ir" }
layout-inline-box = { path = "../layout-inline-box" }
layout-float = { path = "../layout-float" }
layout-flexbox = { path = "../layout-flexbox" }
layout-grid = { path = "../layout-grid" }
layout-table = { path = "../layout-table" }
layout-positioned = { path = "../layout-positioned" }
parser = { path = "../parser" }

[dev-dependencies]
layout-block = { path = "../layout-block" }
