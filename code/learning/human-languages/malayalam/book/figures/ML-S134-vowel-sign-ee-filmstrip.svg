<svg xmlns="http://www.w3.org/2000/svg" width="502" height="341.25" viewBox="0 0 502 341.25" role="img" aria-label="How to write േ: one unbroken stroke · 3 movements"><title>Writing േ</title><desc>3 frames; frame N shows movements 1 to N of േ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table III &apos;How to Write Internal Vowel Symbols&apos;, p. xxii: movements 1-3 for േ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-032.jpg&gt;. Source note on variation: Moag&apos;s Table III (p. xxii) draws it as three movements to the left of the dash: the small top loop (1), a sweep left and round the bottom (2) and a curl up round the lower loop (3). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record േ as one stroke from the upper left to the lower left. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 25 unique samples jumps between consecutive points the way a lift would; they most often start at the upper centre (14 of 25) and end at the lower left (25 of 25). The path is fitted to the bundled Noto Sans Malayalam outline of the sign on its own rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="502" height="341.25" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="210.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="210.25" viewBox="-31 -636 659 923.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M364 -12Q300 -12 241.5 5Q183 22 137.5 57.5Q92 93 65.5 148.5Q39 204 39 281Q39 355 66 409Q93 463 139.5 498Q186 533 244.5 549.5Q303 566 366 566Q432 566 474.5 548.5Q517 531 537.5 500.5Q558 470 558 431Q558 388 539 359Q520 330 488.5 315Q457 300 421 300Q368 300 336 318.5Q304 337 290.5 367.5Q277 398 277 432Q277 452 282.5 469Q288 486 294 498L387 517Q368 503 358 480Q348 457 348 434Q348 412 363.5 388.5Q379 365 417 365Q450 365 465 384.5Q480 404 480 429Q480 467 452.5 485Q425 503 389 503Q375 503 362 503Q349 503 335 501Q270 496 223.5 468Q177 440 152.5 392.5Q128 345 128 280Q128 217 153 167Q178 117 224 87.5Q270 58 332 54Q344 53 356.5 52Q369 51 380 51Q406 51 427.5 59Q449 67 462 84Q475 101 475 127Q475 152 460 171Q445 190 411 190Q373 190 357.5 167Q342 144 342 121Q342 97 352 75Q362 53 381 39L289 58Q282 69 276.5 86.5Q271 104 271 126Q271 160 285 189Q299 218 330 236.5Q361 255 412 255Q450 255 482 240.5Q514 226 533.5 197Q553 168 553 125Q553 86 532.5 55Q512 24 470 6Q428 -12 364 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M327 512 L327 512" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M327 512 L319 441 L332 371 L392 337 L463 342 L511 393 L512 464 L464 516 L395 532 L327 516" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="327" cy="516" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298.5" y="204.8" text-anchor="middle" font-size="52.8" fill="#6b7280"><tspan x="298.5" y="204.8">1. circle the small top</tspan><tspan x="298.5" y="269.2">loop</tspan></text></svg><rect x="176" y="42" width="150" height="210.25" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="210.25" viewBox="-31 -636 659 923.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M364 -12Q300 -12 241.5 5Q183 22 137.5 57.5Q92 93 65.5 148.5Q39 204 39 281Q39 355 66 409Q93 463 139.5 498Q186 533 244.5 549.5Q303 566 366 566Q432 566 474.5 548.5Q517 531 537.5 500.5Q558 470 558 431Q558 388 539 359Q520 330 488.5 315Q457 300 421 300Q368 300 336 318.5Q304 337 290.5 367.5Q277 398 277 432Q277 452 282.5 469Q288 486 294 498L387 517Q368 503 358 480Q348 457 348 434Q348 412 363.5 388.5Q379 365 417 365Q450 365 465 384.5Q480 404 480 429Q480 467 452.5 485Q425 503 389 503Q375 503 362 503Q349 503 335 501Q270 496 223.5 468Q177 440 152.5 392.5Q128 345 128 280Q128 217 153 167Q178 117 224 87.5Q270 58 332 54Q344 53 356.5 52Q369 51 380 51Q406 51 427.5 59Q449 67 462 84Q475 101 475 127Q475 152 460 171Q445 190 411 190Q373 190 357.5 167Q342 144 342 121Q342 97 352 75Q362 53 381 39L289 58Q282 69 276.5 86.5Q271 104 271 126Q271 160 285 189Q299 218 330 236.5Q361 255 412 255Q450 255 482 240.5Q514 226 533.5 197Q553 168 553 125Q553 86 532.5 55Q512 24 470 6Q428 -12 364 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M327 512 L319 441 L332 371 L392 337 L463 342 L511 393 L512 464 L464 516 L395 532 L327 516 L327 516" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M327 516 L257 518 L192 490 L140 444 L103 384 L87 315 L87 245 L102 176 L139 116 L190 68 L253 37 L323 36" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="323" cy="36" r="3