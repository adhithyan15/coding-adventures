[package]
name = "lean-kernel"
version = "0.2.0"
edition = "2021"
description = "A Lean 4 compatible proof kernel written from Lean's documented type theory (VER11a). Slice 2: names, levels, hash-consed expressions, an environment, and the core type checker (infer/check, whnf and is_def_eq with beta, zeta, delta). No inductives yet."
license = "MIT"

[dependencies]
bignum-core = { path = "../bignum-core" }
