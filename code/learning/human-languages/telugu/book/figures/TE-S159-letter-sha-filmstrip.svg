<svg xmlns="http://www.w3.org/2000/svg" width="662" height="335.57" viewBox="0 0 662 335.57" role="img" aria-label="How to write శ: one unbroken stroke · 4 movements"><title>Writing శ</title><desc>4 frames; frame N shows movements 1 to N of శ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after AppChant, Telugu Alphabets Writing, consonant శ animated path guide encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_శ in version 3.8.05 (3805) &lt;https://play.google.com/store/apps/details?id=com.banuchanderjj.tracer.telugu&gt;. Source note on variation: The packaged auto-trace data gives three ordered starts, paths, and ends. Its rotated శ.png atlas mapping and pictured glyph independently identify U+0C36 శ. Those ordered starts mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the source&apos;s order. The bundled Noto Sans Telugu outline joins the chevron to the top of the body, so the run climbs up the chevron&apos;s left arm before drawing it; that climb is a new segment, so the filmstrip shows one more frame than the source has movements. Inspected XAPK SHA-256: 30c6e520a5b469cbe8d17568718bf75796987ea9596f69850eb921db2fe7bd57; libTracer.so SHA-256: 444511c98b69ada4de57900776945837c013da6a4fbfb21833c180d06f9c3ac5.</desc><rect x="0" y="0" width="662" height="335.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="229.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-w