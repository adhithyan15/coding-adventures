# Zero dependencies. We declare Lua's C API functions ourselves using
# extern "C" — no mlua, no rlua, no bindgen, no build-time header requirement.
# Lua's C API has been stable since Lua 5.1 (2006); we target Lua 5.4.
[package]
name = "lua-bridge"
version = "0.1.0"
edition = "2021"
description = "Thin safe Rust wrapper over Lua 5.4 C API — zero dependencies, no mlua/rlua, no macros"
build = "build.rs"

[dependencies]

# The smoke module: a real Lua C module built on this crate and loaded into a real
# Lua by tests/smoke.lua (see BUILD).  An example, so it is built only on request
# and never ships with the library.
[[example]]
name = "lua_bridge_smoke"
crate-type = ["cdylib"]
