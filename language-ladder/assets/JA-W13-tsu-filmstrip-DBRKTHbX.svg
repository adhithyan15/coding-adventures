<svg xmlns="http://www.w3.org/2000/svg" width="342" height="321.35" viewBox="0 0 342 321.35" role="img" aria-label="How to write つ: one unbroken stroke · 2 movements"><title>Writing つ</title><desc>2 frames; frame N shows movements 1 to N of つ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana つ stroke order animation.gif, hiragana つ, 24 frames, 2.4 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%A4_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws つ in one uninterrupted run from the upper left across the high arch, down around the outer right curve, and back left along the broad lower return. The learner path is fitted to the bundled Noto Sans JP subset; handwritten width and the height of the returning finish vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="342" height="321.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="190.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="190.35" viewBox="3 -720 975 1237.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M73 522Q100 527 127.5 534.5Q155 542 183 551Q215 561 265 577.5Q315 594 374 610.5Q433 627 494.5 638.5Q556 650 610 650Q694 650 761 619Q828 588 868 529Q908 470 908 386Q908 314 880.5 257Q853 200 803.5 156.5Q754 113 686 83.5Q618 54 535.5 36.5Q453 19 361 14L325 97Q424 99 513 116.5Q602 134 671.5 168Q741 202 781 256.5Q821 311 821 388Q821 440 796 482.5Q771 525 723.5 550Q676 575 608 575Q559 575 501 563.5Q443 552 384 534.5Q325 517 271.5 497Q218 477 176 460Q134 443 110 434L73 522Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M85 480 L85 480" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M85 480 L175 505 L270 540 L380 570 L495 595 L610 610 L700 590 L770 545 L820 480" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="820" cy="480" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="490.5" y="204.1" text-anchor="middle" font-size="78.1" fill="#6b7280"><tspan x="490.5" y="204.1">1. sweep right from the</tspan><tspan x="490.5" y="299.4">upper left across the</tspan><tspan x="490.5" y="394.7">high arch</tspan></text></svg><rect x="176" y="42" width="150" height="190.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="190.35" viewBox="3 -720 975 1237.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M73 522Q100 527 127.5 534.5Q155 542 183 551Q215 561 265 577.5Q315 594 374 610.5Q433 627 494.5 638.5Q556 650 610 650Q694 650 761 619Q828 588 868 529Q908 470 908 386Q908 314 880.5 257Q853 200 803.5 156.5Q754 113 686 83.5Q618 54 535.5 36.5Q453 19 361 14L325 97Q424 99 513 116.5Q602 134 671.5 168Q741 202 781 256.5Q821 311 821 388Q821 440 796 482.5Q771 525 723.5 550Q676 575 608 575Q559 575 501 563.5Q443 552 384 534.5Q325 517 271.5 497Q218 477 176 460Q134 443 110 434L73 522Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M85 480 L175 505 L270 540 L380 570 L495 595 L610 610 L700 590 L770 545 L820 480" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M820 480 L820 480 L860 405 L862 330 L835 260 L785 205 L720 160 L645 125 L560 90 L465 65 L365 55" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="365" cy="55" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="490.5" y="204.1" text-anchor="middle" font-size="78.1" fill="#6b7280"><tspan x="490.5" y="204.1">2. turn down around the</tspan><tspan x="490.5" y="299.4">right side and return</tspan><tspan x="490.5" y="394.7">left along the broad</tspan><tspan x="490.5" y="489.9">lower curve</tspan></text></svg><text x="16" y="245.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana つ stroke order</text><text x="16" y="257.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">animation.gif, hiragana つ, 24 frames, 2.4 seconds</text><text x="16" y="270.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Wikimedia Commons, 1 October 2009)</text><text x="16" y="282.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="295.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
