<svg xmlns="http://www.w3.org/2000/svg" width="982" height="527.82" viewBox="0 0 982 527.82" role="img" aria-label="How to write 画: 8 strokes · 7 pen lifts · 8 movements"><title>Writing 画</title><desc>8 frames; frame N shows movements 1 to N of 画 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 画.json, ordered stroke paths and medians 1–8 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%94%BB.json&gt;. Source note on variation: The cited PRC-order dataset supplies eight ordered strokes for 画, in three pieces. Median 1 draws a horizontal on top. Medians 2–6 draw 田 as 男 opens: its left side, a horizontal that turns down the right side without lifting, the middle horizontal, the middle vertical, then the bottom. Medians 7–8 draw the open box: a stroke down the left side that turns right along the bottom without lifting, then a vertical on the right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those eight ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turns and seven intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="527.82" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 8 strokes · 7 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="211.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="2