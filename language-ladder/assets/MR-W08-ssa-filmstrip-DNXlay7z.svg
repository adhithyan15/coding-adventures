="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L75 585 L145 585 L215 585 L285 585 L355 585 L425 585 L500 585 L592 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="592" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296" y="198.7" text-anchor="middle" font-size="58.7" fill="#6b7280"><tspan x="296" y="198.7">4. lift, then draw the</tspan><tspan x="296" y="270.3">shirorekha</tspan><tspan x="296" y="341.9">left-to-right</tspan></text></svg><text x="16" y="285.76" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ष-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009</text><text x="16" y="298.26" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
