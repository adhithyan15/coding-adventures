<svg xmlns="http://www.w3.org/2000/svg" width="342" height="331.27" viewBox="0 0 342 331.27" role="img" aria-label="How to write 七: 2 strokes · 1 pen lift · 2 movements"><title>Writing 七</title><desc>2 frames; frame N shows movements 1 to N of 七 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 七.json, ordered stroke paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%83.json&gt;. Source note on variation: The cited PRC-order dataset supplies two ordered strokes for 七. Median 1 crosses from the left edge to the right, rising slightly; median 2 begins high on the right, descends, turns along the foot and lifts into a hook. Two strokes for seven, which is the point the course makes about stroke count and meaning having parted company.</desc><rect x="0" y="0" width="342" height="331.27" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="200.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.27" viewBox="-21 -893 1045 1395.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M49 442L942 586L954 509L62 367L49 442ZM339 823L419 823L419 106Q419 75 425 58.5Q431 42 449.5 36Q468 30 504 30Q515 30 539.5 30Q564 30 596.5 30Q629 30 662 30Q695 30 721.5 30Q748 30 761 30Q795 30 811.5 45Q828 60 835.5 100Q843 140 847 214Q858 207 871.5 200Q885 193 899.5 187Q914 181 924 178Q918 96 904 47Q890 -2 857 -23.5Q824 -45 763 -45Q754 -45 727.5 -45Q701 -45 666.5 -45Q632 -45 597 -45Q562 -45 535.5 -45Q509 -45 501 -45Q439 -45 403.5 -32Q368 -19 353.5 14.5Q339 48 339 108L339 823Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M65 405 L65 405" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M65 405 L250 435 L500 475 L750 515 L935 545" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="935" cy="545" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="268.7" text-anchor="middle" font-size="83.7" fill="#6b7280"><tspan x="501.5" y="268.7">1. draw the rising</tspan><tspan x="501.5" y="370.8">horizontal from left to</tspan><tspan x="501.5" y="472.9">right</tspan></text></svg><rect x="176" y="42" width="150" height="200.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="200.27" viewBox="-21 -893 1045 1395.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M49 442L942 586L954 509L62 367L49 442ZM339 823L419 823L419 106Q419 75 425 58.5Q431 42 449.5 36Q468 30 504 30Q515 30 539.5 30Q564 30 596.5 30Q629 30 662 30Q695 30 721.5 30Q748 30 761 30Q795 30 811.5 45Q828 60 835.5 100Q843 140 847 214Q858 207 871.5 200Q885 193 899.5 187Q914 181 924 178Q918 96 904 47Q890 -2 857 -23.5Q824 -45 763 -45Q754 -45 727.5 -45Q701 -45 666.5 -45Q632 -45 597 -45Q562 -45 535.5 -45Q509 -45 501 -45Q439 -45 403.5 -32Q368 -19 353.5 14.5Q339 48 339 108L339 823Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M65 405 L250 435 L500 475 L750 515 L935 545" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M380 790 L380 790" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M380 790 L380 500 L380 150 L390 65 L450 0 L600 -8 L760 -8 L820 25 L850 100 L870 170" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="870" cy="170" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="268.7" text-anchor="middle" font-size="83.7" fill="#6b7280"><tspan x="501.5" y="268.7">2. lift, descend, bend</tspan><tspan x="501.5" y="370.8">right along the foot and</tspan><tspan x="501.5" y="472.9">hook upward</tspan></text></svg><text x="16" y="255.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 七.json, ordered stroke</text><text x="16" y="267.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths and medians 1–2 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="280.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="292.77" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="305.27" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
