<svg xmlns="http://www.w3.org/2000/svg" width="662" height="330.94" viewBox="0 0 662 330.94" role="img" aria-label="How to write থ: one unbroken stroke · 4 movements"><title>Writing থ</title><desc>4 frames; frame N shows movements 1 to N of থ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 27 (থ, tha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 192 of the 220 stored prototypes of tha are one pen-down stroke. 186 of those 192 start on the left, in the curl, which turns clockwise in all 192. The stroke then runs over the top of the bowl, down to the pointed left tip, round the lower curve and up the stem: 188 end at the top right, and 135 finish with a short move to the right, the flag beside the top of the stem. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="330.94" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="224.94" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="224.94" viewBox="-26 -758 751 1126.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M473 0Q421 90 333 153Q245 216 125 232L87 331Q174 341 224.5 359.5Q275 378 297 406.5Q319 435 319 474Q319 513 29