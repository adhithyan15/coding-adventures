 630 L440 630 L600 630 L760 630 L760 540 L760 450 L760 365" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M70 360 L250 360 L470 360 L700 360 L900 360 L905 280 L900 200 L890 125 L870 75 L835 55 L785 52 L720 55 L650 60" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M456 820 L456 650 L456 475 L456 300 L456 120 L456 -60" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M740 780 L740 780" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M740 780 L790 745 L840 710 L900 665 L925 645" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="925" cy="645" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="505.5" y="301.6" text-anchor="middle" font-size="82.6" fill="#6b7280"><tspan x="505.5" y="301.6">4. lift, then add the</tspan><tspan x="505.5" y="402.4">small upper-right dot</tspan></text></svg><text x="16" y="279.03" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 书.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="291.53" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="304.03" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
