<svg xmlns="http://www.w3.org/2000/svg" width="662" height="328.66" viewBox="0 0 662 328.66" role="img" aria-label="How to write দ: 2 strokes · 1 pen lift · 4 movements"><title>Writing দ</title><desc>4 frames; frame N shows movements 1 to N of দ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 28 (দ, da; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 314 of the 361 stored prototypes draw the body in one pen-down stroke. 289 of those 314 start at the top left, at the left stem under the headline, and 295 end at the bottom right, at the foot of the right side. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 138 of the 361 draw none at all, 107 open with it, 72 end with it and 44 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 199 of the 200 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="328.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="222.66" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.66" viewBox="-80 -692 713 1058.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M394 -10Q376 47 367.5 97Q359 147 359 206Q359 267 369 315Q379 363 394 393Q343 364 304 332.5Q265 301 226.5 261.5Q188 222 141 170L82 210L82 551L-10 551L-10 622L563 622L563 551L159 551L159 297Q209 352 276 404.5Q343 457 425 489L490 424Q462 372 449.5 319Q437 266 437 202Q437 165 440.5 135Q444 105 451 74.5Q458 44 470 7L394 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 570 L118 570" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M118 570 L118 524 L118 477 L118 431 L118 385 L118 339 L121 292 L138 250" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="138" cy="250" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="276.5" y="207.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="276.5" y="207.1">1. start under the</tspan><tspan x="276.5" y="276.8">headline and come down</tspan><tspan x="276.5" y="346.4">the left stem</tspan></text></svg><rect x="176" y="42" width="150" height="222.66" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="222.66" viewBox="-80 -692 713 1058.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M394 -10Q376 47 367.5 97Q359 147 359 206Q359 267 369 315Q379 363 394 393Q343 364 304 332.5Q265 301 226.5 261.5Q188 222 141 170L82 210L82 551L-10 551L-10 622L563 622L563 551L159 551L159 297Q209 352 276 404.5Q343 457 425 489L490 424Q462 372 449.5 319Q437 266 437 202Q437 165 440.5 135Q444 105 451 74.5Q458 44 470 7L394 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 570 L118 524 L118 477 L118 431 L118 385 L118 339 L121 292 L138 250 L138 250" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M138 250 L179 267 L212 296 L243 327 L276 357 L311 384 L347 408 L387 425 L430 418" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="418" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="276.5" y="207.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="276.5" y="207.1">2. turn and run up to</tspan><tspan x="276.5" y="276.8">the right to the</tspan><tspan x="276.5" y="346.4">shoulder</tspan></text></svg><rect x="336" y="42" width="150" height="222.66" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="222.66" viewBox="-80 -692 713 1058.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M394 -10Q376 47 367.5 97Q359 147 359 206Q359 267 369 315Q379 363 394 393Q343 364 304 332.5Q265 301 226.5 261.5Q188 222 141 170L82 210L82 551L-10 551L-10 622L563 622L563 551L159 551L159 297Q209 352 276 404.5Q343 457 425 489L490 424Q462 372 449.5 319Q437 266 437 202Q437 165 440.5 135Q444 105 451 74.5Q458 44 470 7L394 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 570 L118 524 L118 477 L118 431 L118 385 L118 339 L121 292 L138 250 L179 267 L212 296 L243 327 L276 357 L311 384 L347 408 L387 425 L430 418 L430 418" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M430 418 L426 375 L413 333 L404 290 L399 247 L398 203 L399 160 L404 116 L412 73 L418 30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="418" cy="30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="276.5" y="207.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="276.5" y="207.1">3. come down the right</tspan><tspan x="276.5" y="276.8">side to its foot</tspan></text></svg><rect x="496" y="42" width="150" height="222.66" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="222.66" viewBox="-80 -692 713 1058.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M394 -10Q376 47 367.5 97Q359 147 359 206Q359 267 369 315Q379 363 394 393Q343 364 304 332.5Q265 301 226.5 261.5Q188 222 141 170L82 210L82 551L-10 551L-10 622L563 622L563 551L159 551L159 297Q209 352 276 404.5Q343 457 425 489L490 424Q462 372 449.5 319Q437 266 437 202Q437 165 440.5 135Q444 105 451 74.5Q458 44 470 7L394 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M118 570 L118 524 L118 477 L118 431 L118 385 L118 339 L121 292 L138 250 L179 267 L212 296 L243 327 L276 357 L311 384 L347 408 L387 425 L430 418 L426 375 L413 333 L404 290 L399 247 L398 203 L399 160 L404 116 L412 73 L418 30" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L148 586 L275 586 L402 586 L530 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="530" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="276.5" y="207.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="276.5" y="207.1">4. lift, then draw the</tspan><tspan x="276.5" y="276.8">headline last, from left</tspan><tspan x="276.5" y="346.4">to right</tspan></text></svg><text x="16" y="277.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 28 (দ, da;</text><text x="16" y="290.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="302.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
