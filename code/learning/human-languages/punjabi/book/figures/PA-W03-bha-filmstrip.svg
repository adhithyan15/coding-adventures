<svg xmlns="http://www.w3.org/2000/svg" width="662" height="307.63" viewBox="0 0 662 307.63" role="img" aria-label="How to write ਭ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਭ</title><desc>4 frames; frame N shows movements 1 to N of ਭ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਭ (bhabbaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 920, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L920&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਭ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the upper bowl, the right side and the base, ending at the bottom left. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਭ, each by a different non-native copyist; only counts and shares are cited. 95% (19 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 75% (15 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="307.63" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="201.63" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.63" viewBox="-77 -692 731 982.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M255 0Q184 0 123 18Q62 36 13 64L45 138Q94 107 143.5 89.5Q193 72 258 72Q341 72 386.5 104Q432 136 432 207Q432 250 412 287Q379 258 334 242Q289 226 230 226Q146 226 104 258.5Q62 291 62 344Q62 395 103 429Q144 463 227 463Q285 463 330.5 445.5Q376 428 410 397Q418 416 421 434Q424 452 424 467Q424 491 420 513Q416 535 409 551L-7 551L-7 622L584 622L584 551L492 551Q497 536 500 513.5Q503 491 503 463Q503 433 494 401.5Q485 370 464 341Q489 308 500.5 273Q512 238 512 203Q512 101 443 50.5Q374 0 255 0ZM142 345Q142 323 162.5 310Q183 297 229 297Q278 297 312.5 309Q347 321 369 341Q341 365 304 378.5Q267 392 228 392Q180 392 161 377.5Q142 363 142 345Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L170 586 L209 586 L248 586 L287 586 L326 586 L365 586 L404 586 L442 586 L481 586 L520 586 L559 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="559" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="198.6" text-anchor="middle" font-size="58.6" fill="#6b7280"><tspan x="288.5" y="198.6">1. draw the headline</tspan><tspan x="288.5" y="270.1">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="201.63" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="201.63" viewBox="-77 -692 731 982.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M255 0Q184 0 123 18Q62 36 13 64L45 138Q94 107 143.5 89.5Q193 72 258 72Q341 72 386.5 104Q432 136 432 207Q432 250 412 287Q379 258 334 242Q289 226 230 226Q146 226 104 258.5Q62 291 62 344Q62 395 103 429Q144 463 227 463Q285 463 330.5 445.5Q376 428 410 397Q418 416 421 434Q424 452 424 467Q424 491 420 513Q416 535 409 551L-7 551L-7 622L584 622L584 551L492 551Q497 536 500 513.5Q503 491 503 463Q503 433 494 401.5Q485 370 464 341Q489 308 500.5 273Q512 238 512 203Q512 101 443 50.5Q374 0 255 0ZM142 345Q142 323 162.5 310Q183 297 229 297Q278 297 312.5 309Q347 321 369 341Q341 365 304 378.5Q267 392 228 392Q180 392 161 377.5Q142 363 142 345Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L170 586 L209 586 L248 586 L287 586 L326 586 L365 586 L404 586 L442 586 L481 586 L520 586 L559 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M442 586 L442 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M442 586 L452 553 L458 519 L460 482 L457 445 L450 410 L436 377 L417 346" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="417" cy="346" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="198.6" text-anchor="middle" font-size="58.6" fill="#6b7280"><tspan x="288.5" y="198.6">2. lift, then come down</tspan><tspan x="288.5" y="270.1">the stem</tspan></text></svg><rect x="336" y="42" width="150" hei