 y="295.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">guides res/drawable/dot_stroke_c_4_5_na.png and res/drawable/line_stroke_c_4_5_na.png,</text><text x="16" y="308.3" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">movements 1–3 (version 2.6)</text><text x="16" y="320.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
