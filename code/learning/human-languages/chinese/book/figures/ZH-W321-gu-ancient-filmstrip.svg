<svg xmlns="http://www.w3.org/2000/svg" width="822" height="315.45" viewBox="0 0 822 315.45" role="img" aria-label="How to write 古: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 古</title><desc>5 frames; frame N shows movements 1 to N of 古 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 古.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%A4.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 古, in two pieces. Medians 1–2 draw 十: a long horizontal, then a vertical down through its middle. Medians 3–5 draw 口 under it in the order the standalone character uses. These are the first five strokes of 故. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="315.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="209.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.45" viewBox="-16 -910 1035 1445.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 659L949 659L949 586L54 586L54 659ZM203 44L796 44L796 -28L203 -28L203 44ZM459 840L540 840L540 329L459 329L459 840ZM162 370L841 370L841 -77L761 -77L761 298L239 298L239 -81L162 -81L162 370Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M74 622 L74 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M74 622 L928 622" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="928" cy="622" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="501.5" y="303.9">1. draw 十&apos;s horizontal</tspan></text></svg><rect x="176" y="42" width="150" height="209.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="209.45" viewBox="-16 -910 1035 1445.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 659L949 659L949 586L54 586L54 659ZM203 44L796 44L796 -28L203 -28L203 44ZM459 840L540 840L540 329L459 329L459 840ZM162 370L841 370L841 -77L761 -77L761 298L239 298L239 -81L162 -81L162 370Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M74 622 L928 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 819 L500 819" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M500 819 L500 345" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="500" cy="345" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="501.5" y="303.9">2. lift, then draw 十&apos;s</tspan><tspan x="501.5" y="405">vertical</tspan></text></svg><rect x="336" y="42" width="150" height="209.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="209.45" viewBox="-16 -910 1035 1445.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 659L949 659L949 586L54 586L54 659ZM203 44L796 44L796 -28L203 -28L203 44ZM459 840L540 840L540 329L459 329L459 840ZM162 370L841 370L841 -77L761 -77L761 298L239 298L239 -81L162 -81L162 370Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M74 622 L928 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 819 L500 345" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 344 L200 344" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M200 344 L200 -60" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="200" cy="-60" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="501.5" y="303.9">3. lift, then draw 口&apos;s</tspan><tspan x="501.5" y="405">left side</tspan></text></svg><rect x="496" y="42" width="150" height="209.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="209.45" viewBox="-16 -910 1035 1445.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 659L949 659L949 586L54 586L54 659ZM203 44L796 44L796 -28L203 -28L203 44ZM459 840L540 840L540 329L459 329L459 840ZM162 370L841 370L841 -77L761 -77L761 298L239 298L239 -81L162 -81L162 370Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M74 622 L928 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 819 L500 345" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 344 L200 -60" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 333 L200 333" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M200 333 L801 333 L801 -52" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="801" cy="-52" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="501.5" y="303.9">4. lift, then draw 口&apos;s</tspan><tspan x="501.5" y="405">top and turn down its</tspan><tspan x="501.5" y="506.2">right side</tspan></text></svg><rect x="656" y="42" width="150" height="209.45" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="209.45" viewBox="-16 -910 1035 1445.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M54 659L949 659L949 586L54 586L54 659ZM203 44L796 44L796 -28L203 -28L203 44ZM459 840L540 840L540 329L459 329L459 840ZM162 370L841 370L841 -77L761 -77L761 298L239 298L239 -81L162 -81L162 370Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M74 622 L928 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M500 819 L500 345" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 344 L200 -60" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 333 L801 333 L801 -52" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M200 7 L200 7" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M200 7 L801 7" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="801" cy="7" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.9" text-anchor="middle" font-size="82.9" fill="#6b7280"><tspan x="501.5" y="303.9">5. lift, then close 口</tspan><tspan x="501.5" y="405">with a horizontal</tspan></text></svg><text x="16" y="264.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 古.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22</text><text x="16" y="276.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="289.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
