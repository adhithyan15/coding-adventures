<svg xmlns="http://www.w3.org/2000/svg" width="662" height="288.17" viewBox="0 0 662 288.17" role="img" aria-label="How to write ಈ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ಈ</title><desc>4 frames; frame N shows movements 1 to N of ಈ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-ee.gif, animation of Kannada independent vowel ಈ, 44 frames, 4.4 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-ee.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಈ in two pen-down runs: the broad rounded body returns to its upper-right join, sweeps the upper bar left, retraces it right, and curls upward; after one lift, the horizontal crossbar runs left to right and continues through the small right loop into the lower hook. The learner path fits that one-lift order to the bundled Noto Sans Kannada outline rather than inferring handwriting from print alone.</desc><rect x="0" y="0" width="662" height="288.17" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="182.17" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="182.17" viewBox="-50 -860 1111 1349.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M356 -12Q275 -12 210.5 19Q146 50 108.5 110Q71 170 71 255Q71 311 86.5 355.5Q102 400 130 433Q158 466 197 488L215 474L71 474L71 551L427 551Q481 551 503 556Q525 561 536 569Q549 579 553.5 591.5Q558 604 558 618Q558 651 542 682.5Q526 714 493 747L558 790Q605 738 622 696.5Q639 655 639 612Q639 593 631 565Q623 537 598 516Q585 504 567 494.5Q549 485 525 480L520 488Q558 464 584.5 431.5Q611 399 625 356Q639 313 639