<svg xmlns="http://www.w3.org/2000/svg" width="822" height="274.45" viewBox="0 0 822 274.45" role="img" aria-label="How to write ൽ: one unbroken stroke · 5 movements"><title>Writing ൽ</title><desc>5 frames; frame N shows movements 1 to N of ൽ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Sriveenkat, Ml ൽ order.gif, Malayalam chillu L stroke-order animation, 00:00.1–00:09.6 (Wikimedia Commons, 2 July 2023) &lt;https://commons.wikimedia.org/wiki/File:Ml_%E0%B5%BD_order.gif&gt;. Source note on variation: The 97-frame Gayathri-font animation draws ൽ in one uninterrupted run: left entry arch, clockwise central loop, rightward upper shoulder, clockwise right loop, then the finishing hook above the line. The University of Texas Malayalam Script guide independently identifies ൽ as the chillu shared by ത/ല and says a chillu marker extends above the line. This is one attested pedagogical order fitted to the bundled Noto Sans Malayalam outline.</desc><rect x="0" y="0" width="822" height="274.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="180.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="180.95" viewBox="-31 -862 1260 1520" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M731 566Q775 566 815.5 561.5Q856 557 893 547Q930 537 961 519L984 509Q1074 463 1116.5 386.5Q1159 310 1159 221Q1159 112 1107 50Q1055 -12 957 -12Q894 -12 849.5 14.5Q805 41 782 92.5Q759 144 759 217Q759 275 777 324.5Q795 374 827.5 418Q860 462 902 501L929 530Q958 556 980 586Q1002 616 1002 651Q1002 678 984 699Q966 720 924 720Q902 720 882 717Q862 714 849 709L830 778Q847 783 876 787.5Q905 792 938 792Q998 792 1030.5 770.5Q1063 74