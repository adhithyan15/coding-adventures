<svg xmlns="http://www.w3.org/2000/svg" width="822" height="297.58" viewBox="0 0 822 297.58" role="img" aria-label="How to write 对: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 对</title><desc>5 frames; frame N shows movements 1 to N of 对 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 对.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%AF%B9.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 对. Medians 1–2 draw 又 as a turning left-falling stroke crossed by a right-falling one; medians 3–5 draw 寸 as a horizontal, a long hooked vertical through it, and a dot placed last. Left component complete before the right one begins, and the dot is the final stroke. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all five medians to Noto Sans SC while preserving their order, the internal turn in 又, the terminal hook and four intervening lifts; Noto&apos;s 寸 sits slightly higher than the Arphic-derived source graphic&apos;s.</desc><rect x="0" y="0" width="822" height="297.58" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="191.58" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="191.58" viewBox="-25 -910 1054 1346.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M70 706L410 706L410 635L70 635L70 706ZM385 706L398 706L411 709L460 695Q439 501 389.5 352Q340 203 266.5