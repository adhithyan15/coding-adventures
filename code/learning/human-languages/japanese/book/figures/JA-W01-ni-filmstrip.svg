<svg xmlns="http://www.w3.org/2000/svg" width="662" height="301.31" viewBox="0 0 662 301.31" role="img" aria-label="How to write に: 3 strokes · 2 pen lifts · 4 movements"><title>Writing に</title><desc>4 frames; frame N shows movements 1 to N of に (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0306b.svg, hiragana に (U+306B HIRAGANA LETTER NI), three stroke paths kvg:0306b-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0306b.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left vertical drawn top to bottom, which turns at its foot and flicks up to the right without lifting; s2 is the upper stroke drawn left to right, ending in a small turn down and back to the left that the print glyph does not show; s3 starts at the left, curves down and runs out to the right along the base, rising slightly at its end. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. Where the print glyph&apos;s left vertical runs on below the point the flick leaves it, the path goes down to the foot of that ink and climbs back a short way before the flick.</desc><rect x="0" y="0" width="662" height="301.31" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="195.31" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="195.31" viewBox="54 -830 915 1191.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class