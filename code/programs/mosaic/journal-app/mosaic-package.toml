# mosaic-package.toml — the Journal app on Mosaic (J3c-2 of #14416).
#
# A timeline beside one editor. The timeline is the toolkit's RecordList (its
# first product consumer), the editor is DraftEditor, and the Rust app behind
# both is `journal-mosaic-app` (J3c-1), loaded by every generated host as
# `libmosaic_app`. See code/specs/journal-mosaic-app.md for the slot/event
# contract this package's interface mirrors exactly.

[package]
name = "journal-app"
version = "0.1.0"
description = "A journal: dated entries in a timeline beside a plain editor, on the journal-core engine."
license = "MIT OR Apache-2.0"

[components]
exports = ["JournalApp"]

[dependencies]
mosaic-pkg-toolkit = "0.16.0"
mosaic-pkg-draft-editor = "0.1.0"

[app]
initial-window-width = 1100
initial-window-height = 760

[kernel]
version = "1"
