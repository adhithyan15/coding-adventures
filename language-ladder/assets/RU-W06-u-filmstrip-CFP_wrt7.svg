<svg xmlns="http://www.w3.org/2000/svg" width="662" height="379.44" viewBox="0 0 662 379.44" role="img" aria-label="How to write у: one unbroken stroke · 4 movements"><title>Writing у</title><desc>4 frames; frame N shows movements 1 to N of у (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase у demonstration, 07:50–07:55, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 07:50–07:55 lowercase у demonstration, the pen begins at the upper left, descends to the baseline, turns upward without lifting through the right arm, retraces down through that arm into a long descender, curls left around a lower loop, crosses the descender, and rises into a short rightward exit in one continuous pen-down run, for zero intervening lifts. The demonstrated school hand resembles a loop-descender Latin y with a narrow rounded upper body and rising exit; the bundled Noto Sans Cyrillic glyph is a printed y-like form with two straight upper arms and a broad descender that curves left without a loop or exit join. This learner path preserves the source&apos;s left-arm-to-right-arm-to-descender order and zero-lift evidence while fitting the printed outline: descend the left arm, rise through the right arm, retrace to the junction, continue through the long descender, and curve left through its terminal without lifting. Connected cursive restores the source&apos;s lower loop and rising exit, and individual handwriting may round, narrow, widen, or slant the upper body and descender differently.</desc><rect x="0" y="0" width="662" height="379.44" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="273.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="273.44" viewBox="-70 -606 649 1183.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M83 -240Q60 -240 42.5 -237.5Q25 -235 13 -232L13 -153Q26 -156 39.5 -158Q53 -160 69 -160Q115 -160 143.5 -136.5Q172 -113 188 -73L216 -2L0 536L94 536L210 231Q225 191 237 154.5Q249 118 255 85L259 85Q265 110 277.5 150.5Q290 191 305 232L414 536L509 536L278 -74Q250 -150 205.5 -195Q161 -240 83 -240Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M47 500 L47 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M47 500 L80 430 L115 340 L155 240 L215 100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="215" cy="100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="254.5" y="432" text-anchor="middle" font-size="52" fill="#6b7280"><tspan x="254.5" y="432">1. descend the left arm</tspan><tspan x="254.5" y="495.4">to the middle junction</tspan></text></svg><rect x="176" y="42" width="150" height="273.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="273.44" viewBox="-70 -606 649 1183.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M83 -240Q60 -240 42.5 -237.5Q25 -235 13 -232L13 -153Q26 -156 39.5 -158Q53 -160 69 -160Q115 -160 143.5 -136.5Q172 -113 188 -73L216 -2L0 536L94 536L210 231Q225 191 237 154.5Q249 118 255 85L259 85Q265 110 277.5 150.5Q290 191 305 232L414 536L509 536L278 -74Q250 -150 205.5 -195Q161 -240 83 -240Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M47 500 L80 430 L115 340 L155 240 L215 100 L215 100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M215 100 L260 95 L315 220 L365 350 L460 500" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="460" cy="500" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="254.5" y="432" text-anchor="middle" font-size="52" fill="#6b7280"><tspan x="254.5" y="432">2. turn and rise through</tspan><tspan x="254.5" y="495.4">the right arm</tspan></text></svg><rect x="336" y="42" width="150" height="273.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="273.44" viewBox="-70 -606 649 1183.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M83 -240Q60 -240 42.5 -237.5Q25 -235 13 -232L13 -153Q26 -156 39.5 -158Q53 -160 69 -160Q115 -160 143.5 -136.5Q172 -113 188 -73L216 -2L0 536L94 536L210 231Q225 191 237 154.5Q249 118 255 85L259 85Q265 110 277.5 150.5Q290 191 305 232L414 536L509 536L278 -74Q250 -150 205.5 -195Q161 -240 83 -240Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M47 500 L80 430 L115 340 L155 240 L215 100 L260 95 L315 220 L365 350 L460 500" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M460 500 L460 500 L410 400 L360 270 L310 145 L260 60 L235 -40 L220 -85" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="220" cy="-85" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="254.5" y="432" text-anchor="middle" font-size="52" fill="#6b7280"><tspan x="254.5" y="432">3. retrace to the</tspan><tspan x="254.5" y="495.4">junction and descend</tspan><tspan x="254.5" y="558.9">below the baseline</tspan></text></svg><rect x="496" y="42" width="150" height="273.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="273.44" viewBox="-70 -606 649 1183.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M83 -240Q60 -240 42.5 -237.5Q25 -235 13 -232L13 -153Q26 -156 39.5 -158Q53 -160 69 -160Q115 -160 143.5 -136.5Q172 -113 188 -73L216 -2L0 536L94 536L210 231Q225 191 237 154.5Q249 118 255 85L259 85Q265 110 277.5 150.5Q290 191 305 232L414 536L509 536L278 -74Q250 -150 205.5 -195Q161 -240 83 -240Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M47 500 L80 430 L115 340 L155 240 L215 100 L260 95 L315 220 L365 350 L460 500 L410 400 L360 270 L310 145 L260 60 L235 -40 L220 -85 L220 -85" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M220 -85 L205 -125 L175 -165 L135 -195 L85 -200" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="85" cy="-200" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="254.5" y="432" text-anchor="middle" font-size="52" fill="#6b7280"><tspan x="254.5" y="432">4. curve left through</tspan><tspan x="254.5" y="495.4">the descender terminal</tspan></text></svg><text x="16" y="328.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase у demonstration,</text><text x="16" y="340.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">07:50–07:55, YouTube, 5 February 2013</text><text x="16" y="353.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
