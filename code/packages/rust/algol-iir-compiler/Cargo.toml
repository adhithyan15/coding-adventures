[package]
name = "algol-iir-compiler"
version = "0.15.0"
edition = "2021"
description = "ALGOL 60 scalar frontend for the LANG VM Rust chain, lowering parsed ALGOL into interpreter_ir::IIRModule. v0.15.0 proves AL4 multi-argument output over literal-backed scalar string slots on every LANG backend; v0.14.0 proved scalar string copy snapshots."

[dependencies]
coding-adventures-algol-parser = { path = "../algol-parser" }
interpreter-ir = { path = "../interpreter-ir" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
vm-core = { path = "../vm-core" }

[dev-dependencies]
aot-core = { path = "../aot-core" }
iir-to-beam = { path = "../iir-to-beam" }
iir-to-cil-bytecode = { path = "../iir-to-cil-bytecode" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-llvm = { path = "../iir-to-llvm" }
iir-to-wasm = { path = "../iir-to-wasm" }
jit-core = { path = "../jit-core" }
