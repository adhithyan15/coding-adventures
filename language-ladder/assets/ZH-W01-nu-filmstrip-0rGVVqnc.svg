<svg xmlns="http://www.w3.org/2000/svg" width="662" height="330.83" viewBox="0 0 662 330.83" role="img" aria-label="How to write 女: 3 strokes · 2 pen lifts · 4 movements"><title>Writing 女</title><desc>4 frames; frame N shows movements 1 to N of 女 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 女.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%A5%B3.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 女. Median 1 starts near the upper centre, makes a short down-right entry, bends down-left to the lower-left junction, then turns without lifting and sweeps down-right to finish; median 2 restarts at the upper right and falls down-left; median 3 restarts at the left edge and crosses the middle from left to right. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those three ordered medians to the vendored Noto Sans SC outline while preserving their directions, the first stroke&apos;s internal turn, and two intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="662" height="330.83" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="224.83" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="224.83" viewBox="-24 -920 1038 1555.8