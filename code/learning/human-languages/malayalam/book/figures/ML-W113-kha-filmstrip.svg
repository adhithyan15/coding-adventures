<svg xmlns="http://www.w3.org/2000/svg" width="662" height="264.13" viewBox="0 0 662 264.13" role="img" aria-label="How to write ഖ: one unbroken stroke · 4 movements"><title>Writing ഖ</title><desc>4 frames; frame N shows movements 1 to N of ഖ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxv: movements 1-4 for ഖ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-035.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxv) circles the small inner loop (1), arches over the top and comes down to the base (2), runs right along the base (3) and climbs the upright (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 107 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (76 of 107) and end at the upper right (103 of 107). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its KHA.png at the middle left and ends it at the upper right. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing.</desc><rect x="0" y="0" width="662" height="264.13" fill="#ffffff"/><text x="16" y="31" font-fa