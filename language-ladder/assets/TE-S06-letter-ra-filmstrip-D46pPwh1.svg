<svg xmlns="http://www.w3.org/2000/svg" width="342" height="411.01" viewBox="0 0 342 411.01" role="img" aria-label="How to write ర: 2 strokes · 1 pen lift · 2 movements"><title>Writing ర</title><desc>2 frames; frame N shows movements 1 to N of ర (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after AppChant, Telugu Alphabets Writing, consonant ర animated path guide encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_ర in version 3.8.05 (3805) &lt;https://play.google.com/store/apps/details?id=com.banuchanderjj.tracer.telugu&gt;. Source note on variation: The packaged auto-trace data gives two ordered starts, paths, and ends. Its ర.png atlas mapping and pictured glyph independently identify U+0C30 ర. The bundled Noto Sans Telugu outline rounds the printed joins differently, so the filmstrip preserves the two attested movement boundaries and directions while fitting their centre lines to that outline. Inspected XAPK SHA-256: 30c6e520a5b469cbe8d17568718bf75796987ea9596f69850eb921db2fe7bd57; libTracer.so SHA-256: 444511c98b69ada4de57900776945837c013da6a4fbfb21833c180d06f9c3ac5.</desc><rect x="0" y="0" width="342" height="411.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="248.76" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="248.76" viewBox="-35 -795 699 1159.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 236Q35 314 68 373.5Q101 433 159.5 466.5Q218 500 296 500Q375 500 433.5 467.5Q492 435 525 376Q558 317 558 237Q558 163 526 106.5Q494 50 435 19Q376 -12 296 -12Q217 -12 1