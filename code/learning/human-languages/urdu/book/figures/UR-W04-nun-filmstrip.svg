<svg xmlns="http://www.w3.org/2000/svg" width="342" height="397.34" viewBox="0 0 342 397.34" role="img" aria-label="How to write ن: 2 strokes · 1 pen lift · 2 movements"><title>Writing ن</title><desc>2 frames; frame N shows movements 1 to N of ن (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Sīn, shīn, baṛī he, nūn, and nūn-e ġhunna, independent ن calligraphic and handwriting animations and Nūn instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/sin-shin-bari-he-nun-nun-ghunna/&gt;. Source note on variation: Both independent-form animations draw the bowl first in one uninterrupted right-to-left run, then lift once and place the dot near the baseline. The lesson says final and independent nūn use a bowl extending below the baseline with the dot near the baseline itself; initial and medial nūn instead resemble a be-series tooth with one dot above it. This learner path covers the independent form and fits the two-stroke order to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="342" height="397.34" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="253.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="253.84" viewBox="-2 -441 607 1027.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q301 -179 351.5 -162.5Q402 -146 442 -117.5Q482 -89 498 -54Q465 17 449 65Q433 113 433 137Q433 163 447.5 183.5Q462 204 498 226Q500 215 503 196.5Q506 178 510.5 153.5Q515 129 521 97Q528 61 531.5 32.5Q535 4 535 -17Q535 -78 496 -134.5Q457 -191 389 -226Q355 -244 320 -253Q285 -262 249 -262ZM276 233Q232 266 204 298Q230 324 247 342Q264 360 274 371Q290 354 306.5 337.5Q323 321 340 306Q329 290 312.5 271.5Q296 253 276 233Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M495 210 L495 210" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M495 210 L475 160 L480 100 L500 40 L510 -20 L485 -80 L430 -140 L360 -190 L280 -220 L210 -215 L150 -170 L105 -110 L90 -60 L95 0 L105 45" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="45" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301.5" y="450.6" text-anchor="middle" font-size="48.6" fill="#6b7280"><tspan x="301.5" y="450.6">1. sweep the independent</tspan><tspan x="301.5" y="509.9">bowl right to left below</tspan><tspan x="301.5" y="569.2">the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="253.84" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="253.84" viewBox="-2 -441 607 1027.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -97 149.5 -138Q186 -179 251 -179Q301 -179 351.5 -162.5Q402 -146 442 -117.5Q482 -89 498 -54Q465 17 449 65Q433 113 433 137Q433 163 447.5 183.5Q462 204 498 226Q500 215 503 196.5Q506 178 510.5 153.5Q515 129 521 97Q528 61 531.5 32.5Q535 4 535 -17Q535 -78 496 -134.5Q457 -191 389 -226Q355 -244 320 -253Q285 -262 249 -262ZM276 233Q232 266 204 298Q230 324 247 342Q264 360 274 371Q290 354 306.5 337.5Q323 321 340 306Q329 290 312.5 271.5Q296 253 276 233Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M495 210 L475 160 L480 100 L500 40 L510 -20 L485 -80 L430 -140 L360 -190 L280 -220 L210 -215 L150 -170 L105 -110 L90 -60 L95 0 L105 45" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M235 305 L235 305" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M235 305 L275 345 L315 305" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="315" cy="305" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="301.5" y="450.6" text-anchor="middle" font-size="48.6" fill="#6b7280"><tspan x="301.5" y="450.6">2. lift, then place the</tspan><tspan x="301.5" y="509.9">dot near the baseline</tspan></text></svg><text x="16" y="308.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Sīn, shīn, baṛī he, nūn,</text><text x="16" y="321.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">and nūn-e ġhunna, independent ن calligraphic and</text><text x="16" y="333.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">handwriting animations and Nūn instructions (Northwestern</text><text x="16" y="346.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">University Libraries Open Textbook, 2026)</text><text x="16" y="358.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="371.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
