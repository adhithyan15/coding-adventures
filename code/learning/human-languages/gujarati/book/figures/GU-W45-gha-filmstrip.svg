<svg xmlns="http://www.w3.org/2000/svg" width="342" height="363.44" viewBox="0 0 342 363.44" role="img" aria-label="How to write ઘ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ઘ</title><desc>2 frames; frame N shows movements 1 to N of ઘ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ઘ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ઘ as two ordered pen-down runs. Its first SVG path begins at the upper left, circles through the upper lobe, turns back left through the middle, then continues clockwise around the rounded lower body and finishes at its upper right. The animation lifts once and its second SVG path descends the full right spine before turning through its lower foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the upper lobe, middle turn, rounded lower body, and tall right spine, but its printed lobes are broader and the spine foot more angular than the animated school-hand form. This learner path preserves the source&apos;s joined-upper-and-lower-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the lobes, turn, spine, and terminals differently.</desc><rect x="0" y="0" width="342" height="363.44" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="232.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="232.44" viewBox="-26 -673 708 1097.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M274 107Q184 107 133.5 150.5Q83 194 83 261Q83 317 114 355Q83 377 63.5 406.5Q44 436 44 478Q44 528 86 565.5Q128 603 210 603Q231 603 258 600Q285 597 304 592L290 521Q275 525 255.5 527.5Q236 530 219 530Q170 530 147.5 513.5Q125 497 125 470Q125 449 136 430.5Q147 412 172 396Q209 411 259 411Q273 411 291 409Q309 407 320 405L308 333Q291 338 257 338Q217 338 190.5 320.5Q164 303 164 264Q164 222 194.5 200.5Q225 179 274 179Q329 179 370 200Q411 221 446 255L446 603L526 592L526 152Q526 125 529 112.5Q532 100 538 92Q549 78 570 75.5Q591 73 612 73L604 0L594 0Q551 0 522.5 9.5Q494 19 477 37Q461 54 453.5 79Q446 104 446 148L446 161Q415 139 373.5 123Q332 107 274 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M280 560 L280 560" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M280 560 L220 565 L160 555 L110 530 L80 490 L80 450 L100 415 L140 385 L185 370 L235 370 L285 380 L245 375 L200 365 L160 340 L135 305 L125 265 L135 220 L160 180 L200 150 L250 135 L305 140 L355 160 L400 195 L430 240" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="240" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328" y="196.7" text-anchor="middle" font-size="56.7" fill="#6b7280"><tspan x="328" y="196.7">1. circle the upper</tspan><tspan x="328" y="265.9">lobe, turn through the</tspan><tspan x="328" y="335">middle, and round the</tspan><tspan x="328" y="404.2">lower body</tspan></text></svg><rect x="176" y="42" width="150" height="232.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="232.44" viewBox="-26 -673 708 1097.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M274 107Q184 107 133.5 150.5Q83 194 83 261Q83 317 114 355Q83 377 63.5 406.5Q44 436 44 478Q44 528 86 565.5Q128 603 210 603Q231 603 258 600Q285 597 304 592L290 521Q275 525 255.5 527.5Q236 530 219 530Q170 530 147.5 513.5Q125 497 125 470Q125 449 136 430.5Q147 412 172 396Q209 411 259 411Q273 411 291 409Q309 407 320 405L308 333Q291 338 257 338Q217 338 190.5 320.5Q164 303 164 264Q164 222 194.5 200.5Q225 179 274 179Q329 179 370 200Q411 221 446 255L446 603L526 592L526 152Q526 125 529 112.5Q532 100 538 92Q549 78 570 75.5Q591 73 612 73L604 0L594 0Q551 0 522.5 9.5Q494 19 477 37Q461 54 453.5 79Q446 104 446 148L446 161Q415 139 373.5 123Q332 107 274 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M280 560 L220 565 L160 555 L110 530 L80 490 L80 450 L100 415 L140 385 L185 370 L235 370 L285 380 L245 375 L200 365 L160 340 L135 305 L125 265 L135 220 L160 180 L200 150 L250 135 L305 140 L355 160 L400 195 L430 240" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M485 560 L485 560" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M485 560 L485 500 L485 430 L485 350 L485 270 L485 190 L485 120 L500 75 L535 45 L580 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="580" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="328" y="196.7" text-anchor="middle" font-size="56.7" fill="#6b7280"><tspan x="328" y="196.7">2. lift, then descend</tspan><tspan x="328" y="265.9">the right spine and turn</tspan><tspan x="328" y="335">through its lower foot</tspan></text></svg><text x="16" y="287.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="299.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ઘ animation, first and second SVG</text><text x="16" y="312.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="324.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="337.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
