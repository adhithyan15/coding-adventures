<svg xmlns="http://www.w3.org/2000/svg" width="982" height="315.02" viewBox="0 0 982 315.02" role="img" aria-label="How to write ೫: one unbroken stroke · 6 movements"><title>Writing ೫</title><desc>6 frames; frame N shows movements 1 to N of ೫ (kannada), the movement being added drawn in ink over the finished digit, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೫, trace image file-v853c86z.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೫ as one path that starts at the curled tip of the head, curls clockwise over it, runs down the stem, circles the lower bowl clockwise, crosses to the right, circles the upper right loop anticlockwise and runs down the right leg to finish at the lower right (start upper left, end lower right). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="982" height="315.02" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="209.02" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="209.02" viewBox="-41 -772 778 1084.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M177 410Q135 414 101.5 429.5Q68 445 48.5 476.5Q29 508 29 560Q29 606 49.5 637.5Q70 669 104 685.5Q138 702 179 702Q231 702 268.5 674Q306 646 329.5 591.5Q353 537 364 457.5Q375 378 375 274Q375 179 353 115Q331 51 287 19.5Q243 -12 178 -12Q130 -12 97 9Q64 30 47 65Q30 100 30 143Q30 179 44 214.5Q58 250 92 283.5Q126 317 184.5 344.5Q243 372 331 391L456 420Q498 433 525.5 452Q553 471 566.5 497Q580 523 580 557Q580 592 565.5 608.5Q551 625 528 625Q501 625 485 606.5Q469 588 469 557Q469 534 476 508.5Q483 483 498.5 454Q514 425 540 390Q563 357 582.5 321.5Q602 286 614.5 246.5Q627 207 627 160Q627 107 608 68Q589 29 553 -12L479 48Q508 75 524 103Q540 131 540 168Q540 199 533.5 225.5Q527 252 511.5 282.5Q496 313 468 357Q463 365 461 370.5Q459 376 454 383Q426 426 409 469.5Q392 513 392 556Q392 601 409 634Q426 667 457 684.5Q488 702 531 702Q576 702 606.5 683.5Q637 665 652 632.5Q667 600 667 558Q667 516 651.5 480Q636 444 603.5 415Q571 386 519 366L354 323Q255 299 203.5 270Q152 241 133 208.5Q114 176 114 142Q114 116 123 98.5Q132 81 148 73Q164 65 183 65Q213 65 237 83Q261 101 275 145Q289 189 289 266Q289 323 284 386Q279 449 266.5 503Q254 557 232 591Q210 625 176 625Q150 625 131 609Q112 593 112 558Q112 525 132 508Q152 491 187 489L177 410Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M165 450 L165 450" fill="none" stroke="#9aa1ad" stroke-width