<svg xmlns="http://www.w3.org/2000/svg" width="982" height="297.88" viewBox="0 0 982 297.88" role="img" aria-label="How to write ಹ: 2 strokes · 1 pen lift · 6 movements"><title>Writing ಹ</title><desc>6 frames; frame N shows movements 1 to N of ಹ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-ha.gif, animation of Kannada consonant ಹ, 40 frames, 4.0 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-ha.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಹ in two pen-down runs: from the upper right of the left ring the pen arches over leftward and closes the ring counterclockwise, arches over to the right and down the right ring&apos;s outer side, rounds its base, climbs its inner side to the waist and rises up the neck (frames 0–20); after one lift it draws the top bar from left to right and curls up into the hook (frames 21–29). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (235×217, 115 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the two rings share one upright between them, so the path starts at the top of that upright and runs down it once for each ring, but the one-lift order remains the same.</desc><rect x="0" y="0" width="982" height="297.88" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 6 movements</text><rect x="16" y="42" width="150" height="204.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="204.38" viewBox="-37 -860 875 1192.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph