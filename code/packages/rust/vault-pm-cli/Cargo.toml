[package]
name = "coding_adventures_vault_pm_cli"
version = "0.1.0"
edition = "2021"
description = "Strict parser, renderer, and local composition driver for vault-pm"
license = "MIT"

[dependencies]
coding_adventures_storage_fs = { path = "../storage-fs" }
coding_adventures_vault_pm_agent_host = { path = "../vault-pm-agent-host" }
coding_adventures_vault_pm_application = { path = "../vault-pm-application" }
coding_adventures_vault_pm_application_storage_core = { path = "../vault-pm-application-storage-core" }
coding_adventures_vault_pm_cli_host = { path = "../vault-pm-cli-host" }
coding_adventures_vault_pm_config = { path = "../vault-pm-config" }
coding_adventures_vault_pm_crash_injection = { path = "../vault-pm-crash-injection", optional = true }
coding_adventures_vault_pm_domain = { path = "../vault-pm-domain" }
coding_adventures_vault_pm_local_host = { path = "../vault-pm-local-host" }
coding_adventures_vault_pm_password_policy = { path = "../vault-pm-password-policy" }
coding_adventures_vault_records = { path = "../vault-records" }
coding_adventures_vault_pm_storage_storage_core = { path = "../vault-pm-storage-storage-core" }
coding_adventures_zeroize = { path = "../zeroize" }

[features]
# Test-only real-process crash injection (VLT-PM41). Only
# `code/programs/rust/vault-pm-cli-drill` enables it. The product executable
# `code/programs/rust/vault-pm-cli` names it in no section AND fails to
# compile when it is active, via a `const` assertion on
# `CRASH_INJECTION_COMPILED` - declaring no feature is not enough on its own,
# because cargo's `--features <dep>/<feature>` syntax reaches a direct
# dependency's features regardless.
crash-injection = ["dep:coding_adventures_vault_pm_crash_injection"]

[dev-dependencies]
libc = "0.2"
# VLT-PM42 tests wedge a real on-disk vault the way a crash wedges one: they
# open it through the ordinary application boundary over a *faulting* view of
# the very same object root, so the write-ahead journal becomes durable and the
# publication does not. This adds nothing to the shipped graph -
# `vault-pm-application` already depends on this crate - and it enables no
# feature, unlike the crash-injection seam which must stay out of any build the
# product executable can reach.
coding_adventures_vault_pm_storage = { path = "../vault-pm-storage" }
# VLT-PM47's round-trip test re-derives the content hash the attachment
# listing renders, so it checks the rendered value against an independent
# computation rather than against the code that produced it. Same argument as
# the line above: already in the graph, and no feature is enabled.
coding_adventures_sha256 = { path = "../sha256" }
