<svg xmlns="http://www.w3.org/2000/svg" width="838" height="424.39" viewBox="0 0 838 424.39" role="img" aria-label="How to write ك، ر: 2 letters, ك, ر, one after another"><title>Writing ك، ر</title><desc>2 letters written one after another: ك, ر (arabic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: ك: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ي ك ل, independent Kaf at 00:11.8–00:13.4 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/alphabet-%d9%82-%d9%84-%d9%85/&gt;; ر: Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: د ذ ر, independent Raa at 00:08.8–00:09.3 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/chapter-1/&gt;. Source notes on variation: ك: The page&apos;s directly linked kaf.mov demonstrates independent ك in two pen-down runs. The first run at 00:11.8–00:12.9 descends the main upright and turns left along the baseline without lifting. After one lift, the second run at 00:13.2–00:13.4 begins at the upper right and draws the inner arm down-left. The adjacent lesson identifies Kaf as a two-way connector and separately prints its contextual shapes. This two-stroke, one-lift learner path fits the course&apos;s vendored Noto Naskh outline. Its Arabic-scoped ك identity and provenance remain distinct from Urdu ک, which uses a different Unicode glyph and a separate source-backed fallback order. ر: The cited Raa demonstration draws independent ر in one continuous pen-down run at 00:08.8–00:09.3: it begins at the upper tip, descends through the short stroke, then sweeps left through the lower curve without lifting. The adjacent lesson identifies raa as a one-way connector and separately prints its independent and final forms. This independent learner path fits the course&apos;s vendored Noto Naskh outline while keeping its provenance scoped to Arabic rather than inheriting the already-authored Urdu ر source for the same Unicode glyph.</desc><rect x="0" y="0" width="838" height="424.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="61" width="150" height="258.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="258.38" viewBox="-53 -741 621 1069.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M226 0Q162 0 90 6Q17 12 17 20Q17 37 22 62Q27 87 33 97Q59 91 95 86Q131 81 170 78.5Q209 76 245 76Q298 76 352 81Q406 86 460 96Q450 155 440 214.5Q430 274 419 333Q413 365 406.5 403.5Q400 442 395 479.5Q390 517 387 547Q384 577 384 592Q384 625 399 644Q414 663 450 671Q455 652 465.5 617Q476 582 485 552L459 530Q479 348 488.5 242.5Q498 137 498 108Q498 80 488 58.5Q478 37 462 17Q407 9 347.5 4.5Q288 0 226 0ZM180 194Q167 194 162 200Q157 206 157 214Q183 216 207.5 225Q232 234 249 246Q257 251 262.5 256.5Q268 262 271 268Q224 269 198 277.5Q172 286 172 316Q172 332 184 350Q196 368 214 381Q232 394 250 394Q276 394 284 366L268 359Q263 364 256 364Q248 364 237 356Q226 348 216.5 337Q207 326 205 315Q222 307 248 304.5Q274 302 287 293Q296 287 296 274Q296 261 277 242Q258 223 231 208.5Q204 194 180 194Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M430 630 L430 630" fill="none" stroke="#9aa1ad" stroke-widt