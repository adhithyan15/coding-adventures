# Cargo.toml - smoke-test harness for the Journal Mosaic app package.
#
# The Mosaic sources in this directory describe the Journal app surface. This
# Cargo project exists only to test the package contract: sources compile,
# dependencies resolve, the Rust app (journal-mosaic-app) matches the interface
# exactly, and the package survives native lowering.

[workspace]
# Intentionally empty: opt out of the parent Rust workspace.

[package]
name        = "journal-app-smoke"
version     = "0.1.0"
edition     = "2021"
description = "Smoke-test harness for the Journal Mosaic app package"
publish     = false

[dev-dependencies]
journal-mosaic-app      = { path = "../../../packages/rust/journal-mosaic-app" }
mosaic-app-runtime      = { path = "../../../packages/rust/mosaic-app-runtime" }
mosmodel-compiler       = { path = "../../../packages/rust/mosmodel-compiler" }
moslayout-compiler      = { path = "../../../packages/rust/moslayout-compiler" }
mosstyle-compiler       = { path = "../../../packages/rust/mosstyle-compiler" }
mosaic-package-artifact-builder = { path = "../../../packages/rust/mosaic-package-artifact-builder" }
mosaic-package-manifest = { path = "../../../packages/rust/mosaic-package-manifest" }
mosaic-package-resolver = { path = "../../../packages/rust/mosaic-package-resolver" }
serde_json              = "1"
tempfile                = "3"

[[test]]
name = "package_compiles"
path = "tests/package_compiles.rs"

[[test]]
name = "adapter_event_contract"
path = "tests/adapter_event_contract.rs"

[[test]]
name = "native_complete_gate"
path = "tests/native_complete_gate.rs"
