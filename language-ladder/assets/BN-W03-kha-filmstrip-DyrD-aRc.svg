le" font-size="61" fill="#6b7280"><tspan x="360.5" y="201">4. climb the stem and</tspan><tspan x="360.5" y="275.4">turn right into the</tspan><tspan x="360.5" y="349.8">flag</tspan></text></svg><text x="16" y="277.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 12 (খ,</text><text x="16" y="290.08" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">kha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="302.58" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
