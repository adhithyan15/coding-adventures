 x="476.5" y="287.5">3. draw the long</tspan><tspan x="476.5" y="372.3">descender across the</tspan><tspan x="476.5" y="457.1">sweep to the lower</tspan><tspan x="476.5" y="541.9">right</tspan></text></svg><text x="16" y="274.93" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sirgazil, Hiragana や stroke order animation.gif, hiragana や, 28 frames,</text><text x="16" y="287.43" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2.8 seconds (Wikimedia Commons, 1 October 2009); KanjiVG kanji/03083.svg, three stroke</text><text x="16" y="299.93" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths in the same order; the Unicode Standard names U+3083 HIRAGANA LETTER SMALL YA</text><text x="16" y="312.43" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
