n.gif, hiragana や, 28 frames,</text><text x="16" y="289.22" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2.8 seconds (Wikimedia Commons, 1 October 2009)</text><text x="16" y="301.72" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
