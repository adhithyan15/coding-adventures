<svg xmlns="http://www.w3.org/2000/svg" width="662" height="359.89" viewBox="0 0 662 359.89" role="img" aria-label="How to write 中: 4 strokes · 3 pen lifts · 4 movements"><title>Writing 中</title><desc>4 frames; frame N shows movements 1 to N of 中 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 中.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%AD.json&gt;. Source note on variation: The cited PRC-order dataset supplies four ordered strokes for 中: the left side, the joined top-and-right corner, the closing bottom horizontal, and the final central vertical through the box. This learner path preserves the joined corner, close-before-centre order, and three intervening pen lifts while adapting the paths to the vendored Noto Sans SC outline.</desc><rect x="0" y="0" width="662" height="359.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="253.89" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="253.89" viewBox="26 -910 946 1601.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M96 661L902 661L902 191L825 191L825 588L171 588L171 186L96 186L96 661ZM136 322L870 322L870 248L136 248L136 322ZM458 840L537 840L537 -79L458 -79L458 840Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M152 616 L152 616" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M152 616 L152 520 L152 424 L152 328 L152 232" fill="none" s