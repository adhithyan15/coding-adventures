<svg xmlns="http://www.w3.org/2000/svg" width="662" height="316.22" viewBox="0 0 662 316.22" role="img" aria-label="How to write ਤ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਤ</title><desc>4 frames; frame N shows movements 1 to N of ਤ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਤ (tattaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 665, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L665&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਤ in two pen-down strokes: the headline from left to right; then from the top right down the stem, clockwise round the knob, the right side and the base, ending at the bottom left. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the knob as a solid teardrop, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਤ, each by a different non-native copyist; only counts and shares are cited. 90% (18 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 60% (12 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="316.22" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="210.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="210.22" viewBox="-77 -692 696 975.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M250 0Q183 0 122.5 18Q62 36 13 64L45 137Q93 106 143 89.5Q193 73 248 73Q292 73 327.5 84.5Q363 96 384.5 121.5Q406 147 406 189Q406 238 375.5 271Q345 304 294 324Q272 320 242 316Q212 312 181 312Q135 312 111 320.5Q87 329 78 342Q69 355 69 369Q69 398 94.5 408.5Q120 419 157 419Q197 419 232.5 412.5Q268 406 302 393Q337 407 359.5 436Q382 465 382 512Q382 531 378 551L-7 551L-7 622L549 622L549 551L460 551Q463 529 463 511Q463 449 438.5 416.5Q414 384 377 362Q427 335 457.5 294Q488 253 488 188Q488 127 457.5 85Q427 43 373.5 21.5Q320 0 250 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 586 L93 586 L132 586 L172 586 L211 586 L250 586 L289 586 L328 586 L367 586 L407 586 L446 586 L485 586 L524 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="524" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="271" y="195.8" text-anchor="middle" font-size="55.8" fill="#6b7280"><tspan x="271" y="195.8">1. draw the headline</tspan><tspan x="271" y="263.9">from left to right</tspan></text></svg><rect x="176" y="42" width="150" height="210.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="210.22" viewBox="-77 -692 696 975.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M250 0Q183 0 122.5 18Q62 36 13 64L45 137Q93 106 143 89.5Q193 73 248 73Q292 73 327.5 84.5Q363 96 384.5 121.5Q406 147 406 189Q406 238 375.5 271Q345 304 294 324Q272 320 242 316Q212 312 181 312Q135 312 111 320.5Q87 329 78 342Q69 355 69 369Q69 398 94.5 408.5Q120 419 157 419Q197 419 232.5 412.5Q268 406 302 393Q337 407 359.5 436Q382 465 382 512Q382 531 378 551L-7 551L-7 622L549 622L549 551L460 551Q463 529 463 511Q463 449 438.5 416.5Q414 384 377 362Q427 335 457.5 294Q488 253 488 188Q488 127 457.5 85Q427 43 373.5 21.5Q320 0 250 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 586 L93 586 L132 586 L172 586 L211 586 L250 586 L289 586 L328 586 L367 586 L407 586 L446 586 L485 586 L524 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M422 586 L422 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M422 586 L420 546 L417 506 L410 468 L395 433 L375 400" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="375" cy="400" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="271" y="195.8" text-anchor="middle" font-size="55.8" fill="#6b7280"><tspan x="271" y="195.8">2. lift, then come down</tspan><tspan x="271" y="263.9">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="210.22" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="210.22" viewBox="-77 -692 696 975.4" preserveAspectRatio="xM