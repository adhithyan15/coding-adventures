[package]
name = "algol-iir-compiler"
version = "0.54.0"
edition = "2021"
description = "ALGOL 60 scalar frontend for the LANG VM Rust chain, lowering parsed ALGOL into interpreter_ir::IIRModule. v0.41.0 (scalar-formal capture): nested procedures share enclosing scalar value parameters; v0.40.0 (switch designators): conditional and nested switch-list elements evaluate at computed-goto time; v0.39.0 (array-formal capture): nested procedures share an outer array value parameter's handle and full descriptor; v0.38.0 (zero-argument procedures): explicit `f()` calls work in value and statement position; v0.37.0 (rank-aware array parameters): integer/real/string array value parameters carry a typed handle plus all lower bounds and row-major strides; v0.36.0 (AL1 numeric promotion): integer values widen through `int_to_real` whenever a real is required; v0.35.0 (AL8 array parameters): one-dimensional integer/real/string array value parameters carry a handle and declared lower bound across calls; v0.34.0 (AL7 static strings): captured and own scalar strings use typed persistent globals; v0.33.0 (AL6 own arrays): static arrays allocate once and persist across procedure calls; v0.32.0 (AL captured arrays): procedures retain enclosing array handles and declared bounds; v0.31.0 (E4d-AL string arrays): `string array` reuses the shared array<str> substrate; v0.30.0 (E4d-AL runtime ordering): initialized scalar strings can receive a string-procedure result and participate in lexical ordering across the LANG VM/AOT/JIT chain; v0.29.0 (E4d-AL runtime locals): initialized scalar strings can receive a string-procedure result and then be copied, compared, and printed; v0.28.0 (E4d-AL): `string procedure`s return runtime strings; v0.27.0 (AL-pow): `↑` exponentiation; v0.26.0 (AL-multidim-bounds): multidim arrays with arbitrary/negative per-dimension lower bounds."

[dependencies]
coding-adventures-algol-parser = { path = "../algol-parser" }
interpreter-ir = { path = "../interpreter-ir" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
vm-core = { path = "../vm-core" }

[dev-dependencies]
aot-core = { path = "../aot-core" }
iir-to-beam = { path = "../iir-to-beam" }
iir-to-cil-bytecode = { path = "../iir-to-cil-bytecode" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-llvm = { path = "../iir-to-llvm" }
iir-to-wasm = { path = "../iir-to-wasm" }
jit-core = { path = "../jit-core" }
