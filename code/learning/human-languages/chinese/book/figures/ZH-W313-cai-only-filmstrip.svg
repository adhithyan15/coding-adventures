"M605 827 L605 827" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M605 827 L609 795 L622 786 L618 30 L594 -33 L420 -2" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="-2" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="487" y="290.5" text-anchor="middle" font-size="83.5" fill="#6b7280"><tspan x="487" y="290.5">2. lift, then draw 扌&apos;s</tspan><tspan x="487" y="392.4">vertical and hook left</tspan></text></svg><rect x="336" y="42" width="150" height="206.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="206.5" viewBox="-34 -911 1042 1434.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M67 637L938 637L938 560L67 560L67 637ZM589 841L670 841L670 37Q670 -3 658.5 -23Q647 -43 620 -52Q595 -62 548.5 -64.5Q502 -67 428 -66Q426 -55 421.5 -41Q417 -27 412 -13Q407 1 400 12Q436 11 469 10.5Q502 10 526.5 10.5Q551 11 560 11Q576 12 582.5 17.5Q589 23 589 37L589 841ZM551 624L616 581Q575 505 516.5 427Q458 349 388.5 277Q319 205 244 144Q169 83 94 41Q84 57 68 76Q52 95 36 108Q111 146 186.5 203Q262 260 330.5 329.5Q399 399 455.5 474.5Q512 550 551 624Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M88 600 L916 600" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M605 827 L609 795 L622 786 L618 30 L594 -33 L420 -2" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M576 622 L576 622" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M576 622 L488 446 L422 357 L197 147 L130 106 L71 88" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="71" cy="88" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="487" y="290.5" text-anchor="middle" font-size="83.5" fill="#6b7280"><tspan x="487" y="290.5">3. lift, then draw the</tspan><tspan x="487" y="392.4">long left-falling</tspan><tspan x="487" y="494.2">stroke</tspan></text></svg><text x="16" y="261.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 才.json, ordered stroke paths and medians 1–3 (Hanzi</text><text x="16" y="274" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="286.5" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
