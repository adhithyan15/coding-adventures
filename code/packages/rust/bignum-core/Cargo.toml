[package]
name = "bignum-core"
version = "0.2.0"
edition = "2021"
description = "A zero-dependency arbitrary-precision numeric core: a signed integer (BigInteger) built from a sign and a base-2^32 limb vector, plus an exact rational (BigRational) with unbounded, never-rounding +-*/, reciprocal, integer powers, comparison, and parse/format."
license = "MIT"

[dependencies]
# No dependencies — this is a standalone foundation package (the integer core of
# the ADJ arbitrary-precision numeric substrate).
