<svg xmlns="http://www.w3.org/2000/svg" width="662" height="299.71" viewBox="0 0 662 299.71" role="img" aria-label="How to write す: 2 strokes · 1 pen lift · 4 movements"><title>Writing す</title><desc>4 frames; frame N shows movements 1 to N of す (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03059.svg, hiragana す (U+3059 HIRAGANA LETTER SU), two stroke paths kvg:03059-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03059.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the long bar drawn left to right; s2 starts above the bar, runs down through it and on down the right side of the loop, turns left along the bottom, climbs the left side, crosses over the top, comes back down the right side and sweeps away to the lower left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In the print glyph the vertical and the loop&apos;s right side share one band of ink, so the path comes back down that band before the tail.</desc><rect x="0" y="0" width="662" height="299.71" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="193.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="193.71" viewBox="26 -862 973 1256.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M627 792Q627 787 625.5 774Q624 761 623.5 748.5Q623 736 622 729Q621 710 621 677Q621 644 621 605Q621 56