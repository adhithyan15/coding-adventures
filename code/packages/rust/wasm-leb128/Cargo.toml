[package]
name = "wasm-leb128"
version = "0.2.0"
edition = "2021"
description = "LEB128 variable-length integer encoding for WASM binary format. v0.2.0: decode_unsigned/decode_signed now reject a value that overflows the full 64-bit width instead of silently wrapping, and new decode_unsigned_bounded/decode_signed_bounded(max_bits) enforce the same overlong-byte-count and out-of-range-padding-bits rules at any bit width (32, 7, ...), not just 64."

[dependencies]

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
# The generated evidence harness hashes the spec and the source tree.
coding_adventures_sha256 = { path = "../sha256" }

# Generated from code/specs/wasm-leb128.warrant (VER04h): examples, bounded
# exhaustive suites, property suites, fuzz suites and sabotage controls.
[[test]]
name = "warrant_evidence"
path = "tests/warrant_evidence.rs"
harness = false
