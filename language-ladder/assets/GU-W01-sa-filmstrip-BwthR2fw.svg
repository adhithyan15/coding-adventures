<svg xmlns="http://www.w3.org/2000/svg" width="342" height="355.67" viewBox="0 0 342 355.67" role="img" aria-label="How to write સ: 2 strokes · 1 pen lift · 2 movements"><title>Writing સ</title><desc>2 frames; frame N shows movements 1 to N of સ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, સ animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates સ as two ordered pen-down runs. Its first SVG path begins at the upper right, circles the rounded upper loop, descends through the left body, then sweeps across the long right shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the rounded upper loop, left body, long right shoulder, tall spine, and lower foot, but its printed loop is wider and more angular and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s loop-and-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the loop, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="355.67" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="224.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42"