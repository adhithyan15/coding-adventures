[package]
name = "iir-to-llvm"
version = "0.21.0"
edition = "2021"
description = "IIR → textual LLVM IR backend — emits .ll source for an LLVM target triple.  v0.21.0 (LANG-FULL E4 — literal concat print): literal-only `str_concat` now materializes a derived length-prefixed string constant and binds the concat dest so `print_str` can consume it.  v0.20.0 traps literal `str_index` OOB at runtime.  v0.15.0 (LANG-FULL E6 layer 1 — typed module globals): `global_load`/`global_store` lower to module-level `@__twig_global_N` slots.  v0.12.0 (LANG-FULL — bitwise `not`): lowers `not` to `xor x, -1`; narrow unsigned values use compute-wide+mask.  v0.9.0 adds Brainfuck byte-tape ops and libc I/O.  v0.4.0 adds user calls and `call_builtin print_i64`."

[lib]
name = "iir_to_llvm"
path = "src/lib.rs"

[dependencies]
interpreter-ir = { path = "../interpreter-ir" }

[[test]]
name = "test_backend"
path = "tests/test_backend.rs"
