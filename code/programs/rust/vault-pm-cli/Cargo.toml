[package]
name = "vault-pm-cli-program"
version = "0.1.0"
edition = "2021"
description = "Local-first vault-pm command-line executable"
license = "MIT"

[workspace]

[dependencies]
coding_adventures_vault_pm_cli = { path = "../../../packages/rust/vault-pm-cli" }

[dev-dependencies]
libc = "0.2"
# Cargo unifies the feature sets of a package reached through both
# `dependencies` and `dev-dependencies` whenever dev-dependencies are in the
# graph. `cargo test`/`cargo clippy --all-targets` therefore build the
# `vault-pm` binary with VLT-PM41 crash injection compiled in, while a plain
# `cargo build`/`cargo install` — which never resolves dev-dependencies —
# builds it without. That is the whole mechanism keeping the drill's kill
# switch out of a released executable.
coding_adventures_vault_pm_cli = { path = "../../../packages/rust/vault-pm-cli", features = [
    "crash-injection",
] }

[[bin]]
name = "vault-pm"
path = "src/main.rs"
