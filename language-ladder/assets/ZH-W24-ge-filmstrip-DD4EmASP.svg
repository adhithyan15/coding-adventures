<svg xmlns="http://www.w3.org/2000/svg" width="502" height="309.39" viewBox="0 0 502 309.39" role="img" aria-label="How to write 个: 3 strokes · 2 pen lifts · 3 movements"><title>Writing 个</title><desc>3 frames; frame N shows movements 1 to N of 个 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 个.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B8%AA.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 个. Medians 1–2 are exactly 人 — the same left-falling then right-falling pair, from the same peak, that the first writing lesson in this track taught — and median 3 is a single vertical hung beneath the junction. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all three medians to Noto Sans SC while preserving their order, directions and two intervening lifts; Noto&apos;s roof is a little wider than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="502" height="309.39" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="203.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.39" viewBox="-35 -911 1074 1456.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M506 841L573 810Q518 719 442.5 637.5Q367 556 276.5 490Q186 424 91 377Q82 394 66.5 413Q51 432 35 446Q130 487 218.5 547.5Q307 608 381.5 683Q456 758 506 841ZM528 786Q595 704 666 641.5Q737 579 813 5