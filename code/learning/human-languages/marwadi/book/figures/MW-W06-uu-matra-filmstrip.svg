" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="-250" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-101" y="462.4" text-anchor="middle" font-size="48.4" fill="#6b7280"><tspan x="-101" y="462.4">3. sweep down to the</tspan><tspan x="-101" y="521.4">right</tspan></text></svg><text x="16" y="223.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="235.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Devanagari recognizer, class 51 (ू, uu sign): stored online-handwriting prototypes from</text><text x="16" y="248.48" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">native writers (MIT licence, 2012)</text><text x="16" y="260.98" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
