<svg xmlns="http://www.w3.org/2000/svg" width="342" height="319.28" viewBox="0 0 342 319.28" role="img" aria-label="How to write ட: one unbroken stroke · 2 movements"><title>Writing ட</title><desc>2 frames; frame N shows movements 1 to N of ட (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 1, ட (University of Texas at Austin), p. 190 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 1 numbers ட&apos;s left descent and rightward foot as two joined movements, while Module 1 identifies the letter and teaches the usual top-to-bottom and left-to-right motion. Tamil handwriting varies by school; this is one attested continuous order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="342" height="319.28" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="188.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="188.28" viewBox="18 -624 728 913.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L174 554L174 72L676 72L676 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 554 L131 554" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 554 L131 300 L131 36" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="36" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="382" y="198.3" text-anchor="middle" font-size="58.3" fill="#6b7280"><tspan x="382" y="198.3">1. down the left upright</tspan></text></svg><rect x="176" y="42" width="150" height="188.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="188.28" viewBox="18 -624 728 913.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L174 554L174 72L676 72L676 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 554 L131 300 L131 36 L131 36" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 36 L330 36 L520 36 L676 36" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="676" cy="36" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="382" y="198.3" text-anchor="middle" font-size="58.3" fill="#6b7280"><tspan x="382" y="198.3">2. along the long</tspan><tspan x="382" y="269.4">rightward foot</tspan></text></svg><text x="16" y="243.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script</text><text x="16" y="255.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Learners Manual, Appendix I: Hand-movements, Frame 1, ட</text><text x="16" y="268.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 190</text><text x="16" y="280.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="293.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
