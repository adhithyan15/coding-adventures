<svg xmlns="http://www.w3.org/2000/svg" width="982" height="499.14" viewBox="0 0 982 499.14" role="img" aria-label="How to write 再: 6 strokes · 5 pen lifts · 8 movements"><title>Writing 再</title><desc>8 frames; frame N shows movements 1 to N of 再 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 再.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%86%8D.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 再. Median 1 draws the top horizontal left-to-right. Median 2 separately descends the left side. Median 3 restarts at the upper left, crosses the frame&apos;s top, turns down the right side, then hooks left at the base without lifting. Median 4 descends the central vertical, median 5 draws the inner horizontal, and median 6 closes with the long bottom horizontal left-to-right. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving their order, both turns inside the enclosing third stroke, the close-last rule, and five intervening lifts; Noto&apos;s frame is squarer and its bottom horizontal is flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="982" height="499.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="196.82" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="196.82" viewBox="-30 -849 1062 1393.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><