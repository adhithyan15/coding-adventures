# Re-audit Venture's HTML parser corpus against the pinned upstream suites
# (BR02 P1.4).
#
# Why this exists
# ---------------
# The parser's conformance claim rests on
# code/packages/rust/html-parser/tests/fixtures/html5lib-coverage-audit.json:
# how many upstream html5lib tokenizer and WPT tree-construction cases exist,
# and which of them the checked-in corpus is missing. Until now that report was
# only regenerated by hand, from local checkouts, so nothing in CI checked it
# against upstream at all (BR02 §2). This job fetches both suites at the
# revisions the report pins and fails if a fresh audit differs from the report.
#
# Moving to newer upstream revisions is a deliberate change: regenerate the
# report with --write-report against the new checkouts and commit it; this job
# then fetches the revisions it names.
name: HTML parser upstream audit

on:
  pull_request:
    paths:
      - '.github/workflows/html-parser-upstream-audit.yml'
      - 'code/packages/rust/html-parser/tests/fixtures/**'
      - 'code/packages/rust/html-lexer/tests/fixtures/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/html-parser-upstream-audit.yml'
      - 'code/packages/rust/html-parser/tests/fixtures/**'
      - 'code/packages/rust/html-lexer/tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-parser-upstream-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the corpus against pinned html5lib-tests and WPT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the pinned upstream suites
        shell: bash
        run: |
          set -euo pipefail
          report=code/packages/rust/html-parser/tests/fixtures/html5lib-coverage-audit.json
          html5lib_revision="$(jq -r '.tokenizer.upstream_revision' "$report")"
          wpt_revision="$(jq -r '.tree_construction.upstream_revision' "$report")"
          # The report is repository data; accept only full commit ids before
          # they reach a git command line.
          for revision in "$html5lib_revision" "$wpt_revision"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit id: $revision" >&2; exit 1; }
          done

          fetch() {
            local url="$1" revision="$2" directory="$3"
            shift 3
            git init -q "$directory"
            git -C "$directory" remote add origin "$url"
            if [[ $# -gt 0 ]]; then
              # Only the listed directories: WPT as a whole is gigabytes.
              git -C "$directory" sparse-checkout set --no-cone "$@"
            fi
            git -C "$directory" fetch -q --depth 1 --filter=blob:none origin "$revision"
            git -C "$directory" checkout -q FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }
          fetch https://github.com/html5lib/html5lib-tests "$html5lib_revision" "$RUNNER_TEMP/html5lib-tests"
          fetch https://github.com/web-platform-tests/wpt "$wpt_revision" "$RUNNER_TEMP/wpt" \
            '/html/syntax/parsing/resources/'

      - name: Re-audit and compare with the checked-in report
        shell: bash
        run: |
          set -euo pipefail
          python3 code/packages/rust/html-parser/tests/fixtures/audit_html5lib_coverage.py \
            "$RUNNER_TEMP/html5lib-tests" \
            --wpt-root "$RUNNER_TEMP/wpt" \
            --check-report
