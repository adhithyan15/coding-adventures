<svg xmlns="http://www.w3.org/2000/svg" width="982" height="541.4" viewBox="0 0 982 541.4" role="img" aria-label="How to write த: one unbroken stroke · 7 movements"><title>Writing த</title><desc>7 frames; frame N shows movements 1 to N of த (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, த (University of Texas at Austin), p. 192 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Module 3 identifies த as the dental stop and asks learners to write it. Appendix I&apos;s final Frame 3 row numbers seven hand-movements: 1–2 for the upper frame, 3–4 for the broad right bowl, 5–6 for the compact left loop, and 7 for the leftward tail. Native writers draw த as one continuous stroke, and this ductus follows the seven movements in order without lifting. Because the manual numbers the right bowl before the left loop, the pen retraces the right bowl to reach the loop and again to reach the tail. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 88% of the 266 stored prototypes of த are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="982" height="541.4" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 7 movements</text><rect x="16" y="42" width="150" height="217.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.95" viewBox="-23 -624 870 1264.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201