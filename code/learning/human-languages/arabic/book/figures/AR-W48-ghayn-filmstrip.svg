serif" font-size="10" fill="#64748b">Alphabet ع غ, independent Ghayn at 00:02.4–00:04.0 (University of Oregon Libraries Open</text><text x="16" y="377.52" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2023; accessed 2026-08-23)</text><text x="16" y="390.02" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
