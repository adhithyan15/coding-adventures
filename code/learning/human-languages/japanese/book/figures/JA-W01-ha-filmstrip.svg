<svg xmlns="http://www.w3.org/2000/svg" width="982" height="280.99" viewBox="0 0 982 280.99" role="img" aria-label="How to write は: 3 strokes · 2 pen lifts · 6 movements"><title>Writing は</title><desc>6 frames; frame N shows movements 1 to N of は (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0306f.svg, hiragana は (U+306F HIRAGANA LETTER HA), three stroke paths kvg:0306f-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0306f.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left vertical drawn top to bottom, which turns at its foot and flicks up to the right without lifting; s2 is the bar drawn left to right; s3 starts above the bar, runs down through it, rounds to the left at its foot, comes back up, crosses the vertical and runs out to the lower right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. Where the print glyph&apos;s left vertical runs on below the point the flick leaves it, the path goes down to the foot of that ink and climbs back a short way before the flick.</desc><rect x="0" y="0" width="982" height="280.99" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="187.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="187.49" viewBox="45 -841 975 1218.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M399 591Q442 587 483 585Q524 58