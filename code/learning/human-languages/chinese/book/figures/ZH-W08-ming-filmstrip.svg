<svg xmlns="http://www.w3.org/2000/svg" width="982" height="557.12" viewBox="0 0 982 557.12" role="img" aria-label="How to write 名: 6 strokes · 5 pen lifts · 8 movements"><title>Writing 名</title><desc>8 frames; frame N shows movements 1 to N of 名 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 名.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%90%8D.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 名. Medians 1–3 draw 夕 first: an upper left-falling stroke, a separately started horizontal that continues down-left without lifting, and a separately placed inner down-right dot. Medians 4–6 then draw 口: the left vertical, a separately started top horizontal that turns down the right side without lifting, and the closing bottom horizontal. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving their order, both joined turns, and five intervening lifts; Noto&apos;s 夕 sweep is broader and 口 is squarer than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="982" height="557.12" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="225.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="225.81" viewBox="-23 -913 942 1418.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M299 42L800 42L800 -27L299 -27L299 42ZM345 740L