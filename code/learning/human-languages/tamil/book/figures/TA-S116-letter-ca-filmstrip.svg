<svg xmlns="http://www.w3.org/2000/svg" width="662" height="287.26" viewBox="0 0 662 287.26" role="img" aria-label="How to write ச: 2 strokes · 1 pen lift · 4 movements"><title>Writing ச</title><desc>4 frames; frame N shows movements 1 to N of ச (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ச (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 3 numbers the three joined upper-frame movements before the separate fourth movement turns around ச&apos;s lower-left bowl. Tamil handwriting varies by school; this is one attested two-run order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="662" height="287.26" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="181.26" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="181.26" viewBox="-21 -624 774 935.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M261 -12Q201 -12 153 7Q105 26 77 63Q49 100 49 152Q49 206 77.5 245.5Q106 285 168 306.5Q230 328 332 328L683 328L683 258L325 258Q274 258 238.5 252Q203 246 178 232Q156 219 145.5 200.5Q135 182 135 153Q135 107 173 83.5Q211 60 269 60Q313 60 344.5 73.5Q376 87 393.5 120.5Q411 154 411 213L411 482L239 482L239 302L160 286L160 554L683 554L683 482L496 482L496 226Q496 159 484.5 121Q473 83 452 57Q421 19 372.5 3.5Q324 -12 261 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M160 300 L160 300" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejo