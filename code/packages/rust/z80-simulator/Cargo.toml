[package]
name = "z80-simulator"
version = "0.1.0"
edition = "2021"
description = "Complete Zilog Z80 (1976) behavioral simulator in Rust: base 8080-compatible ISA, CB/ED/DD/FD/DDCB/FDCB spaces, fixed 64 KiB state, checked lifecycle, traces, ports, and interrupts."

[dependencies]
cpu-simulator = { path = "../cpu-simulator" }
