[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-music-analysis"
version = "0.1.0"
description = "Pure Python music analysis, pitch tracking, onset detection, harmonic profile estimation, and sample-to-score transcription"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = [
    "coding-adventures-note-frequency>=0.1.0",
    "coding-adventures-pcm-audio>=0.1.0",
    "coding-adventures-musical-instruments>=0.1.0",
    "coding-adventures-music-machine>=0.1.0",
    "coding-adventures-dsp-fft>=0.1.0",
    "coding-adventures-dsp-stft>=0.1.0",
    "coding-adventures-dsp-wavelets>=0.1.0",
    "coding-adventures-dsp-filters>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/music_analysis"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=music_analysis --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/music_analysis"]

[tool.coverage.report]
fail_under = 95
show_missing = true
