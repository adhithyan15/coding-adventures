<svg xmlns="http://www.w3.org/2000/svg" width="502" height="327.35" viewBox="0 0 502 327.35" role="img" aria-label="How to write व: 3 strokes · 2 pen lifts · 3 movements"><title>Writing व</title><desc>3 frames; frame N shows movements 1 to N of व (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after JackPotte, ‘Devanagari v व.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_v_%E0%A4%B5.gif&gt;. Source note on variation: The 11-frame animation shows three ordered pen-down runs: frames 0–5 start at the upper-right of the body, travel left around the top, continue counterclockwise around the loop, and finish at the right-side junction; frames 6–7 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 8–10 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The spatial restarts at frames 6 and 8 delimit the three runs; all frames last 100 ms, so this source provides no long inter-stroke holds. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VIII, p. 44, independently shows the same loop, right stem, and headline buildup, while the animation supplies the within-run directions and lift evidence. This learner path follows that corroborated three-run form and fits its loop to Noto Sans Devanagari; everyday handwriting may simplify or narrow the loop differently.</desc><rect x="0" y="0" width="502" height="327.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="221.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.35" viewBox="-70 -692 710 1047.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M570 551L467 551L467 0L387 0L387 198L414 182Q384 149 340 132Q296 115 241 115Q186 115 142 135.5Q98 156 72 195Q46 234 46 289Q46 378 104 421Q162 464 253 464Q281 464 305.5 461Q330 458 351 453L346 381Q325 386 303.5 388.5Q282 391 256 391Q200 391 163.5 364.5Q127 338 127 287Q127 242 156 214.5Q185 187 241 187Q290 187 330.5 209.5Q371 232 397 269L387 220L387 551L0 551L0 622L570 622L570 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 415 L350 415" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M350 415 L305 428 L255 430 L205 422 L160 402 L125 375 L100 340 L87 300 L88 260 L105 220 L140 185 L190 160 L240 150 L290 158 L335 180 L370 215 L392 260" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="392" cy="260" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="285" y="196.9" text-anchor="middle" font-size="56.9" fill="#6b7280"><tspan x="285" y="196.9">1. circle</tspan><tspan x="285" y="266.3">counterclockwise around</tspan><tspan x="285" y="335.7">the left loop</tspan></text></svg><rect x="176" y="42" width="150" height="221.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.35" viewBox="-70 -692 710 1047.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M570 551L467 551L467 0L387 0L387 198L414 182Q384 149 340 132Q296 115 241 115Q186 115 142 135.5Q98 156 72 195Q46 234 46 289Q46 378 104 421Q162 464 253 464Q281 464 305.5 461Q330 458 351 453L346 381Q325 386 303.5 388.5Q282 391 256 391Q200 391 163.5 364.5Q127 338 127 287Q127 242 156 214.5Q185 187 241 187Q290 187 330.5 209.5Q371 232 397 269L387 220L387 551L0 551L0 622L570 622L570 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 415 L305 428 L255 430 L205 422 L160 402 L125 375 L100 340 L87 300 L88 260 L105 220 L140 185 L190 160 L240 150 L290 158 L335 180 L370 215 L392 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M427 551 L427 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M427 551 L427 475 L427 395 L427 315 L427 235 L427 155 L427 75 L427 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="427" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="285" y="196.9" text-anchor="middle" font-size="56.9" fill="#6b7280"><tspan x="285" y="196.9">2. lift, then descend</tspan><tspan x="285" y="266.3">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="221.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="221.35" viewBox="-70 -692 710 1047.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M570 551L467 551L467 0L387 0L387 198L414 182Q384 149 340 132Q296 115 241 115Q186 115 142 135.5Q98 156 72 195Q46 234 46 289Q46 378 104 421Q162 464 253 464Q281 464 305.5 461Q330 458 351 453L346 381Q325 386 303.5 388.5Q282 391 256 391Q200 391 163.5 364.5Q127 338 127 287Q127 242 156 214.5Q185 187 241 187Q290 187 330.5 209.5Q371 232 397 269L387 220L387 551L0 551L0 622L570 622L570 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 415 L305 428 L255 430 L205 422 L160 402 L125 375 L100 340 L87 300 L88 260 L105 220 L140 185 L190 160 L240 150 L290 158 L335 180 L370 215 L392 260" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M427 551 L427 475 L427 395 L427 315 L427 235 L427 155 L427 75 L427 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L75 585 L145 585 L215 585 L285 585 L355 585 L425 585 L495 585 L565 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="565" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="285" y="196.9" text-anchor="middle" font-size="56.9" fill="#6b7280"><tspan x="285" y="196.9">3. lift, then draw the</tspan><tspan x="285" y="266.3">shirorekha</tspan><tspan x="285" y="335.7">left-to-right</tspan></text></svg><text x="16" y="276.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after JackPotte, ‘Devanagari v व.gif’, strokes 1–3, Wikimedia Commons, 29</text><text x="16" y="288.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">March 2009</text><text x="16" y="301.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
