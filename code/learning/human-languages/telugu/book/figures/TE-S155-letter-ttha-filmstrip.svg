<svg xmlns="http://www.w3.org/2000/svg" width="502" height="352.6" viewBox="0 0 502 352.6" role="img" aria-label="How to write ఠ: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ఠ</title><desc>3 frames; frame N shows movements 1 to N of ఠ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant ఠ packaged tracing guides res/drawable/dot_stroke_c_3_2_ta.png and res/drawable/line_stroke_c_3_2_ta.png, movements 1–3 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers the circular body, separate upper flourish and inner dot as three movements. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="502" height="352.6" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="234.1" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="234.1" viewBox="-35 -795 699 1090.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M35 236Q35 314 68 373.5Q101 433 159.5 466.5Q218 500 296 500Q375 500 433.5 467.5Q492 435 525 376Q558 317 558 237Q558 163 526 106.5Q494 50 435 19Q376 -12 296 -12Q217 -12 158.5 19Q100 50 67.5 105.5Q35 161 35 236ZM118 248Q118 167 163 117Q208 67 296 67Q356 67 395.5 89.5Q435 112 455 152Q475 192 475 242Q475 293 455.5 334.5Q436 376 396.5 400.5Q357 425 296 425Q235 425 195.5 400.5Q156 376 137 336Q118 296 118 248ZM243 246Q243 278 258 291Q273 304 297 304Q319 304 334.5 291Q350 278 350 246Q350 214 334.5 200Q319 186 297 186