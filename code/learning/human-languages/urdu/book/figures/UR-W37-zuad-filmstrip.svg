<svg xmlns="http://www.w3.org/2000/svg" width="502" height="335.57" viewBox="0 0 502 335.57" role="img" aria-label="How to write ض: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ض</title><desc>3 frames; frame N shows movements 1 to N of ض (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Khe, ze, zal, swad, and zwad, independent ض calligraphic and handwriting animations and Zwad instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/khe-ze-zal-swad-and-zwad/&gt;. Source note on variation: The independent-form animations build the elongated swad-series body before its upper dot: the upper oval closes clockwise and finishes with its short tooth, the pen restarts for the lower right-to-left bowl, and the dot is placed last after a second lift. The adjacent prose distinguishes zwad from fe by its elongated body and tooth, while the chapter identifies zwad as the dotted member of the swad series. This three-run learner path fits those movements to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback. The evidence and glyph identity remain Urdu-specific rather than borrowing Arabic ض&apos;s independently sourced order.</desc><rect x="0" y="0" width="502" height="335.57" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="217.07" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.07" viewBox="-2 -656 1116 1615" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249