[package]
name = "java-to-semantic-ir"
version = "0.18.0"
edition = "2021"
description = "Java (GrammarASTNode CST) → narrow-waist Semantic IR. JV02 M8 (task #70): try/catch/finally/throw → Stmt::TryCatch."

[dependencies]
coding-adventures-java-lexer = { path = "../java-lexer" }
coding-adventures-java-parser = { path = "../java-parser" }
# The parser emits a generic `parser::grammar_parser::GrammarASTNode` whose
# leaf tokens are `lexer::token::Token`; we walk both directly.
parser = { path = "../parser" }
lexer = { path = "../lexer" }
semantic-ir = { path = "../semantic-ir" }

[dev-dependencies]
# Execution-proof harness only (tests/e2e_python.rs) -- lowers real Java
# source through this crate, then through the Python backend, then runs it
# with `python3`. Python (not JavaScript) because M1 uses `Expr::StrConcat`
# for Java's `+`-based string concatenation, and the JavaScript backend
# does not accept `Feature::StringInterpolation` yet (see that backend's
# own `emit_expr` — `StrConcat` is in its "deferred, rejected at capability
# check" list), while the Python backend already does.
semantic-ir-to-python = { path = "../semantic-ir-to-python" }
# Execution-proof harness only (tests/loop_control_java_execution.rs) --
# task #64's own break/continue tests need `Feature::LoopControl`, which
# only the JavaScript backend accepts as of this crate's own v0.12.0 (see
# semantic-ir-to-javascript's CHANGELOG under 0.54.0); none of these tests
# use string concatenation, so JS's own `StringInterpolation` gap (the
# reason `e2e_python.rs` picked Python instead) doesn't apply here.
semantic-ir-to-javascript = { path = "../semantic-ir-to-javascript" }
