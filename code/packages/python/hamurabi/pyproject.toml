[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-adventures-hamurabi"
version = "0.1.0"
description = "Pure, deterministic simulation core for the 1968 mainframe resource allocation game"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/hamurabi"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:platformdirs --cov=hamurabi --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/hamurabi"]

[tool.coverage.report]
fail_under = 80
show_missing = true
