<svg xmlns="http://www.w3.org/2000/svg" width="662" height="294.75" viewBox="0 0 662 294.75" role="img" aria-label="How to write ふ: 4 strokes · 3 pen lifts · 4 movements"><title>Writing ふ</title><desc>4 frames; frame N shows movements 1 to N of ふ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana ふ stroke order animation.gif, hiragana ふ, 31 frames, 3.1 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%B5_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws ふ as four separate strokes in the order tick, body, lower-left mark, lower-right mark. KanjiVG&apos;s data for U+3075 holds four paths in the same order. Handwriting joins the body to one or both of the bottom marks in fast cursive; the four-stroke order taught here is the printed and taught one.</desc><rect x="0" y="0" width="662" height="294.75" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="188.75" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="188.75" viewBox="-28 -843 1060 1333.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M504 547Q524 560 543 574.5Q562 589 573 598Q552 616 516 637Q480 658 439 679Q398 700 360 715L406 773Q444 757 490 734.5Q536 712 579.5 688Q623 664 653 642L671 590Q663 583 648.5 571.5Q634 560 617.5 547.5Q601 535 584.5 522.5Q568 510 554 500L504 547ZM311 69Q349 59 387 53Q425 47 472 47Q495 47 518.5 54Q542 61 557.5 79.5Q573 98 573 130Q573 156 561 184.5Q549 213 530 242Q511 271 488.5 298.5Q466 326 445 349Q429 367 408 387Q387 407 365 424L424 476Q443 457 461.5 437.5Q480 418 498 398Q545 350 581 303.5Q617 257 637 212Q657 167 6