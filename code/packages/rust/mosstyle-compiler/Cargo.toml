[package]
name = "mosstyle-compiler"
version = "0.1.1"
edition = "2021"
description = "Compiles .msl component style files to Lattice and a resolved style map"

[dependencies]
grammar-tools  = { path = "../grammar-tools" }
lexer          = { path = "../lexer" }
directed-graph = { path = "../directed-graph" }
parser         = { path = "../parser" }
state-machine  = { path = "../state-machine" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

[dev-dependencies]
coding-adventures-lattice-transpiler = { path = "../lattice-transpiler" }
