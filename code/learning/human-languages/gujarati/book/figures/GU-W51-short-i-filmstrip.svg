2 494 728L547 661Q512 636 497.5 615Q483 594 483 563Q483 532 496 503Q509 474 538 420Q558 383 574 338.5Q590 294 590 236Q590 172 563.5 115.5Q537 59 476 24.5Q415 -10 311 -10Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M220 565 L165 565 L115 535 L85 480 L85 420 L120 365 L170 330 L220 320 L265 322 L310 322 L245 285 L185 245 L145 190 L145 130 L190 75 L260 40 L340 30 L420 50 L490 100 L535 170 L550 245 L550 245" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M550 245 L540 315 L505 390 L465 460 L440 525 L445 590 L475 650 L515 690" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="515" cy="690" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="317" y="205" text-anchor="middle" font-size="55" fill="#6b7280"><tspan x="317" y="205">4. rise along the right</tspan><tspan x="317" y="272.1">side into the upper</tspan><tspan x="317" y="339.2">hook</tspan></text></svg><text x="16" y="307.88" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ઇ animation, first SVG path</text><text x="16" y="320.38" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
