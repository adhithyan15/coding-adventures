<svg xmlns="http://www.w3.org/2000/svg" width="342" height="409.17" viewBox="0 0 342 409.17" role="img" aria-label="How to write د: one unbroken stroke · 2 movements"><title>Writing د</title><desc>2 frames; frame N shows movements 1 to N of د (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: د ذ ر, independent Daal at 00:07.0–00:07.6 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/chapter-1/&gt;. Source note on variation: The cited Daal demonstration draws independent د in one continuous pen-down run at 00:07.0–00:07.6: it begins at the upper tip, descends diagonally down and right through the curved shoulder, then turns left along the baseline without lifting. The adjacent lesson identifies daal as a one-way connector and separately prints its independent and final forms. This independent learner path fits the course&apos;s vendored Noto Naskh outline while keeping its provenance scoped to Arabic rather than inferring motion from a contextual form.</desc><rect x="0" y="0" width="342" height="409.17" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="265.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="265.67" viewBox="-36 -468 478 846.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 