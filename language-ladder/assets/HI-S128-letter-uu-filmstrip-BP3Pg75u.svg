<svg xmlns="http://www.w3.org/2000/svg" width="662" height="288.07" viewBox="0 0 662 288.07" role="img" aria-label="How to write ऊ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ऊ</title><desc>4 frames; frame N shows movements 1 to N of ऊ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari ऊ stroke order.svg’, panels 1–3, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%8A_stroke_order.svg&gt;. Source note on variation: The three-panel diagram shows three ordered pen-down runs. Panel 1 writes the same continuous upper bowl and lower loop used for उ. Panel 2 restarts at the waist and sweeps the right-hand loop upward and right, around its outer turn, then down-left to the open tip. Panel 3 restarts at the headline&apos;s left edge and draws the shirorekhā left-to-right, for two intervening lifts. This learner path follows that modern printed teaching form and fits its turns and directions to Noto Sans Devanagari. Other handwriting may simplify the curves, so this is a sourced learner path rather than a universal standard.</desc><rect x="0" y="0" width="662" height="288.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="194.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="194.57" viewBox="-70 -692 940 1219.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M300 622L800 622L800 551L300 551L300 622ZM444 274Q471 305 507 322Q543 339 590 339Q664 339 706.5 296.5Q749 254 749 181Q749 129 725.5 82.5Q702 36 645 -10L583 43Q624 74 646 107.5Q668 141 668 181Q668 227 645 248.5Q622 270 585 270Q554 270 527.5 255.5Q501 241 483 217L444 274ZM0 622L563 622L563 551L0 551L0 622ZM418 563Q444 542 457.5 514Q471 486 471 452Q471 405 445 368.5Q419 332 367.5 310Q316 288 238 283L222 356Q311 364 350.5 386Q390 408 390 458Q390 494 368.5 522Q347 550 312 563L418 563ZM400 346Q453 304 476 261Q499 218 499 168Q499 89 448.5 44.5Q398 0 318 0Q268 0 227 16Q186 32 151.5 68Q117 104 87 163Q57 222 29 308L102 338Q133 241 163 183Q193 125 228 99.5Q263 74 308 74Q355 74 384.5 99Q414 124 414 173Q414 221 389.5 256Q365 291 317 319L400 346Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M350 555 L350 555" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M350 555 L390 530 L420 500 L435 460 L420 420 L380 380 L330 345 L275 325 L235 320 L235 320" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="235" cy="320" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="400" y="225.3" text-anchor="middle" font-size="75.3" fill="#6b7280"><tspan x="400" y="225.3">1. curve down and left</tspan><tspan x="400" y="317.2">around the upper bowl</tspan></text></svg><rect x="176" y="42" width="150" height="194.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="194.57" viewBox="-70 -692 940 1219.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M300 622L800 622L800 551L300 551L300 622ZM444 274Q471 305 507 322Q543 339 590 339Q664 339 706.5 296.5Q749 254 749 181Q749 129 725.5 82.5Q702 36 645 -10L583 43Q624 74 646 107.5Q668 141 668 181Q668 227 645 248.5Q622 270 585 270Q554 270 527.5 255.5Q501 241 483 217L444 274ZM0 622L563 622L563 551L0 551L0 622ZM418 563Q444 542 457.5 514Q471 486 471 452Q471 405 445 368.5Q419 332 367.5 310Q316 288 238 283L222 356Q311 364 350.5 386Q390 408 390 458Q390 494 368.5 522Q347 550 312 563L418 563ZM400 346Q453 304 476 261Q499 218 499 168