# test262 conformance gate for the V8C JavaScript engine (V8C09).
#
# Runs the v8-test262 runner at the parse level against test262 at the commit
# code/packages/rust/v8-test262/TEST262_REVISION pins, and fails when a result
# listed in expected/parse.txt no longer passes. The list may only grow; a PR
# that makes more tests pass regenerates it with --update.
#
# The runner never looks at a test's path or text to decide its outcome
# (V8C01 revision, point 4): a pass comes from the parser.
name: V8C test262

on:
  pull_request:
    paths:
      - '.github/workflows/v8-test262.yml'
      - 'code/packages/rust/v8-test262/**'
      - 'code/packages/rust/javascript-parser/**'
      - 'code/packages/rust/javascript-lexer/**'
      - 'code/packages/rust/javascript-tokens/**'
      - 'code/grammars/ecmascript/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8-test262.yml'
      - 'code/packages/rust/v8-test262/**'
      - 'code/packages/rust/javascript-parser/**'
      - 'code/packages/rust/javascript-lexer/**'
      - 'code/packages/rust/javascript-tokens/**'
      - 'code/grammars/ecmascript/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-test262-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-level:
    name: test262 parse level (grow-only list)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Fetch test262 at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < code/packages/rust/v8-test262/TEST262_REVISION)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit id: $revision" >&2; exit 1; }
          suite="$RUNNER_TEMP/test262"
          git init -q "$suite"
          git -C "$suite" remote add origin https://github.com/tc39/test262
          # Only what the runner reads: the tests and the harness includes.
          git -C "$suite" sparse-checkout set --no-cone '/test/' '/harness/'
          git -C "$suite" fetch -q --depth 1 --filter=blob:none origin "$revision"
          git -C "$suite" checkout -q FETCH_HEAD
          test "$(git -C "$suite" rev-parse HEAD)" = "$revision"

      - name: Run the parse level and compare with the list
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path code/packages/rust/Cargo.toml -p coding-adventures-v8-test262
          code/packages/rust/target/release/v8-test262 --test262 "$RUNNER_TEMP/test262"
