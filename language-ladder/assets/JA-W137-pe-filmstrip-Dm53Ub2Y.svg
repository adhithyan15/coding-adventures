<svg xmlns="http://www.w3.org/2000/svg" width="502" height="268.19" viewBox="0 0 502 268.19" role="img" aria-label="How to write ぺ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ぺ</title><desc>3 frames; frame N shows movements 1 to N of ぺ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0307a.svg, hiragana ぺ (U+307A HIRAGANA LETTER PE), two stroke paths kvg:0307a-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0307a.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is へ&apos;s stroke, the same paths as in its file for へ, kanji/03078.svg; s2 is the handakuten, one closed ring that starts at its foot and runs clockwise, round the left side, over the top and down the right side back to the foot. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="502" height="268.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="162.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="162.19" viewBox="-23 -784 1035 1119.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M47 256Q66 270 82.5 285.5Q99 301 119 322Q139 342 163.5 371.5Q188 401 214.5 434.5Q241 468 267 501Q293 534 315 560Q359 612 400.5 616.5Q442 621 492 571Q522 540 556 499.5Q590 459 625.5 418Q661 377 692 342Q715 317 744 286Q773 255 806 221.5Q839 188 873.5 154Q908 120 942 90L87