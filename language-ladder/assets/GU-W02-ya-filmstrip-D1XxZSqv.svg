<svg xmlns="http://www.w3.org/2000/svg" width="342" height="377.21" viewBox="0 0 342 377.21" role="img" aria-label="How to write ય: 2 strokes · 1 pen lift · 2 movements"><title>Writing ય</title><desc>2 frames; frame N shows movements 1 to N of ય (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after t30apps.com, ‘Gujarati Alphabet Writing Practice’, version 1.0, ય animation, first and second SVG paths &lt;https://www.t30apps.com/gujarati-alphabet-writing/&gt;. Source note on variation: The teaching app animates ય as two ordered pen-down runs. Its first SVG path begins at the upper left, circles clockwise through the rounded upper turn, sweeps around the broad lower body, then exits right across the long shoulder. The animation lifts once and its second SVG path descends the separate tall right spine before turning through the lower-right foot. The remaining path slots are empty. The app explicitly says that depicted forms and stroke orders can differ by source and should be treated as one variant, not a universal standard. The bundled Noto Sans Gujarati glyph preserves the rounded upper turn, broad lower body, long shoulder, tall right spine, and lower foot, but its printed turns are wider and more angular and its spine straighter than the animated school-hand form. This learner path preserves the source&apos;s rounded-body-before-right-spine order and one-lift evidence while fitting both runs to the font&apos;s ink. Individual handwriting may narrow, round, simplify, retrace, or slant the turn, body, shoulder, spine, foot, and terminals differently.</desc><rect x="0" y="0" width="342" height="377.21" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="246.21" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="246.21" viewBox="-56 -673 712 1168.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M271 161Q186 161 129.5 207.5Q73 254 43 333Q103 350 138.5 378Q174 406 174 452Q174 489 149.5 510Q125 531 83 531Q65 531 54.5 529.5Q44 528 32 526L14 594Q25 597 42.5 600Q60 603 88 603Q165 603 210 563.5Q255 524 255 453Q255 399 225.5 361Q196 323 147 299Q162 272 193.5 252.5Q225 233 269 233Q321 233 358 252.5Q395 272 419 298L419 603L499 593L499 152Q499 124 502 112Q505 100 514 90Q525 77 544.5 75Q564 73 586 73L578 0L568 0Q525 0 497 9.5Q469 19 451 37Q434 54 426.5 79Q419 104 419 148L419 208Q392 187 357 174Q322 161 271 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M35 565 L35 565" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M35 565 L75 575 L120 565 L160 540 L190 500 L200 455 L195 415 L175 380 L145 355 L105 335 L75 310 L90 275 L120 240 L160 210 L205 190 L255 180 L305 185 L350 205 L385 235 L415 270" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="415" cy="270" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="300" y="197.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="300" y="197.1">1. circle the rounded</tspan><tspan x="300" y="266.8">upper turn and sweep</tspan><tspan x="300" y="336.4">around the broad lower</tspan><tspan x="300" y="406.1">body into the long</tspan><tspan x="300" y="475.7">right shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="246.21" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="246.21" viewBox="-56 -673 712 1168.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M271 161Q186 161 129.5 207.5Q73 254 43 333Q103 350 138.5 378Q174 406 174 452Q174 489 149.5 510Q125 531 83 531Q65 531 54.5 529.5Q44 528 32 526L14 594Q25 597 42.5 600Q60 603 88 603Q165 603 210 563.5Q255 524 255 453Q255 399 225.5 361Q196 323 147 299Q162 272 193.5 252.5Q225 233 269 233Q321 233 358 252.5Q395 272 419 298L419 603L499 593L499 152Q499 124 502 112Q505 100 514 90Q525 77 544.5 75Q564 73 586 73L578 0L568 0Q525 0 497 9.5Q469 19 451 37Q434 54 426.5 79Q419 104 419 148L419 208Q392 187 357 174Q322 161 271 161Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M35 565 L75 575 L120 565 L160 540 L190 500 L200 455 L195 415 L175 380 L145 355 L105 335 L75 310 L90 275 L120 240 L160 210 L205 190 L255 180 L305 185 L350 205 L385 235 L415 270" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M459 585 L459 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M459 585 L459 500 L459 400 L459 300 L459 200 L459 125 L467 80 L490 55 L525 40 L560 38 L578 38" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="578" cy="38" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="300" y="197.1" text-anchor="middle" font-size="57.1" fill="#6b7280"><tspan x="300" y="197.1">2. lift, descend the</tspan><tspan x="300" y="266.8">tall right spine, and</tspan><tspan x="300" y="336.4">turn through its lower</tspan><tspan x="300" y="406.1">foot</tspan></text></svg><text x="16" y="301.21" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="313.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ય animation, first and second SVG</text><text x="16" y="326.21" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="338.71" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="351.21" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
