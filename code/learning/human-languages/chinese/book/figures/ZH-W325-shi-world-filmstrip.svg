 stroke-linejoin="round"/><path class="ductus__done" d="M236 786 L236 786" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M236 786 L236 15 L899 15" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="899" cy="15" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="500.5" y="238.3" text-anchor="middle" font-size="83.3" fill="#6b7280"><tspan x="500.5" y="238.3">5. lift, then draw the</tspan><tspan x="500.5" y="339.9">left side and turn</tspan><tspan x="500.5" y="441.6">right along the foot</tspan></text></svg><text x="16" y="253.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 世.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22</text><text x="16" y="266.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2019)</text><text x="16" y="278.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
