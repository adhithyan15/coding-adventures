Q394 133 361.5 125.5Q329 118 300 118Q243 118 194 141.5Q145 165 104 213.5Q63 262 29 338L98 365Q139 272 183.5 232Q228 192 294 192Q349 192 380 218Q411 244 411 287Q411 333 382.5 353Q354 373 313 373Q288 373 265 366Q242 359 219 348L192 420Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M215 420 L255 438 L305 442 L355 432 L400 410 L435 380 L455 345 L445 315 L430 285 L418 250 L400 220 L365 190 L320 165 L270 150 L220 145 L180 155 L145 175 L118 202 L95 230 L78 260 L62 290 L48 320" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M415 275 L460 270 L505 275 L545 300 L575 330 L610 350 L610 410 L610 475 L610 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M610 275 L610 220 L610 165 L610 110 L610 55 L610 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L585 585 L675 585 L750 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="750" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="378" y="211.8" text-anchor="middle" font-size="71.8" fill="#6b7280"><tspan x="378" y="211.8">4. lift, then draw the</tspan><tspan x="378" y="299.4">shirorekha</tspan><tspan x="378" y="387">left-to-right</tspan></text></svg><text x="16" y="239.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ञ-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009</text><text x="16" y="252.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the 