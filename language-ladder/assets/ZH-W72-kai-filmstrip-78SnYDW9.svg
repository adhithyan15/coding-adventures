after Hanzi Writer Data 开.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="267.68" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="280.18" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
