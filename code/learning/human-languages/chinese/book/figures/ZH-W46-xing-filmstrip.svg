<svg xmlns="http://www.w3.org/2000/svg" width="982" height="507.12" viewBox="0 0 982 507.12" role="img" aria-label="How to write 星: 9 strokes · 8 pen lifts · 9 movements"><title>Writing 星</title><desc>9 frames; frame N shows movements 1 to N of 星 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 星.json, ordered stroke paths and medians 1–9 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%98%9F.json&gt;. Source note on variation: The cited PRC-order dataset supplies nine ordered strokes for 星, in two pieces. Medians 1–4 draw 日 on top as 日 is written alone: its left side, the joined top and right side, the middle horizontal, the closing bottom. Medians 5–9 draw 生 under it as 生 is written alone: a left-falling stroke, two horizontals, the vertical through them, then the long horizontal at the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those nine ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and eight intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="507.12" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 9 strokes · 8 pen lifts · 9 movements</text><rect x="16" y="42" width="150" height="200.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.81" viewBox="-20 -869 1027 1374.9" preserveAspectRat