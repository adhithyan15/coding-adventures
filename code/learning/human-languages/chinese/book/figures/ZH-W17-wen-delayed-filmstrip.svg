><circle class="ductus__tip" cx="940" cy="-5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501.5" y="303.8" text-anchor="middle" font-size="85.8" fill="#6b7280"><tspan x="501.5" y="303.8">4. lift, return near the</tspan><tspan x="501.5" y="408.5">centre, and draw the</tspan><tspan x="501.5" y="513.2">long right-falling</tspan><tspan x="501.5" y="617.8">stroke</tspan></text></svg><text x="16" y="274.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hanzi Writer Data 文.json, ordered stroke paths and medians 1–4 (Hanzi Writer Data snapshot 68d10a4,</text><text x="16" y="286.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">updated from Make Me a Hanzi, 22 June 2019)</text><text x="16" y="299.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
