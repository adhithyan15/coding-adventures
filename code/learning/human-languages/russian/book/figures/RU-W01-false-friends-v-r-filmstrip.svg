<svg xmlns="http://www.w3.org/2000/svg" width="838" height="438.49" viewBox="0 0 838 438.49" role="img" aria-label="How to write в, р: 2 letters, в, р, one after another"><title>Writing в, р</title><desc>2 letters written one after another: в, р (cyrillic). Each letter has its own group of frames; frame N of a group shows movements 1 to N of that letter, the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Each letter is drawn at its own scale from its own cited stroke order, so the strip does not show how large the letters are next to each other, how far apart they sit, or any join between them. Stroke order: в: RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase в demonstration, 01:33–01:38, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;; р: RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase р demonstration, 06:46–06:52, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source notes on variation: в: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 01:33–01:38 lowercase в demonstration, the pen starts at the baseline, climbs through the tall upper loop, descends to the baseline, and continues counterclockwise around the rounded lower bowl in one continuous pen-down run, for zero intervening lifts. The demonstrated school hand resembles a looped Latin cursive b with one tall ascender loop above a lower bowl; the bundled Noto Sans Cyrillic glyph is a compact printed form with two stacked bowls attached to a straight left stem. This learner path preserves the source&apos;s baseline-to-upper-loop-to-baseline-to-lower-bowl order while routing the ascender through the printed upper bowl and left stem so it remains on the font&apos;s ink. Connected cursive may add entry and exit joins, and individual handwriting may narrow, round, or slant either loop differently. р: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 06:46–06:52 lowercase р demonstration, the pen begins near the upper left, descends below the baseline, retraces upward without lifting, curves right through a rounded shoulder, descends to the baseline, and finishes through a small rising exit in one continuous pen-down run, for zero intervening lifts. The demonstrated school hand resembles a long-descender Latin p with an open rounded bowl plus entry and exit joins; the bundled Noto Sans Cyrillic glyph is a printed p-like form with a straight descender stem and a closed rounded bowl, without cursive joins. This learner path preserves the source&apos;s stem-before-bowl order and zero-lift evidence while fitting the printed outline: descend below the baseline, retrace to the upper-left shoulder, circle the upper bowl clockwise, and return to the middle junction without lifting. Connected cursive restores the source&apos;s open bowl and entry and exit joins, and individual handwriting may round, narrow, widen, or slant the bowl and stem differently.</desc><rect x="0" y="0" width="838" height="438.49" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 letters, one after another</text><text x="16" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 1 of 2 — one unbroken stroke · 2 movements</text><rect x="16" y="61" width="150" height="240.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="61" width="150" height="240.5" viewBox="15 -606 574 920.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L300 536Q399 536 450.5 501.5Q502 467 502 401Q502 306 394 285L394 281Q456 273 487.5 240Q519 207 519 154Q519 111 497 76Q475 41 427 20.5Q379 0 301 0L85 0ZM173 315L279 315Q348 315 380 333Q412 351 412 390Q412 464 295 464L173 464L173 315ZM173 72L291 72Q361 72 394 92.5Q427 113 427 157Q427 244 289 244L173 244L173 72Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 20 L130 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 20 L130 100 L130 200 L130 300 L130 400 L130 500 L220 500 L310 500 L380 480 L430 445 L455 400 L450 355 L420 320 L365 300 L295 290 L220 290 L150 290 L130 260 L130 180 L130 100 L130 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="130" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="302" y="186" text-anchor="middle" font-size="46" fill="#6b7280"><tspan x="302" y="186">1. climb through the</tspan><tspan x="302" y="242.1">upper loop and descend</tspan><tspan x="302" y="298.2">to the baseline</tspan></text></svg><rect x="176" y="61" width="150" height="240.5" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="61" width="150" height="240.5" viewBox="15 -606 574 920.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 0L85 536L300 536Q399 536 450.5 501.5Q502 467 502 401Q502 306 394 285L394 281Q456 273 487.5 240Q519 207 519 154Q519 111 497 76Q475 41 427 20.5Q379 0 301 0L85 0ZM173 315L279 315Q348 315 380 333Q412 351 412 390Q412 464 295 464L173 464L173 315ZM173 72L291 72Q361 72 394 92.5Q427 113 427 157Q427 244 289 244L173 244L173 72Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 20 L130 100 L130 200 L130 300 L130 400 L130 500 L220 500 L310 500 L380 480 L430 445 L455 400 L450 355 L420 320 L365 300 L295 290 L220 290 L150 290 L130 260 L130 180 L130 100 L130 20 L130 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 20 L220 35 L310 35 L385 50 L440 80 L470 120 L475 165 L455 205 L415 235 L360 260 L295 270 L220 270 L150 270 L130 260" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="130" cy="260" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="302" y="186" text-anchor="middle" font-size="46" fill="#6b7280"><tspan x="302" y="186">2. continue</tspan><tspan x="302" y="242.1">counterclockwise around</tspan><tspan x="302" y="298.2">the rounded lower bowl</tspan></text></svg><text x="352" y="54" font-family="Latin Modern Sans, sans-serif" font-size="12" fill="#172033">Letter 2 of 2 — one unbroken stroke · 3 movements</text><rect x="352" y="61" width="150" height="288.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="352" y="61" width="150" height="288.49" viewBox="15 -616 615 1182.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 -240L85 536L157 536L169 463L173 463Q197 498 236 522Q275 546 340 546Q439 546 499.5 477Q560 408 560 269Q560 132 499.5 61Q439 -10 339 -10Q277 -10 236.5 13.5Q196 37 173 68L167 68Q169 51 171 25Q173 -1 173 -20L173 -240L85 -240ZM326 63Q374 63 405.5 90Q437 117 452.5 163.5Q468 210 468 270Q468 362 433 417Q398 472 324 472Q242 472 207.5 426Q173 380 173 286L173 269Q173 170 205.5 116.5Q238 63 326 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 510 L129 510" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 510 L129 350 L129 190 L129 30 L129 -100 L129 -200" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="-200" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="322.5" y="429.3" text-anchor="middle" font-size="49.3" fill="#6b7280"><tspan x="322.5" y="429.3">1. descend the stem</tspan><tspan x="322.5" y="489.4">below the baseline</tspan></text></svg><rect x="512" y="61" width="150" height="288.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="512" y="61" width="150" height="288.49" viewBox="15 -616 615 1182.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 -240L85 536L157 536L169 463L173 463Q197 498 236 522Q275 546 340 546Q439 546 499.5 477Q560 408 560 269Q560 132 499.5 61Q439 -10 339 -10Q277 -10 236.5 13.5Q196 37 173 68L167 68Q169 51 171 25Q173 -1 173 -20L173 -240L85 -240ZM326 63Q374 63 405.5 90Q437 117 452.5 163.5Q468 210 468 270Q468 362 433 417Q398 472 324 472Q242 472 207.5 426Q173 380 173 286L173 269Q173 170 205.5 116.5Q238 63 326 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 510 L129 350 L129 190 L129 30 L129 -100 L129 -200 L129 -200" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M129 -200 L129 -80 L129 40 L129 180 L129 320 L129 450 L157 450 L173 463 L190 475 L220 490 L280 510 L370 500 L450 450 L500 370 L515 270 L515 270" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="515" cy="270" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="322.5" y="429.3" text-anchor="middle" font-size="49.3" fill="#6b7280"><tspan x="322.5" y="429.3">2. retrace to the upper</tspan><tspan x="322.5" y="489.4">shoulder and curve</tspan><tspan x="322.5" y="549.6">right</tspan></text></svg><rect x="672" y="61" width="150" height="288.49" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="672" y="61" width="150" height="288.49" viewBox="15 -616 615 1182.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 -240L85 536L157 536L169 463L173 463Q197 498 236 522Q275 546 340 546Q439 546 499.5 477Q560 408 560 269Q560 132 499.5 61Q439 -10 339 -10Q277 -10 236.5 13.5Q196 37 173 68L167 68Q169 51 171 25Q173 -1 173 -20L173 -240L85 -240ZM326 63Q374 63 405.5 90Q437 117 452.5 163.5Q468 210 468 270Q468 362 433 417Q398 472 324 472Q242 472 207.5 426Q173 380 173 286L173 269Q173 170 205.5 116.5Q238 63 326 63Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M129 510 L129 350 L129 190 L129 30 L129 -100 L129 -200 L129 -80 L129 40 L129 180 L129 320 L129 450 L157 450 L173 463 L190 475 L220 490 L280 510 L370 500 L450 450 L500 370 L515 270 L515 270" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M515 270 L505 170 L455 90 L380 40 L300 25 L230 45 L185 100 L177 175 L165 220 L150 269 L129 269" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="129" cy="269" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="322.5" y="429.3" text-anchor="middle" font-size="49.3" fill="#6b7280"><tspan x="322.5" y="429.3">3. sweep around the</tspan><tspan x="322.5" y="489.4">bowl and return to the</tspan><tspan x="322.5" y="549.6">stem</tspan></text></svg><text x="16" y="362.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 1: stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase в demonstration, 01:33–01:38, YouTube, 5 February</text><text x="16" y="374.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2013</text><text x="16" y="387.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 2: stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase р demonstration, 06:46–06:52, YouTube, 5 February</text><text x="16" y="399.99" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2013</text><text x="16" y="412.49" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
