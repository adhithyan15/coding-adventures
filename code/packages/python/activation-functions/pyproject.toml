[project]
name = "activation-functions"
version = "0.2.0"
description = "Pure scalar activation functions and derivatives"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activation_functions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=activation_functions --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
