<svg xmlns="http://www.w3.org/2000/svg" width="662" height="320.12" viewBox="0 0 662 320.12" role="img" aria-label="How to write ఇ: one unbroken stroke · 4 movements"><title>Writing ఇ</title><desc>4 frames; frame N shows movements 1 to N of ఇ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Hojaswani LUCIDA and Physics classes, practice Telugu letters with strokes, independent vowel ఇ decomposition, 00:00–00:05 (YouTube, 14 September 2024); reordered, and drawn in one stroke, after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 2 (ఇ): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://www.youtube.com/watch?v=MKvmq1hFVIE&gt;. Source note on variation: The demonstration writes three separated components, the broad bowl first and then each upper part outward from the central cusp, and recombines them as ఇ; this ductus used to lift between them, but a component shown on its own in a demonstration is not evidence of a lift. In HP Labs India&apos;s online Telugu handwriting data (the LipiTk 4.0 Telugu isolated-character recognizer, trained on hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), 104 of the 106 stored prototypes of ఇ (98%) are one pen-down stroke. 95 of the 104 (91%) start at the upper left, and in all 104 the pen tops the upper-left lobe before the upper-right one; 97 (93%) turn that first lobe clockwise; 96 (92%) go round the bowl along its bottom before its top; and 102 (98%) end low on the right, at the foot of the tail. So this ductus overrides the demonstration&apos;s order, its direction and its two lifts: it starts at the free tip of the upper-left lobe, draws both upper parts from left to right, comes down the right side, sweeps left under the bowl and back along its top, and ends down the tail. The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Telugu handwriting may vary.</desc><rect x="0" y="0" width="662" height="320.12" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="189.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="189.12" viewBox="-41 -570 765 964.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M300 -12Q228 -12 182 5.5Q136 23 114.5 55.5Q93 88 93 132Q93 195 144 232Q195 269 292 269Q390 269 460 229Q530 189 567 132Q587 101 598 69Q609 37 609 0Q609 -25 605 -49.5Q601 -74 591 -97L518 -82Q525 -65 528.5 -44Q532 -23 532 4Q532 58 502.5 101Q473 144 419.5 169Q366 194 292 194Q235 194 205.5 177.5Q176 161 176 132Q176 110 189 94.5Q202 79 230 71Q258 63 302 63Q373 63 431.5 83.5Q490 104 523 146Q547 172 559 207.5Q571 243 571 286Q571 335 557.5 364.5Q544 394 521 407.5Q498 421 469 421Q440 421 418.5 407Q397 393 384 370Q371 347 366 318L288 318Q279 371 253 398Q227 425 184 425Q147 425 129.5 407.5Q112 390 112 364Q112 348 116.5 331.5Q121 315 126 305L50 283Q42 300 35.5 321.5Q29 343 29 372Q29 411 49.5 439.5Q70 468 104.5 484Q139 500 181 500Q218 500 245.5 489.5Q273 479 295 456.5Q317 434 335 398L317 396Q338 438 363.5 460.5Q389 483 418 491.5Q447 500 476 500Q514 500 546.5 485.5Q579 471 603 443.5Q627 416 640.5 376.5Q654 337 654 287Q654 220 632.5 170.5Q611 121 571 83Q568 80 565 78.5Q562 77 559 75Q556 73 552 70Q506 32 446.5 10Q387 -12 300 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M77 331 L77 331" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M77 331 L77 388 L109 435 L159 459 L217 458 L267 432 L304 388 L329 339" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="329" cy="339" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="341.5" y="298.3" text-anchor="middle" font-size="61.3" fill="#6b7280"><tspan x="341.5" y="298.3">1. curl up over the</tspan><tspan x="341.5" y="373.1">upper-left lobe</tspan></text></svg><rect x="176" y="42" width="150" height="189.12" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="189.12" viewBox="-41 -570 765 964.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M300 -12Q228 -12 182 5.5Q136 23 114.5 55.5Q93 88 93 132Q93 195 144 232Q195 269 292 269Q390 269 460 229Q530 189 567 132Q587 101 598 69Q609 37 609 0Q609 -25 605 -49.5Q601 -74 591 -97L518 -82Q525 -65 528.5 -44Q532 -23 532 4Q532 58 502.5 101Q473 144 419.5 169Q366 194 292 194Q235 194 205.5 177.5Q176 161 176 132Q176 110 189 94.5Q202 79 230 71Q258 63 302 63Q373 63 431.5 83.5Q490 104 523 146Q547 172 559 207.5Q571 243 571 286Q571 335 557.5 364.5Q544 394 521 407.5Q498 421 469 421Q440 421 418.5 407Q397 393 384 370Q371 347 366 318L288 318Q279 371 253 398Q227 425 184 425Q147 425 129.5 407.5Q112 390 112 364Q112 348 116.5 331.5Q121 315 126 305L50 283Q42 300 35.5 321.5Q29 343 29 372Q29 411 49.5 439.5Q70 468 104.5 484Q139 500 181 500Q218 500 245.5 489.5Q273 479 295 456.5Q317 434 335 398L317 396Q338 438 363.5 460.5Q389 483 418 491.5Q447 500 476 500Q514 500 546.5 485.5Q579 471 603 443.5Q627 416 640.5 376.5Q654 337 654 287Q654 220 632.5 170.5Q611 121 571 83Q568 80 565 78.5Q562 77 559 75Q556 73 552 70Q506 32 446.5 10Q387 -12 300 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M77 331 L77 388 L109 435 L159 459 L217 458 L267 432 L304 388 L329 339 L329 339" fill="none" s