<svg xmlns="http://www.w3.org/2000/svg" width="822" height="303.08" viewBox="0 0 822 303.08" role="img" aria-label="How to write ਡ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ਡ</title><desc>5 frames; frame N shows movements 1 to N of ਡ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਡ (daddaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 564, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L564&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਡ in two pen-down strokes: the headline from left to right; then from the top right down and to the left, clockwise through about two full turns, round the knob and then the lower loop, ending near the bottom right. The headline first is the source&apos;s teaching order. Fluent writers are often described as adding the headline last (Alfaazo&apos;s general guidance on Gurmukhi; native Devanagari writers do so in HP Labs India&apos;s pen data), so the path shows how this lesson teaches the letter, not how every fluent hand writes it. The outline prints the knob as a solid teardrop, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਡ, each by a different non-native copyist; only counts and shares are cited. 80% (16 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 70% (14 of 20) start in the same part of the letter as the source and 100% (20 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="303.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="197.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.08" viewBox="-77 -692 751 986.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 0Q138 0 86.5 34.5Q35 69 35 127Q35 171 70.5 204Q106 237 178 237Q233 237 278.5 218.5Q324 200 359 170.5Q394 141 418 109Q438 124 449.5 147Q461 170 461 202Q461 243 430 276Q399 309 349 324Q326 320 296.5 316Q267 312 236 312Q191 312 167 320.5Q143 329 134 342Q125 355 125 369Q125 398 150.5 408.5Q176 419 212 419Q252 419 287.5 412.5Q323 406 357 393Q392 407 414.5 436Q437 465 437 512Q437 531 433 551L-7 551L-7 622L604 622L604 551L515 551Q518 530 518 511Q518 449 493.5 416.5Q469 384 432 362Q488 333 515.5 293Q543 253 543 199Q543 133 506 88.5Q469 44 402.5 22Q336 0 249 0ZM116 125Q116 69 248 69Q273 69 299.5 71Q326 73 351 79Q319 113 276.5 139.5Q234 166 182 166Q149 166 132.5 155Q116 144 116 125Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L55 586 L96 586 L136 586 L176 586 L216 586 L257 586 L297 586 L337 586 L378 586 L418 586 L458 586 L498 586 L539 586 L579 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cl