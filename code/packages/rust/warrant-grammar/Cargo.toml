[package]
name = "coding_adventures_warrant_grammar"
version = "0.1.0"
edition = "2021"
description = "Warrant v0 grammar artifacts, bounded source admission, layout, parser, type checker and bindings"
license = "MIT"

[dependencies]
grammar-tools = { path = "../grammar-tools" }

[dev-dependencies]
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
coding_adventures_sha256 = { path = "../sha256" }
coding_adventures_ct_compare = { path = "../ct-compare" }

[[test]]
name = "self_corpus"
path = "tests/self_corpus.rs"
harness = false
