<svg xmlns="http://www.w3.org/2000/svg" width="662" height="533.35" viewBox="0 0 662 533.35" role="img" aria-label="How to write ઃ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ઃ</title><desc>4 frames; frame N shows movements 1 to N of ઃ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/11_kah.svg, groups g1 then g2 (strokes g1s0, g2s0): the visarga drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કઃ, and in all 34 consonant rows, ઃ is two pen-down runs: the upper dot first, then the lower, each a small closed loop that starts at its top and turns anticlockwise. The printed dots are solid, so each pen path circles inside its dot. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: 77 of its 81 stored prototypes of the visarga (95%) are two strokes, the upper dot first. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="533.35" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="414.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="414.85" viewBox="-7 -555 262 724.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M124 357Q99 357 81 374Q63 391 63 421Q63 452 81 468.5Q99 485 124 485Q149 485 167 468.5Q185 452 185 421Q185 391 167 374Q149 357 124 357ZM124 50Q99 50 81 67Q63 84 63 114Q63 144 81 161Q99 178 124 178Q149 178 167 161Q185 144 185 114Q185 84 167 67Q149 50 124 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 451 L124 451" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 451 L113 449 L103 442 L96 432 L94 421 L96 410 L103 400 L113 393 L124 391" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="124" cy="391" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="124" y="111" text-anchor="middle" font-size="21" fill="#6b7280"><tspan x="124" y="111">1. start at the upper</tspan><tspan x="124" y="136.6">dot&apos;s top and curve</tspan><tspan x="124" y="162.2">down its left side</tspan></text></svg><rect x="176" y="42" width="150" height="414.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="414.85" viewBox="-7 -555 262 724.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M124 357Q99 357 81 374Q63 391 63 421Q63 452 81 468.5Q99 485 124 485Q149 485 167 468.5Q185 452 185 421Q185 391 167 374Q149 357 124 357ZM124 50Q99 50 81 67Q63 84 63 114Q63 144 81 161Q99 178 124 178Q149 178 167 161Q185 144 185 114Q185 84 167 67Q149 50 124 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 451 L113 449 L103 442 L96 432 L94 421 L96 410 L103 400 L113 393 L124 391 L124 391" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 391 L135 393 L145 400 L152 410 L154 421 L152 432 L145 442 L135 449 L124 451" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="124" cy="451" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="124" y="111" text-anchor="middle" font-size="21" fill="#6b7280"><tspan x="124" y="111">2. round its bottom and</tspan><tspan x="124" y="136.6">up its right side to</tspan><tspan x="124" y="162.2">close it</tspan></text></svg><rect x="336" y="42" width="150" height="414.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="414.85" viewBox="-7 -555 262 724.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M124 357Q99 357 81 374Q63 391 63 421Q63 452 81 468.5Q99 485 124 485Q149 485 167 468.5Q185 452 185 421Q185 391 167 374Q149 357 124 357ZM124 50Q99 50 81 67Q63 84 63 114Q63 144 81 161Q99 178 124 178Q149 178 167 161Q185 144 185 114Q185 84 167 67Q149 50 124 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 451 L113 449 L103 442 L96 432 L94 421 L96 410 L103 400 L113 393 L124 391 L135 393 L145 400 L152 410 L154 421 L152 432 L145 442 L135 449 L124 451" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M124 144 L124 144" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 144 L113 142 L103 135 L96 125 L94 114 L96 103 L103 93 L113 86 L124 84" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="124" cy="84" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="124" y="111" text-anchor="middle" font-size="21" fill="#6b7280"><tspan x="124" y="111">3. start at the lower</tspan><tspan x="124" y="136.6">dot&apos;s top and curve</tspan><tspan x="124" y="162.2">down its left side</tspan></text></svg><rect x="496" y="42" width="150" height="414.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="414.85" viewBox="-7 -555 262 724.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M124 357Q99 357 81 374Q63 391 63 421Q63 452 81 468.5Q99 485 124 485Q149 485 167 468.5Q185 452 185 421Q185 391 167 374Q149 357 124 357ZM124 50Q99 50 81 67Q63 84 63 114Q63 144 81 161Q99 178 124 178Q149 178 167 161Q185 144 185 114Q185 84 167 67Q149 50 124 50Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 451 L113 449 L103 442 L96 432 L94 421 L96 410 L103 400 L113 393 L124 391 L135 393 L145 400 L152 410 L154 421 L152 432 L145 442 L135 449 L124 451" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M124 144 L113 142 L103 135 L96 125 L94 114 L96 103 L103 93 L113 86 L124 84 L124 84" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 84 L135 86 L145 93 L152 103 L154 114 L152 125 L145 135 L135 142 L124 144" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="124" cy="144" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="124" y="111" text-anchor="middle" font-size="21" fill="#6b7280"><tspan x="124" y="111">4. round its bottom and</tspan><tspan x="124" y="136.6">up its right side to</tspan><tspan x="124" y="162.2">close it</tspan></text></svg><text x="16" y="469.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="482.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/11_kah.svg, groups g1 then g2 (strokes g1s0, g2s0): the visarga</text><text x="16" y="494.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">drawn after the consonant (GitHub, 2026)</text><text x="16" y="507.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
