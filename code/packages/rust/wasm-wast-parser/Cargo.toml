[package]
name = "wasm-wast-parser"
version = "0.1.15"
edition = "2021"
description = "Parses the WebAssembly text format (.wat/.wast), including the official spec testsuite's script-directive dialect, into wasm-types::WasmModule and a sequence of test directives. v0.1.6: block/loop/if blocktypes can now be a multi-value type-index, not just the MVP's empty/single-valtype byte -- (param ...)/(result ...)/(type $t) headers on block/loop/if now dedupe into (or resolve to) a real type-section entry, in both flat and folded instruction syntax (WASM04); fixing this exposed a deeper pre-existing bug where a func's own signature resolution (resolve_func_signature_ref) scanned its ENTIRE input unbounded instead of a properly-bounded leading region, which was safe for its historical import-only call site but corrupted a function's own param count once its FLAT-form body could contain a later block's own unnested (param ...)/(result ...) fields. v0.1.5: encodes the sign-extension proposal's 5 opcodes (via the now-extended wasm-opcodes table) and the non-trapping-conversions proposal's 8 trunc_sat opcodes (via a direct 0xFC-prefix special case, since they don't fit wasm-opcodes' single-byte model) in both flat and folded instruction syntax (WASM03). v0.1.4: func/table/memory/global inline-import shorthand ((func $f (import \"m\" \"n\") ...)) now desugars to a real import instead of silently building an empty function body; fixing it exposed and fixed a deeper pre-existing bug where ctx.module.functions/tables/memories/globals (which mirror the BINARY format's real-definitions-only sections) were being indexed by the combined import+real space index instead of a real-definitions-only storage index, panicking the first time any module combined an import with a same-kind real definition. v0.1.3: (module quote/binary ...) DIRECTIVES (a real, executed module, not assert_malformed's deliberately-broken source) now actually decode instead of silently building an empty module -- quote text is re-parsed via this crate's own text path (now also accepting the WAT \"abbreviated module\" form, a bare field list with no (module ...) wrapper, which is exactly how the official testsuite's comments.wast/block.wast/etc. write their quoted content), binary bytes decode via wasm-module-parser; also fixes the tokenizer's `;;` line comment to terminate at a bare CR or CRLF, not just LF."

[dependencies]
wasm-types = { path = "../wasm-types" }
wasm-opcodes = { path = "../wasm-opcodes" }
wasm-leb128 = { path = "../wasm-leb128" }
wasm-module-parser = { path = "../wasm-module-parser" }
