<svg xmlns="http://www.w3.org/2000/svg" width="662" height="356.06" viewBox="0 0 662 356.06" role="img" aria-label="How to write り: 2 strokes · 1 pen lift · 4 movements"><title>Writing り</title><desc>4 frames; frame N shows movements 1 to N of り (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0308a.svg, hiragana り (U+308A HIRAGANA LETTER RI), two stroke paths kvg:0308a-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0308a.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left stroke drawn top to bottom, which turns at its foot and flicks up to the right without lifting; s2 starts at the top of the right stroke, higher than s1, runs down and sweeps away to the lower left. In KanjiVG the two paths do not touch. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. The print glyph has no flick at the foot of the left stroke: a thin stroke leaves it partway down and rises over an arch into the top of the right stroke, the pen&apos;s way from one stroke to the next drawn in ink. So the path goes down to the foot of the left stroke, climbs back up the same ink and follows that rise to the top of the arch, where the right stroke begins; in the print glyph, unlike KanjiVG, the two strokes touch there.</desc><rect x="0" y="0" width="662" height="356.06" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="250.06" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><s