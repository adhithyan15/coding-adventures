<svg xmlns="http://www.w3.org/2000/svg" width="822" height="328.01" viewBox="0 0 822 328.01" role="img" aria-label="How to write ま: 3 strokes · 2 pen lifts · 5 movements"><title>Writing ま</title><desc>5 frames; frame N shows movements 1 to N of ま (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0307e.svg, hiragana ま (U+307E HIRAGANA LETTER MA), three stroke paths kvg:0307e-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0307e.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the upper bar drawn left to right; s2 is the lower bar drawn left to right; s3 starts above the upper bar, runs down through both, rounds to the left at its foot, comes back up, crosses the vertical and runs out to the lower right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="328.01" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="222.01" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.01" viewBox="112 -864 824 1219.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M573 794Q571 781 569.5 765Q568 749 567 727Q567 712 566.5 682Q566 652 566 614.5Q566 577 566 539Q566 501 566 469Q566 419 568 364Q570 309 573 257Q576 205 578 162Q580 119 580 94Q580 59 563.5 27Q547 -5 508.5 -25.5Q470 -46 404 -46Q296 -46 239 -8.5Q182 29 182 101Q182 147 