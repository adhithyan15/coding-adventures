<svg xmlns="http://www.w3.org/2000/svg" width="502" height="257.66" viewBox="0 0 502 257.66" role="img" aria-label="How to write ా: one unbroken stroke · 3 movements"><title>Writing ా</title><desc>3 frames; frame N shows movements 1 to N of ా (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 52 (ా, aa sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 308 of the 312 stored prototypes of the aa sign (99%) are one pen-down stroke, and 302 of the 308 start in the left third of the sign, so the bar comes first, drawn to the right. The loop&apos;s turn is the least settled part: 190 of the 308 (62%) go round it clockwise, down its right side and back up its left, and 117 go round it the other way. The bundled font prints the loop&apos;s tip tucked under the bar on the left, where the clockwise form ends, so the path follows the majority. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="257.66" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="139.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="139.16" viewBox="-616 -570 931 863.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 220Q67 220 40.5 231Q14 242 -2 260.5Q-18 279 -25.5 301Q-33 323 -33 344Q-33 376 -23.5 399Q-14 422 0 443L88 450Q63 425 51.5 401.5Q40 378 40 353Q40 323 57.5 304.5Q75 286 108 286Q143 286 157.5 304.5Q172 323 172 350Q172 392 146.5 408.5Q121 425 75 425L-546 425L-546 500L33 500Q76 500 106 496.5Q136 493 158 485Q180 477 198 462Q219 446 232 418.5Q245 391 245 353Q245 290 207 255Q169 220 104 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-525 462 L-525 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-525 462 L-490 462 L-447 462 L-403 462 L-364 462 L-326 462 L-288 462 L-250 462 L-212 462 L-174 462 L-137 462 L-99 462 L-61 464 L-22 467 L12 468 L40 462" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="40" cy="462" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-150.5" y="-5.4" text-anchor="middle" font-size="74.6" fill="#6b7280"><tspan x="-150.5" y="-5.4">1. start at the left</tspan><tspan x="-150.5" y="85.6">end of the bar and draw</tspan><tspan x="-150.5" y="176.6">it to the right</tspan></text></svg><rect x="176" y="42" width="150" height="139.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="139.16" viewBox="-616 -570 931 863.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 220Q67 220 40.5 231Q14 242 -2 260.5Q-18 279 -25.5 301Q-33 323 -33 344Q-33 376 -23.5 399Q-14 422 0 443L88 450Q63 425 51.5 401.5Q40 378 40 353Q40 323 57.5 304.5Q75 286 108 286Q143 286 157.5 304.5Q172 323 172 350Q172 392 146.5 408.5Q121 425 75 425L-546 425L-546 500L33 500Q76 500 106 496.5Q136 493 158 485Q180 477 198 462Q219 446 232 418.5Q245 391 245 353Q245 290 207 255Q169 220 104 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-525 462 L-490 462 L-447 462 L-403 462 L-364 462 L-326 462 L-288 462 L-250 462 L-212 462 L-174 462 L-137 462 L-99 462 L-61 464 L-22 467 L12 468 L40 462 L40 462" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M40 462 L84 466 L127 456 L162 439 L186 416 L202 385 L208 353" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="208" cy="353" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-150.5" y="-5.4" text-anchor="middle" font-size="74.6" fill="#6b7280"><tspan x="-150.5" y="-5.4">2. curve down the right</tspan><tspan x="-150.5" y="85.6">side of the loop</tspan></text></svg><rect x="336" y="42" width="150" height="139.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="139.16" viewBox="-616 -570 931 863.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 220Q67 220 40.5 231Q14 242 -2 260.5Q-18 279 -25.5 301Q-33 323 -33 344Q-33 376 -23.5 399Q-14 422 0 443L88 450Q63 425 51.5 401.5Q40 378 40 353Q40 323 57.5 304.5Q75 286 108 286Q143 286 157.5 304.5Q172 323 172 350Q172 392 146.5 408.5Q121 425 75 425L-546 425L-546 500L33 500Q76 500 106 496.5Q136 493 158 485Q180 477 198 462Q219 446 232 418.5Q245 391 245 353Q245 290 207 255Q169 220 104 220Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-525 462 L-490 462 L-447 462 L-403 462 L-364 462 L-326 462 L-288 462 L-250 462 L-212 462 L-174 462 L-137 462 L-99 462 L-61 464 L-22 467 L12 468 L40 462 L84 466 L127 456 L162 439 L186 416 L202 385 L208 353 L208 353" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M208 353 L200 320 L181 288 L150 265 L111 256 L72 261 L39 278 L16 306 L7 339 L10 371 L25 400 L50 432" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="50" cy="432" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-150.5" y="-5.4" text-anchor="middle" font-size="74.6" fill="#6b7280"><tspan x="-150.5" y="-5.4">3. round the bottom and</tspan><tspan x="-150.5" y="85.6">come up the left side</tspan><tspan x="-150.5" y="176.6">to the tip under the</tspan><tspan x="-150.5" y="267.6">bar</tspan></text></svg><text x="16" y="194.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="206.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Telugu recognizer, class 52 (ా, aa sign): stored online-handwriting prototypes from native</text><text x="16" y="219.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">writers (MIT licence, 2012)</text><text x="16" y="231.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
