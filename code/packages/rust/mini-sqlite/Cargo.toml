[package]
name = "coding-adventures-mini-sqlite"
version = "0.5.69"
edition = "2021"
description = "Mini SQLite facade for Rust — Level 1 full pipeline (parser → planner → optimizer → codegen → VM), over in-memory or real .sqlite-file backends"

[dependencies]
coding-adventures-sql-backend = { path = "../sql-backend" }
coding-adventures-sql-planner = { path = "../sql-planner" }
coding-adventures-sql-optimizer = { path = "../sql-optimizer" }
coding-adventures-sql-codegen = { path = "../sql-codegen" }
coding-adventures-sql-vm = { path = "../sql-vm" }
coding-adventures-sql-lexer = { path = "../sql-lexer" }
lexer = { path = "../lexer" }
# The file-backed storage engine — lets `connect("<path>.sqlite")` run the full
# pipeline over a real database file. Built on the zero-dep `sqlite-file` reader,
# so no third-party SQLite is linked at runtime.
coding-adventures-storage-sqlite = { path = "../storage-sqlite" }

[dev-dependencies]
serde_json = "1"

# `rusqlite` (bundled C SQLite) is a DEV-dependency ONLY — the differential
# conformance harness (`tests/differential_oracle.rs`) runs the same SQL through
# both mini-sqlite and the real C library and diffs the results. Nothing in the
# shipped crate links it; mini-sqlite is a from-scratch SQLite replacement, and
# the whole point is that the real library is only ever the measuring oracle.
rusqlite = { version = "0.32", features = ["bundled"] }
