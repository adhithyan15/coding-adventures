<svg xmlns="http://www.w3.org/2000/svg" width="662" height="303.77" viewBox="0 0 662 303.77" role="img" aria-label="How to write け: 3 strokes · 2 pen lifts · 4 movements"><title>Writing け</title><desc>4 frames; frame N shows movements 1 to N of け (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03051.svg, hiragana け (U+3051 HIRAGANA LETTER KE), three stroke paths kvg:03051-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03051.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left vertical drawn top to bottom, which turns at its foot and flicks up to the right without lifting; s2 is the bar drawn left to right; s3 starts at the top, runs down through the bar and curves away to the lower left. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs; where the print glyph&apos;s left stroke runs on below the point the flick leaves it, the path goes down to the foot of that ink and climbs back a short way before the flick.</desc><rect x="0" y="0" width="662" height="303.77" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="197.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.77" viewBox="49 -850 943 1243.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M761 780Q759 767 758.5 752.5Q758 738 758 721Q757 710 757.5 685Q758 660 758.5 628.5Q759 597 759.5 5