<svg xmlns="http://www.w3.org/2000/svg" width="502" height="319.17" viewBox="0 0 502 319.17" role="img" aria-label="How to write ா: one unbroken stroke · 3 movements"><title>Writing ா</title><desc>3 frames; frame N shows movements 1 to N of ா (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 36 (ா, aa sign): stored online-handwriting prototypes from native Tamil writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Tamil writers&apos; tablet pen traces, each resampled to 60 points. 189 of the 217 stored prototypes of the aa sign (87%) are one pen-down stroke. In 135 of those 189 the pen starts on the left, partway down, and first moves down; 154 end at the foot of the right upright. So the left upright is drawn down, climbed back to the top bar, and the right upright comes last, without lifting. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline, whose top bar runs a little past the right upright. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="319.17" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="200.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.67" viewBox="18 -624 675 903" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L623 554L623 482L453 482L453 0L367 0L367 482L174 482L174 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 330 L131 330" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 330 L131 250 L131 170 L131 90 L131 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="131" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="194.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="194.1">1. down the left</tspan><tspan x="355.5" y="260.1">upright</tspan></text></svg><rect x="176" y="42" width="150" height="200.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="200.67" viewBox="18 -624 675 903" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L623 554L623 482L453 482L453 0L367 0L367 482L174 482L174 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 330 L131 250 L131 170 L131 90 L131 20 L131 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M131 20 L131 120 L131 220 L131 320 L131 420 L131 518 L230 518 L330 518 L430 518 L530 518 L600 518" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="600" cy="518" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="194.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="194.1">2. back up and along</tspan><tspan x="355.5" y="260.1">the top</tspan></text></svg><rect x="336" y="42" width="150" height="200.67" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="200.67" viewBox="18 -624 675 903" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M88 0L88 554L623 554L623 482L453 482L453 0L367 0L367 482L174 482L174 0L88 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M131 330 L131 250 L131 170 L131 90 L131 20 L131 120 L131 220 L131 320 L131 420 L131 518 L230 518 L330 518 L430 518 L530 518 L600 518 L600 518" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M600 518 L500 518 L410 518 L410 420 L410 320 L410 220 L410 120 L410 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="410" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="194.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="194.1">3. back, then down the</tspan><tspan x="355.5" y="260.1">stem</tspan></text></svg><text x="16" y="255.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="268.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil recognizer, class 36 (ா, aa sign): stored online-handwriting prototypes from native</text><text x="16" y="280.67" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil writers (MIT licence, 2012)</text><text x="16" y="293.17" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
