<svg xmlns="http://www.w3.org/2000/svg" width="822" height="350.71" viewBox="0 0 822 350.71" role="img" aria-label="How to write 白: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 白</title><desc>5 frames; frame N shows movements 1 to N of 白 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 白.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E7%99%BD.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 白. Median 1 draws a short left-falling stroke at the top; medians 2–5 draw 日 under it as 日 is written alone: its left side, the joined top and right side, the middle horizontal, the closing bottom. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="350.71" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="244.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="244.71" viewBox="74 -914 854 1393.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M182 68L816 68L816 -7L182 -7L182 68ZM177 376L817 376L817 302L177 302L177 376ZM144 680L858 680L858 -75L780 -75L780 604L219 604L219 -80L144 -80L144 680ZM446 844L539 827Q517 776 493.5 723.5Q470 671 449 633L377 651Q390 678 403 712Q416 746 427.5 780.5Q439 815 446 844Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M471 826 L471 826" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M471 826 L445 729 L401 645" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="401" cy="645" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="501" y="288.4" text-anchor="middle" font-size="68.4" fill="#6b7280"><tspan x="501" y="288.4">1. draw the short</tspan><tspan x="501" y="371.8">left-falling stroke at</tspan><tspan x="501" y="455.3">the top</tspan></text></svg><rect x="176" y="42" width="150" height="244.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="244.71" viewBox="74 -914 854 1393.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M182 68L816 68L816 -7L182 -7L182 68ZM177 376L817 376L817 302L177 302L177 376ZM144 680L858 680L858 -75L780 -75L780 604L219 604L219 -80L144 -80L144 680ZM446 844L539 827Q517 776 493.5 723.5Q470 671 449 633L377 651Q390 678 403 712Q416 746 427.5 780.5Q439 815 446 844Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M471 826 L445 729 L401 645" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M181 667 L181 667" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M181 667 L181 -66" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="181" cy="-66" r="34" fill