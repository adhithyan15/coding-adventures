<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.86" viewBox="0 0 822 321.86" role="img" aria-label="How to write 他: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 他</title><desc>5 frames; frame N shows movements 1 to N of 他 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 他.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%BB%96.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 他, in two pieces. Medians 1–2 draw 亻 on the left: a left-falling stroke, then a vertical restarting under it, as 你 opens. Medians 3–5 draw 也 on the right: a horizontal that rises to the right, turns down and hooks to the left without lifting, a vertical through the middle, then a long vertical that bends right along the foot and hooks up without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the two turns, the two hooks and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC. Noto&apos;s 也 is wider than the source&apos;s, so its turn and hook sit further right.</desc><rect x="0" y="0" width="822" height="321.86" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="215.86" r