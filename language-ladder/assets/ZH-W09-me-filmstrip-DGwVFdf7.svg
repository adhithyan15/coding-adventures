<svg xmlns="http://www.w3.org/2000/svg" width="662" height="313.38" viewBox="0 0 662 313.38" role="img" aria-label="How to write 么: 3 strokes · 2 pen lifts · 4 movements"><title>Writing 么</title><desc>4 frames; frame N shows movements 1 to N of 么 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 么.json, ordered stroke paths and medians 1–3 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E4%B9%88.json&gt;. Source note on variation: The cited PRC-order dataset supplies three ordered strokes for 么. Median 1 draws the upper left-falling stroke down-left. Median 2 separately begins at the upper right, falls down-left, turns without lifting near the lower left, and sweeps right along the base. Median 3 separately places the final down-right dot. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all three medians to Noto Sans SC while preserving the second stroke&apos;s joined turn and two intervening lifts; Noto&apos;s first falling stroke is broader and its lower sweep is flatter than the Arphic-derived source graphic.</desc><rect x="0" y="0" width="662" height="313.38" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="207.38" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="207.38" viewBox="-9 -899 1026 1418.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M134 -27Q131 -19 126 -5Q121 9 114.5 24Q108 39 102 50Q126 55 158.5 80.5Q191 106 237 147Q262 168 309.5 2