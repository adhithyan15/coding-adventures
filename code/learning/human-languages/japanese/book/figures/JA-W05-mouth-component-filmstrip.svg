<svg xmlns="http://www.w3.org/2000/svg" width="662" height="305.42" viewBox="0 0 662 305.42" role="img" aria-label="How to write 口: 3 strokes · 2 pen lifts · 4 movements"><title>Writing 口</title><desc>4 frames; frame N shows movements 1 to N of 口 (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/053e3.svg, kanji 口 (U+53E3 CJK UNIFIED IDEOGRAPH-53E3), three stroke paths kvg:053e3-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/053e3.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the left side drawn top to bottom (kvg:type ㇑); s2 is the top drawn left to right, turning down the right side without lifting (㇕b); s3 is the base, drawn left to right (㇐b). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="662" height="305.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="199.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.42" viewBox="57 -805 890 1183.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M171 689 L171 689" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M171 689 L167 618 L167 548 L167 477 L166 406 L163 335 L163 264 L163 194 L163 123 L163 52 L163 -19" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="163" cy="-19" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">1. draw the left side</tspan><tspan x="502" y="353.3">down</tspan></text></svg><rect x="176" y="42" width="150" height="199.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="199.42" viewBox="57 -805 890 1183.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M171 689 L167 618 L167 548 L167 477 L166 406 L163 335 L163 264 L163 194 L163 123 L163 52 L163 -19" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M171 689 L171 689" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M171 689 L244 697 L317 697 L391 697 L464 697 L538 697 L611 697 L685 697 L758 697 L831 689" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="831" cy="689" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">2. draw the top to the</tspan><tspan x="502" y="353.3">right</tspan></text></svg><rect x="336" y="42" width="150" height="199.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="199.42" viewBox="57 -805 890 1183.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M171 689 L167 618 L167 548 L167 477 L166 406 L163 335 L163 264 L163 194 L163 123 L163 52 L163 -19" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M171 689 L244 697 L317 697 L391 697 L464 697 L538 697 L611 697 L685 697 L758 697 L831 689 L831 689" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M831 689 L835 619 L835 548 L835 478 L835 408 L835 337 L835 267 L835 196 L835 126 L835 55 L835 -15" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="835" cy="-15" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">3. turn down the right</tspan><tspan x="502" y="353.3">side</tspan></text></svg><rect x="496" y="42" width="150" height="199.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="199.42" viewBox="57 -805 890 1183.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M127 735L877 735L877 -51L796 -51L796 660L205 660L205 -55L127 -55L127 735ZM162 107L851 107L851 30L162 30L162 107Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M171 689 L167 618 L167 548 L167 477 L166 406 L163 335 L163 264 L163 194 L163 123 L163 52 L163 -19" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M171 689 L244 697 L317 697 L391 697 L464 697 L538 697 L611 697 L685 697 L758 697 L831 689 L835 619 L835 548 L835 478 L835 408 L835 337 L835 267 L835 196 L835 126 L835 55 L835 -15" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M175 69 L175 69" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M175 69 L247 69 L320 69 L392 69 L465 69 L537 69 L610 69 L682 69 L755 69 L827 69" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="827" cy="69" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="266.3" text-anchor="middle" font-size="71.3" fill="#6b7280"><tspan x="502" y="266.3">4. close the base to the</tspan><tspan x="502" y="353.3">right</tspan></text></svg><text x="16" y="254.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/053e3.svg, kanji 口 (U+53E3 CJK UNIFIED IDEOGRAPH-53E3), three stroke paths kvg:053e3-s1</text><text x="16" y="266.92" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">to s3 (Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="279.42" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
