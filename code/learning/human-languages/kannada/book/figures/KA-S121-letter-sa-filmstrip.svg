<svg xmlns="http://www.w3.org/2000/svg" width="982" height="319.64" viewBox="0 0 982 319.64" role="img" aria-label="How to write ಸ: 3 strokes · 2 pen lifts · 6 movements"><title>Writing ಸ</title><desc>6 frames; frame N shows movements 1 to N of ಸ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-alphabet-sa.gif, animation of Kannada consonant ಸ, 40 frames, 4.0 seconds (Wikimedia Commons, 25 May 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-alphabet-sa.gif&gt;. Source note on variation: The CC BY-SA 4.0 animation writes ಸ in three pen-down runs: from the tail at the lower left the pen climbs round the left curve, slants down to the right into the base and climbs the right side, curving in at the top (frames 0–13); after a lift, the top bar from left to right curling up into the hook (frames 14–22); after a second lift, the dot in the middle (frames 23–24). The frames were read from a mirror copy that matches the Commons file&apos;s listed size (234×190, 111 KB) and byte size. The path is fitted to the bundled Noto Sans Kannada outline rather than copying the animation&apos;s handwritten proportions; in that outline the dot is a filled disc, so the path draws it as a small closed loop inside it. The two-lift order remains the same.</desc><rect x="0" y="0" width="982" height="319.64" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="226.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="226.14" viewBox="-39 -860 779 1174.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M483 -12Q430 -12 395.5 8Q361 28 337.5 59.5Q314 91 294 125Q269 169 251 191Q233 213 217.