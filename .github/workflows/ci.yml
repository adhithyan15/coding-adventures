          # WinUI desktop. The test still builds the complete generated app;
          # local/self-hosted Windows runs launch and interact by default.
          MOSAIC_SKIP_INTERACTIVE_WINDOWS_ACCEPTANCE: '1'
        run: |
          Set-Location code/packages/rust
          cargo test -p paint-vm-cairo -p venture-browser-cairo -p venture-browser-qt -p venture-browser-windows
          if ($LASTEXITCODE -ne 0) {
            throw "Venture Windows render and bridge tests failed with exit code $LASTEXITCODE"
          }
          Set-Location ..\..\programs\mosaic\venture-browser
          cargo test
          if ($LASTEXITCODE -ne 0) {
            throw "Venture Mosaic package tests failed with exit code $LASTEXITCODE"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-all.ps1
