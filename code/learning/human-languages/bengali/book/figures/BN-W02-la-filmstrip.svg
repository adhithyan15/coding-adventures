L598 262 L598 307 L591 351 L597 396 L598 441 L598 486 L598 531 L598 576" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L191 586 L362 586 L534 586 L705 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="705" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="365.5" y="211.4" text-anchor="middle" font-size="71.4" fill="#6b7280"><tspan x="365.5" y="211.4">5. lift, then draw the</tspan><tspan x="365.5" y="298.5">headline last, from</tspan><tspan x="365.5" y="385.6">left to right</tspan></text></svg><text x="16" y="255.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 38 (ল, la; user manual Table 4): stored</text><text x="16" y="267.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="280.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
