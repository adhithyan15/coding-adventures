<svg xmlns="http://www.w3.org/2000/svg" width="182" height="741.06" viewBox="0 0 182 741.06" role="img" aria-label="How to write ا: one unbroken stroke · 1 movement"><title>Writing ا</title><desc>1 frames; frame N shows movements 1 to N of ا (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Pe, gaf, alif, and lam, independent ا animation (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/pe-gaf-alif-lam/&gt;. Source note on variation: The lesson explicitly distinguishes independent ا, drawn top-to-bottom in one continuous stroke, from final ـا, drawn bottom-to-top. This learner path covers the independent form and fits the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="182" height="741.06" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 1 movement</text><rect x="16" y="42" width="150" height="560.06" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="560.06" viewBox="5 -741 243 907.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M104 0Q103 88 100.5 168Q98 248 94.5 321Q91 394 87 459Q83 524 77 582Q75 609 80.5 627Q86 645 101.5 655.5Q117 666 143 671Q147 652 156.5 619.5Q166 587 178 552L151 529Q155 455 156.5 377Q158 299 156.5 209Q155 119 150 8L104 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 640 L120 640" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 640 L120 580 L119 500 L124 400 L128 250 L129 100 L127 10" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="127" cy="10" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="126.5" y="159.5" text-anchor="middle" font-size="19.5" fill="#6b7280"><tspan x="126.5" y="159.5">1. down</tspan></text></svg><text x="16" y="615.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o</text><text x="16" y="627.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Zabar, Pe, gaf, alif, and</text><text x="16" y="640.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">lam, independent ا animation</text><text x="16" y="652.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(Northwestern University</text><text x="16" y="665.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Libraries Open Textbook,</text><text x="16" y="677.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2026)</text><text x="16" y="690.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not</text><text x="16" y="702.56" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">standardised; the source</text><text x="16" y="715.06" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
