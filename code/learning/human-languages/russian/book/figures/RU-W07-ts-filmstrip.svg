<svg xmlns="http://www.w3.org/2000/svg" width="662" height="354.19" viewBox="0 0 662 354.19" role="img" aria-label="How to write ц: one unbroken stroke · 4 movements"><title>Writing ц</title><desc>4 frames; frame N shows movements 1 to N of ц (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ц demonstration, 09:05–09:10, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 09:05–09:10 lowercase ц demonstration, the pen begins at the upper left, descends the left stem, turns through a rounded baseline join, rises through the right stem, descends that stem, and continues directly into a small lower loop and rising exit without lifting. The demonstrated school hand therefore uses one continuous pen-down run with zero intervening lifts: left stem down, joined diagonal up, right stem down, then the looped tail. The bundled Noto Sans Cyrillic glyph is a printed squared U-like form with two straight verticals joined by a horizontal bottom bar and a short separate-looking right descender, without rounded joins or an exit loop. This learner path preserves the source&apos;s left-stem-to-right-stem-to-tail order and zero-lift evidence while fitting the printed outline: descend the left stem, sweep along the bottom bar, rise and retrace the right stem, cross the tail shoulder, and descend the short tail without lifting. Connected cursive restores the source&apos;s rounded diagonal join, lower tail loop, and rising exit, and individual handwriting may round, narrow, widen, or slant the stems and tail differently.</desc><rect x="0" y="0" width="662" height="354.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="248.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="248.19" viewBox="16 -606 656 1085.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 -140L518 0L86 0L86 536L174 536L174 74L433 74L433 536L521 536L521 73L602 73L602 -140L518 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 536 L130 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 536 L130 280 L130 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="130" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="332.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="344" y="332.6">1. descend the left</tspan><tspan x="344" y="396.8">stem to the baseline</tspan></text></svg><rect x="176" y="42" width="150" height="248.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="248.19" viewBox="16 -606 656 1085.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 -140L518 0L86 0L86 536L174 536L174 74L433 74L433 536L521 536L521 73L602 73L602 -140L518 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 536 L130 280 L130 37 L130 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M130 37 L300 37 L477 37 L477 280 L477 536" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="477" cy="536" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="332.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="344" y="332.6">2. sweep along the base</tspan><tspan x="344" y="396.8">and rise through the</tspan><tspan x="344" y="460.9">right stem</tspan></text></svg><rect x="336" y="42" width="150" height="248.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="248.19" viewBox="16 -606 656 1085.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 -140L518 0L86 0L86 536L174 536L174 74L433 74L433 536L521 536L521 73L602 73L602 -140L518 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 536 L130 280 L130 37 L300 37 L477 37 L477 280 L477 536 L477 536" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M477 536 L477 280 L477 37 L560 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="560" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="332.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="344" y="332.6">3. retrace the right</tspan><tspan x="344" y="396.8">stem and cross the tail</tspan><tspan x="344" y="460.9">shoulder</tspan></text></svg><rect x="496" y="42" width="150" height="248.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="248.19" viewBox="16 -606 656 1085.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M518 -140L518 0L86 0L86 536L174 536L174 74L433 74L433 536L521 536L521 73L602 73L602 -140L518 -140Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M130 536 L130 280 L130 37 L300 37 L477 37 L477 280 L477 536 L477 280 L477 37 L560 37 L560 37" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M560 37 L560 -50 L560 -140" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="560" cy="-140" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="344" y="332.6" text-anchor="middle" font-size="52.6" fill="#6b7280"><tspan x="344" y="332.6">4. descend the short</tspan><tspan x="344" y="396.8">tail below the baseline</tspan></text></svg><text x="16" y="303.19" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase ц demonstration,</text><text x="16" y="315.69" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">09:05–09:10, YouTube, 5 February 2013</text><text x="16" y="328.19" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
