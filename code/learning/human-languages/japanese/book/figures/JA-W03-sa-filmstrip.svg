<svg xmlns="http://www.w3.org/2000/svg" width="662" height="323.48" viewBox="0 0 662 323.48" role="img" aria-label="How to write さ: 3 strokes · 2 pen lifts · 4 movements"><title>Writing さ</title><desc>4 frames; frame N shows movements 1 to N of さ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03055.svg, hiragana さ (U+3055 HIRAGANA LETTER SA), three stroke paths kvg:03055-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03055.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the bar drawn left to right, rising slightly; s2 starts above the bar, slants down to the right through it and hooks back to the left at its foot without lifting; s3 starts at the left, curves down and runs out to the right along the base. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="662" height="323.48" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="217.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.48" viewBox="88 -868 844 1223.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M524 709Q519 725 512.5 746Q506 767 499 787L584 798Q589 769 598 732.5Q607 696 619 658.5Q631 621 643 589Q666 524 701 459.5Q736 395 767 351Q778 337 789 324Q800 311 811 298L770 242Q752 246 722.5 250Q693 254 658.5 257.5Q624 261 590 264Q556 267 529 269L535 336Q563