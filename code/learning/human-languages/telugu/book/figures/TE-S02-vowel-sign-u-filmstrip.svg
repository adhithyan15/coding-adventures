<svg xmlns="http://www.w3.org/2000/svg" width="502" height="363.84" viewBox="0 0 502 363.84" role="img" aria-label="How to write ు: one unbroken stroke · 3 movements"><title>Writing ు</title><desc>3 frames; frame N shows movements 1 to N of ు (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 55 (ు, u sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 405 of the 416 stored prototypes of the u sign (97%) are one pen-down stroke. 403 of the 405 start on the left and 370 end in the top third: from the lower-left tip, down round the bowl and up its right side to the upper tip (328 pass their lowest point on the way). Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="363.84" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="245.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="245.34" viewBox="-161 -570 542 886.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4.5 115Q32 91 61.5 79Q91 67 123 67Q174 67 201 99.5Q228 132 228 193Q228 251 204.5 294.5Q181 338 141.5 369.5Q102 401 52 423L89 500Q151 474 201 430Q251 386 281 328Q311 270 311 199Q311 100 261 44Q211 -12 116 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-71 143" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="120" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="110" y="195.4" text-anchor="middle" font-size="43.4" fill="#6b7280"><tspan x="110" y="195.4">1. start at the</tspan><tspan x="110" y="248.3">lower-left tip and curve</tspan><tspan x="110" y="301.3">down to the right</tspan></text></svg><rect x="176" y="42" width="150" height="245.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="245.34" viewBox="-161 -570 542 886.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4.5 115Q32 91 61.5 79Q91 67 123 67Q174 67 201 99.5Q228 132 228 193Q228 251 204.5 294.5Q181 338 141.5 369.5Q102 401 52 423L89 500Q151 474 201 430Q251 386 281 328Q311 270 311 199Q311 100 261 44Q211 -12 116 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28 L120 28" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 28 L160 35 L200 53 L233 82 L255 119 L266 159 L268 201 L262 243 L250 280" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="250" cy="280" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="110" y="195.4" text-anchor="middle" font-size="43.4" fill="#6b7280"><tspan x="110" y="195.4">2. round the bowl and</tspan><tspan x="110" y="248.3">climb its right side</tspan></text></svg><rect x="336" y="42" width="150" height="245.34" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="245.34" viewBox="-161 -570 542 886.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M116 -12Q49 -12 -1.5 22Q-52 56 -91 111L-51 176Q-23 139 4.5 115Q32 91 61.5 79Q91 67 123 67Q174 67 201 99.5Q228 132 228 193Q228 251 204.5 294.5Q181 338 141.5 369.5Q102 401 52 423L89 500Q151 474 201 430Q251 386 281 328Q311 270 311 199Q311 100 261 44Q211 -12 116 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-71 143 L-46 116 L-19 88 L11 63 L46 44 L84 33 L120 28 L160 35 L200 53 L233 82 L255 119 L266 159 L268 201 L262 243 L250 280 L250 280" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 280 L236 317 L212 355 L181 389 L146 419 L109 443 L72 460" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="72" cy="460" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="110" y="195.4" text-anchor="middle" font-size="43.4" fill="#6b7280"><tspan x="110" y="195.4">3. curve up and to the</tspan><tspan x="110" y="248.3">left, to the upper tip</tspan></text></svg><text x="16" y="300.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="312.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Telugu recognizer, class 55 (ు, u sign): stored online-handwriting prototypes from native</text><text x="16" y="325.34" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">writers (MIT licence, 2012)</text><text x="16" y="337.84" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
