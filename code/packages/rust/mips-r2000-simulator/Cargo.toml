[package]
name = "mips-r2000-simulator"
version = "0.1.0"
edition = "2021"
description = "MIPS R2000 (1985) behavioral simulator -- Rust port of code/packages/python/mips-r2000-simulator (Layer 07q). Full R/I/J instruction formats, HI/LO special registers, big-endian memory, no branch-delay slots (matches the Python original's explicit simplification). Built on the cpu-simulator crate for RegisterFile/Memory, module split mirrors riscv-simulator."

[dependencies]
cpu-simulator = { path = "../cpu-simulator" }
