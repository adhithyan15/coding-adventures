<svg xmlns="http://www.w3.org/2000/svg" width="662" height="375.19" viewBox="0 0 662 375.19" role="img" aria-label="How to write ق: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ق</title><desc>4 frames; frame N shows movements 1 to N of ق (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ق demonstration at 02:14–02:18 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ق body-first: loop counterclockwise around the small closed head, continue down and left through the deep bowl without lifting, then lift for the upper-right dot and lift again for the upper-left dot. Contextual joins shorten the bowl; this isolated learner path fits the vendored Noto Naskh outline and records Persian-scoped provenance rather than borrowing the independently verified Arabic or Urdu ق sources.</desc><rect x="0" y="0" width="662" height="375.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="269.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="269.19" viewBox="-2 -594 668 1198.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M266 -262Q172 -262 120 -212.5Q68 -163 68 -74Q68 -54 69.5 -37Q71 -20 75 1.5Q79 23 87 56L124 47Q113 1 113 -24Q113 -100 153 -139.5Q193 -179 269 -179Q321 -179 376.5 -163Q432 -147 476 -118Q499 -104 516 -87Q533 -70 545 -51Q544 -19 541.5 8.5Q539 36 534 60Q502 30 468.5 15Q435 0 397 0Q340 0 306 35.5Q272 71 272 129Q272 180 292.5 229.5Q313 279 346 310Q379 340 413 3