<svg xmlns="http://www.w3.org/2000/svg" width="502" height="358.38" viewBox="0 0 502 358.38" role="img" aria-label="How to write よ: 2 strokes · 1 pen lift · 3 movements"><title>Writing よ</title><desc>3 frames; frame N shows movements 1 to N of よ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana よ stroke order animation.gif, hiragana よ, 26 frames, 2.6 seconds (Wikimedia Commons, 1 October 2009; corrected first-stroke direction 4 January 2012) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%88_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws よ in two pen-down runs with one lift. Its corrected first stroke moves left to right; the second descends through that bar, turns left, and continues clockwise around the broad lower loop to the rightward finish. The learner path is fitted to the bundled Noto Sans JP subset; handwritten loop width varies, but the two-run order remains the same.</desc><rect x="0" y="0" width="502" height="358.38" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="239.88" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="239.88" viewBox="56 -855 869 1389.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M541 785Q540 775 538.5 757Q537 739 535.5 720Q534 701 534 686Q534 652 534 603Q534 554 534 503Q534 462 536.5 407.5Q539 353 541.5 296Q544 239 546.5 188.5Q549 138 549 106Q549 75 539 47.5Q529 20 507.5 -1Q486 -22 451 -34Q416 -46 366 -46Q297 -46 243 -30Q189 -14 157.5 20.5Q126 55 126 112Q126 157 153 194Q180 231 236 253.5Q292 276 378 276Q452 276 521.5 259Q591 242 652.5 214Q714 186 765.5 151.5Q817 117 855 83L807 7Q770 45 721.5 80