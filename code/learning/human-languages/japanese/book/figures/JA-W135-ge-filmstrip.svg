<svg xmlns="http://www.w3.org/2000/svg" width="982" height="288.49" viewBox="0 0 982 288.49" role="img" aria-label="How to write げ: 5 strokes · 4 pen lifts · 6 movements"><title>Writing げ</title><desc>6 frames; frame N shows movements 1 to N of げ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03052.svg, hiragana げ (U+3052 HIRAGANA LETTER GE), five stroke paths kvg:03052-s1 to s5 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03052.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 to s3 are け&apos;s strokes, the same paths as in its file for け, kanji/03051.svg; s4 and s5 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. Where the print glyph&apos;s left vertical runs on below the point the flick leaves it, the path goes down to the foot of that ink and climbs back a short way before the flick.</desc><rect x="0" y="0" width="982" height="288.49" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="194.99" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="194.99" viewBox="38 -892 1011 1314.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M740 765Q739 752 738 737.5Q737 723 737 706Q736 695 736.5 670Q737 645 737.5 613.5Q738 582 738.5 549.5Q739 517 739 489Q739 461 739 444Q739 358 