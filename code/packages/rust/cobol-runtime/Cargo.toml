[package]
name = "coding-adventures-cobol-runtime"
version = "0.32.0"
edition = "2021"
description = "Runtime (tree-walking interpreter) for COBOL-60 — a faithful PICTURE-typed data model and statement execution, built on the cobol-parser CST. v0.32.0 adds the REVERSE cross-category MOVE: MOVE alphanumeric-item TO numeric-item for an alphanumeric source (PIC X(m)) into an UNSIGNED INTEGER receiver (PIC 9(n), no S, no V). COBOL reads the source's m characters as an unsigned integer and de-scales it into the receiver RIGHT-justified — keeping the low-order n digits (left-zero-padded when the source is shorter, high-order-truncated when longer): receiver = (integer formed from the m source chars) mod 10^n (so X(3)=\"042\" → 9(3) is 42, X(2)=\"05\" → 9(4) is 0005, X(5)=\"12345\" → 9(3) is 345). exec_move folds the source's bytes left-to-right into an i64 (value = value*10 + (byte - '0')) and stores it through move_into (as a scale-0 Decimal), whose move_into_numeric applies exactly that digit-count alignment/truncation. This matches the compiler byte-for-byte, which folds the identical per-character arithmetic and truncates via its numeric-store helper. The rung scopes to an ALL-DIGIT source (a non-digit byte runs the identical (byte - '0') arithmetic — defined-but-unspecified, identical on both engines — so it is untested and needs no reject), and a source wider than 18 characters is a clean later rung (its i64 fold could overflow) rejected identically on both engines. A SIGNED (PIC S9) or SCALED (PIC 9V9) numeric receiver, and a group item on either side, remain clean later rungs (exec_move only handles a genuine alphanumeric source item into an unsigned-integer receiver; every other shape falls through to move_into, which rejects a Src::Chars → numeric MOVE, so the two engines agree on the deferral). v0.31.0 adds the first CROSS-category MOVE: MOVE numeric-item TO alphanumeric-item for an UNSIGNED INTEGER source (PIC 9(n), no S, no V) into a PIC X(m) receiver. The numeric sending item is treated as though it held its digit characters — its n-digit zero-padded magnitude, exactly what DISPLAY shows — then moved by the alphanumeric rules (LEFT-justified, space-padded on the right if wider, truncated on the right if narrower): move_into resolves the source to a Decimal, takes Decimal::digits(), and stores it through the existing move_into_char left-justify/pad path, so PIC 9(3)=042 → X(5) is \"042  \", → X(2) is \"04\", → X(3) is \"042\". This matches the compiler byte-for-byte (which builds the same digit image at run time and runs it through the identical char reshape). The reverse direction (alphanumeric → numeric), a signed (PIC S9) or scaled (PIC 9V9) numeric source into an alphanumeric receiver, and a group item remain clean later rungs (exec_move rejects the signed/scaled numeric→alphanumeric shapes so the two engines agree on the deferral). v0.30.0 adds COMPUTED reference modification IDENT(start:len) where start and/or len are DATA-NAME (run-time integer) operands — WS(J:K), WS(J:), WS(2:K): refmod_string evaluates each index to an i64 (a literal is its own value; a data-name must be an unsigned-integer item, its stored digits parsed), computes start0 = start-1 and end = start0+len (or the item width for an omitted length), and slices [start0, end). An out-of-range computed refmod returns the new RefModOutOfRange trap under the predicate start0 < 0 || end < start0 || end > width — the IDENTICAL bounds check the compiled str_slice enforces in the VM/wasm backends — so an in-range refmod slices byte-identically to the compiler and an out-of-range one errors on both. A signed/fractional/non-numeric index item, reference modification of a numeric item, and use in a numeric/MOVE-source context remain later rungs. v0.29.0 adds INSPECT source CONVERTING from TO to (translate every character of an alphanumeric source through a per-character table built from two equal-length string literals — a character equal to from[k] becomes to[k], the FIRST occurrence winning if from repeats a character, others left unchanged — in place, same width; unequal-length FROM/TO, a data-name/figurative/reference-modified from/to, a BEFORE/AFTER region, and a numeric/group source remain later rungs). v0.28.0 adds the combined INSPECT source TALLYING counter FOR ALL delim REPLACING ALL x BY y (one INSPECT carrying BOTH phrases): per ISO it runs as tally-then-replace — count delim in the ORIGINAL source into the counter FIRST, then replace every x with y — so a shared delimiter/search character (delim == x) is counted before it is substituted; a combined statement whose TALLYING or REPLACING half is itself a deferred sub-form remains a later rung. v0.27.0 adds INSPECT source REPLACING ALL x BY y (replace every occurrence of a single character x — a 1-char literal or PIC X(1) item — with a single character y in an alphanumeric source, in place, via a per-position map; REPLACING CHARACTERS/LEADING/FIRST, BEFORE/AFTER regions, several replace items, and a multi-character/figurative/wider search or replacement or a numeric/group source remain later rungs), on top of v0.26.0's INSPECT source TALLYING counter FOR ALL delim (count the occurrences of a single-character delimiter — a 1-char literal or PIC X(1) item — in an alphanumeric source and ADD them to an unsigned-integer counter; LEADING/CHARACTERS tallies, BEFORE/AFTER phrases, and several counters or FOR phrases remain later rungs)."

[dependencies]
grammar-tools = { path = "../grammar-tools" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
coding-adventures-cobol-parser = { path = "../cobol-parser" }
