<svg xmlns="http://www.w3.org/2000/svg" width="342" height="395.98" viewBox="0 0 342 395.98" role="img" aria-label="How to write ع: one unbroken stroke · 2 movements"><title>Writing ع</title><desc>2 frames; frame N shows movements 1 to N of ع (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ع غ, independent Ayn at 00:03.1–00:04.0 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/%D8%B9-%D8%BA/&gt;. Source note on variation: The page&apos;s directly linked ayn.mov demonstrates independent ع in one continuous pen-down run at 00:03.1–00:04.0. From 00:03.1–00:03.5 the pen begins at the upper-right tip, sweeps left, hooks downward, and shapes the open head. Without lifting, it continues from the head at 00:03.5–00:04.0, descends through the left side of the lower bowl, curves around its floor, and finishes toward the right. The adjacent lesson identifies Ayn as a two-way connector and separately prints its contextual shapes. This one-stroke, zero-lift learner path fits the course&apos;s vendored Noto Naskh outline while keeping its evidence distinct from the adjacent Ghayn demonstration and its upper dot.</desc><rect x="0" y="0" width="342" height="395.98" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="252.48" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="252.48" viewBox="3 -534 696 1171.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M372 -286Q294 -286 236 -259.5Q178 -233 146 -184Q114 -135 114 -70Q114 42 195 129Q164 138 135.5 160Q107 182 90 210Q73 237 73 271Q73 30