[package]
name = "wolfram-to-semantic-ir"
version = "0.1.1"
edition = "2021"
description = "Wolfram CST → narrow-waist Semantic IR (SIR23 symbolic/pattern domain, Stream B). Fifth frontend for the SIR10 narrow-waist IR, first to target SIR23."

[dependencies]
semantic-ir = { path = "../semantic-ir" }
coding-adventures-wolfram-parser = { path = "../wolfram-parser" }
# The reusable canonical head-name constants (`ADD`/`SUB`/`MUL`/…) so the
# surface→canonical bridging table stays typo-proof and in lockstep with
# the native `wolfram-runtime`'s own identical table.
symbolic-ir = { path = "../symbolic-ir" }
# The parser emits a generic `parser::grammar_parser::GrammarASTNode`
# whose leaf tokens are `lexer::token::Token`; we walk both directly.
parser = { path = "../parser" }
lexer = { path = "../lexer" }

[dev-dependencies]
# Used by tests/test_validator.rs (confirms the JS backend now accepts
# every module this frontend produces, all of which use SIR23 nodes) and
# tests/e2e_node.rs (actually runs the compiled JS through `node`).
semantic-ir-to-javascript = { path = "../semantic-ir-to-javascript" }
# tests/oracle.rs's ground truth: the same shared symbolic stack
# (`symbolic-ir` + `symbolic-vm`) this frontend's own CST comes from,
# reached through `wolfram-runtime`'s own `WolframSession`/`eval` (HML01
# §7's oracle/golden testing), mirroring `maple-to-semantic-ir`'s/
# `reduce-to-semantic-ir`'s/`derive-to-semantic-ir`'s identical use of
# their own native runtime crate as ground truth. The other, non-dev
# `[dependencies]` section above still deliberately does NOT depend on
# this crate -- lowering itself only needs the parse-tree shape
# (`coding-adventures-wolfram-parser`), never the evaluator; only this
# test file needs it, for comparison purposes only.
coding-adventures-wolfram-runtime = { path = "../wolfram-runtime" }
