name: coding_adventures_md5_native
description: >
  Native-through-Rust Dart bindings for MD5. Same API as the pure-Dart md5
  package, executed by the Rust coding_adventures_md5 crate through a C ABI via
  dart:ffi. Zero third-party runtime deps beyond package:ffi.
version: 0.1.0
repository: https://github.com/adhithyan15/coding-adventures
publish_to: none

environment:
  sdk: ^3.1.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
