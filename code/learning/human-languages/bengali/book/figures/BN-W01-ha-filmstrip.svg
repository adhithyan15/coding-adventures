<svg xmlns="http://www.w3.org/2000/svg" width="662" height="345.42" viewBox="0 0 662 345.42" role="img" aria-label="How to write হ: 2 strokes · 1 pen lift · 4 movements"><title>Writing হ</title><desc>4 frames; frame N shows movements 1 to N of হ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 42 (হ, ha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 270 of the 320 stored prototypes draw the body in one pen-down stroke. 242 of those 270 start inside the curl, 189 turn clockwise and 242 end at the bottom right, at the end of the tail. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 87 of the 320 draw none at all, 60 open with it, 62 end with it and 111 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 207 of the 218 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="345.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="239.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="239.42" viewBox="-80 -692 694 1107.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M498 -65Q435 -18 382.5 16Q330 50 279.5 75Q229 100 173 119Q117 138 46 154L61 223Q96 213 132.5 208.5Q169 204 207 204Q278 204 316.5 221Q355 238 370 265Q385 292 385 320Q385 373 347.5 401.5Q310 430 245 430L244 430Q246 416 246 401Q246 366 225.5 345.5Q205 325 170 325Q133 325 114.5 347.5Q96 370 96 400Q96 427 111.5 449Q127 471 155 484Q147 507 128 524Q109 541 78 551L-10 551L-10 622L544 622L544 551L198 551Q222 530 232 500Q314 500 365 473Q416 446 440 403.5Q464 361 464 315Q464 248 418 199.5Q372 151 283 140Q344 117 411 78Q478 39 540 -10L498 -65Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 375 L150 375" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M150 375 L160 425 L200 460 L250 468 L320 462 L380 442" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="380" cy="442" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="267" y="260.6" text-anchor="middle" font-size="55.6" fill="#6b7280"><tspan x="267" y="260.6">1. start inside the curl</tspan><tspan x="267" y="328.4">and turn clockwise over</tspan><tspan x="267" y="396.3">the top</tspan></text></svg><rect x="176" y="42" width="150" height="239.42" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="239.42" viewBox="-80 -692 694 1107.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M498 -65Q435 -18 382.5 16Q330 50 279.5 75Q229 100 173 119Q117 138 46 154L61 223Q96 213 132.5 208.5Q1