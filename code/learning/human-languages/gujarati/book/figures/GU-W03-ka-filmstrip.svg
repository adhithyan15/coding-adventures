 529Q235 529 210 509Q185 489 185 454Q185 430 202 407.5Q219 385 259 361L464 438L496 368L331 311Q391 275 422 234.5Q453 194 453 142Q453 105 434.5 70Q416 35 373.5 12.5Q331 -10 259 -10Q181 -10 122 14.5Q63 39 18 73L63 135Q112 97 158.5 80Q205 63 254 63Q315 63 343 84Q371 105 371 144Q371 164 361.5 184.5Q352 205 326 229Q300 253 251 282L65 211Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M370 555 L320 565 L270 565 L220 555 L180 530 L150 495 L145 455 L160 415 L200 380 L250 350 L305 320 L355 285 L395 240 L415 190 L410 140 L385 95 L340 60 L285 40 L230 40 L180 55 L130 80 L75 115" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M65 225 L65 225" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M65 225 L125 250 L190 275 L255 300 L320 330 L385 360 L445 390" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="445" cy="390" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="257" y="199.5" text-anchor="middle" font-size="49.5" fill="#6b7280"><tspan x="257" y="199.5">2. lift, then sweep the</tspan><tspan x="257" y="259.9">diagonal cross-stroke</tspan><tspan x="257" y="320.3">lower-left to</tspan><tspan x="257" y="380.7">upper-right</tspan></text></svg><text x="16" y="314.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after t30apps.com, ‘Gujarati Alphabet Writing</text><text x="16" y="327.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Practice’, version 1.0, ક animation, first and second SVG</text><text x="16" y="339.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">paths</text><text x="16" y="352.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="364.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
