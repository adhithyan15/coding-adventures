<svg xmlns="http://www.w3.org/2000/svg" width="822" height="271.45" viewBox="0 0 822 271.45" role="img" aria-label="How to write ല: one unbroken stroke · 5 movements"><title>Writing ല</title><desc>5 frames; frame N shows movements 1 to N of ല (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for ല in data/LA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/LA.png&gt;. Source note on variation: Thooval&apos;s LA.png starts on the middle bar (green), draws it to the right, climbs and arches back counterclockwise over the top, descends the left side, runs right along the base and climbs the upright to finish at its top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record ല as one stroke from the middle left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 31 unique samples jumps between consecutive points the way a lift would; they most often start at the middle left (28 of 31) and end at the upper right (30 of 31). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms; the descent of the left side passes the bar&apos;s start.</desc><rect x="0" y="0" width="822" height="271.45" fill="#ffffff"/><text x="16" y="31" font-family="Latin Moder