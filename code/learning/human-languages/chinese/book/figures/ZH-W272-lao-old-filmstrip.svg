<svg xmlns="http://www.w3.org/2000/svg" width="982" height="297.42" viewBox="0 0 982 297.42" role="img" aria-label="How to write 老: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 老</title><desc>6 frames; frame N shows movements 1 to N of 老 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 老.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E8%80%81.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 老, in two pieces. Medians 1–4 draw the top: a short horizontal, a vertical down through it, a long horizontal, then a long left-falling stroke from the upper right down through it to the lower left. Medians 5–6 draw the right half of 比 under it: a short left-falling stroke, then a vertical that bends right along the foot and hooks up without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those six ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and five intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="297.42" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="203.92" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.92" 