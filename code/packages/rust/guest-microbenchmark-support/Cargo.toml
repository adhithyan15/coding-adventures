[package]
name = "coding_adventures_guest_microbenchmark_support"
version = "0.1.0"
edition = "2021"
description = "Envelope, CLI, and replay support for guest-runtime microbenchmark drivers"
license = "MIT"
repository = "https://github.com/adhithyan15/coding-adventures"

[dependencies]
coding_adventures_microbenchmark = { package = "coding_adventures_microbenchmark", version = "0.1.0", path = "../microbenchmark" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
