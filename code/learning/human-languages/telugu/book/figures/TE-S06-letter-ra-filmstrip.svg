oded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_ర in version 3.8.05</text><text x="16" y="314.1" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(3805)</text><text x="16" y="326.6" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
