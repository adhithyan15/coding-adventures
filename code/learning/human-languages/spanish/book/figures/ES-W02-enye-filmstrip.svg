, sans-serif" font-size="10" fill="#64748b">Vilar), UCI Machine Learning Repository dataset 177, class ñ: 120 tablet pen traces by 60</text><text x="16" y="340.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">native Spanish writers (CC BY 4.0); the n after the Grundschrift-App, level</text><text x="16" y="352.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">kleinbuchstaben/n (commit f6dbd80)</text><text x="16" y="365.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
