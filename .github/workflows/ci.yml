# ================================================================
# CI — Incremental, parallel monorepo build with conditional toolchains
# ================================================================
#
# Two-job pipeline:
#   1. detect: Fast (~10s) — compiles the Go build tool and runs
#      --detect-languages to determine which toolchains are needed.
#   2. build: Installs only the needed toolchains, then runs the build.
#
# This saves 3-5 minutes on language-specific changes by skipping
# unneeded toolchain installations (e.g., Rust tarpaulin, Elixir/Erlang).
#
# Change detection: git diff against the base branch determines which
# files changed, maps them to packages, then uses the dependency graph
# to find all affected packages (changed + transitive dependents).
#
# Parallelism: independent packages run concurrently via goroutines.
#
# Tiered strategy:
# - Every push: Linux only (fast feedback)
# - PRs to main: Linux + macOS + Windows (thorough validation)

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Detect which languages need toolchains ────────────
  #
  # This job is fast (~10s). It compiles the Go build tool, runs
  # --detect-languages, and outputs boolean flags for each language.
  # The build job reads these flags to conditionally install toolchains.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_python: ${{ steps.toolchains.outputs.needs_python }}
      needs_ruby: ${{ steps.toolchains.outputs.needs_ruby }}
      needs_go: ${{ steps.toolchains.outputs.needs_go }}
      needs_typescript: ${{ steps.toolchains.outputs.needs_typescript }}
      needs_rust: ${{ steps.toolchains.outputs.needs_rust }}
      needs_elixir: ${{ steps.toolchains.outputs.needs_elixir }}
      needs_lua: ${{ steps.toolchains.outputs.needs_lua }}
      needs_perl: ${{ steps.toolchains.outputs.needs_perl }}
      needs_dart: ${{ steps.toolchains.outputs.needs_dart }}
      needs_haskell: ${{ steps.toolchains.outputs.needs_haskell }}
      needs_dotnet: ${{ steps.toolchains.outputs.needs_dotnet }}
      needs_java: ${{ steps.toolchains.outputs.needs_java }}
      needs_kotlin: ${{ steps.toolchains.outputs.needs_kotlin }}
      needs_swift: ${{ steps.toolchains.outputs.needs_swift }}
      needs_cpp: ${{ steps.toolchains.outputs.needs_cpp }}
      diff_base: ${{ steps.diff-base.outputs.base }}
      is_main: ${{ steps.detect-main.outputs.is_main }}
      build_shards: ${{ steps.detect.outputs.build_shards }}
      build_matrix: ${{ steps.build-matrix.outputs.build_matrix }}
      shard_count: ${{ steps.build-matrix.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test parity metadata contracts
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.26.0
          python3 -m unittest discover -s code/scripts/tests -p 'test_package_parity_report.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_schema.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_execution_runner.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_authority.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_backend_loader.py'
          python3 -m unittest discover -s code/scripts/tests -p 'test_build_tool_conformance_linux_oci.py'
          python3 code/scripts/build_tool_conformance.py validate-corpus
          python3 code/scripts/build_tool_conformance_execution.py validate-contract
          python3 code/scripts/package_parity_report.py --format json --fail-on-collisions > /tmp/package-parity-report.json

      - name: Determine diff base
        id: diff-base
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Validate the base ref before using it to prevent script injection.
            # Branch names may only contain alphanumerics, dots, hyphens, underscores,
            # and forward slashes — anything else is rejected.
            if [[ "$PR_BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              BASE="origin/$PR_BASE_REF"
            else
              echo "::error::Unsafe base ref value: $PR_BASE_REF"
              exit 1
            fi
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            BASE="HEAD~1"
          else
            git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
            BASE="origin/main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      - name: Check if main branch
        id: detect-main
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GIT_REF" = "refs/heads/main" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect needed languages and emit build plan
        id: detect
        shell: bash
        run: |
          cd code/programs/go/build-tool
          go build -o ../../../../build-tool .
          cd ../../../..
          force_flag=()
          shard_flags=()
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            force_flag=(-force)
            shard_flags=(-shard-count 5 -emit-shard-matrix)
          fi
          ./build-tool \
            -root . \
            -diff-base "${{ steps.diff-base.outputs.base }}" \
            "${force_flag[@]}" \
            -validate-build-files \
            -detect-languages \
            -emit-plan build-plan.json \
            "${shard_flags[@]}"

      - name: Normalize toolchain requirements
        id: toolchains
        shell: bash
        run: |
          if [ "${{ steps.detect-main.outputs.is_main }}" = "true" ]; then
            echo "Main branch push detected; enabling all supported toolchains for the forced full build"
            printf '%s\n' \
              'needs_python=true' \
              'needs_ruby=true' \
              'needs_go=true' \
              'needs_typescript=true' \
              'needs_rust=true' \
              'needs_elixir=true' \
              'needs_lua=true' \
              'needs_perl=true' \
              'needs_dart=true' \
              'needs_haskell=true' \
              'needs_dotnet=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=true' \
              'needs_kotlin=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              'needs_python=${{ steps.detect.outputs.needs_python }}' \
              'needs_ruby=${{ steps.detect.outputs.needs_ruby }}' \
              'needs_go=${{ steps.detect.outputs.needs_go }}' \
              'needs_typescript=${{ steps.detect.outputs.needs_typescript }}' \
              'needs_rust=${{ steps.detect.outputs.needs_rust }}' \
              'needs_elixir=${{ steps.detect.outputs.needs_elixir }}' \
              'needs_lua=${{ steps.detect.outputs.needs_lua }}' \
              'needs_perl=${{ steps.detect.outputs.needs_perl }}' \
              'needs_dart=${{ steps.detect.outputs.needs_dart }}' \
              'needs_haskell=${{ steps.detect.outputs.needs_haskell }}' \
              'needs_dotnet=${{ steps.detect.outputs.needs_dotnet }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_java=${{ steps.detect.outputs.needs_java }}' \
              'needs_kotlin=${{ steps.detect.outputs.needs_kotlin }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_swift=${{ steps.detect.outputs.needs_swift }}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'needs_cpp=${{ steps.detect.outputs.needs_cpp }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Plan build matrix
        id: build-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_MAIN: ${{ steps.detect-main.outputs.is_main }}
          BUILD_SHARDS: ${{ steps.detect.outputs.build_shards }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          if os.environ["IS_MAIN"] == "true":
            shards = json.loads(os.environ.get("BUILD_SHARDS") or "[]")
            entries = [
              {
                "os": "ubuntu-latest",
                "label": shard["label"],
                "sharded": True,
                "shard_index": shard["shard_index"],
                "package_count": shard.get("package_count", 0),
                "languages": shard.get("languages", []),
              }
              for shard in shards
            ]
            shard_count = len(entries)
          elif os.environ["EVENT_NAME"] == "pull_request":
            entries = [
              {"os": "ubuntu-latest", "label": "ubuntu-latest", "sharded": False, "shard_index": -1},
              {"os": "macos-latest", "label": "macos-latest", "sharded": False, "shard_index": -1},
              {"os": "windows-latest", "label": "windows-latest", "sharded": False, "shard_index": -1},
            ]
            shard_count = 0
          else:
            entries = [
              {"os": "ubuntu-latest", "label": "ubuntu-latest", "sharded": False, "shard_index": -1},
            ]
            shard_count = 0

          print("build_matrix=" + json.dumps(entries, separators=(",", ":")))
          print(f"shard_count={shard_count}")
          PY

      - name: Upload build plan
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 1

  # ── Job 2: Build and test ──────────────────────────────────────
  #
  # Installs only the toolchains flagged by the detect job, then
  # compiles the build tool and runs the incremental build.
  build:
    needs: detect
    name: build (${{ matrix.label }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Language toolchains (conditional) ───────────────────────
      #
      # Go is always installed — the build tool is written in Go.
      # Other toolchains are installed only if their language has
      # affected packages, as determined by the detect job.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        if: needs.detect.outputs.needs_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install uv
        if: needs.detect.outputs.needs_python == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # ── Lua must be set up BEFORE Ruby on Windows ──────────────
      #
      # Ruby's MSYS2 ships its own `link.exe` which shadows the MSVC
      # linker that Lua needs to compile. By installing MSVC + Lua
      # first, the MSVC `link.exe` is in PATH before Ruby's MSYS2.

      # MSVC on Windows serves two consumers: Lua (needs the MSVC linker) and
      # the C/C++ lane (needs `cl.exe` for the MSVC arm of the pure-ISO check).
      # A single msvc-dev-cmd invocation covers both — invoking the action twice
      # would double-prepend the MSVC environment.
      - name: Set up MSVC (Lua linker + C/C++ cl.exe)
        if: (needs.detect.outputs.needs_lua == 'true' || needs.detect.outputs.needs_cpp == 'true') && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Lua
        if: needs.detect.outputs.needs_lua == 'true'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"

      - name: Set up LuaRocks (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        uses: leafo/gh-actions-luarocks@v4

      - name: Set up LuaRocks (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          curl -L -o luarocks.zip https://luarocks.github.io/luarocks/releases/luarocks-3.11.1-windows-64.zip
          powershell -Command "Expand-Archive -Path luarocks.zip -DestinationPath luarocks-install"
          cd luarocks-install\luarocks-3.11.1-windows-64
          echo %CD%>> %GITHUB_PATH%

      - name: Install Lua test tools (Unix)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -L --fail https://luarocks.org/manifests/hoelzro/lua-term-0.8-1.rockspec -o "$tmpdir/lua-term-0.8-1.rockspec"
          sed -i.bak 's|archive/0\.08\.tar\.gz|archive/refs/tags/0.08.tar.gz|' "$tmpdir/lua-term-0.8-1.rockspec"
          luarocks install "$tmpdir/lua-term-0.8-1.rockspec"
          rm -rf "$tmpdir"
          luarocks install busted
          luarocks install luacov
          luarocks install luacheck
          luarocks install luasocket 2>/dev/null || true

      - name: Install Lua test tools (Windows)
        if: needs.detect.outputs.needs_lua == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          luarocks install busted
          luarocks install luacov
          luarocks install luacheck
          for /f "delims=" %%i in ('luarocks path --lr-bin') do echo %%i>> %GITHUB_PATH%

      - name: Set up Ruby
        if: needs.detect.outputs.needs_ruby == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install bundler
        if: needs.detect.outputs.needs_ruby == 'true'
        shell: bash
        run: gem install bundler

      - name: Set up Node.js
        if: needs.detect.outputs.needs_typescript == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── C/C++ compilers (pure-ISO multi-compiler lane) ──────────
      #
      # The goal is that every pure-ISO C/C++ package compiles under GCC, Clang
      # (LLVM), and MSVC across the 3-OS matrix. Each runner contributes the
      # compilers only it can host:
      #   • ubuntu  → GCC (g++/gcc, preinstalled) + Clang (installed below)
      #   • windows → MSVC (cl.exe, via the msvc-dev-cmd step above)
      #   • macOS   → Apple Clang (preinstalled)
      # A real GCC exists only on Linux and real MSVC only on Windows, so no
      # single machine can host all three — coverage is achieved across the
      # matrix, and the ISO harness compiles with every compiler it finds.
      - name: Install Clang alongside GCC (Linux C/C++)
        if: needs.detect.outputs.needs_cpp == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          gcc --version | head -1
          clang --version | head -1

      - name: Set up Rust
        if: needs.detect.outputs.needs_rust == 'true'
        # Uses the `stable` channel (matching the rest of this repo's Rust CI).
        # NOTE on the -clippy gate: clippy adds/tightens lints on each stable
        # release, so a new Rust release can surface new lints on `main` — treat
        # that as normal maintenance (run `cargo clippy --fix` + resolve). Pinning
        # to a specific version was tried but broke BUILDs that invoke
        # `rustup run stable` / `rustup target add` (wasm + embedded firmware),
        # because a version-pinned default toolchain is not the `stable` alias
        # those scripts expect. Reproduce CI's clippy locally with the *current*
        # stable (`rustup update stable`), not a stale cached toolchain.
        uses: dtolnay/rust-toolchain@stable
        with:
          # dtolnay/rust-toolchain installs the minimal profile, which omits
          # clippy; the -clippy gate needs it, so request it explicitly.
          components: clippy

      - name: Install native Paint VM dependencies
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install cargo-tarpaulin
        if: needs.detect.outputs.needs_rust == 'true' && runner.os == 'Linux'
        run: cargo install cargo-tarpaulin

      - name: Set up Elixir
        # Elixir NIF packages skip Windows (BEAM import-library linkage isn't
        # wired up — see each Elixir package's BUILD_windows), and
        # erlef/setup-beam can't map newer Windows runner images (e.g.
        # win25-vs2026), so don't install Elixir on Windows at all.
        if: needs.detect.outputs.needs_elixir == 'true' && runner.os != 'Windows'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.11'
          version-type: strict

      - name: Set up Dart
        if: needs.detect.outputs.needs_dart == 'true'
        uses: dart-lang/setup-dart@v1

      - name: Set up Swift (Windows)
        if: needs.detect.outputs.needs_swift == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --accept-package-agreements --accept-source-agreements --source winget
          $wingetExitCode = $LASTEXITCODE

          if ($wingetExitCode -ne 0) {
            Write-Warning "winget install exited with code $wingetExitCode; checking whether Swift is available anyway"
          }

          $currentPathEntries = @($env:Path -split ';')
          $currentPathSet = @{}
          foreach ($entry in $currentPathEntries) {
            if (-not [string]::IsNullOrWhiteSpace($entry)) {
              $currentPathSet[$entry] = $true
            }
          }

          $registryPathEntries = @(
            [System.Environment]::GetEnvironmentVariable('Path', 'User')
            [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          ) | Where-Object { $_ } | ForEach-Object { $_ -split ';' } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $newPathEntries = @()
          foreach ($entry in $registryPathEntries) {
            if (-not $currentPathSet.ContainsKey($entry)) {
              $currentPathSet[$entry] = $true
              $newPathEntries += $entry
            }
          }

          foreach ($entry in $newPathEntries) {
            $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if ($newPathEntries.Count -gt 0) {
            $env:Path = "$env:Path;$($newPathEntries -join ';')"
          }

          $swiftRoots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift')
            (Join-Path $env:ProgramFiles 'Swift')
          ) | Where-Object { Test-Path $_ }

          $swiftExe = @(
            (Get-Command swift -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
            ($swiftRoots | ForEach-Object {
              Get-ChildItem -Path $_ -Filter swift.exe -Recurse -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            })
          ) | Where-Object { $_ } | Select-Object -First 1

          if (-not $swiftExe) {
            if ($wingetExitCode -ne 0) {
              throw "winget install exited with code $wingetExitCode and swift.exe was not found"
            }
            throw 'swift.exe not found after winget install'
          }

          $toolchainBin = Split-Path -Parent $swiftExe
          if (-not $currentPathSet.ContainsKey($toolchainBin)) {
            $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$env:Path;$toolchainBin"
            $currentPathSet[$toolchainBin] = $true
          }
          Write-Host "Using Swift from $swiftExe"

          $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'User')
          if (-not $sdkRoot) {
            $sdkRoot = [System.Environment]::GetEnvironmentVariable('SDKROOT', 'Machine')
          }
          if (-not $sdkRoot) {
            $sdkRoot = $swiftRoots | ForEach-Object {
            Get-ChildItem -Path $_ -Filter Windows.sdk -Directory -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            } | Where-Object { $_ } | Select-Object -First 1
          }

          if ($sdkRoot) {
            "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:SDKROOT = $sdkRoot
            Write-Host "Using SDKROOT=$sdkRoot"
          }

          where.exe swift

      # ── Java / Kotlin ──────────────────────────────────────────
      #
      # Both Java and Kotlin packages use Gradle and JDK 21.
      # A single JDK + Gradle setup covers both languages since
      # Kotlin/JVM runs on the same JVM.

      - name: Set up JDK 21
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        if: needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Disable long-lived Gradle services on Windows CI
        if: (needs.detect.outputs.needs_java == 'true' || needs.detect.outputs.needs_kotlin == 'true') && runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
          } >> "$GITHUB_ENV"

      - name: Install cpanm and test dependencies (Perl)
        if: needs.detect.outputs.needs_perl == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y cpanminus
            # Pre-install Test2::V0 to the system Perl location (requires sudo).
            # Without sudo, cpanm falls back to ~/perl5 which prove cannot find.
            sudo cpanm --quiet --notest Test2::V0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cpanminus
            cpanm --quiet --notest Test2::V0
          fi

      - name: Set up Haskell
        if: needs.detect.outputs.needs_haskell == 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4'
          cabal-version: '3.10'

      - name: Set up .NET
        if: needs.detect.outputs.needs_dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          # .NET 9 is the current LTS release. No platform exclusions needed —
          # actions/setup-dotnet@v4 works identically on Ubuntu, macOS, and Windows.
          dotnet-version: '9.0.x'

      - name: Install ILAsm (real-CoreCLR assembler for the CLR-real conformance column)
        # The W16 conformance suite's `CLR-real` backend assembles textual `.il`
        # with `ilasm` and runs it on real `dotnet`. `ilasm` ships only in the
        # RID-specific NuGet runtime pack `runtime.<rid>.Microsoft.NETCore.ILAsm`
        # (the bare `Microsoft.NETCore.ILAsm` is ref-only, no binary). A
        # `<PackageDownload>` restore drops the binary into `~/.nuget/packages`,
        # exactly where the test harness's `find_ilasm()` searches — so the CLR
        # column is verified on the *real* runtime, not just the simulator.
        if: needs.detect.outputs.needs_dotnet == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rid=$(dotnet --info | sed -n 's/^[[:space:]]*RID:[[:space:]]*//p' | head -1)
          echo "Host RID: ${rid:-<unknown>}"
          if [ -z "${rid:-}" ]; then
            echo "Could not determine RID; the CLR-real column will skip gracefully."
            exit 0
          fi
          work=$(mktemp -d)
          cat > "$work/ilasm.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="runtime.$rid.Microsoft.NETCore.ILAsm" Version="[9.0.0]" />
            </ItemGroup>
          </Project>
          EOF
          # Non-fatal: if the pack is unavailable for this RID, the conformance
          # CLR-real arm simply returns None (skip), leaving the simulator floor.
          dotnet restore "$work/ilasm.csproj" || echo "ILAsm restore failed; CLR-real column will skip."
          found=$(find "$HOME/.nuget/packages" -iname ilasm -type f 2>/dev/null | head -1 || true)
          echo "ilasm binary: ${found:-<not found>}"

      - name: Install test runners
        shell: bash
        run: |
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            uv pip install --system pytest
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            npm install -g jest
          fi

      # ── Verify toolchains ────────────────────────────────────
      - name: Verify tools
        shell: bash
        run: |
          echo "Go: $(go version)"
          if [ "${{ needs.detect.outputs.needs_python }}" = "true" ]; then
            echo "Python: $(python --version)"
            echo "uv: $(uv --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_ruby }}" = "true" ]; then
            echo "Ruby: $(ruby --version)"
            echo "Bundler: $(bundle --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_typescript }}" = "true" ]; then
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_rust }}" = "true" ]; then
            echo "Rust: $(rustc --version)"
            echo "Cargo: $(cargo --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_swift }}" = "true" ]; then
            echo "Swift: $(swift --version | head -1)"
          fi
          if [ "${{ needs.detect.outputs.needs_elixir }}" = "true" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Elixir: $(elixir --version)"
            echo "Mix: $(mix --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dart }}" = "true" ]; then
            echo "Dart: $(dart --version 2>&1)"
          fi
          if [ "${{ needs.detect.outputs.needs_lua }}" = "true" ]; then
            echo "Lua: $(lua -v)"
            echo "LuaRocks: $(luarocks --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_perl }}" = "true" ] && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Perl: $(perl --version | head -2 | tail -1)"
            echo "cpanm: $(cpanm --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_haskell }}" = "true" ]; then
            echo "GHC: $(ghc --version)"
            echo "Cabal: $(cabal --version)"
          fi
          if [ "${{ needs.detect.outputs.needs_dotnet }}" = "true" ]; then
            echo ".NET: $(dotnet --version)"
          fi

      # ── Download build plan (skip discovery in build job) ─────
      - name: Download build plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan

      # ── Build the build tool ──────────────────────────────────
      - name: Compile build tool
        shell: bash
        run: |
          cd code/programs/go/build-tool
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o ../../../../build-tool.exe .
          else
            go build -o ../../../../build-tool .
          fi

      - name: Reclaim Linux runner disk
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEEDS_KOTLIN: ${{ needs.detect.outputs.needs_kotlin }}
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          # Keep the pre-installed Android SDK when Kotlin (Android) builds are
          # needed — deleting it forces a full re-download later, wasting several
          # minutes and ~5 GB of bandwidth per shard.
          if [ "$NEEDS_KOTLIN" != "true" ]; then
            sudo rm -rf /usr/local/lib/android || true
          fi
          docker system prune --all --force || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # ── Android SDK (Kotlin / Android) ────────────────────────
      #
      # android-actions/setup-android accepts licences, installs platform-tools
      # and build-tools via sdkmanager, and sets ANDROID_HOME / ANDROID_SDK_ROOT.
      # On Linux the pre-installed SDK is reused (we kept it above); on macOS and
      # Windows the action downloads a fresh SDK. Gradle then auto-downloads
      # the specific platform (API 35 / 36) on first build.
      - name: Set up Android SDK
        if: needs.detect.outputs.needs_kotlin == 'true'
        uses: android-actions/setup-android@v3

      - name: Build and test affected Swift packages on Windows
        if: runner.os == 'Windows' && needs.detect.outputs.needs_swift == 'true'
        shell: pwsh
        run: |
          $planFlag = @()
          if (Test-Path 'build-plan.json') {
            Write-Host 'Using pre-computed build plan'
            $planFlag = @('-plan-file', 'build-plan.json')
          }
          $shardFlag = @()
          if ('${{ matrix.sharded }}' -eq 'true') {
            $shardFlag = @('-shard-index', '${{ matrix.shard_index }}')
          }
          & ./build-tool.exe -root . @planFlag @shardFlag -validate-build-files -language swift

      # ── Run the build ─────────────────────────────────────────
      - name: Build and test affected packages
        if: needs.detect.outputs.is_main != 'true' && (runner.os != 'Windows' || (needs.detect.outputs.needs_swift == 'true' && false))
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BT=./build-tool.exe; else BT=./build-tool; fi
          PLAN_FLAG=""
          if [ -f build-plan.json ]; then
            PLAN_FLAG="-plan-file build-plan.json"
            echo "Using pre-computed build plan"
          fi
          $BT \
            -root . \
            $PLAN_FLAG \
            -validate-build-files \
            -clippy \
            -language all

      # ── Force full build on main ──────────────────────────────
      - name: Full build on main merge
        if: needs.detect.outputs.is_main == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BT=./build-tool.exe; else BT=./build-tool; fi
          $BT -root . -plan-file build-plan.json -shard-index "${{ matrix.shard_index }}" -force -validate-build-files -clippy -language all
