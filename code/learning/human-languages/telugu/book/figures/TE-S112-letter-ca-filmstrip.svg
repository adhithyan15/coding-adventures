<svg xmlns="http://www.w3.org/2000/svg" width="822" height="306" viewBox="0 0 822 306" role="img" aria-label="How to write చ: one unbroken stroke · 5 movements"><title>Writing చ</title><desc>5 frames; frame N shows movements 1 to N of చ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, consonant చ packaged tracing guide res/drawable/dot_stroke_c_2_1_cha.png, movements 1–4 (version 2.6) &lt;https://play.google.com/store/apps/details?id=com.sathishshanmugam.writetelugualphabets&gt;. Source note on variation: The packaged tracing guide numbers three directional movements for the connected main body and movement 4 for the upper flourish. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the guide&apos;s order. The bundled Noto Sans Telugu outline joins the flourish to the top of the body, so the run climbs up the flourish&apos;s left arm before cupping through it; that climb is a new segment, so the filmstrip shows one more frame than the guide has movements.</desc><rect x="0" y="0" width="822" height="306" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="200" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200" viewBox="-45 -795 840 1120" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M543 -12Q502 -12 473 -2Q444 