<svg xmlns="http://www.w3.org/2000/svg" width="822" height="303.3" viewBox="0 0 822 303.3" role="img" aria-label="How to write ਮ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ਮ</title><desc>5 frames; frame N shows movements 1 to N of ਮ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਮ (mammaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 952, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L952&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਮ in two pen-down strokes: from the top left along the bar&apos;s left part, down the left side, clockwise round the loop and right along the bar to the stem; then from the top right, left along the bar&apos;s right part and down the stem. In the bundled Noto Sans Gurmukhi outline this letter&apos;s top bar is split, with a gap above the body, and the source draws no separate headline: the first stroke opens along the bar&apos;s left part and the last stroke opens by running right to left along its right part before turning down the stem. The outline and the source agree, so there is no headline stroke to place first or last. The outline prints the loop as a solid tail, so the path loops clockwise inside it. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਮ, each by a different non-native copyist; only counts and shares are cited. 40% (8 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 85% (17 of 20) start in the same part of the letter as the source and 85% (17 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="303.3" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L130 622Q158 552 175 476Q192 400 193 332L426 332L426 622L603 622L603 551L507 551L507 0L426 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L53 584 L85 573 L106 550 L119 517 L129 482 L137 445 L144 408 L149 371 L152 333 L153 295" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="153" cy="295" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">1. start at the top</tspan><tspan x="298" y="273.4">left and curve down</tspan></text></svg><rect x="176" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L130 622Q158 552 175 476Q192 400 193 332L426 332L426 622L603 622L603 551L507 551L507 0L426 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L53 584 L85 573 L106 550 L119 517 L129 482 L137 445 L144 408 L149 371 L152 333 L153 295 L153 295" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="150" cy="296" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">2. loop round the tail</tspan></text></svg><rect x="336" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L130 622Q158 552 175 476Q192 400 193 332L426 332L426 622L603 622L603 551L507 551L507 0L426 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L53 584 L85 573 L106 550 L119 517 L129 482 L137 445 L144 408 L149 371 L152 333 L153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296 L150 296" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M150 296 L188 295 L227 295 L267 295 L307 295 L347 295 L386 295 L426 296 L465 298" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="465" cy="298" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">3. draw the bar to the</tspan><tspan x="298" y="273.4">stem</tspan></text></svg><rect x="496" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L130 622Q158 552 175 476Q192 400 193 332L426 332L426 622L603 622L603 551L507 551L507 0L426 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L53 584 L85 573 L106 550 L119 517 L129 482 L137 445 L144 408 L149 371 L152 333 L153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296 L188 295 L227 295 L267 295 L307 295 L347 295 L386 295 L426 296 L465 298" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M581 586 L581 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M581 586 L545 586 L508 586 L472 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="472" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">4. lift, then run left</tspan><tspan x="298" y="273.4">along the top</tspan></text></svg><rect x="656" y="42" width="150" height="197.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="197.3" viewBox="-77 -692 750 986.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M426 0L426 261L192 261Q188 179 166.5 130Q145 81 105 81Q85 81 71.5 93Q58 105 58 139Q58 161 70 204Q82 247 119 288Q116 353 103 421.5Q90 490 67 551L-7 551L-7 622L130 622Q158 552 175 476Q192 400 193 332L426 332L426 622L603 622L603 551L507 551L507 0L426 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L53 584 L85 573 L106 550 L119 517 L129 482 L137 445 L144 408 L149 371 L152 333 L153 295 L149 256 L142 217 L128 182 L109 155 L92 149 L84 167 L89 200 L103 236 L124 268 L150 296 L188 295 L227 295 L267 295 L307 295 L347 295 L386 295 L426 296 L465 298" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M581 586 L545 586 L508 586 L472 586 L472 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M472 586 L468 549 L465 510 L465 471 L465 431 L465 392 L465 352 L465 313 L465 273 L465 234 L465 194 L465 154 L465 115 L466 76 L468 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="468" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="298" y="200.1" text-anchor="middle" font-size="60.1" fill="#6b7280"><tspan x="298" y="200.1">5. turn down the stem</tspan></text></svg><text x="16" y="252.3" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਮ (mammaa) checkpoints, strokes 1–2</text><text x="16" y="264.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 952, commit de1e560; Apache-2.0)</text><text x="16" y="277.3" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
