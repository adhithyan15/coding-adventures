<svg xmlns="http://www.w3.org/2000/svg" width="982" height="312.65" viewBox="0 0 982 312.65" role="img" aria-label="How to write ழ: one unbroken stroke · 6 movements"><title>Writing ழ</title><desc>6 frames; frame N shows movements 1 to N of ழ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 7, ழ (University of Texas at Austin), p. 193 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Appendix I Frame 7 numbers six movements: 1–3 form the left body and bar, 4–5 the inner upright and broad right bowl, and 6 the lower hook. Native writers draw them as one continuous stroke, and this ductus follows them in order without lifting. The bundled Noto Sans Tamil print face simplifies the source&apos;s looped left body and high bar into a retraced upright with a low crossbar that runs straight into the bowl&apos;s foot, so movement 3 carries on round the foot and up the bowl&apos;s right side, movement 4 comes back left over the top into the inner upright, and movement 5 descends it into the stem below the baseline. The face joins the hook to that stem only at the hook&apos;s far end, so movement 6 runs round the hook to its tip and comes back round it into the short tail. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 97% of the 182 stored prototypes of ழ are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order.</desc><rect x="0" y="0" width="982" height="312.65" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 6 movements</text><rect x="16" y="42" width="150" height="219.15" rx="6" fill="#fdfdfc"