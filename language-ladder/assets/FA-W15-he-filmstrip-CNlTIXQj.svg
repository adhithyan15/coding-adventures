<svg xmlns="http://www.w3.org/2000/svg" width="182" height="380.07" viewBox="0 0 182 380.07" role="img" aria-label="How to write ه: one unbroken stroke · 1 movement"><title>Writing ه</title><desc>1 frames; frame N shows movements 1 to N of ه (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, ه demonstration at 02:47–02:50 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated ه as one simple closed handwritten loop with no pen lift. The vendored Noto Naskh isolated form is wider and has two counters plus a leftward baseline finish, so this learner path preserves the source&apos;s single pen-down run while fitting that typographic outline. Contextual joins use visibly different forms.</desc><rect x="0" y="0" width="182" height="380.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 1 movement</text><rect x="16" y="42" width="150" height="186.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="186.57" viewBox="-53 -503 703 874.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M529 -18Q464 -10 408.5 5.5Q353 21 307 44Q233 0 151 0Q137 0 117 5.5Q97 11 72 22.5Q47 34 17 50L26 84Q47 80 75 78Q103 76 137 76Q163 76 188 79.5Q213 83 238 90Q176 142 176 207Q176 238 187.5 270.5Q199 303 219 329.5Q239 356 264 368L287 433Q370 410 437.5 361.5Q505 313 542 248Q580 183 580 116Q580 68 529 -18ZM312 125Q338 145 350.5 171.5Q363 198 363 231Q363 260 344.5 284.5Q326 309 304 309Q288 309 269.5 296Q251 283 235 260Q227 249 221.5 235.5Q216 222 211 208Q233 183 258.5 