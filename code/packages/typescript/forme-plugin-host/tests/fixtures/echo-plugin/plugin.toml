manifestVersion = 1

[plugin]
name = "@example/echo"
version = "1.0.0"
apiVersion = 1
description = "FM-B014 cross-process contract fixture"

[runtime]
kind = "node"
entry = "./plugin.mjs"

[[capabilities.required]]
realm = "storage"
scope = "read"
reason = "Read one host-mediated fixture path"

[[capabilities.optional]]
realm = "env"
scope = "FIXTURE_SECRET"
reason = "Exercise denial when the grant is absent"

[[contributes.stages]]
id = "echo"
consumes = "ContentNode"
produces = "ContentNode"
configSchema = "./schema.json"

[[contributes.stages]]
id = "stream"
consumes = "Stream<ContentNode>"
produces = "Stream<ContentNode>"

[[contributes.stages]]
id = "reduce"
consumes = "Stream<ContentNode>"
produces = "ContentNode"
