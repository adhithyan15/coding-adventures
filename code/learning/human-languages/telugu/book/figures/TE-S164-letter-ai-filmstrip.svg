<svg xmlns="http://www.w3.org/2000/svg" width="822" height="273.11" viewBox="0 0 822 273.11" role="img" aria-label="How to write ఐ: one unbroken stroke · 5 movements"><title>Writing ఐ</title><desc>5 frames; frame N shows movements 1 to N of ఐ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after Sathish Shanmugam, Write Telugu Alphabets, independent vowel ఐ packaged tracing guide res/drawable/dot_stroke_v_11_ai.png, movements 1–5 (version 2.6) &lt;https://write-telugu-alphabets.en.aptoide.com/app&gt;. Source note on variation: The packaged tracing guide numbers five separately positioned directional movements: movements 1–3 construct the central and lower body before movements 4–5 add the two upper arches from right to left. Those numbers mark movements, not pen lifts: the lift count follows HP Labs India&apos;s isolated handwritten Telugu character data (hpl-telugu-iso-char, https://lipitk.sourceforge.net/datasets/teluguchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Telugu recognizer. Those counts say how many strokes writers use, not where they break, so the single run keeps the guide&apos;s order. In the bundled Noto Sans Telugu outline the compact upper arch is the top of the lower-left loop, so movement 1 starts at the central crossing where the loops meet. Telugu letter direction is not uniform across the script, so this is one attested pedagogical order fitted to the bundled Noto Sans Telugu outline.</desc><rect x="0" y="0" width="822" height="273.11" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="167.11" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="167.11" viewBox="-34 -570 795 885.7" preserveAspectRatio="xMid