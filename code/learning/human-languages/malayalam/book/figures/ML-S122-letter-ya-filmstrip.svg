16" y="206.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxx:</text><text x="16" y="218.95" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">movements 1-4 for യ, written by hand by Thomas Joseph</text><text x="16" y="231.45" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
