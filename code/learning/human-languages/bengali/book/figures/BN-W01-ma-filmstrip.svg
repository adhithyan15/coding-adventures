x="306" y="201.9" text-anchor="middle" font-size="61.9" fill="#6b7280"><tspan x="306" y="201.9">4. climb the stem to</tspan><tspan x="306" y="277.4">the headline</tspan></text></svg><rect x="656" y="42" width="150" height="221.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="656" y="42" width="150" height="221.91" viewBox="-80 -692 772 1142.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M440 0L440 110Q416 158 375 192.5Q334 227 284 241Q274 198 249 177.5Q224 157 188 157Q150 157 124.5 180Q99 203 99 243Q99 284 131 308Q163 332 208 332Q210 332 211 332Q208 401 169.5 444Q131 487 38 494L48 551L-10 551L-10 622L622 622L622 551L517 551L517 0L440 0ZM440 551L115 551Q191 540 237 482.5Q283 425 288 321Q339 306 378 276Q417 246 441 208Q441 222 440.5 236.5Q440 251 440 266L440 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M90 568 L114 529 L152 503 L190 475 L219 438 L238 395 L247 349 L248 303 L222 264 L262 262 L255 215 L222 182 L182 182 L155 212 L155 255 L180 288 L220 300 L262 282 L306 274 L347 254 L384 226 L418 193 L458 171 L476 129 L478 83 L478 36 L478 81 L476 126 L469 171 L478 215 L478 260 L478 305 L478 350 L478 395 L478 441 L478 486 L478 531 L478 576" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M20 586 L20 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M20 586 L161 586 L302 586 L444 586 L585 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="585" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="306" y="201.9" text-anchor="middle" font-size="61.9" fill="#6b7280"><tspan x="306" y="201.9">5. lift, then draw the</tspan><tspan x="306" y="277.4">headline last, from</tspan><tspan x="306" y="352.9">left to right</tspan></text></svg><text x="16" y="276.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 35 (ম, ma; user manual Table 4): stored</text><text x="16" y="289.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">online-handwriting prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="301.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
