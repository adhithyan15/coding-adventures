<svg xmlns="http://www.w3.org/2000/svg" width="502" height="337.83" viewBox="0 0 502 337.83" role="img" aria-label="How to write も: 3 strokes · 2 pen lifts · 3 movements"><title>Writing も</title><desc>3 frames; frame N shows movements 1 to N of も (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana も stroke order animation.gif, hiragana も, 28 frames, 2.8 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%82_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws も in three pen-down runs with two lifts: the descending stem and broad lower bowl, then the upper and lower bars from left to right. The path is fitted to the bundled Noto Sans JP subset; handwritten bar length and bowl curvature vary, but the three-run order remains the same.</desc><rect x="0" y="0" width="502" height="337.83" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="231.83" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="231.83" viewBox="24 -862 916 1415.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M443 786Q438 766 435.5 749.5Q433 733 430 716Q426 688 420.5 646Q415 604 408.5 554Q402 504 395.5 451Q389 398 383.5 348Q378 298 375 257Q372 216 372 189Q372 116 413.5 74Q455 32 540 32Q617 32 672.5 53Q728 74 758.5 112.5Q789 151 789 202Q789 252 762 305.5Q735 359 680 406L768 424Q819 367 844.5 312.5Q870 258 870 193Q870 119 828.5 65Q787 11 713 -17.5Q639 -46 540 -46Q472 -46 416.5 -24.5Q361 -3 328 46Q295 95 295 177Q295 209 299.5 261Q304 313 311.5 374.5Q319 436 327.5 500.5Q336 565 342.5 622Q349 679 352 721Q355 747 355 762.5Q355 778 353 792L443 7