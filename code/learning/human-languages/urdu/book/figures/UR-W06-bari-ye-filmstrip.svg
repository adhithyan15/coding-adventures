<svg xmlns="http://www.w3.org/2000/svg" width="502" height="273.8" viewBox="0 0 502 273.8" role="img" aria-label="How to write ے: one unbroken stroke · 3 movements"><title>Writing ے</title><desc>3 frames; frame N shows movements 1 to N of ے (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Chhoṭī he, do-chashmī he, chhoṭī ye, baṛī ye, and punctuation, independent ے calligraphic and handwriting animations and Baṛī ye instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/chhoti-he-do-chashmi-he-chhoti-ye-bari-ye/&gt;. Source note on variation: Both independent-form animations draw one uninterrupted folded bowl: start at the upper right, descend and sweep left across the upper edge, curl back underneath at the far left, then continue right along the lower fold without lifting. The lesson says independent and final baṛī ye represents e, ai, and y and folds backward underneath the preceding letters. Initial and medial ye instead use the be-series tooth with two dots below and can represent either chhoṭī or baṛī ye. This learner path covers independent baṛī ye and fits the continuous zero-lift motion to the course&apos;s vendored Noto Naskh fallback; Urdu is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="502" height="273.8" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="155.3" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="155.3" viewBox="-2 -384 827 856.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class