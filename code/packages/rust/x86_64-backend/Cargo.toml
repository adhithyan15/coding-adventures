[package]
name = "x86_64-backend"
version = "0.32.0"
edition = "2021"
description = "x86-64 (AMD64) backend for jit-core / aot-core — lowers CIR to native machine code via x86_64-encoder, with both System V (Linux) and Microsoft x64 (Windows) ABIs."

[dependencies]
x86_64-encoder = { path = "../x86_64-encoder" }
jit-core       = { path = "../jit-core" }
vm-core        = { path = "../vm-core" }
# GC precise-roots stack maps (AOT00-T1): compile_function_with_globals_and_stackmap
# emits gc-core `StackMapRecord`s (ref slots + call-return safepoints) for the native
# x86_64 path, mirroring the aarch64 backend.
gc-core        = { path = "../gc-core" }
