<svg xmlns="http://www.w3.org/2000/svg" width="502" height="273.36" viewBox="0 0 502 273.36" role="img" aria-label="How to write പ: one unbroken stroke · 3 movements"><title>Writing പ</title><desc>3 frames; frame N shows movements 1 to N of പ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after SPACE Kerala (Melwin Sunny and Shaiju T), Thooval Malayalam alphabet learning tool, formation arrows for പ in data/PA.png: green start, blue turn, red end (GPL-3.0, 2013) &lt;https://github.com/spacekerala/Thooval/blob/87143b560bf5aab43837d9da2cddab9bd59cd391/data/PA.png&gt;. Source note on variation: Thooval&apos;s PA.png starts at the left foot (green), climbs over the small arch, comes down to the line, runs right along the base and climbs the upright to finish at its top (red). Thooval is a GPL-3.0 teaching tool, so only these facts are cited; no image, path or template point is copied. It asks the learner to keep the pen down to the end of every letter, so its single run is checked against two recorded sources that could have shown a lift. Santhosh Thottingal&apos;s hand reference curves (gitlab.com/santhoshtr/hand, MIT, 2019), which keep several strokes where a glyph has them, record പ as one stroke from the lower left to the upper right. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 37 unique samples jumps between consecutive points the way a lift would; they most often start at the lower left (34 of 37) and end at the upper right (37 of 37). The path is fitted to the bundled Noto Sans Malayalam outline rather than to Thooval&apos;s letterforms.</desc><rect x="0" y="0" width="502" height="273.36" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text>