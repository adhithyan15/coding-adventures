<svg xmlns="http://www.w3.org/2000/svg" width="822" height="277.59" viewBox="0 0 822 277.59" role="img" aria-label="How to write ぷ: 5 strokes · 4 pen lifts · 5 movements"><title>Writing ぷ</title><desc>5 frames; frame N shows movements 1 to N of ぷ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03077.svg, hiragana ぷ (U+3077 HIRAGANA LETTER PU), five stroke paths kvg:03077-s1 to s5 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03077.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 to s4 are ふ&apos;s strokes, the same paths as in its file for ふ, kanji/03075.svg; s5 is the handakuten, one closed ring that starts at its foot and runs clockwise, round the left side, over the top and down the right side back to the foot. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. KanjiVG&apos;s lower-left mark starts at its upper left, dips and then runs up to the right, as in its file for ふ, kanji/03075.svg. The print mark has no dip, so the path starts at the lower end of that mark and runs up to the right. This inventory&apos;s ふ row, which cites Sirgazil&apos;s animation, draws that mark down and to the left; this path follows KanjiVG.</desc><rect x="0" y="0" width="822" height="277.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="171.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="171.59" viewBox="-50 -835 1079 1234.3" prese