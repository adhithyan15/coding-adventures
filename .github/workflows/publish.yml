# ================================================================
# Publish — Release packages to PyPI and RubyGems
# ================================================================
#
# Triggered when a GitHub Release is published. The release tag
# determines which package to publish and in which language.
#
# Tag format: <language>/<package-name>/v<version>
#
# Other products release from this repository under their own tags
# (task-app-v*, engram-v*, ...). Those are not ours: parse-tag only
# runs for python/ and ruby/ tags, and every downstream job needs it,
# so a foreign release skips this workflow instead of failing it.
#
# The tag is attacker-shaped text. Git ref names may contain `$`,
# `(`, `)`, `;`, `|` and `${IFS}`, and anyone who can push a tag can
# publish a release. So the tag never appears inside a `run:` script:
# it reaches the shell only as an environment variable, and it is
# checked against a strict pattern before anything is written to
# $GITHUB_OUTPUT, because those outputs flow into later jobs (one of
# which holds RUBYGEMS_API_KEY). Downstream jobs read pkg_dir through
# env: as well.
#
# Examples:
#   python/coding-adventures-arithmetic/v0.1.0
#   ruby/coding_adventures_clock/v0.1.0
#
# Python packages use Trusted Publishers (OIDC) — no API tokens
# needed. Each package must be registered as a Trusted Publisher
# on pypi.org (Settings > Publishing) with:
#   - Repository: adhithyan15/coding-adventures
#   - Workflow: publish.yml
#
# Ruby gems use a RUBYGEMS_API_KEY secret stored in the repo's
# GitHub Actions secrets.
#
# Native extensions (Rust/PyO3 via maturin) are detected by the
# presence of Cargo.toml in the package directory. When detected,
# wheels are built on Linux, macOS, and Windows across multiple
# Python versions, then uploaded together.
# ================================================================

name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a publish mid-flight

permissions:
  contents: read

jobs:
  # ── Parse the release tag ─────────────────────────────────────
  parse-tag:
    if: >-
      startsWith(github.event.release.tag_name, 'python/') ||
      startsWith(github.event.release.tag_name, 'ruby/')
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.parse.outputs.language }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      pkg_dir: ${{ steps.parse.outputs.pkg_dir }}
      has_native: ${{ steps.parse.outputs.has_native }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History (without file contents) for the main-ancestry check.
          fetch-depth: 0
          filter: blob:none

      # A release can be published for a tag on any commit, including one
      # that never merged. Every publish job below checks out and builds
      # that commit, and building a gem runs its gemspec (Ruby) before the
      # job that holds RUBYGEMS_API_KEY pushes it. So only commits already
      # on main are published.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags --filter=blob:none origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release tag's commit ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Parse release tag
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Expected format: language/package-name/vX.Y.Z, optionally with a
          # pre-release or post-release suffix in semver (v1.2.3-rc.1), PEP 440
          # (v1.2.3rc1, v1.2.3.post1) or RubyGems (v1.2.3.pre) style. The
          # package name is letters, digits, `-` and `_` only, so no `/`, `.`
          # or shell metacharacter can reach PKG_DIR or any output.
          TAG_PATTERN='^(python|ruby)/[A-Za-z0-9_-]+/v[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z]+)*$'
          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::Release tag is not <python|ruby>/<package>/v<semver>; refusing to publish."
            exit 1
          fi

          LANGUAGE=$(echo "$TAG" | cut -d'/' -f1)
          PACKAGE=$(echo "$TAG" | cut -d'/' -f2)
          VERSION=$(echo "$TAG" | cut -d'/' -f3 | sed 's/^v//')

          echo "language=$LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Resolve package directory from tag
          if [ "$LANGUAGE" = "python" ]; then
            # Strip the coding-adventures- prefix to get the directory name
            DIR_NAME="${PACKAGE#coding-adventures-}"
            PKG_DIR="code/packages/python/${DIR_NAME}"
            # Fall back to programs directory if not found in packages
            if [ ! -d "$PKG_DIR" ]; then
              PKG_DIR="code/programs/python/${DIR_NAME}"
            fi
          elif [ "$LANGUAGE" = "ruby" ]; then
            # Strip the coding_adventures_ prefix to get the directory name
            DIR_NAME="${PACKAGE#coding_adventures_}"
            PKG_DIR="code/packages/ruby/${DIR_NAME}"
          else
            echo "::error::Unsupported language: $LANGUAGE"
            exit 1
          fi

          if [ -z "$DIR_NAME" ]; then
            echo "::error::The tag names no package after the language prefix."
            exit 1
          fi
          if [ ! -d "$PKG_DIR" ]; then
            echo "::error::Package directory not found: $PKG_DIR"
            exit 1
          fi
          # A directory alone is not a package: require the build file the
          # publish job will use.
          if [ "$LANGUAGE" = "python" ] && [ ! -f "$PKG_DIR/pyproject.toml" ]; then
            echo "::error::$PKG_DIR has no pyproject.toml"
            exit 1
          fi
          if [ "$LANGUAGE" = "ruby" ] && ! compgen -G "$PKG_DIR/*.gemspec" > /dev/null; then
            echo "::error::$PKG_DIR has no .gemspec"
            exit 1
          fi

          echo "pkg_dir=$PKG_DIR" >> "$GITHUB_OUTPUT"

          # Check for native extensions (Cargo.toml = maturin/PyO3)
          if [ -f "$PKG_DIR/Cargo.toml" ]; then
            echo "has_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_native=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Release Info ==="
          echo "Language: $LANGUAGE"
          echo "Package:  $PACKAGE"
          echo "Version:  $VERSION"
          echo "Dir:      $PKG_DIR"

  # ── Python: Pure package (sdist + wheel, Linux only) ──────────
  publish-python-pure:
    needs: parse-tag
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: python -m build "$PKG_DIR"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: "${{ needs.parse-tag.outputs.pkg_dir }}/dist/"

  # ── Python: Native extension (maturin, OS x Python matrix) ───
  #
  # When a package contains Cargo.toml, it's a Rust/PyO3 native
  # extension. We build platform-specific wheels on all three
  # major OSes and for multiple Python versions, then upload
  # everything to PyPI in one shot.
  # ────────────────────────────────────────────────────────────────
  publish-python-native-build:
    needs: parse-tag
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'true'
    strategy:
      matrix:
        include:
          # Linux — builds manylinux wheels (fastest)
          - os: ubuntu-latest
            target: x86_64
          # macOS — Apple Silicon (arm64)
          - os: macos-latest
            target: aarch64
          # macOS — Intel (x86_64)
          - os: macos-15-intel
            target: x86_64
          # Windows — x86_64
          - os: windows-latest
            target: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist
          working-directory: ${{ needs.parse-tag.outputs.pkg_dir }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ needs.parse-tag.outputs.pkg_dir }}/dist/*.whl

  # Collect all platform wheels + build sdist, then publish
  publish-python-native-upload:
    needs: [parse-tag, publish-python-native-build]
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist (source distribution)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ needs.parse-tag.outputs.pkg_dir }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Copy sdist to dist
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          cp "$PKG_DIR/dist/"*.tar.gz dist/ 2>/dev/null || true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # ── Ruby: Build and publish gem ───────────────────────────────
  publish-ruby:
    needs: parse-tag
    if: needs.parse-tag.outputs.language == 'ruby'
    runs-on: ubuntu-latest
    # Give this environment required reviewers and a `ruby/*` deployment tag
    # rule, and move RUBYGEMS_API_KEY into it (or switch to RubyGems trusted
    # publishing), so the key is only released to an approved run.
    environment: rubygems
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'

      - name: Build gem
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          cd "$PKG_DIR"
          gem build *.gemspec

      - name: Publish to RubyGems
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          # gem push reads the key from the environment, so it is never
          # written to disk or spliced into the script text.
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          cd "$PKG_DIR"
          gem push *.gem
