<svg xmlns="http://www.w3.org/2000/svg" width="342" height="422.64" viewBox="0 0 342 422.64" role="img" aria-label="How to write م: one unbroken stroke · 2 movements"><title>Writing م</title><desc>2 frames; frame N shows movements 1 to N of م (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, م demonstration at 02:33–02:36 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The source shows isolated م as one continuous Naskh stroke: its round head flows into the descending tail with no pen lift. This path fits the vendored Noto Naskh outline.</desc><rect x="0" y="0" width="342" height="422.64" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="279.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="279.14" viewBox="-2 -419 522 971.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M87 -305Q87 -267 84.5 -220Q82 -173 77 -118Q73 -68 70.5 -37Q68 -6 68 5Q68 24 77.5 48Q87 72 100 98Q122 105 144 110Q166 115 189 119Q212 123 237.5 125.5Q263 128 293 129.5Q323 131 358 131L337 162Q306 214 279 240Q252 266 229 266Q205 266 183.5 249Q162 232 136 192L104 208Q130 276 168 312.5Q206 349 248 349Q271 349 292.5 333.5Q314 318 339 284Q371 239 397.5 209.5Q424 180 450 160L412 58Q359 58 315 55.5Q271 53 234 48.5Q197 44 165.5 36.5Q134 29 106 20Q111 -10 116 -39Q121 -68 126 -97Q136 -146 143 -188.5Q150 -231 154 -268Q140 -278 123.5 -287.5Q107 -297 87 -305Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 210 L120 210" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 210 L150 250 L200 300 L245 315 L285 300 L330 260 L365 215 L400 175 L430 150" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="430" cy="150" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="259" y="486.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="259" y="486.8">1. shape the round head</tspan></text></svg><rect x="176" y="42" width="150" height="279.14" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="279.14" viewBox="-2 -419 522 971.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M87 -305Q87 -267 84.5 -220Q82 -173 77 -118Q73 -68 70.5 -37Q68 -6 68 5Q68 24 77.5 48Q87 72 100 98Q122 105 144 110Q166 115 189 119Q212 123 237.5 125.5Q263 128 293 129.5Q323 131 358 131L337 162Q306 214 279 240Q252 266 229 266Q205 266 183.5 249Q162 232 136 192L104 208Q130 276 168 312.5Q206 349 248 349Q271 349 292.5 333.5Q314 318 339 284Q371 239 397.5 209.5Q424 180 450 160L412 58Q359 58 315 55.5Q271 53 234 48.5Q197 44 165.5 36.5Q134 29 106 20Q111 -10 116 -39Q121 -68 126 -97Q136 -146 143 -188.5Q150 -231 154 -268Q140 -278 123.5 -287.5Q107 -297 87 -305Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 210 L150 250 L200 300 L245 315 L285 300 L330 260 L365 215 L400 175 L430 150 L430 150" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M430 150 L390 110 L330 95 L260 80 L180 65 L100 35 L90 -20 L100 -90 L110 -160 L120 -240 L105 -285" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="-285" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="259" y="486.8" text-anchor="middle" font-size="41.8" fill="#6b7280"><tspan x="259" y="486.8">2. continue down the</tspan><tspan x="259" y="537.8">tail without lifting</tspan></text></svg><text x="16" y="334.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="346.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, م demonstration at 02:33–02:36 (Liberal Arts</text><text x="16" y="359.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Instructional Technology Services, Univ. of Texas at</text><text x="16" y="371.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="384.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="396.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
