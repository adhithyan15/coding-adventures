<svg xmlns="http://www.w3.org/2000/svg" width="662" height="296.16" viewBox="0 0 662 296.16" role="img" aria-label="How to write எ: one unbroken stroke · 4 movements"><title>Writing எ</title><desc>4 frames; frame N shows movements 1 to N of எ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 5, எ (University of Texas at Austin), p. 193; reordered, and drawn in one stroke, after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Tamil recognizer, class 6 (எ): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Appendix I Frame 5 numbers seven movements for எ: it starts on the outer left side and draws the right upright last, upward from its foot, after a lift. Native writers draw எ in one stroke and in another order. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 81 of the 88 stored prototypes of எ (92%) are one pen-down stroke. 67 of the 81 (83%) start inside the bowl, all 81 turn it clockwise first, and 79 (98%) then reach the top bar and draw the right upright downward to the end; 61 (75%) end at the bottom right. So this ductus overrides Frame 5&apos;s order and its lift: it starts at the inner end of the curl, goes clockwise round the bowl, up the outer left side and along the top bar, then draws the upright down. The bundled Noto Sans Tamil outline carries the top bar past the upright, so the pen runs to the bar&apos;s right end and comes back along it to the upright. The traces are scaled to a square, so they fix the stroke count, the start, the order and the direction, not the proportions: the path is fitted to the bundled Noto Sans Tamil outline. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Tamil handwriting varies by school.</desc><rect x="0" y="0" width="662" height="296.16" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="165.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="165.16" viewBox="-13 -624 867 954.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -12Q196 -12 152 14Q108 40 82.5 95.5Q57 151 57 239Q57 316 82 373Q107 430 150 468Q182 497 223 516Q264 535 320 544.5Q376 554 451 554L508 554L508 482L439 482Q375 482 332 474.5Q289 467 261.5 454Q234 441 214 423Q176 389 156 341Q136 293 136 232Q136 168 151.5 129Q167 90 193.5 73Q220 56 253 56Q280 56 299.5 67.5Q319 79 329.5 101Q340 123 340 155Q340 205 314 231.5Q288 258 247 258Q207 258 172 237Q137 216 108 184L93 248Q123 283 167.5 305.5Q212 328 261 328Q333 328 377.5 284Q422 240 422 165Q422 110 401 70Q380 30 341.5 9Q303 -12 249 -12ZM528 0L528 482L492 482L494 554L784 554L784 482L614 482L614 0L528 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M109 256 L109 256" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M109 256 L179 275 L249 288 L318 274 L368 221 L381 150 L359 83 L305 34 L234 24 L167 48 L121 104" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="121" cy="104" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="420.5" y="221.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="420.5" y="221.5">1. curl round the inner</tspan><tspan x="420.5" y="306.3">bowl</tspan></text></svg><rect x="176" y="42" width="150" height="165.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="165.16" viewBox="-13 -624 867 954.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -12Q196 -12 152 14Q108 40 82.5 95.5Q57 151 57 239Q57 316 82 373Q107 430 150 468Q182 497 223 516Q264 535 320 544.5Q376 554 451 554L508 554L508 482L439 482Q375 482 332 474.5Q289 467 261.5 454Q234 441 214 423Q176 389 156 341Q136 293 136 232Q136 168 151.5 129Q167 90 193.5 73Q220 56 253 56Q280 56 299.5 67.5Q319 79 329.5 101Q340 123 340 155Q340 205 314 231.5Q288 258 247 258Q207 258 172 237Q137 216 108 184L93 248Q123 283 167.5 305.5Q212 328 261 328Q333 328 377.5 284Q422 240 422 165Q422 110 401 70Q380 30 341.5 9Q303 -12 249 -12ZM528 0L528 482L492 482L494 554L784 554L784 482L614 482L614 0L528 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M109 256 L179 275 L249 288 L318 274 L368 221 L381 150 L359 83 L305 34 L234 24 L167 48 L121 104 L121 104" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M121 104 L102 167 L102 233 L105 299 L122 362 L158 417 L205 464" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="205" cy="464" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="420.5" y="221.5" text-anchor="middle" font-size="69.5" fill="#6b7280"><tspan x="420.5" y="221.5">2. climb the outer left</tspan><tspan x="420.5" y="306.3">side</tspan></text></svg><rect x="336" y="42" width="150" height="165.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="165.16" viewBox="-13 -624 867 954.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -12Q196 -12 152 14Q108 40 82.5 95.5Q57 151 57 239Q57 316 82 373Q107 430 150 46