<svg xmlns="http://www.w3.org/2000/svg" width="822" height="307.73" viewBox="0 0 822 307.73" role="img" aria-label="How to write ど: 4 strokes · 3 pen lifts · 5 movements"><title>Writing ど</title><desc>5 frames; frame N shows movements 1 to N of ど (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03069.svg, hiragana ど (U+3069 HIRAGANA LETTER DO), four stroke paths kvg:03069-s1 to s4 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03069.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 to s2 are と&apos;s strokes, the same paths as in its file for と, kanji/03068.svg; s3 and s4 are the dakuten, the left tick first and then the right one, each drawn down to the right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In KanjiVG and in the print glyph alike, the short stroke ends on the long one, so the two strokes touch.</desc><rect x="0" y="0" width="822" height="307.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 4 strokes · 3 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="201.73" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="201.73" viewBox="105 -885 936 1258.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M760 570Q744 560 725 550Q706 540 684 529Q650 511 604 488Q558 465 506.5 437Q455 409 407 376Q337 331 297.5 281Q258 231 258 174Q258 112 317 75.5Q376 39 495 39Q550 39 609 43.5Q668 48 722.5 56Q777 64 815 73L814 -16Q77