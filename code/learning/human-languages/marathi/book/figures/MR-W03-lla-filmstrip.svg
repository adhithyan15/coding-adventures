th="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="720" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="387" y="177.2" text-anchor="middle" font-size="73.2" fill="#6b7280"><tspan x="387" y="177.2">3. lift, then draw the</tspan><tspan x="387" y="266.5">shirorekha left-to-right</tspan></text></svg><text x="16" y="231.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Hela Nomad, ‘U0933.json’ (Devanagari ळ stroke data), strokes 1–3, Indic</text><text x="16" y="243.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Script Explorer, accessed 24 August 2026</text><text x="16" y="256.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
