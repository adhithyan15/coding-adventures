<!DOCTYPE html>
<!-- AUTO-GENERATED by mosaic-compile --emit-project. Edits will be overwritten on next emit. -->
<!-- Fork the file (remove this banner) to customise. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewCard</title>
</head>
<body>
  <section data-component="ReviewCard" data-mosaic-html-root="ReviewCard">
    <!-- Auto-generated by mosaic-emit-html (pipeline path). Do not edit. -->
    <div data-mosaic-component="ReviewCard">
      <div style="display: flex; flex-direction: column; background: #f8fafc; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 24px">
        <span style="color: #64748b; font-size: 13px; font-weight: 600">{{deckName}}</span>
        <div style="display: flex; flex-direction: column; background: #ffffff; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 18px">
          <span style="color: #9f1239; font-size: 11px; font-weight: 700; padding-bottom: 8px">{{promptLabel}}</span>
          <span style="color: #0f172a; font-size: 24px; font-weight: 600">{{prompt}}</span>
        </div>
        <!-- mosaic-if when="typeAnswerActive" -->
          <div style="background: #f1f5f9; border-width: 1px; border-color: #e2e8f0; border-radius: 8px; padding: 14px">
            <span style="color: #1e40af; font-size: 11px; font-weight: 700; padding-bottom: 8px">{{typeAnswerLabel}}</span>
            <!-- emit "onTypeAnswerChange" dropped: HTML is static -->
            <input type="text" value="{{typeAnswerValue}}" placeholder="{{typeAnswerPlaceholder}}" data-on-change="onTypeAnswerChange" style="background: #ffffff; border-width: 1px; border-color: #cbd5e1; border-radius: 6px; color: #0f172a; font-size: 16px; padding: 10px">
            <!-- mosaic-if when="answerVisible" -->
              <span style="color: #155e75; font-size: 11px; font-weight: 700; padding-top: 10px; padding-bottom: 4px">{{typeAnswerComparisonLabel}}</span>
              <span style="color: #334155; font-size: 14px; font-weight: 500">{{typeAnswerComparisonValue}}</span>
            <!-- /mosaic-if -->
          </div>
        <!-- /mosaic-if -->
        <!-- mosaic-if when="answerVisible" -->
          <div style="background: #dbeafe; border-width: 1px; border-color: #fda4af; border-radius: 8px; padding: 18px">
            <span style="color: #9f1239; font-size: 11px; font-weight: 700; padding-bottom: 8px">{{answerLabel}}</span>
            <span style="color: #0f172a; font-size: 22px; font-weight: 500">{{answer}}</span>
          </div>
          <div style="display: flex; flex-direction: row; padding: 4px">
            <!-- emit "onAgain" dropped: HTML is static -->
            <button data-on-click="onAgain" style="background: #f87171; border-width: 1px; border-color: #991b1b; border-radius: 6px; color: #1a1a2e; font-weight: 700; padding: 8px">Again</button>
            <!-- emit "onHard" dropped: HTML is static -->
            <button data-on-click="onHard" style="background: #fb923c; border-width: 1px; border-color: #9a3412; border-radius: 6px; color: #1a1a2e; font-weight: 700; padding: 8px">Hard</button>
            <!-- emit "onGood" dropped: HTML is static -->
            <button data-on-click="onGood" style="background: #4ade80; border-width: 1px; border-color: #166534; border-radius: 6px; color: #1a1a2e; font-weight: 700; padding: 8px">Good</button>
            <!-- emit "onEasy" dropped: HTML is static -->
            <button data-on-click="onEasy" style="background: #60a5fa; border-width: 1px; border-color: #1d4ed8; border-radius: 6px; color: #1a1a2e; font-weight: 700; padding: 8px">Easy</button>
          </div>
        <!-- mosaic-else -->
          <!-- emit "onReveal" dropped: HTML is static -->
          <button data-on-click="onReveal" style="background: #ffe4e6; border-width: 1px; border-color: #fb7185; border-radius: 6px; color: #9f1239; font-weight: 700; padding: 10px">Reveal answer</button>
        <!-- /mosaic-if -->
        <span style="color: #64748b; font-size: 12px">{{progressLabel}}</span>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
