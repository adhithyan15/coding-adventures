00.3" text-anchor="middle" font-size="60.3" fill="#6b7280"><tspan x="306" y="200.3">4. lift, then draw the</tspan><tspan x="306" y="273.9">shirorekha rightward</tspan></text></svg><text x="16" y="510.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 1: stroke order after Opiaterein, ‘Deva-न-order.gif’, strokes 1–3, Wikimedia Commons, 11 May 2009</text><text x="16" y="523.29" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 2: stroke order after JackPotte, ‘Devanagari m म.gif’, strokes 1–3, Wikimedia Commons, 29 March 2009</text><text x="16" y="535.79" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
