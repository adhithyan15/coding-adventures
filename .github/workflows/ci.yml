name: Kiln record macOS timing diagnostic (never merge)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiln-record-macos-timing-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kiln-record-timing:
    name: Kiln internal record timing diagnostic (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout diagnostic tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9085ce28006719f60a8d1d58f8f5a7e718e216c5
          persist-credentials: false
          fetch-depth: 1

      - name: Initialize bounded diagnostic artifacts and pin source trees
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: 9085ce28006719f60a8d1d58f8f5a7e718e216c5
          EXPECTED_CODE_TREE: af792b0ec1485a50128515e8bed563be24d45b93
          EXPECTED_KILN_TREE: 95d3fd14326455eb8cebab1fe34a56ddb6d9143a
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kiln-record-macos-timing"
          mkdir -p "$out"
          printf 'NOT_RUN\n' > "$out/go-test.exit"
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          actual_code="$(git rev-parse HEAD:code)"
          actual_kiln="$(git rev-parse HEAD:code/programs/go/kiln)"
          {
            printf 'diagnostic_workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'checked_out_source_head=%s\n' "$actual_head"
            printf 'checked_out_source_tree=%s\n' "$actual_tree"
            printf 'expected_source_head=%s\n' "$EXPECTED_SOURCE_HEAD"
            printf 'code_tree=%s\n' "$actual_code"
            printf 'kiln_tree=%s\n' "$actual_kiln"
            printf 'git_version=%s\n' "$(git --version)"
            printf 'python_version=%s\n' "$(python3 --version 2>&1)"
          } > "$out/source-and-host.txt"
          test "$actual_head" = "$EXPECTED_SOURCE_HEAD"
          test "$actual_tree" = "f19c63a4492297015c1c000bfc6a6b0b1c212b68"
          test "$actual_code" = "$EXPECTED_CODE_TREE"
          test "$actual_kiln" = "$EXPECTED_KILN_TREE"
          printf '%s\n' 'source tree checks passed' >> "$out/source-and-host.txt"

      - name: Set up Go 1.26.1
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: 'code/**/go.sum'

      - name: Run the exact Kiln record package test
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kiln-record-macos-timing"
          printf 'go_version=%s\n' "$(go version)" >> "$out/source-and-host.txt"
          cd code/programs/go/kiln
          set +e
          go test -json -cover -count=1 -timeout=15m ./internal/record \
            > "$out/go-test.jsonl" 2> "$out/go-test.stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$out/go-test.exit"
          printf 'go test exit: %s\n' "$status"
          exit "$status"

      - name: Upload raw diagnostic output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kiln-record-macos-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kiln-record-macos-timing/
          if-no-files-found: warn
          retention-days: 7