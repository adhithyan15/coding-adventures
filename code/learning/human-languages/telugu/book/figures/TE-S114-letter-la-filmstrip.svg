erTelugu_ల in</text><text x="16" y="281.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">version 3.8.05 (3805)</text><text x="16" y="293.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="306.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
