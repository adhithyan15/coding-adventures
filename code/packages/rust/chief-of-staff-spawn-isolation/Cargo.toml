[package]
name = "chief-of-staff-spawn-isolation"
version = "0.1.0"
edition = "2021"
description = "Descriptor isolation at the D18 agent spawn site: no inherited descriptors, no terminal, fd 2 to /dev/null"
license = "MIT"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
coding_adventures_sha256 = { path = "../sha256" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[[bin]]
name = "spawn-isolation-probe"
path = "src/bin/spawn_isolation_probe.rs"
test = false

[dev-dependencies]
coding_adventures_sha256 = { path = "../sha256" }
