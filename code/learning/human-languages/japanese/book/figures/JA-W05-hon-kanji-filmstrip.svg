<svg xmlns="http://www.w3.org/2000/svg" width="822" height="293.55" viewBox="0 0 822 293.55" role="img" aria-label="How to write 本: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 本</title><desc>5 frames; frame N shows movements 1 to N of 本 (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/0672c.svg, kanji 本 (U+672C CJK UNIFIED IDEOGRAPH-672C), five stroke paths kvg:0672c-s1 to s5 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/0672c.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the long bar drawn left to right (kvg:type ㇐); s2 is the centre stem drawn top to bottom through it (㇑); s3 starts at the crossing and falls to the lower left (㇒); s4 starts at the crossing and falls to the lower right (㇏); s5 is the short bar across the lower stem, drawn left to right (㇐). Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="293.55" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="187.55" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="187.55" viewBox="-39 -909 1081 1351.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M65 629L937 629L937 553L65 553L65 629ZM264 183L730 183L730 107L264 107L264 183ZM460 839L539 839L539 -80L460 -80L460 839ZM436 604L504 582Q459 476 394 379.5Q329 283 250 205.5Q171 128 85 78Q79 87 69 98.5