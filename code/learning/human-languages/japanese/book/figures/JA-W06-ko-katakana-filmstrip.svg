<svg xmlns="http://www.w3.org/2000/svg" width="502" height="300.44" viewBox="0 0 502 300.44" role="img" aria-label="How to write コ: 2 strokes · 1 pen lift · 3 movements"><title>Writing コ</title><desc>3 frames; frame N shows movements 1 to N of コ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/030b3.svg, katakana コ (U+30B3 KATAKANA LETTER KO), two stroke paths kvg:030b3-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/030b3.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the top bar drawn left to right, which turns down the right side without lifting; s2 is the base bar drawn left to right. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In the print glyph the right side runs on a little below the base bar, and the base bar ends on it.</desc><rect x="0" y="0" width="502" height="300.44" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="194.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="194.44" viewBox="89 -756 830 1075.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M172 686Q197 683 227 681.5Q257 680 281 680L774 680Q792 680 812.5 680.5Q833 681 848 682Q847 665 846 643.5Q845 622 845 604L845 88Q845 61 846.5 32Q848 3 849 -9L759 -9Q760 3 760.5 27.5Q761 52 761 79L761 600L282 600Q254 600 221.5 599Q189 598 172 597L172 686ZM159 134Q178 132 208.5 130Q239 128 270 128L806 128L806 47L272 47Q242 47 210.5 46Q179 45 159 43L159 134Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M211 643 L211 643" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M211 643 L284 643 L357 643 L431 643 L504 643 L577 643 L650 643 L723 643 L795 631" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="795" cy="631" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="215.5" text-anchor="middle" font-size="66.5" fill="#6b7280"><tspan x="504" y="215.5">1. draw the top bar to</tspan><tspan x="504" y="296.6">the right</tspan></text></svg><rect x="176" y="42" width="150" height="194.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="194.44" viewBox="89 -756 830 1075.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M172 686Q197 683 227 681.5Q257 680 281 680L774 680Q792 680 812.5 680.5Q833 681 848 682Q847 665 846 643.5Q845 622 845 604L845 88Q845 61 846.5 32Q848 3 849 -9L759 -9Q760 3 760.5 27.5Q761 52 761 79L761 600L282 600Q254 600 221.5 599Q189 598 172 597L172 686ZM159 134Q178 132 208.5 130Q239 128 270 128L806 128L806 47L272 47Q242 47 210.5 46Q179 45 159 43L159 134Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M211 643 L284 643 L357 643 L431 643 L504 643 L577 643 L650 643 L723 643 L795 631 L795 631" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M795 631 L803 565 L803 498 L803 432 L803 365 L803 298 L803 231 L803 165 L803 98 L803 31" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="803" cy="31" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="215.5" text-anchor="middle" font-size="66.5" fill="#6b7280"><tspan x="504" y="215.5">2. turn down the right</tspan><tspan x="504" y="296.6">side</tspan></text></svg><rect x="336" y="42" width="150" height="194.44" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="194.44" viewBox="89 -756 830 1075.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M172 686Q197 683 227 681.5Q257 680 281 680L774 680Q792 680 812.5 680.5Q833 681 848 682Q847 665 846 643.5Q845 622 845 604L845 88Q845 61 846.5 32Q848 3 849 -9L759 -9Q760 3 760.5 27.5Q761 52 761 79L761 600L282 600Q254 600 221.5 599Q189 598 172 597L172 686ZM159 134Q178 132 208.5 130Q239 128 270 128L806 128L806 47L272 47Q242 47 210.5 46Q179 45 159 43L159 134Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M211 643 L284 643 L357 643 L431 643 L504 643 L577 643 L650 643 L723 643 L795 631 L803 565 L803 498 L803 432 L803 365 L803 298 L803 231 L803 165 L803 98 L803 31" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M199 87 L199 87" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M199 87 L273 87 L347 87 L421 87 L495 87 L569 87 L643 87 L717 87 L791 87" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="791" cy="87" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="504" y="215.5" text-anchor="middle" font-size="66.5" fill="#6b7280"><tspan x="504" y="215.5">3. draw the base bar to</tspan><tspan x="504" y="296.6">the right</tspan></text></svg><text x="16" y="249.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after KanjiVG, kanji/030b3.svg, katakana コ (U+30B3 KATAKANA LETTER KO), two</text><text x="16" y="261.94" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">stroke paths kvg:030b3-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0)</text><text x="16" y="274.44" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
