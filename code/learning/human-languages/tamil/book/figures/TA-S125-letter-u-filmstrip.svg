<svg xmlns="http://www.w3.org/2000/svg" width="502" height="268.96" viewBox="0 0 502 268.96" role="img" aria-label="How to write உ: one unbroken stroke · 3 movements"><title>Writing உ</title><desc>3 frames; frame N shows movements 1 to N of உ (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 16, உ (University of Texas at Austin), p. 196 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Appendix I Frame 16 numbers the upper spiral, descending outer curve, and rightward baseline as three joined movements. Tamil handwriting varies by school; this is one attested continuous order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="502" height="268.96" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="162.96" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="162.96" viewBox="-13 -636 1133 1230.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M298 566Q405 566 472 536.5Q539 507 570.5 457.5Q602 408 602 349Q602 291 581 252.5Q560 214 521 190.5Q482 167 428 154.5Q374 142 309 135L229 127Q174 122 160 115Q146 108 146 95Q146 83 154.5 77.5Q163 72 182 72L1050 72L1050 0L191 0Q144 0 115.5 12.5Q87 25 74.5 46.5Q62 68 62 94Q62 124 78 145Q94 166 130 179Q166 192 226 198L303 205Q394 214 439.5 235.5Q485 257 500.5 287Q516 317 516 349Q516 391 494.5 423Q473 455 431.5 474.5Q390 494 330 496L302 497Q291 497 279.5 497Q268 497 263 497Q209 497 172.5 473Q136 449 136 399Q136 362 157 337Q178 312 222 312Q260 312 282.5 335.5Q305 359 305 402Q305 431 294.5 458.5Q284 486 258 510L318 527Q336 513 350.5 492.5Q365 472 374 447Q383 422 383 392Q383 327 341.5 285.5Q300 244 220 244Q172 244 135.5 263Q99 282 78 317Q57 352 57 398Q57 455 88 492.5Q119 530 173.5 548Q228 566 298 566Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 400 L250 400" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M250 400 L285 430 L320 415 L340 375 L325 330 L285 295 L230 275 L165 290 L115 335 L95 400 L120 465 L180 520 L250 535 L320 520" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="320" cy="520" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="553.5" y="230.8" text-anchor="middle" font-size="90.8" fill="#6b7280"><tspan x="553.5" y="230.8">1. sweep outward around</tspan><tspan x="553.5" y="341.6">the compact upper</tspan><tspan x="553.5" y="452.4">spiral</tspan></text></svg><rect x="176" y="42" width="150" height="162.96" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="162.96" viewBox="-13 -636 1133 1230.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M298 566Q405 566 472 536.5Q539 507 570.5 457.5Q602 408 602 349Q602 291 581 252.5Q560 214 521 190.5Q482 167 428 154.5Q374 142 309 135L229 127Q174 122 160 115Q146 108 146 95Q146 83 154.5 77.5Q163 72 182 72L1050 72L1050 0L191 0Q144 0 115.5 12.5Q87 25 74.5 46.5Q62 68 62 94Q62 124 78 145Q94 166 130 179Q166 192 226 198L303 205Q394 214 439.5 235.5Q485 257 500.5 287Q516 317 516 349Q516 391 494.5 423Q473 455 431.5 474.5Q390 494 330 496L302 497Q291 497 279.5 497Q268 497 263 497Q209 497 172.5 473Q136 449 136 399Q136 362 157 337Q178 312 222 312Q260 312 282.5 335.5Q305 359 305 402Q305 431 294.5 458.5Q284 486 258 510L318 527Q336 513 350.5 492.5Q365 472 374 447Q383 422 383 392Q383 327 341.5 285.5Q300 244 220 244Q172 244 135.5 263Q