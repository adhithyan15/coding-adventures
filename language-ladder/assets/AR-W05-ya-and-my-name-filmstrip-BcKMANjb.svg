<svg xmlns="http://www.w3.org/2000/svg" width="662" height="376.59" viewBox="0 0 662 376.59" role="img" aria-label="How to write ي: 3 strokes · 2 pen lifts · 4 movements"><title>Writing ي</title><desc>4 frames; frame N shows movements 1 to N of ي (arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ي ك ل, independent Yaa at 00:33.2–00:35.0 (University of Oregon Libraries Open Textbook, 2023) &lt;https://opentext.uoregon.edu/introarabic/chapter/alphabet-%d9%82-%d9%84-%d9%85/&gt;. Source note on variation: The page&apos;s directly linked yaa.mov demonstrates independent ي in three pen-down runs. The body begins at the upper right at 00:33.2, descends, turns, and sweeps left through the shallow independent bowl without lifting, finishing at 00:34.4. After one lift, the lower-left dot is placed at 00:34.5–00:34.7. After a second lift, the lower-right dot is placed at 00:34.8–00:35.0. The adjacent lesson identifies Yaa as a two-way connector and separately prints its contextual shapes. This three-stroke, two-lift learner path fits the course&apos;s vendored Noto Naskh outline. Arabic ي is U+064A, so its glyph identity and provenance remain separate from Urdu ی (U+06CC), whose independent body has no lower dots and retains its own source-backed order.</desc><rect x="0" y="0" width="662" height="376.59" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 4 movements</text><rect x="16" y="42" width="150" height="270.59" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="270.59" viewBox="-2 -410 656 1183.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M249 -262Q164 -262 116 -213Q68 -164 68 