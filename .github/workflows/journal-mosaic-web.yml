name: Journal (Mosaic) in the browser

# J5c of #14416: the Journal web host (code/programs/mosaic/journal-app/host/web)
# over the journal-mosaic-app wasm runtime. This checks it on every PR;
# deploy-journal.yml publishes it to /journal/ on merge (J5d).

on:
  pull_request:
    paths:
      - '.github/workflows/journal-mosaic-web.yml'
      - 'code/programs/mosaic/journal-app/**'
      - 'code/packages/mosaic/mosaic-pkg-toolkit/**'
      - 'code/packages/mosaic/mosaic-pkg-draft-editor/**'
      - 'code/packages/rust/journal-core/**'
      - 'code/packages/rust/journal-mosaic-app/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/packages/rust/mosmodel-compiler/**'
      - 'code/packages/rust/moslayout-compiler/**'
      - 'code/packages/rust/mosstyle-compiler/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/journal-mosaic-web.yml'
      - 'code/programs/mosaic/journal-app/**'
      - 'code/packages/mosaic/mosaic-pkg-toolkit/**'
      - 'code/packages/mosaic/mosaic-pkg-draft-editor/**'
      - 'code/packages/rust/journal-core/**'
      - 'code/packages/rust/journal-mosaic-app/**'
      - 'code/packages/rust/mosaic-*/**'
      - 'code/packages/rust/mosmodel-compiler/**'
      - 'code/packages/rust/moslayout-compiler/**'
      - 'code/packages/rust/mosstyle-compiler/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-mosaic-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: code/programs/mosaic/journal-app/host/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux compiler dependencies
        run: bash ../../../../../scripts/ci/apt-install.sh libcairo2-dev
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test the Rust runtime (native)
        run: cargo test --manifest-path ../../../../../packages/rust/Cargo.toml -p journal-mosaic-app
      - name: Build the wasm runtime and drive it through the Mosaic loader
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path ../../../../../packages/rust/Cargo.toml -p journal-mosaic-app --target wasm32-unknown-unknown
          node --test ../../../../../packages/rust/journal-mosaic-app/js/wasm.test.mjs
      - name: Regenerate JournalApp and test the host against the real wasm
        run: npm test
      - name: Check the production build
        run: npm run build
