<svg xmlns="http://www.w3.org/2000/svg" width="822" height="329.24" viewBox="0 0 822 329.24" role="img" aria-label="How to write ছ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ছ</title><desc>5 frames; frame N shows movements 1 to N of ছ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 17 (ছ, chha; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. THE BODY: with any headline run set aside, 156 of the 202 stored prototypes draw the body in one pen-down stroke. 144 of those 156 start at the top left, at the stem under the headline, and 152 end at the bottom right, at the end of the tail. THE HEADLINE (a near-straight, near-horizontal run across at least 40% of the letter&apos;s width at its top): 70 of the 202 draw none at all, 39 open with it, 65 end with it and 28 draw it inside a stroke, so no placement wins a majority. By the convention this inventory adopts where no placement wins a majority, the headline is drawn last, as its own stroke, left to right: the way this track&apos;s own lessons teach it (body first, bar last), since in running text the bar is one line across the whole word, as in Devanagari. 121 of the 122 writers whose headline run has a direction draw it left to right. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="329.24" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-si