<svg xmlns="http://www.w3.org/2000/svg" width="342" height="474.85" viewBox="0 0 342 474.85" role="img" aria-label="How to write ಃ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ಃ</title><desc>2 frames; frame N shows movements 1 to N of ಃ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Gopala Krishna A, Kannada-Alphabet-Aha.gif, repeated animation of Kannada visarga ಃ, 569 frames, 22.76 seconds (Wikimedia Commons, 2 June 2016) &lt;https://commons.wikimedia.org/wiki/File:Kannada-Alphabet-Aha.gif&gt;. Source note on variation: The CC BY-SA 4.0 GIF repeats a complete ಅಃ writing cycle: it writes the ಅ carrier first, then the upper and lower visarga dots as separate closed-loop runs. The standalone U+0C83 learner path excludes that carrier and fits the final two runs, with one intervening lift, to the bundled Noto Sans Kannada outline rather than treating the print outline as handwriting.</desc><rect x="0" y="0" width="342" height="474.85" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="331.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="331.35" viewBox="-37 -570 379 837.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M33 383Q33 433 66 466.5Q99 500 152 500Q207 500 239.5 466.5Q272 433 272 383Q272 334 240 300.5Q208 267 152 267Q98 267 65.5 300.5Q33 334 33 383ZM97 384Q97 361 111 345Q125 329 152 329Q180 329 194 345Q208 361 208 384Q208 407 193.5 422.5Q179 438 152 438Q126 438 111.5 422.5Q97 407 97 384ZM33 105Q33 155 66 188.5Q99 222 152 222Q207 222 239.5 188.5Q272 155 272 105Q272 55 240 21.5Q208 -12 152 -12Q98 -12 65.5 22Q33 56 33 105ZM97 105Q97 82 111 66Q125 50 152 50Q180 50 194 66Q208 82 208 105Q208 128 193.5 144Q179 160 152 160Q126 160 111.5 144Q97 128 97 105Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M153 28 L153 28" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M153 28 L210 48 L235 105 L210 165 L153 195 L92 165 L68 105 L92 48 L153 28" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="153" cy="28" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="152.5" y="182.4" text-anchor="middle" font-size="30.4" fill="#6b7280"><tspan x="152.5" y="182.4">1. draw the upper dot</tspan><tspan x="152.5" y="219.5">as a closed loop</tspan></text></svg><rect x="176" y="42" width="150" height="331.35" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="331.35" viewBox="-37 -570 379 837.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M33 383Q33 433 66 466.5Q99 500 152 500Q207 500 239.5 466.5Q272 433 272 383Q272 334 240 300.5Q208 267 152 267Q98 267 65.5 300.5Q33 334 33 383ZM97 384Q97 361 111 345Q125 329 152 329Q180 329 194 345Q208 361 208 384Q208 407 193.5 422.5Q179 438 152 438Q126 438 111.5 422.5Q97 407 97 384ZM33 105Q33 155 66 188.5Q99 222 152 222Q207 222 239.5 188.5Q272 155 272 105Q272 55 240 21.5Q208 -12 152 -12Q98 -12 65.5 22Q33 56 33 105ZM97 105Q97 82 111 66Q125 50 152 50Q180 50 194 66Q208 82 208 105Q208 128 193.5 144Q179 160 152 160Q126 160 111.5 144Q97 128 97 105Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M153 28 L210 48 L235 105 L210 165 L153 195 L92 165 L68 105 L92 48 L153 28" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M153 290 L153 290" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M153 290 L210 312 L235 382 L210 450 L153 478 L92 450 L68 382 L92 312 L153 290" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="153" cy="290" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="152.5" y="182.4" text-anchor="middle" font-size="30.4" fill="#6b7280"><tspan x="152.5" y="182.4">2. lift, then draw the</tspan><tspan x="152.5" y="219.5">lower dot as a closed</tspan><tspan x="152.5" y="256.6">loop</tspan></text></svg><text x="16" y="386.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Gopala Krishna A,</text><text x="16" y="398.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Kannada-Alphabet-Aha.gif, repeated animation of Kannada</text><text x="16" y="411.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">visarga ಃ, 569 frames, 22.76 seconds (Wikimedia Commons, 2</text><text x="16" y="423.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">June 2016)</text><text x="16" y="436.35" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="448.85" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
