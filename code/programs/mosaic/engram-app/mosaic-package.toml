[package]
name = "engram-app"
version = "0.1.0"
description = "Engram Mosaic app package that assembles reusable components into the product shell"
license = "MIT OR Apache-2.0"

[components]
exports = ["EngramApp"]

[dependencies]
mosaic-pkg-card-browser = "0.1.0"
mosaic-pkg-collection-actions = "0.1.0"
mosaic-pkg-deck-options = "0.1.0"
mosaic-pkg-deck-stats = "0.1.0"
mosaic-pkg-note-editor = "0.1.0"
mosaic-pkg-note-type-editor = "0.1.0"
mosaic-pkg-review-actions = "0.1.0"
mosaic-pkg-review-card = "0.1.0"
mosaic-pkg-review-history = "0.1.0"
mosaic-pkg-session-progress = "0.1.0"

[host_assets]
files = [
  { backend = "html", source = "host/web/engram-host.mjs", target = "engram-host.mjs" },
  { backend = "webcomponent", source = "host/web/engram-host.mjs", target = "engram-host.mjs" },
  { backend = "react", source = "host/web/engram-host.ts", target = "src/engram-host.ts" },
  { backend = "react", source = "host/web/engram-mosaic-host-wasm.d.ts", target = "src/engram-mosaic-host-wasm.d.ts" },
  { backend = "electron", source = "host/electron/host.js", target = "electron/host.js" },
  { backend = "flutter", source = "host/flutter/mosaic_host.dart", target = "lib/mosaic_host.dart" },
  { backend = "xaml", source = "host/xaml/MosaicHost.cs", target = "MosaicHost.cs" },
]

# Dependencies Engram's own host assets need, which the generated projects have
# no reason to declare.
#
# Compose used to need `org.json` here, because the retired `MosaicHost.kt`
# parsed the engine's JSON responses with it. Nothing does any more: the
# generated `MosaicRuntimeHost` uses the kotlinx-serialization the emitter
# already declares, and `EngramEffects.kt` passes plain Kotlin maps. Dropped
# with the Compose migration, and the CI lane's `compileKotlin` is what would
# catch it if some Compose source still imported it.
dependencies = [
  # `mosaic_host.dart` opens the platform file picker for Anki import/export.
  # No generated Dart uses it, so the emitter has no reason to declare it.
  { backend = "flutter", coordinate = "file_selector: '>=1.0.0 <2.0.0'" },
]

# Qt reaches the engine through the STANDARD Mosaic runtime, not through
# `engram-capi`.
#
# The other backends still ship a hand-written `MosaicHost` above, because each
# reimplements the whole application boundary against the bespoke ABI. Qt no
# longer does: props, events, snapshot and restore all go through
# `engram-mosaic-app` and the generated binding, and the only thing left that a
# generated host genuinely cannot do is put a file dialog on screen — which is
# what this handler is.
#
# That is the point of UI47: Anki import and export ride `Effect` now, so the
# 654 lines of Qt binding this replaces are no longer load-bearing.
[host_effects]
files = [
  { backend = "qt", source = "host/qt/engram_effects.h", target = "engram_effects.h" },
  { backend = "qt", source = "host/qt/engram_effects.cpp", target = "engram_effects.cpp" },
  # SwiftPM compiles everything under `Sources/App`, so the target is a path
  # there rather than a bare filename, and no build-list entry is needed --
  # unlike Qt, which names its sources and needs `target_sources`.
  { backend = "swiftui", source = "host/swiftui/EngramEffects.swift", target = "Sources/App/EngramEffects.swift" },
  # Gradle's Kotlin convention compiles everything under `src/main/kotlin`, so
  # the target is a path there and no build-list entry is needed -- the same
  # shape as SwiftUI, unlike Qt.
  { backend = "compose", source = "host/compose/EngramEffects.kt", target = "src/main/kotlin/EngramEffects.kt" },
]
handlers = [
  { backend = "qt", include = "engram_effects.h", install = "installEngramEffects" },
  # No `include`: Swift has no header, and every file in the module is visible.
  { backend = "swiftui", install = "installEngramEffects" },
  # No `include`: Kotlin has no include directive and every file in the module
  # is visible. The emitter refuses one here for exactly that reason.
  { backend = "compose", install = "installEngramEffects" },
]

[kernel]
version = "1"
