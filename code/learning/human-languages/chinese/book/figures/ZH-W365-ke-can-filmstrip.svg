<svg xmlns="http://www.w3.org/2000/svg" width="822" height="305.19" viewBox="0 0 822 305.19" role="img" aria-label="How to write 可: 5 strokes · 4 pen lifts · 5 movements"><title>Writing 可</title><desc>5 frames; frame N shows movements 1 to N of 可 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 可.json, ordered stroke paths and medians 1–5 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%8F%AF.json&gt;. Source note on variation: The cited PRC-order dataset supplies five ordered strokes for 可. Median 1 draws a long horizontal across the top; medians 2–4 a small 口 under it in the order the standalone character uses; median 5 a long vertical down the right side from the horizontal, hooking to the left at its foot without lifting. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those five ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions, the turn, the hook and four intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="822" height="305.19" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 5 strokes · 4 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="199.19" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.19" viewBox="-14 -839 1032 1370.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1