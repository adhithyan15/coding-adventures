[package]
name = "dsp-filters"
version = "0.4.0"
edition = "2021"
description = "DSP03 Phases 1-5: scalar reference FIR (direct convolution) + FIR via FFT (rfft/irfft) + IIR (direct-form-II Transposed) + filter design helpers (windowed-sinc low/high/band-pass with Rectangular/Hamming/Hann/Blackman windows + Butterworth/Chebyshev-I via bilinear transform). Hardened against CWE-400, CWE-190, CWE-674, CWE-20."
license = "MIT"

[dependencies]
dsp-fft = { path = "../dsp-fft" }

[dev-dependencies]
coding_adventures_test_bootstrap = { path = "../test-bootstrap" }
