<svg xmlns="http://www.w3.org/2000/svg" width="502" height="306.68" viewBox="0 0 502 306.68" role="img" aria-label="How to write て: one unbroken stroke · 3 movements"><title>Writing て</title><desc>3 frames; frame N shows movements 1 to N of て (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana て stroke order animation.gif, hiragana て, 28 frames, 2.8 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%81%A6_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws て in one uninterrupted run: carry the high horizontal from left to right, turn back down and left through the diagonal, then round the broad lower curve and sweep right to the finish. The learner path is fitted to the bundled Noto Sans JP subset; handwritten top-bar angle and curve width vary, but the zero-lift order remains the same.</desc><rect x="0" y="0" width="502" height="306.68" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="200.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="200.68" viewBox="15 -798 937 1253.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 664Q114 665 137 666.5Q160 668 174 669Q198 672 243.5 676.5Q289 681 348 686.5Q407 692 475 698Q543 704 612 710Q667 715 716 718.5Q765 722 807 724.5Q849 727 882 728L882 648Q854 649 818 648Q782 647 747 643.5Q712 640 686 632Q633 615 590.5 580.5Q548 546 518 501.5Q488 457 472.5 408.5Q457 360 457 316Q457 257 477 213.5Q497 170 531.5 140Q566 110 610.5 91Q655 72 704 63Q753 54 802 52L773 -31Q718 -29 661.5 -15.5Q605 -2 554 23.5Q503 49 463 88Q423 127 400 179Q377 231 377 298Q377 376 404.5 442.5Q432 509 475 559Q518 609 564 636Q532 632 485 627Q438 622 383.5 616.5Q329 611 275 604Q221 597 173.5 590.5Q126 584 94 577L85 664Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 620 L110 620" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 620 L220 630 L340 642 L470 655 L600 668 L730 680 L845 688" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="845" cy="688" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="483.5" y="246.1" text-anchor="middle" font-size="75.1" fill="#6b7280"><tspan x="483.5" y="246.1">1. draw the high</tspan><tspan x="483.5" y="337.7">horizontal from left to</tspan><tspan x="483.5" y="429.3">right</tspan></text></svg><rect x="176" y="42" width="150" height="200.68" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="200.68" viewBox="15 -798 937 1253.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M85 664Q114 665 137 666.5Q160 668 174 669Q198 672 243.5 676.5Q289 681 348 686.5Q407 692 475 698Q543 704 612 710Q667 715 716 718.5Q765 722 807 724.5Q849 727 882 728L882 648Q854 649 818 648Q782 647 747 643.5Q712 640 686 632Q633 615 590.5 580.5Q548 546 518 501.5Q488 457 472.5 408.5Q457 360 457 316Q457 257 477 213.5Q497 170 531.5 140Q566 110 610.5 91Q655 72 704 63Q753 54 802 52L773 -31Q718 -29 661.5 -15.5Q605 -2 554 23.5Q503 49 463 88Q423 127 400 179Q377 231 377 298Q377 376 404.5 442.5Q432 509 475 559Q518 609 564 636Q532 632 485 627Q438 622 383.5 616.5Q329 611 275 604Q221 597 173.5 590.5Q126 584 94 577L85 664Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 620 L220 630 L340 642 L470 655 L600 668 L730 680 L845 688 L845 688" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pe