ass="ductus__caption" x="-209.5" y="-342.9" text-anchor="middle" font-size="46.1" fill="#6b7280"><tspan x="-209.5" y="-342.9">3. curl down and back</tspan><tspan x="-209.5" y="-286.7">into the small loop</tspan></text></svg><text x="16" y="222.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="235.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil recognizer, class 38 (ீ, ii sign): stored online-handwriting prototypes from native</text><text x="16" y="247.61" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Tamil writers (MIT licence, 2012)</text><text x="16" y="260.11" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
