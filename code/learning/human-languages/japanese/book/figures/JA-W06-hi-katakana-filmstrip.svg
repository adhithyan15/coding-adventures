<svg xmlns="http://www.w3.org/2000/svg" width="502" height="327.52" viewBox="0 0 502 327.52" role="img" aria-label="How to write ヒ: 2 strokes · 1 pen lift · 3 movements"><title>Writing ヒ</title><desc>3 frames; frame N shows movements 1 to N of ヒ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/030d2.svg, katakana ヒ (U+30D2 KATAKANA LETTER HI), two stroke paths kvg:030d2-s1 and s2 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/030d2.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short bar drawn left to right, rising a little; s2 starts at the top of the vertical, runs down, turns at the foot and runs right along the base. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs. In KanjiVG the bar starts a little to the right of the vertical; in the print glyph it starts on the vertical, so the path does too.</desc><rect x="0" y="0" width="502" height="327.52" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="221.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="221.52" viewBox="156 -839 772 1140.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M319 769Q317 752 315 730.5Q313 709 313 688Q313 675 313 636.5Q313 598 313 544.5Q313 491 313 431.5Q313 372 313 317Q313 262 313 220.5Q313 179 313 160Q313 122 330 107.5Q347 93 383 86Q407 82 443 80Q479 78 516 78Q555 78 601.5 80Q648 82 695 86Q742 90 784.5 96Q827 102 858 110L858 19Q815 12 754.5 7.5Q694 3 630 0.5Q566 -2 512 -2Q467 -2 425 0.5Q383 3 351 8Q294 18 263 47.5Q232 77 232 138Q232 162 232 207.5Q232 253 232 311Q232 369 232 429.5Q232 490 232 544Q232 598 232 636.5Q232 675 232 688Q232 702 231 716.5Q230 731 229 745Q228 759 226 769L319 769ZM277 454Q322 464 377.5 479Q433 494 492 512Q551 530 606.5 549.5Q662 569 705 588Q728 598 749.5 609Q771 620 793 634L828 553Q807 545 781.5 534Q756 523 733 514Q687 495 627.5 474.5Q568 454 505 434.5Q442 415 383 398.5Q324 382 277 371L277 454Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M286 422 L286 422" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M286 422 L358 432 L429 452 L499 473 L569 495 L638 519 L706 546 L774 574" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="774" cy="574" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="542" y="203.9" text-anchor="middle" font-size="61.9" fill="#6b7280"><tspan x="542" y="203.9">1. draw the short bar</tspan><tspan x="542" y="279.4">to the right</tspan></text></svg><rect x="176" y="42" width="150" height="221.52" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="221.52" viewBox="156 -839 772 1140.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M319 769Q317 752 315 730.5Q313 709 313 688Q313 675 313 636.5Q313 598 313 544.5Q313 491 313 431.5Q313 372 313 317Q313 262 313 220.5Q313 179 313 160Q313 122 330 107.5Q347 93 383 86Q407 82 443 80Q479 78 516 78Q555 78 601.5 80Q648 82 695 86Q742 90 784.5 96Q827 102 858 110L858 19Q815 12 754.5 7.5Q694 3 630 0.5Q566 -2 512 -2Q467 -2 425 0.5Q383 3 351 8Q294 18 263 47.5Q232 77 232 138Q232 162 232 207.5Q232 253 232 311Q232 369 232 429.5Q232 490 232 544Q232 598 232 636.5Q232 675 232 688Q2