<svg xmlns="http://www.w3.org/2000/svg" width="342" height="332.16" viewBox="0 0 342 332.16" role="img" aria-label="How to write ల: 2 strokes · 1 pen lift · 2 movements"><title>Writing ల</title><desc>2 frames; frame N shows movements 1 to N of ల (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after AppChant, Telugu Alphabets Writing, consonant ల animated path guide encoded by LettersPointsTelugu::getAllPointsArrayForLetterTelugu_ల in version 3.8.05 (3805) &lt;https://play.google.com/store/apps/details?id=com.banuchanderjj.tracer.telugu&gt;. Source note on variation: The packaged auto-trace data gives two ordered starts, paths, and ends. Its ల.png atlas mapping and pictured glyph independently identify U+0C32 ల. The bundled Noto Sans Telugu outline rounds the printed joins differently, so the filmstrip preserves the two attested movement boundaries and directions while fitting their centre lines to that outline. Inspected XAPK SHA-256: 30c6e520a5b469cbe8d17568718bf75796987ea9596f69850eb921db2fe7bd57; libTracer.so SHA-256: 444511c98b69ada4de57900776945837c013da6a4fbfb21833c180d06f9c3ac5.</desc><rect x="0" y="0" width="342" height="332.16" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen</text><text x="16" y="49.75" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">lift · 2 movements</text><rect x="16" y="60.75" width="150" height="169.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="60.75" width="150" height="169.91" viewBox="-35 -570 779 882.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M356 -12Q251 -12 179.5 24Q108 60 71.5 123.5Q35 187 35 269Q35 343 60.5 394.5Q86 446 129 473Q172 500 225 500Q265 500 294.5 484.5Q324 469 340.5 440.5Q357 412 357 373Q357 333 340 301.5Q323 270 288.5 252.5Q254 235 201 235Q168 235 140 246Q112 257 91.5 273Q71 289 58 304L81 366Q89 355 103.5 340.5Q118 326 141 315.5Q164 305 196 305Q237 305 257.5 322Q278 339 278 369Q278 398 262 413.5Q246 429 220 429Q172 429 143 390Q114 351 114 284L114 266Q114 226 128.5 190.5Q143 155 172 127Q201 99 246.5 83Q292 67 353 67Q463 67 527 113Q591 159 591 245Q591 303 558.5 349Q526 395 457 423L497 500Q580 464 627 400Q674 336 674 250Q674 176 641 116.5Q608 57 537.5 22.5Q467 -12 356 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M120 390 L120 390" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M120 390 L110 355 L105 325 L180 290 L215 270 L250 270 L285 290 L310 320 L320 355 L318 390 L300 425 L270 450 L235 465 L195 460 L160 445 L125 425 L100 400 L90 375" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="90" cy="375" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="354.5" y="214.4" text-anchor="middle" font-size="62.4" fill="#6b7280"><tspan x="354.5" y="214.4">1. loop the small upper</tspan><tspan x="354.5" y="290.5">bowl counterclockwise</tspan></text></svg><rect x="176" y="60.75" width="150" height="169.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="60.75" width="150" height="169.91" viewBox="-35 -570 779 882.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M356 -12Q251 -12 179.5 24Q108 60 71.5 123.5Q35 187 35 269Q35 343 60.5 394.5Q86 446 129 473Q172 500 225 500Q265 500 294.5 484.5Q324 469 340.5 440.5Q357 412 357 373Q357 333 340 301.5Q323 270 288.5 252.5Q254 235 201 235Q168 235 140 246Q112 257 91.5 273Q71 289 58 304L81 366Q89 355 103.5 340.5Q118 326 141 315.5Q164 305 196 305Q237 305 257.5 322Q278 339 278 369Q278 398 262 413.5Q246 429 220 429Q172 429 143 390Q114 351 114 284L114 266Q114 226 128.