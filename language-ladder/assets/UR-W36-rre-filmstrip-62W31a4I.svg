 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204ZM221 397Q154 397 99 429L105 454Q114 452 125.5 450Q137 448 151 446L169 466Q159 500 152 525.5Q145 551 145 561Q145 575 156 584Q167 593 186 594Q189 583 192 574.5Q195 566 197 560L189 554L192 489Q209 503 224.5 514.5Q240 526 254 526Q268 526 283.5 516.5Q299 507 310 494Q321 481 321 471Q321 450 307.5 433Q294 416 271.5 406.5Q249 397 221 397ZM223 441Q246 441 263 445.5Q280 450 299 457Q283 471 271 475Q259 479 248 479Q234 479 216 470Q198 461 177 443L223 441Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M250 320 L248 280 L255 235 L270 190 L287 145 L300 95 L304 48 L304 48" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M304 48 L298 8 L284 -30 L260 -68 L226 -103 L185 -130 L140 -146 L95 -151 L52 -147 L10 -136" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="10" cy="-136" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="157.5" y="383.7" text-anchor="middle" font-size="39.7" fill="#6b7280"><tspan x="157.5" y="383.7">2. continue curving to</tspan><tspan x="157.5" y="432.1">the left</tspan></text></svg><rect x="336" y="42" width="150" height="380.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="380.39" viewBox="-90 -664 495 1255.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M111 -204Q95 -204 70.5 -195Q46 -186 21 -173Q-4 -160 -20 -148L-7 -115Q21 -120 44.5 -123Q68 -126 88 -126Q163 -126 216.5 -81Q270 -36 298 49Q291 65 283.5 80.5Q276 96 267 112Q233 173 217 209.5Q201 246 201 271Q201 297 216 312.5Q231 328 259 341Q263 325 271 302Q279 279 288 255.5Q297 232 304 212Q317 177 326 143Q335 109 335 81Q335 3 305.5 -63.5Q276 -130 225 -167Q173 -204 111 -204ZM22