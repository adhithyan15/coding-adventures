<svg xmlns="http://www.w3.org/2000/svg" width="502" height="283.87" viewBox="0 0 502 283.87" role="img" aria-label="How to write ु: one unbroken stroke · 3 movements"><title>Writing ु</title><desc>3 frames; frame N shows movements 1 to N of ु (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Devanagari recognizer, class 50 (ु, u sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 79 of the 83 stored prototypes of the u sign (95%) are one pen-down stroke. In 67 of the 83 the pen starts in the top third of the sign, in 65 it turns clockwise, and in 65 it ends to the left of where it began (57 do all three): the pen swings right from the top, rounds the bowl and leaves to the left. The printed sign starts its upper arm partway down, so the path starts at the arm&apos;s tip. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant or the headline; the book draws the sign alone and composes no Devanagari word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Devanagari outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="283.87" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="165.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="165.37" viewBox="-526 -81 612 674.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-220 -268 -270.5 -249.5Q-321 -231 -366.5 -195.5Q-412 -160 -456 -110L-397 -57Q-357 -105 -320.5 -136Q-284 -167 -246 -181.5Q-208 -196 -165 -196Q-112 -196 -85.5 -176.5Q-59 -157 -59 -122Q-59 -93 -76 -75Q-93 -57 -128 -57Q-156 -57 -181 -69Q-206 -81 -229 -103L-274 -48Q-245 -19 -210 -4Q-175 11 -127 11Q-58 11 -21 -28.5Q16 -68 16 -129Q16 -194 -30 -231Q-76 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-250 -78 L-250 -78" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-250 -78 L-215 -45 L-170 -25 L-125 -23 L-75 -35 L-35 -70" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-35" cy="-70" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-220" y="457" text-anchor="middle" font-size="49" fill="#6b7280"><tspan x="-220" y="457">1. start at the upper</tspan><tspan x="-220" y="516.8">arm&apos;s tip and swing to</tspan><tspan x="-220" y="576.6">the right</tspan></text></svg><rect x="176" y="42" width="150" height="165.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="165.37" viewBox="-526 -81 612 674.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-220 -268 -270.5 -249.5Q-321 -231 -366.5 -195.5Q-412 -160 -456 -110L-397 -57Q-357 -105 -320.5 -136Q-284 -167 -246 -181.5Q-208 -196 -165 -196Q-112 -196 -85.5 -176.5Q-59 -157 -59 -122Q-59 -93 -76 -75Q-93 -57 -128 -57Q-156 -57 -181 -69Q-206 -81 -229 -103L-274 -48Q-245 -19 -210 -4Q-175 11 -127 11Q-58 11 -21 -28.5Q16 -68 16 -129Q16 -194 -30 -231Q-76 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-250 -78 L-215 -45 L-170 -25 L-125 -23 L-75 -35 L-35 -70 L-35 -70" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-35 -70 L-22 -125 L-35 -180 L-80 -220 L-163 -232 L-163 -232" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-163" cy="-232" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-220" y="457" text-anchor="middle" font-size="49" fill="#6b7280"><tspan x="-220" y="457">2. round the bowl and</tspan><tspan x="-220" y="516.8">back to the left</tspan></text></svg><rect x="336" y="42" width="150" height="165.37" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="165.37" viewBox="-526 -81 612 674.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-220 -268 -270.5 -249.5Q-321 -231 -366.5 -195.5Q-412 -160 -456 -110L-397 -57Q-357 -105 -320.5 -136Q-284 -167 -246 -181.5Q-208 -196 -165 -196Q-112 -196 -85.5 -176.5Q-59 -157 -59 -122Q-59 -93 -76 -75Q-93 -57 -128 -57Q-156 -57 -181 -69Q-206 -81 -229 -103L-274 -48Q-245 -19 -210 -4Q-175 11 -127 11Q-58 11 -21 -28.5Q16 -68 16 -129Q16 -194 -30 -231Q-76 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-250 -78 L-215 -45 L-170 -25 L-125 -23 L-75 -35 L-35 -70 L-22 -125 L-35 -180 L-80 -220 L-163 -232 L-163 -232" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-163 -232 L-240 -220 L-310 -185 L-370 -135 L-420 -88" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-420" cy="-88" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-220" y="457" text-anchor="middle" font-size="49" fill="#6b7280"><tspan x="-220" y="457">3. sweep out to the</tspan><tspan x="-220" y="516.8">lower-left tip</tspan></text></svg><text x="16" y="220.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="232.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Devanagari recognizer, class 50 (ु, u sign): stored online-handwriting prototypes from</text><text x="16" y="245.37" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">native writers (MIT licence, 2012)</text><text x="16" y="257.87" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
