<svg xmlns="http://www.w3.org/2000/svg" width="662" height="270.27" viewBox="0 0 662 270.27" role="img" aria-label="How to write ധ: one unbroken stroke · 4 movements"><title>Writing ധ</title><desc>4 frames; frame N shows movements 1 to N of ധ (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxviii: movements 1-4 for ധ, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-038.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxviii) starts at the top left and runs down round the left bowl (1), climbs the middle stem (2), runs back down it (3) and rounds the right bowl to finish at the top right (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker, but none of the 34 unique samples jumps between consecutive points the way a lift would; they most often start at the upper left (32 of 34) and end at the upper right (34 of 34). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its DHA.png at the upper left and ends it at the upper right. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing; the run back down the stem retraces the ink just drawn.</desc><rect x="0" y="0" width="662" height="270.27" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="151.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="151.77" viewBox="-31 -632 973 984.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M623 -12Q577 -12 544 1.5Q511 15 488.5 38Q466 61 449 89L462 88Q431 36 388.5 12Q346 -12 281 -12Q204 -12 150 24.5Q96 61 67.5 123.5Q39 186 39 262Q39 328 57 381Q75 434 109.5 478.5Q144 523 194 562L248 501Q213 476 185.5 442.5Q158 409 142.5 365Q127 321 127 262Q127 205 146 159Q165 113 200 86.5Q235 60 282 60Q323 60 349.5 75Q376 90 392 118Q405 141 409 172.5Q413 204 413 263L413 554L499 554L499 263Q499 206 503.5 173.5Q508 141 521 118Q538 89 564 74.5Q590 60 627 60Q673 60 708.5 86.5Q744 113 764 158.5Q784 204 784 262Q784 323 768 367.5Q752 412 724.5 444.5Q697 477 664 499L722 562Q765 528 799 486Q833 444 852.5 389.5Q872 335 872 262Q872 182 841.5 120Q811 58 755.5 23Q700 -12 623 -12Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M191 508 L191 508" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M191 508 L146 458 L112 399 L91 335 L87 268 L88 200 L110 136 L151 84 L204 41 L269 28 L337 31 L393 66 L439 116" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="439" cy="116" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="455.5" y="230" text-anchor="middle" font-size="78" fill="#6b7280"><tspan x="455.5" y="230">1. curve down round the</tspan><tspan x="455.5" y="325.2">left bowl</tspan></text></svg><rect x="176" y="42" width="150" height="151.77" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" 