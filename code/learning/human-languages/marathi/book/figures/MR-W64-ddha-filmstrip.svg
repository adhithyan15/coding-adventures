<svg xmlns="http://www.w3.org/2000/svg" width="342" height="338.14" viewBox="0 0 342 338.14" role="img" aria-label="How to write ढ: 2 strokes · 1 pen lift · 2 movements"><title>Writing ढ</title><desc>2 frames; frame N shows movements 1 to N of ढ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ढ-order.gif’, strokes 1–2, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A2-order.gif&gt;. Source note on variation: The 22-frame animation shows two ordered pen-down runs over its gray guide: frames 2–16 start at the right stem&apos;s headline junction, descend top-to-bottom, turn left through the upper shoulder, sweep counterclockwise around the broad outer bowl, and continue counterclockwise around the closed inner loop without lifting; frames 17–20 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for one intervening lift. The 250 ms hold at frame 16 marks the body-run ending before the one-second completed frame 21; the 120–220 ms pauses at frames 3, 7–8, and 12–15 occur within the continuous body and do not add lifts. This learner path follows that sourced two-run order and fits its bowl and loop to Noto Sans Devanagari; everyday handwriting may narrow or simplify the curves differently.</desc><rect x="0" y="0" width="342" height="338.14" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 2 movements</text><rect x="16" y="42" width="150" height="219.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="219.64" viewBox="-70 -692 717 1049.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M307 0Q230 0 171 28Q112 56 79 108Q46 160 46 232Q46 338 115 394.5Q184 451 324 451L375 451L360 420L360 551L0 551L0 622L577 622L577 551L440 551L440 381L340 381Q240 381 183 346.5Q126 312 126 228Q126 163 164.5 121.5Q203 80 276 69Q284 68 298 68.5Q312 69 320 69Q377 69 412.5 92Q448 115 448 156Q448 185 431.5 202Q415 219 383 219Q349 219 330 200Q311 181 311 146Q311 118 322 91.5Q333 65 355 36L287 29Q263 62 251 93Q239 124 239 157Q239 216 276.5 251Q314 286 384 286Q432 286 462.5 268Q493 250 508 220Q523 190 523 155Q523 86 465.5 43Q408 0 307 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M415 551 L415 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M415 551 L415 500 L415 450 L415 400 L370 400 L325 400 L280 400 L235 395 L190 380 L150 358 L118 330 L95 295 L80 255 L75 210 L82 165 L100 125 L130 90 L170 62 L215 40 L265 27 L315 22 L365 25 L410 38 L450 62 L478 95 L490 135 L488 175 L475 212 L450 242 L418 260 L380 268 L342 262 L310 245 L285 218 L270 185 L264 148 L268 112 L280 78 L300 50" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="300" cy="50" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="288.5" y="197.5">1. descend the stem and</tspan><tspan x="288.5" y="267.7">sweep through the outer</tspan><tspan x="288.5" y="337.8">bowl and inner loop</tspan></text></svg><rect x="176" y="42" width="150" height="219.64" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="219.64" viewBox="-70 -692 717 1049.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M307 0Q230 0 171 28Q112 56 79 108Q46 160 46 232Q46 338 115 394.5Q184 451 324 451L375 451L360 420L360 551L0 551L0 622L577 622L577 551L440 551L440 381L340 381Q240 381 183 346.5Q126 312 126 228Q126 163 164.5 121.5Q203 80 276 69Q284 68 298 68.5Q312 69 320 69Q377 69 412.5 92Q448 115 448 156Q448 185 431.5 202Q415 219 383 219Q349 219 330 200Q311 181 311 146Q311 118 322 91.5Q333 65 355 36L287 29Q263 62 251 93Q239 124 239 157Q239 216 276.5 251Q314 286 384 286Q432 286 462.5 268Q493 250 508 220Q523 190 523 155Q523 86 465.5 43Q408 0 307 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M415 551 L415 500 L415 450 L415 400 L370 400 L325 400 L280 400 L235 395 L190 380 L150 358 L118 330 L95 295 L80 255 L75 210 L82 165 L100 125 L130 90 L170 62 L215 40 L265 27 L315 22 L365 25 L410 38 L450 62 L478 95 L490 135 L488 175 L475 212 L450 242 L418 260 L380 268 L342 262 L310 245 L285 218 L270 185 L264 148 L268 112 L280 78 L300 50" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L75 585 L145 585 L215 585 L285 585 L355 585 L425 585 L500 585 L555 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="555" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="288.5" y="197.5">2. lift, then draw the</tspan><tspan x="288.5" y="267.7">shirorekha</tspan><tspan x="288.5" y="337.8">left-to-right</tspan></text></svg><text x="16" y="274.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ढ-order.gif’, strokes</text><text x="16" y="287.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">1–2, Wikimedia Commons, 10 May 2009</text><text x="16" y="299.64" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="312.14" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
