[workspace]

[package]
name = "mini-sqlite-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the Rust mini-sqlite Level 0 facade"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coding-adventures-mini-sqlite = { path = "../../rust/mini-sqlite" }
wasm-bindgen = "0.2"
serde_json = "1"
