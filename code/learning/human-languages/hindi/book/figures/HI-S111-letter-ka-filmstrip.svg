Q267 118 233 118Q182 118 139.5 137.5Q97 157 71.5 195.5Q46 234 46 291Q46 373 100.5 418.5Q155 464 252 464Q278 464 300.5 461.5Q323 459 342 454L335 381Q318 386 297.5 388.5Q277 391 254 391Q193 391 160 364.5Q127 338 127 288Q127 239 157.5 214.5Q188 190 233 190Q281 190 320 214.5Q359 239 381 273L377 224L377 551L0 551L0 622L783 622L783 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M355 430 L315 430 L270 435 L225 430 L180 415 L140 390 L110 360 L90 325 L86 290 L95 250 L115 215 L145 185 L180 165 L220 154 L260 155 L300 170 L335 195 L360 225 L377 260 L387 290" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M417 551 L417 480 L417 400 L417 320 L417 240 L417 160 L417 80 L417 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M455 350 L490 365 L530 370 L570 365 L610 345 L645 320 L670 285 L685 245 L680 205 L660 165 L640 125 L620 95 L600 70" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L115 585 L225 585 L335 585 L445 585 L555 585 L665 585 L778 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="778" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="391.5" y="214" text-anchor="middle" font-size="74" fill="#6b7280"><tspan x="391.5" y="214">4. lift, then draw the</tspan><tspan x="391.5" y="304.3">shirorekha</tspan><tspan x="391.5" y="394.6">left-to-right</tspan></text></svg><text x="16" y="235.8" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-क-order.gif’, strokes 1–4, Wikimedia Commons, 8 May 2009</text><text x="16" y="248.3" fon