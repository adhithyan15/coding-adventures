42L319 -12Q240 59 183.5 119Q127 179 88 234Q63 269 52.5 295Q42 321 42 343Q42 366 56 380Q70 394 95 394Q122 394 147 375Q172 356 197 323L147 335Q204 354 230 387.5Q256 421 256 468Q256 497 248.5 525.5Q241 554 230 565L275 551L0 551L0 622L424 622L424 551L284 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M285 551 L285 510 L286 470 L280 430 L265 390 L245 360 L220 340 L195 325 L175 342 L150 360 L120 375 L90 370 L65 350 L55 325 L63 300 L82 280 L105 260 L130 245 L155 245" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M145 235 L145 235" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M145 235 L170 205 L200 170 L235 135 L270 100 L305 65 L345 30" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="345" cy="30" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="212" y="197.2" text-anchor="middle" font-size="45.2" fill="#6b7280"><tspan x="212" y="197.2">2. lift, then draw the</tspan><tspan x="212" y="252.3">diagonal tail</tspan><tspan x="212" y="307.5">down-right</tspan></text></svg><rect x="336" y="42" width="150" height="270.03" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="270.03" viewBox="-70 -692 564 1015.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M284 551L316 566Q327 541 331.5 515.5Q336 490 336 458Q336 403 313.5 363.5Q291 324 250.5 295.5Q210 267 156 245L158 255Q186 222 221.5 185.5Q257 149 296.5 113Q336 77 377 42L319 -12Q240 59 183.5 119Q127 179 88 234Q63 269 52.5 295Q42 321 42 343Q42 366 56 380Q70 394 95 394Q122 394 147 375Q172 356 197 323L147 335Q204 354 230 387.5Q256 421 256 468Q256 497 248.5 525.5Q241 554 230 565L275 551L0 551L0 622L424 622L424 551L284 551Z" fill="#e0ddd6" fill-rule="nonzero"/>