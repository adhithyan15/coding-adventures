" x="502" y="304.1" text-anchor="middle" font-size="84.1" fill="#6b7280"><tspan x="502" y="304.1">2. lift, then draw 日&apos;s</tspan><tspan x="502" y="406.7">top horizontal</tspan><tspan x="502" y="509.3">left-to-right</tspan></text></svg><rect x="336" y="42" width="150" height="200.24" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="200.24" viewBox="-23 -863 1050 1401.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M458 389L535 389L535 -80L458 -80L458 389ZM226 555L226 446L767 446L767 555L226 555ZM226 726L226 619L767 619L767 726L226 726ZM152 793L844 793L844 378L152 378L152 793ZM47 230L957 230L957 157L47 157L47 230Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M189 759 L189 690 L189 620 L189 550 L189 480 L189 412" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M189 759 L290 759 L395 759 L500 759 L605 759 L710 759 L806 759 L806 759" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M806 759 L806 690 L806 620 L806 550 L806 480 L806 412" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="806" cy="412" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="502" y="304.1" text-anchor="middle" font-size="84.1" fill="#6b7280"><tspan x="502" y="304.1">3. turn without lifting</tspan><tspan x="502" y="406.7">and descend 日&apos;s right</tspan><tspan x="502" y="509.3">side</tspan></text></svg><rect x="496" y="42" width="150" height="200.24" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="200.24" viewBox="-23 -863 1050 1401.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M458 389L535 389L535 -80L458 -8