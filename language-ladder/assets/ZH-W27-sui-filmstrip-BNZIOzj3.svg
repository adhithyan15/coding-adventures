<svg xmlns="http://www.w3.org/2000/svg" width="982" height="323.25" viewBox="0 0 982 323.25" role="img" aria-label="How to write 岁: 6 strokes · 5 pen lifts · 6 movements"><title>Writing 岁</title><desc>6 frames; frame N shows movements 1 to N of 岁 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 岁.json, ordered stroke paths and medians 1–6 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%B2%81.json&gt;. Source note on variation: The cited PRC-order dataset supplies six ordered strokes for 岁. Medians 1–3 draw 山 with its centre vertical first, then the joined left-and-base stroke, then the right vertical — centre before the sides, which is the one place this book&apos;s top-to-bottom and left-to-right rules do not decide the order by themselves. Medians 4–6 draw 夕 beneath. Make Me a Hanzi documents proper People&apos;s Republic of China stroke order and matching animation medians. This learner path adapts all six medians to Noto Sans SC while preserving their order, the two internal turns and five intervening lifts; Noto&apos;s 山 is wider and flatter than the Arphic-derived source graphic&apos;s.</desc><rect x="0" y="0" width="982" height="323.25" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 6 strokes · 5 pen lifts · 6 movements</text><rect x="16" y="42" width="150" height="229.75" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="229.75" viewBox="23 -915 925 1416.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M463 845L540 845L540 594L463 594L463 845ZM299 264L357 301Q392 275 430 243Q468 211 501.5 179Q535 147 556 