<svg xmlns="http://www.w3.org/2000/svg" width="822" height="363.89" viewBox="0 0 822 363.89" role="img" aria-label="How to write ీ: one unbroken stroke · 5 movements"><title>Writing ీ</title><desc>5 frames; frame N shows movements 1 to N of ీ (telugu), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTelugu-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Telugu recognizer, class 54 (ీ, ii sign): stored online-handwriting prototypes from native writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native writers&apos; tablet pen traces, each resampled to 60 points. 180 of the 213 stored prototypes of the ii sign (85%) are one pen-down stroke, and all 32 two-stroke prototypes draw the loop first and the hook second. Of the 180, 157 start at the lower left, 177 turn anticlockwise in the first half of the stroke, and 150 reach their highest point in the second half, on the hook, which 176 finish to the right of: the i sign&apos;s loop first, then up and over into the hook (130 do all of that). The bundled font prints the hook rising from the loop&apos;s upper left, so after the curl the path runs back along the top of the loop to the hook&apos;s foot. Each sign was written by itself, with no consonant beside it, so the traces fix the sign&apos;s own strokes but not when it is written against its consonant; the book draws the sign alone and composes no Telugu word from it. The traces are scaled to a square, so they fix the start, the direction and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Telugu outline of the sign on its own. The underlying HP Labs data is licensed for research use only, so only counts and shares are cited here, and no trace was copied. Handwriting varies by writer.</desc><rect x="0" y="0" width="822" height="363.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 5 movements</text><rect x="16" y="42" width="150" height="257.89" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="257.89" viewBox="-486 -939 457 785.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-278 432Q-314 432 -346 439.5Q-378 447 -407 458L-380 522Q-360 514 -336 507.5Q-312 501 -282 501Q-239 501 -209 518Q-179 535 -179 587L-179 594Q-179 633 -208 659.5Q-237 686 -284 686Q-309 686 -327 677Q-345 668 -345 648Q-345 626 -327 617Q-309 608 -285 608Q-247 608 -222 628.5Q-197 649 -173 675L-149 618Q-162 604 -180 588Q-198 572 -224 561Q-250 550 -289 550Q-349 550 -382.5 572.5Q-416 595 -416 643Q-416 674 -399 697Q-382 720 -351 733.5Q-320 747 -278 747Q-192 747 -150 700.5Q-108 654 -108 583Q-108 511 -151.5 471.5Q-195 432 -278 432ZM-247 869Q-186 869 -151.5 845Q-117 821 -99 777L-175 757Q-183 780 -201 792Q-219 804 -247 804Q-278 804 -297.5 790.5Q-317 777 -317 750Q-317 738 -312.5 726.5Q-308 715 -297 704L-360 676Q-373 693 -380.5 714Q-388 735 -388 757Q-388 810 -349 839.5Q-310 869 -247 869Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-392 488 L-392 488" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-392 488 L-346 475 L-310 468 L-279 467 L-245 470 L-215 478" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-215" cy="478" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-257.5" y="-255.4" text-anchor="middle" font-size="36.6" fill="#6b7280"><tspan x="-257.5" y="-255.4">1. start at the tail&apos;s</tspan><tspan x="-257.5" y="-210.7">lower-left tip and run</tspan><tspan x="-257.5" y="-166.1">right along the bottom</tspan></text></svg><rect x="176" y="42" width="15