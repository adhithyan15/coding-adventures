[package]
name = "brainfuck-iir-compiler"
version = "0.4.0"
edition = "2021"
description = "BF04/BF05 — Brainfuck → InterpreterIR compiler, vm-core wrapper, jit-core JIT chain, and real CIR-bytecode JIT backend.  v0.4.0 (LANG-FULL B1-eof): `,` now normalises end-of-input to 0 in the shared IIR — getchar is read at i64 (so a negative EOF sentinel survives the u8 cell store), clamped to 0 via cmp_lt+branch, then stored — so the canonical cat `,[.,]` halts at EOF on EVERY backend (previously libc/Console/wasm returned -1 → cell 255 → infinite loop, while JVM/VM/JIT returned 0)."
license = "MIT"

[dependencies]
brainfuck      = { path = "../brainfuck" }
interpreter-ir = { path = "../interpreter-ir" }
vm-core        = { path = "../vm-core" }
jit-core       = { path = "../jit-core" }
parser         = { path = "../parser" }
lexer          = { path = "../lexer" }

[dev-dependencies]
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
wasm-module-encoder   = { path = "../wasm-module-encoder" }
wasm-types            = { path = "../wasm-types" }
