<svg xmlns="http://www.w3.org/2000/svg" width="662" height="303.97" viewBox="0 0 662 303.97" role="img" aria-label="How to write ਪ: 2 strokes · 1 pen lift · 4 movements"><title>Writing ਪ</title><desc>4 frames; frame N shows movements 1 to N of ਪ (gurmukhi), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGurmukhi-Static.ttf. Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਪ (pappaa) checkpoints, strokes 1–2 (lib/data/lessons/lesson_tracing.dart line 826, commit de1e560; Apache-2.0) &lt;https://github.com/codemanxdev/gnps_learning_hub/blob/de1e56014cb0caf7e56de2320681781cae6a7e41/lib/data/lessons/lesson_tracing.dart#L826&gt;. Source note on variation: GNPS&apos;s children&apos;s Punjabi app (Apache-2.0; developer CodeManX) has a tracing lesson whose checkpoints the developer entered over the Noto Sans Gurmukhi letter, one list per pen-down stroke, and whose trace widget makes the child reach them in order. It writes ਪ in two pen-down strokes: from the top left along the bar&apos;s left part, down the left side and round the bowl to the stem; then from the top right, left along the bar&apos;s right part and down the stem. In the bundled Noto Sans Gurmukhi outline this letter&apos;s top bar is split, with a gap above the body, and the source draws no separate headline: the first stroke opens along the bar&apos;s left part and the last stroke opens by running right to left along its right part before turning down the stem. The outline and the source agree, so there is no headline stroke to place first or last. Omniglot (Lake, Salakhutdinov &amp; Tenenbaum, Science 350:1332, 2015; https://github.com/brendenlake/omniglot, MIT licence) holds 20 drawings of ਪ, each by a different non-native copyist; only counts and shares are cited. 75% (15 of 20) draw it in two strokes, the source&apos;s count and their most common one. For the first stroke of the body, 95% (19 of 20) start in the same part of the letter as the source and 90% (18 of 20) set off in the same direction, within 45 degrees. Only the order, the start, the direction and the lifts are taken from the source; no checkpoint coordinate is copied, and the path is fitted to the bundled Noto Sans Gurmukhi outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="662" height="303.97" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="197.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="197.97" viewBox="-77 -692 747 985.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 0L423 162Q390 148 357.5 140Q325 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 414 172.5 382Q157 350 132 327Q161 267 196.5 236.5Q232 206 284 206Q323 206 356 216.5Q389 227 423 247L423 622L600 622L600 551L504 551L504 0L423 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L15 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M15 586 L54 585 L90 577 L116 558 L132 528 L139 492 L140 454 L135 417 L122 382 L105 349" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="105" cy="349" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296.5" y="199.9" text-anchor="middle" font-size="59.9" fill="#6b7280"><tspan x="296.5" y="199.9">1. start at the top</tspan><tspan x="296.5" y="273">left and curve down</tspan></text></svg><rect x="176" y="42" width="150" height="197.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="197.97" viewBox="-77 -692 747 985.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 0L423 162Q390 148 357.5 140Q325 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 414 172.5 382Q157 350 132 327Q161 267 196.5 236.5Q232 206 284 206Q323 206 356 216.5Q389 227 423 247L423 622L600 622L600 551L504 551L504 0L423 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 585 L90 577 L116 558 L132 528 L139 492 L140 454 L135 417 L122 382 L105 349 L105 349" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M105 349 L107 313 L117 278 L138 246 L165 217 L197 195 L233 180 L271 174 L310 175 L348 180 L386 187 L424 196 L462 205" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="462" cy="205" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296.5" y="199.9" text-anchor="middle" font-size="59.9" fill="#6b7280"><tspan x="296.5" y="199.9">2. round the bowl to</tspan><tspan x="296.5" y="273">the stem</tspan></text></svg><rect x="336" y="42" width="150" height="197.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="197.97" viewBox="-77 -692 747 985.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 0L423 162Q390 148 357.5 140Q325 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 414 172.5 382Q157 350 132 327Q161 267 196.5 236.5Q232 206 284 206Q323 206 356 216.5Q389 227 423 247L423 622L600 622L600 551L504 551L504 0L423 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 585 L90 577 L116 558 L132 528 L139 492 L140 454 L135 417 L122 382 L105 349 L107 313 L117 278 L138 246 L165 217 L197 195 L233 180 L271 174 L310 175 L348 180 L386 187 L424 196 L462 205" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M578 586 L578 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M578 586 L529 586 L480 586" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="480" cy="586" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296.5" y="199.9" text-anchor="middle" font-size="59.9" fill="#6b7280"><tspan x="296.5" y="199.9">3. lift, then run left</tspan><tspan x="296.5" y="273">along the top</tspan></text></svg><rect x="496" y="42" width="150" height="197.97" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="197.97" viewBox="-77 -692 747 985.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M423 0L423 162Q390 148 357.5 140Q325 132 284 132Q196 132 136 186.5Q76 241 38 333Q68 359 88 389Q108 419 108 459Q108 481 101.5 506.5Q95 532 84 551L-7 551L-7 622L142 622Q164 582 176 539.5Q188 497 188 460Q188 414 172.5 382Q157 350 132 327Q161 267 196.5 236.5Q232 206 284 206Q323 206 356 216.5Q389 227 423 247L423 622L600 622L600 551L504 551L504 0L423 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M15 586 L54 585 L90 577 L116 558 L132 528 L139 492 L140 454 L135 417 L122 382 L105 349 L107 313 L117 278 L138 246 L165 217 L197 195 L233 180 L271 174 L310 175 L348 180 L386 187 L424 196 L462 205" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M578 586 L529 586 L480 586 L480 586" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M480 586 L469 555 L463 519 L462 479 L462 438 L462 398 L462 357 L462 317 L462 277 L462 237 L462 197 L462 157 L462 117 L463 77 L465 37" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="465" cy="37" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="296.5" y="199.9" text-anchor="middle" font-size="59.9" fill="#6b7280"><tspan x="296.5" y="199.9">4. turn down the stem</tspan></text></svg><text x="16" y="252.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after GNPS, Gurmukhi Sikho (GNPS Learning Hub), Alphabet Tracing lesson, ਪ (pappaa) checkpoints, strokes 1–2</text><text x="16" y="265.47" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(lib/data/lessons/lesson_tracing.dart line 826, commit de1e560; Apache-2.0)</text><text x="16" y="277.97" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
