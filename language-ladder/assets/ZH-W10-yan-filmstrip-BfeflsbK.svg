 530L331 39Q331 39 322 32Q313 25 300.5 14.5Q288 4 275.5 -9Q263 -22 254.5 -34.5Q246 -47 246 -56Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 780 L180 755 L215 720 L250 685 L290 645" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M60 492 L60 492" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M60 492 L110 492 L160 492 L210 492 L255 492 L293 492 L293 492" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="293" cy="492" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="268" y="243.6" text-anchor="middle" font-size="47.6" fill="#6b7280"><tspan x="268" y="243.6">2. lift, then draw the</tspan><tspan x="268" y="301.7">short horizontal from</tspan><tspan x="268" y="359.7">left to right</tspan></text></svg><rect x="336" y="42" width="150" height="319.29" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="319.29" viewBox="-29 -888 594 1264.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M123 777L183 818Q213 791 245.5 759Q278 727 306.5 696Q335 665 352 640L289 593Q272 618 244 650.5Q216 683 184.5 716.5Q153 750 123 777ZM41 530L291 530L291 455L41 455L41 530ZM246 -56L232 17L256 50L474 187Q477 176 480 163.5Q483 151 487.5 139.5Q492 128 495 120Q419 69 372 37.5Q325 6 300 -12Q275 -30 263 -39.5Q251 -49 246 -56ZM246 -56Q242 -47 234 -34.5Q226 -22 216.5 -10Q207 2 200 9Q210 16 222.5 30Q235 44 245 63Q255 82 255 105L255 530L331 530L331 39Q331 39 322 32Q313 25 300.5 14.5Q288 4 275.5 -9Q263 -22 254.5 -34.5Q246 -47 246 -56Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M150 780 L180 755 L215 720 L250 685 L290 645" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="ro