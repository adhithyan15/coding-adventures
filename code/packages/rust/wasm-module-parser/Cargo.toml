[package]
name = "wasm-module-parser"
version = "0.2.10"
edition = "2021"
description = "WASM binary module parser: decodes .wasm files into structured WasmModule data. v0.2.10: LEB128/malformed-binary hardening pass -- every u32 field now rejects overlong (>5-byte) and out-of-range (doesn't fit 32 bits) encodings instead of silently truncating via `as u32`, plus new structural checks (unrecognized/out-of-canonical-order/repeated section ids, section-size mismatches, function/code section count mismatches, a function body not ending in `end`, malformed limits flags, a locals-count DoS cap)."

[dependencies]
wasm-leb128 = { path = "../wasm-leb128" }
wasm-types = { path = "../wasm-types" }
wasm-opcodes = { path = "../wasm-opcodes" }
