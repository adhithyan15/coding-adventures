<svg xmlns="http://www.w3.org/2000/svg" width="502" height="332.78" viewBox="0 0 502 332.78" role="img" aria-label="How to write ೨: one unbroken stroke · 3 movements"><title>Writing ೨</title><desc>3 frames; frame N shows movements 1 to N of ೨ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lessons LIDO_kn2_0318 and LIDO_kn2_0319, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing path for ೨, trace image 2.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0318.zip&gt;. Source note on variation: Chimple draws ೨ as one path that starts at the left end of the base, runs right along it, climbs the right side, turns anticlockwise over the top and down the left side, and curls in to finish inside the bowl (start lower left, end middle). The lesson bundle LIDO_kn2_0318.zip has sha256 cc49279b364bdf6f...; each trace image was matched to its digit against a Noto Sans Kannada rendering and against LIDO_kn2_0319, whose rows build the numbers ೧೧ to ೧೯ from the same images. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. LIDO_kn2_0319 (bundle sha256 deb63ebae06d6c67...) repeats the same path byte for byte, so the two lessons are one source. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run (the consonant + anusvara images draw the ring as a separate last path), so one path here means one stroke and no lift. This is designer-authored teaching material from one organisation, not a native-writer recording, and no second source for Kannada digits was found, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing.</desc><rect x="0" y="0" width="502" height="332.78" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="214.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="214.28" viewBox="-40 -772 746 1065.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M389 702Q466 702 521.5 661Q577 620 606.5 544.5Q636 469 636 365Q636 268 613 198Q590 128 543 82Q516 55 479 37Q442 19 392.5 9.5Q343 0 277 0L30 0L30 82L242 82Q319 82 363.5 89.5Q408 97 433.5 110Q459 123 477 141Q516 178 532 233.5Q548 289 548 359Q548 437 530 496.5Q512 556 476.5 590Q441 624 388 624Q330 624 303.5 595.5Q277 567 277 523Q277 501 284 486Q291 471 303.5 463Q316 455 334 455Q360 455 372 469.5Q384 484 384 511L458 516Q460 512 460.5 504.5Q461 497 461 489Q461 465 450 439.5Q439 414 411.5 396.5Q384 379 335 379Q292 379 260 396.5Q228 414 210 447Q192 480 192 526Q192 609 246.5 655.5Q301 702 389 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M62 42 L62 42" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M62 42 L101 41 L140 40 L180 40 L219 40 L258 41 L296 42 L335 45 L372 50 L408 58 L442 71 L474 88 L503 111 L529 138 L549 169 L565 202 L575 237 L582 273 L587 311 L589 349" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="589" cy="349" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="333" y="199.8" text-anchor="middle" font-size="59.8" fill="#6b7280"><tspan x="333" y="199.8">1. run right along the</tspan><tspan x="333" y="272.8">base and up the right</tspan></text></svg><rect x="176" y="42" width="150" height="214.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="214.28" viewBox="-40 -772 746 1065.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M389 702Q466 702 521.5 661Q577 620 606.5 544.5Q636 469 636 365Q636 268 613 198Q590 128 543 82Q516 55 479 37Q442 19 392.5 9.5Q343 0 277 0L30 0L30 82L242 82Q319 82 363.5 89.5Q408 97 433.5 110Q459 123 477 141Q516 178 532 233.5Q548 289 548 359Q548 437 530 496.5Q512 556 476.5 590Q441 624 388 624Q330 624 303.5 595.5Q277 567 277 523Q277 501 284 486Q291 471 303.5 463Q316 455 334 455Q360 455 372 469.5Q384 484 384 511L458 516Q460 512 460.5 504.5Q461 497 461 489Q461 465 450 439.5Q439 414 411.5 396.5Q384 379 335 379Q292 379 260 396.5Q228 414 210 447Q192 480 192 526Q192 609 246.5 655.5Q301 702 389 702Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M62 42 L101 41 L140 40 L180 40 L219 40 L258 41 L296 42 L335 45 L372 50 L408 58 L442 71 L474 88 L503 111 L529 138 L549 169 L565 202 L575 237 L582 273 L587 311 L589 349 L589 349" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M589 349 L588 388 L585 427 L580 465 L570 502 L557 537 L541 571 L519 601 L491 627 L458 645 L422 655 L384 657 L346 653 L310 642 L280 621 L258 593 L245 558 L238 520" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="238" cy="520" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="333" y="199.8" text-anchor="middle" font-size="59.8" fill="#6b7280"><tspan x="333" y="199.8">2. turn anticlockwise</tspan><tspan x="333" y="272.8">over the top</tspan></text></svg><rect x="336" y="42" width="150" height="214.28" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="214.28" viewBox="-40 -772 746 1065.7" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="sc