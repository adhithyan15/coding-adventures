<svg xmlns="http://www.w3.org/2000/svg" width="502" height="326.81" viewBox="0 0 502 326.81" role="img" aria-label="How to write त: 3 strokes · 2 pen lifts · 3 movements"><title>Writing त</title><desc>3 frames; frame N shows movements 1 to N of त (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-त-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A4-order.gif&gt;. Source note on variation: The 17-frame animation shows three ordered pen-down runs: frames 1–7 start at the body&apos;s upper-right junction, sweep left across the shoulder, curve down around the left side, and finish down-right at the open lower tip without lifting; frames 8–12 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 13–16 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VI, p. 30, independently shows the same body, right stem, and headline buildup. This learner path follows that sourced three-run form and fits its curve to Noto Sans Devanagari; everyday handwriting may join or simplify the body differently.</desc><rect x="0" y="0" width="502" height="326.81" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="220.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="220.81" viewBox="-70 -692 724 1065.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M481 551L481 0L400 0L400 328L261 328Q198 328 162 306Q126 284 126 231Q126 182 157 138Q188 94 248 37L191 -14Q121 54 83 114Q45 174 45 241Q45 322 100 360.5Q155 399 247 399L400 399L400 551L0 551L0 622L584 622L584 551L481 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M400 364 L400 364" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M400 364 L350 364 L300 364 L247 364 L205 363 L165 345 L130 315 L105 280 L86 242 L88 205 L103 165 L125 125 L152 88 L184 52 L219 14" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="219" cy="14" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292" y="212" text-anchor="middle" font-size="58" fill="#6b7280"><tspan x="292" y="212">1. sweep left across the</tspan><tspan x="292" y="282.8">shoulder and curve down</tspan><tspan x="292" y="353.5">to the open tip</tspan></text></svg><rect x="176" y="42" width="150" height="220.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="220.81" viewBox="-70 -692 724 1065.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M481 551L481 0L400 0L400 328L261 328Q198 328 162 306Q126 284 126 231Q126 182 157 138Q188 94 248 37L191 -14Q121 54 83 114Q45 174 45 241Q45 322 100 360.5Q155 399 247 399L400 399L400 551L0 551L0 622L584 622L584 551L481 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M400 364 L350 364 L300 364 L247 364 L205 363 L165 345 L130 315 L105 280 L86 242 L88 205 L103 165 L125 125 L152 88 L184 52 L219 14" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M440 551 L440 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M440 551 L440 475 L440 395 L440 315 L440 235 L440 155 L440 75 L440 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="440" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292" y="212" text-anchor="middle" font-size="58" fill="#6b7280"><tspan x="292" y="212">2. lift, then descend</tspan><tspan x="292" y="282.8">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="220.81" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="220.81" viewBox="-70 -692 724 1065.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M481 551L481 0L400 0L400 328L261 328Q198 328 162 306Q126 284 126 231Q126 182 157 138Q188 94 248 37L191 -14Q121 54 83 114Q45 174 45 241Q45 322 100 360.5Q155 399 247 399L400 399L400 551L0 551L0 622L584 622L584 551L481 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M400 364 L350 364 L300 364 L247 364 L205 363 L165 345 L130 315 L105 280 L86 242 L88 205 L103 165 L125 125 L152 88 L184 52 L219 14" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M440 551 L440 475 L440 395 L440 315 L440 235 L440 155 L440 75 L440 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L579 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="579" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="292" y="212" text-anchor="middle" font-size="58" fill="#6b7280"><tspan x="292" y="212">3. lift, then draw the</tspan><tspan x="292" y="282.8">shirorekha left-to-right</tspan></text></svg><text x="16" y="275.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-त-order.gif’, strokes 1–3, Wikimedia Commons, 10 May</text><text x="16" y="288.31" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="300.81" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
