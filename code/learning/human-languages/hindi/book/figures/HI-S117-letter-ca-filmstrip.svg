<svg xmlns="http://www.w3.org/2000/svg" width="502" height="309.71" viewBox="0 0 502 309.71" role="img" aria-label="How to write च: 3 strokes · 2 pen lifts · 3 movements"><title>Writing च</title><desc>3 frames; frame N shows movements 1 to N of च (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-च-order.gif’, strokes 1–3, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9A-order.gif&gt;. Source note on variation: The 22-frame animation shows three ordered pen-down runs: frames 4–14 draw the short upper bar left-to-right, turn down and left through the shoulder, and curve around the rounded body to its open right junction without lifting; frames 15–18 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 19–22 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit IV, p. 17, independently confirms the upper bar, rounded body, right stem, and headline order, while staging the upper bar and rounded body separately rather than proving their join. This learner path takes its three-run lift count from the animation and fits its curves to Noto Sans Devanagari; everyday handwriting may join or simplify the body differently.</desc><rect x="0" y="0" width="502" height="309.71" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="203.71" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="203.71" viewBox="-70 -692 789 1071.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__gl