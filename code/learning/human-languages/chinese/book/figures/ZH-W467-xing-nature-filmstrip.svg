<svg xmlns="http://www.w3.org/2000/svg" width="982" height="515.82" viewBox="0 0 982 515.82" role="img" aria-label="How to write 性: 8 strokes · 7 pen lifts · 8 movements"><title>Writing 性</title><desc>8 frames; frame N shows movements 1 to N of 性 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 性.json, ordered stroke paths and medians 1–8 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E6%80%A7.json&gt;. Source note on variation: The cited PRC-order dataset supplies eight ordered strokes for 性, in two pieces. Medians 1–3 draw the upright heart as 快 opens. Medians 4–8 draw 生 as 生 is written alone: a short left-falling stroke, a horizontal, a second horizontal, a vertical down through them, then a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those eight ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and seven intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="515.82" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 8 strokes · 7 pen lifts · 8 movements</text><rect x="16" y="42" width="150" height="205.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="205.16" viewBox="-42 -910 1061 1451.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="duc