<svg xmlns="http://www.w3.org/2000/svg" width="502" height="340.33" viewBox="0 0 502 340.33" role="img" aria-label="How to write ग: 3 strokes · 2 pen lifts · 3 movements"><title>Writing ग</title><desc>3 frames; frame N shows movements 1 to N of ग (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-ग-order.gif’, strokes 1–3, Wikimedia Commons, 9 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%97-order.gif&gt;. Source note on variation: The 18-frame animation shows three ordered pen-down runs: frames 2–9 start at the loop&apos;s upper-right junction, sweep left over the top and around the counterclockwise loop, then continue up the joined stem to the headline; frames 10–13 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 14–18 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit III, p. 14, independently shows the same three-part buildup. This learner path follows that sourced form and fits its curves to Noto Sans Devanagari; everyday handwriting may join or simplify the body differently.</desc><rect x="0" y="0" width="502" height="340.33" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="234.33" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="234.33" viewBox="-70 -692 717 1120.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M208 551L208 234Q208 208 195.5 193Q183 178 160 178Q141 178 120 190Q99 202 81 222Q63 242 52 264.5Q41 287 41 308Q41 331 54.5 345Q68 359 102 359L127 359L127 551L0 551L0 622L577 622L577 551L474 551L474 0L393 0L393 551L208 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M168 315 L168 315" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M168 315 L140 322 L110 312 L85 290 L76 262 L86 232 L112 208 L142 198 L168 205 L168 250 L168 320 L168 400 L168 475 L168 550" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="168" cy="550" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="288.5" y="197.5">1. sweep</tspan><tspan x="288.5" y="267.7">counterclockwise around</tspan><tspan x="288.5" y="337.8">the loop and up the</tspan><tspan x="288.5" y="408">joined stem</tspan></text></svg><rect x="176" y="42" width="150" height="234.33" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="234.33" viewBox="-70 -692 717 1120.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M208 551L208 234Q208 208 195.5 193Q183 178 160 178Q141 178 120 190Q99 202 81 222Q63 242 52 264.5Q41 287 41 308Q41 331 54.5 345Q68 359 102 359L127 359L127 551L0 551L0 622L577 622L577 551L474 551L474 0L393 0L393 551L208 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M168 315 L140 322 L110 312 L85 290 L76 262 L86 232 L112 208 L142 198 L168 205 L168 250 L168 320 L168 400 L168 475 L168 550" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M434 551 L434 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M434 551 L434 475 L434 395 L434 315 L434 235 L434 155 L434 75 L434 5" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="434" cy="5" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="288.5" y="197.5">2. lift, then descend</tspan><tspan x="288.5" y="267.7">the right stem</tspan></text></svg><rect x="336" y="42" width="150" height="234.33" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="234.33" viewBox="-70 -692 717 1120.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M208 551L208 234Q208 208 195.5 193Q183 178 160 178Q141 178 120 190Q99 202 81 222Q63 242 52 264.5Q41 287 41 308Q41 331 54.5 345Q68 359 102 359L127 359L127 551L0 551L0 622L577 622L577 551L474 551L474 0L393 0L393 551L208 551Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M168 315 L140 322 L110 312 L85 290 L76 262 L86 232 L112 208 L142 198 L168 205 L168 250 L168 320 L168 400 L168 475 L168 550" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M434 551 L434 475 L434 395 L434 315 L434 235 L434 155 L434 75 L434 5" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M5 585 L5 585" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M5 585 L85 585 L165 585 L245 585 L325 585 L405 585 L485 585 L572 585" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="572" cy="585" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="288.5" y="197.5" text-anchor="middle" font-size="57.5" fill="#6b7280"><tspan x="288.5" y="197.5">3. lift, then draw the</tspan><tspan x="288.5" y="267.7">shirorekha</tspan><tspan x="288.5" y="337.8">left-to-right</tspan></text></svg><text x="16" y="289.33" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Opiaterein, ‘Deva-ग-order.gif’, strokes 1–3, Wikimedia Commons, 9 May</text><text x="16" y="301.83" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">2009</text><text x="16" y="314.33" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
