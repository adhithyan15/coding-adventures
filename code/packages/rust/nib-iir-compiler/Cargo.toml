[package]
name = "nib-iir-compiler"
version = "0.16.0"
edition = "2021"
description = "Compile Nib source to InterpreterIR (IIRModule), feeding the LANG-runtime AOT/JIT pipeline.  v0.16.0 (LANG-FULL N3 — bitwise NOT): unary `~` now lowers to the shared IIR `not` op (was silently dropped) with the narrow result width, so every backend masks it mod-2ⁿ — `~0u8 = 255`, `~15u4 = 0`. Also fixes the single-child-wrapper passthrough in `compile_expr`, which (because it counts only child *nodes*, tokens filtered) had been unwrapping a `~x` unary_expr and discarding the operator. Runs on all 7 backends (iir-to-llvm 0.12.0 / iir-to-cil-bytecode 0.21.0 grew the `not` op last).  v0.5.0: marks main function FullyTyped so the JITCore + GenericCirJit chain can run Nib programs JIT-compiled.  v0.6.0: threads real source positions through IIRFunction::source_map for line-based debugger breakpoints."

[dependencies]
coding-adventures-nib-parser = { path = "../nib-parser" }
nib-type-checker = { path = "../nib-type-checker" }
parser           = { path = "../parser" }
interpreter-ir   = { path = "../interpreter-ir" }
type-checker-protocol = { path = "../type-checker-protocol" }

[dev-dependencies]
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
# tests/backend_encode.rs serialises WasmModule -> bytes.
wasm-module-encoder   = { path = "../wasm-module-encoder" }
# Used by tests/jit_e2e.rs to prove Nib programs run through the
# JITCore + GenericCirJit chain.
vm-core               = { path = "../vm-core" }
jit-core              = { path = "../jit-core" }
