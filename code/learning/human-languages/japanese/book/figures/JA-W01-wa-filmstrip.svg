<svg xmlns="http://www.w3.org/2000/svg" width="662" height="305.72" viewBox="0 0 662 305.72" role="img" aria-label="How to write わ: 2 strokes · 1 pen lift · 4 movements"><title>Writing わ</title><desc>4 frames; frame N shows movements 1 to N of わ (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana わ stroke order animation.gif, hiragana わ, 30 frames, 3.0 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%8F_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws わ in two pen-down runs with one lift: descend through the long left vertical, restart at the upper left, cross right through the vertical, hook down and left, return through the central crossing, then continue clockwise around the broad right loop. The learner path is fitted to the bundled Noto Sans JP subset; handwritten hook depth and loop roundness vary, but the two-run order remains the same.</desc><rect x="0" y="0" width="662" height="305.72" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="199.72" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.72" viewBox="-15 -864 1014 1350.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M528 72Q592 81 649.5 101Q707 121 752 154Q797 187 823 235Q849 283 848 347Q848 376 836.5 407Q825 438 801.5 465Q778 492 741 508.5Q704 525 655 525Q559 525 473 477.5Q387 430 314 354L314 442Q405 528 496.5 563Q588 598 667 598Q736 598 795.5 567.5Q855 537 892 480Q929 423 929 345Q929 270 903 211.5Q877 153 828.5 111Q780 69 713.5 40.5Q647 12 565 -3L528 72ZM303 554Q291 552 266.5 549Q242 546 210.5 541.5Q179 537 147 533Q115 529 