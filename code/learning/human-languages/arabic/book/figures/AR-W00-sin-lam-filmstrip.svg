</tspan></text></svg><text x="16" y="402.96" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 1: stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet: س ش ص ض, independent</text><text x="16" y="415.46" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Seen at 00:01.6–00:02.8 (University of Oregon Libraries Open Textbook, 2023)</text><text x="16" y="427.96" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Letter 2: stroke order after Introduction to Arabic: Egyptian Arabic for first-year students, Alphabet ي ك ل, independent</text><text x="16" y="440.46" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Lam at 00:01.9–00:02.4 (University of Oregon Libraries Open Textbook, 2023)</text><text x="16" y="452.96" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
