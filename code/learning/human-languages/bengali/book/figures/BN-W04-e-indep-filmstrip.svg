<svg xmlns="http://www.w3.org/2000/svg" width="502" height="335.89" viewBox="0 0 502 335.89" role="img" aria-label="How to write এ: one unbroken stroke · 3 movements"><title>Writing এ</title><desc>3 frames; frame N shows movements 1 to N of এ (bengali), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansBengali-Static.ttf. Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0, Bangla recognizer, class 7 (এ, e; user manual Table 4): stored online-handwriting prototypes from native Bengali writers (MIT licence, 2012) &lt;https://lipitk.sourceforge.net/lipi-reco.htm&gt;. Source note on variation: The recognizer stores native Bengali writers&apos; tablet pen traces, each resampled to 60 points. 194 of the 226 stored prototypes of the independent e are one pen-down stroke. 189 of those 194 start in the upper half, inside the small curl, and all 194 turn clockwise: round the curl, over the arch and down the right side. 190 end on the left, at the top of the hook, so the base is swept from right to left. The traces are scaled to a square, so they fix the start, the order, the turning and the pen lifts, not the proportions: the path is fitted to the bundled Noto Sans Bengali outline. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="335.89" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="217.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="217.39" viewBox="-24 -702 735 1065.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M564 0Q551 45 528.5 66Q506 87 465 87Q429 87 398 83Q367 79 333 74.5Q299 70 255 70Q227 70 191 77.5Q155 85 122 106Q89 127 67.5 168.5Q46 210 46 278Q46 302 50 328.5Q54 355 58 377L135 366Q131 351 127.5 330Q124 309 124 280Q124 221 145.5 192Q167 163 198 153.5Q229 144 259 144Q293 144 322 148.5Q351 153 380.5 157Q410 161 445 161Q484 161 513 148.5Q542 136 564 105L564 482Q564 520 550 540.5Q536 561 498 561Q452 561 417 536Q382 511 361 475Q340 439 337 406Q353 415 373 415Q401 415 421.5 396.5Q442 378 442 347Q442 312 418 293Q394 274 359 274Q335 274 311.5 286.5Q288 299 273 326Q258 353 258 396Q258 437 275.5 478.5Q293 520 324.5 554.5Q356 589 398.5 610.5Q441 632 490 632Q556 632 598.5 594.5Q641 557 641 474L641 0L564 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 410 L345 410" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M345 410 L395 408 L425 375 L420 320 L380 292 L330 292 L290 320 L270 380 L285 460 L330 535 L400 585 L490 597 L570 580 L600 530 L602 470" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="602" cy="470" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="198.9" text-anchor="middle" font-size="58.9" fill="#6b7280"><tspan x="343.5" y="198.9">1. start inside the</tspan><tspan x="343.5" y="270.8">curl and turn clockwise</tspan><tspan x="343.5" y="342.6">over the arch</tspan></text></svg><rect x="176" y="42" width="150" height="217.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="217.39" viewBox="-24 -702 735 1065.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M564 0Q551 45 528.5 66Q506 87 465 87Q429 87 398 83Q367 79 333 74.5Q299 70 255 70Q227 70 191 77.5Q155 85 122 106Q89 127 67.5 168.5Q46 210 46 278Q46 302 50 328.5Q54 355 58 377L135 366Q131 351 127.5 330Q124 309 124 280Q124 221 145.5 192Q167 163 198 153.5Q229 144 259 144Q293 144 322 148.5Q351 153 380.5 157Q410 161 445 161Q484 161 513 148.5Q542 136 564 105L564 482Q564 520 550 540.5Q536 561 498 561Q452 561 417 536Q382 511 361 475Q340 439 337 406Q353 415 373 415Q401 415 421.5 396.5Q442 378 442 347Q442 312 418 293Q394 274 359 274Q335 274 311.5 286.5Q288 299 273 326Q258 353 258 396Q258 437 275.5 478.5Q293 520 324.5 554.5Q356 589 398.5 610.5Q441 632 490 632Q556 632 598.5 594.5Q641 557 641 474L641 0L564 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 410 L395 408 L425 375 L420 320 L380 292 L330 292 L290 320 L270 380 L285 460 L330 535 L400 585 L490 597 L570 580 L600 530 L602 470 L602 470" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M602 470 L602 300 L602 150 L600 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="600" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="198.9" text-anchor="middle" font-size="58.9" fill="#6b7280"><tspan x="343.5" y="198.9">2. come down the right</tspan><tspan x="343.5" y="270.8">side to its foot</tspan></text></svg><rect x="336" y="42" width="150" height="217.39" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="217.39" viewBox="-24 -702 735 1065.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M564 0Q551 45 528.5 66Q506 87 465 87Q429 87 398 83Q367 79 333 74.5Q299 70 255 70Q227 70 191 77.5Q155 85 122 106Q89 127 67.5 168.5Q46 210 46 278Q46 302 50 328.5Q54 355 58 377L135 366Q131 351 127.5 330Q124 309 124 280Q124 221 145.5 192Q167 163 198 153.5Q229 144 259 144Q293 144 322 148.5Q351 153 380.5 157Q410 161 445 161Q484 161 513 148.5Q542 136 564 105L564 482Q564 520 550 540.5Q536 561 498 561Q452 561 417 536Q382 511 361 475Q340 439 337 406Q353 415 373 415Q401 415 421.5 396.5Q442 378 442 347Q442 312 418 293Q394 274 359 274Q335 274 311.5 286.5Q288 299 273 326Q258 353 258 396Q258 437 275.5 478.5Q293 520 324.5 554.5Q356 589 398.5 610.5Q441 632 490 632Q556 632 598.5 594.5Q641 557 641 474L641 0L564 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M345 410 L395 408 L425 375 L420 320 L380 292 L330 292 L290 320 L270 380 L285 460 L330 535 L400 585 L490 597 L570 580 L600 530 L602 470 L602 300 L602 150 L600 40 L600 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M600 40 L560 95 L480 124 L360 115 L255 107 L170 125 L110 180 L85 270 L95 365" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="365" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="343.5" y="198.9" text-anchor="middle" font-size="58.9" fill="#6b7280"><tspan x="343.5" y="198.9">3. sweep left along the</tspan><tspan x="343.5" y="270.8">base and up the left</tspan><tspan x="343.5" y="342.6">hook</tspan></text></svg><text x="16" y="272.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after HP Labs India, Lipi Toolkit, Lipi Indic Character Recognizers 4.0,</text><text x="16" y="284.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Bangla recognizer, class 7 (এ, e; user manual Table 4): stored online-handwriting</text><text x="16" y="297.39" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">prototypes from native Bengali writers (MIT licence, 2012)</text><text x="16" y="309.89" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
