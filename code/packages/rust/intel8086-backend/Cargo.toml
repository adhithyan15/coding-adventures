[package]
name = "intel8086-backend"
version = "0.1.0"
edition = "2021"
description = "Emit-only Intel 8086 CIR backend with two-live typed arithmetic, unsigned comparisons, and structured branches; emits machine code through intel8086-encoder for execution in intel8086-simulator."

[lib]
name = "intel8086_backend"
path = "src/lib.rs"

[dependencies]
intel8086-encoder = { path = "../intel8086-encoder" }
jit-core           = { path = "../jit-core" }
vm-core            = { path = "../vm-core" }

[dev-dependencies]
intel8086-simulator = { path = "../intel8086-simulator" }
