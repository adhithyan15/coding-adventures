<svg xmlns="http://www.w3.org/2000/svg" width="662" height="353.78" viewBox="0 0 662 353.78" role="img" aria-label="How to write ர: one unbroken stroke · 4 movements"><title>Writing ர</title><desc>4 frames; frame N shows movements 1 to N of ர (tamil), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansTamil-Static.ttf. Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர (University of Texas at Austin), p. 191 &lt;https://sites.la.utexas.edu/tamilscript/files/2009/08/hw_lettersinstructions.pdf&gt;. Source note on variation: Frame 3 identifies ர as the three-movement ஈ frame plus a slightly angular short fourth movement. Native writers draw the four movements as one continuous stroke, and this ductus follows them in order without lifting: the first movement runs down the left upright, so the pen climbs back up it to begin the top bar and returns along the bar to the central upright. In HP Labs India&apos;s online Tamil handwriting data (the LipiTk 4.0 Tamil isolated-character recognizer, trained on hpl-tamil-iso-char), 90% of the 189 stored prototypes of ர are a single pen-down stroke. Tamil handwriting varies by school; this is one attested order fitted to the bundled Noto Sans Tamil outline.</desc><rect x="0" y="0" width="662" height="353.78" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 520 L124 520" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M124 520 L132 453 L132 384 L132 315 L132 246 L132 178 L132 109 L132 40" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="132" cy="40" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">1. down the left</tspan><tspan x="355.5" y="472.1">upright</tspan></text></svg><rect x="176" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 520 L132 453 L132 384 L132 315 L132 246 L132 178 L132 109 L132 40 L132 40" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M132 40 L132 109 L132 178 L132 246 L132 315 L132 384 L132 453 L124 520 L200 520 L275 520 L351 520 L426 511 L501 516 L576 520" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="576" cy="520" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">2. back up and along</tspan><tspan x="355.5" y="472.1">the top</tspan></text></svg><rect x="336" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 520 L132 453 L132 384 L132 315 L132 246 L132 178 L132 109 L132 40 L132 109 L132 178 L132 246 L132 315 L132 384 L132 453 L124 520 L200 520 L275 520 L351 520 L426 511 L501 516 L576 520 L576 520" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M576 520 L492 520 L412 500 L412 431 L412 363 L412 294 L412 225 L412 157 L412 88 L408 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="408" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">3. back, then down the</tspan><tspan x="355.5" y="472.1">stem</tspan></text></svg><rect x="496" y="42" width="150" height="247.78" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="496" y="42" width="150" height="247.78" viewBox="18 -624 675 1115" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M231 -212L174 -159L367 24L367 482L174 482L174 0L88 0L88 554L623 554L623 482L453 482L453 0L231 -212Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M124 520 L132 453 L132 384 L132 315 L132 246 L132 178 L132 109 L132 40 L132 109 L132 178 L132 246 L132 315 L132 384 L132 453 L124 520 L200 520 L275 520 L351 520 L426 511 L501 516 L576 520 L492 520 L412 500 L412 431 L412 363 L412 294 L412 225 L412 157 L412 88 L408 20 L408 20" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M408 20 L362 -34 L310 -82 L260 -132 L200 -168 L221 -179 L232 -200" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="232" cy="-200" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="355.5" y="406.1" text-anchor="middle" font-size="54.1" fill="#6b7280"><tspan x="355.5" y="406.1">4. into the angled tail</tspan></text></svg><text x="16" y="302.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Sankaran Radhakrishnan, Tamil Script Learners Manual, Appendix I: Hand-movements, Frame 3, ர</text><text x="16" y="315.28" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(University of Texas at Austin), p. 191</text><text x="16" y="327.78" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
