[project]
name = "perceptron"
version = "0.2.0"
description = "Object-Oriented Single Layer Neural Node"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adhithya Rajasekaran" }]
readme = "README.md"
dependencies = [
    "coding-adventures-matrix", "coding-adventures-loss-functions", "activation-functions"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.uv.sources]
coding-adventures-matrix = { path = "../matrix", editable = true }
coding-adventures-loss-functions = { path = "../loss-functions", editable = true }
activation-functions = { path = "../activation-functions", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perceptron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=perceptron --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
