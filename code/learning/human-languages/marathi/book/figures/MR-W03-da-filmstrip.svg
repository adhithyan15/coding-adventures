<svg xmlns="http://www.w3.org/2000/svg" width="502" height="348.93" viewBox="0 0 502 348.93" role="img" aria-label="How to write द: 3 strokes · 2 pen lifts · 3 movements"><title>Writing द</title><desc>3 frames; frame N shows movements 1 to N of द (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-द-order.gif’, strokes 1–3, Wikimedia Commons, 8 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%A6-order.gif&gt;. Source note on variation: The 18-frame animation shows three ordered pen-down runs: frames 2–3 descend the short stem top-to-bottom; frames 4–13 restart at its lower junction, sweep left through the shoulder and around the outer body, curl inward and clockwise through the loop, then continue down-right through the tail without lifting; frames 14–17 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for two intervening lifts. The 250 ms holds at frames 3 and 13 mark the first two run endings before the one-second completed frame. The Central Hindi Directorate&apos;s 2019 Deskbook on Orthography of Devanagari Script, Lesson 2, Unit VI, p. 32, independently confirms the short stem, outer body, inward curl-tail, and headline order, while staging the outer body and curl-tail separately rather than proving their join. This learner path takes its three-run lift count from the animation and fits its curves to Noto Sans Devanagari; everyday handwriting may divide or simplify the body differently.</desc><rect x="0" y="0" width="502" height="348.93" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 3 movements</text><rect x="16" y="42" width="150" height="242.93" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="242.93" viewBox="-70 -692 681 1102.9" pr