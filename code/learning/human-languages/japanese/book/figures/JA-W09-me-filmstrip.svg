<svg xmlns="http://www.w3.org/2000/svg" width="662" height="328.08" viewBox="0 0 662 328.08" role="img" aria-label="How to write め: 2 strokes · 1 pen lift · 4 movements"><title>Writing め</title><desc>4 frames; frame N shows movements 1 to N of め (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after Sirgazil, Hiragana め stroke order animation.gif, hiragana め, 32 frames, 3.2 seconds (Wikimedia Commons, 1 October 2009) &lt;https://commons.wikimedia.org/wiki/File:Hiragana_%E3%82%81_stroke_order_animation.gif&gt;. Source note on variation: The CC0 animation draws め in two pen-down runs with one lift: the left descending curve, then a high central restart that crosses the first stroke, loops around the lower left, sweeps upward across the top, and continues clockwise around the broad right curve to its lower finish. The learner path is fitted to the bundled Noto Sans JP subset; handwritten loop width and crossing position vary, but the two-run order remains the same.</desc><rect x="0" y="0" width="662" height="328.08" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 4 movements</text><rect x="16" y="42" width="150" height="222.08" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="222.08" viewBox="16 -852 960 1421.3" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M669 774Q666 762 663 747.5Q660 733 657.5 719Q655 705 652 696Q638 633 618.5 566Q599 499 575 433Q551 367 523.5 310Q496 253 466 211Q428 159 389.5 117.5Q351 76 311 53Q271 30 225 30Q188 30 156 51Q124 72 105 112Q86 152 86 210Q86 273 109.5 336Q133 399 174.5 452Q216 505 268 540Q342 591 417 612Q492 633 568 633Q666 633 742.5 592Q819 551 862.5 477.5Q906 404 906 306Q906 207 861.5 133.5Q817 60 736.5 15.5Q656 -29 549 -