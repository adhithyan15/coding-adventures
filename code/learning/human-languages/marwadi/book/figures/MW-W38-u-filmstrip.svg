<svg xmlns="http://www.w3.org/2000/svg" width="502" height="343.72" viewBox="0 0 502 343.72" role="img" aria-label="How to write उ: 2 strokes · 1 pen lift · 3 movements"><title>Writing उ</title><desc>3 frames; frame N shows movements 1 to N of उ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Saurmandal, ‘Devanagari उ stroke order.svg’, panels 1–2, Wikimedia Commons, 5 August 2023 &lt;https://commons.wikimedia.org/wiki/File:Devanagari_%E0%A4%89_stroke_order.svg&gt;. Source note on variation: The two-panel diagram shows two ordered pen-down runs. Panel 1 marks one green start at the headline junction: its first arrow curves down and left around the upper bowl, and its second arrow carries the same run back through the waist and down around the lower loop without lifting. Panel 2 restarts at the headline&apos;s left edge and draws the shirorekhā left-to-right, for one intervening lift. This learner path follows that modern printed teaching form and fits its turns and directions to Noto Sans Devanagari. Other handwriting may simplify the curves, so this is a sourced learner path rather than a universal standard.</desc><rect x="0" y="0" width="502" height="343.72" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="237.72" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="237.72" viewBox="-70 -692 703 1114.1" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M0 622L563 622L563 551L0 551L0 622ZM418 563Q444 542 457.5 514Q471 486 471 452Q471 405 445 368.5Q419 332 367.5 310Q316 288 238 283L222 356Q311 364 350.5 386Q390 408 390 458Q390 494 368.5 522Q347 550 312 563L418 563ZM400 346Q453 304 476 261Q4