<svg xmlns="http://www.w3.org/2000/svg" width="342" height="379.86" viewBox="0 0 342 379.86" role="img" aria-label="How to write د: one unbroken stroke · 2 movements"><title>Writing د</title><desc>2 frames; frame N shows movements 1 to N of د (perso-arabic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Persian Online, How to Write Persian Characters, د demonstration at 01:04–01:06 (Liberal Arts Instructional Technology Services, Univ. of Texas at Austin) &lt;https://laits.utexas.edu/persian_grammar/video/gr/kooroshalphabet&gt;. Source note on variation: The cited freehand lesson demonstrates isolated د as one continuous Naskh motion: it begins at the upper tip, folds through the shoulder, and turns left along the baseline without lifting. This non-connector does not join to a following letter; the learner path fits the vendored Noto Naskh outline and records Persian-scoped provenance rather than borrowing the separate Arabic or Urdu د sources.</desc><rect x="0" y="0" width="342" height="379.86" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="236.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="236.36" viewBox="-36 -468 478 753.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L270 350" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="342" cy="100" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">1. begin at the upper</tspan><tspan x="203" y="225">tip and descend through</tspan><tspan x="203" y="271.8">the folded shoulder</tspan></text></svg><rect x="176" y="42" width="150" height="236.36" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="236.36" viewBox="-36 -468 478 753.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M156 0Q34 0 34 63Q34 80 38.5 93Q43 106 52 116Q77 96 109 86Q141 76 188 76Q255 76 324 97Q316 119 305.5 142Q295 165 282 188Q255 236 242 261Q229 286 225 301Q221 316 221 332Q221 357 234 373.5Q247 390 273 398Q282 376 293.5 349Q305 322 317 296Q329 270 337 251Q352 219 362 191.5Q372 164 372 141Q372 131 368 115Q364 99 356 79.5Q348 60 336 39Q300 20 255 10Q210 0 156 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M270 350 L260 325 L260 300 L270 275 L285 245 L300 215 L318 185 L333 155 L343 130 L345 110 L342 100 L342 100" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M342 100 L320 90 L290 75 L250 60 L210 50 L170 40 L130 40 L90 50 L60 65" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="60" cy="65" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="203" y="178.3" text-anchor="middle" font-size="38.3" fill="#6b7280"><tspan x="203" y="178.3">2. turn left along the</tspan><tspan x="203" y="225">baseline without lifting</tspan></text></svg><text x="16" y="291.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Persian Online, How to Write Persian</text><text x="16" y="303.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Characters, د demonstration at 01:04–01:06 (Liberal Arts</text><text x="16" y="316.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Instructional Technology Services, Univ. of Texas at</text><text x="16" y="328.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Austin)</text><text x="16" y="341.36" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="353.86" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
