[package]
name = "algol-iir-compiler"
version = "0.183.0"
edition = "2021"
description = "ALGOL 60 scalar frontend for the LANG VM Rust chain, lowering parsed ALGOL into interpreter_ir::IIRModule. v0.89.0 merges complementary report-style formal specifications such as `integer a; array a;` while rejecting duplicate or conflicting type/kind parts; v0.88.0 validates procedure headings before lowering: formal names are unique and value/specification names belong to the formal list; v0.76.0 (mutual recursive formal procedures): direct procedure formals close a finite mutual-recursion graph by reusing active specialised siblings without an IIR procedure descriptor; v0.75.0 (recursive formal procedures): a self-recursive direct procedure formal reuses its active specialised sibling and retains its static target without an IIR procedure descriptor; v0.74.0 (nested capturing procedure actuals): direct nested procedures may capture an enclosing value formal through a specialised procedure-formal sibling; v0.73.0 (value formal procedures): direct `value procedure` actuals reuse specialised direct targets without an IIR procedure descriptor; v0.72.0 (standard output formal procedures): direct `print`/`output` actuals reuse statement-only output lowering through specialised procedure-formal siblings; v0.71.0 (standard function formal procedures): direct implemented standard-function actuals reuse their inline lowering through specialised procedure-formal siblings; v0.70.0 (direct formal procedures): direct declared procedure actuals are captured in specialised siblings and invoked without a function-pointer ABI; v0.69.0 (AL7 recursive scalar remapping): direct siblings may self- and mutually recurse while remapping scalar name formals directly to active same-typed formals; v0.68.0 (AL7 recursive scalar forwarding): direct siblings may self- and mutually recurse when scalar name formals are forwarded unchanged; v0.67.0 (AL7 recursive name arrays): direct name-array siblings may self- and mutually recurse through typed caller descriptors; v0.66.0 (AL7 direct call-by-name): direct integer/real/boolean/string scalar formals re-evaluate caller expressions and direct array formals retain typed caller descriptors; v0.41.0 (scalar-formal capture): nested procedures share enclosing scalar value parameters; v0.40.0 (switch designators): conditional and nested switch-list elements evaluate at computed-goto time; v0.39.0 (array-formal capture): nested procedures retain enclosing array handles and declared bounds; v0.38.0 (zero-argument procedures): explicit `f()` calls work in value and statement position; v0.37.0 (rank-aware array parameters): integer/real/string array value parameters carry a typed handle plus all lower bounds and row-major strides; v0.36.0 (AL1 numeric promotion): integer values widen through `int_to_real` whenever a real is required; v0.35.0 (AL8 array parameters): one-dimensional integer/real/string array value parameters carry a handle and declared lower bound across calls; v0.34.0 (AL7 static strings): captured and own scalar strings use typed persistent globals; v0.33.0 (AL6 own arrays): static arrays allocate once and persist across procedure calls; v0.32.0 (AL captured arrays): procedures retain enclosing array handles and declared bounds; v0.31.0 (E4d-AL string arrays): `string array` reuses the shared array<str> substrate; v0.30.0 (E4d-AL runtime ordering): initialized scalar strings can receive a string-procedure result and participate in lexical ordering across the LANG VM/AOT/JIT chain; v0.29.0 (E4d-AL runtime locals): initialized scalar strings can receive a string-procedure result and then be copied, compared, and printed; v0.28.0 (E4d-AL): `string procedure`s return runtime strings; v0.27.0 (AL-pow): `↑` exponentiation; v0.26.0 (AL-multidim-bounds): multidim arrays with arbitrary/negative per-dimension lower bounds."

[dependencies]
coding-adventures-algol-parser = { path = "../algol-parser" }
interpreter-ir = { path = "../interpreter-ir" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
vm-core = { path = "../vm-core" }

[dev-dependencies]
aot-core = { path = "../aot-core" }
iir-to-beam = { path = "../iir-to-beam" }
iir-to-cil-bytecode = { path = "../iir-to-cil-bytecode" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-llvm = { path = "../iir-to-llvm" }
iir-to-wasm = { path = "../iir-to-wasm" }
jit-core = { path = "../jit-core" }
