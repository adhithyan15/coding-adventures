<svg xmlns="http://www.w3.org/2000/svg" width="502" height="360.41" viewBox="0 0 502 360.41" role="img" aria-label="How to write ک: 2 strokes · 1 pen lift · 3 movements"><title>Writing ک</title><desc>3 frames; frame N shows movements 1 to N of ک (urdu-nastaliq), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoNaskhArabic-Static.ttf. Stroke order after Zer o Zabar, Be, kāf, and short vowels, independent ک calligraphic and handwriting animations and Kāf instructions (Northwestern University Libraries Open Textbook, 2026) &lt;https://openbooks.library.northwestern.edu/zerozabar/chapter/be-kaf-and-short-vowels/&gt;. Source note on variation: Both independent-form animations and the adjacent prose show two separate pen strokes. First draw the stem as part of the main line, continuing right to left through the flatter bowl and pronounced final hook without lifting. Then lift once, return to the upper right, and draw the long downward slash toward the stem; the lesson explicitly says not to write kāf in one penstroke. Final and independent kāf are often flatter than be and have a more pronounced hook at the end. This learner path fits that order to the course&apos;s vendored Noto Naskh fallback; Urdu uses ک rather than Arabic ك, is conventionally printed in Nastaliq, and the app&apos;s true Nastaliq face remains separate from this canonical script-data fallback.</desc><rect x="0" y="0" width="502" height="360.41" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 3 movements</text><rect x="16" y="42" width="150" height="241.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="241.91" viewBox="-2 -724 776 1251.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M308 0Q221 0 167.5 17Q114 34 89 68Q68 98 68 141Q68 152 69.5 162.5Q71 173 74 184Q77 195 81 205L117 205Q115 196 114 185.5Q113 175 113 164Q113 141 124.5 124Q136 107 159 97Q182 87 221.5 81.5Q261 76 316 76Q374 76 423 81Q472 86 516.5 99Q561 112 603 135Q591 169 568.5 200Q546 231 510 259Q487 278 457.5 296Q428 314 393 331Q380 328 368 328Q341 328 324 346.5Q307 365 307 393Q307 404 310 419.5Q313 435 317.5 450Q322 465 326 476Q330 487 333 488Q401 523 449 547Q497 571 535 588.5Q573 606 609 621Q645 636 688 654Q696 648 700 640.5Q704 633 704 622Q704 598 693.5 582Q683 566 661 558Q593 530 535 505Q477 480 429 459Q381 438 343 420Q421 401 491 357.5Q561 314 602 262Q643 209 643 164Q643 84 559.5 42Q476 0 308 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M620 250 L620 250" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M620 250 L622 200 L620 150" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="620" cy="150" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="386" y="202.2" text-anchor="middle" font-size="62.2" fill="#6b7280"><tspan x="386" y="202.2">1. draw the independent</tspan><tspan x="386" y="278.1">stem downward</tspan></text></svg><rect x="176" y="42" width="150" height="241.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="241.91" viewBox="-2 -724 776 1251.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M308 0Q221 0 167.5 17Q114 34 89 68Q68 98 68 141Q68 152 69.5 162.5Q71 173 74 184Q77 195 81 205L117 205Q115 196 114 185.5Q113 175 113 164Q113 141 124.5 124Q136 107 159 97Q182 87 221.5 81.5Q261 76 316 76Q374 76 423 81Q472 86 516.5 99Q561 112 603 135Q591 169 568.5 200Q546 231 510 259Q487 278 457.5 296Q428 314 393 331Q380 328 368 328Q341 328 324 346.5Q307 365 307 393Q307 404 310 419.5Q313 435 317.5 450Q322 465 326 476Q330 487 333 488Q401 523 449 547Q497 571 535 588.5Q573 606 609 621Q645 636 688 654Q696 648 700 640.5Q704 633 704 622Q704 598 693.5 582Q683 566 661 558Q593 530 535 505Q477 480 429 459Q381 438 343 420Q421 401 491 357.5Q561 314 602 262Q643 209 643 164Q643 84 559.5 42Q476 0 308 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M620 250 L622 200 L620 150" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M620 150 L620 150 L570 100 L500 65 L400 40 L300 35 L210 50 L140 85 L95 125 L95 185" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="95" cy="185" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="386" y="202.2" text-anchor="middle" font-size="62.2" fill="#6b7280"><tspan x="386" y="202.2">2. flow right to left</tspan><tspan x="386" y="278.1">through the flatter</tspan><tspan x="386" y="354">bowl and finish with</tspan><tspan x="386" y="429.9">the hook without</tspan><tspan x="386" y="505.7">lifting</tspan></text></svg><rect x="336" y="42" width="150" height="241.91" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="241.91" viewBox="-2 -724 776 1251.5" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M308 0Q221 0 167.5 17Q114 34 89 68Q68 98 68 141Q68 152 69.5 162.5Q71 173 74 184Q77 195 81 205L117 205Q115 196 114 185.5Q113 175 113 164Q113 141 124.5 124Q136 107 159 97Q182 87 221.5 81.5Q261 76 316 76Q374 76 423 81Q472 86 516.5 99Q561 112 603 135Q591 169 568.5 200Q546 231 510 259Q487 278 457.5 296Q428 314 393 331Q380 328 368 328Q341 328 324 346.5Q307 365 307 393Q307 404 310 419.5Q313 435 317.5 450Q322 465 326 476Q330 487 333 488Q401 523 449 547Q497 571 535 588.5Q573 606 609 621Q645 636 688 654Q696 648 700 640.5Q704 633 704 622Q704 598 693.5 582Q683 566 661 558Q593 530 535 505Q477 480 429 459Q381 438 343 420Q421 401 491 357.5Q561 314 602 262Q643 209 643 164Q643 84 559.5 42Q476 0 308 0Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M620 250 L622 200 L620 150 L570 100 L500 65 L400 40 L300 35 L210 50 L140 85 L95 125 L95 185" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__done" d="M680 625 L680 625" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M680 625 L600 590 L520 550 L440 510 L365 470 L335 425 L355 400 L390 380 L425 360 L460 340 L480 320 L520 300 L540 280 L560 260" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="560" cy="260" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="386" y="202.2" text-anchor="middle" font-size="62.2" fill="#6b7280"><tspan x="386" y="202.2">3. lift, then draw the</tspan><tspan x="386" y="278.1">long slash down from</tspan><tspan x="386" y="354">the upper right toward</tspan><tspan x="386" y="429.9">the stem</tspan></text></svg><text x="16" y="296.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Zer o Zabar, Be, kāf, and short vowels, independent ک calligraphic and</text><text x="16" y="309.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">handwriting animations and Kāf instructions (Northwestern University Libraries Open</text><text x="16" y="321.91" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Textbook, 2026)</text><text x="16" y="334.41" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
