<svg xmlns="http://www.w3.org/2000/svg" width="822" height="321.95" viewBox="0 0 822 321.95" role="img" aria-label="How to write を: 3 strokes · 2 pen lifts · 5 movements"><title>Writing を</title><desc>5 frames; frame N shows movements 1 to N of を (japanese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansJP-Subset.ttf. Stroke order after KanjiVG, kanji/03092.svg, hiragana を (U+3092 HIRAGANA LETTER WO), three stroke paths kvg:03092-s1 to s3 (Ulrich Apel and contributors, CC BY-SA 3.0) &lt;https://github.com/KanjiVG/kanjivg/blob/master/kanji/03092.svg&gt;. Source note on variation: KanjiVG stores each stroke as one directed path in writing order: s1 is the short bar drawn left to right; s2 starts above the bar, descends left through it, turns back sharply without lifting and runs up and right into the arch and down its short stem; s3 starts at the right, sweeps down and left across the middle and rounds the lower left into the rightward base. Only the order and direction are taken from that file. The learner path&apos;s coordinates are the bundled Noto Sans JP outline&apos;s own medial line, so the print glyph&apos;s proportions, not KanjiVG&apos;s handwriting-style ones, decide where each stroke runs.</desc><rect x="0" y="0" width="822" height="321.95" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="215.95" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="215.95" viewBox="25 -868 927 1334.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M460 791Q454 761 444.5 720.5Q435 680 414 629Q396 584 369.5 536Q343 488 313 449Q332 461 356 469.5Q380 478 405.5 482Q431 486 452 486Q510 486 550 453.5Q590 421 590 359Q590 340 590 310.5Q590 281 590.5 248.5