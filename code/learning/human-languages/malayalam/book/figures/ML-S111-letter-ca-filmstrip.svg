<svg xmlns="http://www.w3.org/2000/svg" width="662" height="265.73" viewBox="0 0 662 265.73" role="img" aria-label="How to write ച: one unbroken stroke · 4 movements"><title>Writing ച</title><desc>4 frames; frame N shows movements 1 to N of ച (malayalam), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansMalayalam-Static.ttf. Stroke order after Rodney F. Moag, Malayalam: A University Course and Reference Grammar (University of Texas at Austin South Asia Institute and COERLL, updated April 2018; CC BY-NC-SA 4.0), Table IV &apos;How to Write Consonant Symbols&apos;, p. xxvi: movements 1-4 for ച, written by hand by Thomas Joseph &lt;https://github.com/matjic/malayalam/blob/7141acd2f310bc8928822a7aec61d1149efa6fa3/docs/assets/images/front-writing-036.jpg&gt;. Source note on variation: Moag&apos;s Table IV (p. xxvi) starts at the inner tip and curls clockwise over the top and down (1), runs left along the base to its end (2), runs back right along the whole base (3) and climbs the upright (4). Moag&apos;s book is CC BY-NC-SA 4.0, so only these facts (order, start, direction and end) are cited; no drawing is copied. The page is read from the scan in Mathew Jacob&apos;s digital edition (github.com/matjic/malayalam, commit 7141acd), which notes that the numbers mark drawing movements that can belong to one continuous stroke, not pen lifts. The grahyam online-handwriting samples (github.com/bluebottlewize/grahyam, no licence, cited as counts only) keep no pen-up marker; 44 of the 45 unique samples show no jump between consecutive points of the kind a lift makes, and they most often start at the middle centre (19 of 45) and end at the upper right (45 of 45). SPACE Kerala&apos;s Thooval (GPL-3.0, facts only) starts its CA.png at the middle left and ends it at the upper right. One of the 45 grahyam samples lifts once. The path is fitted to the bundled Noto Sans Malayalam outline rather than to Moag&apos;s drawing; the run back along the base retraces the ink just drawn.</desc><rect x="0" y="0" width="662" height="265.73" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 4 movements</text><rect x="16" y="42" width="150" height="147.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="147.23" viewBox="-53 -624 985 966.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M862 554L862 0L17 0L17 70L448 70L394 58Q414 72 434.5 101.5Q455 131 455 179Q455 231 428.5 263Q402 295 351 295Q300 295 273.5 265Q247 235 247 185Q247 172 248 162.5Q249 153 250 146L167 135Q165 145 163 161.5Q161 178 161 194Q161 271 213.5 318Q266 365 354 365Q404 365 439 350Q474 335 496 309Q518 283 528.5 251Q539 219 539 185Q539 156 531.5 131.5Q524 107 511.5 87.5Q499 68 485 54L460 70L776 70L776 554L862 554Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M205 176 L205 176" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M205 176 L213 243 L257 296 L317 326 L385 328 L447 301 L485 244 L497 178 L481 112 L457 48" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="457" cy="48" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="439.5" y="218.9" text-anchor="middle" font-size="78.9" fill="#6b7280"><tspan x="439.5" y="218.9">1. curl clockwise over</tspan><tspan x="439.5" y="315.2">the top</tspan></text></svg><rect x="176" y="42" width="150" height="147.23" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="147.23" viewBox="-53 -624 985 966.8" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M862 554L862 0L17 0L17 70L448 70L394 58Q414 72 434.5 101