# ================================================================
# Publish — the VER31 release gate, then crates.io, npm, PyPI, RubyGems
# ================================================================
#
# What this workflow is for (VER31, code/specs/VER31-tiered-release-standard.md)
# -----------------------------------------------------------------------------
# A package is published at exactly the tier its evidence computes, with every
# assumption it rests on listed in the package (ASSURANCE.md). Nothing here
# types a tier: code/scripts/release_gate.py computes it from the generated
# assurance_report.json and code/assumptions/buckets-v1.json.
#
# Jobs, in order:
#
#   parse-tag    validate the tag (or the dry-run inputs) and find the package
#   verify-tag   the tag is annotated, hardware-key signed by a signer on main,
#                and peels to this commit (release events only)
#   gate         contents: read ONLY. Runs the package BUILD (tests, evidence),
#                checks the evidence reproduces byte for byte, lint, coverage,
#                builds the artifact and runs release_gate.py. Every piece of
#                package, test and dependency code runs HERE, with no token.
#   attest       installs nothing, checks out nothing: re-hashes the gated
#                artifact against gate.json and attests its provenance. The
#                only job with id-token/attestations outside `release`.
#   publish-*    environment `release` (the owner approves in the web UI),
#                publish the gated bytes with OIDC trusted publishing.
#
# Triggers:
#
#   release            a GitHub Release for a tag <language>/<name>/v<semver>.
#   workflow_dispatch  a DRY RUN: parse + gate only. No attestation, no publish,
#                      no tag check. The owner never approves a `release`
#                      deployment for a workflow_dispatch run (VER31 section 7).
#
# Tag format: <language>/<name>/v<version>
#   rust/<dir>/v0.1.0, typescript/<dir>/v0.2.0  (<dir> = package directory;
#                                                the registry name comes from
#                                                Cargo.toml / package.json)
#   python/coding-adventures-<x>/v..., ruby/coding_adventures_<x>/v...
#
# Other products release from this repository under their own tags
# (task-app-v*, engram-v*, ...). Those are not ours: parse-tag only runs for
# the four prefixes above, and every downstream job needs it, so a foreign
# release skips this workflow instead of failing it.
#
# The tag is attacker-shaped text. Git ref names may contain `$`, `(`, `)`,
# `;`, `|` and `${IFS}`, and anyone who can push a tag can publish a release.
# So the tag (and every dispatch input) never appears inside a `run:` script:
# it reaches the shell only as an environment variable, and it is checked
# against a strict pattern before anything is written to $GITHUB_OUTPUT.
# Downstream jobs read those outputs through env: as well.
#
# GitHub runs this file as it exists at the TAGGED commit, so the checks in it
# are only as trustworthy as that commit (VER31 section 9.2). The controls that
# do not depend on this YAML are: owner-only tag rulesets, trusted publishers
# pinned to environment `release`, and the owner's informed approval. The gate
# also runs release_gate.py as it exists on main, not the tagged copy.
#
# First version of a package: crates.io and npm have no pending publishers, so
# OIDC cannot publish a package that does not exist yet. The publish job stops
# with instructions; the owner publishes the gated, attested artifact by hand
# once and registers the trusted publisher (VER31 section 9.3).
# ================================================================

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory, e.g. code/packages/rust/ct-compare (dry run)"
        required: true
        type: string
      version:
        description: "Version to check against the manifest, e.g. 0.1.0"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a publish mid-flight

permissions:
  contents: read

jobs:
  # ── Parse the release tag (or the dry-run inputs) ─────────────
  parse-tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'python/') ||
      startsWith(github.event.release.tag_name, 'ruby/') ||
      startsWith(github.event.release.tag_name, 'rust/') ||
      startsWith(github.event.release.tag_name, 'typescript/')
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.parse.outputs.language }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      pkg_dir: ${{ steps.parse.outputs.pkg_dir }}
      has_native: ${{ steps.parse.outputs.has_native }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # History (without file contents) for the main-ancestry check.
          fetch-depth: 0
          filter: blob:none

      # A release can be published for a tag on any commit, including one
      # that never merged. Every publish job below checks out and builds
      # that commit. So only commits already on main are published. A dry
      # run may check any ref, because it never attests or publishes.
      - name: Require the tagged commit to be on main
        if: github.event_name == 'release'
        run: |
          # Fully qualified: a bare `main` would prefer a tag named main over
          # the branch (git resolves refs/tags/ before refs/heads/), and
          # anyone who can push tags could point that tag at their commit.
          git fetch --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The release tag's commit ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Parse release tag or dry-run inputs
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z]+)*$'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Dry run: the inputs are untrusted strings too, held to the same
            # strict shapes as a tag. Only rust/ and typescript/ have a gate.
            if ! [[ "$INPUT_PACKAGE" =~ ^code/packages/(rust|typescript)/[A-Za-z0-9_-]+$ ]]; then
              echo "::error::package must be code/packages/<rust|typescript>/<name>"
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ $VERSION_PATTERN ]]; then
              echo "::error::version must be semver"
              exit 1
            fi
            LANGUAGE=$(echo "$INPUT_PACKAGE" | cut -d'/' -f3)
            PACKAGE=$(echo "$INPUT_PACKAGE" | cut -d'/' -f4)
            VERSION="$INPUT_VERSION"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            # Expected format: language/package-name/vX.Y.Z, optionally with a
            # pre-release or post-release suffix in semver (v1.2.3-rc.1), PEP 440
            # (v1.2.3rc1, v1.2.3.post1) or RubyGems (v1.2.3.pre) style. The
            # package name is letters, digits, `-` and `_` only, so no `/`, `.`
            # or shell metacharacter can reach PKG_DIR or any output.
            TAG_PATTERN='^(python|ruby|rust|typescript)/[A-Za-z0-9_-]+/v[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z]+)*$'
            if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
              echo "::error::Release tag is not <python|ruby|rust|typescript>/<package>/v<semver>; refusing to publish."
              exit 1
            fi
            LANGUAGE=$(echo "$TAG" | cut -d'/' -f1)
            PACKAGE=$(echo "$TAG" | cut -d'/' -f2)
            VERSION=$(echo "$TAG" | cut -d'/' -f3 | sed 's/^v//')
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          echo "language=$LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Resolve package directory
          if [ "$LANGUAGE" = "python" ]; then
            # Strip the coding-adventures- prefix to get the directory name
            DIR_NAME="${PACKAGE#coding-adventures-}"
            PKG_DIR="code/packages/python/${DIR_NAME}"
            # Fall back to programs directory if not found in packages
            if [ ! -d "$PKG_DIR" ]; then
              PKG_DIR="code/programs/python/${DIR_NAME}"
            fi
          elif [ "$LANGUAGE" = "ruby" ]; then
            # Strip the coding_adventures_ prefix to get the directory name
            DIR_NAME="${PACKAGE#coding_adventures_}"
            PKG_DIR="code/packages/ruby/${DIR_NAME}"
          elif [ "$LANGUAGE" = "rust" ] || [ "$LANGUAGE" = "typescript" ]; then
            # Rust and TypeScript tags name the package DIRECTORY; the
            # registry name is read from Cargo.toml / package.json.
            DIR_NAME="$PACKAGE"
            PKG_DIR="code/packages/${LANGUAGE}/${DIR_NAME}"
          else
            echo "::error::Unsupported language: $LANGUAGE"
            exit 1
          fi

          if [ -z "$DIR_NAME" ]; then
            echo "::error::The tag names no package after the language prefix."
            exit 1
          fi
          if [ ! -d "$PKG_DIR" ]; then
            echo "::error::Package directory not found: $PKG_DIR"
            exit 1
          fi
          # A directory alone is not a package: require the build file the
          # publish job will use.
          if [ "$LANGUAGE" = "python" ] && [ ! -f "$PKG_DIR/pyproject.toml" ]; then
            echo "::error::$PKG_DIR has no pyproject.toml"
            exit 1
          fi
          if [ "$LANGUAGE" = "ruby" ] && ! compgen -G "$PKG_DIR/*.gemspec" > /dev/null; then
            echo "::error::$PKG_DIR has no .gemspec"
            exit 1
          fi
          if [ "$LANGUAGE" = "rust" ] && [ ! -f "$PKG_DIR/Cargo.toml" ]; then
            echo "::error::$PKG_DIR has no Cargo.toml"
            exit 1
          fi
          if [ "$LANGUAGE" = "typescript" ] && [ ! -f "$PKG_DIR/package.json" ]; then
            echo "::error::$PKG_DIR has no package.json"
            exit 1
          fi

          echo "pkg_dir=$PKG_DIR" >> "$GITHUB_OUTPUT"

          # Check for native extensions (Cargo.toml = maturin/PyO3)
          if [ "$LANGUAGE" = "python" ] && [ -f "$PKG_DIR/Cargo.toml" ]; then
            echo "has_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_native=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Release Info ==="
          echo "Event:    $EVENT"
          echo "Language: $LANGUAGE"
          echo "Package:  $PACKAGE"
          echo "Version:  $VERSION"
          echo "Dir:      $PKG_DIR"

  # ── VER31 9.1: the tag is hardware-key signed by a signer on main ──
  verify-tag:
    needs: parse-tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the signed tag with main's gate and main's signers
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # actions/checkout may not keep the annotated tag object, so fetch
          # it explicitly. TAG was pattern-checked in parse-tag.
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          # Run the gate as it exists on main, not the tagged copy.
          git show refs/remotes/origin/main:code/scripts/release_gate.py > "$RUNNER_TEMP/release_gate.py"
          python3 "$RUNNER_TEMP/release_gate.py" --repo-root "$GITHUB_WORKSPACE" verify-tag \
            --tag "$TAG" --commit "$GITHUB_SHA" --signers-ref refs/remotes/origin/main

  # ── VER31 7: the gate. contents: read, no token, runs all package code ──
  gate:
    needs: parse-tag
    if: needs.parse-tag.outputs.language == 'rust' || needs.parse-tag.outputs.language == 'typescript' || needs.parse-tag.outputs.language == 'python' || needs.parse-tag.outputs.language == 'ruby'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_file: ${{ steps.pack.outputs.artifact_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse languages without a gate yet (VER31 LV-007c)
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
        run: |
          # Python and Ruby packages have no assurance report yet, so the
          # VER31 floor (F10: the report ships verbatim) cannot pass. Refuse
          # here, loudly, rather than let their publish jobs run ungated.
          if [ "$LANGUAGE" = "python" ] || [ "$LANGUAGE" = "ruby" ]; then
            echo "::error::VER31: $LANGUAGE packages have no release gate yet (backlog LV-007c); refusing to publish."
            exit 1
          fi

      - name: Fetch main and take the gate script from it
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show refs/remotes/origin/main:code/scripts/release_gate.py > "$RUNNER_TEMP/release_gate.py"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.100.0"
          components: clippy,llvm-tools

      - name: Set up Node
        if: needs.parse-tag.outputs.language == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'

      - name: Install strace for the live runtime jail (VER08b)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q strace

      - name: Run the package BUILD (F1) and require it to reproduce its evidence (F10a)
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          set -euo pipefail
          BUILD_FILE="$PKG_DIR/BUILD"
          if [ -f "$PKG_DIR/BUILD_linux" ]; then BUILD_FILE="$PKG_DIR/BUILD_linux"; fi
          # The build tool runs each non-comment line with `sh -c` in the
          # package directory; do the same.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            echo "::group::$line"
            (cd "$PKG_DIR" && sh -c "$line")
            echo "::endgroup::"
          done < "$BUILD_FILE"
          # The BUILD rewrote the evidence manifests from real runs. If the
          # committed files differ, the shipped report describes other code.
          if ! git diff --exit-code -- "$PKG_DIR"; then
            echo "::error::The package BUILD did not reproduce its committed evidence; regenerate and commit it."
            exit 1
          fi
          if grep -q 'RCG_STRICT=1' "$BUILD_FILE"; then
            echo "JAIL_LIVE=1" >> "$GITHUB_ENV"
          fi

      - name: Check the report against its evidence (F10a)
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          PACKAGE: ${{ needs.parse-tag.outputs.package }}
        run: |
          set -euo pipefail
          cd code/packages/rust
          if [ "$LANGUAGE" = "rust" ]; then
            # --allow-unverified: the report still cites `unverified::` static
            # attestations (WD-008); the BUILD passes the same flag.
            cargo run -q -p coding_adventures_ca_assurance_report -- \
              --check "$GITHUB_WORKSPACE/$PKG_DIR/assurance_report.json" --allow-unverified
          else
            cargo run -q -p coding_adventures_ca_assurance_report -- \
              --check-lane "typescript/$PACKAGE" --repo-root "$GITHUB_WORKSPACE" --require-active
          fi

      - name: Lint (F3)
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          set -euo pipefail
          if [ "$LANGUAGE" = "rust" ]; then
            CRATE=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
            (cd "$PKG_DIR" && cargo clippy -p "$CRATE" --all-targets -- -D warnings)
          else
            (cd "$PKG_DIR" && npx --no-install tsc --noEmit -p tsconfig.json)
          fi

      - name: Coverage (F2)
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cov"
          if [ "$LANGUAGE" = "rust" ]; then
            # PINNED and --locked, as in ci.yml.
            cargo install cargo-tarpaulin --version 0.37.2 --locked
            CRATE=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
            (cd "$PKG_DIR" && cargo tarpaulin --engine llvm -p "$CRATE" --out Lcov --output-dir "$RUNNER_TEMP/cov")
          else
            (cd "$PKG_DIR" && npx --no-install vitest run --coverage --coverage.reporter=lcov \
              --coverage.reportsDirectory="$RUNNER_TEMP/cov")
          fi
          ls "$RUNNER_TEMP/cov"

      - name: Build the artifact (cargo package / npm pack)
        id: pack
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          GATE=(python3 "$RUNNER_TEMP/release_gate.py" --repo-root "$GITHUB_WORKSPACE")
          "${GATE[@]}" assurance --package "$PKG_DIR" --check
          if [ "$LANGUAGE" = "rust" ]; then
            CRATE=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
            (cd "$PKG_DIR" && cargo package -p "$CRATE")
            cp "code/packages/rust/target/package/${CRATE}-${VERSION}.crate" "$RUNNER_TEMP/dist/"
          else
            # A lane package ships its parent report verbatim (VER31 6.2).
            REPORT=$("${GATE[@]}" lane-report --package "$PKG_DIR")
            cp "$REPORT" "$PKG_DIR/assurance_report.json"
            (cd "$PKG_DIR" && npm run build && npm pack --pack-destination "$RUNNER_TEMP/dist")
            rm "$PKG_DIR/assurance_report.json"
          fi
          FILE_NAME=$(ls "$RUNNER_TEMP/dist" | head -1)
          echo "artifact_file=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT=$RUNNER_TEMP/dist/$FILE_NAME" >> "$GITHUB_ENV"

      - name: Ask the registry whether this version exists (F11)
        env:
          LANGUAGE: ${{ needs.parse-tag.outputs.language }}
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$LANGUAGE" = "rust" ]; then
            NAME=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
            URL="https://crates.io/api/v1/crates/${NAME}"
          else
            NAME=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$PKG_DIR/package.json")
            URL="https://registry.npmjs.org/${NAME/\//%2f}"
          fi
          CODE=$(curl -sS -o "$RUNNER_TEMP/registry.json" -w '%{http_code}' -A 'coding-adventures-release-gate' "$URL")
          case "$CODE" in
            404) echo "REGISTRY_HAS_VERSION=no" >> "$GITHUB_ENV" ;;
            200)
              # crates.io lists {"versions": [{"num": ...}]}; npm {"versions": {"x.y.z": ...}}.
              HAS=$(python3 -c 'import json,sys
          d = json.load(open(sys.argv[1])); v = d.get("versions") or []
          nums = [x.get("num") for x in v] if isinstance(v, list) else list(v)
          print("yes" if sys.argv[2] in nums else "no")' "$RUNNER_TEMP/registry.json" "$VERSION")
              echo "REGISTRY_HAS_VERSION=$HAS" >> "$GITHUB_ENV" ;;
            *) echo "::error::registry answered HTTP $CODE for $URL"; exit 1 ;;
          esac

      - name: Run the VER31 gate
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
          DRY_RUN: ${{ needs.parse-tag.outputs.dry_run }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ARGS=(check --package "$PKG_DIR" --version "$VERSION" --out "$RUNNER_TEMP/dist/gate.json"
                --artifact "$ARTIFACT" --lcov "$RUNNER_TEMP/cov/lcov.info"
                --tests-ran --lint-ran --report-check-ran --evidence-reproduced --trusted-publishing
                --registry-has-version "$REGISTRY_HAS_VERSION" --signers-ref refs/remotes/origin/main)
          if [ "${JAIL_LIVE:-}" = "1" ]; then ARGS+=(--jail-live); fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          else
            git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
            ARGS+=(--tag "$TAG" --commit "$GITHUB_SHA")
          fi
          python3 "$RUNNER_TEMP/release_gate.py" --repo-root "$GITHUB_WORKSPACE" "${ARGS[@]}"
          python3 "$RUNNER_TEMP/release_gate.py" --repo-root "$GITHUB_WORKSPACE" notes --gate "$RUNNER_TEMP/dist/gate.json" \
            --out "$RUNNER_TEMP/dist/RELEASE-NOTES.md"
          cat "$RUNNER_TEMP/dist/RELEASE-NOTES.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the gated artifact, gate.json and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gated-release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # ── VER31 7: attest. No checkout, no install, no package code ──
  attest:
    needs: [parse-tag, verify-tag, gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the gated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gated-release
          path: gated

      - name: Refuse unless the artifact is the one the gate judged
        env:
          ARTIFACT_FILE: ${{ needs.gate.outputs.artifact_file }}
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import json; print(json.load(open("gated/gate.json"))["artifact"]["sha256"])')
          DECISION=$(python3 -c 'import json; print(json.load(open("gated/gate.json"))["decision"])')
          GOT=$(sha256sum "gated/$ARTIFACT_FILE" | cut -d' ' -f1)
          if [ "$DECISION" != "publishable" ] || [ "$WANT" != "$GOT" ]; then
            echo "::error::gate decision $DECISION; artifact sha256 $GOT, gate.json says $WANT"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gated/${{ needs.gate.outputs.artifact_file }}

  # ── crates.io: OIDC, environment `release`, the gated bytes ──
  publish-crates:
    needs: [parse-tag, verify-tag, gate, attest]
    if: github.event_name == 'release' && needs.parse-tag.outputs.language == 'rust'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.100.0"

      - name: Download the gated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gated-release
          path: gated

      - name: Stop if this is the crate's first version (VER31 9.3)
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          NAME=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -A 'coding-adventures-release-gate' "https://crates.io/api/v1/crates/${NAME}")
          if [ "$CODE" = "404" ]; then
            echo "::error::$NAME is not on crates.io yet. crates.io has no pending publishers, so the first version is published by hand from the gated artifact (VER31 9.3): verify it with gh attestation verify, run cargo publish --no-verify with a publish-new token scoped to this crate (<= 1 day, env only), revoke it, then register this workflow and environment 'release' as the trusted publisher."
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::crates.io answered HTTP $CODE"
            exit 1
          fi

      - name: Re-package without building and compare with the gated .crate
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          ARTIFACT_FILE: ${{ needs.gate.outputs.artifact_file }}
        run: |
          set -euo pipefail
          CRATE=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$PKG_DIR/Cargo.toml" | head -1)
          (cd "$PKG_DIR" && cargo package -p "$CRATE" --no-verify)
          WANT=$(sha256sum "gated/$ARTIFACT_FILE" | cut -d' ' -f1)
          GOT=$(sha256sum "code/packages/rust/target/package/$ARTIFACT_FILE" | cut -d' ' -f1)
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::cargo package is not reproducible here ($GOT vs gated $WANT); refusing to publish."
            exit 1
          fi
          echo "CRATE=$CRATE" >> "$GITHUB_ENV"
          echo "CRATE_SHA=$WANT" >> "$GITHUB_ENV"

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish (verification already ran in the gate)
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          (cd "$PKG_DIR" && cargo publish -p "$CRATE" --no-verify)

      - name: Download the published crate and compare its digest
        env:
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -A 'coding-adventures-release-gate' -o published.crate \
              "https://static.crates.io/crates/${CRATE}/${CRATE}-${VERSION}.crate"; then break; fi
            sleep 20
          done
          GOT=$(sha256sum published.crate | cut -d' ' -f1)
          if [ "$GOT" != "$CRATE_SHA" ]; then
            echo "::error::crates.io serves $GOT, the gate judged $CRATE_SHA. Yank ${CRATE} ${VERSION}."
            exit 1
          fi

  # ── npm: OIDC, environment `release`, the gated tarball, no build ──
  publish-npm:
    needs: [parse-tag, verify-tag, gate, attest]
    if: github.event_name == 'release' && needs.parse-tag.outputs.language == 'typescript'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          registry-url: 'https://registry.npmjs.org'

      - name: Install an npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.21.2

      - name: Download the gated tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gated-release
          path: gated

      - name: Publish the gated bytes
        env:
          ARTIFACT_FILE: ${{ needs.gate.outputs.artifact_file }}
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import json; print(json.load(open("gated/gate.json"))["artifact"]["sha256"])')
          NAME=$(python3 -c 'import json; print(json.load(open("gated/gate.json"))["registry_name"])')
          GOT=$(sha256sum "gated/$ARTIFACT_FILE" | cut -d' ' -f1)
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::tarball sha256 $GOT, gate.json says $WANT"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2f}")
          if [ "$CODE" = "404" ]; then
            echo "::error::$NAME is not on npm yet. npm has no pending publishers, so the first version is published by hand from the gated tarball (VER31 9.3): verify it with gh attestation verify, npm publish <tarball> with security-key 2FA, then register this workflow and environment 'release' as the trusted publisher."
            exit 1
          fi
          # No NODE_AUTH_TOKEN: npm exchanges the OIDC token itself.
          npm publish "gated/$ARTIFACT_FILE" --provenance --access public

  # ── Python: Pure package (sdist + wheel, Linux only) ──────────
  # Gated (VER31): the gate job refuses Python until LV-007c gives these
  # packages reports and moves their build into the gate job.
  publish-python-pure:
    needs: [parse-tag, verify-tag, gate]
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # OIDC for Trusted Publishers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.17'

      - name: Install build tools
        run: pip install --disable-pip-version-check build==1.6.1

      - name: Build sdist and wheel
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: python -m build "$PKG_DIR"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: "${{ needs.parse-tag.outputs.pkg_dir }}/dist/"

  # ── Python: Native extension (maturin, OS x Python matrix) ───
  #
  # When a package contains Cargo.toml, it's a Rust/PyO3 native
  # extension. We build platform-specific wheels on all three
  # major OSes and for multiple Python versions, then upload
  # everything to PyPI in one shot. Gated like publish-python-pure.
  # ────────────────────────────────────────────────────────────────
  publish-python-native-build:
    needs: [parse-tag, verify-tag, gate]
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'true'
    strategy:
      matrix:
        include:
          # Linux — builds manylinux wheels (fastest)
          - os: ubuntu-latest
            target: x86_64
          # macOS — Apple Silicon (arm64)
          - os: macos-latest
            target: aarch64
          # macOS — Intel (x86_64)
          - os: macos-15-intel
            target: x86_64
          # Windows — x86_64
          - os: windows-latest
            target: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist
          working-directory: ${{ needs.parse-tag.outputs.pkg_dir }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ needs.parse-tag.outputs.pkg_dir }}/dist/*.whl

  # Collect all platform wheels + build sdist, then publish
  publish-python-native-upload:
    needs: [parse-tag, verify-tag, gate, publish-python-native-build]
    if: needs.parse-tag.outputs.language == 'python' && needs.parse-tag.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # OIDC for Trusted Publishers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build sdist (source distribution)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ needs.parse-tag.outputs.pkg_dir }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Copy sdist to dist
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          cp "$PKG_DIR/dist/"*.tar.gz dist/ 2>/dev/null || true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # ── Ruby: Build and publish gem ───────────────────────────────
  # Gated (VER31); LV-007c moves RubyGems to trusted publishing.
  publish-ruby:
    needs: [parse-tag, verify-tag, gate]
    if: needs.parse-tag.outputs.language == 'ruby'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.4.12'

      - name: Build gem
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
        run: |
          cd "$PKG_DIR"
          gem build *.gemspec

      - name: Publish to RubyGems
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.pkg_dir }}
          # gem push reads the key from the environment, so it is never
          # written to disk or spliced into the script text.
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          cd "$PKG_DIR"
          gem push *.gem
