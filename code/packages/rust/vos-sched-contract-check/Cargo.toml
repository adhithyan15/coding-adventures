[package]
name = "vos-sched-contract-check"
version = "0.1.0"
edition = "2021"
description = "Parses, type-checks and evaluates the Warrant text of vos-sched-contract (VOS-010) with the repository's Warrant tooling, until vos-link gen-doc (VOS-033) exists"

[lib]
name = "vos_sched_contract_check"
path = "src/lib.rs"

[dependencies]
# The contract under test: a normal dependency, so a change to the contract
# package selects this package's tests in the build graph.
vos-sched-contract = { path = "../vos-sched-contract" }
# The repository's Warrant parser, type checker and ground evaluator. This is
# the reason the checks live in their own crate and not in the contract crate:
# VOS03 SH12 allows a class K crate only `core`, contract crates and the two
# harness dev-dependencies, so the contract crate itself carries no Warrant
# tooling.
coding_adventures_warrant_grammar = { path = "../warrant-grammar" }

[[test]]
name = "warrant_contract"
path = "tests/warrant_contract.rs"
