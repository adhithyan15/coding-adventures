<svg xmlns="http://www.w3.org/2000/svg" width="502" height="280.05" viewBox="0 0 502 280.05" role="img" aria-label="How to write ુ: one unbroken stroke · 3 movements"><title>Writing ુ</title><desc>3 frames; frame N shows movements 1 to N of ુ (gujarati), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansGujarati-Static.ttf. Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates (interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/4_ku.svg, group g1 (stroke g1s0): the u sign drawn after the consonant (GitHub, 2026) &lt;https://github.com/gajjartejas/KanoAI/tree/9d3e2949a3f265448e430e15329093ea3aa516b8/interpolate-svg/svgs/barakhadi&gt;. Source note on variation: In the template for કુ, and in all 32 consonant rows whose consonant keeps its bare outline, ુ is one pen-down run that starts directly below the consonant, at the top of the sign, swings right and down round the bowl, and ends at its upper left. HP Labs India&apos;s Lipi Toolkit Devanagari recognizer (native writers&apos; pen traces of the matching Devanagari sign, written alone) agrees: 79 of its 83 stored prototypes of the u sign (95%) are one stroke, and 82% of those turn clockwise. KanoAI&apos;s templates are hand-made centre lines, one path per pen-down run, which the app animates in the author&apos;s handwriting order and direction; one template per sign is placed beside every consonant, so the row counts show consistency, not separate writers. KanoAI&apos;s LICENSE file says MIT while its README says GNU GPL, so the licence is ambiguous: only facts are cited here (order, start, direction and pen lifts), and no template path data was copied. The path is fitted to the bundled Noto Sans Gujarati outline of the sign on its own. Handwriting varies by writer.</desc><rect x="0" y="0" width="502" height="280.05" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 3 movements</text><rect x="16" y="42" width="150" height="161.55" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="161.55" viewBox="-531 -70 618 665.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-259 -268 -330.5 -222.5Q-402 -177 -461 -100L-399 -57Q-341 -130 -288 -163Q-235 -196 -162 -196Q-106 -196 -81.5 -178.5Q-57 -161 -57 -127Q-57 -97 -79.5 -82.5Q-102 -68 -137 -68Q-164 -68 -185 -73.5Q-206 -79 -227 -90L-253 -23Q-199 0 -142 0Q-65 0 -24 -37Q17 -74 17 -135Q17 -193 -28 -230.5Q-73 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-232 -55 L-232 -55" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-232 -55 L-195 -42 L-142 -33 L-90 -42 L-45 -75 L-22 -130" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-22" cy="-130" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-222" y="457.5" text-anchor="middle" font-size="49.5" fill="#6b7280"><tspan x="-222" y="457.5">1. start under the</tspan><tspan x="-222" y="517.9">consonant and swing to</tspan><tspan x="-222" y="578.3">the right</tspan></text></svg><rect x="176" y="42" width="150" height="161.55" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="161.55" viewBox="-531 -70 618 665.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-259 -268 -330.5 -222.5Q-402 -177 -461 -100L-399 -57Q-341 -130 -288 -163Q-235 -196 -162 -196Q-106 -196 -81.5 -178.5Q-57 -161 -57 -127Q-57 -97 -79.5 -82.5Q-102 -68 -137 -68Q-164 -68 -185 -73.5Q-206 -79 -227 -90L-253 -23Q-199 0 -142 0Q-65 0 -24 -37Q17 -74 17 -135Q17 -193 -28 -230.5Q-73 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-232 -55 L-195 -42 L-142 -33 L-90 -42 L-45 -75 L-22 -130 L-22 -130" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-22 -130 L-36 -185 L-80 -222 L-162 -232 L-240 -218" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-240" cy="-218" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-222" y="457.5" text-anchor="middle" font-size="49.5" fill="#6b7280"><tspan x="-222" y="457.5">2. round the bowl and</tspan><tspan x="-222" y="517.9">back to the left</tspan></text></svg><rect x="336" y="42" width="150" height="161.55" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="336" y="42" width="150" height="161.55" viewBox="-531 -70 618 665.6" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M-162 -268Q-259 -268 -330.5 -222.5Q-402 -177 -461 -100L-399 -57Q-341 -130 -288 -163Q-235 -196 -162 -196Q-106 -196 -81.5 -178.5Q-57 -161 -57 -127Q-57 -97 -79.5 -82.5Q-102 -68 -137 -68Q-164 -68 -185 -73.5Q-206 -79 -227 -90L-253 -23Q-199 0 -142 0Q-65 0 -24 -37Q17 -74 17 -135Q17 -193 -28 -230.5Q-73 -268 -162 -268Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M-232 -55 L-195 -42 L-142 -33 L-90 -42 L-45 -75 L-22 -130 L-36 -185 L-80 -222 L-162 -232 L-240 -218 L-240 -218" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M-240 -218 L-310 -184 L-365 -138 L-418 -88" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="-418" cy="-88" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="-222" y="457.5" text-anchor="middle" font-size="49.5" fill="#6b7280"><tspan x="-222" y="457.5">3. sweep up to the left</tspan><tspan x="-222" y="517.9">tip</tspan></text></svg><text x="16" y="216.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after Tejas Gajjar, KanoAI, Gujarati barakhadi centre-line stroke templates</text><text x="16" y="229.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">(interpolate-svg/svgs/barakhadi), commit 9d3e294, 1_k/4_ku.svg, group g1 (stroke g1s0):</text><text x="16" y="241.55" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">the u sign drawn after the consonant (GitHub, 2026)</text><text x="16" y="254.05" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source records where it varies.</text></svg>
