<svg xmlns="http://www.w3.org/2000/svg" width="982" height="504.04" viewBox="0 0 982 504.04" role="img" aria-label="How to write 坐: 7 strokes · 6 pen lifts · 7 movements"><title>Writing 坐</title><desc>7 frames; frame N shows movements 1 to N of 坐 (chinese), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansSC-Subset.ttf. Stroke order after Hanzi Writer Data 坐.json, ordered stroke paths and medians 1–7 (Hanzi Writer Data snapshot 68d10a4, updated from Make Me a Hanzi, 22 June 2019) &lt;https://raw.githubusercontent.com/chanind/hanzi-writer-data/68d10a4b21150cae5e1ebbd223eed289cf32d90c/data/%E5%9D%90.json&gt;. Source note on variation: The cited PRC-order dataset supplies seven ordered strokes for 坐, in two pieces. Medians 1–4 draw the two 人, the left one first, each a left-falling stroke and a dot. Medians 5–7 draw 土: a short horizontal, a vertical from the top down through it, then a long horizontal along the foot. Make Me a Hanzi documents that its stroke paths are ordered in proper stroke order, its medians use the same coordinate system for stroke-order animation, and the project follows People&apos;s Republic of China stroke order. This learner path adapts those seven ordered medians to the vendored Noto Sans SC outline while preserving their order, their directions and six intervening pen lifts; stroke widths and proportions differ between the Arphic-derived source graphics and Noto Sans SC.</desc><rect x="0" y="0" width="982" height="504.04" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 7 strokes · 6 pen lifts · 7 movements</text><rect x="16" y="42" width="150" height="199.27" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="199.27" viewBox="-33 -898 1053 1398.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M53