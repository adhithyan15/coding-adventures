<svg xmlns="http://www.w3.org/2000/svg" width="342" height="378.16" viewBox="0 0 342 378.16" role="img" aria-label="How to write а: one unbroken stroke · 2 movements"><title>Writing а</title><desc>2 frames; frame N shows movements 1 to N of а (cyrillic), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansCyrillic-Static.ttf. Stroke order after RussianIrina, ‘Learning Russian - Alphabet letters, handwriting’, lowercase а demonstration, 00:50–00:55, YouTube, 5 February 2013 &lt;https://www.youtube.com/watch?v=tqDLDfYoO2o&gt;. Source note on variation: The native-teacher video presents all 33 Russian letters first in print and then in the classic handwritten form taught at school. In the 00:50–00:55 lowercase а demonstration, the rounded body and right-hand finishing stem are written in one continuous pen-down run, for zero intervening lifts. The demonstrated handwritten а is a round single-storey form; the bundled Noto Sans Cyrillic glyph is a double-storey printed form with an extra upper shoulder. This learner path preserves the source&apos;s one-run body-to-stem motion while fitting that shoulder as the entry into the lower loop. Connected cursive may add entry and exit joins, and individual handwriting may round or slant the body differently.</desc><rect x="0" y="0" width="342" height="378.16" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — one unbroken stroke · 2 movements</text><rect x="16" y="42" width="150" height="247.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="247.16" viewBox="-25 -616 570 939.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M215 -10Q133 -10 89 30.5Q45 71 45 145Q45 313 298 322L389 325L389 356Q389 417 360.5 445Q332 473 270 473Q199 473 112 435L83 504Q179 546 271 546Q475 546 475 366L475 0L411 0L394 77L390 77Q354 31 312.5 10.5Q271 -10 215 -10ZM237 61Q301 61 344.5 98.5Q388 136 388 215L388 260L309 257Q219 253 177.5 227Q136 201 136 149Q136 61 237 61Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 455 L110 455" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M110 455 L155 495 L215 515 L285 515 L345 490 L395 445 L420 395 L420 345 L390 305 L325 300 L250 300 L175 300 L145 285 L95 245 L75 190 L85 125 L120 70 L175 35 L240 25 L305 45 L355 85 L395 140 L420 205 L420 265 L420 305" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="420" cy="305" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="260" y="195.7" text-anchor="middle" font-size="45.7" fill="#6b7280"><tspan x="260" y="195.7">1. sweep over the</tspan><tspan x="260" y="251.5">shoulder and around the</tspan><tspan x="260" y="307.2">round body</tspan></text></svg><rect x="176" y="42" width="150" height="247.16" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="176" y="42" width="150" height="247.16" viewBox="-25 -616 570 939.2" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M215 -10Q133 -10 89 30.5Q45 71 45 145Q45 313 298 322L389 325L389 356Q389 417 360.5 445Q332 473 270 473Q199 473 112 435L83 504Q179 546 271 546Q475 546 475 366L475 0L411 0L394 77L390 77Q354 31 312.5 10.5Q271 -10 215 -10ZM237 61Q301 61 344.5 98.5Q388 136 388 215L388 260L309 257Q219 253 177.5 227Q136 201 136 149Q136 61 237 61Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M110 455 L155 495 L215 515 L285 515 L345 490 L395 445 L420 395 L420 345 L390 305 L325 300 L250 300 L175 300 L145 285 L95 245 L75 190 L85 125 L120 70 L175 35 L240 25 L305 45 L355 85 L395 140 L420 205 L420 265 L420 305 L420 305" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M420 305 L430 250 L435 190 L435 125 L435 65 L440 20" fill="none" stroke="#3b5bdb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle class="ductus__tip" cx="440" cy="20" r="34" fill="#3b5bdb"/></g><text class="ductus__caption" x="260" y="195.7" text-anchor="middle" font-size="45.7" fill="#6b7280"><tspan x="260" y="195.7">2. continue down the</tspan><tspan x="260" y="251.5">right-hand finishing</tspan><tspan x="260" y="307.2">stem</tspan></text></svg><text x="16" y="302.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Stroke order after RussianIrina, ‘Learning Russian -</text><text x="16" y="314.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">Alphabet letters, handwriting’, lowercase а demonstration,</text><text x="16" y="327.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">00:50–00:55, YouTube, 5 February 2013</text><text x="16" y="339.66" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">This order is attested, not standardised; the source</text><text x="16" y="352.16" font-family="Latin Modern Sans, sans-serif" font-size="10" fill="#64748b">records where it varies.</text></svg>
