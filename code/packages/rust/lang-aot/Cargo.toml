[package]
name = "lang-aot"
version = "0.104.0"
edition = "2021"
description = "Multi-language AOT driver — compile Twig, Nib, Brainfuck, Dartmouth BASIC, Oct, and McCarthy Lisp to native executables through the shared IIR pipeline.  v0.93.0 (LANG-FULL B1-eof — Brainfuck cat runs cross-backend): `tests/lang_matrix.rs` adds the canonical cat `,[.,]` (input \"Hi\" ⇒ stdout \"Hi\") across all 7 backends; `brainfuck-iir-compiler` 0.4.0 normalises a negative `,`/getchar EOF result to 0 in the shared IIR (read at i64, clamp `<0` to 0, store u8), so cat halts at EOF everywhere — closing the EOF-convention divergence (0 vs -1) deferred from B1-stdin.  v0.92.0 (LANG-FULL O2 — Oct bitwise `~` + u8 wrap run cross-backend): `tests/lang_matrix.rs` gains two executed Oct programs (`out(1, ~0)` ⇒ `255`, `out(1, 200 + 100)` ⇒ `44` wrap) across all 7 backends; `oct-iir-compiler` 0.7.0 emits the `u8` type_hint on arithmetic/bitwise/`~` (Oct's only int type is u8, and the spec wraps mod-256), and `iir-to-jvm-class-file` 0.14.0 masks a narrow op on the LONG model (Oct printing programs keep the i64 model) with `i2l; land` instead of the int `iand`.  v0.91.0 (LANG-FULL N3 — Nib bitwise `~` runs cross-backend): `tests/lang_matrix.rs` gains two executed `~` programs (`~0u8` ⇒ `== 255`, `~15u4` ⇒ `== 0`) across all 7 backends; `nib-iir-compiler` 0.16.0 lowers unary `~` to the IIR `not` op (was silently dropped) with the narrow width, and `iir-to-cil-bytecode` 0.21.0 adds the unary `not` arm to its textual `.il` emitter (the last backend that couldn't assemble it on CoreCLR).  v0.90.0 (LANG-FULL B1-stdin — Brainfuck reads real input cross-backend): `tests/lang_matrix.rs` gains two executed stdin programs — `,+.` (read a byte, `+`, print: input \"A\" → \"B\") and `,.,.` (echo two bytes: \"Hi\" → \"Hi\") — across all 7 backends; the four subprocess columns (native/LLVM/JVM/CLR) get a stdin pipe via the new `output_with_stdin`, and WASM/VM/JIT `getchar` drains a per-program input buffer (`program_stdin`). Programs read exactly the supplied bytes (no EOF-gated loop), so they terminate identically despite the backends' divergent `getchar`-EOF convention (0 vs -1).  v0.86.0 (LANG-FULL E2/N6 — Nib u8 wrap runs cross-backend): `tests/lang_matrix.rs` gains two executed N6 programs (`200u8+100u8=44` wraps + magnitude regression guard) across native/LLVM/WASM/JVM/CLR/VM/JIT; `nib-type-checker` 0.3.0 adds bidirectional typing; `nib-iir-compiler` 0.14.0 emits narrow type_hints + unary `~` lowering; `aot-core` 0.2.2 adds u4 to CIR pipeline.  v0.85.0 (LANG-FULL TW2 — Twig top-level value define runs cross-backend): `tests/lang_matrix.rs` adds an executed top-level value-define program (`(define x 40) (define y 2) (+ x y)` ⇒ exit 42) across native/LLVM/WASM/JVM/CLR/VM/JIT; `twig-ir-compiler` 0.24.0 keeps a non-lambda-captured value define in a typed `main` register instead of the `call_builtin \"global_set\"`/`global_get` pair the backends reject.  v0.84.0 (LANG-FULL TW1 — Twig variadic arithmetic runs cross-backend): `tests/lang_matrix.rs` adds an executed n-ary Twig arithmetic program (`(+ 10 20 12)` ⇒ exit 42) across native/LLVM/WASM/JVM/CLR/VM/JIT; `twig-ir-compiler` 0.23.0 folds an all-i64 `(+ a b c …)` into a typed binary chain so variadic arithmetic clears the backend validators instead of the rejected `call_builtin \"any\"` path.  v0.83.0 (LANG-FULL AL5 — ALGOL switches run cross-backend): `tests/lang_matrix.rs` adds an executed ALGOL switch / computed-goto (`switch s := a1,a2,a3; … goto s[3]` ⇒ exit 49) across native/LLVM/WASM/JVM/CLR/VM/JIT. Its index comparison is the first ALGOL `cmp_*` on a code-gen backend and surfaced a latent width bug — `algol-iir-compiler` 0.3.0 now emits comparisons at the i64 operand width (the `bool` result width made LLVM compare at 1-bit i1 and emit invalid IR).  v0.82.0 (LANG-FULL AL3 — ALGOL procedures run cross-backend): `tests/lang_matrix.rs` adds an executed ALGOL typed procedure (`integer procedure sq(x); value x; integer x; sq := x*x; result := sq(7)` ⇒ exit 49) across native/LLVM/WASM/JVM/CLR/VM/JIT — the first multi-function ALGOL program in the matrix. Surfaced and fixed a real `jit-core` constant-propagation soundness bug (a reassigned result slot propagated its dead constant seed, so only the JIT returned 0).  v0.71.0 (LANG-MATRIX Phase I — JIT COLUMN COMPLETE → MATRIX COMPLETE): `tests/lang_matrix.rs` adds a `Backend::Jit` runner that runs the *shared* IIR through `jit_core::JITCore` + the language-agnostic `GenericCirJit` — all six languages verified by RUNNING in-process (Twig→42, Nib→42, Oct→0, ALGOL→2, BASIC→`42`, Brainfuck→`A`), with no per-language code.  Both execution columns (VM, JIT) are now complete, so every language runs on every backend except BEAM.  Also fixes the pre-existing `cil_emit.rs` test (the CLR simulator stack became `Vec<Option<Value>>` in W6b but the scalar test still expected `i32`).  v0.70.0 (LANG-MATRIX Phase V — VM COLUMN COMPLETE): Brainfuck now runs on the generic VM too (`vm-core` 0.4.0 grew the byte-tape ops over its flat memory), so all six languages run on the one register interpreter — `tests/lang_matrix.rs` tags Brainfuck with `Vm` (verified by RUNNING → `A`).  v0.69.0 (LANG-MATRIX Phase V — generic register VM): `tests/lang_matrix.rs` adds a `Backend::Vm` runner that interprets the *shared* IIR on `vm_core::VMCore` (the general register VM, no per-language code) — Twig/Nib/Oct/ALGOL/BASIC verified by RUNNING in-process (BASIC via a registered `print_i64` builtin closure). 5/6 of the VM column; Brainfuck-on-VM needs the byte-tape ops added to vm-core next.  v0.68.0 (LANG-MATRIX LM-C Brainfuck — CODE-GEN MATRIX COMPLETE): `tests/lang_matrix.rs` proves Brainfuck on real CoreCLR (`ilasm`+`dotnet`), the last code-gen cell — every language now runs on every code-gen backend (native/LLVM/WASM/JVM/CLR). Backed by `iir-to-cil-bytecode` 0.18.0's byte-tape `.il` ops.  v0.67.0 (LANG-MATRIX LM-J Brainfuck): `tests/lang_matrix.rs` proves Brainfuck on the JVM — `run_jvm` compiles the `env.BFRuntime` host class (static `byte[] __tape`, `putchar`/`getchar`) with `javac` and captures its `System.out.write` bytes (`.` of 65 → `A`), backed by `iir-to-jvm-class-file` 0.11.0's byte-tape ops.  v0.66.0 (LANG-MATRIX LM-W Brainfuck): `tests/lang_matrix.rs` proves Brainfuck on the WASM backend — `run_wasm`'s host now resolves `env.putchar`/`env.getchar` and captures stdout bytes (`.` of 65 → `A`), backed by `iir-to-wasm` 0.13.0's byte-tape ops.  v0.65.0 (LANG-MATRIX LM-L Brainfuck): `lower_brainfuck_for_aot` now widens the Brainfuck frontend's narrow cell/pointer hints (`u8`/`u32`) to `i64` (byte width survives only at the `load_byte`/`store_byte` tape boundary), so Brainfuck runs on the LLVM backend — verified by RUNNING on real `clang` in `tests/lang_matrix.rs`.  v0.13.0 (McCarthy Lisp L3a): adds the `Language::McCarthyLisp` frontend (mccarthy-lisp-iir-compiler) — McCarthy source now produces an IIRModule and scalar programs run on every AOT target (symbol/cons backend support is L3b).  v0.12.0 (Migration Phase 7, FINAL): routed `--emit=riscv32` through the Backend trait over CIR, closing the historical-arch migration."

[dependencies]
twig-aot              = { path = "../twig-aot" }
twig-ir-compiler      = { path = "../twig-ir-compiler" }
nib-iir-compiler      = { path = "../nib-iir-compiler" }
brainfuck-iir-compiler = { path = "../brainfuck-iir-compiler" }
dartmouth-basic-iir-compiler = { path = "../dartmouth-basic-iir-compiler" }
oct-iir-compiler     = { path = "../oct-iir-compiler" }
mccarthy-lisp-iir-compiler = { path = "../mccarthy-lisp-iir-compiler" }
algol-iir-compiler = { path = "../algol-iir-compiler" }
interpreter-ir        = { path = "../interpreter-ir" }
cli-builder           = { path = "../cli-builder" }
iir-to-llvm           = { path = "../iir-to-llvm" }
iir-to-wasm           = { path = "../iir-to-wasm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
iir-to-cil-bytecode   = { path = "../iir-to-cil-bytecode" }
iir-to-beam           = { path = "../iir-to-beam" }
iir-builtin-lowering  = { path = "../iir-builtin-lowering" }
riscv-backend         = { path = "../riscv-backend" }
riscv-encoder         = { path = "../riscv-encoder" }
intel8008-backend     = { path = "../intel8008-backend" }
intel8008-encoder     = { path = "../intel8008-encoder" }
armv7-backend         = { path = "../armv7-backend" }
armv7-encoder         = { path = "../armv7-encoder" }
intel4004-backend     = { path = "../intel4004-backend" }
intel4004-encoder     = { path = "../intel4004-encoder" }
ge225-backend         = { path = "../ge225-backend" }
ge225-encoder         = { path = "../ge225-encoder" }
ibm704-backend        = { path = "../ibm704-backend" }
ibm704-encoder        = { path = "../ibm704-encoder" }
aot-core              = { path = "../aot-core" }
jit-core              = { path = "../jit-core" }
# JIT McCarthy path (W15): the universal bytecode JIT (`jit-core`) executes
# McCarthy by dispatching its `lispy_*` builtins to the shared tagged-word value
# runtime (`lispy-runtime`), bridged through the VM's `Value`.
vm-core               = { path = "../vm-core" }
lispy-runtime         = { path = "../lispy-runtime" }

[[bin]]
name = "lang-aot"
path = "bin/lang_aot.rs"

[dev-dependencies]
tempfile = "3"
# In-repo wasm module runtime — used to RUN emitted wasm in tests and assert
# the computed result (LANG77 / McCarthy L3b-3a-2). Keeps wasm verification
# zero-external-dep.
wasm-runtime = { path = "../wasm-runtime" }
# The host-interface + value types the runtime resolves imports against. The
# LANG-MATRIX harness implements a tiny `HostInterface` to satisfy the generic
# `env.__print_i64` stdout import an I/O language (Dartmouth BASIC) emits, so
# its `PRINT` output can be captured and asserted (LM-W BASIC).
wasm-execution = { path = "../wasm-execution" }
wasm-types = { path = "../wasm-types" }
# In-repo JVM class-file parser + bytecode simulator — used to RUN the emitted
# JVM class in tests and assert the computed result (LANG77 / McCarthy W3a),
# mirroring how wasm-runtime verifies the wasm path. Keeps JVM verification
# zero-external-dep (no `java` needed for the scalar path).
jvm-class-file = { path = "../jvm-class-file" }
jvm-simulator = { path = "../jvm-simulator" }
# In-repo CLR (CIL) bytecode simulator — used to RUN the emitted CIL in tests and
# assert the computed result (LANG77 / McCarthy W6a), mirroring jvm-simulator.
clr-simulator = { path = "../clr-simulator" }
mccarthy-lisp-vm = { path = "../mccarthy-lisp-vm" }
iir-to-jvm-class-file = { path = "../iir-to-jvm-class-file" }
