<svg xmlns="http://www.w3.org/2000/svg" width="822" height="254.85" viewBox="0 0 822 254.85" role="img" aria-label="How to write ಞ: 2 strokes · 1 pen lift · 5 movements"><title>Writing ಞ</title><desc>5 frames; frame N shows movements 1 to N of ಞ (kannada), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansKannada-Static.ttf. Stroke order after Chimple (Sutara Learning Foundation, Bangalore), LIDO tracing lesson LIDO_kn2_0304, chimple/chimple-zips at commit 5b137ab1 (October 2026): the hidden, ordered tracing paths for ಞ, trace image file-p3fr4091.svg &lt;https://github.com/chimple/chimple-zips/blob/5b137ab1bbd8516f9b4813f23c0e8e9c99f26156/LIDO_kn2_0304.zip&gt;. Source note on variation: Chimple draws ಞ as two paths. The first starts at the lower tip of the left hump, arches over it into the notch, arches over the middle hump and down the right side, sweeps clockwise round the bottom loop and comes over its top, through the crossing and down the tail (start lower left, end at the foot of the tail). The second starts where the right hook leaves the middle hump and arches over it to its tip (start upper middle, end lower right of the hook). The lesson bundle LIDO_kn2_0304.zip has sha256 5152886c21070d1d...; its data.json pairs this trace image with the question ಞ. Chimple&apos;s chimple-zips repository has no licence, so only facts are cited (stroke count, order, start, direction and end); no path or artwork is copied. The lesson player (chimple/lido-player, MIT) walks a trace image&apos;s paths in document order, and other Chimple trace images keep one path per pen-down run, so two paths here mean two strokes and one lift. Chimple&apos;s recorded ಞ trace (chimple/bahama at commit 62608a6, assets/courses/kn/kn/res/paths, MPL-2.0) agrees: two strokes, the body first with its loop drawn clockwise, then the hook from left to right. The two repositories come from one organisation, so they are one source, not two. This is designer-authored and recorded teaching material, not a native-writer statistic, so confidence is medium. The path is fitted to the bundled Noto Sans Kannada outline rather than to Chimple&apos;s drawing; the turn at the notch retraces a short stretch of ink.</desc><rect x="0" y="0" width="822" height="254.85" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 2 strokes · 1 pen lift · 5 movements</text><rect x="16" y="42" width="150" height="148.85" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="148.85" viewBox="-44 -633 1053 1044.9" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M321 -12Q255 -12 212.5 7.5Q170 27 149.5 61.5Q129 96 129 140Q129 205 177.5 243.5Q226 282 315 282Q373 282 420 265.5Q467 249 505.5 218.5Q544 188 574 145Q605 104 624 57.5Q643 11 653 -39L570 -55Q556 20 523.5 80Q491 140 439.5 174.5Q388 209 315 209Q264 209 237 191Q210 173 210 141Q210 105 237.5 84Q265 63 326 63Q400 63 450.5 84Q501 105 532.5 141.5Q564 178 578 225Q592 272 592 324Q592 408 562 446Q532 484 480 484Q436 484 408 452.5Q380 421 373 368L294 368Q287 425 257.5 454.5Q228 484 186 484Q146 484 127 464.5Q108 445 108 413Q108 394 113.5 374.5Q119 355 125 343L49 319Q40 338 33 362.5Q26 387 26 419Q26 463 47 495.5Q68 528 103 545.5Q138 563 180 563Q220 563 250 551.5Q280 540 304 514Q328 488 349 446L318 441Q340 492 368 518Q396 544 427 553.5Q458 563 488 563Q541 563 582 536.5Q623 510 645 456Q647 452 650.5 447.5Q654 443 655 438Q664 413 669 383.5Q674 354 674 324Q674 286 665 243.5Q656 201 635.5 160Q615 119 580 84L559 69Q518 35 459.5 11.5Q401 -12 321 -12ZM786 563Q829 563 863.5 545.5Q898 528 918.5 495.5Q939 463 939 419Q939 387 932 362.5Q925 338 916 319L840 343Q846 355 851.5 374.5Q857 394 857 413Q857 445 838.5 464.5Q820 484 780 484Q752 484 727.5 469.5Q703 455 688 426.5Q673 398 672 356L632 472Q652 505 674 525Q696 545 723.5 55