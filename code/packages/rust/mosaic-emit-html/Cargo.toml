[package]
name = "mosaic-emit-html"
version = "0.3.0"
edition = "2021"
description = "Pure HTML backend: emits a static standalone HTML file from MosaicIR"

[dependencies]
mosaic-vm = { path = "../mosaic-vm" }
mosaic-analyzer = { path = "../mosaic-analyzer" }
mosmodel-compiler = { path = "../mosmodel-compiler" }
moslayout-compiler = { path = "../moslayout-compiler" }
mosstyle-compiler = { path = "../mosstyle-compiler" }
serde_json = "1"

[dev-dependencies]
# The TaskApp static-snapshot acceptance gate resolves package-qualified
# components exactly as mosaic-compile does before invoking this emitter.
mosaic-package-resolver = { path = "../mosaic-package-resolver" }
