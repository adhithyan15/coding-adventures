<svg xmlns="http://www.w3.org/2000/svg" width="822" height="288.07" viewBox="0 0 822 288.07" role="img" aria-label="How to write झ: 3 strokes · 2 pen lifts · 5 movements"><title>Writing झ</title><desc>5 frames; frame N shows movements 1 to N of झ (devanagari), the movement being added drawn in ink over the finished letter, whose outline is read from _fonts/NotoSansDevanagari-Static.ttf. Stroke order after Opiaterein, ‘Deva-झ-order.gif’, strokes 1–4, Wikimedia Commons, 10 May 2009 &lt;https://commons.wikimedia.org/wiki/File:Deva-%E0%A4%9D-order.gif&gt;. Source note on variation: The 32-frame animation shows four ordered pen-down runs over its gray guide: frames 2–18 descend the short upper stem, turn left and curve clockwise around the upper bowl, continue through the waist and clockwise around the lower loop, then finish down-right through the diagonal tail without lifting; frames 19–21 restart at the central junction and draw the middle crossbar left-to-right; frames 22–26 restart at the right stem&apos;s headline junction and descend top-to-bottom; frames 27–31 restart at the headline&apos;s left edge and draw the shirorekhā left-to-right, for three intervening lifts. The 250 ms holds at frames 18, 21, and 26 mark the first three run endings before the one-second completed frame 31; shorter 120–130 ms pauses within the joined body do not add lifts. These runs stage the letter one part at a time; they are not a count of native pen lifts. The lift count follows HP Labs India&apos;s isolated handwritten Devanagari character data (hpl-dvng-iso-char, https://lipitk.sourceforge.net/datasets/dvngchardata.htm), counted from the native-writer prototypes in the MIT-licensed LipiTk 4.0 Devanagari recognizer. Those counts say how many strokes writers use, not where they break, so this learner path keeps every run&apos;s order, start and direction as a segment and joins the crossbar and the right stem in one run, since the crossbar ends on the stem, climbing the stem before descending it, so the pen lifts only before the crossbar and the headline. Its curves are fitted to Noto Sans Devanagari.</desc><rect x="0" y="0" width="822" height="288.07" fill="#ffffff"/><text x="16" y="31" font-family="Latin Modern Sans, sans-serif" font-size="15" fill="#172033">How it is written — 3 strokes · 2 pen lifts · 5 movements</text><rect x="16" y="42" width="150" height="194.57" rx="6" fill="#fdfdfc" stroke="#dbe1ea" stroke-width="1"/><svg x="16" y="42" width="150" height="194.57" viewBox="-70 -692 910 1180.4" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g transform="scale(1,-1)"><path class="ductus__glyph" d="M667 551L667 0L586 0L586 551L489 551L489 622L770 622L770 551L667 551ZM480 271Q527 271 562 278.5Q597 286 637 303L637 228Q612 215 580.5 207.5Q549 200 514 200Q483 200 453 204Q423 208 387 219L339 271L345 286Q380 279 411.5 275Q443 271 480 271ZM271 222Q242 222 212.5 215.5Q183 209 158 199Q130 217 105 240Q80 263 65 291.5Q50 320 50 352Q50 408 86.5 436.5Q123 465 199 465L323 465L323 551L0 551L0 622L505 622L505 551L404 551L404 394L206 394Q166 394 148 381Q130 368 130 344Q130 324 142.5 307Q155 290 173 276Q198 285 225 289.5Q252 294 283 294Q337 294 373.5 276.5Q410 259 428.5 227.5Q447 196 447 154Q447 75 387 37.5Q327 0 226 0Q218 0 210.5 0Q203 0 195.5 0.5Q188 1 181 1Q119 4 80.5 24Q42 44 42 82Q42 105 56.5 118.5Q71 132 96 132Q125 132 148 111Q171 90 199 41Q233 3 271.5 -34.5Q310 -72 352 -109L282 -161Q239 -114 201 -66Q163 -18 131 31L105 74Q130 71 163 69.5Q196 68 215 68Q258 68 292 75.5Q326 83 346 101.5Q366 120 366 154Q366 186 344 204Q322 222 271 222Z" fill="#e0ddd6" fill-rule="nonzero"/><path class="ductus__done" d="M362 551 L362 551" fill="none" stroke="#9aa1ad" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="ductus__pen" d="M362 551 L362 510 L362 470 L340 445 L300 428 L245 420 L185 420 L130 415 L95 395 L88 365 L92 335 L110 305 L145 282 L195 270 L250 262 L315 250 L365 225 L395 195 L408 160 L405 125 L390 95 L360 72 L315 58 L265 52 L